<html lang="ar" dir="rtl">
<head><meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>تطبيقات الموجات الكهرومغناطيسية</title>
<style>
/* Layout: one full-screen navy lab bench; every control is a physical part of the apparatus */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --pos:#ff6b6b; --neg:#5eaaff; --field:#62d98a; --force:#ffab5c; --accent:#7fd3ff;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --L:max(10px,env(safe-area-inset-left,0px)); --T:max(10px,env(safe-area-inset-top,0px));
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body)}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#ink{pointer-events:none}
#ink.on{pointer-events:auto;cursor:crosshair}
.btn{position:absolute;top:var(--T);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;z-index:3}
.btn[hidden]{display:none}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:20px;height:20px}
.fs{left:var(--L)}
.tipbtn{left:calc(var(--L) + 50px);color:#ffd27a}
.tipbtn svg{width:22px;height:22px}
.tipbtn:hover,.tipbtn.on{border-color:#ffd27a;background:rgba(255,210,122,.14)}
.penbtn{left:calc(var(--L) + 100px)}
.penbtn.on{border-color:var(--accent);background:rgba(127,211,255,.18);color:var(--accent)}
.clrbtn{left:calc(var(--L) + 150px);color:#ff9d9d}
.pal{position:absolute;top:calc(var(--T) + 50px);left:calc(var(--L) + 100px);width:42px;display:grid;gap:8px;justify-items:center;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.8);z-index:3}
.pal[hidden]{display:none}
.pal button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.pal button.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(8,20,41,.9) inset}
.toast{position:absolute;top:calc(var(--T) + 52px);left:var(--L);max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink);z-index:5}
.tip{position:absolute;top:calc(var(--T) + 50px);left:var(--L);width:min(350px,calc(100% - 20px));max-height:calc(100% - 80px);overflow:auto;background:rgba(8,20,41,.94);border:1px solid rgba(255,210,122,.35);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.75;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:4}
.tip h2{margin:0 0 8px;font-family:var(--f-display);font-size:16px;font-weight:600;color:#ffd27a;padding-left:28px;text-wrap:balance}
.tip p{margin:0 0 8px}
.tip .m,.tip b.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.tip p.m{text-align:center;color:var(--accent);font-weight:600}
.tip .note{color:var(--muted);font-size:12.5px}
.tip .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;direction:ltr;justify-content:flex-end}
.tip .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.tip .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.tip .x:hover{color:var(--ink)}
/* no text selection, callout or tap highlight while handling the simulation */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
.stage{touch-action:none}
.tip{touch-action:pan-y}
.rail{position:absolute;left:var(--L);top:calc(var(--T) + 52px);display:flex;flex-direction:column;gap:6px;z-index:3}
.rail button{width:66px;height:56px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;align-content:center;gap:2px;padding:0;cursor:pointer;font-family:var(--f-body)}
.rail button b{font:700 18px var(--f-mono);line-height:1}
.rail button span{font-size:11px;color:var(--muted);line-height:1.2}
.rail button:hover{border-color:var(--accent)}
.rail button.on{background:var(--accent);border-color:var(--accent);color:var(--deep)}
.rail button.on span{color:var(--deep);font-weight:600}
.rail .frz{height:48px;margin-top:6px}
.rail .frz svg{width:16px;height:16px}
.rail .frz.on{background:rgba(255,210,122,.18);border-color:#ffd27a;color:#ffd27a}
.rail .frz.on span{color:#ffd27a}
.rail button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail.narrow{flex-direction:row;right:10px}
.rail.narrow button{flex:1;width:auto;height:50px;min-width:0}
.rail.narrow .frz{margin-top:0;flex:0 0 48px}
.rail.narrow .frz span{display:none}
.topw{position:absolute;top:var(--T);right:24px;width:min(640px,calc(100% - 260px));display:flex;flex-direction:column;gap:8px;z-index:2}
.topw.narrow{left:var(--L);right:10px;width:auto}
.plaque{display:flex;gap:10px;align-items:flex-start;background:rgba(8,20,41,.78);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.65;color:var(--ink);pointer-events:none}
.topw.narrow .plaque{font-size:13px;padding:7px 10px}
.plaque .no{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--deep);font:700 14px var(--f-mono)}
.plaque em{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
.chips[hidden]{display:none}
.chip{border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
.chips .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.2);margin:0 4px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--deep);font-weight:600}
.sl{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0;background:rgba(8,20,41,.6);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.sl[hidden]{display:none}
.sl span{white-space:nowrap}
.sl output{font:600 12.5px var(--f-mono);color:#7ef0a4;direction:ltr;min-width:84px;white-space:nowrap;text-align:left}
.sl input{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.2);touch-action:none;margin:8px 0}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:2px solid var(--deep);cursor:pointer}
.sl input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--deep);cursor:pointer}
.pal{z-index:5}
</style>
</head>
<body style="margin:0">

<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="محاكاة الرادار والتحسس النائي"></canvas>
  <canvas id="ink" aria-hidden="true"></canvas>
  <nav class="rail" id="rail" aria-label="التطبيقات">
    <button data-p="1"><b>◎</b><span>الرادار</span></button>
    <button data-p="2"><b>🛰</b><span>تحسس نائي</span></button>
    <button class="frz" id="frz" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>تجميد</span></button>
  </nav>
  <div class="topw" id="topw">
    <div class="plaque" id="plaque"></div>
    <div class="bar">
      <div class="chips" id="chips"></div>
      <label class="sl" id="aL"><span id="aT"></span><input type="range" id="aR"><output id="aO"></output></label>
      <label class="sl" id="bL"><span id="bT"></span><input type="range" id="bR"><output id="bO"></output></label>
      <label class="sl" id="cL"><span id="cT"></span><input type="range" id="cR"><output id="cO"></output></label>
    </div>
  </div>
  <button class="btn fs" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="btn tipbtn" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
  <button class="btn penbtn" id="penBtn" aria-label="وضع القلم" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L16.5 4a2.1 2.1 0 0 1 3 3L8 18.5 4 20z"/><path d="M14.5 6l3 3"/></svg></button>
  <button class="btn clrbtn" id="clrBtn" aria-label="حذف الكتابة" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
  <div class="pal" id="pal" hidden>
    <button data-c="#ffd27a" style="background:#ffd27a" class="sel" aria-label="أصفر"></button>
    <button data-c="#ff6b6b" style="background:#ff6b6b" aria-label="أحمر"></button>
    <button data-c="#ffffff" style="background:#ffffff" aria-label="أبيض"></button>
  </div>
  <div class="tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
</div>

<script>
(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d'),plq=document.getElementById('plaque'),rail=document.getElementById('rail'),topw=document.getElementById('topw'),chips=document.getElementById('chips');
const $=id=>document.getElementById(id);
const SL=['a','b','c'].map(k=>({L:$(k+'L'),T:$(k+'T'),R:$(k+'R'),O:$(k+'O')}));
const frz=$('frz');
/* 10-4 applications.
   Radar: a narrow rotating beam sends short pulses; an echo returns after Δt = 2R/c, so R = cΔt/2, and the beam direction gives the bearing.
   The signal processor (moving-target filter) keeps echoes of small moving targets and blocks those of large fixed ones.
   Remote sensing: a satellite records radiation from the ground: reflected sunlight, emitted heat, or its own beam (active),
   in visible, infrared or microwave bands; clouds block visible/infrared but not microwaves.                                  */
const TAU=Math.PI*2,KM=60;
const S={scene:1,frozen:false,t:0,mti:true,rot:10,
  act:false,bandI:0,day:true};
let W=0,H=0,DPR=1,narrow=false,G={},col={},time=0;
const cam={z:1,x:0,y:0};
function readColors(){const cs=getComputedStyle(document.documentElement);
  ['deep','navy','glow','ink','muted','pos','neg','field','force','accent'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ---------- controls ---------- */
const BANDS=['مرئية','تحت الحمراء','مايكروية'];
function chip(i,n,on){return`<button class="chip${on?' on':''}" data-i="${i}" aria-pressed="${on}">${n}</button>`;}
function syncUI(){
  [...rail.querySelectorAll('[data-p]')].forEach(b=>{const on=+b.dataset.p===S.scene;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  chips.hidden=false;
  if(S.scene===1){chips.innerHTML=chip('mti','معالج الإشارة',S.mti);const s=SL[0];s.L.hidden=false;s.T.textContent='دوران الهوائي';s.R.min=4;s.R.max=20;s.R.step=1;s.R.value=S.rot;s.O.textContent=S.rot+' rpm';}
  else{chips.innerHTML=chip('a','نشطة',S.act)+chip('p','غير نشطة',!S.act)+'<span class="sep"></span>'+BANDS.map((n,i)=>chip('b'+i,n,S.bandI===i)).join('')+'<span class="sep"></span>'+chip('d','نهار',S.day)+chip('n','ليل',!S.day);SL[0].L.hidden=true;}
  SL[1].L.hidden=true;SL[2].L.hidden=true;
  frz.classList.toggle('on',S.frozen);frz.setAttribute('aria-pressed',S.frozen);frz.querySelector('span').textContent=S.frozen?'تشغيل':'تجميد';}
function changed(){syncUI();layout();}
rail.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){S.scene=+b.dataset.p;cam.z=1;cam.x=0;cam.y=0;changed();}});
chips.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=b.dataset.i;
  if(i==='mti')S.mti=!S.mti;else if(i==='a')S.act=true;else if(i==='p')S.act=false;else if(i==='d')S.day=true;else if(i==='n')S.day=false;else S.bandI=+i.slice(1);
  if(S.scene===2)RS.reset=true;syncUI();});
SL[0].R.addEventListener('input',()=>{S.rot=+SL[0].R.value;syncUI();});
frz.addEventListener('click',()=>{S.frozen=!S.frozen;syncUI();});

/* ---------- geometry ---------- */
function layout(){
  const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;
  W=nw;H=nh;narrow=W<760||W<H*0.95;
  DPR=window.devicePixelRatio||1;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  rail.classList.toggle('narrow',narrow);topw.classList.toggle('narrow',narrow);plq.style.display='none';
  const sr=cv.getBoundingClientRect();
  if(narrow)topw.style.top=(rail.getBoundingClientRect().bottom-sr.top+8)+'px';else topw.style.top='';
  const tb=topw.getBoundingClientRect().bottom-sr.top,rb=rail.getBoundingClientRect();
  G.A=narrow?{x0:10,x1:W-10,y0:tb+10,y1:H-12}:{x0:rb.right-sr.left+18,x1:W-24,y0:tb+12,y1:H-20};
  RS.reset=true;
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,o={}){ctx.font=o.font||'600 13px system-ui, Tahoma, sans-serif';ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
const MONO='ui-monospace, Menlo, Consolas, monospace',SANS='system-ui, Tahoma, sans-serif';
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function drawBg(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(W*0.55,H*0.42,0,W*0.55,H*0.42,Math.max(W,H)*0.75);
  g.addColorStop(0,col.glow);g.addColorStop(0.55,col.navy);g.addColorStop(1,col.deep);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*cam.x,DPR*cam.y);
}
function panel(x,y,w,h){rr(x,y,w,h,14);ctx.fillStyle='rgba(8,20,41,.72)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();}

/* =================================================================================
   RADAR
   ================================================================================= */
const RD={pulses:[],echoes:[],blips:[],last:null,lastTx:0,lastRx:-9,lastBlock:-9,
  planes:[{x:-40,y:-22,vx:2.2,vy:0.6},{x:30,y:38,vx:-1.6,vy:-1.4},{x:10,y:-50,vx:0.4,vy:2.0}],
  fixed:[]};
// a mountain range and a city: large fixed echoes
for(let i=0;i<9;i++){const a=2.35+i*0.06,r=30+((i*7)%5)*1.6;RD.fixed.push({x:r*Math.cos(a),y:-r*Math.sin(a),big:1});}
for(let i=0;i<6;i++)RD.fixed.push({x:24+(i%3)*2.6,y:16+Math.floor(i/3)*2.6,big:1});
const VP=1/0.55;          // pulse speed on screen: full range in 0.55 s
const beamW=3.2*Math.PI/180;
function radarStep(dt){const th=beamAng(),R=RD;
  R.planes.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(Math.hypot(p.x,p.y)>KM*0.98){const a=Math.random()*TAU;p.x=KM*0.9*Math.cos(a);p.y=KM*0.9*Math.sin(a);const b=a+Math.PI+(Math.random()-0.5)*0.8,v=1.5+Math.random()*1.2;p.vx=v*Math.cos(b);p.vy=v*Math.sin(b);}});
  if(S.t-R.lastTx>0.045){R.pulses.push({t0:S.t,th,hit:new Set()});R.lastTx=S.t;}
  R.pulses=R.pulses.filter(p=>(S.t-p.t0)*VP<1.05);
  const tg=[...R.planes.map((p,i)=>({x:p.x,y:p.y,mov:true,id:'p'+i})),...R.fixed.map((f,i)=>({x:f.x,y:f.y,mov:false,id:'f'+i}))];
  R.pulses.forEach(p=>{const r=(S.t-p.t0)*VP*KM;tg.forEach(t=>{if(p.hit.has(t.id))return;const rho=Math.hypot(t.x,t.y);if(r<rho)return;
    const ph=Math.atan2(t.y,t.x);let d=((ph-p.th)%TAU+TAU*1.5)%TAU-Math.PI;if(Math.abs(d)>beamW)return;p.hit.add(t.id);R.echoes.push({t1:p.t0+rho/(VP*KM),rho,ph,mov:t.mov});});});
  R.echoes=R.echoes.filter(e=>{const back=(S.t-e.t1)*VP*KM;if(back<e.rho)return true;
    if(e.mov||!S.mti){R.blips.push({ph:e.ph,rho:e.rho,t:S.t,mov:e.mov});}else R.lastBlock=S.t;R.lastRx=S.t;if(e.mov)R.last={rho:e.rho,t:S.t};return false;});
  R.blips=R.blips.filter(b=>S.t-b.t<60/S.rot*1.2);}
const beamAng=()=>((S.t*S.rot/60*TAU)%TAU);
function plane(x,y,a,s){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(s,s);ctx.fillStyle='#e9eef8';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-8,-2);ctx.lineTo(-10,0);ctx.lineTo(-8,2);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(-3,-9);ctx.lineTo(-5,-9);ctx.lineTo(-2,0);ctx.lineTo(-5,9);ctx.lineTo(-3,9);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-10,-4);ctx.lineTo(-11,-4);ctx.lineTo(-10,0);ctx.lineTo(-11,4);ctx.lineTo(-10,4);ctx.closePath();ctx.fill();ctx.restore();}
function radarMap(m){const c={x:m.x+m.w/2,y:m.y+m.h/2},Rm=Math.min(m.w,m.h)/2-10,k=Rm/KM,P=(x,y)=>({x:c.x+x*k,y:c.y-y*k});
  panel(m.x,m.y,m.w,m.h);
  ctx.save();rr(m.x,m.y,m.w,m.h,14);ctx.clip();
  // terrain
  const tg=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,Rm*1.4);tg.addColorStop(0,'#1f3b2a');tg.addColorStop(1,'#132a22');ctx.fillStyle=tg;ctx.fillRect(m.x,m.y,m.w,m.h);
  ctx.fillStyle='#1c4a73';ctx.beginPath();ctx.ellipse(P(42,-36).x,P(42,-36).y,Rm*0.5,Rm*0.32,0.4,0,TAU);ctx.fill();

  txt(['صورة بالأشعة المرئية','صورة بالأشعة تحت الحمراء','صورة بالأشعة المايكروية'][band]+(S.act?' · نشطة':' · غير نشطة'),x1-8,iy+14,{font:'700 12px '+SANS,color:'#fff',align:'right'});}

/* ---------- loop / input ---------- */
let lastT=0;
function draw(dt){drawBg();if(S.scene===1)radar(dt);else sensing(dt);}
const ptrs=new Map();let pinch=null,lastTap=0,drag=null;
function scr(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const s=scr(e);ptrs.set(e.pointerId,s);
  if(ptrs.size===2){drag=null;const[a,b]=[...ptrs.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},z0:cam.z,x0:cam.x,y0:cam.y};return;}
  if(ptrs.size>2)return;const now=performance.now();if(now-lastTap<320){cam.z=1;cam.x=0;cam.y=0;}lastTap=now;drag={s0:s,x0:cam.x,y0:cam.y};cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{const s=scr(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,s);
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const z=clamp(pinch.z0*d/pinch.d0,0.6,4),wx=(pinch.m0.x-pinch.x0)/pinch.z0,wy=(pinch.m0.y-pinch.y0)/pinch.z0;cam.z=z;cam.x=mid.x-wx*z;cam.y=mid.y-wy*z;return;}
  if(drag){cam.x=drag.x0+s.x-drag.s0.x;cam.y=drag.y0+s.y-drag.s0.y;}});
function pointerEnd(e){ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;return;}drag=null;cv.style.cursor='grab';}
cv.addEventListener('pointerup',pointerEnd);cv.addEventListener('pointercancel',pointerEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();const s=scr(e),f=Math.exp(-e.deltaY*0.0015),z=clamp(cam.z*f,0.6,4),wx=(s.x-cam.x)/cam.z,wy=(s.y-cam.y)/cam.z;
  cam.z=z;cam.x=s.x-wx*z;cam.y=s.y-wy*z;},{passive:false});
window.__explain=function(){if(S.scene===1)return{t:'الرادار',b:'<p>يرسل الهوائي نبضات راديوية في حزمة ضيقة دوّارة، فتنعكس عن الهدف وتعود. زمن الذهاب والإياب يحدد المدى، واتجاه الحزمة لحظة الإرسال يحدد موقع الهدف.</p><p class="m">R = c·Δt / 2</p><p>معالج الإشارة يُظهر الأهداف الصغيرة المتحركة ويحجب انعكاسات الجبال والأبنية الثابتة.</p>'};
  return{t:'التحسس النائي',b:'<p><b>نشطة:</b> القمر يضيء الهدف بمصدر طاقة مثبت عليه ويستقبل الأشعة المنعكسة، فيعمل ليلاً أيضاً. <b>غير نشطة:</b> يستقبل ما ينعكس من أشعة الشمس أو ما ينبعث من الهدف نفسه.</p><p><b>المرئية</b> تحتاج ضوءاً وتحجبها الغيوم، <b>تحت الحمراء</b> تُظهر حرارة الأجسام، <b>المايكروية</b> تنفذ من الغيوم.</p>'};};
let last=performance.now();
function frame(now){const dt=Math.max(0.001,Math.min(0.05,(now-last)/1000));last=now;time+=dt;if(!W)layout();
  if(W){const d=S.frozen?0:dt;S.t+=d;draw(d);}requestAnimationFrame(frame);}
readColors();changed();
new ResizeObserver(()=>layout()).observe(cv);
requestAnimationFrame(frame);
})();

/* ---------- fullscreen ---------- */
(function(){const b=document.getElementById('fsBtn'),ico=document.getElementById('fsIco'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const t=document.createElement('div');t.className='toast';t.hidden=true;t.textContent='ملء الشاشة غير متاح هنا. افتح الملف أو الرابط بالمتصفح';document.querySelector('.stage').appendChild(t);
  let tm=0;const toast=()=>{t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>t.hidden=true,3200);};
  const sync=()=>{ico.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');b.setAttribute('aria-label',isFs()?'الخروج من ملء الشاشة':'ملء الشاشة');};
  b.addEventListener('click',()=>{
    if(isFs()){try{exit.call(document);}catch(e){}return;}
    if(!req||document.fullscreenEnabled===false){toast();return;}
    try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(toast);setTimeout(()=>{if(!isFs())toast();},700);}catch(e){toast();}});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);})();

/* ---------- lamp hint panel ---------- */
(function(){const b=document.getElementById('tipBtn'),p=document.getElementById('tipPanel'),t=document.getElementById('tipTitle'),body=document.getElementById('tipBody');
  let iv=0,last='';
  const fill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===last)return;last=h;t.textContent=r.t;body.innerHTML=r.b;};
  const open=v=>{p.hidden=!v;b.setAttribute('aria-expanded',v);b.classList.toggle('on',v);clearInterval(iv);if(v){last='';fill();iv=setInterval(fill,400);}};
  b.addEventListener('click',()=>open(p.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>open(false));})();

/* ---------- pen mode: write over the simulation, clear the writing ---------- */
(function(){const ink=document.getElementById('ink'),ix=ink.getContext('2d'),pb=document.getElementById('penBtn'),cb=document.getElementById('clrBtn'),pal=document.getElementById('pal');
  let on=false,strokes=[],cur=null,color='#ffd27a',dpr=1;
  function seg(s,from){const p=s.p,i0=Math.max(0,from-1);ix.setTransform(dpr,0,0,dpr,0,0);ix.lineCap='round';ix.lineJoin='round';ix.strokeStyle=s.c;ix.lineWidth=3.2;
    ix.beginPath();ix.moveTo(p[i0].x,p[i0].y);if(p.length===1)ix.lineTo(p[0].x+0.1,p[0].y);for(let i=i0+1;i<p.length;i++)ix.lineTo(p[i].x,p[i].y);ix.stroke();}
  function redraw(){ix.setTransform(1,0,0,1,0,0);ix.clearRect(0,0,ink.width,ink.height);strokes.forEach(s=>seg(s,0));}
  function size(){const w=ink.clientWidth,h=ink.clientHeight;if(!w||!h)return;dpr=window.devicePixelRatio||1;ink.width=Math.round(w*dpr);ink.height=Math.round(h*dpr);redraw();}
  function sync(){ink.classList.toggle('on',on);pb.classList.toggle('on',on);pb.setAttribute('aria-pressed',on);pal.hidden=!on;cb.hidden=!(on||strokes.length);}
  const pos=e=>{const r=ink.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  pb.addEventListener('click',()=>{on=!on;sync();});
  cb.addEventListener('click',()=>{strokes=[];cur=null;redraw();sync();});
  pal.addEventListener('click',e=>{const c=e.target.dataset&&e.target.dataset.c;if(!c)return;color=c;[...pal.children].forEach(x=>x.classList.toggle('sel',x===e.target));});
  ink.addEventListener('pointerdown',e=>{if(!on)return;e.preventDefault();ink.setPointerCapture(e.pointerId);cur={c:color,p:[pos(e)],id:e.pointerId};strokes.push(cur);seg(cur,0);});
  ink.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==cur.id)return;const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e],n=cur.p.length;(ev.length?ev:[e]).forEach(x=>cur.p.push(pos(x)));seg(cur,n);});
  const end=e=>{if(cur&&e.pointerId===cur.id)cur=null;};
  ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);
  new ResizeObserver(size).observe(ink);size();sync();})();

/* ---------- block text selection and the copy/paste callout on touch devices ---------- */
(function(){const stop=e=>e.preventDefault();
  ['selectstart','contextmenu','dragstart'].forEach(ev=>document.addEventListener(ev,stop));
  document.querySelectorAll('canvas').forEach(c=>c.addEventListener('touchstart',stop,{passive:false}));
  document.addEventListener('selectionchange',()=>{const s=window.getSelection&&window.getSelection();if(s&&s.rangeCount&&!s.isCollapsed)s.removeAllRanges();});})();
