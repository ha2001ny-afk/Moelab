<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>المتسعة ذات الصفائح الدوارة — نموذج ثلاثي الأبعاد</title>
<style>
:root{color-scheme:dark;background:#081429;color:#eaf0fa;font-family:system-ui,Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
.stage{position:relative;width:100%;height:100%;background:#081429}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.tools{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px}
button{width:42px;height:42px;padding:0;display:grid;place-items:center;border:1px solid #eaf0fa24;border-radius:12px;background:#081429d9;color:#eaf0fa;cursor:pointer}
button:hover{border-color:#7fd3ff;color:#7fd3ff}
button[aria-pressed="true"]{border-color:#7fd3ff88;color:#7fd3ff;background:#10264ad9}
button:focus-visible{outline:2px solid #7fd3ff;outline-offset:3px}
svg{width:20px;height:20px}
.toast{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(92vw,520px);padding:10px 16px;border:1px solid #39516d;border-radius:12px;background:#10264af0;font-size:13px;line-height:1.6;text-align:center;box-sizing:border-box;transition:opacity .4s}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="stage">
  <canvas id="scene" aria-label="نموذج ثلاثي الأبعاد لمتسعة متغيرة ذات صفائح دوارة مع جهاز قياس السعة ومجسات قابلة للتحريك"></canvas>
  <div class="tools">
    <button id="labels" aria-pressed="true" aria-label="إظهار أسماء الأجزاء" title="أسماء الأجزاء">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>
    </button>
    <button id="spin" aria-pressed="false" aria-label="دوران تلقائي 360°" title="دوران تلقائي 360°">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M17 6.5l2.5 1.6-1.4 2.6"/><path d="M12 3v18"/></svg>
    </button>
    <button id="reset" aria-label="إعادة التجربة" title="إعادة التجربة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg>
    </button>
    <button id="fullscreen" aria-label="ملء الشاشة" title="ملء الشاشة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsPath" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>

<script>
(() => {
'use strict';

const cv=document.getElementById('scene');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2, DEG=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));

/* ---------- متجهات ثلاثية الأبعاد ---------- */
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z);
const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const norm=a=>mul(a,1/Math.hypot(a.x,a.y,a.z));

/* ---------- الفيزياء (الأبعاد بالمليمتر وبمقياس حقيقي) ----------
   11 صفيحة: 6 ثابتة + 5 دوارة ⇒ 10 فجوات هوائية تعمل كمتسعات على التوازي.
   نصف قطر الصفيحة R = 30 mm، البعد بين الصفيحتين d = 1.0 mm، السمك 0.5 mm.
   الصفيحة الثابتة فيها فتحة نصف قطرها 4.5 mm حول المحور، لذا
   المساحة المتقابلة قطاع حلقي:  A = ½ (R² − r²)(π − θ)
   C = (N − 1) ε₀ A / d  +  سعة طفيلية (أسلاك وأطراف) 8 pF                    */
const R=30, R_IN=4.5, TH=0.5, GAP=1.0, N=11, PITCH=TH+GAP, Z0=-(N-1)/2*PITCH;
const EPS0=8.8541878128e-12, STRAY=8;
const plateZ=i=>Z0+i*PITCH;
const areaMM2=t=>0.5*(R*R-R_IN*R_IN)*(Math.PI-t);
const capPF=t=>(N-1)*EPS0*areaMM2(t)*1e-6/(GAP*1e-3)*1e12+STRAY;

/* ---------- الألوان والمواد ---------- */
const C_STATOR=[192,204,216], C_ROTOR=[226,206,150], C_PLATED=[176,176,164],
      C_CERAMIC=[238,234,222], C_STEEL=[188,196,206], C_BRASS=[214,178,96],
      C_BAKE=[36,37,42], C_BOARD=[30,42,60], C_CREAM=[238,230,206],
      C_RED=[196,46,58], C_BLK=[38,40,46];
const WIRE_R=[205,52,62], WIRE_B=[48,52,60];
const LIGHT=norm(V(-0.45,0.85,0.6)), FILL=norm(V(0.7,0.2,0.5));

/* ---------- التخطيط ---------- */
const LAYOUTS={
  land:{W:1000,H:650,cx:330,cy:300,k:4.6,meter:{x:768,y:236},
        probes:[{x:660,y:468},{x:645,y:548}],info:{x:18,y:16}},
  port:{W:620,H:1240,cx:310,cy:380,k:4.5,meter:{x:56,y:770},
        probes:[{x:350,y:890},{x:335,y:985}],info:{x:14,y:14}}
};
let L=LAYOUTS.land, layoutName='';
let W=0,H=0,s=1,ox=0,oy=0;

/* ---------- الحالة ---------- */
const VIEW0={yaw:-0.72,pitch:0.46,zoom:1,px:0,py:0};
let theta=68*DEG;
let view={...VIEW0};
let showLabels=true;
const meter={x:0,y:0,w:180,h:255};
const probes=[
  {x:0,y:0,port:null,color:'#cf3f4d',light:'#ff9ea6',dark:'#6d1520'},
  {x:0,y:0,port:null,color:'#2b3747',light:'#8597ac',dark:'#0b121c'}
];
let drag=null, hover=null, snap=-1, pending=false;
let touchedKnob=false, touchedProbe=false;
const pointers=new Map();
let pinch=null, spin=false, lastT=0;

function placeDefaults(){
  meter.x=L.meter.x; meter.y=L.meter.y;
  probes.forEach((p,i)=>{p.x=L.probes[i].x;p.y=L.probes[i].y;p.port=null});
}

/* ---------- الكاميرا والإسقاط المنظوري ---------- */
const TARGET=V(0,-12,6), DIST=270;
let cam=null;
function setupCam(){
  const cp=Math.cos(view.pitch), sp=Math.sin(view.pitch);
  const C=V(TARGET.x+DIST*Math.sin(view.yaw)*cp, TARGET.y+DIST*sp, TARGET.z+DIST*Math.cos(view.yaw)*cp);
  const f=norm(sub(TARGET,C)), r=norm(cross(f,V(0,1,0))), u=cross(r,f);
  cam={C,f,r,u,F:L.k*view.zoom*DIST,cx:L.cx+view.px,cy:L.cy+view.py};
}
function P(p){
  const v=sub(p,cam.C), dz=dot(v,cam.f), sc=cam.F/dz;
  return{x:cam.cx+dot(v,cam.r)*sc, y:cam.cy-dot(v,cam.u)*sc, s:sc};
}
function col(c,a=1){return`rgba(${Math.round(clamp(c[0],0,255))},${Math.round(clamp(c[1],0,255))},${Math.round(clamp(c[2],0,255))},${a})`}
function lit(c,n,pt,o={}){
  const amb=o.amb??0.34, spec=o.spec??0.28, shin=o.shin??28;
  const dif=Math.max(0,dot(n,LIGHT));
  const v=norm(sub(cam.C,pt)), h=norm(add(LIGHT,v));
  const sp=spec*Math.pow(Math.max(0,dot(n,h)),shin);
  const k=amb+0.7*dif+0.2*Math.max(0,dot(n,FILL))+0.22*Math.max(0,dot(n,v));
  return c.map(x=>x*k+255*sp);
}
function pathPts(ps,close=true){
  ctx.beginPath();
  ps.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  if(close)ctx.closePath();
}
function centroid(ps){let x=0,y=0,z=0;ps.forEach(p=>{x+=p.x;y+=p.y;z+=p.z});return V(x/ps.length,y/ps.length,z/ps.length)}
/* وجه مستوٍ مع إخفاء الوجوه الخلفية (الأجسام محدبة) */
function face(pts,n,c,o={}){
  const ctr=centroid(pts);
  if(dot(n,sub(cam.C,ctr))<=0)return false;
  pathPts(pts.map(P));
  const cc=col(lit(c,n,ctr,o));
  ctx.fillStyle=cc;ctx.fill();
  ctx.strokeStyle=o.line||cc;ctx.lineWidth=o.lw||.6;ctx.stroke();
  return true;
}
function box(x0,x1,y0,y1,z0,z1,c,o){
  const p=V;
  face([p(x1,y0,z0),p(x1,y1,z0),p(x1,y1,z1),p(x1,y0,z1)],V(1,0,0),c,o);
  face([p(x0,y0,z0),p(x0,y0,z1),p(x0,y1,z1),p(x0,y1,z0)],V(-1,0,0),c,o);
  face([p(x0,y1,z0),p(x0,y1,z1),p(x1,y1,z1),p(x1,y1,z0)],V(0,1,0),c,o);
  face([p(x0,y0,z0),p(x1,y0,z0),p(x1,y0,z1),p(x0,y0,z1)],V(0,-1,0),c,o);
  face([p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)],V(0,0,1),c,o);
  face([p(x0,y0,z0),p(x0,y1,z0),p(x1,y1,z0),p(x1,y0,z0)],V(0,0,-1),c,o);
}
function cyl(B,A,e1,e2,r,len,c,o={}){
  const n=o.sides||24, E=add(B,mul(A,len)), ring=[];
  for(let i=0;i<n;i++){const a=i/n*TAU+(o.rot||0);ring.push(add(mul(e1,Math.cos(a)),mul(e2,Math.sin(a))))}
  for(let i=0;i<n;i++){
    const a=ring[i], b=ring[(i+1)%n];
    const cc=o.knurl&&i%2?c.map(v=>v*.72):c;
    face([add(B,mul(a,r)),add(B,mul(b,r)),add(E,mul(b,r)),add(E,mul(a,r))],norm(add(a,b)),cc,o);
  }
  if(o.cap1!==false)face(ring.map(d=>add(E,mul(d,r))),A,o.capCol||c,o);
  if(o.cap0!==false)face(ring.map(d=>add(B,mul(d,r))),mul(A,-1),o.capCol||c,o);
}
const cylZ=(x,y,r,z0,z1,c,o)=>cyl(V(x,y,z0),V(0,0,1),V(1,0,0),V(0,1,0),r,z1-z0,c,o);
const cylY=(x,z,r,y0,y1,c,o)=>cyl(V(x,y0,z),V(0,1,0),V(1,0,0),V(0,0,1),r,y1-y0,c,o);

/* نص مرسوم على مستوٍ في الفضاء (تحويل تآلفي محلي) */
function planeText(str,O,ex,ey,size,color,font='600 32px system-ui,Tahoma,sans-serif',dir='rtl'){
  const o=P(O), a=P(add(O,ex)), b=P(add(O,ey)), k=size/32;
  ctx.save();
  ctx.transform((a.x-o.x)*k,(a.y-o.y)*k,(b.x-o.x)*k,(b.y-o.y)*k,o.x,o.y);
  ctx.font=font;ctx.direction=dir;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=color;ctx.fillText(str,0,0);
  ctx.restore();
}

/* ---------- أشكال الصفائح ---------- */
function statorOutline(){
  const pts=[], hw=2.6, rEar=36, dA=Math.asin(hw/R), step=2.5*DEG;
  const arc=(a0,a1)=>{for(let t=a0;t<a1-1e-9;t+=step)pts.push([R*Math.cos(t),R*Math.sin(t)]);pts.push([R*Math.cos(a1),R*Math.sin(a1)])};
  let cur=Math.PI;
  for(const e of [225*DEG,315*DEG]){
    arc(cur,e-dA);
    const u=[Math.cos(e),Math.sin(e)], v=[-Math.sin(e),Math.cos(e)], c=[u[0]*(rEar-hw),u[1]*(rEar-hw)];
    for(let k=0;k<=10;k++){
      const f=-Math.PI/2+k*Math.PI/10;
      pts.push([c[0]+u[0]*hw*Math.cos(f)+v[0]*hw*Math.sin(f), c[1]+u[1]*hw*Math.cos(f)+v[1]*hw*Math.sin(f)]);
    }
    cur=e+dA;
  }
  arc(cur,TAU);
  for(let t=TAU;t>=Math.PI-1e-9;t-=8*DEG)pts.push([R_IN*Math.cos(t),R_IN*Math.sin(t)]);
  pts.push([-R_IN,0]);
  return pts;
}
const STATOR=statorOutline();
function rotorOutline(t){
  const pts=[], a0=Math.PI-t, a1=TAU-t;
  for(let a=a0;a<a1-1e-9;a+=2.5*DEG)pts.push([R*Math.cos(a),R*Math.sin(a)]);
  pts.push([R*Math.cos(a1),R*Math.sin(a1)]);
  for(let a=a1;a<=a1+Math.PI+1e-9;a+=12*DEG)pts.push([4.2*Math.cos(a),4.2*Math.sin(a)]);
  return pts;
}

/* صفيحة رقيقة: الوجه البعيد بلون الحافة ثم الوجه القريب بلمعان معدني */
function slab(pts2,z,th,c,o={}){
  const front=cam.C.z>z, zn=front?z+th/2:z-th/2, zf=front?z-th/2:z+th/2;
  const far=pts2.map(([x,y])=>P(V(x,y,zf))), near=pts2.map(([x,y])=>P(V(x,y,zn)));
  const ec=lit(c.map(v=>v*(o.edgeK||.62)),norm(V(cam.C.x,cam.C.y+40,0)),V(0,0,z),{spec:.12,amb:.45});
  pathPts(far);ctx.fillStyle=col(ec);ctx.fill();ctx.strokeStyle=col(ec);ctx.lineWidth=.9;ctx.stroke();
  const n=V(0,0,front?1:-1), base=lit(c,n,V(0,0,zn),{spec:.18,shin:10,amb:o.amb??.4});
  const dim=o.dim||1;
  let fill;
  if(o.flat){fill=col(base.map(v=>v*dim))}
  else{
    const g1=P(V(-R,R*.9,zn)), g2=P(V(R,-R*.9,zn));
    fill=ctx.createLinearGradient(g1.x,g1.y,g2.x,g2.y);
    [[0,.86],[.3,1.14],[.48,.93],[.7,1.1],[1,.84]].forEach(([p,k])=>fill.addColorStop(p,col(base.map(v=>v*k*dim))));
  }
  pathPts(near);ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=col(base.map(v=>v*1.3*dim),.85);ctx.lineWidth=.5;ctx.stroke();
  return zn;
}

/* ---------- تقسيم الأجسام الممتدة على المحور z لترتيب الرسم ---------- */
const CUTS=[...Array(N).keys()].map(plateZ).concat([-11,-9.5,9.5,11]).sort((a,b)=>a-b);
function segs(z0,z1){
  const out=[];let a=z0;
  for(const c of CUTS)if(c>a+1e-6&&c<z1-1e-6){out.push([a,c]);a=c}
  out.push([a,z1]);return out;
}

/* ---------- أجزاء المتسعة ---------- */
function drawPlate(i){
  const z=plateZ(i), rotor=i%2===1;
  const zn=slab(rotor?rotorOutline(theta):STATOR,z,TH,rotor?C_ROTOR:C_STATOR,{dim:.86+.14*i/(N-1)});
  const frontStator=cam.C.z>0?N-1:0;
  if(showLabels&&i===frontStator&&theta<Math.PI-.02){
    const pts=[];
    for(let a=Math.PI;a<=TAU-theta+1e-9;a+=2*DEG)pts.push(P(V(R*Math.cos(a),R*Math.sin(a),zn)));
    pts.push(P(V(R*Math.cos(TAU-theta),R*Math.sin(TAU-theta),zn)));
    for(let a=TAU-theta;a>=Math.PI-1e-9;a-=6*DEG)pts.push(P(V(R_IN*Math.cos(a),R_IN*Math.sin(a),zn)));
    pts.push(P(V(-R_IN,0,zn)));
    pathPts(pts);
    ctx.fillStyle='rgba(127,211,255,.2)';ctx.fill();
    ctx.setLineDash([4,3]);ctx.strokeStyle='rgba(127,211,255,.9)';ctx.lineWidth=1.2;ctx.stroke();ctx.setLineDash([]);
  }
}
function drawDial(){
  const pts=[];for(let k=0;k<64;k++){const a=k/64*TAU;pts.push([11.5*Math.cos(a),11.5*Math.sin(a)])}
  const zn=slab(pts,12.05,.5,C_CREAM,{flat:true,amb:.62,edgeK:.75});
  if(cam.C.z<zn)return;
  const ln=(r0,r1,a,w,c)=>{const p=P(V(r0*Math.cos(a),r0*Math.sin(a),zn)),q=P(V(r1*Math.cos(a),r1*Math.sin(a),zn));
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=c;ctx.lineWidth=w*p.s;ctx.stroke()};
  const arcPts=[];for(let a=0;a<=Math.PI+1e-9;a+=3*DEG)arcPts.push(P(V(10.9*Math.cos(a),10.9*Math.sin(a),zn)));
  pathPts(arcPts,false);ctx.strokeStyle='#1d2430';ctx.lineWidth=.22*arcPts[0].s;ctx.stroke();
  for(let v=0;v<=180;v+=5){
    const a=Math.PI-v*DEG, major=v%30===0, mid=v%10===0;
    ln(major?8.7:mid?9.4:9.95,10.9,a,major?.28:.16,'#1d2430');
  }
  for(let v=0;v<=180;v+=30){
    const a=Math.PI-v*DEG;
    planeText(String(v),V(7.4*Math.cos(a),7.4*Math.sin(a),zn+.01),V(1,0,0),V(0,-1,0),1.25,'#1d2430','700 32px ui-monospace,Consolas,monospace','ltr');
  }
  planeText('θ°',V(0,-8.4,zn+.01),V(1,0,0),V(0,-1,0),1.6,'#55606e','700 32px system-ui,sans-serif','ltr');
}
function drawKnob(){
  cylZ(0,0,2,12.3,12.7,C_STEEL,{sides:14});
  // مؤشر معدني فوق التدريج
  const a=Math.PI-theta, u=V(Math.cos(a),Math.sin(a),0), v=V(-Math.sin(a),Math.cos(a),0), z=12.55;
  const tip=add(V(0,0,z),mul(u,11.2));
  const bl=add(add(V(0,0,z),mul(u,4.6)),mul(v,.6)), br=add(add(V(0,0,z),mul(u,4.6)),mul(v,-.6));
  pathPts([bl,tip,br].map(P));ctx.fillStyle='#ffd27a';ctx.fill();ctx.strokeStyle='#8a6a20';ctx.lineWidth=.6;ctx.stroke();
  // تنورة المقبض والمقبض المحزّز
  cylZ(0,0,6,12.7,13.6,C_BAKE,{sides:40,spec:.35,shin:20});
  if(cam.C.z>13.62){const s0=P(add(V(0,0,13.62),mul(u,2.4))), s1=P(add(V(0,0,13.62),mul(u,5.8)));
  ctx.beginPath();ctx.moveTo(s0.x,s0.y);ctx.lineTo(s1.x,s1.y);ctx.strokeStyle='#f3efe4';ctx.lineWidth=.55*s0.s;ctx.stroke();}
  cylZ(0,0,4.4,13.6,20.5,C_BAKE,{sides:26,knurl:true,spec:.45,shin:26,capCol:[54,56,62]});
  if(cam.C.z<20.52)return;
  const c=P(V(0,0,20.52)), m=P(add(V(0,0,20.52),mul(u,3.7)));
  ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(m.x,m.y);ctx.strokeStyle='#f3efe4';ctx.lineWidth=.6*c.s;ctx.stroke();
  const ring=[];for(let k=0;k<40;k++){const t=k/40*TAU;ring.push(P(V(3.5*Math.cos(t),3.5*Math.sin(t),20.52)))}
  pathPts(ring);ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=.35*c.s;ctx.stroke();
  if(hover==='knob'||drag?.type==='knob'){

    const a=pts[i-1],b=pts[i],c=pts[i+1];

}

  if(!touchedProbe&&!drag&&probes[0].port===null){const g=along(0,42);pulse(g.x,g.y,16);anim=true}
  const now=performance.now();
  if(spin){view.yaw=wrapA(view.yaw+Math.min(50,now-(lastT||now))*.00045);anim=true}
  lastT=now;
  if(anim)paint();
}
function paint(){if(!pending){pending=true;requestAnimationFrame(draw)}}

function resize(){
  W=cv.clientWidth;H=cv.clientHeight;
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const name=W/H>=0.9?'land':'port';
  if(name!==layoutName){layoutName=name;L=LAYOUTS[name];placeDefaults()}
  s=Math.min(W/L.W,H/L.H);ox=(W-L.W*s)/2;oy=(H-L.H*s)/2;
  paint();
}

/* ---------- التفاعل ---------- */
function point(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}}
function inBox(p,b){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h}
function knobHit(p){
  if(!cam)return false;
  const a=P(V(0,0,20.5)), b=P(V(0,0,13));
  return d2(p,a)<5.5*a.s+9||d2(p,b)<6.5*b.s+7;
}
function hit(p){
  for(let i=probes.length-1;i>=0;i--)
    if(d2(p,along(i,42))<28||d2(p,probeTip(i))<16)return{type:'probe',i};
  if(inBox(p,meter))return{type:'meter'};
  if(knobHit(p))return{type:'knob'};
  return{type:'orbit'};
}
function candidate(i){
  const other=probes[1-i];let best=-1,bd=40;
  portPts().forEach((q,n)=>{const d=d2(probes[i],q);if(other.port!==n&&d<bd){best=n;bd=d}});
  return best;
}
function screenAngle(p){
  const c=P(V(0,0,13));return Math.atan2(p.y-c.y,p.x-c.x);
}
function handSign(){
  const c=P(V(0,0,13)),a=P(V(1,0,13)),b=P(V(0,1,13));
  return Math.sign((a.x-c.x)*(b.y-c.y)-(a.y-c.y)*(b.x-c.x))||-1;
}
function begin(e){
  const p=point(e);
  pointers.set(e.pointerId,p);
  if(pointers.size===2&&(!drag||drag.type==='orbit')){
    const [a,b]=[...pointers.values()];
    pinch={d:d2(a,b),mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};drag=null;
    cv.setPointerCapture(e.pointerId);e.preventDefault();return;
  }
  if(drag)return;
  const h=hit(p);
  drag={...h,id:e.pointerId,last:p};
  if(h.type==='probe'){
    const q=probes[h.i],t=probeTip(h.i);
    drag.dx=t.x-p.x;drag.dy=t.y-p.y;q.x=t.x;q.y=t.y;q.port=null;snap=candidate(h.i);touchedProbe=true;
  }else if(h.type==='knob'){
    drag.ang=screenAngle(p);touchedKnob=true;
  }else if(h.type==='meter'){
    drag.dx=meter.x-p.x;drag.dy=meter.y-p.y;
  }
  cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';e.preventDefault();paint();
}
function move(e){
  const p=point(e);
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,p);
  if(pinch&&pointers.size>=2){
    const [a,b]=[...pointers.values()], d=d2(a,b), mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    zoomAt(mid,d/pinch.d);
    view.px+=mid.x-pinch.mid.x;view.py+=mid.y-pinch.mid.y;
    pinch={d,mid};paint();return;
  }
  if(!drag){
    const h=hit(p);hover=h.type;
    cv.style.cursor=h.type==='orbit'?'move':'grab';paint();return;
  }
  if(e.pointerId!==drag.id)return;
  if(drag.type==='probe'){
    const q=probes[drag.i];q.x=clamp(p.x+drag.dx,12,L.W-12);q.y=clamp(p.y+drag.dy,12,L.H-30);snap=candidate(drag.i);
  }else if(drag.type==='knob'){
    const a=screenAngle(p);let dl=a-drag.ang;
    if(dl>Math.PI)dl-=TAU;if(dl<-Math.PI)dl+=TAU;
    theta=clamp(theta-dl*handSign(),0,Math.PI);drag.ang=a;
  }else if(drag.type==='meter'){
    meter.x=clamp(p.x+drag.dx,5,L.W-5-meter.w);meter.y=clamp(p.y+drag.dy,12,L.H-60-meter.h);
  }else{
    view.yaw=wrapA(view.yaw-(p.x-drag.last.x)*.008);
    view.pitch=clamp(view.pitch+(p.y-drag.last.y)*.006,.12,1.45);spin=false;syncSpin();
  }
  drag.last=p;paint();
}
function end(e){
  pointers.delete(e.pointerId);
  if(pinch){if(pointers.size<2)pinch=null;return}
  if(!drag||drag.id!==e.pointerId)return;
  if(drag.type==='probe'&&e.type==='pointerup'){const n=candidate(drag.i);if(n!==-1)probes[drag.i].port=n}
  drag=null;snap=-1;cv.style.cursor='default';paint();
}
function zoomAt(p,f){
  const z=clamp(view.zoom*f,.6,3.2);f=z/view.zoom;view.zoom=z;
  const cx=L.cx+view.px, cy=L.cy+view.py;
  view.px=p.x-(p.x-cx)*f-L.cx;view.py=p.y-(p.y-cy)*f-L.cy;
}
cv.addEventListener('pointerdown',begin);
cv.addEventListener('pointermove',move);
cv.addEventListener('pointerup',end);
cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(point(e),Math.exp(-e.deltaY*.0015));paint()},{passive:false});
cv.addEventListener('dblclick',e=>{if(hit(point(e)).type==='orbit'){view={...VIEW0};paint()}});
cv.addEventListener('contextmenu',e=>e.preventDefault());

const spinBtn=document.getElementById('spin');
function syncSpin(){spinBtn.setAttribute('aria-pressed',String(spin))}
spinBtn.addEventListener('click',()=>{spin=!spin;lastT=0;syncSpin();paint()});
const lbl=document.getElementById('labels');
lbl.addEventListener('click',()=>{showLabels=!showLabels;lbl.setAttribute('aria-pressed',String(showLabels));paint()});
document.getElementById('reset').addEventListener('click',()=>{
  theta=68*DEG;view={...VIEW0};spin=false;syncSpin();placeDefaults();drag=null;snap=-1;paint();
});

const fs=document.getElementById('fullscreen'), fsPath=document.getElementById('fsPath'), toast=document.getElementById('toast');
let toastTimer;
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function notify(m,ms=3200){toast.textContent=m;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,ms)}
fs.addEventListener('click',async()=>{
  try{
    if(isFS()){const x=document.exitFullscreen||document.webkitExitFullscreen;if(x)await x.call(document)}
    else{const r=document.documentElement,en=r.requestFullscreen||r.webkitRequestFullscreen;
      if(!en){notify('المتصفح لا يدعم ملء الشاشة لهذه الصفحة');return}await en.call(r)}
  }catch{notify('تعذّر ملء الشاشة؛ عند التضمين يجب السماح به للإطار')}
});
function syncFS(){
  const l=isFS()?'الخروج من ملء الشاشة':'ملء الشاشة';fs.setAttribute('aria-label',l);fs.title=l;
  fsPath.setAttribute('d',isFS()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');resize();
}
document.addEventListener('fullscreenchange',syncFS);
document.addEventListener('webkitfullscreenchange',syncFS);
window.__sim={toClient:q=>({x:q.x*s+ox,y:q.y*s+oy}),ports:()=>portPts().map(q=>({x:q.x*s+ox,y:q.y*s+oy})),
  grips:()=>probes.map((_,i)=>{const g=along(i,42);return{x:g.x*s+ox,y:g.y*s+oy}}),
  tips:()=>probes.map((_,i)=>{const g=probeTip(i);return{x:g.x*s+ox,y:g.y*s+oy}}),
  set:d=>{theta=d*DEG;touchedKnob=true;touchedProbe=true;paint()},
  knob:()=>{const k=P(V(0,0,20.5));return{x:k.x*s+ox,y:k.y*s+oy}},
  view:(y,p)=>{view.yaw=y;view.pitch=p;touchedKnob=true;touchedProbe=true;paint()},
  time:()=>{const t=performance.now();for(let i=0;i<20;i++){pending=false;draw()}return (performance.now()-t)/20}};
new ResizeObserver(resize).observe(cv);
resize();
notify('أدِر المقبض لتغيير التداخل بين الصفائح • اسحب الخلفية لتدوير المنظر 360° • العجلة أو إصبعان للتكبير',6500);
})();
</script>
</body>
</html>
