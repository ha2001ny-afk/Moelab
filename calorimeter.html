<title>قياس انثالبي التفاعل (المسعر)</title>
<style>

  #svgWrap{position:absolute;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);right:0;left:calc(var(--bw) + 22px + env(safe-area-inset-left,0px))}
  svg#svg{width:100%;height:100%;display:block;overflow:visible;touch-action:none;cursor:grab;transition:opacity .3s}
  :root{--bw:126px;--zb:42px}
  body.fsx #svgWrap{left:0}

  /* ---- left controls: zoom group on top, stage buttons under it (transparent) ---- */
  #side{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));bottom:8px;width:var(--bw);z-index:5;
        display:flex;flex-direction:column;align-items:flex-start;gap:14px;overflow-y:auto;direction:ltr}
  .zb{display:flex;flex-direction:column;gap:8px;direction:ltr}
  .zb button{width:var(--zb);height:var(--zb);border-radius:50%;border:2px solid #1f3a52;background:transparent;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;
             display:flex;align-items:center;justify-content:center;padding:0}
  .zb svg{width:20px;height:20px;pointer-events:none}
  .sysList{display:flex;flex-direction:column;gap:7px;width:100%;direction:rtl}
  .sys{width:100%;padding:6px 8px;border-radius:8px;border:1.5px solid rgba(31,58,82,.45);background:transparent;color:#1f3a52;
       font:bold 14px Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.3;text-align:center;cursor:pointer;
       transition:color .25s,border-color .25s,transform .15s}
  .sys:active{transform:scale(.97)}
  .sys.on{background:transparent;border-color:#c4623a;border-width:2.5px;color:#a8431b}
  .sys.all{border-style:dashed}
  .sys:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  @media (max-width:560px),(max-height:440px){
    :root{--bw:92px;--zb:34px}
    #side{top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));gap:10px}
    .zb{gap:6px}.zb button{font-size:18px}.zb svg{width:16px;height:16px}
    .sys{padding:4px 5px;font-size:11.5px;border-radius:7px}
    .sysList{gap:5px}
  }
  @media (max-height:400px){:root{--zb:30px}#side{gap:6px}.zb{gap:4px}}

  svg text{direction:rtl}
  .pill{fill:#fff;stroke:#c4623a;stroke-width:2.5}
  .lbl{fill:#a8431b;font-size:19px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .ln{stroke:#c4623a;stroke-width:2.2;fill:none}
  .td{fill:#c4623a;stroke:#fff;stroke-width:1.5}
  .hd{transition:opacity .35s}
  .hName{fill:#1f3a52;font-size:32px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .hEn{fill:#3f6f93;font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .capBox{fill:#1f3a52}
  .capTxt{fill:#fff;font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .card{fill:#fff;stroke:#b9d3e2;stroke-width:1.5}
  .cTitle{fill:#fff;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .cRow{fill:#1f3a52;font-size:14.5px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .cRow.en{fill:#3f6f93;direction:ltr}
  .cSm{fill:#1f3a52;font-size:12.5px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .cVal{fill:#1f3a52;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .cRes{fill:#d63a3a;font-size:17px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .big{fill:#1f3a52;font-size:30px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .gL{fill:#1f3a52;font-size:14px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .dT{fill:#c4623a;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .o2{fill:#1f3a52;font-size:19px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .pm{fill:#1f3a52;font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .small{fill:#3f6f93;font-size:13px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .pC{fill:#3f6f93;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
</style>

      <linearGradient id="gWat" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b9e3f6"/><stop offset="1" stop-color="#7cc0e2"/></linearGradient>
      <linearGradient id="gFl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffd24a"/><stop offset="1" stop-color="#f0702a"/></linearGradient>
      <radialGradient id="gGlow"><stop offset="0" stop-color="#ffb347" stop-opacity=".9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>

      <marker id="ahO" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c4623a"/></marker>
      <marker id="ahD" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3a52"/></marker>
    </defs>

<script>
(function(){
const NS="http://www.w3.org/2000/svg", PI=Math.PI;
const svg=document.getElementById('svg'), view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const txt=(cls,x,y,s,p)=>{const e=el('text',{class:cls,x,y},p);e.textContent=s;return e;};
const cl=x=>Math.min(1,Math.max(0,x)), ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const vis=(g,o)=>{g.setAttribute('opacity',o.toFixed(2));g.setAttribute('display',o<.01?'none':'');};
const NAVY='#1f3a52', RED='#d63a3a', ORG='#c4623a';

/* ---------- stages: 0 تمهيد، 1 الأجزاء، 2 قبل التفاعل، 3 أثناء التفاعل، 4 الحساب، 5 شكل الكتاب ---------- */
const TX=[
 {n:'قياس انثالبي التفاعل',e:'Calorimeter',c:'المسعر: جهاز لقياس حرارة التفاعل'},
 {n:'أجزاء المسعر',e:'Parts of the Calorimeter',c:'وعاء تفاعل مغمور في ماء داخل وعاء معزول'},
 {n:'قبل التفاعل',e:'Before the Reaction',c:'كميات معروفة ودرجة حرارة ابتدائية'},
 {n:'أثناء التفاعل',e:'During the Reaction',c:'الحرارة المتحررة تسخن الماء والمسعر'},
 {n:'حساب الحرارة',e:'q = C × ΔT',c:'من الزيادة في درجة الحرارة'},
 {n:'شكل الكتاب',e:'Figure 1-2',c:'المسعر الحراري كما ورد في الكتاب'}
];
const EX=[
 ['يقاس انثالبي التفاعل','بجهاز يسمى المسعر','(Calorimeter)'],
 ['وعاء تفاعل مغمور في ماء','معلوم الكتلة','الوعاء الخارجي: نظام معزول','الوعاء الداخلي: نظام مغلق'],
 ['توضع في المسعر كميات','معروفة من المواد المتفاعلة','وتقرأ درجة حرارة الماء','الابتدائية'],
 ['الحرارة المتحررة من التفاعل','ترفع درجة حرارة','الماء والمسعر','والمحرك يوزع الحرارة']
];
/* قيم توضيحية (ليست من الكتاب) */
const TI=25, TF=28.5, CAP=10;                              // °C ، °C ، kJ/°C
const Tof=u=>TI+(TF-TI)*ease(cl((u-.15)/.6));

/* ================= calorimeter (drawn after the book's figure 1-2) ================= */
const sG=el('g',{},view);
el('path',{d:'M200,262 L200,596 Q200,620 224,620 L436,620 Q460,620 460,596 L460,262 Z',fill:'url(#gShell)',stroke:'#59636a','stroke-width':2},sG);
el('path',{d:'M210,262 L210,594 Q210,610 226,610 L434,610 Q450,610 450,594 L450,262 Z',fill:'#f3f8fb'},sG);
const cav=el('g',{'clip-path':'url(#cCav)'},sG);
const water=el('path',{fill:'url(#gWat)',opacity:.92},cav);
const warm=el('rect',{x:205,y:297,width:250,height:320,fill:'#ff6a3d',opacity:0},cav);
const wTop=el('path',{fill:'none',stroke:'#eaf7fd','stroke-width':3,opacity:.9},cav);
const bubs=[...Array(8)].map((_,k)=>({x:(k%2?222:410)+((k*13)%26),p:(k*.137)%1,v:.18+((k*7)%5)*.03,e:el('circle',{fill:'none',stroke:'#eaf7fd','stroke-width':1.5},cav)}));
/* supports + stirrer */
el('path',{d:'M276,610 L292,562 L308,610 Z',fill:'#e3b06a',stroke:'#b98a45','stroke-width':1.5},sG);
el('path',{d:'M352,610 L368,562 L384,610 Z',fill:'#e3b06a',stroke:'#b98a45','stroke-width':1.5},sG);
const stir=el('rect',{y:597,height:9,rx:4.5,fill:'#525b61'},sG);
/* inner closed reaction vessel */
el('rect',{x:262,y:340,width:136,height:222,rx:10,fill:'#8b949a',stroke:'#59636a','stroke-width':2},sG);
el('rect',{x:272,y:340,width:116,height:212,rx:5,fill:'#f8fbfd'},sG);
const glow=el('circle',{cx:330,cy:505,r:58,fill:'url(#gGlow)',opacity:0},sG);
/* O2 pipe */
el('path',{d:'M476,232 L372,232 L372,396',fill:'none',stroke:'#7d858b','stroke-width':10,'stroke-linejoin':'round'},sG);
el('path',{d:'M478,232 L372,232 L372,398',fill:'none',stroke:'#e6f1f8','stroke-width':4.5,'stroke-linejoin':'round'},sG);
el('line',{x1:522,y1:232,x2:488,y2:232,stroke:NAVY,'stroke-width':3,'stroke-linecap':'round','marker-end':'url(#ahD)'},sG);
el('text',{class:'o2',x:541,y:232},sG).innerHTML='O<tspan dy="5" font-size="13">2</tspan>';
/* sample cup + reactants */
el('path',{d:'M298,490 L362,490 L351,542 L309,542 Z',fill:'#fff',stroke:'#6f787e','stroke-width':3,'stroke-linejoin':'round'},sG);
el('path',{d:'M303.5,514 L356.5,514 L351,540 L309,540 Z',fill:'#9aa1a6'},sG);
const fuel=el('path',{d:'M303.5,514 L356.5,514 L351,540 L309,540 Z',fill:'#f0a23c'},sG);
const flame=el('g',{},sG);
el('path',{d:'M0,-78 C24,-44 38,-20 26,6 C19,24 -19,24 -26,6 C-38,-20 -13,-40 0,-78 Z',fill:'url(#gFl)'},flame);
el('path',{d:'M0,-40 C11,-22 17,-10 11,4 C8,12 -8,12 -11,4 C-17,-10 -6,-20 0,-40 Z',fill:'#fff3b0'},flame);
/* ignition wires */
el('path',{d:'M316,176 L316,330 L325,516',fill:'none',stroke:'#c8322c','stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round'},sG);
el('path',{d:'M346,176 L346,330 L337,516',fill:'none',stroke:'#2d3439','stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round'},sG);
txt('pm',303,184,'+',sG);txt('pm',359,184,'−',sG);
const spark=el('path',{d:'M0,-15 L4,-4 L15,0 L4,4 L0,15 L-4,4 L-15,0 L-4,-4 Z',fill:'#fff36b',stroke:'#f0702a','stroke-width':1.5},sG);
/* lids */
el('rect',{x:252,y:328,width:156,height:16,rx:4,fill:'#737c82',stroke:'#59636a','stroke-width':1.5},sG);
el('rect',{x:188,y:248,width:284,height:17,rx:4,fill:'#a3abb0',stroke:'#6f787e','stroke-width':1.5},sG);
for(let x=202;x<=460;x+=21.5)el('circle',{cx:x,cy:256.5,r:3,fill:'#fff'},sG);
/* thermometer */
el('rect',{x:225,y:150,width:14,height:330,rx:7,fill:'#fffbe6',stroke:'#8a8f76','stroke-width':2},sG);
const merc=el('rect',{x:229.5,width:5,rx:2.5,fill:RED},sG);
el('circle',{cx:232,cy:484,r:9,fill:RED,stroke:'#8a8f76','stroke-width':2},sG);
for(let k=0;k<=8;k++)el('line',{x1:239,y1:240-k*10,x2:k%2?243:247,y2:240-k*10,stroke:'#59636a','stroke-width':1.6},sG);
/* heat arrows: reaction vessel -> water */
const heatG=el('g',{},sG), arrs=[];
[[[258,430],[216,420]],[[258,515],[216,525]],[[402,430],[444,420]],[[402,515],[444,525]]].forEach(([a,b])=>
  arrs.push(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:RED,'stroke-width':4.5,'stroke-linecap':'round','marker-end':'url(#ah)','stroke-dasharray':'10 6'},heatG)));
txt('small',330,650,'القيم العددية مثال توضيحي',sG);

/* ---- labels (pill + leader): the book's own labels ---- */
const lbG=el('g',{'pointer-events':'none'},sG);
function label(cx,cy,w,s,tip){const g=el('g',{},lbG);
  el('line',{class:'ln',x1:cx,y1:cy,x2:tip[0],y2:tip[1]},g);el('circle',{class:'td',r:5,cx:tip[0],cy:tip[1]},g);
  el('rect',{class:'pill',x:cx-w/2,y:cy-19,width:w,height:38,rx:19},g);txt('lbl',cx,cy,s,g);}
label(95,175,120,'المحرار',[226,196]);
label(98,420,188,'ماء (معلوم الكتلة)',[246,530]);
label(100,600,196,'محرك لتوزيع الحرارة',[318,601]);
label(566,174,156,'أسلاك الإشعال',[347,206]);
label(585,268,150,'غاز الأوكسجين',[505,238]);
label(572,338,186,'وعاء خارجي معزول',[456,360]);
label(572,426,186,'وعاء التفاعل المغلق',[394,446]);
label(572,522,164,'المواد المتفاعلة',[346,526]);

/* ================= right column ================= */
const pnG=el('g',{},view);
function card(y,h,col,title){el('rect',{class:'card',x:672,y,width:212,height:h,rx:12},pnG);
  el('path',{d:`M672,${y+28} L672,${y+12} Q672,${y} 684,${y} L872,${y} Q884,${y} 884,${y+12} L884,${y+28} Z`,fill:col},pnG);
  return txt('cTitle',778,y+14,title,pnG);}
/* read-out */
card(160,104,ORG,'درجة حرارة الماء');
const tVal=txt('big',778,218,'',pnG);
const tiT=el('text',{class:'cVal',x:830,y:250},pnG), tfT=el('text',{class:'cVal',x:726,y:250},pnG);
const sub=(a,b,c)=>`${a}<tspan dy="4" font-size="10">${b}</tspan><tspan dy="-4">${c}</tspan>`;
tiT.innerHTML=sub('T','i',' = '+TI.toFixed(1));
/* temperature–time graph */
card(274,192,NAVY,'درجة الحرارة مع الزمن');
const GX0=712, GX1=868, GY0=436, PPD=21.8, gy=T=>GY0-(T-24)*PPD;
el('path',{d:`M${GX0},312 L${GX0},440 L874,440`,fill:'none',stroke:NAVY,'stroke-width':2.5,'stroke-linecap':'round','stroke-linejoin':'round'},pnG);
txt('small',790,454,'الزمن',pnG);
el('line',{x1:GX0,y1:gy(TI),x2:GX1,y2:gy(TI),stroke:'#8aa2b3','stroke-width':1.5,'stroke-dasharray':'5 5'},pnG);
el('text',{class:'gL',x:694,y:gy(TI)},pnG).innerHTML=sub('T','i','');
const tfG=el('g',{},pnG);
el('line',{x1:GX0,y1:gy(TF),x2:GX1,y2:gy(TF),stroke:'#8aa2b3','stroke-width':1.5,'stroke-dasharray':'5 5'},tfG);
el('text',{class:'gL',x:694,y:gy(TF)},tfG).innerHTML=sub('T','f','');
const curve=el('path',{fill:'none',stroke:RED,'stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round'},pnG);
const gDot=el('circle',{r:5.5,fill:RED,stroke:'#fff','stroke-width':2},pnG);
const dtG=el('g',{},pnG);
el('line',{x1:858,y1:gy(TI)-4,x2:858,y2:gy(TF)+5,stroke:ORG,'stroke-width':3,'stroke-linecap':'round','marker-end':'url(#ahO)','marker-start':'url(#ahO)'},dtG);
txt('dT',838,(gy(TI)+gy(TF))/2,'ΔT',dtG);
/* explanation / calculation */
const cT=card(476,172,NAVY,'');
const dyn=el('g',{class:'hd'},pnG);
const exR=[0,1,2,3].map(j=>txt('cRow',778,528+j*28,'',dyn));
const calcG=el('g',{},dyn);
const cR=[txt('cSm',778,520,'السعة الحرارية للمسعر ومحتوياته',calcG),
  txt('cVal',778,545,'C = '+CAP+' kJ/°C',calcG),el('text',{class:'cVal',x:778,y:572},calcG),
  txt('cVal',778,599,'q = C × ΔT',calcG),txt('cRes',778,628,'q = '+CAP+' × '+(TF-TI)+' = '+(CAP*(TF-TI))+' kJ',calcG)];
cR[2].innerHTML='ΔT = '+sub('T','f',' − ')+sub('T','i',' = '+(TF-TI)+' °C');
function setDyn(i){
  const calc=i===4;cT.textContent=calc?'حساب الحرارة المتحررة':'الشرح';
  vis(calcG,calc?1:0);
  const rows=calc?[]:(EX[i]||[]), y0=rows.length>3?522:532;
  exR.forEach((r,j)=>{r.textContent=rows[j]||'';r.setAttribute('y',y0+j*29);
    r.setAttribute('class',rows[j]&&/^[\x00-\x7f]+$/.test(rows[j])?'cRow en':'cRow');});
}

/* ================= the book's own figure ================= */

/* ================= state & animation loop ================= */
let idx=0, t0=-1e9, last=0, u=0, mixT=0;
const sm={lb:0,mix:0,ht:0,st:0};
const RUN=9;                                              // ثوانٍ لمرحلة «أثناء التفاعل»
function frame(ms){
  const t=ms/1000, dt=Math.min(.1,Math.max(0,(ms-last)/1000));last=ms;
  const el_=(ms-t0)/1000, k=Math.min(1,dt*5);
  if(idx===3)u=cl((el_-.8)/RUN);else if(idx===4)u=Math.min(1,u+dt*.9);else if(idx<3)u=Math.max(0,u-dt*3);
  const T=Tof(u), fr=(T-TI)/(TF-TI), burn=cl((u-.15)/.55);
  const heating=u>.17&&u<.85;
  sm.lb+=((idx===1?1:0)-sm.lb)*k;sm.ht+=((heating?1:0)-sm.ht)*k;sm.st+=((idx>=2&&idx<=4?1:0)-sm.st)*k;
  sm.mix+=(mixT-sm.mix)*Math.min(1,dt*4.5);
  vis(sG,1-sm.mix);vis(pnG,1-sm.mix);vis(bkG,sm.mix);
  if(sm.mix<.99){
    /* water */
    const pts=[];for(let x=205;x<=455;x+=10)pts.push(x+','+(294+2.2*sm.st*Math.sin(x*.05+t*2.4)+1.2*Math.sin(x*.12-t*1.7)).toFixed(1));
    water.setAttribute('d','M'+pts.join(' L')+' L455,615 L205,615 Z');wTop.setAttribute('d','M'+pts.join(' L'));
    warm.setAttribute('opacity',0);
    bubs.forEach(b=>{const q=(b.p+b.v*t)%1;b.e.setAttribute('cx',(b.x+3*Math.sin(t*3+b.x)).toFixed(1));b.e.setAttribute('cy',(600-q*290).toFixed(1));b.e.setAttribute('r',(1.5+q*2.5).toFixed(1));b.e.setAttribute('opacity',(sm.st*.8*Math.sin(PI*q)).toFixed(2));});
    /* stirrer */
    const w=12+40*Math.abs(Math.cos(t*7*sm.st));stir.setAttribute('x',(330-w/2).toFixed(1));stir.setAttribute('width',w.toFixed(1));
    /* thermometer + read-out */
    const top=240-(T-24)/6*80;merc.setAttribute('y',top.toFixed(1));merc.setAttribute('height',(484-top).toFixed(1));
    tVal.textContent=T.toFixed(1)+' °C';
    const done=u>=.76;tfT.innerHTML=sub('T','f',' = '+(done?TF.toFixed(1):'؟'));
    /* reaction inside the vessel */
    const fo=(u>.15&&u<.72)?Math.min(1,(u-.15)*14)*Math.min(1,(.72-u)*9):0;
    flame.setAttribute('transform',`translate(330 516) scale(${(.42+.03*Math.sin(t*17)).toFixed(3)} ${(.42*(.85+.12*Math.sin(t*13)+.05*Math.sin(t*29))).toFixed(3)})`);vis(flame,fo);
    vis(glow,fo*.85);fuel.setAttribute('opacity',(1-.9*burn).toFixed(2));
    const so=(u>.1&&u<.2)?1:0;spark.setAttribute('transform',`translate(331 510) rotate(${(t*500%360).toFixed(0)}) scale(${(.8+.4*Math.sin(t*40)).toFixed(2)})`);vis(spark,so);
    vis(heatG,sm.ht);const off=(-t*30%16).toFixed(1);arrs.forEach(a=>a.setAttribute('stroke-dashoffset',off));
    vis(lbG,sm.lb);
    /* graph */
    const n=Math.max(1,Math.round(u*60)),gp=[];for(let j=0;j<=n;j++){const q=u*j/n;gp.push((GX0+q*(GX1-GX0-14)).toFixed(1)+','+gy(Tof(q)).toFixed(1));}
    curve.setAttribute('d','M'+gp.join(' L'));const lp=gp[gp.length-1].split(',');gDot.setAttribute('cx',lp[0]);gDot.setAttribute('cy',lp[1]);
    vis(tfG,done?1:0);vis(dtG,idx===4&&u>=1?1:0);
    if(idx===4)cR.forEach((r,j)=>r.setAttribute('opacity',cl((el_-.5-j*.6)/.5).toFixed(2)));
  }
  requestAnimationFrame(frame);
}

let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{try{svg.setPointerCapture(e.pointerId);}catch(_){}ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prev=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prev.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,dd=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(dd/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};

document.getElementById('fs').onclick=()=>{
  if(fsx){setFsx(false);return;}
  if(isFs()){try{(D.exitFullscreen||D.webkitExitFullscreen).call(D);}catch(e){}return;}
  const f=R.requestFullscreen||R.webkitRequestFullscreen;
  if(!f){setFsx(true);return;}
  try{const p=f.call(R);if(p&&p.catch)p.catch(()=>setFsx(true));}catch(e){setFsx(true);return;}
  setTimeout(()=>{if(!isFs()&&!fsx)setFsx(true);},400);
};
D.addEventListener('fullscreenchange',fsIcon);D.addEventListener('webkitfullscreenchange',fsIcon);
})();
</script>
