<style>
/* Layout: one full-screen navy lab bench; battery, knife switch, iron-core coil and neon lamp; every wire is placed by hand */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --pos:#ff6b6b; --neg:#5eaaff; --field:#62d98a; --accent:#7fd3ff; --neon:#ff8a3d; --warn:#ffc04d;
  --wire-p:#e94848; --wire-n:#1b2029; --copper:#d98a46;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body);margin:0}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.fs,.tipbtn{position:absolute;top:max(10px,env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);display:grid;place-items:center;cursor:pointer;padding:0}
.fs{right:max(10px,env(safe-area-inset-right,0px));color:var(--ink)}
.tipbtn{right:calc(max(10px,env(safe-area-inset-right,0px)) + 50px);color:#ffd27a}
.fs:hover{border-color:var(--accent)}
.tipbtn:hover,.tipbtn.on{border-color:#ffd27a;background:rgba(255,210,122,.14)}
.fs:focus-visible,.tipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fs svg{width:20px;height:20px}.tipbtn svg{width:22px;height:22px}
.toast{position:absolute;top:max(62px,calc(env(safe-area-inset-top,0px) + 56px));right:max(10px,env(safe-area-inset-right,0px));max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5}
.tip{position:absolute;top:max(60px,calc(env(safe-area-inset-top,0px) + 58px));right:max(10px,env(safe-area-inset-right,0px));width:min(350px,calc(100% - 20px));max-height:calc(100% - 80px);overflow:auto;background:rgba(8,20,41,.95);border:1px solid rgba(255,210,122,.35);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.75;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.tip h2{margin:0 0 8px;font-size:16px;font-weight:600;color:#ffd27a;padding-left:28px;text-wrap:balance}
.tip p{margin:0 0 8px}
.tip .m,.tip b.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.tip p.m{text-align:center;color:var(--accent);font-weight:600}
.tip .note{color:var(--muted);font-size:13px}
.tip .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;direction:ltr;justify-content:flex-end}
.tip .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.tip .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.tip .x:hover{color:var(--ink)}
</style>

<body>
<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="بطارية ومفتاح وملف ذو قلب حديدي، ومصباح نيون يوصل على التوازي مع الملف، وكل الأسلاك توصل يدوياً"></canvas>
  <button class="tipbtn" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
  <div class="tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
  <button class="fs" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<script>
(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
/* circuit constants (SI) */
const C_STRAY=2e-6,R_COIL=10,R_INT=0.5,R_LEAK=2e4,R_LAMP=100,V_STRIKE=80,V_MAINT=60,V_OFF=55,L_AIR=0.5,L_CORE=10,VMAX=12;
const S={E:9,sw:false,i:0,v:0,lampOn:false,iLamp:0,glow:0,simT:0,openT:-1,I0:0,L0:L_AIR,peak:0,lit:0,emf:0,spark:0,conn:false,sparkAtSw:false,wiredAtOpen:false,bySwitch:false};
let W=0,H=0,DPR=1,narrow=null,P={},col={},time=0,drag=null,hover=null,placed=false;
const fit={z:1,ox:0,oy:0},cam={z:1,x:0,y:0};
const core={x:0,y:0,len:0,hh:0,onAxis:true};
const clips={a:{port:null,x:0,y:0},b:{port:null,x:0,y:0}};   // lamp leads: a = left electrode, b = right electrode
const ph={a:0,b:0,neg:0,pos:0};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

function readColors(){const cs=getComputedStyle(document.documentElement);
  ['deep','navy','glow','ink','muted','pos','neg','field','accent','neon','warn','wire-p','wire-n','copper'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- geometry: every part has its own world position; the view pans and zooms without limits ---------- */
let WW=1000,WH=620;
function layout(){
  const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;
  W=nw;H=nh;DPR=window.devicePixelRatio||1;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const nn=W<760||W<H*0.95,changed=nn!==narrow;narrow=nn;
  if(changed&&!placed){
    if(!narrow){WW=1000;WH=630;Object.assign(P,{cx:500,cy:300,Lc:320,rc:48});P.bat={x:395,y:470,w:210,h:112};P.lamp={x:500,y:98};}
    else{WW=440;WH=740;Object.assign(P,{cx:220,cy:330,Lc:290,rc:42});P.bat={x:130,y:520,w:180,h:108};P.lamp={x:220,y:134};}
    core.len=P.Lc+50;core.hh=P.rc*0.6;core.onAxis=true;core.x=P.cx;core.y=P.cy;
    ['a','b'].forEach((n,j)=>{if(!clips[n].port){clips[n].x=P.lamp.x+(j?72:-72);clips[n].y=P.lamp.y+96;}});
    const m=12;fit.z=Math.min((W-m*2)/WW,(H-m*2)/WH);fit.ox=(W-WW*fit.z)/2;fit.oy=(H-WH*fit.z)/2;}
  derive();
}
function derive(){
  P.x1=P.cx-P.Lc/2+10;P.x2=P.cx+P.Lc/2-10;P.pt=P.cy-P.rc-26;P.pb=P.cy+P.rc+24;
  const b=P.bat;P.tm={x:b.x+b.w*0.26,y:b.y-17};P.tp={x:b.x+b.w*0.74,y:b.y-17};
  P.knob={x:b.x+38,y:b.y+b.h-36,r:19};P.lcd={x:b.x+72,y:b.y+b.h-50,w:b.w-88,h:28};
}
function portPos(p){return p==='Lt'?{x:P.x1,y:P.pt}:{x:P.x2,y:P.pt};}
function term(t){
  switch(t){case'B+':return{x:P.tp.x,y:P.tp.y,dx:0,dy:-1};case'B-':return{x:P.tm.x,y:P.tm.y,dx:0,dy:-1};
    case'Lb':return{x:P.x1,y:P.pb,dx:0,dy:1};default:return{x:P.x2,y:P.pb,dx:0,dy:1};}}
function clipTip(n){const c=clips[n];return c.port?portPos(c.port):{x:c.x,y:c.y};}
function coreFrac(){if(!core.onAxis)return 0;const a=Math.max(core.x-core.len/2,P.cx-P.Lc/2),b=Math.min(core.x+core.len/2,P.cx+P.Lc/2);return clamp((b-a)/P.Lc,0,1);}
const Lval=()=>L_AIR+(L_CORE-L_AIR)*coreFrac();
const lampWired=()=>clips.a.port&&clips.b.port&&clips.a.port!==clips.b.port;

/* the battery, switch and coil are wired in series for you: + → switch → right end of the coil → left end → − */

/* ---------- physics: coil (L, R) driven by the battery when the loop is closed; neon lamp and stray C across its ends ----------
   v = V(right end) − V(left end); i = coil current flowing in at the right end */
function step(dt){
  const conn=S.sw;
  if(S.conn&&!conn){S.openT=S.simT;S.I0=Math.abs(S.i);S.L0=Lval();S.peak=0;S.lit=0;S.wiredAtOpen=!!lampWired();S.bySwitch=true;}
  S.conn=conn;
  const n=Math.min(4000,Math.ceil(dt/2e-5)),h=dt/n,L=Lval(),lw=lampWired();
  let vmax=0,emfMax=0;
  for(let k=0;k<n;k++){
    if(conn){S.v=S.E-R_INT*S.i;S.lampOn=false;S.iLamp=0;}
    else{
      if(lw){if(!S.lampOn&&Math.abs(S.v)>=V_STRIKE)S.lampOn=true;else if(S.lampOn&&Math.abs(S.v)<V_OFF)S.lampOn=false;}else S.lampOn=false;
      S.iLamp=S.lampOn?Math.sign(S.v)*Math.max(0,Math.abs(S.v)-V_MAINT)/R_LAMP:0;
      S.v+=-(S.i+S.iLamp+S.v/R_LEAK)/C_STRAY*h;
      S.peak=Math.max(S.peak,Math.abs(S.v));if(S.lampOn)S.lit+=h;}
    const emf=S.v-R_COIL*S.i;S.i+=emf/L*h;
    S.glow+=20*Math.abs(S.iLamp)*h;
    if(Math.abs(S.v)>Math.abs(vmax))vmax=S.v;if(Math.abs(emf)>Math.abs(emfMax))emfMax=emf;}
  S.glow*=Math.exp(-dt/0.1);S.simT+=dt;S.emf=emfMax;
  S.spark=(!conn&&!S.lampOn&&S.bySwitch)?clamp((Math.abs(vmax)-250)/900,0,1):0;
  const sp=c=>Math.abs(c)>0.004?(30+150*Math.min(1,Math.abs(c)/0.9)):0;
  const ib=conn?S.i:0;ph.neg+=sp(ib)*dt;ph.pos+=sp(ib)*dt;
  ph.a+=sp(S.iLamp)*dt;ph.b+=sp(S.iLamp)*dt;
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,o={}){ctx.font=o.font||'600 13px system-ui, Tahoma, sans-serif';ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function signMark(x,y,r){ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.2,r*0.24);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-r*0.5,y);ctx.lineTo(x+r*0.5,y);ctx.stroke();}
function pulseRing(x,y,r,color,p){const pu=RM?0.5:0.5+0.5*Math.sin(time*5+(p||0));ctx.beginPath();ctx.arc(x,y,r+pu*5,0,7);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function strokePts(pts){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}
function rounded(pts,r){const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){const a=pts[i-1],c=pts[i],b=pts[i+1];const da=Math.hypot(a.x-c.x,a.y-c.y),db=Math.hypot(b.x-c.x,b.y-c.y);if(da<1||db<1){out.push(c);continue;}
    const k=Math.min(r,da/2,db/2),p1={x:c.x+(a.x-c.x)/da*k,y:c.y+(a.y-c.y)/da*k},p2={x:c.x+(b.x-c.x)/db*k,y:c.y+(b.y-c.y)/db*k};
    for(let j=0;j<=6;j++){const t=j/6,u=1-t;out.push({x:u*u*p1.x+2*u*t*c.x+t*t*p2.x,y:u*u*p1.y+2*u*t*c.y+t*t*p2.y});}}
  out.push(pts[pts.length-1]);return out;}
function bezPts(p){const o=[];for(let i=0;i<=40;i++){const t=i/40,u=1-t;o.push({x:u*u*u*p[0].x+3*u*u*t*p[1].x+3*u*t*t*p[2].x+t*t*t*p[3].x,y:u*u*u*p[0].y+3*u*u*t*p[1].y+3*u*t*t*p[2].y+t*t*t*p[3].y});}return o;}
function measure(pts){const len=[0];for(let i=1;i<pts.length;i++)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));return{pts,len,L:len[len.length-1]};}
function at(pl,s){const{pts,len}=pl;let i=1;while(i<len.length-1&&len[i]<s)i++;const f=(s-len[i-1])/((len[i]-len[i-1])||1);
  return{x:pts[i-1].x+(pts[i].x-pts[i-1].x)*f,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*f};}
function electrons(pts,phase,forward,alpha){const pl=measure(pts),gap=22;if(pl.L<20)return;ctx.globalAlpha=alpha;
  const o=((phase%gap)+gap)%gap;for(let s=o;s<pl.L-4;s+=gap){if(s<6)continue;const q=at(pl,forward?s:pl.L-s);
    ctx.beginPath();ctx.arc(q.x,q.y,4.4,0,7);ctx.fillStyle=col.neg;ctx.fill();signMark(q.x,q.y,4.2);}ctx.globalAlpha=1;}

function setView(){ctx.setTransform(DPR*cam.z*fit.z,0,0,DPR*cam.z*fit.z,DPR*(cam.z*fit.ox+cam.x),DPR*(cam.z*fit.oy+cam.y));}
const w2s=(x,y)=>({x:cam.z*(fit.z*x+fit.ox)+cam.x,y:cam.z*(fit.z*y+fit.oy)+cam.y});
function drawBg(){ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(W*0.55,H*0.42,0,W*0.55,H*0.42,Math.max(W,H)*0.75);g.addColorStop(0,col.glow);g.addColorStop(0.55,col.navy);g.addColorStop(1,col.deep);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const hh=ctx.createRadialGradient(W*0.5,-H*0.1,0,W*0.5,-H*0.1,H*0.7);hh.addColorStop(0,'rgba(255,255,255,0.10)');hh.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=hh;ctx.fillRect(0,0,W,H);
  if(S.glow>0.01){const b=Math.sqrt(Math.min(1,S.glow));const sp=w2s(P.lamp.x,P.lamp.y),R=Math.max(W,H)*0.55;const lg=ctx.createRadialGradient(sp.x,sp.y,0,sp.x,sp.y,R);
    lg.addColorStop(0,`rgba(255,138,61,${0.30*b})`);lg.addColorStop(1,'rgba(255,138,61,0)');ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);}
  setView();}

/* ---------- fixed battery wires (they re-route when you move the battery or the coil); the knife switch sits on the red one ---------- */
const SWH=28;
let SWP={x:0,y:0,ang:0};
function route(T,Q,far){const lo=P.cx-P.Lc/2-24,ro=P.cx+P.Lc/2+24;
  if(T.y-60>Q.y){const ym=lerp(Q.y,T.y,far?0.36:0.64);return[T,{x:T.x,y:ym},{x:Q.x,y:ym},Q];}
  const yb=Q.y+(far?64:42),rise=far?22:44,sx=T.x<P.cx?lo-(far?44:22):ro+(far?44:22);
  return[T,{x:T.x,y:T.y-rise},{x:sx,y:T.y-rise},{x:sx,y:yb},{x:Q.x,y:yb},Q];}
function wireRaw(){const fp=Math.abs(P.x2-P.tp.x)>=Math.abs(P.x1-P.tm.x);
  return{neg:route(P.tm,{x:P.x1,y:P.pb},!fp),pos:route(P.tp,{x:P.x2,y:P.pb},fp)};}
function subPath(pl,s0,s1){const o=[at(pl,s0)];for(let i=1;i<pl.pts.length-1;i++)if(pl.len[i]>s0&&pl.len[i]<s1)o.push(pl.pts[i]);o.push(at(pl,s1));return o;}
function wires(){const r=wireRaw(),neg=rounded(r.neg,12),posFull=rounded(r.pos,12),pl=measure(posFull);
  let best=-1,mid=null;for(let i=1;i<r.pos.length;i++){const a=r.pos[i-1],b=r.pos[i],d=Math.hypot(b.x-a.x,b.y-a.y)+(Math.abs(a.y-b.y)<1?40:0);if(d>best){best=d;mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};}}
  let sm=pl.L/2,bd=1e9;for(let s=0;s<=pl.L;s+=2){const q=at(pl,s),d=Math.hypot(q.x-mid.x,q.y-mid.y);if(d<bd){bd=d;sm=s;}}
  const h=SWH+8;sm=clamp(sm,h+10,Math.max(h+10,pl.L-h-10));
  const q=at(pl,sm),q2=at(pl,Math.min(pl.L,sm+4)),q1=at(pl,Math.max(0,sm-4));let ang=Math.atan2(q2.y-q1.y,q2.x-q1.x);
  if(ang>Math.PI/2)ang-=Math.PI;else if(ang<=-Math.PI/2)ang+=Math.PI;
  SWP={x:q.x,y:q.y,ang};return{neg,posA:subPath(pl,0,sm-h),posB:subPath(pl,sm+h,pl.L)};}
function wireStroke(pts,color,outline){ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=7;ctx.save();ctx.translate(0,3);strokePts(pts);ctx.restore();
  if(outline){ctx.strokeStyle='rgba(220,230,245,.6)';ctx.lineWidth=7;strokePts(pts);}
  ctx.strokeStyle=color;ctx.lineWidth=4.5;strokePts(pts);
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1.2;ctx.save();ctx.translate(-0.8,-1);strokePts(pts);ctx.restore();}
function drawWires(){const w=wires();
  wireStroke(w.neg,col['wire-n'],true);wireStroke(w.posA,col['wire-p']);wireStroke(w.posB,col['wire-p']);
  // electrons leave the − terminal, pass through the coil from left to right and return to +
  if(S.conn&&Math.abs(S.i)>0.004){const al=Math.min(1,Math.abs(S.i)/0.15),f=S.i>0;electrons(w.neg,ph.neg,f,al);electrons(w.posA,ph.pos,!f,al);electrons(w.posB,ph.pos,!f,al);}
  [[P.x1,col['wire-n']],[P.x2,col['wire-p']]].forEach(([x,c])=>{ctx.beginPath();ctx.arc(x,P.pb,8.5,0,7);ctx.strokeStyle=c;ctx.lineWidth=4;ctx.stroke();});
  drawSwitch();}

/* ---------- knife switch (on the red wire) ---------- */
function drawSwitch(){const s=SWP,h=SWH,lit=hover==='sw',on=S.sw;
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.ang);
  rr(-h-14,-4,2*h+28,16,5);ctx.fillStyle='#4a3524';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();
  [-h-6,h+6].forEach(x=>{ctx.beginPath();ctx.arc(x,0,6,0,7);ctx.fillStyle='#cfd7e3';ctx.fill();ctx.strokeStyle='#5d6880';ctx.lineWidth=1.3;ctx.stroke();});
  ctx.fillStyle='#aab3c2';rr(h-3,-14,3,12,1);ctx.fill();rr(h+1,-14,3,12,1);ctx.fill();
  const a=on?0:-0.62,len=2*h+2,tip={x:-h+Math.cos(a)*len,y:-4+Math.sin(a)*len};
  ctx.strokeStyle=lit?col.accent:'#e3e8ef';ctx.lineWidth=4.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-h,-4);ctx.lineTo(tip.x,tip.y);ctx.stroke();
  ctx.save();ctx.translate(-h,-4);ctx.rotate(a);rr(len-4,-10,10,13,4);ctx.fillStyle='#1f2738';ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(-h,-4,4.5,0,7);ctx.fillStyle='#8792a6';ctx.fill();
  if(S.spark>0){ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(190,220,255,${0.5+0.5*S.spark})`;ctx.lineWidth=2;

  const coreTxt=f>0.5?'القلب الحديدي داخل الملف':'القلب الحديدي خارج الملف';
  if(S.conn){const rising=S.i<0.97*Imax;
    return{t:lw?'لحظة غلق المفتاح: لماذا لا يتوهج المصباح؟':'غلق الدارة: تنامي التيار في الملف',b:`${lw?`<p>فرق جهد البطارية ${S.E.toFixed(1)} V فقط، ومصباح النيون يحتاج نحو 80 V ليتوهج، فلا يتوهج.</p>`:'<p class="note">لم توصل المصباح بعد: اسحب ملقطيه إلى الطرفين العلويين للملف ليصبح على التوازي معه.</p>'}<p>والتيار لا يقفز إلى قيمته الثابتة دفعة واحدة، بل ${rising?'<b>يتنامى الآن</b>':'تنامى'} من الصفر تدريجياً، لأن تغيّر التيار يغيّر الفيض المغناطيسي في الملف فتتولد فيه قوة دافعة كهربائية محتثة ذاتية تعاكس المسبب لها (قانون لنز).</p><p class="m">ε = −L ΔI/Δt</p><p class="note">${coreTxt}، ومعامل الحث الذاتي L = ${L.toFixed(1)} H، وثابت الزمن τ = L/R ≈ ${tau.toFixed(2)} s. الآن افتح المفتاح.</p><div class="nums"><span>I = ${Math.abs(S.i).toFixed(3)} A</span><span>I_max = ${Imax.toFixed(3)} A</span><span>ε = ${Math.abs(S.emf).toFixed(2)} V</span></div>`};}
  if(S.openT>=0&&S.I0>0.01){const E=0.5*S.L0*S.I0*S.I0;
    if(!S.wiredAtOpen)return{t:'لحظة فتح الدارة',b:`<p>انقطع التيار فجأة فتولدت على طرفي الملف قوة دافعة محتثة ذاتية كبيرة جداً بلغت نحو ${S.peak.toFixed(0)} V${S.bySwitch?'، فقفزت شرارة بين طرفي المفتاح':''}.</p><p>صل مصباح النيون على التوازي مع الملف وكرر التجربة لترى أثر هذه القوة الدافعة.</p>`};
    const bright=S.lit>0.03;
    return{t:'لحظة فتح المفتاح: لماذا توهج المصباح برهة؟',b:`<p>عند فتح ${S.bySwitch?'المفتاح':'الدارة'} هبط التيار من ${S.I0.toFixed(2)} A إلى الصفر خلال زمن قصير جداً، فكان المعدل الزمني لتغيّر التيار ΔI/Δt كبيراً جداً.</p><p class="m">ε = −L ΔI/Δt</p><p>لذلك تولدت على طرفي الملف قوة دافعة كهربائية محتثة ذاتية كبيرة المقدار (بلغت ${S.peak.toFixed(0)} V هنا) تفوق 80 V، فتوهج المصباح. والإشارة السالبة تعني أنها تعاكس تناقص التيار، فينعكس قطبا الملف ويتوهج قطب المصباح المقابل.</p><p>يعمل الملف هنا كمصدر طاقة: الطاقة المختزنة في مجاله المغناطيسي <b class="m">½LI² = ${(E*1000).toFixed(0)} mJ</b> هي التي جهزت المصباح بالطاقة.</p>${bright?'':`<p class="note">التوهج ${S.lit>0?'خافت وقصير جداً':'لم يحدث تقريباً'} لأن ${S.L0<5?'القلب الحديدي كان خارج الملف فصار L صغيراً والطاقة المختزنة قليلة':'التيار كان صغيراً'}. أعد القلب وكرر التجربة.</p>`}<div class="nums"><span>L = ${S.L0.toFixed(1)} H</span><span>I₀ = ${S.I0.toFixed(2)} A</span><span>|ε|max = ${S.peak.toFixed(0)} V</span><span>t_glow = ${(S.lit*1000).toFixed(0)} ms</span></div>`};}
  return{t:'ابدأ التجربة',b:`<p>البطارية والمفتاح والملف موصولة على التوالي كما في الشكل (48).</p><p><b>1.</b> صل مصباح النيون على التوازي مع الملف: اسحب ملقطيه إلى الطرفين العلويين للملف.</p><p><b>2.</b> أغلق المفتاح (انقر ذراعه على السلك الأحمر) وانتظر حتى يثبت التيار، ثم افتحه ولاحظ المصباح.</p><p class="note">يمكنك سحب البطارية أو الملف أو المصباح كلاً على حدة، وسحب القلب الحديدي خارج الملف. اسحب المساحة الفارغة لتحريك المشهد، وكبّر بإصبعين أو بعجلة الفأرة.</p>`};
};

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;if(!W)layout();if(W){step(dt);draw();}requestAnimationFrame(frame);}
readColors();layout();new ResizeObserver(()=>layout()).observe(cv);requestAnimationFrame(frame);
})();

(function(){const b=document.getElementById('fsBtn'),ico=document.getElementById('fsIco'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const t=document.createElement('div');t.className='toast';t.hidden=true;t.textContent='ملء الشاشة غير متاح هنا. افتح الملف أو الرابط بالمتصفح';document.querySelector('.stage').appendChild(t);
  let tm=0;const toast=()=>{t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>t.hidden=true,3200);};
  const sync=()=>{ico.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');b.setAttribute('aria-label',isFs()?'الخروج من ملء الشاشة':'ملء الشاشة');};
  b.addEventListener('click',()=>{if(isFs()){try{exit.call(document);}catch(e){}return;}
    if(!req||document.fullscreenEnabled===false){toast();return;}
    try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(toast);setTimeout(()=>{if(!isFs())toast();},700);}catch(e){toast();}});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);})();

(function(){const b=document.getElementById('tipBtn'),p=document.getElementById('tipPanel'),t=document.getElementById('tipTitle'),body=document.getElementById('tipBody');
  let iv=0,last='';
  const fill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===last)return;last=h;t.textContent=r.t;body.innerHTML=r.b;};
  const open=v=>{p.hidden=!v;b.setAttribute('aria-expanded',v);b.classList.toggle('on',v);clearInterval(iv);if(v){last='';fill();iv=setInterval(fill,400);}};
  b.addEventListener('click',()=>open(p.hidden));document.getElementById('tipClose').addEventListener('click',()=>open(false));})();
</script>
