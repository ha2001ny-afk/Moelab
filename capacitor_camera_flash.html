<style>
/* Layout: one full-screen navy lab bench; the Figure 32 flash circuit on a large board, camera control unit and capacitor tray below it */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --pos:#ff6b6b; --neg:#5eaaff; --field:#62d98a; --force:#ffab5c; --accent:#7fd3ff;
  --wire-p:#e94848; --wire-n:#1b2029; --plate:#8593a9; --warn:#ffc04d; --lamp:#ffd27a; --res:#2aa58f;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body);margin:0}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}

.hdr{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:calc(100% - 84px - env(safe-area-inset-left,0px));display:flex;gap:14px;align-items:flex-start;pointer-events:none}
.hdr>*{pointer-events:auto}
.hbtns{display:flex;flex-direction:column;gap:7px;flex:none}
.hbtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;min-width:126px;border-radius:10px;border:1px solid var(--line);background:rgba(8,20,41,.62);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;text-align:start}
.hbtn svg{width:17px;height:17px;flex:none;color:var(--accent)}
.hbtn:hover{border-color:var(--accent)}
.hbtn.on{border-color:var(--accent);background:rgba(127,211,255,.14);color:var(--accent)}
.hbtn:focus-visible,.sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.htitle{min-width:0;padding-top:2px}
.eyebrow{display:inline-block;font:600 12px var(--f-display);color:var(--force);background:rgba(255,171,92,.14);border:1px solid rgba(255,171,92,.3);border-radius:999px;padding:1px 10px;letter-spacing:.02em}
.htitle h1{margin:6px 0 0;font:600 20px/1.45 var(--f-display);color:var(--ink);max-width:330px;text-wrap:balance}
@media (max-width:759px){.htitle h1{font-size:15px;line-height:1.5}.hbtn{min-width:118px;font-size:13px;height:34px}}

.lbtns{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.sbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.sbtn:hover{border-color:var(--accent)}
.sbtn svg{width:20px;height:20px}
.sbtn.lamp{color:var(--lamp)}
.sbtn.lamp:hover,.sbtn.lamp.on{border-color:var(--lamp);background:rgba(255,210,122,.14)}
.toast{position:absolute;top:max(110px,calc(env(safe-area-inset-top,0px) + 104px));left:max(10px,env(safe-area-inset-left,0px));max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink)}

.pane{position:absolute;overflow:auto;background:rgba(8,20,41,.95);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.8;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.pane h2{margin:0 0 8px;font:600 16px var(--f-display);padding-left:30px;text-wrap:balance}
.pane p{margin:0 0 8px}
.pane .m,.pane b.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.pane p.m{text-align:center;color:var(--accent);font-weight:600;font-size:15px}
.pane .note{color:var(--muted);font-size:13px}
.pane .hl{color:var(--force);font-weight:600}
.pane .q{color:var(--lamp);font-weight:600}
.pane .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;direction:ltr;justify-content:flex-end}
.pane .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.pane .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.pane .x:hover{color:var(--ink)}
.tip{top:max(110px,calc(env(safe-area-inset-top,0px) + 104px));left:max(10px,env(safe-area-inset-left,0px));width:min(340px,calc(100% - 20px));max-height:calc(100% - 130px);border:1px solid rgba(255,210,122,.35)}
.tip h2{color:var(--lamp)}
.info{right:max(12px,env(safe-area-inset-right,0px));width:min(430px,calc(100% - 24px));border:1px solid rgba(127,211,255,.32)}
.info h2{color:var(--accent)}
.info ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.info ul li{display:flex;gap:10px;align-items:flex-start}
.info ul li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:10px}
.info ol{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.info ol li{display:flex;gap:10px;align-items:flex-start}
.info .ck{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 13px var(--f-mono);color:var(--muted);margin-top:2px}
.info li.ok .ck{background:var(--field);border-color:var(--field);color:#062012}
.info li.ok>div{color:var(--muted)}
.info .fig{color:var(--accent);font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;font-size:12.5px}
.info .reset{margin-top:12px;font:600 13px var(--f-body);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:6px 14px;cursor:pointer}
.info .reset:hover{border-color:var(--accent)}
.info .box{border:1px solid rgba(255,171,92,.35);background:rgba(255,171,92,.08);border-radius:10px;padding:8px 12px;margin:8px 0}
.info .box p:last-child{margin:0}
.tbl{overflow-x:auto;margin:6px 0}
.tbl table{border-collapse:collapse;width:100%;direction:ltr;font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600}
body.imm .hdr,body.imm #tipBtn{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="دائرة المصباح الومضي في آلة التصوير: بطارية ومنظومة رفع الجهد ومتسعة وزر التقاط ومصباح ومضي"></canvas>

  <header class="hdr" id="hdr">

      <button class="hbtn" data-p="steps" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>خطوات النشاط</button>
      <button class="hbtn" data-p="concl" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></svg>الاستنتاج</button>

  <div class="pane info" id="infoPanel" hidden role="dialog" aria-labelledby="infoTitle"><button class="x" id="infoClose" aria-label="إغلاق">×</button><h2 id="infoTitle"></h2><div id="infoBody"></div></div>

  <div class="lbtns">
    <button class="sbtn lamp" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
    <button class="sbtn" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="pane tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
</div>

<script>
(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d'),hdr=document.getElementById('hdr');
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
/* physics constants (SI) */
const VBAT=3,PCONV=3,ETA=0.75,RTAP=400,RT=2,VEXT=50,VFIRE=150,VSMIN=100,VSMAX=330;
const CAPS=[{c:100e-6,n:'100 µF'},{c:220e-6,n:'220 µF'},{c:470e-6,n:'470 µF'}];
const TWINC=12,TWIND=3,YC=350,YD=180,QREF=470e-6*330;
const S={on:false,Vset:300,ci:1,V:0,Ic:0,Ibat:0,ephC:0,ephD:0,btn:false,blade:0,kPress:0,flashA:0,msg:null};
const done=[false,false,false];
let fl=null,dTrace=null,dGhost=null,cTrace=null,cGhost=null,wasCharging=false,lastChargeTime=null;
const recs=[];
let W=0,H=0,DPR=1,narrow=false,G={},col={},time=0,drag=null,hover=null;
let placedBoard=false,placedDev=false,placedTray=false;
const cam={z:1,x:0,y:0};
const C=()=>CAPS[S.ci].c;

function readColors(){const cs=getComputedStyle(document.documentElement);
  ['deep','navy','glow','ink','muted','pos','neg','field','accent','wire-p','wire-n','plate','warn','line','force','lamp','res'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtP=w=>w>=1000?(w/1000).toFixed(w>=10000?0:1)+' kW':w.toFixed(1)+' W';
const ready=()=>S.on&&!fl&&S.V>=0.97*S.Vset&&S.V>=VFIRE;

/* ---------- layout ---------- */
function layout(){
  const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;
  W=nw;H=nh;narrow=W<900;
  DPR=window.devicePixelRatio||1;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const hr=hdr.getBoundingClientRect(),sr=cv.getBoundingClientRect(),hb=hr.bottom-sr.top,hl=hr.left-sr.left;
  const dh=128,trW=330,trH=56;let board,dev,tray,hbx=Math.max(hb,narrow?58:0);
  if(!narrow){
    const left=70;let top=30,right=Math.min(W-24,hl-20);
    if(right-left<480){top=hbx+12;right=W-24;}
    const avail=right-left,side=avail>=310+28+trW;
    const BW=clamp(avail,380,780),BH=clamp(H-top-34-dh-(side?24:trH+40),230,440);
    board={x:left+Math.max(0,(avail-BW)/2),y:top,w:BW,h:BH};
    const cx=board.x+BW/2,dy=board.y+BH+34;
    if(side){const tot=310+28+trW;dev={x:cx-tot/2,y:dy,w:310,h:dh};tray={x:dev.x+310+28,y:dy+36,w:trW};}
    else{dev={x:cx-155,y:dy,w:310,h:dh};tray={x:cx-trW/2,y:dy+dh+18,w:trW};}
  }else{
    const BW=Math.min(W-20,640),BH=clamp(Math.min(BW*0.72,H-hbx-12-dh-trH-70),220,380);
    board={x:(W-BW)/2,y:hbx+12,w:BW,h:BH};
    const dw=Math.min(310,BW);
    dev={x:board.x+(BW-dw)/2,y:board.y+BH+30,w:dw,h:dh};
    const tw=Math.min(trW,BW);tray={x:board.x+(BW-tw)/2,y:dev.y+dh+16,w:tw};
  }
  if(!placedBoard)G.board=board;
  if(!placedDev)G.dev=dev;
  if(!placedTray)G.tray=tray;
  parts();
}
function parts(){const b=G.board,x0=b.x,y0=b.y,BW=b.w,BH=b.h;
  const P={yT:y0+52,yB:y0+BH-46,small:BW<520};P.yM=(P.yT+P.yB)/2;const span=P.yB-P.yT;
  P.xL=x0+Math.max(34,BW*0.08);P.xS=x0+BW*0.19;P.xV1=x0+BW*0.26;P.xV2=x0+BW*0.43;
  P.xC=x0+BW*0.57;P.xK=x0+BW*0.73;P.xT=x0+BW*0.885;
  P.ch=Math.min(50,span*0.27);P.bTop=P.yM-P.ch-6;P.bBot=P.yM+P.ch;
  P.gap=clamp(span*0.09,14,22);P.pw=Math.min(40,BW*0.065);
  P.th=Math.min(48,span*0.3);P.hc=Math.min(42,span*0.28);
  G.P=P;
  const d=G.dev,row=d.y+82;
  G.D={row,sw:{x:d.x+16,y:row-12,w:52,h:24},knob:{x:d.x+106,y:row,r:17},lcd:{x:d.x+136,y:row-17,w:84,h:34},led:{x:d.x+238,y:row},sh:{x:d.x+d.w-36,y:row,r:22}};
}

/* ---------- physics ---------- */
function step(dt){
  let charging=false;
  if(fl){ // discharge through the flash tube, shown 1000x slower (1 s on screen = 1 ms)
    fl.t+=dt;const tau=RT*fl.C*1000;
    S.V=Math.max(VEXT,fl.V0*Math.exp(-fl.t/tau));
    const I=S.V>VEXT?S.V/RT:0;
    if(fl.t<=TWIND)dTrace.pts.push([Math.min(fl.t,fl.tEnd),I]);
    S.Ic=0;S.Ibat=0;
    S.flashA=Math.max(S.flashA*Math.exp(-dt*6),(RM?0.25:0.85)*clamp((S.V*S.V/RT)/(VSMAX*VSMAX/RT),0,1)*(I>0?1:0));
    if(fl.t>=fl.tEnd){S.V=VEXT;dTrace.pts.push([fl.tEnd,0]);
      const E=0.5*fl.C*(fl.V0*fl.V0-VEXT*VEXT);
      recs.push({C:fl.C,V0:fl.V0,E,Ipk:fl.V0/RT,tEnd:fl.tEnd,Pavg:E/(fl.tEnd/1000),tc:fl.tc});if(recs.length>6)recs.shift();
      done[1]=true;
      if(recs.length>=2){const a=recs[recs.length-1];if(recs.some(r=>r!==a&&(r.C!==a.C||Math.abs(r.V0-a.V0)>15)))done[2]=true;}
      fl=null;}
  }else{
    S.flashA*=Math.exp(-dt*6);
    if(S.on&&S.V<S.Vset-0.01){charging=true;
      const Ic=Math.min(PCONV/Math.max(S.V,5),(S.Vset-S.V)/RTAP);S.Ic=Ic;S.V=Math.min(S.Vset,S.V+Ic*dt/C());
      S.Ibat=Math.max(S.V*Ic,0.6)/ETA/VBAT;}
    else{S.Ic=0;S.Ibat=S.on?0.02:0;}
  }
  // charging curve
  if(charging&&!wasCharging&&S.Vset-S.V>5){if(cTrace&&cTrace.pts.length>5)cGhost=cTrace;cTrace={t:0,pts:[[0,S.V]],Vset:S.Vset,readyAt:null};}
  if(cTrace&&!fl&&S.on&&cTrace.t<TWINC&&(charging||cTrace.pts[cTrace.pts.length-1][1]<cTrace.Vset-0.5)){cTrace.t+=dt;cTrace.pts.push([cTrace.t,S.V]);}
  if(cTrace&&cTrace.readyAt==null&&S.V>=0.97*S.Vset&&S.V>=VFIRE&&S.on){cTrace.readyAt=cTrace.t;lastChargeTime=cTrace.t;done[0]=true;}
  if(ready())done[0]=true;
  wasCharging=charging;
  const ts=S.on?0:-0.62;S.blade+=(ts-S.blade)*Math.min(1,dt*14);
  const kt=(fl||S.btn)?1:0;S.kPress+=(kt-S.kPress)*Math.min(1,dt*20);
  if(S.Ibat>0.05)S.ephC+=(30+70*clamp(S.Ibat/1.3,0,1))*dt;
  if(fl)S.ephD+=(120+380*clamp(S.V/VSMAX,0,1))*dt;
  if(S.msg){S.msg.t-=dt;if(S.msg.t<=0)S.msg=null;}
}
function shutter(){
  if(fl)return;
  if(S.V<VFIRE){S.msg={text:S.V<5?'لا يتوهج المصباح: المتسعة غير مشحونة':'لا يتوهج المصباح: جهد المتسعة أقل من 150 V فلا يتأين غاز الزينون',t:3,color:col.warn};lastFail=time;return;}
  const tau=RT*C()*1000;
  if(dTrace&&dTrace.pts.length>3)dGhost=dTrace;
  fl={V0:S.V,C:C(),t:0,tEnd:tau*Math.log(S.V/VEXT),tc:cTrace&&cTrace.readyAt!=null?cTrace.readyAt:null};
  dTrace={V0:S.V,C:C(),pts:[[0,S.V/RT]]};
}
let lastFail=-99;

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,o={}){ctx.font=o.font||'600 13px system-ui, Tahoma, sans-serif';ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
function rich(parts,x,y,o={}){const f=o.font||'600 14px ui-monospace, Menlo, Consolas, monospace',fs=o.sub||'600 10px ui-monospace, Menlo, Consolas, monospace';
  ctx.direction='ltr';ctx.textBaseline='middle';let w=0;parts.forEach(p=>{ctx.font=p[1]?fs:f;w+=ctx.measureText(p[0]).width;});
  let cx=o.align==='left'?x:o.align==='right'?x-w:x-w/2;ctx.fillStyle=o.color||col.ink;ctx.textAlign='left';
  parts.forEach(p=>{ctx.font=p[1]?fs:f;ctx.fillText(p[0],cx,y+(p[1]?4:0));cx+=ctx.measureText(p[0]).width;});return w;}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function signMark(x,y,r,positive){ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.3,r*0.22);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-r*0.5,y);ctx.lineTo(x+r*0.5,y);if(positive){ctx.moveTo(x,y-r*0.5);ctx.lineTo(x,y+r*0.5);}ctx.stroke();}
function charge(x,y,r,positive){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=positive?col.pos:col.neg;ctx.fill();signMark(x,y,r,positive);}
function pulseRing(x,y,r,color,ph){const pu=0.5+0.5*Math.sin(time*5+(ph||0));ctx.beginPath();ctx.arc(x,y,r+pu*5,0,7);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function pulseRect(x,y,w,h,color){const pu=0.5+0.5*Math.sin(time*5),e=3+pu*4;rr(x-e,y-e,w+2*e,h+2*e,10);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function strokePts(pts){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}
function measure(pts){const len=[0];for(let i=1;i<pts.length;i++)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));return{pts,len,L:len[len.length-1]};}
function at(pl,s){const{pts,len}=pl;let i=1;while(i<len.length-1&&len[i]<s)i++;const f=(s-len[i-1])/((len[i]-len[i-1])||1);return{x:pts[i-1].x+(pts[i].x-pts[i-1].x)*f,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*f};}
function rounded(pts,r){const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){const a=pts[i-1],c=pts[i],b=pts[i+1],rc=c.r!=null?c.r:r;
    const da=Math.hypot(a.x-c.x,a.y-c.y),db=Math.hypot(b.x-c.x,b.y-c.y);if(da<1||db<1||rc<=0){out.push(c);continue;}
    const k=Math.min(rc,da/2,db/2),p1={x:c.x+(a.x-c.x)/da*k,y:c.y+(a.y-c.y)/da*k},p2={x:c.x+(b.x-c.x)/db*k,y:c.y+(b.y-c.y)/db*k};
    for(let j=0;j<=6;j++){const t=j/6,u=1-t;out.push({x:u*u*p1.x+2*u*t*c.x+t*t*p2.x,y:u*u*p1.y+2*u*t*c.y+t*t*p2.y});}}
  out.push(pts[pts.length-1]);return out;}

/* what the student should touch next */
function hint(){
  if(fl)return null;
  if(!done[0])return S.on?(S.Vset<VFIRE?'knob':null):'S';
  if(!done[1])return ready()?'shutter':(S.on?(S.Vset<VFIRE?'knob':null):'S');
  if(!done[2]){const last=recs[recs.length-1];
    if(last&&last.C===C()&&Math.abs(last.V0-S.V)<15&&Math.abs(S.Vset-last.V0)<15)return'vary';
    if(ready())return'shutter';return S.on?(S.Vset<VFIRE?'knob':null):'S';}
  return null;}

function wirePolys(){const P=G.P,pl=P.yM-P.gap-7,pb=P.yM+P.gap+7;return[

function ePaths(){const P=G.P,pl=P.yM-P.gap-7,pb=P.yM+P.gap+7;

  ctx.beginPath();ctx.arc(h.x,h.y+(pr?1.5:0),h.r-5,0,7);ctx.fillStyle=ig;ctx.fill();
  ctx.strokeStyle=hover==='sh'?col.accent:'rgba(0,0,0,.3)';ctx.lineWidth=1.4;ctx.stroke();

/* ---------- capacitor tray ---------- */
function capIcon(cx,cy,s){const g=ctx.createLinearGradient(cx-s*0.4,0,cx+s*0.4,0);g.addColorStop(0,'#1d4a7a');g.addColorStop(0.5,'#3a78b8');g.addColorStop(1,'#163a62');
  rr(cx-s*0.4,cy-s*0.6,s*0.8,s*1.2,3);ctx.fillStyle=g;ctx.fill();ctx.fillStyle='#c3cddc';ctx.fillRect(cx-s*0.4,cy-s*0.6,s*0.8,2.5);
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(cx+s*0.18,cy-s*0.45,2,s*0.9);}
function drawTray(){const t=G.tray,hk=hint(),gap=8,tw=(t.w-2*gap)/3;
  txt('اختر سعة المتسعة',t.x+t.w,t.y+6,{align:'right',font:'600 12px system-ui, Tahoma, sans-serif',color:col.muted});
  CAPS.forEach((c,i)=>{const x=t.x+i*(tw+gap),y=t.y+18,sel=i===S.ci,hv=hover==='tile'+i;

/* ---------- hands-on input ---------- */
const ptrs=new Map();let pinch=null,lastTap=0;
function scr(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
const toWorld=s=>({x:(s.x-cam.x)/cam.z,y:(s.y-cam.y)/cam.z});
const inR=(p,x,y,w,h)=>p.x>x&&p.x<x+w&&p.y>y&&p.y<y+h;
function hit(p){const D=G.D,P=G.P,R=Math.max(16,22/cam.z);
  if(Math.hypot(D.sh.x-p.x,D.sh.y-p.y)<D.sh.r+6)return{type:'sh',key:'sh'};
  const s=D.sw;if(inR(p,s.x-6,s.y-8,s.w+12,s.h+16))return{type:'sw',key:'sw'};
  if(Math.hypot(D.knob.x-p.x,D.knob.y-p.y)<D.knob.r+10)return{type:'knob',key:'knob'};
  const t=G.tray,tw=(t.w-16)/3;for(let i=0;i<3;i++)if(inR(p,t.x+i*(tw+8),t.y+18,tw,34))return{type:'tile',i,key:'tile'+i};
  if(inR(p,t.x,t.y-4,t.w,20))return{type:'tray',key:'tray'};
  if(inR(p,P.xS-24,P.yT-34,48,46))return{type:'bS',key:'bS'};
  if(inR(p,P.xK-24,P.yT-40,48,52))return{type:'bK',key:'bK'};
  const d=G.dev;if(inR(p,d.x-4,d.y-6,d.w+8,d.h+10))return{type:'dev',key:'dev'};
  const bd=G.board;if(inR(p,bd.x,bd.y,bd.w,bd.h))return{type:'board',key:'board'};
  return null;}
function cursorFor(h){if(!h)return'grab';return h.type==='knob'?'ns-resize':['dev','board','tray'].includes(h.type)?'move':'pointer';}
function pickCap(i){if(i===S.ci)return;if(fl){S.msg={text:'انتظر حتى ينتهي التفريغ',t:2,color:col.warn};return;}
  S.ci=i;S.V=0;S.msg={text:'رُكّبت متسعة '+CAPS[i].n+' غير مشحونة',t:2.5,color:col.accent};}

cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);
  const s=scr(e);ptrs.set(e.pointerId,s);
  if(ptrs.size===2){drag=null;S.btn=false;const[a,b]=[...ptrs.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},z0:cam.z,x0:cam.x,y0:cam.y};return;}
  if(ptrs.size>2)return;
  const p=toWorld(s),h=hit(p);
  if(!h){const now=performance.now();if(now-lastTap<320){cam.z=1;cam.x=0;cam.y=0;}lastTap=now;drag={type:'pan',s0:s,x0:cam.x,y0:cam.y};cv.style.cursor='grabbing';return;}
  if(h.type==='sh'||h.type==='bK'){S.btn=true;shutter();drag={type:'btn'};return;}
  if(h.type==='sw'||h.type==='bS'){S.on=!S.on;return;}
  if(h.type==='tile'){drag={type:'tile',i:h.i,s0:s,moved:false,ox:p.x-G.tray.x,oy:p.y-G.tray.y};return;}
  if(h.type==='knob')drag={type:'knob',s0:s,v0:S.Vset};
  else if(h.type==='tray')drag={type:'tray',ox:p.x-G.tray.x,oy:p.y-G.tray.y};
  else if(h.type==='dev')drag={type:'dev',ox:p.x-G.dev.x,oy:p.y-G.dev.y};
  else if(h.type==='board')drag={type:'board',ox:p.x-G.board.x,oy:p.y-G.board.y};
  cv.style.cursor=cursorFor(h);});

cv.addEventListener('pointermove',e=>{const s=scr(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,s);
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const z=clamp(pinch.z0*d/pinch.d0,0.6,4),wx=(pinch.m0.x-pinch.x0)/pinch.z0,wy=(pinch.m0.y-pinch.y0)/pinch.z0;
    cam.z=z;cam.x=mid.x-wx*z;cam.y=mid.y-wy*z;return;}
  const p=toWorld(s);
  if(!drag){const h=hit(p);hover=h?h.key:null;cv.style.cursor=cursorFor(h);return;}
  if(drag.type==='pan'){cam.x=drag.x0+s.x-drag.s0.x;cam.y=drag.y0+s.y-drag.s0.y;return;}
  if(drag.type==='tile'){if(Math.hypot(s.x-drag.s0.x,s.y-drag.s0.y)>6)drag.moved=true;if(drag.moved){G.tray.x=p.x-drag.ox;G.tray.y=p.y-drag.oy;placedTray=true;}}
  else if(drag.type==='tray'){G.tray.x=p.x-drag.ox;G.tray.y=p.y-drag.oy;placedTray=true;}
  else if(drag.type==='dev'){G.dev.x=p.x-drag.ox;G.dev.y=p.y-drag.oy;placedDev=true;parts();}
  else if(drag.type==='board'){G.board.x=p.x-drag.ox;G.board.y=p.y-drag.oy;placedBoard=true;parts();}
  else if(drag.type==='knob'){S.Vset=clamp(Math.round((drag.v0+((s.x-drag.s0.x)-(s.y-drag.s0.y))*1.2)/10)*10,VSMIN,VSMAX);}});

function pointerEnd(e){ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;return;}
  if(!drag)return;
  if(drag.type==='btn')S.btn=false;
  if(drag.type==='tile'&&!drag.moved)pickCap(drag.i);
  drag=null;cv.style.cursor='grab';}
cv.addEventListener('pointerup',pointerEnd);cv.addEventListener('pointercancel',pointerEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();const s=scr(e),f=Math.exp(-e.deltaY*0.0015),z=clamp(cam.z*f,0.6,4),wx=(s.x-cam.x)/cam.z,wy=(s.y-cam.y)/cam.z;
  cam.z=z;cam.x=s.x-wx*z;cam.y=s.y-wy*z;},{passive:false});

/* ---------- shared state for the panels ---------- */

/* ---------- teacher hint (lamp button) ---------- */
window.__explain=function(){
  const Cv=C(),V=S.V,Q=Cv*V,E=0.5*Cv*V*V,cu=(Cv*1e6).toFixed(0);
  const nums=`<div class="nums"><span>C = ${cu} µF</span><span>ΔV = ${V.toFixed(0)} V</span><span>Q = ${(Q*1000).toFixed(1)} mC</span><span>E = ${E.toFixed(1)} J</span></div>`;
  if(fl){const I=V>VEXT?V/RT:0;return{t:'المتسعة تُفرغ شحنتها في المصباح',b:`<p>ضغط زر الالتقاط K وصل صفيحتي المتسعة بالمصباح الومضي، وأرسل نبضة جعلت غاز الزينون موصلاً. تنتقل الإلكترونات الزائدة من الصفيحة B عبر المصباح إلى الصفيحة A فتتعادل الشحنتان، وتتحول الطاقة المختزنة إلى ضوء ساطع.</p><p class="m">I = ΔV / R = ${V.toFixed(0)} / ${RT} = ${I.toFixed(0)} A</p><p class="m">P = ΔV² / R = ${fmtP(V*V/RT)}</p><p class="note">يستغرق التفريغ الحقيقي نحو ${fl.tEnd.toFixed(1)} ms، ويُعرض هنا مبطّأً 1000 مرة لتتمكن من متابعته. R مقاومة الغاز في أثناء التوهج.</p>${nums}`};}
  if(S.msg&&time-lastFail<3)return{t:'لم يتوهج المصباح',b:`<p>جهد المتسعة ${V.toFixed(0)} V، وهو أقل من 150 V اللازمة لتأيين غاز الزينون، فلا يصير الغاز موصلاً ولا تتفرغ المتسعة خلاله.</p><p>شغّل المفتاح S وانتظر حتى يرتفع الجهد ويتوهج مصباح الجاهزية.</p>${nums}`};
  if(!S.on){if(V>5)return{t:'المتسعة تحتفظ بشحنتها',b:`<p>المنظومة مطفأة، ولا يوجد مسار تنتقل فيه الشحنات بين الصفيحتين، فتبقى المتسعة مشحونة وتختزن طاقتها في المجال الكهربائي بين صفيحتيها.</p><p class="m">E = ½ C ΔV² = ${E.toFixed(1)} J</p>${nums}`};
    return{t:'المنظومة مطفأة',b:`<p>المتسعة غير مشحونة. شغّل منظومة الشحن بالمفتاح S (على وحدة التحكم أو على اللوحة) لتبدأ البطارية بشحنها.</p>`};}
  if(S.Vset<VFIRE&&!ready())return{t:'جهد الشحن منخفض',b:`<p>جهد الشحن المضبوط ${S.Vset} V أقل من 150 V اللازمة لتأيين غاز الزينون، فلن يتوهج المصباح. ارفع جهد الشحن بالمقبض الدوّار.</p>${nums}`};
  if(S.Ic>0.0005)return{t:'المتسعة تُشحن',b:`<p>تسحب منظومة رفع الجهد تياراً من البطارية مقداره نحو <b class="m">${S.Ibat.toFixed(2)} A</b> عند <b class="m">3 V</b>، وترفع الجهد لتشحن المتسعة. القدرة الواصلة إلى المتسعة صغيرة (نحو <b class="m">3 W</b>)، لذلك يستغرق الشحن بضع ثوانٍ.</p><p class="m">Q = C ΔV = ${(Q*1000).toFixed(1)} mC</p><p class="m">E = ½ C ΔV² = ${E.toFixed(1)} J</p><p class="note">كلما ارتفع الجهد احتاج كل كولوم إضافي إلى طاقة أكبر، فيتباطأ ارتفاع الجهد قرب نهاية الشحن.</p>${nums}`};
  if(ready()){const Ef=0.5*Cv*(V*V-VEXT*VEXT),tE=RT*Cv*1000*Math.log(V/VEXT);return{t:'المتسعة جاهزة',b:`<p>توهج مصباح الجاهزية: المتسعة مشحونة إلى <b class="m">${V.toFixed(0)} V</b> وتختزن طاقة <b class="m">${E.toFixed(1)} J</b>.</p><p>عند الضغط على زر الالتقاط ستُحرَّر نحو <b class="m">${Ef.toFixed(1)} J</b> خلال <b class="m">${tE.toFixed(1)} ms</b> تقريباً، أي بقدرة متوسطة نحو <b class="m">${fmtP(Ef/(tE/1000))}</b>، في حين لا تزيد قدرة البطارية على بضعة واط.</p><p>اضغط زر الالتقاط K.</p>${nums}`};}
  return{t:'المتسعة مشحونة',b:`<p>جهد المتسعة أعلى من جهد الشحن المضبوط، فتتوقف المنظومة عن الشحن وتحتفظ المتسعة بشحنتها.</p>${nums}`};
};

        mine+=`<p>أكبر ومضة: ${R(b.E.toFixed(1)+' J')} خلال ${R(b.tEnd.toFixed(2)+' ms')}، أي بقدرة متوسطة ${R((b.Pavg/1000).toFixed(1)+' kW')}، وهي أكبر من قدرة البطارية (نحو ${R('4 W')}) بنحو ${R(Math.round(b.Pavg/4).toLocaleString('en')+'')} مرة.</p></div>`;}
      return{t:'نستنتج من النشاط',b:`<p class="q">لماذا لا يُربط المصباح الومضي بالبطارية مباشرة؟</p>
      <p>لأن جهد البطارية ${R('3 V')} لا يكفي لتأيين غاز الزينون، ولأن البطارية تجهز الطاقة بمعدل صغير (بضعة واط) فلا تستطيع إعطاء ضوء ساطع مفاجئ.</p>
      <p class="hl">نستنتج أن المتسعة الموضوعة في منظومة المصباح الومضي تُشحن بوساطة البطارية خلال بضع ثوانٍ، فتختزن الطاقة في المجال الكهربائي بين صفيحتيها، ثم تجهز المصباح بطاقة تكفي لتوهجه بصورة مفاجئة بضوء ساطع في أثناء تفريغها من شحنتها.</p>
      <p class="m">E = ½ C ΔV²</p>
      <p>تُختزن الطاقة ببطء وتُحرَّر خلال نحو جزء من الألف من الثانية، لذلك تكون قدرة الومضة أكبر من قدرة البطارية آلاف المرات:</p>
      <p class="m">P = E / t</p>
      <p class="note">كلما كبرت سعة المتسعة أو جهد شحنها كبرت الطاقة المختزنة فتكون الومضة أسطع، لكن يطول زمن إعادة الشحن.</p>
      <p class="note">يتوقف الغاز عن التوصيل عندما يهبط جهد المتسعة إلى نحو ${R('50 V')}، فيبقى جزء صغير من شحنتها.</p>
      ${mine}`};}};
  let cur=null,iv=0,lastH='';
  const place=()=>{const top=hdr.getBoundingClientRect().bottom-document.querySelector('.stage').getBoundingClientRect().top+10;info.style.top=top+'px';info.style.maxHeight=`calc(100% - ${top+16}px)`;};
  const fill=()=>{if(!cur)return;const r=P[cur](),h=r.t+'|'+r.b;if(h===lastH)return;lastH=h;iT.textContent=r.t;iB.innerHTML=r.b;};
  const openInfo=n=>{cur=cur===n?null:n;btns.forEach(b=>{const on=b.dataset.p===cur;b.classList.toggle('on',on);b.setAttribute('aria-expanded',on);});
    info.hidden=!cur;clearInterval(iv);if(cur){openTip(false);place();lastH='';fill();iv=setInterval(fill,400);}};
  btns.forEach(b=>b.addEventListener('click',()=>openInfo(b.dataset.p)));
  document.getElementById('infoClose').addEventListener('click',()=>openInfo(cur));
  iB.addEventListener('click',e=>{if(e.target.closest('[data-act="reset"]')&&window.__sim){window.__sim.reset();lastH='';fill();}});
  window.addEventListener('resize',()=>{if(cur)place();});
  let tiv=0,tLast='';
  const tfill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===tLast)return;tLast=h;tT.textContent=r.t;tB.innerHTML=r.b;};
  function openTip(v){tip.hidden=!v;tipBtn.setAttribute('aria-expanded',v);tipBtn.classList.toggle('on',v);clearInterval(tiv);if(v){if(cur)openInfo(cur);tLast='';tfill();tiv=setInterval(tfill,400);}}
  tipBtn.addEventListener('click',()=>openTip(tip.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>openTip(false));
})();
</script>
