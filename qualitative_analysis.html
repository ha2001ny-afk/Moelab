function rot(x,y,a){const c=Math.cos(a),s=Math.sin(a);return [x*c-y*s,x*s+y*c]}
function toW(v,x,y){const r=rot(x,y,v.ang);return [v.x+r[0],v.y+r[1]]}
function toL(v,x,y){return rot(x-v.x,y-v.y,-v.ang)}
function clipBelow(P,L){const o=[],n=P.length;for(let i=0;i<n;i++){const a=P[(i+n-1)%n],b=P[i],ai=a[1]>=L,bi=b[1]>=L;if(bi){if(!ai){const t=(L-a[1])/(b[1]-a[1]);o.push([a[0]+(b[0]-a[0])*t,L])}o.push(b)}else if(ai){const t=(L-a[1])/(b[1]-a[1]);o.push([a[0]+(b[0]-a[0])*t,L])}}return o}
function area(P){let s=0;for(let i=0,n=P.length;i<n;i++){const j=(i+1)%n;s+=P[i][0]*P[j][1]-P[j][0]*P[i][1]}return Math.abs(s)/2}
function levelFor(P,A){let lo=1e9,hi=-1e9;for(const p of P){if(p[1]<lo)lo=p[1];if(p[1]>hi)hi=p[1]}if(A<=0)return hi;if(A>=area(P))return lo;for(let i=0;i<22;i++){const m=(lo+hi)/2;if(area(clipBelow(P,m))>A)lo=m;else hi=m}return (lo+hi)/2}
function tubeP(r,h){const P=[[-r,0],[-r,h]];for(let i=1;i<12;i++){const t=Math.PI-i*Math.PI/12;P.push([r*Math.cos(t),h+r*Math.sin(t)])}P.push([r,h],[r,0]);return P}

 const g2=ctx.createLinearGradient(x,y,x,y-36);g2.addColorStop(0,'rgba(25,65,235,.8)');g2.addColorStop(1,'rgba(120,170,255,.5)');ctx.fillStyle=g2;ctx.beginPath();ctx.moveTo(x-6,y);ctx.quadraticCurveTo(x-6,y-20,x,y-36);ctx.quadraticCurveTo(x+6,y-20,x+6,y);ctx.closePath();ctx.fill();
 if(T.lab&&fl){ctx.font='700 13px Segoe UI,Tahoma,sans-serif';ctx.fillStyle=TH.ink;ctx.textAlign='center';ctx.fillText('لون اللهب: '+FLAME[fl.ion][1],x,y-h-12)}}

/* ---------------- microscopic view ---------------- */
const LC={x:800,y:188,r:156};
const radOf=t=>STY[t].sm?7.5:STY[t].big?13:10.5;
function mp(t,x,y,o){return Object.assign({t,x,y,vx:rnd(-20,20),vy:rnd(-20,20),r:radOf(t),st:'f',a:1},o)}
function rpos(){const a=rnd(0,7),d=Math.sqrt(Math.random())*(LC.r-24);return [Math.cos(a)*d,Math.sin(a)*d-10]}
function microBuild(v){micro.v=v;micro.ps=[];micro.cls=[];micro.floor=[];for(let i=0;i<20;i++){const xi=-LC.r+(i+.5)*LC.r/10;micro.floor.push(Math.sqrt(Math.max(0,LC.r*LC.r-xi*xi))-8)}
 if(!micro.water.length)for(let i=0;i<60;i++){const p=rpos();micro.water.push({x:p[0],y:p[1],a:rnd(0,7)})}
 if(!v)return;
 for(const k in v.ions){const n=Math.min(18,Math.round(v.ions[k]*MS));for(let i=0;i<n;i++){const p=rpos();micro.ps.push(mp(k,p[0],p[1]))}}
 for(const k in v.an){const n=Math.min(10,Math.round(v.an[k]*MS));for(let i=0;i<n;i++){const p=rpos();micro.ps.push(mp(AK2MP[k],p[0],p[1],{ak:k}))}}
 for(const k in v.spec){const n=Math.min(16,Math.round(v.spec[k]*MSS));for(let i=0;i<n;i++){const p=rpos();micro.ps.push(mp(k,p[0],p[1],{spec:1}))}}
 const pp={};for(const l of v.sed)pp[l.k]=(pp[l.k]||0)+l.m;for(const g of v.grains)pp[g.k]=(pp[g.k]||0)+g.m;
 for(const k in pp){const mi=PPT[k].mi;let n=Math.min(14,Math.round(pp[k]*MS*1.2));if(n<1)continue;const cl={k,ak:null,x:rnd(-60,60),y:0,members:[],cats:0,ans:0,need:0,set:false,vy:0};for(let i=0;i<n;i++){const t=mi[i%mi.length];const p=mp(t,cl.x,cl.y,{st:'b',cl});cl.members.push(p);micro.ps.push(p)}layout(cl);micro.cls.push(cl);settleNow(cl)}}
function settleNow(cl){for(let k=0;k<400&&!cl.set;k++)clStep(cl,.05)}
function layout(cl){const n=cl.members.length,s=17;const cols=Math.max(1,Math.ceil(Math.sqrt(n*1.4))),rows=Math.ceil(n/cols);cl.members.forEach((p,i)=>{p.ox=(i%cols-(cols-1)/2)*s;p.oy=(Math.floor(i/cols)-(rows-1)/2)*s});cl.w=cols*s;cl.h=rows*s}
function microReagent(rk,lx){const Rg=REAG[rk];micro.acc+=PER*MS;micro.acc2+=PER*MSS;const ex=clamp(lx*3,-50,50);
 while(micro.acc>=1){micro.acc-=1;micro.ps.push(mp(Rg.mp,ex+rnd(-25,25),-LC.r+22,{ak:Rg.ak,vy:rnd(60,90),vx:rnd(-15,15)}))}
 while(micro.acc2>=1){micro.acc2-=1;micro.ps.push(mp(Rg.ctr,ex+rnd(-25,25),-LC.r+22,{spec:1,vy:rnd(50,80)}))}}
function ruleFor(c,a){if(c.st!=='f'||c.spec||!STY[c.t].cat)return null;const r=RULES[c.t]&&RULES[c.t][a.ak];if(!r)return null;if(r.k==='gas'&&!(micro.v&&micro.v.temp>50))return null;return r}
function clStep(cl,dt){if(cl.set)return;cl.vy=Math.min(32,4+cl.members.length*1.5);cl.y+=cl.vy*dt;const lim=LC.r*.72-cl.w/2;cl.x=clamp(cl.x,-Math.max(0,lim),Math.max(0,lim));
 const bw=LC.r/10,i0=clamp(Math.floor((cl.x-cl.w/2+LC.r)/bw),0,19),i1=clamp(Math.floor((cl.x+cl.w/2+LC.r)/bw),0,19);let fy=1e9;for(let i=i0;i<=i1;i++)fy=Math.min(fy,micro.floor[i]);
 if(cl.y+cl.h/2>=fy){cl.y=fy-cl.h/2;cl.set=true;for(let i=i0;i<=i1;i++)micro.floor[i]=cl.y-cl.h/2-1}}
function bind(a,c,r){if(r.k==='redox'){c.t='Fe2';c.r=radOf('Fe2');a.t='S0';a.r=radOf('S0');a.st='b';const cl={k:'S',ak:a.ak,x:a.x,y:a.y,members:[a],cats:0,ans:0,need:0,set:false};a.cl=cl;layout(cl);micro.cls.push(cl);if(Math.random()<.7)micro.ps.push(mp('H',a.x,a.y,{spec:1}));return}
 if(r.k==='gas'){c.t='NH3';c.r=radOf('NH3');c.st='g';c.vy=-40;a.st='x';return}
 let cl=micro.cls.find(q=>!q.set&&q.k===r.p&&Math.hypot(q.x-(a.x+c.x)/2,q.y-(a.y+c.y)/2)<70);
 if(!cl){cl={k:r.p,ak:a.ak,r:r.r,x:(a.x+c.x)/2,y:(a.y+c.y)/2,members:[],cats:0,ans:0,set:false};micro.cls.push(cl)}
 for(const p of [c,a]){p.st='b';p.cl=cl;cl.members.push(p)}cl.cats++;cl.ans++;cl.need=cl.cats*r.r-cl.ans;layout(cl);
 if(a.ak==='S_acid'&&Math.random()<.8)micro.ps.push(mp('H',a.x,a.y,{spec:1,vx:rnd(-30,30)}))}
function join(p,cl){p.st='b';p.cl=cl;cl.members.push(p);if(STY[p.t].cat)cl.cats++;else cl.ans++;cl.need=cl.cats*cl.r-cl.ans;layout(cl)}
function microStep(dt){if(micro.rb>0){micro.rb-=dt;if(micro.rb<=0)microBuild(micro.v)}
 if(!T.micro)return;dt=Math.min(dt,.04);const ps=micro.ps,R=LC.r;
 for(const w of micro.water){w.a+=dt*.6;w.x+=Math.cos(w.a)*dt*6;w.y+=Math.sin(w.a*1.3)*dt*6}
 const free=ps.filter(p=>p.st==='f');
 for(const a of free){if(!a.ak)continue;let best=null,bd=1e9,br=null;
  for(const c of free){if(c===a)continue;const r=ruleFor(c,a);if(!r)continue;const d=Math.hypot(c.x-a.x,c.y-a.y);if(d<bd){bd=d;best=c;br=r}}
  for(const cl of micro.cls){if(cl.set||cl.ak!==a.ak||!(cl.need>.3))continue;const d=Math.hypot(cl.x-a.x,cl.y-a.y)-cl.w/2;if(d<bd){bd=d;best=cl;br=null}}
  if(!best)continue;if(best.members){const dx=best.x-a.x,dy=best.y-a.y,d=Math.hypot(dx,dy)||1;a.vx+=dx/d*170*dt;a.vy+=dy/d*170*dt;if(d<best.w/2+a.r+4)join(a,best)}
  else{const dx=best.x-a.x,dy=best.y-a.y,d=Math.hypot(dx,dy)||1;a.vx+=dx/d*170*dt;a.vy+=dy/d*170*dt;best.vx-=dx/d*60*dt;best.vy-=dy/d*60*dt;if(d<a.r+best.r+1)bind(a,best,br)}}
 for(const c of ps){if(c.st!=='f'||c.spec||c.ak||!STY[c.t].cat)continue;for(const cl of micro.cls){if(cl.set||!(cl.need<-.3))continue;const r=RULES[c.t]&&RULES[c.t][cl.ak];if(!r||r.p!==cl.k)continue;const dx=cl.x-c.x,dy=cl.y-c.y,d=Math.hypot(dx,dy)||1;c.vx+=dx/d*150*dt;c.vy+=dy/d*150*dt;if(d<cl.w/2+c.r+4)join(c,cl);break}}
 for(let i=ps.length-1;i>=0;i--){const p=ps[i];
  if(p.st==='x'){p.a-=dt*2;if(p.a<=0)ps.splice(i,1);continue}
  if(p.st==='g'){p.y+=p.vy*dt;p.x+=Math.sin(now/200+i)*.5;if(p.y<-R+16){p.a-=dt*2;if(p.a<=0)ps.splice(i,1)}continue}
  if(p.st==='b'){const cl=p.cl;p.x=lerp(p.x,cl.x+p.ox,Math.min(1,dt*7));p.y=lerp(p.y,cl.y+p.oy,Math.min(1,dt*7));continue}
  p.vx+=rnd(-1,1)*110*dt;p.vy+=rnd(-1,1)*110*dt;p.vx*=.97;p.vy*=.97;const sp3=Math.hypot(p.vx,p.vy),mxs=p.ak?95:45;if(sp3>mxs){p.vx*=mxs/sp3;p.vy*=mxs/sp3}
  p.x+=p.vx*dt;p.y+=p.vy*dt;const d=Math.hypot(p.x,p.y),lim=R-p.r-5;if(d>lim){p.x*=lim/d;p.y*=lim/d;const nx=p.x/d,ny=p.y/d,dot=p.vx*nx+p.vy*ny;p.vx-=2*dot*nx;p.vy-=2*dot*ny}}
 for(const cl of micro.cls)clStep(cl,dt);
 micro.cls=micro.cls.filter(c=>c.members.length)}
function drawLens(){const c=mx,{x:X0,y:Y0,r:R}=LC,v=micro.v;
 if(v){const tp=toW(v,0,Math.min(v.depth*.75,Math.max(10,v.L-v.y+20)));c.strokeStyle='#8a96a1';c.setLineDash([6,5]);c.lineWidth=1.6;c.beginPath();const ang=Math.atan2(tp[1]-Y0,tp[0]-X0);c.moveTo(X0+Math.cos(ang)*R,Y0+Math.sin(ang)*R);c.lineTo(tp[0],tp[1]);c.stroke();c.setLineDash([]);c.beginPath();c.arc(tp[0],tp[1],v.hw+6,0,7);c.stroke()}
 c.save();c.shadowColor='rgba(20,40,60,.25)';c.shadowBlur=18;c.fillStyle='#fbfdff';c.beginPath();c.arc(X0,Y0,R+9,0,7);c.fill();c.restore();
 c.save();c.beginPath();c.arc(X0,Y0,R,0,7);c.clip();const bg=c.createRadialGradient(X0-40,Y0-50,10,X0,Y0,R);bg.addColorStop(0,'#ffffff');bg.addColorStop(1,'#e6f0f7');c.fillStyle=bg;c.fillRect(X0-R,Y0-R,2*R,2*R);
 c.fillStyle='rgba(150,185,210,.35)';for(const w of micro.water){c.beginPath();c.arc(X0+w.x,Y0+w.y,2.2,0,7);c.arc(X0+w.x+4,Y0+w.y+2,1.4,0,7);c.fill()}
 for(const cl of micro.cls){if(!cl.members.length)continue;c.fillStyle=rgba(PPT[cl.k].c,.45);c.strokeStyle=rgba(shade(PPT[cl.k].c,-.3).replace(/rgb\((\d+),(\d+),(\d+)\)/,(m,a,b,d)=>'#'+[a,b,d].map(n=>(+n).toString(16).padStart(2,'0')).join('')),.6);c.lineWidth=1;rr(c,X0+cl.x-cl.w/2-3,Y0+cl.y-cl.h/2-3,cl.w+6,cl.h+6,6);c.fill();c.stroke()}
 c.textAlign='center';c.textBaseline='middle';c.direction='ltr';
 for(const p of micro.ps){if(p.st==='b')continue;drawIon(c,p,X0,Y0)}
 for(const p of micro.ps){if(p.st==='b')drawIon(c,p,X0,Y0)}
 if(T.lab){c.font='700 11px Segoe UI,Tahoma,sans-serif';c.fillStyle='#1c2733';for(const cl of micro.cls){if(cl.members.length>1)c.fillText(PPT[cl.k].f+'(s)',X0+cl.x,Y0+cl.y-cl.h/2-11)}}
 c.restore();
 const rg=c.createLinearGradient(X0-R,Y0-R,X0+R,Y0+R);rg.addColorStop(0,'#c9d1d8');rg.addColorStop(.5,'#7f8a94');rg.addColorStop(1,'#b6bfc7');c.strokeStyle=rg;c.lineWidth=9;c.beginPath();c.arc(X0,Y0,R+4,0,7);c.stroke();
 c.direction='rtl';c.textAlign='center';c.textBaseline='alphabetic';c.fillStyle=TH.ink;c.font='700 15px Segoe UI,Tahoma,sans-serif';c.fillText(v?'المشاهدة المجهرية — داخل: '+((T.id&&v.idn)?v.idn:(v.name||'كأس فارغة')):'المشاهدة المجهرية: انقر أنبوباً لعرضه',X0,Y0-R-16);
 if(T.lab){c.font='12px Segoe UI,Tahoma,sans-serif';c.fillStyle=TH.mut;c.fillText('الأيونات الباهتة متفرجة تبقى ذائبة، والأيونات المتجاذبة تكوّن شبكة الراسب وتهبط',X0,Y0+R+24)}
 if(v&&v.vol<1){c.fillStyle='#5b6976';c.font='13px Segoe UI,Tahoma,sans-serif';c.fillText('الوعاء فارغ',X0,Y0)}}
function drawIon(c,p,X0,Y0){const s=STY[p.t];const x=X0+p.x,y=Y0+p.y;c.globalAlpha=(p.spec?.5:1)*p.a;const g=c.createRadialGradient(x-p.r*.35,y-p.r*.4,1,x,y,p.r);g.addColorStop(0,shade(s.c,.45));g.addColorStop(1,s.c);c.fillStyle=g;c.beginPath();c.arc(x,y,p.r,0,7);c.fill();c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=.8;c.stroke();
 c.fillStyle=s.dk?'#1c2733':'#fff';c.font=`700 ${p.r>12?8.6:p.r<8?7.5:9.2}px Segoe UI,Tahoma,sans-serif`;c.fillText(s.n,x,y+.5);c.globalAlpha=1}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ---------------- separation flow ---------------- */
const FLOW=[{t:'مزيج الأيونات',f:'Ag⁺ + Cd²⁺ + Fe³⁺'},{a:'إضافة HCl المخفف'},{t:'راسب أبيض',f:'AgCl',c:W1},{a:'الترشيح'},{t:'الراشح',f:'Cd²⁺ + Fe³⁺'},{a:'إضافة H₂S في وسط حامضي'},{t:'راسب أصفر',f:'CdS',c:'#f0c419'},{a:'الترشيح'},{t:'الراشح المحتوي على الحديد',f:'Fe²⁺',n:'اختُزل Fe³⁺ إلى Fe²⁺ بفعل H₂S'},{a:'H₂S في وسط قاعدي (المجموعة الثالثة)'},{t:'راسب أسود',f:'FeS',c:'#161616'}];
function tot(k,where){let m=0;if(where!=='v'){for(const l of S.paper)if(l.k===k)m+=l.m;for(const s of S.samples)for(const l of s.layers)if(l.k===k)m+=l.m}if(where!=='p')for(const v of S.vessels){for(const l of v.sed)if(l.k===k)m+=l.m;for(const g of v.grains)if(g.k===k)m+=g.m}return m}
const inV=(v,k)=>v.sed.some(l=>l.k===k&&l.m>.3)||v.grains.some(g=>g.k===k);
function flowUpdate(){const d=[true,tot('AgCl')>.5,false,false,false,false];
 d[2]=d[1]&&tot('AgCl','p')>.5&&S.vessels.some(v=>v.vol>5&&(v.ions.Cd||0)>1&&(v.ions.Ag||0)<.3&&!inV(v,'AgCl'));
 d[3]=tot('CdS')>.5;d[4]=d[3]&&tot('CdS','p')>.5&&S.vessels.some(v=>v.vol>5&&((v.ions.Fe2||0)+(v.ions.Fe3||0))>1&&(v.ions.Cd||0)<.3&&!inV(v,'CdS'));d[5]=tot('FeS')+tot('FeS_S')>.5;
 S.fd=S.fd||[];d.forEach((x,i)=>{if(x)S.fd[i]=true;d[i]=!!S.fd[i]});let cur=d.findIndex(x=>!x);const key=d.join()+cur;if(key===S.flowKey)return;S.flowKey=key;let ni=0;
 $('#flowB').innerHTML=FLOW.map((n,i)=>{if(n.a){const nx=Math.floor((i+1)/2);return `<div class="fa ${nx===cur?'cur':''}">↓ ${n.a}</div>`}const k=ni++;return `<div class="fn ${d[k]?'done':k===cur?'cur':''}">${n.c?`<span class="sw" style="background:${n.c}"></span>`:''}<span class="t">${n.t}${n.n?`<br><small style="color:#6b7783">${n.n}</small>`:''}</span><span class="fx">${n.f}</span></div>`}).join('')+(cur<0?'<p style="margin:8px 0 0;font-size:13px;color:#1d8a4b;font-weight:600">اكتمل فصل الأيونات الثلاثة.</p>':'')}

/* ---------------- loop ---------------- */
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;now=t;try{update(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
function onResize(){fit();fitView()}
window.addEventListener('resize',onResize);
onResize();
if(sw<700){document.querySelectorAll('.panel').forEach(p=>{p.classList.add('col');p.querySelector('h3 b').textContent='+'})}
build('g1');requestAnimationFrame(loop);
}
