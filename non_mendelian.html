</style>

<div id="stage">

        <linearGradient id="gGeno" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff38a"/><stop offset="1" stop-color="#ffe23a"/></linearGradient>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,NAVY='#1f3a52',ORG='#c4623a';
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));

const TITLE='الصفات التي تتحور عن النسبة المندلية 3 : 1';
/* التعريف · المثال · P1 · G1+F1 · P2+G2 · اتحاد الامشاج F2 · الطرز المظهرية والنسبة · السيادة المشاركة */
const DUR=[10,11,5,8,8,9,8,8];

const world=G(view);
const glowL=G(world),boxL=G(world),arrL=G(world),txtL=G(world),objL=G(world),mvL=G(world);

/* ---------- builders ---------- */
const op=(e,a)=>e.setAttribute('opacity',f2(a));
function place(o,x,y,s,a){o.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) scale(${f2(s)})`);o.setAttribute('opacity',f2(a));}
const glow=(x,y,r)=>el('circle',{cx:x,cy:y,r:r||60,fill:'url(#gGlow)',opacity:0},glowL);
const box=(x,y,w,h)=>el('rect',{x,y,width:w,height:h,rx:6,fill:'url(#gBox)',stroke:NAVY,'stroke-width':2,opacity:0},boxL);
function geno(p,s,w){w=w||84;const g=G(p,{opacity:0});
  el('rect',{x:-w/2,y:-18,width:w,height:36,rx:4,fill:'url(#gGeno)',stroke:'#d9b80f','stroke-width':1.5},g);
  el('text',{class:'gt',x:0,y:1},g).textContent=s;return g;}
function gam(p,s){const g=G(p,{opacity:0});
  el('circle',{cx:1.5,cy:2.5,r:22,fill:NAVY,opacity:.18,filter:'url(#blur)'},g);
  el('circle',{cx:0,cy:0,r:22,fill:'url(#gGam)',stroke:'#b84e1e','stroke-width':2},g);
  el('text',{class:'gm',x:0,y:1},g).textContent=s;return g;}
function rowLbl(x,y,n){const t=el('text',{class:'rl',x,y,opacity:0},txtL);
  t.textContent=n[0];const s=el('tspan',{'font-size':17,dy:8},t);s.textContent=n[1];return t;}
function varrow(x,y0,y1){const g=G(arrL,{opacity:0}),L=y1-y0;
  el('rect',{x:-2.5,y:0,width:5,height:L-14,fill:NAVY},g);
  el('path',{d:`M-10,${L-16} L0,${L} L10,${L-16}Z`,fill:NAVY},g);
  return{g,x,y0};}
const grow=(A,s)=>{A.g.setAttribute('opacity',s>0?1:0);A.g.setAttribute('transform',`translate(${A.x} ${A.y0}) scale(1 ${f2(Math.max(s,.001))})`);};
function txt(s,x,y,c,p){const t=el('text',{class:c,x,y,opacity:0},p||txtL);t.textContent=s;return t;}
function head(s,y,w,cx){const g=G(txtL,{opacity:0});
  el('rect',{x:cx-w/2,y:y-15,width:w,height:30,rx:15,fill:ORG},g);
  el('text',{class:'hd',x:cx,y:y+1},g).textContent=s;return g;}
function pct(s,n,x,y){const t=el('text',{class:'pc',x,y,opacity:0},txtL);
  const a=el('tspan',{},t);a.textContent=s+' ';const b=el('tspan',{fill:ORG,'font-size':16},t);b.textContent=n+' %';return t;}

/* نبات حنك السبع : ساق خضراء تحمل ازهاراً متدرجة الحجم — r احمر · p وردي · w ابيض */
const FC={r:['#e0283f','#9c1426'],p:['#f7a1c0','#c75b85'],w:['#ffffff','#8d9aa6']};
function flower(p,k){const [c,s]=FC[k],g=G(p,{opacity:0});
  el('path',{d:'M0,34 C2,14 -2,-8 0,-34',stroke:'#3f8f3a','stroke-width':3,fill:'none','stroke-linecap':'round'},g);
  el('path',{d:'M0,26 C-6,18 -14,16 -18,18 C-12,24 -6,26 0,26Z',fill:'#5aa84f'},g);
  el('path',{d:'M0,20 C6,12 14,10 18,12 C12,18 6,20 0,20Z',fill:'#5aa84f'},g);
  [[-7,8,1],[7,-2,.95],[-6,-12,.88],[6,-21,.8],[0,-29,.65]].forEach(([x,y,q])=>{
    const f=G(g,{transform:`translate(${x} ${y}) scale(${q})`});
    el('path',{d:'M-7,-2 C-8,-9 -2,-11 0,-7 C2,-11 8,-9 7,-2 C7,4 3,7 0,7 C-3,7 -7,4 -7,-2Z',fill:c,stroke:s,'stroke-width':1.2},f);
    el('ellipse',{cx:0,cy:3.5,rx:3,ry:1.8,fill:'#ffd23a'},f);});
  el('ellipse',{cx:0,cy:-37,rx:2.6,ry:4.5,fill:'#7cc06f'},g);
  return g;}

/* paragraph with automatic line wrapping (right-aligned); symbols and ratios are coloured */
const HL=/^(\(?[RŔ]{1,2}\)?|[\d:]+|F₁|F₂)$/;
function setLine(t,words){while(t.firstChild)t.removeChild(t.firstChild);
  words.forEach((w,i)=>{if(i)t.appendChild(document.createTextNode(' '));
    if(HL.test(w)){const s=document.createElementNS(NS,'tspan');s.setAttribute('fill',ORG);s.textContent=w;t.appendChild(s);}
    else t.appendChild(document.createTextNode(w));});}
function para(str,o){const words=str.split(/\s+/),lines=[];let cur=[],y=o.y;
  const mk=()=>el('text',{class:o.cls||'tx',x:o.x,y,'text-anchor':o.anchor||'start',opacity:0},txtL);
  let t=mk();
  for(const w of words){const trial=cur.concat(w);setLine(t,trial);
    if(t.getComputedTextLength()>o.w&&cur.length){setLine(t,cur);lines.push(t);y+=o.lh;t=mk();cur=[w];setLine(t,cur);}
    else cur=trial;}
  setLine(t,cur);lines.push(t);return{lines,y:y+o.lh};}
function rev(arr,u,a,b){const n=arr.length;
  arr.forEach((g,i)=>{const s=sm(u,a+(b-a)*i/n,Math.min(b,a+(b-a)*(i+1.6)/n));
    [].concat(g).forEach(e=>{op(e,s);e.setAttribute('transform',`translate(${f1(12*(1-s))} 0)`);});});}

/* three columns, read right-to-left: النص والتعريف · P1/G1/F1 · P2/G2/F2 */
const CR=840,CM=420,CL=0,BW=352;
let r;

/* =================== أ) السيادة غير التامة =================== */
const hA=head('أ - السيادة غير التامة (Incomplete dominance)',24,360,CR+210);
r=para('وفيها يكون الطراز المظهري للفرد الهجين مختلفاً عن طرز الابوين حيث يتخذ طرازاً وسطاً بينهما ، اي بين الطرازين المظهريين لصفتين متضادتين نقيتين بسبب اختلاط تعبير الأليلين لهاتين الصفتين . وهذه الحالة تعتبر مختلفة عن حالة السيادة التامة للصفات التي درسها مندل .',{x:CR+408,y:66,w:396,lh:28});
const seqA=[[hA],...r.lines.map(l=>[l])];const endA=r.y;

/* =================== المثال =================== */
const hB=head('مثال',endA+20,110,CR+210);
r=para('ومثال على ذلك مايحدث عند تلقيح نبات حنك السبع احمر الازهار (RR) مع نبات ابيض الازهار (ŔŔ) فظهرت نباتات الجيل الاول وردية الازهار (RŔ) . وعند اجراء التلقيح الذاتي لافراد الجيل الاول F₁ كانت نباتات الجيل الثاني حمراء ووردية وبيضاء الازهار بالنسبة المظهرية 1:2:1 وهي مماثلة للنسبة الوراثية وكما موضح ادناه .',{x:CR+408,y:endA+62,w:396,lh:28});
const seqB=[[hB],...r.lines.map(l=>[l])];const endB=r.y;

/* =================== ب) السيادة المشاركة =================== */
const hH=head('ب - السيادة المشاركة (Codominance)',endB+30,320,CR+210);
r=para('وهي الحالة التي يتم فيها التعبير عن الأليلين معاً في الطراز المظهري للفرد الهجين . ففي هذا النوع من السيادة لايحدث أي اختلاط بين الأليلين في الطراز المظهري ، كما ان أياً منهما لايكون سائداً او متنحياً .',{x:CR+408,y:endB+72,w:396,lh:28});
const seqH=[[hH],...r.lines.map(l=>[l])];const endH=r.y;

/* =================== P1 · G1 · F1 =================== */
const yC=14,BX=CM+58,MX=CM+234,XL=CM+150,XR=CM+318;
const yGe=yC+96,yG1=yC+212,yF1=yC+318;
const C={};
C.bP=box(BX,yC,BW,140);C.lP=rowLbl(CM+30,yC+70,'P1');
C.lbR=para('♂ نبات حنك السبع ابيض الازهار',{x:XR,y:yC+20,w:150,lh:19,cls:'lb',anchor:'middle'}).lines;
C.lbL=para('♀ نبات حنك السبع احمر الازهار',{x:XL,y:yC+20,w:150,lh:19,cls:'lb',anchor:'middle'}).lines;
C.gL=geno(objL,'RR',64);C.gR=geno(objL,'ŔŔ',64);
C.fL=flower(objL,'r');C.fR=flower(objL,'w');C.x=txt('×',MX,yGe,'sx');
C.A1=varrow(MX,yC+143,yC+180);C.mei=txt('انقسام اختزالي',MX+70,yC+161,'ar');
C.bG=box(BX,yC+182,BW,60);C.lG=rowLbl(CM+30,yG1,'G1');
C.mL=gam(objL,'R');C.mR=gam(objL,'Ŕ');
C.A2=varrow(MX,yC+245,yC+280);
C.bF=box(BX,yC+282,BW,110);C.lF=rowLbl(CM+30,yC+337,'F1');
C.mv=[gam(mvL,'R'),gam(mvL,'Ŕ')];C.F=geno(objL,'RŔ',64);C.fF=flower(objL,'p');C.gl=glow(MX,yF1,70);
C.pc=pct('وردي الازهار ( طراز وسط بين الابوين )','100',MX,yC+370);
const endC=yC+392;

/* =================== P2 · G2 · F2 =================== */
r=para('وعند اجراء التلقيح الذاتي لافراد الجيل الاول F₁ وكالآتي :',{x:CL+408,y:24,w:396,lh:28});
const D={intro:r.lines};const yb=r.y+2;
const BX2=CL+58,MX2=CL+234,XL2=CL+150,XR2=CL+318;
const yGe2=yb+96,yG2=yb+212,yF=yb+314,yFl=yb+380;
D.bP=box(BX2,yb,BW,140);D.lP=rowLbl(CL+30,yb+70,'P2');
D.lbR=para('♂ نبات حنك السبع وردي الازهار',{x:XR2,y:yb+20,w:150,lh:19,cls:'lb',anchor:'middle'}).lines;
D.lbL=para('♀ نبات حنك السبع وردي الازهار',{x:XL2,y:yb+20,w:150,lh:19,cls:'lb',anchor:'middle'}).lines;
D.gL=geno(objL,'RŔ',64);D.gR=geno(objL,'RŔ',64);
D.fL=flower(objL,'p');D.fR=flower(objL,'p');D.x=txt('×',MX2,yGe2,'sx');
D.A3=varrow(MX2,yb+143,yb+180);D.mei=txt('انقسام اختزالي',MX2+70,yb+161,'ar');
D.bG=box(BX2,yb+182,BW,60);D.lG=rowLbl(CL+30,yG2,'G2');
const GS=['R','Ŕ'],GL=[XL2-26,XL2+26],GR=[XR2-26,XR2+26];
D.GLg=GS.map(s=>gam(objL,s));D.GRg=GS.map(s=>gam(objL,s));
D.A4=varrow(MX2,yb+245,yb+280);
D.bF=box(BX2,yb+282,BW,215);D.lF=rowLbl(CL+30,yb+390,'F2');
const FX=[CL+102,CL+190,CL+278,CL+366],PAIR=[[0,0],[0,1],[1,0],[1,1]],FK=['r','p','p','w'];
D.cb=PAIR.map(([a,b],i)=>({a,b,g:geno(objL,i===0?'RR':i===3?'ŔŔ':'RŔ',62),gl:glow(FX[i],yF,40),
  m:[gam(mvL,GS[a]),gam(mvL,GS[b])],fl:flower(objL,FK[i])}));
D.plus=[1,2,3].map(i=>txt('+',(FX[i-1]+FX[i])/2,yF,'sx'));
D.br=el('path',{d:`M${FX[1]},${yb+416} L${FX[1]},${yb+424} L${FX[2]},${yb+424} L${FX[2]},${yb+416} M${MX2},${yb+424} L${MX2},${yb+430}`,stroke:NAVY,'stroke-width':2,fill:'none',opacity:0},txtL);
D.nm=[txt('احمر',FX[0],yb+440,'pc'),txt('وردي',MX2,yb+440,'pc'),txt('ابيض',FX[3],yb+440,'pc')];
D.rt=[txt('1',FX[0],yb+464,'tn'),txt(':',(FX[0]+MX2)/2,yb+463,'tn'),txt('2',MX2,yb+464,'tn'),txt(':',(MX2+FX[3])/2,yb+463,'tn'),txt('1',FX[3],yb+464,'tn')];
D.pp=[txt('25 %',FX[0],yb+486,'pp'),txt('50 %',MX2,yb+486,'pp'),txt('25 %',FX[3],yb+486,'pp')];
r=para('النسبة المظهرية 1:2:1 = النسبة الوراثية 1:2:1',{x:MX2,y:yb+524,w:380,lh:28,anchor:'middle'});
D.sum=r.lines;const endD=r.y;

/* ---------- whole page in one view ---------- */
const H=Math.max(endH,endC,endD)+14;
const SEP=[CM,CR].map(x=>el('line',{x1:x+4,y1:12,x2:x+4,y2:H-12,stroke:'#b9c8d6','stroke-width':1.5,'stroke-dasharray':'6 6',opacity:0},boxL));
const VB=[-52,0,1316,H];svg.setAttribute('viewBox',VB.join(' '));

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:1,dur:DUR[0]};
let stage=0,T=0,t0=0,paused=false,P=0,last=performance.now();
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

/* ---------------- render ---------------- */
function render(){
  const u=DUR.map((_,i)=>clamp(P-i,0,1));
  let a,mv,fd,on;

  /* 1 — السيادة غير التامة */
  SEP.forEach(l=>op(l,sm(u[0],0,.15)));
  rev(seqA,u[0],0,.9);

  /* 2 — المثال */
  rev(seqB,u[1],0,.9);

  /* 3 — P1 */
  a=sm(u[2],0,.25);op(C.bP,a);op(C.lP,a);
  C.lbR.forEach(l=>op(l,sm(u[2],.15,.4)));C.lbL.forEach(l=>op(l,sm(u[2],.3,.55)));
  a=sm(u[2],.3,.6);place(C.gR,XR,yGe,.4+.6*a,a);place(C.fR,XR+64,yGe,.5+.5*a,a);
  a=sm(u[2],.45,.75);place(C.gL,XL,yGe,.4+.6*a,a);place(C.fL,XL-64,yGe,.5+.5*a,a);
  op(C.x,sm(u[2],.75,.92));

  /* 4 — G1 ثم F1 */
  grow(C.A1,sm(u[3],0,.15));op(C.mei,sm(u[3],.08,.2));
  a=sm(u[3],.1,.22);op(C.bG,a);op(C.lG,a);
  a=sm(u[3],.18,.4);place(C.mR,XR,lerp(yGe,yG1,a),.5+.5*a,sm(u[3],.18,.24));
  a=sm(u[3],.28,.5);place(C.mL,XL,lerp(yGe,yG1,a),.5+.5*a,sm(u[3],.28,.34));
  grow(C.A2,sm(u[3],.48,.6));a=sm(u[3],.52,.62);op(C.bF,a);op(C.lF,a);
  mv=sm(u[3],.6,.78);fd=sm(u[3],.74,.82);on=u[3]>.6?1:0;
  place(C.mv[0],lerp(XL,MX-22,mv),lerp(yG1,yF1,mv),1-.2*mv,on*(1-fd));
  place(C.mv[1],lerp(XR,MX+22,mv),lerp(yG1,yF1,mv),1-.2*mv,on*(1-fd));
  a=sm(u[3],.76,.88);place(C.F,MX,yF1,.4+.6*a,a);place(C.fF,MX+76,yF1,.5+.5*a,a);
  op(C.gl,Math.sin(PI*sm(u[3],.76,1)));op(C.pc,sm(u[3],.86,.97));

  /* 5 — P2 وامشاج G2 */
  D.intro.forEach(l=>op(l,sm(u[4],0,.1)));
  a=sm(u[4],.06,.18);op(D.bP,a);op(D.lP,a);
  [...D.lbL,...D.lbR].forEach(l=>op(l,sm(u[4],.1,.22)));
  a=sm(u[4],.12,.28);place(D.gL,XL2,yGe2,.4+.6*a,a);place(D.gR,XR2,yGe2,.4+.6*a,a);
  place(D.fL,XL2-64,yGe2,.5+.5*a,a);place(D.fR,XR2+64,yGe2,.5+.5*a,a);op(D.x,sm(u[4],.22,.3));
  grow(D.A3,sm(u[4],.32,.44));op(D.mei,sm(u[4],.38,.48));
  a=sm(u[4],.4,.5);op(D.bG,a);op(D.lG,a);
  D.GLg.forEach((g,i)=>{const s0=.5+i*.1;a=sm(u[4],s0,s0+.18);place(g,lerp(XL2,GL[i],a),lerp(yGe2,yG2,a),.5+.5*a,sm(u[4],s0,s0+.04));});
  D.GRg.forEach((g,i)=>{const s0=.7+i*.1;a=sm(u[4],s0,s0+.18);place(g,lerp(XR2,GR[i],a),lerp(yGe2,yG2,a),.5+.5*a,sm(u[4],s0,s0+.04));});

  /* 6 — F2 : اتحاد الامشاج */
  grow(D.A4,sm(u[5],0,.1));a=sm(u[5],.05,.14);op(D.bF,a);op(D.lF,a);
  D.cb.forEach((q,i)=>{const s0=.14+i*.2;
    mv=sm(u[5],s0,s0+.1);fd=sm(u[5],s0+.09,s0+.13);on=u[5]>s0?1:0;
    place(q.m[0],lerp(GL[q.a],FX[i]-14,mv),lerp(yG2,yF,mv),.9-.45*mv,on*(1-fd));
    place(q.m[1],lerp(GR[q.b],FX[i]+14,mv),lerp(yG2,yF,mv),.9-.45*mv,on*(1-fd));
    a=sm(u[5],s0+.1,s0+.15);place(q.g,FX[i],yF,.4+.6*a,a);
    op(q.gl,Math.sin(PI*sm(u[5],s0+.1,s0+.2)));
    if(i)op(D.plus[i-1],sm(u[5],s0,s0+.06));});

  /* 7 — الطرز المظهرية والنسبة 1 : 2 : 1 */
  D.cb.forEach((q,i)=>{const s0=i*.12;a=sm(u[6],s0,s0+.14);place(q.fl,FX[i],yFl,.5+.5*a,a);});
  a=sm(u[6],.5,.62);op(D.br,a);D.nm.forEach(t=>op(t,a));
  a=sm(u[6],.62,.74);D.rt.forEach(t=>op(t,a));
  a=sm(u[6],.72,.84);D.pp.forEach(t=>op(t,a));
  D.sum.forEach(l=>op(l,sm(u[6],.84,.96)));

  /* 8 — ب) السيادة المشاركة */
  rev(seqH,u[7],0,.9);
}
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render();requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');
DUR.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','المرحلة '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);});
function setUI(){document.title=TITLE;[...dotsEl.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+DUR.length)%DUR.length;const tgt=i+1;
  if(tgt<=P+1e-3)P=i;
  let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  if(tgt-P>1.01)d*=.6;
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1.2,d);
  setUI();}
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(stage-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(stage+1);if(e.key==='ArrowRight')go(stage-1);});
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
function apply(){view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);}
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const camC=()=>({x:VB[0]+VB[2]/2,y:VB[3]/2});
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,camC());
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,camC());
document.getElementById('zreset').onclick=reset;
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
go(0);step();render();requestAnimationFrame(frame);
})();
</script>
