<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>أنواع الانثالبيات</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#eef6fb;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #stage{position:relative;flex:1;min-height:0;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;background:radial-gradient(circle at 55% 45%,#f6fcff 0%,#cfe8f3 100%);padding-bottom:env(safe-area-inset-bottom,0px)}
  #svgWrap{position:absolute;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);right:0;left:calc(var(--bw) + 22px + env(safe-area-inset-left,0px))}
  svg#svg{width:100%;height:100%;display:block;overflow:visible;touch-action:none;cursor:grab;transition:opacity .3s}
  :root{--bw:126px;--zb:42px}
  body.fsx #svgWrap{left:0}

  /* ---- left controls: zoom group on top, stage buttons under it (transparent) ---- */
  #side{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));bottom:8px;width:var(--bw);z-index:5;
        display:flex;flex-direction:column;align-items:flex-start;gap:14px;overflow-y:auto;direction:ltr}
  .zb{display:flex;flex-direction:column;gap:8px;direction:ltr}
  .zb button{width:var(--zb);height:var(--zb);border-radius:50%;border:2px solid #1f3a52;background:transparent;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;
             display:flex;align-items:center;justify-content:center;padding:0}
  .zb svg{width:20px;height:20px;pointer-events:none}
  .sysList{display:flex;flex-direction:column;gap:7px;width:100%;direction:rtl}
  .sys{width:100%;padding:6px 8px;border-radius:8px;border:1.5px solid rgba(31,58,82,.45);background:transparent;color:#1f3a52;
       font:bold 14px Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.3;text-align:center;cursor:pointer;
       transition:color .25s,border-color .25s,transform .15s}
  .sys:active{transform:scale(.97)}
  .sys.on{background:transparent;border-color:#c4623a;border-width:2.5px;color:#a8431b}
  .sys.all{border-style:dashed}
  .sys:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  @media (max-width:560px),(max-height:440px){
    :root{--bw:92px;--zb:34px}
    #side{top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));gap:10px}
    .zb{gap:6px}.zb button{font-size:18px}.zb svg{width:16px;height:16px}
    .sys{padding:4px 5px;font-size:11.5px;border-radius:7px}
    .sysList{gap:5px}
  }
  @media (max-height:400px){:root{--zb:30px}#side{gap:6px}.zb{gap:4px}}

  svg text{direction:rtl}
  .pill{fill:#fff;stroke:#c4623a;stroke-width:2.5}
  .lbl{fill:#a8431b;font-size:19px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .ln{stroke:#c4623a;stroke-width:2.2;fill:none}
  .td{fill:#c4623a;stroke:#fff;stroke-width:1.5}
  .hd{transition:opacity .35s}
  .hName{fill:#1f3a52;font-size:32px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .hEn{fill:#3f6f93;font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .capBox{fill:#1f3a52}
  .capTxt{fill:#fff;font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .card{fill:#fff;stroke:#b9d3e2;stroke-width:1.5}
  .cTitle{fill:#fff;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .cRow{fill:#1f3a52;font-size:14.5px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .cSm{fill:#1f3a52;font-size:13px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .enS{fill:#3f6f93;font-size:14px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .enXS{fill:#3f6f93;font-size:11.5px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .enV{fill:#1f3a52;font-size:17px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .frm{fill:#3f6f93;font-size:17px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .eqL{fill:#1f3a52;font-size:22px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .eqM{fill:#1f3a52;font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .eqS{fill:#1f3a52;font-size:16px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .eqXS{fill:#1f3a52;font-size:14px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .sym{font-size:24px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .symS{font-size:16px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .symB{font-size:34px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .opT{fill:#fff;font-size:24px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .pT{fill:#1f3a52;font-size:19px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .pC2{fill:#3f6f93;font-size:16px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .rootT{fill:#fff;font-size:21px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .nT{font-size:19px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .tName{fill:#1f3a52;font-size:17px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .badge{fill:#fff;font-size:13px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .badgeA{fill:#fff;font-size:12.5px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .molT{fill:#1f3a52;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .plus{fill:#1f3a52;font-size:30px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .sgA{font-size:16px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .chipT{font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .plV{font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .plT{font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .bubT{fill:#1f3a52;font-size:13px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .small{fill:#3f6f93;font-size:12.5px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .chip{cursor:pointer}
</style>

<body>
<div id="stage">
  <div id="side">
    <div class="zb">
      <button id="zin" title="تكبير">+</button><button id="zout" title="تصغير">−</button><button id="zreset" title="إرجاع">⟲</button>
      <button id="fs" title="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path id="fsI" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="sysList">
      <button class="sys" data-i="1">انثالبي التكوين</button>
      <button class="sys" data-i="2">أثبت صورة للعنصر</button>
      <button class="sys" data-i="3">تكوين مول واحد</button>
      <button class="sys" data-i="4">انثالبي الاحتراق</button>
      <button class="sys" data-i="5">التغيرات الفيزيائية</button>
      <button class="sys all" data-i="6">الأنواع معاً</button>
    </div>
  </div>
  <div id="svgWrap">
  <svg id="svg" viewBox="0 0 900 670" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="gFl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffd24a"/><stop offset="1" stop-color="#f0702a"/></linearGradient>
      <linearGradient id="gMg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e3e7ea"/><stop offset=".5" stop-color="#a9b2b8"/><stop offset="1" stop-color="#d0d6da"/></linearGradient>
      <radialGradient id="gHg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#b9c0c6"/><stop offset="1" stop-color="#7c858c"/></radialGradient>
      <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d63a3a"/></marker>
      <marker id="ahB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2a7fb8"/></marker>
      <marker id="ahO" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c4623a"/></marker>
      <marker id="ahD" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3a52"/></marker>
    </defs>
    <g id="view"></g>
  </svg>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg", PI=Math.PI;
const svg=document.getElementById('svg'), view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const txt=(cls,x,y,s,p,fill)=>{const e=el('text',{class:cls,x,y},p);e.textContent=s;if(fill)e.setAttribute('fill',fill);return e;};
const htm=(cls,x,y,h,p,fill)=>{const e=el('text',{class:cls,x,y},p);e.innerHTML=h;if(fill)e.setAttribute('fill',fill);return e;};
const cl=x=>Math.min(1,Math.max(0,x)), ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const vis=(g,o)=>{g.setAttribute('opacity',o.toFixed(2));g.setAttribute('display',o<.01?'none':'');};
const NAVY='#1f3a52', RED='#d63a3a', BLU='#2a7fb8', ORG='#c4623a', GRN='#2e8b57', GRY='#8a949b';
const SP='   ', LRI='⁦', PDI='⁩';
/* صيغة كيميائية: الرقم بعد _ يكتب أسفل السطر */
const chem=s=>s.split(/_(\d+)/).map((x,i)=>i%2?`<tspan dy="5" font-size="72%">${x}</tspan>`:(i?`<tspan dy="-5">${x||'\u200a'}</tspan>`:x)).join('');
const col=(c,s)=>`<tspan fill="${c}">${s}</tspan>`;
/* رموز الانثالبي: قياسية (مع °) أو بدونها */
const dH=s=>`ΔH<tspan dy="6" font-size="66%">${s}</tspan><tspan dy="-14" font-size="66%">°</tspan><tspan dy="8"> </tspan>`;
const dHn=s=>`ΔH<tspan dy="6" font-size="66%">${s}</tspan><tspan dy="-6"> </tspan>`;
const line=(g,x1,y1,x2,y2,c,w,extra)=>el('line',Object.assign({x1,y1,x2,y2,stroke:c,'stroke-width':w,'stroke-linecap':'round'},extra||{}),g);
const mk=c=>c===RED?'ah':c===BLU?'ahB':c===ORG?'ahO':'ahD';
const arrow=(g,x1,y1,x2,y2,c,w,dash)=>line(g,x1,y1,x2,y2,c,w||5,Object.assign({'marker-end':`url(#${mk(c)})`},dash?{'stroke-dasharray':'12 7'}:{}));
const box=(g,x,y,w,h,c,sw)=>el('rect',{x,y,width:w,height:h,rx:Math.min(21,h/2),fill:'#fff',stroke:c||NAVY,'stroke-width':sw||2.5},g);
function card(g,x,y,w,h,c,title){el('rect',{class:'card',x,y,width:w,height:h,rx:12},g);
  el('path',{d:`M${x},${y+28} L${x},${y+12} Q${x},${y} ${x+12},${y} L${x+w-12},${y} Q${x+w},${y} ${x+w},${y+12} L${x+w},${y+28} Z`,fill:c},g);
  return txt('cTitle',x+w/2,y+14,title,g);}
const rows=(g,x,y0,step,list,cls)=>list.map((s,j)=>txt(cls||'cRow',x,y0+j*step,s,g));
const hexPts=(cx,cy,r)=>[0,1,2,3,4,5].map(k=>{const a=PI/6+k*PI/3;return (cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1);}).join(' ');
const FLAME='M0,-78 C24,-44 38,-20 26,6 C19,24 -19,24 -26,6 C-38,-20 -13,-40 0,-78 Z', FLIN='M0,-40 C11,-22 17,-10 11,4 C8,12 -8,12 -11,4 C-17,-10 -6,-20 0,-40 Z';
function flame(p){const g=el('g',{},p);el('path',{d:FLAME,fill:'url(#gFl)'},g);el('path',{d:FLIN,fill:'#fff3b0'},g);return g;}
function atom(p,x,y,r,f,s,dash){return el('circle',Object.assign({cx:x,cy:y,r,fill:f,stroke:s,'stroke-width':2},dash?{'stroke-dasharray':'4 3','fill-opacity':.15}:{}),p);}
/* مسار متعدد الأضلاع مع جدول أطوال (لحركة النقاط) */
function poly(P){const cum=[0];for(let i=1;i<P.length;i++)cum.push(cum[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));const L=cum[cum.length-1];
  return {d:'M'+P.map(p=>p.join(',')).join(' L'),at(u){const s=cl(u)*L;let i=1;while(i<P.length-1&&cum[i]<s)i++;const f=(s-cum[i-1])/((cum[i]-cum[i-1])||1);return [P[i-1][0]+(P[i][0]-P[i-1][0])*f,P[i-1][1]+(P[i][1]-P[i-1][1])*f];}};}
/* زر داخل الرسم: يستجيب للمس دون أن يحرك الرسم */
function chip(p,cx,cy,w,label,c,fn){const g=el('g',{class:'chip'},p);
  const r=el('rect',{x:cx-w/2,y:cy-19,width:w,height:38,rx:19,'stroke-width':2.5},g);const t=txt('chipT',cx,cy,label,g);
  g.addEventListener('pointerdown',e=>{e.stopPropagation();fn();});
  return {set(on){r.setAttribute('fill',on?c:'#fff');r.setAttribute('stroke',c);t.setAttribute('fill',on?'#fff':c);}};}

/* ---------- stages ---------- */
const TX=[
 {n:'أنواع الانثالبيات',e:'Types of Enthalpy',c:'تقاس في الظروف القياسية'},
 {n:'انثالبي التكوين القياسية',e:'Standard Enthalpy of Formation',c:'تكوين مول واحد من عناصره بأثبت صورها'},
 {n:'أثبت صورة للعنصر',e:'Most Stable Form',c:'انثالبي تكوين العنصر بأثبت صورة = صفر'},
 {n:'لماذا تظهر الكسور؟',e:'Forming One Mole',c:'معادلة التكوين تمثل مولاً واحداً من المركب'},
 {n:'انثالبي الاحتراق القياسية',e:'Standard Enthalpy of Combustion',c:'حرق مول واحد حرقاً تاماً مع الأوكسجين'},
 {n:'انثالبي التغيرات الفيزيائية',e:'Enthalpy of Physical Changes',c:'انتقال المادة من طور إلى آخر'},
 {n:'الأنواع معاً',e:'Summary',c:'الأنواع الثلاثة للانثالبيات'}
];
const G=TX.map(()=>el('g',{},view));
const upd=[];                                              // دالة تحديث لكل مرحلة

/* ================= 0: the tree of enthalpy types ================= */
(function(){const g=G[0];
  el('rect',{x:205,y:190,width:250,height:50,rx:25,fill:NAVY},g);txt('rootT',330,215,'أنواع الانثالبيات',g);
  const N=[{x:545,c:GRN,t:'انثالبي التكوين',s:dH('f'),d:['تكوين مول واحد من مركب','من عناصره بأثبت صورها']},
           {x:330,c:ORG,t:'انثالبي الاحتراق',s:dH('c'),d:['حرق مول واحد من مادة','حرقاً تاماً مع الأوكسجين']},
           {x:115,c:BLU,t:'التغيرات الفيزيائية',s:'',d:[]}];
  const paths=N.map(n=>{const P=poly([[330,240],[330,268],[n.x,268],[n.x,302]]);el('path',{d:P.d,fill:'none',stroke:n.c,'stroke-width':3,'stroke-linejoin':'round'},g);return P;});
  N.forEach(n=>{el('rect',{x:n.x-92,y:302,width:184,height:92,rx:14,fill:'#fff',stroke:n.c,'stroke-width':3},g);
    txt('nT',n.x,330,n.t,g,n.c);if(n.s)htm('sym',n.x,364,n.s,g,n.c);
    n.d.forEach((s,j)=>txt('pC2',n.x,426+j*28,s,g));});
  /* أربعة تغيرات فيزيائية */
  [['تبخر','vap',72,412],['تكثف','cond',158,412],['انصهار','fus',72,474],['انجماد','cryst',158,474]].forEach(([a,s,x,y])=>{
    line(g,115,394,x,y,BLU,2,{opacity:.5});
    el('rect',{x:x-42,y,width:84,height:54,rx:10,fill:'#fff',stroke:BLU,'stroke-width':2},g);
    txt('cSm',x,y+16,a,g,BLU);htm('symS',x,y+38,dHn(s),g,BLU);});
  const dots=N.map(n=>el('circle',{r:6,fill:n.c,stroke:'#fff','stroke-width':2},g));
  txt('pC2',330,600,'اختر نوعاً من الأزرار لتتعرف عليه',g);
  card(g,672,166,212,148,NAVY,'الظروف القياسية');
  txt('enV',778,212,'25 °C (298 K)',g);txt('enV',778,240,'1 atm',g);txt('cSm',778,276,'الرمز ° يدل على القيمة القياسية',g);
  card(g,672,328,212,120,NAVY,'إشارة الانثالبي');
  rows(g,778,374,30,['موجبة (+): حرارة ممتصة','سالبة (−): حرارة منبعثة']);
  upd[0]=T=>{const u=(T%2.6)/2.6;dots.forEach((d,j)=>{const p=paths[j].at(ease(u));d.setAttribute('cx',p[0]);d.setAttribute('cy',p[1]);d.setAttribute('opacity',Math.sin(PI*u).toFixed(2));});};
})();

/* ================= 1: formation of CO2 from its elements ================= */
(function(){const g=G[1];
  /* graphite: layered hexagon sheets */
  const gr=el('g',{},g);
  for(let L=0;L<3;L++)for(let k=0;k<4;k++)el('polygon',{points:hexPts(102+k*19+(L%2)*9.5,296+L*22,11),fill:'#6b7378',stroke:'#2f3539','stroke-width':1.6},gr);
  txt('plus',200,320,'+',g);arrow(g,328,320,400,320,NAVY,4);
  const Cg=el('g',{},g), Og=el('g',{},g);
  const C=atom(Cg,0,0,16,'#3a3f44','#1d2125'), O1=atom(Og,0,0,15,'#e2574c','#a8332a'), O2=atom(Og,0,0,15,'#e2574c','#a8332a');
  htm('frm',130,384,chem('C(graphite)'),g);htm('frm',272,384,chem('O_2(g)'),g);
  const prod=el('g',{},g);htm('frm',520,384,chem('CO_2(g)'),prod);
  ['1 mol','1 mol'].forEach((s,j)=>txt('molT',[130,272][j],410,s,g));txt('molT',520,410,'1 mol',prod);
  const heat=el('g',{},g), harr=[];
  [200,240,280,320,160].forEach(a=>{const r=a*PI/180;harr.push(arrow(heat,520+58*Math.cos(r),320+58*Math.sin(r),520+96*Math.cos(r),320+96*Math.sin(r),RED,4,true));});
  txt('sgA',520,204,'حرارة منبعثة',heat,RED);
  box(g,40,440,600,48,NAVY);htm('eqM',340,464,chem('C(graphite) + O_2(g) → CO_2(g)')+SP+col(RED,dH('f')+'('+chem('CO_2')+') = −394 kJ/mol'),g);
  const ok=[['مول واحد من المركب',500],['من عناصره بأثبت صورها',180]].map(([s,x])=>{const c=el('g',{},g);
    el('rect',{x:x-140,y:510,width:280,height:44,rx:22,fill:'#fff',stroke:GRN,'stroke-width':2.5},c);txt('chipT',x,532,'✓  '+s,c,GRN);return c;});
  txt('pC2',340,600,'الشرطان معاً يجعلان حرارة التفاعل = انثالبي التكوين',g);
  card(g,672,166,212,236,GRN,'التعريف');

let idx=0, t0=0, last=0, fresh=true;
const op=TX.map((_,j)=>j?0:1);
function frame(ms){
  const now=ms/1000, dt=Math.min(.1,Math.max(0,(ms-last)/1000));last=ms;
  const T=Math.max(0,(ms-t0)/1000), k=Math.min(1,dt*5);

  if(upd[idx])upd[idx](T,now,dt,fresh);fresh=false;

}

/* ---------- zoom & pan ---------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{try{svg.setPointerCapture(e.pointerId);}catch(_){}ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prev=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prev.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,dd=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(dd/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:335});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:335});
document.getElementById('zreset').onclick=reset;
apply();

/* ---------- fullscreen ---------- */
/* ملء شاشة حقيقي إن سمح المتصفح، وإلا وضع تكبير داخل الصفحة (الرسم يأخذ كامل المساحة) */
const D=document,R=D.documentElement,fsI=document.getElementById('fsI');
const isFs=()=>!!(D.fullscreenElement||D.webkitFullscreenElement);
let fsx=false;
const fsIcon=()=>fsI.setAttribute('d',(isFs()||fsx)?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
const setFsx=v=>{fsx=v;D.body.classList.toggle('fsx',v);fsIcon();};
document.getElementById('fs').onclick=()=>{
  if(fsx){setFsx(false);return;}
  if(isFs()){try{(D.exitFullscreen||D.webkitExitFullscreen).call(D);}catch(e){}return;}
  const f=R.requestFullscreen||R.webkitRequestFullscreen;
  if(!f){setFsx(true);return;}
  try{const p=f.call(R);if(p&&p.catch)p.catch(()=>setFsx(true));}catch(e){setFsx(true);return;}
  setTimeout(()=>{if(!isFs()&&!fsx)setFsx(true);},400);
};
D.addEventListener('fullscreenchange',fsIcon);D.addEventListener('webkitfullscreenchange',fsIcon);
})();
