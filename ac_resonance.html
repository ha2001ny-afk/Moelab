<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>الرنين في دوائر التيار المتناوب</title>
<style>
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --pos:#ff6b6b; --neg:#5eaaff; --field:#62d98a; --force:#ffab5c; --accent:#7fd3ff; --gold:#ffd27a;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --L:max(10px,env(safe-area-inset-left,0px)); --R:max(10px,env(safe-area-inset-right,0px)); --T:max(10px,env(safe-area-inset-top,0px)); --B:max(10px,env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;color:var(--ink);font-family:var(--f-body);
  background:radial-gradient(120% 90% at 55% 40%,var(--glow),var(--navy) 55%,var(--deep))}
.stage{position:relative;height:100%;display:flex;flex-direction:column;gap:10px;padding:calc(var(--T) + 52px) var(--R) var(--B) var(--L)}
.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
/* top bar: the tool buttons on the left, the title on the right */
.btn{position:absolute;top:var(--T);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;z-index:6}
.btn[hidden]{display:none}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:20px;height:20px}
.fs{left:var(--L)}
.tipbtn{left:calc(var(--L) + 50px);color:var(--gold)}
.tipbtn svg{width:22px;height:22px}
.tipbtn:hover,.tipbtn.on{border-color:var(--gold);background:rgba(255,210,122,.14)}
.penbtn{left:calc(var(--L) + 100px)}
.penbtn.on{border-color:var(--accent);background:rgba(127,211,255,.18);color:var(--accent)}
.clrbtn{left:calc(var(--L) + 150px);color:#ff9d9d}
h1{position:absolute;top:var(--T);right:var(--R);margin:0;height:42px;max-width:calc(100% - 220px);display:flex;align-items:center;font-size:clamp(14px,2.2vw,19px);font-weight:700;line-height:1.25;text-wrap:balance}
/* body: the graph, then the controls and the state of the circuit */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.card{background:rgba(8,20,41,.55);border:1px solid var(--line);border-radius:14px}
.graph{position:relative;min-height:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:ew-resize}
.ctrl{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.row output{font:600 13px var(--f-mono);direction:ltr;color:#7ef0a4;background:#08160f;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:2px 8px;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--accent);height:22px;touch-action:pan-y}
.seg{display:flex;gap:4px;direction:ltr}
.seg button,.act{font:600 12.5px var(--f-mono);padding:6px 9px;border-radius:9px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--muted);cursor:pointer}
.seg button.on{background:rgba(94,170,255,.2);border-color:var(--neg);color:var(--ink)}
.act{font-family:var(--f-body);color:var(--gold);border-color:rgba(255,210,122,.45)}
.act:hover,.seg button:hover{border-color:var(--accent)}
.state{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.case{font-size:16px;font-weight:700}
.rel{font-size:15px;font-weight:700;text-align:right;letter-spacing:.3px}
.bar{display:grid;grid-template-columns:28px 1fr 74px;align-items:center;gap:8px;direction:ltr;font:600 12px var(--f-mono)}
.bar i{display:block;height:10px;border-radius:5px;transition:width .12s}
.bar span:last-child{text-align:right;color:var(--muted)}
.nums{display:flex;flex-wrap:wrap;gap:5px;direction:ltr;justify-content:flex-end}
.nums span{font:12px var(--f-mono);background:rgba(255,255,255,.07);border-radius:6px;padding:2px 7px}
@media (max-width:760px),(max-aspect-ratio:1/1){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(220px,1fr) auto}
  .side{display:grid;grid-template-columns:1fr;gap:8px}
  .ctrl{padding:10px 12px;gap:7px}
  .state{padding:9px 12px;gap:5px}
  .case{font-size:14.5px}.rel{font-size:13.5px}
  .bars{display:none}
}
/* overlays: pen ink, toast, the lamp panel, the pen palette */
#ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#ink.on{pointer-events:auto;cursor:crosshair}
.pal{position:absolute;top:calc(var(--T) + 50px);left:calc(var(--L) + 100px);width:42px;display:grid;gap:8px;justify-items:center;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.85);z-index:6}
.pal[hidden]{display:none}
.pal button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.pal button.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(8,20,41,.9) inset}
.toast{position:absolute;top:calc(var(--T) + 52px);left:var(--L);max-width:min(300px,calc(100% - 20px));background:rgba(8,20,41,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;z-index:7}
.tip{position:absolute;top:calc(var(--T) + 52px);left:var(--L);width:min(360px,calc(100% - 20px));max-height:calc(100% - 70px);overflow:auto;background:rgba(8,20,41,.96);border:1px solid rgba(255,210,122,.35);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.75;box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:7;touch-action:pan-y}
.tip h2{margin:0 0 8px;font-size:16px;font-weight:600;color:var(--gold);padding-left:28px;text-wrap:balance}
.tip p{margin:0 0 8px}
.tip p.m{text-align:center;color:var(--accent);font-weight:600}
.tip .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.tip .x:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <h1>الرنين في دوائر التيار المتناوب</h1>
  <button class="btn fs" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="btn tipbtn" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
  <button class="btn penbtn" id="penBtn" aria-label="وضع القلم" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L16.5 4a2.1 2.1 0 0 1 3 3L8 18.5 4 20z"/><path d="M14.5 6l3 3"/></svg></button>
  <button class="btn clrbtn" id="clrBtn" aria-label="حذف الكتابة" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>

  <div class="main">
    <div class="card graph"><canvas id="scene" aria-label="منحني التيار مقابل التردد الزاوي لدائرة L-R-C متوالية الربط عند ثلاث مقاومات، اسحب عليه لتغيير التردد"></canvas></div>
    <div class="side">
      <div class="card ctrl">
        <div>
          <div class="row"><label for="w">التردد الزاوي للمصدر <span class="m">ω</span></label><output id="wOut"></output></div>
          <input type="range" id="w" min="0" max="1000" step="1" dir="ltr">
        </div>
        <div class="two">
          <div><div class="row"><label for="c">السعة <span class="m">C</span></label><output id="cOut"></output></div><input type="range" id="c" min="0.25" max="2" step="0.05" dir="ltr"></div>
          <div><div class="row"><label for="l">الحث <span class="m">L</span></label><output id="lOut"></output></div><input type="range" id="l" min="0.5" max="4" step="0.1" dir="ltr"></div>
        </div>
        <div class="row"><span>المقاومة <span class="m">R</span></span>
          <div class="seg" id="seg"><button data-r="200" class="on">200 Ω</button><button data-r="500">500 Ω</button><button data-r="1000">1000 Ω</button></div></div>
        <button class="act" id="tune">اضبط تردد المصدر على التردد الرنيني</button>
      </div>
      <div class="card state" aria-live="polite">
        <div class="case" id="case"></div>
        <div class="rel m" id="rel"></div>
        <div class="bars">
          <div class="bar"><span style="color:var(--field)">XL</span><i id="bL" style="background:var(--field)"></i><span id="vL"></span></div>
          <div class="bar" style="margin-top:6px"><span style="color:var(--pos)">XC</span><i id="bC" style="background:var(--pos)"></i><span id="vC"></span></div>
        </div>
        <div class="nums" id="nums"></div>
      </div>
    </div>
  </div>

  <canvas id="ink" aria-hidden="true"></canvas>
  <div class="pal" id="pal" hidden>
    <button data-c="#ffd27a" style="background:#ffd27a" class="sel" aria-label="أصفر"></button>
    <button data-c="#ff6b6b" style="background:#ff6b6b" aria-label="أحمر"></button>
    <button data-c="#ffffff" style="background:#ffffff" aria-label="أبيض"></button>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
</div>

<script>
(function(){
const toastEl=document.getElementById('toast');let ttm=0;
window.__toast=s=>{toastEl.textContent=s;toastEl.hidden=false;clearTimeout(ttm);ttm=setTimeout(()=>toastEl.hidden=true,2800);};
})();

(function(){
/* =====================  THE CIRCUIT  =====================
   Series L-R-C on a source of amplitude V_m and angular frequency w:
     X_L = wL,  X_C = 1/(wC),  Z = sqrt(R^2 + (X_L - X_C)^2),  I = V_m / Z.
   Resonance when X_L = X_C:  w_r = 1/sqrt(LC),  f_r = 1/(2 pi sqrt(LC)),  Z = R,  I = V_m / R (largest).
   Defaults reproduce the book's figure 38: V_m = 100 V, L = 2 H, C = 0.5 uF, w_r = 1000 rad/s. */
const S={Vm:100,R:200,L:2,C:0.5,w:600,touched:false};
const WMIN=125,WMAX=8000,YMAX=0.6,TAU=Math.PI*2;
const WR=()=>1/Math.sqrt(S.L*S.C*1e-6);
const XLof=w=>w*S.L,XCof=w=>1/(w*S.C*1e-6);
const Iof=(w,R)=>S.Vm/Math.hypot(R,XLof(w)-XCof(w));
const atRes=()=>Math.abs(S.w/WR()-1)<0.004;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* an w close to w_r snaps onto it, so the resonance is easy to reach by hand */
const snapW=w=>{w=clamp(w,WMIN,WMAX);return Math.abs(w/WR()-1)<0.025?WR():Math.round(w);};
/* the half-height points of a curve: X_L - X_C = -/+ k */
const wAt=(k,sign)=>(sign*k+Math.sqrt(k*k+4*S.L/(S.C*1e-6)))/(2*S.L);

/* ---------- the graph (figure 38) ---------- */
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,time=0,drag=false;
const MONO='ui-monospace, Menlo, Consolas, monospace',SANS='system-ui, Tahoma, sans-serif';
function txt(s,x,y,o={}){ctx.font=o.font||'600 12px '+SANS;ctx.fillStyle=o.color||'#eaf0fa';ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function geo(){const nar=W<520,px0=nar?42:54,top=nar?40:46;return{px0,top,pw:W-px0-(nar?16:26),y0:H-(nar?40:46),nar};}
function layout(){const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  const {px0,top,pw,y0,nar}=geo(),ph=y0-top,X=w=>px0+pw*Math.log2(w/WMIN)/6,Y=i=>y0-ph*Math.min(i,YMAX*1.04)/YMAX,wr=WR(),xr=X(wr),fs=nar?10:11;
  // the two sides of the resonance
  ctx.fillStyle='rgba(255,107,107,.07)';ctx.fillRect(px0,top,xr-px0,ph);
  ctx.fillStyle='rgba(98,217,138,.07)';ctx.fillRect(xr,top,px0+pw-xr,ph);
  if(xr-px0>70){txt('خواص سعوية',(px0+xr)/2,top+11,{font:'600 '+fs+'px '+SANS,color:'rgba(255,150,150,.9)'});txt('ω < ωr',(px0+xr)/2,top+26,{font:'600 '+fs+'px '+MONO,color:'rgba(255,150,150,.75)',dir:'ltr'});}
  if(px0+pw-xr>70){txt('خواص حثية',(xr+px0+pw)/2,top+11,{font:'600 '+fs+'px '+SANS,color:'rgba(130,230,160,.9)'});txt('ω > ωr',(xr+px0+pw)/2,top+26,{font:'600 '+fs+'px '+MONO,color:'rgba(130,230,160,.75)',dir:'ltr'});}
  // grid, scales and axes: w on the book's log scale, I up to 0.6 A
  ctx.lineWidth=1;ctx.strokeStyle='rgba(234,240,250,.09)';ctx.beginPath();
  for(let k=1;k<=6;k++){const x=X(WMIN*2**k);ctx.moveTo(x,y0);ctx.lineTo(x,top);}
  for(let i=1;i<=6;i++){ctx.moveTo(px0,Y(i/10));ctx.lineTo(px0+pw,Y(i/10));}ctx.stroke();
  for(let k=0;k<=6;k++)txt(String(WMIN*2**k),X(WMIN*2**k),y0+13,{font:'600 '+fs+'px '+MONO,color:'#a3b3cc',dir:'ltr'});
  for(let i=0;i<=6;i++)txt((i/10).toFixed(1),px0-18,Y(i/10),{font:'600 '+fs+'px '+MONO,color:'#a3b3cc',dir:'ltr'});
  txt('I (A)',px0,top-16,{font:'700 12px '+MONO,color:'#5eaaff',dir:'ltr',align:'left'});
  txt('ω (rad/s)',px0+pw,y0+29,{font:'600 '+fs+'px '+MONO,color:'#a3b3cc',align:'right',dir:'ltr'});
  ctx.strokeStyle='#5eaaff';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px0,y0);ctx.lineTo(px0+pw+6,y0);ctx.moveTo(px0,y0);ctx.lineTo(px0,top-4);ctx.stroke();
  arrowHead(px0+pw+9,y0,0,5,'#5eaaff');arrowHead(px0,top-7,-Math.PI/2,5,'#5eaaff');
  // the resonant angular frequency
  ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(255,210,122,.75)';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(xr,y0);ctx.lineTo(xr,top+22);ctx.stroke();ctx.setLineDash([]);
  txt('ωr = '+Math.round(wr),xr,y0+29,{font:'700 '+fs+'px '+MONO,color:'#ffd27a',dir:'ltr'});
  // the three curves of the book: R1, R2, R3
  const curve=R=>{ctx.beginPath();for(let x=0;x<=pw;x+=1.5){const w=WMIN*2**(6*x/pw),y=Y(Iof(w,R));x?ctx.lineTo(px0+x,y):ctx.moveTo(px0+x,y);}ctx.stroke();};
  [200,500,1000].forEach((R,j)=>{const on=R===S.R,pk=S.Vm/R,c=on?'#5eaaff':'rgba(234,240,250,.38)';
    ctx.save();if(on){ctx.shadowColor='#5eaaff';ctx.shadowBlur=8;}ctx.strokeStyle=c;ctx.lineWidth=on?3:1.6;curve(R);ctx.restore();
    // width of the curve: arrows meet it where I falls to I_max / sqrt 2
    const w1=wAt(R,-1),w2=wAt(R,1),yh=Y(pk/Math.SQRT2),ac=on?'#ffd27a':'rgba(234,240,250,.45)',al=nar?14:20;
    if(w1>WMIN&&w2<WMAX){ctx.strokeStyle=ac;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(X(w1)-al-6,yh);ctx.lineTo(X(w1)-4,yh);ctx.moveTo(X(w2)+al+6,yh);ctx.lineTo(X(w2)+4,yh);ctx.stroke();
      arrowHead(X(w1)-3,yh,0,5,ac);arrowHead(X(w2)+3,yh,Math.PI,5,ac);}
    // the label, joined to the curve by a thin line
    const wa=wAt(1.333*R,1),xa=X(wa),ya=Y(0.6*pk),lx=Math.min(px0+pw-4,xa+(nar?34:60)),ly=ya-(nar?10:16)-j*2;
    ctx.strokeStyle=on?'rgba(94,170,255,.8)':'rgba(234,240,250,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(xa,ya);ctx.lineTo(lx-2,ly);ctx.stroke();
    txt('R'+'₁₂₃'[j]+' = '+R+' Ω',lx,ly,{font:(on?'700 ':'500 ')+(nar?10.5:12)+'px '+MONO,color:on?'#9fd0ff':'rgba(190,204,224,.85)',align:'left',dir:'ltr'});});
  // the present angular frequency of the source
  const xp=X(S.w),ip=Iof(S.w,S.R),yp=Y(ip),res=atRes();
  ctx.setLineDash([3,4]);ctx.strokeStyle='rgba(127,211,255,.7)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(xp,y0);ctx.lineTo(xp,yp);ctx.lineTo(px0,yp);ctx.stroke();ctx.setLineDash([]);
  [200,500,1000].forEach(R=>{if(R===S.R)return;ctx.beginPath();ctx.arc(xp,Y(Iof(S.w,R)),3,0,7);ctx.fillStyle='rgba(234,240,250,.6)';ctx.fill();});
  if(res){const pu=0.5+0.5*Math.sin(time*5);ctx.beginPath();ctx.arc(xp,yp,10+pu*6,0,7);ctx.strokeStyle='rgba(255,210,122,'+(0.3+0.5*pu)+')';ctx.lineWidth=2;ctx.stroke();}
  else if(!S.touched){const pu=0.5+0.5*Math.sin(time*5);ctx.beginPath();ctx.arc(xp,yp,11+pu*5,0,7);ctx.strokeStyle='rgba(127,211,255,'+(0.35+0.4*pu)+')';ctx.lineWidth=2;ctx.stroke();}
  ctx.beginPath();ctx.arc(xp,yp,6,0,7);ctx.fillStyle=res?'#ffd27a':'#5eaaff';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.stroke();
  const right=xp<px0+pw-110,lab='I = '+ip.toFixed(3)+' A';
  txt(lab,xp+(right?11:-11),yp-(yp<top+40?-16:14),{font:'700 '+(nar?11.5:13)+'px '+MONO,color:'#ffd27a',align:right?'left':'right',dir:'ltr'});
  if(res)txt('رنين: Z = R والتيار بأعظم مقدار',xr,top+46,{font:'700 '+(nar?12:13.5)+'px '+SANS,color:'#ffd27a'});
}

/* drag on the graph to set the angular frequency of the source */
function setFromX(e){const r=cv.getBoundingClientRect(),{px0,pw}=geo();S.w=snapW(WMIN*2**(6*clamp((e.clientX-r.left-px0)/pw,0,1)));S.touched=true;sync();}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drag=true;setFromX(e);});
cv.addEventListener('pointermove',e=>{if(drag)setFromX(e);});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drag=false));

/* ---------- controls and the state card ---------- */
const $=id=>document.getElementById(id);
const wIn=$('w'),cIn=$('c'),lIn=$('l'),segs=[...document.querySelectorAll('#seg button')];
const toSlider=w=>Math.round(1000*Math.log2(w/WMIN)/6),fromSlider=v=>WMIN*2**(6*v/1000);
wIn.addEventListener('input',()=>{S.w=snapW(fromSlider(+wIn.value));S.touched=true;sync();});
cIn.addEventListener('input',()=>{S.C=+cIn.value;sync();});
lIn.addEventListener('input',()=>{S.L=+lIn.value;sync();});
segs.forEach(b=>b.addEventListener('click',()=>{S.R=+b.dataset.r;sync();}));
$('tune').addEventListener('click',()=>{S.w=WR();S.touched=true;sync();});
const sub=(a,b)=>`${a}<sub>${b}</sub>`;
function sync(){const wr=WR(),xl=XLof(S.w),xc=XCof(S.w),z=Math.hypot(S.R,xl-xc),i=S.Vm/z,res=atRes();
  wIn.value=toSlider(S.w);cIn.value=S.C;lIn.value=S.L;
  $('wOut').textContent=Math.round(S.w)+' rad/s';$('cOut').textContent=S.C.toFixed(2)+' µF';$('lOut').textContent=S.L.toFixed(1)+' H';
  segs.forEach(b=>b.classList.toggle('on',+b.dataset.r===S.R));
  const cs=$('case'),rel=$('rel');
  if(res){cs.textContent='رنين: الدائرة تعمل بخواص مقاومة صرف';cs.style.color='#ffd27a';rel.innerHTML=`${sub('X','L')} = ${sub('X','C')}&nbsp;&nbsp;&nbsp;${sub('V','L')} = ${sub('V','C')}&nbsp;&nbsp;&nbsp;Z = R`;}
  else if(S.w>wr){cs.textContent='ω أكبر من التردد الرنيني: خواص حثية';cs.style.color='#62d98a';rel.innerHTML=`${sub('X','L')} &gt; ${sub('X','C')}&nbsp;&nbsp;&nbsp;${sub('V','L')} &gt; ${sub('V','C')}`;}
  else{cs.textContent='ω أصغر من التردد الرنيني: خواص سعوية';cs.style.color='#ff8b8b';rel.innerHTML=`${sub('X','L')} &lt; ${sub('X','C')}&nbsp;&nbsp;&nbsp;${sub('V','L')} &lt; ${sub('V','C')}`;}
  const mx=Math.max(xl,xc);$('bL').style.width=(100*xl/mx)+'%';$('bC').style.width=(100*xc/mx)+'%';$('vL').textContent=Math.round(xl)+' Ω';$('vC').textContent=Math.round(xc)+' Ω';
  $('nums').innerHTML=`<span>Z = ${Math.round(z)} Ω</span><span>I = ${i.toFixed(3)} A</span><span>ωr = ${Math.round(wr)} rad/s</span><span>fr = ${(wr/TAU).toFixed(1)} Hz</span>`;}

/* ---------- the lamp: explanation that follows the state ---------- */
window.__explain=()=>{const wr=WR(),xl=XLof(S.w),xc=XCof(S.w),nums=`<p class="m" style="font-size:12.5px;color:#a3b3cc">Vm = ${S.Vm} V · R = ${S.R} Ω · L = ${S.L.toFixed(1)} H · C = ${S.C.toFixed(2)} µF<br>XL = ${Math.round(xl)} Ω · XC = ${Math.round(xc)} Ω · I = ${Iof(S.w,S.R).toFixed(3)} A</p>`;
  const der=`<p class="m">ωL = 1/ωC  ⇒  ω<sub>r</sub>² = 1/LC</p><p class="m">ω<sub>r</sub> = 1/√LC = ${Math.round(wr)} rad/s</p><p class="m">f<sub>r</sub> = 1/(2π√LC) = ${(wr/TAU).toFixed(1)} Hz</p>`;
  const rnote=`<p>تأثير المقاومة: كلما صغرت المقاومة (مثلاً 200 Ω) كان منحني التيار رفيعاً (حاداً) ومقداره كبيراً، وكلما كبرت (مثلاً 1000 Ω) كان المنحني واسعاً ومقداره صغيراً. بدّل بين المقاومات الثلاث وقارن.</p>`;
  if(atRes())return{t:'الرنين الكهربائي',b:`<p>تردد المصدر يساوي التردد الرنيني للدائرة، فتكون رادة الحث مساوية لرادة السعة <span class="m">(X<sub>L</sub> = X<sub>C</sub>)</span> وكذلك <span class="m">V<sub>L</sub> = V<sub>C</sub></span></p><p>هذا يجعل ممانعة الدائرة بأقل مقدار <span class="m">(Z = R)</span> فيبلغ التيار مقداره الأعظم (ذروته) <span class="m">I = V<sub>m</sub>/R</span>، وتعمل الدائرة بخواص مقاومة صرف.</p>${der}<p>وهذا ما يحدث في دائرة التنغيم في المذياع: يكون تيار الاستقبال بأعظم مقدار عندما يساوي تردد دائرة الاستقبال تردد الإشارة المستلمة.</p>${rnote}${nums}`};
  if(S.w>wr)return{t:'تردد الدائرة أكبر من التردد الرنيني',b:`<p>تعمل الدائرة بخواص حثية لأن <span class="m">X<sub>L</sub> > X<sub>C</sub></span> وكذلك <span class="m">V<sub>L</sub> > V<sub>C</sub></span>، والتيار أقل من ذروته.</p><p>للوصول إلى الرنين قلّل تردد المصدر نحو <span class="m">ω<sub>r</sub></span>، أو غيّر <span class="m">C</span> أو <span class="m">L</span> فيتغير التردد الرنيني نفسه ويتحرك المنحني.</p>${der}${rnote}${nums}`};
  return{t:'تردد الدائرة أصغر من التردد الرنيني',b:`<p>تعمل الدائرة بخواص سعوية لأن <span class="m">X<sub>L</sub> < X<sub>C</sub></span> وكذلك <span class="m">V<sub>L</sub> < V<sub>C</sub></span>، والتيار أقل من ذروته.</p><p>للوصول إلى الرنين زِد تردد المصدر نحو <span class="m">ω<sub>r</sub></span>، أو غيّر <span class="m">C</span> أو <span class="m">L</span> فيتغير التردد الرنيني نفسه ويتحرك المنحني.</p>${der}${rnote}${nums}`};};

setTimeout(()=>window.__toast('اسحب على المنحني أو حرّك مؤشر التردد حتى تصل إلى الرنين'),600);
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;if(!W)layout();if(W){try{draw();}catch(e){ctx.setTransform(1,0,0,1,0,0);ctx.setLineDash([]);}}requestAnimationFrame(frame);}
new ResizeObserver(layout).observe(cv);layout();sync();requestAnimationFrame(frame);
})();

/* ---------- fullscreen ---------- */
(function(){const b=document.getElementById('fsBtn'),ico=document.getElementById('fsIco'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const toast=()=>window.__toast('ملء الشاشة غير متاح هنا. افتح الملف أو الرابط بالمتصفح');
  const sync=()=>{ico.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');b.setAttribute('aria-label',isFs()?'الخروج من ملء الشاشة':'ملء الشاشة');};
  b.addEventListener('click',()=>{
    if(isFs()){try{exit.call(document);}catch(e){}return;}
    if(!req||document.fullscreenEnabled===false){toast();return;}
    try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(toast);setTimeout(()=>{if(!isFs())toast();},700);}catch(e){toast();}});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);})();

/* ---------- lamp hint panel ---------- */
(function(){const b=document.getElementById('tipBtn'),p=document.getElementById('tipPanel'),t=document.getElementById('tipTitle'),body=document.getElementById('tipBody');
  let iv=0,last='';
  const fill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===last)return;last=h;t.textContent=r.t;body.innerHTML=r.b;};
  const open=v=>{p.hidden=!v;b.setAttribute('aria-expanded',v);b.classList.toggle('on',v);clearInterval(iv);if(v){last='';fill();iv=setInterval(fill,400);}};
  b.addEventListener('click',()=>open(p.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>open(false));})();

/* ---------- pen mode: write over the simulation, clear the writing ---------- */
(function(){const ink=document.getElementById('ink'),ix=ink.getContext('2d'),pb=document.getElementById('penBtn'),cb=document.getElementById('clrBtn'),pal=document.getElementById('pal');
  let on=false,strokes=[],cur=null,color='#ffd27a',dpr=1;
  function seg(s,from){const p=s.p,i0=Math.max(0,from-1);ix.setTransform(dpr,0,0,dpr,0,0);ix.lineCap='round';ix.lineJoin='round';ix.strokeStyle=s.c;ix.lineWidth=3.2;
    ix.beginPath();ix.moveTo(p[i0].x,p[i0].y);if(p.length===1)ix.lineTo(p[0].x+0.1,p[0].y);for(let i=i0+1;i<p.length;i++)ix.lineTo(p[i].x,p[i].y);ix.stroke();}
  function redraw(){ix.setTransform(1,0,0,1,0,0);ix.clearRect(0,0,ink.width,ink.height);strokes.forEach(s=>seg(s,0));}
  function size(){const w=ink.clientWidth,h=ink.clientHeight;if(!w||!h)return;dpr=window.devicePixelRatio||1;ink.width=Math.round(w*dpr);ink.height=Math.round(h*dpr);redraw();}
  function sync(){ink.classList.toggle('on',on);pb.classList.toggle('on',on);pb.setAttribute('aria-pressed',on);pal.hidden=!on;cb.hidden=!(on||strokes.length);}
  const pos=e=>{const r=ink.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  pb.addEventListener('click',()=>{on=!on;sync();});
  cb.addEventListener('click',()=>{strokes=[];cur=null;redraw();sync();});
  pal.addEventListener('click',e=>{const c=e.target.dataset&&e.target.dataset.c;if(!c)return;color=c;[...pal.children].forEach(x=>x.classList.toggle('sel',x===e.target));});
  ink.addEventListener('pointerdown',e=>{if(!on)return;e.preventDefault();ink.setPointerCapture(e.pointerId);cur={c:color,p:[pos(e)],id:e.pointerId};strokes.push(cur);seg(cur,0);});
  ink.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==cur.id)return;const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e],n=cur.p.length;(ev.length?ev:[e]).forEach(x=>cur.p.push(pos(x)));seg(cur,n);});
  const end=e=>{if(cur&&e.pointerId===cur.id)cur=null;};
  ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);
  new ResizeObserver(size).observe(ink);size();sync();})();

/* ---------- block text selection and the copy/paste callout on touch devices ---------- */
(function(){const stop=e=>e.preventDefault();
  ['selectstart','contextmenu','dragstart'].forEach(ev=>document.addEventListener(ev,stop));
  document.querySelectorAll('canvas').forEach(c=>c.addEventListener('touchstart',stop,{passive:false}));
  document.addEventListener('selectionchange',()=>{const s=window.getSelection&&window.getSelection();if(s&&s.rangeCount&&!s.isCollapsed)s.removeAllRanges();});})();
</script>
