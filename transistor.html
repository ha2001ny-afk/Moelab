<title>الترانزستور</title>
<style>
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --accent:#7fd3ff; --warn:#ffc04d;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body)}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.fs{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.fs:hover{border-color:var(--accent)}
.fs:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fs svg{width:20px;height:20px}
.toast{position:absolute;top:max(62px,calc(env(safe-area-inset-top,0px) + 56px));right:max(10px,env(safe-area-inset-right,0px));max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink)}
.tipbtn{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:calc(max(10px,env(safe-area-inset-right,0px)) + 50px);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:#ffd27a;display:grid;place-items:center;cursor:pointer;padding:0}
.tipbtn:hover,.tipbtn.on{border-color:#ffd27a;background:rgba(255,210,122,.14)}
.tipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tipbtn svg{width:22px;height:22px}
.tip{box-sizing:border-box;position:absolute;top:max(60px,calc(env(safe-area-inset-top,0px) + 58px));right:max(10px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 20px));max-height:calc(100% - 80px);overflow:auto;background:rgba(8,20,41,.95);border:1px solid rgba(255,210,122,.35);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.8;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.tip h2{margin:0 0 8px;font-family:var(--f-display);font-size:16px;font-weight:600;color:#ffd27a;padding-left:28px;text-wrap:balance}
.tip p{margin:0 0 8px}
.tip .m,.tip b.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.tip p.m{text-align:center;color:var(--accent);font-weight:600}
.tip .note{color:var(--muted);font-size:13px}
.tip .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;direction:ltr;justify-content:flex-end}
.tip .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.tip .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.tip .x:hover{color:var(--ink)}
.parts{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;direction:rtl}
.parts button{height:42px;padding:0 12px 0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--muted);font:600 13px var(--f-body);cursor:pointer;display:flex;align-items:center;gap:7px}
.parts button i{width:9px;height:9px;border-radius:50%;border:1.6px solid currentColor;box-sizing:border-box;flex:none}
.parts button[aria-pressed="true"]{color:var(--ink);border-color:rgba(127,211,255,.6);background:rgba(127,211,255,.14)}
.parts button[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.parts button:hover{border-color:var(--accent)}
.parts button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.parts .s{display:none}
@media (max-width:640px){.parts .l{display:none}.parts .s{display:inline}.parts button{padding:0 9px 0 10px;font-size:12.5px}}
@media (max-width:420px){.parts{gap:4px}.parts button{padding:0 7px 0 8px;font-size:12px;gap:5px}.parts button i{width:7px;height:7px}}
.parts{max-width:calc(100vw - 124px);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.parts::-webkit-scrollbar{display:none}.parts button{flex:none}
</style>

<body style="margin:0">

<div class="stage" dir="rtl">

  <div class="tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
  
  <button class="fs" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<script>
(function(){
const cv=document.getElementById('scene');const ctx=cv.getContext('2d');
const LRI='⁦',PDI='⁩',iso=s=>LRI+s+PDI;
function wlRGB(l){let r=0,g=0,b=0;if(l<440){r=-(l-440)/60;b=1;}else if(l<490){g=(l-440)/50;b=1;}else if(l<510){g=1;b=-(l-510)/20;}else if(l<580){r=(l-510)/70;g=1;}else if(l<645){r=1;g=-(l-645)/65;}else r=1;
  const f=l<420?0.35+0.65*(l-380)/40:l>700?0.35+0.65*(780-l)/80:1;return`rgb(${Math.round(255*Math.pow(r*f,0.8))},${Math.round(255*Math.pow(g*f,0.8))},${Math.round(255*Math.pow(b*f,0.8))})`;}
let W=0,H=0,DPR=1,narrow=null,L={fs:1},view={z:1,x:0,y:0},time=0,drag=null,hover=null;
const col={};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let LB=[],LBW=0,LBH=0;
function chip(s,x,y,c,align,o={}){const f=F(600,o.s||12);ctx.font=f;const w=ctx.measureText(s).width+18,h=(o.s?o.s+12:24)*L.fs,x0=align==='left'?x:align==='right'?x-w:x-w/2;rr(x0,y-h/2,w,h,h/2);ctx.fillStyle=o.bg||'rgba(6,13,28,.74)';ctx.fill();if(c){ctx.strokeStyle=c;ctx.lineWidth=1;ctx.stroke();}txt(s,x0+w/2,y+0.5,{font:f,color:o.tc||c||col.ink,dir:o.dir});LB.push([x0-3,y-h/2-3,w+6,h+6]);return w;}
function label(s,x,y,c,o={}){const f=F(o.w||600,o.s||12.5);ctx.font=f;const tw=ctx.measureText(s).width+16,th=(o.s||12.5)+10;
  if(o.alt){const cands=[[x,y],...o.alt].map(([a,b])=>[clamp(a,tw/2+6,LBW-tw/2-6),clamp(b,th/2+6,LBH-th/2-6)]);let best=cands[0],bo=1e9;
    for(const [a,b] of cands){let ov=0;for(const r of LB){const ix=Math.max(0,Math.min(a+tw/2,r[0]+r[2])-Math.max(a-tw/2,r[0])),iy=Math.max(0,Math.min(b+th/2,r[1]+r[3])-Math.max(b-th/2,r[1]));ov+=ix*iy;}if(ov<bo-0.5){bo=ov;best=[a,b];}if(ov===0)break;}[x,y]=best;}
  LB.push([x-tw/2-3,y-th/2-3,tw+6,th+6]);ctx.fillStyle='rgba(6,14,32,.66)';rr(x-tw/2,y-th/2,tw,th,th/2);ctx.fill();txt(s,x,y,{font:f,color:c||'#f2f5fa',dir:o.dir});}
function wlabel(t,x,y,c,o){ctx.font=F(o.w||600,o.s||12.5);if(ctx.measureText(t).width+26<LBW){label(t,x,y,c,o);return;}const ws=t.split(' ');let best=1,bd=1e9;for(let i=1;i<ws.length;i++){const a=ctx.measureText(ws.slice(0,i).join(' ')).width,b=ctx.measureText(ws.slice(i).join(' ')).width;if(Math.abs(a-b)<bd){bd=Math.abs(a-b);best=i;}}
  const h=(o.s||12.5)+11;label(ws.slice(0,best).join(' '),x,y-h/2,c,o);label(ws.slice(best).join(' '),x,y+h/2,c,o);}
function drawBg(){ctx.setTransform(DPR,0,0,DPR,0,0);const g=ctx.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,Math.max(W,H)*0.75);g.addColorStop(0,col.glow);g.addColorStop(0.55,col.navy);g.addColorStop(1,col.deep);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function ball(x,y,r,base){const g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.1,x,y,r);g.addColorStop(0,base[0]);g.addColorStop(0.55,base[1]);g.addColorStop(1,base[2]);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=g;ctx.fill();}
function mtxt(s,x,y,size,c){ctx.font=`italic 600 ${Math.round(size*L.fs)}px "Times New Roman",serif`;ctx.fillStyle=c||'#eaf0fa';ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='ltr';ctx.fillText(s,x,y);}
function wave(x0,y0,x1,y1,c,amp,lm,ph,w,a){const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy);if(l<10)return;const ux=dx/l,uy=dy/l;ctx.globalAlpha=a==null?1:a;ctx.strokeStyle=c;ctx.lineWidth=w||3;ctx.lineCap='round';ctx.beginPath();
  for(let s=0;s<=l-6;s+=1.5){const e=Math.min(1,s/12,(l-6-s)/10+0.3),o=Math.sin(s/lm*6.283-ph)*amp*e;const x=x0+ux*s-uy*o,y=y0+uy*s+ux*o;s?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();arrowHead(x1,y1,Math.atan2(dy,dx),8,c);ctx.globalAlpha=1;ctx.lineCap='butt';}
function tailBall(x,y,r,c,dir){const len=r*4.5,gx=ctx.createLinearGradient(x,0,x-dir*len,0);gx.addColorStop(0,c===EL?'rgba(224,71,158,.75)':'rgba(255,255,255,.6)');gx.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gx;ctx.beginPath();ctx.moveTo(x,y-r*0.7);ctx.lineTo(x-dir*len,y-r*0.15);ctx.lineTo(x-dir*len,y+r*0.15);ctx.lineTo(x,y+r*0.7);ctx.closePath();ctx.fill();ball(x,y,r,c);}
function wire(pts){ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle='#8f98a8';ctx.lineWidth=6;ctx.stroke();ctx.strokeStyle='#e4e9f1';ctx.lineWidth=2.6;ctx.stroke();ctx.lineCap='butt';}
function polyLen(p){let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return s;}
function polyAt(p,d){for(let i=1;i<p.length;i++){const l=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(d<=l){const t=d/l;return[p[i-1][0]+(p[i][0]-p[i-1][0])*t,p[i-1][1]+(p[i][1]-p[i-1][1])*t];}d-=l;}return p[p.length-1];}
function ion(x,y,r,s){ctx.fillStyle=s==='−'?'rgba(150,170,230,.85)':'rgba(255,170,120,.85)';ctx.fillRect(x-r,y-r,2*r,2*r);txt(s,x,y+0.5,{font:`800 ${(r*1.9).toFixed(1)}px system-ui`,color:'#10141c',dir:'ltr'});}
const EL=['#ffd6ef','#e0479e','#6a0f45'],HOLE=['#ffffff','#e6e9ef','#8a90a0'];

function eqn(parts,x,y,size,c,align){ctx.save();ctx.direction='ltr';ctx.textBaseline='middle';const f=(sz)=>`italic 700 ${sz}px "Times New Roman",serif`;let tot=0;parts.forEach(p=>{ctx.font=f(p[1]?size*0.62:size);p.w=ctx.measureText(p[0]).width;tot+=p.w;});let xx=align==='left'?x:align==='right'?x-tot:x-tot/2;ctx.fillStyle=c;ctx.textAlign='left';
  parts.forEach(p=>{ctx.font=f(p[1]?size*0.62:size);ctx.fillText(p[0],xx,y+(p[1]?size*0.3:0));xx+=p.w;});ctx.restore();return tot;}





/* ---------- state ---------- */
const S={npn:false,bias:false,run:true};
let yawUser=null,pitchUser=null,tt=0;
const A=0.8,Bz=0.55,EY0=-1.3,EY1=-0.15,BY1=0.13,CY1=1.2,X2=2.05;
const regs=()=>{const p=S.npn?['N','P','N']:['P','N','P'];return[{k:'E',y0:EY0,y1:EY1,t:p[0],n:'الباعث',d:'تطعيم عالٍ',cnt:28},{k:'B',y0:EY1,y1:BY1,t:p[1],n:'القاعدة',d:'رقيقة، تطعيم قليل',cnt:5},{k:'C',y0:BY1,y1:CY1,t:p[2],n:'الجامع',d:'تطعيم متوسط',cnt:14}];};
const hsh=n=>{const v=Math.sin(n*12.9898+78.233)*43758.5453;return v-Math.floor(v);};
const STAT=[];[28,5,14].forEach((c,ri)=>{for(let k=0;k<c;k++)STAT.push({r:ri,u:hsh(ri*100+k),v:hsh(ri*100+k+50),w:hsh(ri*100+k+90)});});

/* ---------- layout & projection ---------- */
let REG={};
function layout(){const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;W=nw;H=nh;DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);narrow=W<H*0.95;L.fs=narrow?1.04:1;arrange();}
function arrange(){FIT.s=0;const top=H<500?58:66,m=8;REG={main:{x:m,y:top,w:W-2*m,h:H-top-m,k:1,vw:W-2*m,vh:H-top-m}};}
const toWorld=s=>({x:(s.x-view.x)/view.z,y:(s.y-view.y)/view.z});
function setReg(){const R=REG.main,z=view.z;ctx.setTransform(DPR*z,0,0,DPR*z,DPR*(view.z*R.x+view.x),DPR*(view.z*R.y+view.y));}
let CAM={cx:0,cy:0,s:100,yaw:0.5,pitch:0.42};const FIT={s:0,cx:0,cy:0};
function P3(x,y,z){const c=Math.cos(CAM.yaw),s=Math.sin(CAM.yaw),cp=Math.cos(CAM.pitch),sp=Math.sin(CAM.pitch),xr=x*c-z*s,zr=x*s+z*c;return{X:CAM.cx+CAM.s*xr,Y:CAM.cy-CAM.s*(y*cp-zr*sp),d:y*sp+zr*cp};}
const VIS=(nx,ny,nz)=>ny*Math.sin(CAM.pitch)+(nx*Math.sin(CAM.yaw)+nz*Math.cos(CAM.yaw))*Math.cos(CAM.pitch);
function poly(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.X,p.Y):ctx.moveTo(p.X,p.Y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}

  return[F2('top',[0,1,0],1.18,[c(-a,y1,-b),c(a,y1,-b),c(a,y1,b),c(-a,y1,b)]),F2('bot',[0,-1,0],0.7,[c(-a,y0,-b),c(a,y0,-b),c(a,y0,b),c(-a,y0,b)]),F2('+x',[1,0,0],0.8,[c(a,y0,-b),c(a,y1,-b),c(a,y1,b),c(a,y0,b)]),F2('-x',[-1,0,0],0.8,[c(-a,y0,-b),c(-a,y1,-b),c(-a,y1,b),c(-a,y0,b)]),
    F2('+z',[0,0,1],0.98,[c(-a,y0,b),c(a,y0,b),c(a,y1,b),c(-a,y1,b)]),F2('-z',[0,0,-1],0.98,[c(-a,y0,-b),c(a,y0,-b),c(a,y1,-b),c(-a,y1,-b)])];}
const RC=t=>t==='P'?[220,80,105]:[80,105,230];
const rgb=(c,k,a)=>`rgba(${Math.min(255,c[0]*k)|0},${Math.min(255,c[1]*k)|0},${Math.min(255,c[2]*k)|0},${a})`;

/* ---------- buttons ---------- */
function btn(b,on){rr(b.x,b.y,b.w,b.h,b.h/2);ctx.fillStyle=on?'rgba(255,210,122,.22)':hover===b.id?'rgba(255,255,255,.14)':'rgba(255,255,255,.07)';ctx.fill();ctx.strokeStyle=on?'#ffd27a':'rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.stroke();
  txt(b.l,b.x+b.w/2,b.y+b.h/2,{font:F(600,narrow?11.5:12.5),color:on?'#ffe2a8':col.ink});}
function rowBtns(list,y){const R={w:REG.main.vw},gap=8;ctx.font=F(600,12.5);let ws=list.map(b=>Math.max(44,ctx.measureText(b.l).width+26));let tot=ws.reduce((a,b)=>a+b,0)+gap*(list.length-1);
  if(tot>R.w-12){list=list.map(b=>({...b,l:b.s||b.l}));ws=list.map(b=>Math.max(36,ctx.measureText(b.l).width+18));tot=ws.reduce((a,b)=>a+b,0)+gap*(list.length-1);}
  let x=(R.w+tot)/2;return list.map((b,i)=>{x-=ws[i];const r={...b,id:'m'+b.k,x,y,w:ws[i],h:32};x-=gap;return r;});}
const rows=()=>[{k:'pnp',l:'ترانزستور pnp',s:'pnp'},{k:'npn',l:'ترانزستور npn',s:'npn'},{k:'bias',l:S.bias?'⚡ البطاريات موصولة':'⚡ صِل البطاريات',s:'⚡'},{k:'run',l:S.run?'⏸ إيقاف':'▶ تشغيل',s:S.run?'⏸':'▶'}];

/* ---------- geometry ---------- */
function geo(){const R=REG.main,w=R.vw,h=R.vh,two=w<760,stepY1=h-108,stepY2=h-108,eY=0,capY=h-74,figTop=34,figBot=h-128,figH=figBot-figTop;
  const s=two?Math.min(figH/4.1,(w-84)/3.0):Math.min(figH/4.0,w*0.55/3.0);const cx=two?64+0.95*s:w*0.42,cy=figTop+figH*0.5+0.05*s;
  return{w,h,two,stepY1,stepY2,eY,capY,figTop,figBot,figH,s,cx,cy};}

/* ---------- flowing carriers ---------- */
const FLOW=[];let SP=0,FT=0;const CYC=5;
function pathPos(q){// q.t progress in "units": E part, B part, C part, then lead / base lead
  const t=q.t;if(t<1)return{x:q.x,y:EY0+0.05+(EY1-EY0-0.05)*t,z:q.z,ph:0};

  for(let k=FLOW.length-1;k>=0;k--){const q=FLOW[k];q.t+=dt*(q.t<1?0.9:q.t<1.4?1.6:0.95);if((!q.base&&q.t>=3.3)||(q.base&&q.t>=2.2))FLOW.splice(k,1);}
  if(!S.bias)FLOW.length=0;}

  let step=-1;if(S.bias){const t=FT;const fq={x:0.15,z:0.25,t:0,base:false};if(t<1.5){fq.t=t/1.5;step=0;}else if(t<2.3){fq.t=1+0.4*(t-1.5)/0.8;step=1;}else if(t<4){fq.t=1.4+1.9*(t-2.3)/1.7;step=2;}else step=3;
    if(step<3){const pp=pathPos(fq);if(pp)items.push({p:P3(pp.x,pp.y,pp.z),c:car,r:0.11,a:pp.a==null?1:pp.a,ring:1});}
    else{const bq={x:-0.2,z:0.1,t:1.2+(t-4)};const pp=basePos(bq);items.push({p:P3(pp.x,pp.y,pp.z),c:car,r:0.11,a:pp.a==null?1:Math.max(0.2,pp.a),ring:1});}}
  items.sort((a,b)=>a.p.d-b.p.d).forEach(it=>{const r=it.r*CAM.s*(1+it.p.d*0.08);ctx.globalAlpha=it.a==null?1:it.a;if(it.glow){const gg=ctx.createRadialGradient(it.p.X,it.p.Y,r*0.5,it.p.X,it.p.Y,r*2.4);gg.addColorStop(0,'rgba(255,230,140,.55)');gg.addColorStop(1,'rgba(255,230,140,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(it.p.X,it.p.Y,r*2.4,0,7);ctx.fill();}ball(it.p.X,it.p.Y,r,it.c);if(it.ring){ctx.beginPath();ctx.arc(it.p.X,it.p.Y,r*2.1,0,7);ctx.strokeStyle='#ffd27a';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);}ctx.globalAlpha=1;});
  DF.filter(f=>f.vis>0).forEach(f=>poly(f.p,'rgba(232,194,46,.24)'));

  R3.forEach(r=>{const y=P3(0,(r.y0+r.y1)/2,0).Y;ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lx,y);ctx.lineTo(minX+(onR?-4:4),y);ctx.stroke();

/* ---------- input: drag rotates the crystal ---------- */
const ptrs=new Map();let pinch=null,lastTap=0;
function scr(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function hitAt(s){const w=toWorld(s),R=REG.main;if(!R)return null;const p={x:w.x-R.x,y:w.y-R.y};for(const b of btnsOf())if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return{b};return null;}
function act(b){const k=b.k;if(k==='pnp')S.npn=false;else if(k==='npn')S.npn=true;else if(k==='bias'){S.bias=!S.bias;FT=0;}else if(k==='run')S.run=!S.run;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const s=scr(e);ptrs.set(e.pointerId,s);
  if(ptrs.size===2){drag=null;const[a,b]=[...ptrs.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},z0:view.z,x0:view.x,y0:view.y};return;}
  const h=hitAt(s);if(h){act(h.b);return;}
  const now=performance.now();if(now-lastTap<320){view={z:1,x:0,y:0};yawUser=null;pitchUser=null;}lastTap=now;drag={s0:s,y0:CAM.yaw,p0:CAM.pitch};cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{const s=scr(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,s);
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},z=clamp(pinch.z0*d/pinch.d0,0.6,5),wx=(pinch.m0.x-pinch.x0)/pinch.z0,wy=(pinch.m0.y-pinch.y0)/pinch.z0;view={z,x:mid.x-wx*z,y:mid.y-wy*z};return;}
  if(!drag){const h=hitAt(s);hover=h?h.b.id:null;cv.style.cursor=h?'pointer':'grab';return;}
  yawUser=drag.y0-(s.x-drag.s0.x)*0.01;pitchUser=clamp(drag.p0+(s.y-drag.s0.y)*0.01,-1.45,1.45);});
function pointerEnd(e){ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;return;}drag=null;cv.style.cursor='grab';}
cv.addEventListener('pointerup',pointerEnd);cv.addEventListener('pointercancel',pointerEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();const s=scr(e),f=Math.exp(-e.deltaY*0.0015),z=clamp(view.z*f,0.6,5),wx=(s.x-view.x)/view.z,wy=(s.y-view.y)/view.z;view={z,x:s.x-wx*z,y:s.y-wy*z};},{passive:false});

/* ---------- teacher hint ---------- */
window.__explain=function(){const t=S.npn?'npn':'pnp',cr=S.npn?'الالكترونات':'الفجوات';
  const b=`<p>الترانزستور نبيطة (جهاز device) تتكون من <b>ثلاث مناطق</b> مصنوعة من مادة شبه موصلة (سليكون أو جرمانيوم)، يفصل بينها <b>ملتقيان</b>. المناطق الثلاث تسمى: <b>الباعث Emitter</b> ويرمز له E، و<b>القاعدة Base</b> ويرمز لها B، و<b>الجامع Collector</b> ويرمز له C.</p>
<p>منطقة الباعث <b>تُطعَّم دائماً بنسبة عالية</b> من الشوائب، ومنطقة القاعدة <b>تُطعَّم بنسبة قليلة</b>، أما منطقة الجامع فتكون نسبة الشوائب فيها <b>متوسطة نسبياً</b> (لاحظ عدد الحاملات في كل منطقة).</p>
<p>ويكون الترانزستور بنوعين: <b>pnp</b> (الشكل 35) و<b>npn</b> (الشكل 36). المعروض الآن: <b>${t}</b>، والحاملات الأغلبية في الباعث هي <b>${cr}</b>.</p>
<p>بما أن <b>الباعث</b> هو الذي يجهّز حاملات الشحنة (charge carriers) لذا فإنه <b>يحيّز دائماً انحيازاً أمامياً</b>.</p><p>وبما أن <b>الجامع</b> يعمل على جذب تلك الحاملات خلال القاعدة لذا فإنه <b>يحيّز دائماً انحيازاً عكسياً</b>.</p>
<p class="m">I_E = I_B + I_C</p><p class="note">لأن القاعدة رقيقة وقليلة التطعيم، تعبرها معظم الحاملات إلى الجامع ولا يخرج من طرفها إلا القليل، فيكون I_B صغيراً جداً مقارنة بـ I_C. في رمز الترانزستور يشير سهم الباعث إلى اتجاه التيار الاصطلاحي: إلى الداخل في pnp وإلى الخارج في npn.</p>`;
  return{t:'الترانزستور: '+t,b:b+`<p class="nums">جرّب: ${S.bias?'بدّل بين pnp وnpn ولاحظ أن الحاملات المتحركة تتغير (فجوات أو الكترونات) وتنعكس قطبية البطاريات واتجاه التيارات.':'اسحب المجسم لتدويره، ثم اضغط «صِل البطاريات».'}</p>`};};

<script>
(function(){const b=document.getElementById('fsBtn'),ico=document.getElementById('fsIco'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const t=document.createElement('div');t.className='toast';t.hidden=true;t.textContent='ملء الشاشة غير متاح هنا. افتح الملف أو الرابط بالمتصفح';document.querySelector('.stage').appendChild(t);
  let tm=0;const toast=()=>{t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>t.hidden=true,3200);};
  const sync=()=>{ico.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');b.setAttribute('aria-label',isFs()?'الخروج من ملء الشاشة':'ملء الشاشة');};
  b.addEventListener('click',()=>{
    if(isFs()){try{exit.call(document);}catch(e){}return;}
    if(!req||document.fullscreenEnabled===false){toast();return;}
    try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(toast);setTimeout(()=>{if(!isFs())toast();},700);}catch(e){toast();}});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);})();

(function(){const b=document.getElementById('tipBtn'),p=document.getElementById('tipPanel'),t=document.getElementById('tipTitle'),body=document.getElementById('tipBody');
  let iv=0,last='';
  const fill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===last)return;last=h;t.textContent=r.t;body.innerHTML=r.b;};
  const open=v=>{p.hidden=!v;b.setAttribute('aria-expanded',v);b.classList.toggle('on',v);clearInterval(iv);if(v){last='';fill();iv=setInterval(fill,400);}};
  b.addEventListener('click',()=>open(p.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>open(false));})();
</script>
