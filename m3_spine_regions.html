(function(){
'use strict';

const $=id=>document.getElementById(id);

const W=SIM.width,H=SIM.height;
let timers=[],layers=[],labelsVisible=true;
function clearTimers(){timers.forEach(clearTimeout);timers=[];}

function applyLabelVisibility(){document.body.classList.toggle('labels-hidden',!labelsVisible);const b=$('labelsToggle');b.textContent=labelsVisible?'🏷':'🙈';b.title=labelsVisible?'إخفاء التأشيرات':'إظهار التأشيرات';b.setAttribute('aria-label',b.title);}
let next=0,running=false;
function setPlayBtn(){const b=$('replay');b.textContent=running?'\u23F8\uFE0E':'\u25B6\uFE0E';b.title=running?'إيقاف مؤقت':'متابعة التأشيرات';b.setAttribute('aria-label',b.title);}
function schedule(delay){clearTimers();if(next>=layers.length){running=false;setPlayBtn();return}running=true;setPlayBtn();

  timers.push(setTimeout(tick,delay));}

  const M=SIM.motion,g=mk('g',{'class':'base'},view),defs=mk('defs',{},g),n=M.strips||40,sh=H/n;

  for(let i=0;i<n;i++){
    const cp=mk('clipPath',{id:'cs'+i},defs);mk('rect',{x:-20,y:i*sh-0.6,width:W+40,height:sh+1.2},cp);

$('labelsToggle').onclick=()=>{labelsVisible=!labelsVisible;applyLabelVisibility()};
let sc=1,tx=0,ty=0;
function apply(){view.setAttribute('transform','translate('+tx+' '+ty+') scale('+sc+')')}
function zoom(factor,point){let next=Math.max(.6,Math.min(5,sc*factor));let k=next/sc;tx=point.x-(point.x-tx)*k;ty=point.y-(point.y-ty)*k;sc=next;apply()}

$('zin').onclick=()=>zoom(1.3,center());$('zout').onclick=()=>zoom(1/1.3,center());
function setFs(on){document.body.classList.toggle('fs',on);$('fs').textContent=on?'✕':'⛶';$('fs').title=on?'إنهاء ملء الشاشة':'ملء الشاشة'}
