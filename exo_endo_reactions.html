<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>الكيمياء الحرارية</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#eef6fb;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #stage{position:relative;flex:1;min-height:0;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;background:radial-gradient(circle at 55% 45%,#f6fcff 0%,#cfe8f3 100%);padding-bottom:env(safe-area-inset-bottom,0px)}
  #svgWrap{position:absolute;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);right:0;left:calc(var(--bw) + 22px + env(safe-area-inset-left,0px))}
  svg#svg{width:100%;height:100%;display:block;overflow:visible;touch-action:none;cursor:grab;transition:opacity .3s}
  :root{--bw:126px;--zb:42px}
  body.fsx #svgWrap{left:0}

  /* ---- left controls: zoom group on top, stage buttons under it (transparent) ---- */
  #side{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));bottom:8px;width:var(--bw);z-index:5;
        display:flex;flex-direction:column;align-items:flex-start;gap:14px;overflow-y:auto;direction:ltr}
  .zb{display:flex;flex-direction:column;gap:8px;direction:ltr}
  .zb button{width:var(--zb);height:var(--zb);border-radius:50%;border:2px solid #1f3a52;background:transparent;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;
             display:flex;align-items:center;justify-content:center;padding:0}
  .zb svg{width:20px;height:20px;pointer-events:none}
  .sysList{display:flex;flex-direction:column;gap:7px;width:100%;direction:rtl}
  .sys{width:100%;padding:6px 8px;border-radius:8px;border:1.5px solid rgba(31,58,82,.45);background:transparent;color:#1f3a52;
       font:bold 14px Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.3;text-align:center;cursor:pointer;
       transition:color .25s,border-color .25s,transform .15s}
  .sys:active{transform:scale(.97)}
  .sys.on{background:transparent;border-color:#c4623a;border-width:2.5px;color:#a8431b}
  .sys.all{border-style:dashed}
  .sys:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  @media (max-width:560px),(max-height:440px){
    :root{--bw:92px;--zb:34px}
    #side{top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));gap:10px}
    .zb{gap:6px}.zb button{font-size:18px}.zb svg{width:16px;height:16px}
    .sys{padding:4px 5px;font-size:11.5px;border-radius:7px}
    .sysList{gap:5px}
  }
  @media (max-height:400px){:root{--zb:30px}#side{gap:6px}.zb{gap:4px}}

  svg text{direction:rtl}
  .pill{fill:#fff;stroke:#c4623a;stroke-width:2.5}
  .lbl{fill:#a8431b;font-size:19px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .ln{stroke:#c4623a;stroke-width:2.2;fill:none}
  .td{fill:#c4623a;stroke:#fff;stroke-width:1.5}
  .hd{transition:opacity .35s}
  .hName{fill:#1f3a52;font-size:32px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .hEn{fill:#3f6f93;font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .capBox{fill:#1f3a52}
  .capTxt{fill:#fff;font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .ax{fill:#1f3a52;font-size:19px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .lvA{fill:#1f3a52;font-size:17px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .frm{fill:#3f6f93;font-size:19px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .eq{fill:#1f3a52;font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .sg{font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .sgA{font-size:16px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .pT{fill:#1f3a52;font-size:22px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .pC{fill:#3f6f93;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .eT{font-size:16px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .note{fill:#fff;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<div id="stage">
  <div id="side">
    <div class="zb">
      <button id="zin" title="تكبير">+</button><button id="zout" title="تصغير">−</button><button id="zreset" title="إرجاع">⟲</button>
      <button id="fs" title="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path id="fsI" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="sysList">
      <button class="sys" data-i="1">تفاعل باعث للحرارة</button>
      <button class="sys" data-i="2">تفاعل ماص للحرارة</button>
      <button class="sys" data-i="3">تغير فيزيائي باعث</button>
      <button class="sys" data-i="4">تغير فيزيائي ماص</button>
      <button class="sys all" data-i="5">الباعث والماص معاً</button>
    </div>
  </div>
  <div id="svgWrap">
  <svg id="svg" viewBox="0 0 900 670" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="gGlass" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#c9e6f5"/><stop offset=".35" stop-color="#eef8fd"/><stop offset="1" stop-color="#bfe0f1"/></linearGradient>
      <linearGradient id="gWat" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a9dcf3"/><stop offset="1" stop-color="#6fb9de"/></linearGradient>
      <linearGradient id="gFl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffd24a"/><stop offset="1" stop-color="#f0702a"/></linearGradient>
      <radialGradient id="gHg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#b9c0c6"/><stop offset="1" stop-color="#7c858c"/></radialGradient>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <clipPath id="cVes"><path d="M137,326 L137,560 Q137,583 160,583 L310,583 Q333,583 333,560 L333,326 Z"/></clipPath>
      <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d63a3a"/></marker>
      <marker id="ahB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2a7fb8"/></marker>
      <marker id="ahD" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3a52"/></marker>
    </defs>
    <g id="view"></g>
  </svg>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg", PI=Math.PI;
const svg=document.getElementById('svg'), view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const txt=(cls,x,y,s,p)=>{const e=el('text',{class:cls,x,y},p);e.textContent=s;return e;};
const cl=x=>Math.min(1,Math.max(0,x)), ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const vis=(g,o)=>{g.setAttribute('opacity',o.toFixed(2));g.setAttribute('display',o<.01?'none':'');};
const NAVY='#1f3a52', RED='#d63a3a', BLU='#2a7fb8';
/* صيغة كيميائية: الرقم بعد _ يكتب أسفل السطر */
const chem=s=>s.split(/_(\d)/).map((x,i)=>i%2?`<tspan dy="5" font-size="72%">${x}</tspan>`:(i?`<tspan dy="-5">${x}</tspan>`:x)).join('');
const EN=c=>`<tspan fill="${c}">Energy</tspan>`;

/* ---------- stages: 0 تمهيد، 1-4 أمثلة الكتاب، 5 الباعث والماص معاً ---------- */
const TX=[
 {n:'الكيمياء الحرارية',e:'Thermochemistry',c:'دراسة الحرارة الممتصة والمنبعثة في التغيرات'},
 {n:'تفاعل باعث للحرارة',e:'Exothermic Reaction',c:'النظام يحرر الحرارة إلى المحيط'},
 {n:'تفاعل ماص للحرارة',e:'Endothermic Reaction',c:'النظام يمتص الحرارة من المحيط'},
 {n:'تغير فيزيائي باعث',e:'Exothermic Physical Change',c:'تكثف بخار الماء يحرر حرارة'},
 {n:'تغير فيزيائي ماص',e:'Endothermic Physical Change',c:'انصهار الجليد يمتص حرارة'},
 {n:'الباعث والماص معاً',e:'Exothermic & Endothermic',c:'إشارة ΔH تحدد نوع التفاعل'}
];
/* e: 0 باعث، 1 ماص — g: محتوى الوعاء */
const ST=[null,
 {e:0,g:0,R:'2H_2(g) + O_2(g)',P:'2H_2O(l)'},
 {e:1,g:1,R:'2HgO(s)',P:'2Hg(l) + O_2(g)'},
 {e:0,g:2,R:'H_2O(g)',P:'H_2O(l)'},
 {e:1,g:3,R:'H_2O(s)',P:'H_2O(l)'}
];
const eqHTML=s=>s.e?chem(s.R)+' + '+EN(BLU)+' → '+chem(s.P):chem(s.R)+' → '+chem(s.P)+' + '+EN(RED);

/* ================= single view ================= */
const sG=el('g',{},view);

/* ---- thermometer of the surroundings ---- */
const TH0=556, THH=290;                                   // قاع العمود وارتفاعه
el('rect',{x:31,y:250,width:18,height:316,rx:9,fill:'#fff',stroke:'#7fb0cc','stroke-width':3},sG);
const merc=el('rect',{x:36,width:8,rx:4,fill:RED},sG);
el('circle',{cx:40,cy:576,r:17,fill:RED,stroke:'#7fb0cc','stroke-width':3},sG);
for(let k=0;k<=8;k++)el('line',{x1:52,y1:TH0-k*THH/8,x2:k%2?58:63,y2:TH0-k*THH/8,stroke:'#7fb0cc','stroke-width':2},sG);

/* ---- vessel (the system) ---- */
const OUT='M135,326 L135,560 Q135,585 160,585 L310,585 Q335,585 335,560 L335,326';
el('path',{d:OUT+' Z',fill:'url(#gGlass)'},sG);
const inG=el('g',{'clip-path':'url(#cVes)'},sG);
const water=el('rect',{x:130,width:210,fill:'url(#gWat)',opacity:.9},inG);
const wTop=el('line',{x1:137,x2:333,stroke:'#e9f7fd','stroke-width':3,opacity:.9},inG);
/* g0: احتراق الهيدروجين */
const c0=el('g',{},inG);
const gas=[...Array(14)].map((_,k)=>({x:160+((k*47)%150),y:360+((k*71)%170),ph:k*1.7,o2:k%3===0,
  e:el('circle',{r:k%3===0?7:4.5,fill:k%3===0?'#e2574c':'#fff',stroke:k%3===0?'#a8332a':'#7f8f9a','stroke-width':1.5},c0)}));
const flame=el('g',{},c0);
el('path',{d:'M0,-78 C24,-44 38,-20 26,6 C19,24 -19,24 -26,6 C-38,-20 -13,-40 0,-78 Z',fill:'url(#gFl)'},flame);
el('path',{d:'M0,-40 C11,-22 17,-10 11,4 C8,12 -8,12 -11,4 C-17,-10 -6,-20 0,-40 Z',fill:'#fff3b0'},flame);
const dew=[[150,372],[322,360],[148,430],[320,440],[152,500],[318,505],[190,345],[285,350]].map(([x,y])=>el('ellipse',{cx:x,cy:y,rx:3.4,ry:4.6,fill:'#e4f3fb',stroke:'#7fb0cc','stroke-width':1},c0));
/* g1: تفكك أوكسيد الزئبق */
const c1=el('g',{},inG);
const mound=el('ellipse',{cx:235,cy:583,fill:'#d4552a',stroke:'#a83c18','stroke-width':2},c1);
const hg=[[178,570,13],[215,566,10],[262,571,15],[298,567,11],[240,560,9]].map(([x,y,r])=>({r,e:el('circle',{cx:x,cy:y,fill:'url(#gHg)',stroke:'#6d767d','stroke-width':1},c1)}));
const bub=[...Array(10)].map((_,k)=>({x:165+((k*53)%140),p:(k*.137)%1,v:.16+((k*7)%5)*.03,e:el('circle',{fill:'none',stroke:'#e2574c','stroke-width':1.8},c1)}));
/* g2: تكثف بخار الماء */
const c2=el('g',{},inG);
const vg=el('g',{filter:'url(#blur)'},c2);
const vap=[...Array(24)].map((_,k)=>({x:150+((k*37)%170),y:345+((k*59)%190),ph:k*.9,r:9+(k%4)*3,e:el('circle',{fill:'#9fbfd2'},vg)}));
const rain=[...Array(7)].map((_,k)=>({x:160+((k*61)%150),p:(k*.19)%1,e:el('ellipse',{rx:3,ry:5,fill:'#6fb9de'},c2)}));
/* g3: انصهار الجليد */
const c3=el('g',{},inG);
const ice=[185,238,290].map((x,k)=>({x,k,e:el('rect',{fill:'#e6f6fd',stroke:'#8cc3de','stroke-width':2.5,rx:6},c3)}));
const CG=[c0,c1,c2,c3];
el('path',{d:OUT,fill:'none',stroke:'#7fb0cc','stroke-width':4,'stroke-linejoin':'round','stroke-linecap':'round'},sG);
el('path',{d:'M150,345 L150,540',stroke:'#fff','stroke-width':6,'stroke-linecap':'round','stroke-opacity':.5},sG);
el('rect',{x:126,y:318,width:218,height:12,rx:6,fill:'#d7ecf7',stroke:'#7fb0cc','stroke-width':3},sG);

/* ---- heat arrows: out (exothermic) / in (endothermic) ---- */
const AR=[[[125,400],[72,385]],[[125,500],[72,515]],[[345,400],[425,385]],[[345,500],[425,515]],[[190,308],[170,252]],[[280,308],[300,252]]];
const mkArr=(a,b,col,mk,p)=>el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:col,'stroke-width':5,'stroke-linecap':'round','marker-end':`url(#${mk})`,'stroke-dasharray':'14 8'},p);
const exoG=el('g',{},sG), endoG=el('g',{},sG);
const arrs=[];AR.forEach(([a,b])=>{arrs.push(mkArr(a,b,RED,'ah',exoG));arrs.push(mkArr(b,a,BLU,'ahB',endoG));});

/* ---- labels (pill + leader, as in the reference) ---- */
function label(cx,cy,w,s,tip,p){const g=el('g',{'pointer-events':'none'},p);
  el('line',{class:'ln',x1:cx,y1:cy,x2:tip[0],y2:tip[1]},g);el('circle',{class:'td',r:5,cx:tip[0],cy:tip[1]},g);
  el('rect',{class:'pill',x:cx-w/2,y:cy-19,width:w,height:38,rx:19},g);const t=txt('lbl',cx,cy,s,g);return {g,t};}
label(235,632,200,'النظام (التفاعل)',[235,566],sG);
label(380,200,100,'المحيط',[392,300],sG);
const dyn=el('g',{class:'hd'},sG);                       // النصوص التي تتغير مع المرحلة
const thL=label(152,205,262,'',[42,254],dyn);
const heatL=label(392,628,96,'حرارة',[402,514],dyn);

/* ---- enthalpy diagram ---- */
el('line',{x1:480,y1:592,x2:480,y2:204,stroke:NAVY,'stroke-width':4,'stroke-linecap':'round','marker-end':'url(#ahD)'},sG);
txt('ax',480,176,'الانثالبي H',sG);
const lvR=el('line',{x1:520,x2:670,stroke:NAVY,'stroke-width':6,'stroke-linecap':'round'},sG);
const lvP=el('line',{x1:700,x2:850,stroke:NAVY,'stroke-width':6,'stroke-linecap':'round'},sG);
const nmR=txt('lvA',595,0,'المتفاعلات',sG), nmP=txt('lvA',775,0,'النواتج',sG);
const fR=el('text',{class:'frm',x:595},dyn), fP=el('text',{class:'frm',x:775},dyn);
const actG=el('g',{},dyn);                               // سهم ΔH والإشارة
const dHa=el('line',{x1:685,x2:685,'stroke-width':5,'stroke-linecap':'round'},actG);
const sgBox=el('rect',{x:715,y:366,width:120,height:40,rx:20,fill:'#fff','stroke-width':2.5},actG);
const sgT=el('text',{class:'sg',x:775,y:386},actG), sgA=el('text',{class:'sgA',x:775,y:424},actG);
const htBox=el('rect',{x:527,y:371,width:136,height:38,rx:19,'stroke-width':0},actG);
const htT=el('text',{class:'note',x:595,y:390},actG);
const dot=el('circle',{r:9,stroke:'#fff','stroke-width':3},actG);
/* equation bar */
const eqG=el('g',{},dyn);
el('rect',{x:462,y:612,width:420,height:42,rx:21,fill:'#fff',stroke:NAVY,'stroke-width':2.5},eqG);
const eqT=el('text',{class:'eq',x:672,y:633},eqG);

function setDyn(i){
  const s=ST[i||1], act=i>=1&&i<=4, col=s.e?BLU:RED;
  fR.innerHTML=chem(s.R);fP.innerHTML=chem(s.P);
  thL.t.textContent=!act?'درجة حرارة المحيط':s.e?'درجة حرارة المحيط تنخفض':'درجة حرارة المحيط ترتفع';
  vis(heatL.g,act?1:0);vis(actG,act?1:0);vis(eqG,act?1:0);
  dHa.setAttribute('stroke',col);dHa.setAttribute('marker-end',`url(#${s.e?'ahB':'ah'})`);
  sgBox.setAttribute('stroke',col);sgT.setAttribute('fill',col);sgA.setAttribute('fill',col);
  sgT.textContent=s.e?'ΔH > 0':'ΔH < 0';sgA.textContent=s.e?'القيمة موجبة (+)':'القيمة سالبة (−)';
  htBox.setAttribute('fill',col);htT.textContent=s.e?'تُمتص حرارة':'تنبعث حرارة';dot.setAttribute('fill',col);
  eqT.innerHTML=eqHTML(s);
}

/* ================= compare view (the book's figure) ================= */
const cmpG=el('g',{},view);
const cmpDots=[];
function panel(ox,endo){
  const g=el('g',{},cmpG), col=endo?BLU:RED, s=ST[endo?2:1];
  el('rect',{x:ox,y:168,width:410,height:452,rx:16,fill:'#fff',opacity:.6,stroke:'#b9d3e2','stroke-width':1.5},g);
  txt('pT',ox+205,196,endo?'التفاعل الماص للحرارة':'التفاعل الباعث للحرارة',g);
  txt('pC',ox+205,224,endo?'فيه يمتص النظام الحرارة من المحيط':'فيه يحرر النظام الحرارة إلى المحيط',g);
  el('line',{x1:ox+38,y1:566,x2:ox+38,y2:272,stroke:NAVY,'stroke-width':3.5,'stroke-linecap':'round','marker-end':'url(#ahD)'},g);
  txt('pC',ox+38,252,'الانثالبي',g);
  const yR=endo?500:310, yP=endo?310:500;
  el('line',{x1:ox+70,y1:yR,x2:ox+210,y2:yR,stroke:NAVY,'stroke-width':6,'stroke-linecap':'round'},g);
  el('line',{x1:ox+232,y1:yP,x2:ox+372,y2:yP,stroke:NAVY,'stroke-width':6,'stroke-linecap':'round'},g);
  el('text',{class:'frm',x:ox+140,y:yR+(endo?26:-22)},g).innerHTML=chem(s.R);
  el('text',{class:'frm',x:ox+302,y:yP+(endo?-22:26)},g).innerHTML=chem(s.P);
  el('line',{x1:ox+221,y1:yR+(endo?-10:10),x2:ox+221,y2:yP+(endo?12:-12),stroke:col,'stroke-width':5,'stroke-linecap':'round','marker-end':`url(#${endo?'ahB':'ah'})`},g);
  const ea=endo?[[ox+100,400],[ox+206,400]]:[[ox+236,400],[ox+342,400]];
  arrs.push(mkArr(ea[0],ea[1],col,endo?'ahB':'ah',g));
  const et=txt('eT',endo?ox+152:ox+290,378,'طاقة',g);et.setAttribute('fill',col);
  [['ΔH '+(endo?'>':'<')+' 0',ox+140],['ΔH = '+(endo?'+':'−'),ox+272]].forEach(([s2,cx])=>{
    el('rect',{x:cx-58,y:570,width:116,height:38,rx:19,fill:'#fff',stroke:col,'stroke-width':2.5},g);
    const t=txt('sg',cx,589,s2,g);t.setAttribute('fill',col);});
  cmpDots.push({e:el('circle',{r:8,fill:col,stroke:'#fff','stroke-width':3},g),a:[ox+140,yR],b:[ox+302,yP]});
}
panel(470,false);panel(30,true);                          // الباعث على اليمين (اتجاه القراءة)
el('rect',{x:160,y:628,width:580,height:36,rx:18,fill:NAVY},cmpG);
txt('note',450,646,'كلمة Energy مع المتفاعلات: ماص للحرارة — مع النواتج: باعث للحرارة',cmpG);

/* ================= header (top right) ================= */
const hd=el('g',{class:'hd'},view);
const hName=el('text',{class:'hName',x:765,y:44},hd), hEn=el('text',{class:'hEn',x:765,y:82},hd);
const capBox=el('rect',{class:'capBox',y:106,height:40,rx:20},hd), capTxt=el('text',{class:'capTxt',x:765,y:126},hd);
const fit=(t,pad,min)=>{let w=min;try{w=t.getComputedTextLength()+pad;}catch(e){}w=Math.max(w,min);const cx=Math.min(765,884-w/2);t.setAttribute('x',cx);return [cx,w];};
function setHead(i){hName.textContent=TX[i].n;hEn.textContent=TX[i].e;capTxt.textContent=TX[i].c;
  hName.setAttribute('x',765);hEn.setAttribute('x',765);capTxt.setAttribute('x',765);
  fit(hName,0,100);fit(hEn,0,100);const [cx,w]=fit(capTxt,40,160);capBox.setAttribute('x',cx-w/2);capBox.setAttribute('width',w);}

/* ================= state & animation loop ================= */
let idx=0, shown=1, t0=-1e9, last=0, mixT=0;
const sm={e:0,ex:0,en:0,th:.5,mix:0,c:[1,0,0,0],wat:0};
const DUR=6;                                              // ثوانٍ لاكتمال التغير
function frame(ms){
  const t=ms/1000, dt=Math.min(.1,Math.max(0,(ms-last)/1000));last=ms;
  const s=ST[shown], act=idx>=1&&idx<=4, k=Math.min(1,dt*4);
  const p=act?cl(((ms-t0)/1000-.6)/DUR):0;
  sm.e+=(s.e-sm.e)*k;sm.ex+=((act&&!s.e?1:0)-sm.ex)*k;sm.en+=((act&&s.e?1:0)-sm.en)*k;
  sm.th+=((.5+(act?(s.e?-.3:.3)*p:0))-sm.th)*k;sm.mix+=(mixT-sm.mix)*Math.min(1,dt*4.5);
  sm.c.forEach((v,j)=>sm.c[j]=v+((s.g===j?1:0)-v)*k);
  vis(sG,1-sm.mix);vis(cmpG,sm.mix);
  const off=(-t*36%22).toFixed(1);arrs.forEach(a=>a.setAttribute('stroke-dashoffset',off));

  if(sm.mix<.99){
    /* thermometer */
    const mh=THH*cl(sm.th);merc.setAttribute('y',(TH0-mh).toFixed(1));merc.setAttribute('height',(mh+14).toFixed(1));
    vis(exoG,sm.ex);vis(endoG,sm.en);
    /* vessel contents */
    const wt=[26*p,0,12+78*p,26+62*p][s.g];sm.wat+=(wt-sm.wat)*k;
    const wy=583-sm.wat;water.setAttribute('y',wy.toFixed(1));water.setAttribute('height',(sm.wat+20).toFixed(1));
    wTop.setAttribute('y1',wy.toFixed(1));wTop.setAttribute('y2',wy.toFixed(1));vis(wTop,sm.wat>2?.9:0);
    CG.forEach((g,j)=>vis(g,sm.c[j]));
    if(sm.c[0]>.01){
      gas.forEach(q=>{q.e.setAttribute('cx',(q.x+10*Math.sin(t*1.6+q.ph)).toFixed(1));q.e.setAttribute('cy',(q.y+12*Math.cos(t*1.3+q.ph*1.3)).toFixed(1));q.e.setAttribute('opacity',(1-p).toFixed(2));});
      const fo=(p>0&&p<1)?Math.min(1,p*8)*Math.min(1,(1-p)*6):0, fs=.85+.12*Math.sin(t*13)+.05*Math.sin(t*29);
      flame.setAttribute('transform',`translate(235 ${(wy-4).toFixed(1)}) scale(${(1+.06*Math.sin(t*17)).toFixed(3)} ${fs.toFixed(3)})`);vis(flame,fo);
      dew.forEach((d,j)=>d.setAttribute('opacity',(cl(p*1.4-j*.04)*(.6+.4*Math.sin(t*1.3+j))).toFixed(2)));
    }
    if(sm.c[1]>.01){
      const m=1-.6*p;mound.setAttribute('rx',(88*m).toFixed(1));mound.setAttribute('ry',(46*m).toFixed(1));
      hg.forEach((h,j)=>h.e.setAttribute('r',(h.r*cl(p*1.5-j*.08)).toFixed(1)));
      const bo=(p>0&&p<1)?Math.min(1,p*8)*Math.min(1,(1-p)*6):0;
      bub.forEach(b=>{const u=(b.p+b.v*t)%1;b.e.setAttribute('cx',(b.x+4*Math.sin(t*3+b.x)).toFixed(1));b.e.setAttribute('cy',(560-u*220).toFixed(1));b.e.setAttribute('r',(3+u*4).toFixed(1));b.e.setAttribute('opacity',(bo*Math.sin(PI*u)).toFixed(2));});
    }
    if(sm.c[2]>.01){
      vap.forEach(q=>{q.e.setAttribute('cx',(q.x+12*Math.sin(t*1.1+q.ph)).toFixed(1));q.e.setAttribute('cy',(q.y+10*Math.cos(t*.9+q.ph)).toFixed(1));q.e.setAttribute('r',q.r);q.e.setAttribute('opacity',(.8*(1-p)*(q.y<wy-8?1:0)).toFixed(2));});
      const ro=(p>0&&p<1)?Math.min(1,p*8)*Math.min(1,(1-p)*6):0;
      rain.forEach(d=>{const u=(d.p+t*.55)%1;d.e.setAttribute('cx',d.x);d.e.setAttribute('cy',(340+u*(wy-340)).toFixed(1));d.e.setAttribute('opacity',(ro*Math.sin(PI*u)).toFixed(2));});
    }
    if(sm.c[3]>.01){
      ice.forEach(q=>{const sz=50*(1-p);q.e.setAttribute('rx',Math.min(6,sz/4).toFixed(1));q.e.setAttribute('opacity',sz<3?0:1);const y=wy-sz*.45+3*Math.sin(t*1.8+q.k*2);
        q.e.setAttribute('x',(q.x-sz/2).toFixed(1));q.e.setAttribute('y',y.toFixed(1));q.e.setAttribute('width',sz.toFixed(1));q.e.setAttribute('height',sz.toFixed(1));
        q.e.setAttribute('transform',`rotate(${(8*Math.sin(t+q.k*2.1)).toFixed(1)} ${q.x} ${(y+sz/2).toFixed(1)})`);});
    }
    /* enthalpy levels */
    const yR=280+220*sm.e, yP=500-220*sm.e;
    lvR.setAttribute('y1',yR);lvR.setAttribute('y2',yR);lvP.setAttribute('y1',yP);lvP.setAttribute('y2',yP);
    const up=y=>y<390;
    nmR.setAttribute('y',yR+(up(yR)?-48:52));fR.setAttribute('y',yR+(up(yR)?-22:26));
    nmP.setAttribute('y',yP+(up(yP)?-48:52));fP.setAttribute('y',yP+(up(yP)?-22:26));
    const dir=yP>yR?1:-1, len=Math.abs(yP-yR);
    dHa.setAttribute('y1',yR+dir*10);dHa.setAttribute('y2',yP-dir*12);vis(dHa,len>60?1:0);
    const u=(Math.max(0,(ms-t0)/1000-.6)%3.4)/3.4, q=ease(cl(u/.7));
    dot.setAttribute('cx',(595+180*q).toFixed(1));dot.setAttribute('cy',(yR+(yP-yR)*q).toFixed(1));dot.setAttribute('opacity',Math.sin(PI*cl(u/.85)).toFixed(2));
  }
  if(sm.mix>.01){
    const u=(t%3.4)/3.4, q=ease(cl(u/.7));
    cmpDots.forEach(d=>{d.e.setAttribute('cx',(d.a[0]+(d.b[0]-d.a[0])*q).toFixed(1));d.e.setAttribute('cy',(d.a[1]+(d.b[1]-d.a[1])*q).toFixed(1));d.e.setAttribute('opacity',Math.sin(PI*cl(u/.85)).toFixed(2));});
  }
  requestAnimationFrame(frame);
}

/* ---------- navigation ---------- */
const btns=[...document.querySelectorAll('.sys')];
function setUI(i){hd.style.opacity=0;if(i<5)dyn.style.opacity=0;
  setTimeout(()=>{setHead(i);hd.style.opacity=1;if(i<5){setDyn(i);dyn.style.opacity=1;}},200);
  btns.forEach(b=>b.classList.toggle('on',+b.dataset.i===i));}
function go(i){                                           // الضغط على الزر نفسه يعيد الحركة من البداية
  const same=i===idx;idx=i;t0=performance.now();
  if(i===5)mixT=1;else{mixT=0;shown=i||1;}
  if(!same)setUI(i);
}
btns.forEach(b=>b.onclick=()=>go(+b.dataset.i));
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowDown')go(idx>=5?1:idx+1);
  if(e.key==='ArrowRight'||e.key==='ArrowUp')go(idx<=1?5:idx-1);
});
setHead(0);setDyn(0);requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>setHead(idx)).catch(()=>{});

/* ---------- zoom & pan ---------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{try{svg.setPointerCapture(e.pointerId);}catch(_){}ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prev=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prev.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,dd=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(dd/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:335});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:335});
document.getElementById('zreset').onclick=reset;
apply();

/* ---------- fullscreen ---------- */
/* ملء شاشة حقيقي إن سمح المتصفح، وإلا وضع تكبير داخل الصفحة (الرسم يأخذ كامل المساحة) */
const D=document,R=D.documentElement,fsI=document.getElementById('fsI');
const isFs=()=>!!(D.fullscreenElement||D.webkitFullscreenElement);
let fsx=false;
const fsIcon=()=>fsI.setAttribute('d',(isFs()||fsx)?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
const setFsx=v=>{fsx=v;D.body.classList.toggle('fsx',v);fsIcon();};
document.getElementById('fs').onclick=()=>{
  if(fsx){setFsx(false);return;}
  if(isFs()){try{(D.exitFullscreen||D.webkitExitFullscreen).call(D);}catch(e){}return;}
  const f=R.requestFullscreen||R.webkitRequestFullscreen;
  if(!f){setFsx(true);return;}
  try{const p=f.call(R);if(p&&p.catch)p.catch(()=>setFsx(true));}catch(e){setFsx(true);return;}
  setTimeout(()=>{if(!isFs()&&!fsx)setFsx(true);},400);
};
D.addEventListener('fullscreenchange',fsIcon);D.addEventListener('webkitfullscreenchange',fsIcon);
})();
</script>
