<title>تركيب عظام الجمجمة في الإنسان</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:#fff;user-select:none;-webkit-user-select:none}
#top{height:56px;background:#1f3a52;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(16px,2.8vw,23px);font-weight:800}
#stage{position:absolute;top:56px;bottom:0;width:100%;overflow:hidden;background:#fff}
#scene{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#controls{position:absolute;z-index:4;top:13px;left:13px;display:flex;flex-direction:column;gap:8px}
#controls button{width:43px;height:43px;border-radius:50%;background:white;color:#1f3a52;border:2px solid #1f3a52;box-shadow:0 2px 10px #122f4c28;font-size:21px;cursor:pointer;transition:transform .16s}
#controls button:active{transform:scale(.92)}
#hint{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font-size:13px;color:#607383;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .5s}
.bone{filter:drop-shadow(0 9px 12px #152a4130);will-change:transform,opacity}
.bone.fly{opacity:0}
.bone.arrive{opacity:1;transition:transform 1.12s cubic-bezier(.17,.77,.2,1),opacity .55s ease}
.bone.settle{filter:none}
#complete{opacity:0;transition:opacity .8s ease}
.mark{opacity:0;transform:scale(.82);transform-box:fill-box;transform-origin:center;transition:opacity .7s ease,transform .7s cubic-bezier(.2,1.25,.4,1)}
.mark.show{opacity:1;transform:scale(1)}
.mark line,.mark path{fill:none;stroke:#111;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700;transition:stroke-dashoffset 1.3s ease .12s}
.mark.show line,.mark.show path{stroke-dashoffset:0}
.mark text{fill:#111;font-size:22px;font-weight:800;text-anchor:middle;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}
.dot{fill:#e67f4b;stroke:white;stroke-width:2}
#toast{position:absolute;bottom:43px;left:50%;transform:translateX(-50%) translateY(10px);background:#1f3a52;color:white;border-radius:25px;padding:9px 22px;font-size:15px;font-weight:bold;opacity:0;transition:.4s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
body.fs #top{display:none}body.fs #stage{top:0}
@media(max-width:560px){#top{height:50px}#stage{top:50px}body.fs #stage{top:0}#controls button{width:38px;height:38px;font-size:19px}#hint{font-size:11px}}
</style>

const img=(parent)=>el('image',{href:source,x:0,y:0,width:1189,height:627,preserveAspectRatio:'none'},parent);
function pathD(p){return 'M'+p.trim().split(/\s+/).map(s=>s.replace(',',' ')).join('L')+'Z'}
function marker(b,i){const name='clip-'+i,clip=el('clipPath',{id:name,clipPathUnits:'userSpaceOnUse'},defs);el('path',{d:pathD(b.p)},clip);const holder=el('g',{transform:`translate(${b.v==='front'?-75:75} 0)`},art);const g=el('g',{class:'bone fly','data-name':b.n},holder);g.style.cursor='pointer';g.style.transform=`translate(${b.dx}px,${b.dy}px) scale(.93)`;const grp=el('g',{'clip-path':`url(#${name})`},g);img(grp);g.addEventListener('click',()=>{if(!interactive)return;toast.textContent=b.n;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1300);});return g}
// Label anchor coordinates follow the exact front-and-side correspondence in the supplied annotated figure.
const annotations=[
 {name:'العظم الجبهي',x:568,y:106,lines:[[474,111,231,214],[660,111,819,208]]},
 {name:'العظم الجداري',x:568,y:184,lines:[[475,189,343,247],[662,189,1012,236]]},
 {name:'العظم الصدغي',x:568,y:258,lines:[[475,264,341,307],[662,264,960,345]]},
 {name:'محجر العين',x:568,y:335,lines:[[479,341,271,321],[659,341,787,332]]},
 {name:'عظام الأنف',x:568,y:411,lines:[[479,416,208,366]]},
 {name:'عظام الفكين',x:568,y:489,lines:[[479,496,213,445],[479,496,221,527],[658,496,769,447],[658,496,777,520]]},
 {name:'العظم المؤخري',x:1066,y:552,lines:[[1066,514,1105,400]]}
];
function label(a){const g=el('g',{class:'mark'},labels);for(const [sx,sy,ex,ey] of a.lines){el('path',{d:`M${sx} ${sy} L${ex} ${ey}`},g)}el('text',{x:a.x,y:a.y},g).textContent=a.name;return g}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}function later(fn,ms){timers.push(setTimeout(fn,ms))}
function setCamera(){camera.setAttribute('transform',`translate(${tx} ${ty}) scale(${z})`)}
function resetCam(){z=1;tx=ty=0;setCamera()}
function applyView(){svg.setAttribute('viewBox','0 0 1189 627');resetCam()}
function play(){seq++;const serial=seq;clearTimers();interactive=false;toast.classList.remove('on');hint.style.opacity=0;defs.innerHTML='';art.innerHTML='';labels.innerHTML='';applyView();
 const visible=bones;gs=visible.map(marker);let base=el('g',{id:'complete'},art);base.style.opacity='0';
 const frontClip=el('clipPath',{id:'front-complete',clipPathUnits:'userSpaceOnUse'},defs);el('rect',{x:108,y:115,width:340,height:475},frontClip);
 const sideClip=el('clipPath',{id:'side-complete',clipPathUnits:'userSpaceOnUse'},defs);el('rect',{x:622,y:115,width:455,height:475},sideClip);
 img(el('g',{transform:'translate(-75 0)','clip-path':'url(#front-complete)'},base));
 img(el('g',{transform:'translate(75 0)','clip-path':'url(#side-complete)'},base));
 let badgeNodes=annotations.map(label);
 const interval=290,assembleAt=550;
 visible.forEach((b,i)=>later(()=>{if(serial!==seq)return;const g=gs[i];g.classList.remove('fly');g.classList.add('arrive');requestAnimationFrame(()=>{g.style.transform='translate(0px,0px) scale(1)'});},assembleAt+i*interval));
 const end=assembleAt+(visible.length-1)*interval+1250;
 later(()=>{base.style.opacity='1';gs.forEach(g=>{g.style.opacity='0';g.style.pointerEvents='none'});},end);
 badgeNodes.forEach((node,i)=>later(()=>{if(labelsVisible)node.classList.add('show')},end+600+i*1150));
 later(()=>{interactive=true;toast.textContent='اكتمل تركيب عظام الجمجمة';toast.classList.add('on');hint.style.opacity=1;later(()=>toast.classList.remove('on'),2200)},end+600+badgeNodes.length*1150);
}
document.getElementById('toggleLabels').onclick=()=>{labelsVisible=!labelsVisible;document.getElementById('toggleLabels').textContent=labelsVisible?'◉':'◎';document.getElementById('toggleLabels').setAttribute('aria-label',labelsVisible?'إخفاء التأشيرات':'إظهار التأشيرات');document.querySelectorAll('.mark').forEach(m=>m.classList.toggle('show',labelsVisible&&interactive));};
function zoom(k,cx,cy){const nz=Math.max(.65,Math.min(5,z*k)),ratio=nz/z;tx=cx-(cx-tx)*ratio;ty=cy-(cy-ty)*ratio;z=nz;setCamera()}
function center(){const v=svg.viewBox.baseVal;return {x:v.x+v.width/2,y:v.y+v.height/2}}
document.getElementById('plus').onclick=()=>{const c=center();zoom(1.25,c.x,c.y)};
document.getElementById('minus').onclick=()=>{const c=center();zoom(.8,c.x,c.y)};
document.getElementById('reset').onclick=resetCam;
document.getElementById('replay').onclick=play;
let pointerMap=new Map(),prevPinch=0;
function point(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:q.x,y:q.y}}
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pointerMap.set(e.pointerId,point(e));});
svg.addEventListener('pointermove',e=>{if(!pointerMap.has(e.pointerId))return;const old=pointerMap.get(e.pointerId),now=point(e);pointerMap.set(e.pointerId,now);if(pointerMap.size===1){tx+=now.x-old.x;ty+=now.y-old.y;setCamera()}else if(pointerMap.size===2){const ps=[...pointerMap.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);if(prevPinch)zoom(d/prevPinch,(ps[0].x+ps[1].x)/2,(ps[0].y+ps[1].y)/2);prevPinch=d;}});
const stop=e=>{pointerMap.delete(e.pointerId);prevPinch=0};svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(e.deltaY<0?1.12:.89,p.x,p.y)},{passive:false});
document.getElementById('fullscreen').onclick=async()=>{const fs=!!document.fullscreenElement;if(fs){try{await document.exitFullscreen()}catch(e){}document.body.classList.remove('fs')}else{try{await document.documentElement.requestFullscreen()}catch(e){document.body.classList.add('fs')}}};
document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fs',!!document.fullscreenElement));
play();
})();
</script>
