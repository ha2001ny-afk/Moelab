<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>التكاثر في عفن الخبز الأسود</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
  #go{min-width:170px;height:56px;padding:0 26px;border-radius:28px;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font:bold 21px Tahoma,"Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  #go:active{background:#d9ebf7}
  #go:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  .lb{fill:#1f3a52;font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .bd{fill:#1f3a52;font-size:16px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<div id="top"><div id="title">التكاثر في عفن الخبز الأسود</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 900 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="gHy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf3df"/><stop offset=".5" stop-color="#ecd3a3"/><stop offset="1" stop-color="#c99d5f"/></linearGradient>
        <pattern id="gTex" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#e6b872"/><circle cx="3" cy="3" r="1.6" fill="#c48a3e"/><circle cx="8" cy="7" r="1.5" fill="#c99247"/><circle cx="7.5" cy="2" r="1.1" fill="#f6d9a4"/><circle cx="2" cy="8" r="1" fill="#f6d9a4"/></pattern>
        <pattern id="gTexZ" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d6a05c"/><circle cx="3" cy="3" r="1.7" fill="#a46c2c"/><circle cx="8" cy="7" r="1.6" fill="#ad7533"/><circle cx="7.5" cy="2" r="1.1" fill="#ecc68a"/><circle cx="2" cy="8" r="1" fill="#ecc68a"/></pattern>
        <radialGradient id="gShade" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#5a3510" stop-opacity=".35"/></radialGradient>
        <radialGradient id="gZsp" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#8d6a4e"/><stop offset=".6" stop-color="#4e3524"/><stop offset="1" stop-color="#22160e"/></radialGradient>
        <radialGradient id="gSpS" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#c79a66"/><stop offset=".6" stop-color="#7a5229"/><stop offset="1" stop-color="#3e2712"/></radialGradient>
        <radialGradient id="gSpg" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#857b74"/><stop offset=".55" stop-color="#3a3330"/><stop offset="1" stop-color="#141110"/></radialGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <radialGradient id="gPh1" cx=".45" cy=".4" r=".8"><stop offset="0" stop-color="#f7e3e7"/><stop offset="1" stop-color="#c9a0ad"/></radialGradient>
        <radialGradient id="gPh2" cx=".5" cy=".35" r=".85"><stop offset="0" stop-color="#7fb0bf"/><stop offset="1" stop-color="#1f4352"/></radialGradient>
        <radialGradient id="gPhS" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#e3f1f4"/><stop offset=".6" stop-color="#8fb9c5"/><stop offset="1" stop-color="#3f6f7f"/></radialGradient>
        <linearGradient id="gCrL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8874a"/><stop offset="1" stop-color="#8f521f"/></linearGradient>
        <linearGradient id="gCrR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7773b"/><stop offset="1" stop-color="#7d4415"/></linearGradient>
        <pattern id="crumb" width="30" height="22" patternUnits="userSpaceOnUse"><rect width="30" height="22" fill="#f3d8a0"/><ellipse cx="7" cy="6" rx="3.6" ry="2.2" fill="#ddae66" opacity=".8"/><ellipse cx="21" cy="14" rx="2.8" ry="1.8" fill="#ddae66" opacity=".75"/><ellipse cx="12" cy="18" rx="1.8" ry="1.2" fill="#d6a55c" opacity=".75"/><circle cx="26" cy="4" r="1.1" fill="#d39f56"/><circle cx="3" cy="15" r="1" fill="#fbe9c4"/></pattern>
        <clipPath id="cp1"><circle cx="720" cy="105" r="50"/></clipPath>
        <clipPath id="cp2"><rect x="25" y="395" width="105" height="92" rx="6"/></clipPath>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl"><button id="go">ابدأ</button></div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const lp2=(p,q,u)=>[lerp(p[0],q[0],u),lerp(p[1],q[1],u)];
const bez=(a,c,b,u)=>lp2(lp2(a,c,u),lp2(c,b,u),u);
const show=(e,op)=>{if(op<.01){e.style.display='none';return false;}e.style.display='';e.setAttribute('opacity',f2(op));return true;};
const pop=v=>v*(1+.25*Math.sin(PI*v));
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

const DUR=[4.5,4.5,4.5,4.5,5,6,6.5,6];
const DARK='#1f2a44';
const world=G(view);
const Lbg=G(world),Lbr=G(world),Larr=G(world),Lobj=G(world),Llab=G(world),Ltok=G(world);

/* ---------------- building blocks ---------------- */
function Ball(parent,grad,stroke,r){const g=G(parent);
  el('circle',{r,fill:`url(#${grad})`,stroke,'stroke-width':1},g);
  el('ellipse',{cx:-r*.35,cy:-r*.4,rx:r*.3,ry:r*.2,fill:'#fff',opacity:.5},g);return{g,r};}
function setBall(b,p,s,op){if(!show(b.g,op*(s>.02?1:0)))return;b.g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f2(s)})`);}
function Arr(d,col,w,hs){w=w||3.2;hs=hs||1;const g=G(Larr),p=el('path',{d,fill:'none',stroke:col,'stroke-width':w,'stroke-linecap':'round'},g),L=p.getTotalLength();
  const e=p.getPointAtLength(L),q=p.getPointAtLength(L-10),a=Math.atan2(e.y-q.y,e.x-q.x),c=Math.cos(a),s=Math.sin(a),H=15*hs,W=7*hs;
  const h=el('polygon',{points:[[e.x+4*hs*c,e.y+4*hs*s],[e.x-H*c+W*s,e.y-H*s-W*c],[e.x-H*c-W*s,e.y-H*s+W*c]].map(v=>v.map(f1).join(',')).join(' '),fill:col},g);
  return{g,p,h,L,cut:8*hs,at:u=>{const v=p.getPointAtLength(u*L);return[v.x,v.y];}};}
function drawArr(A,v){if(!show(A.g,v>.005?1:0))return;A.p.setAttribute('stroke-dasharray',`${f1(v*(A.L-A.cut))} ${f1(A.L+20)}`);A.h.setAttribute('opacity',f2(sm(v,.9,1)));}
function lobed(R,n,amp,o){o=o||{};const ry=o.ry||1,ph=o.ph||0,N=180;let d='';
  for(let i=0;i<N;i++){const a=i/N*2*PI,w=o.abs?2*Math.abs(Math.cos(n*a/2+ph))-1:Math.cos(n*a+ph),r=R*(1+amp*w);
    d+=(i?'L':'M')+f1(r*Math.cos(a))+','+f1(r*ry*Math.sin(a));}return d+'Z';}
function Obj(x,y,p){return{g:G(p||Lobj),x,y};}
function setO(o,s,op){if(show(o.g,(op==null?1:op)*(s>.02?1:0)))o.g.setAttribute('transform',`translate(${o.x} ${o.y}) scale(${f2(s)})`);}
function Lab(lines,x,y,a,b,fs){fs=fs||18;const g=G(Llab);
  if(a){el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#1f3a52','stroke-width':2},g);
  el('circle',{cx:b[0],cy:b[1],r:3,fill:'#1f3a52'},g);}
  lines.forEach((s,i)=>{const t=el('text',{class:'lb',x,y:y+i*fs*1.35},g);t.style.fontSize=fs+'px';t.textContent=s;});return g;}
function RLab(s,x,y,rot,fs){const g=G(Llab);const t=el('text',{class:'lb',x,y,transform:`rotate(${rot} ${x} ${y})`},g);t.style.fontSize=(fs||17)+'px';t.textContent=s;return g;}
function Badge(n,x,y){const g=G(Llab);el('rect',{x:x-13,y:y-13,width:26,height:26,rx:4,fill:'#fff',stroke:'#1f3a52','stroke-width':2},g);
  const t=el('text',{class:'bd',x,y:y+1},g);t.textContent=n;return g;}
function tube(p,x1,x2,h){return el('rect',{x:Math.min(x1,x2),y:-h/2,width:Math.abs(x2-x1),height:h,rx:h/2,fill:'url(#gHy)',stroke:'#9c7a4a','stroke-width':1.5},p);}
function Hy(d,p,w){const g=G(p||Lobj);
  const o=el('path',{d,fill:'none',stroke:'#8f6d43','stroke-width':w+2.4,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1},g);
  const i=el('path',{d,fill:'none',stroke:'#f6e8cc','stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1},g);return{g,o,i};}
function setHy(h,v){if(show(h.g,v>.003?1:0)){const da=`${v.toFixed(3)} 2`;h.o.setAttribute('stroke-dasharray',da);h.i.setAttribute('stroke-dasharray',da);}}
function Line(d,col,w,p){return el('path',{d,fill:'none',stroke:col,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1},p||Lobj);}
function setL(e,v){if(show(e,v>.003?1:0))e.setAttribute('stroke-dasharray',`${v.toFixed(3)} 2`);}
/* dark warty zygosporangium */
function Warty(p,R){const g=G(p);R=R||29;
  el('path',{d:lobed(R,16,.07,{abs:1}),fill:'url(#gZsp)',stroke:'#1e130b','stroke-width':2},g);
  for(let i=0;i<18;i++){const a=i/18*2*PI+.2;el('circle',{cx:f1((R+3)*Math.cos(a)),cy:f1((R+3)*Math.sin(a)),r:R*.12,fill:'#3d2a1c'},g);}
  for(let i=0;i<10;i++){const a=i*2.3,d=R*(.2+.6*((i*37%10)/10));el('circle',{cx:f1(d*Math.cos(a)),cy:f1(d*Math.sin(a)),r:R*.07,fill:'#6e513b'},g);}
  el('ellipse',{cx:-R*.38,cy:-R*.45,rx:R*.28,ry:R*.16,fill:'#fff',opacity:.22},g);return g;}
/* sporangium */
function Spg(p,r,grad){const g=G(p);
  el('circle',{r,fill:`url(#${grad||'gSpg'})`,stroke:'#120e0c','stroke-width':1.3},g);
  for(let i=0;i<10;i++){const a=i*2.4,d=r*(.25+.55*((i*37%10)/10));el('circle',{cx:f1(d*Math.cos(a)),cy:f1(d*Math.sin(a)),r:f1(r*.08),fill:'#a89c93',opacity:.8},g);}
  el('ellipse',{cx:-r*.35,cy:-r*.42,rx:r*.3,ry:r*.17,fill:'#fff',opacity:.35},g);return g;}

/* ---------------- sexual-cycle wedge (grey area) ---------------- */
const wedge=el('path',{d:'M15,55L475,215L15,375Z',fill:'#e9ecef',stroke:'#d5dade','stroke-width':2},Lbg);

/* ---------------- bread slice ---------------- */
const A=[140,480],B=[690,425],C=[870,545],D=[320,615],Ab=[140,565],Cb=[870,630],Db=[320,700];
const pts=a=>a.map(p=>p.join(',')).join(' ');
const BR=G(Lbr);
el('ellipse',{cx:520,cy:704,rx:360,ry:12,fill:'#000',opacity:.08},BR);
el('polygon',{points:pts([A,D,Db,Ab]),fill:'url(#gCrL)',stroke:'#7a4215','stroke-width':2,'stroke-linejoin':'round'},BR);
el('polygon',{points:pts([D,C,Cb,Db]),fill:'url(#gCrR)',stroke:'#7a4215','stroke-width':2,'stroke-linejoin':'round'},BR);
el('polygon',{points:pts([A,B,C,D]),fill:'url(#crumb)',stroke:'#b8732f','stroke-width':9,'stroke-linejoin':'round'},BR);
el('polygon',{points:pts([A,B,C,D]),fill:'none',stroke:'#e5b071','stroke-width':2.5,'stroke-linejoin':'round'},BR);
/* crumb texture on the cut sides */
for(let i=0;i<26;i++){const u=rnd(),v=rnd();
  const p=u<.3?lp2(lp2(A,D,u/.3),lp2(Ab,Db,u/.3),.15+.7*v):lp2(lp2(D,C,(u-.3)/.7),lp2(Db,Cb,(u-.3)/.7),.15+.7*v);
  el('ellipse',{cx:f1(p[0]),cy:f1(p[1]),rx:f1(2+rnd()*3),ry:f1(1+rnd()*1.5),fill:'#6e3a10',opacity:.35},BR);}
const inTop=(x,y)=>{const Q=[A,B,C,D];for(let i=0;i<4;i++){const p=Q[i],q=Q[(i+1)%4];if((q[0]-p[0])*(y-p[1])-(q[1]-p[1])*(x-p[0])<0)return false;}return true;};

/* ---------------- stage 1: hyphae approach ---------------- */
const F1=Obj(320,300);
const h1L=G(F1.g),h1R=G(F1.g);
tube(h1L,-88,-18,18);el('ellipse',{cx:-14,cy:0,rx:14,ry:14,fill:'url(#gTex)',stroke:'#9c7a4a','stroke-width':1.5},h1L);
el('ellipse',{cx:-14,cy:0,rx:14,ry:14,fill:'url(#gShade)'},h1L);
tube(h1R,18,88,18);el('ellipse',{cx:14,cy:0,rx:14,ry:14,fill:'url(#gTex)',stroke:'#9c7a4a','stroke-width':1.5},h1R);
el('ellipse',{cx:14,cy:0,rx:14,ry:14,fill:'url(#gShade)'},h1R);
const glS1=el('circle',{cx:320,cy:300,r:42,fill:'url(#gGlow)',opacity:0},Ltok);

/* ---------------- stage 2: gametangia (خلايا الأمشاج) ---------------- */
const F2=Obj(170,190);
tube(F2.g,-88,-28,18);tube(F2.g,28,88,18);
const gL=G(F2.g),gR=G(F2.g);
[gL,gR].forEach(g=>{el('rect',{x:-15,y:-22,width:30,height:44,rx:10,fill:'url(#gTex)',stroke:'#9c7a4a','stroke-width':1.5},g);
  el('rect',{x:-15,y:-22,width:30,height:44,rx:10,fill:'url(#gShade)'},g);});
const sep2=G(F2.g);[-30,30].forEach(x=>el('line',{x1:x,y1:-11,x2:x,y2:11,stroke:'#5e3f1f','stroke-width':3.4,'stroke-linecap':'round'},sep2));
el('line',{x1:0,y1:-21,x2:0,y2:21,stroke:'#9c7a4a','stroke-width':1.6},F2.g);

/* ---------------- stage 3: zygote (زيجة) ---------------- */
const F3=Obj(330,70);
tube(F3.g,-88,-30,18);tube(F3.g,30,88,18);
el('path',{d:'M-33,-8Q-34,-26 -14,-27Q0,-31 14,-27Q34,-26 33,-8L33,8Q34,26 14,27Q0,31 -14,27Q-34,26 -33,8Z',fill:'url(#gTexZ)',stroke:'#8a5f2c','stroke-width':1.6},F3.g);
el('path',{d:'M-33,-8Q-34,-26 -14,-27Q0,-31 14,-27Q34,-26 33,-8L33,8Q34,26 14,27Q0,31 -14,27Q-34,26 -33,8Z',fill:'url(#gShade)'},F3.g);
const wall3=el('line',{x1:0,y1:-27,x2:0,y2:27,stroke:'#8a5f2c','stroke-width':2},F3.g);
[-33,33].forEach(x=>el('line',{x1:x,y1:-10,x2:x,y2:10,stroke:'#5e3f1f','stroke-width':3.4,'stroke-linecap':'round'},F3.g));

/* ---------------- stage 4: zygosporangium (حافظة زيجية) ---------------- */
const F4=Obj(520,120);
tube(F4.g,-84,-24,18);tube(F4.g,24,84,18);
const z4in=el('path',{d:'M-30,-6Q-30,-24 -12,-25Q0,-28 12,-25Q30,-24 30,-6L30,6Q30,24 12,25Q0,28 -12,25Q-30,24 -30,6Z',fill:'url(#gTexZ)',stroke:'#8a5f2c','stroke-width':1.5},F4.g);
const z4=Warty(F4.g,29);
/* magnified photo of zygosporangium */
const PH1=G(Lobj);
el('line',{x1:588,y1:112,x2:668,y2:107,stroke:'#8a95a0','stroke-width':1.6,'stroke-dasharray':'5 5'},PH1);
const ph1c=G(PH1,{'clip-path':'url(#cp1)'});
el('rect',{x:665,y:50,width:115,height:115,fill:'url(#gPh1)'},ph1c);
for(let i=0;i<7;i++)el('path',{d:`M${670+i*16},${60+(i*29)%90}q20,10 40,-6`,fill:'none',stroke:'#e7c3cc','stroke-width':3,opacity:.7},ph1c);
const ph1z=G(ph1c,{transform:'translate(720 108)'});
el('rect',{x:-62,y:-10,width:40,height:20,rx:10,fill:'#c59a72',stroke:'#8a6440','stroke-width':1.2,transform:'rotate(-12)'},ph1z);
el('rect',{x:22,y:-10,width:40,height:20,rx:10,fill:'#c59a72',stroke:'#8a6440','stroke-width':1.2,transform:'rotate(-12)'},ph1z);
Warty(ph1z,25);
el('circle',{cx:720,cy:105,r:50,fill:'none',stroke:'#5b6b78','stroke-width':3},PH1);

/* ---------------- stage 5: germination -> sporangium ---------------- */
const F5=Obj(600,340);
tube(F5.g,-46,-24,16);tube(F5.g,24,46,16);
Warty(F5.g,26);
const stk5=Hy('M598,314C600,292 582,276 574,262',Lobj,5);
const spG=Obj(570,245);
el('path',{d:'M-10,10Q-11,-6 0,-8Q11,-6 10,10Z',fill:'#efe1c4',stroke:'#9c7a4a','stroke-width':1.4},spG.g);
const spDark=Spg(spG.g,18,'gSpS');
const glS5=el('circle',{cx:570,cy:245,r:50,fill:'url(#gGlow)',opacity:0},Ltok);
/* spores from the zygospore's sporangium -> germinate on bread */
const GP=[770,515];
const SP=[];for(let i=0;i<26;i++){const a=i/26*2*PI+.3,bp=[570+30*Math.cos(a),245+30*Math.sin(a)],tg=[GP[0]+(rnd()-.5)*64,GP[1]+(rnd()-.5)*24];
  SP.push({c:el('circle',{r:2.7,fill:'#4a3a2e',stroke:'#2a1f17','stroke-width':.6},Lobj),bp,tg,ctrl:[(bp[0]+tg[0])/2+50,Math.min(bp[1],tg[1])-30]});}
const GERM=[];for(let i=0;i<16;i++){const a=i/16*2*PI+rnd()*.3,l=12+rnd()*16,x=GP[0]+(rnd()-.5)*50,y=GP[1]+(rnd()-.5)*18;
  GERM.push(Line(`M${f1(x)},${f1(y)}q${f1(l*.5*Math.cos(a)+4)},${f1(l*.4*Math.sin(a)-3)} ${f1(l*Math.cos(a))},${f1(l*.55*Math.sin(a))}`,'#7d7166',1.4));}

/* ---------------- asexual growth on bread ---------------- */
const NET=[];let tries=0;while(NET.length<30&&tries<400){tries++;const x=220+rnd()*480,y=450+rnd()*150;if(!inTop(x,y))continue;
  const a=rnd()*2*PI,l=18+rnd()*26,ex=x+l*Math.cos(a),ey=y+l*.5*Math.sin(a);if(!inTop(ex,ey))continue;
  NET.push(Line(`M${f1(x)},${f1(y)}Q${f1((x+ex)/2+(rnd()-.5)*14)},${f1((y+ey)/2+(rnd()-.5)*10)} ${f1(ex)},${f1(ey)}`,'#8c8174',1.3));}
const STO=['M235,522Q282,468 330,520','M330,520Q395,452 460,500','M460,500Q525,448 590,505','M330,522Q352,560 400,600','M590,505Q640,466 690,522'].map(d=>Hy(d,Lobj,2.6));
const NODES=[[330,520],[460,500],[400,600],[590,505]];
const RZ=NODES.map(([x,y],j)=>{const L=j===2?1.9:1;
  return Line(`M${x},${y+2}l${-9*L},${18*L}l${-8*L},${14*L}M${x-9*L},${y+2+18*L}l${5*L},${15*L}M${x},${y+2}l${2*L},${24*L}l${-4*L},${18*L}M${x},${y+2}l${10*L},${17*L}l${9*L},${12*L}`,'#5b3a1c',2.2);});
const TOPS=[[[298,410],[332,392],[366,418]],[[432,388],[462,372],[494,400]],[[388,508],[418,492]],[[578,410],[610,425]]];
const SPO=[];
NODES.forEach(([x,y],c)=>TOPS[c].forEach(([ex,ey])=>{
  const st=Hy(`M${x},${y}Q${f1(x+(ex-x)*.2)},${f1((y+ey)/2)} ${ex},${ey+11}`,Lobj,2.3);
  const sg=Obj(ex,ey);Spg(sg.g,11);SPO.push({st,sg,c});}));
/* spores released from bread sporangia */
const RS=[[462,372],[610,425],[332,392]],RL=[];
RS.forEach(([x,y],j)=>{for(let m=0;m<9;m++){const a=-PI/2+.15+(m-4)*.28+j*.12,d=34+(m%3)*14+rnd()*12;
  RL.push({c:el('circle',{r:2.5,fill:'#3a2f28',stroke:'#1c1612','stroke-width':.5},Lobj),x,y,a,d,j});}});

/* small photo of sporangia (صورة) */
const PH2=G(Lobj);
const ph2c=G(PH2,{'clip-path':'url(#cp2)'});
el('rect',{x:25,y:395,width:105,height:92,fill:'url(#gPh2)'},ph2c);
[[48,487,40,425],[78,487,82,410],[108,487,112,440],[62,487,58,455]].forEach(([x1,y1,x2,y2])=>{
  el('path',{d:`M${x1},${y1}Q${x1+(x2-x1)*.3},${(y1+y2)/2} ${x2},${y2+10}`,fill:'none',stroke:'#d8eef2','stroke-width':3.2,opacity:.9},ph2c);
  el('circle',{cx:x2,cy:y2,r:12,fill:'url(#gPhS)',stroke:'#2d5867','stroke-width':1},ph2c);});
el('rect',{x:25,y:395,width:105,height:92,rx:6,fill:'none',stroke:'#3d4a55','stroke-width':2.5},PH2);

/* ---------------- arrows ---------------- */
const AR=[
  Arr('M248,306Q186,298 172,236',DARK),
  Arr('M176,166Q188,88 250,72',DARK),
  Arr('M418,58Q478,36 455,104',DARK),
  Arr('M606,132Q645,205 622,300',DARK),
  Arr('M262,462Q218,395 288,330','#9aa3ab',9,1.7)];

/* ---------------- labels (figure labels only) ---------------- */
const LW1=Lab(['تكاثر جنسي'],330,236,null,null,18);
const LW2=Lab(['(2س)'],300,190,null,null,18);
const RL1=RLab('اندماج نووي',158,326,-30);
const RL2=RLab('اندماج سايتوبلازمي',138,104,-55);
const L2=Lab(['خلايا الأمشاج'],80,252,[112,242],[142,214]);
const L3=Lab(['زيجة'],330,18,[330,30],[330,42]);
const L4=Lab(['حافظة زيجية'],570,32,[560,46],[535,88]);
const L5a=Lab(['انقسام اختزالي'],478,334,[538,334],[568,336]);
const L5b=Lab(['حافظة بوغية'],468,245,[515,245],[550,245]);
const L6=Lab(['أبواغ (س)'],720,295,[712,308],[690,345]);
const L6b=Lab(['انبات الأبواغ'],832,478,[800,488],[778,508],17);
const LBr=Lab(['قطعة من الخبز الرطب'],765,692,[700,690],[650,628],17);
const L7a=Lab(['أشباه الجذور'],235,690,[290,688],[392,652],17);
const L7b=Lab(['حافظة بوغية'],78,372,[78,384],[70,410],17);
const L7c=Lab(['حامل الحافظة','البوغية'],190,515,[136,512],[100,472],17);
const L7d=Lab(['صورة'],78,503,null,null,16);
const L7e=Lab(['تكاثر لاجنسي'],560,565,null,null,18);
const L8=Lab(['أبواغ (س)'],735,395,[700,398],[652,400],17);
const BD=[Badge('1',372,338),Badge('2',170,240),Badge('3',330,116),Badge('4',470,168),Badge('5',664,344)];

/* travelling tokens: [arrow, stage, token, scaleA, scaleB, w0, w1] */
const tkA=Ball(Ltok,'gZsp','#1e130b',9);
const tkB=Ball(Ltok,'gSpg','#120e0c',11);
const TK=[[0,2,tkA,1,1.3,.05,.4],[1,3,tkA,1.2,1.5,.05,.4],[2,4,tkA,1.4,1.6,.05,.4],[3,5,tkA,1.4,1.2,.05,.33],[4,8,tkB,1,1.3,.55,.85]];

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:0,dur:1};
let stage=-1,T=0,t0=0,last=performance.now(),P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

function render(t){
  const u=i=>clamp(P-(i-1),0,1),s=[0,1,2,3,4,5,6,7,8].map(u);
  const br=k=>1+.03*Math.sin(t*1.6+k);

  /* 1 hyphae approach and touch */
  show(wedge,sm(s[1],0,.3));
  setO(F1,pop(sm(s[1],.15,.35))*br(1));
  const gap=lerp(34,0,sm(s[1],.38,.72));
  h1L.setAttribute('transform',`translate(${f1(-gap)} 0)`);h1R.setAttribute('transform',`translate(${f1(gap)} 0)`);
  glS1.setAttribute('opacity',f2(.9*Math.max(Math.sin(PI*sm(s[1],.62,.95)),Math.sin(PI*sm(s[8],.82,1)))));
  show(BD[0],sm(s[1],.8,.95));
  /* 2 gametangia */
  drawArr(AR[0],sm(s[2],0,.4));show(RL1,sm(s[2],.3,.5));
  setO(F2,pop(sm(s[2],.42,.58))*br(2));
  const gw=sm(s[2],.55,.8),sx=f2(lerp(.55,1,gw)),sy=f2(lerp(.45,1,gw));
  gL.setAttribute('transform',`translate(-15 0) scale(${sx} ${sy})`);gR.setAttribute('transform',`translate(15 0) scale(${sx} ${sy})`);
  show(sep2,sm(s[2],.72,.86));
  show(L2,sm(s[2],.8,.95));show(BD[1],sm(s[2],.82,.95));
  /* 3 zygote */
  drawArr(AR[1],sm(s[3],0,.4));show(RL2,sm(s[3],.3,.5));
  setO(F3,pop(sm(s[3],.42,.58))*br(3));
  show(wall3,1-sm(s[3],.58,.78));
  show(L3,sm(s[3],.75,.9));show(BD[2],sm(s[3],.78,.92));
  show(LW2,sm(s[3],.85,.97));show(LW1,sm(s[3],.88,1));
  /* 4 zygosporangium */
  drawArr(AR[2],sm(s[4],0,.4));
  setO(F4,pop(sm(s[4],.42,.56))*br(4));
  const zw=sm(s[4],.52,.75);
  if(show(z4,zw))z4.setAttribute('transform',`scale(${f2(lerp(.6,1,zw))})`);
  show(z4in,1-sm(s[4],.65,.78));
  show(PH1,sm(s[4],.76,.92));
  show(L4,sm(s[4],.7,.88));show(BD[3],sm(s[4],.74,.9));
  /* 5 germination: sporangiophore + sporangium */
  drawArr(AR[3],sm(s[5],0,.33));
  setO(F5,pop(sm(s[5],.35,.5))*br(5));
  show(L5a,sm(s[5],.45,.62));
  setHy(stk5,sm(s[5],.52,.76));
  setO(spG,pop(sm(s[5],.72,.86))*br(6));
  show(L5b,sm(s[5],.84,.97));show(BD[4],sm(s[5],.5,.65));
  /* 6 bread + spores released -> germination */
  const bv=sm(s[6],0,.22);
  if(show(BR,bv))BR.setAttribute('transform',`translate(0 ${f1(lerp(26,0,bv))})`);
  show(LBr,sm(s[6],.15,.3));
  const bu=sm(s[6],.28,.38);
  spDark.setAttribute('opacity',f2(1-bu));spDark.setAttribute('transform',`scale(${f2(1+.22*bu)})`);
  glS5.setAttribute('opacity',f2(.9*Math.sin(PI*sm(s[6],.24,.55))));
  SP.forEach((o,i)=>{const e=sm(s[6],.3+.008*i,.78+.006*i);
    if(!show(o.c,e>0?1:0))return;
    const p=e<.22?lp2([570,245],o.bp,e/.22):bez(o.bp,o.ctrl,o.tg,(e-.22)/.78);
    o.c.setAttribute('cx',f1(p[0]));o.c.setAttribute('cy',f1(p[1]));});
  show(L6,sm(s[6],.5,.65));
  GERM.forEach((g,i)=>setL(g,sm(s[6],.82+.004*i,.97)));
  show(L6b,sm(s[6],.86,.98));
  /* 7 asexual growth on bread */
  NET.forEach((n,k)=>setL(n,sm(s[7],.04+.008*k,.3+.008*k)));
  STO.forEach((h,k)=>setHy(h,sm(s[7],.12+.04*k,.4+.04*k)));
  RZ.forEach((r,j)=>setL(r,sm(s[7],.3+.04*j,.52+.04*j)));
  show(L7a,sm(s[7],.5,.62));
  SPO.forEach((o,j)=>{const c=o.c;setHy(o.st,sm(s[7],.45+.04*c,.62+.04*c));
    setO(o.sg,pop(sm(s[7],.6+.04*c,.72+.04*c))*br(10+j));});
  show(PH2,sm(s[7],.76,.88));show(L7d,sm(s[7],.8,.9));
  show(L7b,sm(s[7],.84,.94));show(L7c,sm(s[7],.86,.96));show(L7e,sm(s[7],.9,1));
  /* 8 asexual spores released -> cycle repeats */
  RL.forEach((o,i)=>{const e=sm(s[8],.05+.05*o.j+.006*(i%9),.55+.05*o.j);
    if(show(o.c,e>0?lerp(1,.35,sm(e,.65,1)):0)){const r=12+o.d*e;
      o.c.setAttribute('cx',f1(o.x+r*Math.cos(o.a)));o.c.setAttribute('cy',f1(o.y+r*Math.sin(o.a)));}});
  show(L8,sm(s[8],.3,.45));
  drawArr(AR[4],sm(s[8],.55,.85));
  /* tokens */
  const used=new Set();
  TK.forEach(([ai,si,tk,a,b,w0,w1])=>{const v=s[si];if(v>w0&&v<w1+.06&&!used.has(tk)){used.add(tk);
    setBall(tk,AR[ai].at(sm(v,w0,w1)),lerp(a,b,sm(v,w0,w1)),1-sm(v,w1,w1+.06));}});
  [tkA,tkB].forEach(tk=>{if(!used.has(tk))show(tk.g,0);});
}

/* ---------------- one button ---------------- */
const btn=document.getElementById('go');
function go(i){const tgt=i+1;let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1,d);}
btn.onclick=()=>{if(stage>=DUR.length-1){P=0;stage=-1;}go(stage+1);};
let lbl='';
let paused=false;
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render(T);
  const nl=stage<0?'ابدأ':(stage>=DUR.length-1&&P>DUR.length-.001)?'إعادة ⟲':'التالي ◀';
  if(nl!==lbl){btn.textContent=nl;lbl=nl;}
  requestAnimationFrame(frame);}

/* ---------------- zoom & pan (gestures) ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:400});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:400});
document.getElementById('zreset').onclick=reset;
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';fsBtn.setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' ')btn.click();});
apply();render(0);requestAnimationFrame(frame);
})();
</script>
