<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>مختبر البروتينات</title>
<style>
/* VOICE: هادئ وعلمي، مختبر مدرسي نظيف
   IDEA: طاولة مختبر بيضاء تُعرض على السبورة الذكية
   PICTURE: ذرات وحلقات وأنابيب اختبار SVG تتحرك باليد
   COLOUR and TYPE: أبيض، حبر كحلي، كهرماني للسكر، أحمر للأوكسجين؛ Tajawal
   LAYOUT: شريط تبويب علوي، مسرح كامل، شريط تحكم سفلي */
:root{color-scheme:light;--bg:#ffffff;--btn:#fff;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--acc:#d97706}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);transition:background .3s}
#pal{position:absolute;top:8px;left:8px;z-index:5;display:none;gap:8px;flex-wrap:wrap;max-width:300px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.14)}
#pal.open{display:flex}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid #cbd5e1;cursor:pointer}
.sw.sel{border:3px solid var(--ink);box-shadow:0 0 0 2px #fff inset}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;font-weight:800;white-space:nowrap}
#tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.tab{flex:none;height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);color:var(--ink);font:700 16px Tajawal,system-ui,sans-serif;cursor:pointer}
.tab[aria-selected=true]{border-color:var(--ink)}
#tools{display:flex;gap:6px;flex:none}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib.on{border-color:#f59e0b;box-shadow:inset 0 0 0 2px #f59e0b}
button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
#wrap{flex:1;position:relative;min-height:0}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#bar{display:flex;gap:8px;justify-content:center;align-items:center;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap;min-height:62px}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);color:var(--ink);font:700 16px Tajawal,system-ui,sans-serif;cursor:pointer}
.btn.sel{border-color:var(--ink)}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
#stat{font-weight:800;color:var(--mut);font-size:16px;min-width:60px;text-align:center}
svg text{font-family:Tajawal,system-ui,sans-serif}
.lb{font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.at{font-weight:800;text-anchor:middle;pointer-events:none}
.tx{text-anchor:middle;pointer-events:none}
[data-h]{cursor:grab}
.dk text.lb[fill="#334155"],.dk text.tx[fill="#334155"]{fill:#e2e8f0}
.dk text.lb[fill="#1e293b"],.dk text.tx[fill="#1e293b"]{fill:#f8fafc}
.dk text.lb[fill="#475569"],.dk text.tx[fill="#475569"]{fill:#cbd5e1}
.dk text.lb[fill="#64748b"],.dk text.tx[fill="#64748b"]{fill:#a7b4c6}
.dk text.lb[fill="#2563eb"],.dk text.tx[fill="#2563eb"]{fill:#93c5fd}
.dk text.lb[fill="#1d4ed8"],.dk text.tx[fill="#1d4ed8"]{fill:#93c5fd}
.dk text.lb[fill="#92400e"],.dk text.tx[fill="#92400e"]{fill:#fcd34d}
.dk text.lb[fill="#b45309"],.dk text.tx[fill="#b45309"]{fill:#fbbf24}
.dk text.lb[fill="#b91c1c"],.dk text.tx[fill="#b91c1c"]{fill:#fca5a5}
.dk text.lb[fill="#1e3a8a"],.dk text.tx[fill="#1e3a8a"]{fill:#a5b4fc}
.dk text.lb[fill="#dc2626"],.dk text.tx[fill="#dc2626"]{fill:#f87171}
.dk text.lb[fill="#ea580c"],.dk text.tx[fill="#ea580c"]{fill:#fdba74}
.dk text.lb[fill="#7e22ce"],.dk text.tx[fill="#7e22ce"]{fill:#d8b4fe}.dk text.lb[fill="#c2410c"]{fill:#fdba74}.dk text.lb[fill="#15803d"]{fill:#86efac}.dk text.lb[fill="#a16207"]{fill:#fde047}.dk rect[fill="#fff7ed"]{fill:rgba(251,146,60,.1)}
.dk ellipse[fill="#dbeafe"]{fill:rgba(59,130,246,.2)}
.dk line[stroke="#526072"]{stroke:#cbd5e1}.dk line[stroke="#64748b"]{stroke:#94a3b8}
.dk rect[fill="#fff"]{fill:rgba(255,255,255,.08)}.dk rect[fill="#fffbeb"]{fill:rgba(252,211,77,.1)}
.dk path[fill="#f8fafc"]{fill:transparent}.dk path[fill^="rgba(241,245,249"]{fill:rgba(255,255,255,.05)}
.dk{--ink:#f1f5f9;--mut:#a7b4c6;--line:rgba(255,255,255,.18);--btn:rgba(255,255,255,.07)}
.tab,.btn,.ib{background:var(--btn)}.tab[aria-selected=true],.btn.sel{background:var(--ink);color:var(--bg)}
#pal{background:var(--bg)}
@media(max-width:760px){h1{display:none}header{flex-wrap:wrap}#tabs{order:2;flex-basis:100%}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>مختبر البروتينات</h1>
  <nav id="tabs" role="tablist">
    <button class="tab" data-lab="0">الحامض الأميني</button>
    <button class="tab" data-lab="1">الرابطة الببتيدية</button>
    <button class="tab" data-lab="2">تراكيب البروتين</button>
    <button class="tab" data-lab="3">الإنزيمات</button>
    <button class="tab" data-lab="4">الكشف المختبري</button>
  </nav>
  <div id="tools">
    <button class="ib on" id="bLab" title="التأشيرات" aria-label="إظهار أو إخفاء التأشيرات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
    <button class="ib" id="bBg" title="لون الخلفية" aria-label="لون الخلفية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.6-1-2.8 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7" r="1.2" fill="currentColor"/></svg></button>
    <button class="ib" id="bIn" title="تكبير" aria-label="تكبير"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8M10.5 7.5v6M7.5 10.5h6"/></svg></button>
    <button class="ib" id="bOut" title="تصغير" aria-label="تصغير"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8M7.5 10.5h6"/></svg></button>
    <button class="ib" id="bFit" title="الحجم الأصلي" aria-label="الحجم الأصلي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg></button>
    <button class="ib" id="bFs" title="ملء الشاشة" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>
<div id="wrap">
<div id="pal" role="dialog" aria-label="لون الخلفية"></div>
<svg id="stage" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="gC" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#7b8390"/><stop offset="1" stop-color="#1f2630"/></radialGradient>
    <radialGradient id="gO" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#c62828"/></radialGradient>
    <radialGradient id="gH" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3dbe5"/></radialGradient>
    <radialGradient id="gN" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#8fb4ff"/><stop offset="1" stop-color="#1e40af"/></radialGradient>
    <radialGradient id="gS" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff59d"/><stop offset="1" stop-color="#c49a06"/></radialGradient>
    <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#cbd5e1" stop-opacity=".45"/><stop offset=".35" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#cbd5e1" stop-opacity=".4"/></linearGradient>
    <linearGradient id="silver" x1="0" x2="1"><stop offset="0" stop-color="#6b7280"/><stop offset=".3" stop-color="#f1f5f9"/><stop offset=".55" stop-color="#9ca3af"/><stop offset="1" stop-color="#4b5563"/></linearGradient>
    <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#64748b"/><stop offset=".4" stop-color="#e2e8f0"/><stop offset="1" stop-color="#475569"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
  </defs>
  <g id="world"><rect x="-3000" y="-3000" width="7200" height="6700" style="fill:var(--bg);transition:fill .3s"/><g id="dyn"></g></g>
</svg>
</div>
<div id="bar"></div>
</div>
<script>
{
const svg=document.getElementById('stage'),world=document.getElementById('world'),dyn=document.getElementById('dyn'),bar=document.getElementById('bar');
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const P2=(a,b,t)=>({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)});
const f1=v=>(+v).toFixed(1);
let view={k:1,tx:0,ty:0},showL=true,age=0,li=0,now=0,cur=0;

/* ---------- drawing helpers ---------- */
function lb(x,y,t,o={}){const i=li++;let op=showL?clamp((age-.35-i*.18)/.5):0;op*=(o.m===undefined?1:o.m);if(op<=.01)return'';
  return `<text class="lb" x="${f1(x)}" y="${f1(y)}" font-size="${o.s||17}" fill="${o.f||'#334155'}" opacity="${op.toFixed(2)}"${o.ltr?' direction="ltr" unicode-bidi="embed"':''}>${t}</text>`}
function labOp(i=0,m=1){return showL?clamp((age-.35-i*.18)/.5)*m:0}
const AT={C:[15,'gC','#fff',14],O:[15,'gO','#fff',14],H:[10,'gH','#475569',11],N:[15,'gN','#fff',14],S:[16,'gS','#3f3200',14]};
function atom(x,y,e,op=1,r){const a=AT[e];const rr=r||a[0],fs=a[3]*rr/a[0];if(op<=.01)return'';
  return `<g opacity="${op.toFixed(2)}"><circle cx="${f1(x)}" cy="${f1(y)}" r="${rr}" fill="url(#${a[1]})"${e==='H'?' stroke="#94a3b8" stroke-width="1"':''}/><text class="at" x="${f1(x)}" y="${f1(y+fs*.36)}" font-size="${f1(fs)}" fill="${a[2]}">${e}</text></g>`}
function bond(a,b,op=1,w=4,c='#526072',dash=''){if(op<=.01)return'';return `<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${op.toFixed(2)}"${dash?` stroke-dasharray="${dash}"`:''}/>`}
const poly=(cx,cy,r,n,rot=0)=>Array.from({length:n},(_,i)=>{const a=rot+i*2*Math.PI/n;return f1(cx+r*Math.cos(a))+','+f1(cy+r*Math.sin(a))}).join(' ');
function ring(cx,cy,r,n,col,rot){const ro=rot!==undefined?rot:(n===6?Math.PI/6:-Math.PI/2);const a=ro+(n===6?-Math.PI/3:0);
  return `<polygon points="${poly(cx,cy,r,n,ro)}" fill="${col}26" stroke="${col}" stroke-width="2.6" stroke-linejoin="round"/><circle cx="${f1(cx+r*Math.cos(a))}" cy="${f1(cy+r*Math.sin(a))}" r="${f1(r*.2)}" fill="#e53935"/>`}

/* ================= 1. AMINO ACID ================= */
const AAD={
 gly:{n:'كلايسين',f:'C₂H₅NO₂',R:[['R1','H',0,62]],rb:[['CA','R1']]},
 ala:{n:'ألانين',f:'C₃H₇NO₂',R:[['R1','C',0,72],['r1','H',-42,108],['r2','H',42,108],['r3','H',0,134]],rb:[['CA','R1'],['R1','r1'],['R1','r2'],['R1','r3']]},
 ser:{n:'سيرين',f:'C₃H₇NO₃',R:[['R1','C',0,72],['r1','H',-48,84],['r2','H',48,84],['R2','O',0,140],['r3','H',34,162]],rb:[['CA','R1'],['R1','r1'],['R1','r2'],['R1','R2'],['R2','r3']]},
 cys:{n:'سستئين',f:'C₃H₇NO₂S',R:[['R1','C',0,72],['r1','H',-48,84],['r2','H',48,84],['R2','S',0,142],['r3','H',36,166]],rb:[['CA','R1'],['R1','r1'],['R1','r2'],['R1','R2'],['R2','r3']]}};
const AAB=[['N','N',-105,0,-105,0],['hn1','H',-140,-32,-152,-26],['hn2','H',-140,32,-142,40],['CA','C',0,0,0,0],['HA','H',0,-62,0,-62],['C','C',105,0,105,0],['O1','O',140,-55,140,-55],['O2','O',140,48,140,48],['hx','H',180,40,-100,-68]];
const AABB=[['N','CA'],['CA','C'],['CA','HA'],['N','hn1'],['N','hn2'],['C','O1','D'],['C','O2'],['O2','hx','g'],['N','hx','n']];
function dbl(a,c,op=1){const dx=c.x-a.x,dy=c.y-a.y,L=Math.hypot(dx,dy)||1;return bond({x:a.x-dy/L*7,y:a.y+dx/L*7},{x:c.x-dy/L*7,y:c.y+dx/L*7},op,3.5)}
function sliderSVG(t,a,b){const hx=820-400*t;return `<rect data-h="sl" x="400" y="625" width="420" height="40" fill="transparent"/><line x1="420" y1="645" x2="820" y2="645" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" pointer-events="none"/><line x1="${f1(hx)}" y1="645" x2="820" y2="645" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" pointer-events="none"/><text class="tx" x="900" y="651" font-size="17" font-weight="700" fill="#475569">${a}</text><text class="tx" x="335" y="651" font-size="17" font-weight="700" fill="#475569">${b}</text><g data-h="sl"><circle cx="${f1(hx)}" cy="645" r="34" fill="transparent"/><circle cx="${f1(hx)}" cy="645" r="19" fill="#fff" stroke="#f59e0b" stroke-width="5" filter="url(#sh)"/></g>`}
const L1={aa:'gly',t:0,O:{x:600,y:270},
 init(){this.t=0;this.snap()},
 nodes(){return AAB.concat(AAD[this.aa].R.map(r=>[r[0],r[1],r[2],r[3],r[2],r[3]]))},
 tgt(n){const e=ease(this.t);let x=lerp(n[2],n[4],e),y=lerp(n[3],n[5],e);if(n[0]==='hx')y-=150*Math.sin(Math.PI*e);return{x:this.O.x+x,y:this.O.y+y}},
 snap(){this.cur={};for(const n of this.nodes())this.cur[n[0]]=this.tgt(n)},
 tick(dt){const k=Math.min(1,dt*11);for(const n of this.nodes()){const t=this.tgt(n);const c=this.cur[n[0]]||(this.cur[n[0]]={...t});c.x+=(t.x-c.x)*k;c.y+=(t.y-c.y)*k}},
 render(){const P=this.cur,t=this.t,O=this.O,A=AAD[this.aa],rr=A.R.length>1;let s='';
  const hl=(cx,cy,rx,ry,col,i)=>{const o=labOp(i);return o>.01?`<ellipse cx="${f1(O.x+cx)}" cy="${f1(O.y+cy)}" rx="${rx}" ry="${ry}" fill="${col}" fill-opacity=".09" stroke="${col}" stroke-dasharray="6 5" stroke-width="2" opacity="${o.toFixed(2)}"/>`:''};
  s+=hl(-132,0,64,66,'#3b82f6',1)+hl(152,0,74,80,'#ef4444',2)+hl(0,rr?112:62,rr?74:28,rr?78:26,'#16a34a',3);
  for(const b of AABB.concat(A.rb)){const a=P[b[0]],c=P[b[1]];if(!a||!c)continue;let op=1;if(b[2]==='g')op=1-clamp((t-.15)/.2);if(b[2]==='n')op=clamp((t-.75)/.2);s+=bond(a,c,op);if(b[2]==='D')s+=dbl(a,c)}
  for(const n of this.nodes())s+=atom(P[n[0]].x,P[n[0]].y,n[1]);
  li=0;s+=lb(600,44,A.n+'  '+A.f,{s:22,f:'#1e293b'});
  s+=lb(O.x-132,O.y+96,'مجموعة أمين',{f:'#2563eb'})+lb(O.x+160,O.y+112,'مجموعة كاربوكسيل',{f:'#b91c1c'})+lb(O.x,O.y+(rr?218:116),'السلسلة الجانبية R',{f:'#15803d'});
  s+=lb(O.x+32,O.y-20,'Cα',{s:16,f:'#1e293b',ltr:1});
  const zm=clamp((t-.8)/.2);s+=lb(P.N.x+24,P.N.y-20,'+',{s:30,f:'#2563eb',m:zm})+lb(P.O2.x+26,P.O2.y+8,'−',{s:32,f:'#dc2626',m:zm})+lb(600,78,'أيون مزدوج',{s:18,f:'#7e22ce',m:zm});
  return s+sliderSVG(t,'متعادل','أيون مزدوج')},
 down(h,p){if(h!=='sl')return;const f=q=>{this.t=clamp((820-q.x)/400)};f(p);return{move:f}},
 bar(){const b=(a,t)=>`<button class="btn${this.aa===a?' sel':''}" data-a="${a}">${t}</button>`;return b('gly','كلايسين')+b('ala','ألانين')+b('ser','سيرين')+b('cys','سستئين')},
 act(a){this.aa=a;this.snap();age=0}
};

/* ================= 2. PEPTIDE BOND ================= */
const RG={gly:{t:'H'},ala:{t:'CH₃',c:'#16a34a'},ser:{t:'CH₂OH',c:'#0284c7'},cys:{t:'CH₂SH',c:'#ca8a04'}};
const PPS={ga:['gly','ala'],as:['ala','ser'],gc:['gly','cys']};
const ATOF={N:'N',hn1:'H',hn2:'H',CA:'C',HA:'H',C:'C',O1:'O',O2:'O',hx:'H'};
const relAA=id=>{const n=AAB.find(n=>n[0]===id);return{x:n[2],y:n[3]}};
function skel(F,key,skip,bs,as){
 for(const b of [['N','CA'],['CA','C'],['CA','HA'],['N','hn1'],['N','hn2'],['C','O1','D'],['C','O2'],['O2','hx']]){if(skip.includes(b[0])||skip.includes(b[1]))continue;const a=F(b[0]),c=F(b[1]);bs.push(bond(a,c));if(b[2])bs.push(dbl(a,c))}
 const ca=F('CA'),rp={x:ca.x,y:ca.y+66};bs.push(bond(ca,rp));
 for(const id in ATOF)if(!skip.includes(id)){const p=F(id);as.push(atom(p.x,p.y,ATOF[id]))}
 const g=RG[key];as.push(g.t==='H'?atom(rp.x,rp.y,'H'):`<g><rect x="${f1(rp.x-36)}" y="${f1(rp.y-14)}" width="72" height="28" rx="14" fill="${g.c}"/><text class="at" x="${f1(rp.x)}" y="${f1(rp.y+5)}" font-size="13" fill="#fff" direction="ltr">${g.t}</text></g>`)}
const L2={pair:'ga',
 init(){this.st='free';this.r=0;this.R={x:880,y:330};this.park=null},
 geo(){const L={x:330,y:330},C={x:435,y:330},bonded={x:615,y:330},W={x:475,y:470};if(!this.park)this.park={x:880,y:570};return{L,C,bonded,W}},
 tick(dt){if(this.st==='react'){this.r=Math.min(1,this.r+dt/1.9);if(this.r>=1)this.st='done'}
  else if(this.st==='split'){this.r=Math.max(0,this.r-dt/1.9);if(this.r<=0){this.st='free';this.R={...this.sR}}}},
 render(){const g=this.geo(),P=PPS[this.pair],r=this.r;let s='';
