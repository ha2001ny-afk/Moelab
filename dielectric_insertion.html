<title>نشاط تأثير العازل الكهربائي</title>
<style>
/* Layout: one full-screen navy lab bench; plates stand upright, the dielectric slab hangs above the gap and slides down into it */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --pos:#ff6b6b; --neg:#5eaaff; --field:#62d98a; --force:#ffab5c; --accent:#7fd3ff;
  --wire-p:#e94848; --wire-n:#1b2029; --plate:#8593a9; --warn:#ffc04d; --lamp:#ffd27a;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body);margin:0}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}

/* header: activity buttons on the right of the title */
.hdr{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:calc(100% - 84px - env(safe-area-inset-left,0px));display:flex;gap:14px;align-items:flex-start;pointer-events:none}
.hdr>*{pointer-events:auto}
.hbtns{display:flex;flex-direction:column;gap:7px;flex:none}
.hbtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;min-width:126px;border-radius:10px;border:1px solid var(--line);background:rgba(8,20,41,.62);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;text-align:start}
.hbtn svg{width:17px;height:17px;flex:none;color:var(--accent)}
.hbtn:hover{border-color:var(--accent)}
.hbtn.on{border-color:var(--accent);background:rgba(127,211,255,.14);color:var(--accent)}
.hbtn:focus-visible,.sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.htitle{min-width:0;padding-top:2px}
.eyebrow{display:inline-block;font:600 12px var(--f-display);color:var(--force);background:rgba(255,171,92,.14);border:1px solid rgba(255,171,92,.3);border-radius:999px;padding:1px 10px;letter-spacing:.02em}
.htitle h1{margin:6px 0 0;font:600 20px/1.45 var(--f-display);color:var(--ink);max-width:330px;text-wrap:balance}
@media (max-width:759px){.htitle h1{font-size:15px;line-height:1.5}.hbtn{min-width:118px;font-size:13px;height:34px}}

/* left tools: lamp + fullscreen */
.lbtns{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.sbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.sbtn:hover{border-color:var(--accent)}
.sbtn svg{width:20px;height:20px}
.sbtn.lamp{color:var(--lamp)}
.sbtn.lamp:hover,.sbtn.lamp.on{border-color:var(--lamp);background:rgba(255,210,122,.14)}
.toast{position:absolute;top:max(110px,calc(env(safe-area-inset-top,0px) + 104px));left:max(10px,env(safe-area-inset-left,0px));max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink)}

/* panels */
.pane{position:absolute;overflow:auto;background:rgba(8,20,41,.95);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.8;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.pane h2{margin:0 0 8px;font:600 16px var(--f-display);padding-left:30px;text-wrap:balance}
.pane p{margin:0 0 8px}
.pane .m,.pane b.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.pane p.m{text-align:center;color:var(--accent);font-weight:600;font-size:15px}
.pane .note{color:var(--muted);font-size:13px}
.pane .hl{color:var(--force);font-weight:600}
.pane .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;direction:ltr;justify-content:flex-end}
.pane .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.pane .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.pane .x:hover{color:var(--ink)}
.tip{top:max(110px,calc(env(safe-area-inset-top,0px) + 104px));left:max(10px,env(safe-area-inset-left,0px));width:min(340px,calc(100% - 20px));max-height:calc(100% - 130px);border:1px solid rgba(255,210,122,.35)}
.tip h2{color:var(--lamp)}
.info{right:max(12px,env(safe-area-inset-right,0px));width:min(400px,calc(100% - 24px));border:1px solid rgba(127,211,255,.32)}
.info h2{color:var(--accent)}
.info ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.info ul li{display:flex;gap:10px;align-items:flex-start}
.info ul li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:10px}
.info ol{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.info ol li{display:flex;gap:10px;align-items:flex-start}
.info .ck{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 13px var(--f-mono);color:var(--muted);margin-top:2px}
.info li.ok .ck{background:var(--field);border-color:var(--field);color:#062012}
.info li.ok>div{color:var(--muted)}
.info .fig{color:var(--accent);font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;font-size:12.5px}
.info .reset{margin-top:12px;font:600 13px var(--f-body);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:6px 14px;cursor:pointer}
.info .reset:hover{border-color:var(--accent)}
.info table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 8px}
.info th,.info td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:start}
.info th{color:var(--muted);font-weight:600}
.info td.n{font-family:var(--f-mono);direction:ltr;text-align:end;font-variant-numeric:tabular-nums}
.info .box{border:1px solid rgba(255,171,92,.35);background:rgba(255,171,92,.08);border-radius:10px;padding:8px 12px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body style="margin:0">

<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="بطارية وفولطميتر وصفيحتان متوازيتان ولوح عازل يُسحب بين الصفيحتين"></canvas>

  <header class="hdr" id="hdr">
    <div class="hbtns">
      <button class="hbtn" data-p="tools" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>أدوات النشاط</button>
      <button class="hbtn" data-p="steps" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>خطوات النشاط</button>
      <button class="hbtn" data-p="concl" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></svg>الاستنتاج</button>
    </div>
    <div class="htitle">
      <span class="eyebrow">نشاط</span>
      <h1>تأثير إدخال العازل الكهربائي بين صفيحتي متسعة</h1>
    </div>
  </header>
  <div class="pane info" id="infoPanel" hidden role="dialog" aria-labelledby="infoTitle"><button class="x" id="infoClose" aria-label="إغلاق">×</button><h2 id="infoTitle"></h2><div id="infoBody"></div></div>

  <div class="lbtns">
    <button class="sbtn lamp" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
    <button class="sbtn" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="pane tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
</div>

<script>
(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d'),hdr=document.getElementById('hdr');
const EPS0=8.854e-12,AREA=0.04,D=0.02,TAU=0.9,PT=14,VMAX=24,VR=25;
const C0=EPS0*AREA/D;
const MATS=[{n:'تفلون',k:2.1,c:'#dfe7f2'},{n:'ورق',k:3.7,c:'#f2d68a'},{n:'زجاج',k:5.6,c:'#7fd8e6'}];
const S={V:20,Qa:0,dQ:0,rate:0,sw:false,mat:2,u:0,nv:0,nvel:0,msgT:0};
const done=[false,false,false,false];
const KEYS=['B+','B-','M+','M-'],PORTS=['a1','a2','b1','b2'];
const leads={'B+':null,'B-':null,'M+':null,'M-':null};   // {port:id} or {port:null,x,y} while held
const ws={'B+':{ph:0,vel:0,a:0},'B-':{ph:0,vel:0,a:0}};
let W=0,H=0,DPR=1,narrow=false,G={},col={},time=0,drag=null,hover=null,selTerm=null,placedB=false,placedM=false,placedC=false,placedS=false,placedT=false,ranks={};
S.slab={snap:false,x:0,y:0};   // snap: slab sits in the gap column, y is relative to the plates' top
const cam={z:1,x:0,y:0};

function readColors(){const cs=getComputedStyle(document.documentElement);
  ['deep','navy','glow','ink','muted','pos','neg','field','accent','wire-p','wire-n','plate','warn','line','force'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- layout ---------- */
function layout(){
  const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;
  W=nw;H=nh;narrow=W<760;
  DPR=window.devicePixelRatio||1;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const hr=hdr.getBoundingClientRect(),sr=cv.getBoundingClientRect(),hb=hr.bottom-sr.top,hl=hr.left-sr.left;
  const g=narrow?70:clamp(W*0.07,80,110);
  const PX=narrow?W/2:clamp(W*0.45,340,W-330);
  const top0=(narrow||hl<PX+g/2+150)?hb+16:28;
  const bh=narrow?116:128,mh=160;
  const Lp=clamp((H-top0-26-28-100-mh-16)/2,96,260);
  const restTop=top0+26,PY0=restTop+Lp+28,rowY=PY0+Lp+100,ia=PX-g/2,ib=PX+g/2;
  Object.assign(G,{g,Lp,restTop});
  if(!placedC){G.PX=PX;G.PY0=PY0;}
  capGeom();
  let bw,bx,mw,mx;
  if(narrow){bw=Math.min(200,(W-48)/2);bx=16;mw=bw;mx=W-16-mw;}
  else{bw=190;bx=ia-PT-64-bw;mw=180;mx=ib+PT+64;}
  if(!placedB)G.bat={x:bx,y:rowY,w:bw,h:bh};else{G.bat.w=bw;G.bat.h=bh;}
  if(!placedM)G.met={x:mx,y:rowY,w:mw,h:mh};else G.met.w=mw;
  if(!placedT)G.tray={x:ia-26-116,y:restTop,w:116};
  if(!placedS)S.slab={snap:false,x:PX,y:restTop};
  parts();ensureDips();
}
function capGeom(){G.ia=G.PX-G.g/2;G.ib=G.PX+G.g/2;G.xa=G.ia-PT/2;G.xb=G.ib+PT/2;G.PY1=G.PY0+G.Lp;}
function parts(){const b=G.bat,m=G.met;
  G.T={'B+':{x:b.x+b.w*0.26,y:b.y-17},'B-':{x:b.x+b.w*0.74,y:b.y-17},'M+':{x:m.x+m.w*0.28,y:m.y-17},'M-':{x:m.x+m.w*0.72,y:m.y-17}};
  G.knob={x:b.x+34,y:b.y+b.h-36,r:18};G.sw={x:b.x+b.w-34,y:b.y+b.h-36};
  G.lcd={x:b.x+60,y:b.y+b.h-50,w:Math.max(46,b.w-118),h:28};
}
function portPos(id){const y=G.PY1+38,far=id[1]==='2';return id[0]==='a'?{x:G.xa-(far?42:12),y}:{x:G.xb+(far?42:12),y};}

/* ---------- physics ---------- */
const slabTop=()=>S.slab.snap?G.PY0+S.slab.y:S.slab.y;
const slabCx=()=>S.slab.snap?G.PX:S.slab.x;
const overlapSeg=()=>{const t=slabTop();return[Math.max(t,G.PY0),Math.min(t+G.Lp,G.PY1)];};
const fr=()=>{if(!S.slab.snap)return 0;const o=overlapSeg();return clamp(o[1]-o[0],0,G.Lp)/G.Lp;};
function trySnap(){if(S.slab.snap)return;const cx=S.slab.x,t=S.slab.y;
  if(Math.abs(cx-G.PX)<40&&t<G.PY1&&t+G.Lp>G.PY0)S.slab={snap:true,x:0,y:t-G.PY0};}
const kap=()=>MATS[S.mat].k;
const Cnow=()=>C0*(1+(kap()-1)*fr());
const plateOf=k=>leads[k]&&leads[k].port?leads[k].port[0]:null;
const portOwner=id=>KEYS.find(k=>leads[k]&&leads[k].port===id);
function batt(){const p=plateOf('B+'),n=plateOf('B-'),w=!!(p&&n&&p!==n);return{wired:w,on:!!(S.sw&&w),sign:p==='a'?1:-1};}
function reading(){const p=plateOf('M+'),n=plateOf('M-');if(!p||!n)return null;if(p===n)return 0;const v=S.Qa/Cnow();return p==='a'?v:-v;}

let dips=[];
function ensureDips(){const cols=Math.max(2,Math.floor((G.g-6)/24)),rows=Math.max(4,Math.floor(G.Lp/26));
  if(dips.cols===cols&&dips.rows===rows)return;dips=[];dips.cols=cols;dips.rows=rows;
  let s=11;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const th=rnd()*Math.PI*2;dips.push({fx:(c+0.5)/cols,fy:(r+0.5)/rows,th0:th,th,ph:rnd()*6});}}
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};

function step(dt){
  const b=batt(),C=Cnow(),prev=S.Qa;
  if(b.on){const tg=b.sign*C*S.V;S.Qa=tg+(S.Qa-tg)*Math.exp(-dt/TAU);}
  S.dQ=(S.Qa-prev)/dt;S.rate=Math.abs(S.dQ)*TAU/(C0*12);
  ['B+','B-'].forEach(k=>{const w=ws[k],l=leads[k];
    if(b.on&&S.rate>0.01&&l&&l.port){const dQp=l.port[0]==='a'?S.dQ:-S.dQ;w.vel=(dQp>0?-1:1)*(40+170*Math.min(1,S.rate));w.a=Math.min(1,S.rate*5);}
    else w.vel=0;w.ph+=w.vel*dt;});
  // voltmeter needle: damped spring with end stops
  const r=reading(),tg=r===null?0:clamp(r,-3,30);
  S.nvel+=(70*(tg-S.nv)-11*S.nvel)*dt;S.nv+=S.nvel*dt;
  if(S.nv<-0.9){S.nv=-0.9;if(S.nvel<0)S.nvel*=-0.3;}
  if(S.nv>25.9){S.nv=25.9;if(S.nvel>0)S.nvel*=-0.3;}
  // activity progress
  const f=fr();
  if(b.on&&S.V>=0.5&&Math.abs(S.Qa)>0.9*C*S.V)done[0]=true;
  if(done[0]&&!b.on&&Math.abs(S.Qa)>C0*0.5)done[1]=true;
  if(done[1]&&!b.on&&r!==null&&Math.abs(r)>0.2)done[2]=true;
  if(done[2]&&!b.on&&r!==null&&Math.abs(r)>0.05&&f>0.95)done[3]=true;
  // molecules of the slab line up with the field inside the gap
  const E=Math.abs(S.Qa)/C/D,dir=S.Qa>=0?0:Math.PI,al=1-Math.exp(-E/150),top=slabTop();
  dips.forEach(d=>{const y=top+d.fy*G.Lp,inG=S.slab.snap&&y>G.PY0+2&&y<G.PY1-2,a=inG?al:0,t0=d.th0+0.4*Math.sin(time*1.7+d.ph);
    const vx=(1-a)*Math.cos(t0)+a*Math.cos(dir),vy=(1-a)*Math.sin(t0)+a*Math.sin(dir);
    d.th+=angDiff(Math.atan2(vy,vx),d.th)*Math.min(1,dt*6);});
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,o={}){ctx.font=o.font||'600 13px system-ui, Tahoma, sans-serif';ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function signMark(x,y,r,positive){ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.3,r*0.22);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-r*0.5,y);ctx.lineTo(x+r*0.5,y);if(positive){ctx.moveTo(x,y-r*0.5);ctx.lineTo(x,y+r*0.5);}ctx.stroke();}
function charge(x,y,r,positive){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=positive?col.pos:col.neg;ctx.fill();signMark(x,y,r,positive);}
function pulseRing(x,y,r,color,ph){const pu=0.5+0.5*Math.sin(time*5+(ph||0));ctx.beginPath();ctx.arc(x,y,r+pu*5,0,7);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function pulseRect(x,y,w,h,color){const pu=0.5+0.5*Math.sin(time*5),e=3+pu*4;rr(x-e,y-e,w+2*e,h+2*e,9);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function strokePts(pts){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}
function bezPts(p){const o=[];for(let i=0;i<=40;i++){const t=i/40,u=1-t;o.push({x:u*u*u*p[0].x+3*u*u*t*p[1].x+3*u*t*t*p[2].x+t*t*t*p[3].x,y:u*u*u*p[0].y+3*u*u*t*p[1].y+3*u*t*t*p[2].y+t*t*t*p[3].y});}return o;}
function measure(pts){const len=[0];for(let i=1;i<pts.length;i++)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));return{pts,len,L:len[len.length-1]};}
function at(pl,s){const{pts,len}=pl;let i=1;while(i<len.length-1&&len[i]<s)i++;const f=(s-len[i-1])/((len[i]-len[i-1])||1);return{x:pts[i-1].x+(pts[i].x-pts[i-1].x)*f,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*f};}

/* next thing the student should touch */
function hint(){
  if(!done[0]){if(!plateOf('B+'))return'B+';if(!plateOf('B-'))return'B-';if(!S.sw&&batt().wired)return'sw';return null;}
  if(!done[1])return'sw';
  if(!done[2]){if(!plateOf('M+'))return'M+';if(!plateOf('M-'))return'M-';return null;}
  if(!done[3])return'slab';return null;}

function drawBg(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(W*0.5,H*0.45,0,W*0.5,H*0.45,Math.max(W,H)*0.75);
  g.addColorStop(0,col.glow);g.addColorStop(0.55,col.navy);g.addColorStop(1,col.deep);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const h=ctx.createRadialGradient(W*0.5,-H*0.1,0,W*0.5,-H*0.1,H*0.7);
  h.addColorStop(0,'rgba(255,255,255,0.10)');h.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=h;ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*cam.x,DPR*cam.y);
}

/* ---------- capacitor, slab, field ---------- */
function drawBus(){const y0=G.PY1,yb=G.PY1+22;
  ctx.strokeStyle='#a9b4c4';ctx.lineWidth=5;ctx.lineCap='round';
  [['a',G.xa,-1],['b',G.xb,1]].forEach(([id,xc,s])=>{ctx.beginPath();ctx.moveTo(xc,y0);ctx.lineTo(xc,yb);ctx.lineTo(xc+s*42,yb);ctx.stroke();
    [12,42].forEach(o=>{ctx.beginPath();ctx.moveTo(xc+s*o,yb);ctx.lineTo(xc+s*o,yb+10);ctx.stroke();});});}

function drawSlab(E,k,sa){const m=MATS[S.mat],top=slabTop(),cxs=slabCx(),x=cxs-G.g/2+1,w=G.g-2,h=G.Lp,f=fr();
  const act=hover==='slab'||(drag&&drag.type==='slab');
  ctx.save();ctx.globalAlpha=0.26;rr(x,top,w,h,4);ctx.fillStyle=m.c;ctx.fill();ctx.restore();
  const sh=ctx.createLinearGradient(x,0,x+w,0);sh.addColorStop(0,'rgba(255,255,255,.16)');sh.addColorStop(0.35,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(255,255,255,.05)');
  rr(x,top,w,h,4);ctx.fillStyle=sh;ctx.fill();
  ctx.strokeStyle=act?col.accent:m.c;ctx.globalAlpha=act?1:0.75;ctx.lineWidth=1.6;ctx.stroke();ctx.globalAlpha=1;
  // polar molecules
  ctx.save();rr(x,top,w,h,4);ctx.clip();
  dips.forEach(d=>{const px=x+d.fx*w,py=top+d.fy*h;ctx.save();ctx.translate(px,py);ctx.rotate(d.th);ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.ellipse(0,0,7.5,3.8,0,Math.PI/2,Math.PI*1.5);ctx.fillStyle=col.neg;ctx.fill();
    ctx.beginPath();ctx.ellipse(0,0,7.5,3.8,0,-Math.PI/2,Math.PI/2);ctx.fillStyle=col.pos;ctx.fill();ctx.restore();});
  ctx.restore();
  // induced (bound) charges on the slab faces inside the gap
  if(f>0.01&&E>1&&sa){const o=overlapSeg(),len=o[1]-o[0],sp=Math.max(10,22*1200/((k-1)*E));const n=Math.floor(len/sp+0.25);
    for(let i=0;i<n;i++){const y=o[0]+len*(i+0.5)/n;charge(G.ia+6,y,4,sa<0);charge(G.ib-6,y,4,sa>0);}}
  // insulating handle
  const hw=Math.max(G.g+16,118),hx=cxs-hw/2;
  rr(cxs-3,top-6,6,7,1);ctx.fillStyle='#d6dbe3';ctx.fill();
  if(hint()==='slab'&&!drag)pulseRect(hx,top-26,hw,20,col.accent);
  rr(hx,top-26,hw,20,7);ctx.fillStyle=act?col.accent:'#e8ecf2';ctx.fill();
  txt(m.n,cxs+hw/2-10,top-16,{align:'right',font:'600 12px system-ui, Tahoma, sans-serif',color:'#1b2029'});
  txt('k = '+m.k,cxs-hw/2+9,top-16,{align:'left',font:'600 12px ui-monospace, Menlo, Consolas, monospace',color:'#1b2029',dir:'ltr'});
}

function drawCapacitor(){
  const {ia,ib,PY0,PY1,Lp,PX,g}=G,C=Cnow(),E=Math.abs(S.Qa)/C/D,f=fr(),k=kap(),sa=E>1?Math.sign(S.Qa):0;
  drawBus();
  drawSlab(E,k,sa);
  // field lines: count proportional to E (same E in air and in the slab region since ΔV is shared)
  const n=E<5?0:clamp(Math.round(E/1200*Lp/20),1,Math.floor(Lp/14));
  if(n){const dir=sa>0?1:-1,bulge=Math.min(40,Lp*0.16),ys=[];
    for(let i=0;i<n;i++)ys.push(PY0+Lp*(i+0.5)/n);
    ctx.strokeStyle=col.field;ctx.globalAlpha=clamp(0.55+E/1500,0.55,1);ctx.lineWidth=2.2;
    if(batt().on&&S.rate>0.01){ctx.setLineDash([12,7]);ctx.lineDashOffset=-dir*time*30;}
    ys.forEach(y=>{ctx.beginPath();ctx.moveTo(ia+1,y);ctx.lineTo(ib-1,y);ctx.stroke();});
    if(n>=2)[[PY0+2,-1],[PY1-2,1]].forEach(([y,s])=>{ctx.beginPath();ctx.moveTo(ia+1,y);ctx.bezierCurveTo(ia+g*0.15,y+s*bulge,ib-g*0.15,y+s*bulge,ib-1,y);ctx.stroke();});
    ctx.setLineDash([]);
    ys.forEach(y=>arrowHead(PX+dir*4,y,dir>0?0:Math.PI,7,col.field));
    if(n>=2){arrowHead(PX,PY0+2-bulge*0.75,dir>0?0:Math.PI,6,col.field);arrowHead(PX,PY1-2+bulge*0.75,dir>0?0:Math.PI,6,col.field);}
    ctx.globalAlpha=1;
    if(n>=2)txt('E',PX,(ys[0]+ys[1])/2,{font:'700 17px ui-monospace, Menlo, Consolas, monospace',color:col.field,dir:'ltr'});}
  // plates with free charge: denser where the slab sits (same ΔV, larger capacitance there)
  [[ia-PT,sa],[ib,-sa]].forEach(([x,sg])=>{
    const pg=ctx.createLinearGradient(x,0,x+PT,0);pg.addColorStop(0,'#c3cddc');pg.addColorStop(0.5,col.plate);pg.addColorStop(1,'#56627a');
    rr(x,PY0,PT,Lp,3);ctx.fillStyle=pg;ctx.fill();
    if(hover==='cap'||(drag&&drag.type==='cap')){ctx.strokeStyle=col.accent;ctx.lineWidth=2;ctx.stroke();}
    const o=overlapSeg(),segs=f>0?[[PY0,o[0],1],[o[0],o[1],k],[o[1],PY1,1]]:[[PY0,PY1,1]];
    if(sg)segs.forEach(([y0,y1,kk])=>{const len=y1-y0;if(len<6)return;
      const sp=Math.max(11,22*1200/(kk*E)),c=Math.floor(len/sp+0.25);
      for(let i=0;i<c;i++)charge(x+PT/2,y0+len*(i+0.5)/c,5,sg>0);});});
  const lab=sg=>sg>0?['صفيحة موجبة','+Q']:sg<0?['صفيحة سالبة','−Q']:['صفيحة متعادلة',''];
  const lc=sg=>sg>0?col.pos:sg<0?col.neg:col.muted;
  [[ia-PT-14,'right',sa],[ib+PT+14,'left',-sa]].forEach(([x,al,sg])=>{const L=lab(sg);
    txt(L[0],x,PY0+Lp*0.5-10,{align:al,color:lc(sg)});
    if(L[1])txt(L[1],x,PY0+Lp*0.5+12,{align:al,font:'700 16px ui-monospace, Menlo, Consolas, monospace',color:lc(sg),dir:'ltr'});});
  // plate letters
  txt('a',G.xa,PY0-12,{font:'600 15px ui-monospace, Menlo, Consolas, monospace',dir:'ltr',color:col.muted});
  txt('b',G.xb,PY0-12,{font:'600 15px ui-monospace, Menlo, Consolas, monospace',dir:'ltr',color:col.muted});
  // d dimension
  const yd=PY1+14;ctx.strokeStyle=col.muted;ctx.lineWidth=1.3;ctx.beginPath();
  ctx.moveTo(ia+1,yd-5);ctx.lineTo(ia+1,yd+5);ctx.moveTo(ia+1,yd);ctx.lineTo(ib-1,yd);ctx.moveTo(ib-1,yd-5);ctx.lineTo(ib-1,yd+5);ctx.stroke();
  txt('d = 2 cm',PX,yd+15,{font:'500 11px ui-monospace, Menlo, Consolas, monospace',color:col.muted,dir:'ltr'});
  // binding posts
  const wiring=selTerm||(drag&&drag.type==='wire');
  PORTS.forEach(id=>{const q=portPos(id),own=portOwner(id);
    if(wiring&&(!own||(drag&&own===drag.k)))pulseRing(q.x,q.y,14,col.accent,id.charCodeAt(1));
    ctx.beginPath();ctx.arc(q.x,q.y,7.5,0,7);ctx.fillStyle='#cfd7e3';ctx.fill();ctx.strokeStyle='#5d6880';ctx.lineWidth=1.4;ctx.stroke();
    ctx.beginPath();ctx.moveTo(q.x-3.5,q.y);ctx.lineTo(q.x+3.5,q.y);ctx.stroke();});
}

function drawTray(){const t=G.tray,inside=fr()>0.01;
  txt('اختر العازل',t.x+t.w,t.y+6,{align:'right',font:'600 12px system-ui, Tahoma, sans-serif',color:col.muted});
  MATS.forEach((m,i)=>{const y=t.y+18+i*36,sel=i===S.mat,hv=hover==='tile'+i;
    rr(t.x,y,t.w,30,8);ctx.fillStyle=sel?'rgba(127,211,255,.14)':'rgba(8,20,41,.55)';ctx.fill();
    ctx.strokeStyle=sel?col.accent:hv?'rgba(127,211,255,.55)':col.line;ctx.lineWidth=sel?1.6:1;ctx.stroke();
    ctx.globalAlpha=inside&&!sel?0.5:1;
    rr(t.x+t.w-20,y+6,10,18,2);ctx.fillStyle=m.c;ctx.fill();

  if(time<S.msgT)txt('أخرج اللوح أولاً',t.x+t.w,t.y+18+3*36+6,{align:'right',color:col.warn});
}

/* ---------- cables ---------- */
/* tidy routes: straight runs with right angles and small rounded corners; each lead gets its own lane so runs stay apart */
function rounded(pts,r){const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){const a=pts[i-1],c=pts[i],b=pts[i+1];
    const da=Math.hypot(a.x-c.x,a.y-c.y),db=Math.hypot(b.x-c.x,b.y-c.y);if(da<1||db<1){out.push(c);continue;}
    const k=Math.min(r,da/2,db/2),p1={x:c.x+(a.x-c.x)/da*k,y:c.y+(a.y-c.y)/da*k},p2={x:c.x+(b.x-c.x)/db*k,y:c.y+(b.y-c.y)/db*k};
    for(let j=0;j<=6;j++){const t=j/6,u=1-t;out.push({x:u*u*p1.x+2*u*t*c.x+t*t*p2.x,y:u*u*p1.y+2*u*t*c.y+t*t*p2.y});}}
  out.push(pts[pts.length-1]);return out;}
function computeRanks(){const ls=KEYS.filter(k=>leads[k]&&leads[k].port).map(k=>({k,d:Math.abs(portPos(leads[k].port).x-G.T[k].x)}));
  ls.sort((a,b)=>a.d-b.d);ranks={};ls.forEach((o,i)=>ranks[o.k]=i);}
function cablePts(k){const l=leads[k],T=G.T[k];
  if(l.port){const P=portPos(l.port),r=ranks[k]||0;let m=P.y+18+r*9;
    if(m>T.y-14)m=Math.min(T.y-14,P.y-24-r*9);
    return rounded([T,{x:T.x,y:m},{x:P.x,y:m},P],10);}
  const m=Math.min(T.y-30,l.y+30);
  return rounded([T,{x:T.x,y:m},{x:l.x,y:m},{x:l.x,y:l.y}],10);}
function drawCable(k){const l=leads[k];if(!l)return;
  const pts=cablePts(k),bat=k[0]==='B',pos=k[1]==='+',color=pos?col['wire-p']:col['wire-n'],lw=bat?4.5:3;
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=lw+2.5;ctx.save();ctx.translate(0,3);strokePts(pts);ctx.restore();
  if(!pos){ctx.strokeStyle='rgba(220,230,245,.6)';ctx.lineWidth=lw+2.5;strokePts(pts);}
  ctx.strokeStyle=color;ctx.lineWidth=lw;strokePts(pts);
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1.1;ctx.save();ctx.translate(-0.8,-1);strokePts(pts);ctx.restore();
  if(bat&&ws[k].vel){const pl=measure(pts),w=ws[k],gap=24;ctx.globalAlpha=w.a;
    for(let s=((w.ph%gap)+gap)%gap;s<pl.L-8;s+=gap){if(s<10)continue;const q=at(pl,s);charge(q.x,q.y,4.6,false);}
    ctx.globalAlpha=1;}
  const e=pts[pts.length-1];
  if(l.port){ctx.beginPath();ctx.arc(e.x,e.y,bat?9:8,0,7);ctx.strokeStyle=color;ctx.lineWidth=bat?4:3.2;ctx.stroke();
    if(hover==='port-'+l.port){ctx.beginPath();ctx.arc(e.x,e.y,14,0,7);ctx.strokeStyle=col.accent;ctx.lineWidth=2;ctx.stroke();}}
  else{const p2=pts[pts.length-2],a=Math.hypot(e.x-p2.x,e.y-p2.y)<0.5?-Math.PI/2:Math.atan2(e.y-p2.y,e.x-p2.x);
    ctx.save();ctx.translate(e.x,e.y);ctx.rotate(a);rr(-16,-6,18,12,3);ctx.fillStyle=color;ctx.fill();
    ctx.fillStyle='#c9d1dc';ctx.beginPath();ctx.moveTo(2,-6);ctx.lineTo(14,-2);ctx.lineTo(2,-1);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(2,6);ctx.lineTo(14,2);ctx.lineTo(2,1);ctx.closePath();ctx.fill();ctx.restore();}
}

/* ---------- battery & voltmeter ---------- */
function drawTerminal(k){const p=G.T[k],dev=k[0]==='B'?G.bat:G.met,isP=k[1]==='+',hk=hint();
  if(selTerm===k||(hk===k&&!drag))pulseRing(p.x,p.y+6,18,isP?col.pos:'rgba(220,230,245,.85)',isP?0:1.6);
  ctx.fillStyle='#9aa6b8';ctx.beginPath();const ny=dev.y-3;
  for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(p.x+Math.cos(a)*13,ny+Math.sin(a)*4.5);}ctx.closePath();ctx.fill();
  const g=ctx.createLinearGradient(p.x-8,0,p.x+8,0);g.addColorStop(0,'#7f8a9b');g.addColorStop(0.45,'#e3e8ef');g.addColorStop(1,'#6f7a8b');
  ctx.fillStyle=g;ctx.fillRect(p.x-8,p.y,16,dev.y-3-p.y);
  ctx.beginPath();ctx.ellipse(p.x,p.y,8,3,0,0,7);ctx.fillStyle='#d9dfe8';ctx.fill();
  rr(p.x-10,dev.y-9,20,6,2);ctx.fillStyle=isP?'#d93a3a':'#1c2230';ctx.fill();
  txt(isP?'+':'−',p.x+(isP?-22:22),p.y+6,{font:'700 19px ui-monospace, Menlo, Consolas, monospace',color:isP?col.pos:col.ink,dir:'ltr'});
}
function caseBody(b,hov){
  if(hov){rr(b.x-8,b.y-10,b.w+16,b.h+18,14);ctx.strokeStyle=col.accent;ctx.globalAlpha=.5;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
  ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;
  rr(b.x,b.y,b.w,b.h,12);const bg=ctx.createLinearGradient(0,b.y,0,b.y+b.h);bg.addColorStop(0,'#3d4a63');bg.addColorStop(1,'#232c3e');ctx.fillStyle=bg;ctx.fill();ctx.restore();
  rr(b.x,b.y,b.w,b.h,12);ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();
  rr(b.x-4,b.y-4,b.w+8,20,8);const lg=ctx.createLinearGradient(0,b.y-4,0,b.y+16);lg.addColorStop(0,'#2a3346');lg.addColorStop(1,'#171e2c');ctx.fillStyle=lg;ctx.fill();

function drawBattery(){const b=G.bat;
  caseBody(b,hover==='bat'||(drag&&drag.type==='bat'));
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;for(let x=b.x+14;x<b.x+b.w-10;x+=10){ctx.beginPath();ctx.moveTo(x,b.y+22);ctx.lineTo(x,b.y+30);ctx.stroke();}

  const k=G.knob,f=S.V/VMAX,a0=Math.PI*0.75,ang=a0+f*Math.PI*1.5;
  for(let i=0;i<=12;i++){const a=a0+i/12*Math.PI*1.5;ctx.strokeStyle=i/12<=f+1e-6?col.accent:'rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(k.x+Math.cos(a)*(k.r+4),k.y+Math.sin(a)*(k.r+4));ctx.lineTo(k.x+Math.cos(a)*(k.r+8),k.y+Math.sin(a)*(k.r+8));ctx.stroke();}

  ctx.strokeStyle=hover==='knob'||(drag&&drag.type==='knob')?col.accent:'rgba(255,255,255,.3)';ctx.lineWidth=1.6;ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(k.x+Math.cos(ang)*5,k.y+Math.sin(ang)*5);ctx.lineTo(k.x+Math.cos(ang)*(k.r-5),k.y+Math.sin(ang)*(k.r-5));ctx.stroke();
  const l=G.lcd;rr(l.x,l.y,l.w,l.h,5);ctx.fillStyle='#08160f';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();

  ctx.beginPath();ctx.arc(s.x,s.y+2,4,0,7);ctx.fillStyle='#8792a6';ctx.fill();

}

    concl:()=>{const m=window.__sim&&window.__sim.measured();
      const mine=m&&m.f>0.99?`<div class="box"><p style="margin:0">من قياسك باستعمال ${m.name}: انخفضت القراءة من <b class="m">${m.dV0.toFixed(2)} V</b> إلى <b class="m">${m.dV.toFixed(2)} V</b>، والنسبة بينهما <b class="m">${(m.dV0/m.dV).toFixed(2)}</b> تساوي ثابت العزل <b class="m">k = ${m.k}</b>.</p></div>`:'<p class="note">أكمل خطوات النشاط لترى قياساتك هنا.</p>';
      return{t:'نستنتج من النشاط',b:`<p>إدخال مادة عازلة كهربائياً ثابت عزلها <b class="m">k</b> بين صفيحتي المتسعة المشحونة والمفصولة عن البطارية يسبب نقصان فرق الجهد الكهربائي بينهما بنسبة مقدارها ثابت العزل <b class="m">k</b>:</p>
      <p class="m">ΔV<sub>k</sub> = ΔV / k</p>
      <p>ونتيجة لنقصان فرق الجهد بين الصفيحتين تزداد سعة المتسعة وفق العلاقة <b class="m">C = Q / ΔV</b> بثبوت مقدار الشحنة <b class="m">Q</b>، أي إن:</p>
      <p class="m">C<sub>k</sub> = k C</p>
      <p class="hl">سعة المتسعة بوجود العازل الكهربائي تزداد بالعامل k.</p>
      ${mine}
      <p>لكل متسعة مقدار أقصى لفرق الجهد تعمل فيه. فاستمرار زيادة فرق الجهد يزيد المجال الكهربائي بين الصفيحتين، وعند حد معين يحصل انهيار كهربائي للعازل فتعبر شرارة خلاله وتفرغ المتسعة من شحنتها، وقد تتلف.</p>
      <p><b>قوة العزل الكهربائي</b> لمادة: أقصى مقدار لمجال كهربائي يمكن أن تتحمله المادة قبل حصول الانهيار الكهربائي لها، وهي مقياس لقابليتها في الصمود أمام المجال المسلط عليها.</p>
      <table><thead><tr><th>المادة</th><th>ثابت العزل k</th><th>قوة العزل (10⁶ V/m)</th></tr></thead><tbody>
      <tr><td>هواء</td><td class="n">1.0006</td><td class="n">3</td></tr>
      <tr><td>تفلون</td><td class="n">2.1</td><td class="n">60</td></tr>
      <tr><td>ورق</td><td class="n">3.7</td><td class="n">16</td></tr>
      <tr><td>زجاج بايركس</td><td class="n">5.6</td><td class="n">14</td></tr></tbody></table>
      <p class="note">قيم تقريبية في درجة حرارة الغرفة. لو بقيت البطارية موصولة عند إدخال العازل لبقي ΔV ثابتاً وازدادت الشحنة إلى <b class="m">kQ</b>، جرّب ذلك.</p>`};}};
  let cur=null,iv=0,lastH='';
  const place=()=>{info.style.top=(hdr.getBoundingClientRect().bottom-document.querySelector('.stage').getBoundingClientRect().top+10)+'px';info.style.maxHeight=`calc(100% - ${parseFloat(info.style.top)+16}px)`;};
  const fill=()=>{if(!cur)return;const r=P[cur](),h=r.t+'|'+r.b;if(h===lastH)return;lastH=h;iT.textContent=r.t;iB.innerHTML=r.b;};
  const openInfo=n=>{cur=cur===n?null:n;btns.forEach(b=>{const on=b.dataset.p===cur;b.classList.toggle('on',on);b.setAttribute('aria-expanded',on);});
    info.hidden=!cur;clearInterval(iv);if(cur){openTip(false);place();lastH='';fill();iv=setInterval(fill,400);}};
  btns.forEach(b=>b.addEventListener('click',()=>openInfo(b.dataset.p)));
  document.getElementById('infoClose').addEventListener('click',()=>openInfo(cur));
  iB.addEventListener('click',e=>{if(e.target.closest('[data-act="reset"]')&&window.__sim){window.__sim.reset();lastH='';fill();}});
  window.addEventListener('resize',()=>{if(cur)place();});
  let tiv=0,tLast='';
  const tfill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===tLast)return;tLast=h;tT.textContent=r.t;tB.innerHTML=r.b;};
  function openTip(v){tip.hidden=!v;tipBtn.setAttribute('aria-expanded',v);tipBtn.classList.toggle('on',v);clearInterval(tiv);if(v){if(cur)openInfo(cur);tLast='';tfill();tiv=setInterval(tfill,400);}}
  tipBtn.addEventListener('click',()=>openTip(tip.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>openTip(false));
})();
</script>
</body>
</html>
