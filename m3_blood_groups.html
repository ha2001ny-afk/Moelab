<style>
  /* Blood: groups, Rh factor, coagulation — same plate pattern as the circulatory-system reference. Works fully offline. */
  :root{--navy:#1f3a52;--rust:#c4623a;--ink:#26384a;--paper:#eef6fb;--white:#ffffff;--muted:#5f7387;

        --az:1;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  /* automatic scale for large screens (smart TV / 4K / big monitors) */
  @media (min-width:1600px) and (min-height:820px){:root{--az:1.18}}

       font-family:var(--ff);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}

       padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:7}
  #title{color:var(--white);font-size:clamp(15px,3.6vw,22px);font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stage{position:absolute;top:0;bottom:0;left:0;right:0;overflow:hidden;background:#e9f3f9}
  /* coloured field behind the glass so the frosting reads */
  #field{position:absolute;inset:-10%;pointer-events:none}
  #field i{position:absolute;border-radius:50%;opacity:.55}
  #field i:nth-child(1){width:46vmax;height:46vmax;background:radial-gradient(closest-side,#86b4ef,transparent);top:2%;right:-6%}

  #field i:nth-child(3){width:38vmax;height:38vmax;background:radial-gradient(closest-side,#f2a090,transparent);top:12%;left:-8%}
  #field i:nth-child(4){width:24vmax;height:24vmax;background:radial-gradient(closest-side,#c3b5f2,transparent);bottom:8%;right:16%;opacity:.45}
  #field::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(31,58,82,.08) 1px,transparent 1px);background-size:22px 22px}
  .view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
        padding:max(24px,calc(env(safe-area-inset-top,0px) + 12px)) max(16px,env(safe-area-inset-right,0px)) max(32px,calc(env(safe-area-inset-bottom,0px) + 16px)) calc(68px * var(--az,1) + env(safe-area-inset-left,0px));box-sizing:border-box;overscroll-behavior:contain}

         box-shadow:0 18px 40px rgba(31,58,82,.16),inset 0 1px 0 rgba(255,255,255,.9)}
  /* coloured glass: each card / pane is tinted with its own colour */

  /* home */

  .go svg{width:16px;height:16px}

  .dz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;max-width:1180px;margin:0 auto;align-items:start}

  .tx b{color:var(--c);font-weight:800}
  .think{position:relative;margin:20px 0 4px;padding:14px 16px 14px 16px;border-radius:18px;border:2.5px dashed #3c9a3c;background:rgba(236,250,232,.75);display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}

  .think span{font-size:clamp(16px,1.7vw,19px);font-weight:700;line-height:1.8;color:var(--navy)}

  @keyframes ants{to{stroke-dashoffset:-36}}

  #home-btn{background:var(--rust);border-color:var(--rust);color:var(--white)}

  button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}

  body.pf #top{display:none}

  /* ===== inside a topic: everything floats directly on the page — no panes, boxes, borders or backgrounds ===== */

  .run{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:8px 18px;background:var(--navy);color:#fff;font:800 15px var(--ff);cursor:pointer}
  .run svg{width:18px;height:18px}
  .res{padding:10px 14px;border-radius:14px;font-weight:800;font-size:clamp(15px,1.6vw,17px);line-height:1.8;border-inline-start:6px solid}
  .res.ok{background:rgba(46,158,68,.12);color:#1e6e30;border-color:#2e9e44}
  .res.no{background:rgba(214,40,40,.10);color:#a51c1c;border-color:#d62828}
  .res .lt{direction:ltr;unicode-bidi:isolate}
  .hint{font-size:14px;font-weight:700;color:var(--muted)}
  /* donating / receiving table */
  .tw{overflow-x:auto;margin:6px 0 4px}
  .bt{border-collapse:separate;border-spacing:5px;font-weight:800;width:100%;max-width:600px;font-size:clamp(15px,1.6vw,18px)}
  .bt th,.bt td{padding:9px 6px;text-align:center;border-radius:12px}
  .bt thead th{background:color-mix(in srgb,var(--c) 16%,#fff);background-color:rgba(192,57,43,.14);color:var(--navy);font-size:.92em;line-height:1.5}
  .bt th.g{direction:ltr;font-family:Georgia,"Times New Roman",serif;font-size:1.15em;color:var(--c)}
  .bt tbody th{background:rgba(31,58,82,.07)}
  .bt td{cursor:pointer;transition:transform .15s,box-shadow .2s}
  .bt td.y{background:rgba(46,158,68,.14);color:#1e6e30}
  .bt td.n{background:rgba(214,40,40,.10);color:#a51c1c}
  .bt td:hover{transform:scale(1.04)}
  .bt td.cur{box-shadow:0 0 0 3px var(--c),0 8px 16px rgba(0,0,0,.12);transform:scale(1.06)}
  .bt .hl{box-shadow:inset 0 0 0 2px var(--c)}
  .lt,.gl{direction:ltr;unicode-bidi:isolate}
  .gl{font-family:Georgia,"Times New Roman",serif;font-weight:800;color:var(--c)}
  sup{font-size:.7em;line-height:0}
  @media (max-width:560px){.cr>b{min-width:0;width:100%}.chips button{height:38px;min-width:46px;padding:0 10px}}
  /* three cards in one row on wide screens */
  .grid{max-width:1340px}
  .card{flex:1 1 300px;max-width:410px}
  @media (max-width:560px){.card{flex-basis:100%;max-width:420px}}

const svgI=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]||ICO.drop}</svg>`;
function buildLesson(d,box){
  const S=d.info.steps;let cur=0,drawn=false;
  const one=S.length===1;
  box.innerHTML=`<div class="tband" role="heading" aria-level="2"><b>${d.ar}</b><span dir="ltr">${d.en}</span></div><div class="steps" role="tablist"${one?' hidden':''}>${S.map((s,i)=>`<button role="tab" id="st${i}"><span class="sn">${arN(i+1)}</span>${s.t}</button>`).join('')}</div><div class="sec" id="sec"></div>
  <div class="nav"${one?' hidden':''}><button id="prv">السابق</button><button id="nxt"></button></div>`;
  const show=i=>{cur=Math.max(0,Math.min(S.length-1,i));const s=S[cur];
    S.forEach((_,j)=>$('st'+j).setAttribute('aria-selected',j===cur));
    let h=`<h3 style="margin-top:${one?'4px':'18px'}"><span class="hi">${svgI(s.ic)}</span>${s.t} <small dir="ltr">(${s.en})</small></h3>`;
    if(s.blocks){let k=0;const dl=()=>`--d:${Math.min(3.2,.12+(k++)*.28).toFixed(2)}s`;
      s.blocks.forEach(b=>{
        if(b.p)h+=`<p class="intro s ln" style="${dl()}">${b.p}</p>`;
        if(b.h)h+=`<h4 class="ln" style="${dl()}">${b.h}${b.en?` <small>(${b.en})</small>`:''}</h4>`;
        if(b.table)h+=`<div class="ln" style="${dl()}">${tableHTML()}</div>`;
        if(b.items)h+='<ol>'+b.items.map((it,j)=>`<li class="ln" style="${dl()}"><span class="ii">${svgI(it[0])}</span><span class="nb">${arN(j+1)}</span><span class="tx">${it[1]}</span></li>`).join('')+'</ol>';
        if(b.think)h+=`<div class="think ln" style="${dl()}"><span class="tb">${svgI('bulb')}</span><div><b>فكّر معي؟</b><span>${b.think}</span></div></div>`;
      });}
    $('sec').innerHTML=h;if(drawn&&$('lesson').getBoundingClientRect().top<0)$('lesson').scrollIntoView({block:'start',behavior:'smooth'});drawn=true;
    setSide(s);
    $('sec').querySelectorAll('.bt td').forEach(td=>td.onclick=()=>{TR.d=td.dataset.d;TR.r=td.dataset.r;if(CTLU)CTLU();SIMR&&SIMR();});markTable();
    $('prv').disabled=cur===0;$('nxt').textContent=cur<S.length-1?'التالي: '+S[cur+1].t:'العودة إلى البداية';};
  S.forEach((_,i)=>$('st'+i).onclick=()=>show(i));
  $('prv').onclick=()=>show(cur-1);$('nxt').onclick=()=>show(cur<S.length-1?cur+1:0);

  box.addEventListener('touchmove',e=>{if(e.touches.length>1)sx=null;},{passive:true});
  box.addEventListener('touchend',e=>{if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(dx<0?(cur<S.length-1?cur+1:cur):cur-1);},{passive:true});
  LESSON={next:()=>show(cur<S.length-1?cur+1:cur),prev:()=>show(cur-1)};

}

const playBtn=$('play'),playIco=$('playIco');

/* ===================== zoom + / − (scales the cards and lesson text) ===================== */
const ZMIN=.6,ZMAX=2.6;
let Z=1;try{const s=parseFloat(localStorage.getItem('bl-zoom'));if(s>=ZMIN&&s<=ZMAX)Z=s;}catch(e){}
function setZ(v,raw){Z=Math.min(ZMAX,Math.max(ZMIN,v));if(!raw)Z=Math.round(Z*10)/10;document.documentElement.style.setProperty('--z',Z.toFixed(3));
  $('zin').disabled=Z>=ZMAX-.001;$('zout').disabled=Z<=ZMIN+.001;try{localStorage.setItem('bl-zoom',Z);}catch(e){}}
$('zin').onclick=()=>setZ(Z+.1);$('zout').onclick=()=>setZ(Z-.1);setZ(Z);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

/* the figure: free pinch zoom (up to 6×), drag to move, double-tap / double-click to zoom in or reset */
const FMAX=6;
function figApply(b){const z=b._z,sv=b.querySelector(':scope > svg');if(!sv)return;
  const w=b.clientWidth,h=b.clientHeight;z.s=Math.min(FMAX,Math.max(1,z.s));
  z.x=Math.min(0,Math.max(w-w*z.s,z.x));z.y=Math.min(0,Math.max(h-h*z.s,z.y));
  sv.style.transform=z.s>1.001?`translate(${z.x}px,${z.y}px) scale(${z.s})`:'';b.classList.toggle('zoomed',z.s>1.001);}
function figReset(b){if(!b._z)return;b._z={s:1,x:0,y:0};figApply(b);}
function figZoomAt(b,ns,cx,cy){const z=b._z,r=b.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,k=Math.min(FMAX,Math.max(1,ns))/z.s;
  z.x=px-(px-z.x)*k;z.y=py-(py-z.y)*k;z.s*=k;figApply(b);}
function figZoom(b){
  if(b._z)return;b._z={s:1,x:0,y:0};b.style.position='relative';
  const rz=document.createElement('button');rz.className='rz';rz.type='button';rz.setAttribute('aria-label','إرجاع الصورة إلى حجمها');
  rz.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/></svg>الحجم الأصلي';
  rz.onclick=e=>{e.stopPropagation();figReset(b);};rz.onpointerdown=e=>e.stopPropagation();
  b.prepend(rz);
  const P=new Map();let st=null,lastTap=0,moved=false;
  b.addEventListener('pointerdown',e=>{if(e.button>0||e.pointerType==='touch')return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    if(P.size===2){const[a,c]=[...P.values()];st={d:dist(a,c),s:b._z.s,m:mid(a,c),x:b._z.x,y:b._z.y};}
    if(b._z.s>1||P.size===2){try{b.setPointerCapture(e.pointerId);}catch(_){}}});
  b.addEventListener('pointermove',e=>{const prev=P.get(e.pointerId);if(!prev)return;const cur={x:e.clientX,y:e.clientY};P.set(e.pointerId,cur);
    if(Math.abs(cur.x-prev.x)+Math.abs(cur.y-prev.y)>2)moved=true;
    if(P.size===2&&st){const[a,c]=[...P.values()],m=mid(a,c),z=b._z;
      z.s=st.s;z.x=st.x+(m.x-st.m.x);z.y=st.y+(m.y-st.m.y);figZoomAt(b,st.s*dist(a,c)/st.d,m.x,m.y);}
    else if(P.size===1&&b._z.s>1){b._z.x+=cur.x-prev.x;b._z.y+=cur.y-prev.y;figApply(b);}});
  const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);
    if(P.size<2)st=null;
    if(e.type==='pointerup'&&!moved&&P.size===0){const t=Date.now();
      if(t-lastTap<320){figZoomAt(b,b._z.s>1.05?1:2.5,e.clientX,e.clientY);lastTap=0;}else lastTap=t;}};
  ['pointerup','pointercancel'].forEach(t=>b.addEventListener(t,up));
  /* touch: two-finger pinch, one-finger drag when zoomed, double-tap */
  const T=new Map();let ts=null,tTap=0,tMoved=false;
  b.addEventListener('touchstart',e=>{for(const t of e.changedTouches)T.set(t.identifier,{x:t.clientX,y:t.clientY});tMoved=false;
    if(T.size===2){const[a,c]=[...T.values()];ts={d:dist(a,c),s:b._z.s,m:mid(a,c),x:b._z.x,y:b._z.y};}},{passive:true});
  b.addEventListener('touchmove',e=>{if(T.size===2&&ts){e.preventDefault();for(const t of e.changedTouches)if(T.has(t.identifier))T.set(t.identifier,{x:t.clientX,y:t.clientY});
      const[a,c]=[...T.values()],m=mid(a,c),z=b._z;z.s=ts.s;z.x=ts.x+(m.x-ts.m.x);z.y=ts.y+(m.y-ts.m.y);figZoomAt(b,ts.s*dist(a,c)/ts.d,m.x,m.y);tMoved=true;}
    else if(T.size===1&&b._z.s>1){e.preventDefault();const t=e.changedTouches[0],p=T.get(t.identifier);if(!p)return;b._z.x+=t.clientX-p.x;b._z.y+=t.clientY-p.y;T.set(t.identifier,{x:t.clientX,y:t.clientY});figApply(b);tMoved=true;}},{passive:false});
  const tend=e=>{for(const t of e.changedTouches)T.delete(t.identifier);if(T.size<2)ts=null;
    if(e.type==='touchend'&&!tMoved&&T.size===0){const n=Date.now(),t=e.changedTouches[0];if(n-tTap<320){figZoomAt(b,b._z.s>1.05?1:2.5,t.clientX,t.clientY);tTap=0;}else tTap=n;}};
  b.addEventListener('touchend',tend);b.addEventListener('touchcancel',tend);
  b.addEventListener('wheel',e=>{if(!e.ctrlKey&&b._z.s<=1)return;e.preventDefault();e.stopPropagation();
    if(e.ctrlKey)figZoomAt(b,b._z.s*Math.exp(-e.deltaY*.01),e.clientX,e.clientY);else{b._z.x-=e.deltaX;b._z.y-=e.deltaY;figApply(b);}},{passive:false});
  b.addEventListener('dragstart',e=>e.preventDefault());
  addEventListener('resize',()=>figApply(b));
}

/* ===================== fullscreen ===================== */
const root=document.documentElement,fsIco=$('fsIco');
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
let pseudo=false;
const setPseudo=v=>{pseudo=v;document.body.classList.toggle('pf',v);fsUpd();};
$('fs').onclick=()=>{
  if(fsEl()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}return;}
  if(pseudo){setPseudo(false);return;}
  const req=root.requestFullscreen||root.webkitRequestFullscreen;
  if(!req||(document.fullscreenEnabled===false&&document.webkitFullscreenEnabled!==true)){setPseudo(true);return;}
  try{const r=req.call(root);if(r&&r.then)r.catch(()=>setPseudo(true));else setTimeout(()=>{if(!fsEl())setPseudo(true);},350);}catch(e){setPseudo(true);}
};
const fsUpd=()=>{const on=!!fsEl()||pseudo;fsIco.setAttribute('d',on?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');$('fs').setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');};
document.addEventListener('fullscreenchange',fsUpd);document.addEventListener('webkitfullscreenchange',fsUpd);

route();requestAnimationFrame(frame);
})();
