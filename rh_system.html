<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>وراثة نظام Rh</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav{width:58px;height:58px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:24px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);flex:none}
  .nav:active{background:#d9ebf7}
  .nav:focus-visible,.dot:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  #dots{display:flex;gap:8px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .tx{fill:#1f3a52;font-size:14.5px;font-weight:bold;dominant-baseline:central;direction:rtl}
  .lb{fill:#1f3a52;font-size:13px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:rtl}
  .cap{fill:#c4623a;font-size:13.5px;font-weight:bold;dominant-baseline:central;direction:rtl}
  .gn{fill:#1b1b1b;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:18px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .gs{fill:#1b1b1b;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:15.5px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .en{fill:#c4623a;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:16px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .ps{fill:#1f3a52;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:12px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .big{font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:30px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .pc{fill:#1f3a52;font-size:13px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:rtl}
  .sm{fill:#4a5d6e;font-size:12px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:rtl}
  .xs{fill:#4a5d6e;font-size:10px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:rtl}
  .th{fill:#1f3a52;font-size:13px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .rd{fill:#d32f2f;font-size:13px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:rtl}
  .hd{fill:#fff;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<div id="top"><div id="title">وراثة نظام Rh</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 420 400" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".9"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fb"/><stop offset="1" stop-color="#e4eaf0"/></linearGradient>
        <radialGradient id="gRbc" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#e2545a"/><stop offset="1" stop-color="#a8222b"/></radialGradient>
        <linearGradient id="gChr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3d3e2"/><stop offset="1" stop-color="#8aa3bb"/></linearGradient>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="المرحلة السابقة">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="المرحلة التالية">◀</button>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,NAVY='#1f3a52',ORG='#c4623a',RED='#d32f2f';
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));

const TITLE='وراثة نظام Rh';
/* مقدمة · البصرة وواينر · فيشر وريس · الجدول المبسط · مثال Rh · الاستنتاج · التضريب · فراء الارنب · جدول (5-4) · السيادة غير التامة */
const DUR=[9,13,12,11,11,10,14,12,12,10];

const world=G(view);
const glowL=G(world),boxL=G(world),txtL=G(world),objL=G(world);

/* ---------- builders ---------- */
const op=(e,a)=>e.setAttribute('opacity',f2(a));
function place(o,x,y,s,a,rot){o.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) rotate(${f1(rot||0)}) scale(${f2(s)})`);o.setAttribute('opacity',f2(a));}
const glow=(x,y,r,f)=>el('circle',{cx:x,cy:y,r:r||60,fill:f||'url(#gGlow)',opacity:0},glowL);
const box=(x,y,w,h)=>el('rect',{x,y,width:w,height:h,rx:6,fill:'url(#gBox)',stroke:NAVY,'stroke-width':2,opacity:0},boxL);
/* نص يدعم الرموز العلوية بالصيغة ^{..} مثل Rh^{+} و c^{ch} */
function runs(t,str,fill,st){str.split(/(\^\{[^}]*\})/).forEach(p=>{if(!p)return;
  const sup=p.slice(0,2)==='^{',s=sup?p.slice(2,-1):p,sp=document.createElementNS(NS,'tspan'),want=sup?-6:0;
  if(want!==st.dy){sp.setAttribute('dy',want-st.dy);st.dy=want;}
  if(sup)sp.setAttribute('font-size','68%');if(fill)sp.setAttribute('fill',fill);
  sp.textContent=s;t.appendChild(sp);});}
function txt(s,x,y,c,p){const t=el('text',{class:c,x,y,opacity:0},p||txtL);runs(t,s,null,{dy:0});return t;}
const mid=t=>{t.setAttribute('text-anchor','middle');return t;};
const mlines=(arr,x,yc,c,lh)=>arr.map((s,i)=>txt(s,x,yc+(i-(arr.length-1)/2)*(lh||18),c));
function head(s,y,w,cx){const g=G(txtL,{opacity:0});
  el('rect',{x:cx-w/2,y:y-15,width:w,height:30,rx:15,fill:ORG},g);
  el('text',{class:'hd',x:cx,y:y+1},g).textContent=s;return g;}
function lab(s,c,p){const g=G(p||objL,{opacity:0}),t=txt(s,0,0,c,g);t.setAttribute('opacity',1);return g;}
function badge(n,x,y){const g=G(txtL,{opacity:0});el('circle',{cx:x,cy:y,r:11,fill:ORG},g);el('text',{class:'hd',x,y:y+1,style:'font-size:13px'},g).textContent=n;return g;}

/* خلية دم حمراء ؛ Rh+ تحمل المستضد (نقاط صفراء) على سطحها */
function cellRh(p,pos,r){r=r||14;const g=G(p,{opacity:0});
  el('circle',{r,fill:'url(#gRbc)',stroke:'#8e1a20','stroke-width':1.4},g);
  el('ellipse',{rx:r*.45,ry:r*.4,fill:'#ec8a8a',opacity:.8},g);
  if(pos)for(let k=0;k<8;k++){const q=k*PI/4;
    el('circle',{cx:f1(Math.cos(q)*(r+2.4)),cy:f1(Math.sin(q)*(r+2.4)),r:2.7,fill:'#f2b705',stroke:'#8a6400','stroke-width':.8},g);}
  return g;}

/* ارنب : الوان الفراء */
const RB={ag:{b:'#8b7b65',p:'#6c5e4c',e:'#1d1d1d'},ch:{b:'#bcc0c7',p:'#959aa2',e:'#1d1d1d'},hi:{b:'#f6f5f1',p:'#3a332e',e:'#d32f2f'},al:{b:'#fbfbfb',p:'#fbfbfb',e:'#d32f2f'},lg:{b:'#d3cdc2',p:'#b2a99c',e:'#1d1d1d'}};
function rabbit(p,k){const c=RB[k],g=G(p,{opacity:0}),E=(a,f)=>el('ellipse',Object.assign(a,{fill:f,stroke:'#6b5d50','stroke-width':1.1}),g);
  E({cx:-14,cy:-27,rx:4.5,ry:13,transform:'rotate(-18 -14 -27)'},c.p);
  E({cx:-6,cy:-28,rx:4.5,ry:14,transform:'rotate(12 -6 -28)'},c.p);
  E({cx:37,cy:0,rx:6,ry:6},k==='hi'?c.p:c.b);
  E({cx:8,cy:6,rx:28,ry:17},c.b);
  E({cx:22,cy:9,rx:14,ry:13},c.b);
  E({cx:24,cy:22,rx:11,ry:4},c.p);
  E({cx:-12,cy:21,rx:7,ry:3.5},c.p);
  E({cx:-22,cy:-6,rx:14,ry:12},c.b);
  E({cx:-34,cy:-3,rx:3.5,ry:3},k==='hi'?c.p:'#e3a0a0');
  el('circle',{cx:-25,cy:-9,r:2.4,fill:c.e},g);
  return g;}

/* جدول : الاعمدة تُعد من اليمين */
function table(xR,ws,y,hs){const g=G(boxL,{opacity:0}),xs=[],ys=[];let x=xR,yy=y;
  ws.forEach(w=>{xs.push([x-w,x]);x-=w;});hs.forEach(h=>{ys.push([yy,yy+h]);yy+=h;});
  ys.forEach(([y0,y1],r)=>xs.forEach(([x0,x1])=>el('rect',{x:x0,y:y0,width:x1-x0,height:y1-y0,fill:r?'#fff':'#eef2f6',stroke:NAVY,'stroke-width':1.6},g)));
  return{g,cx:c=>(xs[c][0]+xs[c][1])/2,cy:r=>(ys[r][0]+ys[r][1])/2,x0:c=>xs[c][0],w:c=>xs[c][1]-xs[c][0],y0:r=>ys[r][0],h:r=>ys[r][1]-ys[r][0],end:yy};}
const cellFill=(T,c,r,col)=>el('rect',{x:T.x0(c)+1,y:T.y0(r)+1,width:T.w(c)-2,height:T.h(r)-2,fill:col,opacity:0},boxL);

/* فقرة بالتفاف تلقائي ؛ الكلمات اللاتينية والارقام تُلوَّن */
const HL=/[A-Za-z0-9]/;
function setLine(t,words){while(t.firstChild)t.removeChild(t.firstChild);const st={dy:0};
  words.forEach((w,i)=>{if(i)runs(t,' ',null,st);runs(t,w,HL.test(w)?ORG:null,st);});}
function para(str,o){const words=str.split(/\s+/),lines=[];let cur=[],y=o.y;
  const mk=()=>el('text',{class:o.cls||'tx',x:o.x,y,'text-anchor':o.anchor||'start',opacity:0},txtL);
  let t=mk();
  for(const w of words){const trial=cur.concat(w);setLine(t,trial);
    if(t.getComputedTextLength()>o.w&&cur.length){setLine(t,cur);lines.push(t);y+=o.lh;t=mk();cur=[w];setLine(t,cur);}
    else cur=trial;}
  setLine(t,cur);lines.push(t);return{lines,y:y+o.lh};}
function rev(arr,u,a,b){const n=arr.length;
  arr.forEach((g,i)=>{const s=sm(u,a+(b-a)*i/n,Math.min(b,a+(b-a)*(i+1.6)/n));
    [].concat(g).forEach(e=>{op(e,s);e.setAttribute('transform',`translate(${f1(12*(1-s))} 0)`);});});}
const block=(h,lines)=>[[h],...lines.map(l=>[l])];
const opAll=(arr,a)=>arr.forEach(e=>op(e,a));

/* اربعة اعمدة تُقرأ من اليمين : مقدمة Rh · فيشر وريس · مثال Rh · فراء الارنب */
const XA=1260,XB=840,XC=420,XD=0;
let r;

/* =================== العمود 1 : وراثة نظام Rh =================== */
const hA=head('وراثة نظام Rh',24,200,XA+210);
r=para('ان الابحاث الوراثية الاولية قادت الى الاعتقاد بأنه في سكان البشر يوجد فقط حليلان او أليلان تسيطر على وجود او غياب المستضد . لقد افترضوا بأن أليل Rh يعين وجود المستضد على سطح الكرية الحمراء ويسلك كمورث سائد . وان الأليل rh يؤدي الى غياب المستضد .',{x:XA+408,y:66,w:396,lh:28});
const seqA=block(hA,r.lines);
r=para('في مدينة البصرة لقد وجد عام 1976م بأن 93% من العينة المدروسة ذي (Rh^{+}) و 7% ذي (Rh^{-}) وتبين بأن الطراز السالب يقل في المجتمعات الشرقية ربما بسبب الانتخاب ضد الأليل السالب . ونتيجة لادخال تحسينات على الفحوصات اللازمة لتعيين وجود المستضد ، اصبح واضحاً بأن هناك تغايرات ، فقد افترض العالم واينر Wiener لاحقاً بأن هناك سلسلة من الأليلات المتعددة في موقع منفرد لـ Rh والتي يجب ان تؤخذ بعين الاعتبار لهذه التغايرات .',{x:XA+408,y:r.y+10,w:396,lh:28});
const seqB=r.lines.map(l=>[l]);
const gY=r.y+4,gBox=box(XA+6,gY,400,224);
const NEG=new Set([7,23,38,51,66,84,95]);
const grid=[];for(let i=0;i<100;i++){const c=i%10,rw=Math.floor(i/10),neg=NEG.has(i);
  grid.push({e:el('circle',{cx:XA+28+c*18,cy:gY+24+rw*18,r:0,fill:neg?'#fff':'url(#gRbc)',stroke:neg?'#c98a8a':'#8e1a20','stroke-width':1.3,opacity:0},objL),neg});}
const LG={div:el('line',{x1:XA+210,y1:gY+14,x2:XA+210,y2:gY+210,stroke:'#b9c8d6','stroke-width':1.5,'stroke-dasharray':'5 5',opacity:0},boxL),
  sw1:el('circle',{cx:XA+380,cy:gY+46,r:9,fill:'url(#gRbc)',stroke:'#8e1a20','stroke-width':1.3,opacity:0},objL),
  t1:txt('موجب Rh^{+}',XA+300,gY+46,'pc'),n1:txt('0%',XA+300,gY+84,'big'),
  sw2:el('circle',{cx:XA+380,cy:gY+132,r:9,fill:'#fff',stroke:'#c98a8a','stroke-width':1.3,opacity:0},objL),
  t2:txt('سالب Rh^{-}',XA+300,gY+132,'pc'),n2:txt('0%',XA+300,gY+170,'big'),
  cap:mid(txt('عينة مدينة البصرة عام 1976م',XA+109,gY+210,'cap'))};
LG.n1.style.fill=RED;LG.n2.style.fill='#9a6b6b';

/* =================== العمود 2 : فيشر وريس =================== */
const hB=head('فرضية فيشر و ريس',24,200,XB+210);
r=para('من جهة اخرى افترض العالمان فيشر Fisher و ريس Race بأن هناك نوعاً بديلاً من التوريث يتضمن ثلاثة من المورثات المتقاربة والمرتبطة وهي C ، D ، E وكل واحد منها يضم أليلين تكون مسؤولة عن وراثة عوامل الـ Rh . ان المصطلح ارتباط Linkage يستخدم لوصف الجينات الواقعة على نفس الكروموسوم والذي هو الزوج الاول من الكروموسومات الجسمية بالنسبة لهذه المجموعة ويمكن للطالب اتباع الجدول الآتي والمبسط في حل المسائل الوراثية والمتعلقة بـ Rh .',{x:XB+408,y:66,w:396,lh:28});
const seqC=block(hB,r.lines);
const cY=r.y+2,cBox=box(XB+6,cY,400,190),cTitle=txt('الزوج الاول من الكروموسومات الجسمية',XB+206,cY+16,'lb');
const BC=['#2e9d5b','#d32f2f','#2f6fd1'];
function chromo(y){const g=G(objL,{opacity:0});
  el('rect',{x:XB+50,y:y-12,width:310,height:24,rx:12,fill:'url(#gChr)',stroke:NAVY,'stroke-width':1.6},g);
  el('path',{d:`M${XB+128},${y-13} L${XB+136},${y-5} L${XB+144},${y-13}Z M${XB+128},${y+13} L${XB+136},${y+5} L${XB+144},${y+13}Z`,fill:'#fff'},g);
  const bands=BC.map((c,i)=>el('rect',{x:XB+244+i*24,y:y-12,width:12,height:24,fill:c,opacity:0},g));
  return{g,bands};}
const ch1=chromo(cY+62),ch2=chromo(cY+108);
const topL=['C','D','E'].map((s,i)=>{const g=lab(s,'gn');g.firstChild.style.fill=BC[i];return g;});
const botL=['c','d','e'].map((s,i)=>{const g=lab(s,'gn');g.firstChild.style.fill=BC[i];return g;});
const brk=el('path',{d:`M${XB+238},${cY+148} L${XB+238},${cY+156} L${XB+298},${cY+156} L${XB+298},${cY+148}`,stroke:ORG,'stroke-width':2.2,fill:'none',opacity:0},boxL);
const brkT=txt('مورثات متقاربة ومرتبطة (Linkage)',XB+268,cY+174,'pc');
const chGl=glow(XB+268,cY+85,70);

/* الجدول المبسط */
const capT=para('جدول مبسط لوراثة Rh',{x:XB+206,y:cY+190+24,w:396,lh:22,cls:'cap',anchor:'middle'});
const TB=table(XB+406,[120,170,110],capT.y-2,[50,62,62]);
const TBh=[txt('الطراز المظهري',TB.cx(0),TB.cy(0),'th'),txt('الطراز الوراثي',TB.cx(1),TB.cy(0),'th'),...mlines(['المستضد على','سطح الكرية'],TB.cx(2),TB.cy(0),'th',17)];
const RBr=[['Rh^{+}',['RhRh','Rhrh'],true,'#fbe0e0'],['Rh^{-}',['rhrh'],false,'#eef1f4']].map(([ph,gs,pos,col],i)=>{
  const rw=i+1,y=TB.cy(rw),e=[cellFill(TB,0,rw,col),txt(ph,TB.cx(0),y,'gn')];
  if(gs.length>1)e.push(txt(gs[0],TB.cx(1)+50,y,'gn'),txt('او',TB.cx(1),y,'pc'),txt(gs[1],TB.cx(1)-50,y,'gn'));
  else e.push(txt(gs[0],TB.cx(1),y,'gn'));
  e.push(txt(pos?'يوجد':'لا يوجد',TB.cx(2)-20,y,'pc'));
  return{e,c:cellRh(objL,pos,13),x:TB.cx(2)+30,y,gl:glow(TB.cx(0),y,40)};});

/* =================== العمود 3 : مثال عن مجموعة الدم Rh =================== */
const hC=head('مثال : عن مجموعة الدم Rh',24,230,XC+210);
r=para('رجل تسلسل ولادته الاول في العائلة ذو مجموعة (Rh^{+}) كان والده ذو (Rh^{+}) ايضاً ولكن والدته كانت ذات (Rh^{-}) . تزوج هذا الرجل من امرأة ذات (Rh^{+}) ولكن والدها كان ذا (Rh^{-}) . تنبأ بمجموعة الدم Rh لأولاده الناتجين ، مع بيان عدد اولاده الذين سوف لا يصابون بمرض اليرقان .',{x:XC+408,y:66,w:396,lh:28});
const seqD=block(hC,r.lines);
/* مخطط العائلة */
const pY=r.y+2,pBox=box(XC+6,pY,400,152);
function sym(kind,x,y,pos){const g=G(objL,{opacity:0}),st={fill:pos===null?'#f0f0f0':pos?'#f7c9c9':'#fff',stroke:NAVY,'stroke-width':2};
  if(kind==='m')el('rect',Object.assign({x:-15,y:-15,width:30,height:30},st),g);else el('circle',Object.assign({r:15},st),g);
  const t=txt(pos===null?'؟':pos?'Rh^{+}':'Rh^{-}',0,0,pos===null?'pc':'ps',g);t.setAttribute('opacity',1);return{g,x,y};}
const L=(x1,y1,x2,y2)=>el('line',{x1,y1,x2,y2,stroke:NAVY,'stroke-width':2,opacity:0},boxL);
const PED=[
  {s:[sym('m',XC+370,pY+40,true),sym('f',XC+300,pY+40,false)],l:[L(XC+315,pY+40,XC+355,pY+40),L(XC+335,pY+40,XC+335,pY+85)],t:[txt('الاب',XC+370,pY+13,'xs'),txt('الام',XC+300,pY+13,'xs')]},
  {s:[sym('m',XC+120,pY+40,false),sym('f',XC+50,pY+40,null)],l:[L(XC+65,pY+40,XC+105,pY+40),L(XC+85,pY+40,XC+85,pY+85)],t:[txt('الاب',XC+120,pY+13,'xs'),txt('الام',XC+50,pY+13,'xs')]},
  {s:[sym('m',XC+335,pY+100,true),sym('f',XC+85,pY+100,true)],l:[L(XC+100,pY+100,XC+320,pY+100),L(XC+210,pY+100,XC+210,pY+120)],t:[txt('الرجل',XC+380,pY+100,'sm'),txt('المرأة',XC+33,pY+100,'sm'),txt('الاولاد ؟',XC+210,pY+136,'sm')]}];
const GT=[['rhrh',XC+300,pY+66],['rhrh',XC+120,pY+66],['Rhrh',XC+335,pY+132],['Rhrh',XC+85,pY+132]].map(([s,x,y],i)=>{
  const t=txt(s,x,y,'gs');t.style.fill=ORG;return{t,gl:i>1?glow(x,y-30,42):null};});
/* الاستنتاج */
const infH=txt('الاستنتاج :',XC+408,pY+176,'cap');
const b1=badge('1',XC+396,pY+206);
r=para('بما ان والد الرجل ذو (Rh^{+}) ووالدته (Rh^{-}) ، اذن الرجل هجين Rhrh .',{x:XC+378,y:pY+206,w:370,lh:28});
const in1=r.lines,b2=badge('2',XC+396,r.y);
r=para('بما ان المرأة ذات (Rh^{+}) ووالدها (Rh^{-}) ، اذن هي ايضاً هجينة Rhrh .',{x:XC+378,y:r.y,w:370,lh:28});
const in2=r.lines;
const seqE=[[infH],[b1,in1[0]],...in1.slice(1).map(l=>[l]),[b2,in2[0]],...in2.slice(1).map(l=>[l])];
/* مخطط التضريب */
const xY=r.y+4,xBox=box(XC+6,xY,400,288);
const xLab=['P₁','G₁','F₁'].map((s,i)=>txt(s,XC+32,xY+[56,104,160][i],'gn'));
const xHead=[txt('Rh^{+} هجين',XC+300,xY+24,'pc'),txt('Rh^{+} هجين',XC+130,xY+24,'pc'),txt('♂',XC+350,xY+24,'gn'),txt('♀',XC+180,xY+24,'gn'),txt('×',XC+215,xY+42,'gn')];
xHead[2].style.fill='#2f6fd1';xHead[3].style.fill='#c2185b';
const xP=[txt('Rhrh',XC+300,xY+56,'gn'),txt('Rhrh',XC+130,xY+56,'gn')];
const GAM=[['Rh',XC+330,XC+300],['rh',XC+270,XC+300],['Rh',XC+160,XC+130],['rh',XC+100,XC+130]].map(([s,x,px])=>{

  return{g,x,ln:el('path',{d:`M${px},${xY+68} L${x},${xY+89}`,stroke:NAVY,'stroke-width':1.6,fill:'none',pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1,opacity:0},boxL)};});
const F1=[['RhRh',XC+345,0,2,true],['Rhrh',XC+265,0,3,true],['Rhrh',XC+180,1,2,true],['rhrh',XC+100,1,3,false]].map(([s,x,m,f,pos])=>{
  const ln=[m,f].map(k=>el('path',{d:`M${GAM[k].x},${xY+119} L${x},${xY+147}`,stroke:'#8aa3bb','stroke-width':1.4,fill:'none',pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1,opacity:0},boxL));
  return{t:txt(s,x,xY+160,'gn'),c:cellRh(objL,pos,10),x,ln,gl:glow(x,xY+168,34)};});
const xCol=[txt(':',XC+305,xY+160,'gn'),txt(':',XC+140,xY+160,'gn')];
const brace=el('path',{d:`M${XC+155},${xY+204} q0,8 10,8 L${XC+252},${xY+212} q10,0 10,8 q0,-8 10,-8 L${XC+360},${xY+212} q10,0 10,-8`,stroke:NAVY,'stroke-width':2,fill:'none',opacity:0},boxL);
const ratio=[txt('3 Rh^{+}',XC+262,xY+236,'gn'),txt(':',XC+150,xY+236,'gn'),txt('1 Rh^{-}',XC+100,xY+236,'gn')];
ratio[0].style.fill=RED;ratio[2].style.fill='#9a6b6b';
const xNote=[txt('علماً ان جميع الاولاد سوف لا يصابون بهذا المرض',XC+206,xY+258,'rd'),txt('لأن الأم موجبة (Rh^{+}) فلا تكوّن اجساماً مضادة لعامل Rh',XC+206,xY+277,'sm')];

/* =================== العمود 4 : سلسلة أليلات لون الفراء في الارنب =================== */
const hD=head('مثال (3) : سلسلة أليلات لون الفراء في الارنب',24,330,XD+210);
r=para('يعتبر لون الفراء مثال تقليدي عن الأليلات المتعددة او المتضاعفة ، حيث يمكن ملاحظة تأثير الأليل على الطراز المظهري بصورة مباشرة وبالعين المجردة ، وبدون الحاجة الى استخدام اي تقنية لتوضيح ذلك حيث يتحكم بلون الفراء اربعة أليلات مختلفة على الاقل وهي (C ، c^{ch} ، c^{h} ، c^{a}) ، علماً بأن الأليل (C) هو المسؤول عن اللون الرمادي (agouti) او البري (wild) ويسود هذا الأليل سيادة تامة على كافة الأليلات الثلاثة المتبقية (c^{ch} ، c^{h} ، c^{a}) . اما الأليل (c^{ch}) فيسود بدوره على كل من الأليلين (c^{h} ، c^{a}) . في حين ان الأليل c^{h} يسود على الأليل (c^{a}) . لذا فأن ترتيب السيادة بالنسبة لهذه الأليلات يكون كالآتي :',{x:XD+408,y:66,w:396,lh:28});
const seqF=block(hD,r.lines);
const dY=r.y+2,dBox=box(XD+6,dY,400,88),dTitle=txt('ترتيب السيادة',XD+206,dY+16,'lb');
const CH=[['C','#8b7b65','#efe7da'],['c^{ch}','#7d838c','#eceef1'],['c^{h}','#3a332e','#f3efe9'],['c^{a}','#d07a7a','#fdf0f0']].map(([s,c,bg],i)=>{
  const g=G(objL,{opacity:0});el('rect',{x:-26,y:-17,width:52,height:34,rx:9,fill:bg,stroke:c,'stroke-width':2.2},g);
  const t=txt(s,0,0,'gn',g);t.setAttribute('opacity',1);return{g,x:XD+350-i*100};});
const ARW=[0,1,2].map(i=>{const a=CH[i].x,b=CH[i+1].x,y=dY+56;
  return[el('path',{d:`M${a-30},${y} L${b+30},${y} M${b+38},${y-5} L${b+30},${y} L${b+38},${y+5}`,stroke:ORG,'stroke-width':2.2,fill:'none','stroke-linecap':'round',opacity:0},boxL),txt('يسود على',(a+b)/2,y-13,'xs')];});
/* جدول (5-4) */
const capR=para('جدول (5-4) : الطرز المظهرية والوراثية لألوان الفراء في الارانب',{x:XD+206,y:dY+88+24,w:396,lh:22,cls:'cap',anchor:'middle'});
const TR=table(XD+406,[120,180,100],capR.y-2,[48,64,64,64,64]);
const TRh=[txt('الطراز المظهري',TR.cx(0),TR.cy(0),'th'),...mlines(['الطرز الوراثية','المحتملة'],TR.cx(1),TR.cy(0),'th',17),txt('الشكل',TR.cx(2),TR.cy(0),'th')];
const RR=[['agouti','الرمادي','CC, Cc^{ch}, Cc^{h}, Cc^{a}','ag','#efe7da'],['chinchilla','الفضي','c^{ch}c^{ch}, c^{ch}c^{h}, c^{ch}c^{a}','ch','#eceef1'],['Himalayan','الهمالايا','c^{h}c^{h}, c^{h}c^{a}','hi','#f3efe9'],['albino','الامهق','c^{a}c^{a}','al','#fdf0f0']].map(([en,ar,gs,k,col],i)=>{
  const rw=i+1,y=TR.cy(rw);
  return{e:[cellFill(TR,0,rw,col),txt(en,TR.cx(0),y-11,'en'),txt(ar,TR.cx(0),y+12,'pc'),txt(gs,TR.cx(1),y,'gs')],rb:rabbit(objL,k),x:TR.cx(2),y:y+4};});
/* السيادة غير التامة */
r=para('تدّعي بعض المصادر بأن هناك سيادة غير تامة بين الأليلين c^{ch} و c^{a} وبين الأليلين c^{ch} و c^{h} ، لذا فعندما يجتمع c^{ch}c^{a} او c^{ch}c^{h} في نفس الفرد فأنه سيكون رمادي فاتح Light Gray .',{x:XD+408,y:TR.end+30,w:396,lh:28});
const note=r.lines;
const nY=r.y,nBox=box(XD+6,nY,400,100);
const nG=[txt('c^{ch}c^{a}',XD+340,nY+30,'gn'),txt('او',XD+340,nY+51,'sm'),txt('c^{ch}c^{h}',XD+340,nY+72,'gn')];
const nA=el('path',{d:`M${XD+295},${nY+51} L${XD+160},${nY+51} M${XD+168},${nY+45} L${XD+160},${nY+51} L${XD+168},${nY+57}`,stroke:ORG,'stroke-width':2.4,fill:'none','stroke-linecap':'round',pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1,opacity:0},boxL);
const nAt=txt('سيادة غير تامة',XD+228,nY+38,'sm');
const nR=rabbit(objL,'lg'),nRt=txt('رمادي فاتح Light Gray',XD+92,nY+86,'pc'),nGl=glow(XD+92,nY+44,50);

/* ---------- whole page in one view ---------- */
const H=Math.max(gY+224,TB.end,xY+288,nY+100)+14;
const SEP=[XC,XB,XA].map(x=>el('line',{x1:x+4,y1:12,x2:x+4,y2:H-12,stroke:'#b9c8d6','stroke-width':1.5,'stroke-dasharray':'6 6',opacity:0},boxL));
const VB=[-52,0,1736,H];svg.setAttribute('viewBox',VB.join(' '));

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:1,dur:DUR[0]};
let stage=0,T=0,t0=0,paused=false,P=0;
let last=performance.now();
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}
const draw=(p,k)=>{p.setAttribute('stroke-dashoffset',f2(1-k));op(p,k>0?1:0);};

/* ---------------- render ---------------- */
function render(){
  const u=DUR.map((_,i)=>clamp(P-i,0,1));
  let a,k;

  /* 1 — مقدمة */
  SEP.forEach(l=>op(l,sm(u[0],0,.15)));
  rev(seqA,u[0],0,.9);

  /* 2 — البصرة وواينر : 93 خلية موجبة و 7 سالبة */
  rev(seqB,u[1],0,.45);
  op(gBox,sm(u[1],.42,.52));
  grid.forEach((q,i)=>{const s=sm(u[1],.5+i*.003,.56+i*.003);op(q.e,s);q.e.setAttribute('r',f1(7*s));
    if(q.neg)q.e.setAttribute('stroke-width',f1(u[1]>.88?1.3+1.4*(.5+.5*Math.sin(T*4)):1.3));});
  a=sm(u[1],.5,.62);[LG.div,LG.sw1,LG.t1,LG.n1,LG.sw2,LG.t2,LG.n2].forEach(e=>op(e,a));
  k=sm(u[1],.55,.88);LG.n1.textContent=Math.round(93*k)+'%';LG.n2.textContent=Math.round(7*k)+'%';
  op(LG.cap,sm(u[1],.85,.95));

  /* 3 — فيشر وريس : المورثات المرتبطة C D E */
  rev(seqC,u[2],0,.45);
  a=sm(u[2],.42,.52);op(cBox,a);op(cTitle,a);
  k=sm(u[2],.48,.62);place(ch1.g,-60*(1-k),0,1,k);place(ch2.g,60*(1-k),0,1,k);
  [0,1,2].forEach(i=>{const s=sm(u[2],.62+i*.06,.7+i*.06);op(ch1.bands[i],s);op(ch2.bands[i],s);
    place(topL[i],XB+250+i*24,cY+38,.4+.6*s,s);place(botL[i],XB+250+i*24,cY+134,.4+.6*s,s);});
  a=sm(u[2],.84,.96);op(brk,a);op(brkT,a);op(chGl,.8*Math.sin(PI*sm(u[2],.82,1)));

  /* 4 — الجدول المبسط */
  a=sm(u[3],0,.15);capT.lines.forEach(l=>op(l,a));op(TB.g,sm(u[3],.08,.2));opAll(TBh,sm(u[3],.12,.24));
  RBr.forEach((q,i)=>{const s0=.3+i*.3;a=sm(u[3],s0,s0+.18);opAll(q.e,a);
    place(q.c,q.x,q.y,.4+.6*a,a,T*15);op(q.gl,Math.sin(PI*sm(u[3],s0+.05,s0+.32)));});

  /* 5 — المثال ومخطط العائلة */
  rev(seqD,u[4],0,.5);
  op(pBox,sm(u[4],.45,.55));
  PED.forEach((f,i)=>{a=sm(u[4],.55+i*.12,.67+i*.12);opAll(f.l,a);opAll(f.t,a);f.s.forEach(s=>place(s.g,s.x,s.y,.5+.5*a,a));});

  /* 6 — الاستنتاج */
  rev(seqE,u[5],0,.6);
  GT.forEach((q,i)=>{const s0=i<2?.15+i*.1:.4+(i-2)*.25;a=sm(u[5],s0,s0+.12);op(q.t,a);
    if(q.gl)op(q.gl,.8*Math.sin(PI*sm(u[5],s0,s0+.3)));});

  /* 7 — التضريب */
  a=sm(u[6],0,.08);op(xBox,a);opAll(xLab,a);
  opAll(xHead,sm(u[6],.05,.15));opAll(xP,sm(u[6],.12,.22));
  GAM.forEach((q,i)=>{draw(q.ln,sm(u[6],.22+i*.03,.32+i*.03));a=sm(u[6],.3+i*.03,.4+i*.03);place(q.g,q.x,xY+104,.4+.6*a,a);});
  F1.forEach((q,i)=>{q.ln.forEach(p=>draw(p,sm(u[6],.45+i*.04,.55+i*.04)));
    a=sm(u[6],.56+i*.05,.64+i*.05);op(q.t,a);place(q.c,q.x,xY+186,.4+.6*a,a,T*15);
    op(q.gl,.7*Math.sin(PI*sm(u[6],.56+i*.05,.72+i*.05)));});
  opAll(xCol,sm(u[6],.62,.72));
  a=sm(u[6],.78,.88);op(brace,a);opAll(ratio,a);
  opAll(xNote,sm(u[6],.88,.98));

  /* 8 — فراء الارنب وترتيب السيادة */
  rev(seqF,u[7],0,.6);
  a=sm(u[7],.58,.66);op(dBox,a);op(dTitle,a);
  CH.forEach((q,i)=>{a=sm(u[7],.64+i*.07,.72+i*.07);place(q.g,q.x,dY+56,.4+.6*a,a);});
  ARW.forEach((e,i)=>opAll(e,sm(u[7],.7+i*.07,.78+i*.07)));

  /* 9 — جدول (5-4) */
  a=sm(u[8],0,.12);capR.lines.forEach(l=>op(l,a));op(TR.g,sm(u[8],.06,.16));opAll(TRh,sm(u[8],.1,.2));
  RR.forEach((q,i)=>{const s0=.22+i*.18;a=sm(u[8],s0,s0+.14);opAll(q.e,a);
    place(q.rb,q.x,q.y-4*Math.abs(Math.sin(T*2+i*.9))*a,.75*(.5+.5*a),a);});

  /* 10 — السيادة غير التامة */
  rev(note.map(l=>[l]),u[9],0,.45);
  op(nBox,sm(u[9],.45,.55));
  opAll(nG,sm(u[9],.52,.64));draw(nA,sm(u[9],.62,.76));op(nAt,sm(u[9],.68,.78));
  a=sm(u[9],.76,.88);place(nR,XD+92,nY+44-4*Math.abs(Math.sin(T*2))*a,.85*(.5+.5*a),a);op(nRt,a);
  op(nGl,.8*Math.sin(PI*sm(u[9],.76,1)));
}
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render();requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');
DUR.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','المرحلة '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);});
function setUI(){document.title=TITLE;[...dotsEl.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+DUR.length)%DUR.length;const tgt=i+1;
  if(tgt<=P+1e-3)P=i;
  let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  if(tgt-P>1.01)d*=.6;
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1.2,d);
  setUI();}
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(stage-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(stage+1);if(e.key==='ArrowRight')go(stage-1);});
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
function apply(){view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);}
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const camC=()=>({x:VB[0]+VB[2]/2,y:VB[3]/2});
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,camC());
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,camC());
document.getElementById('zreset').onclick=reset;
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
go(0);step();render();requestAnimationFrame(frame);
})();
</script>
