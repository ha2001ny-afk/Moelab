<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>الكيمياء الحرارية — نموذج ثلاثي الأبعاد</title>
<style>
:root{color-scheme:dark;background:#081429;color:#eaf0fa;font-family:system-ui,Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
.stage{position:relative;width:100%;height:100%;background:#081429}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.tools{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px}
.tools button{width:42px;height:42px;padding:0;display:grid;place-items:center;border:1px solid #eaf0fa24;border-radius:12px;background:#081429d9;color:#eaf0fa;cursor:pointer;font:800 13px ui-monospace,Consolas,monospace;letter-spacing:.5px}
.tools button:hover{border-color:#7fd3ff;color:#7fd3ff}
.tools button[aria-pressed="true"]{border-color:#7fd3ff88;color:#7fd3ff;background:#10264ad9}
button:focus-visible{outline:2px solid #7fd3ff;outline-offset:3px}
svg{width:20px;height:20px}
.dock{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 16px)}
.seg{display:flex;gap:4px;padding:4px;border:1px solid #eaf0fa24;border-radius:14px;background:#081429e6;flex-wrap:wrap;justify-content:center}
.seg button{min-height:38px;padding:6px 14px;border:1px solid transparent;border-radius:10px;background:transparent;color:#c9d6e8;font:600 13px system-ui,Tahoma,sans-serif;cursor:pointer;white-space:nowrap}
.seg button:hover{color:#7fd3ff}
.seg button[aria-selected="true"]{background:#10264a;border-color:#7fd3ff88;color:#7fd3ff}
.seg .short{display:none}
.seg button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.toast{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 112px);transform:translateX(-50%);width:max-content;max-width:min(92vw,560px);padding:10px 16px;border:1px solid #39516d;border-radius:12px;background:#10264af0;font-size:13px;line-height:1.6;text-align:center;pointer-events:none}
[hidden]{display:none!important}
@media (max-width:440px){.tools{gap:5px}.tools button{width:38px;height:38px}.seg{flex-wrap:nowrap}.seg button{padding:6px 8px;font-size:12px;min-height:36px}.seg .long{display:none}.seg .short{display:inline}}
</style>
</head>
<body>
<div class="stage">
  <canvas id="scene" aria-label="الكيمياء الحرارية: تجارب ثلاثية الأبعاد لتفاعلات وتغيرات باعثة وماصة للحرارة، ومخططات الطاقة"></canvas>
  <div class="tools">
    <button id="labels" aria-pressed="true" aria-label="إظهار أسماء الأجزاء" title="أسماء الأجزاء">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>
    </button>
    <button id="dim" aria-pressed="false" aria-label="العرض الحالي ثلاثي الأبعاد — اضغط للتحويل إلى 2D" title="التبديل بين 3D و 2D">3D</button>
    <button id="spin" aria-pressed="false" aria-label="دوران تلقائي 360°" title="دوران تلقائي 360°">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M17 6.5l2.5 1.6-1.4 2.6"/><path d="M12 3v18"/></svg>
    </button>
    <button id="play" aria-pressed="false" aria-label="تشغيل التجربة" title="تشغيل التجربة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="playPath" d="M7 4.5l12 7.5-12 7.5z"/></svg>
    </button>
    <button id="reset" aria-label="إعادة التجربة" title="إعادة التجربة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg>
    </button>
    <button id="fullscreen" aria-label="ملء الشاشة" title="ملء الشاشة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsPath" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
  <div class="dock">
    <div class="seg" id="procs" role="tablist" aria-label="اختيار التجربة">
      <button data-p="h2" aria-selected="true"><span class="dot" style="background:#ff8a5c"></span><span class="long">احتراق الهيدروجين</span><span class="short">احتراق H₂</span></button>
      <button data-p="cond" aria-selected="false"><span class="dot" style="background:#ff8a5c"></span><span class="long">تكثف البخار</span><span class="short">تكثف</span></button>
      <button data-p="hgo" aria-selected="false"><span class="dot" style="background:#5cc8ff"></span><span class="long">تفكك HgO</span><span class="short">تفكك HgO</span></button>
      <button data-p="melt" aria-selected="false"><span class="dot" style="background:#5cc8ff"></span><span class="long">انصهار الجليد</span><span class="short">انصهار</span></button>
    </div>
    <div class="seg" id="kinds" role="tablist" aria-label="نوع التغير" hidden>
      <button data-k="chem" aria-selected="true">تفاعل كيميائي</button>
      <button data-k="phys" aria-selected="false">تغير فيزيائي</button>
    </div>
    <div class="seg" id="views" role="tablist" aria-label="اختيار العرض">
      <button data-v="scene" aria-selected="true">التجربة</button>
      <button data-v="dexo" aria-selected="false">مخطط التفاعل الباعث</button>
      <button data-v="dendo" aria-selected="false">مخطط التفاعل الماص</button>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>

<script>
(() => {
'use strict';

const cv=document.getElementById('scene');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2, DEG=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
const rnd=(a,b)=>a+Math.random()*(b-a);
function seeded(n){let x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)}

/* ---------- متجهات ---------- */
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z);
const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const norm=a=>mul(a,1/(Math.hypot(a.x,a.y,a.z)||1));
const len3=a=>Math.hypot(a.x,a.y,a.z);
const vlerp=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
function rot(v,k,a){const c=Math.cos(a),s=Math.sin(a);return add(add(mul(v,c),mul(cross(k,v),s)),mul(k,dot(k,v)*(1-c)))}
const randUnit=()=>norm(V(rnd(-1,1),rnd(-1,1),rnd(-1,1)));

/* ---------- الكيمياء (قيم قياسية عند 25°C و 1 atm) ----------
   (1) 2H2(g) + O2(g) → 2H2O(l) + Energy      ΔH = 2×(−285.83) = −571.66 kJ   باعث / كيميائي
   (2) H2O(g) → H2O(l) + Energy               ΔH = −285.83 − (−241.82) = −44.01 kJ   باعث / فيزيائي (تكثف)
   (3) 2HgO(s) + Energy → 2Hg(l) + O2(g)       ΔH = −2×(−90.83) = +181.66 kJ   ماص / كيميائي
   (4) H2O(s) + Energy → H2O(l)  عند 0°C      ΔH = +6.01 kJ  (حرارة الانصهار 334 J/g)   ماص / فيزيائي
   تصحيح: مخطط الكتاب للتفاعل الماص كُتب فيه "2H2(l) + O2(g)" والصحيح 2Hg(l) + O2(g).            */
const PROC={
  h2:{kind:'exo',type:'chem',eq:'2H{2}{(g)} + O{2}{(g)}  →  2H{2}O{(l)} + [Energy]',dh:'−571.7 kJ',
      top:'2H{2}{(g)} + O{2}{(g)}',bot:'2H{2}O{(l)}'},
  cond:{kind:'exo',type:'phys',eq:'H{2}O{(g)}  →  H{2}O{(l)} + [Energy]',dh:'−44.0 kJ',
      top:'H{2}O{(g)}',bot:'H{2}O{(l)}'},
  hgo:{kind:'endo',type:'chem',eq:'2HgO{(s)} + [Energy]  →  2Hg{(l)} + O{2}{(g)}',dh:'+181.7 kJ',
      top:'2Hg{(l)} + O{2}{(g)}',bot:'2HgO{(s)}'},
  melt:{kind:'endo',type:'phys',eq:'H{2}O{(s)} + [Energy]  →  H{2}O{(l)}',dh:'+6.01 kJ',
      top:'H{2}O{(l)}',bot:'H{2}O{(s)}'}
};
const KCOL={exo:'#ff8a5c',endo:'#5cc8ff'};

/* ---------- الحالة العامة ---------- */
const LAYOUTS={
  land:{W:1000,H:650,cx:540,cy:318,k:1.7,banner:{x:16,y:14,w:420},inset:{x:868,y:290,r:88},dia:{x:110,y:96,w:780,h:420},bottom:540},
  port:{W:620,H:1240,cx:310,cy:600,k:1.75,banner:{x:14,y:74,w:592},inset:{x:310,y:955,r:82},dia:{x:70,y:290,w:480,h:640},bottom:1040}
};
let L=LAYOUTS.land, layoutName='';
let W=0,H=0,s=1,ox=0,oy=0;
const VIEW0={yaw:-0.42,pitch:0.32,zoom:1,px:0,py:0,ortho:0};
let view={...VIEW0}, mode2D=false, saved3D=null;
let showLabels=true, spin=false, lastT=0, pending=false;
let viewMode='scene', procKey='h2', diaType='chem', diaT=0;
let drag=null, hover=null;
const pointers=new Map();let pinch=null;
const touched={};

/* ---------- الكاميرا والإسقاط ---------- */
const DIST=820;
let cam=null, TARGET=V(0,80,0);
function setupCam(){
  const cp=Math.cos(view.pitch), sp=Math.sin(view.pitch);
  const C=V(TARGET.x+DIST*Math.sin(view.yaw)*cp, TARGET.y+DIST*sp, TARGET.z+DIST*Math.cos(view.yaw)*cp);
  const f=norm(sub(TARGET,C)), r=norm(cross(f,V(0,1,0))), u=cross(r,f);
  const o2=view.ortho;
  cam={C,f,r,u,F:L.k*(sc().zk||1)*view.zoom*DIST*(1+(layoutName==='port'?0:.08)*o2),cx:L.cx+view.px,cy:L.cy+view.py+(layoutName==='port'?10:24)*o2};
}
function P(p){
  const v=sub(p,cam.C), dz=dot(v,cam.f), sc=cam.F/dz+(cam.F/DIST-cam.F/dz)*view.ortho;
  return{x:cam.cx+dot(v,cam.r)*sc, y:cam.cy-dot(v,cam.u)*sc, s:sc, z:dz};
}
const depth=p=>dot(sub(p,cam.C),cam.f);
function toCam(pt){return view.ortho>.5?mul(cam.f,-1):sub(cam.C,pt)}
function col(c,a=1){return`rgba(${Math.round(clamp(c[0],0,255))},${Math.round(clamp(c[1],0,255))},${Math.round(clamp(c[2],0,255))},${a})`}
const LIGHT=norm(V(-0.45,0.85,0.6)), FILL=norm(V(0.7,0.2,0.5));
function lit(c,n,pt,o={}){
  const amb=o.amb??0.34, spec=o.spec??0.28, shin=o.shin??28;
  const dif=Math.max(0,dot(n,LIGHT));
  const v=norm(toCam(pt)), h=norm(add(LIGHT,v));
  const sp=spec*Math.pow(Math.max(0,dot(n,h)),shin);
  const k=amb+0.7*dif+0.2*Math.max(0,dot(n,FILL))+0.22*Math.max(0,dot(n,v));
  return c.map(x=>x*k+255*sp);
}
function pathPts(ps,close=true){ctx.beginPath();ps.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));if(close)ctx.closePath()}
function centroid(ps){let x=0,y=0,z=0;ps.forEach(p=>{x+=p.x;y+=p.y;z+=p.z});return V(x/ps.length,y/ps.length,z/ps.length)}
function face(pts,n,c,o={}){
  const ctr=centroid(pts);
  if(dot(n,toCam(ctr))<=0)return false;
  pathPts(pts.map(P));
  const cc=col(lit(c,n,ctr,o),o.alpha??1);
  ctx.fillStyle=cc;ctx.fill();
  ctx.strokeStyle=o.line||cc;ctx.lineWidth=o.lw||.6;ctx.stroke();
  return true;
}
function box(x0,x1,y0,y1,z0,z1,c,o){
  const p=V;
  face([p(x1,y0,z0),p(x1,y1,z0),p(x1,y1,z1),p(x1,y0,z1)],V(1,0,0),c,o);
  face([p(x0,y0,z0),p(x0,y0,z1),p(x0,y1,z1),p(x0,y1,z0)],V(-1,0,0),c,o);
  face([p(x0,y1,z0),p(x0,y1,z1),p(x1,y1,z1),p(x1,y1,z0)],V(0,1,0),c,o);
  face([p(x0,y0,z0),p(x1,y0,z0),p(x1,y0,z1),p(x0,y0,z1)],V(0,-1,0),c,o);
  face([p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)],V(0,0,1),c,o);
  face([p(x0,y0,z0),p(x0,y1,z0),p(x1,y1,z0),p(x1,y0,z0)],V(0,0,-1),c,o);
}
function cyl(B,A,e1,e2,r,len,c,o={}){
  const n=o.sides||24, E=add(B,mul(A,len)), ring=[];
  for(let i=0;i<n;i++){const a=i/n*TAU+(o.rot||0);ring.push(add(mul(e1,Math.cos(a)),mul(e2,Math.sin(a))))}
  for(let i=0;i<n;i++){
    const a=ring[i], b=ring[(i+1)%n];
    const cc=o.knurl&&i%2?c.map(v=>v*.72):c;
    face([add(B,mul(a,r)),add(B,mul(b,r)),add(E,mul(b,r)),add(E,mul(a,r))],norm(add(a,b)),cc,o);
  }
  if(o.cap1!==false)face(ring.map(d=>add(E,mul(d,r))),A,o.capCol||c,o);
  if(o.cap0!==false)face(ring.map(d=>add(B,mul(d,r))),mul(A,-1),o.capCol||c,o);
}
const cylY=(x,z,r,y0,y1,c,o)=>cyl(V(x,y0,z),V(0,1,0),V(1,0,0),V(0,0,1),r,y1-y0,c,o);
const cylZ=(x,y,r,z0,z1,c,o)=>cyl(V(x,y,z0),V(0,0,1),V(1,0,0),V(0,1,0),r,z1-z0,c,o);
function planeText(str,O,ex,ey,size,color,font='600 32px system-ui,Tahoma,sans-serif',dir='rtl'){
  const o=P(O), a=P(add(O,ex)), b=P(add(O,ey)), k=size/32;
  ctx.save();
  ctx.transform((a.x-o.x)*k,(a.y-o.y)*k,(b.x-o.x)*k,(b.y-o.y)*k,o.x,o.y);
  ctx.font=font;ctx.direction=dir;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=color;ctx.fillText(str,0,0);
  ctx.restore();
}
const frontFacing=(n,pt)=>dot(n,toCam(pt))>0;

/* ---------- أجسام دورانية (زجاج وسوائل) ---------- */
const RING_K=40, UPRIGHT={A:V(0,1,0),e1:V(1,0,0),e2:V(0,0,1)};
function revolve(B,prof,fr=UPRIGHT){
  const {A,e1,e2}=fr;
  const a0=P(add(B,mul(A,prof[0][1]))), a1=P(add(B,mul(A,prof[prof.length-1][1])));
  let dx=a1.x-a0.x, dy=a1.y-a0.y, m=Math.hypot(dx,dy);
  if(m<1e-3){dx=0;dy=-1;m=1}dx/=m;dy/=m;
  const nx=-dy, ny=dx, rings=[], Lc=[], Rc=[];
  let mn=1e9,mx=-1e9;
  for(const [r,y] of prof){
    const c=add(B,mul(A,y)), pts=[];
    if(r<.01)pts.push(P(c));
    else for(let k=0;k<RING_K;k++){const t=k/RING_K*TAU;pts.push(P(add(c,add(mul(e1,r*Math.cos(t)),mul(e2,r*Math.sin(t))))))}
    let lo=pts[0],hi=pts[0],dl=1e9,dh=-1e9;
    for(const p of pts){const d=p.x*nx+p.y*ny;if(d<dl){dl=d;lo=p}if(d>dh){dh=d;hi=p}}
    rings.push(pts);Lc.push(lo);Rc.push(hi);mn=Math.min(mn,dl);mx=Math.max(mx,dh);
  }
  const c={x:(a0.x+a1.x)/2,y:(a0.y+a1.y)/2}, cd=c.x*nx+c.y*ny;
  return{rings,L:Lc,R:Rc,S:{x:c.x+nx*(mn-cd),y:c.y+ny*(mn-cd)},E:{x:c.x+nx*(mx-cd),y:c.y+ny*(mx-cd)},prof,B,A};
}
function shapePath(sh){
  ctx.beginPath();
  const addP=pts=>{
    if(pts.length<3)return;
    let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p.x*q.y-q.x*p.y}
    const q=a<0?pts.slice().reverse():pts;
    ctx.moveTo(q[0].x,q[0].y);for(let i=1;i<q.length;i++)ctx.lineTo(q[i].x,q[i].y);ctx.closePath();
  };
  sh.rings.forEach(addP);
  for(let i=0;i<sh.L.length-1;i++)addP([sh.L[i],sh.L[i+1],sh.R[i+1],sh.R[i]]);
}
function gradAcross(sh,stops){const g=ctx.createLinearGradient(sh.S.x,sh.S.y,sh.E.x,sh.E.y);stops.forEach(([p,c])=>g.addColorStop(p,c));return g}
function chain(pts){pathPts(pts,false)}
function topRing(sh){for(let i=sh.rings.length-1;i>=0;i--)if(sh.rings[i].length>2)return sh.rings[i];return sh.rings[0]}
function topVisible(sh){const top=add(sh.B,mul(sh.A,sh.prof[sh.prof.length-1][1]));return dot(sh.A,toCam(top))>0}
const GLASS_STOPS=[[0,'rgba(215,236,255,.42)'],[.07,'rgba(200,228,250,.15)'],[.19,'rgba(190,220,245,.05)'],[.26,'rgba(255,255,255,.40)'],[.3,'rgba(255,255,255,.07)'],[.62,'rgba(190,220,245,.035)'],[.8,'rgba(200,228,250,.08)'],[.93,'rgba(215,236,255,.22)'],[1,'rgba(228,244,255,.48)']];
const WATER_STOPS=[[0,'rgba(64,146,214,.62)'],[.22,'rgba(150,212,246,.42)'],[.5,'rgba(108,184,236,.34)'],[.85,'rgba(80,160,222,.48)'],[1,'rgba(52,128,200,.64)']];
function drawGlass(sh,ring=true){
  shapePath(sh);ctx.fillStyle=gradAcross(sh,GLASS_STOPS);ctx.fill();
  ctx.lineJoin='round';ctx.lineCap='round';
  chain(sh.L);ctx.strokeStyle='rgba(236,248,255,.7)';ctx.lineWidth=1.3;ctx.stroke();
  chain(sh.R);ctx.stroke();
  if(ring){pathPts(topRing(sh));ctx.strokeStyle='rgba(240,250,255,.8)';ctx.lineWidth=1.1;ctx.stroke()}
}
function drawOpaque(sh,c){
  shapePath(sh);
  ctx.fillStyle=gradAcross(sh,[[0,col(c.map(v=>v*.55))],[.3,col(c.map(v=>v*1.1))],[.65,col(c.map(v=>v*.9))],[1,col(c.map(v=>v*.6))]]);
  ctx.fill();
  if(topVisible(sh)){pathPts(topRing(sh));ctx.fillStyle=col(c.map(v=>v*1.02));ctx.fill()}
}
function makeVessel(rIn,y0,y1,ys){
  const tab=[0];let v=0;
  for(let y=y0;y<y1;y+=.25){const r=rIn(y+.125);v+=Math.PI*r*r*.25/1000;tab.push(v)}
  return{rIn,y0,y1,ys:ys.filter(y=>y>y0+.5&&y<y1),
    level(vol){if(vol<=0)return y0;if(vol>=tab[tab.length-1])return y1;

  const dpr=window.devicePixelRatio||1;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);
  bg();
  if(viewMode!=='scene'){diaT+=dt;drawDiagram(viewMode==='dexo'?'exo':'endo',t);paint();return}
  const S=sc();S.update(dt);
  if(spin&&!mode2D)view.yaw=wrapA(view.yaw+dt*1000*.00045);
  {const tg=mode2D?1:0;if(Math.abs(view.ortho-tg)>.001||(mode2D&&(Math.abs(view.yaw)>.001||Math.abs(view.pitch)>.001))){
    const k=Math.min(1,dt*7);view.ortho+=(tg-view.ortho)*k;
    if(mode2D){view.yaw+=(0-view.yaw)*k;view.pitch+=(0-view.pitch)*k}
    else if(saved3D){view.yaw+=wrapA(saved3D.yaw-view.yaw)*k;view.pitch+=(saved3D.pitch-view.pitch)*k}
    if(Math.abs(view.ortho-tg)<.002){view.ortho=tg;if(mode2D){view.yaw=0;view.pitch=0}else if(saved3D){view.yaw=saved3D.yaw;view.pitch=saved3D.pitch;saved3D=null}}}}
  TARGET=S.target;
  setupCam();
  bench();
  S.draw(t);
  drawLabels();
  drawInset(t);
  drawBanner(t);
  if(!touched[procKey]&&!S.running()){const q=P(procKey==='h2'?V(118,40,10):procKey==='cond'?V(0,12,48):procKey==='hgo'?V(30,30,0):V(0,40,0));pulse(q.x,q.y,22*q.s+10)}
  syncPlay();
  paint();
}
function paint(){if(!pending){pending=true;requestAnimationFrame(draw)}}
function resize(){
  W=cv.clientWidth;H=cv.clientHeight;
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const name=W/H>=0.9?'land':'port';
  if(name!==layoutName){layoutName=name;L=LAYOUTS[name]}
  s=Math.min(W/L.W,H/L.H);ox=(W-L.W*s)/2;oy=(H-L.H*s)/2;
  paint();
}

/* ---------- التفاعل ---------- */
function point(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}}
function begin(e){
  if(viewMode!=='scene'||!cam)return;
  const p=point(e);
  pointers.set(e.pointerId,p);
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch={d:d2(a,b),mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};drag=null;cv.setPointerCapture(e.pointerId);e.preventDefault();return}
  if(drag)return;
  drag={type:sc().hit(p)?'device':'orbit',id:e.pointerId,last:p,start:p,moved:0};
  cv.setPointerCapture(e.pointerId);e.preventDefault();
}
function move(e){
  if(viewMode!=='scene'||!cam)return;
  const p=point(e);
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,p);
  if(pinch&&pointers.size>=2){const [a,b]=[...pointers.values()], d=d2(a,b), mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};zoomAt(mid,d/pinch.d);view.px+=mid.x-pinch.mid.x;view.py+=mid.y-pinch.mid.y;pinch={d,mid};return}
  if(!drag){cv.style.cursor=sc().hit(p)?'pointer':'move';return}
  if(e.pointerId!==drag.id)return;
  drag.moved=Math.max(drag.moved,d2(p,drag.start));
  if(drag.moved>6){
    if(mode2D){view.px+=p.x-drag.last.x;view.py+=p.y-drag.last.y}
    else{view.yaw=wrapA(view.yaw-(p.x-drag.last.x)*.008);view.pitch=clamp(view.pitch+(p.y-drag.last.y)*.006,.05,1.4);spin=false;syncSpin()}
  }
  drag.last=p;
}
function end(e){
  pointers.delete(e.pointerId);
  if(pinch){if(pointers.size<2)pinch=null;return}
  if(!drag||drag.id!==e.pointerId)return;
  if(drag.type==='device'&&drag.moved<=6&&e.type==='pointerup')runScene();
  drag=null;
}
function zoomAt(p,f){
  const z=clamp(view.zoom*f,.6,3.2);f=z/view.zoom;view.zoom=z;
  const cx=L.cx+view.px, cy=L.cy+view.py;
  view.px=p.x-(p.x-cx)*f-L.cx;view.py=p.y-(p.y-cy)*f-L.cy;
}
cv.addEventListener('pointerdown',begin);
cv.addEventListener('pointermove',move);
cv.addEventListener('pointerup',end);
cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{if(viewMode!=='scene')return;e.preventDefault();zoomAt(point(e),Math.exp(-e.deltaY*.0015))},{passive:false});
cv.addEventListener('dblclick',e=>{if(viewMode==='scene'&&!sc().hit(point(e)))view=mode2D?{...VIEW0,yaw:0,pitch:0,ortho:1}:{...VIEW0}});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function runScene(){touched[procKey]=true;sc().run()}
const spinBtn=document.getElementById('spin'), dimBtn=document.getElementById('dim'), playBtn=document.getElementById('play'), playPath=document.getElementById('playPath');
function syncSpin(){spinBtn.setAttribute('aria-pressed',String(spin))}
spinBtn.addEventListener('click',()=>{if(mode2D){notify('الدوران التلقائي متاح في العرض ثلاثي الأبعاد 3D',2400);return}spin=!spin;syncSpin()});
function syncDim(){
  dimBtn.textContent=mode2D?'2D':'3D';dimBtn.setAttribute('aria-pressed',String(mode2D));
  dimBtn.setAttribute('aria-label',mode2D?'العرض الحالي ثنائي الأبعاد — اضغط للتحويل إلى 3D':'العرض الحالي ثلاثي الأبعاد — اضغط للتحويل إلى 2D');
  spinBtn.disabled=mode2D;spinBtn.style.opacity=mode2D?.4:1;
}
dimBtn.addEventListener('click',()=>{
  mode2D=!mode2D;
  if(mode2D){saved3D={yaw:view.yaw,pitch:view.pitch};spin=false;syncSpin();notify('عرض ثنائي الأبعاد 2D: منظر أمامي مسطح مثل رسوم الكتاب',2200)}
  else{if(!saved3D)saved3D={yaw:VIEW0.yaw,pitch:VIEW0.pitch};notify('عرض ثلاثي الأبعاد 3D: اسحب الخلفية لتدوير المنظر',2200)}
  syncDim();
});
let lastPlay='';
function syncPlay(){
  const on=sc().running(), key=on+procKey;if(key===lastPlay)return;lastPlay=key;
  playBtn.setAttribute('aria-pressed',String(on));
  const lbl={h2:on?'التفاعل جارٍ':'إطلاق الشرارة',cond:on?'إطفاء مصدر الحرارة':'تشغيل مصدر الحرارة',hgo:on?'إطفاء الموقد':'إشعال الموقد',melt:on?'إيقاف الزمن':'تشغيل الزمن'}[procKey];
  playBtn.setAttribute('aria-label',lbl);playBtn.title=lbl;
  playPath.setAttribute('d',on&&procKey!=='h2'?'M8 5v14M16 5v14':'M7 4.5l12 7.5-12 7.5z');
}
playBtn.addEventListener('click',runScene);
document.getElementById('reset').addEventListener('click',()=>{sc().init();view=mode2D?{...VIEW0,yaw:0,pitch:0,ortho:1}:{...VIEW0};spin=false;syncSpin();diaT=0;lastPlay=''});
const lbl=document.getElementById('labels');
lbl.addEventListener('click',()=>{showLabels=!showLabels;lbl.setAttribute('aria-pressed',String(showLabels))});

const procsEl=document.getElementById('procs'), kindsEl=document.getElementById('kinds'), viewsEl=document.getElementById('views');
const HINT={h2:'اضغط ▶ أو اضغط على مولد الشرارة لإشعال خليط الهيدروجين والأوكسجين',cond:'اضغط ▶ أو اضغط على مصدر الحرارة ليغلي الماء ويتكثف البخار',hgo:'اضغط ▶ أو اضغط على الموقد لتسخين أوكسيد الزئبق',melt:'اضغط ▶ لتشغيل الزمن ومراقبة انصهار الجليد'};
function setProc(k){
  procKey=k;lastPlay='';
  [...procsEl.children].forEach(b=>b.setAttribute('aria-selected',String(b.dataset.p===k)));
  if(!sc().inited){sc().init();sc().inited=true}
  view={...view};notify(HINT[k],3800);
}
function setView(v){
  viewMode=v;diaT=0;
  [...viewsEl.children].forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===v)));
  procsEl.hidden=v!=='scene';kindsEl.hidden=v==='scene';
  ['dim','spin','play','labels'].forEach(id=>document.getElementById(id).hidden=v!=='scene');
}
procsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setProc(b.dataset.p)});
viewsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});
kindsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;diaType=b.dataset.k;diaT=0;[...kindsEl.children].forEach(c=>c.setAttribute('aria-selected',String(c===b)))});

const fs=document.getElementById('fullscreen'), fsPath=document.getElementById('fsPath'), toast=document.getElementById('toast');
let toastTimer;
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function notify(m,ms=3200){toast.textContent=m;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,ms)}
fs.addEventListener('click',async()=>{
  try{
    if(isFS()){const x=document.exitFullscreen||document.webkitExitFullscreen;if(x)await x.call(document)}
    else{const r=document.documentElement,en=r.requestFullscreen||r.webkitRequestFullscreen;
      if(!en){notify('المتصفح لا يدعم ملء الشاشة لهذه الصفحة');return}await en.call(r)}
  }catch{notify('تعذّر ملء الشاشة؛ عند التضمين يجب السماح به للإطار')}
});
function syncFS(){
  const l=isFS()?'الخروج من ملء الشاشة':'ملء الشاشة';fs.setAttribute('aria-label',l);fs.title=l;
  fsPath.setAttribute('d',isFS()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');resize();
}
document.addEventListener('fullscreenchange',syncFS);
document.addEventListener('webkitfullscreenchange',syncFS);
window.__sim={
  proc:setProc, view:setView, run:runScene, kind:k=>{const b=[...kindsEl.children].find(c=>c.dataset.k===k);b&&b.click()},
  state:()=>{const S=sc();return{proc:procKey,running:S.running(),phase:S.phase,water:S.water,xi:S.xi,T:S.T,mi:S.mi,drops:S.drops&&S.drops.length}},
  cam:(y,p)=>{view.yaw=y;view.pitch=p},
  devicePt:()=>{const q=P(procKey==='h2'?V(118,30,0):procKey==='cond'?V(0,12,48):procKey==='hgo'?V(30,30,0):V(0,40,0));return{x:q.x*s+ox,y:q.y*s+oy}},
  time:()=>{const t=performance.now();for(let i=0;i<10;i++){pending=false;draw()}return (performance.now()-t)/10}
};
S1.init();S1.inited=true;
new ResizeObserver(resize).observe(cv);
resize();
notify('اختر التجربة من الأسفل • اضغط ▶ لبدئها • بدّل إلى مخططات الطاقة من الأزرار السفلية',6000);
})();
</script>
