<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>تكوين النطف في الثدييات</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(16px,3.8vw,24px);font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:18px;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav{width:62px;height:62px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:26px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .nav:active{background:#d9ebf7}
  .nav:focus-visible,.dot:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  #dots{display:flex;gap:14px;align-items:center}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .pill{fill:#fff;stroke:#e0552a;stroke-width:2.5}
  .lbl{fill:#a8431b;font-size:19px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .ln{stroke:#e0552a;stroke-width:2.4;fill:none}
  .bt{fill:#fff;font-weight:bold;font-size:23px;text-anchor:middle;dominant-baseline:central}
  .side{fill:#1f3a52;font-size:19px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .brk{stroke:#1f3a52;stroke-width:2.6;fill:none;stroke-linejoin:round}
  .cap{fill:#1f3a52;font-size:21px;font-weight:bold;text-anchor:middle}
  #bn{transition:fill .5s}
</style>
</head>
<body>
<div id="top"><div id="title">تكوين النطف في الثدييات</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 900 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gCell" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#f1f5ff"/><stop offset="1" stop-color="#b3c3ef"/></radialGradient>
        <radialGradient id="gNuc" cx="38%" cy="34%" r="75%"><stop offset="0" stop-color="#f6a6de"/><stop offset="1" stop-color="#a2318b"/></radialGradient>
        <radialGradient id="gHead" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#8a5aa8"/><stop offset="1" stop-color="#3f1a57"/></radialGradient>
        <marker id="rd" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#e0432a"/></marker>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#e0552a"/></marker>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="المرحلة السابقة">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="المرحلة التالية">◀</button>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);

/* rows: spermatogonium, primary, secondaries, spermatids, (dashed line), sperms */
const X0=450,Y=[122,228,332,432,545],R=[28,38,30,22],SXs=[360,540],TXs=[315,405,495,585],DASHY=488;
const STG=[
  ['سليفة النطفة (2n)','#2e8b57'],
  ['نمو سليفة النطفة وتحولها إلى خلية نطفية أولية (2n)','#e0902a'],
  ['الانقسام الاختزالي الأول: خليتان نطفيتان ثانويتان (n)','#2f6fd6'],
  ['الانقسام الاختزالي الثاني: أربع أرومات نطف (n)','#7b4bb3'],
  ['عملية التحول النطفي: تحول أرومات النطف إلى نطف (n)','#c0397a']];

/* ---------------- side annotations (brackets + dashed line) ---------------- */
const sideG=G(view,{'pointer-events':'none'});
function bracket(y1,y2,txt){const g=G(sideG),m=(y1+y2)/2;
  el('path',{class:'brk',d:`M622,${y1+6}H650V${y2-6}H622M650,${m}H672`},g);
  el('text',{class:'side',x:778,y:m},g).textContent=txt;return g;}
const br1=bracket(Y[1]+14,Y[2]+14,'الانقسام الاختزالي 1');
const br2=bracket(Y[2]+18,Y[3]+18,'الانقسام الاختزالي 2');
const dashG=G(sideG);
el('line',{x1:240,y1:DASHY,x2:672,y2:DASHY,stroke:'#1f3a52','stroke-width':2.4,'stroke-dasharray':'14 9'},dashG);
el('text',{class:'side',x:778,y:DASHY},dashG).textContent='عملية التحول النطفي';

/* ---------------- cells ---------------- */
const CY='#ffe35a',CA='#72eef7';
const CH=[{len:13,col:CY},{len:13,col:CA},{len:8,col:CY},{len:8,col:CA}]; /* two homologous pairs */
const st=(x,y,rot,sp)=>({x,y,rot,sp});
const ls=(a,b,u)=>st(lerp(a.x,b.x,u),lerp(a.y,b.y,u),lerp(a.rot,b.rot,u),lerp(a.sp,b.sp,u));
const L0=[st(-7,-5,25,0),st(6,-7,-35,0),st(-6,7,75,0),st(7,6,15,0)];
const L1=L0.map(s=>st(s.x*1.35,s.y*1.35,s.rot,22));
const M1=[[0,3],[1,2]];
const EQ1=[st(-7,-9,90,22),st(7,-9,90,22),st(7,9,90,22),st(-7,9,90,22)];
const F2=[[st(-5,-4,35,22),st(6,6,-30,22)],[st(-5,-5,-25,22),st(6,5,40,22)]];
const EQ2=[st(0,-7,90,22),st(0,7,90,22)];
const F3=[st(-4,-4,40,0),st(5,4,-30,0)];

function Gen(){const g=G(view);return{g,tail:G(g),rim:G(g),body:G(g),nuc:G(g),chr:G(g),top:G(g)};}
function Cell(gen,ids,two,sperm){
  const c={rim:el('ellipse',{fill:'#7d95dd'},gen.rim),body:el('ellipse',{fill:'url(#gCell)'},gen.body),
    nuc:el('ellipse',{fill:'url(#gNuc)',stroke:'#8a2a73','stroke-width':1.2},gen.nuc),ch:[],x:0,y:0,rx:1,ry:1};
  ids.forEach(id=>{const g=G(gen.chr),d=CH[id],o={g,len:d.len,two};
    o.o1=el('line',{stroke:'#3d0f36','stroke-width':6.4,'stroke-linecap':'round'},g);
    o.o2=el('line',{stroke:'#3d0f36','stroke-width':6.4,'stroke-linecap':'round'},g);
    o.l1=el('line',{stroke:d.col,'stroke-width':3.6,'stroke-linecap':'round'},g);
    o.l2=el('line',{stroke:d.col,'stroke-width':3.6,'stroke-linecap':'round'},g);
    if(!two){o.o2.setAttribute('display','none');o.l2.setAttribute('display','none');}
    c.ch.push(o);});
  if(sperm){
    c.tl=el('polyline',{fill:'none',stroke:'#4a63c4','stroke-width':2.6,'stroke-linecap':'round'},gen.tail);
    c.mp=el('line',{stroke:'#5c78d8','stroke-width':7.5,'stroke-linecap':'round'},gen.tail);
    c.ms=el('line',{stroke:'#344aa0','stroke-width':7.5,'stroke-dasharray':'1.6 2.6'},gen.tail);
    c.dk=el('ellipse',{fill:'url(#gHead)'},gen.nuc);
    c.ac=el('ellipse',{fill:'#e9f0ff',stroke:'#7d95dd','stroke-width':1.4,'fill-opacity':.92},gen.top);
    c.dr=el('circle',{fill:'#cdd9f7',stroke:'#7d95dd','stroke-width':1.4},gen.top);}
  return c;}
function setCell(c,x,y,rx,ry,nrx,nry,ny,rim){c.x=x;c.y=y;c.rx=rx;c.ry=ry;rim=rim||4;
  [['rim',rx+rim,ry+rim,0],['body',rx,ry,0],['nuc',nrx,nry,ny]].forEach(([k,a,b,dy])=>{const e=c[k];
    e.setAttribute('cx',f1(x));e.setAttribute('cy',f1(y+dy));e.setAttribute('rx',f1(a));e.setAttribute('ry',f1(b));});}
function seg(l,x,y,ang,len){const a=ang*PI/180,dx=Math.cos(a)*len/2,dy=Math.sin(a)*len/2;
  l.setAttribute('x1',f1(x-dx));l.setAttribute('y1',f1(y-dy));l.setAttribute('x2',f1(x+dx));l.setAttribute('y2',f1(y+dy));}
function drawCh(o,cx,cy,s,sign,op){const x=cx+s.x,y=cy+s.y;
  if(o.two){seg(o.o1,x,y,s.rot+s.sp,o.len);seg(o.l1,x,y,s.rot+s.sp,o.len);seg(o.o2,x,y,s.rot-s.sp,o.len);seg(o.l2,x,y,s.rot-s.sp,o.len);}
  else{seg(o.o1,x,y,s.rot+sign*s.sp,o.len);seg(o.l1,x,y,s.rot+sign*s.sp,o.len);}
  o.g.setAttribute('opacity',f2(op));}

const gen0=Gen(),g0c=Cell(gen0,[0,1,2,3],true);
const gen1=Gen(),p1c=Cell(gen1,[0,1,2,3],true);
const gen2=Gen(),sC=[0,1].map(j=>Cell(gen2,M1[j],true));
const gen3=Gen(),tC=[0,1,2,3].map(i=>Cell(gen3,M1[i>>1],false));
const gen4=Gen(),zC=[0,1,2,3].map(i=>Cell(gen4,M1[i>>1],false,true));

/* ---------------- arrows ---------------- */
const arrows=[];
function mkArr(ax,ay,ra,bx,by,rb,k){const dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d;
  const e=el('path',{d:`M${f1(ax+ux*(ra+6))},${f1(ay+uy*(ra+6))}L${f1(bx-ux*(rb+10))},${f1(by-uy*(rb+10))}`,fill:'none',stroke:'#e0432a','stroke-width':7,'stroke-linecap':'round','marker-end':'url(#rd)',opacity:0});
  arrows.push({e,k,v:0});}
mkArr(X0,Y[0],R[0],X0,Y[1],R[1],1);
SXs.forEach(x=>mkArr(X0,Y[1],R[1],x,Y[2],R[2],2));
TXs.forEach((x,i)=>mkArr(SXs[i>>1],Y[2],R[2],x,Y[3],R[3],3));
TXs.forEach(x=>mkArr(x,Y[3],R[3],x,Y[4],16,4));

/* ---------------- labels ---------------- */
const labG=G(view,{'pointer-events':'none'});
const edge=(c,ax,ay)=>{const dx=ax-c.x,dy=ay-c.y,d=Math.hypot(dx,dy)||1;return[c.x+dx/d*(c.rx+6),c.y+dy/d*(c.ry+6)];};
function label(txt,py,w,c,of){const h=36,cx=64+w/2,g=G(labG),ln=el('line',{class:'ln','marker-end':'url(#ah)'},g);
  el('rect',{class:'pill',x:cx-w/2,y:py-h/2,width:w,height:h,rx:18},g);el('text',{class:'lbl',x:cx,y:py},g).textContent=txt;
  return()=>{const o=of();g.setAttribute('opacity',f2(o));if(o<.01)return;const p=edge(c(),cx,py);
    ln.setAttribute('x1',cx);ln.setAttribute('y1',py);ln.setAttribute('x2',f1(p[0]));ln.setAttribute('y2',f1(p[1]));};}
let P=0;
const fadeIn=a=>clamp((P-a)/.3,0,1);
const labs=[
  label('سليفة النطفة (2n)',Y[0],196,()=>g0c,()=>1),
  label('خلية نطفية أولية (2n)',Y[1],216,()=>p1c,()=>fadeIn(.7)),
  label('خلية نطفية ثانوية (n)',Y[2],216,()=>sC[0],()=>fadeIn(1.7)),
  label('أرومة النطفة (n)',Y[3],176,()=>tC[0],()=>fadeIn(2.7)),
  label('نطفة (n)',Y[4],120,()=>zC[0],()=>fadeIn(3.7))];

/* banner + caption */
const bn=el('rect',{id:'bn',x:100,y:14,width:700,height:58,rx:20,fill:'#2e8b57'}),bt=el('text',{class:'bt',x:450,y:43});

/* ---------------- state / timeline ---------------- */
const S={entry:0,dur:1};
let stage=0,T=0,t0=0,last=performance.now(),paused=false;
function step(dt){
  P=lerp(S.entry,stage,ease(clamp((T-t0)/S.dur,0,1)));
  arrows.forEach(a=>{const tg=P>=a.k-.02?1:0;a.v+=(tg-a.v)*(1-Math.exp(-6*dt));});
}

/* ---------------- render ---------------- */
function render(t){
  const u1=clamp(P,0,1),u2=clamp(P-1,0,1),u3=clamp(P-2,0,1),u4=clamp(P-3,0,1);

  /* spermatogonium */
  const br=R[0]+.7*Math.sin(t*1.6);
  setCell(g0c,X0,Y[0],br,br,br*.7,br*.7,0);
  g0c.ch.forEach((o,i)=>drawCh(o,X0,Y[0],L0[i],1,1));

  /* growth into primary spermatocyte, DNA replicates */
  gen1.g.setAttribute('opacity',P>.001?f2(1-.5*ease(u2)):0);
  if(P>.001){const mv=ease(clamp(u1/.6,0,1)),gr=ease(clamp((u1-.2)/.8,0,1)),dup=ease(clamp((u1-.45)/.55,0,1));
    const y=lerp(Y[0],Y[1],mv),r=lerp(R[0],R[1],gr)+(u1>=1?.7*Math.sin(t*1.6+1):0);
    setCell(p1c,X0,y,r,r,r*.7,r*.7,0);
    p1c.ch.forEach((o,i)=>{const s=ls(L0[i],L1[i],gr);s.sp=22*dup;drawCh(o,X0,y,s,1,1);});}

  /* meiosis I: homologous pairs separate */
  gen2.g.setAttribute('opacity',P>1.001?f2(1-.5*ease(u3)):0);
  if(P>1.001){const mv=ease(clamp(u2/.45,0,1)),a=ease(clamp((u2-.08)/.32,0,1)),sp=ease(clamp((u2-.4)/.6,0,1));
    const y=lerp(Y[1],Y[2],mv),r=lerp(R[1],R[2],sp)+(u2>=1?.6*Math.sin(t*1.6+2):0);
    sC.forEach((c,j)=>{const x=lerp(X0,SXs[j],sp);setCell(c,x,y,r,r,r*.7,r*.7,0);
      c.ch.forEach((o,k)=>{const id=M1[j][k];drawCh(o,x,y,ls(ls(L1[id],EQ1[id],a),F2[j][k],sp),1,1);});});}

  /* meiosis II: chromatids separate */
  gen3.g.setAttribute('opacity',P>2.001?f2(1-.5*ease(u4)):0);
  if(P>2.001){const mv=ease(clamp(u3/.45,0,1)),a=ease(clamp((u3-.08)/.32,0,1)),sp=ease(clamp((u3-.4)/.6,0,1));
    const y=lerp(Y[2],Y[3],mv),r=lerp(R[2],R[3],sp)+(u3>=1?.5*Math.sin(t*1.6+3):0);
    tC.forEach((c,i)=>{const j=i>>1,x=lerp(SXs[j],TXs[i],sp);setCell(c,x,y,r,r,r*.7,r*.7,0);
      c.ch.forEach((o,q)=>drawCh(o,x,y,ls(ls(F2[j][q],EQ2[q],a),F3[q],sp),i&1?-1:1,1));});}

  /* spermiogenesis: each spermatid crosses the line and becomes a sperm */
  gen4.g.setAttribute('opacity',P>3.001?1:0);
  if(P>3.001){const mv=ease(clamp(u4/.5,0,1)),m=ease(clamp((u4-.15)/.85,0,1));
    const yb=lerp(Y[3],Y[4],mv);
    zC.forEach((c,i)=>{const sign=i&1?-1:1,x=TXs[i]+1.6*m*Math.sin(t*5+i*1.3),y=yb+1.2*m*Math.sin(t*4+i);
      const rx=lerp(R[3],10.5,m),ry=lerp(R[3],16,m),n=R[3]*.7;
      setCell(c,x,y,rx,ry,lerp(n,7.5,m),lerp(n,12,m),2*m,lerp(4,2.4,m));
      const co=1-clamp(m*2.5,0,1);
      c.ch.forEach((o,q)=>drawCh(o,x,y,F3[q],sign,co));
      c.dk.setAttribute('cx',f1(x));c.dk.setAttribute('cy',f1(y+2));c.dk.setAttribute('rx',f1(7*m+.01));c.dk.setAttribute('ry',f1(11.5*m+.01));c.dk.setAttribute('opacity',f2(m));
      c.ac.setAttribute('cx',f1(x));c.ac.setAttribute('cy',f1(y-ry+6));c.ac.setAttribute('rx',f1(Math.max(.1,rx-1.5)));c.ac.setAttribute('ry',6);c.ac.setAttribute('opacity',f2(clamp((m-.3)/.5,0,1)));
      const m0=y+ry-1,m1=m0+22*m;
      [c.mp,c.ms].forEach(l=>{l.setAttribute('x1',f1(x));l.setAttribute('y1',f1(m0));l.setAttribute('x2',f1(x));l.setAttribute('y2',f1(m1));l.setAttribute('opacity',f2(clamp(m*3,0,1)));});
      const tm=clamp((m-.15)/.85,0,1);let pts='';
      for(let s=0;s<=1.001;s+=1/16)pts+=f1(x+7*tm*s*Math.sin(9*s-t*9+i))+','+f1(m1+s*82*tm)+' ';
      c.tl.setAttribute('points',pts);c.tl.setAttribute('opacity',tm>0?1:0);
      const k=clamp((u4-.3)/.65,0,1),side=i%2?1:-1;
      c.dr.setAttribute('cx',f1(x+side*(9+24*k)));c.dr.setAttribute('cy',f1(y+8+10*k));c.dr.setAttribute('r',f1(Math.max(.1,8*(1-.5*k))));
      c.dr.setAttribute('opacity',f2(k>0&&k<1?(1-k)*clamp(k*6,0,1):0));});}

  br1.setAttribute('opacity',f2(fadeIn(1.6)));br2.setAttribute('opacity',f2(fadeIn(2.6)));dashG.setAttribute('opacity',f2(fadeIn(3.05)));
  arrows.forEach(a=>a.e.setAttribute('opacity',f2(a.v)));
  labs.forEach(f=>f());
}
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step(dt);render(T);requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');
STG.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','المرحلة '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);});
function setUI(){bn.style.fill=STG[stage][1];bt.removeAttribute('textLength');bt.textContent=STG[stage][0];
  try{if(bt.getComputedTextLength()>670){bt.setAttribute('textLength',670);bt.setAttribute('lengthAdjust','spacingAndGlyphs');}}catch(e){}
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+STG.length)%STG.length;
  S.entry=P;stage=i;t0=T;
  S.dur=(i===0&&P>1)?1.8:Math.max(1,3.8*Math.abs(i-P));
  setUI();}
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(stage-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(stage+1);if(e.key==='ArrowRight')go(stage-1);});
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:370});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:370});
document.getElementById('zreset').onclick=reset;
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
go(0);render(0);requestAnimationFrame(frame);
})();
</script>
