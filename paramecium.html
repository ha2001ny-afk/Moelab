<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>التكاثر في البرامسيوم</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav{width:54px;height:54px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:24px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);flex:none}
  .nav:active{background:#d9ebf7}
  .nav:focus-visible,.dot:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  #dots{display:flex;gap:8px;align-items:center}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s;flex:none}
  .sepr{width:3px;height:30px;border-radius:2px;background:#b5651d;margin:0 4px;flex:none}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .bt{fill:#fff;font-weight:bold;font-size:25px;text-anchor:middle;dominant-baseline:central}
  .lb{fill:#1f3a52;font-size:21px;font-weight:bold;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
  #bn{transition:fill .5s}
</style>
</head>
<body>
<div id="top"><div id="title">التكاثر في البرامسيوم</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 900 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gPar" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fbf1dd"/><stop offset=".6" stop-color="#efd9b2"/><stop offset="1" stop-color="#d4aa74"/></radialGradient>
        <radialGradient id="gMac" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ddd2f2"/><stop offset="1" stop-color="#8a70c4"/></radialGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="المرحلة السابقة">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="المرحلة التالية">◀</button>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,D2R=PI/180;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2),f3=v=>v.toFixed(3);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const att=(e,a)=>{for(const k in a)e.setAttribute(k,typeof a[k]==='number'?f1(a[k]):a[k]);};
const lp2=(p,q,u)=>[lerp(p[0],q[0],u),lerp(p[1],q[1],u)];
const qb=(p0,p1,p2,u)=>[0,1].map(k=>(1-u)*(1-u)*p0[k]+2*(1-u)*u*p1[k]+u*u*p2[k]);
let seed=5;const rnd=()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rr=(a,b)=>a+(b-a)*rnd();
const ptsD=pts=>pts.map((p,i)=>(i?'L':'M')+f1(p[0])+','+f1(p[1])).join('');
const show=(e,op)=>{if(op<.01){e.style.display='none';return false;}e.style.display='';e.setAttribute('opacity',f2(op));return true;};

const STG=[
  ['البرامسيوم','#2e8b57'],
  ['انقسام النواة الصغيرة انقساماً اعتيادياً','#e0902a'],
  ['انقسام النواة الكبيرة مباشرةً وتخصّر الجسم','#2f6fd6'],
  ['برامسيومان بنويان','#7b4bb3'],
  ['الاقتران: تقابل فردين من سلالتين مختلفتين','#c4423a'],
  ['انقسام النواة الصغيرة انقساماً اختزالياً (س)','#8b5a2b'],
  ['تحلل ثلاث أنوية وانقسام الرابعة','#b5651d'],
  ['تبادل الأنوية الذكرية والاندماج (2س)','#2a9d8f'],
  ['انفصال الفردين المقترنين','#1f7a8c'],
  ['أربعة برامسيومات بنوية من كل فرد','#5e8f1f']];
const DUR=[5,8,9,8,11,8,8,8,7,11];

/* ---------------- Paramecium geometry (local: long axis = x, anterior left, oral side +y) ---------------- */
const NB=160;
function outline(pin){const pts=[];for(let i=0;i<NB;i++){const a=i/NB*2*PI,c=Math.cos(a),s=Math.sin(a),x=150*c;
  let y=56*(1+.1*c)*s;if(s>0)y-=16*Math.exp(-Math.pow((c+.05)/.28,2))*s*s;
  if(pin)y*=1-pin*Math.exp(-x*x/1444);pts.push([x,y]);}return pts;}
const OUT0=outline(0),closeD=pts=>ptsD(pts)+'Z',ectoD=pts=>closeD(pts.map(q=>[q[0]*.94,q[1]*.84]));
const BODY0=closeD(OUT0),ECTO0=ectoD(OUT0);
function ciliaD(pts,t,ph){let d='';const n=pts.length;
  for(let i=0;i<n;i+=2){const a=pts[(i+n-1)%n],b=pts[(i+1)%n],p=pts[i];let tx=b[0]-a[0],ty=b[1]-a[1];const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;
    const th=.55*Math.sin(t*7-i*.2+ph),c=Math.cos(th),s=Math.sin(th),dx=ty*c+tx*s,dy=ty*s-tx*c;
    d+='M'+f1(p[0])+','+f1(p[1])+'L'+f1(p[0]+dx*11)+','+f1(p[1]+dy*11);}return d;}
const FV=[[-55,-28,6],[-40,12,5],[45,-30,5.5],[55,18,6.5],[112,4,5],[-118,6,4.5]];
function groove(p){
  el('path',{d:'M-95,30Q-50,20 2,30',fill:'none',stroke:'#7a4a1e','stroke-width':3,'stroke-linecap':'round'},p);
  el('path',{d:'M-92,35Q-50,27 0,36',fill:'none',stroke:'#a4723d','stroke-width':1.3,'stroke-linecap':'round'},p);
  el('path',{d:'M6,32Q14,24 22,14',fill:'none',stroke:'#6a3f17','stroke-width':2.5,'stroke-linecap':'round'},p);
  el('circle',{cx:6,cy:32,r:5.5,fill:'#a4723d',stroke:'#6a3f17','stroke-width':1.4},p);}
function Para(parent,o){o=o||{};const g=G(parent);
  const sh=o.sh?el('ellipse',{cx:0,cy:12,rx:150,ry:58,fill:'#1f3a52',opacity:.13,filter:'url(#blur)'},g):null;
  const cil=el('path',{fill:'none',stroke:'#8a5a2b','stroke-linecap':'round',opacity:.85},g);
  const body=el('path',{d:BODY0,fill:'url(#gPar)',stroke:'#8a5a2b','stroke-linejoin':'round'},g);
  const ecto=el('path',{d:ECTO0,fill:'none',stroke:'#a8743f','stroke-width':1.5,'stroke-dasharray':'1.5 3.5',opacity:.8},g);
  const fv=FV.map(([x,y,r])=>({x,y,ph:rr(0,6),e:el('circle',{r,fill:'#c49563',stroke:'#7a5228','stroke-width':1,opacity:.85},g)}));
  const gr=G(g);groove(gr);const bud=G(g);groove(bud);
  const vac=[[-85,-14],[85,-12],[-33,-14],[33,-12]].map((p,i)=>{const vg=G(g),ig=G(vg);
    for(let k=0;k<7;k++){const a=k/7*2*PI;el('line',{x1:f1(7*Math.cos(a)),y1:f1(7*Math.sin(a)),x2:f1(16*Math.cos(a)),y2:f1(16*Math.sin(a)),stroke:'#5f9cc4','stroke-width':1.6,'stroke-linecap':'round'},ig);}
    el('circle',{r:6,fill:'#e4f4ff',stroke:'#5f9cc4','stroke-width':1.4},ig);return{p,vg,ig,ph:i*1.7};});
  const ng=G(g);
  const mb=el('line',{stroke:'#a993d6','stroke-linecap':'round'},ng);
  const mac=[0,1].map(()=>el('ellipse',{fill:'url(#gMac)',stroke:'#5a3f93','stroke-width':1.5},ng));
  const spn=el('line',{stroke:'#4a2f86','stroke-width':1.2,'stroke-dasharray':'2 2'},ng);
  const mic=[0,1].map(()=>el('circle',{fill:'#3e2475',stroke:'#24123f','stroke-width':1},ng));
  return{g,sh,cil,body,ecto,fv,gr,bud,vac,ng,mb,mac,mic,spn,ph:rr(0,6),pin:0,x:0,y:0,r:0,sx:1,sy:1};}
function setP(p,x,y,r,sx,sy,op,t,div,nop){
  if(!show(p.g,op))return;div=div||0;
  p.x=x;p.y=y;p.r=r;p.sx=sx;p.sy=sy;
  p.g.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) rotate(${f1(r)}) scale(${f3(sx)} ${f3(sy)})`);
  const s=Math.min(Math.abs(sx),Math.abs(sy));p.body.setAttribute('stroke-width',f2(Math.max(2.4,1.4/s)));p.cil.setAttribute('stroke-width',f2(Math.max(1.3,.9/s)));
  const pin=.88*sm(div,.55,1);let pts=OUT0;
  if(pin>.001){pts=outline(pin);p.body.setAttribute('d',closeD(pts));p.ecto.setAttribute('d',ectoD(pts));p.pin=1;}
  else if(p.pin){p.body.setAttribute('d',BODY0);p.ecto.setAttribute('d',ECTO0);p.pin=0;}
  p.cil.setAttribute('d',ciliaD(pts,t,p.ph));
  if(p.sh)p.sh.setAttribute('opacity',f2(.13*(1-sm(div,.5,.8))));
  p.fv.forEach(f=>att(f.e,{cx:f.x+3*Math.sin(t*.5+f.ph),cy:f.y+2.5*Math.cos(t*.6+f.ph)}));
  const k=sm(div,.55,1);p.gr.setAttribute('transform',`translate(${f1(-75*k)} 0) scale(${f3(1-.5*k)} 1)`);
  const b=sm(div,.25,.45);if(show(p.bud,b))p.bud.setAttribute('transform',`translate(${f1(75+3*(1-b))} ${f1(32*(1-b))}) scale(${f3(.5*b)} ${f3(b)})`);
  const nv=sm(div,.5,.7);
  p.vac.forEach((v,i)=>{const vx=i<2?lerp(v.p[0],i?117:-117,nv):v.p[0];
    if(show(v.vg,i<2?1:nv)){v.vg.setAttribute('transform',`translate(${f1(vx)} ${f1(v.p[1])})`);v.ig.setAttribute('transform',`scale(${f2(.75+.25*Math.abs(Math.sin(t*1.4+v.ph)))})`);}});
  if(show(p.ng,nop==null?1:nop)){
    const ms=sm(div,.05,.35),me=sm(div,.2,.4),mp=sm(div,.45,.75);
    const a0=[lerp(-26,-88,ms),-18],a1=[lerp(-26,62,ms),-18],mr=lerp(7,5,ms);
    att(p.mic[0],{cx:a0[0],cy:a0[1],r:mr});att(p.mic[1],{cx:a1[0],cy:a1[1],r:mr});
    att(p.spn,{x1:a0[0],y1:a0[1],x2:a1[0],y2:a1[1]});p.spn.setAttribute('opacity',f2(.8*Math.sin(PI*ms)));
    const rx=lerp(lerp(30,46,me),15,mp),c0=lerp(8,-71,mp),c1=lerp(8,79,mp),bw=30*(1-sm(div,.45,.68));
    att(p.mac[0],{cx:c0,cy:-6,rx,ry:20});att(p.mac[1],{cx:c1,cy:-6,rx,ry:20});
    att(p.mb,{x1:c0,y1:-6,x2:c1,y2:-6});p.mb.setAttribute('stroke-width',f2(bw));p.mb.setAttribute('opacity',bw>.5?1:0);
  }
}
function toW(p,lx,ly){const a=p.r*D2R,co=Math.cos(a),si=Math.sin(a),X=lx*p.sx,Y=ly*p.sy;return[p.x+X*co-Y*si,p.y+X*si+Y*co];}
function kids(s){return[-75,75].map(cx=>{const w=toW(s,cx,0);return{x:w[0],y:w[1],sx:s.sx*.5,sy:s.sy};});}

const world=G(view);

/* ================= case 1: binary fission ================= */
const asxG=G(world),asxC=G(asxG),asxL=G(asxG);
const M=Para(asxC,{sh:1}),D=[Para(asxC,{}),Para(asxC,{})];
function Label(par,txt,x,y,ax,tg){const g=G(par);const ln=el('line',{stroke:'#1f3a52','stroke-width':2},g),dt=el('circle',{r:4,fill:'#1f3a52'},g),tx=el('text',{class:'lb',x,y},g);
  tx.textContent=txt;return{g,ln,dt,y,ax,tg};}
function setL(L,op){if(show(L.g,op)){const p=L.tg();att(L.ln,{x1:p[0],y1:p[1],x2:L.ax,y2:L.y});att(L.dt,{cx:p[0],cy:p[1]});}}
const LBm=Label(asxL,'نواة صغيرة',175,200,238,()=>toW(M,-26,-18)),
      LBM=Label(asxL,'نواة كبيرة',725,200,664,()=>toW(M,8,-6)),
      LBb=Label(asxL,'برعم الفم الخلوي',735,610,652,()=>toW(M,78,32));

/* ================= case 2: conjugation ================= */
const conjG=G(world),cells=G(conjG),brG=G(conjG),wn=G(conjG);
const A=Para(cells,{sh:1}),B=Para(cells,{sh:1});
const bridge=el('ellipse',{cx:450,cy:408,rx:36,ry:34,fill:'#efdcbc'},brG);
const MAC0=[-7.8,10.4],MIC0=[-23.4,-33.8],D1=[[-30,-75],[25,-62]],D2=[[-40,-118],[-28,-40],[28,-108],[35,-22]],MALE=[58,-8],FEM=[28,30];
const FR=[...Array(7)].map(()=>({p:[rr(-42,30),rr(-150,150)],r:rr(4,7.5)}));
function Side(sg,E){const g=G(wn),mk=(n,a)=>el(n,a,g);
  return{sg,E,L1:[Para(cells,{}),Para(cells,{})],L2:[0,1,2,3].map(()=>Para(cells,{})),
    mac:mk('ellipse',{fill:'url(#gMac)',stroke:'#5a3f93','stroke-width':1.5}),
    frag:FR.map(f=>mk('circle',{r:f2(f.r),fill:'url(#gMac)',stroke:'#5a3f93','stroke-width':1})),
    mic:[0,1,2,3].map(()=>mk('circle',{fill:'#3e2475',stroke:'#24123f','stroke-width':1})),
    glow:mk('circle',{r:34,fill:'url(#gGlow)',opacity:0}),
    nmac:mk('ellipse',{fill:'url(#gMac)',stroke:'#5a3f93','stroke-width':1.5}),
    nmic:mk('circle',{fill:'#3e2475',stroke:'#24123f','stroke-width':1}),
    fem:mk('circle',{fill:'#d0458f',stroke:'#7a1b4f','stroke-width':1.2}),
    syn:mk('circle',{fill:'#7b2fa0',stroke:'#3c1050','stroke-width':1.2})};}
const SIDES=[Side(1,A),Side(-1,B)];
SIDES.forEach(S=>S.male=el('circle',{fill:'#2f6fd6',stroke:'#123e80','stroke-width':1.2},wn));

/* divider card */
const card=el('g',{opacity:0},world);
el('rect',{x:-210,y:-62,width:420,height:124,rx:26,fill:'#b5651d',stroke:'#fff','stroke-width':4},card);
el('rect',{x:-200,y:-52,width:400,height:104,rx:20,fill:'none',stroke:'#ffe2b0','stroke-width':1.5,'stroke-dasharray':'6 6'},card);
const ct=el('text',{class:'bt',x:0,y:0,style:'font-size:34px'},card);ct.textContent='تكاثر جنسي (الاقتران)';
/* banner */
const bn=el('rect',{id:'bn',x:60,y:14,width:780,height:58,rx:20,fill:'#2e8b57'}),bt=el('text',{class:'bt',x:450,y:43});

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:1,dur:DUR[0]};
let stage=0,T=0,t0=0,last=performance.now(),paused=false,P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

/* ---------------- render ---------------- */
function render(t){
  const u=k=>clamp(P-k,0,1),u1=u(0),u2=u(1),u3=u(2),u4=u(3),u5=u(4),u6=u(5),u7=u(6),u8=u(7),u9=u(8),u10=u(9);

  /* ===== binary fission ===== */
  if(show(asxG,1-sm(u5,.04,.2))){
    asxG.setAttribute('transform',`translate(${f1(-520*sm(u5,0,.2))} 0)`);
    const calm=1-sm(u2,0,.2);
    setP(M,450,400+5*Math.sin(t*.9)*calm,2*Math.sin(t*.6)*calm,1.5,1.5,1-sm(u4,.02,.08),t,.4*u2+.6*u3,1);
    setL(LBm,sm(u1,.15,.45)*(1-sm(u2,0,.1)));setL(LBM,sm(u1,.15,.45)*(1-sm(u2,0,.1)));
    setL(LBb,sm(u2,.7,.9)*(1-sm(u3,0,.1)));
    const K=kids({x:450,y:400,r:0,sx:1.5,sy:1.5}),TG=[[235,400],[665,400]],dm=sm(u4,.1,.7),dg=sm(u4,.1,.8),di=sm(u4,.7,1);
    D.forEach((d,i)=>setP(d,lerp(K[i].x,TG[i][0],dm)+6*Math.sin(t*.6+i*2)*di,
      lerp(K[i].y,TG[i][1],dm)+(i?-1:1)*30*Math.sin(PI*dm)+5*Math.cos(t*.8+i)*di,3*Math.sin(t*.7+i)*di,
      lerp(.75,1,dg),lerp(1.5,1,dg),sm(u4,.02,.08),t,0,1));
  }

  /* ===== divider card ===== */
  if(show(card,sm(u5,.06,.13)*(1-sm(u5,.26,.33))))card.setAttribute('transform',`translate(450 360) scale(${f2(.85+.15*sm(u5,.06,.15))})`);

  /* ===== conjugation ===== */
  if(show(conjG,sm(u5,.22,.32))){
    conjG.setAttribute('transform',`translate(${f1(560*(1-sm(u5,.22,.4)))} 0)`);
    const ap=sm(u5,.45,.85),sp=sm(u9,.1,.5),free=1-sm(u5,.75,.88);
    const CA=u9>0?lerp(382,300,sp):lerp(170,382,ap),CB=u9>0?lerp(518,600,sp):lerp(730,518,ap),cen=[CA,CB];
    const nopE=(u6>0&&u10<=0)?0:1,eOp=1-sm(u10,.28,.31),d1=sm(u10,0,.28);
    setP(A,CA,400+6*Math.sin(t*.9)*free,90+5*Math.sin(t*.8)*free,1.3,-1.3,eOp,t,d1,nopE);
    setP(B,CB,400+6*Math.sin(t*.9+2)*free,90+5*Math.sin(t*.8+2)*free,1.3,1.3,eOp,t,d1,nopE);
    show(bridge,sm(u5,.8,.95)*(1-sm(u9,0,.2)));

    /* nuclei during conjugation */
    if(show(wn,(u6>0&&u10<=0)?1:0)){
      const a=sm(u6,.05,.35),b=sm(u6,.45,.8),dg=sm(u7,.05,.4),c=sm(u7,.45,.85),e=sm(u8,.05,.55),f=sm(u8,.55,.8),r1=sm(u9,.5,.72),gm=sm(u9,.6,.95);
      SIDES.forEach((W,si)=>{const sg=W.sg,C=cen[si],rel=p=>[C+sg*p[0],400+p[1]],oth=p=>[cen[1-si]-sg*p[0],400+p[1]];
        const mc=rel(MAC0);att(W.mac,{cx:mc[0],cy:mc[1],rx:26,ry:39});W.mac.setAttribute('opacity',f2(1-sm(u6,.35,.5)));

من الكروموسومات ( 2س ) .","ينفصل الفردان المقترنان ، وينقسم كل منهما انقسامين اعتياديين ليتكون من كل منهما أربع براميسيومات بنوية ( جديدة ) ."]}},{"type":"اشرح","tags":["2/2021"],"q":"اشرح الاقتران في البراميسيوم لحين تكوين النواة المندمجة .","a":{"p":"تُكتب النقاط 1 و 2 و 3 و 4 من جواب سؤال ( اشرح عملية الاقتران في البراميسيوم ) بالكامل ."}},{"type":"ما منشأ","tags":["1/2016","2021 تمهيدي","2024 تمهيدي"],"q":"ما منشأ النواة المندمجة ؟","a":{"p":"من اتحاد النواة الأولية الذكرية مع النواة الأولية الأنثوية ."}},{"type":"علّل","tags":["1/2023 أسئلة المتميزين"],"q":"تكون النواة المندمجة متباينة العوامل الوراثية .","a":{"p":"لأنه في عملية الاقتران تحصل عملية تبادل الأنوية الذكرية في الكائنين المقترنين وتتحد مع الأنوية الأنثوية لتتكون النواة المندمجة متباينة العوامل الوراثية ."}},{"type":"ما منشأ","tags":["1/2022 أسئلة المتميزين"],"q":"ما منشأ الجسر البروتوبلازمي ؟","a":{"p":"تقابل وتماس البراميسيومين المقترنين من الجهة التي تقع فيها الأخدود الفمي ."}},{"type":"ماذا ينتج","tags":["1/2022"],"q":"ماذا ينتج عن : انفصال البراميسيومين المقترنين بعد تكوين النواة المندمجة ؟","a":{"p":"ينقسم كل منهما انقسامين اعتياديين ليتكون من كل منهما أربع براميسيومات بنوية ( جديدة ) ."}},{"type":"قارن","tags":["2/2025"],"q":"قارن بين جسر الاقتران والجسر البروتوبلازمي من حيث ( المنشأ والوظيفة ) .","a":{"tb":{"h":["","جسر الاقتران","الجسر البروتوبلازمي"],"r":[["المنشأ","من الأهلاب الجنسية ( هلب الاقتران ) للبكتريا عند ملامسة سطح الخلية المستلمة","من الأخدود الفمي للبراميسيوم عند الاقتران"],["الوظيفة","يعمل على تواصل بروتوبلازم الخليتين البكتيريتين ، أو نقل جزء من كروموسوم الخلية المعطية إلى المستلمة ، أو ربط الخلية المعطية مع المستلمة ، أو نقل البلازميد أو عامل الخصوبة DNA","عبور أو تبادل المواد الكروموسومية ، أو تبادل الأنوية الذكرية"]]},"p":"ملاحظة من مركز الفحص : يكتفي المصحح بوظيفة واحدة ."}},{"type":"عرّف","tags":["1/1995","1/2016 أسئلة خارج القطر"],"q":"عرّف الإخصاب الذاتي ( تكلم عن الإخصاب الذاتي في البراميسيوم ) ؟","a":{"p":"وهي طريقة تكاثر جنسي في البراميسيوم تشبه عملية الاقتران ، فيما عدا عدم حصول عملية تبادل للأنوية ، حيث أن النواتين الصغيرتين الأوليتين اللتان تحتويان نصف العدد الكامل من الكروموسومات تتحدان لتكونا معاً نواة مندمجة متماثلة أي تكون متماثلة بالعوامل الوراثية وليست متباينة العوامل الوراثية ، كما هو الحال في الاقتران ."}},{"type":"اشرح","tags":["1/2023"],"q":"اشرح التكاثر الجنسي في البراميسيوم لحين تكوين النواة المندمجة .","a":{"p":"تكتب فقرة الاقتران وفقرة الإخصاب الذاتي بالكامل . ملاحظة من مركز الفحص : في حالة عدم كتابة الطالب طريقة الإخصاب الذاتي تعتبر الإجابة صحيحة ."}},{"type":"املأ الفراغ","tags":["2/2014","2018 تمهيدي","2022 تمهيدي","2/2023","3/2024 نظام المحاولات"],"q":"يتكاثر البراميسيوم جنسياً بطريقتين هما {الاقتران} و{الإخصاب الذاتي} ."},{"type":"املأ الفراغ","tags":["2/2019"],"q":"يتكون بين البراميسيومين الملتصقين جسر {بروتوبلازمي} وبين البكتريا المعطية والمستلمة جسر {الاقتران} ."},{"type":"قارن","tags":["أسئلة الفصل","1/2016 أسئلة النازحين","2/2016","1/2018","3/2020","1/2021","1/2024","2/2017 أسئلة خارج القطر","2/2013 تكميلي"],"q":"قارن بين طريقة الاقتران وطريقة الإخصاب الذاتي في البراميسيوم .","a":{"tb":{"h":["طريقة الاقتران","طريقة الإخصاب الذاتي"],"r":[["يحصل تبادل للأنوية الذكرية ( الصغيرة ) في الكائنين المقترنين","لا يحصل تبادل للأنوية الذكرية الصغيرة"],["تتكون نواة مندمجة متباينة العوامل الوراثية","تتكون نواة مندمجة متماثلة العوامل الوراثية"],["فيه تتحد الأنوية الأولية الذكرية مع الأنوية الأولية الأنثوية في البراميسيوم الآخر وكل منهما ( 1س )","فيه تتحد النواتان الصغيرتان الأوليتان اللتان تحتويان ( 1س )"],["تمر الأنوية الأولية الذكرية خلال جسر الاقتران","لا تمر الأنوية الأولية الذكرية خلال جسر الاقتران"],["طريقة تكاثر جنسي","طريقة تكاثر جنسي"],["يحصل بين فردين من النوع نفسه ولكنهما من سلالتين مختلفتين","يحصل الإخصاب في الفرد نفسه ، ويشبه عملية الاقتران"]]}}},{"type":"المجموعة الكروموسومية","q":"اذكر المجموعة الكروموسومية لكل مما يأتي :","items":[{"t":"نواة أولية ذكرية للبراميسيوم","tags":[],"a":"( س )"},{"t":"نواة أولية أنثوية للبراميسيوم","tags":[],"a":"( س )"},{"t":"النواة الصغيرة للبراميسيوم","tags":["2/2005","1/2008"],"a":"( 2س )"},{"t":"النواة المندمجة للبراميسيوم","tags":["1/2003","1/2005","3/2020","2/2024"],"a":"( 2س )"},{"t":"نواة مندمجة متماثلة العوامل الوراثية","tags":[],"a":"( 2س )"},{"t":"نواة مندمجة متباينة العوامل الوراثية","tags":[],"a":"( 2س )"}]},{"type":"ارسم","tags":["1/2010"],"q":"ارسم مع التأشير طريقة الاقتران في البراميسيوم .","a":{"p":"خمس مراحل متتالية تبين التصاق فردين وانقسام النواة الصغيرة وتبادل الأنوية ثم انفصال الفردين . ( شاهد الرسم بالمحاكاة )"}}]};</script>
<script>
/* MoeLab — محرك الأسئلة الوزارية
   يُحقن تلقائياً داخل كل محاكاة لها أسئلة (لا تعدّل النسخ المحقونة يدوياً — عدّل هذا الملف ثم شغّل build.py).
   مبدأ الأمان: أي خطأ هنا يُخفي زر الوزاريات فقط ولا يؤثر على المحاكاة. */
(function(){try{
var D=window.MOE_MIN_DATA;if(!D||!D.qs||!D.qs.length)return;
var stage=document.getElementById('stage')||document.body;
/* محاكيات بقالب آخر (أزرار التكبير داخل .side خارج #stage): نضع العناصر فوق الصفحة كلها */
var ZB=document.querySelector('.zb')||(function(){var z=document.getElementById('zin');return z&&z.parentElement;})();
if(!document.querySelector('.zb')&&ZB&&!stage.contains(ZB)){stage=document.body;document.documentElement.classList.add('moe-fixed');}
var AR=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];});};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var tagK=function(s){return /الفصل|الكتاب|التلفزيون/.test(s)?'book':/خارج|الموصل|المتميزين|النازحين|المحاولات/.test(s)?'out':/تمهيدي|تكميلي/.test(s)?'pre':'min';};
var tagH=function(s){var k=tagK(s);return '<span class="tg '+k+'">'+esc(k==='book'?s:'وزاري '+s)+'</span>';};
var minCount=function(q){var t=(q.tags||[]).slice();(q.items||[]).forEach(function(i){t=t.concat(i.tags||[]);});return t.filter(function(s){return tagK(s)!=='book';}).length;};
var $=function(id){return document.getElementById(id);};

/* ---------- DOM ---------- */
var wrap=document.createElement('div');
wrap.innerHTML='<button id="qbtn" type="button" aria-label="الأسئلة الوزارية">📝 الوزاريات <b id="qcnt"></b></button>'+
 '<div id="hlbar"><span id="hlname"></span><button id="hlback" type="button">↩ رجوع للسؤال</button></div>'+
 '<div id="qp" role="dialog" aria-label="الأسئلة الوزارية">'+
  '<div id="qhd"><div class="t">📝 الأسئلة الوزارية</div><button id="qx" type="button" aria-label="إغلاق">✕</button></div>'+
  '<div id="qchips"></div><div id="qbody"></div>'+
  '<div id="qft"><button id="qprev" type="button">السابق ▶</button><button id="qa" type="button">إظهار الحل 💡</button><button id="qnext" type="button">التالي ◀</button></div>'+
 '</div>';
while(wrap.firstChild)stage.appendChild(wrap.firstChild);
/* place the button just to the right of the sim's zoom buttons (or under them if they are in a row) */
function placeBtn(){try{var b=$('qbtn'),zb=ZB,st=stage===document.body?{left:0,top:0,width:innerWidth,height:innerHeight}:stage.getBoundingClientRect();
  if(!zb){b.style.left='10px';b.style.top='10px';return;}
  var r=zb.getBoundingClientRect(),row=getComputedStyle(zb).flexDirection==='row';
  if(!r.width||!r.height){b.style.left='10px';b.style.top='10px';return;}
  var below=function(){b.style.left=Math.round(r.left-st.left)+'px';b.style.top=Math.round(r.bottom-st.top+8)+'px';};
  if(row||placeBtn.down){below();return;}
  b.style.left=Math.round(r.right-st.left+10)+'px';b.style.top=Math.round(r.top-st.top)+'px';
  /* if the sim shows its own caption/banner in that spot, move under the zoom buttons (and stay there) */
  var q=b.getBoundingClientRect(),hit=false;
  [].forEach.call(stage.querySelectorAll('*'),function(e){if(hit||e===b||(zb&&zb.contains(e))||e.closest('.zb,#qp,#hlbar,#qbtn'))return;
    if(e.parentElement!==stage&&!e.id)return;
    var cs=getComputedStyle(e);if(cs.position==='static'||cs.display==='none'||cs.visibility==='hidden'||!(e.textContent||'').trim())return;
    var x=e.getBoundingClientRect();if(!x.width||x.width>st.width*.9||x.height>120)return;
    if(x.left<q.right&&x.right>q.left&&x.top<q.bottom&&x.bottom>q.top)hit=true;});
  if(hit){placeBtn.down=true;below();}}catch(_){}}
placeBtn();setInterval(placeBtn,700);window.addEventListener('resize',placeBtn);document.addEventListener('fullscreenchange',function(){setTimeout(placeBtn,50);});

var qp=$('qp'),qbody=$('qbody'),qchips=$('qchips'),qa=$('qa'),qprev=$('qprev'),qnext=$('qnext');
var QS=D.qs,SEC=D.sections||{},NAMES=D.names||{};
$('qcnt').textContent=AR(QS.length);
var secKeys=Object.keys(SEC).filter(function(k){return QS.some(function(q){return q.sec===k;});});
if(secKeys.length<2)qchips.style.display='none';
var qsec='all',qi=0,qrev=false,qOpen=false;
var list=function(){return qsec==='all'?QS:QS.filter(function(q){return q.sec===qsec;});};
qchips.innerHTML=[['all','الكل']].concat(secKeys.map(function(k){return [k,SEC[k]];})).map(function(a){return '<button type="button" data-k="'+a[0]+'">'+esc(a[1])+'</button>';}).join('');
qchips.onclick=function(e){var b=e.target.closest('button');if(!b)return;qsec=b.dataset.k;qi=0;qrev=false;render();};

function ansH(a){var h='';if(!a)return h;if(a.p&&!a.tb)h+='<div>'+esc(a.p)+'</div>';
  if(a.ol)h+='<ol>'+a.ol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(a.tb)h+='<div class="tbw"><table><tr>'+a.tb.h.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>'+a.tb.r.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
  if(a.dl)h+='<dl>'+a.dl.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl>';if(a.p&&a.tb)h+='<div class="note">'+esc(a.p)+'</div>';return h;}
var SIM=null;function sim(){return SIM||(SIM=window.MOE_SIM||null);}
function canSee(k){var s=sim();return !!(k&&s&&s.groups&&s.groups[k]);}
function render(){try{render0();}catch(err){qOpen=false;qp.classList.remove('on');$('qbtn').style.display='none';if(window.console)console.warn('MoeLab ministerial:',err);}}
function render0(){
  var L=list(),q=L[qi];
  [].forEach.call(qchips.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===qsec);});
  var n=minCount(q);
  var h='<div class="qc'+(qrev?' rev':'')+'"><div class="qtop"><span class="qty">'+esc(q.type)+'</span>'+
    (n>=3?'<span class="qfire">🔥 تكرر وزارياً '+AR(n)+' مرات</span>':'')+'<span class="qnum">'+AR(qi+1)+' / '+AR(L.length)+'</span></div>';
  if(q.tags&&q.tags.length)h+='<div class="tags">'+q.tags.map(tagH).join('')+'</div>';
  h+='<div class="qq">'+esc(q.q).replace(/\{([^}]*)\}/g,'<span class="blank">$1</span>')+'</div>';
  if(q.opts)h+='<div class="opts">'+q.opts.map(function(o,k){return '<button type="button" class="opt'+(qrev&&k===q.ans?' ok':'')+'" data-k="'+k+'">'+'أبجد'[k]+' ) '+esc(o)+'</button>';}).join('')+'</div>';
  if(q.items)h+='<ol class="items">'+q.items.map(function(it){var t=it.tags||[];return '<li>'+esc(it.t)+(t.length?'<div class="tags">'+t.map(tagH).join('')+'</div>':'')+'<div class="ia">'+esc(it.a||q.common||'')+'</div></li>';}).join('')+'</ol>';
  if(q.a)h+='<div class="ans"><div class="h">✔ الجواب</div>'+ansH(q.a)+'</div>';
  if(canSee(q.hl))h+='<div class="see"><button type="button" id="qsee">📍 شوف '+esc(NAMES[q.hl]||'')+' بالمحاكاة</button></div>';
  qbody.innerHTML=h+'</div>';qbody.scrollTop=0;
  qa.textContent=qrev?'إخفاء الحل':'إظهار الحل 💡';qa.classList.toggle('hide',qrev);
  qprev.disabled=qi===0;qnext.disabled=qi>=L.length-1;
  [].forEach.call(qbody.querySelectorAll('.opt'),function(b){b.onclick=function(){if(+b.dataset.k===q.ans){qrev=true;render();}else b.classList.add('no');};});
  var s=$('qsee');if(s)s.onclick=function(){hlStart(q.hl);};
}
qa.onclick=function(){qrev=!qrev;render();};
qprev.onclick=function(){if(qi>0){qi--;qrev=false;render();}};
qnext.onclick=function(){if(qi<list().length-1){qi++;qrev=false;render();}};
function show(on){qOpen=on;qp.classList.toggle('on',on);if(on)render();}
$('qbtn').onclick=function(){hlStop();show(true);};
$('qx').onclick=function(){show(false);};

/* ---------- highlight inside the simulation (only if the sim registered window.MOE_SIM) ---------- */
var HL=null;
function els(keys,map){var a=[];keys.forEach(function(k){(map[k]||[]).forEach(function(e){a.push(e);});});return a;}
function bbox(arr){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;arr.forEach(function(e){try{var b=e.getBBox();if(!b.width&&!b.height)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}catch(_){}});return x0<x1?{x0:x0,y0:y0,x1:x1,y1:y1}:null;}
var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function hlStart(k){
  var s=sim();if(!canSee(k))return;show(false);
  try{s.finish();}catch(_){}
  var parts=s.groups[k],on=els(parts,s.parts),labs=els(parts,s.labels||{});
  var all=els(Object.keys(s.parts),s.parts),allL=els(Object.keys(s.labels||{}),s.labels||{});
  var v=s.view.get(),vb=s.view.box,b=bbox(on.concat(labs)),to=v;
  if(b){var pad=30,cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,ks=Math.max(1,Math.min(2.6,vb[2]/(b.x1-b.x0+2*pad),vb[3]/(b.y1-b.y0+2*pad)));
    to=[ks,vb[0]+vb[2]/2-cx*ks,vb[1]+vb[3]/2-cy*ks];}
  HL={k:k,s:s,on:new Set(on),labs:new Set(labs),all:all,allL:allL,glows:els(parts,s.glows||{}),t0:performance.now(),from:v,to:to};
  $('hlname').textContent='📍 '+(NAMES[k]||'');
  $('hlbar').classList.add('on');document.body.classList.add('hlmode');
  requestAnimationFrame(tick);
}
function hlStop(){if(!HL)return;var s=HL.s;HL=null;$('hlbar').classList.remove('on');document.body.classList.remove('hlmode');try{s.view.reset();}catch(_){}}
function tick(ms){
  if(!HL)return;
  try{
    var u=(ms-HL.t0)/1000,z=ease(Math.max(0,Math.min(1,u/.8))),L=function(a,b){return a+(b-a)*z;};
    HL.s.view.set(L(HL.from[0],HL.to[0]),L(HL.from[1],HL.to[1]),L(HL.from[2],HL.to[2]));
    var p=.5+.5*Math.sin(u*4.2);
    HL.all.forEach(function(e){if(!HL.on.has(e))e.setAttribute('opacity','0.18');});
    HL.allL.forEach(function(e){e.setAttribute('opacity',HL.labs.has(e)?'1':'0.15');});
    HL.glows.forEach(function(g){g.style.display='';g.setAttribute('opacity',(.35+.45*p).toFixed(2));});
    if(HL.s.pulse)HL.s.pulse(HL.k,p);
  }catch(e){hlStop();return;}
  requestAnimationFrame(tick);
}
$('hlback').onclick=function(){hlStop();show(true);};
/* any simulation button stops the highlight */
['go','prev','zreset'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',hlStop,true);});

/* keyboard: while the panel is open the arrows move between questions, not the simulation */
window.addEventListener('keydown',function(e){
  if(qOpen){e.stopImmediatePropagation();e.preventDefault();
    if(e.key==='ArrowLeft')qnext.click();else if(e.key==='ArrowRight')qprev.click();else if(e.key==='Escape')show(false);}
  else if(HL&&e.key==='Escape'){hlStop();}
},true);
}catch(err){try{var b=document.getElementById('qbtn');if(b)b.style.display='none';var p=document.getElementById('qp');if(p)p.style.display='none';}catch(_){} if(window.console)console.warn('MoeLab ministerial:',err);}})();

</script>
