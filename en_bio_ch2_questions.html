  head:'Match group 1 and group 2. Put the number of the correct answer from group 2 between the brackets :',
  sub:'Matching',
  items:[
   {k:'fill',t:'Matching: part 1',h:'Put the number of the correct answer from group 2 :',
    q:'<span class="chips">1- Support , 2- Secretion and Prevalence , 3- Protection and Secretion , 4- Support and Absorption ,<br>5- Prevalence and Filtering , 6- Protection , 7- Secretion and Absorption , 8- Protection, Secretion and Absorption</span>Simple Squamous Epithelial Tissue ( __ )<br>Reticular Connective Tissue ( __ )<br>Simple Columnar Epithelial Tissue ( __ )',
    a:['5','1','8']},
   {k:'fill',t:'Matching: part 2',h:'Put the number of the correct answer from group 2 :',
    q:'<span class="chips">1- Support , 2- Secretion and Prevalence , 3- Protection and Secretion , 4- Support and Absorption ,<br>5- Prevalence and Filtering , 6- Protection , 7- Secretion and Absorption , 8- Protection, Secretion and Absorption</span>Simple Cuboidal Epithelial Tissue ( __ )<br>Stratified Squamous Epithelial Tissue ( __ )<br>Pseudo-stratified Columnar Epithelial Tissue ( __ )',
    a:['7','6','3']}
  ]}
];
const L=['a','b','c','d'];
/* ========================================== */

const ar=n=>String(n),$=id=>document.getElementById(id),plain=h=>h.replace(/<[^>]+>/g,'');
const scr={menu:$('menu'),intro:$('intro'),qs:$('qs'),rev:$('rev')};
const btn=$('go'),pbtn=$('prev'),abtn=$('ans'),ring=$('ring'),badge=$('badge'),tleft=$('tleft'),ansBox=$('ansBox'),stmt=$('stmt');
const RL=2*Math.PI*58;ring.style.strokeDasharray=RL;
const REV=SECS.map(s=>Array(s.items.length).fill(false)),PICK=SECS.map(s=>s.items.map(()=>new Set())),opts=$('opts');
const FILL=SECS.map(s=>s.items.map(it=>s.type==='fill'?it[1].map(()=>false):s.type==='mixed'?it.a.map(()=>false):null));
const MIX=()=>S().type==='mixed',LR=()=>S().type==='why'||MIX(),K=i=>MIX()?S().items[i].k:S().type,
  Qt=i=>MIX()?S().items[i].q:S().items[i][0],Ans=i=>MIX()?S().items[i].a:S().items[i][1];
function setDone(i,v){rev()[i]=v;const f=FILL[sec][i];if(f)f.fill(v);if(!v)PICK[sec][i].clear();}
function blank(k){if(idx<0||idx>=N())return;const f=FILL[sec][idx];f[k]=!f[k];const was=rev()[idx];rev()[idx]=f.every(Boolean);
  if(was&&!rev()[idx]){rem=S().time;running=true;}paintAns(rev()[idx]&&!was);}
let sec=-1,idx=-1,rem=30,running=false,paused=false,dots=[],items=[];
const S=()=>SECS[sec],N=()=>S().items.length,rev=()=>REV[sec];

/* menu cards */
const cards=SECS.map((s,k)=>{const c=document.createElement('div');c.className='mc';
  c.innerHTML=`<div class="mn">${ar(k+1)}</div><div class="mt"><b>${s.name}</b><i>${s.sub} — ${ar(s.items.length)} items</i><div class="bar"><s></s></div></div><div class="go">▶</div>`;
  c.onclick=()=>open(k,-1);$('mlist').appendChild(c);return c;});
function paintMenu(){cards.forEach((c,k)=>{const r=REV[k];c.querySelector('s').style.width=(100*r.filter(Boolean).length/r.length)+'%';});}

function build(){const s=S();
  $('dots').innerHTML='';dots=s.items.map((q,i)=>{const d=document.createElement('div');d.className='dot';d.textContent=ar(i+1);d.onclick=()=>show(i);$('dots').appendChild(d);return d;});
  const g=$('grid');g.innerHTML='';g.classList.toggle('long',LR());
  items=s.items.map((q,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML=`<b>${ar(i+1)}</b><span></span>`;
    d.onclick=()=>{if(LR())show(i);else{setDone(i,!rev()[i]);paintRev();}};g.appendChild(d);return d;});
  $('qhead').textContent=s.short+' / '+s.head;
  $('iNum').textContent=ar(sec+1);$('iName').textContent=s.name;$('iHead').textContent=s.head;
  $('iNote').textContent=`${ar(s.items.length)} items — think carefully before the answer appears`;
  $('rTitle').textContent='Review answers: '+s.name;
  stmt.classList.toggle('long',s.type!=='term');ansBox.classList.toggle('long',s.type==='why');
  const mcq=s.type==='mcq',fill=s.type==='fill',mix=s.type==='mixed';ansBox.style.display=mcq||fill||mix?'none':'';opts.style.display=mcq?'grid':'none';
  g.classList.toggle('mcq',mcq||fill||mix);stmt.classList.toggle('fill',fill);stmt.classList.remove('cols');scr.qs.classList.toggle('compact',mix);}
function pick(k){if(idx<0||idx>=N()||rev()[idx])return;const it=S().items[idx];
  if(k===it[2]){rev()[idx]=true;paintAns(true);return;}
  PICK[sec][idx].add(k);const o=opts.children[k];o.classList.add('bad');o.classList.remove('shk');void o.offsetWidth;o.classList.add('shk');}

function anim(e){e.classList.remove('in');void e.offsetWidth;e.classList.add('in');}
function setTimer(v){rem=v;const T=S().time,late=rem<=0,done=idx>=0&&idx<N()&&rev()[idx];
  ring.style.strokeDashoffset=done?0:RL*(1-Math.max(0,rem)/T);
  ring.setAttribute('stroke',done?'#1b7a3a':late?'#c62828':rem<=T/3?'#e0a020':'#c4623a');
  tleft.textContent=done?'✔ Solved':late?'⏰ Time is up':ar(Math.ceil(rem))+' sec';
  tleft.classList.toggle('late',late&&!done);}
function paintAns(burst){const o=rev()[idx],it=S().items[idx],a=it[1];
  if(S().type==='mcq'){[...opts.children].forEach((e,k)=>{e.classList.toggle('ok',o&&k===it[2]);e.classList.toggle('dim',o&&k!==it[2]);e.classList.toggle('bad',PICK[sec][idx].has(k));});
    const p=$('par');if(p)p.innerHTML=o?`<b>${L[it[2]]}</b>`:'&nbsp;&nbsp;';}
  else if(FILL[sec][idx]){const f=FILL[sec][idx],A=Ans(idx);stmt.querySelectorAll('.bl').forEach((b,k)=>{const on=f[k];
    if(on&&!b.classList.contains('on')){b.classList.add('on');b.innerHTML=`<i>${A[k]}</i>`;}
    else if(!on&&b.classList.contains('on')){b.classList.remove('on');b.innerHTML='';}});}
  else{ansBox.classList.toggle('open',o);
  ansBox.innerHTML=o?(S().type==='why'?`<span><em>Ans:</em> ${a}</span>`:`<span>${a}</span>`):'? ? ?';}
  dots.forEach((d,i)=>{d.classList.toggle('done',rev()[i]);d.classList.toggle('cur',i===idx);});
  if(o){running=false;badge.classList.remove('late');if(burst)celebrate();}
  setTimer(rem);ui();}
function paintRev(){let c=0;const why=LR();
  items.forEach((d,i)=>{const o=rev()[i];if(o)c++;d.classList.toggle('done',o);
    const it=S().items[i],mcq=S().type==='mcq';
    d.querySelector('span').textContent=why?(o?'✔ ':'')+(MIX()?it.t:plain(it[0])):!o?'? ? ?':mcq?`${L[it[2]]} ) ${it[1][it[2]]}`:Array.isArray(it[1])?it[1].join(' , '):it[1];});
  $('score').textContent=`Solved ${ar(c)} of ${ar(N())} items`+(why?' — tap any item to open it':'');ui();}

function screen(n){for(const k in scr)scr[k].classList.toggle('on',k===n);}
function open(k,i){if(k!==sec){sec=k;build();}show(i);}
function home(){sec=-1;idx=-1;running=false;screen('menu');anim(scr.menu);paintMenu();ui();}
function show(i){idx=i;
  if(i<0){screen('intro');anim(scr.intro);}
  else if(i<N()){screen('qs');$('num').textContent=ar(i+1);const it=S().items[i];
    if(S().type==='mcq'){stmt.innerHTML=`<div><span class="par" id="par"></span>${it[0]}</div>`;opts.innerHTML='';
      it[1].forEach((t,k)=>{const e=document.createElement('div');e.className='op';e.innerHTML=`<b>${L[k]}</b><span>${t}</span>`;e.onclick=()=>pick(k);opts.appendChild(e);});}
    else if(K(i)==='fill'||K(i)==='cols'){
      if(MIX()){stmt.classList.toggle('fill',K(i)==='fill');stmt.classList.toggle('cols',K(i)==='cols');$('qhead').textContent=S().short+' / '+it.h;}
      if(K(i)==='fill'){let k=0;stmt.innerHTML=Qt(i).replace(/__/g,()=>`<span class="bl" data-k="${k++}"></span>`);}
      else stmt.innerHTML=(it.q?`<div class="ctitle ${it.tight?'tight':''}">${it.q}</div>`:'')+`<div class="cgrid ${it.tight?'tight':''}">${it.heads.map((h,k)=>`<div><div class="chead">${h}</div><span class="bl cb" data-k="${k}"></span></div>`).join('')}</div>`;
      stmt.querySelectorAll('.bl').forEach(b=>b.onclick=()=>blank(+b.dataset.k));}
    else stmt.innerHTML=it[0];anim(stmt);anim(badge);anim(ansBox.parentNode);
    badge.classList.remove('late');rem=S().time;running=!rev()[i];paintAns(false);}
  else{screen('rev');anim(scr.rev);paintRev();}
  ui();}

function ui(){
  if(sec<0){btn.textContent='Start';btn.disabled=false;pbtn.disabled=true;abtn.disabled=true;abtn.textContent='Show answer 💡';abtn.classList.remove('hide');return;}
  const n=N();btn.disabled=false;
  btn.textContent=idx<0?'Start':idx<n-1?'Next ▶':idx===n-1?'Review ▶':'Menu ⌂';
  pbtn.disabled=false;
  if(idx<0){abtn.disabled=true;abtn.textContent='Show answer 💡';abtn.classList.remove('hide');}
  else if(idx<n){abtn.disabled=false;const f=FILL[sec][idx];
    abtn.textContent=rev()[idx]?'Hide answer':f&&f.length>1?`Show ${ar(f.filter(Boolean).length+1)}/${ar(f.length)} 💡`:'Show answer 💡';
    abtn.classList.toggle('hide',rev()[idx]);}
  else if(LR()){abtn.disabled=true;abtn.textContent='Show answer 💡';abtn.classList.remove('hide');}
  else{const all=rev().every(Boolean);abtn.disabled=false;abtn.textContent=all?'Hide all':'Show all 💡';abtn.classList.toggle('hide',all);}
}
function toggleAns(){if(sec<0||idx<0)return;const r=rev();
  if(idx<N()){const f=FILL[sec][idx];
    if(f&&!r[idx]){blank(f.indexOf(false));return;}
    setDone(idx,!r[idx]);if(!r[idx]){rem=S().time;running=true;}paintAns(r[idx]);}
  else if(!LR()){const all=r.every(Boolean);r.forEach((v,i)=>setDone(i,!all));paintRev();}}

function celebrate(){const g=$('glow');g.classList.remove('go');void g.offsetWidth;g.classList.add('go');
  const C=['#c4623a','#1b7a3a','#ffb000','#1f3a52','#c62828','#7a64c8'],w=ansBox.parentNode;
  for(let k=0;k<26;k++){const s=document.createElement('i');s.className='cf';const a=Math.random()*2*Math.PI,r=180+Math.random()*220;
    s.style.background=C[k%C.length];s.style.setProperty('--dx',(Math.cos(a)*r*1.4).toFixed(0)+'px');s.style.setProperty('--dy',(Math.sin(a)*r*.7-60).toFixed(0)+'px');
    s.style.setProperty('--r',(Math.random()*720-360).toFixed(0)+'deg');w.appendChild(s);setTimeout(()=>s.remove(),1400);}}

btn.onclick=()=>{if(sec<0){open(0,-1);return;}
  if(idx>=N())home();else show(idx+1);};
pbtn.onclick=()=>{if(sec<0)return;if(idx<0)home();else show(idx-1);};
abtn.onclick=toggleAns;
ansBox.onclick=toggleAns;
$('home').onclick=home;
badge.onclick=()=>{if(idx<0||idx>=N()||rev()[idx])return;badge.classList.remove('late');rem=S().time;running=true;setTimer(rem);};

/* timer loop */
let last=performance.now();
function frame(ms){const dt=Math.min(.1,(ms-last)/1000);last=ms;
  if(running&&!paused&&sec>=0&&idx>=0&&idx<N()){rem-=dt;if(rem<=0){rem=0;running=false;badge.classList.add('late');}setTimer(rem);}
  requestAnimationFrame(frame);}

/* ---------------- zoom & pan (gestures) ---------------- */
const cv=$('cv'),board=$('board'),BW=1000,BH=720,MIN=.6,MAX=8,NOPAN='.dot,.it,.ans,.badge,.mc,.op,.bl';
let fit=1,SC=1,tx=0,ty=0;
const apply=()=>board.style.transform=`translate(${tx}px,${ty}px) scale(${SC})`;
function reset(){const w=cv.clientWidth,h=cv.clientHeight;fit=Math.min(w/BW,h/BH);SC=fit;tx=(w-BW*SC)/2;ty=(h-BH*SC)/2;apply();}
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function zoomAt(k,p){const ns=Math.min(fit*MAX,Math.max(fit*MIN,SC*k));k=ns/SC;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;SC=ns;apply();}
const mid=()=>({x:cv.clientWidth/2,y:cv.clientHeight/2});
const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{if(e.target.closest(NOPAN))return;cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,pt(e));});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=pt(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,pt(e));},{passive:false});
cv.addEventListener('dblclick',e=>{if(!e.target.closest(NOPAN))reset();});
$('zin').onclick=()=>zoomAt(1.3,mid());
$('zout').onclick=()=>zoomAt(1/1.3,mid());
$('zreset').onclick=reset;
$('pause').onclick=function(){paused=!paused;document.body.classList.toggle('paused',paused);this.textContent=paused?'▶':'⏸';};
addEventListener('resize',reset);
const fsBtn=$('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';fsBtn.setAttribute('aria-label',on?'Exit fullscreen':'Fullscreen');requestAnimationFrame(reset);}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  if(e.key==='ArrowLeft'||e.key===' '){e.preventDefault();btn.click();}
  else if(e.key==='ArrowRight')pbtn.click();
  else if(e.key==='Home'||e.key==='Escape'&&!fsEl())home();
  else if('1234'.includes(e.key)&&e.key.length===1&&sec>=0&&S().type==='mcq')pick(+e.key-1);
  else if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!abtn.disabled)toggleAns();}});
reset();home();requestAnimationFrame(frame);
})();
</script>
</body></html>
