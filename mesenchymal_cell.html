<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>الخلية الحشوية المتوسطة</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#eef6fb;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #head{position:fixed;top:0;left:0;right:0;height:56px;z-index:8;display:flex;align-items:center;justify-content:center;background:#1f3a52;box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:none}
  #title{color:#fff;font-weight:bold;font-size:clamp(15px,3.6vw,23px);transition:opacity .35s;white-space:nowrap}
  #views{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;z-index:8}
  .nav{width:60px;height:60px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:26px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);padding:0;line-height:1}
  .nav:active{background:#d9ebf7}
  #dots{display:flex;gap:12px;align-items:center}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  #stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 45%,#f6fcff 0%,#cfe8f3 100%)}
  #stage.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;width:1200px;height:800px;transform-origin:0 0}
  #scene{position:absolute;left:0;top:0;width:1200px;height:800px;transition:opacity .35s}
  #cv,#scene img{position:absolute;left:0;top:0;pointer-events:none;-webkit-user-drag:none}
  #cv{left:120px;top:110px;width:960px;height:580px}
  #spr img{will-change:transform,opacity}
  #lab{position:absolute;left:0;top:0;width:1200px;height:800px;overflow:visible;pointer-events:none}
  #lab text{font:bold 30px Tahoma,"Segoe UI",Arial,sans-serif;fill:#000;text-anchor:middle;dominant-baseline:central}
  #lab line{stroke:#000;stroke-width:1.3}
  #lab circle{fill:#000}
  .side{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:7}
  .btn{width:50px;height:50px;border-radius:50%;border:2px solid #222;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.16);padding:0;transition:transform .15s,opacity .2s}
  .btn:active{transform:scale(.92)}
  .btn svg{width:24px;height:24px;fill:none;stroke:#222;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  .btn.off{opacity:.4}
  @media (max-width:700px){.side{top:68px;transform:none}.btn{width:42px;height:42px}.btn svg{width:20px;height:20px}.nav{width:52px;height:52px;font-size:22px}#dots{gap:9px}.dot{width:12px;height:12px}}
</style>
</head>

  </div>
</div>

const DUR=[0,7000,11000];
const dotsEl=$('dots'),dots=[];
TITLES.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i?'':' on');b.title=TITLES[i];b.onclick=()=>go(i);dotsEl.appendChild(b);dots.push(b);});
let page=0,anim=false,t0=0,pending=null;
function setUI(i){dots.forEach((d,k)=>d.classList.toggle('on',k===i));const tt=$('title');tt.style.opacity=0;setTimeout(()=>{tt.textContent=TITLES[i];tt.style.opacity=1;},300);}
function start(i){path=i;v=0;page=i;if(i===0){anim=false;showLabel();return;}anim=true;t0=performance.now();}
function go(i){
  if(i<0||i>=TITLES.length||(i===page&&!anim&&!(i&&v<(i===2?2:1))))return;
  setUI(i);hideLabel();clearTimeout(pending);
  const fresh=path===0&&v===0&&!anim;           /* already showing the original MSC */
  if(fresh){start(i);return;}
  const sc=$('scene');sc.style.opacity=0;anim=false;
  pending=setTimeout(()=>{path=0;v=0;sc.style.opacity=1;pending=setTimeout(()=>start(i),i?450:0);},380);
}
$('next').onclick=()=>go((page+1)%TITLES.length);
$('prev').onclick=()=>{if(page>0)go(page-1);};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('next').click();if(e.key==='ArrowRight')$('prev').click();});
function frame(now){
  if(anim){const k=clamp((now-t0)/DUR[path]);v=path===1?k:2*k;if(k>=1)anim=false;}
  render(now/1000);updLabels();requestAnimationFrame(frame);
}

/* ================= view: fit, zoom, pan, pinch, fullscreen (template) ================= */
const world=$('world'),stage=$('stage');
let fit=1,zoom=1,px=0,py=0;
const headH=()=>$('head').offsetHeight+6,footH=()=>$('views').offsetHeight+28;
function apply(){world.style.transform=`translate(${px.toFixed(1)}px,${py.toFixed(1)}px) scale(${(fit*zoom).toFixed(4)})`;}
function fitView(){const w=stage.clientWidth,h=stage.clientHeight-headH()-footH();fit=Math.min(w/1200,h/800);zoom=1;px=(w-1200*fit)/2;py=headH()+(h-800*fit)/2;apply();
  LB.forEach(l=>{l.tx.style.fontSize=Math.max(30,15/fit).toFixed(1)+'px';l.bb=null;});}
function zoomAt(k,cx,cy){const nz=clamp(zoom*k,.5,8);k=nz/zoom;px=cx-(cx-px)*k;py=cy-(cy-py)*k;zoom=nz;apply();}
const ctr=()=>[stage.clientWidth/2,(stage.clientHeight+headH()-footH())/2];
$('zin').onclick=()=>zoomAt(1.3,...ctr());
$('zout').onclick=()=>zoomAt(1/1.3,...ctr());
const fsIco=$('fsIco');let pseudo=false;
const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement||pseudo);
const setFsIcon=()=>{fsIco.innerHTML=isFs()?'<path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/>':'<path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/>';
  $('fs').title=isFs()?'الخروج من ملء الشاشة':'ملء الشاشة';};
function enterFs(){const e=document.documentElement,r=e.requestFullscreen||e.webkitRequestFullscreen||e.webkitRequestFullScreen||e.msRequestFullscreen;
  const fallback=()=>{pseudo=true;document.body.classList.add('pseudo');window.scrollTo(0,1);setFsIcon();setTimeout(fitView,300);};
  if(!r||!(document.fullscreenEnabled||document.webkitFullscreenEnabled)){fallback();return;}
  try{const pr=r.call(e,{navigationUI:'hide'});if(pr&&pr.catch)pr.catch(fallback);}catch(err){fallback();}}
function exitFs(){if(pseudo){pseudo=false;document.body.classList.remove('pseudo');setFsIcon();fitView();return;}
  const d=document,x=d.exitFullscreen||d.webkitExitFullscreen||d.webkitCancelFullScreen||d.msExitFullscreen;if(x)x.call(d);}
$('fs').onclick=()=>isFs()?exitFs():enterFs();
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{setFsIcon();setTimeout(fitView,60);}));
setFsIcon();
const P=new Map(),loc=e=>[e.clientX,e.clientY];
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);P.set(e.pointerId,loc(e));stage.classList.add('drag');});
stage.addEventListener('pointermove',e=>{
  if(!P.has(e.pointerId))return;const prev=new Map(P),c=loc(e);P.set(e.pointerId,c);
  if(P.size===1){const o=prev.get(e.pointerId);px+=c[0]-o[0];py+=c[1]-o[1];apply();}
  else{const id=[...P.keys()].slice(0,2),a0=prev.get(id[0]),b0=prev.get(id[1]),a1=P.get(id[0]),b1=P.get(id[1]);
    const d0=Math.hypot(a0[0]-b0[0],a0[1]-b0[1])||1,d1=Math.hypot(a1[0]-b1[0],a1[1]-b1[1]);
    px+=(a1[0]+b1[0]-a0[0]-b0[0])/2;py+=(a1[1]+b1[1]-a0[1]-b0[1])/2;zoomAt(d1/d0,(a1[0]+b1[0])/2,(a1[1]+b1[1])/2);}
});
const up=e=>{P.delete(e.pointerId);if(!P.size)stage.classList.remove('drag');};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY);},{passive:false});
stage.addEventListener('dblclick',fitView);
addEventListener('resize',fitView);addEventListener('orientationchange',()=>setTimeout(fitView,300));

fitView();requestAnimationFrame(frame);
const sc=$('scene');sc.style.opacity=0;setTimeout(()=>{sc.style.transition='opacity .9s';sc.style.opacity=1;setTimeout(()=>{sc.style.transition='opacity .35s';showLabel();},950);},60);
})();
</script>

   مبدأ الأمان: أي خطأ هنا يُخفي زر الوزاريات فقط ولا يؤثر على المحاكاة. */
(function(){try{
var D=window.MOE_MIN_DATA;if(!D||!D.qs||!D.qs.length)return;
var stage=document.getElementById('stage')||document.body;

  if(a.ol)h+='<ol>'+a.ol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';

function render(){try{render0();}catch(err){qOpen=false;qp.classList.remove('on');$('qbtn').style.display='none';if(window.console)console.warn('MoeLab ministerial:',err);}}
function render0(){
  var L=list(),q=L[qi];
  [].forEach.call(qchips.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===qsec);});
  var n=minCount(q);
  var h='<div class="qc'+(qrev?' rev':'')+'"><div class="qtop"><span class="qty">'+esc(q.type)+'</span>'+
    (n>=3?'<span class="qfire">🔥 تكرر وزارياً '+AR(n)+' مرات</span>':'')+'<span class="qnum">'+AR(qi+1)+' / '+AR(L.length)+'</span></div>';
  if(q.tags&&q.tags.length)h+='<div class="tags">'+q.tags.map(tagH).join('')+'</div>';
  h+='<div class="qq">'+esc(q.q).replace(/\{([^}]*)\}/g,'<span class="blank">$1</span>')+'</div>';
  if(q.opts)h+='<div class="opts">'+q.opts.map(function(o,k){return '<button type="button" class="opt'+(qrev&&k===q.ans?' ok':'')+'" data-k="'+k+'">'+'أبجد'[k]+' ) '+esc(o)+'</button>';}).join('')+'</div>';
  if(q.items)h+='<ol class="items">'+q.items.map(function(it){var t=it.tags||[];return '<li>'+esc(it.t)+(t.length?'<div class="tags">'+t.map(tagH).join('')+'</div>':'')+'<div class="ia">'+esc(it.a||q.common||'')+'</div></li>';}).join('')+'</ol>';
  if(q.a)h+='<div class="ans"><div class="h">✔ الجواب</div>'+ansH(q.a)+'</div>';
  if(canSee(q.hl))h+='<div class="see"><button type="button" id="qsee">📍 شوف '+esc(NAMES[q.hl]||'')+' بالمحاكاة</button></div>';
  qbody.innerHTML=h+'</div>';qbody.scrollTop=0;
  qa.textContent=qrev?'إخفاء الحل':'إظهار الحل 💡';qa.classList.toggle('hide',qrev);
  qprev.disabled=qi===0;qnext.disabled=qi>=L.length-1;
  [].forEach.call(qbody.querySelectorAll('.opt'),function(b){b.onclick=function(){if(+b.dataset.k===q.ans){qrev=true;render();}else b.classList.add('no');};});
  var s=$('qsee');if(s)s.onclick=function(){hlStart(q.hl);};
}
qa.onclick=function(){qrev=!qrev;render();};
qprev.onclick=function(){if(qi>0){qi--;qrev=false;render();}};
qnext.onclick=function(){if(qi<list().length-1){qi++;qrev=false;render();}};
function show(on){qOpen=on;qp.classList.toggle('on',on);if(on)render();}
$('qbtn').onclick=function(){hlStop();show(true);};
$('qx').onclick=function(){show(false);};

/* ---------- highlight inside the simulation (only if the sim registered window.MOE_SIM) ---------- */
var HL=null;
function els(keys,map){var a=[];keys.forEach(function(k){(map[k]||[]).forEach(function(e){a.push(e);});});return a;}
function bbox(arr){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;arr.forEach(function(e){try{var b=e.getBBox();if(!b.width&&!b.height)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}catch(_){}});return x0<x1?{x0:x0,y0:y0,x1:x1,y1:y1}:null;}
var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function hlStart(k){
  var s=sim();if(!canSee(k))return;show(false);
  try{s.finish();}catch(_){}
  var parts=s.groups[k],on=els(parts,s.parts),labs=els(parts,s.labels||{});
  var all=els(Object.keys(s.parts),s.parts),allL=els(Object.keys(s.labels||{}),s.labels||{});
  var v=s.view.get(),vb=s.view.box,b=bbox(on.concat(labs)),to=v;
  if(b){var pad=30,cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,ks=Math.max(1,Math.min(2.6,vb[2]/(b.x1-b.x0+2*pad),vb[3]/(b.y1-b.y0+2*pad)));
    to=[ks,vb[0]+vb[2]/2-cx*ks,vb[1]+vb[3]/2-cy*ks];}
  HL={k:k,s:s,on:new Set(on),labs:new Set(labs),all:all,allL:allL,glows:els(parts,s.glows||{}),t0:performance.now(),from:v,to:to};
  $('hlname').textContent='📍 '+(NAMES[k]||'');
  $('hlbar').classList.add('on');document.body.classList.add('hlmode');
  requestAnimationFrame(tick);
}
function hlStop(){if(!HL)return;var s=HL.s;HL=null;$('hlbar').classList.remove('on');document.body.classList.remove('hlmode');try{s.view.reset();}catch(_){}}
function tick(ms){
  if(!HL)return;
  try{
    var u=(ms-HL.t0)/1000,z=ease(Math.max(0,Math.min(1,u/.8))),L=function(a,b){return a+(b-a)*z;};
    HL.s.view.set(L(HL.from[0],HL.to[0]),L(HL.from[1],HL.to[1]),L(HL.from[2],HL.to[2]));
    var p=.5+.5*Math.sin(u*4.2);
    HL.all.forEach(function(e){if(!HL.on.has(e))e.setAttribute('opacity','0.18');});
    HL.allL.forEach(function(e){e.setAttribute('opacity',HL.labs.has(e)?'1':'0.15');});
    HL.glows.forEach(function(g){g.style.display='';g.setAttribute('opacity',(.35+.45*p).toFixed(2));});
    if(HL.s.pulse)HL.s.pulse(HL.k,p);
  }catch(e){hlStop();return;}
  requestAnimationFrame(tick);
}
$('hlback').onclick=function(){hlStop();show(true);};
/* any simulation button stops the highlight */
['go','prev','zreset'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',hlStop,true);});

/* keyboard: while the panel is open the arrows move between questions, not the simulation */
window.addEventListener('keydown',function(e){
  if(qOpen){e.stopImmediatePropagation();e.preventDefault();
    if(e.key==='ArrowLeft')qnext.click();else if(e.key==='ArrowRight')qprev.click();else if(e.key==='Escape')show(false);}
  else if(HL&&e.key==='Escape'){hlStop();}
},true);
}catch(err){try{var b=document.getElementById('qbtn');if(b)b.style.display='none';var p=document.getElementById('qp');if(p)p.style.display='none';}catch(_){} if(window.console)console.warn('MoeLab ministerial:',err);}})();

</script>
