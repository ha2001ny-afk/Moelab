<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>التكاثر في الكلاميدوموناس</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:14px;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav{width:54px;height:54px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:24px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);flex:none}
  .nav:active{background:#d9ebf7}
  .nav:focus-visible,.dot:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  #dots{display:flex;gap:8px;align-items:center}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s;flex:none}
  .sepr{width:3px;height:30px;border-radius:2px;background:#b5651d;margin:0 4px;flex:none}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .bt{fill:#fff;font-weight:bold;font-size:25px;text-anchor:middle;dominant-baseline:central}
  .lb{fill:#1f3a52;font-size:21px;font-weight:bold;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
  .fla{fill:none;stroke:#2f5d22;stroke-linecap:round;stroke-linejoin:round}
  .wal{fill:none;stroke:#4f7f34;stroke-linecap:round}
  #bn{transition:fill .5s}
</style>
</head>
<body>
<div id="top"><div id="title">التكاثر الجنسي واللاجنسي في الكلاميدوموناس</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 900 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gCyt" cx=".45" cy=".4" r=".65"><stop offset="0" stop-color="#fbfff4"/><stop offset="1" stop-color="#dcefc9"/></radialGradient>
        <linearGradient id="gChlA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3e98a"/><stop offset=".5" stop-color="#8cc64e"/><stop offset="1" stop-color="#4f9426"/></linearGradient>
        <linearGradient id="gChlB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3e6c2"/><stop offset=".5" stop-color="#6cc28a"/><stop offset="1" stop-color="#2a8656"/></linearGradient>
        <radialGradient id="gBlob" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#d4f0a4"/><stop offset="1" stop-color="#6aa835"/></radialGradient>
        <radialGradient id="gNuc" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#e6dbfa"/><stop offset="1" stop-color="#8e72cf"/></radialGradient>
        <radialGradient id="gSpore" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="66" fx="-22" fy="-24"><stop offset="0" stop-color="#8f6944"/><stop offset=".7" stop-color="#432916"/><stop offset="1" stop-color="#24140a"/></radialGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="المرحلة السابقة">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="المرحلة التالية">◀</button>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,D2R=PI/180,DEG=180/PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2),f3=v=>v.toFixed(3);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const att=(e,a)=>{for(const k in a)e.setAttribute(k,typeof a[k]==='number'?f1(a[k]):a[k]);};
const lerpAng=(a,b,u)=>{const d=((b-a)%360+540)%360-180;return a+d*u;};
let seed=11;const rnd=()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rr=(a,b)=>a+(b-a)*rnd();
const ptsD=pts=>pts.map((p,i)=>(i?'L':'M')+f1(p[0])+','+f1(p[1])).join('');
const show=(e,op)=>{if(op<.01){e.style.display='none';return false;}e.style.display='';e.setAttribute('opacity',f2(op));return true;};

const STG=[
  ['خلية الكلاميدوموناس (س)','#2e8b57'],
  ['تكوين الأمشاج (س)','#e0902a'],
  ['تحرر الأمشاج (س)','#2f6fd6'],
  ['الإخصاب','#c4423a'],
  ['زيجة (2س)','#7b4bb3'],
  ['بوغ زيجي (2س)','#8b5a2b'],
  ['انقسام اختزالي','#b5651d'],
  ['أبواغ (س)','#2a9d8f'],
  ['تكاثر لاجنسي: تكوين خلايا بنوية','#1f7a8c'],
  ['خلايا بنوية','#5e8f1f']];
const DUR=[5,9,7.5,7,5,6.5,7,8.5,11,9];

/* ---------------- cell geometry (local units, front = top) ---------------- */
function ellPts(rx,ry,cx,cy,a0,a1,n){const p=[];for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*D2R;p.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}return p;}
const CUP=ptsD([...ellPts(45,57,0,0,220,-40,44),...ellPts(27,33,0,-8,-40,220,44)])+'Z';
const WL='M0,-62A50,62 0 0 0 0,62',WR='M0,-62A50,62 0 0 1 0,62';
const STARCH=[205,170,140,115,65,40,10,-25].map(a=>[36*Math.cos(a*D2R),-3+47*Math.sin(a*D2R),a+90]);

const world=G(view),sexG=G(world),Lmid=G(sexG),Ltop=G(sexG),labG=G(sexG);

/* Chlamydomonas cell */
function Chlamy(parent,o){o=o||{};const g=G(parent);
  const sh=o.sh?el('ellipse',{cx:0,cy:12,rx:48,ry:58,fill:'#1f3a52',opacity:.14,filter:'url(#blur)'},g):null;
  const fg=G(g),body=G(g);
  const cyt=el('ellipse',{rx:50,ry:62,fill:'url(#gCyt)'},body);
  const cont=G(body);
  el('path',{d:CUP,fill:`url(#${o.b?'gChlB':'gChlA'})`,stroke:o.b?'#1f6b45':'#3d7a1f','stroke-width':1.6,'stroke-linejoin':'round'},cont);
  STARCH.forEach(([x,y,r])=>el('ellipse',{cx:f1(x),cy:f1(y),rx:4.6,ry:2.8,transform:`rotate(${f1(r)} ${f1(x)} ${f1(y)})`,fill:'#fbfdf0',stroke:'#8fb35a','stroke-width':1},cont));
  el('circle',{cx:0,cy:41,r:7.5,fill:'#d6ec9e',stroke:'#fbfdf0','stroke-width':3},cont);
  el('circle',{cx:0,cy:41,r:9.6,fill:'none',stroke:'#8fb35a','stroke-width':.9},cont);
  el('circle',{cx:-9,cy:-48,r:4,fill:'#eef8ff',stroke:'#8fb4cc','stroke-width':1},cont);
  el('circle',{cx:9,cy:-48,r:4,fill:'#eef8ff',stroke:'#8fb4cc','stroke-width':1},cont);
  el('ellipse',{cx:-42,cy:-24,rx:3.6,ry:6.5,transform:'rotate(18 -42 -24)',fill:'#e0322b',stroke:'#8e1712','stroke-width':.8},cont);
  const nr=o.d?16:13;
  el('circle',{cx:0,cy:-6,r:nr,fill:'url(#gNuc)',stroke:'#5d43a0','stroke-width':1.6},cont);
  el('circle',{cx:0,cy:-6,r:nr*.38,fill:'#4b2f8a'},cont);
  const wl=G(body),wr=G(body);
  const walls=[el('path',{d:WL,class:'wal'},wl),el('path',{d:WR,class:'wal'},wr),el('path',{d:'M-8,-61Q0,-71 8,-61',class:'wal'},wr)];
  const fl=(o.n===4?[-128,-106,-74,-52]:[-116,-64]).map((a,i)=>({a,s:a<-90?-1:1,x:a<-90?-3:3,e:el('path',{class:'fla'},fg),pts:null}));
  return{g,sh,cyt,cont,wl,wr,walls,fl,x:0,y:0,s:1,r:0};
}
function setC(c,x,y,s,r,op,fl,t,ph){
  if(!show(c.g,op))return;ph=ph||0;
  c.x=x;c.y=y;c.s=s;c.r=r;
  c.g.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) rotate(${f1(r)}) scale(${f3(s)})`);
  const ww=f2(Math.max(3,1.3/s));c.walls.forEach(w=>w.setAttribute('stroke-width',ww));
  const fw=f2(Math.max(2.4,1.5/s));
  c.fl.forEach(f=>{if(fl<.02){f.e.setAttribute('opacity',0);return;}f.e.setAttribute('opacity',1);f.e.setAttribute('stroke-width',fw);
    const b=Math.sin(t*3.2+ph),ang=(f.a+f.s*26*b)*D2R,L=88*fl,dx=Math.cos(ang),dy=Math.sin(ang),pts=[];
    for(let k=0;k<=14;k++){const q=k/14,w=(Math.sin(q*PI*1.5-t*4+ph)*7-f.s*b*10*q)*q;pts.push([f.x+dx*L*q-dy*w,-60+dy*L*q+dx*w]);}
    f.pts=pts;f.e.setAttribute('d',ptsD(pts));});
}
function toW(c,lx,ly){const a=c.r*D2R,co=Math.cos(a),si=Math.sin(a);return[c.x+c.s*(lx*co-ly*si),c.y+c.s*(lx*si+ly*co)];}

/* dividing protoplast blobs */
function Blob(parent,nuc){const g=G(parent);return{g,e:el('ellipse',{fill:'url(#gBlob)',stroke:'#3d7a1f','stroke-width':1.3},g),
  n:nuc?el('circle',{fill:'url(#gNuc)',stroke:'#5d43a0','stroke-width':.7},g):null};}
function setB(b,x,y,r,a,op){if(op<.01||r<.3){b.g.style.display='none';return;}b.g.style.display='';b.g.setAttribute('opacity',f2(op));
  att(b.e,{cx:x,cy:y,rx:r,ry:r*a});if(b.n)att(b.n,{cx:x,cy:y,r:r*.3});}
function tree(pts){const c=[pts.reduce((a,p)=>a+p[0],0)/pts.length,pts.reduce((a,p)=>a+p[1],0)/pts.length];
  if(pts.length===1)return{c,k:null};
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),sx=Math.max(...xs)-Math.min(...xs),sy=Math.max(...ys)-Math.min(...ys),ax=sx>=sy?0:1;
  const s=[...pts].sort((a,b)=>a[ax]-b[ax]||a[1-ax]-b[1-ax]),h=s.length/2;
  return{c,k:[tree(s.slice(0,h)),tree(s.slice(h))]};}
function levels(root){const L=[[root]];while(L[L.length-1][0].k)L.push(L[L.length-1].flatMap(n=>n.k));return L;}
function divide(pool,LV,R,A,prog,op){const n=LV.length-1;prog=clamp(prog,0,n);let k=Math.floor(prog),f=ease(prog-k);if(k>=n){k=n-1;f=1;}
  let i=0;LV[k].forEach(nd=>nd.k.forEach(ch=>setB(pool[i++],lerp(nd.c[0],ch.c[0],f),lerp(nd.c[1],ch.c[1],f),lerp(R[k],R[k+1],f),lerp(A[k],A[k+1],f),op)));
  for(;i<pool.length;i++)setB(pool[i],0,0,0,1,0);}

/* ================= mother cell ================= */
const MX=450,MY=420,MS=1.9;
const M=Chlamy(Lmid,{sh:1});
const bG=G(Lmid);
const P16=[[-20,-39],[0,-39],[20,-39],[-34,-13],[-17,-13],[0,-13],[17,-13],[34,-13],[-34,13],[-17,13],[0,13],[17,13],[34,13],[-20,39],[0,39],[20,39]];
const LV16=levels(tree(P16)),R16=[44,30,20,13,8.4],A16=[1.23,1.1,1.04,1,1];
const pool16=P16.map(()=>Blob(bG,true));

/* labels (as in the textbook figure) */
function Label(txt,x,y,ax,tg){const g=G(labG);
  const ln=el('line',{stroke:'#1f3a52','stroke-width':2},g),dt=el('circle',{r:4,fill:'#1f3a52'},g),tx=el('text',{class:'lb',x,y},g);
  tx.textContent=txt;return{ln,dt,x,y,ax,tg};}
const LAB=[
  Label('سوط',705,160,676,()=>{const f=M.fl[1];return f.pts?toW(M,f.pts[8][0],f.pts[8][1]):toW(M,20,-90);}),
  Label('بلاستيدة خضراء',728,410,654,()=>toW(M,40,18)),
  Label('حبيبات نشاء',728,560,662,()=>toW(M,STARCH[5][0],STARCH[5][1])),
  Label('نواة وبداخلها نوية',178,320,272,()=>toW(M,-7,-8))];

/* ================= gametes ================= */
const GA=LV16[4].map(nd=>{const c=Chlamy(Lmid,{}),sp=[MX+MS*nd.c[0],MY+MS*nd.c[1]];
  let th=(Math.hypot(nd.c[0],nd.c[1])>1?Math.atan2(nd.c[1],nd.c[0]):-PI/2)+rr(-.3,.3);const d=rr(150,290);
  const tg=[clamp(sp[0]+d*Math.cos(th),70,830),clamp(sp[1]+d*Math.sin(th),130,650)];
  return{c,sp,tg,th:Math.atan2(tg[1]-sp[1],tg[0]-sp[0]),ph:rr(0,6),di:rnd()};});
const GB=[...Array(8)].map(()=>{const c=Chlamy(Lmid,{b:1}),sp=[rr(1000,1150),rr(160,640)],tg=[rr(570,830),rr(140,640)];
  return{c,sp,tg,th:Math.atan2(tg[1]-sp[1],tg[0]-sp[0]),ph:rr(0,6),di:rnd()};});
const near=(arr,q)=>arr.reduce((b,g,i)=>Math.hypot(g.tg[0]-q[0],g.tg[1]-q[1])<Math.hypot(arr[b].tg[0]-q[0],arr[b].tg[1]-q[1])?i:b,0);
const ia=near(GA,[300,420]),ib=near(GB,[620,420]);

/* ================= zygote ================= */
const Z=Chlamy(Lmid,{sh:1,n:4,d:1});

/* ================= zygospore ================= */
const spG=G(Lmid);
const disc=el('circle',{r:66,fill:'url(#gSpore)'},spG);
const tG=G(spG);
const P4=[[-22,-22],[22,-22],[-22,22],[22,22]],LV4=levels(tree(P4));
const pool4=P4.map(()=>Blob(tG,false));
const nucs=P4.map(()=>{const g=G(tG);return{a:el('circle',{fill:'url(#gNuc)',stroke:'#5d43a0','stroke-width':.8},g),b:el('circle',{fill:'#4b2f8a'},g)};});
const LH=PI*66;
const halves=[0,1].map(j=>{const g=G(spG);
  const fill=el('path',{d:j?'M0,-66A66,66 0 0 1 0,66Z':'M0,-66A66,66 0 0 0 0,66Z',fill:'url(#gSpore)'},g);
  const sg=G(g);for(let i=0;i<36;i++){let x,y;do{x=rr(1,62);y=rr(-62,62);}while(x*x+y*y>59*59);
    el('circle',{cx:f1(j?x:-x),cy:f1(y),r:f2(rr(1,2.4)),fill:rnd()<.65?'#b8925f':'#170b04'},sg);}
  const arc=el('path',{d:j?'M0,-66A66,66 0 0 1 0,66':'M0,-66A66,66 0 0 0 0,66',fill:'none',stroke:'#3a2414','stroke-linecap':'round'},g);
  return{g,fill,sg,arc};});
const crack=el('path',{d:'M0,-66L5,-44L-4,-20L6,4L-3,30L4,50L0,66',fill:'none',stroke:'#fff1cf','stroke-width':2.4,'stroke-linecap':'round','stroke-linejoin':'round'},spG);
const CL=crack.getTotalLength();

/* ================= spores (n) ================= */
const S4=LV4[2].map(nd=>({c:Chlamy(Ltop,{}),lc:nd.c,th:Math.atan2(nd.c[1],nd.c[0]),tg:[nd.c[0]<0?240:660,nd.c[1]<0?255:575],ph:rr(0,6)}));

const glow=el('circle',{cx:450,cy:400,r:75,fill:'url(#gGlow)',opacity:0},Ltop);

/* ================= asexual reproduction ================= */
const asxG=G(world);
const M2=Chlamy(asxG,{sh:1}),b2G=G(asxG);
const PA=[[-21,-22],[21,-22],[-21,22],[21,22]],LVA=levels(tree(PA));
const poolA=PA.map(()=>Blob(b2G,true));
const D4=LVA[2].map(nd=>({c:Chlamy(asxG,{}),lc:nd.c,th:Math.atan2(nd.c[1],nd.c[0]),tg:[nd.c[0]<0?240:660,nd.c[1]<0?260:575],ph:rr(0,6)}));
/* divider card */
const card=el('g',{opacity:0},world);
el('rect',{x:-210,y:-62,width:420,height:124,rx:26,fill:'#1f7a8c',stroke:'#fff','stroke-width':4},card);
el('rect',{x:-200,y:-52,width:400,height:104,rx:20,fill:'none',stroke:'#cdeef2','stroke-width':1.5,'stroke-dasharray':'6 6'},card);
const ct=el('text',{class:'bt',x:0,y:0,style:'font-size:40px'},card);ct.textContent='تكاثر لاجنسي';
/* banner */
const bn=el('rect',{id:'bn',x:60,y:14,width:780,height:58,rx:20,fill:'#2e8b57'}),bt=el('text',{class:'bt',x:450,y:43});

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:1,dur:DUR[0]};
let stage=0,T=0,t0=0,last=performance.now(),paused=false,P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

/* ---------------- render ---------------- */
function render(t){
  const u=k=>clamp(P-k,0,1),u1=u(0),u2=u(1),u3=u(2),u4=u(3),u5=u(4),u6=u(5),u7=u(6),u8=u(7),u9=u(8),u10=u(9);

  /* ===== asexual reproduction (after a divider card) ===== */
  if(show(sexG,1-sm(u9,.04,.2)))sexG.setAttribute('transform',`translate(${f1(-520*sm(u9,0,.2))} 0)`);
  if(show(card,sm(u9,.06,.13)*(1-sm(u9,.26,.33))))card.setAttribute('transform',`translate(450 360) scale(${f2(.85+.15*sm(u9,.06,.15))})`);
  if(show(asxG,sm(u9,.22,.32))){
    asxG.setAttribute('transform',`translate(${f1(560*(1-sm(u9,.22,.4)))} 0)`);
    const cm=1-sm(u9,.4,.5),ar=3*Math.sin(t*.6)*cm,ay=MY+5*Math.sin(t*.9)*cm;
    setC(M2,MX,ay,MS,ar,1-sm(u10,.38,.46),1-sm(u9,.4,.5),t);
    const ac=f2(1-sm(u9,.48,.6));M2.cont.setAttribute('opacity',ac);M2.sh.setAttribute('opacity',f2(.14*(1-sm(u10,0,.2))));M2.cyt.setAttribute('opacity',ac);
    const ak=sm(u10,.02,.35),awo=f2(1-sm(u10,.15,.38));
    M2.wl.setAttribute('transform',`translate(${f1(-38*ak)} ${f1(12*ak)}) rotate(${f1(-22*ak)})`);M2.wl.setAttribute('opacity',awo);
    M2.wr.setAttribute('transform',`translate(${f1(38*ak)} ${f1(12*ak)}) rotate(${f1(22*ak)})`);M2.wr.setAttribute('opacity',awo);
    b2G.setAttribute('transform',`translate(${f1(MX)} ${f1(ay)}) rotate(${f1(ar)}) scale(${MS})`);
    divide(poolA,LVA,[44,30,19],[1.23,1.1,1],2*clamp((u9-.6)/.36,0,1),sm(u9,.48,.6)*(1-sm(u10,.03,.14)));
    const dm=sm(u10,.12,.7),dg=sm(u10,.5,1),du=sm(u10,.7,1),di=sm(u10,.8,1);
    D4.forEach(d=>{const x0=MX+MS*d.lc[0],y0=MY+MS*d.lc[1],ww=8*Math.sin(dm*PI*2+d.ph)*Math.sin(dm*PI);
      setC(d.c,lerp(x0,d.tg[0],dm)+ww+5*Math.sin(t*.7+d.ph)*di,lerp(y0,d.tg[1],dm)+4*Math.cos(t*.9+d.ph)*di,lerp(.7,1.1,dg),
        lerpAng(d.th*DEG+90,0,du)+5*Math.sin(t*.8+d.ph)*di,sm(u10,.03,.14),sm(u10,.05,.2),t,d.ph);});
  }

  /* ===== mother cell → 16 gametes inside the wall ===== */
  const calm=1-sm(u2,0,.2),mr=3*Math.sin(t*.6)*calm,my=MY+5*Math.sin(t*.9)*calm;
  setC(M,MX,my,MS,mr,1-sm(u3,.38,.46),1-sm(u2,0,.15),t);
  const co=1-sm(u2,.12,.3);M.cont.setAttribute('opacity',f2(co));M.sh.setAttribute('opacity',f2(.14*co));M.cyt.setAttribute('opacity',f2(co));
  const kr=sm(u3,.02,.35),wo=f2(1-sm(u3,.15,.38));
  M.wl.setAttribute('transform',`translate(${f1(-38*kr)} ${f1(12*kr)}) rotate(${f1(-22*kr)})`);M.wl.setAttribute('opacity',wo);
  M.wr.setAttribute('transform',`translate(${f1(38*kr)} ${f1(12*kr)}) rotate(${f1(22*kr)})`);M.wr.setAttribute('opacity',wo);
  bG.setAttribute('transform',`translate(${f1(MX)} ${f1(my)}) rotate(${f1(mr)}) scale(${MS})`);
  divide(pool16,LV16,R16,A16,4*clamp((u2-.32)/.64,0,1),sm(u2,.12,.3)*(1-sm(u3,.03,.14)));

  const lo=sm(u1,.15,.45)*(1-sm(u2,0,.1));
  if(show(labG,lo))LAB.forEach(L=>{const p=L.tg();att(L.ln,{x1:p[0],y1:p[1],x2:L.ax,y2:L.y});att(L.dt,{cx:p[0],cy:p[1]});});

  /* ===== gametes released, other strain arrives, fusion ===== */
  const gIn=sm(u3,.03,.14),gfl=sm(u3,.05,.2),out=1-sm(u4,0,.25),mv=sm(u4,.1,.5),fz=sm(u4,.55,.85),fo=1-sm(u4,.65,.85);
  const swim=(g,m,idle)=>{let x=lerp(g.sp[0],g.tg[0],m),y=lerp(g.sp[1],g.tg[1],m);const w=9*Math.sin(m*PI*3+g.ph)*Math.sin(m*PI);
    x+=-Math.sin(g.th)*w+6*Math.sin(t*.7+g.ph)*idle;y+=Math.cos(g.th)*w+5*Math.cos(t*.9+g.ph)*idle;
    return[x,y,g.th*DEG+90+8*Math.sin(t*.8+g.ph)*idle];};
  GA.forEach((g,i)=>{let[x,y,r]=swim(g,sm(u3,.12+.15*g.di,.6+.15*g.di),sm(u3,.55,.85)),s=.32,op=gIn;
    if(i===ia){x=lerp(x,360+55*fz,mv);y=lerp(y,400,mv);r=lerpAng(r,90,mv);s=lerp(.32,1.5,mv);op*=fo;}else op*=out;
    setC(g.c,x,y,s,r,op,gfl,t,g.ph);});
  GB.forEach((g,i)=>{let[x,y,r]=swim(g,sm(u3,.3+.25*g.di,.72+.22*g.di),sm(u3,.85,1)),s=.32,op=sm(u3,.3,.45);
    if(i===ib){x=lerp(x,540-55*fz,mv);y=lerp(y,400,mv);r=lerpAng(r,-90,mv);s=lerp(.32,1.5,mv);op*=fo;}else op*=out;
    setC(g.c,x,y,s,r,op,1,t,g.ph);});
  glow.setAttribute('opacity',f2(Math.sin(PI*sm(u4,.5,.95))));

  /* ===== zygote (2n) with four flagella ===== */
  const a5=sm(u5,0,.25)*(1-sm(u6,0,.25)),zx=450+60*Math.sin(t*.55)*a5,zy=400+14*Math.sin(t*1.1)*a5;
  setC(Z,zx,zy,lerp(1.5,1.8,sm(u4,.65,1)),lerp(90,0,sm(u4,.82,1))+6*Math.cos(t*.55)*a5,
       sm(u4,.65,.85)*(1-sm(u6,.82,.95)),sm(u4,.78,.95)*(1-sm(u6,0,.3)),t);

  /* ===== zygospore → meiosis → spores ===== */
  if(show(spG,sm(u6,.28,.32))){
    spG.setAttribute('transform',`translate(${f1(zx)} ${f1(zy)}) scale(1.8)`);
    const dr=sm(u6,.3,.52),sw=f2(lerp(1.5,8,sm(u6,.45,.8))),fop=sm(u6,.45,.8)*lerp(1,.3,sm(u7,0,.2)),cr=sm(u8,.05,.12),k=sm(u8,.1,.45);
    disc.setAttribute('opacity',f2(fop*(1-cr)));
    halves.forEach((h,j)=>{const sg=j?1:-1;
      h.arc.setAttribute('stroke-dasharray',`${f1(dr*LH)} ${f1(LH+20)}`);h.arc.setAttribute('stroke-width',sw);
      h.fill.setAttribute('opacity',f2(cr*lerp(fop,.95,sm(u8,.05,.2))));h.sg.setAttribute('opacity',f2(sm(u6,.55,.85)*lerp(.9,.35,sm(u7,0,.2))));
      h.g.setAttribute('transform',`translate(${f1(sg*55*k)} ${f1(18*k)}) rotate(${f1(sg*28*k)})`);show(h.g,1-sm(u8,.28,.5));});
    const c2=sm(u8,0,.1);crack.setAttribute('stroke-dasharray',`${f1(c2*CL)} ${f1(CL+10)}`);crack.setAttribute('opacity',f2(c2>.01?1-sm(u8,.1,.2):0));
    if(show(tG,sm(u7,0,.2)*(1-sm(u8,.25,.4)))){
      divide(pool4,LV4,[54,36,24],[1,1,1],2*clamp((u7-.72)/.23,0,1),1);
      const n1=sm(u7,.25,.5),n2=sm(u7,.5,.72),nr=n2>0?lerp(10,8,n2):lerp(14,10,n1),c0=LV4[0][0].c;
      nucs.forEach((n,j)=>{const p1=LV4[1][j>>1].c,p2=LV4[2][j].c,x=lerp(lerp(c0[0],p1[0],n1),p2[0],n2),y=lerp(lerp(c0[1],p1[1],n1),p2[1],n2);
        att(n.a,{cx:x,cy:y,r:nr});att(n.b,{cx:x,cy:y,r:nr*.38});});
    }
  }
  const sIn=sm(u8,.25,.4),sfl=sm(u8,.3,.5),m8=sm(u8,.35,.85),gr=sm(u8,.6,1),up=sm(u8,.75,1),id8=sm(u8,.85,1);
  S4.forEach(s=>{const x0=450+1.8*s.lc[0],y0=400+1.8*s.lc[1],w=8*Math.sin(m8*PI*2+s.ph)*Math.sin(m8*PI);
    const x=lerp(x0,s.tg[0],m8)+w+5*Math.sin(t*.7+s.ph)*id8,y=lerp(y0,s.tg[1],m8)+4*Math.cos(t*.9+s.ph)*id8;
    setC(s.c,x,y,lerp(.8,1.15,gr),lerpAng(s.th*DEG+90,0,up)+5*Math.sin(t*.8+s.ph)*id8,sIn,sfl,t,s.ph);});
}
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render(T);requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');
STG.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','المرحلة '+(i+1));b.onclick=()=>go(i);if(i===8){const sp=document.createElement('span');sp.className='sepr';dotsEl.appendChild(sp);}dotsEl.appendChild(b);});
function setUI(){bn.style.fill=STG[stage][1];bt.removeAttribute('textLength');bt.textContent=STG[stage][0];
  try{if(bt.getComputedTextLength()>750){bt.setAttribute('textLength',750);bt.setAttribute('lengthAdjust','spacingAndGlyphs');}}catch(e){}
  [...dotsEl.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+STG.length)%STG.length;const tgt=i+1;
  if(tgt<=P+1e-3)P=i;          /* going back or replaying: restart that stage */
  let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  if(tgt-P>1.01)d*=.6;
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1.2,d);
  setUI();}
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(stage-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(stage+1);if(e.key==='ArrowRight')go(stage-1);});
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:400});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:400});
document.getElementById('zreset').onclick=reset;
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
go(0);render(0);requestAnimationFrame(frame);
})();
</script>
