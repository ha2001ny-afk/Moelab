<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أمراض الجهاز الهضمي</title>
<style>
  /* Same plate pattern as the vitamins reference: navy title bar, full stage, round control buttons.
     Home = three frosted-glass disease cards over a soft coloured field; each card opens its own view. */
  :root{--navy:#1f3a52;--rust:#c4623a;--ink:#26384a;--paper:#eef6fb;--white:#ffffff;--muted:#5f7387;
        --glass:rgba(255,255,255,.66);--glass-b:rgba(255,255,255,.78);
        --c-chol:#2f63b3;--c-typh:#3c9a3c;--c-ulc:#c23b2e;color-scheme:light}
  [hidden]{display:none!important}
  html{height:100%;overflow:hidden;background:var(--paper)}
  body{position:relative;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);direction:rtl;
       font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:var(--navy);
       padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:7}
  #title{color:var(--white);font-size:clamp(15px,3.6vw,22px);font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stage{position:absolute;top:0;bottom:0;left:0;right:0;overflow:hidden;background:#e9f3f9}
  /* coloured field behind the glass so the frosting reads */
  #field{position:absolute;inset:-10%;pointer-events:none}
  #field i{position:absolute;border-radius:50%;opacity:.55}
  #field i:nth-child(1){width:46vmax;height:46vmax;background:radial-gradient(closest-side,#7fb2ec,transparent);top:2%;right:-6%}
  #field i:nth-child(2){width:40vmax;height:40vmax;background:radial-gradient(closest-side,#9ad78f,transparent);bottom:-4%;left:30%}
  #field i:nth-child(3){width:38vmax;height:38vmax;background:radial-gradient(closest-side,#f2a090,transparent);top:12%;left:-8%}
  #field i:nth-child(4){width:24vmax;height:24vmax;background:radial-gradient(closest-side,#ffe08a,transparent);bottom:8%;right:16%;opacity:.45}
  #field::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(31,58,82,.08) 1px,transparent 1px);background-size:22px 22px}
  .view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
        padding:24px max(16px,env(safe-area-inset-right,0px)) 32px calc(68px + env(safe-area-inset-left,0px));box-sizing:border-box}
  .view>*{zoom:var(--z,1)}
  .glass{background:var(--glass);border:1.5px solid var(--glass-b);border-radius:26px;
         
         box-shadow:0 18px 40px rgba(31,58,82,.16),inset 0 1px 0 rgba(255,255,255,.9)}
  /* home */
  #home{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3vh,32px)}
  .lead{margin:0;text-align:center;display:flex;flex-direction:column;gap:2px}
  .lead b{font-size:clamp(24px,4.4vw,40px);font-weight:800;color:var(--navy);text-wrap:balance}
  .lead span{font-size:clamp(14px,2vw,17px);font-weight:600;color:var(--muted)}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,2.6vw,30px);width:100%;max-width:1180px}
  .card{position:relative;flex:1 1 300px;max-width:360px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;
        padding:18px 18px 22px;cursor:pointer;font:inherit;color:inherit;text-align:center;overflow:hidden;
        transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
  .card:nth-child(2){animation-delay:.15s}.card:nth-child(3){animation-delay:.3s}
  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  .card::before{content:"";position:absolute;inset:auto -20% -40% -20%;height:70%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.22;pointer-events:none}
  .card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);transition:left .7s}
  .card:hover{transform:translateY(-6px);box-shadow:0 26px 50px rgba(31,58,82,.22),inset 0 1px 0 #fff}
  .card:hover::after{left:130%}
  .card:focus-visible{outline:3px solid var(--rust);outline-offset:4px}
  .art{width:100%;aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center;
       border-radius:18px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8)}
  .art svg,.art img{width:100%;height:100%;display:block}
  .art img{object-fit:contain}
  .num{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.18);z-index:1}
  .ar{font-size:clamp(20px,2.4vw,26px);font-weight:800;color:var(--c);line-height:1.35;margin-top:6px;text-wrap:balance}
  .en{direction:ltr;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .go{margin-top:8px;display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border-radius:999px;background:var(--c);color:#fff;font-weight:800;font-size:14px}
  .go svg{width:16px;height:16px}
  /* disease view */
  .dz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;max-width:1180px;margin:0 auto;align-items:start}
  .dz .pane{padding:18px;min-width:0}
  .dz .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .dz .hd b{font-size:clamp(22px,3vw,32px);font-weight:800;color:var(--c)}
  .dz .hd span{direction:ltr;font-weight:700;color:var(--muted)}
  .dz .big{aspect-ratio:4/3}
  .slot{min-height:260px;border:2.5px dashed rgba(31,58,82,.25);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:24px;box-sizing:border-box}
  .slot b{color:var(--navy);font-size:18px}
  .side{position:sticky;top:0}
  .facts{margin:14px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .facts div{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:8px 12px;min-width:0}
  .facts dt{font-size:13px;font-weight:700;color:var(--muted)}
  .facts dd{margin:0;font-size:16px;font-weight:800;color:var(--navy)}
  .facts i,.intro i{font-family:Georgia,"Times New Roman",serif;font-weight:700;color:var(--c)}
  .steps{display:flex;flex-wrap:wrap;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.65);width:fit-content;max-width:100%;box-sizing:border-box}
  .steps button{border:0;border-radius:999px;padding:7px 16px 7px 12px;font:800 16px "Cairo",Tahoma,Arial,sans-serif;color:var(--navy);background:transparent;cursor:pointer;display:flex;align-items:center;gap:8px}
  .steps .sn{width:24px;height:24px;border-radius:50%;background:rgba(31,58,82,.12);display:flex;align-items:center;justify-content:center;font-size:13px}
  .steps button[aria-selected="true"]{background:var(--c);color:#fff}
  .steps button[aria-selected="true"] .sn{background:rgba(255,255,255,.3)}
  .sec{min-height:320px;padding:6px 4px}
  .sec h3{display:flex;align-items:center;gap:10px;margin:18px 0 14px;font-size:clamp(22px,2.6vw,28px);font-weight:800;color:var(--c)}
  .sec h3 small{font-size:.62em;color:var(--muted);font-weight:700}
  .hi{width:42px;height:42px;border-radius:12px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .hi svg{width:24px;height:24px}
  .intro{margin:0;font-size:clamp(17px,1.8vw,20px);line-height:2.05;font-weight:600;max-width:62ch}
  .intro mark{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--c) 24%,transparent) 55%);color:var(--navy);font-weight:800;padding:0 2px}
  .sec ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .sec li{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:start;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95)}
  .ii{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center}
  .ii svg{width:26px;height:26px}
  .nb{font-weight:800;font-size:20px;color:var(--c);line-height:46px}
  .tx{font-size:clamp(16px,1.7vw,19px);font-weight:600;line-height:1.85;padding-top:6px}
  .ln{opacity:0;animation:lnIn .6s cubic-bezier(.2,.8,.2,1) var(--d,0s) forwards}
  @keyframes lnIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  .nav button{border:2px solid var(--c);border-radius:999px;padding:7px 20px;font:800 15px "Cairo",Tahoma,Arial,sans-serif;cursor:pointer;background:var(--white);color:var(--c)}
  .nav #nxt{background:var(--c);color:#fff}
  .nav button:disabled{opacity:.35;cursor:default}
  @media (max-width:760px){.dz{grid-template-columns:minmax(0,1fr)}.side{position:static}.sec li{grid-template-columns:auto minmax(0,1fr)}.sec .nb{display:none}}
  /* controls (same as reference) */
  .zb{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:8}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);background:var(--white);color:var(--navy);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
  .zb button svg{width:20px;height:20px}
  .zb .zt{font-size:26px;font-weight:700;line-height:1}
  .zb button:disabled{opacity:.4;cursor:default}
  #home-btn{background:var(--rust);border-color:var(--rust);color:var(--white)}
  #play.on{background:var(--navy);color:var(--white)}
  button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
  @media (max-width:720px),(max-aspect-ratio:4/5){
    .zb{flex-direction:row;gap:6px;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px))}
    .zb button{width:34px;height:34px}.zb .zt{font-size:21px}.zb button svg{width:16px;height:16px}
    .view{padding-top:56px;padding-left:max(16px,env(safe-area-inset-left,0px))}
  }
  body.pf #top{display:none}
  body.pf #stage{top:0}
  @media (prefers-reduced-motion:reduce){.card,.ln{animation:none;opacity:1}.card::after{display:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="field"><i></i><i></i><i></i><i></i></div>
  <div id="home" class="view">
    <p class="lead"><b>بعض أمراض الجهاز الهضمي</b><span>اختر المرض لبدء الشرح</span></p>
    <div class="grid" id="grid"></div>
  </div>
  <div id="detail" class="view" hidden></div>
  <div class="zb">
    <button id="home-btn" hidden aria-label="العودة إلى قائمة الأمراض" title="القائمة الرئيسية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg></button>
    <button id="play" class="on" aria-label="إيقاف الحركة" aria-pressed="true" title="الحركة"><svg viewBox="0 0 24 24" fill="currentColor"><path id="playIco" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
    <button id="zin" aria-label="تكبير" title="تكبير"><span class="zt">+</span></button>
    <button id="zout" aria-label="تصغير" title="تصغير"><span class="zt">−</span></button>
    <button id="fs" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>

let uid=0;const FL=[],FX=[];
function wave(o){ /* wavy flagellum: grows out from its base, wave travels outward */
  const pts=[],ca=Math.cos(o.a),sa=Math.sin(o.a);
  for(let s=0;s<=o.len;s+=4){const env=Math.min(1,s/(o.len*.35)),w=o.amp*env*Math.sin(o.k*s-o.ph);
    pts.push((o.x+ca*s-sa*w).toFixed(1)+' '+(o.y+sa*s+ca*w).toFixed(1));}
  return 'M'+pts.join(' L');
}
function cholera(svg){
  const u='c'+(++uid),df=el('defs',{},svg);
  df.innerHTML=`<linearGradient id="${u}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f7fd0"/><stop offset=".55" stop-color="#1d3a78"/><stop offset="1" stop-color="#0f2250"/></linearGradient>
  <pattern id="${u}p" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#9fc0ff" opacity=".55"/><circle cx="5.5" cy="5" r=".8" fill="#0a173a" opacity=".6"/></pattern>`;
  el('ellipse',{cx:200,cy:262,rx:120,ry:9,fill:'#1f3a52',opacity:.08},svg);
  const sw=el('g',{},svg); /* swimmer: body + flagellum move together */
  const fl=el('path',{fill:'none',stroke:'#14285a','stroke-width':4,'stroke-linecap':'round'},sw);
  const g=el('g',{},sw),B='M70 120 Q150 66 236 130';
  el('path',{d:B,fill:'none',stroke:'#0c1c44','stroke-width':58,'stroke-linecap':'round'},g);
  el('path',{d:B,fill:'none',stroke:`url(#${u}g)`,'stroke-width':52,'stroke-linecap':'round'},g);
  el('path',{d:B,fill:'none',stroke:`url(#${u}p)`,'stroke-width':48,'stroke-linecap':'round'},g);
  el('path',{d:'M78 108 Q148 70 216 112',fill:'none',stroke:'#cfe0ff','stroke-width':6,'stroke-linecap':'round',opacity:.45},g);
  FL.push({p:fl,o:{x:250,y:142,a:.62,len:175,amp:15,k:.075,ph:0},sp:6});
  /* steady 4-second swim cycle: gentle figure-eight drift with a small matching tilt */
  const W=2*PI/4;
  FX.push(t=>sw.setAttribute('transform',`translate(${(12*Math.sin(W*t)).toFixed(2)} ${(6*Math.sin(2*W*t)).toFixed(2)}) rotate(${(3*Math.sin(W*t)).toFixed(2)} 160 120)`));
}
function typhoid(svg){
  const u='t'+(++uid),df=el('defs',{},svg);
  df.innerHTML=`<linearGradient id="${u}g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fe05a"/><stop offset=".6" stop-color="#5cc23a"/><stop offset="1" stop-color="#3d9a26"/></linearGradient>`;
  el('ellipse',{cx:200,cy:270,rx:110,ry:8,fill:'#1f3a52',opacity:.08},svg);
  const g=el('g',{transform:'translate(200 148) rotate(40)'},svg),fg=el('g',{},g);
  [[-36,-50,PI+.25],[-36,15,PI-.1],[-36,70,PI-.45],[36,-62,.2],[36,0,-.05],[36,58,.4],[0,-88,-PI/2+.2],[0,88,PI/2-.15]].forEach((f,i)=>{
    const p=el('path',{fill:'none',stroke:'#3e8a2c','stroke-width':4.5,'stroke-linecap':'round'},fg);
    FL.push({p,o:{x:f[0],y:f[1],a:f[2],len:105+(i%3)*18,amp:13,k:.06,ph:i},sp:4+i%3*.6});});
  el('rect',{x:-38,y:-92,width:76,height:184,rx:38,fill:`url(#${u}g)`,stroke:'#3a8a24','stroke-width':4},g);
  [[-12,-50,7,10],[10,-20,6,8],[-14,10,8,6],[12,40,7,9],[-8,62,5,6],[14,-66,5,5]].forEach(s=>el('ellipse',{cx:s[0],cy:s[1],rx:s[2],ry:s[3],fill:'#3f9a2a',opacity:.45},g));
  el('rect',{x:-24,y:-76,width:10,height:120,rx:5,fill:'#fff',opacity:.3},g);
  FX.push(t=>g.setAttribute('transform',`translate(200 ${(148+3*Math.sin(t*1.4)).toFixed(2)}) rotate(${(40+2*Math.sin(t*.9)).toFixed(2)})`));
}
function ulcer(svg){
  el('image',{href:STOMACH,x:103,y:0,width:194,height:300,preserveAspectRatio:'xMidYMid meet'},svg);
  const rings=[0,1].map(()=>el('circle',{cx:245,cy:169,r:10,fill:'none',stroke:'#e0302a','stroke-width':2.5},svg));
  const drop=el('path',{d:'M0 -7C3 -2 5 1 5 3A5 5 0 0 1 -5 3C-5 1 -3 -2 0 -7Z',fill:'#c8141a'},svg);
  FX.push(t=>{rings.forEach((r,i)=>{const q=(t/1.8+i/2)%1;r.setAttribute('r',(10+22*q).toFixed(1));r.setAttribute('opacity',(.85*(1-q)).toFixed(2));});
    const q=(t/1.4)%1;drop.setAttribute('transform',`translate(243 ${(276+22*q*q).toFixed(1)})`);drop.setAttribute('opacity',Math.min(1,(1-q)*3).toFixed(2));});
}

const svgI=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg>`;
const AN='٠١٢٣٤٥٦٧٨٩',arN=n=>String(n).replace(/\d/g,x=>AN[x]);
function buildLesson(d,box){
  const S=d.info.steps;let cur=0;
  box.innerHTML=`<div class="steps" role="tablist">${S.map((s,i)=>`<button role="tab" id="st${i}"><span class="sn">${arN(i+1)}</span>${s.t}</button>`).join('')}</div><div class="sec" id="sec"></div>
  <div class="nav"><button id="prv">السابق</button><button id="nxt"></button></div>`;
  const show=i=>{cur=Math.max(0,Math.min(S.length-1,i));const s=S[cur];
    S.forEach((_,j)=>$('st'+j).setAttribute('aria-selected',j===cur));
    let h=`<h3><span class="hi">${svgI(s.ic||s.items[0][0])}</span>${s.t} <small dir="ltr">(${s.en})</small></h3>`;
    if(s.p)h+=`<p class="intro ln" style="--d:.15s">${s.p}</p>`;
    if(s.items)h+='<ol>'+s.items.map((it,j)=>`<li class="ln" style="--d:${(.2+j*.45).toFixed(2)}s"><span class="ii">${svgI(it[0])}</span><span class="nb">${arN(j+1)}</span><span class="tx">${it[1]}</span></li>`).join('')+'</ol>';
    $('sec').innerHTML=h;
    $('prv').disabled=cur===0;$('nxt').textContent=cur<S.length-1?'التالي: '+S[cur+1].t:'العودة إلى البداية';};
  S.forEach((_,i)=>$('st'+i).onclick=()=>show(i));
  $('prv').onclick=()=>show(cur-1);$('nxt').onclick=()=>show(cur<S.length-1?cur+1:0);
  box.onkeydown=null;LESSON={next:()=>show(cur<S.length-1?cur+1:cur),prev:()=>show(cur-1)};
  show(0);
}
let LESSON=null;
document.addEventListener('keydown',e=>{if(!LESSON||$('detail').hidden)return;if(e.key==='ArrowLeft')LESSON.next();if(e.key==='ArrowRight')LESSON.prev();});

function openDisease(d){
  LESSON=null;
  FL.length=0;FX.length=0;grid.querySelectorAll('.art').forEach((a,i)=>{a.innerHTML='';drawArt(a,D[i].art);});
  const v=$('detail');v.style.setProperty('--c',d.col);
  const I=d.info;
  v.innerHTML=`<div class="dz"><div class="pane glass side"><div class="hd"><b>${d.ar}</b><span>${d.en}</span></div><div class="art big"></div>
  ${I?`<dl class="facts">${I.facts.map(f=>`<div><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join('')}</dl>`:''}</div>
  <div class="pane glass" id="lesson">${I?'':`<div class="slot"><b>مساحة شرح ${d.ar}</b><span>سيُضاف هنا المحتوى الخاص بالمرض من نصوص وأشكال.</span></div>`}</div></div>`;
  drawArt(v.querySelector('.art'),d.art);
  if(I)buildLesson(d,$('lesson'));
  $('home').hidden=true;v.hidden=false;v.scrollTop=0;$('home-btn').hidden=false;
}
function goHome(){LESSON=null;$('detail').hidden=true;$('detail').innerHTML='';$('home').hidden=false;$('home-btn').hidden=true;

function route(){const d=D.find(x=>'#'+x.id===location.hash);d?openDisease(d):goHome();}
window.addEventListener('hashchange',route);
$('home-btn').onclick=()=>{try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}goHome();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('detail').hidden)$('home-btn').click();});

/* ===================== motion ===================== */
let playing=!RM,mt=0,last=null;
function frame(ms){const dt=last===null?0:Math.min(.1,(ms-last)/1000);last=ms;if(playing)mt+=dt;
  FL.forEach(f=>{f.o.ph=f.sp*mt+(f.o.ph0??(f.o.ph0=f.o.ph));f.p.setAttribute('d',wave(f.o));});
  FX.forEach(fn=>fn(mt));requestAnimationFrame(frame);}
const playBtn=$('play'),playIco=$('playIco');
function setPlay(v){playing=v;playBtn.classList.toggle('on',v);playBtn.setAttribute('aria-pressed',v);playBtn.setAttribute('aria-label',v?'إيقاف الحركة':'تشغيل الحركة');
  playIco.setAttribute('d',v?'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z':'M8 5l11 7-11 7z');}
playBtn.onclick=()=>setPlay(!playing);setPlay(playing);

/* ===================== zoom + / − (scales the cards and lesson text) ===================== */
let Z=1;try{const s=parseFloat(localStorage.getItem('dz-zoom'));if(s>=.6&&s<=1.8)Z=s;}catch(e){}
function setZ(v){Z=Math.round(Math.min(1.8,Math.max(.6,v))*10)/10;document.documentElement.style.setProperty('--z',Z);
  $('zin').disabled=Z>=1.8;$('zout').disabled=Z<=.6;try{localStorage.setItem('dz-zoom',Z);}catch(e){}}
$('zin').onclick=()=>setZ(Z+.1);$('zout').onclick=()=>setZ(Z-.1);setZ(Z);

/* ===================== fullscreen (same as reference) ===================== */
const root=document.documentElement,fsIco=$('fsIco');
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
let pseudo=false;
const setPseudo=v=>{pseudo=v;document.body.classList.toggle('pf',v);fsUpd();};
$('fs').onclick=()=>{
  if(fsEl()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}return;}
  if(pseudo){setPseudo(false);return;}
  const req=root.requestFullscreen||root.webkitRequestFullscreen;
  if(!req||(document.fullscreenEnabled===false&&document.webkitFullscreenEnabled!==true)){setPseudo(true);return;}
  try{const r=req.call(root);if(r&&r.then)r.catch(()=>setPseudo(true));else setTimeout(()=>{if(!fsEl())setPseudo(true);},350);}catch(e){setPseudo(true);}
};
const fsUpd=()=>{const on=!!fsEl()||pseudo;fsIco.setAttribute('d',on?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');$('fs').setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');};
document.addEventListener('fullscreenchange',fsUpd);document.addEventListener('webkitfullscreenchange',fsUpd);

route();requestAnimationFrame(frame);
})();
</script>
