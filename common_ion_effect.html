<script>
(()=>{
const cv=document.getElementById('ink'), cx=cv.getContext('2d'), $=id=>document.getElementById(id);
let tool=null, color='#ffd27a', width=3, last=null;
function size(){const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;if(!r.width)return;
  const o=document.createElement('canvas');o.width=cv.width;o.height=cv.height;if(cv.width)o.getContext('2d').drawImage(cv,0,0);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);cx.setTransform(1,0,0,1,0,0);if(o.width)cx.drawImage(o,0,0,o.width,o.height);cx.setTransform(dpr,0,0,dpr,0,0)}
new ResizeObserver(size).observe(cv);size();
function clear(){cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.restore()}
function setTool(t){tool=tool===t?null:t;$('pen').setAttribute('aria-pressed',String(tool==='pen'));$('eraser').setAttribute('aria-pressed',String(tool==='eraser'));
  cv.classList.toggle('on',!!tool);$('inkbar').hidden=tool!=='pen'}
$('pen').addEventListener('click',()=>setTool('pen'));$('eraser').addEventListener('click',()=>setTool('eraser'));$('inkclear').addEventListener('click',clear);
document.querySelectorAll('.inkbar .sw').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.c;document.querySelectorAll('.inkbar .sw').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
document.querySelectorAll('.inkbar .sz').forEach(b=>b.addEventListener('click',()=>{width=+b.dataset.w;document.querySelectorAll('.inkbar .sz').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function style(){cx.lineCap='round';cx.lineJoin='round';if(tool==='eraser'){cx.globalCompositeOperation='destination-out';cx.strokeStyle=cx.fillStyle='#000';cx.lineWidth=34}else{cx.globalCompositeOperation='source-over';cx.strokeStyle=cx.fillStyle=color;cx.lineWidth=width}}
cv.addEventListener('pointerdown',e=>{if(!tool)return;e.preventDefault();cv.setPointerCapture(e.pointerId);last=pt(e);style();cx.beginPath();cx.arc(last.x,last.y,cx.lineWidth/2,0,Math.PI*2);cx.fill()});
cv.addEventListener('pointermove',e=>{if(!last)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];style();for(const ev of evs){const p=pt(ev);cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p}});
const up=()=>{last=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.__ink={clear,setTool,count:()=>{const d=cx.getImageData(0,0,cv.width,cv.height).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i])n++;return n}};
})();
</script>

<script>
(() => {
'use strict';
const cv=document.getElementById('scene');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2, DEG=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
function seeded(n){let x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)}
const KCOL={exo:'#ff8a5c',endo:'#5cc8ff'};
let L={W:1000,H:650,cx:560,cy:330,k:2.1}, layoutName='land';
let W=0,H=0,s=1,ox=0,oy=0;
const VIEW0={yaw:-0.32,pitch:0.24,zoom:1,px:0,py:0,ortho:0};
let view={...VIEW0}, mode2D=false, saved3D=null;
let spin=false, lastT=0, pending=false, camLock=0;
let drag=null;
const pointers=new Map();let pinch=null;
/* ---------- متجهات ---------- */
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z);
const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const norm=a=>mul(a,1/(Math.hypot(a.x,a.y,a.z)||1));
const len3=a=>Math.hypot(a.x,a.y,a.z);
const vlerp=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
function rot(v,k,a){const c=Math.cos(a),s=Math.sin(a);return add(add(mul(v,c),mul(cross(k,v),s)),mul(k,dot(k,v)*(1-c)))}
const randUnit=()=>norm(V(rnd(-1,1),rnd(-1,1),rnd(-1,1)));


/* ---------- الكاميرا والإسقاط ---------- */
const DIST=820;
let cam=null, TARGET=V(0,80,0);
function setupCam(){
  const cp=Math.cos(view.pitch), sp=Math.sin(view.pitch);
  const C=V(TARGET.x+DIST*Math.sin(view.yaw)*cp, TARGET.y+DIST*sp, TARGET.z+DIST*Math.cos(view.yaw)*cp);
  const f=norm(sub(TARGET,C)), r=norm(cross(f,V(0,1,0))), u=cross(r,f);
  const o2=view.ortho;
  cam={C,f,r,u,F:L.k*view.zoom*DIST*(1+(layoutName==='port'?0:.08)*o2),cx:L.cx+view.px,cy:L.cy+view.py+(layoutName==='port'?10:24)*o2};
}
function P(p){
  const v=sub(p,cam.C), dz=dot(v,cam.f), sc=cam.F/dz+(cam.F/DIST-cam.F/dz)*view.ortho;
  return{x:cam.cx+dot(v,cam.r)*sc, y:cam.cy-dot(v,cam.u)*sc, s:sc, z:dz};
}
const depth=p=>dot(sub(p,cam.C),cam.f);
function toCam(pt){return view.ortho>.5?mul(cam.f,-1):sub(cam.C,pt)}
function col(c,a=1){return`rgba(${Math.round(clamp(c[0],0,255))},${Math.round(clamp(c[1],0,255))},${Math.round(clamp(c[2],0,255))},${a})`}
const LIGHT=norm(V(-0.45,0.85,0.6)), FILL=norm(V(0.7,0.2,0.5));
function lit(c,n,pt,o={}){
  const amb=o.amb??0.34, spec=o.spec??0.28, shin=o.shin??28;
  const dif=Math.max(0,dot(n,LIGHT));
  const v=norm(toCam(pt)), h=norm(add(LIGHT,v));
  const sp=spec*Math.pow(Math.max(0,dot(n,h)),shin);
  const k=amb+0.7*dif+0.2*Math.max(0,dot(n,FILL))+0.22*Math.max(0,dot(n,v));

function pathPts(ps,close=true){ctx.beginPath();ps.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));if(close)ctx.closePath()}
function centroid(ps){let x=0,y=0,z=0;ps.forEach(p=>{x+=p.x;y+=p.y;z+=p.z});return V(x/ps.length,y/ps.length,z/ps.length)}
function face(pts,n,c,o={}){
  const ctr=centroid(pts);

  pathPts(pts.map(P));
  const cc=col(lit(c,n,ctr,o),o.alpha??1);
  ctx.fillStyle=cc;ctx.fill();
  ctx.strokeStyle=o.line||cc;ctx.lineWidth=o.lw||.6;ctx.stroke();

}
function box(x0,x1,y0,y1,z0,z1,c,o){

  face([p(x0,y0,z0),p(x0,y0,z1),p(x0,y1,z1),p(x0,y1,z0)],V(-1,0,0),c,o);
  face([p(x0,y1,z0),p(x0,y1,z1),p(x1,y1,z1),p(x1,y1,z0)],V(0,1,0),c,o);
  face([p(x0,y0,z0),p(x1,y0,z0),p(x1,y0,z1),p(x0,y0,z1)],V(0,-1,0),c,o);
  face([p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)],V(0,0,1),c,o);
  face([p(x0,y0,z0),p(x0,y1,z0),p(x1,y1,z0),p(x1,y0,z0)],V(0,0,-1),c,o);
}
function cyl(B,A,e1,e2,r,len,c,o={}){
  const n=o.sides||24, E=add(B,mul(A,len)), ring=[];
  for(let i=0;i<n;i++){const a=i/n*TAU+(o.rot||0);ring.push(add(mul(e1,Math.cos(a)),mul(e2,Math.sin(a))))}
  for(let i=0;i<n;i++){
    const a=ring[i], b=ring[(i+1)%n];
    const cc=o.knurl&&i%2?c.map(v=>v*.72):c;
    face([add(B,mul(a,r)),add(B,mul(b,r)),add(E,mul(b,r)),add(E,mul(a,r))],norm(add(a,b)),cc,o);
  }
  if(o.cap1!==false)face(ring.map(d=>add(E,mul(d,r))),A,o.capCol||c,o);

const cylY=(x,z,r,y0,y1,c,o)=>cyl(V(x,y0,z),V(0,1,0),V(1,0,0),V(0,0,1),r,y1-y0,c,o);
const cylZ=(x,y,r,z0,z1,c,o)=>cyl(V(x,y,z0),V(0,0,1),V(1,0,0),V(0,1,0),r,z1-z0,c,o);
function planeText(str,O,ex,ey,size,color,font='600 32px system-ui,Tahoma,sans-serif',dir='rtl'){
  const o=P(O), a=P(add(O,ex)), b=P(add(O,ey)), k=size/32;
  ctx.save();
  ctx.transform((a.x-o.x)*k,(a.y-o.y)*k,(b.x-o.x)*k,(b.y-o.y)*k,o.x,o.y);
  ctx.font=font;ctx.direction=dir;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=color;ctx.fillText(str,0,0);
  ctx.restore();
}
const frontFacing=(n,pt)=>dot(n,toCam(pt))>0;

/* ---------- أجسام دورانية (زجاج وسوائل) ---------- */
const RING_K=40, UPRIGHT={A:V(0,1,0),e1:V(1,0,0),e2:V(0,0,1)};
function revolve(B,prof,fr=UPRIGHT){
  const {A,e1,e2}=fr;
  const a0=P(add(B,mul(A,prof[0][1]))), a1=P(add(B,mul(A,prof[prof.length-1][1])));
  let dx=a1.x-a0.x, dy=a1.y-a0.y, m=Math.hypot(dx,dy);
  if(m<1e-3){dx=0;dy=-1;m=1}dx/=m;dy/=m;
  const nx=-dy, ny=dx, rings=[], Lc=[], Rc=[];
  let mn=1e9,mx=-1e9;
  for(const [r,y] of prof){
    const c=add(B,mul(A,y)), pts=[];
    if(r<.01)pts.push(P(c));
    else for(let k=0;k<RING_K;k++){const t=k/RING_K*TAU;pts.push(P(add(c,add(mul(e1,r*Math.cos(t)),mul(e2,r*Math.sin(t))))))}
    let lo=pts[0],hi=pts[0],dl=1e9,dh=-1e9;
    for(const p of pts){const d=p.x*nx+p.y*ny;if(d<dl){dl=d;lo=p}if(d>dh){dh=d;hi=p}}
    rings.push(pts);Lc.push(lo);Rc.push(hi);mn=Math.min(mn,dl);mx=Math.max(mx,dh);
  }
  const c={x:(a0.x+a1.x)/2,y:(a0.y+a1.y)/2}, cd=c.x*nx+c.y*ny;
  return{rings,L:Lc,R:Rc,S:{x:c.x+nx*(mn-cd),y:c.y+ny*(mn-cd)},E:{x:c.x+nx*(mx-cd),y:c.y+ny*(mx-cd)},prof,B,A};
}
function shapePath(sh){

    let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p.x*q.y-q.x*p.y}
    const q=a<0?pts.slice().reverse():pts;
    ctx.moveTo(q[0].x,q[0].y);for(let i=1;i<q.length;i++)ctx.lineTo(q[i].x,q[i].y);ctx.closePath();
  };

  for(let i=0;i<sh.L.length-1;i++)addP([sh.L[i],sh.L[i+1],sh.R[i+1],sh.R[i]]);
}
function gradAcross(sh,stops){const g=ctx.createLinearGradient(sh.S.x,sh.S.y,sh.E.x,sh.E.y);stops.forEach(([p,c])=>g.addColorStop(p,c));return g}

function topRing(sh){for(let i=sh.rings.length-1;i>=0;i--)if(sh.rings[i].length>2)return sh.rings[i];return sh.rings[0]}
function topVisible(sh){const top=add(sh.B,mul(sh.A,sh.prof[sh.prof.length-1][1]));return dot(sh.A,toCam(top))>0}
const GLASS_STOPS=[[0,'rgba(215,236,255,.42)'],[.07,'rgba(200,228,250,.15)'],[.19,'rgba(190,220,245,.05)'],[.26,'rgba(255,255,255,.40)'],[.3,'rgba(255,255,255,.07)'],[.62,'rgba(190,220,245,.035)'],[.8,'rgba(200,228,250,.08)'],[.93,'rgba(215,236,255,.22)'],[1,'rgba(228,244,255,.48)']];
const WATER_STOPS=[[0,'rgba(64,146,214,.62)'],[.22,'rgba(150,212,246,.42)'],[.5,'rgba(108,184,236,.34)'],[.85,'rgba(80,160,222,.48)'],[1,'rgba(52,128,200,.64)']];
function drawGlass(sh,ring=true){
  shapePath(sh);ctx.fillStyle=gradAcross(sh,GLASS_STOPS);ctx.fill();
  ctx.lineJoin='round';ctx.lineCap='round';

}
function drawOpaque(sh,c){
  shapePath(sh);
  ctx.fillStyle=gradAcross(sh,[[0,col(c.map(v=>v*.55))],[.3,col(c.map(v=>v*1.1))],[.65,col(c.map(v=>v*.9))],[1,col(c.map(v=>v*.6))]]);

function makeVessel(rIn,y0,y1,ys){
  const tab=[0];let v=0;
  for(let y=y0;y<y1;y+=.25){const r=rIn(y+.125);v+=Math.PI*r*r*.25/1000;tab.push(v)}
  return{rIn,y0,y1,ys:ys.filter(y=>y>y0+.5&&y<y1),
    level(vol){if(vol<=0)return y0;if(vol>=tab[tab.length-1])return y1;
      let lo=0,hi=tab.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(tab[m]<vol)lo=m;else hi=m}
      return y0+(lo+(vol-tab[lo])/(tab[hi]-tab[lo]))*.25}};

function drawLiquidIn(B,v,lvl,fr=UPRIGHT,stops=WATER_STOPS,top='rgba(176,224,252,.5)'){
  if(lvl<=v.y0+.3)return null;

  for(const y of v.ys)if(y>v.y0+.6&&y<lvl-.3)p.push([v.rIn(y),y]);

  shapePath(sh);ctx.fillStyle=gradAcross(sh,stops);ctx.fill();
  pathPts(topRing(sh));ctx.fillStyle=top;ctx.fill();ctx.strokeStyle='rgba(236,250,255,.75)';ctx.lineWidth=1;ctx.stroke();

}
function ball(pos,r,c,a=1){

  g.addColorStop(0,col(c.map(v=>v*1.25+40),a));g.addColorStop(.55,col(c,a));g.addColorStop(1,col(c.map(v=>v*.5),a));

function roundPoly(pts,rad){
  const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    const d1=norm(sub(b,a)),d2_=norm(sub(c,b));
    const r1=Math.min(rad,len3(sub(b,a))/2), r2=Math.min(rad,len3(sub(c,b))/2);
    const p0=sub(b,mul(d1,r1)), p2=add(b,mul(d2_,r2));

  out.push(pts[pts.length-1]);return out;
}
function tube3D(pts,r,c){
  const ps=roundPoly(pts,6).map(P), sc=ps.reduce((a,p)=>a+p.s,0)/ps.length, w=2*r*sc;
  ctx.lineCap='round';ctx.lineJoin='round';
  pathPts(ps,false);ctx.strokeStyle='rgba(2,6,14,.75)';ctx.lineWidth=w+1.4;ctx.stroke();
  pathPts(ps,false);ctx.strokeStyle=col(c);ctx.lineWidth=w;ctx.stroke();
  ctx.save();ctx.translate(-w*.12,-w*.18);pathPts(ps,false);ctx.strokeStyle=col(c.map(v=>v*1.6+30),.5);ctx.lineWidth=w*.32;ctx.stroke();ctx.restore();
}

/* ---------- أدوات مشتركة ---------- */
function rodBetween(a,b,r,c){const d=sub(b,a),L3=len3(d),A=mul(d,1/L3);const e1=norm(Math.abs(A.y)<.9?cross(A,V(0,1,0)):cross(A,V(1,0,0))),e2=cross(A,e1);cyl(a,A,e1,e2,r,L3,c,{sides:12,spec:.55})}
const C_BENCH=[38,44,54], C_STEEL=[188,196,206], C_STAND=[46,52,62], C_PLATE=[214,219,226], C_TOP=[34,37,44], C_KNOB=[40,42,48];
function bench(){
  const sh=[V(-175,-12,-85),V(175,-12,-85),V(175,-12,85),V(-175,-12,85)].map(P);
  ctx.save();ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=26;ctx.shadowOffsetY=16;pathPts(sh);ctx.fillStyle='#0b1526';ctx.fill();ctx.restore();
  box(-175,175,-12,0,-85,85,C_BENCH,{spec:.35,shin:30,amb:.5});
  const top=[V(-175,0,-85),V(175,0,-85),V(175,0,85),V(-175,0,85)].map(P);
  pathPts(top);ctx.strokeStyle='rgba(170,200,235,.28)';ctx.lineWidth=1;ctx.stroke();
}
function softShadow(x,z,rx,rz,y=0.05){
  const g=[];for(let a=0;a<28;a++){const t=a/28*TAU;g.push(P(V(x+rx*Math.cos(t),y,z+rz*Math.sin(t))))}
  ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=10;pathPts(g);ctx.fillStyle='rgba(0,0,0,.22)';ctx.fill();ctx.restore();
}
function stand(x,z,h){
  box(x-22,x+22,0,6,z-26,z+22,C_STAND,{spec:.35,amb:.45});
  cylY(x,z,3.4,6,h,C_STEEL,{sides:16,spec:.6,shin:40});
}
function hotPlate(x,on,t){
  box(x-48,x+48,0,21,-48,48,C_PLATE,{spec:.22,amb:.46,shin:18});
  box(x-46,x+46,21,24,-46,46,C_TOP,{spec:.55,shin:42,amb:.42});
  const glow=on?(.75+.25*Math.sin(t*5)):0;
  for(const r of [37,41.5]){
    const ring=[];for(let k=0;k<=56;k++){const a=k/56*TAU;ring.push(P(V(x+r*Math.cos(a),24.06,r*Math.sin(a))))}
    pathPts(ring,false);
    if(on){ctx.save();ctx.shadowColor=`rgba(255,90,30,${glow})`;ctx.shadowBlur=10;ctx.strokeStyle=`rgba(255,${90+60*glow},40,.95)`;ctx.lineWidth=1.6;ctx.stroke();ctx.restore()}
    else{ctx.strokeStyle='rgba(120,126,138,.55)';ctx.lineWidth=1;ctx.stroke()}
  }
  if(frontFacing(V(0,0,1),V(x,10,48))){
    planeText('HOT PLATE',V(x-8,13,48.06),V(1,0,0),V(0,-1,0),3.4,'rgba(64,74,90,.85)','700 32px system-ui,sans-serif','ltr');
    const led=P(V(x-34,10.5,48.1));ctx.beginPath();ctx.arc(led.x,led.y,1.8*led.s,0,TAU);ctx.fillStyle=on?'#ff6a3a':'#5a2c2c';ctx.fill();
  }
  cylZ(x+30,10.5,6.4,48,54,C_KNOB,{sides:24,knurl:true,spec:.4,capCol:[66,70,80]});
}
function flameAt(base,h,k,t,blue=true){
  const b=P(base), tip=P(add(base,V(0,h,0))), wob=Math.sin(t*23)*1.5+Math.sin(t*37)*1;
  const w=(h*.22)*b.s;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(b.x,b.y-(b.y-tip.y)*.35,1,b.x,b.y-(b.y-tip.y)*.35,(b.y-tip.y)*.8);
  g.addColorStop(0,`rgba(${blue?'120,160,255':'255,170,60'},${.55*k})`);g.addColorStop(1,'rgba(80,100,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(b.x-w,b.y);ctx.quadraticCurveTo(b.x-w*1.2,b.y-(b.y-tip.y)*.5,tip.x+wob,tip.y);ctx.quadraticCurveTo(b.x+w*1.2,b.y-(b.y-tip.y)*.5,b.x+w,b.y);ctx.closePath();ctx.fill();
  const ih=(b.y-tip.y)*.42;
  ctx.fillStyle=`rgba(${blue?'90,200,255':'255,230,140'},${.75*k})`;ctx.beginPath();ctx.moveTo(b.x-w*.55,b.y);ctx.quadraticCurveTo(b.x,b.y-ih*1.4,b.x+w*.55,b.y);ctx.closePath();ctx.fill();
  ctx.restore();
}
function arrow2d(a,b,color,alpha,label,t,lw=2.2){
  const dx=b.x-a.x, dy=b.y-a.y, m=Math.hypot(dx,dy)||1, ux=dx/m, uy=dy/m;
  ctx.save();ctx.globalAlpha=alpha;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x-ux*6,b.y-uy*6);
  ctx.strokeStyle='rgba(8,20,41,.7)';ctx.lineWidth=lw+2.8;ctx.stroke();
  ctx.setLineDash([7,5]);ctx.lineDashOffset=-t*26;ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-ux*10-uy*5,b.y-uy*10+ux*5);ctx.lineTo(b.x-ux*10+uy*5,b.y-uy*10-ux*5);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();
  if(label){
    ctx.font='600 11.5px system-ui,Tahoma,sans-serif';ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';
    const vert=Math.abs(uy)>.7, lx=vert?(a.x+b.x)/2-38:(a.x+b.x)/2, ly=vert?(a.y+b.y)/2:Math.min(a.y,b.y)-12;
    ctx.lineWidth=3;ctx.strokeStyle='rgba(8,20,41,.85)';ctx.strokeText(label,lx,ly);ctx.fillStyle=color;ctx.fillText(label,lx,ly);
  }
  ctx.restore();
}
/* أسهم الحرارة حول جسم: dir=+1 خارجة (باعث) ، −1 داخلة (ماص) */
function heatArrows(center,r,dir,k,label,t){
  if(k<.05)return;
  const c=P(center), color=dir>0?KCOL.exo:KCOL.endo;
  [-1,1].forEach((sd,i)=>{
    const e=P(add(center,mul(cam.r,sd*r)));
    let dx=e.x-c.x,dy=e.y-c.y,m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;
    const len=24+k*22, near={x:e.x+dx*5,y:e.y+dy*5}, far={x:e.x+dx*(5+len),y:e.y+dy*(5+len)};
    if(dir>0)arrow2d(near,far,color,.35+.65*k,i===0?label:'',t);else arrow2d(far,near,color,.35+.65*k,i===0?label:'',t);
  });
}
function halo(center,r,dir,k){
  if(k<.02)return;
  const t=performance.now()/1000, p=P(center), R=(r+6*Math.sin(t*3))*p.s;
  const g=ctx.createRadialGradient(p.x,p.y,R*.2,p.x,p.y,R);
  if(dir>0){g.addColorStop(0,`rgba(255,120,50,${.4*k})`);g.addColorStop(.55,`rgba(255,80,30,${.16*k})`);g.addColorStop(1,'rgba(255,60,20,0)')}
  else{g.addColorStop(0,`rgba(120,210,255,${.4*k})`);g.addColorStop(.55,`rgba(80,170,255,${.16*k})`);g.addColorStop(1,'rgba(60,150,255,0)')}
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,R,0,TAU);ctx.fill();ctx.restore();
}
function pulse(x,y,r){
  const t=(performance.now()%1600)/1600;
  ctx.beginPath();ctx.arc(x,y,r+t*16,0,TAU);ctx.strokeStyle=`rgba(255,210,122,${.75*(1-t)})`;ctx.lineWidth=2;ctx.stroke();

/* ---------- كتابة المعادلات (أرقام سفلية وكلمة Energy) ---------- */
function chemTokens(str){
  const out=[];let i=0,buf='',mode=0;
  const flush=()=>{if(buf){out.push([buf,mode]);buf=''}};
  for(const ch of str){
    if(ch==='{'){flush();mode=1}else if(ch==='}'){flush();mode=0}
    else if(ch==='['){flush();mode=2}else if(ch===']'){flush();mode=0}
    else if(ch==='〈'){flush();mode=3}else if(ch==='〉'){flush();mode=0}
    else buf+=(ch==='［'?'[':ch==='］'?']':ch);
  }
  flush();return out;
}
function chemWidth(str,size){
  let w=0;for(const [t,m] of chemTokens(str)){ctx.font=fontFor(m,size);w+=ctx.measureText(t).width}return w;
}
function fontFor(m,size){return m===1||m===3?`600 ${size*.62}px "Times New Roman",Georgia,serif`:m===2?`700 ${size}px "Times New Roman",Georgia,serif`:`600 ${size}px "Times New Roman",Georgia,serif`}
function drawChem(str,x,y,size,color,align='center',eCol='#ffd27a',ePulse=0){
  const w=chemWidth(str,size);let cx=align==='center'?x-w/2:align==='right'?x-w:x;
  ctx.save();ctx.direction='ltr';ctx.textAlign='left';ctx.textBaseline='alphabetic';
  for(const [t,m] of chemTokens(str)){
    ctx.font=fontFor(m,size);const tw=ctx.measureText(t).width;
    if(m===2){
      const pad=4;ctx.fillStyle=eCol+'22';ctx.beginPath();ctx.roundRect(cx-pad,y-size*.82,tw+pad*2,size*1.08,6);ctx.fill();
      ctx.strokeStyle=eCol;ctx.globalAlpha=.5+.5*ePulse;ctx.lineWidth=1.2;ctx.stroke();ctx.globalAlpha=1;
      ctx.fillStyle=eCol;ctx.fillText(t,cx,y);
    }else{ctx.fillStyle=color;ctx.fillText(t,cx,m===1?y+size*.22:m===3?y-size*.4:y)}
    cx+=tw;
  }
  ctx.restore();return w;
}

  const land=W/H>=0.9;layoutName=land?'land':'port';
  const bot=document.querySelector('.bottom');
  if(land){L.H=650;L.W=Math.max(1000,Math.min(1600,650*W/H));s=Math.min(W/L.W,H/L.H);ox=(W-L.W*s)/2;oy=(H-L.H*s)/2;
    const bh=bot.getBoundingClientRect().height/s;L.cx=L.W*.6;L.cy=(650-bh)*.6+20;L.k=Math.min(2.4,(650-bh-60)/150)}
  else{L.W=620;L.H=Math.max(1000,Math.min(1600,620*H/W));s=Math.min(W/L.W,H/L.H);ox=(W-L.W*s)/2;oy=(H-L.H*s)/2;
    const bh=bot.getBoundingClientRect().height/s;L.lensY=320;L.cardY=578;const top=650, b2=L.H-bh-20;L.cx=310;L.cy=top+(b2-top)*.55;L.k=Math.min(2.3,(b2-top)/150)}
  paint();
}

/* ---------- التحكم ---------- */
const eqs=document.getElementById('eqs');
const ARRH='<span class="arr"><i class="f"></i><i class="b"></i></span>';
function syncEq(){eqs.innerHTML=`<div class="eq" id="eq0"><span class="tag">${SY.acid?'حامض ضعيف':'قاعدة ضعيفة'} — اتزان</span><span class="ef">${SY.eq.replace('ARR',ARRH)}</span></div>`+
  (spoons?`<div class="eq salt"><span class="tag">ملح قوي — تفكك تام</span><span class="ef">${SY.seq}</span></div>`:'');
  document.getElementById('addt').textContent='أضف ملعقة '+SY.salt;
  [...document.querySelectorAll('#dots i')].forEach((d,i)=>d.classList.toggle('on',i<spoons));document.getElementById('add').disabled=spoons>=3;
  [...document.querySelectorAll('#tabs button')].forEach(b=>b.setAttribute('aria-selected',String(+b.dataset.x===xi)))}
function setSys(i){xi=i;SY=SYS[i];spoons=0;pHd=pHof(0);spat=null;powder=[];initParts();syncEq();requestAnimationFrame(resize)}
function addSpoon(){if(spoons>=3||spat)return;spoons++;spat={t:0};syncEq();
  setTimeout(()=>{for(let i=0;i<3;i++){addP(SY.sp,rnd(-.3,.3),-.9,true).drop=true;addP(SY.com,rnd(-.3,.3),-.95,true).drop=true}},700);
  const e=document.getElementById('eq0');e.classList.add('shift');shiftT=4.5;requestAnimationFrame(resize)}
document.getElementById('add').addEventListener('click',addSpoon);
document.getElementById('clr').addEventListener('click',()=>setSys(xi));
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-x]');if(b)setSys(+b.dataset.x)});
function tapPick(){}
function point(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}}
function begin(e){const p=point(e);pointers.set(e.pointerId,p);
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch={d:d2(a,b),mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};drag=null;cv.setPointerCapture(e.pointerId);e.preventDefault();return}
  if(drag)return;drag={id:e.pointerId,last:p,start:p,t0:performance.now(),moved:0};cv.setPointerCapture(e.pointerId);e.preventDefault()}
function move(e){const p=point(e);if(pointers.has(e.pointerId))pointers.set(e.pointerId,p);
  if(pinch&&pointers.size>=2){const [a,b]=[...pointers.values()], d=d2(a,b), mid2={x:(a.x+b.x)/2,y:(a.y+b.y)/2};zoomAt(mid2,d/pinch.d);view.px+=mid2.x-pinch.mid.x;view.py+=mid2.y-pinch.mid.y;pinch={d,mid:mid2};camLock=0;return}
  if(!drag||e.pointerId!==drag.id)return;
  drag.moved=Math.max(drag.moved,d2(p,drag.start));if(drag.moved<6){drag.last=p;return}
  if(mode2D){view.px+=p.x-drag.last.x;view.py+=p.y-drag.last.y}else{view.yaw=wrapA(view.yaw-(p.x-drag.last.x)*.008);view.pitch=clamp(view.pitch+(p.y-drag.last.y)*.006,-1.2,1.2);spin=false;syncSpin()}
  drag.last=p}
function end(e){pointers.delete(e.pointerId);if(pinch){if(pointers.size<2)pinch=null;return}
  if(drag&&drag.id===e.pointerId){if(drag.moved<6&&performance.now()-drag.t0<450)tapPick(drag.start);drag=null}}
function zoomAt(p,f){const z=clamp(view.zoom*f,.5,5);f=z/view.zoom;view.zoom=z;const cx=L.cx+view.px, cy=L.cy+view.py;view.px=p.x-(p.x-cx)*f-L.cx;view.py=p.y-(p.y-cy)*f-L.cy}
cv.addEventListener('pointerdown',begin);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();camLock=0;zoomAt(point(e),Math.exp(-e.deltaY*.0015))},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('zin').addEventListener('click',()=>{camLock=0;zoomAt({x:L.cx+view.px,y:L.cy+view.py},1.25)});
document.getElementById('zout').addEventListener('click',()=>{camLock=0;zoomAt({x:L.cx+view.px,y:L.cy+view.py},.8)});
const spinBtn=document.getElementById('spin'), dimBtn=document.getElementById('dim');
document.getElementById('labels').hidden=true;document.getElementById('play').hidden=true;
function syncSpin(){spinBtn.setAttribute('aria-pressed',String(spin))}
spinBtn.addEventListener('click',()=>{if(mode2D)return;spin=!spin;syncSpin()});
function syncDim(){dimBtn.textContent=mode2D?'2D':'3D';dimBtn.setAttribute('aria-pressed',String(mode2D));
  dimBtn.setAttribute('aria-label',mode2D?'العرض الحالي ثنائي الأبعاد — اضغط للتحويل إلى 3D':'العرض الحالي ثلاثي الأبعاد — اضغط للتحويل إلى 2D');spinBtn.disabled=mode2D;spinBtn.style.opacity=mode2D?.4:1}
dimBtn.addEventListener('click',()=>{mode2D=!mode2D;if(mode2D){saved3D={yaw:view.yaw,pitch:view.pitch};spin=false;syncSpin()}else if(!saved3D)saved3D={yaw:VIEW0.yaw,pitch:VIEW0.pitch};syncDim()});
document.getElementById('reset').addEventListener('click',()=>{setSys(xi);view={...VIEW0};spin=false;syncSpin()});
const fs=document.getElementById('fullscreen'), fsPath=document.getElementById('fsPath');
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function fsToast(){const t=document.getElementById('toast');if(!t)return;t.textContent='المتصفح لم يسمح بملء الشاشة هنا — افتح ملف المحاكاة مباشرة في المتصفح (أو من موقعك) وسيعمل الزر';t.hidden=false;clearTimeout(fsToast.k);fsToast.k=setTimeout(()=>t.hidden=true,4500)}
fs.addEventListener('click',async()=>{try{
    if(isFS()){const x=document.exitFullscreen||document.webkitExitFullscreen;if(x)await x.call(document);return}
    const r=document.documentElement,en=r.requestFullscreen||r.webkitRequestFullscreen;
    const ok=document.fullscreenEnabled||document.webkitFullscreenEnabled;
    if(!en||ok===false){fsToast();return}
    const pr=en.call(r);if(pr&&pr.then)await pr;
    setTimeout(()=>{if(!isFS())fsToast()},400);
  }catch(e){fsToast()}});
function syncFS(){const l=isFS()?'الخروج من ملء الشاشة':'ملء الشاشة';fs.setAttribute('aria-label',l);fs.title=l;
  fsPath.setAttribute('d',isFS()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');resize()}
document.addEventListener('fullscreenchange',syncFS);document.addEventListener('webkitfullscreenchange',syncFS);
window.__sim={sys:setSys,add:addSpoon,ff:sec=>{for(let i=0;i<sec*30;i++)step(1/30)},state:()=>({xi,spoons,pH:+pHof(Cs()).toFixed(2),pHd:+pHd.toFixed(2),pct:+ionPct(Cs()).toFixed(3),nx:cntK(SY.x),nm:cntK(SY.mol),ncom:cntK(SY.com)})};
setSys(0);syncDim();
new ResizeObserver(resize).observe(cv);
resize();
})();
</script>
