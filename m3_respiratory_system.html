<style>
  :root{--navy:#1f3a52;--rust:#c4623a;--ink:#26384a;--paper:#eef6fb;--white:#ffffff;--muted:#5f7387;

  /* controls */

  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);background:var(--white);color:var(--navy);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}

  button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}

<body>
<div id="stage">
  <div id="field"><i></i><i></i><i></i><i></i></div>

    <button id="play" class="on" aria-label="إيقاف الحركة" aria-pressed="true" title="الحركة"><svg viewBox="0 0 24 24" fill="currentColor"><path id="playIco" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
    <button id="zin" aria-label="تكبير" title="تكبير"><span class="zt">+</span></button>

    <button id="fs" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>
<script>
(function(){
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);

let uid=0;const FX=[],SFX=[];
const BP=4.4; /* one breath: inhale then exhale (seconds) */
const br=t=>{const q=(t%BP)/BP;return{q,inh:q<.5,amt:.5-.5*Math.cos(2*Math.PI*q)};};
/* integral of the air speed: forward during inhale, backward during exhale (the same air goes in then comes out) */
const flow=t=>{const q=(t%BP)/BP;return q<.5?q*2:2-q*2;};
function poly(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const T=L[L.length-1];return u=>{const d=Math.max(0,Math.min(1,u))*T;let i=1;while(i<L.length-1&&L[i]<d)i++;
    const k=(d-L[i-1])/((L[i]-L[i-1])||1);return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*k,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k];};}
/* air particles along a set of paths; each particle travels a part of the path (span) and back */
function air(svg,paths,o,arr){
  const g=el('g',{},svg),P=[];
  paths.forEach((p,pi)=>{const f=poly(p.pts);for(let i=0;i<p.n;i++){
    const c=el('circle',{r:o.r,fill:'#3fa9f5',stroke:'#fff','stroke-width':o.r*.35},g);P.push({c,f,s:i/p.n,span:p.span||.6,st:p.st||0});}});
  arr.push(t=>{const fl=flow(t),b=br(t),col=b.inh?'#2f9be8':'#8a94a3';
    P.forEach(p=>{let u=(p.s+fl*p.span)%1;u=p.st+u*(1-p.st);const[x,y]=p.f(u);
      p.c.setAttribute('cx',x.toFixed(1));p.c.setAttribute('cy',y.toFixed(1));p.c.setAttribute('fill',col);
      p.c.setAttribute('opacity',(.95*Math.sin(Math.PI*((p.s+fl*p.span)%1))).toFixed(2));});});
  return g;
}
/* "شهيق / زفير" badge */
function badge(svg,x,y,s,arr){
  const g=el('g',{transform:`translate(${x} ${y}) scale(${s})`},svg);
  const r=el('rect',{x:-80,y:-30,width:160,height:56,rx:28,fill:'#2f9be8'},g);
  const ar=el('path',{d:'M-56 -12 L-56 12 M-64 4 L-56 12 L-48 4',fill:'none',stroke:'#fff','stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  const tx=el('text',{x:16,y:9,'text-anchor':'middle',fill:'#fff',class:'bb'},g);tx.textContent='شهيق';
  arr.push(t=>{const b=br(t);r.setAttribute('fill',b.inh?'#2f9be8':'#7b8696');tx.textContent=b.inh?'شهيق':'زفير';
    ar.setAttribute('transform',b.inh?'':'rotate(180 -56 0)');});
}
function glow(svg,cx,cy,rx,ry,col,arr){const e=el('ellipse',{cx,cy,rx,ry,fill:col,opacity:0,style:'mix-blend-mode:multiply'},svg);
  arr.push(t=>e.setAttribute('opacity',(.2*br(t).amt).toFixed(3)));}

let LESSON=null;
function buildLesson(d,box){
  const S=d.info.steps;let cur=0,drawn=false;
  box.innerHTML=`<div class="tband" role="heading" aria-level="2"><b>${d.ar}</b><span dir="ltr">${d.en}</span></div><div class="steps" role="tablist">${S.map((s,i)=>`<button role="tab" id="st${i}"><span class="sn">${arN(i+1)}</span>${s.t}</button>`).join('')}</div><div class="sec" id="sec"></div>
  <div class="nav"><button id="prv">السابق</button><button id="nxt"></button></div>`;
  const show=i=>{cur=Math.max(0,Math.min(S.length-1,i));const s=S[cur];
    S.forEach((_,j)=>$('st'+j).setAttribute('aria-selected',j===cur));
    let h=`<h3><span class="hi">${svgI(s.ic)}</span>${arN(cur+1)}. ${s.t} <small dir="ltr">(${s.en})</small></h3>`;
    let k=0;const dl=()=>`--d:${Math.min(3.2,.12+(k++)*.28).toFixed(2)}s`;
    s.blocks.forEach(b=>{
      if(b.p)h+=`<p class="intro s ln" style="${dl()}">${b.p}</p>`;
      if(b.h)h+=`<h4 class="ln" style="${dl()}">${b.h}${b.en?` <small>(${b.en})</small>`:''}</h4>`;
      if(b.items)h+='<ol>'+b.items.map((it,j)=>`<li class="ln" style="${dl()}"><span class="ii">${svgI(it[0])}</span><span class="nb">${arN(j+1)}</span><span class="tx">${it[1]}</span></li>`).join('')+'</ol>';
      if(b.think)h+=`<div class="think ln" style="${dl()}"><span class="tb">${svgI('bulb')}</span><div><b>فكّر معي؟</b><span>${b.think}</span></div></div>`;
    });
    $('sec').innerHTML=h;if(drawn&&$('lesson').getBoundingClientRect().top<0)$('lesson').scrollIntoView({block:'start',behavior:'smooth'});drawn=true;
    setSide(s);
    $('prv').disabled=cur===0;$('nxt').textContent=cur<S.length-1?'التالي: '+S[cur+1].t:'العودة إلى البداية';};
  S.forEach((_,i)=>$('st'+i).onclick=()=>show(i));
  $('prv').onclick=()=>show(cur-1);$('nxt').onclick=()=>show(cur<S.length-1?cur+1:0);
  let sx=null,sy=0;
  box.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('.big')||(window.visualViewport&&visualViewport.scale>1.02)){sx=null;return;}sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  box.addEventListener('touchmove',e=>{if(e.touches.length>1)sx=null;},{passive:true});
  box.addEventListener('touchend',e=>{if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(dx<0?(cur<S.length-1?cur+1:cur):cur-1);},{passive:true});
  LESSON={next:()=>show(cur<S.length-1?cur+1:cur),prev:()=>show(cur-1)};
  show(0);
}

function setPlay(v){playing=v;playBtn.classList.toggle('on',v);playBtn.setAttribute('aria-pressed',v);playBtn.setAttribute('aria-label',v?'إيقاف الحركة':'تشغيل الحركة');
  playIco.setAttribute('d',v?'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z':'M8 5l11 7-11 7z');}
playBtn.onclick=()=>setPlay(!playing);setPlay(playing);

/* ===================== zoom + / − ===================== */
const ZMIN=.6,ZMAX=2.6;
let Z=1;try{const s=parseFloat(localStorage.getItem('resp-zoom'));if(s>=ZMIN&&s<=ZMAX)Z=s;}catch(e){}
function setZ(v){Z=Math.round(Math.min(ZMAX,Math.max(ZMIN,v))*10)/10;document.documentElement.style.setProperty('--z',Z.toFixed(3));
  $('zin').disabled=Z>=ZMAX-.001;$('zout').disabled=Z<=ZMIN+.001;try{localStorage.setItem('resp-zoom',Z);}catch(e){}}
$('zin').onclick=()=>setZ(Z+.1);$('zout').onclick=()=>setZ(Z-.1);setZ(Z);

/* ===================== figure: pinch zoom / drag / double-tap ===================== */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const FMAX=6;
function figSvg(b){return [...b.children].find(c=>c.tagName.toLowerCase()==='svg');}
function figApply(b){const z=b._z,sv=figSvg(b);if(!sv)return;
  const w=b.clientWidth,h=b.clientHeight;z.s=Math.min(FMAX,Math.max(1,z.s));
  z.x=Math.min(0,Math.max(w-w*z.s,z.x));z.y=Math.min(0,Math.max(h-h*z.s,z.y));
  sv.style.transform=z.s>1.001?`translate(${z.x}px,${z.y}px) scale(${z.s})`:'';b.classList.toggle('zoomed',z.s>1.001);}
function figReset(b){if(!b._z)return;b._z={s:1,x:0,y:0};figApply(b);}
function figZoomAt(b,ns,cx,cy){const z=b._z,r=b.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,k=Math.min(FMAX,Math.max(1,ns))/z.s;
  z.x=px-(px-z.x)*k;z.y=py-(py-z.y)*k;z.s*=k;figApply(b);}
function figZoom(b){
  if(b._z)return;b._z={s:1,x:0,y:0};b.style.position='relative';
  const rz=document.createElement('button');rz.className='rz';rz.type='button';rz.setAttribute('aria-label','إرجاع الصورة إلى حجمها');
  rz.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/></svg>الحجم الأصلي';
  rz.onclick=e=>{e.stopPropagation();figReset(b);};rz.onpointerdown=e=>e.stopPropagation();
  b.prepend(rz);
  const P=new Map();let st=null,lastTap=0,moved=false;
  b.addEventListener('pointerdown',e=>{if(e.button>0)return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    if(P.size===2){const[a,c]=[...P.values()];st={d:dist(a,c),s:b._z.s,m:mid(a,c),x:b._z.x,y:b._z.y};}
    if(b._z.s>1||P.size===2){try{b.setPointerCapture(e.pointerId);}catch(_){}}});
  b.addEventListener('pointermove',e=>{const prev=P.get(e.pointerId);if(!prev)return;const cur={x:e.clientX,y:e.clientY};P.set(e.pointerId,cur);
    if(Math.abs(cur.x-prev.x)+Math.abs(cur.y-prev.y)>2)moved=true;
    if(P.size===2&&st){const[a,c]=[...P.values()],m=mid(a,c),z=b._z;
      z.s=st.s;z.x=st.x+(m.x-st.m.x);z.y=st.y+(m.y-st.m.y);figZoomAt(b,st.s*dist(a,c)/st.d,m.x,m.y);}
    else if(P.size===1&&b._z.s>1){b._z.x+=cur.x-prev.x;b._z.y+=cur.y-prev.y;figApply(b);}});
  const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);
    if(P.size<2)st=null;
    if(e.type==='pointerup'&&!moved&&P.size===0){const t=Date.now();
      if(t-lastTap<320){figZoomAt(b,b._z.s>1.05?1:2.5,e.clientX,e.clientY);lastTap=0;}else lastTap=t;}};
  ['pointerup','pointercancel'].forEach(t=>b.addEventListener(t,up));
  b.addEventListener('touchmove',e=>{if(e.touches.length>1||b._z.s>1)e.preventDefault();},{passive:false});
  b.addEventListener('wheel',e=>{if(!e.ctrlKey&&b._z.s<=1)return;e.preventDefault();e.stopPropagation();
    if(e.ctrlKey)figZoomAt(b,b._z.s*Math.exp(-e.deltaY*.01),e.clientX,e.clientY);else{b._z.x-=e.deltaX;b._z.y-=e.deltaY;figApply(b);}},{passive:false});
  b.addEventListener('dragstart',e=>e.preventDefault());
  addEventListener('resize',()=>figApply(b));
}

/* ===================== fullscreen ===================== */
const root=document.documentElement,fsIco=$('fsIco');
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
let pseudo=false;
const setPseudo=v=>{pseudo=v;document.body.classList.toggle('pf',v);fsUpd();};
$('fs').onclick=()=>{
  if(fsEl()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}return;}
  if(pseudo){setPseudo(false);return;}
  const req=root.requestFullscreen||root.webkitRequestFullscreen;
  if(!req||(document.fullscreenEnabled===false&&document.webkitFullscreenEnabled!==true)){setPseudo(true);return;}
  try{const r=req.call(root);if(r&&r.then)r.catch(()=>setPseudo(true));else setTimeout(()=>{if(!fsEl())setPseudo(true);},350);}catch(e){setPseudo(true);}
};
const fsUpd=()=>{const on=!!fsEl()||pseudo;fsIco.setAttribute('d',on?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');$('fs').setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');};
document.addEventListener('fullscreenchange',fsUpd);document.addEventListener('webkitfullscreenchange',fsUpd);

route();requestAnimationFrame(frame);
})();
