<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<title>تركيب الزغابة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /* Same pattern as the reference plates: one full-screen stage. The picture is cut into its numbered figures;
     figure 1 arrives first, then the view slides over and each next figure follows its arrow in.
     No text panel. Deliberately a single light theme, matching the white-ground anatomical plate. */
  :root{--navy:#1f3a52;--rust:#c4623a;--rustD:#a8431b;--ink:#26384a;--paper:#eef6fb;--white:#ffffff;color-scheme:light}
  html{height:100%;box-sizing:border-box;overflow:hidden;background:var(--paper)}
  body{position:relative;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);direction:rtl;
       font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:0 16px}
  #title{color:var(--white);font-size:clamp(15px,3.6vw,22px);font-weight:800}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#f6fcff 0%,#cfe8f3 100%)}
  #draw{position:absolute;inset:0}
  #draw>svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;direction:ltr}
  #draw>svg:active{cursor:grabbing}
  .lbl text{font-family:"Cairo",Tahoma,Arial,sans-serif;font-weight:800;fill:#141414;stroke:var(--white);stroke-linejoin:round;paint-order:stroke}
  .lbl .halo{fill:none;stroke:var(--white);stroke-linecap:round;stroke-linejoin:round}
  .lbl .ln{fill:none;stroke:#141414;stroke-linecap:round;stroke-linejoin:round}
  .lbl .dot{fill:#141414;stroke:var(--white)}
  .lbl .ring{fill:none;stroke:var(--rust)}
  .num text{font-family:"Cairo",Tahoma,Arial,sans-serif;font-weight:800;fill:var(--navy);stroke:var(--white);stroke-linejoin:round;paint-order:stroke}
  .zb{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);background:var(--white);color:var(--navy);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:background .25s,color .25s}
  .zb button svg{width:20px;height:20px}
  .zb button[hidden]{display:none}
  #all{background:var(--rust)!important;border-color:var(--rust)!important;color:var(--white)!important}
  #play.on{background:var(--navy);color:var(--white)}
  button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
  @media (max-width:720px),(max-aspect-ratio:4/5){
    .zb{flex-direction:row;gap:6px;top:8px;left:8px}
    .zb button{width:34px;height:34px;font-size:18px}
    .zb button svg{width:16px;height:16px}
  }
  body.pf #top{display:none}
  body.pf #stage{top:0}
</style>
</head>
<body>

<div id="top"><div id="title">تركيب الزغابة</div></div>
<div id="stage">
  <div id="draw"></div>
  <div class="zb">
    <button id="replay" aria-label="إعادة العرض من البداية" title="إعادة العرض"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg></button>
    <button id="play" class="on" aria-label="إيقاف الحركة" aria-pressed="true" title="الحركة"><svg viewBox="0 0 24 24" fill="currentColor"><path id="playIco" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
    <button id="all" hidden aria-label="عرض كل الأشكال" title="عرض كل الأشكال"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg></button>
    <button id="zin" aria-label="تكبير">+</button>
    <button id="zout" aria-label="تصغير">−</button>
    <button id="zreset" aria-label="إعادة الضبط">⟲</button>
    <button id="fs" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>

  if(fi>=0)v=v.map((x,j)=>lerp(x,PIECES[fi].view[j],ss(0,1,amt)));
  const vis=i=>fi<0?1:(i===fi?1:1-amt);
  const [vx,vy,vw,vh]=v,s=Math.min(VB[2]/vw,VB[3]/vh);
  cam.setAttribute('transform',`translate(${(VB[0]+VB[2]/2).toFixed(2)} ${(VB[1]+VB[3]/2).toFixed(2)}) scale(${s.toFixed(4)}) translate(${(-(vx+vw/2)).toFixed(2)} ${(-(vy+vh/2)).toFixed(2)})`);
  /* pieces */
  PIECES.forEach(P=>{const u=t-STEPS[P.step].t0-(P.step?.35:0),k=ss(0,1.1,u),sc=.9+.1*k,[cx,cy]=P.c;
    const pv=k*vis(PIECES.indexOf(P));P.g.setAttribute('opacity',pv.toFixed(3));P.g.style.pointerEvents=pv>.5?'auto':'none';P.g.setAttribute('transform',`translate(${cx} ${cy}) scale(${sc.toFixed(4)}) translate(${-cx} ${-cy})`);P.on=k;});
  ARROWS.forEach(A=>{const u=t-STEPS[A.step].t0+.55,k=ss(0,.75,u),h=ss(.6,.95,u);
    const off=(A.len*(1-k)).toFixed(1);A.p.setAttribute('stroke-dashoffset',off);A.sh.setAttribute('stroke-dashoffset',off);A.g.setAttribute('opacity',k>0?(fi<0?1:1-amt):0);
    A.h.setAttribute('transform',`translate(${A.end[0]} ${A.end[1]}) rotate(${A.ang.toFixed(1)}) scale(${(h*(1+.25*Math.sin(PI*h))).toFixed(3)})`);});
  NUMS.forEach(N=>{const k=ss(.6,1.4,t-STEPS[N.step].t0);N.g.setAttribute('opacity',(k*vis(N.step)).toFixed(3));N.g.setAttribute('transform',`translate(0 ${(12*(1-k)).toFixed(1)})`);});
  LABELS.forEach(o=>{
    o.parts.forEach(q=>{const u=t-q.at,pd=ss(0,.4,u),pl=ss(.3,1.2,u),pr=ss(0,.9,u);
      q.dot.setAttribute('r',(LW*2*pd*(1+.35*Math.sin(PI*Math.min(1,Math.max(0,u)/.4)))).toFixed(2));
      q.ring.setAttribute('r',(LW*2+LW*6*pr).toFixed(1));q.ring.setAttribute('opacity',(u>0&&u<.9?(1-pr)*.9:0).toFixed(2));
      const off=(q.len*(1-pl)).toFixed(1);[q.ln,q.halo].forEach(p=>{p.setAttribute('stroke-dashoffset',off);p.setAttribute('opacity',pl>0?1:0);});q.pg.setAttribute('opacity',vis(q.step).toFixed(3));});
    const pt=ss(1,1.8,t-o.at),tv=Math.max(...o.parts.map(q=>vis(q.step)));o.tg.setAttribute('opacity',(pt*tv).toFixed(3));o.tg.setAttribute('transform',`translate(0 ${(FS*.35*(1-pt)).toFixed(1)})`);
  });
  /* living parts */
  const m=RM?1:mt;
  REGIONS.forEach(R=>{const P=PIECES[R.piece],[cx,cy]=R.c;
    if(R.kind==='glow'){R.e.setAttribute('opacity',(P.on*(.16+.18*Math.sin(m*3))).toFixed(3));return;}
    let tr='';
    if(R.kind==='breathe'){const k=1+.008*Math.sin(m*1.6);tr=`translate(${cx} ${cy}) scale(${k.toFixed(4)}) translate(${-cx} ${-cy})`;}
    else{const i=R.i,a=(R.soft?.9:2.2)*Math.sin(m*1.3+i*.9),dx=(R.soft?1:2)*Math.sin(m*1.1+i*1.7);tr=`translate(${dx.toFixed(2)} 0) rotate(${a.toFixed(3)} ${cx} ${cy+R.r[1]*.8})`;}
    R.inner.setAttribute('transform',tr);});
  FLOWS.forEach(F=>{const on=PIECES[F.piece].on;F.ds.forEach((d,k)=>{const q=(m/F.per+k/F.n)%1,p=polyAt(F.pts,F.len,q);
    d.setAttribute('cx',p[0].toFixed(1));d.setAttribute('cy',p[1].toFixed(1));
    d.setAttribute('opacity',(on*(F.kind==='food'?.9:.85)*Math.sin(PI*q)).toFixed(3));
    if(F.kind==='food')d.setAttribute('r',(F.r*(1-.35*q)).toFixed(2));});});
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ===================== controls ===================== */
$('replay').onclick=()=>{T0=performance.now();reset();if(focus>=0)setFocus(-1,true);};
const allBtn=$('all');
function setFocus(i,instant){
  if(i===focus)return;
  /* clicking during the opening sequence: finish it first */
  if(i>=0&&(performance.now()-T0)/1000<STEPS[3].t0+3)T0=performance.now()-(STEPS[3].t0+3)*1000;
  prevFocus=focus;focus=i;fT0=instant?-1e9:performance.now();reset();allBtn.hidden=i<0;
}
allBtn.onclick=()=>setFocus(-1);
document.addEventListener('keydown',e=>{if(e.key==='Escape')setFocus(-1);});
const playBtn=$('play'),playIco=$('playIco');
function setPlay(v){playing=v;playBtn.classList.toggle('on',v);playBtn.setAttribute('aria-pressed',v);playBtn.setAttribute('aria-label',v?'إيقاف الحركة':'تشغيل الحركة');
  playIco.setAttribute('d',v?'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z':'M8 5l11 7-11 7z');}
playBtn.onclick=()=>setPlay(!playing);setPlay(playing);

/* zoom & pan */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>user.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
const mid0=()=>({x:VB[0]+VB[2]/2,y:VB[1]+VB[3]/2});
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
let down=null;
svg.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,tg:e.target,n:ptrs.size};svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prev=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prev.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);
svg.addEventListener('pointerup',e=>{
  if(down&&!down.n&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6){
    const pg=down.tg.closest&&down.tg.closest('[data-piece]');
    if(pg){const i=+pg.getAttribute('data-piece');setFocus(focus===i?-1:i);}
    else if(focus>=0&&!down.tg.closest('.lbl'))setFocus(-1);
  }
  down=null;up(e);});svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',e=>e.preventDefault());
function reset(){sc=1;tx=0;ty=0;apply();}
$('zin').onclick=()=>zoomAt(1.3,mid0());
$('zout').onclick=()=>zoomAt(1/1.3,mid0());
$('zreset').onclick=reset;

/* fullscreen */
const root=document.documentElement,fsIco=$('fsIco');
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
let pseudo=false;
const setPseudo=v=>{pseudo=v;document.body.classList.toggle('pf',v);fsUpd();};
$('fs').onclick=()=>{
  if(fsEl()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}return;}
  if(pseudo){setPseudo(false);return;}
  const req=root.requestFullscreen||root.webkitRequestFullscreen;
  if(!req||(document.fullscreenEnabled===false&&document.webkitFullscreenEnabled!==true)){setPseudo(true);return;}
  try{const r=req.call(root);if(r&&r.then)r.catch(()=>setPseudo(true));else setTimeout(()=>{if(!fsEl())setPseudo(true);},350);}catch(e){setPseudo(true);}
};
const fsUpd=()=>{const on=!!fsEl()||pseudo;fsIco.setAttribute('d',on?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');$('fs').setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');};
document.addEventListener('fullscreenchange',fsUpd);document.addEventListener('webkitfullscreenchange',fsUpd);
})();
</script>
