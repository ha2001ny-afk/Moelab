<style>

}

  .tools{gap:5px}

  #info{top:calc(max(10px,env(safe-area-inset-top)) + 46px)}
  #info .eq{font-size:12px}
  #info .wl{font-size:12.5px}
}
[hidden]{display:none!important}

<body>
<div class="stage">
  <canvas id="scene" aria-label="محاكاة ثلاثية الأبعاد لتجارب فيرنر على معقدات كلوريد الكوبلت والأمونيا"></canvas>
  <div id="info" aria-live="polite">
    <div class="ttl">تطور الكيمياء التناسقية · <b>تجارب فيرنر</b></div>
    <div id="eq1" class="eq"></div>
    <div id="eq2" class="eq"></div>
    <div id="wl" class="wl"></div>
  </div>
  <canvas id="ink" aria-hidden="true"></canvas>
  <div class="tools">
    <button id="labels" aria-pressed="true" aria-label="إظهار أسماء الأجزاء" title="أسماء الأجزاء"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg></button>

    <button id="dim" aria-pressed="false" aria-label="التبديل إلى منظر ثنائي الأبعاد" title="2D / 3D">2D</button>

    <button id="fullscreen" aria-label="ملء الشاشة" title="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsPath" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="pen" aria-pressed="false" aria-label="القلم" title="القلم"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.2-1L19.5 7.7a2.1 2.1 0 0 0-3-3L5.2 15.8 4 20z"/><path d="M14.5 6.5l3 3"/></svg></button>
    <button id="eraser" aria-pressed="false" aria-label="الممحاة" title="الممحاة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9.5L4.3 14.8a1.8 1.8 0 0 1 0-2.6l8-8a1.8 1.8 0 0 1 2.6 0l4.8 4.8a1.8 1.8 0 0 1 0 2.6L12 20"/><path d="M8.5 9.5l6 6"/></svg></button>
    <button id="clear" aria-label="مسح كل الكتابة" title="مسح الكل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg></button>
  </div>
  <div id="palette" class="palette" hidden>
    <button class="c" data-c="#ffffff" aria-pressed="true" aria-label="أبيض" style="background:#ffffff"></button>
    <button class="c" data-c="#ffd84a" aria-pressed="false" aria-label="أصفر" style="background:#ffd84a"></button>
    <button class="c" data-c="#ff5a5a" aria-pressed="false" aria-label="أحمر" style="background:#ff5a5a"></button>
    <button class="c" data-c="#5ee07a" aria-pressed="false" aria-label="أخضر" style="background:#5ee07a"></button>

    <span class="sep" style="height:24px"></span>
    <button class="w" data-w="3" aria-pressed="true" aria-label="خط رفيع"><i style="width:6px;height:6px"></i></button>
    <button class="w" data-w="7" aria-pressed="false" aria-label="خط سميك"><i style="width:12px;height:12px"></i></button>
  </div>
  <div id="toast" class="toast" hidden></div>

<script>
"use strict";
// ================= أدوات رياضية =================
const TAU=Math.PI*2, DEG=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z), sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,k)=>V(a.x*k,a.y*k,a.z*k), dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const norm=a=>mul(a,1/Math.hypot(a.x,a.y,a.z));
const lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const LIGHT=norm(V(-0.45,0.85,0.6)), FILL=norm(V(0.7,0.2,0.5));
function segDist(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,l=vx*vx+vy*vy||1;const t=clamp(((p.x-a.x)*vx+(p.y-a.y)*vy)/l,0,1);return Math.hypot(p.x-a.x-vx*t,p.y-a.y-vy*t)}

// ================= الكانفس والتخطيط =================
const cv=document.getElementById('scene'), ctx=cv.getContext('2d');
const LAY={land:{w:1000,h:650,cx:500,cy:372,k:1.3},port:{w:620,h:1240,cx:310,cy:690,k:1.12}};
let W=1,H=1,dpr=1,L=LAY.land,s=1,ox=0,oy=0,mode='land';

// ================= الكاميرا =================
const TARGET=V(0,120,10), DIST=1100; let cam=null;
const VIEW0={yaw:-0.42,pitch:0.30,zoom:1,px:0,py:0,ortho:0}; let view={...VIEW0};
function setupCam(){
  const cp=Math.cos(view.pitch), sp=Math.sin(view.pitch);
  const C=V(TARGET.x+DIST*Math.sin(view.yaw)*cp, TARGET.y+DIST*sp, TARGET.z+DIST*Math.cos(view.yaw)*cp);
  const f=norm(sub(TARGET,C)), r=norm(cross(f,V(0,1,0))), u=cross(r,f);
  cam={C,f,r,u,F:L.k*view.zoom*DIST,cx:L.cx+view.px,cy:L.cy+view.py};
}
function P(p){const v=sub(p,cam.C), dz=dot(v,cam.f), sc=cam.F/(dz*(1-view.ortho)+DIST*view.ortho);
  return{x:cam.cx+dot(v,cam.r)*sc,y:cam.cy-dot(v,cam.u)*sc,s:sc,z:dz}}
const viewVec=pt=>{const o=view.ortho;if(o<=0)return sub(cam.C,pt);if(o>=1)return mul(cam.f,-1);return add(mul(norm(sub(cam.C,pt)),1-o),mul(cam.f,-o))};
const depth=p=>dot(sub(p,cam.C),cam.f);
function col(c,a=1){return`rgba(${Math.round(clamp(c[0],0,255))},${Math.round(clamp(c[1],0,255))},${Math.round(clamp(c[2],0,255))},${a})`}
function lit(c,n,pt,o={}){
  const amb=o.amb??0.34, spec=o.spec??0.28, shin=o.shin??28;
  const dif=Math.max(0,dot(n,LIGHT)), v=norm(viewVec(pt)), h=norm(add(LIGHT,v));
  const sp=spec*Math.pow(Math.max(0,dot(n,h)),shin);
  const k=amb+0.7*dif+0.2*Math.max(0,dot(n,FILL))+0.22*Math.max(0,dot(n,v));
  return c.map(x=>x*k+255*sp);
}
function pathPts(ps,close=true){ctx.beginPath();ps.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));if(close)ctx.closePath()}
function centroid(ps){let x=0,y=0,z=0;ps.forEach(p=>{x+=p.x;y+=p.y;z+=p.z});return V(x/ps.length,y/ps.length,z/ps.length)}
function face(pts,n,c,o={}){
  const ctr=centroid(pts); if(dot(n,viewVec(ctr))<=0)return false;
  pathPts(pts.map(P)); const cc=col(lit(c,n,ctr,o),o.alpha??1);
  ctx.fillStyle=cc;ctx.fill();ctx.strokeStyle=o.line||cc;ctx.lineWidth=o.lw||.6;ctx.stroke();return true;
}
function box(x0,x1,y0,y1,z0,z1,c,o){const p=V;
  face([p(x1,y0,z0),p(x1,y1,z0),p(x1,y1,z1),p(x1,y0,z1)],V(1,0,0),c,o);
  face([p(x0,y0,z0),p(x0,y0,z1),p(x0,y1,z1),p(x0,y1,z0)],V(-1,0,0),c,o);
  face([p(x0,y1,z0),p(x0,y1,z1),p(x1,y1,z1),p(x1,y1,z0)],V(0,1,0),c,o);
  face([p(x0,y0,z0),p(x1,y0,z0),p(x1,y0,z1),p(x0,y0,z1)],V(0,-1,0),c,o);
  face([p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)],V(0,0,1),c,o);
  face([p(x0,y0,z0),p(x0,y1,z0),p(x1,y1,z0),p(x1,y0,z0)],V(0,0,-1),c,o);
}
function cyl(B,A,e1,e2,r,len,c,o={}){
  const n=o.sides||24, E=add(B,mul(A,len)), ring=[];
  for(let i=0;i<n;i++){const a=i/n*TAU+(o.rot||0);ring.push(add(mul(e1,Math.cos(a)),mul(e2,Math.sin(a))))}
  for(let i=0;i<n;i++){const a=ring[i],b=ring[(i+1)%n],cc=o.knurl&&i%2?c.map(v=>v*.72):c;
    face([add(B,mul(a,r)),add(B,mul(b,r)),add(E,mul(b,r)),add(E,mul(a,r))],norm(add(a,b)),cc,o)}
  if(o.cap1!==false)face(ring.map(d=>add(E,mul(d,r))),A,o.capCol||c,o);
  if(o.cap0!==false)face(ring.map(d=>add(B,mul(d,r))),mul(A,-1),o.capCol||c,o);
}
const cylZ=(x,y,r,z0,z1,c,o)=>cyl(V(x,y,z0),V(0,0,1),V(1,0,0),V(0,1,0),r,z1-z0,c,o);
const cylY=(x,z,r,y0,y1,c,o)=>cyl(V(x,y0,z),V(0,1,0),V(1,0,0),V(0,0,1),r,y1-y0,c,o);
function planeText(str,O,ex,ey,size,color,font='600 32px system-ui,Tahoma,sans-serif',dir='rtl'){
  const o=P(O),a=P(add(O,ex)),b=P(add(O,ey)),k=size/32; ctx.save();
  ctx.transform((a.x-o.x)*k,(a.y-o.y)*k,(b.x-o.x)*k,(b.y-o.y)*k,o.x,o.y);
  ctx.font=font;ctx.direction=dir;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(str,0,0);ctx.restore();
}
function ring3(cx,y,cz,r,n=28){const a=[];for(let i=0;i<n;i++){const t=i/n*TAU;a.push(V(cx+r*Math.cos(t),y,cz+r*Math.sin(t)))}return a}
// ظل ناعم على سطح الطاولة
function softShadow(cx,cz,rx,rz,a=.35){
  for(let i=3;i>=1;i--){const k=1+i*.18;const pts=[];for(let j=0;j<28;j++){const t=j/28*TAU;pts.push(P(V(cx+rx*k*Math.cos(t),0.3,cz+rz*k*Math.sin(t))))}
    pathPts(pts);ctx.fillStyle=`rgba(0,0,0,${a/(i+1)})`;ctx.fill()}
}

// ================= الأجسام الدورانية (الزجاج والسوائل) =================
// rings: [{r,y}] تصاعدياً في y ، الناتج: الحافتان المرئيتان على الشاشة
function silhouette(cx,cz,rings){
  const a=P(V(cx,0,cz)), b=P(V(cx,100,cz)); let ax=b.x-a.x, ay=b.y-a.y; const l=Math.hypot(ax,ay);
  let px,py; if(l<1e-3){px=1;py=0}else{ax/=l;ay/=l;px=-ay;py=ax}
  const Lp=[],Rp=[];
  for(const g of rings){const c=P(V(cx,g.y,cz)); if(g.r<0.02){Lp.push(c);Rp.push(c);continue}
    let mn=1e9,mx=-1e9,pm=c,pM=c;
    for(let i=0;i<28;i++){const t=i/28*TAU;const q=P(V(cx+g.r*Math.cos(t),g.y,cz+g.r*Math.sin(t)));const d=(q.x-c.x)*px+(q.y-c.y)*py;if(d<mn){mn=d;pm=q}if(d>mx){mx=d;pM=q}}
    Lp.push(pm);Rp.push(pM)}
  return{L:Lp,R:Rp,poly:[...Lp,...Rp.slice().reverse()]};
}
// أنبوب اختبار بقاع نصف كروي: نصف القطر r، مركز نصف الكرة yc
function tubeRings(r,yc,y0,y1){
  const bot=yc-r, lo=Math.max(y0,bot), ys=new Set([lo,y1]);
  for(let i=0;i<=10;i++){const y=yc-r*Math.cos(i/10*Math.PI/2);if(y>lo&&y<y1)ys.add(y)}
  return[...ys].sort((a,b)=>a-b).map(y=>({y,r:y<yc?Math.sqrt(Math.max(0,r*r-(yc-y)*(yc-y))):r}));
}
function gradAcross(sil,stops,a=1){
  const m=Math.floor(sil.L.length*0.6), p0=sil.L[Math.min(m,sil.L.length-1)], p1=sil.R[Math.min(m,sil.R.length-1)];
  const g=ctx.createLinearGradient(p0.x,p0.y,p1.x,p1.y);
  stops.forEach(([t,c,al])=>g.addColorStop(t,col(c,(al??1)*a)));return g;
}
function stripAt(sil,t0,t1,i0=0){ // شريط لمعان على امتداد الجسم
  const A=[],B=[];for(let i=i0;i<sil.L.length;i++){const l=sil.L[i],r=sil.R[i];A.push({x:lerp(l.x,r.x,t0),y:lerp(l.y,r.y,t0)});B.push({x:lerp(l.x,r.x,t1),y:lerp(l.y,r.y,t1)})}
  return[...A,...B.reverse()];
}

// ================= بيانات التجربة (قيم فيرنر الحقيقية) =================
// Λm عند 0.001 M (S·cm²·mol⁻¹) — قيم فيرنر وميولاتي للتوصيلية المولارية
const TUBES=[
  {x:-120, old:'CoCl₃·6NH₃', inner:'[Co(NH₃)₆]', out:'Cl₃', ch:'³⁺', n:3, ions:4, lam:432, rgb:[236,150,26], cl:[], color:'أصفر برتقالي', iso:''},
  {x:-40,  old:'CoCl₃·5NH₃', inner:'[Co(NH₃)₅Cl]', out:'Cl₂', ch:'²⁺', n:2, ions:3, lam:261, rgb:[146,38,112], cl:['+y'], color:'بنفسجي محمر', iso:''},
  {x:40,   old:'CoCl₃·4NH₃', inner:'[Co(NH₃)₄Cl₂]', out:'Cl', ch:'⁺', n:1, ions:2, lam:98, rgb:[46,138,64], cl:['+y','-y'], color:'أخضر', iso:'ترانس'},
  {x:120,  old:'CoCl₃·4NH₃', inner:'[Co(NH₃)₄Cl₂]', out:'Cl', ch:'⁺', n:1, ions:2, lam:98, rgb:[104,58,160], cl:['+y','+x'], color:'بنفسجي', iso:'سِس'},
];
const TUBE_R=9, TUBE_RI=8.2, TUBE_YC=17, TUBE_TOP=160, V0=10; // mm ، mL
const levelY=v=>{const hemi=2/3*Math.PI*Math.pow(TUBE_RI/10,3), A=Math.PI*Math.pow(TUBE_RI/10,2);return TUBE_YC+(v-hemi)/A*10};
const HOLO_Y=268;
const BOTTLE=V(222,0,42), METER={x0:-275,x1:-203,y0:0,y1:46,z0:18,z1:72};
const STAND=V(-190,0,44), PROBE_LEN=170;
const DROP_HOME=V(BOTTLE.x,77,BOTTLE.z), PROBE_HOME=V(-170,54,44);
const PIPE_LEN=64;

let st=[], sel=-1, dropper, probe, meter, drops=[], guide=0, holoA=0, now=0, lastT=0;
let showLabels=true, spin=false, is2D=false, saved3D=null, tween=null;
function resetState(){
  st=TUBES.map(()=>({vol:V0,ag:false,tAg:0,cond:false,rev:0,ripple:-9,parts:null,known:0}));
  sel=-1; drops=[]; guide=0;
  dropper={D:{...DROP_HOME},state:'home',path:null,onDone:null,tube:-1,t0:0,nd:0};
  probe={tip:{...PROBE_HOME},state:'home',path:null,onDone:null,tube:-1,t0:0};
  meter={disp:0,target:null,from:0,t0:0,tube:-1};
  updateInfo();
}

// ================= الرسم =================

  else E1.innerHTML=`${old} + AgNO₃(زيادة) → ${sp('m','؟')}`;

  else if(cdK) E2.innerHTML=`${old}(aq) → <span class="ar">${T.ions} أيونات (Λm ≈ ${T.lam})</span>`;
  else E2.innerHTML=agK?`<span class="ar">قِس التوصيلية لتعرف عدد الأيونات ←</span>`:'';
  WL.innerHTML=both?`نظرية فيرنر: ${sp('g','التكافؤ الأولي = 3')} (عدد تأكسد <bdi dir="ltr">Co³⁺</bdi>، قابل للتأين) · ${sp('c','التكافؤ الثانوي = 6')} (عدد التناسق، غير قابل للتأين)`:
    agK?`نتيجة أولى: ${T.n===1?'أيون كلوريد واحد حر':T.n+' أيونات كلوريد حرة'}. قِس التوصيلية للتأكد قبل رسم النموذج.`:
    cdK?`نتيجة أولى: المحلول يحتوي على ${T.ions} أيونات. أضف نترات الفضة لتعرف كم منها كلوريد.`:
    `اللون: ${T.color} — أضف نترات الفضة بالقطارة، أو قِس التوصيلية بالمجس.`;
}

// ================= الحركة والتحكم بالأدوات =================
function movePath(obj,key,pts,speed,done){obj.path={pts,i:0,key,speed};obj.onDone=done}
function stepPath(obj,dt){const pa=obj.path;if(!pa)return;let rem=pa.speed*dt;
  while(rem>0&&pa.i<pa.pts.length){const cur=obj[pa.key],tg=pa.pts[pa.i],dv=sub(tg,cur),l=Math.hypot(dv.x,dv.y,dv.z);
    if(l<=rem){obj[pa.key]={...tg};rem-=l;pa.i++}else{obj[pa.key]=add(cur,mul(dv,rem/l));rem=0}}
  if(pa.i>=pa.pts.length){obj.path=null;const d=obj.onDone;obj.onDone=null;d&&d()}}
const busy=()=>dropper.state!=='home'||probe.state!=='home';
function selectTube(i){if(sel!==i){sel=i;holoA=-.4;updateInfo()}if(guide===0)guide=1;paint()}
function addAg(i,fromDrag){
  if(i<0)i=st.findIndex(x=>!x.ag);if(i<0){toast('أُضيفت نترات الفضة إلى كل الأنابيب. اضغط إعادة التجربة للبدء من جديد.');return backHome()}
  if(st[i].ag){toast('هذا الأنبوب أُضيفت إليه نترات الفضة. اختر أنبوباً آخر.');return backHome()}
  if(probe.state!=='home'&&!fromDrag)return;
  selectTube(i);if(guide<=1)guide=2;
  const tx=TUBES[i].x, D=dropper.D, top=V(tx,TUBE_TOP+8+PIPE_LEN,0);
  dropper.state='move';dropper.tube=i;
  const pts=fromDrag?[top]:[V(D.x,262,D.z),V(tx,262,0),top];
  movePath(dropper,'D',pts,300,()=>{dropper.state='drip';dropper.t0=now;dropper.nd=0});
  run();
}
function backHome(){if(dropper.state==='drag'||dropper.state==='move'&&!dropper.path){const D=dropper.D;dropper.state='back';movePath(dropper,'D',[V(D.x,262,D.z),V(DROP_HOME.x,262,DROP_HOME.z),{...DROP_HOME}],320,()=>{dropper.state='home';paint()});run()}}
function measure(i,fromDrag){
  if(i<0)i=sel>=0?sel:0;
  if(dropper.state!=='home'&&!fromDrag)return;
  selectTube(i);if(guide<=2)guide=3;
  const tx=TUBES[i].x,t=probe.tip;probe.state='move';probe.tube=i;
  const pts=fromDrag?[V(tx,TUBE_TOP+14,0),V(tx,22,0)]:[V(t.x,TUBE_TOP+22,t.z),V(tx,TUBE_TOP+22,0),V(tx,22,0)];
  movePath(probe,'tip',pts,fromDrag?220:260,()=>{probe.state='read';probe.t0=now;meter.from=meter.target==null?0:meter.disp;meter.target=TUBES[i].lam;meter.tube=i;meter.t0=now});
  run();
}
function probeBack(){const t=probe.tip;probe.state='back';movePath(probe,'tip',[V(t.x,TUBE_TOP+22,t.z),V(PROBE_HOME.x,TUBE_TOP+22,PROBE_HOME.z),{...PROBE_HOME}],260,()=>{probe.state='home';probe.tube=-1;paint()});}
function update(dt){
  const ms=dt*1000;
  if(tween){const k=clamp((now-tween.t0)/tween.dur,0,1);for(const key in tween.to){const w=(tween.ph&&tween.ph[key])||[0,1],e=ease(clamp((k-w[0])/(w[1]-w[0]),0,1));view[key]=tween.from[key]+(tween.to[key]-tween.from[key])*e}if(k>=1)tween=null}
  if(spin&&!is2D&&!dragging())view.yaw+=Math.min(50,ms)*.00045;
  if(!HOLO.drag)HOLO.t+=dt*.7;
  stepPath(dropper,dt);stepPath(probe,dt);
  if(dropper.state==='drip'){const t=now-dropper.t0;while(dropper.nd<3&&t>=dropper.nd*420){const D=dropper.D;drops.push({x:D.x,y:D.y-PIPE_LEN-1.5,z:D.z,vy:0,ti:dropper.tube});dropper.nd++}
    if(t>1500){dropper.state='move';backHome()}}
  for(let k=drops.length-1;k>=0;k--){const q=drops[k];q.vy-=2600*dt;q.y+=q.vy*dt;const S=st[q.ti],lv=levelY(S.vol);
    if(q.y<=lv){drops.splice(k,1);S.vol+=0.35;S.ripple=now;if(!S.ag){S.ag=true;S.tAg=now;S.parts=null}}}
  st.forEach((S,i)=>{
    if(S.ag&&!S.agDone&&now-S.tAg>1100){S.agDone=true;S.known++;updateInfo();const T=TUBES[i];
      toast(`لكل 1 مول من المعقد ترسّب ${T.n} مول من كلوريد الفضة؛ إذن ${T.n===1?'ذرة كلور واحدة فقط من الثلاث أيون حر':T.n===3?'ذرات الكلور الثلاث كلها أيونات حرة':'ذرتان من ذرات الكلور الثلاث أيونات حرة'}.`+(S.cond?' اتفقت التجربتان ← ظهر نموذج فيرنر.':' قِس التوصيلية الآن لتتأكد من عدد الأيونات.'),7000)}
    const want=S.known>0?1:0;S.rev+=(want-S.rev)*Math.min(1,dt*3.2);if(Math.abs(want-S.rev)<.002)S.rev=want;
    const wf=S.agDone&&S.cond?1:0;S.full=(S.full||0)+(wf-(S.full||0))*Math.min(1,dt*2.6);if(Math.abs(wf-S.full)<.002)S.full=wf});
  if(meter.target!=null){const k=clamp((now-meter.t0)/1300,0,1);meter.disp=lerp(meter.from,meter.target,ease(k))+(k<1?(Math.random()-.5)*6*(1-k):0)}
  if(probe.state==='read'&&now-probe.t0>1500&&!st[probe.tube].cond){const i=probe.tube,T=TUBES[i];st[i].cond=true;st[i].known++;updateInfo();
    toast(`التوصيلية المولارية ≈ ${T.lam} وحدة (S·cm²/mol)؛ إذن يتفكك المعقد في الماء إلى ${T.ions} أيونات.`+(st[i].agDone?' اتفقت التجربتان ← ظهر نموذج فيرنر.':' أضف نترات الفضة لتعرف كم منها أيون كلوريد.'),7000)}
  if(probe.state==='read'&&now-probe.t0>3200)probeBack();
}
const dragging=()=>!!drag&&drag.moved;
function animating(){return!!tween||(spin&&!is2D)||busy()||drops.length>0||sel>=0||guidePoint()!=null||st.some(S=>S.ag&&now-S.tAg<9000)||(meter.target!=null&&now-meter.t0<1400)||st.some(S=>Math.abs((S.known?1:0)-S.rev)>0||Math.abs((S.agDone&&S.cond?1:0)-(S.full||0))>0)}
let raf=0;
function frame(t){raf=0;const dt=Math.min(.05,Math.max(0,(t-(lastT||t))/1000));lastT=t;now=t;update(dt);draw();if(animating())raf=requestAnimationFrame(frame);else lastT=0}
function paint(){if(!raf)raf=requestAnimationFrame(frame)}
const run=paint;

// ================= الإدخال =================
function toV(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}}
function hit(p){
  const hr=HOLO.rect;if(hr&&sel>=0&&(st[sel].full||0)>.4&&p.x>=hr.x&&p.x<=hr.x+hr.w&&p.y>=hr.y&&p.y<=hr.y+hr.h)return{kind:'holo'};
  if(dropper.state==='home'||dropper.state==='drag'){
    const D=dropper.D;
    if(segDist(p,P(V(D.x,D.y-4,D.z)),P(V(D.x,D.y+30,D.z)))<22)return{kind:'dropper'};
    if(dropper.state==='home'&&segDist(p,P(V(BOTTLE.x,8,BOTTLE.z)),P(V(BOTTLE.x,66,BOTTLE.z)))<24*L.k)return{kind:'dropper'};
  }
  if(probe.state==='home'&&segDist(p,P(probe.tip),P(add(probe.tip,V(0,PROBE_LEN,0))))<16)return{kind:'probe'};
  if(segDist(p,P(V(-262,24,METER.z1)),P(V(-216,24,METER.z1)))<30*L.k)return{kind:'meter'};
  let best=null,bd=22;
  TUBES.forEach((T,i)=>{const d=segDist(p,P(V(T.x,10,0)),P(V(T.x,TUBE_TOP,0)));if(d<bd){bd=d;best={kind:'tube',idx:i}}});
  return best;
}
function rayPlane(p,axis,val){ // تقاطع شعاع الشاشة مع مستوى
  const sx=p.x-cam.cx, sy=p.y-cam.cy; let O,Dr;
  if(view.ortho>.5){const k=DIST/cam.F;O=add(cam.C,add(mul(cam.r,sx*k),mul(cam.u,-sy*k)));Dr=cam.f}
  else{O=cam.C;Dr=add(cam.f,add(mul(cam.r,sx/cam.F),mul(cam.u,-sy/cam.F)))}
  const dn=Dr[axis];if(Math.abs(dn)<1e-4)return null;const t=(val-O[axis])/dn;if(t<0)return null;return add(O,mul(Dr,t));
}
function toolDragTo(p,kind){
  const yLvl=kind==='dropper'?TUBE_TOP+8+PIPE_LEN:TUBE_TOP+14, cur=kind==='dropper'?dropper.D:probe.tip;
  const yPl=kind==='dropper'?yLvl-PIPE_LEN:yLvl; // مستوى طرف الأداة
  const pick=q=>is2D?rayPlane(q,'z',0):rayPlane(q,'y',yPl);
  if(!drag.w0){drag.w0=pick(drag.start);drag.t0={...cur}}
  const w=pick(p);if(!w||!drag.w0)return;
  const x=clamp(drag.t0.x+w.x-drag.w0.x,-300,300), z=is2D?lerp(cur.z,0,.25):clamp(drag.t0.z+w.z-drag.w0.z,-120,120);
  const np=V(x,yLvl,z);if(kind==='dropper')dropper.D=np;else probe.tip=np;
}
function nearestTube(kind){const tip=kind==='dropper'?P(V(dropper.D.x,dropper.D.y-PIPE_LEN,dropper.D.z)):P(probe.tip);
  const w=kind==='dropper'?dropper.D:probe.tip;let bi=-1,bd=1e9;TUBES.forEach((T,i)=>{const d=Math.min(d2(P(V(T.x,TUBE_TOP,0)),tip)/44,Math.hypot(w.x-T.x,w.z)/26);if(d<1&&d<bd){bd=d;bi=i}});return bi}
const ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const p=toV(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:d2(a,b)};if(drag&&(drag.kind==='dropper'||drag.kind==='probe')&&drag.moved)releaseTool();drag=null;return}
  const h=hit(p);drag={kind:h?h.kind:'bg',idx:h?h.idx:-1,start:p,last:p,moved:false,w0:null,t0:null};
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const p=toV(e);ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()],d=d2(a,b);zoomAt({x:(a.x+b.x)/2,y:(a.y+b.y)/2},d/pinch.d);pinch.d=d;return}
  if(!drag)return;const dx=p.x-drag.last.x,dy=p.y-drag.last.y;
  if(!drag.moved&&d2(p,drag.start)>6){drag.moved=true;
    if(drag.kind==='dropper'){if(busy()&&dropper.state!=='home'){drag.kind='bg'}else{dropper.state='drag';if(guide<=1)guide=2}}
    if(drag.kind==='probe'){if(busy()){drag.kind='bg'}else{probe.state='drag';probe.tube=-1}}
    if(drag.kind==='tube'||drag.kind==='meter')drag.kind='bg';}
  if(drag.moved){
    if(drag.kind==='dropper'||drag.kind==='probe'){toolDragTo(p,drag.kind);run()}
    else if(drag.kind==='holo'){if(!HOLO.drag){HOLO.yaw+=.12*Math.sin(HOLO.t);HOLO.t=0;HOLO.drag=true}HOLO.yaw+=dx*.012;HOLO.pitch=clamp(HOLO.pitch+dy*.01,-1.35,1.35);paint()}
    else if(drag.kind==='bg'){if(tween&&!('ortho'in tween.to))tween=null;if(!tween){if(is2D){view.px+=dx;view.py+=dy}else{view.yaw-=dx*.008;view.pitch=clamp(view.pitch+dy*.006,.12,1.45)}paint()}}
  }
  drag.last=p;
});
function releaseTool(){
  const kind=drag.kind,i=nearestTube(kind);
  if(kind==='dropper'){dropper.state='move';if(i>=0&&!st[i].ag)addAg(i,true);else{if(i>=0)toast('هذا الأنبوب أُضيفت إليه نترات الفضة. اختر أنبوباً آخر.');backHome()}}
  else{if(i>=0){probe.state='home';measure(i,true)}else{probe.state='move';probeBack();run()}}
}
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);HOLO.drag=false;
  if(pinch){if(ptrs.size<2)pinch=null;drag=null;return}
  if(!drag)return;
  if(drag.moved&&(drag.kind==='dropper'||drag.kind==='probe'))releaseTool();
  else if(!drag.moved){
    if(drag.kind==='tube'){selectTube(drag.idx)}
    else if(drag.kind==='dropper'){if(!busy())addAg(sel,false)}
    else if(drag.kind==='probe'||drag.kind==='meter'){if(!busy())measure(sel,false)}
  }
  drag=null;paint();
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('dblclick',e=>{const hp=toV(e),hr=HOLO.rect;if(hr&&hp.x>=hr.x&&hp.x<=hr.x+hr.w&&hp.y>=hr.y&&hp.y<=hr.y+hr.h){HOLO.yaw=.45;HOLO.pitch=.55;HOLO.t=0;paint();return}if(is2D){view.px=0;view.py=0;view.zoom=1}else{tween={from:{...view},to:{yaw:VIEW0.yaw,pitch:VIEW0.pitch,zoom:1,px:0,py:0},t0:performance.now(),dur:600}}paint()});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(toV(e),Math.exp(-e.deltaY*.0015))},{passive:false});
function zoomAt(p,f){const z=clamp(view.zoom*f,.6,3.2),r=z/view.zoom;if(r===1)return;
  const cx=L.cx+view.px,cy=L.cy+view.py;view.px=p.x-(p.x-cx)*r-L.cx;view.py=p.y-(p.y-cy)*r-L.cy;view.zoom=z;paint()}

// ================= الأزرار =================
const $=id=>document.getElementById(id);
const tEl=$('toast');let tTimer=0;
function toast(m,ms=5000){tEl.textContent=m;tEl.hidden=false;tEl.style.opacity=1;clearTimeout(tTimer);tTimer=setTimeout(()=>{tEl.style.opacity=0;setTimeout(()=>tEl.hidden=true,400)},ms)}
$('labels').onclick=e=>{showLabels=!showLabels;e.currentTarget.setAttribute('aria-pressed',showLabels);paint()};
$('spin').onclick=e=>{if(is2D){toast('الدوران التلقائي متاح في منظر 3D');return}spin=!spin;e.currentTarget.setAttribute('aria-pressed',spin);paint()};
$('dim').onclick=e=>{is2D=!is2D;const b=e.currentTarget;b.setAttribute('aria-pressed',is2D);b.textContent=is2D?'3D':'2D';b.setAttribute('aria-label',is2D?'التبديل إلى منظر ثلاثي الأبعاد':'التبديل إلى منظر ثنائي الأبعاد');
  if(is2D){if(!(tween&&tween.to.ortho===0&&saved3D)){saved3D={yaw:view.yaw,pitch:view.pitch,px:view.px,py:view.py,zoom:view.zoom}}else{saved3D={...saved3D}}spin=false;$('spin').setAttribute('aria-pressed',false);
    tween={from:{...view},to:{yaw:view.yaw-wrapA(view.yaw),pitch:0,ortho:1,px:0,py:0,zoom:1},ph:{yaw:[0,.7],pitch:[0,.7],px:[0,.7],py:[0,.7],zoom:[0,.7],ortho:[.45,1]},t0:performance.now(),dur:900}}
  else{const sv=saved3D||VIEW0;tween={from:{...view},to:{yaw:sv.yaw,pitch:sv.pitch,ortho:0,px:sv.px,py:sv.py,zoom:sv.zoom??1},ph:{ortho:[0,.55],yaw:[.3,1],pitch:[.3,1],px:[.3,1],py:[.3,1],zoom:[.3,1]},t0:performance.now(),dur:900}}
  paint()};
$('reset').onclick=()=>{resetState();HOLO.yaw=.45;HOLO.pitch=.55;HOLO.t=0;tween={from:{...view},to:is2D?{px:0,py:0,zoom:1}:{yaw:VIEW0.yaw,pitch:VIEW0.pitch,px:0,py:0,zoom:1},t0:performance.now(),dur:600};toast('أُعيدت التجربة. اضغط على أنبوب لتبدأ.',3500);paint()};
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
$('fullscreen').onclick=async()=>{try{if(fsEl()){await(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const el=document.documentElement;const f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)throw 0;await f.call(el)}}catch(_){toast('ملء الشاشة غير متاح في هذا المتصفح')}};
function fsUpd(){const on=!!fsEl();$('fsPath').setAttribute('d',on?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');$('fullscreen').setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة')}
document.addEventListener('fullscreenchange',fsUpd);document.addEventListener('webkitfullscreenchange',fsUpd);

// ================= القلم =================
const ink=$('ink'),ictx=ink.getContext('2d'),pal=$('palette');
const pen={mode:null,color:'#ffffff',w:3,last:null,id:null};
function sizeInk(){const r=ink.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),nw=Math.max(1,Math.round(r.width*d)),nh=Math.max(1,Math.round(r.height*d));
  if(ink.width===nw&&ink.height===nh)return;const tmp=document.createElement('canvas');tmp.width=ink.width;tmp.height=ink.height;tmp.getContext('2d').drawImage(ink,0,0);
  ink.width=nw;ink.height=nh;ictx.drawImage(tmp,0,0)}
function setPen(m){pen.mode=pen.mode===m?null:m;$('pen').setAttribute('aria-pressed',pen.mode==='pen');$('eraser').setAttribute('aria-pressed',pen.mode==='erase');
  pal.hidden=pen.mode!=='pen';ink.style.pointerEvents=pen.mode?'auto':'none';ink.style.cursor=pen.mode==='pen'?'crosshair':pen.mode==='erase'?'cell':''}
$('pen').onclick=()=>setPen('pen');$('eraser').onclick=()=>setPen('erase');
$('clear').onclick=()=>{ictx.clearRect(0,0,ink.width,ink.height)};
pal.querySelectorAll('.c').forEach(b=>b.onclick=()=>{pen.color=b.dataset.c;pal.querySelectorAll('.c').forEach(x=>x.setAttribute('aria-pressed',x===b))});
pal.querySelectorAll('.w').forEach(b=>b.onclick=()=>{pen.w=+b.dataset.w;pal.querySelectorAll('.w').forEach(x=>x.setAttribute('aria-pressed',x===b))});
function inkPt(e){const r=ink.getBoundingClientRect(),k=ink.width/r.width;return{x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k,k}}
ink.addEventListener('pointerdown',e=>{if(!pen.mode)return;ink.setPointerCapture(e.pointerId);pen.id=e.pointerId;pen.last=inkPt(e);stroke(pen.last,pen.last)});
ink.addEventListener('pointermove',e=>{if(pen.id!==e.pointerId)return;const p=inkPt(e);stroke(pen.last,p);pen.last=p});
const inkEnd=e=>{if(pen.id===e.pointerId){pen.id=null;pen.last=null}};ink.addEventListener('pointerup',inkEnd);ink.addEventListener('pointercancel',inkEnd);
function stroke(a,b){ictx.save();ictx.lineCap='round';ictx.lineJoin='round';
  if(pen.mode==='erase'){ictx.globalCompositeOperation='destination-out';ictx.lineWidth=24*a.k}else{ictx.strokeStyle=pen.color;ictx.lineWidth=pen.w*a.k}
  ictx.beginPath();ictx.moveTo(a.x,a.y);ictx.lineTo(b.x+.01,b.y);ictx.stroke();ictx.restore()}

// ================= التحجيم والبدء =================
function resize(){const r=cv.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);mode=W/H>=0.9?'land':'port';L=LAY[mode];s=Math.min(W/L.w,H/L.h);ox=(W-L.w*s)/2;oy=(H-L.h*s)/2;sizeInk();paint()}
new ResizeObserver(resize).observe(document.querySelector('.stage'));
resetState();resize();
toast('اضغط على أنبوب لاختياره، ثم اضغط القطارة لإضافة نترات الفضة، أو جهاز التوصيلية لقياس عدد الأيونات · اسحب للتدوير · إصبعان أو العجلة للتكبير',6500);
window.__sim={get state(){return{sel,st,dropper,probe,meter,view,is2D,guide}},select:selectTube,addAg:i=>addAg(i,false),measure:i=>measure(i,false),P:p=>{setupCam();return P(p)},toV:(x,y)=>({x:x*s+ox,y:y*s+oy}),TUBES};
</script>
