<meta charset="UTF-8">

<title>الخلية العصبية النموذجية وانواع الخلايا العصبية</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}

  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}

  #nav button{height:38px;padding:0 14px;border-radius:19px;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-family:inherit;font-weight:bold;font-size:clamp(12px,3.3vw,16px);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap}

<body>
<div id="top"><div id="title">الخلية العصبية النموذجية وانواع الخلايا العصبية</div></div>
<div id="stage">
  <div class="zb"><button id="zin">+</button><button id="zout">−</button><button id="zreset">⟲</button><button id="pause">⏸</button><button id="fs">⛶</button></div>
  <svg class="defs" aria-hidden="true">
    <defs>
      <radialGradient id="gBody" cx="0.38" cy="0.32" r="0.78"><stop offset="0" stop-color="#ffdc8c"/><stop offset="0.55" stop-color="#f6aa30"/><stop offset="1" stop-color="#e2861a"/></radialGradient>
      <radialGradient id="gNuc" cx="0.35" cy="0.35" r="0.8"><stop offset="0" stop-color="#cbb6ec"/><stop offset="0.55" stop-color="#9379ca"/><stop offset="1" stop-color="#644a9f"/></radialGradient>
      <linearGradient id="gMy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b51ab"/><stop offset="0.35" stop-color="#9d96e4"/><stop offset="0.7" stop-color="#7d74cf"/><stop offset="1" stop-color="#4e4497"/></linearGradient>
      <radialGradient id="gGlow"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#fff59a" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd23c" stop-opacity="0"/></radialGradient>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#e0552a"/></marker>
    </defs>
  </svg>
  <svg id="svg1" class="sc on" viewBox="40 10 920 740" preserveAspectRatio="xMidYMid meet"><g id="view1"></g></svg>
  <svg id="svg2" class="sc" viewBox="-30 0 1215 650" preserveAspectRatio="xMidYMid meet"><g id="view2"></g></svg>
</div>
<div id="nav"><button id="go1" class="on">الخلية العصبية النموذجية</button><button id="go2">أنواع الخلايا العصبية</button></div>

<script>
(function(){
const stage=document.getElementById('stage');

/* =================== الصفحة 1: الخلية العصبية النموذجية =================== */
function sceneTypical(svg,view){

const NS="http://www.w3.org/2000/svg",PI=Math.PI,RAD=PI/180;
let active=false;
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
let rs=11;const rnd=()=>{rs=(rs*9301+49297)%233280;return rs/233280;};
const lerp=(a,b,u)=>a+(b-a)*u,f1=v=>(+v).toFixed(1);
const OUT='#de8618',INN='#fcc35a',BODYC='#f4a52d';

/* ---------- layers ---------- */
function layers(p){const g=G(p);return {g,O:G(g),I:G(g),B:G(g),My:G(g),K:G(g),Fx:G(g)};}

/* ---------- branching trees (dendrites / terminals) ---------- */
const trees=[];
function branch(ang,len,w,depth,spread){
  const n={ang,len,w,ph:rnd()*6.28,kids:[]};
  if(depth>0){const k=depth>1&&rnd()<.4?3:2;
    for(let j=0;j<k;j++){const a=-spread/2+spread*j/(k-1)+(rnd()-.5)*.25;
      n.kids.push(branch(a,len*(.66+rnd()*.14),Math.max(2.2,w*.64),depth-1,spread*.92));}}
  return n;}
function build(n,Ly,kn){
  n.o=el('line',{stroke:OUT,'stroke-width':f1(n.w+2.6),'stroke-linecap':'round'},Ly.O);
  n.i=el('line',{stroke:INN,'stroke-width':f1(Math.max(1,n.w*.42)),'stroke-linecap':'round',opacity:.9},Ly.I);
  if(kn&&!n.kids.length){
    if(kn>1)n.kb=el('circle',{r:6.5,fill:'url(#gBody)',stroke:'#cf7a14','stroke-width':1.5},Ly.K);
    n.kg=el('circle',{r:13,fill:'url(#gGlow)',opacity:0},Ly.Fx);}
  n.kids.forEach(k=>build(k,Ly,kn));}
function tree(n,x,y,a,amp,Ly,kn){build(n,Ly,kn);const T={n,x,y,a,amp};trees.push(T);return T;}
function upd(n,x,y,pa,t,amp){
  const a=pa+n.ang+amp*Math.sin(t*1.25+n.ph);
  const ex=x+Math.cos(a)*n.len,ey=y+Math.sin(a)*n.len;n.st=[x,y];n.end=[ex,ey];
  for(const L of [n.o,n.i]){L.setAttribute('x1',f1(x));L.setAttribute('y1',f1(y));L.setAttribute('x2',f1(ex));L.setAttribute('y2',f1(ey));}
  for(const c of [n.kb,n.kg])if(c){c.setAttribute('cx',f1(ex));c.setAttribute('cy',f1(ey));}
  n.kids.forEach(k=>upd(k,ex,ey,a,t,amp*1.6));}
function chain(n,idx){const ns=[n];while(n.kids.length){n=n.kids[Math.min(idx,n.kids.length-1)];ns.push(n);}return ns;}
function leaves(n,o){o=o||[];if(!n.kids.length)o.push(n);n.kids.forEach(k=>leaves(k,o));return o;}

/* ---------- shared parts ---------- */
function nucleus(Ly,x,y,rx,ry,nr){const g=G(Ly.B);
  el('ellipse',{rx,ry,fill:'url(#gNuc)',stroke:'#5d4593','stroke-width':1.5},g);
  el('circle',{cx:-rx*.2,cy:-ry*.12,r:nr||rx*.28,fill:'#3e2a6b',opacity:.85},g);
  el('ellipse',{cx:-rx*.3,cy:-ry*.66,rx:rx*.34,ry:ry*.12,fill:'#fff',opacity:.35},g);
  return {g,x,y,rx,ry,ph:rnd()*6.28,cx:x,cy:y};}
function moveNuc(n,t){n.cx=n.x+1.8*Math.sin(t*.6+n.ph);n.cy=n.y+1.5*Math.cos(t*.8+n.ph);
  n.g.setAttribute('transform',`translate(${f1(n.cx)} ${f1(n.cy)})`);}
function blob(cx,cy,R,bul,t){const N=48,pts=[];
  for(let k=0;k<N;k++){const th=k/N*2*PI;let r=R+3*Math.sin(3*th+t*.9)+2*Math.sin(5*th-t*.7+1);
    bul.forEach(b=>{const d=Math.atan2(Math.sin(th-b),Math.cos(th-b));r+=12*Math.exp(-d*d/.025);});
    pts.push([cx+r*Math.cos(th),cy+r*Math.sin(th)]);}
  const pm=pts[N-1],p0=pts[0];let d=`M${f1((pm[0]+p0[0])/2)},${f1((pm[1]+p0[1])/2)}`;
  for(let k=0;k<N;k++){const p=pts[k],q=pts[(k+1)%N];d+=`Q${f1(p[0])},${f1(p[1])} ${f1((p[0]+q[0])/2)},${f1((p[1]+q[1])/2)}`;}
  return d+'Z';}

/* ---------- smooth axon path (Catmull-Rom) ---------- */
function crSample(P,n){const out=[];
  for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
      out.push([0,1].map(j=>.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)));}}
  out.push(P[P.length-1]);return out;}

/* =========== the neuron =========== */
const L1=layers(view);
const BX=300,BY=330,BR=46,AX=-12*RAD;

/* dendrites (التفرعات الشجيرية) */
const dAng=[-55,-90,-125,-160,165,130,95,60,25];
const tD=dAng.map((d,i)=>{const a=d*RAD;
  return tree(branch(0,34+rnd()*8,10,i%3===1?3:2,1.0),BX+(BR-4)*Math.cos(a),BY+(BR-4)*Math.sin(a),a,.045,L1);});
const bul=dAng.map(d=>d*RAD).concat([AX]);

/* axon geometry */
const ux=Math.cos(AX),uy=Math.sin(AX),vx=-uy,vy=ux;
const P=(d,s)=>[BX+ux*d+vx*s,BY+uy*d+vy*s];
const WP=[P(62,0),[420,304],[475,284],[528,253],[575,228],[613,232],[636,265],[645,325],[645,405],[640,485],[630,548]];
const AP=crSample(WP,10),AS=[0];
for(let i=1;i<AP.length;i++)AS.push(AS[i-1]+Math.hypot(AP[i][0]-AP[i-1][0],AP[i][1]-AP[i-1][1]));
const AL=AS[AS.length-1];
function at(s){s=Math.max(0,Math.min(AL,s));let i=1;while(i<AS.length-1&&AS[i]<s)i++;
  const L=(AS[i]-AS[i-1])||1,u=(s-AS[i-1])/L,a=AP[i-1],b=AP[i];
  return {x:lerp(a[0],b[0],u),y:lerp(a[1],b[1],u),tx:(b[0]-a[0])/L,ty:(b[1]-a[1])/L};}
function sub(s0,s1){const n=Math.max(2,Math.ceil((s1-s0)/4)),pts=[];
  for(let k=0;k<=n;k++){const q=at(lerp(s0,s1,k/n));pts.push(f1(q.x)+','+f1(q.y));}
  return 'M'+pts.join('L');}

/* axon core */
el('path',{d:sub(0,AL),fill:'none',stroke:OUT,'stroke-width':10,'stroke-linecap':'round'},L1.O);
el('path',{d:sub(0,AL),fill:'none',stroke:INN,'stroke-width':3.5,'stroke-linecap':'round',opacity:.9},L1.I);

/* axon hillock + cell body (جسم الخلية) */
const h1=P(36,-16),h2=P(36,16),h3=P(74,5.5),h4=P(74,-5.5),c1=P(54,-8),c2=P(54,8);
el('path',{d:`M${f1(h1[0])},${f1(h1[1])} Q${f1(c1[0])},${f1(c1[1])} ${f1(h4[0])},${f1(h4[1])} L${f1(h3[0])},${f1(h3[1])} Q${f1(c2[0])},${f1(c2[1])} ${f1(h2[0])},${f1(h2[1])} Z`,fill:BODYC},L1.B);
const body=el('path',{fill:'url(#gBody)',stroke:'#e08a1d','stroke-width':1.2},L1.B);
const mot=[0,1,2,3,4].map(()=>({x:BX-26+rnd()*52,y:BY-26+rnd()*52,ph:rnd()*6.28,e:el('circle',{r:f1(5+rnd()*6),fill:'#ffe6a8',opacity:.3},L1.B)}));
el('ellipse',{cx:BX-15,cy:BY-20,rx:18,ry:10,fill:'#fff',opacity:.22},L1.B);
/* النواة + النوية */
const nuc=nucleus(L1,BX,BY,18,18,6.5);

/* الغمد الدهني (segments wrapped round the axon, gaps between them) */
const MS=46,MG=10,mStart=48,segs=[];
for(let s=mStart;s+MS<=AL-22;s+=MS+MG)segs.push(s);
const myStr=[[28,'#463d8e',1],[24,'#7d74cf',1],[12,'#9d96e4',.9],[4,'#d2cdf6',.45]];
segs.forEach(s=>myStr.forEach(m=>el('path',{d:sub(s+m[0]/2,s+MS-m[0]/2),fill:'none',stroke:m[1],'stroke-width':m[0],'stroke-linecap':'round',opacity:m[2]},L1.My)));
const nodes=segs.slice(0,-1).map(s=>at(s+MS+MG/2));

/* axon terminal branches with small end bulbs (as drawn in the book, unlabeled) */
const E=at(AL);
const term=tree(branch(0,42,9,3,1.5),E.x,E.y,72*RAD,.035,L1,2);
const tLeaves=leaves(term.n);

trees.forEach(R=>upd(R.n,R.x,R.y,R.a,0,R.amp));

/* ---------- nerve impulse ---------- */
function mkRoute(w,rest){let T=rest;w.forEach(x=>T+=(x.d||0)+(x.h||0));return {w,T};}
function rpos(R,t){let tt=t%R.T;
  for(let i=0;i<R.w.length;i++){const w=R.w[i],p=w.p();
    if(i>0&&w.d){if(tt<w.d){const q=R.w[i-1].p(),u=tt/w.d;return {x:lerp(q[0],p[0],u),y:lerp(q[1],p[1],u),i,h:0};}tt-=w.d;}
    if(tt<(w.h||0))return {x:p[0],y:p[1],i,h:Math.sin(PI*tt/w.h)};tt-=(w.h||0);}
  return null;}
function fromLeaf(root,idx){const c=chain(root,idx),w=[{p:()=>c[c.length-1].end}];
  for(let k=c.length-1;k>=0;k--){const n=c[k];w.push({p:()=>n.st,d:.18});}return w;}
const pt=(x,y,d,h)=>({p:()=>[x,y],d,h});

const a0=at(0),a1=at(30);
const w1=fromLeaf(tD[0].n,0);
w1.push(pt(BX,BY,.2,.35),pt(a0.x,a0.y,.15,.04),pt(a1.x,a1.y,.1,.04));
nodes.forEach(q=>w1.push(pt(q.x,q.y,.07,.13)));
w1.push(pt(E.x,E.y,.08,.05),{p:()=>term.n.end,d:.1,h:.5});
const imps=[{R:mkRoute(w1,.9),off:0,ends:tLeaves.map(n=>n.kg),g:el('circle',{r:8,fill:'url(#gGlow)',opacity:0},L1.Fx)}];

/* ---------- labels (book terms, verbatim) ---------- */
let LAY='L',LF=1;
const gL=G(view),labs=[];
function label(txt,pos,tfs){const g=G(gL,{'pointer-events':'none'});
  const lns=tfs.map(()=>el('line',{class:'ln','marker-end':'url(#ah)'},g));
  const r=el('rect',{class:'pill'},g),tx=el('text',{class:'lbl'},g);tx.textContent=txt;
  labs.push({lns,r,tx,pos,tfs,cx:0,cy:0});}
function sizeLabels(){labs.forEach(L=>{const p=L.pos[LAY]||L.pos.L;L.cx=p[0];L.cy=p[1];
  const fs=18*LF,h=34*LF;L.tx.style.fontSize=fs+'px';L.tx.setAttribute('x',L.cx);L.tx.setAttribute('y',L.cy);
  let w=0;try{w=L.tx.getBBox().width;}catch(e){}if(!w)w=fs*.6*L.tx.textContent.length;w+=30*LF;
  L.r.setAttribute('x',f1(L.cx-w/2));L.r.setAttribute('y',f1(L.cy-h/2));L.r.setAttribute('width',f1(w));L.r.setAttribute('height',f1(h));L.r.setAttribute('rx',f1(h/2));
  L.r.style.strokeWidth=2.5*LF;L.lns.forEach(a=>a.style.strokeWidth=2.4*LF);});}
function drawLabels(){labs.forEach(L=>L.tfs.forEach((f,i)=>{const q=f(),a=L.lns[i];
  a.setAttribute('x1',f1(L.cx));a.setAttribute('y1',f1(L.cy));a.setAttribute('x2',f1(q[0]));a.setAttribute('y2',f1(q[1]));}));}

const qm=at(segs[2]+MS/2);
let sAx=0,best=1e9;for(let s=AL*.5;s<AL;s+=2){const q=at(s),d=Math.abs(q.y-385);if(d<best){best=d;sAx=s;}}
const qa=at(sAx);
label('التفرعات الشجيرية',{L:[215,55],P:[340,55]},[()=>tD[2].n.kids[0].end,()=>tD[1].n.kids[1].end]);
label('الغمد الدهني',{L:[560,115]},[()=>[qm.x+qm.ty*15,qm.y-qm.tx*15]]);
label('المحور',{L:[840,385]},[()=>[qa.x+16,qa.y]]);
label('النوية',{L:[548,440]},[()=>[nuc.cx-nuc.rx*.2,nuc.cy-nuc.ry*.12]]);
label('النواة',{L:[548,505]},[()=>[nuc.cx+nuc.rx*.72,nuc.cy+nuc.ry*.68]]);
label('جسم الخلية',{L:[150,610],P:[195,615]},[()=>[BX-17,BY+43]]);

/* ---------- animation ---------- */
let T=0,last=performance.now(),paused=false;
function frame(ms){
  if(!active){last=ms;requestAnimationFrame(frame);return;}
  const dt=Math.max(0,Math.min(.05,(ms-last)/1000));last=ms;T+=paused?0:dt;const t=T;
  trees.forEach(R=>upd(R.n,R.x,R.y,R.a,t,R.amp));
  body.setAttribute('d',blob(BX,BY,BR,bul,t));
  mot.forEach(m=>{m.e.setAttribute('cx',f1(m.x+4*Math.sin(t*.5+m.ph)));m.e.setAttribute('cy',f1(m.y+4*Math.cos(t*.4+m.ph)));});
  moveNuc(nuc,t);
  imps.forEach(I=>{const r=rpos(I.R,t+I.off);
    if(!r){I.g.setAttribute('opacity',0);I.ends.forEach(e=>e.setAttribute('opacity',0));return;}
    I.g.setAttribute('opacity',1);I.g.setAttribute('cx',f1(r.x));I.g.setAttribute('cy',f1(r.y));I.g.setAttribute('r',f1(8+10*r.h));
    const fl=r.i===I.R.w.length-1?r.h:0;I.ends.forEach(e=>e.setAttribute('opacity',(fl*.9).toFixed(2)));});
  drawLabels();
  requestAnimationFrame(frame);
}

/* ---------- zoom & pan ---------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ctr=()=>{const b=svg.viewBox.baseVal;return {x:b.x+b.width/2,y:b.y+b.height/2};};
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
svg.addEventListener('dblclick',reset);

/* ---------- responsive layout (landscape / portrait) ---------- */
const VB={L:'40 10 920 740',P:'95 -500 830 1290'};
function layout(force){const r=stage.getBoundingClientRect();
  const nl=(r.height>0&&r.width/r.height<.9)?'P':'L',nf=nl==='P'?1.3:(r.height<420?1.25:1);
  if(nl===LAY&&nf===LF&&!force)return;
  LAY=nl;LF=nf;svg.setAttribute('viewBox',VB[LAY]);
  sizeLabels();drawLabels();reset();}
let rz=0;window.addEventListener('resize',()=>{if(!active)return;cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>layout(false));});

requestAnimationFrame(frame);
return {show(on){active=on;if(on){layout(true);reset();}},pause(p){paused=p;},zin(){zoomAt(1.3,ctr());},zout(){zoomAt(1/1.3,ctr());},reset,relayout(){if(active)layout(false);}};
}

/* =================== الصفحة 2: أنواع الخلايا العصبية =================== */
function sceneTypes(svg,view){

const NS="http://www.w3.org/2000/svg",PI=Math.PI,RAD=PI/180;
let active=false;
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
let rs=11;const rnd=()=>{rs=(rs*9301+49297)%233280;return rs/233280;};
const lerp=(a,b,u)=>a+(b-a)*u,f1=v=>(+v).toFixed(1);
const OUT='#de8618',INN='#fcc35a',BODYC='#f4a52d';

/* ---------- layers ---------- */
function layers(p){const g=G(p);return {g,O:G(g),I:G(g),B:G(g),My:G(g),K:G(g),Fx:G(g)};}

/* ---------- branching trees ---------- */
const trees=[];
function branch(ang,len,w,depth,spread){
  const n={ang,len,w,ph:rnd()*6.28,kids:[]};
  if(depth>0){const k=depth>1&&rnd()<.4?3:2;
    for(let j=0;j<k;j++){const a=-spread/2+spread*j/(k-1)+(rnd()-.5)*.25;
      n.kids.push(branch(a,len*(.66+rnd()*.14),Math.max(2.2,w*.64),depth-1,spread*.92));}}
  return n;}
function build(n,Ly,kn){
  n.o=el('line',{stroke:OUT,'stroke-width':f1(n.w+2.6),'stroke-linecap':'round'},Ly.O);
  n.i=el('line',{stroke:INN,'stroke-width':f1(Math.max(1,n.w*.42)),'stroke-linecap':'round',opacity:.9},Ly.I);
  if(kn&&!n.kids.length){
    if(kn>1)n.kb=el('circle',{r:6.5,fill:'url(#gBody)',stroke:'#cf7a14','stroke-width':1.5},Ly.K);
    n.kg=el('circle',{r:13,fill:'url(#gGlow)',opacity:0},Ly.Fx);}
  n.kids.forEach(k=>build(k,Ly,kn));}
function tree(n,x,y,a,amp,Ly,kn){build(n,Ly,kn);const T={n,x,y,a,amp};trees.push(T);return T;}
function upd(n,x,y,pa,t,amp){
  const a=pa+n.ang+amp*Math.sin(t*1.25+n.ph);
  const ex=x+Math.cos(a)*n.len,ey=y+Math.sin(a)*n.len;n.st=[x,y];n.end=[ex,ey];
  for(const L of [n.o,n.i]){L.setAttribute('x1',f1(x));L.setAttribute('y1',f1(y));L.setAttribute('x2',f1(ex));L.setAttribute('y2',f1(ey));}
  for(const c of [n.kb,n.kg])if(c){c.setAttribute('cx',f1(ex));c.setAttribute('cy',f1(ey));}
  n.kids.forEach(k=>upd(k,ex,ey,a,t,amp*1.6));}
function chain(n,idx){const ns=[n];while(n.kids.length){n=n.kids[Math.min(idx,n.kids.length-1)];ns.push(n);}return ns;}
function leaves(n,o){o=o||[];if(!n.kids.length)o.push(n);n.kids.forEach(k=>leaves(k,o));return o;}

/* ---------- shared parts ---------- */
function myelin(Ly,x,y,h){el('rect',{x:x-15,y,width:30,height:h,rx:10,fill:'url(#gMy)',stroke:'#463d8e','stroke-width':1.5},Ly.My);
  el('rect',{x:x-9,y:y+5,width:5,height:h-10,rx:2.5,fill:'#d2cdf6',opacity:.35},Ly.My);}
function myelinRun(Ly,x,y0,y1,h,g){const ys=[];for(let y=y0;y+h<=y1+.1;y+=h+g){myelin(Ly,x,y,h);ys.push(y);}
  return ys.slice(0,-1).map(y=>y+h+g/2);}
function vline(Ly,x,y0,y1){
  el('line',{x1:x,y1:y0,x2:x,y2:y1,stroke:OUT,'stroke-width':10,'stroke-linecap':'round'},Ly.O);
  el('line',{x1:x,y1:y0,x2:x,y2:y1,stroke:INN,'stroke-width':3.5,'stroke-linecap':'round',opacity:.9},Ly.I);}
function nucleus(Ly,x,y,rx,ry){const g=G(Ly.B);
  el('ellipse',{rx,ry,fill:'url(#gNuc)',stroke:'#5d4593','stroke-width':1.5},g);
  el('circle',{cx:-rx*.2,cy:-ry*.15,r:rx*.28,fill:'#5b3f8f',opacity:.7},g);
  el('ellipse',{cx:-rx*.35,cy:-ry*.55,rx:rx*.35,ry:ry*.15,fill:'#fff',opacity:.35},g);
  return {g,x,y,ph:rnd()*6.28};}
function moveNuc(n,t){n.g.setAttribute('transform',`translate(${f1(n.x+1.6*Math.sin(t*.6+n.ph))} ${f1(n.y+1.3*Math.cos(t*.8+n.ph))})`);}
function blob(cx,cy,R,bul,t){const N=48,pts=[];
  for(let k=0;k<N;k++){const th=k/N*2*PI;let r=R+3*Math.sin(3*th+t*.9)+2*Math.sin(5*th-t*.7+1);
    bul.forEach(b=>{const d=Math.atan2(Math.sin(th-b),Math.cos(th-b));r+=11*Math.exp(-d*d/.025);});
    pts.push([cx+r*Math.cos(th),cy+r*Math.sin(th)]);}
  const pm=pts[N-1],p0=pts[0];let d=`M${f1((pm[0]+p0[0])/2)},${f1((pm[1]+p0[1])/2)}`;
  for(let k=0;k<N;k++){const p=pts[k],q=pts[(k+1)%N];d+=`Q${f1(p[0])},${f1(p[1])} ${f1((p[0]+q[0])/2)},${f1((p[1]+q[1])/2)}`;}
  return d+'Z';}

/* ---------- neurons (each drawn in its own local frame, x=0 is its centre line) ---------- */
const NR=[];
function neuron(pos,title){const Ly=layers(view),N={Ly,pos,anim:[],nucs:[]};
  N.z=el('text',{class:'zone',x:0,y:24},Ly.g);N.z.textContent=title;NR.push(N);return N;}

/* ===== متعددة الاقطاب ===== */
const M=neuron({L:[1000,0],P:[500,0]},'متعددة الاقطاب');
(function(){const Ly=M.Ly,cy=140;
  const ang=[-90,-128,-52,-162,-18,162,18,130,50];
  M.tr=ang.map(d=>{const a=d*RAD;return tree(branch(0,24+rnd()*6,8,2,1.0),30*Math.cos(a),cy+30*Math.sin(a),a,.05,Ly);});
  vline(Ly,0,170,560);
  el('path',{d:'M-15,165 Q-5,186 -4,206 L4,206 Q5,186 15,165 Z',fill:BODYC},Ly.B);
  const b=el('path',{fill:'url(#gBody)',stroke:'#e08a1d','stroke-width':1.2},Ly.B);
  el('ellipse',{cx:-11,cy:124,rx:13,ry:8,fill:'#fff',opacity:.22},Ly.B);
  M.nucs.push(nucleus(Ly,0,cy,12,15));
  const bul=ang.map(d=>d*RAD).concat([PI/2]);
  M.anim.push(t=>b.setAttribute('d',blob(0,cy,32,bul,t)));
  M.nodes=myelinRun(Ly,0,208,548,38,9);
  M.term=tree(branch(0,20,7,2,1.3),0,560,PI/2,.035,Ly,1);
})();

/* ===== ذات القطب الكاذب ===== */
const K=neuron({L:[720,0],P:[200,0]},'ذات القطب الكاذب');
(function(){const Ly=K.Ly;
  K.top=tree({ang:0,len:8,w:9,ph:0,kids:[branch(-.7,26,6,1,.7),branch(0,30,6,1,.6),branch(.7,26,6,1,.7)]},12,102,-PI/2,.02,Ly,1);
  K.bot=tree({ang:0,len:10,w:9,ph:2,kids:[branch(-.65,36,6,1,.6),branch(0,40,6,1,.5),branch(.65,36,6,1,.6)]},12,528,PI/2,.02,Ly,2);
  vline(Ly,12,100,530);
  el('path',{d:'M-26,214 Q-4,222 12,246',fill:'none',stroke:OUT,'stroke-width':12,'stroke-linecap':'round'},Ly.O);
  el('path',{d:'M-26,214 Q-4,222 12,246',fill:'none',stroke:INN,'stroke-width':4.5,'stroke-linecap':'round',opacity:.9},Ly.I);
  const c=el('circle',{cx:-46,cy:205,r:28,fill:'url(#gBody)',stroke:'#e29022','stroke-width':1.2},Ly.B);
  el('ellipse',{cx:-55,cy:193,rx:10,ry:6,fill:'#fff',opacity:.22},Ly.B);
  K.nucs.push(nucleus(Ly,-46,205,10,12));
  K.anim.push(t=>c.setAttribute('r',f1(28+1.2*Math.sin(t*1.2+.7))));
  K.rec=leaves(K.bot.n);
})();

/* ===== ثنائية القطب ===== */
const Bp=neuron({L:[440,0],P:[500,650]},'ثنائية القطب');
(function(){const Ly=Bp.Ly;
  const root={ang:0,len:16,w:9,ph:0,kids:[branch(-.65,24,6,1,.8),branch(0,28,6,1,.7),branch(.65,24,6,1,.8)]};
  Bp.dt=tree(root,0,114,-PI/2,.02,Ly);
  vline(Ly,0,112,560);
  el('path',{d:'M-14,312 Q-4,298 -4,284 L4,284 Q4,298 14,312 Z',fill:BODYC},Ly.B);
  el('path',{d:'M-14,368 Q-4,382 -4,396 L4,396 Q4,382 14,368 Z',fill:BODYC},Ly.B);
  const e=el('ellipse',{cx:0,cy:340,rx:28,ry:38,fill:'url(#gBody)',stroke:'#e29022','stroke-width':1.2},Ly.B);
  el('ellipse',{cx:-10,cy:322,rx:10,ry:7,fill:'#fff',opacity:.22},Ly.B);
  Bp.nucs.push(nucleus(Ly,0,340,10,13));
  Bp.anim.push(t=>{e.setAttribute('rx',f1(28+1.2*Math.sin(t*1.1)));e.setAttribute('ry',f1(38+1.2*Math.sin(t*1.1+1.4)));});
  Bp.n1=myelinRun(Ly,0,126,296,36,8);
  Bp.n2=myelinRun(Ly,0,392,560,36,8);
  Bp.end=tree({ang:0,len:12,w:6,ph:1,kids:[]},0,560,PI/2,.02,Ly,2);
})();

/* ===== احادية القطب ===== */
const U=neuron({L:[165,0],P:[200,650]},'احادية القطب');
(function(){const Ly=U.Ly;
  vline(Ly,0,150,540);
  el('path',{d:'M-13,158 Q-4,174 -4,192 L4,192 Q4,174 13,158 Z',fill:BODYC},Ly.B);
  const e=el('ellipse',{cx:0,cy:128,rx:32,ry:36,fill:'url(#gBody)',stroke:'#e29022','stroke-width':1.2},Ly.B);
  el('ellipse',{cx:-11,cy:112,rx:11,ry:7,fill:'#fff',opacity:.22},Ly.B);
  U.nucs.push(nucleus(Ly,0,128,11,14));
  U.anim.push(t=>{e.setAttribute('rx',f1(32+1.2*Math.sin(t*1.1+.5)));e.setAttribute('ry',f1(36+1.2*Math.sin(t*1.1+1.9)));});
  U.nodes=myelinRun(Ly,0,192,530,40,9);
  U.term=tree(branch(0,20,7,2,1.3),0,540,PI/2,.035,Ly,1);
})();

trees.forEach(R=>upd(R.n,R.x,R.y,R.a,0,R.amp));

/* ---------- nerve impulses ---------- */
function mkRoute(w,rest){let T=rest;w.forEach(x=>T+=(x.d||0)+(x.h||0));return {w,T};}
function rpos(R,t){let tt=t%R.T;
  for(let i=0;i<R.w.length;i++){const w=R.w[i],p=w.p();
    if(i>0&&w.d){if(tt<w.d){const q=R.w[i-1].p(),u=tt/w.d;return {x:lerp(q[0],p[0],u),y:lerp(q[1],p[1],u),i,h:0};}tt-=w.d;}
    if(tt<(w.h||0))return {x:p[0],y:p[1],i,h:Math.sin(PI*tt/w.h)};tt-=(w.h||0);}
  return null;}
function fromLeaf(root,idx){const c=chain(root,idx),w=[{p:()=>c[c.length-1].end}];
  for(let k=c.length-1;k>=0;k--){const n=c[k];w.push({p:()=>n.st,d:.18});}return w;}
const pt=(x,y,d,h)=>({p:()=>[x,y],d,h});
const imps=[];
function impulse(N,w,off,ends){imps.push({R:mkRoute(w,.9),off,ends,g:el('circle',{r:8,fill:'url(#gGlow)',opacity:0},N.Ly.Fx)});}

/* multipolar: dendrite → cell body → jumps along the sheath → terminals */
(function(){const w=fromLeaf(M.tr[0].n,0);
  w.push(pt(0,140,.18,.3),pt(0,200,.2,.05));
  M.nodes.forEach(y=>w.push(pt(0,y,.07,.13)));
  w.push(pt(0,548,.07,.05),{p:()=>M.term.n.end,d:.1,h:.5});
  impulse(M,w,0,leaves(M.term.n).map(n=>n.kg));})();

/* pseudo-unipolar: sensory receptors → up the single fibre → upper branches */
(function(){const w=fromLeaf(K.bot.n,1);
  w.push(pt(12,246,.55,.1),pt(12,102,.35,0));
  chain(K.top.n,1).forEach((n,i,a)=>w.push({p:()=>n.end,d:.12,h:i===a.length-1?.5:0}));
  impulse(K,w,1.0,leaves(K.top.n).map(n=>n.kg));})();

/* bipolar: upper branches → cell body → lower fibre → end knob */
(function(){const w=fromLeaf(Bp.dt.n,1);
  Bp.n1.forEach(y=>w.push(pt(0,y,.07,.12)));
  w.push(pt(0,300,.07,.04),pt(0,340,.12,.3),pt(0,386,.12,.04));
  Bp.n2.forEach(y=>w.push(pt(0,y,.07,.12)));
  w.push(pt(0,558,.07,.04),{p:()=>Bp.end.n.end,d:.08,h:.5});
  impulse(Bp,w,2.0,[Bp.end.n.kg]);})();

/* unipolar: cell body → down the sheathed fibre → end branches */
(function(){const w=[pt(0,128,0,.35),pt(0,182,.2,.05)];
  U.nodes.forEach(y=>w.push(pt(0,y,.07,.13)));
  w.push(pt(0,536,.07,.05),{p:()=>U.term.n.end,d:.1,h:.5});
  impulse(U,w,3.0,leaves(U.term.n).map(n=>n.kg));})();

/* ---------- labels (book terms, verbatim) ---------- */
let LAY='L',LF=1;
const gL=G(view),labs=[];
function label(txt,own,pos,tfs){const g=G(gL,{'pointer-events':'none'});
  const lns=tfs.map(()=>el('line',{class:'ln','marker-end':'url(#ah)'},g));
  const r=el('rect',{class:'pill'},g),tx=el('text',{class:'lbl'},g);tx.textContent=txt;
  labs.push({lns,r,tx,own,pos,tfs,cx:0,cy:0});}
function sizeLabels(){labs.forEach(L=>{const o=L.own.pos[LAY];L.cx=o[0]+L.pos[0];L.cy=o[1]+L.pos[1];
  const fs=18*LF,h=34*LF;L.tx.style.fontSize=fs+'px';L.tx.setAttribute('x',L.cx);L.tx.setAttribute('y',L.cy);
  let w=0;try{w=L.tx.getBBox().width;}catch(e){}if(!w)w=fs*.6*L.tx.textContent.length;w+=30*LF;
  L.r.setAttribute('x',f1(L.cx-w/2));L.r.setAttribute('y',f1(L.cy-h/2));L.r.setAttribute('width',f1(w));L.r.setAttribute('height',f1(h));L.r.setAttribute('rx',f1(h/2));
  L.r.style.strokeWidth=2.5*LF;L.lns.forEach(a=>a.style.strokeWidth=2.4*LF);});}
function drawLabels(){labs.forEach(L=>{const o=L.own.pos[LAY];L.tfs.forEach((f,i)=>{const q=f(),a=L.lns[i];
  a.setAttribute('x1',f1(L.cx));a.setAttribute('y1',f1(L.cy));a.setAttribute('x2',f1(o[0]+q[0]));a.setAttribute('y2',f1(o[1]+q[1]));});});}

label('تشجرات',M,[122,62],[()=>M.tr[2].n.kids[0].end]);
label('المحور',M,[-92,380],[()=>[-16,380]]);
label('جسم الخلية',U,[-118,128],[()=>[-33,128]]);
label('الغمد',U,[-95,360],[()=>[-16,360]]);
label('مستقبلات حسية',K,[-125,585],[()=>{let b=null;K.rec.forEach(n=>{if(!b||n.end[0]<b[0])b=n.end;});return [b[0]-5,b[1]+3];}]);

/* ---------- animation ---------- */
let T=0,last=performance.now(),paused=false;
function frame(ms){
  if(!active){last=ms;requestAnimationFrame(frame);return;}
  const dt=Math.max(0,Math.min(.05,(ms-last)/1000));last=ms;T+=paused?0:dt;const t=T;
  trees.forEach(R=>upd(R.n,R.x,R.y,R.a,t,R.amp));
  NR.forEach(N=>{N.anim.forEach(f=>f(t));N.nucs.forEach(n=>moveNuc(n,t));});
  imps.forEach(I=>{const r=rpos(I.R,t+I.off);
    if(!r){I.g.setAttribute('opacity',0);I.ends.forEach(e=>e.setAttribute('opacity',0));return;}
    I.g.setAttribute('opacity',1);I.g.setAttribute('cx',f1(r.x));I.g.setAttribute('cy',f1(r.y));I.g.setAttribute('r',f1(8+10*r.h));
    const fl=r.i===I.R.w.length-1?r.h:0;I.ends.forEach(e=>e.setAttribute('opacity',(fl*.9).toFixed(2)));});
  drawLabels();
  requestAnimationFrame(frame);
}

/* ---------- zoom & pan ---------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ctr=()=>{const b=svg.viewBox.baseVal;return {x:b.x+b.width/2,y:b.y+b.height/2};};
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
svg.addEventListener('dblclick',reset);

/* ---------- responsive layout: one row (landscape) / 2×2 grid (portrait) ---------- */
const VB={L:'-30 0 1215 650',P:'-20 0 715 1282'};
function layout(force){const r=stage.getBoundingClientRect();
  const nl=(r.height>0&&r.width/r.height<.9)?'P':'L',nf=nl==='P'?1.3:(r.height<420?1.25:1);
  if(nl===LAY&&nf===LF&&!force)return;
  LAY=nl;LF=nf;svg.setAttribute('viewBox',VB[LAY]);
  NR.forEach(N=>{const p=N.pos[LAY];N.Ly.g.setAttribute('transform',`translate(${p[0]} ${p[1]})`);N.z.style.fontSize=(21*(LAY==='P'?1.2:1))+'px';});
  sizeLabels();drawLabels();reset();}
let rz=0;window.addEventListener('resize',()=>{if(!active)return;cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>layout(false));});

requestAnimationFrame(frame);
return {show(on){active=on;if(on){layout(true);reset();}},pause(p){paused=p;},zin(){zoomAt(1.3,ctr());},zout(){zoomAt(1/1.3,ctr());},reset,relayout(){if(active)layout(false);}};
}

const S=[sceneTypical(document.getElementById('svg1'),document.getElementById('view1')),
         sceneTypes(document.getElementById('svg2'),document.getElementById('view2'))];
const svgs=[document.getElementById('svg1'),document.getElementById('svg2')];
const tabs=[document.getElementById('go1'),document.getElementById('go2')];
let cur=0,paused=false;
function go(i){cur=i;svgs.forEach((s,k)=>s.classList.toggle('on',k===i));tabs.forEach((b,k)=>b.classList.toggle('on',k===i));
  S.forEach((s,k)=>s.show(k===i));}
tabs.forEach((b,k)=>b.onclick=()=>go(k));

/* ---------- shared side buttons ---------- */
document.getElementById('zin').onclick=()=>S[cur].zin();
document.getElementById('zout').onclick=()=>S[cur].zout();
document.getElementById('zreset').onclick=()=>S[cur].reset();
document.getElementById('pause').onclick=function(){paused=!paused;S.forEach(s=>s.pause(paused));this.textContent=paused?'▶':'⏸';};

/* ---------- fullscreen ---------- */
const fsBtn=document.getElementById('fs'),docEl=document.documentElement;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';S[cur].reset();S[cur].relayout();}
fsBtn.onclick=()=>{
  const on=!document.body.classList.contains('fs');
  if(on){const r=docEl.requestFullscreen||docEl.webkitRequestFullscreen;
    if(r){try{const p=r.call(docEl);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
    setFs(true);
  }else{
    if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}
    setFs(false);
  }
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));

go(0);
})();
</script>
