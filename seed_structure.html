<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>تركيب البذور</title>
<style>
  :root{--navy:#1f3a52;--paper:#fff;--ink:#1f3a52;--rust:#b5321f;--hint:#c4623a;color-scheme:light}
  html{height:100%;box-sizing:border-box}
  html,body{margin:0;overflow:hidden;background:var(--paper);font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:var(--paper)}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:14px;padding-bottom:env(safe-area-inset-bottom,0px)}
  #go,#prev{min-width:150px;height:56px;padding:0 22px;border-radius:28px;border:3px solid var(--navy);background:var(--paper);color:var(--navy);font:bold 21px Tahoma,"Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  #prev:disabled{opacity:.35;cursor:default;box-shadow:none}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);background:var(--paper);color:var(--navy);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .zb button:focus-visible,#go:focus-visible,#prev:focus-visible{outline:3px solid var(--hint);outline-offset:2px}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  #go:active,#prev:active{background:#d9ebf7}
  .bx{fill:var(--ink);font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .bs{fill:#6a5a3a;font-size:16px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .lb{fill:var(--ink);font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .lt{fill:var(--rust);font-size:17px;font-weight:bold;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
</style>
</head>
<body>

<div id="top"><div id="title">تركيب البذور</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 1000 820" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gB" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#a9b6ff"/><stop offset=".55" stop-color="#3b47c4"/><stop offset="1" stop-color="#141a6b"/></radialGradient>
        <radialGradient id="gP" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#f1c6ff"/><stop offset=".55" stop-color="#9b3fc4"/><stop offset="1" stop-color="#4a1470"/></radialGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <radialGradient id="gCorn" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ffe27a"/><stop offset=".6" stop-color="#f2b52e"/><stop offset="1" stop-color="#c47a12"/></radialGradient>
        <radialGradient id="gBean" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#d0704a"/><stop offset=".6" stop-color="#9a3a22"/><stop offset="1" stop-color="#5a1c10"/></radialGradient>
        <radialGradient id="gCot" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#f8e8bd"/><stop offset="1" stop-color="#d6ae74"/></radialGradient>
        <radialGradient id="gScu" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#e9f5c8"/><stop offset="1" stop-color="#a9d06a"/></radialGradient>
        <pattern id="pE" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff3d2"/><circle cx="4" cy="4" r="3.2" fill="#fffbec" stroke="#e2cf9a" stroke-width=".6"/></pattern>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl"><button id="prev" disabled>السابق ▶</button><button id="go">ابدأ</button></div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const lp2=(p,q,u)=>[lerp(p[0],q[0],u),lerp(p[1],q[1],u)];
const show=(e,op)=>{if(op<.01){e.style.display='none';return false;}e.style.display='';e.setAttribute('opacity',f2(op));return true;};
const pop=v=>v*(1+.25*Math.sin(PI*v));
let seed=23;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

const DUR=[5,6,6,4.5,5,6,7,5];
const world=G(view);
el('line',{x1:40,y1:412,x2:960,y2:412,stroke:'#c9b48a','stroke-width':1.5,'stroke-dasharray':'8 6'},world);
const Lglow=G(world),Lobj=G(world),Ltok=G(world);

/* ---------------- building blocks ---------------- */
function Ball(parent,grad,r){const g=G(parent);
  el('circle',{r,fill:`url(#${grad})`,stroke:{gB:'#10165a',gP:'#3a0a5a'}[grad],'stroke-width':1},g);
  el('ellipse',{cx:-r*.35,cy:-r*.4,rx:r*.3,ry:r*.2,fill:'#fff',opacity:.55},g);return{g,r};}
function setBall(b,p,s,op){if(!show(b.g,op*(s>.02?1:0)))return;b.g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f2(s)})`);}
function Box(x,y,w,h,lines,sub){const g=G(Lobj);
  el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:4,fill:'#fff',stroke:'#1f3a52','stroke-width':2.2},g);
  const n=lines.length+(sub?1:0);
  lines.forEach((s,i)=>{const t=el('text',{class:'bx',x:0,y:(i-(n-1)/2)*26},g);t.textContent=s;});
  if(sub){const t=el('text',{class:'bs',x:0,y:((n-1)/2)*26},g);t.textContent=sub;}
  return{g,x,y};}
function setBox(b,v){if(show(b.g,v))b.g.setAttribute('transform',`translate(${b.x} ${b.y}) scale(${f2(.85+.15*v)})`);}
function Txt(x,y,s,par,cls){const t=el('text',{class:cls||'lb',x,y},par||Lobj);t.textContent=s;return t;}
const path=(d,a,p)=>el('path',Object.assign({d,fill:'none','stroke-linecap':'round'},a),p);
function popAt(g,cx,cy,v){if(!show(g,v>.01?1:0))return;g.setAttribute('transform',`translate(${cx} ${cy}) scale(${f2(pop(v))}) translate(${-cx} ${-cy})`);}
function growAt(g,cx,cy,v,s0){if(!show(g,v>.01?1:0))return;g.setAttribute('transform',`translate(${cx} ${cy}) scale(${f2(lerp(s0,1,v))}) translate(${-cx} ${-cy})`);}
function Dash(p,v){const L=p.__L||(p.__L=p.getTotalLength());if(!show(p,v>.005?1:0))return;p.setAttribute('stroke-dasharray',`${f1(v*L)} ${f1(L+10)}`);}
const lead=(d,p,c)=>path(d,{stroke:c||'#1f3a52','stroke-width':1.6},p);
const Glow=(cx,cy,r)=>el('circle',{cx,cy,r,fill:'url(#gGlow)'},Lglow);
function Lab(items){const g=G(Lobj);items.forEach(it=>{if(it[0]==='L')lead(it[1],g,it[2]);else Txt(it[0],it[1],it[2],g,it[3]);});return g;}
/* endosperm nucleus: 1 -> 2 -> 4 -> 8 -> 16 nuclei spreading out */
function EndoTree(inside,minD,n){const pts=[];
  for(let k=0;k<4000&&pts.length<n;k++){const p=inside();if(p&&pts.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>=minD))pts.push(p);}
  const order=(a,d)=>{if(a.length<2)return a;a.sort((p,q)=>d%2?p[0]-q[0]:p[1]-q[1]);const h=a.length>>1;return order(a.slice(0,h),d+1).concat(order(a.slice(h),d+1));};
  const L=[order(pts,0)];while(L[0].length>1){const up=[];for(let i=0;i<L[0].length;i+=2)up.push(lp2(L[0][i],L[0][i+1],.5));L.unshift(up);}
  const balls=L[4].map(()=>Ball(Ltok,'gP',7));
  return{balls,set(lev,op,br){const k=Math.min(3,Math.floor(lev)),u=ease(clamp(lev-k,0,1));
    balls.forEach((b,j)=>setBall(b,lp2(L[k][j>>(4-k)],L[k+1][j>>(3-k)],u),br(j),op));}};}

/* ================= (أ) monocot grain, section ================= */
const CORN='M300,40 C368,40 382,100 376,150 C368,220 336,290 304,332 C299,338 295,338 290,330 C258,288 230,220 224,150 C218,100 232,40 300,40Z';
const INSET='translate(300 180) scale(.9 .93) translate(-300 -180)';
const coatA=G(Lobj);el('path',{d:CORN,fill:'#e8a83a'},coatA);
const sacA=el('path',{d:CORN,fill:'#fffbe6',transform:INSET},Lobj);
const endA=el('path',{d:CORN,fill:'url(#pE)',transform:INSET},Lobj);
const outA=path(CORN,{stroke:'#8a4a0c','stroke-width':3},Lobj);
const glA=Glow(326,248,70);
const scuA=G(Lobj);el('ellipse',{cx:322,cy:245,rx:25,ry:58,fill:'url(#gScu)',stroke:'#5a8a2a','stroke-width':2,transform:'rotate(20 322 245)'},scuA);
const axA=G(Lobj);
el('ellipse',{cx:336,cy:224,rx:7,ry:26,fill:'#3e8a28',stroke:'#24561a','stroke-width':1.2,transform:'rotate(20 336 224)'},axA);
el('ellipse',{cx:316,cy:279,rx:7,ry:17,fill:'#c9b26a',stroke:'#7a6a2a','stroke-width':1.2,transform:'rotate(20 316 279)'},axA);
path('M330,250 L324,262',{stroke:'#5a7a2a','stroke-width':4},axA);
const ZA=[328,252],zyA=Ball(Ltok,'gB',8);
const enA=EndoTree(()=>{const a=rnd()*2*PI,r=Math.sqrt(rnd()),p=[297+52*r*Math.cos(a),165+95*r*Math.sin(a)];return Math.hypot(p[0]-325,p[1]-248)>42?p:null;},22,16);
const EA=[292,150];
const lAc=Lab([[480,62,'طبقة محيطة'],['L','M428,62 L362,72']]);
const lAt=Lab([[130,150,'نواة السويداء 3س','lt'],['L','M200,150 L282,150','#b5321f'],[140,258,'زيجة 2س','lt'],['L','M180,258 L318,253','#b5321f']]);
const lAs=Lab([[480,135,'سويداء'],['L','M446,135 L325,140']]);
const lAe=Lab([[480,205,'ورقة جنينية'],['L','M428,205 L322,222'],[480,290,'جذير'],['L','M456,290 L320,283']]);
/* external grain */
const exA=G(Lobj);
el('path',{d:CORN,fill:'url(#gCorn)',stroke:'#8a4a0c','stroke-width':3,transform:'translate(340 0)'},exA);
el('ellipse',{cx:662,cy:245,rx:24,ry:58,fill:'#fff1b0',stroke:'#c4922a','stroke-width':1.5,transform:'rotate(20 662 245)'},exA);
el('ellipse',{cx:620,cy:90,rx:16,ry:8,fill:'#fff',opacity:.35},exA);
const brA=Lab([['L','M706,182 L722,182 L722,332 L706,332'],[760,257,'جنين']]);
const bxA=Box(500,372,330,58,['(أ) ذوات الفلقة الواحدة'],'كالحنطة والذرة');

/* ================= (ب) dicot seed, section ================= */
const coatB=G(Lobj);el('ellipse',{cx:300,cy:575,rx:80,ry:152,fill:'#9a3a22'},coatB);
const sacB=el('ellipse',{cx:300,cy:575,rx:72,ry:144,fill:'#fffbe6'},Lobj);
const endB=el('ellipse',{cx:300,cy:575,rx:72,ry:144,fill:'url(#pE)'},Lobj);
const cotB=G(Lobj);el('ellipse',{cx:300,cy:575,rx:72,ry:144,fill:'url(#gCot)'},cotB);
path('M352,540 Q300,560 270,640 M300,575 Q262,560 248,520',{stroke:'#c49a5a','stroke-width':1.5},cotB);
const outB=el('ellipse',{cx:300,cy:575,rx:80,ry:152,fill:'none',stroke:'#5a1c10','stroke-width':3},Lobj);
const glB=Glow(348,535,80);
const axB=G(Lobj);
path('M352,505 Q368,560 356,614',{stroke:'#b89a6a','stroke-width':17},axB);
path('M352,505 Q368,560 356,614',{stroke:'#f6ead0','stroke-width':13},axB);
el('path',{d:'M348,506 C322,496 310,466 322,444 C338,457 348,480 348,506Z',fill:'#6ab03a',stroke:'#3e7a20','stroke-width':1.5},axB);
el('path',{d:'M352,504 C364,484 364,462 352,448 C342,466 342,486 352,504Z',fill:'#7cc04a',stroke:'#3e7a20','stroke-width':1.5},axB);
path('M346,502 Q330,480 324,452',{stroke:'#3e7a20','stroke-width':1},axB);
const ZB=[350,540],zyB=Ball(Ltok,'gB',8);
const enB=EndoTree(()=>{const a=rnd()*2*PI,r=Math.sqrt(rnd()),p=[296+52*r*Math.cos(a),575+122*r*Math.sin(a)];return Math.hypot(p[0]-350,p[1]-540)>36?p:null;},26,16);
const EB=[288,575];
const lBc=Lab([[480,446,'غطاء البذرة'],['L','M428,446 L342,447']]);
const lBt=Lab([[130,575,'نواة السويداء 3س','lt'],['L','M200,575 L280,575','#b5321f'],[140,505,'زيجة 2س','lt'],['L','M180,505 L340,537','#b5321f']]);
const lBs=Lab([[130,665,'سويداء'],['L','M164,665 L262,655']]);
const lBe=Lab([[480,500,'رويشة'],['L','M448,500 L334,476'],[480,572,'جذير'],['L','M456,572 L366,572'],[480,646,'ورقة جنينية'],['L','M428,646 L318,652']]);
/* external seed */
const exB=G(Lobj);
el('path',{d:'M640,423 C708,423 724,500 714,560 C710,580 702,590 710,610 C720,660 700,727 640,727 C586,727 566,660 566,575 C566,490 580,423 640,423Z',fill:'url(#gBean)',stroke:'#4a160c','stroke-width':3},exB);
el('ellipse',{cx:708,cy:585,rx:5,ry:17,fill:'#f4e6c8',stroke:'#7a4a2a','stroke-width':1},exB);
el('ellipse',{cx:612,cy:480,rx:14,ry:30,fill:'#fff',opacity:.22,transform:'rotate(15 612 480)'},exB);
const brB=Lab([['L','M732,423 L748,423 L748,727 L732,727'],[786,575,'جنين']]);
const bxB=Box(500,778,330,58,['(ب) ذوات الفلقتين'],'كالباقلاء والفاصوليا');

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:0,dur:1};
let stage=-1,T=0,t0=0,last=performance.now(),P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

function render(t){
  const N=DUR.length,s=[0];for(let i=1;i<=N;i++)s.push(clamp(P-(i-1),0,1));
  const br=k=>1+.04*Math.sin(t*1.6+k);
  /* --- (أ) 1: integuments -> seed coat, zygote + endosperm nucleus --- */
  Dash(outA,sm(s[1],0,.45));show(coatA,sm(s[1],.35,.6));show(sacA,sm(s[1],.4,.6));
  setBall(zyA,ZA,pop(sm(s[1],.55,.7))*br(1),1-sm(s[3],.1,.35));
  show(lAc,sm(s[1],.6,.85));show(lAt,sm(s[1],.7,.9)*(1-sm(s[2],.8,.95)));
  /* 2: endosperm nucleus divides, endosperm tissue forms */
  enA.set(4*sm(s[2],.05,.7),sm(s[1],.6,.75)*(1-sm(s[2],.85,1)),k=>pop(sm(s[1],.6,.75))*br(k));
  show(endA,sm(s[2],.7,.9));show(lAs,sm(s[2],.85,1));
  /* 3: zygote -> embryo (scutellum + axis) */
  popAt(scuA,322,245,sm(s[3],.1,.55));popAt(axA,326,252,sm(s[3],.4,.75));
  show(glA,.85*Math.sin(PI*sm(s[3],.55,1)));show(lAe,sm(s[3],.7,.95));
  /* 4: whole grain + embryo bracket + caption */
  popAt(exA,640,186,sm(s[4],0,.4));show(brA,sm(s[4],.35,.6));setBox(bxA,sm(s[4],.55,.85));
  /* --- (ب) 5: seed coat --- */
  show(outB,sm(s[5],0,.3));growAt(outB,300,575,sm(s[5],0,.4),.6);
  show(coatB,sm(s[5],.3,.55));show(sacB,sm(s[5],.35,.55));
  setBall(zyB,ZB,pop(sm(s[5],.5,.65))*br(2),1-sm(s[7],.05,.3));
  show(lBc,sm(s[5],.55,.8));show(lBt,sm(s[5],.65,.9)*(1-sm(s[6],.8,.95)));
  /* 6: endosperm forms */
  enB.set(4*sm(s[6],.05,.7),sm(s[5],.55,.7)*(1-sm(s[6],.85,1)),k=>pop(sm(s[5],.55,.7))*br(k));
  const eb=sm(s[6],.7,.9)*(1-sm(s[7],.35,.85));show(endB,eb);show(lBs,sm(s[6],.8,.95)*(1-sm(s[7],.3,.6)));
  /* 7: embryo grows, cotyledons absorb the endosperm */
  popAt(axB,352,530,sm(s[7],.05,.35));growAt(cotB,352,540,sm(s[7],.3,.85),.08);
  show(glB,.85*Math.sin(PI*sm(s[7],.6,1)));show(lBe,sm(s[7],.75,.97));
  /* 8: whole seed: embryo + seed coat only */
  popAt(exB,640,575,sm(s[8],0,.4));show(brB,sm(s[8],.35,.6));setBox(bxB,sm(s[8],.55,.85));
}

/* ---------------- next / previous buttons ---------------- */
const btn=document.getElementById('go'),pbtn=document.getElementById('prev');
function go(i){const tgt=i+1;let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1,d);}
function back(){if(stage<0)return;const tgt=stage;stage--;S.entry=P;S.tgt=tgt;t0=T;S.dur=.9;}
btn.onclick=()=>{if(stage>=DUR.length-1){P=0;stage=-1;S.entry=0;S.tgt=0;}go(stage+1);};
pbtn.onclick=back;
let lbl='',paused=false;
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render(T);
  const nl=stage<0?'ابدأ':(stage>=DUR.length-1&&P>DUR.length-.001)?'إعادة ⟲':'التالي ◀';
  if(nl!==lbl){btn.textContent=nl;lbl=nl;}
  pbtn.disabled=stage<0;
  requestAnimationFrame(frame);}

/* ---------------- zoom & pan (gestures) ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:500,y:410});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:500,y:410});
document.getElementById('zreset').onclick=reset;
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';fsBtn.setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' ')btn.click();else if(e.key==='ArrowRight')back();});
apply();render(0);requestAnimationFrame(frame);
})();
