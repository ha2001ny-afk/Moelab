<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const stage=document.getElementById('stage');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const f1=v=>(+v).toFixed(1),lerp=(a,b,u)=>a+(b-a)*u;
/* glowing spark: soft halo + bright core with an orange rim (readable over a photo) */
function glow(p,r){const g=el('g',{opacity:0},p);const h=el('circle',{r:r||8,fill:'url(#gGlow)'},g);
  const c=el('circle',{r:4,fill:'#fffbe0',stroke:'#ff8a00','stroke-width':2.2},g);return {g,h,c,setAttribute:(k,v)=>g.setAttribute(k,v)};}
function setG(e,x,y,r,o){e.g.setAttribute('transform',`translate(${f1(x)} ${f1(y)})`);
  if(r!=null){e.h.setAttribute('r',f1(r*1.6));e.c.setAttribute('r',f1(Math.max(3,r*.38)));}if(o!=null)e.g.setAttribute('opacity',(+o).toFixed(2));}
function poly(P){const S=[0];for(let i=1;i<P.length;i++)S.push(S[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));const L=S[S.length-1];
  return {L,at(s){s=Math.max(0,Math.min(L,s));let i=1;while(i<S.length-1&&S[i]<s)i++;const u=(s-S[i-1])/((S[i]-S[i-1])||1);return [lerp(P[i-1][0],P[i][0],u),lerp(P[i-1][1],P[i][1],u)];}};}

/* ---------- page 1: brain — a soft glow visits each labelled part in turn ---------- */
const fx0=document.getElementById('fx0');
const SPOTS=[[330,210],[993,197],[1152,475],[1043,657],[803,783],[448,641]];
const halo=SPOTS.map(()=>glow(fx0,30));
function tick0(t){const per=2.2,i=Math.floor(t/per)%SPOTS.length,u=(t%per)/per,h=Math.sin(PI*u);
  halo.forEach((g,k)=>{const p=SPOTS[k];setG(g,p[0],p[1],k===i?18+16*h:18,k===i?h:0);});}

/* ---------- page 2: spinal cord — impulse travels down the cord to the nerve endings ---------- */
const fx1=document.getElementById('fx1');
const CORD=poly([[188,100],[183,140],[182,180],[184,220],[181,260],[185,300],[192,350],[202,400],[208,440],[214,490],[213,550],[211,600]]);
const ENDS=[[[211,600],[200,650],[210,700],[228,750],[250,795]],[[211,600],[212,650],[222,700],[240,750],[260,800]],[[211,600],[222,650],[235,700],[252,750],[268,790]],[[211,600],[230,650],[245,700],[262,745]]].map(poly);
const dot=glow(fx1,7),sd=ENDS.map(()=>glow(fx1,5)),eg=ENDS.map(()=>glow(fx1,8));
const TA=2.4,TB=.9,TC=.6,TT=TA+TB+TC+.8;
function tick1(t){const tt=t%TT;
  if(tt<TA){const u=tt/TA,q=CORD.at(u*CORD.L);setG(dot,q[0],q[1],u<.1?7+8*Math.sin(PI*u/.1):7,1);}else dot.setAttribute('opacity',0);
  ENDS.forEach((C,k)=>{if(tt>=TA&&tt<TA+TB){const q=C.at((tt-TA)/TB*C.L);setG(sd[k],q[0],q[1],5,1);}else sd[k].setAttribute('opacity',0);
    const e=C.at(C.L),h=(tt>=TA+TB&&tt<TA+TB+TC)?Math.sin(PI*(tt-TA-TB)/TC):0;setG(eg[k],e[0],e[1],8,h);});}

const SC=[0,1].map(i=>({svg:document.getElementById('svg'+i),view:document.getElementById('view'+i),tick:i?tick1:tick0}));
SC.forEach(S=>{S.W=+S.svg.dataset.w;S.H=+S.svg.dataset.h;});

/* ---------- zoom & pan (template) ---------- */
let cur=0,T=0,last=performance.now(),paused=false,sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>SC[cur].view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
const reset=()=>{sc=1;tx=0;ty=0;apply();};
function toView(e){const s=SC[cur].svg,p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ctr=()=>{const b=SC[cur].svg.viewBox.baseVal;return {x:b.x+b.width/2,y:b.y+b.height/2};};
const ptrs=new Map();
SC.forEach(S=>{const svg=S.svg;
  svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
    if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
    else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
      const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
      tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
  });
  const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
  svg.addEventListener('dblclick',reset);
});
document.getElementById('zin').onclick=()=>zoomAt(1.3,ctr());
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,ctr());
document.getElementById('zreset').onclick=reset;
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------- fit the picture so the side buttons never cover it ---------- */
function layout(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;
  const S=SC[cur],W=S.W,H=S.H,BW=64,BH=Math.min(330,r.height*.5);
  const s0=Math.min(r.width/W,r.height/H),gap=(r.width-W*s0)/2;let vb=`0 0 ${W} ${H}`;
  if(gap<BW){const sL=Math.min((r.width-BW)/W,r.height/H),sT=Math.min(r.width/W,(r.height-BH)/H);
    if(sL>=sT){const p=BW/sL;vb=`${f1(-p)} 0 ${f1(W+p)} ${H}`;}else{const p=BH/sT;vb=`0 ${f1(-p)} ${W} ${f1(H+p)}`;}}
  S.svg.setAttribute('viewBox',vb);reset();}
let rz=0;window.addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(layout);});

/* ---------- page switching ---------- */
const tabs=[0,1].map(i=>document.getElementById('go'+i));
function go(i){SC[cur].view.removeAttribute('transform');cur=i;
  SC.forEach((S,k)=>S.svg.classList.toggle('on',k===i));tabs.forEach((b,k)=>b.classList.toggle('on',k===i));
  layout();SC[cur].tick(T);}
tabs.forEach((b,k)=>b.onclick=()=>go(k));

/* ---------- fullscreen (template) ---------- */
const fsBtn=document.getElementById('fs'),docEl=document.documentElement;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';layout();}
fsBtn.onclick=()=>{
  const on=!document.body.classList.contains('fs');
  if(on){const r=docEl.requestFullscreen||docEl.webkitRequestFullscreen;
    if(r){try{const p=r.call(docEl);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
    setFs(true);
  }else{
    if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}
    setFs(false);
  }
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));

function frame(ms){const dt=Math.max(0,Math.min(.05,(ms-last)/1000));last=ms;T+=paused?0:dt;SC[cur].tick(T);requestAnimationFrame(frame);}
go(0);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
