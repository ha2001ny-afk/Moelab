const CX=700,CY=470;
const brain=document.getElementById('brain'),labsG=document.getElementById('labs'),sv=document.getElementById('sv'),view=document.getElementById('view');
LOBES.forEach(L=>{
  L.g=el('g',{class:'lobe'},brain);L.mv=el('g',{class:'mv'},L.g);L.pop=el('g',{class:'pop'},L.mv);
  el('image',{href:L.src,x:L.x,y:L.y,width:L.w,height:L.h},L.pop);
  L.pop.style.transformOrigin=L.cx+'px '+L.cy+'px';L.ox=0;L.oy=0;
  const g=el('g',{class:'lab hide'},labsG);L.lab=g;
  L.ln=el('line',{class:'ln','marker-end':'url(#ah)'},g);
  const pb=el('g',{class:'pb'},g);L.r=el('rect',{class:'pill',rx:24},pb);L.t=el('text',{class:'lbl',x:L.lx,y:L.ly},pb);L.t.textContent=L.name;
  const w=L.name.length*17+44;el('title',{},g);L.r.setAttribute('x',L.lx-w/2);L.r.setAttribute('y',L.ly-24);L.r.setAttribute('width',w);L.r.setAttribute('height',48);
});
function drawLines(){LOBES.forEach(L=>{L.ln.setAttribute('x1',L.lx);L.ln.setAttribute('y1',L.ly);L.ln.setAttribute('x2',L.ax+L.ox);L.ln.setAttribute('y2',L.ay+L.oy);});}
drawLines();
/* explode animation of arrows: interpolate */
let anim=null;
function setOffsets(split,dur){dur=dur===undefined?700:dur;LOBES.forEach(L=>L.mv.style.transition=dur?`transform ${dur}ms cubic-bezier(.45,0,.2,1)`:'none');LOBES.forEach(L=>{const dx=L.cx-CX,dy=L.cy-CY,d=Math.hypot(dx,dy)||1,k=split?L.push:0;
  L.tx=dx/d*k;L.ty=dy/d*k;L.mv.style.transform=`translate(${L.tx}px,${L.ty}px)`;});
  const t0=performance.now(),st=LOBES.map(L=>[L.ox,L.oy]);cancelAnimationFrame(anim);
  (function step(t){const u=dur?Math.min(1,(t-t0)/dur):1,e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    LOBES.forEach((L,i)=>{L.ox=st[i][0]+(L.tx-st[i][0])*e;L.oy=st[i][1]+(L.ty-st[i][1])*e;});drawLines();if(u<1)anim=requestAnimationFrame(step);})(t0);}
function lobeAt(x,y){for(const L of LOBES){const px=Math.floor((x-L.ox)/HS),py=Math.floor((y-L.oy)/HS);
  if(px>=0&&py>=0&&px<HW&&py<HH&&hit[py*HW+px]===L.id)return L;}return null;}
/* modes */
let mode='exp',sel=null,split=false;
const info=document.getElementById('info'),hint=document.getElementById('hint');
function select(L){sel=L;LOBES.forEach(o=>{o.g.classList.toggle('sel',o===L);o.pop.style.transform=o===L?'scale(1.05)':'';o.lab.classList.toggle('hl',o===L);});
  brain.classList.toggle('dim',!!L);if(L){brain.appendChild(L.g);info.textContent=L.name;info.classList.add('on');hint.style.opacity=0;}else{info.classList.remove('on');hint.style.opacity=mode==='quiz'?0:1;}}

function setMode(m){
  if(m==='split'){split=!split;btn.split.textContent=split?'🧲 تجميع':'🧩 تفكيك';btn.split.classList.toggle('on',split);setOffsets(split);if(mode==='quiz')return;return;}
  mode=m;btn.exp.classList.toggle('on',m==='exp');btn.quiz.classList.toggle('on',m==='quiz');select(null);
  if(m==='quiz')startQuiz();else stopQuiz();layout();}

/* quiz */
const tray=document.getElementById('tray'),score=document.getElementById('score'),done=document.getElementById('done');let got=0;
function startQuiz(){got=0;LOBES.forEach(L=>{L.lab.style.opacity=0;L.lab.classList.remove('ok');L.ln.setAttribute('marker-end','url(#ah)');});
  tray.innerHTML='';LOBES.slice().sort(()=>Math.random()-.5).forEach(L=>{const c=document.createElement('div');c.className='chip';c.textContent=L.name;c.dataset.id=L.id;tray.appendChild(c);chipDrag(c);});
  tray.classList.add('on');score.style.display='block';upd();hint.style.opacity=0;}
function stopQuiz(){tray.classList.remove('on');score.style.display='none';done.classList.remove('on');LOBES.forEach(L=>{L.lab.style.opacity=1;L.lab.classList.remove('ok');L.ln.setAttribute('marker-end','url(#ah)');});hint.style.opacity=1;}
function upd(){score.textContent=`✔ ${got} / ${LOBES.length}`;}
document.getElementById('again').onclick=()=>startQuiz();
function chipDrag(c){c.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const r=c.getBoundingClientRect(),ph=document.createElement('div');
  ph.style.cssText=`width:${r.width}px;height:${r.height}px`;c.replaceWith(ph);document.body.appendChild(c);c.classList.add('drag');
  const ox=e.clientX-r.left,oy=e.clientY-r.top;const mv=ev=>{c.style.left=(ev.clientX-ox)+'px';c.style.top=(ev.clientY-oy)+'px';
    const p=toSvg(ev);const L=lobeAt(p.x,p.y);select(L);};mv(e);
  const upf=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',upf);c.classList.remove('drag');c.style.left=c.style.top='';
    const p=toSvg(ev),L=lobeAt(p.x,p.y);select(null);
    if(L&&L.id==+c.dataset.id){ph.remove();c.remove();L.lab.style.opacity=1;L.lab.classList.add('ok');L.ln.setAttribute('marker-end','url(#ahok)');select(L);setTimeout(()=>select(null),900);got++;upd();if(got===LOBES.length)setTimeout(()=>done.classList.add('on'),700);}
    else{ph.replaceWith(c);if(L){c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),500);}}};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',upf);});}
/* zoom, pan, tap */
let sc=1,tx=0,ty=0;const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toSvg(e){const p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(sv.getScreenCTM().inverse());return {x:(q.x-tx)/sc,y:(q.y-ty)/sc,rx:q.x,ry:q.y};}
function zoomAt(k,p){const ns=Math.min(6,Math.max(.6,sc*k));k=ns/sc;tx=p.rx-(p.rx-tx)*k;ty=p.ry-(p.ry-ty)*k;sc=ns;apply();}
const ctr=()=>{const b=sv.viewBox.baseVal;return {rx:b.x+b.width/2,ry:b.y+b.height/2};};
const ptrs=new Map();let moved=0,downP=null;
sv.addEventListener('pointerdown',e=>{sv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toSvg(e));moved=0;downP=toSvg(e);});
sv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)){if(e.pointerType==='mouse'&&mode==='exp'&&!sel){const L=lobeAt(toSvg(e).x,toSvg(e).y);sv.style.cursor=L?'pointer':'grab';}return;}
  const prv=new Map(ptrs),cu=toSvg(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);moved+=Math.abs(cu.rx-o.rx)+Math.abs(cu.ry-o.ry);if(moved>8){tx+=cu.rx-o.rx;ty+=cu.ry-o.ry;apply();}}
  else{moved=99;const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.rx-b0.rx,a0.ry-b0.ry)||1,d1=Math.hypot(a1.rx-b1.rx,a1.ry-b1.ry);tx+=(a1.rx+b1.rx-a0.rx-b0.rx)/2;ty+=(a1.ry+b1.ry-a0.ry-b0.ry)/2;zoomAt(d1/d0,{rx:(a1.rx+b1.rx)/2,ry:(a1.ry+b1.ry)/2});}});
const up=e=>{if(ptrs.has(e.pointerId)&&ptrs.size===1&&moved<=8&&mode!=='quiz'){const p=toSvg(e),L=lobeAt(p.x,p.y);select(L&&L!==sel?L:null);}ptrs.delete(e.pointerId);};
sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
sv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toSvg(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
window.BRAIN={zin:()=>zoomAt(1.3,ctr()),zout:()=>zoomAt(1/1.3,ctr()),reset:()=>reset(),layout:()=>layout()};
/* fullscreen */
const fsBtn=document.getElementById('fs'),docEl=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';layout();if(window.SPINE)SPINE.layout();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=docEl.requestFullscreen||docEl.webkitRequestFullscreen;if(r){try{const p=r.call(docEl);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
/* portrait: wider view so labels fit */
function layout(){const r=sv.getBoundingClientRect(),P=r.width/r.height<.9,Q=mode==='quiz';sv.setAttribute('viewBox',P?(Q?'130 -330 1300 1430':'130 -200 1300 1300'):(Q?'100 -90 1360 990':'40 -10 1480 940'));reset();}
window.addEventListener('resize',layout);layout();
/* intro: starts exploded, assembles, then labels appear one by one */
let timers=[];
function intro(){timers.forEach(clearTimeout);timers=[];select(null);
  LOBES.forEach(L=>{L.lab.classList.add('hide');const len=Math.hypot(L.ax-L.lx,L.ay-L.ly);L.ln.style.transition='none';L.ln.style.strokeDasharray=len;L.ln.style.strokeDashoffset=len;});
  hint.style.opacity=0;setOffsets(true,0);
  timers.push(setTimeout(()=>setOffsets(false,1600),900));
  const order=[0,1,3,4,5,2];
  order.forEach((idx,i)=>timers.push(setTimeout(()=>{const L=LOBES[idx];L.ln.style.transition='';L.lab.classList.remove('hide');
    requestAnimationFrame(()=>{L.ln.style.strokeDashoffset=0;});},2700+i*650)));
  timers.push(setTimeout(()=>{hint.style.opacity=1;},2700+order.length*650+300));}
document.getElementById('replay').onclick=intro;
intro();
})();
</script>
<script>
(function(){
/* ---------- page 2: spinal cord (unchanged from the previous version) ---------- */
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const f1=v=>(+v).toFixed(1),lerp=(a,b,u)=>a+(b-a)*u;
function glow(p,r){const g=el('g',{opacity:0},p);const h=el('circle',{r:r||8,fill:'url(#gGlow)'},g);
  const c=el('circle',{r:4,fill:'#fffbe0',stroke:'#ff8a00','stroke-width':2.2},g);return {g,h,c,setAttribute:(k,v)=>g.setAttribute(k,v)};}
function setG(e,x,y,r,o){e.g.setAttribute('transform',`translate(${f1(x)} ${f1(y)})`);
  if(r!=null){e.h.setAttribute('r',f1(r*1.6));e.c.setAttribute('r',f1(Math.max(3,r*.38)));}if(o!=null)e.g.setAttribute('opacity',(+o).toFixed(2));}
function poly(P){const S=[0];for(let i=1;i<P.length;i++)S.push(S[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));const L=S[S.length-1];
  return {L,at(s){s=Math.max(0,Math.min(L,s));let i=1;while(i<S.length-1&&S[i]<s)i++;const u=(s-S[i-1])/((S[i]-S[i-1])||1);return [lerp(P[i-1][0],P[i][0],u),lerp(P[i-1][1],P[i][1],u)];}};}
const fx1=document.getElementById('fx1');
const CORD=poly([[188,100],[183,140],[182,180],[184,220],[181,260],[185,300],[192,350],[202,400],[208,440],[214,490],[213,550],[211,600]]);
const ENDS=[[[211,600],[200,650],[210,700],[228,750],[250,795]],[[211,600],[212,650],[222,700],[240,750],[260,800]],[[211,600],[222,650],[235,700],[252,750],[268,790]],[[211,600],[230,650],[245,700],[262,745]]].map(poly);
const dot=glow(fx1,7),sd=ENDS.map(()=>glow(fx1,5)),eg=ENDS.map(()=>glow(fx1,8));
const TA=2.4,TB=.9,TC=.6,TT=TA+TB+TC+.8;
function tick1(t){const tt=t%TT;
  if(tt<TA){const u=tt/TA,q=CORD.at(u*CORD.L);setG(dot,q[0],q[1],u<.1?7+8*Math.sin(PI*u/.1):7,1);}else dot.setAttribute('opacity',0);
  ENDS.forEach((C,k)=>{if(tt>=TA&&tt<TA+TB){const q=C.at((tt-TA)/TB*C.L);setG(sd[k],q[0],q[1],5,1);}else sd[k].setAttribute('opacity',0);
    const e=C.at(C.L),h=(tt>=TA+TB&&tt<TA+TB+TC)?Math.sin(PI*(tt-TA-TB)/TC):0;setG(eg[k],e[0],e[1],8,h);});}
const svg=document.getElementById('sv1'),view=document.getElementById('view1'),stage=document.getElementById('stage');
let sc=1,tx=0,ty=0;const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);const reset=()=>{sc=1;tx=0;ty=0;apply();};
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(8,Math.max(.6,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ctr=()=>{const b=svg.viewBox.baseVal;return {x:b.x+b.width/2,y:b.y+b.height/2};};
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
function layout(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;
  const W=422,H=860,BW=64,BH=Math.min(330,r.height*.5);
  const s0=Math.min(r.width/W,r.height/H),gap=(r.width-W*s0)/2;let vb=`0 0 ${W} ${H}`;
  if(gap<BW){const sL=Math.min((r.width-BW)/W,r.height/H),sT=Math.min(r.width/W,(r.height-BH)/H);
    if(sL>=sT){const p=BW/sL;vb=`${f1(-p)} 0 ${f1(W+p)} ${H}`;}else{const p=BH/sT;vb=`0 ${f1(-p)} ${W} ${f1(H+p)}`;}}
  svg.setAttribute('viewBox',vb);reset();}
window.SPINE={zin:()=>zoomAt(1.3,ctr()),zout:()=>zoomAt(1/1.3,ctr()),reset,layout};
let T=0,last=performance.now();
function frame(ms){const dt=Math.max(0,Math.min(.05,(ms-last)/1000));last=ms;if(document.body.classList.contains('p1')){T+=dt;tick1(T);}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
/* ---------- tabs and shared side buttons ---------- */
let cur=0;const P=()=>cur?window.SPINE:window.BRAIN;
const tabs=[0,1].map(i=>document.getElementById('go'+i));
function go(i){cur=i;document.body.classList.toggle('p1',i===1);tabs.forEach((b,k)=>b.classList.toggle('on',k===i));P().layout();}
tabs.forEach((b,k)=>b.onclick=()=>go(k));
document.getElementById('zin').onclick=()=>P().zin();
document.getElementById('zout').onclick=()=>P().zout();
document.getElementById('zreset').onclick=()=>P().reset();
window.addEventListener('resize',()=>{if(cur)SPINE.layout();});
})();
</script>
