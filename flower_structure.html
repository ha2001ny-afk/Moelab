<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>تركيب الزهرة</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
  #go{min-width:170px;height:56px;padding:0 26px;border-radius:28px;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font:bold 21px Tahoma,"Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  #go:active{background:#d9ebf7}
  #go:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  .lb{fill:#1f3a52;font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .pl{fill:#1f3a52;font-size:17px;font-weight:bold;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#f6dfcd;stroke-width:4px;stroke-linejoin:round}
</style>
</head>
<body>
<div id="top"><div id="title">تركيب الزهرة</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 900 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="gPet" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d9557f"/><stop offset=".45" stop-color="#f29ab5"/><stop offset="1" stop-color="#fde4ec"/></linearGradient>
        <linearGradient id="gBud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e06a91"/><stop offset=".6" stop-color="#f5a8c0"/><stop offset="1" stop-color="#fbd6e2"/></linearGradient>
        <linearGradient id="gSep" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4c7a2a"/><stop offset="1" stop-color="#8fb85a"/></linearGradient>
        <radialGradient id="gSepL" cx=".5" cy=".85" r=".9"><stop offset="0" stop-color="#1f3d18"/><stop offset=".55" stop-color="#3e6a2e"/><stop offset="1" stop-color="#86ad6a"/></radialGradient>
        <linearGradient id="gBr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a3c"/><stop offset="1" stop-color="#5e3a24"/></linearGradient>
        <linearGradient id="gFil" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f6c4d2"/><stop offset="1" stop-color="#b8325c"/></linearGradient>
        <linearGradient id="gSty" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5f8a2c"/><stop offset=".5" stop-color="#a8cf6a"/><stop offset="1" stop-color="#5f8a2c"/></linearGradient>
        <radialGradient id="gOv" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#a6c860"/><stop offset="1" stop-color="#5d7f26"/></radialGradient>
        <radialGradient id="gOvIn" cx=".45" cy=".45" r=".7"><stop offset="0" stop-color="#c8e07a"/><stop offset="1" stop-color="#4f7a24"/></radialGradient>
        <radialGradient id="gOvule" cx=".45" cy=".45" r=".6"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f4f2b6"/><stop offset="1" stop-color="#b8cc58"/></radialGradient>
        <radialGradient id="gAn" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fbe39a"/><stop offset="1" stop-color="#c98d1c"/></radialGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".22"/></filter>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl"><button id="go">ابدأ</button></div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const lp2=(p,q,u)=>[lerp(p[0],q[0],u),lerp(p[1],q[1],u)];
const bez=(a,c,b,u)=>lp2(lp2(a,c,u),lp2(c,b,u),u);
const show=(e,op)=>{if(op<.01){e.style.display='none';return false;}e.style.display='';e.setAttribute('opacity',f2(op));return true;};
const pop=v=>v*(1+.25*Math.sin(PI*v));
const rad=d=>d*PI/180,dir=d=>[Math.sin(rad(d)),-Math.cos(rad(d))];

const DUR=[5,5.5,5,5,5.5,6];
const world=G(view);
const Lfl=G(world),Lpan=G(world),Larr=G(world),Llab=G(world),Ltok=G(world);

/* ---------------- building blocks ---------------- */
function Ball(parent,grad,stroke,r){const g=G(parent);
  el('circle',{r,fill:`url(#${grad})`,stroke,'stroke-width':1},g);
  el('ellipse',{cx:-r*.35,cy:-r*.4,rx:r*.3,ry:r*.2,fill:'#fff',opacity:.55},g);return{g,r};}
function setBall(b,p,s,op){if(!show(b.g,op*(s>.02?1:0)))return;b.g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f2(s)})`);}
function Arr(d,col,w,hs){const g=G(Larr),p=el('path',{d,fill:'none',stroke:col,'stroke-width':w,'stroke-linecap':'round'},g),L=p.getTotalLength();
  const e=p.getPointAtLength(L),q=p.getPointAtLength(L-10),a=Math.atan2(e.y-q.y,e.x-q.x),c=Math.cos(a),s=Math.sin(a),H=15*hs,W=8*hs;
  const h=el('polygon',{points:[[e.x+4*hs*c,e.y+4*hs*s],[e.x-H*c+W*s,e.y-H*s-W*c],[e.x-H*c-W*s,e.y-H*s+W*c]].map(v=>v.map(f1).join(',')).join(' '),fill:col},g);
  return{g,p,h,L,cut:8*hs,at:u=>{const v=p.getPointAtLength(u*L);return[v.x,v.y];}};}
function drawArr(A,v){if(!show(A.g,v>.005?1:0))return;A.p.setAttribute('stroke-dasharray',`${f1(v*(A.L-A.cut))} ${f1(A.L+20)}`);A.h.setAttribute('opacity',f2(sm(v,.9,1)));}
function Obj(x,y,p){return{g:G(p||Lfl),x,y};}
function setO(o,s,op){if(show(o.g,(op==null?1:op)*(s>.02?1:0)))o.g.setAttribute('transform',`translate(${o.x} ${o.y}) scale(${f2(s)})`);}
function Lab(lines,x,y,a,b,fs,cls){fs=fs||18;const g=G(Llab);
  if(a){el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#1f3a52','stroke-width':1.8},g);}
  lines.forEach((s,i)=>{const t=el('text',{class:cls||'lb',x,y:y+i*fs*1.3},g);t.style.fontSize=fs+'px';t.textContent=s;});return g;}
function Line(d,col,w,p){return el('path',{d,fill:'none',stroke:col,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1},p||Lfl);}
function setL(e,v){if(show(e,v>.003?1:0))e.setAttribute('stroke-dasharray',`${v.toFixed(3)} 2`);}
/* petal pointing up from base (0,0) */
const PETAL='M0,0C-28,-12 -48,-50 -32,-74C-20,-92 -7,-91 0,-84C7,-91 20,-92 32,-74C48,-50 28,-12 0,0Z';
function Petal(p){const g=G(p);
  el('path',{d:PETAL,fill:'url(#gPet)',stroke:'#c94a74','stroke-width':1.2},g);
  ['M0,-4Q-4,-40 -14,-72','M0,-4Q0,-44 0,-80','M0,-4Q4,-40 14,-72','M0,-6Q-12,-30 -26,-56','M0,-6Q12,-30 26,-56'].forEach(d=>el('path',{d,fill:'none',stroke:'#d0638a','stroke-width':.9,opacity:.55},g));
  return g;}
function Panel(x,y,w,h){const g=G(Lpan);el('rect',{x,y,width:w,height:h,fill:'#f6dfcd',stroke:'#c9a48a','stroke-width':1.6,filter:'url(#sh)'},g);return g;}

/* ---------------- branch + flower ---------------- */
const branch=Line('M330,540Q398,432 470,372Q536,322 600,296','url(#gBr)',11);
const twig=Line('M486,360Q500,384 520,398','#6e4630',5);
const CF=[415,330];
const FL=G(Lfl);
/* sepals behind petals */
const fSep=G(FL);
[0,72,144,216,288].forEach(a=>el('path',{d:'M0,0C-15,-10 -17,-42 0,-64C17,-42 15,-10 0,0Z',fill:'url(#gSep)',stroke:'#3f6420','stroke-width':1.2,transform:`translate(${CF[0]} ${CF[1]}) rotate(${a})`},fSep));
const PA=[36,108,180,252,324];
const fPet=PA.map(a=>{const g=G(FL);Petal(g);return{g,a};});
el('circle',{cx:CF[0],cy:CF[1],r:13,fill:'#b6d26a',stroke:'#6f8f2c','stroke-width':1.2},FL);
/* stamens */
const fSta=G(FL);
for(let i=0;i<13;i++){const a=-78+i*13,L=50+((i*37)%5)*4,b=[CF[0]+8*dir(a)[0],CF[1]+8*dir(a)[1]],t=[CF[0]+L*dir(a)[0],CF[1]+L*dir(a)[1]];
  el('path',{d:`M${f1(b[0])},${f1(b[1])}Q${f1((b[0]+t[0])/2+6*Math.cos(rad(a)))},${f1((b[1]+t[1])/2)} ${f1(t[0])},${f1(t[1])}`,fill:'none',stroke:'#e9799c','stroke-width':1.8},fSta);
  el('ellipse',{cx:f1(t[0]),cy:f1(t[1]),rx:3.6,ry:2.6,fill:'url(#gAn)',stroke:'#9a6a12','stroke-width':.8,transform:`rotate(${a} ${f1(t[0])} ${f1(t[1])})`},fSta);}
/* pistil */
const fPis=G(FL);
el('ellipse',{cx:CF[0],cy:CF[1]-6,rx:8,ry:10,fill:'url(#gSty)',stroke:'#4f6b1f','stroke-width':1},fPis);
el('path',{d:`M${CF[0]-3},${CF[1]-14}Q${CF[0]-2},${CF[1]-50} ${CF[0]+1},${CF[1]-80}L${CF[0]+5},${CF[1]-80}Q${CF[0]+3},${CF[1]-50} ${CF[0]+3},${CF[1]-14}Z`,fill:'url(#gSty)',stroke:'#4f6b1f','stroke-width':1},fPis);
el('ellipse',{cx:CF[0]+3,cy:CF[1]-82,rx:6,ry:4,fill:'#c5d86a',stroke:'#4f6b1f','stroke-width':1},fPis);
/* bud */
const BUD=Obj(520,398);
el('path',{d:'M0,0C12,-22 52,-24 74,-4C56,16 16,20 0,0Z',fill:'url(#gBud)',stroke:'#c94a74','stroke-width':1.2,transform:'rotate(14)'},BUD.g);
el('path',{d:'M8,-8Q30,-16 52,-12',fill:'none',stroke:'#d0638a','stroke-width':.9,opacity:.6,transform:'rotate(14)'},BUD.g);
[[-30],[0],[30]].forEach(([a])=>el('path',{d:'M0,0C8,-8 24,-9 30,0C24,9 8,8 0,0Z',fill:'url(#gSep)',stroke:'#3f6420','stroke-width':1,transform:`rotate(${14+a}) translate(-2 0)`},BUD.g));
const glF=el('circle',{cx:CF[0],cy:CF[1],r:95,fill:'url(#gGlow)',opacity:0},Ltok);
const glC=el('circle',{cx:520,cy:398,r:45,fill:'url(#gGlow)',opacity:0},Ltok);

/* ---------------- panel: corolla (التويج) ---------------- */
const PC=[225,552];
const P1=Panel(117,447,216,209);
const cPet=PA.map((a,k)=>{const g=G(Lpan);Petal(g);const ta=a+[8,-6,10,-8,6][k],d=dir(ta);return{g,a,ta,tp:[PC[0]+16*d[0],PC[1]+16*d[1]]};});

/* ---------------- panel: calyx (الكأس) ---------------- */
const P2=Panel(596,481,204,175);
const cal=G(Lpan);
el('path',{d:'M606,648Q680,600 794,500',fill:'none',stroke:'url(#gBr)','stroke-width':9,'stroke-linecap':'round'},cal);
el('path',{d:'M740,552Q760,590 772,612',fill:'none',stroke:'#6e4630','stroke-width':4},cal);
[[0],[40],[-40]].forEach(([a])=>el('path',{d:'M0,0C6,-6 18,-7 22,0C18,7 6,6 0,0Z',fill:'url(#gSep)',stroke:'#3f6420','stroke-width':1,transform:`translate(770 612) rotate(${60+a})`},cal));
const calS=Obj(690,560,cal);
[0,72,144,216,288].forEach(a=>{const g=G(calS.g,{transform:`rotate(${a+18})`});
  el('path',{d:'M0,0C-34,-14 -38,-58 0,-64C38,-58 34,-14 0,0Z',fill:'url(#gSepL)',stroke:'#2a4a1c','stroke-width':1.3},g);
  el('path',{d:'M0,-6Q-2,-34 0,-56',fill:'none',stroke:'#9cc27a','stroke-width':1,opacity:.6},g);});
el('circle',{r:13,fill:'#c9d98c',stroke:'#6f8f2c','stroke-width':1.2},calS.g);
for(let i=0;i<12;i++){const a=i*30;el('circle',{cx:f1(10*Math.cos(rad(a))),cy:f1(10*Math.sin(rad(a))),r:1.6,fill:'#7a5a2a'},calS.g);}

/* ---------------- panel: stamens (اسدية) ---------------- */
const P3=Panel(117,17,234,221);
const STA=[[205,72,-22],[232,50,-6],[262,62,10],[288,84,22],[186,104,-30],[272,110,26],[218,96,-12]].map(([x,y,a])=>{
  const d=`M${234+(x-234)*.08},226Q${f1(234+(x-234)*.45)},${f1((226+y)/2+20)} ${x},${y+5}`;
  const f=el('path',{d,fill:'none',stroke:'url(#gFil)','stroke-width':4.5,'stroke-linecap':'round',pathLength:1},Lpan);
  const an=Obj(x,y,Lpan);el('ellipse',{rx:6,ry:4.5,fill:'url(#gAn)',stroke:'#8a5a10','stroke-width':1,transform:`rotate(${a+90})`},an.g);
  return{f,an};});

/* ---------------- panel: pistil (المدقة) ---------------- */
const P4=Panel(549,17,251,337);
const OV=Obj(660,268,Lpan);
el('ellipse',{rx:58,ry:70,fill:'url(#gOv)',stroke:'#3f5a18','stroke-width':2},OV.g);
el('ellipse',{rx:46,ry:57,fill:'#d6e79a',stroke:'#6f8f2c','stroke-width':1.2},OV.g);
el('ellipse',{rx:36,ry:46,fill:'url(#gOvIn)',stroke:'#4f7a24','stroke-width':1.2},OV.g);
const ovule=G(OV.g);
el('path',{d:'M0,-30Q2,-22 0,-16',fill:'none',stroke:'#e6efa6','stroke-width':3},ovule);
el('ellipse',{rx:17,ry:22,fill:'url(#gOvule)',stroke:'#9db040','stroke-width':1.2},ovule);
el('ellipse',{rx:7,ry:9,fill:'#fff',stroke:'#e2d86a','stroke-width':1},ovule);
el('circle',{r:2.4,fill:'#e5b43a'},ovule);
const STY=G(Lpan);
el('path',{d:'M653,200Q655,120 656,54L664,54Q665,120 667,200Z',fill:'url(#gSty)',stroke:'#4f6b1f','stroke-width':1.3},STY);
for(let i=0;i<9;i++){const y=66+i*15,s=i%2?1:-1,x=s>0?665.5-(y-54)*.002:654.5+(y-54)*.002;el('line',{x1:f1(x),y1:y,x2:f1(x+s*6),y2:y-4,stroke:'#6f8f2c','stroke-width':1},STY);}
const STG=Obj(660,46,Lpan);
el('path',{d:'M-15,6Q-16,-10 0,-12Q16,-10 15,6Q8,10 0,8Q-8,10 -15,6Z',fill:'#b9d066',stroke:'#4f6b1f','stroke-width':1.4},STG.g);
for(let i=0;i<7;i++)el('circle',{cx:-10+i*3.3,cy:-6+Math.abs(i-3)*1.2,r:1.6,fill:'#e7f2a6'},STG.g);
/* pollen tube */
const pollen=Ball(Lpan,'gAn','#9a6a12',6);
const tube=Line('M660,40Q661,120 660,200Q659,224 660,244','#e0892a',2.6,Lpan);
const glO=el('circle',{cx:660,cy:268,r:42,fill:'url(#gGlow)',opacity:0},Ltok);
const brk=G(Llab);
el('path',{d:'M632,58L626,58L626,198L632,198',fill:'none',stroke:'#1f3a52','stroke-width':1.8},brk);
const brk2=G(Llab);
el('path',{d:'M690,52L700,52L700,244L690,244',fill:'none',stroke:'#1f3a52','stroke-width':1.8},brk2);

/* ---------------- arrows ---------------- */
const AR=[
  Arr('M498,404Q546,456 588,486','#a9d3b6',9,1.6),
  Arr('M360,254Q328,262 298,246','#f2c3a0',9,1.6),
  Arr('M424,240Q446,148 538,138','#a9d3b6',9,1.6)];

/* ---------------- labels (figure labels only) ---------------- */
const LT=Lab(['التويج'],225,694,null,null,20);
const LKm=Lab(['الكأس'],496,516,[496,500],[520,410]);
const LK=Lab(['الكأس'],698,694,null,null,20);
const LS=Lab(['اسدية'],234,276,null,null,20);
const LS1=Lab(['المتك'],156,48,[178,48],[226,49],17,'pl');
const LS2=Lab(['الخويط'],156,136,[180,136],[214,146],17,'pl');
const LP=Lab(['المدقة'],700,396,null,null,22);
const LP1=Lab(['الميسم'],590,40,[612,40],[646,42],17,'pl');
const LP2=Lab(['القلم'],590,128,[608,128],[626,128],17,'pl');
const LP3=Lab(['مبيض'],574,232,[594,232],[614,240],17,'pl');
const LP4=Lab(['بويض'],574,270,[594,270],[644,268],17,'pl');
const LP5=Lab(['انبوب','اللقاح'],752,40,[728,52],[700,52],17,'pl');

/* travelling tokens: [arrow, stage, token, scaleA, scaleB, w0, w1] */
const tkG=Ball(Ltok,'gSepL','#2a4a1c',9),tkY=Ball(Ltok,'gAn','#9a6a12',8),tkP=Ball(Ltok,'gOv','#3f5a18',8);
const TK=[[0,3,tkG,1,1.3,.05,.4],[1,4,tkY,1,1.4,.05,.4],[2,5,tkP,1,1.4,.05,.35]];

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:0,dur:1};
let stage=-1,T=0,t0=0,last=performance.now(),P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

function render(t){
  const u=i=>clamp(P-(i-1),0,1),s=[0,1,2,3,4,5,6].map(u);
  const br=k=>1+.02*Math.sin(t*1.6+k);

  /* 1 branch + flower blooms */
  setL(branch,sm(s[1],0,.35));setL(twig,sm(s[1],.25,.45));
  show(fSep,sm(s[1],.3,.45));
  const bl=sm(s[1],.38,.72);
  fPet.forEach((p,k)=>{const v=sm(s[1],.38+.04*k,.62+.04*k);
    if(show(p.g,v>.02?1:0))p.g.setAttribute('transform',`translate(${CF[0]} ${CF[1]}) rotate(${f1(p.a+lerp(-40,0,v))}) scale(${f2(pop(v)*.95*br(k))})`);});
  if(show(fSta,sm(s[1],.62,.8)))fSta.setAttribute('transform',`translate(${CF[0]} ${CF[1]}) scale(${f2(lerp(.4,1,sm(s[1],.62,.82)))}) translate(${-CF[0]} ${-CF[1]})`);
  show(fPis,sm(s[1],.7,.86));
  setO(BUD,pop(sm(s[1],.5,.7)));
  /* 2 corolla: petals copied into the panel */
  glF.setAttribute('opacity',f2(.7*Math.sin(PI*sm(s[2],0,.3))));
  show(P1,sm(s[2],.1,.28));
  cPet.forEach((p,k)=>{const e=sm(s[2],.25+.06*k,.6+.06*k);
    if(!show(p.g,e>0?1:0))return;
    const pos=bez(CF,[(CF[0]+p.tp[0])/2-40,(CF[1]+p.tp[1])/2-30],p.tp,e);
    p.g.setAttribute('transform',`translate(${f1(pos[0])} ${f1(pos[1])}) rotate(${f1(lerp(p.a,p.ta,e))}) scale(${f2(lerp(.95,.92,e)*(1+.08*Math.sin(PI*e)))})`);});
  show(LT,sm(s[2],.85,.97));
  /* 3 calyx */
  glC.setAttribute('opacity',f2(.8*Math.sin(PI*sm(s[3],0,.3))));
  drawArr(AR[0],sm(s[3],.05,.4));
  show(LKm,sm(s[3],.15,.3));
  show(P2,sm(s[3],.35,.5));show(cal,sm(s[3],.4,.55));
  setO(calS,pop(sm(s[3],.5,.75)));
  show(LK,sm(s[3],.82,.96));
  /* 4 stamens */
  drawArr(AR[1],sm(s[4],.05,.38));
  show(P3,sm(s[4],.33,.48));
  STA.forEach((o,i)=>{setL(o.f,sm(s[4],.45+.025*i,.68+.025*i));setO(o.an,pop(sm(s[4],.66+.025*i,.78+.025*i)));});
  show(LS1,sm(s[4],.8,.9));show(LS2,sm(s[4],.84,.94));show(LS,sm(s[4],.88,1));
  /* 5 pistil */
  drawArr(AR[2],sm(s[5],.05,.35));
  show(P4,sm(s[5],.3,.45));
  setO(OV,pop(sm(s[5],.4,.58)));
  const sv=sm(s[5],.52,.7);
  if(show(STY,sv>.01?1:0))STY.setAttribute('transform',`translate(0 200) scale(1 ${f2(sv)}) translate(0 -200)`);
  setO(STG,pop(sm(s[5],.68,.8)));
  show(LP1,sm(s[5],.76,.86));show(LP2,sm(s[5],.8,.9));show(brk,sm(s[5],.8,.9));
  show(LP3,sm(s[5],.84,.94));show(LP4,sm(s[5],.88,.97));show(LP,sm(s[5],.9,1));
  /* 6 pollen tube */
  const pv=sm(s[6],.05,.3);
  setBall(pollen,[lerp(700,660,pv),lerp(-10,36,pv)],1,s[6]>.05?1:0);
  setL(tube,sm(s[6],.3,.82));
  show(brk2,sm(s[6],.6,.75));show(LP5,sm(s[6],.65,.8));
  glO.setAttribute('opacity',f2(.8*Math.sin(PI*sm(s[6],.78,1))));
  /* tokens */
  const used=new Set();
  TK.forEach(([ai,si,tk,a,b,w0,w1])=>{const v=s[si];if(v>w0&&v<w1+.06&&!used.has(tk)){used.add(tk);
    setBall(tk,AR[ai].at(sm(v,w0,w1)),lerp(a,b,sm(v,w0,w1)),1-sm(v,w1,w1+.06));}});
  [tkG,tkY,tkP].forEach(tk=>{if(!used.has(tk))show(tk.g,0);});
}

/* ---------------- one button ---------------- */
const btn=document.getElementById('go');
function go(i){const tgt=i+1;let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1,d);}
btn.onclick=()=>{if(stage>=DUR.length-1){P=0;stage=-1;}go(stage+1);};
let lbl='';
let paused=false;
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render(T);
  const nl=stage<0?'ابدأ':(stage>=DUR.length-1&&P>DUR.length-.001)?'إعادة ⟲':'التالي ◀';
  if(nl!==lbl){btn.textContent=nl;lbl=nl;}
  requestAnimationFrame(frame);}

/* ---------------- zoom & pan (gestures) ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:400});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:400});
document.getElementById('zreset').onclick=reset;
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';fsBtn.setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' ')btn.click();});
apply();render(0);requestAnimationFrame(frame);
})();
</script>
