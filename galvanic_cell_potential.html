<!DOCTYPE html>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>جهد الخلية الكلفانية — مختبر ثلاثي الأبعاد</title>
<style>
:root{color-scheme:dark;background:#081429;color:#eaf0fa;font-family:system-ui,Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
.stage{position:relative;width:100%;height:100%;background:#081429}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.tools{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px}
.tools button{width:42px;height:42px;padding:0;display:grid;place-items:center;border:1px solid #eaf0fa24;border-radius:12px;background:#081429d9;color:#eaf0fa;cursor:pointer;font:800 13px ui-monospace,Consolas,monospace;letter-spacing:.5px}
.tools button:hover{border-color:#7fd3ff;color:#7fd3ff}
.tools button[aria-pressed="true"]{border-color:#7fd3ff88;color:#7fd3ff;background:#10264ad9}
button:focus-visible{outline:2px solid #7fd3ff;outline-offset:3px}
svg{width:20px;height:20px}
.dock{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 16px)}
.seg{display:flex;gap:4px;padding:4px;border:1px solid #eaf0fa24;border-radius:14px;background:#081429e6;flex-wrap:wrap;justify-content:center}
.seg button{min-height:38px;padding:6px 14px;border:1px solid transparent;border-radius:10px;background:transparent;color:#c9d6e8;font:600 13px system-ui,Tahoma,sans-serif;cursor:pointer;white-space:nowrap}
.seg button:hover{color:#7fd3ff}
.seg button[aria-selected="true"]{background:#10264a;border-color:#7fd3ff88;color:#7fd3ff}
.seg .short{display:none}
.seg button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.toast{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 112px);transform:translateX(-50%);width:max-content;max-width:min(92vw,560px);padding:10px 16px;border:1px solid #39516d;border-radius:12px;background:#10264af0;font-size:13px;line-height:1.6;text-align:center;pointer-events:none}
.slider{align-items:center;gap:10px;padding:6px 14px;color:#c9d6e8;font:600 13px system-ui,Tahoma,sans-serif}
.slider input{width:min(46vw,260px);accent-color:#7fd3ff}
.slider output{min-width:64px;text-align:center;font:700 13px ui-monospace,Consolas,monospace;color:#ffd27a}
#ink{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
.tools,.dock,.inkbar{z-index:10}
.inkbar{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 52px);right:max(10px,env(safe-area-inset-right));display:flex;gap:6px;align-items:center;padding:6px 8px;border:1px solid #eaf0fa24;border-radius:14px;background:#081429e6}
.inkbar .sw{width:26px;height:26px;border-radius:50%;border:2px solid #ffffff40;padding:0;cursor:pointer}
.inkbar .sw[aria-pressed="true"]{transform:scale(1.2);border-color:#fff}
.inkbar .sz{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer}
.inkbar .sz i{display:block;border-radius:50%;background:#eaf0fa}
.inkbar .sz[aria-pressed="true"]{border-color:#7fd3ff88;background:#10264a}
.inkbar .sep{width:1px;height:24px;background:#eaf0fa24}
.tools button.hint{animation:hint 1.6s ease-out infinite;border-color:#ffd27a;color:#ffd27a}
@keyframes hint{0%{box-shadow:0 0 0 0 #ffd27aaa}70%{box-shadow:0 0 0 12px #ffd27a00}100%{box-shadow:0 0 0 0 #ffd27a00}}
.topleft{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:10;flex-wrap:nowrap}
@media (max-aspect-ratio:9/10){.topleft{top:calc(max(10px,env(safe-area-inset-top)) + 52px)}}
.picker{align-items:center;gap:6px;padding:5px 8px}
.picker label{display:flex;align-items:center;gap:6px;color:#a3b3cc;font:700 12px system-ui,Tahoma,sans-serif}
.picker select{height:36px;padding:0 8px;border:1px solid #7fd3ff55;border-radius:10px;background:#10264a;color:#eaf0fa;font:700 13px system-ui,sans-serif;cursor:pointer}
.picker select:focus-visible{outline:2px solid #7fd3ff;outline-offset:2px}
.picker .swap{width:36px;height:36px;border:1px solid #ffd27a88;border-radius:10px;background:#081429;color:#ffd27a;font:800 18px system-ui;cursor:pointer;padding:0}
.picker .swap:hover{background:#10264a}
@media (max-width:440px){.picker .lt{display:none}.picker select{font-size:12px;padding:0 4px}}
[hidden]{display:none!important}
@media (max-width:440px){.tools{gap:5px}.tools button{width:38px;height:38px}.seg{flex-wrap:nowrap}.seg button{padding:6px 8px;font-size:12px;min-height:36px}.seg .long{display:none}.seg .short{display:inline}}
</style>

<body>
<div class="stage">
  <canvas id="scene" aria-label="مختبر جهد الخلية الكلفانية: قطبان يختارهما الطالب، مقياس جهد، مفتاح وجسر ملحي، وسلّم جهود الاختزال القياسية"></canvas>
  <canvas id="ink" aria-hidden="true"></canvas>
  <div class="tools">
    <button id="pen" aria-pressed="false" aria-label="قلم للكتابة على الشاشة" title="قلم">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>
    </button>
    <button id="eraser" aria-pressed="false" aria-label="ممحاة" title="ممحاة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h12"/><path d="M4.5 15.5l9-9a2 2 0 012.8 0l3.2 3.2a2 2 0 010 2.8L13 19H8.5z"/><path d="M9 11l5 5"/></svg>
    </button>
    <button id="inkclear" aria-label="مسح كل الكتابة" title="مسح كل الكتابة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
    </button>
    <button id="labels" aria-pressed="true" aria-label="إظهار أسماء الأجزاء" title="أسماء الأجزاء">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>
    </button>
    <button id="dim" aria-pressed="false" aria-label="العرض الحالي ثلاثي الأبعاد — اضغط للتحويل إلى 2D" title="التبديل بين 3D و 2D">3D</button>
    <button id="spin" aria-pressed="false" aria-label="دوران تلقائي 360°" title="دوران تلقائي 360°">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M17 6.5l2.5 1.6-1.4 2.6"/><path d="M12 3v18"/></svg>
    </button>
    <button id="play" class="hint" aria-pressed="false" aria-label="إغلاق الدائرة" title="إغلاق الدائرة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="playPath" d="M7 4.5l12 7.5-12 7.5z"/></svg>
    </button>
    <button id="reset" aria-label="إعادة التجربة" title="إعادة التجربة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg>
    </button>
    <button id="fullscreen" aria-label="ملء الشاشة" title="ملء الشاشة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsPath" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
  <div class="seg topleft picker" dir="ltr" aria-label="اختيار القطبين">
    <label><span class="lt">الأيسر</span><select id="selL" dir="ltr" aria-label="القطب الأيسر (يُكتب أنوداً)"></select></label>
    <button id="swap" class="swap" aria-label="تبديل القطبين" title="تبديل القطبين">⇄</button>
    <label><span class="lt">الأيمن</span><select id="selR" dir="ltr" aria-label="القطب الأيمن (يُكتب كاثوداً)"></select></label>
  </div>
  <div class="dock">
    <div class="seg" id="views" role="tablist" aria-label="ما يُعرض">
      <button data-v="note" aria-selected="true"><span class="dot" style="background:#ffd27a"></span>رمز الخلية</button>
      <button data-v="half" aria-selected="false"><span class="dot" style="background:#7fe8bb"></span><span class="long">جهود </span>الأقطاب</button>
      <button data-v="energy" aria-selected="false"><span class="dot" style="background:#ff9a6b"></span>ΔG° <span class="long">وثابت الاتزان</span><span class="short">و K</span></button>
    </div>
  </div>
  <div class="inkbar" id="inkbar" hidden>
    <button class="sw" data-c="#ffffff" style="background:#ffffff" aria-label="أبيض"></button>
    <button class="sw" data-c="#ffd27a" style="background:#ffd27a" aria-label="أصفر" aria-pressed="true"></button>
    <button class="sw" data-c="#ff5a5a" style="background:#ff5a5a" aria-label="أحمر"></button>
    <button class="sw" data-c="#5ee89a" style="background:#5ee89a" aria-label="أخضر"></button>
    <button class="sw" data-c="#56c2ff" style="background:#56c2ff" aria-label="أزرق"></button>
    <span class="sep"></span>
    <button class="sz" data-w="3" aria-label="خط رفيع" aria-pressed="true"><i style="width:5px;height:5px"></i></button>
    <button class="sz" data-w="7" aria-label="خط سميك"><i style="width:11px;height:11px"></i></button>
  </div>
  <div id="toast" class="toast" hidden></div>
<script>
(()=>{
const cv=document.getElementById('ink'), cx=cv.getContext('2d'), $=id=>document.getElementById(id);
let tool=null, color='#ffd27a', width=3, last=null;
function size(){const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;if(!r.width)return;
  const o=document.createElement('canvas');o.width=cv.width;o.height=cv.height;if(cv.width)o.getContext('2d').drawImage(cv,0,0);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);cx.setTransform(1,0,0,1,0,0);if(o.width)cx.drawImage(o,0,0,o.width,o.height);cx.setTransform(dpr,0,0,dpr,0,0)}
new ResizeObserver(size).observe(cv);size();
function clear(){cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.restore()}
function setTool(t){tool=tool===t?null:t;$('pen').setAttribute('aria-pressed',String(tool==='pen'));$('eraser').setAttribute('aria-pressed',String(tool==='eraser'));
  cv.classList.toggle('on',!!tool);$('inkbar').hidden=tool!=='pen'}
$('pen').addEventListener('click',()=>setTool('pen'));$('eraser').addEventListener('click',()=>setTool('eraser'));$('inkclear').addEventListener('click',clear);
document.querySelectorAll('.inkbar .sw').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.c;document.querySelectorAll('.inkbar .sw').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
document.querySelectorAll('.inkbar .sz').forEach(b=>b.addEventListener('click',()=>{width=+b.dataset.w;document.querySelectorAll('.inkbar .sz').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function style(){cx.lineCap='round';cx.lineJoin='round';if(tool==='eraser'){cx.globalCompositeOperation='destination-out';cx.strokeStyle=cx.fillStyle='#000';cx.lineWidth=34}else{cx.globalCompositeOperation='source-over';cx.strokeStyle=cx.fillStyle=color;cx.lineWidth=width}}
cv.addEventListener('pointerdown',e=>{if(!tool)return;e.preventDefault();cv.setPointerCapture(e.pointerId);last=pt(e);style();cx.beginPath();cx.arc(last.x,last.y,cx.lineWidth/2,0,Math.PI*2);cx.fill()});
cv.addEventListener('pointermove',e=>{if(!last)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];style();for(const ev of evs){const p=pt(ev);cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p}});
const up=()=>{last=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.__ink={clear,setTool,count:()=>{const d=cx.getImageData(0,0,cv.width,cv.height).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i])n++;return n}};
})();
</script>
</div>

<script>
(() => {
'use strict';
const cv=document.getElementById('scene');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2, DEG=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
const rnd=(a,b)=>a+Math.random()*(b-a);
function seeded(n){let x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)}
const KCOL={exo:'#ff8a5c',endo:'#5cc8ff'};
const LAYOUTS={
  land:{W:1000,H:650,cx:330,cy:360,k:1.62,lens:{x:742,y:342,r:148},eqY:128,pillY:534},
  port:{W:620,H:1240,cx:310,cy:480,k:2.4,lens:{x:310,y:850,r:150},eqY:150,pillY:1040}
};
let L=LAYOUTS.land, layoutName='';
let W=0,H=0,s=1,ox=0,oy=0;
const VIEW0={yaw:-0.42,pitch:0.3,zoom:1,px:0,py:0,ortho:0};
let view={...VIEW0}, mode2D=false, saved3D=null;
let showLabels=true, spin=false, lastT=0, pending=false;
let drag=null;
const pointers=new Map();let pinch=null;
/* ---------- متجهات ---------- */
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z);
const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const norm=a=>mul(a,1/(Math.hypot(a.x,a.y,a.z)||1));
const len3=a=>Math.hypot(a.x,a.y,a.z);
const vlerp=(a,b,t)=>V(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
function rot(v,k,a){const c=Math.cos(a),s=Math.sin(a);return add(add(mul(v,c),mul(cross(k,v),s)),mul(k,dot(k,v)*(1-c)))}
const randUnit=()=>norm(V(rnd(-1,1),rnd(-1,1),rnd(-1,1)));


/* ---------- الكاميرا والإسقاط ---------- */
const DIST=820;
let cam=null, TARGET=V(0,80,0);
function setupCam(){
  const cp=Math.cos(view.pitch), sp=Math.sin(view.pitch);
  const C=V(TARGET.x+DIST*Math.sin(view.yaw)*cp, TARGET.y+DIST*sp, TARGET.z+DIST*Math.cos(view.yaw)*cp);
  const f=norm(sub(TARGET,C)), r=norm(cross(f,V(0,1,0))), u=cross(r,f);
  const o2=view.ortho;
  cam={C,f,r,u,F:L.k*view.zoom*DIST*(1+(layoutName==='port'?0:.08)*o2),cx:L.cx+view.px,cy:L.cy+view.py+(layoutName==='port'?10:24)*o2};
}
function P(p){
  const v=sub(p,cam.C), dz=dot(v,cam.f), sc=cam.F/dz+(cam.F/DIST-cam.F/dz)*view.ortho;
  return{x:cam.cx+dot(v,cam.r)*sc, y:cam.cy-dot(v,cam.u)*sc, s:sc, z:dz};
}
const depth=p=>dot(sub(p,cam.C),cam.f);
function toCam(pt){return view.ortho>.5?mul(cam.f,-1):sub(cam.C,pt)}
function col(c,a=1){return`rgba(${Math.round(clamp(c[0],0,255))},${Math.round(clamp(c[1],0,255))},${Math.round(clamp(c[2],0,255))},${a})`}
const LIGHT=norm(V(-0.45,0.85,0.6)), FILL=norm(V(0.7,0.2,0.5));
function lit(c,n,pt,o={}){
  const amb=o.amb??0.34, spec=o.spec??0.28, shin=o.shin??28;
  const dif=Math.max(0,dot(n,LIGHT));
  const v=norm(toCam(pt)), h=norm(add(LIGHT,v));
  const sp=spec*Math.pow(Math.max(0,dot(n,h)),shin);
  const k=amb+0.7*dif+0.2*Math.max(0,dot(n,FILL))+0.22*Math.max(0,dot(n,v));
  return c.map(x=>x*k+255*sp);
}
function pathPts(ps,close=true){ctx.beginPath();ps.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));if(close)ctx.closePath()}
function centroid(ps){let x=0,y=0,z=0;ps.forEach(p=>{x+=p.x;y+=p.y;z+=p.z});return V(x/ps.length,y/ps.length,z/ps.length)}
function face(pts,n,c,o={}){
  const ctr=centroid(pts);
  if(dot(n,toCam(ctr))<=0)return false;
  pathPts(pts.map(P));
  const cc=col(lit(c,n,ctr,o),o.alpha??1);
  ctx.fillStyle=cc;ctx.fill();
  ctx.strokeStyle=o.line||cc;ctx.lineWidth=o.lw||.6;ctx.stroke();
  return true;
}
function box(x0,x1,y0,y1,z0,z1,c,o){
  const p=V;
  face([p(x1,y0,z0),p(x1,y1,z0),p(x1,y1,z1),p(x1,y0,z1)],V(1,0,0),c,o);
  face([p(x0,y0,z0),p(x0,y0,z1),p(x0,y1,z1),p(x0,y1,z0)],V(-1,0,0),c,o);
  face([p(x0,y1,z0),p(x0,y1,z1),p(x1,y1,z1),p(x1,y1,z0)],V(0,1,0),c,o);
  face([p(x0,y0,z0),p(x1,y0,z0),p(x1,y0,z1),p(x0,y0,z1)],V(0,-1,0),c,o);
  face([p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)],V(0,0,1),c,o);
  face([p(x0,y0,z0),p(x0,y1,z0),p(x1,y1,z0),p(x1,y0,z0)],V(0,0,-1),c,o);
}
function cyl(B,A,e1,e2,r,len,c,o={}){
  const n=o.sides||24, E=add(B,mul(A,len)), ring=[];
  for(let i=0;i<n;i++){const a=i/n*TAU+(o.rot||0);ring.push(add(mul(e1,Math.cos(a)),mul(e2,Math.sin(a))))}
  for(let i=0;i<n;i++){
    const a=ring[i], b=ring[(i+1)%n];
    const cc=o.knurl&&i%2?c.map(v=>v*.72):c;
    face([add(B,mul(a,r)),add(B,mul(b,r)),add(E,mul(b,r)),add(E,mul(a,r))],norm(add(a,b)),cc,o);
  }
  if(o.cap1!==false)face(ring.map(d=>add(E,mul(d,r))),A,o.capCol||c,o);
  if(o.cap0!==false)face(ring.map(d=>add(B,mul(d,r))),mul(A,-1),o.capCol||c,o);
}
const cylY=(x,z,r,y0,y1,c,o)=>cyl(V(x,y0,z),V(0,1,0),V(1,0,0),V(0,0,1),r,y1-y0,c,o);
const cylZ=(x,y,r,z0,z1,c,o)=>cyl(V(x,y,z0),V(0,0,1),V(1,0,0),V(0,1,0),r,z1-z0,c,o);
function planeText(str,O,ex,ey,size,color,font='600 32px system-ui,Tahoma,sans-serif',dir='rtl'){
  const o=P(O), a=P(add(O,ex)), b=P(add(O,ey)), k=size/32;
  ctx.save();
  ctx.transform((a.x-o.x)*k,(a.y-o.y)*k,(b.x-o.x)*k,(b.y-o.y)*k,o.x,o.y);
  ctx.font=font;ctx.direction=dir;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=color;ctx.fillText(str,0,0);

function chemTokens(str){

  for(const ch of str){
    if(ch==='{'){flush();mode=1}else if(ch==='}'){flush();mode=0}
    else if(ch==='['){flush();mode=2}else if(ch===']'){flush();mode=0}
    else if(ch==='〈'){flush();mode=3}else if(ch==='〉'){flush();mode=0}

function eqLines(){

    {t:`${halfOx(a,ma)}`,tail:`E°{anode} = ${sgn(Ean)} V`,c:'#d8fff0',tc:OXC},
    {t:`${halfRed(c,mc)}`,tail:`E°{cathode} = ${sgn(Eca)} V`,c:'#ffe2d4',tc:REDC},
    {t:`E°{cell} = E°{anode} + E°{cathode} = (${sgn(Ean)}) + (${sgn(Eca)}) = ${sgn(E)} V`,c:EC}];
  if(vw==='energy')return[
    {t:`ΔG° = −nFE°{cell} = −(${n})(96500)(${sgn(E)}) = ${Math.abs(dG)<1?'0':(dG<0?'−':'+')+Math.round(Math.abs(dG))} J/mol`,c:'#eaf0fa'},
    {t:`E°{cell} = (0.0257 / n) ln K{eq}   ⇒   K{eq} = ${Ktext(lnK)}`,c:EC}];
  return[{t:notation(),c:'#eaf0fa'},{t:overall(),tail:`E°{cell} = ${sgn(E)} V`,c:'#c9d6e8',tc:EC}];
}

  const gapMin=port?30:15.5;
  for(let it=0;it<60;it++)for(let i=1;i<items.length;i++){const d=items[i].q-items[i-1].q;if(d<gapMin){const m=(gapMin-d)/2;items[i].q+=m;items[i-1].q-=m}}
  for(const it of items){const e=it.e, isA=!same&&e===an, isC=!same&&e===ca, sel=e===a||e===c;
    const colr=isA?OXC:isC?REDC:sel?'#eaf0fa':'rgba(201,214,232,.62)';
    const lab=port?symAr(e):`${e.ox}/${e.gas?'H₂':e.k}`, val=sgn(e.E);
    ctx.strokeStyle=colr;ctx.lineWidth=sel?1.6:1;ctx.beginPath();
    if(port){const up=EL.indexOf(e)%2===0, ly=G.y+(up?-1:1)*30;ctx.moveTo(it.p,G.y);ctx.lineTo(it.q,ly+(up?8:-8));ctx.stroke();
      ctx.font=`${sel?800:600} ${sel?16:14}px system-ui,sans-serif`;ctx.direction='ltr';ctx.textAlign='center';ctx.fillStyle=colr;ctx.fillText(lab,it.q,ly);
      if(sel){ctx.font='700 12px ui-monospace,Consolas,monospace';ctx.fillText(val,it.q,ly+(up?-17:17))}}
    else{ctx.moveTo(G.x,it.p);ctx.lineTo(G.x+14,it.q);ctx.stroke();
      ctx.font=`${sel?800:600} ${sel?12.5:11.5}px system-ui,sans-serif`;ctx.direction='ltr';ctx.textAlign='left';ctx.fillStyle=colr;ctx.fillText(lab,G.x+18,it.q);
      ctx.font=`${sel?700:500} ${sel?12:11}px ui-monospace,Consolas,monospace`;ctx.textAlign='right';ctx.fillText(val,G.x+G.w-30,it.q)}
    ctx.beginPath();if(port)ctx.arc(it.p,G.y,sel?5:2.6,0,TAU);else ctx.arc(G.x,it.p,sel?5:2.6,0,TAU);ctx.fillStyle=colr;ctx.fill();
    if(sel&&!same){const k=(Math.sin(t*4)+1)/2;ctx.beginPath();if(port)ctx.arc(it.p,G.y,8+k*3,0,TAU);else ctx.arc(G.x,it.p,8+k*3,0,TAU);ctx.strokeStyle=colr;ctx.globalAlpha=.4+.4*k;ctx.lineWidth=1.5;ctx.stroke();ctx.globalAlpha=1}}
  // سهم E°cell بين القطبين (اتجاه الإلكترونات: من الأنود إلى الكاثود)
  if(!same){const p0=pos(an.E), p1=pos(ca.E), dash=-t*24;
    ctx.save();ctx.strokeStyle=EC;ctx.lineWidth=2.4;ctx.setLineDash([6,4]);ctx.lineDashOffset=dash;ctx.beginPath();
    if(port){const yy=G.y-62;ctx.moveTo(p0,yy);ctx.lineTo(p1,yy);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=EC;ctx.beginPath();ctx.moveTo(p1,yy);ctx.lineTo(p1-9,yy-5);ctx.lineTo(p1-9,yy+5);ctx.fill()}
    else{const xx=G.x-30;ctx.moveTo(xx,p0);ctx.lineTo(xx,p1);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=EC;ctx.beginPath();ctx.moveTo(xx,p1);ctx.lineTo(xx-5,p1+9);ctx.lineTo(xx+5,p1+9);ctx.fill()}
    ctx.restore();
    const txt=`|E°cell| = ${Math.abs(E).toFixed(2)} V`;ctx.font='800 12px ui-monospace,Consolas,monospace';ctx.direction='ltr';const w=ctx.measureText(txt).width+14;
    let tx,ty;if(port){tx=(p0+p1)/2;ty=G.y-62}else{tx=G.x-30;ty=(p0+p1)/2}
    if(!port){ctx.save();ctx.translate(tx,ty);ctx.rotate(-Math.PI/2);rr(-w/2,-10,w,20,10,'rgba(8,20,41,.95)',EC);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=EC;ctx.fillText(txt,0,1);ctx.restore()}
    else{rr(tx-w/2,ty-10,w,20,10,'rgba(8,20,41,.95)',EC);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=EC;ctx.fillText(txt,tx,ty+1)}}
  // دلالة الطرفين
  ctx.font='700 10.5px system-ui,Tahoma,sans-serif';ctx.direction='rtl';ctx.fillStyle='rgba(163,179,204,.85)';ctx.textAlign='center';
  if(port){}
  else{ctx.fillText('↑ عامل مؤكسد أقوى',bx0+bw/2,by0+32);ctx.fillText('↓ عامل مختزل أقوى',bx0+bw/2,by0+bh-12)}
  ctx.restore();
}

/* ---------------- المعادلات ---------------- */
function bidiSegs(t){const out=[];const re=/‭([^‬]*)‬/g;let i=0,m;while((m=re.exec(t))){if(m.index>i)out.push({t:t.slice(i,m.index),l:0});out.push({t:m[1],l:1});i=re.lastIndex}if(i<t.length)out.push({t:t.slice(i),l:0});return out}
function bidiW(t){let w=0;for(const g of bidiSegs(t)){ctx.direction=g.l?'ltr':'rtl';w+=ctx.measureText(g.t).width}return w}
function bidiText(t,cx,y){const w=bidiW(t);let x=cx+w/2;for(const g of bidiSegs(t)){ctx.direction=g.l?'ltr':'rtl';const gw=ctx.measureText(g.t).width;ctx.textAlign=g.l?'left':'right';ctx.fillText(g.t,g.l?x-gw:x,y);x-=gw}}
function equation(){
  const port=layoutName==='port', fs=port?17:19, lines=eqLines(), lh=fs*1.65, gap=fs*1.4;
  const ws=lines.map(l=>chemWidth(l.t,fs)+(l.tail?gap+chemWidth(l.tail,fs*.9):0)), tot=Math.max(...ws);
  const H=lines.length*lh+fs*.6, y0=L.eqY-H/2, ex_=L.eqX||L.W/2, maxW=2*Math.min(ex_,L.W-ex_)-24, k=tot+48>maxW?(maxW-48)/tot:1;
  ctx.save();ctx.translate(L.eqX||L.W/2,y0);ctx.scale(k,k);
  rr(-tot/2-24,0,tot+48,H/k*k,18,'rgba(8,20,41,.9)','rgba(127,211,255,.35)');
  lines.forEach((l,i)=>{const y=fs*.3+lh*(i+.5)+fs*.35, w=ws[i], x=-tot/2+(tot-w)/2;
    if(l.tail){const w1=chemWidth(l.t,fs);drawChem(l.t,x,y,fs,l.c,'left');const w2=chemWidth(l.tail,fs*.9);drawChem(l.tail,x+w1+gap,y,fs*.9,l.tc||EC,'left')}
    else drawChem(l.t,x+w/2,y,fs,l.c,'center')});
  ctx.restore();
}
function pillY(){const d=document.querySelector('.dock');if(!d)return L.pillY;const top=(d.getBoundingClientRect().top-cv.getBoundingClientRect().top-oy)/s;return Math.min(L.pillY,top-34)}
function pillText(){const {E,a,c}=calc();
  if(!st.sw)return{t:'الدائرة مفتوحة — المس المفتاح لإغلاقها وقراءة جهد الخلية',c:EC};
  if(st.brA>.03)return{t:'بدون الجسر الملحي لا تكتمل الدائرة فيقرأ مقياس الجهد صفراً — المس الجسر لإعادته',c:BADC};
  if(Math.abs(E)<.004)return{t:'القطبان لهما الجهد نفسه ⇐ E°cell = 0 فلا يسري تيار',c:'#a3b3cc'};
  if(E<0)return{t:`E°cell سالب ⇐ التفاعل كما كُتب غير تلقائي، والتلقائي عكسه: ${LT(symAr(c))} أنود و ${LT(symAr(a))} كاثود — بدّل القطبين ⇄`,c:BADC};
  if(vw==='half')return{t:`الأنود ${LT(symAr(a))} جهد اختزاله أقل، والكاثود ${LT(symAr(c))} جهد اختزاله أعلى — جهد التأكسد = عكس إشارة جهد الاختزال`,c:EC};
  if(vw==='energy')return{t:'E°cell موجب ⇐ ΔG° سالب ⇐ K > 1 ⇐ التفاعل تلقائي ويفضّل تكوين النواتج',c:OXC};
  return{t:'يُكتب الأنود (تأكسد) يساراً والكاثود (اختزال) يميناً، والخطان || يمثلان الجسر الملحي',c:EC};
}
function pill(){if(!document.getElementById('toast').hidden)return;const {t,c}=pillText(), y=pillY();
  ctx.font='800 15px system-ui,Tahoma,sans-serif';const w=bidiW(t)+36;
  const k=Math.min(1,(L.W-24)/w);ctx.save();ctx.translate(L.W/2,y);ctx.scale(k,k);
  rr(-w/2,-18,w,36,18,'rgba(8,20,41,.92)',c);ctx.textBaseline='middle';ctx.fillStyle=c;bidiText(t,0,1);ctx.restore()}

/* ---------------- الحلقة الرئيسية ---------------- */
const LAY={
  land:{W:1000,H:650,cx:610,cy:330,k:1.3,eqY:112,eqX:560,pillY:560,lad:{x:62,y0:218,y1:520,w:200}},
  port:{W:620,H:1240,cx:310,cy:610,k:1.85,eqY:262,pillY:1060,lad:{x0:50,x1:570,y:930}}
};
function bg(){
  const g=ctx.createRadialGradient(L.W*.5,L.H*.42,20,L.W*.5,L.H*.42,Math.max(L.W,L.H)*.8);
  g.addColorStop(0,'#1d3d6e');g.addColorStop(.45,'#10264a');g.addColorStop(1,'#081429');
  ctx.fillStyle=g;ctx.fillRect(-ox/s,-oy/s,W/s,H/s);
  ctx.lineWidth=1;ctx.strokeStyle='rgba(156,197,233,.035)';
  for(let x=0;x<=L.W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,L.H);ctx.stroke()}
  for(let y=0;y<=L.H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(L.W,y);ctx.stroke()}
}
function draw(){
  pending=false;
  const now=performance.now(), dt=Math.min(.05,(now-(lastT||now))/1000);lastT=now;const t=now/1000;
  const dpr=window.devicePixelRatio||1;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);
  bg();
  st.swA+=((st.sw?1:0)-st.swA)*Math.min(1,dt*7);st.brA+=((st.br?0:1)-st.brA)*Math.min(1,dt*4);
  if(Math.abs(st.swA-(st.sw?1:0))<.002)st.swA=st.sw?1:0;if(Math.abs(st.brA-(st.br?0:1))<.002)st.brA=st.br?0:1;
  if(flowing()){const E=calc().E, sp=.35+Math.min(1.6,Math.abs(E))*.55;st.eT+=dt*sp;st.ions.forEach(io=>io.u+=(io.k?1:-1)*Math.sign(E)*dt*.06*sp)}
  else st.ions.forEach(io=>io.u+=Math.sin(t*3+io.j*9)*dt*.004);
  if(spin&&!mode2D)view.yaw=wrapA(view.yaw+dt*.4);
  {const tg=mode2D?1:0;if(Math.abs(view.ortho-tg)>.001||(mode2D&&(Math.abs(view.yaw)>.001||Math.abs(view.pitch)>.001))){
    const k=Math.min(1,dt*7);view.ortho+=(tg-view.ortho)*k;
    if(mode2D){view.yaw+=(0-view.yaw)*k;view.pitch+=(0-view.pitch)*k}
    else if(saved3D){view.yaw+=wrapA(saved3D.yaw-view.yaw)*k;view.pitch+=(saved3D.pitch-view.pitch)*k}
    if(Math.abs(view.ortho-tg)<.002){view.ortho=tg;if(mode2D){view.yaw=0;view.pitch=0}else if(saved3D){view.yaw=saved3D.yaw;view.pitch=saved3D.pitch;saved3D=null}}}}
  const base=LAY[layoutName];L.k=base.k;L.cy=base.cy+ease(st.brA)*(layoutName==='land'?40:50);
  TARGET=V(0,70,14);setupCam();
  const o=drawScene(t,dt);
  partTags(o.tags);
  drawLadder(t);
  equation();pill();
  paint();
}
function paint(){if(!pending){pending=true;requestAnimationFrame(draw)}}
function resize(){
  W=cv.clientWidth;H=cv.clientHeight;
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const name=W/H>=0.9?'land':'port';
  if(name!==layoutName){layoutName=name;L={...LAY[name]};L.lens={x:0,y:0,r:0}}
  s=Math.min(W/L.W,H/L.H);ox=(W-L.W*s)/2;oy=(H-L.H*s)/2;
  paint();
}

/* ---------------- التحكم ---------------- */
function point(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}}
function begin(e){const p=point(e);pointers.set(e.pointerId,p);
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch={d:d2(a,b),mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};drag=null;cv.setPointerCapture(e.pointerId);e.preventDefault();return}
  if(drag)return;drag={id:e.pointerId,last:p,start:p,t0:performance.now(),moved:0};cv.setPointerCapture(e.pointerId);e.preventDefault()}
function move(e){const p=point(e);if(pointers.has(e.pointerId))pointers.set(e.pointerId,p);
  if(pinch&&pointers.size>=2){const [a,b]=[...pointers.values()], d=d2(a,b), mid2={x:(a.x+b.x)/2,y:(a.y+b.y)/2};zoomAt(mid2,d/pinch.d);view.px+=mid2.x-pinch.mid.x;view.py+=mid2.y-pinch.mid.y;pinch={d,mid:mid2};return}
  if(!drag||e.pointerId!==drag.id)return;
  drag.moved=Math.max(drag.moved,d2(p,drag.start));if(drag.moved<6){drag.last=p;return}
  if(mode2D){view.px+=p.x-drag.last.x;view.py+=p.y-drag.last.y}else{view.yaw=wrapA(view.yaw-(p.x-drag.last.x)*.008);view.pitch=clamp(view.pitch+(p.y-drag.last.y)*.006,-.2,1.1);spin=false;syncSpin()}
  drag.last=p}
function distSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1, u=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1);return Math.hypot(p.x-a.x-u*dx,p.y-a.y-u*dy)}
function hit(p){
  const sp=P(V(SW.x,10,SW.z));if(Math.hypot(p.x-sp.x,p.y-sp.y)<30)return'switch';
  const bp=bridgePath().map(P);for(let i=1;i<bp.length;i++)if(distSeg(p,bp[i-1],bp[i])<16)return'bridge';
  return null}
let lastTap=0;
function end(e){pointers.delete(e.pointerId);if(pinch){if(pointers.size<2)pinch=null;return}
  if(drag&&drag.id===e.pointerId){if(drag.moved<6&&performance.now()-drag.t0<450){
      const h=hit(drag.start);
      if(h==='switch')toggleSwitch();else if(h==='bridge')toggleBridge();
      else{const now=performance.now();if(now-lastTap<320){resetView();lastTap=0}else lastTap=now}}
    drag=null}}
function resetView(){view=mode2D?{...VIEW0,yaw:0,pitch:0,ortho:1}:{...VIEW0}}
function zoomAt(p,f){const z=clamp(view.zoom*f,.6,3.2);f=z/view.zoom;view.zoom=z;const cx=L.cx+view.px, cy=L.cy+view.py;view.px=p.x-(p.x-cx)*f-L.cx;view.py=p.y-(p.y-cy)*f-L.cy}
cv.addEventListener('pointerdown',begin);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(point(e),Math.exp(-e.deltaY*.0015))},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

const spinBtn=document.getElementById('spin'), dimBtn=document.getElementById('dim'), playBtn=document.getElementById('play'), playPath=document.getElementById('playPath'), lbl=document.getElementById('labels');
lbl.addEventListener('click',()=>{showLabels=!showLabels;lbl.setAttribute('aria-pressed',String(showLabels))});
function syncSpin(){spinBtn.setAttribute('aria-pressed',String(spin))}
spinBtn.addEventListener('click',()=>{if(mode2D)return;spin=!spin;syncSpin()});
function syncDim(){dimBtn.textContent=mode2D?'2D':'3D';dimBtn.setAttribute('aria-pressed',String(mode2D));
  dimBtn.setAttribute('aria-label',mode2D?'العرض الحالي ثنائي الأبعاد — اضغط للتحويل إلى 3D':'العرض الحالي ثلاثي الأبعاد — اضغط للتحويل إلى 2D');spinBtn.disabled=mode2D;spinBtn.style.opacity=mode2D?.4:1}
dimBtn.addEventListener('click',()=>{mode2D=!mode2D;if(mode2D){saved3D={yaw:view.yaw,pitch:view.pitch};spin=false;syncSpin()}else if(!saved3D)saved3D={yaw:VIEW0.yaw,pitch:VIEW0.pitch};syncDim()});
function syncPlay(){if(!playBtn)return;playBtn.setAttribute('aria-pressed',String(st.sw));playPath.setAttribute('d',st.sw?'M8 5v14M16 5v14':'M7 4.5l12 7.5-12 7.5z');const l=st.sw?'فتح الدائرة':'إغلاق الدائرة';playBtn.setAttribute('aria-label',l);playBtn.title=l;playBtn.classList.toggle('hint',!st.touchedSw)}
function toggleSwitch(){st.sw=!st.sw;st.touchedSw=true;syncPlay()}
function toggleBridge(){st.br=!st.br}
playBtn.addEventListener('click',toggleSwitch);
document.getElementById('reset').addEventListener('click',()=>{resetMacro();leftK='Zn';rightK='Cu';syncSel();syncPlay();resetView();spin=false;syncSpin()});
// منتقيا القطبين
const selL=document.getElementById('selL'), selR=document.getElementById('selR');
function fillSel(sel){sel.innerHTML=EL.slice().sort((a,b)=>a.E-b.E).map(e=>`<option value="${e.k}">${e.gas?'H⁺/H₂ (SHE)':e.ox+'/'+e.k}   ${sgn(e.E)} V</option>`).join('')}
fillSel(selL);fillSel(selR);
function syncSel(){selL.value=leftK;selR.value=rightK}
selL.addEventListener('change',()=>{leftK=selL.value;st.bub=[]});selR.addEventListener('change',()=>{rightK=selR.value;st.bub=[]});
document.getElementById('swap').addEventListener('click',()=>{[leftK,rightK]=[rightK,leftK];syncSel();st.bub=[]});
const viewsEl=document.getElementById('views');
function setView(v){vw=v;[...viewsEl.children].forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===v)))}
viewsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});

const fs=document.getElementById('fullscreen'), fsPath=document.getElementById('fsPath');
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
fs.addEventListener('click',async()=>{try{
    if(isFS()){const x=document.exitFullscreen||document.webkitExitFullscreen;if(x)await x.call(document)}
    else{const r=document.documentElement,en=r.requestFullscreen||r.webkitRequestFullscreen;if(!en){toast('ملء الشاشة غير مدعوم في هذا المتصفح');return}await en.call(r)}
  }catch{toast('تعذّر تفعيل ملء الشاشة')}});
function syncFS(){const l=isFS()?'الخروج من ملء الشاشة':'ملء الشاشة';fs.setAttribute('aria-label',l);fs.title=l;
  fsPath.setAttribute('d',isFS()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');resize()}
document.addEventListener('fullscreenchange',syncFS);document.addEventListener('webkitfullscreenchange',syncFS);
const toastEl=document.getElementById('toast');let toastTm=0;
function toast(msg,ms=6500){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toastTm);toastTm=setTimeout(()=>toastEl.hidden=true,ms)}
window.__sim={set:(l,r)=>{leftK=l;rightK=r;syncSel()},view:setView,sw:v=>{st.sw=v;st.swA=v?1:0;st.touchedSw=true;syncPlay()},br:v=>{st.br=v},
  hitPt:name=>{const p=name==='switch'?P(V(SW.x,10,SW.z)):P(V(0,SBY+ease(st.brA)*74,0));const r=cv.getBoundingClientRect();return{x:r.left+ox+p.x*s,y:r.top+oy+p.y*s}},
  state:()=>{const c=calc();return{left:leftK,right:rightK,vw,n:c.n,E:+c.E.toFixed(3),dG:Math.round(c.dG),lnK:+c.lnK.toFixed(2),flow:flowing(),lines:eqLines().map(l=>l.t+(l.tail?'  '+l.tail:''))}}};
resetMacro();syncSel();setView('note');syncDim();syncPlay();lbl.setAttribute('aria-pressed','true');
new ResizeObserver(resize).observe(cv);
resize();
toast('اختر قطبين من أعلى اليسار (الأيسر يُكتب أنوداً) • المس المفتاح لإغلاق الدائرة وقراءة الجهد • ⇄ يبدّل القطبين');
})();
</script>
