let cur=0,tm=[],shown=true;
const wrap=document.getElementById('wrap'),base=document.getElementById('base');
function clearT(){tm.forEach(clearTimeout);tm=[]}
function load(i){
  clearT();cur=i;const p=PAGES[i];
  wrap.querySelectorAll('.ly').forEach(e=>e.remove());
  wrap.style.setProperty('--ar',p.w+'/'+p.h);
  base.src=p.src;
  p.layers.forEach(l=>{const im=document.createElement('img');im.className='ly';im.src=l.u;im.style.cssText=`left:${l.x}%;top:${l.y}%;width:${l.w}%;height:${l.h}%`;wrap.appendChild(im)});
  document.getElementById('cap').textContent=p.name;
  document.getElementById('pg').textContent=(i+1)+' / '+PAGES.length;
  document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===PAGES.length-1;
  sizeWrap();play();
}
function play(){
  clearT();shown=true;document.getElementById('tg').textContent='إخفاء التأشيرات';
  const ls=[...wrap.querySelectorAll('.ly')];ls.forEach(e=>e.classList.remove('on'));
  ls.forEach((e,k)=>tm.push(setTimeout(()=>e.classList.add('on'),1500+k*1300)));
}
function hideAll(){clearT();shown=false;wrap.querySelectorAll('.ly').forEach(e=>e.classList.remove('on'));document.getElementById('tg').textContent='إظهار التأشيرات'}
document.getElementById('tg').onclick=()=>{shown?hideAll():play()};
document.getElementById('prev').onclick=()=>{if(cur>0)load(cur-1)};
document.getElementById('next').onclick=()=>{if(cur<PAGES.length-1)load(cur+1)};
document.getElementById('fsb').onclick=()=>document.body.classList.toggle('fs');
function sizeWrap(){
  const st=document.getElementById('stage'),p=PAGES[cur],r=p.w/p.h;
  const W=st.clientWidth,H=st.clientHeight;let w=Math.min(W,H*r),h=w/r;
  wrap.style.width=w+'px';wrap.style.height=h+'px';
}
addEventListener('resize',sizeWrap);
load(0);
</script>
</body>
</html>
