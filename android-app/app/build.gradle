plugins { id 'com.android.application' }

android {
    namespace 'iq.moelab.app'
    compileSdk 34

    defaultConfig {
        applicationId 'iq.moelab.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('../keystore/moelab.jks')
            storePassword 'moelab2026'
            keyAlias 'moelab'
            keyPassword 'moelab2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
