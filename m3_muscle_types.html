<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>أنواع العضلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
  /* Layout: full-screen stage — image fills it, then slides left (top on phones) while text appears word by word on the right */
  :root{--navy:#1f3a52;--rust:#c4623a;--rustD:#a8431b;--ink:#26384a;--muted:#5d7488;color-scheme:light}
  html{height:100%;box-sizing:border-box;overflow:hidden;background:#eef6fb}
  body{position:relative;height:100%;margin:0;overflow:hidden;background:#eef6fb;direction:rtl;
       font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--navy);padding:0 12px}
  #title{color:#fff;font-size:clamp(15px,3.6vw,22px);font-weight:800}
  #badge{min-width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:radial-gradient(circle at 50% 45%,#f6fcff 0%,#cfe8f3 100%)}

  #draw{position:absolute;top:0;left:0;width:100%;height:calc(100% - 84px);
        transition:width 1.4s cubic-bezier(.65,0,.35,1),height 1.4s cubic-bezier(.65,0,.35,1)}
  #draw{z-index:2;overflow:visible}
  #txt{z-index:1}
  #ctrl{z-index:3}
  .shifted #draw{width:46%}
  svg{overflow:visible;width:100%;height:100%;display:block;touch-action:none;cursor:grab;transition:opacity .35s}
  svg:active{cursor:grabbing}

  #txt{position:absolute;top:24px;bottom:90px;right:28px;width:calc(54% - 56px);box-sizing:border-box;overflow-y:auto;
       padding:4px 6px 4px 14px;opacity:0;transform:translateX(40px);pointer-events:none;scrollbar-width:thin;
       transition:opacity .7s ease .4s,transform .9s cubic-bezier(.2,.7,.2,1) .4s;-webkit-user-select:text;user-select:text}
  .shifted #txt{opacity:1;transform:none;pointer-events:auto}
  .instant #draw,.instant #txt{transition:none!important}
  #txtIn{max-width:560px}

  @media (max-width:720px),(max-aspect-ratio:4/5){
    .shifted #draw{width:100%;height:42%}
    #txt{top:calc(42% + 2px);left:14px;right:14px;width:auto;bottom:86px;padding:4px 4px;transform:translateY(40px)}
  }

  #txt h2{margin:0 0 10px;color:var(--navy);font-size:clamp(17px,1.7vw,21px);font-weight:800;line-height:1.6}
  #txt .en{display:inline-block;margin-inline-start:8px;font-size:.68em;color:var(--rust);font-weight:700;direction:ltr;unicode-bidi:isolate;font-family:"Segoe UI",Arial,sans-serif}
  #txt p{margin:0 0 14px;font-size:clamp(14px,1.25vw,15.5px);line-height:1.95;color:var(--ink)}
  #txt h3{margin:0 0 8px;color:var(--rustD);font-size:clamp(14.5px,1.3vw,16px);font-weight:800}
  #txt ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  #txt li{display:flex;gap:9px;align-items:flex-start;font-size:clamp(13.5px,1.2vw,15px);line-height:1.85;color:var(--ink)}
  #txt li>span:last-child{min-width:0}
  .num{flex:none;width:21px;height:21px;margin-top:4px;border-radius:50%;background:var(--rust);color:#fff;font-weight:700;font-size:12px;
       display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.4);transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1)}
  .num.on{opacity:1;transform:none}
  .w{display:inline-block;opacity:0;transform:translateY(5px);filter:blur(3px);transition:opacity .45s ease,transform .45s ease,filter .45s ease}
  .w.on{opacity:1;transform:none;filter:none}

  #ctrl{position:absolute;bottom:12px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px;pointer-events:none}
  #ctrl>*{pointer-events:auto}
  .nav{width:56px;height:56px;border-radius:50%;border:3px solid var(--navy);background:#fff;color:var(--navy);font-size:24px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.22);transition:opacity .3s}
  .nav:active{background:#d9ebf7}
  .nav:disabled{opacity:.3;cursor:default}
  #dots{display:flex;gap:12px;align-items:center}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--navy);background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:var(--rust);border-color:var(--rust);transform:scale(1.45)}
  .zb{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding:0;transition:background .25s,color .25s}
  .zb button svg{width:20px;height:20px;cursor:pointer}
  #tt.on{background:var(--navy);color:#fff}
  button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
  body.pf #top{display:none}
  body.pf #stage{top:0}
  @media (prefers-reduced-motion:reduce){#draw,#txt,.w,.num{transition:none!important}}
</style>
</head>

<div id="top"><div id="title">أنواع العضلات في جسم الإنسان</div><div id="badge">1</div></div>
<div id="stage">
  <div id="draw">
    <svg id="svg" viewBox="0 0 500 900" preserveAspectRatio="xMidYMid meet"><g id="view"></g></svg>
  </div>
  <div id="txt" title="انقر لإظهار النص كاملاً"><div id="txtIn"></div></div>
  <div class="zb">
    <button id="tt" aria-label="إظهار النص" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 11h16M8 16h12M11 21h9"/></svg></button>
    <button id="zin" aria-label="تكبير">+</button>
    <button id="zout" aria-label="تصغير">−</button>
    <button id="zreset" aria-label="إعادة الضبط">⟲</button>
    <button id="fs" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="السابق">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="التالي">◀</button>
  </div>
</div>

/* ---------- simple motion for each muscle ---------- */
const beat=x=>x<0?0:x<.08?ss(0,.08,x):1-ss(.08,.32,x);
const MOTION=[
  t=>{const ph=(t/2.6)%1,p=ss(.1,.3,ph)*(1-ss(.5,.85,ph));return[1+.025*p,1-.03*p,0];},          /* skeletal: contract & relax */
  t=>{const p=(1-Math.cos(2*PI*t/4.5))/2;return[1+.03*p,1-.035*p,.8*Math.sin(2*PI*t/9)];},        /* smooth: slow wave */
  t=>{const ph=(t/1.1)%1,p=Math.max(beat(ph),.6*beat(ph-.2));return[1+.022*p,1-.03*p,0];}          /* cardiac: heartbeat */
];

/* ---------- pages (images) ---------- */
const pages=DATA.map(d=>{
  const im=IMG[d.img],g=el('g',{display:'none'},view),m=el('g',{},g);
  el('image',{href:'data:image/webp;base64,'+im.d,x:0,y:0,width:im.w,height:im.h},m);
  return{g,m,w:im.w,h:im.h};
});

const mk=(tag,cls,par,s)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(s!=null)e.textContent=s;if(par)par.appendChild(e);return e;};
function words(par,s){const out=[];s.split(/\s+/).forEach((w,k)=>{if(k)par.appendChild(document.createTextNode(' '));out.push(mk('span','w',par,w));});return out;}
let seq=[],typeTok=0,typed=false;
function buildText(i){
  const d=DATA[i];txtIn.innerHTML='';seq=[];typed=false;txt.scrollTop=0;
  const h=mk('h2','',txtIn);seq.push(...words(h,d.t));const en=mk('span','w en',h,d.en);seq.push(en,{pause:300});
  seq.push(...words(mk('p','',txtIn),d.p),{pause:350});
  seq.push(...words(mk('h3','',txtIn),'مميزاتها:'),{pause:200});
  const ol=mk('ol','',txtIn);
  d.f.forEach((f,k)=>{const li=mk('li','',ol);seq.push(mk('span','num',li,String(k+1)));seq.push(...words(mk('span','',li),f),{pause:180});});
}
function startTyping(){
  if(typed)return;typed=true;const tok=++typeTok;
  if(RM){showAll();return;}
  let k=0;
  (function next(){
    if(tok!==typeTok)return;
    while(k<seq.length&&seq[k].pause===undefined&&seq[k].classList.contains('on'))k++;
    const it=seq[k++];if(!it)return;
    if(it.pause!==undefined){setTimeout(next,it.pause);return;}
    it.classList.add('on');
    const b=it.getBoundingClientRect(),c=txt.getBoundingClientRect();
    if(b.bottom>c.bottom-8)txt.scrollTop+=b.bottom-c.bottom+24;
    setTimeout(next,it.classList.contains('num')?120:65);
  })();
}
function showAll(){typeTok++;typed=true;seq.forEach(it=>it.classList&&it.classList.add('on'));}
txt.addEventListener('click',showAll);

/* ---------- show / hide text ---------- */
let textOn=false,ready=false;
const tt=$('tt');
function layout(){stage.classList.toggle('shifted',textOn&&ready);if(textOn&&ready)setTimeout(()=>{if(textOn&&ready)startTyping();},RM?0:1200);}
tt.onclick=()=>{textOn=!textOn;tt.classList.toggle('on',textOn);tt.setAttribute('aria-pressed',textOn);tt.setAttribute('aria-label',textOn?'إخفاء النص':'إظهار النص');layout();};

/* ---------- navigation ---------- */
const badge=$('badge'),dotsEl=$('dots'),dots=[],prevB=$('prev'),nextB=$('next');
DATA.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','الصفحة '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);dots.push(b);});
function setUI(i){badge.style.opacity=0;setTimeout(()=>{badge.textContent=i+1;badge.style.opacity=1;},150);
  dots.forEach((d,k)=>d.classList.toggle('on',k===i));prevB.disabled=i===0;nextB.disabled=i===DATA.length-1;}
let idx=-1,flow=0,born=0;
function go(i){
  if(i<0||i>=DATA.length||i===idx)return;
  const tok=++flow;typeTok++;ready=false;
  svg.style.opacity=0;txt.style.opacity=0;
  setTimeout(()=>{
    if(tok!==flow)return;
    stage.classList.add('instant');stage.classList.remove('shifted');void stage.offsetWidth;stage.classList.remove('instant');
    txt.style.opacity='';
    pages.forEach((p,k)=>p.g.setAttribute('display',k===i?'':'none'));
    const P=pages[i],pad=24;svg.setAttribute('viewBox',`${-pad} ${-pad} ${P.w+2*pad} ${P.h+2*pad}`);
    idx=i;born=performance.now();setUI(i);reset();buildText(i);svg.style.opacity=1;
    setTimeout(()=>{if(tok!==flow)return;ready=true;layout();},RM?300:1800);
  },idx<0?0:380);
}
nextB.onclick=()=>go(idx+1);prevB.onclick=()=>go(idx-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(idx+1);if(e.key==='ArrowRight')go(idx-1);});

/* ---------- animation loop ---------- */
function frame(ms){
  if(idx>=0){const P=pages[idx],t=ms/1000,e=RM?1:ss(0,1,(ms-born)/900);
    let[sx,sy,r]=RM?[1,1,0]:MOTION[idx](t);const s=.93+.07*e;sx*=s;sy*=s;
    const cx=P.w/2,cy=P.h/2;
    P.m.setAttribute('transform',`translate(${cx} ${cy}) rotate(${r.toFixed(3)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(${-cx} ${-cy})`);
    P.m.setAttribute('opacity',e.toFixed(3));}
  requestAnimationFrame(frame);
}

/* ---------- zoom & pan ---------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const mid=()=>{const P=pages[Math.max(0,idx)];return{x:P.w/2,y:P.h/2};};
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prev=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prev.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
function reset(){sc=1;tx=0;ty=0;apply();}
svg.addEventListener('dblclick',reset);
$('zin').onclick=()=>zoomAt(1.3,mid());
$('zout').onclick=()=>zoomAt(1/1.3,mid());
$('zreset').onclick=reset;

/* ---------- fullscreen ---------- */
const root=document.documentElement,fsIco=$('fsIco');
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
let pseudo=false;
const setPseudo=v=>{pseudo=v;document.body.classList.toggle('pf',v);fsUpd();};
$('fs').onclick=()=>{
  if(fsEl()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}return;}
  if(pseudo){setPseudo(false);return;}
  const req=root.requestFullscreen||root.webkitRequestFullscreen;
  if(!req||(document.fullscreenEnabled===false&&document.webkitFullscreenEnabled!==true)){setPseudo(true);return;}
  try{const r=req.call(root);if(r&&r.then)r.catch(()=>setPseudo(true));else setTimeout(()=>{if(!fsEl())setPseudo(true);},350);}catch(e){setPseudo(true);}
};
const fsUpd=()=>{const on=!!fsEl()||pseudo;fsIco.setAttribute('d',on?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');$('fs').setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');};
document.addEventListener('fullscreenchange',fsUpd);document.addEventListener('webkitfullscreenchange',fsUpd);

apply();requestAnimationFrame(frame);go(0);
})();
</script>
