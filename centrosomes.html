<!doctype html>
<html lang="ar" dir="rtl"><head><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الجسيمات المركزية</title>
<style>
  :root{--navy:#1f3a52;--paper:#fff;--ink:#1f3a52;--sub:#8a5a1a;--hint:#c4623a;color-scheme:light}
  html{height:100%;box-sizing:border-box}
  html,body{margin:0;overflow:hidden;background:var(--paper);font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:var(--paper)}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:14px;padding-bottom:env(safe-area-inset-bottom,0px)}
  #go,#prev{min-width:150px;height:56px;padding:0 22px;border-radius:28px;border:3px solid var(--navy);background:var(--paper);color:var(--navy);font:bold 21px Tahoma,"Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  #prev:disabled{opacity:.35;cursor:default;box-shadow:none}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);background:var(--paper);color:var(--navy);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .zb button:focus-visible,#go:focus-visible,#prev:focus-visible{outline:3px solid var(--hint);outline-offset:2px}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  #go:active,#prev:active{background:#d9ebf7}
  .lb{fill:var(--ink);font-size:21px;font-weight:bold;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .ls{fill:var(--sub);font-size:17px;font-weight:bold;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
</style></head><body>

<div id="top"><div id="title">الجسيمات المركزية</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 1000 820" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <radialGradient id="gNuc" cx=".35" cy=".6" r=".8"><stop offset="0" stop-color="#d9c2ee"/><stop offset=".7" stop-color="#a77fcf"/><stop offset="1" stop-color="#7d55a8"/></radialGradient>
        <radialGradient id="gNcl" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#7a64c8"/><stop offset="1" stop-color="#3d2a7a"/></radialGradient>
        <linearGradient id="gRodF" x1="0" x2="1"><stop offset="0" stop-color="#8e3522"/><stop offset=".45" stop-color="#e48a68"/><stop offset="1" stop-color="#9c3d27"/></linearGradient>
        <linearGradient id="gRodB" x1="0" x2="1"><stop offset="0" stop-color="#6e2717"/><stop offset=".45" stop-color="#b8614a"/><stop offset="1" stop-color="#76301e"/></linearGradient>
        <linearGradient id="gRodHF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e3522"/><stop offset=".45" stop-color="#e48a68"/><stop offset="1" stop-color="#9c3d27"/></linearGradient>
        <linearGradient id="gRodHB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e2717"/><stop offset=".45" stop-color="#b8614a"/><stop offset="1" stop-color="#76301e"/></linearGradient>
        <radialGradient id="gCell" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#f6e3c8"/></radialGradient>
        <marker id="arw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#6b7280"/></marker>
        <radialGradient id="gRib" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fff1a0"/><stop offset=".6" stop-color="#e8c13a"/><stop offset="1" stop-color="#a98411"/></radialGradient>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl"><button id="prev" disabled>السابق ▶</button><button id="go">ابدأ</button></div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const show=(e,op)=>{if(op<.01){e.style.display='none';return false;}e.style.display='';e.setAttribute('opacity',f2(op));return true;};
const pop=v=>v*(1+.25*Math.sin(PI*v));

const DUR=[5,5,4.5,8];
const world=G(view);
const Lglow=G(world),SC1=G(world),SC2=G(world),Lobj=G(world);
const Lc1=G(SC1),Lc2=G(SC1),Lo1=G(SC1);

/* ---------------- building blocks ---------------- */
function Txt(x,y,s,par,cls){const t=el('text',{class:cls||'lb',x,y},par||Lobj);t.textContent=s;return t;}
const path=(d,a,p)=>el('path',Object.assign({d,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},a),p);
function popAt(g,cx,cy,v){if(!show(g,v>.01?1:0))return;g.setAttribute('transform',`translate(${cx} ${cy}) scale(${f2(pop(v))}) translate(${-cx} ${-cy})`);}
function Dash(p,v){const L=p.__L||(p.__L=p.getTotalLength());if(!show(p,v>.005?1:0))return;p.setAttribute('stroke-dasharray',`${f1(v*L)} ${f1(L+10)}`);}
const lead=(d,p)=>path(d,{stroke:'#1f3a52','stroke-width':1.6},p);
const Glow=(cx,cy,rx,ry,p)=>el('ellipse',{cx,cy,rx,ry,fill:'url(#gGlow)'},p||Lglow);
function Lab(x,y,name,alt,d,par){const g=G(par||Lobj);(Array.isArray(d)?d:[d]).forEach(q=>lead(q,g));Txt(x,y,name,g);if(alt)Txt(x,y+26,alt,g,'ls');return g;}
const qb=(p,c,q,t)=>[(1-t)*(1-t)*p[0]+2*(1-t)*t*c[0]+t*t*q[0],(1-t)*(1-t)*p[1]+2*(1-t)*t*c[1]+t*t*q[1]];

/* ---------------- 9 triplets of microtubules (normalised to a unit circle) ---------------- */
const TUBES=[];const AL=35*PI/180,DD=.17;
for(let k=0;k<9;k++){const th=(k*40-90)*PI/180,u=[Math.cos(th),Math.sin(th)],t=[-Math.sin(th),Math.cos(th)];
  for(let j=0;j<3;j++){const o=(j-1)*DD;TUBES.push({k,j,px:u[0]+o*(Math.cos(AL)*t[0]+Math.sin(AL)*u[0]),py:u[1]+o*(Math.cos(AL)*t[1]+Math.sin(AL)*u[1])});}}

/* centriole 1: cross-section (stage 1) that turns into the top of an upright cylinder (stage 2) */
const X0=[500,370],XR=150,XT=15;            /* cross-section */
const C1={cx:360,top:190,R:95,H:320};       /* cylinder */
const tr1=0.1*C1.R;
const T1=TUBES.map(o=>Object.assign({},o)).sort((a,b)=>a.py-b.py);
T1.forEach(o=>{o.g=G(Lc1);const back=o.py<0;
  o.rod=el('rect',{fill:back?'url(#gRodB)':'url(#gRodF)',stroke:'#6a2414','stroke-width':1},o.g);
  o.bot=el('ellipse',{fill:back?'#76301e':'#9c3d27'},o.g);
  o.cap=el('ellipse',{fill:'#4a170c',stroke:'#d77a5a'},o.g);});
const glX=Glow(500,370,260,260);
const lMT=Lab(830,200,'نبيبات دقيقة','',[],Lo1);const mtLead=lead('M0,0',lMT);
const lTrip=Lab(170,560,'مجموعة واحدة','(3 نبيبات دقيقة)',[],Lo1);const trLead=lead('M0,0',lTrip);
const sum=G(Lo1);Txt(500,620,'9 مجاميع × 3 نبيبات = 27 نبيباً دقيقاً',sum);
const lC1=Lab(170,330,'مريكز','(اسطوانة مجوفة)','M200,360 L262,392',Lo1);
const rodT=T1.find(o=>o.k==2&&o.j==2);
const lRod=Lab(640,150,'نبيبات دقيقة','',`M590,160 L${f1(C1.cx+C1.R*rodT.px+8)},${f1(C1.top+C1.R*rodT.py*.38+70)}`,Lo1);

/* centriole 2: lying across, at right angles to the first (stage 3) */
const C2={fx:520,fy:565,R:95,L:300};
const T2=TUBES.map(o=>Object.assign({},o)).sort((a,b)=>b.px-a.px);
T2.forEach(o=>{o.g=G(Lc2);const back=o.px>0;const x=C2.fx+C2.R*o.px*.38,y=C2.fy+C2.R*o.py;
  o.x=x;o.y=y;
  o.rod=el('rect',{x:f1(x),y:f1(y-tr1),height:f1(2*tr1),fill:back?'url(#gRodHB)':'url(#gRodHF)',stroke:'#6a2414','stroke-width':1},o.g);
  o.bot=el('ellipse',{cy:f1(y),rx:f1(tr1*.38),ry:f1(tr1),fill:back?'#76301e':'#9c3d27'},o.g);
  el('ellipse',{cx:f1(x),cy:f1(y),rx:f1(tr1*.38),ry:f1(tr1),fill:'#4a170c',stroke:'#d77a5a','stroke-width':2},o.g);});
const glP=Glow(560,450,380,280);
const lC2=Lab(850,720,'مريكز','',`M820,708 L760,${f1(C2.fy+60)}`,Lo1);
const lPair=Lab(800,230,'الجسيم المركزي','(زوج من المريكزات المتعامدة)',['M740,262 L468,340','M800,262 L700,470'],Lo1);

/* ---------------- stage 4: the centrosomes in a dividing animal cell ---------------- */
const CELL=G(SC2);
el('ellipse',{cx:500,cy:400,rx:410,ry:265,fill:'url(#gCell)',stroke:'#c9a27a','stroke-width':4},CELL);
const glD=Glow(500,400,420,200,SC2);
const FIB=G(SC2),CHR=G(SC2),CEN=G(SC2),Lo2=G(SC2);
const PL=[150,400],PR=[850,400],ST=[500,190];
const CY=[290,360,440,510];
const fibs=[];
[PL,PR].forEach(P=>{const sgn=P[0]<500?-1:1;
  CY.forEach(y=>{const c=[500+sgn*14,y];fibs.push(path(`M${P[0]},${P[1]} Q${f1((P[0]+c[0])/2)},${f1((P[1]+y)/2+(y-400)*.55)} ${c[0]},${y}`,{stroke:'#4f8a3a','stroke-width':2.4},FIB));});});
[-150,-80,80,150].forEach(b=>fibs.push(path(`M${PL[0]},${PL[1]} Q500,${400+b*1.4} ${PR[0]},${PR[1]}`,{stroke:'#7fb36b','stroke-width':1.8},FIB)));
const ast=[];[PL,PR].forEach(P=>{const sgn=P[0]<500?-1:1;for(let i=0;i<7;i++){const a=(i-3)*.32+(sgn<0?PI:0);
  ast.push(path(`M${f1(P[0]+22*Math.cos(a))},${f1(P[1]+22*Math.sin(a))} L${f1(P[0]+52*Math.cos(a))},${f1(P[1]+52*Math.sin(a))}`,{stroke:'#7fb36b','stroke-width':2},FIB));}});
CY.forEach((y,i)=>{const g=G(CHR,{transform:`translate(500 ${y})`}),c=i%2?'#c4473b':'#3b6fc4';
  path('M-11,-27 Q0,0 -11,27',{stroke:c,'stroke-width':11},g);path('M11,-27 Q0,0 11,27',{stroke:c,'stroke-width':11},g);
  el('circle',{cx:0,cy:0,r:6,fill:'#333'},g);});
function Mini(){const g=G(CEN);
  el('rect',{x:-24,y:-30,width:18,height:38,rx:2,fill:'url(#gRodF)',stroke:'#6a2414','stroke-width':1.2},g);
  el('ellipse',{cx:-15,cy:-30,rx:9,ry:3.5,fill:'#4a170c',stroke:'#d77a5a','stroke-width':1.5},g);
  el('rect',{x:-4,y:2,width:38,height:18,rx:2,fill:'url(#gRodHF)',stroke:'#6a2414','stroke-width':1.2},g);
  el('ellipse',{cx:-4,cy:11,rx:3.5,ry:9,fill:'#4a170c',stroke:'#d77a5a','stroke-width':1.5},g);
  return g;}
const mA=Mini(),mB=Mini();
function placeM(g,p,sc){if(!show(g,sc>.01?1:0))return;g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f2(sc)})`);}
const lCen=Lab(500,95,'جسيم مركزي','(يتضاعف عند انقسام الخلية)','M500,122 L500,160',Lo2);
const lPole=Lab(150,180,'الجسيم المركزي','(عند القطب)',['M150,206 L150,355'],Lo2);
const lPole2=Lab(850,180,'الجسيم المركزي','(عند القطب المقابل)',['M850,206 L850,355'],Lo2);
const lFib=Lab(500,720,'خيوط المغزل','(تربط الجسيمين المركزيين)','M470,706 L362,490',Lo2);
const note=G(Lo2);
el('rect',{x:150,y:762,width:700,height:52,rx:12,fill:'#eef6ea',stroke:'#4f8a3a','stroke-width':2},note);
Txt(500,788,'الخلايا النباتية لا تحتوي جسيمات مركزية، لكن فيها مركز لتكوين النبيبات وخيوط المغزل',note,'ls');

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:0,dur:1};
let stage=-1,T=0,t0=0,last=performance.now(),P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

function render(t){
  const N=DUR.length,s=[0];for(let i=1;i<=N;i++)s.push(clamp(P-(i-1),0,1));
  /* 1 cross-section: the 9 triplets appear one by one around the circle
     2 the ring tilts into the top of an upright hollow cylinder and the tubules grow down */
  const m=sm(s[2],0,.45),hgt=C1.H*sm(s[2],.35,.85);
  T1.forEach(o=>{const v=sm(s[1],o.k*.06,o.k*.06+.14+o.j*.02);
    if(!show(o.g,v>.01?1:0))return;
    const x=lerp(X0[0]+XR*o.px,C1.cx+C1.R*o.px,m),y=lerp(X0[1]+XR*o.py,C1.top+C1.R*o.py*.38,m);
    const rx=lerp(XT,tr1,m),ry=lerp(XT,tr1*.38,m),sc=pop(v);
    o.cap.setAttribute('cx',f1(x));o.cap.setAttribute('cy',f1(y));o.cap.setAttribute('rx',f1(rx*sc));o.cap.setAttribute('ry',f1(ry*sc));
    o.cap.setAttribute('stroke-width',f1(lerp(6,2,m)));
    if(show(o.rod,hgt>1?1:0)){o.rod.setAttribute('x',f1(x-rx));o.rod.setAttribute('y',f1(y));o.rod.setAttribute('width',f1(2*rx));o.rod.setAttribute('height',f1(hgt));}
    if(show(o.bot,hgt>1?1:0)){o.bot.setAttribute('cx',f1(x));o.bot.setAttribute('cy',f1(y+hgt));o.bot.setAttribute('rx',f1(rx));o.bot.setAttribute('ry',f1(ry));}
  });
  const out1=1-sm(s[2],0,.15);
  show(glX,.6*Math.sin(PI*sm(s[1],.1,.9)));
  if(show(lMT,sm(s[1],.6,.75)*out1)){const o=T1.find(q=>q.k==1&&q.j==2);mtLead.setAttribute('d',`M800,215 L${f1(X0[0]+XR*o.px+12)},${f1(X0[1]+XR*o.py-12)}`);}
  if(show(lTrip,sm(s[1],.7,.85)*out1)){const o=T1.find(q=>q.k==6&&q.j==1);trLead.setAttribute('d',`M215,548 L${f1(X0[0]+XR*o.px-20)},${f1(X0[1]+XR*o.py+8)}`);}
  show(sum,sm(s[1],.82,.97)*out1);
  show(lC1,sm(s[2],.8,.95));show(lRod,sm(s[2],.88,1));
  /* 3 a second centriole forms at right angles to the first -> the centrosome */
  const g2=sm(s[3],0,.6);
  T2.forEach(o=>{const v=sm(s[3],o.k*.03,o.k*.03+.15);if(!show(o.g,v>.01?1:0))return;const L=C2.L*g2;
    o.rod.setAttribute('width',f1(Math.max(.1,L)));o.bot.setAttribute('cx',f1(o.x+L));show(o.rod,L>1?1:0);show(o.bot,L>1?1:0);});
  show(glP,.6*Math.sin(PI*sm(s[3],.4,1)));show(lC2,sm(s[3],.6,.75));show(lPair,sm(s[3],.72,.92));
  /* 4 in a dividing cell: the centrosome doubles, the two move to opposite poles and the spindle fibres form between them */
  show(SC1,1-sm(s[4],0,.12));
  show(SC2,sm(s[4],.06,.18));
  show(CHR,sm(s[4],.12,.25));
  const ap=sm(s[4],.15,.24),sp=sm(s[4],.27,.36),mv=sm(s[4],.36,.62);
  placeM(mA,mv>0?qb([ST[0]-26,ST[1]],[220,190],PL,mv):[ST[0]-26*sp,ST[1]],pop(ap));
  placeM(mB,mv>0?qb([ST[0]+26,ST[1]],[780,190],PR,mv):[ST[0]+26*sp,ST[1]],sp>.01?pop(sp):0);
  show(lCen,sm(s[4],.2,.3)*(1-sm(s[4],.34,.4)));
  fibs.forEach((f,i)=>Dash(f,sm(s[4],.6+i*.006,.78+i*.006)));
  ast.forEach(f=>Dash(f,sm(s[4],.66,.8)));
  show(glD,.5*Math.sin(PI*sm(s[4],.62,1)));
  show(lPole,sm(s[4],.66,.78));show(lPole2,sm(s[4],.68,.8));show(lFib,sm(s[4],.78,.9));show(note,sm(s[4],.88,.98));
}

/* ---------------- next / previous buttons ---------------- */
const btn=document.getElementById('go'),pbtn=document.getElementById('prev');
function go(i){const tgt=i+1;let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1,d);}
function back(){if(stage<0)return;const tgt=stage;stage--;S.entry=P;S.tgt=tgt;t0=T;S.dur=.9;}
btn.onclick=()=>{if(stage>=DUR.length-1){P=0;stage=-1;S.entry=0;S.tgt=0;}go(stage+1);};
pbtn.onclick=back;
let lbl='',paused=false;
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render(T);
  const nl=stage<0?'ابدأ':(stage>=DUR.length-1&&P>DUR.length-.001)?'إعادة ⟲':'التالي ◀';
  if(nl!==lbl){btn.textContent=nl;lbl=nl;}
  pbtn.disabled=stage<0;
  requestAnimationFrame(frame);}

/* ---------------- zoom & pan (gestures) ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:500,y:410});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:500,y:410});
document.getElementById('zreset').onclick=reset;
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';fsBtn.setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' ')btn.click();else if(e.key==='ArrowRight')back();});
apply();render(0);requestAnimationFrame(frame);
})();
