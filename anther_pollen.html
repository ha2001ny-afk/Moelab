const Afe=Arr('M115,562 L115,380',DARK),lAfe=Lab([[168,470,'إخصاب']]);
const tkZ=Ball(Ltok,'gB',11);
const SD=G(Lobj);
el('ellipse',{cx:115,cy:320,rx:36,ry:46,fill:'#a0612a',stroke:'#6a3a10','stroke-width':2},SD);
el('ellipse',{cx:115,cy:320,rx:29,ry:39,fill:'#fff1c8'},SD);
el('path',{d:'M108,348 Q93,316 112,290 Q127,300 119,320 Q114,340 123,352Z',fill:'#7cc04a',stroke:'#3e7a20','stroke-width':1.5},SD);
const lSd=Lab([[196,296,'جنين'],[196,348,'سويداء'],['L','M176,296 L120,304'],['L','M168,346 L136,334']]);

/* ================= 13) fruit -> new sporophyte ================= */
const Asf=Arr('M115,268 L115,206',DARK),Aft=Arr('M168,140 Q196,118 224,130',DARK);
const FR=G(Lobj);
path('M115,104 Q118,92 126,86',{stroke:'#6b3a24','stroke-width':3},FR);
el('circle',{cx:115,cy:150,r:48,fill:'url(#gFr)',stroke:'#9a2a10','stroke-width':1.5},FR);
el('circle',{cx:115,cy:152,r:36,fill:'#ffd98a'},FR);
el('ellipse',{cx:115,cy:154,rx:13,ry:19,fill:'#a0612a',stroke:'#6a3a10','stroke-width':1.5},FR);
const lFr=Lab([[60,92,'ثمرة'],[196,180,'بذرة'],['L','M178,178 L128,160']]);

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:0,dur:1};
let stage=-1,T=0,t0=0,last=performance.now(),P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

function render(t){
  const q=[0];for(let i=1;i<=7;i++)q.push(clamp(P-(i-1),0,1));
  const c=x=>clamp(x,0,1),s=[];
  /* each click advances two parallel arrows, as in the textbook figure */
  s[4]=s[7]=q[2];s[5]=s[8]=q[3];s[9]=c(q[4]/.55);s[10]=c((q[4]-.5)/.5);s[11]=c(q[5]/.62);s[12]=c((q[5]-.58)/.42);
  s[13]=c(q[6]/.75);s[1]=c((q[6]-.55)/.45);s[2]=c(q[7]/.6);
  const br=k=>1+.03*Math.sin(t*1.6+k);
  /* 1 tree */
  grow(TR,300,262,sm(s[1],0,.6));show(lTr,sm(s[1],.6,.9));
  glT.setAttribute('opacity',f2(.8*Math.sin(PI*sm(q[6],.8,1))));
  /* 2 flower */
  drawArr(Atf,sm(s[2],0,.3));popAt(FL,510,272,sm(s[2],.25,.6));show(lFlL,sm(s[2],.6,.8));show(lFlR,sm(s[2],.7,.95));
  /* 3 anther */
  popAt(AN,700,330,sm(q[1],0,.4));show(lAn,sm(q[1],.35,.6));drawArr(Afa,sm(q[7],.55,.8));
  glA.setAttribute('opacity',f2(Math.sin(PI*sm(s[4],0,.3))));
  /* 4 meiosis -> four microspores */
  drawArr(Ami,sm(s[4],.05,.35));show(lMi,sm(s[4],.15,.35));
  setBall(tkMi,Ami.at(sm(s[4],.1,.4)),1,(s[4]>.1&&s[4]<.45)?1-sm(s[4],.38,.45):0);
  {const ta=sm(s[4],.4,.48),d1=sm(s[4],.48,.62),d2=sm(s[4],.64,.78),col=sm(s[4],.64,.78),d3=sm(s[4],.8,.95);
   T2.forEach((q,j)=>{let p=[TC[0]+lerp(lerp(0,T1[j>>1][0],d1),q[0],d2),TC[1]+lerp(lerp(0,T1[j>>1][1],d1),q[1],d2)];p=lp2(p,MS[j],d3);
     const sc=pop(ta)*(1-.15*d1)*br(j),o=j===0?1-sm(s[5],.1,.2):1;
     setBall(miB[j],p,sc,o*(1-col)*(ta>0?1:0));setBall(miO[j],p,sc,o*col);});}
  show(lMs,sm(s[4],.85,1));
  /* 5 pollen grain */
  drawArr(Apo,sm(s[5],0,.35));show(lApo,sm(s[5],.15,.35));
  setBall(tkPo,Apo.at(sm(s[5],.1,.45)),1,(s[5]>.1&&s[5]<.5)?1-sm(s[5],.42,.5):0);
  popAt(POL,500,530,sm(s[5],.4,.6));
  const dv=sm(s[5],.6,.78);setBall(pn0,PG,1-dv,1);popAt(pTube,510,522,sm(s[5],.65,.8));popAt(pGen,490,542,sm(s[5],.7,.85));
  show(lPo,sm(s[5],.8,.98));
  /* 6 pistil */
  popAt(PI1,890,310,sm(q[1],.2,.6));
  setBall(mmc,MMC,pop(sm(q[1],.5,.7))*br(2),1);show(lPi,sm(q[1],.6,.85));drawArr(Afp,sm(q[7],.65,.92));
  /* 7 megaspores */
  drawArr(Ame,sm(s[7],0,.3));show(lMe,sm(s[7],.1,.3));
  setBall(tkMe,Ame.at(sm(s[7],.05,.35)),1,(s[7]>.05&&s[7]<.42)?1-sm(s[7],.34,.42):0);
  popAt(MO,890,598,sm(s[7],.25,.45));
  {const ta=sm(s[7],.38,.45),d1=sm(s[7],.45,.58),d2=sm(s[7],.6,.72),col=sm(s[7],.6,.72),dg=sm(s[7],.76,.92);
   M4.forEach((q,j)=>{const p=lp2(lp2([890,596],M1[j>>1],d1),q,d2),sc=pop(ta)*br(j)*(j<3?lerp(1,.75,dg):1);
     const o=j===3?1-sm(s[8],.1,.2):1;
     setBall(meB[j],p,sc,(1-col)*(ta>0?1:0));setBall(meO[j],p,sc,o*col*(j<3?1-dg:1));if(j<3)setBall(meX[j],p,sc,col*dg);});}
  show(lMo,sm(s[7],.8,.98));
  /* 8 embryo sac: 1 -> 2 -> 4 -> 8 nuclei */
  drawArr(Aes,sm(s[8],0,.3));show(lAes,sm(s[8],.12,.3));
  setBall(tkEs,Aes.at(sm(s[8],.08,.38)),1,(s[8]>.08&&s[8]<.44)?1-sm(s[8],.36,.44):0);
  popAt(ES,570,700,sm(s[8],.28,.45));
  {const ta=sm(s[8],.4,.45),d1=sm(s[8],.45,.55),d2=sm(s[8],.57,.67),d3=sm(s[8],.69,.82);
   EF.forEach((f,i)=>{const b=EP[i],p=lp2(lp2(lp2(EC,E1[b>>1],d1),E2[b],d2),f,d3);setBall(esN[i],p,pop(ta)*br(i)*lerp(1.2,1,d3),1);});}
  show(walls,sm(s[8],.8,.92));show(lEs,sm(s[8],.85,1));setBox(BXe,sm(s[8],.88,1));
  /* 9 pollination */
  drawArr(Apl,sm(s[9],0,.4));setBox(BXp,sm(s[9],.1,.3));popAt(PS,310,620,sm(s[9],.2,.5));
  setBall(tkPl,Apl.at(sm(s[9],.3,.62)),lerp(1,.8,sm(s[9],.3,.62)),(s[9]>.3&&s[9]<.7)?1-sm(s[9],.64,.7):0);
  setBall(pgS,PGs,pop(sm(s[9],.62,.75))*br(3),1);
  drawArr(Aep,sm(s[9],.55,.85));show(lPl,sm(s[9],.8,.98));
  /* 10 pollen tube grows, two sperm nuclei travel down */
  if(show(tube,s[10]>.02?1:0))Dash(tube,sm(s[10],.05,.6));
  [sp1,sp2].forEach((b,i)=>{const v=sm(s[10],.3+.08*i,.85+.06*i)*.98,q=tube.getPointAtLength(v*(tube.__L||tube.getTotalLength()));
    setBall(b,[q.x+(i?4:-4),q.y],1,(s[10]>.3+.08*i&&s[11]<.2)?1-sm(s[11],.1,.2):0);});
  show(lTu,sm(s[10],.5,.8));
  /* 11 double fertilisation */
  drawArr(Aov,sm(s[11],0,.3));popAt(FO,115,640,sm(s[11],.15,.4));
  if(show(ftube,s[11]>.3?1:0))Dash(ftube,sm(s[11],.3,.55));
  const f1v=sm(s[11],.45,.72),f2v=sm(s[11],.5,.78),TL=ftube.__L||ftube.getTotalLength();
  const tipA=ftube.getPointAtLength(TL),tA=[tipA.x,tipA.y];
  const mv=(v,dst)=>{if(v<.4){const q=ftube.getPointAtLength(v/.4*TL);return[q.x,q.y];}return lp2(tA,dst,(v-.4)/.6);};
  setBall(fs1,mv(f1v,EGG),1,(s[11]>.45&&s[11]<.78)?1:0);setBall(fs2,mv(f2v,POLc),1,(s[11]>.5&&s[11]<.82)?1:0);
  const fe=sm(s[11],.72,.85),fp=sm(s[11],.78,.92),eg=sm(s[11],.15,.4),gz=false;
  setBall(fEggO,EGG,pop(eg),1-fe);setBall(fEggB,EGG,pop(Math.max(eg,fe)),gz?0:fe);
  setBall(fPo1,lp2([107,640],POLc,fp),pop(eg),1-fp);setBall(fPo2,lp2([123,640],POLc,fp),pop(eg),1-fp);setBall(fEnd,POLc,pop(fp)*br(4),1);
  glF.setAttribute('opacity',f2(Math.sin(PI*sm(s[11],.7,1))));
  show(lFo,sm(s[11],.85,1));
  /* 12 seed */
  drawArr(Afe,sm(s[12],0,.4));show(lAfe,sm(s[12],.2,.4));
  setBall(tkZ,Afe.at(sm(s[12],.08,.5)),1,(s[12]>.08&&s[12]<.56)?1-sm(s[12],.5,.56):0);
  popAt(SD,115,320,sm(s[12],.5,.75));show(lSd,sm(s[12],.75,.95));
  /* 13 fruit -> tree */
  drawArr(Asf,sm(s[13],0,.25));popAt(FR,115,150,sm(s[13],.2,.45));show(lFr,sm(s[13],.4,.6));drawArr(Aft,sm(s[13],.5,.75));
}

/* ---------------- next / previous buttons ---------------- */
const btn=document.getElementById('go'),pbtn=document.getElementById('prev');
function go(i){const tgt=i+1;let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1,d);}
function back(){if(stage<0)return;const tgt=stage;stage--;S.entry=P;S.tgt=tgt;t0=T;S.dur=.9;}
btn.onclick=()=>{if(stage>=DUR.length-1){P=0;stage=-1;S.entry=0;S.tgt=0;}go(stage+1);};
pbtn.onclick=back;
let lbl='',paused=false;
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render(T);
  const nl=stage<0?'ابدأ':(stage>=DUR.length-1&&P>DUR.length-.001)?'إعادة ⟲':'التالي ◀';
  if(nl!==lbl){btn.textContent=nl;lbl=nl;}
  pbtn.disabled=stage<0;
  requestAnimationFrame(frame);}

/* ---------------- zoom & pan (gestures) ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:500,y:410});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:500,y:410});
document.getElementById('zreset').onclick=reset;
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';fsBtn.setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' ')btn.click();else if(e.key==='ArrowRight')back();});
apply();render(0);requestAnimationFrame(frame);
})();
</script>
