  ['L','M1085,532 L1082,594'],['L','M1020,606 L1076,604'],['L','M1030,700 L1062,700'],['L','M1150,640 L1141,640'],['L','M1046,756 L1069,728'],['L','M1146,756 L1126,708']]);
const C6=Box(1085,820,226,32,['(6) مرحلة الجنين الناضج']);

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:0,dur:1};
let stage=-1,T=0,t0=0,last=performance.now(),P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}
function mvT(tube,v,dst){const L=tube.__L||tube.getTotalLength();if(v<.5){const q=tube.getPointAtLength(v/.5*L);return[q.x,q.y];}
  const e=tube.getPointAtLength(L);return lp2([e.x,e.y],dst,(v-.5)/.5);}

function render(t){
  const s=[0];for(let i=1;i<=NST;i++)s.push(clamp(P-(i-1),0,1));
  const br=k=>1+.03*Math.sin(t*1.6+k);
  /* 1 flower, pollination, pollen tube */
  popAt(FL,1060,220,sm(s[1],0,.3));
  setBall(pgF,lp2([1120,20],[1066,90],sm(s[1],.32,.52)),1,s[1]>.32?1:0);
  if(show(tubeF,s[1]>.52?1:0))Dash(tubeF,sm(s[1],.52,.8));
  glO.setAttribute('opacity',f2(.9*Math.sin(PI*sm(s[1],.78,1))));
  /* 2 enlarged ovary: the egg becomes a zygote */
  drawArr(A0,sm(s[2],0,.3));tok(tk0,A0,s[2],.04,.3);
  popAt(OY,780,220,sm(s[2],.25,.5));
  {const eg=sm(s[2],.4,.55),fe=sm(s[2],.7,.82);
   setBall(spY,lp2([780,270],EGGY,sm(s[2],.55,.7)),1,(s[2]>.55&&s[2]<.72)?1:0);
   setBall(eggY,EGGY,pop(eg),1-fe);setBall(zygY,EGGY,pop(fe)*br(5),1);
   glY.setAttribute('opacity',f2(.9*Math.sin(PI*sm(s[2],.7,1))));}
  show(lOY,sm(s[2],.82,1));
  /* 3 double fertilisation */
  drawArr(A1,sm(s[3],0,.22));tok(tk1,A1,s[3],.03,.24);
  show(F1,sm(s[3],.18,.32));popAt(OV1g,510,220,sm(s[3],.22,.38));
  {const eg=sm(s[3],.25,.4),dg=sm(s[3],.8,.92),fe=sm(s[3],.62,.72),fp=sm(s[3],.66,.78);
   ant.forEach((b,i)=>setBall(b,ANT[i],pop(eg),1-dg));syn.forEach((b,i)=>setBall(b,SYN[i],pop(eg),1-dg));
   setBall(egg,EGG1,pop(eg),1-fe);setBall(zyg1,EGG1,pop(fe)*br(1),1);
   setBall(po1,lp2([501,215],CEN1,fp),pop(eg),1-fp);setBall(po2,lp2([519,215],CEN1,fp),pop(eg),1-fp);setBall(en1,CEN1,pop(fp)*br(2),1);
   if(show(tube1,(s[3]>.4?1:0)*(1-dg)))Dash(tube1,sm(s[3],.4,.5));
   const v1=sm(s[3],.46,.62),v2=sm(s[3],.5,.66);
   setBall(sp1,mvT(tube1,v1,EGG1),1,(s[3]>.46&&s[3]<.64)?1:0);setBall(sp2,mvT(tube1,v2,CEN1),1,(s[3]>.5&&s[3]<.68)?1:0);
   glZ.setAttribute('opacity',f2(.9*Math.sin(PI*sm(s[3],.62,.95))));}
  show(lP1,sm(s[3],.84,1));setBox(C1,sm(s[3],.86,1));
  /* 4 proembryo + endosperm */
  drawArr(A2,sm(s[4],0,.2));tok(tk2,A2,s[4],.02,.22);
  show(F2,sm(s[4],.14,.28));popAt(OV2g,170,220,sm(s[4],.18,.32));
  {const ta=sm(s[4],.28,.36),e1=sm(s[4],.4,.48),e2=sm(s[4],.5,.58),e3=sm(s[4],.6,.68),ec=sm(s[4],.72,.86);
   EF2.forEach((f,i)=>{const b=EP[i],p=lp2(lp2(lp2(EC2,E1b[b>>1],e1),E2b[b],e2),f,e3);setBall(en2[i],p,pop(ta)*br(i)*lerp(1,.7,ec),1);});
   OV2.endo.setAttribute('opacity',f2(ec));
   const d1=sm(s[4],.38,.5),d2=sm(s[4],.5,.7),d3=sm(s[4],.72,.84);
   setBall(z2,[170,262],pop(ta)*br(1),1-sm(s[4],.38,.42));
   const ab=lp2(lp2([170,262],[170,250],d1),[170,228],d2);
   ap.forEach((b,j)=>setBall(b,lp2(ab,AQ[j],d3),pop(d1)*lerp(1.2,1,d3)*br(j),1));
   setBall(bs2,lp2(lp2([170,262],[170,272],d1),[170,278],d2),pop(d1)*br(3),1);
   sus2.forEach((b,k)=>setBall(b,[170,SY2[k]],pop(sm(s[4],.56+.05*k,.64+.05*k)),1));}
  show(lP2,sm(s[4],.86,1));setBox(C2,sm(s[4],.88,1));
  /* 5 globular */
  drawArr(A3,sm(s[5],0,.25));tok(tk3,A3,s[5],.02,.27);
  show(F3,sm(s[5],.15,.3));popAt(OV3g,155,650,sm(s[5],.2,.38));
  popAt(GL3,155,660,sm(s[5],.4,.75));
  show(lP3,sm(s[5],.75,.95));setBox(C3,sm(s[5],.8,1));
  /* 6 heart */
  drawArr(A4,sm(s[6],0,.25));tok(tk4,A4,s[6],.02,.27);
  show(F4,sm(s[6],.15,.3));popAt(OV4g,465,650,sm(s[6],.2,.38));
  {const gv=sm(s[6],.3,.45),hv=sm(s[6],.45,.78);
   if(show(GL4,(gv>.01?1:0)*(1-hv)))GL4.setAttribute('transform',`translate(465 660) scale(${f2(pop(gv))}) translate(-465 -660)`);
   if(show(HT,hv))HT.setAttribute('transform',`translate(465 682) scale(1 ${f2(lerp(.55,1,hv))}) translate(-465 -682)`);}
  show(lP4,sm(s[6],.78,.95));setBox(C4,sm(s[6],.82,1));
  /* 7 torpedo */
  drawArr(A5,sm(s[7],0,.25));tok(tk5,A5,s[7],.02,.27);
  show(F5,sm(s[7],.15,.3));popAt(OV5g,775,650,sm(s[7],.2,.38));
  {const gv=sm(s[7],.35,.6);
   if(show(TP,gv>.01?1:0))TP.setAttribute('transform',`translate(775 700) scale(1 ${f2(Math.max(.01,gv))}) translate(-775 -700)`);
   setCots(sm(s[7],.58,.82));show(mer,sm(s[7],.78,.88));}
  show(lP5,sm(s[7],.82,.98));setBox(C5,sm(s[7],.84,1));
  /* 8 mature embryo / seed */
  drawArr(A6,sm(s[8],0,.25));tok(tk6,A6,s[8],.02,.27);
  show(F6,sm(s[8],.15,.3));popAt(OV6g,1085,650,sm(s[8],.18,.32));show(SC,sm(s[8],.3,.48));
  DashS(axO,sm(s[8],.45,.62));DashS(axF,sm(s[8],.45,.62));DashS(cot1,sm(s[8],.55,.8));DashS(cot2,sm(s[8],.58,.82));
  popAt(plu,1082,604,sm(s[8],.74,.84));popAt(rad,1071,722,sm(s[8],.76,.86));
  glS.setAttribute('opacity',f2(.7*Math.sin(PI*sm(s[8],.82,1))));
  show(lP6,sm(s[8],.82,1));setBox(C6,sm(s[8],.86,1));
}

/* ---------------- next / previous buttons ---------------- */
const btn=document.getElementById('go'),pbtn=document.getElementById('prev');
function go(i){const tgt=i+1;let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1,d);}
function back(){if(stage<0)return;const tgt=stage;stage--;S.entry=P;S.tgt=tgt;t0=T;S.dur=.9;}
btn.onclick=()=>{if(stage>=DUR.length-1){P=0;stage=-1;S.entry=0;S.tgt=0;}go(stage+1);};
pbtn.onclick=back;
let lbl='',paused=false;
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render(T);
  const nl=stage<0?'ابدأ':(stage>=DUR.length-1&&P>DUR.length-.001)?'إعادة ⟲':'التالي ◀';
  if(nl!==lbl){btn.textContent=nl;lbl=nl;}
  pbtn.disabled=stage<0;
  requestAnimationFrame(frame);}

/* ---------------- zoom & pan (gestures) ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:620,y:430});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:620,y:430});
document.getElementById('zreset').onclick=reset;
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';fsBtn.setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' ')btn.click();else if(e.key==='ArrowRight')back();});
apply();render(0);requestAnimationFrame(frame);
})();
</script>
</body>
