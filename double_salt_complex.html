}

  .tools{gap:5px}
  .palette{top:calc(max(10px,env(safe-area-inset-top)) + 44px)}
  #info{top:calc(max(10px,env(safe-area-inset-top)) + 46px)}
  #info .eq{font-size:12px}
  #info .wl{font-size:12.5px}
}

<body>
<div class="stage">
  <canvas id="scene" aria-label="محاكاة ثلاثية الأبعاد للمقارنة بين الملح المزدوج (ملح مور) والمركب التناسقي (سداسي سيانو حديدات II البوتاسيوم)"></canvas>
  <div id="info" aria-live="polite">

  </div>

    <button class="c" data-c="#5ee07a" aria-pressed="false" aria-label="أخضر" style="background:#5ee07a"></button>

    <button class="w" data-w="7" aria-pressed="false" aria-label="خط سميك"><i style="width:12px;height:12px"></i></button>
  </div>
  <div id="toast" class="toast" hidden></div>

<script>
"use strict";
// ================= أدوات رياضية =================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z), sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,k)=>V(a.x*k,a.y*k,a.z*k), dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const norm=a=>mul(a,1/Math.hypot(a.x,a.y,a.z));
const lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerpC=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));
const LIGHT=norm(V(-0.45,0.85,0.6)), FILL=norm(V(0.7,0.2,0.5));
function segDist(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,l=vx*vx+vy*vy||1;const t=clamp(((p.x-a.x)*vx+(p.y-a.y)*vy)/l,0,1);return Math.hypot(p.x-a.x-vx*t,p.y-a.y-vy*t)}

// ================= الكانفس والتخطيط =================
const cv=document.getElementById('scene'), ctx=cv.getContext('2d');
const LAY={land:{w:1000,h:650,cx:500,cy:380,k:1.3},port:{w:620,h:1240,cx:310,cy:600,k:1.08}};
let W=1,H=1,dpr=1,L=LAY.land,s=1,ox=0,oy=0,mode='land';

// ================= الكاميرا =================
const TARGET=V(0,120,10), DIST=1100; let cam=null;
const VIEW0={yaw:-0.36,pitch:0.30,zoom:1,px:0,py:0,ortho:0}; let view={...VIEW0};
function setupCam(){
  const cp=Math.cos(view.pitch), sp=Math.sin(view.pitch);
  const C=V(TARGET.x+DIST*Math.sin(view.yaw)*cp, TARGET.y+DIST*sp, TARGET.z+DIST*Math.cos(view.yaw)*cp);
  const f=norm(sub(TARGET,C)), r=norm(cross(f,V(0,1,0))), u=cross(r,f);
  cam={C,f,r,u,F:L.k*view.zoom*DIST,cx:L.cx+view.px,cy:L.cy+view.py};
}
function P(p){const v=sub(p,cam.C), dz=dot(v,cam.f), sc=cam.F/(dz*(1-view.ortho)+DIST*view.ortho);
  return{x:cam.cx+dot(v,cam.r)*sc,y:cam.cy-dot(v,cam.u)*sc,s:sc,z:dz}}
const viewVec=pt=>{const o=view.ortho;if(o<=0)return sub(cam.C,pt);if(o>=1)return mul(cam.f,-1);return add(mul(norm(sub(cam.C,pt)),1-o),mul(cam.f,-o))};
const depth=p=>dot(sub(p,cam.C),cam.f);
function col(c,a=1){return`rgba(${Math.round(clamp(c[0],0,255))},${Math.round(clamp(c[1],0,255))},${Math.round(clamp(c[2],0,255))},${a})`}
function lit(c,n,pt,o={}){
  const amb=o.amb??0.34, spec=o.spec??0.28, shin=o.shin??28;
  const dif=Math.max(0,dot(n,LIGHT)), v=norm(viewVec(pt)), h=norm(add(LIGHT,v));
  const sp=spec*Math.pow(Math.max(0,dot(n,h)),shin);
  const k=amb+0.7*dif+0.2*Math.max(0,dot(n,FILL))+0.22*Math.max(0,dot(n,v));
  return c.map(x=>x*k+255*sp);
}
function pathPts(ps,close=true){ctx.beginPath();ps.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));if(close)ctx.closePath()}
function centroid(ps){let x=0,y=0,z=0;ps.forEach(p=>{x+=p.x;y+=p.y;z+=p.z});return V(x/ps.length,y/ps.length,z/ps.length)}
function face(pts,n,c,o={}){
  const ctr=centroid(pts); if(dot(n,viewVec(ctr))<=0)return false;
  pathPts(pts.map(P)); const cc=col(lit(c,n,ctr,o),o.alpha??1);
  ctx.fillStyle=cc;ctx.fill();ctx.strokeStyle=o.line||cc;ctx.lineWidth=o.lw||.6;ctx.stroke();return true;
}
function box(x0,x1,y0,y1,z0,z1,c,o){const p=V;
  face([p(x1,y0,z0),p(x1,y1,z0),p(x1,y1,z1),p(x1,y0,z1)],V(1,0,0),c,o);
  face([p(x0,y0,z0),p(x0,y0,z1),p(x0,y1,z1),p(x0,y1,z0)],V(-1,0,0),c,o);
  face([p(x0,y1,z0),p(x0,y1,z1),p(x1,y1,z1),p(x1,y1,z0)],V(0,1,0),c,o);
  face([p(x0,y0,z0),p(x1,y0,z0),p(x1,y0,z1),p(x0,y0,z1)],V(0,-1,0),c,o);
  face([p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)],V(0,0,1),c,o);
  face([p(x0,y0,z0),p(x0,y1,z0),p(x1,y1,z0),p(x1,y0,z0)],V(0,0,-1),c,o);
}
function cyl(B,A,e1,e2,r,len,c,o={}){
  const n=o.sides||24, E=add(B,mul(A,len)), ring=[];
  for(let i=0;i<n;i++){const a=i/n*TAU+(o.rot||0);ring.push(add(mul(e1,Math.cos(a)),mul(e2,Math.sin(a))))}
  for(let i=0;i<n;i++){const a=ring[i],b=ring[(i+1)%n],cc=o.knurl&&i%2?c.map(v=>v*.72):c;
    face([add(B,mul(a,r)),add(B,mul(b,r)),add(E,mul(b,r)),add(E,mul(a,r))],norm(add(a,b)),cc,o)}
  if(o.cap1!==false)face(ring.map(d=>add(E,mul(d,r))),A,o.capCol||c,o);
  if(o.cap0!==false)face(ring.map(d=>add(B,mul(d,r))),mul(A,-1),o.capCol||c,o);
}
const cylY=(x,z,r,y0,y1,c,o)=>cyl(V(x,y0,z),V(0,1,0),V(1,0,0),V(0,0,1),r,y1-y0,c,o);
function planeText(str,O,ex,ey,size,color,font='600 32px system-ui,Tahoma,sans-serif',dir='rtl'){
  const o=P(O),a=P(add(O,ex)),b=P(add(O,ey)),k=size/32; ctx.save();
  ctx.transform((a.x-o.x)*k,(a.y-o.y)*k,(b.x-o.x)*k,(b.y-o.y)*k,o.x,o.y);
  ctx.font=font;ctx.direction=dir;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(str,0,0);ctx.restore();
}
function ring3(cx,y,cz,r,n=28){const a=[];for(let i=0;i<n;i++){const t=i/n*TAU;a.push(V(cx+r*Math.cos(t),y,cz+r*Math.sin(t)))}return a}
function softShadow(cx,cz,rx,rz,a=.35){
  for(let i=3;i>=1;i--){const k=1+i*.18;const pts=[];for(let j=0;j<28;j++){const t=j/28*TAU;pts.push(P(V(cx+rx*k*Math.cos(t),0.3,cz+rz*k*Math.sin(t))))}
    pathPts(pts);ctx.fillStyle=`rgba(0,0,0,${a/(i+1)})`;ctx.fill()}
}
// ================= الأجسام الدورانية =================
function silhouette(cx,cz,rings){
  const a=P(V(cx,0,cz)), b=P(V(cx,100,cz)); let ax=b.x-a.x, ay=b.y-a.y; const l=Math.hypot(ax,ay);
  let px,py; if(l<1e-3){px=1;py=0}else{ax/=l;ay/=l;px=-ay;py=ax}
  const Lp=[],Rp=[];
  for(const g of rings){const c=P(V(cx,g.y,cz)); if(g.r<0.02){Lp.push(c);Rp.push(c);continue}
    let mn=1e9,mx=-1e9,pm=c,pM=c;
    for(let i=0;i<28;i++){const t=i/28*TAU;const q=P(V(cx+g.r*Math.cos(t),g.y,cz+g.r*Math.sin(t)));const d=(q.x-c.x)*px+(q.y-c.y)*py;if(d<mn){mn=d;pm=q}if(d>mx){mx=d;pM=q}}
    Lp.push(pm);Rp.push(pM)}
  return{L:Lp,R:Rp,poly:[...Lp,...Rp.slice().reverse()]};
}
function tubeRings(r,yc,y0,y1){
  const bot=yc-r, lo=Math.max(y0,bot), ys=new Set([lo,y1]);
  for(let i=0;i<=10;i++){const y=yc-r*Math.cos(i/10*Math.PI/2);if(y>lo&&y<y1)ys.add(y)}
  return[...ys].sort((a,b)=>a-b).map(y=>({y,r:y<yc?Math.sqrt(Math.max(0,r*r-(yc-y)*(yc-y))):r}));
}
function gradAcross(sil,stops,a=1){
  const m=Math.floor(sil.L.length*0.6), p0=sil.L[Math.min(m,sil.L.length-1)], p1=sil.R[Math.min(m,sil.R.length-1)];
  const g=ctx.createLinearGradient(p0.x,p0.y,p1.x,p1.y);
  stops.forEach(([t,c,al])=>g.addColorStop(t,col(c,(al??1)*a)));return g;
}
function stripAt(sil,t0,t1,i0=0){
  const A=[],B=[];for(let i=i0;i<sil.L.length;i++){const l=sil.L[i],r=sil.R[i];A.push({x:lerp(l.x,r.x,t0),y:lerp(l.y,r.y,t0)});B.push({x:lerp(l.x,r.x,t1),y:lerp(l.y,r.y,t1)})}
  return[...A,...B.reverse()];
}

// ================= بيانات التجربة =================
// ملح مور: FeSO₄·(NH₄)₂SO₄·6H₂O — ملح مزدوج يتفكك كلياً
// K₄[Fe(CN)₆]·3H₂O — مركب تناسقي يبقى أيونه المعقد متماسكاً
const SOL={
  mohr:{rgb:[170,222,180],a:.6,label:'FeSO₄·(NH₄)₂SO₄',kind:'double'},
  k4:{rgb:[246,206,60],a:.78,label:'K₄[Fe(CN)₆]',kind:'complex'}
};
const TUBES=[{x:-120,sol:'mohr',sug:'naoh'},{x:-40,sol:'mohr',sug:'k3'},{x:40,sol:'k4',sug:'naoh'},{x:120,sol:'k4',sug:'k3'}];
const REAG={
  naoh:{x:-232,z:42,f:'NaOH',conc:'1 M',name:'هيدروكسيد الصوديوم',liq:[226,238,250],bottle:'plastic'},
  k3:{x:232,z:42,f:'K₃[Fe(CN)₆]',conc:'0.1 M',name:'سداسي سيانو حديدات(III) البوتاسيوم',liq:[236,140,22],bottle:'amber'}
};
const RX={
  'mohr|naoh':{ppt:true,rgb:[96,134,76],sed:10,after:[188,206,186],slow:1.35},
  'mohr|k3':{ppt:true,rgb:[22,46,150],sed:7,after:[64,96,190],slow:1},
  'k4|naoh':{ppt:false,after:[246,210,72]},
  'k4|k3':{ppt:false,after:[242,168,40]}
};
// ألوان الأيونات (المنظار + المعادلات)
const ION={
  Fe2:{t:'Fe²⁺',c:[226,128,58]}, NH4:{t:'NH₄⁺',c:[96,134,244]}, SO4:{t:'SO₄²⁻',c:[236,206,58]},
  K:{t:'K⁺',c:[178,120,244]}, FeCN6:{t:'[Fe(CN)₆]⁴⁻',c:[127,211,255]}, FeCN3:{t:'[Fe(CN)₆]³⁻',c:[255,160,70]},
  Na:{t:'Na⁺',c:[176,182,198]}, OH:{t:'OH⁻',c:[236,84,72]}, pptG:{t:'Fe(OH)₂↓',c:[118,168,92]}, pptB:{t:'KFe[Fe(CN)₆]↓',c:[64,104,236]}
};
const hexC=c=>col(c);
const TUBE_R=9, TUBE_RI=8.2, TUBE_YC=17, TUBE_TOP=160, V0=10;
const levelY=v=>{const hemi=2/3*Math.PI*Math.pow(TUBE_RI/10,3), A=Math.PI*Math.pow(TUBE_RI/10,2);return TUBE_YC+(v-hemi)/A*10};
const LENS_Y=234, PIPE_LEN=64;

let st=[], sel=-1, drs={}, drops=[], now=0, lastT=0;
let showLabels=true, spin=false, is2D=false, saved3D=null, tween=null;
function resetState(){
  st=TUBES.map(()=>({vol:V0,rg:null,tR:0,parts:null,done:false,ripple:-9,lens:null}));
  sel=-1; drops=[];
  for(const k in REAG){const R=REAG[k];const home=V(R.x,77,R.z);drs[k]={id:k,home,D:{...home},state:'home',path:null,onDone:null,tube:-1,t0:0,nd:0}}
  updateInfo();
}

// ================= الرسم =================
let items=[], labels=[], extraLabels=[], blockers=[];
function draw(){

function tubeChem(i){

  const out={cloud:0,front:0,sed:0,sp:0,t:0,liq:base,crgb:[255,255,255],srgb:[255,255,255],a:sol.a};
  if(!S.rg||!S.tR)return out;
  const R=RX[T.sol+'|'+S.rg], t=(now-S.tR)/1000;out.t=t;
  if(!R.ppt){const m=ease(clamp(t/1.6,0,1));out.liq=lerpC(base,R.after,m);out.a=lerp(sol.a,.82,m);return out}
  const up=clamp(t/0.8,0,1), sp=ease(clamp((t-2)/(7*R.slow),0,1));
  out.cloud=.96*up*(1-sp*.82);out.front=clamp(t*50,0,95);out.sed=sp*R.sed;out.sp=sp;
  out.crgb=R.rgb;out.srgb=R.rgb;out.liq=lerpC(base,R.after,up);out.a=lerp(sol.a,.8,up);return out;
}

function mkPart(type,x,y){return{type,x,y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,a:Math.random()*TAU,va:(Math.random()-.5)*1.4,need:null,tgt:-1,dead:false,born:now}}
function randIn(r){const a=Math.random()*TAU,d=Math.sqrt(Math.random())*r;return[Math.cos(a)*d,Math.sin(a)*d*.9-.5]}
function initLens(i){

function spawnReagent(i){

  const add_=(t,n)=>{for(let k=0;k<n;k++){const p=mkPart(t,(Math.random()-.5)*8,-9.3+Math.random()*.6);p.vy=2.5+Math.random()*1.5;ln.parts.push(p)}};

const PSIZE={Fe2:.8,NH4:.95,SO4:1.05,K:.72,FeCN6:2.2,FeCN3:2.2,Na:.65,OH:.7,pptG:1.5,pptB:1.6};
function updateLens(i,dt){
  const S=st[i], ln=S.lens; if(!ln)return;
  if(S.tR&&!ln.spawned&&now-S.tR>150)spawnReagent(i);
  const react=S.tR&&now-S.tR>1300;
  const ps=ln.parts;
  for(const p of ps){if(p.dead)continue;
    const heavy=p.type==='pptG'||p.type==='pptB';
    if(heavy){p.vy+=3.2*dt;p.vx*=.96}
    else if(p.tgt>=0){const f=ps[p.tgt];const dx=f.x-p.x,dy=f.y-p.y,d=Math.hypot(dx,dy)||1;p.vx+=dx/d*45*dt;p.vy+=dy/d*45*dt;const dmp=Math.pow(.9,dt*60);p.vx*=dmp;p.vy*=dmp;
      if(d<(PSIZE[p.type]+PSIZE[f.type])*.9){p.dead=true;f.need[p.type]--;f.flash=now;
        if(Object.values(f.need).every(v=>v<=0)){f.type=S.rg==='naoh'?'pptG':'pptB';f.need=null;f.vx*=.2;f.vy=.3}}}
    else if(p.need&&react){p.vx*=.9;p.vy*=.9}
    else{p.vx+=(Math.random()-.5)*7*dt;p.vy+=(Math.random()-.5)*7*dt;const sp=Math.hypot(p.vx,p.vy),mx=p.type==='FeCN6'||p.type==='FeCN3'?1.3:2.1;if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp}}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;
    const R=9.4-PSIZE[p.type], d=Math.hypot(p.x,p.y);
    if(d>R){const nx=p.x/d,ny=p.y/d;p.x=nx*R;p.y=ny*R;const vn=p.vx*nx+p.vy*ny;if(vn>0){p.vx-=(heavy?1.2:2)*vn*nx;p.vy-=(heavy?1.2:2)*vn*ny}}
  }
  // تنافر لطيف حتى لا تتراكب الجسيمات
  const al=ps.filter(p=>!p.dead);
  for(let a=0;a<al.length;a++)for(let b=a+1;b<al.length;b++){const A=al[a],B=al[b];if(A.tgt>=0||B.tgt>=0)continue;const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||.01,m=(PSIZE[A.type]+PSIZE[B.type])*.95;if(d<m){const k=(m-d)*.5*Math.min(1,dt*8);A.x-=dx/d*k;A.y-=dy/d*k;B.x+=dx/d*k;B.y+=dy/d*k}}

    const msg={ 'mohr|naoh':'تكوّن راسب أخضر من هيدروكسيد الحديد(II) ← في محلول ملح مور أيونات <bdi dir="ltr">Fe²⁺</bdi> حرة، لأن الملح المزدوج يتفكك كلياً إلى أيوناته البسيطة.',
      'mohr|k3':'تكوّن راسب أزرق غامق (أزرق بروسيا) ← توجد أيونات <bdi dir="ltr">Fe²⁺</bdi> حرة في محلول الملح المزدوج.',
      'k4|naoh':'لم يتكوّن أي راسب! الحديد مرتبط داخل الأيون المعقد، فلا توجد أيونات <bdi dir="ltr">Fe²⁺</bdi> حرة تتفاعل مع <bdi dir="ltr">OH⁻</bdi>.',
      'k4|k3':'لم يتكوّن راسب أزرق، وتغيّر اللون قليلاً بسبب لون الكاشف فقط ← لا توجد أيونات <bdi dir="ltr">Fe²⁺</bdi> حرة في محلول المركب التناسقي.'}[T.sol+'|'+S.rg];
    toast(msg,7500)}
    if(i===sel)updateLens(i,dt)});
}
const dragging=()=>!!drag&&drag.moved;
function animating(){return!!tween||(spin&&!is2D)||busy()||drops.length>0||sel>=0||guidePoint()!=null||st.some(S=>S.tR&&now-S.tR<12000)}
let raf=0;
function frame(t){raf=0;const dt=Math.min(.05,Math.max(0,(t-(lastT||t))/1000));lastT=t;now=t;update(dt);draw();if(animating())raf=requestAnimationFrame(frame);else lastT=0}
function paint(){if(!raf)raf=requestAnimationFrame(frame)}

// ================= الإدخال =================
function toV(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s}}
function hit(p){
  for(const k in drs){const dr=drs[k],D=dr.D,R=REAG[k];
    if(dr.state!=='home'&&dr.state!=='drag')continue;
    if(segDist(p,P(V(D.x,D.y-4,D.z)),P(V(D.x,D.y+30,D.z)))<22)return{kind:'dropper',rid:k};
    if(dr.state==='home'&&segDist(p,P(V(R.x,8,R.z)),P(V(R.x,66,R.z)))<24*L.k)return{kind:'dropper',rid:k};
  }
  let best=null,bd=22;
  TUBES.forEach((T,i)=>{const d=segDist(p,P(V(T.x,10,0)),P(V(T.x,TUBE_TOP,0)));if(d<bd){bd=d;best={kind:'tube',idx:i}}});
  return best;
}
function rayPlane(p,axis,val){
  const sx=p.x-cam.cx, sy=p.y-cam.cy; let O,Dr;
  if(view.ortho>.5){const k=DIST/cam.F;O=add(cam.C,add(mul(cam.r,sx*k),mul(cam.u,-sy*k)));Dr=cam.f}
  else{O=cam.C;Dr=add(cam.f,add(mul(cam.r,sx/cam.F),mul(cam.u,-sy/cam.F)))}
  const dn=Dr[axis];if(Math.abs(dn)<1e-4)return null;const t=(val-O[axis])/dn;if(t<0)return null;return add(O,mul(Dr,t));
}
function toolDragTo(p,rid){ // طرف القطارة يتبع الإصبع مباشرة
  const dr=drs[rid], yLvl=TUBE_TOP+8+PIPE_LEN, yPl=yLvl-PIPE_LEN, cur=dr.D;
  if(!drag.off){const ts=P(V(cur.x,yPl,cur.z));drag.off={x:ts.x-drag.start.x,y:ts.y-drag.start.y}}
  const q={x:p.x+drag.off.x,y:p.y+drag.off.y};
  const w=is2D?rayPlane(q,'z',0):rayPlane(q,'y',yPl);if(!w)return;
  const x=clamp(w.x,-300,300), z=is2D?lerp(cur.z,0,.25):clamp(w.z,-120,120);
  dr.D=V(x,yLvl,z);
}
function nearestTube(rid){const dr=drs[rid],tip=P(V(dr.D.x,dr.D.y-PIPE_LEN,dr.D.z)),w=dr.D;
  let bi=-1,bdd=1e9;TUBES.forEach((T,i)=>{const d=Math.min(d2(P(V(T.x,TUBE_TOP,0)),tip)/44,Math.hypot(w.x-T.x,w.z)/26);if(d<1&&d<bdd){bdd=d;bi=i}});return bi}
const ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const p=toV(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:d2(a,b)};if(drag&&drag.kind==='dropper'&&drag.moved)releaseTool();drag=null;return}
  const h=hit(p);drag={kind:h?h.kind:'bg',idx:h?h.idx:-1,rid:h?h.rid:null,start:p,last:p,moved:false,off:null};
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const p=toV(e);ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()],d=d2(a,b);zoomAt({x:(a.x+b.x)/2,y:(a.y+b.y)/2},d/pinch.d);pinch.d=d;return}
  if(!drag)return;const dx=p.x-drag.last.x,dy=p.y-drag.last.y;
  if(!drag.moved&&d2(p,drag.start)>6){drag.moved=true;
    if(drag.kind==='dropper'){if(busy())drag.kind='bg';else drs[drag.rid].state='drag'}
    if(drag.kind==='tube')drag.kind='bg';}
  if(drag.moved){
    if(drag.kind==='dropper'){toolDragTo(p,drag.rid);paint()}
    else if(drag.kind==='bg'){if(tween&&!('ortho'in tween.to))tween=null;if(!tween){if(is2D){view.px+=dx;view.py+=dy}else{view.yaw-=dx*.008;view.pitch=clamp(view.pitch+dy*.006,.12,1.45)}paint()}}
  }
  drag.last=p;
});
function releaseTool(){const rid=drag.rid,i=nearestTube(rid),dr=drs[rid];
  dr.state='move';if(i>=0&&!st[i].rg)addReagent(rid,i,true);else{if(i>=0)toast('أُضيف كاشف إلى هذا الأنبوب. اختر أنبوباً آخر.');dropperHome(rid)}}
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;drag=null;return}
  if(!drag)return;
  if(drag.moved&&drag.kind==='dropper')releaseTool();
  else if(!drag.moved){
    if(drag.kind==='tube')selectTube(drag.idx);
    else if(drag.kind==='dropper'&&!busy())addReagent(drag.rid,sel>=0&&!st[sel].rg?sel:-1,false);
  }
  drag=null;paint();
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('dblclick',()=>{if(is2D){tween={from:{...view},to:{px:0,py:0,zoom:1},t0:performance.now(),dur:500}}else{tween={from:{...view},to:{yaw:VIEW0.yaw,pitch:VIEW0.pitch,zoom:1,px:0,py:0},t0:performance.now(),dur:600}}paint()});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(toV(e),Math.exp(-e.deltaY*.0015))},{passive:false});
function zoomAt(p,f){const z=clamp(view.zoom*f,.6,3.2),r=z/view.zoom;if(r===1)return;
  const cx=L.cx+view.px,cy=L.cy+view.py;view.px=p.x-(p.x-cx)*r-L.cx;view.py=p.y-(p.y-cy)*r-L.cy;view.zoom=z;paint()}

// ================= الأزرار =================
const $=id=>document.getElementById(id);
const tEl=$('toast');let tTimer=0;
function toast(m,ms=5000){tEl.innerHTML=m;tEl.hidden=false;tEl.style.opacity=1;clearTimeout(tTimer);tTimer=setTimeout(()=>{tEl.style.opacity=0;setTimeout(()=>tEl.hidden=true,400)},ms)}
$('labels').onclick=e=>{showLabels=!showLabels;e.currentTarget.setAttribute('aria-pressed',showLabels);paint()};
$('spin').onclick=e=>{if(is2D){toast('الدوران التلقائي متاح في منظر 3D');return}spin=!spin;e.currentTarget.setAttribute('aria-pressed',spin);paint()};
$('dim').onclick=e=>{is2D=!is2D;const b=e.currentTarget;b.setAttribute('aria-pressed',is2D);b.textContent=is2D?'3D':'2D';b.setAttribute('aria-label',is2D?'التبديل إلى منظر ثلاثي الأبعاد':'التبديل إلى منظر ثنائي الأبعاد');
  if(is2D){if(!(tween&&tween.to.ortho===0&&saved3D))saved3D={yaw:view.yaw,pitch:view.pitch,px:view.px,py:view.py,zoom:view.zoom};
    spin=false;$('spin').setAttribute('aria-pressed',false);
    tween={from:{...view},to:{yaw:view.yaw-wrapA(view.yaw),pitch:0,ortho:1,px:0,py:0,zoom:1},ph:{yaw:[0,.7],pitch:[0,.7],px:[0,.7],py:[0,.7],zoom:[0,.7],ortho:[.45,1]},t0:performance.now(),dur:900}}
  else{const sv=saved3D||VIEW0;tween={from:{...view},to:{yaw:sv.yaw,pitch:sv.pitch,ortho:0,px:sv.px,py:sv.py,zoom:sv.zoom??1},ph:{ortho:[0,.55],yaw:[.3,1],pitch:[.3,1],px:[.3,1],py:[.3,1],zoom:[.3,1]},t0:performance.now(),dur:900}}
  paint()};
$('reset').onclick=()=>{resetState();tween={from:{...view},to:is2D?{px:0,py:0,zoom:1}:{yaw:VIEW0.yaw,pitch:VIEW0.pitch,px:0,py:0,zoom:1},t0:performance.now(),dur:600};toast('أُعيدت التجربة. اضغط على أنبوب لتبدأ.',3500);paint()};
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
$('fullscreen').onclick=async()=>{try{if(fsEl()){await(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const el=document.documentElement;const f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)throw 0;await f.call(el)}}catch(_){toast('ملء الشاشة غير متاح في هذا المتصفح')}};
function fsUpd(){const on=!!fsEl();$('fsPath').setAttribute('d',on?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');$('fullscreen').setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة')}
document.addEventListener('fullscreenchange',fsUpd);document.addEventListener('webkitfullscreenchange',fsUpd);

// ================= القلم =================
const ink=$('ink'),ictx=ink.getContext('2d'),pal=$('palette');
const pen={mode:null,color:'#ffffff',w:3,last:null,id:null};
function sizeInk(){const r=ink.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),nw=Math.max(1,Math.round(r.width*d)),nh=Math.max(1,Math.round(r.height*d));
  if(ink.width===nw&&ink.height===nh)return;const tmp=document.createElement('canvas');tmp.width=ink.width;tmp.height=ink.height;tmp.getContext('2d').drawImage(ink,0,0);
  ink.width=nw;ink.height=nh;ictx.drawImage(tmp,0,0)}
function setPen(m){pen.mode=pen.mode===m?null:m;$('pen').setAttribute('aria-pressed',pen.mode==='pen');$('eraser').setAttribute('aria-pressed',pen.mode==='erase');
  pal.hidden=pen.mode!=='pen';ink.style.pointerEvents=pen.mode?'auto':'none';ink.style.cursor=pen.mode==='pen'?'crosshair':pen.mode==='erase'?'cell':''}
$('pen').onclick=()=>setPen('pen');$('eraser').onclick=()=>setPen('erase');
$('clear').onclick=()=>{ictx.clearRect(0,0,ink.width,ink.height)};
pal.querySelectorAll('.c').forEach(b=>b.onclick=()=>{pen.color=b.dataset.c;pal.querySelectorAll('.c').forEach(x=>x.setAttribute('aria-pressed',x===b))});
pal.querySelectorAll('.w').forEach(b=>b.onclick=()=>{pen.w=+b.dataset.w;pal.querySelectorAll('.w').forEach(x=>x.setAttribute('aria-pressed',x===b))});
function inkPt(e){const r=ink.getBoundingClientRect(),k=ink.width/r.width;return{x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k,k}}
ink.addEventListener('pointerdown',e=>{if(!pen.mode)return;ink.setPointerCapture(e.pointerId);pen.id=e.pointerId;pen.last=inkPt(e);stroke(pen.last,pen.last)});
ink.addEventListener('pointermove',e=>{if(pen.id!==e.pointerId)return;const p=inkPt(e);stroke(pen.last,p);pen.last=p});
const inkEnd=e=>{if(pen.id===e.pointerId){pen.id=null;pen.last=null}};ink.addEventListener('pointerup',inkEnd);ink.addEventListener('pointercancel',inkEnd);
function stroke(a,b){ictx.save();ictx.lineCap='round';ictx.lineJoin='round';
  if(pen.mode==='erase'){ictx.globalCompositeOperation='destination-out';ictx.lineWidth=24*a.k}else{ictx.strokeStyle=pen.color;ictx.lineWidth=pen.w*a.k}
  ictx.beginPath();ictx.moveTo(a.x,a.y);ictx.lineTo(b.x+.01,b.y);ictx.stroke();ictx.restore()}

// ================= التحجيم والبدء =================
function resize(){const r=cv.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);mode=W/H>=0.9?'land':'port';L=LAY[mode];s=Math.min(W/L.w,H/L.h);ox=(W-L.w*s)/2;oy=(H-L.h*s)/2;sizeInk();paint()}
new ResizeObserver(resize).observe(document.querySelector('.stage'));
resetState();resize();
toast('اضغط على أنبوب لاختياره ورؤية ما في محلوله، ثم اضغط إحدى القطارتين لإضافة الكاشف · اسحب للتدوير · إصبعان أو العجلة للتكبير',6500);
window.__sim={get state(){return{sel,st,drs,view,is2D}},select:selectTube,add:(rid,i)=>addReagent(rid,i,false),P:p=>{setupCam();return P(p)},toV:(x,y)=>({x:x*s+ox,y:y*s+oy}),TUBES};
</script>
