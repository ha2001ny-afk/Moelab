function setPlayBtn(){const b=$('replay');b.textContent=running?'\u23F8\uFE0E':'\u25B6\uFE0E';b.title=running?'إيقاف مؤقت':'متابعة التأشيرات';b.setAttribute('aria-label',b.title);}
function schedule(delay){clearTimers();if(next>=layers.length){running=false;setPlayBtn();return}running=true;setPlayBtn();
  const tick=()=>{layers[next].classList.add('show');next++;if(next<layers.length)timers.push(setTimeout(tick,SIM.step));else{running=false;setPlayBtn()}};
  timers.push(setTimeout(tick,delay));}
function pause(){clearTimers();running=false;setPlayBtn();}
function intro(){clearTimers();layers.forEach(l=>l.classList.remove('show'));next=0;schedule(SIM.firstDelay);}
$('top').textContent=SIM.title;document.title=SIM.title;
svg.setAttribute('viewBox','0 0 '+W+' '+H);
mk('image',{'class':'base',href:SIM.image,x:0,y:0,width:W,height:H,preserveAspectRatio:'none'},view);
layers=SIM.layers.map(l=>mk('image',{'class':'ly',href:l.src,x:l.x||0,y:l.y||0,width:l.w||W,height:l.h||H,preserveAspectRatio:'none'},view));
$('replay').onclick=()=>{if(running){pause();return}labelsVisible=true;applyLabelVisibility();if(next>=layers.length)intro();else schedule(700)};
$('zreset').onclick=()=>{labelsVisible=true;applyLabelVisibility();intro()};
$('labelsToggle').onclick=()=>{labelsVisible=!labelsVisible;applyLabelVisibility()};
let sc=1,tx=0,ty=0;
function apply(){view.setAttribute('transform','translate('+tx+' '+ty+') scale('+sc+')')}
function zoom(factor,point){let next=Math.max(.6,Math.min(5,sc*factor));let k=next/sc;tx=point.x-(point.x-tx)*k;ty=point.y-(point.y-ty)*k;sc=next;apply()}
function center(){return {x:W/2,y:H/2}}
function reset(){sc=1;tx=0;ty=0;apply()}
$('zin').onclick=()=>zoom(1.3,center());$('zout').onclick=()=>zoom(1/1.3,center());
function setFs(on){document.body.classList.toggle('fs',on);$('fs').textContent=on?'✕':'⛶';$('fs').title=on?'إنهاء ملء الشاشة':'ملء الشاشة'}
$('fs').onclick=()=>{
  const d=document.documentElement,inFs=!!(document.fullscreenElement||document.webkitFullscreenElement);
  if(inFs){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(document.body.classList.contains('fs')){setFs(false);return}
  setFs(true);
  const req=d.requestFullscreen||d.webkitRequestFullscreen;
  if(req){try{const r=req.call(d);if(r&&r.catch)r.catch(()=>{})}catch(e){}}
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!(document.fullscreenElement||document.webkitFullscreenElement)&&document.body.classList.contains('fs')&&window.__fsReal)setFs(false);window.__fsReal=!!(document.fullscreenElement||document.webkitFullscreenElement)}));
function toSvg(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
let pts=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,toSvg(e))});
svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;let old=new Map(pts),cur=toSvg(e);pts.set(e.pointerId,cur);if(pts.size===1){let p=old.get(e.pointerId);tx+=cur.x-p.x;ty+=cur.y-p.y;apply()}else if(pts.size>=2){let ids=[...pts.keys()].slice(0,2),a=old.get(ids[0]),b=old.get(ids[1]),c=pts.get(ids[0]),d=pts.get(ids[1]);let dist0=Math.hypot(a.x-b.x,a.y-b.y),dist1=Math.hypot(c.x-d.x,c.y-d.y);let center0={x:(a.x+b.x)/2,y:(a.y+b.y)/2},center1={x:(c.x+d.x)/2,y:(c.y+d.y)/2};tx+=center1.x-center0.x;ty+=center1.y-center0.y;if(dist0>0)zoom(dist1/dist0,center1);}});
const up=e=>pts.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15,toSvg(e))},{passive:false});
svg.addEventListener('dblclick',reset);
applyLabelVisibility();reset();intro();
})();
</script></body></html>
