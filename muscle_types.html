/* ---------- Pill label with pointer arrows ---------- */
function label(par,txt,cx,py,w,tg){
  const h=38,g=G(par,{'pointer-events':'none'});
  tg.forEach(([sx,sy,x,y])=>el('line',{class:'ln','marker-end':'url(#ah)',x1:sx,y1:sy,x2:x,y2:y},g));
  el('rect',{class:'pill',x:cx-w/2,y:py-h/2,width:w,height:h,rx:19},g);
  el('text',{class:'lbl',x:cx,y:py},g).textContent=txt;
}

/* ---------- Scenes ---------- */
const scenes=DATA.map(d=>{
  const S=G(view);
  el('image',{href:d.org,x:d.ox,y:d.oy,width:d.ow,height:d.oh,preserveAspectRatio:'xMidYMid meet'},S);
  el('image',{href:d.tis,x:d.tx0,y:d.ty0,width:d.tw,height:d.th,preserveAspectRatio:'xMidYMid meet'},S);
  label(S,d.txt,450,600,d.pw,[[400,600,d.a1[0],d.a1[1]],[500,600,d.a2[0],d.a2[1]]]);
  return {g:S};
});

/* ---------- Navigation & transitions ---------- */
const dotsBox=document.getElementById('dots');
const dots=scenes.map((s,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>go(i);dotsBox.appendChild(b);return b;});
const updDots=n=>dots.forEach((d,i)=>d.classList.toggle('on',i===n));
const place=(s,dx,k,op,r)=>{s.g.setAttribute('transform',`translate(${(450+dx).toFixed(1)} 350) rotate(${r.toFixed(2)}) scale(${k.toFixed(4)}) translate(-450 -350)`);s.g.setAttribute('opacity',Math.max(0,Math.min(1,op)).toFixed(3));};
const easeIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeBack=p=>{const c1=1.45,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
let cur=0,tr=null;
scenes.forEach((s,i)=>{place(s,0,1,1,0);if(i)s.g.style.display='none';});
updDots(0);
function go(n,dir){
  n=(n+scenes.length)%scenes.length;
  if(tr||n===cur)return;
  if(dir===undefined)dir=n>cur?1:-1;
  tr={from:cur,to:n,dir,st:performance.now()};
  scenes[n].g.style.display='';
  place(scenes[n],-dir*560,.75,0,-dir*6);
  updDots(n);
  requestAnimationFrame(frame);
}
function frame(ms){
  if(!tr)return;
  const p=Math.min(1,Math.max(0,(ms-tr.st)/950)),e=easeIO(p),b=easeBack(p);
  place(scenes[tr.from],tr.dir*560*e,1-0.25*e,1-e*1.2,tr.dir*6*e);
  place(scenes[tr.to],-tr.dir*560*(1-b),0.75+0.25*b,p*1.6,-tr.dir*6*(1-b));
  if(p>=1){scenes[tr.from].g.style.display='none';place(scenes[tr.to],0,1,1,0);cur=tr.to;tr=null;return;}
  requestAnimationFrame(frame);
}
document.getElementById('next').onclick=()=>go(cur+1,1);
document.getElementById('prev').onclick=()=>go(cur-1,-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur+1,1);else if(e.key==='ArrowRight')go(cur-1,-1);});

/* ---------- zoom & pan ---------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:350});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:350});
document.getElementById('zreset').onclick=reset;

/* ---------- fullscreen ---------- */
const fsBtn=document.getElementById('fs'),de=document.documentElement;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{
  const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;
    if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
    setFs(true);
  }else{
    if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}
    setFs(false);
  }
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
})();
</script>
