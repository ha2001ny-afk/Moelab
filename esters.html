<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مختبر الإسترات</title>
<style>
/* VOICE: a clear teaching instrument, calm and precise
   IDEA: a molecular lab bench where atoms and bonds visibly change
   PICTURE: large SVG ball-and-stick molecules, animated bonds, split-screen particle box
   COLOUR and TYPE: white ground, lab green header, CPK atom colours; Cairo
   LAYOUT: green bar with four tabs, wide stage, side control panel (bottom on phones) */
:root{--bg:#ffffff;--ink:#1d2b22;--muted:#5d6b63;--panel:#f3f7f4;--line:#dbe5df;--bond:#2b3430;--green:#1e7b4d;--green2:#145c38}
body.dark{--ink:#eef4f0;--muted:#a8b8af;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.15);--bond:#e4ebe7}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Cairo,Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden;transition:background .3s}
header{background:linear-gradient(180deg,var(--green),var(--green2));color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.18);z-index:5}
header h1{font-size:19px;margin:0;font-weight:800;white-space:nowrap}
header h1 small{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:-4px}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
nav button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:7px 14px;min-height:40px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
nav button.on{background:#fff;color:var(--green2)}
nav button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.18);margin-inline-end:6px;font-size:12px}
nav button.on b{background:var(--green);color:#fff}
.tools{display:flex;gap:6px;position:relative}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;cursor:pointer}
.ib.off{background:rgba(0,0,0,.25);opacity:.75}
.ib svg{width:22px;height:22px}
.pop{position:absolute;top:50px;inset-inline-end:0;background:#fff;color:#222;border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;grid-template-columns:repeat(4,40px);gap:8px;z-index:20}
.pop.show{display:grid}
.pop button{width:40px;height:40px;border-radius:50%;border:2px solid #ccc;cursor:pointer}
.pop button.on{outline:3px solid var(--green);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
aside{border-inline-end:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
aside h3{font-size:14px;margin:14px 0 8px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
aside h3:first-child{margin-top:0}
.hint{font-weight:400;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:5px 10px;min-height:40px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.chip small{font-size:12px;color:var(--muted);font-weight:400}
.chip.on{border-color:var(--green);background:var(--green);color:#fff}
.chip.on small{color:#e3f3ea}
.grp{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.gc{border-radius:14px;padding:8px 4px;background:var(--c);color:#fff;text-align:center;cursor:grab;touch-action:none;user-select:none;box-shadow:0 3px 8px rgba(0,0,0,.2);font-weight:800;line-height:1.2}
.gc small{display:block;font-weight:600;font-size:12px;opacity:.9}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
.lbl{font-size:12px;color:var(--muted)}
.big{font-size:21px;font-weight:800;line-height:1.3}
.muted{color:var(--muted);font-size:13px;margin:2px 0}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.row b{font-size:16px;unicode-bidi:isolate}
.clsb{margin-top:8px;border-radius:10px;padding:8px 10px;background:color-mix(in srgb,var(--c) 14%,transparent);border-inline-start:5px solid var(--c);font-size:13px}
.clsb b{display:block;font-size:18px;color:var(--c)}
.key{margin-top:12px;display:grid;gap:4px;font-size:13px}
.key div{display:flex;gap:8px;align-items:center}
.key i{font-style:normal;font-weight:800;color:#fff;background:var(--c);border-radius:6px;padding:0 8px;min-width:78px;text-align:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:8px 14px;min-height:44px;background:var(--green);color:#fff;cursor:pointer;width:100%;margin-top:12px}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.btns .btn{margin:0;font-size:14px;padding:6px}
.btn.alt{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.btn.hot{background:#e8590c}.btn.cold{background:#1c7ed6}
.rule{font-size:14px}
.rule b{color:var(--green)}
body.dark .rule b{color:#69db9c}
input[type=range]{width:100%;accent-color:#e8590c;height:32px}
.tval{font-size:28px;font-weight:800;text-align:center;direction:ltr}
.stage{position:relative;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#svg:active{cursor:grabbing}
.cap{position:absolute;top:12px;left:0;right:0;margin:auto;width:fit-content;background:var(--green);color:#fff;padding:6px 18px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.18);max-width:90%;text-align:center;transition:opacity .3s;pointer-events:none}
.cap:empty{opacity:0}
.eq{position:absolute;bottom:72px;left:0;right:0;margin:auto;width:fit-content;max-width:94%;background:var(--bg);border:2px solid var(--green);border-radius:16px;padding:8px 18px;box-shadow:0 8px 24px rgba(0,0,0,.15);opacity:0;transform:translateY(10px);transition:.4s;pointer-events:none;text-align:center}
.eq.show{opacity:1;transform:none}
.eqf{font-size:22px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.eqf .t,.eqn{opacity:0;transform:translateY(6px);transition:.35s}
.eqf .t.on,.eqn.on{opacity:1;transform:none}
.eqf .no{color:#e03131;font-size:18px}
.arw{display:inline-flex;flex-direction:column;align-items:center;line-height:1;color:var(--green)}
.arw small{font-size:13px}
.eqn{font-size:14px;color:var(--muted)}
.ctl{position:absolute;bottom:12px;inset-inline-start:12px;display:flex;gap:6px;flex-wrap:wrap}
.zm{position:absolute;bottom:12px;inset-inline-end:12px;display:flex;gap:6px}
.cb{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;min-height:44px;min-width:44px;padding:0 12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cb.go{background:#ffb703;border-color:#ffb703;color:#222;animation:pulse 1s infinite}
.cb:disabled{opacity:.4;cursor:default;animation:none}
.cb.mode.on{background:var(--green);color:#fff;border-color:var(--green)}
button:focus-visible,.gc:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,183,3,.3)}}
.ghost{position:fixed;padding:8px 12px;border-radius:999px;transform:translate(-50%,-50%);color:#fff;font-weight:800;pointer-events:none;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.35)}
body.nolab .lab,body.nolab #cap,body.nolab #eq{visibility:hidden}
/* svg */
.bl{stroke:var(--bond);stroke-linecap:round}
.bh{stroke-linecap:round;stroke-width:16}
.atom{filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.al{text-anchor:middle;dominant-baseline:central;font-weight:800;pointer-events:none;font-family:Cairo,sans-serif}
.chg{font-size:22px;font-weight:800;fill:#e64980;text-anchor:middle;dominant-baseline:central}
.ring{fill:none;stroke-width:3.5;stroke-dasharray:9 6;animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
.popin{animation:popin .45s cubic-bezier(.3,1.7,.5,1) both;transform-box:fill-box;transform-origin:center}
.svt{fill:var(--ink);font-family:Cairo,sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:central}
.svm{fill:var(--muted);font-family:Cairo,sans-serif;text-anchor:middle;dominant-baseline:central}
.mag{fill:var(--bg);stroke:var(--green);stroke-width:7}
.box{fill:color-mix(in srgb,var(--ink) 4%,transparent);stroke:var(--line);stroke-width:3}
.slot{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-dasharray:6 6}
.arr{fill:none;stroke:#e8590c;stroke-width:3.5;marker-end:url(#ar)}
.hbl{stroke:#1c7ed6;stroke-width:2.5;stroke-dasharray:4 4}
.mm .ln{stroke:var(--bond);stroke-width:3.5;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popin{from{transform:scale(0)}}
@media(max-width:820px){
 main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
 aside{order:2;max-height:34vh;border:0;border-top:1px solid var(--line)}
 header{gap:6px;padding:6px 10px}
 header h1{font-size:17px;flex:1}
 header h1 small{display:none}
 nav{order:3;flex-basis:100%;flex-wrap:nowrap}
 nav button{font-size:11px;padding:4px 4px;white-space:nowrap;flex:1}
 nav{overflow-x:auto}
 nav button b{display:none}
 .ib{width:38px;height:38px}
 .zm{bottom:66px;flex-direction:column}
 .cap{font-size:13px;padding:4px 12px}
 .eqf{font-size:16px}
 .eq{bottom:66px}
}
@media(prefers-reduced-motion:reduce){.ring,.cb.go{animation:none}}
</style>
</head>
<body>
<header>
 <h1>الإسترات<small>مختبر جزيئي تفاعلي</small></h1>
 <nav id="tabs">
  <button data-s="s1"><b>1</b>التركيب والتسمية</button>
  <button data-s="s2"><b>2</b>الأسترة</button>
  <button data-s="s3"><b>3</b>روائح الفواكه</button>
  <button data-s="s4"><b>4</b>التحلل المائي</button>
  <button data-s="s5"><b>5</b>صناعة الصابون</button>
 </nav>
 <div class="tools">
  <button class="ib" id="labBtn" title="إخفاء/إظهار التأشيرات والمعادلات" aria-label="إخفاء أو إظهار التأشيرات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button class="ib" id="bgBtn" title="لون الخلفية" aria-label="لون الخلفية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.3" fill="currentColor"/><circle cx="10" cy="7" r="1.3" fill="currentColor"/><circle cx="15" cy="7.5" r="1.3" fill="currentColor"/></svg></button>
  <div class="pop" id="pop"></div>
  <button class="ib" id="fsBtn" title="ملء الشاشة" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
 </div>
</header>
<main>
 <aside id="panel"></aside>
 <section class="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
   <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8590c"/></marker>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79a6b"/><stop offset="1" stop-color="#9b6f45"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9f5ff" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#d3e9fb" stop-opacity=".55"/></linearGradient>
    <clipPath id="magclip"><circle cx="-30" cy="-150" r="185"/></clipPath>
   </defs>
   <g id="world"></g>
  </svg>
  <div class="cap" id="cap"></div>
  <div class="eq" id="eq"></div>
  <div class="ctl">
   <button class="cb mode" id="modeBtn">خطوة بخطوة</button>
   <button class="cb" id="nextBtn" disabled>التالي ◀</button>
   <button class="cb" id="resetBtn">↺ إعادة</button>
  </div>
  <div class="zm">
   <button class="cb" id="zin" aria-label="تكبير">+</button>
   <button class="cb" id="zout" aria-label="تصغير">−</button>
   <button class="cb" id="zfit" aria-label="ملاءمة">⤢</button>
  </div>
 </section>
</main>
<script>
{
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const svg=$('#svg'),world=$('#world');
const HB=62;
const EL={C:{c:'#3c4247',r:21,t:'#fff'},H:{c:'#ffffff',r:13,t:'#333',s:'#98a39d'},Cl:{c:'#22a845',r:22,t:'#fff'},Br:{c:'#a8322d',r:25,t:'#fff'},I:{c:'#7b2a9c',r:28,t:'#fff'},O:{c:'#e23b3b',r:21,t:'#fff'},Na:{c:'#b07de0',r:22,t:'#fff'},R:{c:'#59636a',r:26,t:'#fff'}};
const SD='₀₁₂₃₄₅₆₇₈₉';
const fm=s=>s.replace(/\d/g,d=>SD[d]);
const L=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const ramp=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
const rnd=(a,b)=>a+Math.random()*(b-a);
function mk(tag,at,p){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e}
function txt(x,y,s,cls,p,extra){const e=mk('text',Object.assign({x,y,class:cls},extra||{}),p);e.textContent=s;return e}

/* ---------- alkyl groups & naming ---------- */
const GR={
 me:{s:'CH3',n:'مثيل',ox:'ميثوكسي',par:'ميثان',pos:'',C:1,H:3,col:'#4c6ef5',r:26,rk:1,al:1,u:['H','H','H']},
 et:{s:'C2H5',n:'إثيل',ox:'إيثوكسي',par:'إيثان',pos:'',C:2,H:5,col:'#12b886',r:30,rk:2,al:0,u:['CH3','H','H']},
 pr:{s:'C3H7',n:'بروبيل',ox:'بروبوكسي',par:'بروبان',pos:'1-',C:3,H:7,col:'#f59f00',r:33,rk:3,al:4,u:['C2H5','H','H']},
 ip:{s:'(CH3)2CH',n:'أيزوبروبيل',ox:'أيزوبروبوكسي',par:'بروبان',pos:'2-',C:3,H:7,col:'#e8590c',r:38,rk:4,al:2},
 ph:{s:'C6H5',n:'فنيل',ox:'فينوكسي',par:'بنزين',pos:'',C:6,H:5,col:'#7950f2',r:34,rk:5,al:3}};
function ethNames(a,b){const A=GR[a],B=GR[b];
 const common=a===b?'ثنائي '+A.n+' أيثر':([A,B].sort((x,y)=>x.al-y.al).map(g=>g.n).join(' ')+' أيثر');
 const par=A.rk>=B.rk?A:B,alk=par===A?B:A;
 return{common,iupac:par.pos+alk.ox+' '+par.par,cond:fm(A.s)+'–O–'+fm(B.s),mol:fm('C'+(A.C+B.C)+'H'+(A.H+B.H))+'O',sym:a===b}}

/* ---------- scene engine ---------- */
class Scene{
 constructor(){this.g=mk('g',{},world);this.gs=mk('g',{},this.g);this.gb=mk('g',{},this.g);this.ga=mk('g',{},this.g);this.gf=mk('g',{class:'lab'},this.g);this.A={};this.B={}}
 destroy(){this.g.remove()}
 atom(id,el,x,y,o){const d=EL[el];const a=Object.assign({id,el,x,y,s:1,op:1,lab:el,charge:'',r:d.r,col:d.c},o||{});
  const g=mk('g',{class:'atom'},this.ga);
  mk('circle',{r:a.r,fill:a.col,stroke:d.s||'rgba(0,0,0,.35)','stroke-width':1.5},g);
  mk('circle',{r:a.r*.42,cx:-a.r*.32,cy:-a.r*.36,fill:'#fff',opacity:.3},g);
  const n=a.lab.length;const t=mk('text',{class:'al',fill:d.t,'font-size':n>6?10:n>3?12:n>1?15:16},g);t.textContent=a.lab;
  a.chE=mk('text',{class:'chg',x:a.r*.9,y:-a.r*.85},g);
  a.g=g;a._t='';this.A[id]=a;return a}
 bond(id,a,b,o){const B=Object.assign({id,a,b,order:1,o2:1,op:1,grow:1,dash:0,hl:0,hc:'#ffb703',w:4.5},o||{});
  const g=mk('g',{},this.gb);B.h=mk('line',{class:'bh'},g);B.ls=[0,1,2].map(()=>mk('line',{class:'bl'},g));B.g=g;this.B[id]=B;return B}
 rmA(id){const a=this.A[id];if(a){a.g.remove();delete this.A[id]}}
 rmB(id){const b=this.B[id];if(b){b.g.remove();delete this.B[id]}}
 clear(){for(const k in this.A)this.rmA(k);for(const k in this.B)this.rmB(k);this.gf.innerHTML=''}
 render(){
  for(const id in this.A){const a=this.A[id];const t=`translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) scale(${a.s.toFixed(3)})`;if(t!==a._t){a.g.setAttribute('transform',t);a._t=t}a.g.style.opacity=a.op;if(a.chE.textContent!==a.charge)a.chE.textContent=a.charge}
  for(const id in this.B){const b=this.B[id],A=this.A[b.a],C=this.A[b.b];
   if(!A||!C){b.g.style.display='none';continue}
   const op=b.op*Math.min(A.op,C.op);b.g.style.display=op<.01?'none':'';b.g.style.opacity=op;
   const x1=A.x,y1=A.y,x2=L(A.x,C.x,b.grow),y2=L(A.y,C.y,b.grow);
   const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
   const offs=b.order===1?[0]:b.order===2?[4.8*b.o2,-4.8*b.o2]:[-7,0,7];
   b.ls.forEach((l,i)=>{if(i>=offs.length){l.style.display='none';return}const o=offs[i];l.style.display='';
    l.setAttribute('x1',x1+nx*o);l.setAttribute('y1',y1+ny*o);l.setAttribute('x2',x2+nx*o);l.setAttribute('y2',y2+ny*o);
    l.style.opacity=(b.order===2&&i===1)?b.o2:1;l.style.strokeWidth=b.order>1?3.6:b.w;l.style.strokeDasharray=b.dash?'7 7':'none'});
   b.h.setAttribute('x1',x1);b.h.setAttribute('y1',y1);b.h.setAttribute('x2',x2);b.h.setAttribute('y2',y2);b.h.style.stroke=b.hc;b.h.style.opacity=b.hl*.55}
 }
}
let sc=null,cur=null,curKey='s1';

/* ---------- sequencing ---------- */
let token=0,stepMode=false,nextRes=null;
const nextBtn=$('#nextBtn');
function tween(ms,fn,my){return new Promise((res,rej)=>{const t0=performance.now();const f=now=>{if(my!==token)return rej('x');const t=Math.min(1,(now-t0)/ms);fn(ease(t),t);t<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)})}
function dropNext(){if(nextRes){const r=nextRes;nextRes=null;r.rej('x')}nextBtn.disabled=true;nextBtn.classList.remove('go')}
function runner(){dropNext();const my=++token;let first=true;return{
 tw:(ms,fn)=>tween(ms,fn,my),wait:ms=>tween(ms,()=>{},my),
 step:async c=>{if(my!==token)throw'x';if(stepMode&&!first){nextBtn.disabled=false;nextBtn.classList.add('go');await new Promise((res,rej)=>{nextRes={res,rej}});nextBtn.disabled=true;nextBtn.classList.remove('go')}first=false;if(my!==token)throw'x';cap(c)}}}
function cancel(){dropNext();token++}
async function seq(fn){const R=runner();try{await fn(R)}catch(e){if(e!=='x')console.error(e)}}
nextBtn.onclick=()=>{if(nextRes){const r=nextRes;nextRes=null;r.res()}};

function fit(){V=Object.assign({},cur.view);if(svg.clientWidth&&svg.clientWidth<600){const k=.74,cx=V.x+V.w/2,cy=V.y+V.h/2;V.w*=k;V.h*=k;V.x=cx-V.w/2;V.y=cy-V.h/2}setV()}
const P=new Map();let dragging=false,moved=false,down=null;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(P.size===1){moved=false;down={x:e.clientX,y:e.clientY};dragging=!!(cur.grab&&cur.grab(toW(e.clientX,e.clientY)))}
 else{if(dragging&&cur.drop)cur.drop(null,false);dragging=false;moved=true}});
svg.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;
 if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)moved=true;
 if(dragging){cur.drag(toW(e.clientX,e.clientY))}
 else if(P.size===1){const k=1/svg.getScreenCTM().a;V.x-=(e.clientX-p.x)*k;V.y-=(e.clientY-p.y)*k;setV()}
 else if(P.size===2){const o=[...P.entries()].find(([id])=>id!==e.pointerId)[1];const d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);
  const k=1/svg.getScreenCTM().a;V.x-=(e.clientX-p.x)*k/2;V.y-=(e.clientY-p.y)*k/2;setV();if(d0>0)zoomAt((e.clientX+o.x)/2,(e.clientY+o.y)/2,d1/d0)}
 p.x=e.clientX;p.y=e.clientY});

 if(dragging){dragging=false;cur.drop(toW(e.clientX,e.clientY),!moved)}

function add5(k){if(e5[k]){cap('أُضيفت مسبقاً');const b=e5.b[k];const x0=b.x,y0=b.y;tween(400,t=>{b.x=L(x0,b.hx,t);b.y=L(y0,200,t);bottleT(b)},token).catch(()=>{});return}
 if(k==='salt'&&!e5.done){cap('أكمل التصبّن أولاً ثم أضف الملح');const b=e5.b[k];const x0=b.x,y0=b.y;tween(400,t=>{b.x=L(x0,b.hx,t);b.y=L(y0,200,t);bottleT(b)},token).catch(()=>{});return}
 e5.busy=true;const b=e5.b[k],col=RG5[k].col;
 const x0=b.x,y0=b.y;
 (async()=>{try{await tween(700,t=>{b.x=L(x0,BX-70,t);b.y=L(y0,-40,t);b.rot=70*t;bottleT(b)},token);
  const dr=[...Array(6)].map(()=>mk('ellipse',{rx:4,ry:6,fill:col,stroke:'#adb5bd'},sc.gs));
  await tween(1200,(e,t)=>{dr.forEach((d,i)=>{const u=(t*4+i/6)%1;d.setAttribute('cx',BX-6);d.setAttribute('cy',L(-120,(e5.top||BB)-4,u));d.style.opacity=t<.9?1:0});if(t>.3)e5[k]=true},token);dr.forEach(d=>d.remove());
  await tween(500,t=>{b.x=L(BX-70,b.hx,t);b.y=L(-40,200,t);b.rot=70*(1-t);bottleT(b)},token);
  cap(k==='oil'?'الزيت يطفو فوق المحلول المائي':k==='naoh'?'طبقتان منفصلتان: يجب التحريك والتسخين':'التمليح: الصابون يطفو كطبقة صلبة فوق المحلول');
  if(k==='salt')saltDone()}catch(e){}finally{e5.busy=false;info5()}})()}
function fin5(){cap('اكتمل التصبّن: تكوّن الصابون والكليسرين');
 const g=e5.prod,s=mk('g',{class:'popin',transform:'translate(300,170)'},g);
 mk('rect',{x:-55,y:-26,width:110,height:52,rx:16,fill:'#fff0f6',stroke:'#e64980','stroke-width':3},s);mk('rect',{x:-40,y:-16,width:50,height:8,rx:4,fill:'#fff',opacity:.9},s);txt(0,8,'صابون','svt',s,{'font-size':16,style:'fill:#a61e4d'});
 const v=mk('g',{class:'popin',transform:'translate(430,150)'},g);mk('rect',{x:-16,y:-40,width:32,height:62,rx:10,fill:'#f1f3f5',stroke:'#868e96','stroke-width':2.5},v);mk('rect',{x:-13,y:-12,width:26,height:31,rx:8,fill:'#e7f5ff'},v);mk('rect',{x:-18,y:-46,width:36,height:8,rx:3,fill:'#868e96'},v);txt(0,40,'كليسرين','svt',v,{'font-size':15});
 
 eqSet2(['(C₁₇H₃₅COO)₃C₃H₅','+','3NaOH',ARWX('Δ'),'3C₁₇H₃₅COONa','+','C₃H₅(OH)₃'],'ستيارات الكليسريل (زيت/دهن) + هيدروكسيد الصوديوم ← ستيارات الصوديوم (صابون) + كليسرين');eqE.querySelectorAll('.t,.eqn').forEach(t=>t.classList.add('on'))}
function saltDone(){}

/* ---------- stage switching ---------- */
const STAGES={s1:EST1,s2:EST2,s3:EST3,s4:EST4,s5:EST5},panel=$('#panel');
function go(k){cancel();curKey=k;cur=STAGES[k];if(sc)sc.destroy();sc=new Scene();eqHide();
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.s===k));
 panel.innerHTML=cur.panel();cur.bind(panel);cur.init();fit();cap(cur.hint);
 $('#modeBtn').style.display=nextBtn.style.display=cur.steps?'':'none';
 try{localStorage.setItem('ester-stage',k)}catch(e){}}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.s));
$('#resetBtn').onclick=()=>go(curKey);
const modeBtn=$('#modeBtn');modeBtn.onclick=()=>{stepMode=!stepMode;modeBtn.classList.toggle('on',stepMode);modeBtn.textContent=stepMode?'وضع: خطوة بخطوة':'خطوة بخطوة'};
$('#labBtn').onclick=e=>{const off=document.body.classList.toggle('nolab');e.currentTarget.classList.toggle('off',off)};

/* ---------- background colours & fullscreen ---------- */
const BGS=[['#ffffff','أبيض'],['#0f1b2d','كحلي'],['#0d2a1c','أخضر غامق'],['#1b1c20','فحمي'],['#241634','بنفسجي غامق'],['#2b1e14','بني غامق'],['#0e2a2f','تركوازي غامق'],['#2a1018','عنابي']];
const pop=$('#pop');pop.innerHTML=BGS.map(([c,n])=>`<button data-c="${c}" title="${n}" aria-label="${n}" style="background:${c}"></button>`).join('');
function setBg(c){document.documentElement.style.setProperty('--bg',c);document.body.classList.toggle('dark',c!=='#ffffff');pop.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));try{localStorage.setItem('ester-bg',c)}catch(e){}}
pop.onclick=e=>{const c=e.target.dataset.c;if(c){setBg(c);pop.classList.remove('show')}};
$('#bgBtn').onclick=e=>{e.stopPropagation();pop.classList.toggle('show')};
document.addEventListener('click',e=>{if(!pop.contains(e.target))pop.classList.remove('show')});
$('#fsBtn').onclick=()=>{try{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const el=d.documentElement;const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(p&&p.catch)p.catch(()=>{})}}catch(e){}};

let bg0='#ffffff',st0='s1';try{bg0=localStorage.getItem('ester-bg')||bg0;st0=localStorage.getItem('ester-stage')||st0}catch(e){}
setBg(bg0);go(STAGES[st0]?st0:'s1');
let last=performance.now();
(function loop(now){const dt=Math.min(.033,((now||last)-last)/1000);last=now||last;if(sc)sc.render();if(cur&&cur.tick)cur.tick(dt);requestAnimationFrame(loop)})();
}
</script>
