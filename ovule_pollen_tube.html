<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,NAVY='#1f3a52',RED='#c8402a',SPC='#c8202a';
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')';};

const TITLE='المبيض وتكوين البويضات وانبوب اللقاح';
const DUR=[9,6,8,7,9,7,11,11];   /* المدقة · الاغلفة · الخلية الام · الكيس الجنيني · انقسامات · الناضج · التلقيح وانبوب اللقاح · الاخصاب المزدوج */
const HEADS=['المدقة والمبيض','اغلفة البويض وفتحة النقير','الخلية الام للابواغ الكبيرة','البوغ الكبير الفعال والكيس الجنيني','انقسامات نواة الكيس الجنيني','الكيس الجنيني الناضج','التلقيح وتكوين انبوب اللقاح','الاخصاب المزدوج'];

const world=G(view),hud=G(view);
const pistG=G(world,{opacity:0});
const k=.42,OX=330,OY=540;               /* ovule placement inside the ovary */
const ovG=G(world,{transform:`translate(${OX} ${OY}) scale(${k})`});
const tubeL=G(world),polL=G(world);
const hudL=G(hud),hudP=G(hud);

/* ---------- helpers ---------- */
const op=(e,a)=>e.setAttribute('opacity',f2(a));
function place(o,x,y,s,a){o.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) scale(${f2(s)})`);o.setAttribute('opacity',f2(a));}
const draw=(l,s)=>l.setAttribute('stroke-dashoffset',f2(1-s));
const glow=(x,y,r,p)=>el('circle',{cx:x,cy:y,r:r||70,fill:'url(#gGlow)',opacity:0},p);
const pulse=(g,s)=>op(g,Math.sin(PI*s));
const line=(d,c,w,p)=>el('path',{d,fill:'none',stroke:c,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1},p);

/* camera poses */
const PIP={wx:330,wy:350,s:1};
function poseL(lx,ly,sx,sy,sl){const s=sl/k;return{wx:OX+lx*k-(sx-330)/s,wy:OY+ly*k-(sy-350)/s,s};}
const PA=poseL(0,40,330,350,.95),PB=poseL(0,10,330,340,1.5),PC=poseL(0,50,330,330,1.45);
const lp=(a,b,t)=>({wx:lerp(a.wx,b.wx,t),wy:lerp(a.wy,b.wy,t),s:a.s*Math.pow(b.s/a.s,t)});
const scr=(p,wx,wy)=>[330+(wx-p.wx)*p.s,350+(wy-p.wy)*p.s];
const SU=(p,ux,uy,inv)=>{const lx=inv?-ux:ux,ly=inv?20-uy:uy;return scr(p,OX+lx*k,OY+ly*k);};

/* name pill: yellow capsule + orange chromosome badge + english caption */
function mol(name,c,p,en){const g=G(p||hudP,{opacity:0});
  const sh=el('rect',{y:-15,height:36,rx:18,fill:NAVY,opacity:.15,filter:'url(#blur)'},g);
  const bx=el('rect',{y:-18,height:36,rx:18,fill:'url(#gGeno)',stroke:'#d9b80f','stroke-width':1.5},g);
  const t=el('text',{class:'mn',y:1},g);t.textContent=name;
  let tw=name.length*7.6;try{const m=t.getComputedTextLength();if(m>0)tw=m;}catch(e){}
  const w=Math.round(tw+(c?52:34));
  sh.setAttribute('x',-w/2+2);sh.setAttribute('width',w);bx.setAttribute('x',-w/2);bx.setAttribute('width',w);
  t.setAttribute('x',c?9:0);
  if(c){el('circle',{cx:-w/2,cy:0,r:17,fill:'url(#gGam)',stroke:'#b84e1e','stroke-width':2},g);
        el('text',{class:'cb',x:-w/2,y:1,'font-size':c.length>1?11.5:14},g).textContent=c;}
  if(en)el('text',{class:'enc',x:0,y:31},g).textContent=en;
  g.w=w;g.bd=!!c;return g;}
/* label = pill + leader line + target dot */
function tag(name,c,en,px,py,t){const lead=line(`M${f1(px)},${f1(py)} L${f1(t[0])},${f1(t[1])}`,NAVY,1.6,hudL);
  const dot=el('circle',{cx:f1(t[0]),cy:f1(t[1]),r:3.5,fill:NAVY,stroke:'#fff','stroke-width':1.5,opacity:0},hudL);
  return{g:mol(name,c,hudP,en),lead,dot,px,py};}
function st(T,a){place(T.g,T.px,T.py,.4+.6*a,a);draw(T.lead,a);op(T.dot,a);}
/* process tag (red) */
function ptag(txt,x,y){const g=G(hudP,{opacity:0});
  const r=el('rect',{y:-15,height:30,rx:15,fill:'#fff5f2',stroke:RED,'stroke-width':2},g);
  const t=el('text',{class:'pt',y:1},g);t.textContent=txt;
  let tw=txt.length*7;try{const m=t.getComputedTextLength();if(m>0)tw=m;}catch(e){}
  const w=tw+28;r.setAttribute('x',-w/2);r.setAttribute('width',w);g.px=x;g.py=y;return g;}
const sp=(g,a)=>place(g,g.px,g.py,.4+.6*a,a);

/* ================= PISTIL (world) ================= */
el('path',{d:'M314,660 L306,700 L354,700 L346,660Z',fill:'#a6cf7c',stroke:'#6f9f4a','stroke-width':2.5},pistG);
el('path',{d:'M312,92 C314,240 304,370 290,434 L370,434 C356,370 346,240 348,92Z',fill:'#cfe6a6',stroke:'#7fa64c','stroke-width':2.5},pistG);
el('path',{d:'M330,98 V428',stroke:'#e6f2d0','stroke-width':7,fill:'none','stroke-linecap':'round'},pistG);
el('ellipse',{cx:330,cy:540,rx:152,ry:128,fill:'#b5d98a',stroke:'#6f9f4a','stroke-width':3},pistG);
el('ellipse',{cx:330,cy:540,rx:134,ry:108,fill:'#f6fbee',stroke:'#8db04e','stroke-width':2},pistG);
for(let i=0;i<9;i++){const x=280+i*12.5,y=78-22*Math.sqrt(Math.max(0,1-((x-330)/62)**2))+3;el('circle',{cx:x,cy:f1(y),r:7,fill:'#e2f0b2',stroke:'#8db04e','stroke-width':2},pistG);}
el('ellipse',{cx:330,cy:80,rx:62,ry:22,fill:'#e2f0b2',stroke:'#8db04e','stroke-width':2.5},pistG);
const brk=line('M598,46 H620 V668 H598',NAVY,2.5,pistG);
const brkT=el('text',{class:'bt',x:640,y:357,transform:'rotate(90 640 357)',opacity:0},pistG);brkT.textContent='المدقة';

/* ================= OVULE (local units, upright: micropyle up) ================= */
const strip=el('path',{d:'M-270,238 Q30,226 320,238 L320,280 Q30,268 -270,280Z',fill:'#b5d98a',stroke:'#6f9f4a','stroke-width':3,opacity:0},ovG);
const fun0=line('',  '#6f9f4a',30,ovG),fun1=line('','#a9d584',23,ovG);
const FU=[150,240,150,200,0,214,0,168],FI=[150,240,228,130,182,-205,0,-152];
function funD(t){const p=FU.map((v,i)=>f1(lerp(v,FI[i],t)));return `M${p[0]},${p[1]} C${p[2]},${p[3]} ${p[4]},${p[5]} ${p[6]},${p[7]}`;}
const body=G(ovG);
const chal=el('ellipse',{cx:0,cy:156,rx:44,ry:22,fill:'#a9d584',stroke:'#6f9f4a','stroke-width':2.5,opacity:0},body);
const integ=(d,c,dc,w)=>[line(d,dc,w+3,body),line(d,c,w,body)];
const oL=integ('M0,163 A108,153 0 0 1 -16,-141.3','#86c06a','#5d9443',15),oR=integ('M0,163 A108,153 0 0 0 16,-141.3','#86c06a','#5d9443',15);
const iL=integ('M0,149 A94,139 0 0 1 -14,-127.4','#b8de9a','#7fae5e',14),iR=integ('M0,149 A94,139 0 0 0 14,-127.4','#b8de9a','#7fae5e',14);
const nuc=el('ellipse',{cx:0,cy:10,rx:86,ry:131,fill:'#fbe7b2',stroke:'#d4ad55','stroke-width':2,opacity:0},body);
const gMic=glow(0,-150,45,body),gMMC=glow(0,-60,50,body),gSac=glow(0,10,95,body),gDiv=glow(0,10,80,body),gPol=glow(0,11,40,body),gZyg=glow(0,-44,42,body),gEnd=glow(0,11,46,body);

/* megaspore mother cell */
const mmc=G(body,{opacity:0});
el('ellipse',{cx:0,cy:0,rx:24,ry:30,fill:'#dccbf2',stroke:'#7b5aa6','stroke-width':2},mmc);
el('circle',{cx:0,cy:0,r:10,fill:'#7b5aa6'},mmc);
/* embryo sac */
const sac=el('ellipse',{cx:0,cy:-24,rx:20,ry:11,fill:'#fff1f4',stroke:'#c4623a','stroke-width':2.2,opacity:0},body);
/* four megaspores */
const sporeG=G(body,{opacity:0});
const spores=[0,1,2,3].map(()=>({r:el('rect',{x:-20,width:40,fill:'#dccbf2',stroke:'#7b5aa6','stroke-width':2},sporeG),n:el('circle',{cx:0,r:6,fill:'#7b5aa6'},sporeG)}));
/* mature embryo-sac cells */
const synL=el('ellipse',{cx:-16,cy:-66,rx:10,ry:15,transform:'rotate(15 -16 -66)',fill:'#fbd5df',stroke:'#d77a98','stroke-width':1.8,opacity:0},body);
const synR=el('ellipse',{cx:16,cy:-66,rx:10,ry:15,transform:'rotate(-15 16 -66)',fill:'#fbd5df',stroke:'#d77a98','stroke-width':1.8,opacity:0},body);
const egg=el('ellipse',{cx:0,cy:-44,rx:14,ry:18,fill:'#f7b3c6',stroke:'#c0267a','stroke-width':1.8,opacity:0},body);
const ants=[[-17,74],[0,90],[17,74]].map(([x,y])=>el('circle',{cx:x,cy:y,r:12,fill:'#bcd9f3',stroke:'#3f7cbf','stroke-width':1.8,opacity:0},body));
/* eight nuclei */
const NC=[...Array(8)].map(()=>el('circle',{r:6,fill:'#7b5aa6',stroke:'#fff','stroke-width':1.2,opacity:0},body));
const K1=[[0,-55],[0,-55],[0,-55],[0,-55],[0,75],[0,75],[0,75],[0,75]];
const K2=[[-12,-60],[-12,-60],[12,-60],[12,-60],[-12,80],[-12,80],[12,80],[12,80]];
const K3=[[-16,-66],[0,-44],[16,-66],[0,-26],[-17,74],[0,90],[17,74],[0,52]];
const K4=K3.map((p,i)=>i===3?[-9,8]:i===7?[9,14]:p);
const NT=['#c8648a','#b0205f','#c8648a','#f0b000','#2f6db0','#2f6db0','#2f6db0','#f0b000'],NR=[5,7,5,8,5,5,5,8];
/* sperms inside the embryo sac (stage 8) */
const spA=el('circle',{r:6.5,fill:SPC,stroke:'#7a0f14','stroke-width':1.5,opacity:0},body),spB=el('circle',{r:6.5,fill:SPC,stroke:'#7a0f14','stroke-width':1.5,opacity:0},body);

/* ================= POLLEN TUBE (world) ================= */
function tube(d){const smp=el('path',{d,fill:'none',stroke:'none'},tubeL);
  return{a:line(d,'#b8860b',6,tubeL),b:line(d,'#f6d77a',3.8,tubeL),smp,L:smp.getTotalLength()};}
const T1=tube('M330,55 L330,425 C330,452 262,452 258,490 L256,590 C255,640 330,650 330,612');
const T2=tube('M330,612 L330,598 Q331,589 332.5,580.3');
function D(d){d=clamp(d,0,T1.L+T2.L);const p=d<=T1.L?T1.smp.getPointAtLength(d):T2.smp.getPointAtLength(d-T1.L);return[p.x,p.y];}

/* pollen grains */
const GX=[300,330,360],GY=[47,44,47];
const grains=GX.map((x,i)=>{const g=G(polL,{opacity:0});
  el('circle',{r:11,fill:'#f4c542',stroke:'#b8860b','stroke-width':2.5,'stroke-dasharray':'2.5 2'},g);
  if(i!==1){el('circle',{cx:-3.5,cy:2,r:2.6,fill:NAVY},g);el('circle',{cx:3.5,cy:-2,r:2.8,fill:SPC},g);}
  return g;});
const tnW=el('circle',{r:2.8,fill:NAVY,opacity:0},polL),gen=el('circle',{r:3.2,fill:SPC,opacity:0},polL),
      s1W=el('circle',{r:2.6,fill:SPC,opacity:0},polL),s2W=el('circle',{r:2.6,fill:SPC,opacity:0},polL);
const setC=(c,p)=>{c.setAttribute('cx',f1(p[0]));c.setAttribute('cy',f1(p[1]));};
const lp2=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];

/* ================= HUD : headings / labels ================= */
const HD=HEADS.map((h,i)=>{const g=G(hudP,{opacity:0});
  const r=el('rect',{y:-16,height:32,rx:16,fill:'#eef5fb',stroke:NAVY,'stroke-width':1.5},g);
  const t=el('text',{class:'hd',y:1},g);t.textContent=h;
  let tw=h.length*8;try{const m=t.getComputedTextLength();if(m>0)tw=m;}catch(e){}
  const w=tw+52;r.setAttribute('x',-w/2);r.setAttribute('width',w);t.setAttribute('x',-9);
  el('circle',{cx:w/2,cy:0,r:15,fill:'url(#gGam)',stroke:'#b84e1e','stroke-width':2},g);
  el('text',{class:'cb',x:w/2,y:1},g).textContent=i+1;
  g.setAttribute('transform','translate(330 24)');return g;});

/* stage 1 – pistil (PI) */
const tStig=tag('الميسم','','Stigma',150,74,[272,82]),tSty=tag('القلم','','Style',150,250,[316,250]),
      tOvy=tag('المبيض','','Ovary',100,540,[182,540]),tCarp=tag('ورقة كربلية','','Carpel',520,420,[444,470]);
/* stage 1 – zoom on ovary wall (A) */
const tNuc=tag('الجويزاء','','Nucellus',548,262,SU(PA,40,0)),tFun=tag('الحبل السري','','Funiculus',548,470,SU(PA,75,206)),
      tWall=tag('جدار المبيض','','Ovary Wall',120,618,SU(PA,-200,256));
/* stage 2 – integuments (A) */
const tOut=tag('الغلاف الخارجي','','Outer Integument',100,296,SU(PA,-108,10)),tIn=tag('الغلاف الداخلي','','Inner Integument',100,410,SU(PA,-85,70)),
      tMic=tag('فتحة النقير','','Micropyle',330,96,SU(PA,0,-140)),tOvl=tag('البويض ( حافظة بوغ كبير )','','Megasporangium',515,140,SU(PA,95,-60));
const pGrow=ptag('تنمو الاغلفة من قاعدة الجويزاء',370,650);
/* stage 3 – MMC & meiosis (B) */
const tMMC=tag('الخلية الام للابواغ الكبيرة','2س','Megaspore Mother Cell',330,72,SU(PB,0,-60)),
      tSpo=tag('اربعة ابواغ كبيرة','س','Megaspores',330,72,SU(PB,22,-60));
const pMei=ptag('انقسام اختزالي',540,236),pRow=ptag('مرتبة في صف واحد',540,288);
/* stage 4 – degeneration & embryo sac (B) */
const pDeg=ptag('تضمحل ثلاثة ابواغ',540,200);

function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render();requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');

function setUI(){document.title=TITLE;[...dotsEl.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+DUR.length)%DUR.length;const tgt=i+1;
  if(tgt<=P+1e-3)P=i;
  let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;

function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);

const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
