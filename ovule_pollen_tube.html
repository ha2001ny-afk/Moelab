<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,NAVY='#1f3a52',RED='#c8402a',SPC='#c8202a';
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')';};

const TITLE='المبيض وتكوين البويضات وانبوب اللقاح';
const DUR=[9,6,8,7,9,7,11,11];   /* المدقة · الاغلفة · الخلية الام · الكيس الجنيني · انقسامات · الناضج · التلقيح وانبوب اللقاح · الاخصاب المزدوج */
const HEADS=['المدقة والمبيض','اغلفة البويض وفتحة النقير','الخلية الام للابواغ الكبيرة','البوغ الكبير الفعال والكيس الجنيني','انقسامات نواة الكيس الجنيني','الكيس الجنيني الناضج','التلقيح وتكوين انبوب اللقاح','الاخصاب المزدوج'];

const world=G(view),hud=G(view);
const pistG=G(world,{opacity:0});
const k=.42,OX=330,OY=540;               /* ovule placement inside the ovary */
const ovG=G(world,{transform:`translate(${OX} ${OY}) scale(${k})`});
const tubeL=G(world),polL=G(world);
const hudL=G(hud),hudP=G(hud);

/* ---------- helpers ---------- */
const op=(e,a)=>e.setAttribute('opacity',f2(a));
function place(o,x,y,s,a){o.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) scale(${f2(s)})`);o.setAttribute('opacity',f2(a));}
const draw=(l,s)=>l.setAttribute('stroke-dashoffset',f2(1-s));
const glow=(x,y,r,p)=>el('circle',{cx:x,cy:y,r:r||70,fill:'url(#gGlow)',opacity:0},p);
const pulse=(g,s)=>op(g,Math.sin(PI*s));
const line=(d,c,w,p)=>el('path',{d,fill:'none',stroke:c,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1},p);

/* camera poses */
const PIP={wx:330,wy:350,s:1};
function poseL(lx,ly,sx,sy,sl){const s=sl/k;return{wx:OX+lx*k-(sx-330)/s,wy:OY+ly*k-(sy-350)/s,s};}
const PA=poseL(0,40,330,350,.95),PB=poseL(0,10,330,340,1.5),PC=poseL(0,50,330,330,1.45);
const lp=(a,b,t)=>({wx:lerp(a.wx,b.wx,t),wy:lerp(a.wy,b.wy,t),s:a.s*Math.pow(b.s/a.s,t)});
const scr=(p,wx,wy)=>[330+(wx-p.wx)*p.s,350+(wy-p.wy)*p.s];
const SU=(p,ux,uy,inv)=>{const lx=inv?-ux:ux,ly=inv?20-uy:uy;return scr(p,OX+lx*k,OY+ly*k);};

/* name pill: yellow capsule + orange chromosome badge + english caption */
function mol(name,c,p,en){const g=G(p||hudP,{opacity:0});
  const sh=el('rect',{y:-15,height:36,rx:18,fill:NAVY,opacity:.15,filter:'url(#blur)'},g);
  const bx=el('rect',{y:-18,height:36,rx:18,fill:'url(#gGeno)',stroke:'#d9b80f','stroke-width':1.5},g);
  const t=el('text',{class:'mn',y:1},g);t.textContent=name;
  let tw=name.length*7.6;try{const m=t.getComputedTextLength();if(m>0)tw=m;}catch(e){}
  const w=Math.round(tw+(c?52:34));
  sh.setAttribute('x',-w/2+2);sh.setAttribute('width',w);bx.setAttribute('x',-w/2);bx.setAttribute('width',w);
  t.setAttribute('x',c?9:0);
  if(c){el('circle',{cx:-w/2,cy:0,r:17,fill:'url(#gGam)',stroke:'#b84e1e','stroke-width':2},g);
        el('text',{class:'cb',x:-w/2,y:1,'font-size':c.length>1?11.5:14},g).textContent=c;}
  if(en)el('text',{class:'enc',x:0,y:31},g).textContent=en;
  g.w=w;g.bd=!!c;return g;}
/* label = pill + leader line + target dot */
function tag(name,c,en,px,py,t){const lead=line(`M${f1(px)},${f1(py)} L${f1(t[0])},${f1(t[1])}`,NAVY,1.6,hudL);
  const dot=el('circle',{cx:f1(t[0]),cy:f1(t[1]),r:3.5,fill:NAVY,stroke:'#fff','stroke-width':1.5,opacity:0},hudL);
  return{g:mol(name,c,hudP,en),lead,dot,px,py};}
function st(T,a){place(T.g,T.px,T.py,.4+.6*a,a);draw(T.lead,a);op(T.dot,a);}
/* process tag (red) */
function ptag(txt,x,y){const g=G(hudP,{opacity:0});
  const r=el('rect',{y:-15,height:30,rx:15,fill:'#fff5f2',stroke:RED,'stroke-width':2},g);
  const t=el('text',{class:'pt',y:1},g);t.textContent=txt;
  let tw=txt.length*7;try{const m=t.getComputedTextLength();if(m>0)tw=m;}catch(e){}
  const w=tw+28;r.setAttribute('x',-w/2);r.setAttribute('width',w);g.px=x;g.py=y;return g;}
const sp=(g,a)=>place(g,g.px,g.py,.4+.6*a,a);

/* ================= PISTIL (world) ================= */
el('path',{d:'M314,660 L306,700 L354,700 L346,660Z',fill:'#a6cf7c',stroke:'#6f9f4a','stroke-width':2.5},pistG);
el('path',{d:'M312,92 C314,240 304,370 290,434 L370,434 C356,370 346,240 348,92Z',fill:'#cfe6a6',stroke:'#7fa64c','stroke-width':2.5},pistG);
el('path',{d:'M330,98 V428',stroke:'#e6f2d0','stroke-width':7,fill:'none','stroke-linecap':'round'},pistG);
el('ellipse',{cx:330,cy:540,rx:152,ry:128,fill:'#b5d98a',stroke:'#6f9f4a','stroke-width':3},pistG);
el('ellipse',{cx:330,cy:540,rx:134,ry:108,fill:'#f6fbee',stroke:'#8db04e','stroke-width':2},pistG);
for(let i=0;i<9;i++){const x=280+i*12.5,y=78-22*Math.sqrt(Math.max(0,1-((x-330)/62)**2))+3;el('circle',{cx:x,cy:f1(y),r:7,fill:'#e2f0b2',stroke:'#8db04e','stroke-width':2},pistG);}
el('ellipse',{cx:330,cy:80,rx:62,ry:22,fill:'#e2f0b2',stroke:'#8db04e','stroke-width':2.5},pistG);
const brk=line('M598,46 H620 V668 H598',NAVY,2.5,pistG);
const brkT=el('text',{class:'bt',x:640,y:357,transform:'rotate(90 640 357)',opacity:0},pistG);brkT.textContent='المدقة';

/* ================= OVULE (local units, upright: micropyle up) ================= */
const strip=el('path',{d:'M-270,238 Q30,226 320,238 L320,280 Q30,268 -270,280Z',fill:'#b5d98a',stroke:'#6f9f4a','stroke-width':3,opacity:0},ovG);
const fun0=line('',  '#6f9f4a',30,ovG),fun1=line('','#a9d584',23,ovG);
const FU=[150,240,150,200,0,214,0,168],FI=[150,240,228,130,182,-205,0,-152];
function funD(t){const p=FU.map((v,i)=>f1(lerp(v,FI[i],t)));return `M${p[0]},${p[1]} C${p[2]},${p[3]} ${p[4]},${p[5]} ${p[6]},${p[7]}`;}
const body=G(ovG);
const chal=el('ellipse',{cx:0,cy:156,rx:44,ry:22,fill:'#a9d584',stroke:'#6f9f4a','stroke-width':2.5,opacity:0},body);
const integ=(d,c,dc,w)=>[line(d,dc,w+3,body),line(d,c,w,body)];
const oL=integ('M0,163 A108,153 0 0 1 -16,-141.3','#86c06a','#5d9443',15),oR=integ('M0,163 A108,153 0 0 0 16,-141.3','#86c06a','#5d9443',15);
const iL=integ('M0,149 A94,139 0 0 1 -14,-127.4','#b8de9a','#7fae5e',14),iR=integ('M0,149 A94,139 0 0 0 14,-127.4','#b8de9a','#7fae5e',14);
const nuc=el('ellipse',{cx:0,cy:10,rx:86,ry:131,fill:'#fbe7b2',stroke:'#d4ad55','stroke-width':2,opacity:0},body);
const gMic=glow(0,-150,45,body),gMMC=glow(0,-60,50,body),gSac=glow(0,10,95,body),gDiv=glow(0,10,80,body),gPol=glow(0,11,40,body),gZyg=glow(0,-44,42,body),gEnd=glow(0,11,46,body);

/* megaspore mother cell */
const mmc=G(body,{opacity:0});
el('ellipse',{cx:0,cy:0,rx:24,ry:30,fill:'#dccbf2',stroke:'#7b5aa6','stroke-width':2},mmc);
el('circle',{cx:0,cy:0,r:10,fill:'#7b5aa6'},mmc);
/* embryo sac */
const sac=el('ellipse',{cx:0,cy:-24,rx:20,ry:11,fill:'#fff1f4',stroke:'#c4623a','stroke-width':2.2,opacity:0},body);
/* four megaspores */
const sporeG=G(body,{opacity:0});
const spores=[0,1,2,3].map(()=>({r:el('rect',{x:-20,width:40,fill:'#dccbf2',stroke:'#7b5aa6','stroke-width':2},sporeG),n:el('circle',{cx:0,r:6,fill:'#7b5aa6'},sporeG)}));
/* mature embryo-sac cells */
const synL=el('ellipse',{cx:-16,cy:-66,rx:10,ry:15,transform:'rotate(15 -16 -66)',fill:'#fbd5df',stroke:'#d77a98','stroke-width':1.8,opacity:0},body);
const synR=el('ellipse',{cx:16,cy:-66,rx:10,ry:15,transform:'rotate(-15 16 -66)',fill:'#fbd5df',stroke:'#d77a98','stroke-width':1.8,opacity:0},body);
const egg=el('ellipse',{cx:0,cy:-44,rx:14,ry:18,fill:'#f7b3c6',stroke:'#c0267a','stroke-width':1.8,opacity:0},body);
const ants=[[-17,74],[0,90],[17,74]].map(([x,y])=>el('circle',{cx:x,cy:y,r:12,fill:'#bcd9f3',stroke:'#3f7cbf','stroke-width':1.8,opacity:0},body));
/* eight nuclei */
const NC=[...Array(8)].map(()=>el('circle',{r:6,fill:'#7b5aa6',stroke:'#fff','stroke-width':1.2,opacity:0},body));
const K1=[[0,-55],[0,-55],[0,-55],[0,-55],[0,75],[0,75],[0,75],[0,75]];
const K2=[[-12,-60],[-12,-60],[12,-60],[12,-60],[-12,80],[-12,80],[12,80],[12,80]];
const K3=[[-16,-66],[0,-44],[16,-66],[0,-26],[-17,74],[0,90],[17,74],[0,52]];
const K4=K3.map((p,i)=>i===3?[-9,8]:i===7?[9,14]:p);
const NT=['#c8648a','#b0205f','#c8648a','#f0b000','#2f6db0','#2f6db0','#2f6db0','#f0b000'],NR=[5,7,5,8,5,5,5,8];
/* sperms inside the embryo sac (stage 8) */
const spA=el('circle',{r:6.5,fill:SPC,stroke:'#7a0f14','stroke-width':1.5,opacity:0},body),spB=el('circle',{r:6.5,fill:SPC,stroke:'#7a0f14','stroke-width':1.5,opacity:0},body);

/* ================= POLLEN TUBE (world) ================= */
function tube(d){const smp=el('path',{d,fill:'none',stroke:'none'},tubeL);
  return{a:line(d,'#b8860b',6,tubeL),b:line(d,'#f6d77a',3.8,tubeL),smp,L:smp.getTotalLength()};}
const T1=tube('M330,55 L330,425 C330,452 262,452 258,490 L256,590 C255,640 330,650 330,612');
const T2=tube('M330,612 L330,598 Q331,589 332.5,580.3');
function D(d){d=clamp(d,0,T1.L+T2.L);const p=d<=T1.L?T1.smp.getPointAtLength(d):T2.smp.getPointAtLength(d-T1.L);return[p.x,p.y];}

/* pollen grains */
const GX=[300,330,360],GY=[47,44,47];
const grains=GX.map((x,i)=>{const g=G(polL,{opacity:0});
  el('circle',{r:11,fill:'#f4c542',stroke:'#b8860b','stroke-width':2.5,'stroke-dasharray':'2.5 2'},g);
  if(i!==1){el('circle',{cx:-3.5,cy:2,r:2.6,fill:NAVY},g);el('circle',{cx:3.5,cy:-2,r:2.8,fill:SPC},g);}
  return g;});
const tnW=el('circle',{r:2.8,fill:NAVY,opacity:0},polL),gen=el('circle',{r:3.2,fill:SPC,opacity:0},polL),
      s1W=el('circle',{r:2.6,fill:SPC,opacity:0},polL),s2W=el('circle',{r:2.6,fill:SPC,opacity:0},polL);
const setC=(c,p)=>{c.setAttribute('cx',f1(p[0]));c.setAttribute('cy',f1(p[1]));};
const lp2=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];

/* ================= HUD : headings / labels ================= */
const HD=HEADS.map((h,i)=>{const g=G(hudP,{opacity:0});
  const r=el('rect',{y:-16,height:32,rx:16,fill:'#eef5fb',stroke:NAVY,'stroke-width':1.5},g);
  const t=el('text',{class:'hd',y:1},g);t.textContent=h;
  let tw=h.length*8;try{const m=t.getComputedTextLength();if(m>0)tw=m;}catch(e){}
  const w=tw+52;r.setAttribute('x',-w/2);r.setAttribute('width',w);t.setAttribute('x',-9);
  el('circle',{cx:w/2,cy:0,r:15,fill:'url(#gGam)',stroke:'#b84e1e','stroke-width':2},g);
  el('text',{class:'cb',x:w/2,y:1},g).textContent=i+1;
  g.setAttribute('transform','translate(330 24)');return g;});

/* stage 1 – pistil (PI) */
const tStig=tag('الميسم','','Stigma',150,74,[272,82]),tSty=tag('القلم','','Style',150,250,[316,250]),
      tOvy=tag('المبيض','','Ovary',100,540,[182,540]),tCarp=tag('ورقة كربلية','','Carpel',520,420,[444,470]);
/* stage 1 – zoom on ovary wall (A) */
const tNuc=tag('الجويزاء','','Nucellus',548,262,SU(PA,40,0)),tFun=tag('الحبل السري','','Funiculus',548,470,SU(PA,75,206)),
      tWall=tag('جدار المبيض','','Ovary Wall',120,618,SU(PA,-200,256));
/* stage 2 – integuments (A) */
const tOut=tag('الغلاف الخارجي','','Outer Integument',100,296,SU(PA,-108,10)),tIn=tag('الغلاف الداخلي','','Inner Integument',100,410,SU(PA,-85,70)),
      tMic=tag('فتحة النقير','','Micropyle',330,96,SU(PA,0,-140)),tOvl=tag('البويض ( حافظة بوغ كبير )','','Megasporangium',515,140,SU(PA,95,-60));
const pGrow=ptag('تنمو الاغلفة من قاعدة الجويزاء',370,650);
/* stage 3 – MMC & meiosis (B) */
const tMMC=tag('الخلية الام للابواغ الكبيرة','2س','Megaspore Mother Cell',330,72,SU(PB,0,-60)),
      tSpo=tag('اربعة ابواغ كبيرة','س','Megaspores',330,72,SU(PB,22,-60));
const pMei=ptag('انقسام اختزالي',540,236),pRow=ptag('مرتبة في صف واحد',540,288);
/* stage 4 – degeneration & embryo sac (B) */
const pDeg=ptag('تضمحل ثلاثة ابواغ',540,200);

نس"],["مثال عليها الحنطة والشعير والرز والقطن والفاصوليا والبزاليا وأشجار الحمضيات وغيرها","مثال عليها النخيل"],["أقل أهمية من التلقيح الخلطي حيث تكون الثمار والبذور الناتجة أصغر حجماً وأقل عدداً وأبطأ نمواً","أكثر أهمية من التلقيح الذاتي حيث تكون الثمار والبذور الناتجة أكبر حجماً وأكثر عدداً وأسرع نمواً"]]}}},{"type":"وضّح","tags":["2/2013","2/2005","2/2019","2015 تمهيدي","1/2023"],"q":"كيف يتكون أنبوب اللقاح ( ما التغيرات التي تطرأ على حبة اللقاح عند سقوطها على الميسم ولحين حصول الإخصاب ) ؟","a":{"p":"تنمو حبة اللقاح بعد سقوطها على الميسم فتكون أنبوباً ذو قطر ضيق يعرف بأنبوب اللقاح ، وتنتج حبة اللقاح عادة أنبوباً لقاحياً واحداً ، ينمو أنبوب اللقاح ويخترق الميسم والقلم حتى يصل إلى المبيض الذي يحوي البويضات ، ولابد من الإشارة إلى أنه بالرغم من سقوط عدة حبوب لقاح على الميسم مكونة عدة أنابيب لقاح إلا أن واحداً فقط يدخل البويض الواحد ، يستمر أنبوب اللقاح بالنمو وتخضع الخلية المولدة فيه إلى عملية انقسام اعتيادي واحد لتنتج خليتين ذكريتين ، وبذا سيحتوي أنبوب اللقاح على خلية أنبوبية وخليتين ذكريتين ، ويمثل أنبوب اللقاح في هذه الحالة الطور المشيجي الذكري الناضج ، الذي يكون مهيأً لعملية الإخصاب ."}},{"type":"وضّح","tags":["2/2009"],"q":"ما هي التغيرات التي تحصل أثناء نمو ونضج أنبوب اللقاح ؟","a":{"p":"ينمو أنبوب اللقاح ويخترق الميسم والقلم حتى يصل إلى المبيض الذي يحوي البويضات ، ويستمر بالنمو وتخضع الخلية المولدة فيه إلى انقسام اعتيادي واحد لتنتج خليتين ذكريتين ، فيحتوي على خلية أنبوبية وخليتين ذكريتين ويمثل الطور المشيجي الذكري الناضج المهيأ لعملية الإخصاب ."}},{"type":"الموقع والأهمية","tags":["1/2004"],"q":"ما وظيفة ومنشأ أنبوب اللقاح ؟","a":{"dl":[["الوظيفة","يعمل على التلقيح بإيصال الخلايا الذكرية إلى الكيس الجنيني ."],["المنشأ","من أحد ثقوب الإنبات لحبة اللقاح ."]]}},{"type":"ما منشأ","tags":["1/2005","1/2021"],"q":"ما منشأ الخليتين الذكريتين ؟","a":{"p":"الخلية المولدة ."}},{"type":"ما وظيفة","tags":["2/2021 تكميلي"],"q":"ما وظيفة الخلية المولدة ؟","a":{"p":"إنتاج خليتين ذكريتين ."}},{"type":"ماذا يحدث","tags":["2/2022"],"q":"ماذا يحدث عند انقسام الخلية المولدة ؟","a":{"p":"تنتج خليتين ذكريتين ."}},{"type":"عرّف","tags":["أسئلة الفصل"],"q":"عرّف أنبوب اللقاح ؟","a":{"p":"وهو الأنبوب الذي ينمو من حبة اللقاح بعد سقوطها على الميسم فتكون أنبوباً ذو قطر يكون حاوياً على خلايا أنبوبية وخليتين ذكريتين ويكون بهذا مهيأً لعملية الإخصاب ويمثل في هذه الحالة الطور المشيجي الذكري الناضج ."}},{"type":"املأ الفراغ","tags":["1/2010","1/2015","1/2015 أسئلة النازحين","1/2021"],"q":"يحتوي أنبوب اللقاح الناضج على {خلية أنبوبية} و{خليتين ذكريتين} ."},{"type":"املأ الفراغ","tags":["2/2023"],"q":"يحتوي الطور المشيجي الذكري الناضج في النباتات الزهرية على {خلية أنبوبية} و{خليتين ذكريتين} ."}]};</script>
<script>
/* MoeLab — محرك الأسئلة الوزارية
   يُحقن تلقائياً داخل كل محاكاة لها أسئلة (لا تعدّل النسخ المحقونة يدوياً — عدّل هذا الملف ثم شغّل build.py).
   مبدأ الأمان: أي خطأ هنا يُخفي زر الوزاريات فقط ولا يؤثر على المحاكاة. */
(function(){try{
var D=window.MOE_MIN_DATA;if(!D||!D.qs||!D.qs.length)return;
var stage=document.getElementById('stage')||document.body;
var AR=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];});};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var tagK=function(s){return /الفصل|الكتاب|التلفزيون/.test(s)?'book':/خارج|الموصل|المتميزين|النازحين|المحاولات/.test(s)?'out':/تمهيدي|تكميلي/.test(s)?'pre':'min';};
var tagH=function(s){var k=tagK(s);return '<span class="tg '+k+'">'+esc(k==='book'?s:'وزاري '+s)+'</span>';};
var minCount=function(q){var t=(q.tags||[]).slice();(q.items||[]).forEach(function(i){t=t.concat(i.tags||[]);});return t.filter(function(s){return tagK(s)!=='book';}).length;};
var $=function(id){return document.getElementById(id);};

/* ---------- DOM ---------- */
var wrap=document.createElement('div');
wrap.innerHTML='<button id="qbtn" type="button" aria-label="الأسئلة الوزارية">📝 الوزاريات <b id="qcnt"></b></button>'+
 '<div id="hlbar"><span id="hlname"></span><button id="hlback" type="button">↩ رجوع للسؤال</button></div>'+
 '<div id="qp" role="dialog" aria-label="الأسئلة الوزارية">'+
  '<div id="qhd"><div class="t">📝 الأسئلة الوزارية</div><button id="qx" type="button" aria-label="إغلاق">✕</button></div>'+
  '<div id="qchips"></div><div id="qbody"></div>'+
  '<div id="qft"><button id="qprev" type="button">السابق ▶</button><button id="qa" type="button">إظهار الحل 💡</button><button id="qnext" type="button">التالي ◀</button></div>'+
 '</div>';
while(wrap.firstChild)stage.appendChild(wrap.firstChild);
/* place the button just to the right of the sim's zoom buttons (or under them if they are in a row) */
function placeBtn(){try{var b=$('qbtn'),zb=document.querySelector('.zb'),st=stage.getBoundingClientRect();
  if(!zb){b.style.left='10px';b.style.top='10px';return;}
  var r=zb.getBoundingClientRect(),row=getComputedStyle(zb).flexDirection==='row';
  if(!r.width||!r.height){b.style.left='10px';b.style.top='10px';return;}
  var below=function(){b.style.left=Math.round(r.left-st.left)+'px';b.style.top=Math.round(r.bottom-st.top+8)+'px';};
  if(row||placeBtn.down){below();return;}
  b.style.left=Math.round(r.right-st.left+10)+'px';b.style.top=Math.round(r.top-st.top)+'px';
  /* if the sim shows its own caption/banner in that spot, move under the zoom buttons (and stay there) */
  var q=b.getBoundingClientRect(),hit=false;
  [].forEach.call(stage.querySelectorAll('*'),function(e){if(hit||e===b||e.closest('.zb,#qp,#hlbar,#qbtn'))return;
    if(e.parentElement!==stage&&!e.id)return;
    var cs=getComputedStyle(e);if(cs.position==='static'||cs.display==='none'||cs.visibility==='hidden'||!(e.textContent||'').trim())return;
    var x=e.getBoundingClientRect();if(!x.width||x.width>st.width*.9||x.height>120)return;
    if(x.left<q.right&&x.right>q.left&&x.top<q.bottom&&x.bottom>q.top)hit=true;});
  if(hit){placeBtn.down=true;below();}}catch(_){}}
placeBtn();setInterval(placeBtn,700);window.addEventListener('resize',placeBtn);document.addEventListener('fullscreenchange',function(){setTimeout(placeBtn,50);});

var qp=$('qp'),qbody=$('qbody'),qchips=$('qchips'),qa=$('qa'),qprev=$('qprev'),qnext=$('qnext');
var QS=D.qs,SEC=D.sections||{},NAMES=D.names||{};
$('qcnt').textContent=AR(QS.length);
var secKeys=Object.keys(SEC).filter(function(k){return QS.some(function(q){return q.sec===k;});});
if(secKeys.length<2)qchips.style.display='none';
var qsec='all',qi=0,qrev=false,qOpen=false;
var list=function(){return qsec==='all'?QS:QS.filter(function(q){return q.sec===qsec;});};
qchips.innerHTML=[['all','الكل']].concat(secKeys.map(function(k){return [k,SEC[k]];})).map(function(a){return '<button type="button" data-k="'+a[0]+'">'+esc(a[1])+'</button>';}).join('');
qchips.onclick=function(e){var b=e.target.closest('button');if(!b)return;qsec=b.dataset.k;qi=0;qrev=false;render();};

function ansH(a){var h='';if(!a)return h;if(a.p&&!a.tb)h+='<div>'+esc(a.p)+'</div>';
  if(a.ol)h+='<ol>'+a.ol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(a.tb)h+='<div class="tbw"><table><tr>'+a.tb.h.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>'+a.tb.r.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
  if(a.dl)h+='<dl>'+a.dl.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl>';if(a.p&&a.tb)h+='<div class="note">'+esc(a.p)+'</div>';return h;}
var SIM=null;function sim(){return SIM||(SIM=window.MOE_SIM||null);}
function canSee(k){var s=sim();return !!(k&&s&&s.groups&&s.groups[k]);}
function render(){try{render0();}catch(err){qOpen=false;qp.classList.remove('on');$('qbtn').style.display='none';if(window.console)console.warn('MoeLab ministerial:',err);}}
function render0(){
  var L=list(),q=L[qi];
  [].forEach.call(qchips.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===qsec);});
  var n=minCount(q);
  var h='<div class="qc'+(qrev?' rev':'')+'"><div class="qtop"><span class="qty">'+esc(q.type)+'</span>'+
    (n>=3?'<span class="qfire">🔥 تكرر وزارياً '+AR(n)+' مرات</span>':'')+'<span class="qnum">'+AR(qi+1)+' / '+AR(L.length)+'</span></div>';
  if(q.tags&&q.tags.length)h+='<div class="tags">'+q.tags.map(tagH).join('')+'</div>';
  h+='<div class="qq">'+esc(q.q).replace(/\{([^}]*)\}/g,'<span class="blank">$1</span>')+'</div>';
  if(q.opts)h+='<div class="opts">'+q.opts.map(function(o,k){return '<button type="button" class="opt'+(qrev&&k===q.ans?' ok':'')+'" data-k="'+k+'">'+'أبجد'[k]+' ) '+esc(o)+'</button>';}).join('')+'</div>';
  if(q.items)h+='<ol class="items">'+q.items.map(function(it){var t=it.tags||[];return '<li>'+esc(it.t)+(t.length?'<div class="tags">'+t.map(tagH).join('')+'</div>':'')+'<div class="ia">'+esc(it.a||q.common||'')+'</div></li>';}).join('')+'</ol>';
  if(q.a)h+='<div class="ans"><div class="h">✔ الجواب</div>'+ansH(q.a)+'</div>';
  if(canSee(q.hl))h+='<div class="see"><button type="button" id="qsee">📍 شوف '+esc(NAMES[q.hl]||'')+' بالمحاكاة</button></div>';
  qbody.innerHTML=h+'</div>';qbody.scrollTop=0;
  qa.textContent=qrev?'إخفاء الحل':'إظهار الحل 💡';qa.classList.toggle('hide',qrev);
  qprev.disabled=qi===0;qnext.disabled=qi>=L.length-1;
  [].forEach.call(qbody.querySelectorAll('.opt'),function(b){b.onclick=function(){if(+b.dataset.k===q.ans){qrev=true;render();}else b.classList.add('no');};});
  var s=$('qsee');if(s)s.onclick=function(){hlStart(q.hl);};
}
qa.onclick=function(){qrev=!qrev;render();};
qprev.onclick=function(){if(qi>0){qi--;qrev=false;render();}};
qnext.onclick=function(){if(qi<list().length-1){qi++;qrev=false;render();}};
function show(on){qOpen=on;qp.classList.toggle('on',on);if(on)render();}
$('qbtn').onclick=function(){hlStop();show(true);};
$('qx').onclick=function(){show(false);};

/* ---------- highlight inside the simulation (only if the sim registered window.MOE_SIM) ---------- */
var HL=null;
function els(keys,map){var a=[];keys.forEach(function(k){(map[k]||[]).forEach(function(e){a.push(e);});});return a;}
function bbox(arr){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;arr.forEach(function(e){try{var b=e.getBBox();if(!b.width&&!b.height)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}catch(_){}});return x0<x1?{x0:x0,y0:y0,x1:x1,y1:y1}:null;}
var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function hlStart(k){
  var s=sim();if(!canSee(k))return;show(false);
  try{s.finish();}catch(_){}
  var parts=s.groups[k],on=els(parts,s.parts),labs=els(parts,s.labels||{});
  var all=els(Object.keys(s.parts),s.parts),allL=els(Object.keys(s.labels||{}),s.labels||{});
  var v=s.view.get(),vb=s.view.box,b=bbox(on.concat(labs)),to=v;
  if(b){var pad=30,cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,ks=Math.max(1,Math.min(2.6,vb[2]/(b.x1-b.x0+2*pad),vb[3]/(b.y1-b.y0+2*pad)));
    to=[ks,vb[0]+vb[2]/2-cx*ks,vb[1]+vb[3]/2-cy*ks];}
  HL={k:k,s:s,on:new Set(on),labs:new Set(labs),all:all,allL:allL,glows:els(parts,s.glows||{}),t0:performance.now(),from:v,to:to};
  $('hlname').textContent='📍 '+(NAMES[k]||'');
  $('hlbar').classList.add('on');document.body.classList.add('hlmode');
  requestAnimationFrame(tick);
}
function hlStop(){if(!HL)return;var s=HL.s;HL=null;$('hlbar').classList.remove('on');document.body.classList.remove('hlmode');try{s.view.reset();}catch(_){}}
function tick(ms){
  if(!HL)return;
  try{
    var u=(ms-HL.t0)/1000,z=ease(Math.max(0,Math.min(1,u/.8))),L=function(a,b){return a+(b-a)*z;};
    HL.s.view.set(L(HL.from[0],HL.to[0]),L(HL.from[1],HL.to[1]),L(HL.from[2],HL.to[2]));
    var p=.5+.5*Math.sin(u*4.2);
    HL.all.forEach(function(e){if(!HL.on.has(e))e.setAttribute('opacity','0.18');});
    HL.allL.forEach(function(e){e.setAttribute('opacity',HL.labs.has(e)?'1':'0.15');});
    HL.glows.forEach(function(g){g.style.display='';g.setAttribute('opacity',(.35+.45*p).toFixed(2));});
    if(HL.s.pulse)HL.s.pulse(HL.k,p);
  }catch(e){hlStop();return;}
  requestAnimationFrame(tick);
}
$('hlback').onclick=function(){hlStop();show(true);};
/* any simulation button stops the highlight */
['go','prev','zreset'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',hlStop,true);});

/* keyboard: while the panel is open the arrows move between questions, not the simulation */
window.addEventListener('keydown',function(e){
  if(qOpen){e.stopImmediatePropagation();e.preventDefault();
    if(e.key==='ArrowLeft')qnext.click();else if(e.key==='ArrowRight')qprev.click();else if(e.key==='Escape')show(false);}
  else if(HL&&e.key==='Escape'){hlStop();}
},true);
}catch(err){try{var b=document.getElementById('qbtn');if(b)b.style.display='none';var p=document.getElementById('qp');if(p)p.style.display='none';}catch(_){} if(window.console)console.warn('MoeLab ministerial:',err);}})();

</script>
