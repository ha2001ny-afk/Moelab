<title>دائرة تيار متناوب متوالية الربط تحتوي مقاومة صرف ومحث صرف ومتسعة ذات سعة صرف (C-L-R)</title>
<style>
/* Layout: one full-screen navy lab bench; every control is a physical part of the apparatus */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --pos:#ff6b6b; --neg:#5eaaff; --field:#62d98a; --force:#ffab5c; --accent:#7fd3ff;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --L:max(10px,env(safe-area-inset-left,0px)); --T:max(10px,env(safe-area-inset-top,0px));
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body)}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#ink{pointer-events:none}
#ink.on{pointer-events:auto;cursor:crosshair}
.btn{position:absolute;top:var(--T);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;z-index:3}
.btn[hidden]{display:none}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:20px;height:20px}
.fs{left:var(--L)}
.tipbtn{left:calc(var(--L) + 50px);color:#ffd27a}
.tipbtn svg{width:22px;height:22px}
.tipbtn:hover,.tipbtn.on{border-color:#ffd27a;background:rgba(255,210,122,.14)}
.penbtn{left:calc(var(--L) + 100px)}
.penbtn.on{border-color:var(--accent);background:rgba(127,211,255,.18);color:var(--accent)}
.clrbtn{left:calc(var(--L) + 150px);color:#ff9d9d}
.tabs{position:absolute;top:calc(var(--T) + 50px);left:var(--L);display:flex;gap:5px;z-index:3;max-width:calc(100% - 20px)}
.tab{font:600 12px var(--f-body);padding:7px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab.on{background:rgba(127,211,255,.18);border-color:var(--accent);color:var(--ink)}
.pal{position:absolute;top:calc(var(--T) + 92px);left:calc(var(--L) + 100px);width:42px;display:grid;gap:8px;justify-items:center;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.8);z-index:3}
.pal[hidden]{display:none}
.pal button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.pal button.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(8,20,41,.9) inset}
.toast{position:absolute;top:calc(var(--T) + 92px);left:var(--L);max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink);z-index:5}
.tip{position:absolute;top:calc(var(--T) + 92px);left:var(--L);width:min(340px,calc(100% - 20px));max-height:calc(100% - 120px);overflow:auto;background:rgba(8,20,41,.94);border:1px solid rgba(255,210,122,.35);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.75;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:4}
.tip h2{margin:0 0 8px;font-family:var(--f-display);font-size:16px;font-weight:600;color:#ffd27a;padding-left:28px;text-wrap:balance}
.tip p{margin:0 0 8px}
.tip .m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.tip p.m{text-align:center;color:var(--accent);font-weight:600}
.tip .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;direction:ltr;justify-content:flex-end}
.tip .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.tip .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.tip .x:hover{color:var(--ink)}
/* no text selection, callout or tap highlight while handling the simulation */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
.stage{touch-action:none}
.tip{touch-action:pan-y}
</style>

<body style="margin:0">

<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="دائرة تيار متناوب متوالية الربط تحتوي مقاومة صرف ومحث صرف ومتسعة ذات سعة صرف: أشكال قابلة للتحريك هي الدائرة والموجات والمتجهات الطورية لكل جزء والمخطط الكلي"></canvas>
  <canvas id="ink" aria-hidden="true"></canvas>
  <button class="btn fs" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="btn tipbtn" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
  <button class="btn penbtn" id="penBtn" aria-label="وضع القلم" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L16.5 4a2.1 2.1 0 0 1 3 3L8 18.5 4 20z"/><path d="M14.5 6l3 3"/></svg></button>
  <button class="btn clrbtn" id="clrBtn" aria-label="حذف الكتابة" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
  <div class="tabs" id="tabs">
    <button class="tab on" data-m="circuit" aria-pressed="true">الدائرة</button>
    <button class="tab on" data-m="wave" aria-pressed="true">الموجات</button>
    <button class="tab on" data-m="trio" aria-pressed="true">كل حالة وحدها</button>

  </div>
  <div class="pal" id="pal" hidden>
    <button data-c="#ffd27a" style="background:#ffd27a" class="sel" aria-label="أصفر"></button>

    <button data-c="#ffffff" style="background:#ffffff" aria-label="أبيض"></button>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
</div>

<script>
(function(){
const toastEl=document.getElementById('toast');let ttm=0;
window.__toast=s=>{toastEl.textContent=s;toastEl.hidden=false;clearTimeout(ttm);ttm=setTimeout(()=>toastEl.hidden=true,2600);};
})();

(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,narrow=false,col={},time=0,drag=null,hover=null;
const cam={z:1,x:0,y:0};
const MONO='ui-monospace, Menlo, Consolas, monospace',SANS='system-ui, Tahoma, sans-serif';
const TOP=104;                       // space kept for the buttons and the scene tabs
const TAU=Math.PI*2;

function readColors(){const cs=getComputedStyle(document.documentElement);
  ['deep','navy','glow','ink','muted','pos','neg','field','force','accent'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,o={}){ctx.font=o.font||'600 13px '+SANS;ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
function sym(main,sub,x,y,color){ctx.font='italic 700 16px '+MONO;const w=ctx.measureText(main).width;ctx.font='600 10.5px '+MONO;const ws=sub?ctx.measureText(sub).width:0;
  const x0=x-(w+ws)/2;ctx.lineWidth=4;ctx.strokeStyle='rgba(8,20,41,.75)';ctx.lineJoin='round';ctx.textBaseline='middle';ctx.textAlign='left';ctx.direction='ltr';
  ctx.font='italic 700 16px '+MONO;ctx.strokeText(main,x0,y);ctx.fillStyle=color;ctx.fillText(main,x0,y);
  if(sub){ctx.font='600 10.5px '+MONO;ctx.strokeText(sub,x0+w+1,y+6);ctx.fillText(sub,x0+w+1,y+6);}}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function arrow(x,y,dx,dy,color,lw){const len=Math.hypot(dx,dy);if(len<6)return;const a=Math.atan2(dy,dx),hs=Math.min(9,len*0.45);
  ctx.strokeStyle=color;ctx.lineWidth=lw||3.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx-Math.cos(a)*hs,y+dy-Math.sin(a)*hs);ctx.stroke();arrowHead(x+dx-Math.cos(a)*hs*0.7,y+dy-Math.sin(a)*hs*0.7,a,hs,color);}
function pulseRing(x,y,r,color,ph){const pu=0.5+0.5*Math.sin(time*5+(ph||0));ctx.beginPath();ctx.arc(x,y,r+pu*5,0,7);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function lcd(cx,y,w,s){rr(cx-w/2,y,w,24,5);ctx.fillStyle='#08160f';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();
  txt(s,cx,y+13,{font:'600 13px '+MONO,color:'#7ef0a4',dir:'ltr'});}
const isLit=k=>hover===k||(drag&&drag.key===k);
function knob(k,lit){const f=(k.get()-k.min)/(k.max-k.min),a0=Math.PI*0.75,ang=a0+f*Math.PI*1.5;
  for(let i=0;i<=12;i++){const a=a0+i/12*Math.PI*1.5;ctx.strokeStyle=i/12<=f+1e-6?col.accent:'rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(k.x+Math.cos(a)*(k.r+4),k.y+Math.sin(a)*(k.r+4));ctx.lineTo(k.x+Math.cos(a)*(k.r+8),k.y+Math.sin(a)*(k.r+8));ctx.stroke();}
  const kg=ctx.createRadialGradient(k.x-6,k.y-7,2,k.x,k.y,k.r);kg.addColorStop(0,'#5a6884');kg.addColorStop(1,'#1f2738');
  ctx.beginPath();ctx.arc(k.x,k.y,k.r,0,7);ctx.fillStyle=kg;ctx.fill();ctx.strokeStyle=lit?col.accent:'rgba(255,255,255,.3)';ctx.lineWidth=1.6;ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(k.x+Math.cos(ang)*5,k.y+Math.sin(ang)*5);ctx.lineTo(k.x+Math.cos(ang)*(k.r-5),k.y+Math.sin(ang)*(k.r-5));ctx.stroke();}
function toggle(s,on,lit,c){rr(s.x-16,s.y-10,32,20,5);ctx.fillStyle='#151b28';ctx.fill();ctx.strokeStyle=lit?col.accent:'rgba(255,255,255,.25)';ctx.lineWidth=1.4;ctx.stroke();
  ctx.save();ctx.translate(s.x,s.y+2);ctx.rotate(on?-0.55:0.55);rr(-3,-22,6,22,3);ctx.fillStyle='#dfe5ee';ctx.fill();ctx.beginPath();ctx.arc(0,-22,5,0,7);ctx.fillStyle=on?c:'#e9edf3';ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(s.x,s.y+2,4,0,7);ctx.fillStyle='#8792a6';ctx.fill();}
function panel(x,y,w,h,lit,r){r=r||12;
  if(lit){rr(x-6,y-6,w+12,h+12,r+4);ctx.strokeStyle=col.accent;ctx.globalAlpha=.5;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
  ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;
  rr(x,y,w,h,r);const bg=ctx.createLinearGradient(0,y,0,y+h);bg.addColorStop(0,'#3d4a63');bg.addColorStop(1,'#232c3e');ctx.fillStyle=bg;ctx.fill();ctx.restore();
  rr(x,y,w,h,r);ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();}
function glass(x,y,w,h,title){rr(x,y,w,h,12);ctx.fillStyle='rgba(8,20,41,.55)';ctx.fill();ctx.strokeStyle='rgba(234,240,250,.16)';ctx.lineWidth=1;ctx.stroke();
  if(title)txt(title,x+w-12,y+14,{font:'600 11.5px '+SANS,color:col.muted,align:'right'});}
const small={font:'500 11px '+SANS};
/* pointer handlers shared by the scenes */
function knobH(k,key){let s0,v0;return{key,cursor:'ns-resize',down(p,s){s0=s;v0=k.get();},move(p,s){const v=v0+((s.x-s0.x)-(s.y-s0.y))*(k.max-k.min)*0.006;k.set(clamp(Math.round(v/k.step)*k.step,k.min,k.max));}};}
const tapH=(fn,key)=>({key,cursor:'pointer',tap:true,down(){fn();}});
const nearK=(p,k)=>Math.hypot(k.x-p.x,k.y-p.y)<k.r+12;
const nearS=(p,s)=>Math.abs(p.x-s.x)<24&&p.y>s.y-30&&p.y<s.y+18;

function drawBg(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(W*0.55,H*0.42,0,W*0.55,H*0.42,Math.max(W,H)*0.75);
  g.addColorStop(0,col.glow);g.addColorStop(0.55,col.navy);g.addColorStop(1,col.deep);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const h=ctx.createRadialGradient(W*0.5,-H*0.1,0,W*0.5,-H*0.1,H*0.7);
  h.addColorStop(0,'rgba(255,255,255,0.10)');h.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=h;ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*cam.x,DPR*cam.y);
}

/* =====================  SHARED STATE  =====================
   Series R-L-C on an ac source. The current is the same in every part, so it is the reference:
     i = I_m sin(wt),  v_R = V_R sin(wt),  v_L = V_L sin(wt + pi/2),  v_C = V_C sin(wt - pi/2),  v_T = V_m sin(wt + Phi)
   with X_L = 2 pi f L,  X_C = 1/(2 pi f C),  Z = sqrt(R^2 + (X_L - X_C)^2),  I_m = V_m / Z,
   V_T^2 = V_R^2 + (V_L - V_C)^2  and  tan Phi = (V_L - V_C) / V_R.
   The motion on screen is 100 times slower than f so the eye can follow it. */
const S={Vm:10,R:12,L:100,C:150,f:50,th:0,run:true,touched:false};   // L in mH, C in microfarad, f in Hz
const SLOW=100,LEAD=Math.PI/2;
const COL={i:'#5eaaff',R:'#ffab5c',L:'#62d98a',C:'#ff6b6b',T:'#d58bff',x:'#ffd27a'};
const XL=()=>TAU*S.f*S.L/1000,XC=()=>1/(TAU*S.f*S.C*1e-6),XX=()=>XL()-XC();
const Z=()=>Math.hypot(S.R,XX()),Im=()=>S.Vm/Z(),PHI=()=>Math.atan2(XX(),S.R);
const VRm=()=>Im()*S.R,VLm=()=>Im()*XL(),VCm=()=>Im()*XC();
/* drawing scales: a round number just above the largest amplitude, so the figures always fit */
function nice(x){const p=Math.pow(10,Math.floor(Math.log10(Math.max(x,1e-6))));for(const m of [1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=x-1e-9)return m*p;return 10*p;}
const VS=()=>nice(Math.max(S.Vm,VLm(),VCm())),IS=()=>nice(Im());
const inst=()=>{const t=S.th;return{i:Im()*Math.sin(t),R:VRm()*Math.sin(t),L:VLm()*Math.sin(t+LEAD),C:VCm()*Math.sin(t-LEAD),T:S.Vm*Math.sin(t+PHI())};};
const deg=a=>Math.round(a*180/Math.PI);
const sgn=(v,d)=>{const a=Math.abs(v).toFixed(d);return(Number(a)===0?' ':v<0?'−':'+')+a;};
function advance(dt){if(S.run&&!(drag&&drag.scrub))S.th=(S.th+TAU*S.f/SLOW*dt)%(2*TAU);}

/* the control panel: five knobs, run switch, reset, and the derived readings */
function ctrlParts(b){const y=b.y+60,K=(f,o)=>({x:b.x+b.w*f,y,r:15,...o});return{
  kV:K(0.085,{min:4,max:12,step:1,get:()=>S.Vm,set:v=>S.Vm=v}),
  kR:K(0.23,{min:2,max:20,step:1,get:()=>S.R,set:v=>S.R=v}),
  kL:K(0.375,{min:20,max:200,step:10,get:()=>S.L,set:v=>S.L=v}),
  kC:K(0.52,{min:50,max:500,step:25,get:()=>S.C,set:v=>S.C=v}),
  kf:K(0.665,{min:20,max:100,step:5,get:()=>S.f,set:v=>S.f=v}),
  sw:{x:b.x+b.w*0.80,y:b.y+54},
  rs:{x:b.x+b.w*0.925,y:b.y+52}};}
function ctrlDraw(b){const c=ctrlParts(b),ly=b.y+94,lw=b.w*0.235;panel(b.x,b.y,b.w,b.h,false);
  [['kV',S.Vm+'V'],['kR',S.R+'Ω'],['kL',S.L+'mH'],['kC',S.C+'µF'],['kf',S.f+'Hz']].forEach(([k,s])=>{lcd(c[k].x,b.y+8,54,s);knob(c[k],isLit(k));});
  sym('V','m',c.kV.x,ly,COL.T);sym('R','',c.kR.x,ly,COL.R);sym('L','',c.kL.x,ly,COL.L);sym('C','',c.kC.x,ly,COL.C);sym('f','',c.kf.x,ly,col.accent);
  if(!S.run&&!drag)pulseRing(c.sw.x,c.sw.y-6,20,col.accent,0);
  toggle(c.sw,S.run,isLit('sw'),'#7ef0a4');txt('تشغيل',c.sw.x,ly,{...small,color:col.muted});
  rr(c.rs.x-20,c.rs.y-13,40,26,7);ctx.fillStyle='#151b28';ctx.fill();ctx.strokeStyle=isLit('rs')?col.accent:'rgba(255,255,255,.25)';ctx.lineWidth=1.4;ctx.stroke();
  txt('t=0',c.rs.x,c.rs.y+1,{font:'600 12px '+MONO,color:'#ffd27a',dir:'ltr'});txt('تصفير',c.rs.x,ly,{...small,color:col.muted});
  ['XL='+XL().toFixed(1)+'Ω','XC='+XC().toFixed(1)+'Ω','Z='+Z().toFixed(1)+'Ω','Im='+Im().toFixed(2)+'A'].forEach((s,j)=>lcd(b.x+b.w*(0.125+0.25*j),b.y+112,lw,s));}
function ctrlHit(p,b){const c=ctrlParts(b);
  for(const k of ['kV','kR','kL','kC','kf'])if(nearK(p,c[k]))return knobH(c[k],k);
  if(nearS(p,c.sw))return tapH(()=>S.run=!S.run,'sw');
  if(Math.abs(p.x-c.rs.x)<24&&Math.abs(p.y-c.rs.y)<20)return tapH(()=>{S.th=0;S.run=false;},'rs');
  return null;}
/* dragging along the time axis or around the phasor diagram sets wt by hand */
function scrubH(setFrom,key,cursor){let was;return{key,cursor,scrub:true,down(q){was=S.run;S.touched=true;setFrom(q);},move(q){setFrom(q);},up(){S.run=was;}};}

/* the five sine waves on a common time axis, with a marker at the present instant */
function waves(px0,pw,mid,A,periods,th,ly){
  const vs=VS(),is=IS(),span=periods*TAU,xc=px0+pw*th/span,ph=PHI();
  const list=[[A*VRm()/vs,COL.R,0,1.5,.8],[A*VLm()/vs,COL.L,LEAD,1.5,.8],[A*VCm()/vs,COL.C,-LEAD,1.5,.8],[A*Im()/is,COL.i,0,2.4,1],[A*S.Vm/vs,COL.T,ph,2.8,1]];
  ctx.strokeStyle='rgba(234,240,250,.45)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(px0-4,mid);ctx.lineTo(px0+pw+6,mid);ctx.moveTo(px0,mid-A-8);ctx.lineTo(px0,mid+A+8);ctx.stroke();
  // full cycle faint, the part already traced bright
  list.forEach(([a,c,p,lw,al])=>{ctx.strokeStyle=c;
    ctx.globalAlpha=.22*al;ctx.lineWidth=lw*0.8;ctx.beginPath();for(let X=0;X<=pw;X+=2){const Y=mid-a*Math.sin(X/pw*span+p);X?ctx.lineTo(px0+X,Y):ctx.moveTo(px0+X,Y);}ctx.stroke();
    ctx.globalAlpha=al;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(px0,mid-a*Math.sin(p));for(let X=2;X<xc-px0;X+=2)ctx.lineTo(px0+X,mid-a*Math.sin(X/pw*span+p));ctx.lineTo(xc,mid-a*Math.sin(th+p));ctx.stroke();});
  ctx.globalAlpha=1;
  // time marks
  for(let k=0;k<=periods*2;k++){const X=px0+pw*k/(periods*2);ctx.strokeStyle='rgba(234,240,250,.45)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(X,mid-3);ctx.lineTo(X,mid+3);ctx.stroke();
    const lab=k===0?'0':k%2?(k===1?'T/2':k+'T/2'):(k===2?'T':(k/2)+'T');txt(lab,X,ly,{font:'600 11px '+MONO,color:col.muted,dir:'ltr'});}
  // marker of the present instant
  ctx.setLineDash([4,5]);ctx.strokeStyle='rgba(127,211,255,.6)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(xc,mid-A-4);ctx.lineTo(xc,mid+A+4);ctx.stroke();ctx.setLineDash([]);
  list.forEach(([a,c,p,lw])=>{ctx.beginPath();ctx.arc(xc,mid-a*Math.sin(th+p),lw>2?4.6:3.4,0,7);ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();});
  return{xc,aT:A*S.Vm/vs};}

function numsHtml(){const v=inst();
  return `<div class="nums"><span>Vm = ${S.Vm} V</span><span>R = ${S.R} Ω</span><span>L = ${S.L} mH</span><span>C = ${S.C} µF</span><span>f = ${S.f} Hz</span><span>XL = ${XL().toFixed(2)} Ω</span><span>XC = ${XC().toFixed(2)} Ω</span><span>Z = ${Z().toFixed(2)} Ω</span><span>Im = ${Im().toFixed(2)} A</span><span>VR = ${VRm().toFixed(2)} V</span><span>VL = ${VLm().toFixed(2)} V</span><span>VC = ${VCm().toFixed(2)} V</span><span>Φ = ${deg(PHI())}°</span><span>vT = ${sgn(v.T,2)} V</span><span>i = ${sgn(v.i,2)} A</span></div>`;}

/* =====================  THE THREE FIGURES  =====================
   Each figure is its own bench panel: drag it by any free part to move it, drag its bottom-left corner to resize it.
   All of them read the same instant wt, so they always agree. Panels draw in their own local coordinates. */
let arranged=false,focus='circuit',order=['circuit','wave','trio','phasor','ctrl'];
const PN={
  /* --- figure 27: C, L and R in series with an ammeter; a voltmeter across each part and one across the source --- */
  circuit:{show:true,x:0,y:0,w:360,h:206,sc:1,off:0,
    geo(){const w=this.w,h=this.h,m=Math.max(30,w*0.08),lx=m,rx=w-m,ty=58,vy=ty+36,my=vy+50,by=h-26,sp=(rx-lx)/3;
      return{lx,rx,ty,vy,my,by,cx:w/2,sr:14,sp,lg:sp*0.38,ex:[lx+sp/2,lx+sp*1.5,lx+sp*2.5],hw:Math.min(28,sp*0.3),ax:lx+(w/2-lx)*0.42};},
    step(dt){const g=this.geo(),L=2*(g.rx-g.lx)+2*(g.by-g.ty);this.off=(((this.off+inst().i/IS()*150*dt)%L)+L)%L;},
    draw(){const g=this.geo(),{lx,rx,ty,vy,my,by,cx,sr,lg,ex,hw,ax}=g,v=inst(),vs=VS(),is=IS(),ai=Math.abs(v.i)/is;
      glass(0,0,this.w,this.h,'الدائرة');
      ctx.strokeStyle='#c9d3e2';ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();
      // outer loop
      ctx.moveTo(lx,ty);ctx.lineTo(ex[0]-5,ty);ctx.moveTo(ex[0]+5,ty);ctx.lineTo(ex[1]-hw,ty);ctx.moveTo(ex[1]+hw,ty);ctx.lineTo(ex[2]-hw,ty);ctx.moveTo(ex[2]+hw,ty);ctx.lineTo(rx,ty);
      ctx.lineTo(rx,by);ctx.lineTo(cx+sr,by);ctx.moveTo(cx-sr,by);ctx.lineTo(ax+12,by);ctx.moveTo(ax-12,by);ctx.lineTo(lx,by);ctx.lineTo(lx,ty);
      // the voltmeter across the source, and one across each part
      ctx.moveTo(lx,my);ctx.lineTo(cx-12,my);ctx.moveTo(cx+12,my);ctx.lineTo(rx,my);
      ex.forEach(X=>{ctx.moveTo(X-lg,ty);ctx.lineTo(X-lg,vy);ctx.lineTo(X-11,vy);ctx.moveTo(X+11,vy);ctx.lineTo(X+lg,vy);ctx.lineTo(X+lg,ty);});
      ctx.stroke();
      ctx.fillStyle='#c9d3e2';[[lx,my],[rx,my],...ex.flatMap(X=>[[X-lg,ty],[X+lg,ty]])].forEach(([X,Y])=>{ctx.beginPath();ctx.arc(X,Y,2.8,0,7);ctx.fill();});
      // current dots round the outer loop: the same current flows through every part
      const w=rx-lx,h=by-ty,L=2*w+2*h,n=Math.floor(L/22),sp=L/n;ctx.globalAlpha=Math.min(1,0.25+ai*2);ctx.fillStyle='#ffe28a';
      for(let k=0;k<n;k++){const s=(this.off+k*sp)%L;let X,Y;
        if(s<w){X=lx+s;Y=ty;if(ex.some(E=>Math.abs(X-E)<hw+5))continue;}else if(s<w+h){X=rx;Y=ty+s-w;if(Math.abs(Y-my)<5)continue;}else if(s<2*w+h){X=rx-(s-w-h);Y=by;if(Math.abs(X-cx)<sr+4||Math.abs(X-ax)<16)continue;}else{X=lx;Y=by-(s-2*w-h);if(Math.abs(Y-my)<5)continue;}
        ctx.beginPath();ctx.arc(X,Y,2.9,0,7);ctx.fill();}
      ctx.globalAlpha=1;
      // capacitor: field between the plates follows v_C
      const qc=Math.abs(v.C)/vs;if(qc>0.04){ctx.save();ctx.shadowColor=COL.C;ctx.shadowBlur=10*qc;ctx.strokeStyle=COL.C;ctx.globalAlpha=0.25+0.7*qc;ctx.lineWidth=1.3;
        for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(ex[0]-3,ty+k*5);ctx.lineTo(ex[0]+3,ty+k*5);ctx.stroke();}ctx.restore();}
      ctx.strokeStyle='#eef2f8';ctx.lineWidth=3.2;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(ex[0]-5,ty-13);ctx.lineTo(ex[0]-5,ty+13);ctx.moveTo(ex[0]+5,ty-13);ctx.lineTo(ex[0]+5,ty+13);ctx.stroke();ctx.lineCap='round';
      // inductor: glows with its magnetic field (follows i)
      const hl=Math.min(1,ai*ai);ctx.save();if(hl>0.02){ctx.shadowColor=COL.L;ctx.shadowBlur=14*hl;}
      ctx.strokeStyle=`rgb(${Math.round(lerp(201,98,hl))},${Math.round(lerp(211,217,hl))},${Math.round(lerp(226,138,hl))})`;ctx.lineWidth=2.4;ctx.beginPath();
      for(let k=0;k<=110;k++){const u=k/110,a=u*4*TAU,X=ex[1]-hw+2*hw*u+5.5*Math.sin(a),Y=ty-6*(1-Math.cos(a));k?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();ctx.restore();
      // resistor: glows with the power i^2 R
      const hr=Math.min(1,ai*ai);ctx.save();if(hr>0.02){ctx.shadowColor='#ff5a2a';ctx.shadowBlur=14*hr;}
      ctx.strokeStyle=`rgb(${Math.round(lerp(217,255,hr))},${Math.round(lerp(138,110,hr))},${Math.round(lerp(74,60,hr))})`;ctx.lineWidth=2.6;ctx.lineJoin='miter';ctx.beginPath();
      for(let k=0;k<=10;k++){const X=ex[2]-hw+2*hw*k/10,Y=ty+(k===0||k===10?0:(k%2?-7:7));k?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();ctx.restore();ctx.lineJoin='round';
      // names and the voltmeter on each part
      [['متسعة','C',COL.C,v.C],['محث','L',COL.L,v.L],['مقاومة','R',COL.R,v.R]].forEach(([nm,s,c,val],j)=>{const X=ex[j];
        txt(nm,X,ty-38,{...small,color:col.muted});sym(s,'',X,ty-23,c);
        ctx.beginPath();ctx.arc(X,vy,11,0,7);ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.3;ctx.stroke();txt('V',X,vy+1,{font:'700 12px '+MONO,color:'#10264a',dir:'ltr'});
        txt('v'+s+' '+sgn(val,1)+' V',X,vy+21,{font:'600 11px '+MONO,color:c,dir:'ltr'});});
      // voltmeter across the source
      ctx.beginPath();ctx.arc(cx,my,11,0,7);ctx.fillStyle=COL.T;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.3;ctx.stroke();txt('V',cx,my+1,{font:'700 12px '+MONO,color:'#10264a',dir:'ltr'});
      txt('vT '+sgn(v.T,1)+' V',cx+17,my-11,{font:'600 11px '+MONO,color:COL.T,align:'left',dir:'ltr'});
      // ammeter
      ctx.beginPath();ctx.arc(ax,by,12,0,7);ctx.fillStyle=COL.i;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.3;ctx.stroke();txt('A',ax,by+1,{font:'700 12px '+MONO,color:'#10264a',dir:'ltr'});
      txt('i '+sgn(v.i,2)+' A',ax,by-20,{font:'600 11px '+MONO,color:COL.i,dir:'ltr'});txt('أميتر',ax,by+19,{...small,color:col.muted});
      // ac source
      ctx.beginPath();ctx.arc(cx,by,sr,0,7);ctx.fillStyle='#ffd84a';ctx.fill();ctx.strokeStyle='#d24a3a';ctx.lineWidth=1.8;ctx.stroke();
      ctx.beginPath();for(let k=0;k<=16;k++){const X=cx-8+k,Y=by-4.5*Math.sin(k/16*TAU);k?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.strokeStyle='#c0392b';ctx.lineWidth=2;ctx.stroke();
      txt('مصدر للفولطية المتناوبة',cx+sr+6,by+18,{...small,color:col.muted,align:'left'});
      // direction and size of the current
      if(ai>0.02){const len=12+26*ai,d=v.i>0?-1:1;arrow(lx-13,(ty+by)/2-d*len/2,0,d*len,COL.i,2.6);}},
    hit(){return null;}},
  /* --- the waves: i and v_T bold, v_R, v_L and v_C thin --- */
  wave:{show:true,x:0,y:0,w:360,h:150,sc:1,
    geo(){const A=(this.h-30-22)/2-4;return{px0:42,pw:this.w-58,A,mid:30+A+4,ly:this.h-11};},
    draw(){const g=this.geo();glass(0,0,this.w,this.h,'الموجات');
      [['i','',COL.i],['V','R',COL.R],['V','L',COL.L],['V','C',COL.C],['V','T',COL.T]].forEach(([m,s,c],j)=>sym(m,s,16+j*30,14,c));
      txt('V ≤ '+VS()+' V   I ≤ '+IS()+' A',this.w-62,14,{font:'500 10px '+MONO,color:col.muted,align:'right',dir:'ltr'});
      const r=waves(g.px0,g.pw,g.mid,g.A,2,S.th,g.ly);
      if(!S.touched&&!drag)pulseRing(r.xc,g.mid-r.aT*Math.sin(S.th+PHI()),10,col.accent,0);},
    hit(l){const g=this.geo();if(l.x<g.px0-12||l.y<24)return null;return scrubH(q=>{S.th=clamp((q.x-g.px0)/g.pw,0,0.9995)*2*TAU;},'scrub','ew-resize');}},
  /* --- figures 28, 29, 30: each part on its own, its voltage phasor beside the current phasor --- */
  trio:{show:true,x:0,y:0,w:360,h:176,sc:1,
    cells(){const cw=this.w/3,r=Math.min(cw/2-16,(this.h-72)/2);
      // right to left as the book reads: resistor, capacitor, inductor
      return[['R',0,'مقاومة صرف','Φ = 0',VRm(),2],['C',-LEAD,'متسعة صرف','Φ = −π/2',VCm(),1],['L',LEAD,'محث صرف','Φ = +π/2',VLm(),0]].map(([k,off,nm,ph,V,j])=>({k,off,nm,ph,V,r,cx:cw*j+cw/2,cy:30+r+4}));},
    draw(){const th=S.th%TAU,vs=VS(),is=IS();glass(0,0,this.w,this.h,'المتجهات الطورية لكل حالة وحدها');
      this.cells().forEach(({k,off,nm,ph,V,r,cx,cy})=>{const c=COL[k],u=[Math.cos(th),-Math.sin(th)],w=[Math.cos(th+off),-Math.sin(th+off)],lv=r*V/vs,li=r*0.6*Im()/is;
        ctx.beginPath();ctx.arc(cx,cy,r+6,0,7);ctx.fillStyle='rgba(255,236,170,.06)';ctx.fill();ctx.strokeStyle='rgba(234,240,250,.14)';ctx.lineWidth=1;ctx.stroke();
        ctx.strokeStyle='rgba(234,240,250,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-r-4,cy);ctx.lineTo(cx+r+4,cy);ctx.moveTo(cx,cy-r-4);ctx.lineTo(cx,cy+r+4);ctx.stroke();
        const ra=r+11;ctx.strokeStyle='rgba(234,240,250,.5)';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(cx,cy,ra,-0.55,-1.05,true);ctx.stroke();arrowHead(cx+ra*Math.cos(-1.05),cy+ra*Math.sin(-1.05),-1.05-Math.PI/2,5,'rgba(234,240,250,.7)');
        // right-angle mark between the two phasors
        if(off){const q=9;ctx.strokeStyle='#ffd27a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx+q*u[0],cy+q*u[1]);ctx.lineTo(cx+q*(u[0]+w[0]),cy+q*(u[1]+w[1]));ctx.lineTo(cx+q*w[0],cy+q*w[1]);ctx.stroke();}
        if(k==='R'){arrow(cx,cy,lv*w[0],lv*w[1],c,4.2);arrow(cx,cy,li*u[0],li*u[1],COL.i,2.6);}else{arrow(cx,cy,li*u[0],li*u[1],COL.i,3);arrow(cx,cy,lv*w[0],lv*w[1],c,3.4);}
        ctx.beginPath();ctx.arc(cx,cy,2.6,0,7);ctx.fillStyle='#fff';ctx.fill();
        const n=[-u[1],u[0]];
        sym('V',k,cx+(lv+12)*w[0]+(k==='R'?10*n[0]:0),cy+(lv+12)*w[1]+(k==='R'?10*n[1]:0),c);
        sym('I',k,cx+(li+10)*u[0]-(k==='R'?10*n[0]:0),cy+(li+10)*u[1]-(k==='R'?10*n[1]:0),COL.i);
        txt(nm,cx,this.h-30,{font:'600 11.5px '+SANS,color:c});txt(ph,cx,this.h-13,{font:'600 11px '+MONO,color:'#ffd27a',dir:'ltr'});});
      if(!S.touched&&!drag){const C=this.cells()[0];pulseRing(C.cx+C.r*0.6*Im()/IS()*Math.cos(th),C.cy-C.r*0.6*Im()/IS()*Math.sin(th),9,col.accent,0);}},
    hit(l){const C=this.cells().find(c=>Math.hypot(l.x-c.cx,l.y-c.cy)<c.r+12);if(!C)return null;
      return scrubH(q=>{const c=this.cells().find(e=>e.k===C.k);if(Math.hypot(q.x-c.cx,q.y-c.cy)<5)return;let a=Math.atan2(-(q.y-c.cy),q.x-c.cx);if(a<0)a+=TAU;S.th=a;},'scrub','grab');}},
  /* --- figure 31: the phasor diagram of the voltages, with the current as the reference --- */
  phasor:{show:true,x:0,y:0,w:230,h:252,sc:1,
    geo(){const Rr=(this.w-70)/2;return{Rr,cx:this.w/2,cy:34+Rr+12};},
    draw(){const {Rr,cx,cy}=this.geo(),th=S.th%TAU,ph=PHI(),k=Rr/VS(),u=[Math.cos(th),-Math.sin(th)],nn=[Math.cos(th+LEAD),-Math.sin(th+LEAD)];
      const lR=VRm()*k,lL=VLm()*k,lC=VCm()*k,lx_=(VLm()-VCm())*k,li=Rr*0.55*Im()/IS(),Rx=cx+lR*u[0],Ry=cy+lR*u[1],Tx=Rx+lx_*nn[0],Ty=Ry+lx_*nn[1];
      glass(0,0,this.w,this.h,'مخطط المتجهات الطورية');
      ctx.strokeStyle='rgba(234,240,250,.45)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(cx-Rr-8,cy);ctx.lineTo(cx+Rr+10,cy);ctx.moveTo(cx,cy+Rr+8);ctx.lineTo(cx,cy-Rr-10);ctx.stroke();
      arrowHead(cx+Rr+12,cy,0,5,'rgba(234,240,250,.7)');arrowHead(cx,cy-Rr-12,-Math.PI/2,5,'rgba(234,240,250,.7)');
      txt('X',cx+Rr+12,cy+12,{font:'600 11px '+MONO,color:col.muted,dir:'ltr'});txt('Y',cx+10,cy-Rr-12,{font:'600 11px '+MONO,color:col.muted,dir:'ltr'});
      // direction of rotation
      const ra=Rr+14;ctx.strokeStyle='rgba(234,240,250,.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,ra,-0.5,-1.1,true);ctx.stroke();arrowHead(cx+ra*Math.cos(-1.1),cy+ra*Math.sin(-1.1),-1.1-Math.PI/2,6,'rgba(234,240,250,.8)');
      sym('ω','',cx+(ra+10)*Math.cos(-0.8),cy+(ra+10)*Math.sin(-0.8),'rgba(234,240,250,.85)');
      // the triangle V_R, V_L - V_C, V_T
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(Rx,Ry);ctx.lineTo(Tx,Ty);ctx.closePath();ctx.fillStyle='rgba(255,210,122,.13)';ctx.fill();
      ctx.setLineDash([2,4]);ctx.strokeStyle='rgba(234,240,250,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx+lx_*nn[0],cy+lx_*nn[1]);ctx.lineTo(Tx,Ty);ctx.stroke();ctx.setLineDash([]);
      // phase angle Phi between the current (and V_R) and V_T
      if(Math.abs(ph)>0.04){ctx.strokeStyle='#ffd27a';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(cx,cy,26,-th,-(th+ph),ph>0);ctx.stroke();
        const am=th+ph/2;txt('Φ',cx+40*Math.cos(am),cy-40*Math.sin(am),{font:'italic 700 13px '+MONO,color:'#ffd27a',dir:'ltr'});}
      // the phasors
      arrow(cx,cy,lL*nn[0],lL*nn[1],COL.L,3);arrow(cx,cy,-lC*nn[0],-lC*nn[1],COL.C,3);
      arrow(cx+5*nn[0]*-1,cy+5*nn[1]*-1,li*u[0],li*u[1],COL.i,2.6);
      arrow(cx,cy,lR*u[0],lR*u[1],COL.R,3.4);
      if(Math.abs(lx_)>6)arrow(Rx,Ry,lx_*nn[0],lx_*nn[1],COL.x,2.4);
      arrow(cx,cy,Tx-cx,Ty-cy,COL.T,3.8);
      ctx.beginPath();ctx.arc(cx,cy,3,0,7);ctx.fillStyle='#fff';ctx.fill();
      // labels at the tips
      const lab=(m,s,c,x,y,dx,dy)=>sym(m,s,x+dx,y+dy,c);
      lab('V','L',COL.L,cx+lL*nn[0],cy+lL*nn[1],14*nn[0]+12*u[0],14*nn[1]+12*u[1]);
      lab('V','C',COL.C,cx-lC*nn[0],cy-lC*nn[1],-14*nn[0]+12*u[0],-14*nn[1]+12*u[1]);
      lab('V','R',COL.R,Rx,Ry,-14*nn[0]+6*u[0],-14*nn[1]+6*u[1]);
      lab('I','m',COL.i,cx+li*u[0],cy+li*u[1],-14*nn[0]-4*u[0],-14*nn[1]-4*u[1]);
      lab('V','T',COL.T,Tx,Ty,14*u[0]+(lx_>=0?8:-8)*nn[0],14*u[1]+(lx_>=0?8:-8)*nn[1]);
      if(Math.abs(lx_)>18)lab('V','x',COL.x,Rx+lx_*nn[0]/2,Ry+lx_*nn[1]/2,16*u[0],16*u[1]);
      if(!S.touched&&!drag)pulseRing(Tx,Ty,10,col.accent,0);
      lcd(cx,this.h-30,Math.min(196,this.w-20),'Φ = '+deg(ph)+'°  tanΦ = '+Math.tan(ph).toFixed(2));},
    hit(l){const g=this.geo();if(Math.hypot(l.x-g.cx,l.y-g.cy)>g.Rr+16)return null;
      return scrubH(q=>{if(Math.hypot(q.x-g.cx,q.y-g.cy)<6)return;let a=Math.atan2(-(q.y-g.cy),q.x-g.cx);if(a<0)a+=TAU;S.th=a;},'scrub','grab');}},
  /* --- the controls --- */
  ctrl:{show:true,x:0,y:0,w:360,h:144,sc:1,
    draw(){ctrlDraw({x:0,y:0,w:this.w,h:this.h});},
    hit(l){return ctrlHit(l,{x:0,y:0,w:this.w,h:this.h});}}
};
Object.keys(PN).forEach(id=>PN[id].id=id);

/* default arrangement; double-tap the empty bench to come back to it */
function arrange(){const avail=H-TOP-10,c=PN.circuit,wv=PN.wave,tr=PN.trio,ph=PN.phasor,ct=PN.ctrl;
  if(narrow){const colw=Math.min(W-24,480),Rr=Math.min(85,colw*0.24);
    c.w=colw;c.h=206;wv.w=colw;wv.h=150;tr.w=colw;tr.h=Math.round(Math.min(176,colw*0.3+64));ph.w=2*Rr+70;ph.h=2*Rr+90;ct.w=Math.min(colw,460);ct.h=144;
    const k=clamp(avail/(c.h+wv.h+tr.h+ph.h+ct.h+32),0.6,1),x0=(W-colw*k)/2;let y=TOP;
    [c,wv,tr,ph,ct].forEach(p=>{p.sc=k;p.x=x0+(colw-p.w)*k/2;p.y=y;y+=(p.h+8)*k;});
  }else{const cw=Math.min(520,W-430);c.w=cw;c.h=206;wv.w=cw;wv.h=180;tr.w=cw;tr.h=Math.round(Math.min(200,cw*0.3+64));ph.w=300;ph.h=320;ct.w=400;ct.h=144;
    const k=clamp(avail/Math.max(ph.h+8+ct.h,c.h+wv.h+tr.h+16),0.6,1),x0=(W-(cw+16+400)*k)/2;
    c.sc=wv.sc=tr.sc=ph.sc=ct.sc=k;c.x=wv.x=tr.x=x0;c.y=TOP;wv.y=TOP+(c.h+8)*k;tr.y=wv.y+(wv.h+8)*k;ph.x=x0+(cw+66)*k;ph.y=TOP;ct.x=x0+(cw+16)*k;ct.y=TOP+(ph.h+8)*k;}
  order=['circuit','wave','trio','phasor','ctrl'];}
function toFront(id){order=order.filter(o=>o!==id);order.push(id);if(id!=='ctrl')focus=id;}

function moveH(P){let ox,oy;return{pid:P.id,key:'mv'+P.id,cursor:'move',down(p){ox=p.x-P.x;oy=p.y-P.y;arranged=true;},move(p){P.x=p.x-ox;P.y=p.y-oy;}};}
function sizeH(P){let R;return{pid:P.id,key:'sz'+P.id,cursor:'nesw-resize',down(){R=P.x+P.w*P.sc;arranged=true;},move(p){P.sc=clamp(Math.max((R-p.x)/P.w,(p.y-P.y)/P.h),0.5,2.6);P.x=R-P.w*P.sc;}};}
function hitAll(p){for(let i=order.length-1;i>=0;i--){const P=PN[order[i]];if(!P.show)continue;
    const L=q=>({x:(q.x-P.x)/P.sc,y:(q.y-P.y)/P.sc}),l=L(p);if(l.x<0||l.x>P.w||l.y<0||l.y>P.h)continue;
    if(l.x<26&&l.y>P.h-26)return sizeH(P);
    if(l.y<24)return moveH(P);
    const h=P.hit(l);if(!h)return moveH(P);
    return{...h,pid:P.id,down(q,s){h.down&&h.down(L(q),s);},move(q,s){h.move&&h.move(L(q),s);}};}
  return null;}
function stepAll(dt){advance(dt);PN.circuit.step(dt);}
function drawAll(){order.forEach(id=>{const P=PN[id];if(!P.show)return;const lit=isLit('mv'+id)||isLit('sz'+id);
    ctx.save();ctx.translate(P.x,P.y);ctx.scale(P.sc,P.sc);P.draw();
    // drag handle and resize corner
    rr(P.w/2-18,5,36,4,2);ctx.fillStyle=lit?col.accent:'rgba(234,240,250,.35)';ctx.fill();
    ctx.strokeStyle=isLit('sz'+id)?col.accent:'rgba(234,240,250,.45)';ctx.lineWidth=1.6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(5,P.h-14);ctx.lineTo(14,P.h-5);ctx.moveTo(5,P.h-8);ctx.lineTo(8,P.h-5);ctx.stroke();
    if(lit){rr(0,0,P.w,P.h,12);ctx.strokeStyle=col.accent;ctx.globalAlpha=.7;ctx.lineWidth=1.6;ctx.stroke();ctx.globalAlpha=1;}
    ctx.restore();});}
function explainAll(){const ph=PHI(),d=deg(ph),th=S.th%TAU,nums=numsHtml();
  const eq=`<p class="m">(V<sub>T</sub>)² = (V<sub>R</sub>)² + (V<sub>L</sub> − V<sub>C</sub>)²</p><p class="m">tan Φ = (V<sub>L</sub> − V<sub>C</sub>) / V<sub>R</sub></p>`;
  if(focus==='trio')return{t:'المتجهات الطورية لكل حالة وحدها',b:`<p>متجه الطور للتيار <span class="m">I<sub>m</sub></span> هو نفسه في الأجزاء الثلاثة لأن الربط على التوالي. الذي يختلف هو موقع متجه الفولطية منه:</p><p><b>1- خلال مقاومة صرف:</b> <span class="m">V<sub>m</sub></span> و <span class="m">I<sub>m</sub></span> بطور واحد <span class="m">(Φ = 0)</span>.</p><p class="m">V<sub>R</sub> = V<sub>m</sub> sin(ωt) ، I<sub>R</sub> = I<sub>m</sub> sin(ωt)</p><p><b>2- خلال متسعة ذات سعة صرف:</b> متجه فرق الجهد يتخلف عن متجه التيار بـ <span class="m">90° (Φ = −π/2)</span>.</p><p class="m">V<sub>C</sub> = V<sub>m</sub> sin(ωt − π/2) ، I<sub>C</sub> = I<sub>m</sub> sin(ωt)</p><p><b>3- خلال محث صرف:</b> متجه الفولطية يتقدم على متجه التيار بـ <span class="m">90° (Φ = +π/2)</span>.</p><p class="m">V<sub>L</sub> = V<sub>m</sub> sin(ωt + π/2) ، I<sub>L</sub> = I<sub>m</sub> sin(ωt)</p><p>بجمع الثلاثة نحصل على المخطط الكلي للشكل (31).</p>${nums}`};
  if(focus==='phasor'){
    if(!S.run&&th<0.02)return{t:'مخطط المتجهات الطورية للفولطيات',b:`<p>التيار متساوٍ في المقدار في جميع أجزاء دائرة التوالي، لذلك يُرسم متجه الطور للتيار <span class="m">I<sub>m</sub></span> على المحور X كمحور إسناد. وعليه:</p><p>• <span class="m">V<sub>R</sub></span> على المحور X، بطور واحد مع التيار <span class="m">(Φ = 0)</span>.<br>• <span class="m">V<sub>L</sub></span> يتقدم على التيار بـ <span class="m">+π/2</span> فيتجه للأعلى.<br>• <span class="m">V<sub>C</sub></span> يتخلف عن التيار بـ <span class="m">π/2</span> فيتجه للأسفل.</p><p>محصلة <span class="m">V<sub>L</sub></span> و <span class="m">V<sub>C</sub></span> هي <span class="m">V<sub>x</sub> = V<sub>L</sub> − V<sub>C</sub></span>، ومحصلة الثلاثة هي <span class="m">V<sub>T</sub></span>:</p>${eq}${nums}`};
    return{t:'المتجهات تدور معاً',b:`<p>المتجهات الطورية كلها تدور معاً عكس دوران عقارب الساعة بالتردد الزاوي <span class="m">ω</span> نفسه، فيبقى شكل المثلث ثابتاً وتبقى الزاوية <span class="m">Φ</span> بين <span class="m">V<sub>T</sub></span> والتيار ثابتة.</p>${eq}<p>اضغط <span class="m">t=0</span> لتعيد التيار إلى المحور X كما في الشكل (31)، أو اسحب المخطط لتدويره.</p>${nums}`};}
  if(Math.abs(d)<=2)return{t:'VL = VC تقريباً: Φ = 0',b:`<p>الآن <span class="m">X<sub>L</sub> ≈ X<sub>C</sub></span> فيكون <span class="m">V<sub>L</sub> ≈ V<sub>C</sub></span>، ومتجهاهما متعاكسان فيلغي أحدهما الآخر <span class="m">(V<sub>L</sub> − V<sub>C</sub> ≈ 0)</span>.</p><p>فتصبح <span class="m">V<sub>T</sub> = V<sub>R</sub></span> وزاوية فرق الطور <span class="m">Φ = 0</span>: الفولطية الكلية والتيار بطور واحد، والتيار في أكبر مقدار ممكن لهذه المقاومة.</p>${eq}${nums}`};
  if(d>0)return{t:'VL > VC: الفولطية الكلية تتقدم على التيار',b:`<p>رادة الحث أكبر من رادة السعة <span class="m">(X<sub>L</sub> > X<sub>C</sub>)</span>، فيكون <span class="m">V<sub>L</sub> > V<sub>C</sub></span> والفرق <span class="m">V<sub>L</sub> − V<sub>C</sub></span> موجباً.</p><p>متجه الطور للفولطية الكلية <span class="m">V<sub>T</sub></span> يتقدم على متجه الطور للتيار بزاوية <span class="m">Φ = ${d}°</span>.</p>${eq}<p>غيّر <span class="m">L</span> أو <span class="m">C</span> أو <span class="m">f</span> وراقب المثلث في مخطط المتجهات.</p>${nums}`};
  return{t:'VC > VL: الفولطية الكلية تتخلف عن التيار',b:`<p>رادة السعة أكبر من رادة الحث <span class="m">(X<sub>C</sub> > X<sub>L</sub>)</span>، فيكون <span class="m">V<sub>C</sub> > V<sub>L</sub></span> والفرق <span class="m">V<sub>L</sub> − V<sub>C</sub></span> سالباً.</p><p>متجه الطور للفولطية الكلية <span class="m">V<sub>T</sub></span> يتخلف عن متجه الطور للتيار بزاوية <span class="m">Φ = ${d}°</span>.</p>${eq}<p>غيّر <span class="m">L</span> أو <span class="m">C</span> أو <span class="m">f</span> وراقب المثلث في مخطط المتجهات.</p>${nums}`};}

function layout(){
  const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;
  W=nw;H=nh;narrow=W<760||W<H*0.95;
  DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  if(!arranged)arrange();
}

/* ---------- hands-on input ---------- */
const ptrs=new Map();let pinch=null,lastTap=0;
function scr(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
const toWorld=s=>({x:(s.x-cam.x)/cam.z,y:(s.y-cam.y)/cam.z});
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);
  const s=scr(e);ptrs.set(e.pointerId,s);
  if(ptrs.size===2){if(drag&&drag.up)drag.up();drag=null;const[a,b]=[...ptrs.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},z0:cam.z,x0:cam.x,y0:cam.y};return;}
  if(ptrs.size>2)return;
  const p=toWorld(s),h=hitAll(p);
  if(h&&h.pid)toFront(h.pid);
  if(!h){const now=performance.now();if(now-lastTap<320){cam.z=1;cam.x=0;cam.y=0;arranged=false;arrange();}lastTap=now;drag={pan:true,s0:s,x0:cam.x,y0:cam.y};cv.style.cursor='grabbing';return;}
  h.down&&h.down(p,s);if(h.tap)return;drag=h;cv.style.cursor=h.cursor||'move';});
cv.addEventListener('pointermove',e=>{const s=scr(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,s);
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const z=clamp(pinch.z0*d/pinch.d0,0.6,4),wx=(pinch.m0.x-pinch.x0)/pinch.z0,wy=(pinch.m0.y-pinch.y0)/pinch.z0;cam.z=z;cam.x=mid.x-wx*z;cam.y=mid.y-wy*z;return;}
  const p=toWorld(s);
  if(!drag){const h=hitAll(p);hover=h?h.key:null;cv.style.cursor=h?(h.cursor||'move'):'grab';return;}
  if(drag.pan){cam.x=drag.x0+s.x-drag.s0.x;cam.y=drag.y0+s.y-drag.s0.y;}else drag.move&&drag.move(p,s);});
function pointerEnd(e){ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;return;}
  if(!drag)return;drag.up&&drag.up();drag=null;hover=null;cv.style.cursor='grab';}
cv.addEventListener('pointerup',pointerEnd);cv.addEventListener('pointercancel',pointerEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();const s=scr(e),f=Math.exp(-e.deltaY*0.0015),z=clamp(cam.z*f,0.6,4),wx=(s.x-cam.x)/cam.z,wy=(s.y-cam.y)/cam.z;
  cam.z=z;cam.x=s.x-wx*z;cam.y=s.y-wy*z;},{passive:false});

/* ---------- figure chips: show or hide each figure ---------- */
const tabs=[...document.querySelectorAll('#tabs .tab')];
tabs.forEach(t=>t.addEventListener('click',()=>{const P=PN[t.dataset.m];P.show=!P.show;if(P.show)toFront(P.id);if(drag&&drag.up)drag.up();drag=null;hover=null;t.classList.toggle('on',P.show);t.setAttribute('aria-pressed',P.show);}));

window.__explain=()=>explainAll();
setTimeout(()=>window.__toast('اسحب أي شكل لتحريكه، واسحب زاويته السفلى اليسرى لتكبيره'),600);

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.max(0.001,Math.min(0.05,(now-last)/1000));last=now;time+=dt;if(!W)layout();
  if(W){try{stepAll(dt);drawBg();drawAll();}catch(err){ctx.setTransform(1,0,0,1,0,0);ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.setLineDash([]);}}
  requestAnimationFrame(frame);}
readColors();layout();
new ResizeObserver(()=>layout()).observe(cv);
requestAnimationFrame(frame);
})();

/* ---------- fullscreen ---------- */
(function(){const b=document.getElementById('fsBtn'),ico=document.getElementById('fsIco'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const toast=()=>window.__toast('ملء الشاشة غير متاح هنا. افتح الملف أو الرابط بالمتصفح');
  const sync=()=>{ico.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');b.setAttribute('aria-label',isFs()?'الخروج من ملء الشاشة':'ملء الشاشة');};
  b.addEventListener('click',()=>{
    if(isFs()){try{exit.call(document);}catch(e){}return;}
    if(!req||document.fullscreenEnabled===false){toast();return;}
    try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(toast);setTimeout(()=>{if(!isFs())toast();},700);}catch(e){toast();}});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);})();

/* ---------- lamp hint panel ---------- */
(function(){const b=document.getElementById('tipBtn'),p=document.getElementById('tipPanel'),t=document.getElementById('tipTitle'),body=document.getElementById('tipBody');
  let iv=0,last='';
  const fill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===last)return;last=h;t.textContent=r.t;body.innerHTML=r.b;};
  const open=v=>{p.hidden=!v;b.setAttribute('aria-expanded',v);b.classList.toggle('on',v);clearInterval(iv);if(v){last='';fill();iv=setInterval(fill,400);}};
  b.addEventListener('click',()=>open(p.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>open(false));})();

/* ---------- pen mode: write over the simulation, clear the writing ---------- */
(function(){const ink=document.getElementById('ink'),ix=ink.getContext('2d'),pb=document.getElementById('penBtn'),cb=document.getElementById('clrBtn'),pal=document.getElementById('pal');
  let on=false,strokes=[],cur=null,color='#ffd27a',dpr=1;
  function seg(s,from){const p=s.p,i0=Math.max(0,from-1);ix.setTransform(dpr,0,0,dpr,0,0);ix.lineCap='round';ix.lineJoin='round';ix.strokeStyle=s.c;ix.lineWidth=3.2;
    ix.beginPath();ix.moveTo(p[i0].x,p[i0].y);if(p.length===1)ix.lineTo(p[0].x+0.1,p[0].y);for(let i=i0+1;i<p.length;i++)ix.lineTo(p[i].x,p[i].y);ix.stroke();}
  function redraw(){ix.setTransform(1,0,0,1,0,0);ix.clearRect(0,0,ink.width,ink.height);strokes.forEach(s=>seg(s,0));}
  function size(){const w=ink.clientWidth,h=ink.clientHeight;if(!w||!h)return;dpr=window.devicePixelRatio||1;ink.width=Math.round(w*dpr);ink.height=Math.round(h*dpr);redraw();}
  function sync(){ink.classList.toggle('on',on);pb.classList.toggle('on',on);pb.setAttribute('aria-pressed',on);pal.hidden=!on;cb.hidden=!(on||strokes.length);}
  const pos=e=>{const r=ink.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  pb.addEventListener('click',()=>{on=!on;sync();});
  cb.addEventListener('click',()=>{strokes=[];cur=null;redraw();sync();});
  pal.addEventListener('click',e=>{const c=e.target.dataset&&e.target.dataset.c;if(!c)return;color=c;[...pal.children].forEach(x=>x.classList.toggle('sel',x===e.target));});
  ink.addEventListener('pointerdown',e=>{if(!on)return;e.preventDefault();ink.setPointerCapture(e.pointerId);cur={c:color,p:[pos(e)],id:e.pointerId};strokes.push(cur);seg(cur,0);});
  ink.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==cur.id)return;const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e],n=cur.p.length;(ev.length?ev:[e]).forEach(x=>cur.p.push(pos(x)));seg(cur,n);});
  const end=e=>{if(cur&&e.pointerId===cur.id)cur=null;};
  ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);
  new ResizeObserver(size).observe(ink);size();sync();})();

/* ---------- block text selection and the copy/paste callout on touch devices ---------- */
(function(){const stop=e=>e.preventDefault();
  ['selectstart','contextmenu','dragstart'].forEach(ev=>document.addEventListener(ev,stop));
  document.querySelectorAll('canvas').forEach(c=>c.addEventListener('touchstart',stop,{passive:false}));
  document.addEventListener('selectionchange',()=>{const s=window.getSelection&&window.getSelection();if(s&&s.rangeCount&&!s.isCollapsed)s.removeAllRanges();});})();
