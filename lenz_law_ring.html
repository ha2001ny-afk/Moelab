<body>

<canvas id="scene" tabindex="0" aria-label="قانون لنز: اسحب المغناطيس نحو الحلقة أو بعيداً عنها لترى اتجاه التيار المحتث والمجال المحتث"></canvas>

<div class="view-tools" role="group" aria-label="عرض المحاكاة">
  <button type="button" id="zoomIn" aria-label="تكبير" title="تكبير"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  <button type="button" id="zoomOut" aria-label="تصغير" title="تصغير"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button type="button" id="fullscreen" aria-label="ملء الشاشة" title="ملء الشاشة" aria-pressed="false"><svg viewBox="0 0 24 24"><path id="fullscreenIcon" d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
</div>

<script>
'use strict';

const cv = document.querySelector('#scene');
const c = cv.getContext('2d');

/* Physical model (SI) */
const LOOP_R = .1;          // m
const AREA = Math.PI*LOOP_R*LOOP_R;
const MAG_L = .11, MAG_W = .037;
const GAP_MIN = .02, GAP_MAX = .19;
const RES = .1;             // Ω

const S = {
  B:.8,          // pole field strength (T)
  Bt:.8,         // target value (eased)
  gap:.105,      // m, loop to magnet's near face
  s:1,           // +1 : N faces loop
  auto:true,
  t:0,
  v:0,           // m/s, + approaching
  dPhi:0,        // d|Φ|/dt
  phase:0
};

let prevGap = S.gap;
let dragging = false;
const hist = [];
let histAcc = 0;

const camera = {x:0,y:0,z:1};

const colors = {
  ink:'#e5edf0', muted:'#99b2c3', blue:'#90c9ed', red:'#f18b7f',
  green:'#93d6b2', gold:'#e3c18e', violet:'#c4a8f2',
  north:'#d6584d', south:'#dfe7ec'
};

let W=innerWidth, H=innerHeight, DPR=1, portrait=W<850;
let worldW=1250, worldH=690;
let G = {};
let targets = [];
let gesture = null;
const coarse = matchMedia('(pointer:coarse)').matches;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rad=d=>d*Math.PI/180;

/* Layout */

function layout(){
  portrait = W<850;
  if(portrait){
    worldW=430; worldH=1010;
    G={title:[215,26], slider:{x:45,y:90,w:340},
       cx:215, loopY:505, rx:118, ry:30, bounds:[6,118,424,590],
       pills:[[118,622,180],[312,622,180]],
       mathX:215, row0:672, step:31, fs:17,
       meter:[215,905,58], plot:{x:28,y:928,w:374,h:72}};
  } else {
    worldW=1250; worldH=690;
    G={title:[625,30], slider:{x:720,y:115,w:460},
       cx:320, loopY:540, rx:150, ry:38, bounds:[8,62,632,684],
       pills:[[845,180,200],[1055,180,200]],
       mathX:950, row0:236, step:35, fs:21,
       meter:[950,530,78], plot:{x:720,y:572,w:460,h:104}};
  }
  G.k = G.rx/LOOP_R;           // px per metre
  G.sc = G.rx/150;
}

function fit(){
  const left = portrait?72:76, margin = portrait?12:22;
  camera.z = Math.min((W-left-margin)/worldW,(H-margin*2)/worldH);
  camera.x = left+(W-left-margin-worldW*camera.z)/2;
  camera.y = (H-worldH*camera.z)/2;
}

function resize(){
  W=innerWidth; H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);
  cv.width=W*DPR; cv.height=H*DPR;
  layout(); fit();
}
resize();
addEventListener('resize',resize);

/* Physics */

function flux(gap){
  const g=d=>1-d/Math.hypot(d,LOOP_R);
  return S.B*AREA*(g(gap)-g(gap+MAG_L));
}

function update(dt){
  S.B += (S.Bt-S.B)*(1-Math.exp(-dt*16));
  if(Math.abs(S.Bt-S.B)<1e-4) S.B=S.Bt;
  if(S.auto && !dragging){
    S.t+=dt;
    S.gap = .105+.07*Math.cos(S.t*2*Math.PI/4.2);
  }
  const vRaw=(prevGap-S.gap)/dt;
  prevGap=S.gap;
  S.v += (vRaw-S.v)*(1-Math.exp(-dt*11));
  if(Math.abs(S.v)<1e-4) S.v=0;

  const dPdg=(flux(S.gap+1e-4)-flux(S.gap-1e-4))/2e-4;
  S.dPhi = -dPdg*S.v;                // d|Φ|/dt

  const emf=Math.abs(S.dPhi);
  const dir = emf<2e-4 ? 0 : Math.sign(S.s*S.dPhi); // +1 CCW from above
  S.dir=dir;
  S.emf= dir ? emf : 0;
  S.I = S.emf/RES;

  const I_mA=S.I*1000;
  S.phase += -dir*4*(2/Math.PI)*Math.atan(I_mA/150)*dt;

  histAcc+=dt;
  while(histAcc>1/30){
    histAcc-=1/30;
    hist.push({phi:flux(S.gap),emf:dir*S.emf});
    if(hist.length>180) hist.shift();
  }
}

/* Drawing helpers */

function rr(x,y,w,h,r=8){c.beginPath();c.roundRect(x,y,w,h,r)}
function rect(x,y,w,h,color,r=8){rr(x,y,w,h,r);c.fillStyle=color;c.fill()}
function line(points,color,width=1.5){
  c.beginPath();
  points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));
  c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.stroke();
}
function circle(x,y,r,color){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=color;c.fill()}

function text(s,x,y,size=16,color=colors.ink,rtl=false,bold=false){
  const fs=Math.max(size,10.5/camera.z);
  c.font=(bold?'bold ':'')+`${fs}px `+(rtl?'Tahoma,Arial':'Georgia,serif');
  c.direction=rtl?'rtl':'ltr';
  c.textAlign='center';c.textBaseline='middle';c.fillStyle=color;
  c.fillText(s,x,y);
}

function math(s,x,y,size=20,color=colors.ink){
  const fs=Math.max(size,10.5/camera.z);
  const parts=s.split(/(Φ_B)/);
  c.direction='ltr';c.textBaseline='middle';c.font=`${fs}px Georgia,serif`;
  let total=0;
  const widths=parts.map(p=>{
    const w=p==='Φ_B'?c.measureText('Φ').width+fs*.45:c.measureText(p).width;
    total+=w;return w;
  });
  let px=x-total/2;
  c.textAlign='left';c.fillStyle=color;
  parts.forEach((p,i)=>{
    c.font=`${fs}px Georgia,serif`;
    if(p==='Φ_B'){
      c.fillText('Φ',px,y);
      const o=c.measureText('Φ').width;
      c.font=`${fs*.62}px Georgia,serif`;
      c.fillText('B',px+o,y+fs*.28);
    } else c.fillText(p,px,y);
    px+=widths[i];
  });
}

function arrow(x,y,dx,dy,color,width=2,head=8){
  const a=Math.atan2(dy,dx);
  line([[x,y],[x+dx,y+dy]],color,width);
  c.beginPath();
  c.moveTo(x+dx,y+dy);
  c.lineTo(x+dx-head*Math.cos(a-.42),y+dy-head*Math.sin(a-.42));
  c.lineTo(x+dx-head*Math.cos(a+.42),y+dy-head*Math.sin(a+.42));
  c.closePath();c.fillStyle=color;c.fill();
}

function head(x,y,a,color,size){
  c.beginPath();
  c.moveTo(x+Math.cos(a)*size*.6,y+Math.sin(a)*size*.6);
  c.lineTo(x-size*Math.cos(a-.5),y-size*Math.sin(a-.5));
  c.lineTo(x-size*Math.cos(a+.5),y-size*Math.sin(a+.5));
  c.closePath();c.fillStyle=color;c.fill();
}

function vectorLetter(s,x,y,color,size=20,sub=''){
  text(s,x,y,size,color);
  arrow(x-size*.32,y-size*.78,size*.66,0,color,1.15,3.5);
  if(sub) text(sub,x+size*.42+size*.5*sub.length*.5,y+size*.32,size*.55,color);
}

function handle(x,y,color,r=6){
  const radius=Math.max(r,5.5/camera.z);
  circle(x,y,radius+4,'#081b2a99');
  circle(x,y,radius,color);
  circle(x-1.2,y-1.2,radius*.35,'#ffffff66');
}

/* Controls */

function slider(){
  const q={key:'B',...G.slider,min:.1,max:1.5};
  math(`B = ${S.B.toFixed(2)} T`,q.x+q.w/2,q.y-23,portrait?19:20,colors.blue);
  line([[q.x,q.y],[q.x+q.w,q.y]],'#496879',3);
  const hx=q.x+(S.B-q.min)/(q.max-q.min)*q.w;
  line([[q.x,q.y],[hx,q.y]],colors.blue,4);
  for(let j=0;j<=8;j++){const x=q.x+j*q.w/8;line([[x,q.y-3],[x,q.y+3]],'#809aa477',1)}
  const active=gesture?.target?.kind==='slider';
  if(active) circle(hx,q.y,Math.max(20,18/camera.z),'#90c9ed26');
  handle(hx,q.y,colors.blue,coarse?10:8);
  targets.push({kind:'slider',...q});

  for(const [kind,x,sym] of [['bminus',q.x-30,'−'],['bplus',q.x+q.w+30,'+']]){
    const r=Math.max(14,15/camera.z);
    circle(x,q.y,r,'#0b1c2dd0');
    c.beginPath();c.arc(x,q.y,r,0,Math.PI*2);c.strokeStyle='#90c9ed66';c.lineWidth=1;c.stroke();
    text(sym,x,q.y+1,18,colors.blue);
    targets.push({kind,x:x-r-6,y:q.y-r-6,w:2*r+12,h:2*r+12});
  }
}

function pills(){
  const items=[
    {kind:'flip',label:'عكس قطبي المغناطيس',on:false},
    {kind:'auto',label:S.auto?'إيقاف الحركة التلقائية':'حركة تلقائية',on:S.auto}
  ];
  items.forEach((it,i)=>{
    const [x,y,w]=G.pills[i], h=40;
    if(gesture?.target?.kind===it.kind){rr(x-w/2-3,y-h/2-3,w+6,h+6,h/2+3);c.fillStyle='#e3c18e22';c.fill()}
    rr(x-w/2,y-h/2,w,h,h/2);
    c.fillStyle=it.on?'#e3c18e2a':'#0b1c2dd0';c.fill();
    c.strokeStyle=it.on?'#e3c18e99':'#dbe9fa30';c.lineWidth=1;c.stroke();
    text(it.label,x,y+1,portrait?13:14,it.on?colors.gold:colors.ink,true);
    const pad=(coarse?12:6);
    targets.push({kind:it.kind,x:x-w/2-pad,y:y-h/2-pad,w:w+2*pad,h:h+2*pad});
  });
}

/* Field lines of the bar magnet (two-pole model) */

function fieldLines(bottomY,topY){
  const {cx,k,bounds}=G;
  const P1={x:cx,y:bottomY}, P2={x:cx,y:topY};
  const halfW=MAG_W*k/2;
  const F=(x,y)=>{
    const ax=x-P1.x,ay=y-P1.y,r1=ax*ax+ay*ay+1;
    const bx=x-P2.x,by=y-P2.y,r2=bx*bx+by*by+1;
    return [ax/r1-bx/r2, ay/r1-by/r2];
  };
  const n=6+Math.round(S.B/1.5*10);
  const alpha=.28+S.B/1.5*.55;
  const st=3*G.sc, r0=halfW*1.1;

  for(let i=0;i<n;i++){
    const a=rad(-18+216*(i+.5)/n);
    let x=P1.x+Math.cos(a)*r0, y=P1.y+Math.sin(a)*r0*.8;
    const pts=[[x,y]];
    for(let j=0;j<900;j++){
      let [fx,fy]=F(x,y); let m=Math.hypot(fx,fy)||1;
      const mx=x+fx/m*st/2, my=y+fy/m*st/2;
      [fx,fy]=F(mx,my); m=Math.hypot(fx,fy)||1;
      x+=fx/m*st; y+=fy/m*st;
      if(x<bounds[0]||x>bounds[2]||y<bounds[1]||y>bounds[3]){pts.push([x,y]);break}
      if(j>6 && Math.abs(x-cx)<halfW && y>topY-2 && y<bottomY+2) break;
      pts.push([x,y]);
    }
    c.save();
    c.globalAlpha=alpha;
    line(pts,colors.blue,1.3*G.sc+S.B*.4);
    const idx=Math.min(pts.length-2,Math.max(8,Math.round(pts.length*.32)));
    if(pts.length>10){
      const [x0,y0]=pts[idx],[x1,y1]=pts[idx+1];
      let ang=Math.atan2(y1-y0,x1-x0); if(S.s<0) ang+=Math.PI;
      head(x0,y0,ang,colors.blue,8*G.sc);
    }
    c.restore();
  }
}

/* Loop */

function ringPath(a0,a1){
  c.beginPath();
  c.ellipse(G.cx,G.loopY,G.rx,G.ry,0,a0,a1);
}

function copper(){
  const g=c.createLinearGradient(G.cx-G.rx,0,G.cx+G.rx,0);
  g.addColorStop(0,'#71553c');g.addColorStop(.28,'#e4c18b');
  g.addColorStop(.6,'#9c845b');g.addColorStop(1,'#375f64');
  return g;
}

function drawRing(front){
  const sc=G.sc;
  const [a0,a1]=front?[0,Math.PI]:[Math.PI,2*Math.PI];
  if(!front){
    c.beginPath();c.ellipse(G.cx,G.loopY,G.rx,G.ry,0,0,Math.PI*2);
    c.fillStyle='rgba(89,151,128,.13)';c.fill();
  }
  ringPath(a0,a1);c.strokeStyle='#05101c';c.lineWidth=12*sc;c.lineCap='round';c.stroke();
  ringPath(a0,a1);c.strokeStyle=copper();c.lineWidth=8.5*sc;c.stroke();
  ringPath(a0,a1);c.strokeStyle=front?'#fff1d055':'#fff1d022';c.lineWidth=1.6*sc;c.stroke();
  dots(front);
}

function dots(front){
  if(!S.dir) return;
  const n=16;
  for(let i=0;i<n;i++){
    const ph=S.phase+i*2*Math.PI/n;
    const sn=Math.sin(ph);
    if((sn>=0)!==front) continue;
    const x=G.cx+G.rx*Math.cos(ph), y=G.loopY+G.ry*sn;
    circle(x,y,(front?2.8:2.1)*G.sc,front?'#fff4d6':'#fff4d688');
  }
}

function currentArrows(){
  if(!S.dir) return;
  const {cx,loopY,rx,ry,sc}=G;
  for(const ph of [Math.PI/2,3*Math.PI/2]){
    const x=cx+rx*Math.cos(ph), y=loopY+ry*Math.sin(ph);
    const tx=-rx*Math.sin(ph)*-S.dir, ty=ry*Math.cos(ph)*-S.dir;
    const front=ph<Math.PI;
    c.save(); c.globalAlpha=front?1:.6;
    head(x,y,Math.atan2(ty,tx),colors.gold,(front?15:11)*sc);
    c.restore();
  }
  text('I',cx,loopY+ry+22*sc,20*sc,colors.gold);
}

function inducedField(bottomY){
  if(!S.dir) return;
  const {cx,loopY,sc}=G;
  const len=(80+110*(2/Math.PI)*Math.atan(S.I*1000/150))*sc;
  let y0=loopY+S.dir*len/2, y1=loopY-S.dir*len/2;
  if(S.dir>0) y1=Math.max(y1,bottomY+12*sc), y0=y1+len;
  arrow(cx,y0,0,y1-y0,colors.violet,4.5*sc,14*sc);
  const ly=S.dir>0?Math.min(y1+16*sc,loopY-G.ry-14*sc):Math.min(y0+8*sc,loopY-G.ry-14*sc);
  vectorLetter('B',cx-34*sc,ly,colors.violet,19*sc,'ind');
}

function poleBadge(){
  if(!S.dir) return;
  const {cx,loopY,rx,sc}=G;
  const isN=S.dir>0, s=30*sc;
  const x=cx+rx+30*sc, y=loopY-6*sc;
  rect(x-s/2,y-s/2,s,s,isN?colors.north:colors.south,5*sc);
  text(isN?'N':'S',x,y+1,18*sc,isN?'#fff':'#14283a',false,true);
}

/* Magnet */

function drawMagnet(){
  const {cx,k,loopY,sc}=G;
  const w=MAG_W*k, l=MAG_L*k;
  const bottom=loopY-S.gap*k, top=bottom-l;
  const lowN=S.s>0;

  c.save();
  c.shadowColor='#0008';c.shadowBlur=14*sc;c.shadowOffsetY=5*sc;
  rect(cx-w/2,top,w,l,'#000',4*sc);
  c.restore();

  const half=(y,h,isN)=>{
    const g=c.createLinearGradient(cx-w/2,0,cx+w/2,0);
    if(isN){g.addColorStop(0,'#8e2f28');g.addColorStop(.35,'#e8685c');g.addColorStop(1,'#a63a31')}
    else{g.addColorStop(0,'#9aa9b3');g.addColorStop(.35,'#f2f6f8');g.addColorStop(1,'#b5c2ca')}
    c.fillStyle=g;c.fillRect(cx-w/2,y,w,h);
    text(isN?'N':'S',cx,y+h/2,24*sc,isN?'#fff':'#14283a',false,true);
  };
  c.save();rr(cx-w/2,top,w,l,4*sc);c.clip();
  half(top,l/2,!lowN);
  half(top+l/2,l/2,lowN);
  c.restore();
  rr(cx-w/2,top,w,l,4*sc);c.strokeStyle='#ffffff40';c.lineWidth=1;c.stroke();

  handle(cx,top-1,colors.gold,5);
  targets.push({kind:'magnet',x:cx-w/2-14,y:top-16,w:w+28,h:l+24,bottom});

  if(Math.abs(S.v)>.004){
    const vx=cx+w/2+32*sc, vy=top+l/2;
    const len=clamp(S.v/.25,-1,1)*70*sc;
    const L=Math.sign(len)*Math.max(Math.abs(len),18*sc);
    arrow(vx,vy-L/2,0,L,colors.green,3*sc,10*sc);
    vectorLetter('v',vx+20*sc,vy,colors.green,19*sc);
  }
  return {bottom,top};
}

/* Readouts */

function meter(){
  const [x,y,r]=G.meter;
  c.beginPath();c.arc(x,y,r,rad(-158),rad(-22));
  c.strokeStyle='#2b4657';c.lineWidth=6;c.lineCap='round';c.stroke();
  for(let i=-4;i<=4;i++){
    const a=rad(-90+i*16);
    line([[x+Math.cos(a)*(r-10),y+Math.sin(a)*(r-10)],[x+Math.cos(a)*(r-(i?16:20)),y+Math.sin(a)*(r-(i?16:20))]],'#809aa4aa',1);
  }
  text('−',x+Math.cos(rad(-158))*(r+14),y+Math.sin(rad(-158))*(r+14),15,colors.muted);
  text('+',x+Math.cos(rad(-22))*(r+14),y+Math.sin(rad(-22))*(r+14),15,colors.muted);
  text('0',x,y-r-14,12,colors.muted);
  const f=S.dir*(2/Math.PI)*Math.atan(S.I*1000/150);
  const a=rad(-90+f*66);
  line([[x,y],[x+Math.cos(a)*(r-6),y+Math.sin(a)*(r-6)]],colors.gold,2.4);
  circle(x,y,5,colors.gold);
  text('mA',x,y+16,12,colors.muted);
}

function plot(){
  const {x,y,w,h}=G.plot;
  rect(x,y,w,h,'#0b1c2d88',6);
  const mid=y+h/2;
  line([[x+8,mid],[x+w-8,mid]],'#809aa455',1);
  if(hist.length<2) return;
  const pMax=Math.max(1e-6,S.B*AREA*.9);
  const eMax=Math.max(.015,...hist.map(p=>Math.abs(p.emf)));
  const tr=(key,scale,color)=>{
    line(hist.map((p,i)=>[x+8+(w-16)*i/179, mid-clamp(p[key]/scale,-1,1)*(h/2-8)]),color,1.8);
  };
  tr('phi',pMax,colors.gold);
  tr('emf',eMax,colors.violet);
  math('Φ_B',x+w-24,y+14,13,colors.gold);
  math('ε',x+w-50,y+14,13,colors.violet);
  math('t',x+w-10,mid+10,12,colors.muted);
}

function readouts(){
  const X=G.mathX, fs=G.fs;
  let y=G.row0;
  const phi=flux(S.gap);
  const sym=!S.dir?'=':S.dPhi>0?'>':'<';
  math(`v = ${(Math.abs(S.v)<.004?0:S.v).toFixed(2)} m/s`,X,y,fs,colors.green); y+=G.step;
  math(`Φ_B = ${(phi*1000).toFixed(2)} mWb`,X,y,fs,colors.gold); y+=G.step;
  math(`ΔΦ_B / Δt ${sym} 0`,X,y,fs,colors.violet); y+=G.step;
  math(`ε = ${(S.emf*1000).toFixed(1)} mV`,X,y,fs,colors.ink); y+=G.step;
  math(`I = ${(S.I*1000).toFixed(0)} mA`,X,y,fs,colors.gold); y+=G.step;
  text(!S.dir?'لا يوجد تيار محتث':S.dir>0?'التيار عكس دوران عقارب الساعة':'التيار مع دوران عقارب الساعة',
       X,y,portrait?14:16,S.dir?colors.ink:colors.muted,true);
  meter();
  plot();
}

/* Rendering */

function draw(){
  c.setTransform(DPR,0,0,DPR,0,0);
  const bg=c.createRadialGradient(W*.53,H*.4,0,W*.5,H*.5,Math.max(W,H)*.8);
  bg.addColorStop(0,'#25445e');bg.addColorStop(.6,'#10263e');bg.addColorStop(1,'#081429');
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  c.translate(camera.x,camera.y);c.scale(camera.z,camera.z);

  targets=[];
  text('قانون لنز',...G.title,portrait?24:28,colors.ink,true,true);
  slider();
  pills();

  const k=G.k;
  const bottom=G.loopY-S.gap*k, top=bottom-MAG_L*k;

  drawRing(false);
  fieldLines(bottom,top);
  drawMagnet();
  drawRing(true);
  inducedField(bottom);
  currentArrows();
  poleBadge();
  vectorLetter('B',G.cx-G.rx-30*G.sc,G.loopY-62*G.sc,colors.blue,19*G.sc);

  if(!portrait) line([[668,70],[668,670]],'#a7c7d31b',1);
  readouts();
}

/* Hit testing */

function point(x,y){return {x:(x-camera.x)/camera.z,y:(y-camera.y)/camera.z}}

function hit(x,y){
  const p=point(x,y);
  for(const t of [...targets].reverse()){
    if(t.kind==='slider'){
      const tol=(coarse?30:18)/camera.z;
      if(p.x>t.x-tol&&p.x<t.x+t.w+tol&&Math.abs(p.y-t.y)<tol) return t;
    } else if(p.x>=t.x&&p.x<=t.x+t.w&&p.y>=t.y&&p.y<=t.y+t.h) return t;
  }
  return {kind:'pan'};
}

function setGap(g){
  S.gap=clamp(g,GAP_MIN,GAP_MAX);
}

function apply(target,p){
  if(target.kind==='slider'){
    S.Bt=target.min+clamp((p.x-target.x)/target.w,0,1)*(target.max-target.min);
  }
  if(target.kind==='magnet'){
    setGap((G.loopY-(p.y-gesture.offset))/G.k);
  }
}

/* View controls */

function zoomAt(z,x=W/2,y=H/2){
  const p=point(x,y);
  camera.z=clamp(z,.25,5);
  camera.x=x-p.x*camera.z;camera.y=y-p.y*camera.z;
}
document.querySelector('#zoomIn').onclick=()=>zoomAt(camera.z*1.2);
document.querySelector('#zoomOut').onclick=()=>zoomAt(camera.z/1.2);
document.querySelector('#fullscreen').onclick=async()=>{
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch{}
};
document.addEventListener('fullscreenchange',()=>{
  const on=!!document.fullscreenElement;
  const b=document.querySelector('#fullscreen');
  b.setAttribute('aria-pressed',String(on));
  b.setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');
  b.title=on?'الخروج من ملء الشاشة':'ملء الشاشة';
  document.querySelector('#fullscreenIcon').setAttribute('d',on
    ?'M3 8h5V3M21 8h-5V3M8 21v-5H3M16 21v-5h5'
    :'M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5');
});

/* Mouse and touch */

const pointers=new Map();

cv.onpointerdown=e=>{
  cv.setPointerCapture(e.pointerId);
  cv.focus({preventScroll:true});
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pointers.size===1){
    const target=e.altKey?{kind:'pan'}:hit(e.clientX,e.clientY);
    const p=point(e.clientX,e.clientY);

    if(target.kind==='flip'||target.kind==='auto'){
      gesture={target,tap:true,x:e.clientX,y:e.clientY};
      return;
    }
    if(target.kind==='bminus'||target.kind==='bplus'){
      const step=target.kind==='bplus'?.05:-.05;
      S.Bt=clamp(Math.round((S.Bt+step)*20)/20,.1,1.5);
      gesture=null;return;
    }

    gesture={target,x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y,
             offset:target.kind==='magnet'?p.y-target.bottom:0};
    if(target.kind==='magnet'){S.auto=false;dragging=true}
    if(target.kind==='slider') apply(target,p);
  } else {
    dragging=false;
    const [a,b]=[...pointers.values()];
    gesture={target:{kind:'pinch'},d:Math.hypot(a.x-b.x,a.y-b.y),z:camera.z,
             world:point((a.x+b.x)/2,(a.y+b.y)/2)};
  }
};

cv.onpointermove=e=>{
  if(!pointers.has(e.pointerId)){
    const t=hit(e.clientX,e.clientY);
    cv.style.cursor=t.kind==='pan'?'grab':t.kind==='slider'?'ew-resize':(t.kind==='bminus'||t.kind==='bplus')?'pointer':t.kind==='magnet'?'ns-resize':'pointer';
    return;
  }
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&gesture?.target.kind==='pinch'){
    const [a,b]=[...pointers.values()];
    const z=clamp(gesture.z*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,gesture.d),.25,5);
    camera.z=z;
    camera.x=(a.x+b.x)/2-gesture.world.x*z;
    camera.y=(a.y+b.y)/2-gesture.world.y*z;
  } else if(gesture?.tap){
    return;
  } else if(gesture){
    if(gesture.target.kind==='pan'){
      camera.x=gesture.cx+e.clientX-gesture.x;
      camera.y=gesture.cy+e.clientY-gesture.y;
    } else apply(gesture.target,point(e.clientX,e.clientY));
  }
};

function setAuto(on){
  if(on && !S.auto){
    const u=clamp((S.gap-.105)/.07,-1,1);
    S.t=Math.acos(u)*4.2/(2*Math.PI);
  }
  S.auto=on;
}

function release(e){
  if(gesture?.tap && pointers.size===1 && e.type==='pointerup'){
    if(gesture.target.kind==='flip') S.s*=-1;
    if(gesture.target.kind==='auto') setAuto(!S.auto);
  }
  pointers.delete(e.pointerId);
  dragging=false;
  if(pointers.size===1){
    const p=[...pointers.values()][0];
    gesture={target:{kind:'pan'},x:p.x,y:p.y,cx:camera.x,cy:camera.y};
  } else gesture=null;
}
cv.onpointerup=release;
cv.onpointercancel=release;

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(camera.z*Math.exp(-e.deltaY*.001),e.clientX,e.clientY);
},{passive:false});

cv.ondblclick=e=>{
  const k=hit(e.clientX,e.clientY).kind;
  if(k==='pan') fit();
};

cv.onkeydown=e=>{
  const keys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home',' '];
  if(keys.includes(e.key)) e.preventDefault();
  if(e.key==='ArrowUp'){S.auto=false;setGap(S.gap+.004)}
  if(e.key==='ArrowDown'){S.auto=false;setGap(S.gap-.004)}
  if(e.key==='ArrowLeft') S.Bt=clamp(Math.round((S.Bt-.05)*20)/20,.1,1.5);
  if(e.key==='ArrowRight') S.Bt=clamp(Math.round((S.Bt+.05)*20)/20,.1,1.5);
  if(e.key===' ') setAuto(!S.auto);
  if(e.key==='f'||e.key==='F') S.s*=-1;
  if(e.key==='Home') fit();
};

/* Loop */

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=clamp((now-last)/1000,1/240,.05);
  last=now;
  update(dt);
  draw();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
