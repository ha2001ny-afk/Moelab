<style>

:root{color-scheme:light;--ink:#1c2733;--mut:#5b6976;--line:#e1e6eb;--acc:#1d5fa8;--acc2:#eaf1fa;--ok:#1d8a4b;--warn:#b8442a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font:15px/1.5 "Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro",Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
header{border-bottom:1px solid var(--line);padding:8px 12px 6px;display:flex;flex-direction:column;gap:6px;background:#fff;z-index:5}
.r1{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:space-between}
h1{margin:0;font-size:19px;line-height:1.25;font-weight:700}
h1 small{display:block;font-size:12.5px;font-weight:400;color:var(--mut)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-size:13.5px;border:1px solid #cfd8e1;background:#fff;color:var(--ink);border-radius:9px;padding:6px 11px;min-height:36px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:#9fb3c8}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed=true]{background:var(--acc2);border-color:#8fb0d8;color:#123e70;font-weight:600}
.seg{display:inline-flex;border:1px solid #cfd8e1;border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:34px}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
nav button{flex:none;border-radius:20px;padding:5px 14px}
nav button.main{border-color:#e0b25a}
nav button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
#bgBox{position:relative}
#bgPop{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,40,60,.15);padding:10px;display:none;grid-template-columns:repeat(4,auto);gap:8px;z-index:20;width:max-content}
#bgPop.on{display:grid}
#bgPop button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;min-height:0;font-size:12px;border-radius:10px;width:78px}
#bgPop button i{width:46px;height:30px;border-radius:7px;border:1px solid #c5ced7;display:block}
#bgPop button[aria-pressed=true]{outline:2px solid var(--acc);background:var(--acc2)}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:#fff;cursor:grab}
#stage.grabbing{cursor:grabbing}
#stage svg text{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
#stage.dk svg text{fill:#e9eff5;stroke:rgba(0,0,0,.6)}
#stage.dk svg text.blue{fill:#93c6ff}#stage.dk svg text.mut{fill:#b7c4d0}
#stage.dk svg text.keep{fill:#1c2733;stroke:#fffdf6}#stage.dk svg text.keep2{fill:#4a5662;stroke:#fffdf6}
#stage.dk svg text.lcd{fill:#7dffa8;stroke:none}#stage svg text.lcd{stroke:none}
#stage.dk rect.card{stroke:#6b7a88;stroke-width:1.5}
#stage>svg,#stage>canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.panel{position:absolute;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(20,40,60,.1);max-height:calc(100% - 24px);display:flex;flex-direction:column;z-index:3;pointer-events:auto}
.panel h3{margin:0;font-size:14px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);cursor:pointer}
.panel h3 b{font-weight:400;color:var(--mut);font-size:18px;line-height:1}
.panel .bd{overflow:auto;padding:8px 12px 10px}
.panel.col .bd{display:none}.panel.col h3{border-bottom:0}
#rcol{position:absolute;top:10px;right:10px;width:330px;max-height:calc(100% - 24px);display:flex;flex-direction:column;gap:8px;z-index:3;pointer-events:none}#rcol.half{max-height:46%}

#info ul{margin:0;padding-inline-start:18px;font-size:12.8px;color:#33414e}
#info li{margin:2px 0}
.acids{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.acids button{min-height:30px;padding:3px 9px;font-size:12.5px;direction:ltr}
#eqP{top:10px;left:10px;width:320px}
.eq{border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin-bottom:7px;background:#fff}
.eq .f{font-size:16px;font-family:"Cambria Math","Times New Roman",serif;direction:ltr;text-align:left;line-height:1.6}
.eq .f span{opacity:0;animation:tk .5s forwards;display:inline-block;margin:0 2px}
@keyframes tk{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eq .f i{font-style:normal;font-size:11px;color:#6b7783}
.eq .f .dn{color:#b8442a;font-weight:700}.eq .f .up{color:#1d6fb8;font-weight:700}.eq .f .ar{color:#1d5fa8}
.eq .o{font-size:12.5px;color:#34424f;margin-top:2px}
.empty{font-size:12.5px;color:var(--mut)}

#nb table{width:100%;border-collapse:collapse;font-size:12.8px}
#nb td{padding:4px 2px;border-bottom:1px solid #eef1f4;vertical-align:top}
#nb td.v{text-align:left;direction:ltr;font-family:"Cambria Math","Times New Roman",serif;font-size:14px;white-space:nowrap}
#nb .calc{margin-top:8px;padding:8px;border-radius:9px;background:#f5f8fb;font-size:13px}
#nb .calc div{direction:ltr;text-align:left;font-family:"Cambria Math","Times New Roman",serif;font-size:14.5px;margin:2px 0}
#nb .calc p{margin:4px 0 0;font-size:12.5px}
#nb .res{font-weight:700;color:#123e70}
#nb .warn{color:var(--warn);font-size:12.5px;margin:4px 0}
#nb .btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
#nb .btns button{min-height:32px;font-size:12.5px;padding:4px 9px}
.steps{margin:0;padding:0;list-style:none;font-size:12.8px}
.steps li{padding:3px 6px;border-radius:7px;margin:1px 0;display:flex;gap:6px}
.steps li::before{content:"○";color:#9aa6b2}
.steps li.done{color:#1d6b40}.steps li.done::before{content:"✓";color:var(--ok);font-weight:700}
.steps li.cur{background:#fff6df;font-weight:600}.steps li.cur::before{content:"◉";color:#c98a00}
#curve{flex:none!important}
#curve canvas{width:100%;height:170px;display:block}
#zoom{position:absolute;bottom:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zoom button{width:40px;padding:0;font-size:18px;background:rgba(255,255,255,.95)}
#toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#1f2d3a;color:#fff;padding:8px 14px;border-radius:10px;font-size:13.5px;max-width:min(560px,90%);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6}
#toast.on{opacity:.96}
@media(max-width:900px){#rcol{width:290px}#eqP{width:260px}h1{font-size:16px}}
@media(max-width:600px){h1 small{display:none}#rcol,#eqP{width:min(260px,62vw)}}
</style>
</head>

 ctx.fillStyle='#16221b';rr(ctx,O.x0+18,O.y0+10,120,28,4);ctx.fill();ctx.fillStyle='#7dffa8';ctx.font='700 15px Consolas,monospace';ctx.textAlign='left';ctx.direction='ltr';ctx.fillText(O.T+' °C',O.x0+26,O.y0+30);
 const it=O.item;ctx.fillStyle='#1c2733';ctx.font='12px '+FONT;ctx.textAlign='right';ctx.direction='rtl';ctx.fillText(it?'زمن التسخين: '+ar(Math.round(it.heat))+' دقيقة':'ضع البوتقة هنا',O.x1-14,O.y0+30);ctx.restore()}
function drawOvenDoor(){const O=S.oven;if(!O)return;const w=(O.x1-O.x0-36)*(1-O.door);if(w<2)return;ctx.fillStyle='rgba(60,70,80,.35)';ctx.strokeStyle='#8b96a0';ctx.lineWidth=2;ctx.fillRect(O.x0+18,O.y0+46,w,O.y1-O.y0-60);ctx.strokeRect(O.x0+18,O.y0+46,w,O.y1-O.y0-60)}
function drawDesic(){const D=S.desic;if(!D)return;ctx.save();ctx.fillStyle='rgba(215,232,244,.45)';ctx.strokeStyle='#86a0b2';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(D.x-52,BENCH);ctx.lineTo(D.x-56,690);ctx.quadraticCurveTo(D.x-58,640,D.x,630);ctx.quadraticCurveTo(D.x+58,640,D.x+56,690);ctx.lineTo(D.x+52,BENCH);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#4f7fb8';ctx.globalAlpha=.6;ctx.fillRect(D.x-48,BENCH-18,96,16);ctx.globalAlpha=1;ctx.strokeStyle='#9aa5af';ctx.beginPath();ctx.moveTo(D.x-50,718);ctx.lineTo(D.x+50,718);ctx.stroke();ctx.restore()}
function drawFunnel(){const F=S.F;if(!F)return;const p=F.paper;if(p){ctx.beginPath();pathOf(ctx,[[FX-56,FY+3],[FX,FY+77],[FX+56,FY+3]]);ctx.fillStyle='#fbfbf6';ctx.fill();ctx.strokeStyle='#d6d6c9';ctx.lineWidth=1;ctx.stroke();ctx.beginPath();ctx.moveTo(FX-22,FY+3);ctx.lineTo(FX,FY+77);ctx.stroke();
 if(p.ppt>0){const h=Math.min(66,Math.sqrt(p.ppt*1.8*73/55));const w=h*55/73;ctx.beginPath();pathOf(ctx,[[FX-w,FY+76-h],[FX,FY+76],[FX+w,FY+76-h]]);ctx.fillStyle=S.M.ppt.c;ctx.fill();ctx.strokeStyle=S.M.ppt.e;ctx.lineWidth=.8;ctx.stroke()}}
 if(F.mL>0){const h=Math.min(72,Math.sqrt(F.mL*110*73/55));const w=h*55/73;ctx.beginPath();pathOf(ctx,[[FX-w,FY+76-h],[FX,FY+76],[FX+w,FY+76-h]]);ctx.fillStyle=F.col;ctx.fill();ctx.fillRect(FX-2.5,FY+78,5,94)}
 if(T.lab&&p&&p.ppt>0&&F.mL<.3){ctx.font='12px '+FONT;ctx.fillStyle=TH.mut;ctx.textAlign='center';ctx.fillText('اسحب ورقة الترشيح بعد الغسل',FX,FY-58)}}
function drawBur(){const b=S.bur;if(!b)return;const y=130+b.R*9;ctx.fillStyle=b.col;ctx.fillRect(b.x-6.5,y,13,600-y);ctx.fillRect(b.x-1.5,606,3,52);ctx.strokeStyle='rgba(90,130,170,.8)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(b.x-6.5,y+1);ctx.quadraticCurveTo(b.x,y+4,b.x+6.5,y+1);ctx.stroke();
 if(T.lab){ctx.font='700 12px '+FONT;ctx.fillStyle=TH.blue;ctx.textAlign='left';ctx.direction='ltr';ctx.fillText('← '+f2(Math.round(b.R*20)/20)+' mL',b.x+14,y+4);ctx.direction='rtl';ctx.font='11px '+FONT;ctx.fillStyle=TH.mut;ctx.textAlign='right';ctx.fillText(b.open<.06?'الصنبور مغلق':b.open<.45?'تنقيط':'تدفق',b.x-28,640)}
 if(S.stream2){const fl=S.flask;ctx.strokeStyle=b.col;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(b.x,660);ctx.lineTo(b.x,Math.abs(fl.x-b.x)<14?fl.L:BENCH);ctx.stroke()}}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.tx,dpr*view.ty);
 drawOven();drawDesic();drawFunnel();drawBur();
 for(const v of S.vessels)drawVessel(v);
 for(const o of S.objs)if(o.draw)o.draw();
 drawOvenDoor();
 if(S.spat&&S.spat.load){ctx.fillStyle='#f7f7f2';ctx.strokeStyle='#b0b7bd';ctx.lineWidth=.8;ctx.beginPath();ctx.ellipse(S.spat.x,S.spat.y-3,7,4,0,Math.PI,0);ctx.fill();ctx.stroke()}
 if(S.stream){const v=S.stream.v,t=v.pour&&v.pour.t;if(t){const lip=toW(v,-v.pour.side*v.hw,0);const ex=t===S.F?FX+v.pour.side*5:t.x+v.pour.side*(t.mouth-22),ey=t===S.F?FY+40:t.L;ctx.strokeStyle=S.stream.col;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lip[0],lip[1]);ctx.quadraticCurveTo(lip[0]-v.pour.side*4,lip[1]+12,ex,ey);ctx.stroke()}}
 if(S.squirt){const s=S.squirt;ctx.strokeStyle='rgba(170,205,230,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo(s.x-14,s.y+10,s.x-18,s.y+70);ctx.stroke()}
 for(const d of S.drops){ctx.fillStyle=d.col;ctx.beginPath();ctx.ellipse(d.x,d.y,2.4,3.2,0,0,7);ctx.fill()}
 for(const s of S.splash){ctx.strokeStyle=`rgba(150,190,220,${s.t*1.6})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(s.x,s.y-1,10*(1-s.t)+3,2.5,0,0,7);ctx.stroke()}
 if(S.bal){const B=S.bal;const r=panGross()-B.tare+(B.noise>0?rnd(-1,1)*.0004*B.noise:0);B.txt.textContent=(Math.abs(r)<5e-5?0:r).toFixed(4)}
 mx.setTransform(1,0,0,1,0,0);mx.clearRect(0,0,mc.width,mc.height);if(T.micro&&S.lens){mx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.tx,dpr*view.ty);drawLens()}}

/* ======================================================================
   update loop
   ====================================================================== */
function update(dt){
 for(const v of S.vessels){if(v.isDrag)pourStep(v,dt);updVessel(v,dt)}
 for(const o of S.objs){if(o.upd)o.upd(dt);if(o.type!=='vessel'&&o.el&&!o.upd)o.el.setAttribute('transform',`translate(${o.x} ${o.y})`)}
 if(S.F)drainF(dt);if(S.oven)ovenStep(dt);if(S.bal)S.bal.noise=Math.max(0,S.bal.noise-dt*.8);
 if(S.stream){S.stream.t-=dt;if(S.stream.t<=0)S.stream=null}if(S.squirt){S.squirt.t-=dt;if(S.squirt.t<=0)S.squirt=null}
 for(let i=S.drops.length-1;i>=0;i--){const d=S.drops[i];d.vy+=1500*dt;d.y+=d.vy*dt;
  if(!d.tgSet&&!d.vis){d.tgSet=1;d.tg=d.tit?(Math.abs(S.flask.x-d.x)<14&&S.flask.y<d.y+10?S.flask:null):targetBelow(d.x,d.y)}
  const ty=d.tg?(d.tg===S.F?FY+60:d.tg.L):BENCH-1;if(d.y>=ty){S.drops.splice(i,1);if(d.vis)continue;if(d.tg&&d.fn){d.fn(d.tg,d.x,d.amt)}else if(!d.tg){S.splash.push({x:d.x,y:BENCH,t:.5});if(d.fn===landBase)S.lost=(S.lost||0)+d.amt}}}
 for(let i=S.splash.length-1;i>=0;i--){S.splash[i].t-=dt;if(S.splash[i].t<=0)S.splash.splice(i,1)}
 if(isT())titStep(dt);
 microStep(dt);
 S.nbT=(S.nbT||0)-dt;if(S.nbT<=0){S.nbT=.6;if(!isT())renderNB();for(const v of S.vessels)tagV(v)}
 if(S.cdirty){S.cdT=(S.cdT||0)-dt;if(S.cdT<=0){S.cdT=.2;S.cdirty=0;renderCurve()}}}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;now=t;try{update(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}

{let i=0;try{i=+localStorage.getItem('qa-lab-bg')||0}catch(e){}setTheme(clamp(i,0,THEMES.length-1))}
