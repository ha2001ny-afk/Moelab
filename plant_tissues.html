<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>أنواع الأنسجة المستديمة في النبات</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(13px,3.4vw,22px);font-weight:bold;text-align:center;line-height:1.3}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  .zb{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .pill{fill:#dcefdf;stroke:#2e9b52;stroke-width:2.5}
  .lbl{fill:#123d26;font-size:21px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<div id="top"><div id="title">أنواع الأنسجة المستديمة في النبات</div></div>
<div id="stage">
  <div class="zb"><button id="zin">+</button><button id="zout">−</button><button id="zreset">⟲</button><button id="pause">⏸</button><button id="fs">⛶</button></div>
  <svg id="svg" viewBox="0 0 900 650" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="gPar" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#f4ffc8"/><stop offset="0.55" stop-color="#cdf27e"/><stop offset="1" stop-color="#9edb46"/></radialGradient>
      <linearGradient id="gLong" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fdc40"/><stop offset="0.5" stop-color="#e3faa6"/><stop offset="1" stop-color="#9fdc40"/></linearGradient>
      <radialGradient id="gScl" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="#7fd067"/><stop offset="0.6" stop-color="#43a85a"/><stop offset="1" stop-color="#2a8a4a"/></radialGradient>
      <linearGradient id="gFib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6cc23d"/><stop offset="0.5" stop-color="#b6ec5c"/><stop offset="1" stop-color="#6cc23d"/></linearGradient>
      <linearGradient id="gGlint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <clipPath id="cpB"><path id="bundleClip" d="M1125,540 Q1170,522 1212,545 Q1255,522 1300,540 Q1348,640 1356,760 Q1348,880 1300,990 Q1255,1004 1212,985 Q1170,1004 1125,990 Q1074,880 1074,760 Q1080,640 1125,540Z"/></clipPath>
    </defs>
    <g id="view"></g>
  </svg>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
let rs=11;const rnd=()=>{rs=(rs*9301+49297)%233280;return rs/233280;};
const f1=v=>v.toFixed(1);

/* drawing layer: image coordinates scaled into the view */
const D=G(view,{transform:'translate(0 -40) scale(.6)'});

/* ======================= 1) PARENCHYMA – cross section ======================= */
const PAR=[[165,245,82,52,-8],[300,200,52,42,0],[400,232,45,50,12],[318,305,85,60,-5],[170,355,62,52,4],[455,325,52,48,0],[298,412,65,50,-3],[398,402,40,38,0]];
const parCells=PAR.map((p,i)=>{
  const g=G(D),[cx,cy,rx,ry,rot]=p;
  el('ellipse',{rx,ry,fill:'url(#gPar)',stroke:'#2a8f4a','stroke-width':5},g);
  el('ellipse',{rx:rx-7,ry:ry-7,fill:'none',stroke:'#b6e86a','stroke-width':2,opacity:.7},g);
  el('ellipse',{cx:-rx*.25,cy:-ry*.38,rx:rx*.38,ry:ry*.17,fill:'#fff',opacity:.4},g);
  const na=rnd()*6.28,nuc=el('ellipse',{rx:10,ry:6,fill:'#1d6b3a'},g);
  const chl=[];for(let k=0;k<7;k++)chl.push({a:k/7*6.28+rnd()*.4,e:el('ellipse',{rx:5,ry:3,fill:'#4fb34a',opacity:.85},g)});
  return {g,cx,cy,rx,ry,rot,na,nuc,chl,ph:rnd()*6.28,dir:i%2?1:-1};
});

/* ======================= 2) COLLENCHYMA – cross section ======================= */
const hexPts=(R,cx,cy)=>{const a=[];for(let k=0;k<6;k++){const t=(-90+60*k)*PI/180;a.push(f1((cx||0)+R*Math.cos(t))+','+f1((cy||0)+R*Math.sin(t)));}return a.join(' ');};
const colCrossG=G(D);
const COLX=[[655,740,825,910],[612,697,782,867],[655,740,825,910],[612,697,782,867]],COLY=[190,263,336,409];
const colCells=[];
COLX.forEach((row,r)=>row.forEach(x=>{const y=COLY[r];
  el('polygon',{points:hexPts(49,x,y),fill:'#2e9b52',stroke:'#1b6e3c','stroke-width':4,'stroke-linejoin':'round'},colCrossG);
}));
COLX.forEach((row,r)=>row.forEach(x=>{const y=COLY[r],g=G(colCrossG);
  el('circle',{r:37,fill:'url(#gPar)',stroke:'#63c35c','stroke-width':2.5},g);
  el('ellipse',{cx:-10,cy:-14,rx:14,ry:7,fill:'#fff',opacity:.4},g);
  const a=rnd()*6.28;const nuc=el('ellipse',{cx:f1(22*Math.cos(a)),cy:f1(22*Math.sin(a)),rx:7,ry:5,fill:'#1d6b3a'},g);
  colCells.push({g,x,y,ph:rnd()*6.28});
}));

/* ======================= 3) SCLERENCHYMA – cross section ======================= */
const SCL=[[1125,205],[1229,200],[1333,197],[1073,295],[1177,295],[1281,292],[1125,388],[1229,393],[1340,390]];
const sclCells=SCL.map(([x,y])=>{
  const g=G(D,{transform:`translate(${x} ${y})`});
  const pts=[];for(let k=0;k<36;k++){const t=k*10*PI/180,r=57+(k%3===0?11:0)+rnd()*2;pts.push(f1(r*Math.cos(t))+','+f1(r*Math.sin(t)));}
  el('polygon',{points:pts.join(' '),fill:'url(#gScl)',stroke:'#16603a','stroke-width':3,'stroke-linejoin':'round'},g);
  [44,32,22].forEach((R,i)=>el('polygon',{points:hexPts(R),fill:'none',stroke:'#8fdc72','stroke-width':2,opacity:.55-i*.1},g));
  const canals=[];for(let k=0;k<6;k++){const t=(-60+60*k)*PI/180;
    el('line',{x1:f1(12*Math.cos(t)),y1:f1(12*Math.sin(t)),x2:f1(50*Math.cos(t)),y2:f1(50*Math.sin(t)),stroke:'#a8e46e','stroke-width':3,'stroke-linecap':'round'},g);
    canals.push({t,e:el('circle',{r:3.2,fill:'#eaffb0'},g)});}
  el('circle',{r:12,fill:'#c8f06c',stroke:'#2f8f4c','stroke-width':2.5},g);
  const core=el('circle',{r:5,fill:'#9ad84e'},g);
  return {canals,core,ph:rnd()*6.28};
});

/* ======================= 4) PARENCHYMA – longitudinal ======================= */
const PL=[[172,540,73,188],[172,735,73,113],[172,852,73,140],[250,515,83,125],[250,645,83,215],[250,866,83,124],[337,530,81,150],[337,686,81,140],[337,830,81,115]];
const parLong=PL.map(([x,y,w,h])=>{
  const g=G(D);
  el('rect',{x,y,width:w,height:h,rx:10,fill:'url(#gLong)',stroke:'#2a8f4a','stroke-width':5},g);
  el('rect',{x:x+w*.3,y:y+10,width:w*.22,height:h-20,rx:6,fill:'#fff',opacity:.25},g);
  el('ellipse',{cx:x+w-17,cy:y+h*.55,rx:5,ry:12,fill:'#1d6b3a'},g);
  const gr=[];for(let k=0;k<5;k++)gr.push({u:k/5+rnd()*.1,e:el('ellipse',{rx:4,ry:2.6,fill:'#4fb34a',opacity:.85},g)});
  return {g,x,y,w,h,gr,ph:rnd()*6.28};
});

/* ======================= 5) COLLENCHYMA – longitudinal ======================= */
const CL=[[642,542,65,193],[642,740,65,225],[712,508,65,157],[712,668,65,322],[780,525,65,165],[780,695,65,250]];
const BASE=990,HB=480;
const colLong=CL.map(([x,y,w,h])=>{
  const g=G(D);
  el('rect',{x,y,width:w,height:h,rx:5,fill:'url(#gLong)',stroke:'#1f7a42','stroke-width':7},g);
  el('rect',{x:x+w*.32,y:y+10,width:w*.2,height:h-20,rx:5,fill:'#fff',opacity:.25},g);
  [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(c=>el('circle',{cx:c[0],cy:c[1],r:9,fill:'#34a85a',stroke:'#1b6e3c','stroke-width':2},g));
  el('ellipse',{cx:x+w*.55,cy:y+h*.45,rx:5,ry:11,fill:'#1d6b3a'},g);
  const gr=[];for(let k=0;k<4;k++)gr.push({u:k/4+rnd()*.1,e:el('ellipse',{rx:3.5,ry:2.3,fill:'#4fb34a',opacity:.8},g)});
  return {g,x,y,w,h,gr,cx:x+w/2,cy:y+h/2};
});

/* ======================= 6) SCLERENCHYMA – longitudinal (fibres) ======================= */
const sclLongG=G(D);
el('path',{d:document.getElementById('bundleClip').getAttribute('d'),fill:'#2e9b52',stroke:'#1b6e3c','stroke-width':7,'stroke-linejoin':'round'},sclLongG);
const tearDown=(x,y1,y2,w)=>`M${x},${y2} C${x+w*1.25},${y1+(y2-y1)*.5} ${x+w},${y1} ${x},${y1} C${x-w},${y1} ${x-w*1.25},${y1+(y2-y1)*.5} ${x},${y2}Z`;
const tearUp=(x,y1,y2,w)=>`M${x},${y1} C${x+w*1.25},${y1+(y2-y1)*.5} ${x+w},${y2} ${x},${y2} C${x-w},${y2} ${x-w*1.25},${y1+(y2-y1)*.5} ${x},${y1}Z`;
const spindle=(x,y1,y2,w)=>{const m=(y1+y2)/2;return `M${x},${y1} Q${x+w*2},${m} ${x},${y2} Q${x-w*2},${m} ${x},${y1}Z`;};
const FIB=[tearDown(1170,548,672,38),tearDown(1255,548,668,38),spindle(1125,652,888,34),spindle(1215,662,872,38),spindle(1300,648,882,34),tearUp(1172,858,982,36),tearUp(1255,858,982,36)];
FIB.forEach(d=>{el('path',{d,fill:'url(#gFib)',stroke:'#165f36','stroke-width':5,'stroke-linejoin':'round'},sclLongG);
  el('path',{d,fill:'none',stroke:'#c9f37a','stroke-width':2,opacity:.45,transform:'',},sclLongG);});
[[1272,575],[1222,722],[1128,800],[1312,800],[1190,950]].forEach(p=>el('ellipse',{cx:p[0],cy:p[1],rx:4.5,ry:10,fill:'#1d6b3a'},sclLongG));
const glint=el('rect',{x:1060,y:500,width:310,height:90,fill:'url(#gGlint)','clip-path':'url(#cpB)'},sclLongG);

/* ======================= labels (below each tissue) ======================= */
function label(txt,cx,cy,w){const g=G(view,{'pointer-events':'none'});
  el('rect',{class:'pill',x:cx-w/2,y:cy-22,width:w,height:44,rx:22},g);
  el('text',{class:'lbl',x:cx,y:cy},g).textContent=txt;}
label('النسيج البرنكيمي',177,612,220);
label('النسيج الكولنكيمي',447,612,230);
label('النسيج السكلرنكيمي',731,612,245);

/* ======================= animation ======================= */
let T=0,last=performance.now(),paused=false;
function frame(ms){
  const dt=Math.min(.05,(ms-last)/1000);last=ms;const de=paused?0:dt;T+=de;const t=T;

  /* parenchyma cross: turgor "breathing" + chloroplast cyclosis */
  parCells.forEach(c=>{const s=1+.025*Math.sin(t*1.3+c.ph);
    c.g.setAttribute('transform',`translate(${c.cx} ${c.cy}) rotate(${c.rot}) scale(${s.toFixed(3)})`);
    const na=c.na+.15*Math.sin(t*.5+c.ph);c.nuc.setAttribute('cx',f1(c.rx*.5*Math.cos(na)));c.nuc.setAttribute('cy',f1(c.ry*.45*Math.sin(na)));
    c.chl.forEach(k=>{const a=k.a+c.dir*t*.45;const x=c.rx*.8*Math.cos(a),y=c.ry*.78*Math.sin(a);
      k.e.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) rotate(${f1(Math.atan2(c.ry*Math.cos(a),-c.rx*Math.sin(a))*180/PI)})`);});
  });

  /* collenchyma cross: flexible tissue gently bends, protoplasts pulse */
  colCrossG.setAttribute('transform',`translate(760 420) skewX(${(3*Math.sin(t*.9)).toFixed(2)}) scale(${(1+.012*Math.sin(t*1.8)).toFixed(3)} 1) translate(-760 -420)`);
  colCells.forEach(c=>c.g.setAttribute('transform',`translate(${c.x} ${c.y}) scale(${(1+.03*Math.sin(t*1.4+c.ph)).toFixed(3)})`));

  /* sclerenchyma cross: rigid; flow along pit canals */
  sclCells.forEach(c=>{c.canals.forEach((k,i)=>{const u=((t*.35+i/6+c.ph)%1);const r=12+38*u;
      k.e.setAttribute('cx',f1(r*Math.cos(k.t)));k.e.setAttribute('cy',f1(r*Math.sin(k.t)));k.e.setAttribute('opacity',(Math.sin(u*PI)).toFixed(2));});
    c.core.setAttribute('r',(4+1.5*Math.sin(t*2+c.ph)).toFixed(2));});

  /* parenchyma longitudinal: cytoplasmic streaming around each cell */
  const perim=(c,u,ins)=>{const w=c.w-2*ins,h=c.h-2*ins,P=2*(w+h);let d=((u%1)+1)%1*P;
    if(d<w)return [c.x+ins+d,c.y+ins];d-=w;if(d<h)return [c.x+c.w-ins,c.y+ins+d];d-=h;if(d<w)return [c.x+c.w-ins-d,c.y+c.h-ins];d-=w;return [c.x+ins,c.y+c.h-ins-d];};
  parLong.forEach(c=>{c.gr.forEach(k=>{const p=perim(c,k.u+t*.06,11);k.e.setAttribute('cx',f1(p[0]));k.e.setAttribute('cy',f1(p[1]));});
    const s=1+.012*Math.sin(t*1.3+c.ph),cx=c.x+c.w/2,cy=c.y+c.h/2;
    c.g.setAttribute('transform',`translate(${cx} ${cy}) scale(${s.toFixed(3)} 1) translate(${-cx} ${-cy})`);});

  /* collenchyma longitudinal: whole strand sways (flexibility) */
  const sw=Math.sin(t*1.1);
  colLong.forEach(c=>{const f=Math.pow((BASE-c.cy)/HB,1.6),dx=16*sw*f,sk=-3.2*sw*Math.pow((BASE-c.cy)/HB,.6);
    c.g.setAttribute('transform',`translate(${f1(c.cx+dx)} ${c.cy}) skewX(${sk.toFixed(2)}) translate(${-c.cx} ${-c.cy})`);
    c.gr.forEach(k=>{const p=perim(c,k.u+t*.05,12);k.e.setAttribute('cx',f1(p[0]));k.e.setAttribute('cy',f1(p[1]));});});

  /* sclerenchyma longitudinal: rigid fibres, light sweep shows lignified walls */
  glint.setAttribute('y',f1(470+((t*.18)%1)*560));

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------- zoom & pan ---------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:325});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:325});
document.getElementById('zreset').onclick=reset;

/* ---------- fullscreen ---------- */
const fsBtn=document.getElementById('fs'),dEl=document.documentElement;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{
  const on=!document.body.classList.contains('fs');
  if(on){const r=dEl.requestFullscreen||dEl.webkitRequestFullscreen;
    if(r){try{const p=r.call(dEl);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
    setFs(true);
  }else{
    if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}
    setFs(false);
  }
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
})();
</script>
</body>
</html>
