<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<title>آلية عمل العضلة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /* Layout: full-screen stage — the fibre fills it, labels arrive one by one, then the picture slides left (top on phones) while the text types in on the right.
     Deliberately single (light) theme to match the white-ground anatomical plate. */
  :root{--navy:#1f3a52;--rust:#c4623a;--rustD:#a8431b;--ink:#26384a;--muted:#5d7488;--paper:#eef6fb;--white:#ffffff;--glow:#ffd84a;color-scheme:light}
  html{height:100%;box-sizing:border-box;overflow:hidden;background:var(--paper)}
  body{position:relative;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);direction:rtl;
       font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--navy);padding:0 16px}
  #title{color:var(--white);font-size:clamp(15px,3.6vw,22px);font-weight:800}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:radial-gradient(circle at 50% 45%,#f6fcff 0%,#cfe8f3 100%)}

  #draw{position:absolute;top:0;left:0;width:100%;height:calc(100% - 16px);z-index:2;
        transition:width 1.4s cubic-bezier(.65,0,.35,1),height 1.4s cubic-bezier(.65,0,.35,1)}
  .shifted #draw{width:55%}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;overflow:visible;direction:ltr}
  svg:active{cursor:grabbing}

  .lbl text{font-family:"Cairo",Tahoma,Arial,sans-serif;font-weight:800;font-size:40px;fill:#141414;
            stroke:var(--white);stroke-width:7px;stroke-linejoin:round;paint-order:stroke}
  .lbl .halo{fill:none;stroke:var(--white);stroke-width:10;stroke-linecap:round}
  .lbl .ln{fill:none;stroke:#141414;stroke-width:5;stroke-linecap:round}
  .lbl .dot{fill:#141414;stroke:var(--white);stroke-width:3}
  .lbl .ring{fill:none;stroke:var(--rust);stroke-width:3}

  #txt{position:absolute;top:24px;bottom:24px;right:28px;width:calc(45% - 48px);box-sizing:border-box;overflow-y:auto;z-index:1;
       padding:4px 6px 4px 14px;opacity:0;transform:translateX(40px);pointer-events:none;scrollbar-width:thin;
       transition:opacity .7s ease .4s,transform .9s cubic-bezier(.2,.7,.2,1) .4s;-webkit-user-select:text;user-select:text}
  .shifted #txt{opacity:1;transform:none;pointer-events:auto}
  #txtIn{max-width:560px}
  @media (max-width:720px),(max-aspect-ratio:4/5){
    .shifted #draw{width:100%;height:44%}
    #txt{top:calc(44% + 2px);left:16px;right:16px;width:auto;bottom:16px;padding:4px;transform:translateY(40px)}
  }
  #txt h2{margin:0 0 10px;color:var(--navy);font-size:clamp(17px,1.7vw,21px);font-weight:800;line-height:1.6;text-wrap:balance}
  #txt p{margin:0 0 12px;font-size:clamp(14px,1.25vw,15.5px);line-height:1.95;color:var(--ink)}
  #txt ol{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  #txt li{display:flex;gap:9px;align-items:flex-start;font-size:clamp(13.5px,1.2vw,15px);line-height:1.85;color:var(--ink)}
  #txt li>span:last-child{min-width:0}
  .num{flex:none;width:21px;height:21px;margin-top:4px;border-radius:50%;background:var(--rust);color:var(--white);font-weight:700;font-size:12px;
       display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.4);transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1)}
  .num.on{opacity:1;transform:none}
  .w{display:inline-block;opacity:0;transform:translateY(5px);filter:blur(3px);transition:opacity .45s ease,transform .45s ease,filter .45s ease}
  .w.on{opacity:1;transform:none;filter:none}

  .zb{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);background:var(--white);color:var(--navy);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:background .25s,color .25s}
  .zb button svg{width:20px;height:20px;cursor:pointer}
  #tt.on{background:var(--navy);color:var(--white)}
  button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
  body.pf #top{display:none}
  body.pf #stage{top:0}
  @media (prefers-reduced-motion:reduce){#draw,#txt,.w,.num{transition:none!important}}
</style>
</head>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);};
const svg=$('svg'),view=$('view'),body=$('body'),fx=$('fx'),stage=$('stage'),txt=$('txt'),txtIn=$('txtIn');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- labels: [text lines, text centre x, first baseline y, dot (on the structure), line end (beside the text)] ----------
   order follows the signal: nerve → junction → membrane → fibres → inside the fibre */
const L=[
 {t:['خلية حركية'],x:296,y:92,d:[461,141],e:[400,96]},
 {t:['اتجاه الإيعاز'],x:660,y:165,d:[562,288],e:[634,172]},
 {t:['غشاء بلازمي'],x:324,y:975,d:[500,932],e:[438,962]},
 {t:['ليف'],x:298,y:482,d:[504,554],e:[343,466]},
 {t:['ليف عضلي'],x:312,y:868,d:[493,854],e:[416,854]},
 {t:['شبكة بلازمية داخلية'],x:188,y:718,d:[513,706],e:[368,706]},
 {t:['أيونات كولاجين منطلقة','من الشبكة البلازمية الداخلية'],x:1110,y:955,d:[783,734],e:[970,914],dy:62},
 {t:['مايتوكوندريا'],x:962,y:56,d:[955,203],e:[955,72]}
];
const STEP=2.6,DUR=2.2; /* seconds between labels, and the length of each label's entrance */
const lg=$('labels');
L.forEach(o=>{
  const g=el('g',{class:'lbl'},lg);
  const len=Math.hypot(o.e[0]-o.d[0],o.e[1]-o.d[1]);
  const p=`M${o.d[0]} ${o.d[1]}L${o.e[0]} ${o.e[1]}`;
  o.halo=el('path',{class:'halo',d:p,'stroke-dasharray':len,'stroke-dashoffset':len},g);
  o.ln=el('path',{class:'ln',d:p,'stroke-dasharray':len,'stroke-dashoffset':len},g);
  o.ring=el('circle',{class:'ring',cx:o.d[0],cy:o.d[1],r:0,opacity:0},g);
  o.dot=el('circle',{class:'dot',cx:o.d[0],cy:o.d[1],r:0},g);
  o.tg=el('g',{opacity:0},g);
  o.t.forEach((s,k)=>{const t=el('text',{x:o.x,y:o.y+k*(o.dy||0),'text-anchor':'middle'},o.tg);t.textContent=s;});
  o.len=len;
});
let lblStart=null;
function drawLabels(now){
  if(lblStart===null)return;
  const t=RM?1e6:(now-lblStart)/1000;
  L.forEach((o,i)=>{
    const u=t-i*STEP;
    const pd=ss(0,.45,u),pl=ss(.35,1.35,u),pt=ss(1.15,DUR,u),pr=ss(0,.9,u);
    o.dot.setAttribute('r',(9*pd*(1+.35*Math.sin(Math.PI*Math.min(1,u/.45)))).toFixed(2));
    o.ring.setAttribute('r',(9+26*pr).toFixed(1));o.ring.setAttribute('opacity',(u>0&&u<.9?(1-pr)*.9:0).toFixed(2));
    const off=(o.len*(1-pl)).toFixed(1);o.ln.setAttribute('stroke-dashoffset',off);o.halo.setAttribute('stroke-dashoffset',off);
    o.tg.setAttribute('opacity',pt.toFixed(3));
    o.tg.setAttribute('transform',`translate(0 ${(14*(1-pt)).toFixed(1)})`);
  });
}
function playLabels(){lblStart=performance.now();}
const LABELS_DONE=((L.length-1)*STEP+DUR)*1000;

/* ---------- nerve impulse: a glow runs down the motor neuron, flashes at the junction, and the fibre twitches ---------- */
const NERVE=[[402,86],[432,112],[461,141],[490,178],[515,218],[540,252],[565,290],[590,322]];
const segL=[];let NL=0;for(let i=1;i<NERVE.length;i++){const l=Math.hypot(NERVE[i][0]-NERVE[i-1][0],NERVE[i][1]-NERVE[i-1][1]);segL.push(l);NL+=l;}
function along(f){let d=f*NL;for(let i=0;i<segL.length;i++){if(d<=segL[i]){const k=d/segL[i];return[NERVE[i][0]+(NERVE[i+1][0]-NERVE[i][0])*k,NERVE[i][1]+(NERVE[i+1][1]-NERVE[i][1])*k];}d-=segL[i];}return NERVE[NERVE.length-1];}
const pulse=el('circle',{r:26,fill:'url(#gl)',opacity:0},fx);
const tail=el('circle',{r:18,fill:'url(#gl)',opacity:0},fx);
const syn=el('ellipse',{cx:600,cy:330,rx:120,ry:85,fill:'url(#gs)',opacity:0},fx);
const CX=800,CY=560;
function render(t,e){
  const ph=(t/4.5)%1;
  const fp=ss(.05,.55,ph),vis=ph>.04&&ph<.6?1:0;
  const p=along(fp),q=along(Math.max(0,fp-.06));
  pulse.setAttribute('cx',p[0]);pulse.setAttribute('cy',p[1]);pulse.setAttribute('opacity',(vis*e).toFixed(2));
  tail.setAttribute('cx',q[0]);tail.setAttribute('cy',q[1]);tail.setAttribute('opacity',(vis*e*.5).toFixed(2));
  const flash=ss(.52,.6,ph)*(1-ss(.62,.85,ph));
  syn.setAttribute('opacity',(flash*e).toFixed(3));
  const tw=ss(.56,.64,ph)*(1-ss(.66,.9,ph));            /* contraction twitch after the impulse arrives */
  const s=(.94+.06*e)*(1-.012*tw)*(1+.004*Math.sin(2*Math.PI*t/2.2));
  body.setAttribute('transform',`translate(${CX} ${CY}) scale(${s.toFixed(4)},${(s*(1+.006*tw)).toFixed(4)}) translate(${-CX} ${-CY})`);
  body.setAttribute('opacity',e.toFixed(3));
}

/* ---------- text ---------- */
const D={t:'آلية عمل العضلة',
 p:'يمكن إيجاز آلية عمل العضلة كما يأتي:',
 f:['يقوم الدماغ بإصدار الإيعاز للعضلة بالحركة من خلال التفرعات العصبية من النخاع الشوكي حيث تنتقل بعد ذلك إلى الأعصاب المحيطية وهذه الأعصاب تتصل بالعضلة بوساطة ارتباط خاص يسمى الوصلة العصبية-العضلية.',
    'عندما تتسلم العضلة الإيعاز تبدأ بالتقلص أو الانبساط حسب الإيعاز الوارد لها من الجهاز العصبي المركزي.',
    'التقلص والانبساط في العضلة يتم بصورة تشبه إلى حد ما انتقال التيار الكهربائي.']};
const mk=(tag,cls,par,s)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(s!=null)e.textContent=s;if(par)par.appendChild(e);return e;};
function words(par,s){const out=[];s.split(/\s+/).forEach((w,k)=>{if(k)par.appendChild(document.createTextNode(' '));out.push(mk('span','w',par,w));});return out;}
let seq=[],typeTok=0,typed=false;
(function buildText(){
  seq.push(...words(mk('h2','',txtIn),D.t),{pause:300});
  seq.push(...words(mk('p','',txtIn),D.p),{pause:350});
  const ol=mk('ol','',txtIn);
  D.f.forEach((f,k)=>{const li=mk('li','',ol);seq.push(mk('span','num',li,String(k+1)));seq.push(...words(mk('span','',li),f),{pause:200});});
})();
function startTyping(){
  if(typed)return;typed=true;const tok=++typeTok;
  if(RM){showAll();return;}
  let k=0;
  (function next(){
    if(tok!==typeTok)return;
    while(k<seq.length&&seq[k].pause===undefined&&seq[k].classList.contains('on'))k++;
    const it=seq[k++];if(!it)return;
    if(it.pause!==undefined){setTimeout(next,it.pause);return;}
    it.classList.add('on');
    const b=it.getBoundingClientRect(),c=txt.getBoundingClientRect();
    if(b.bottom>c.bottom-8)txt.scrollTop+=b.bottom-c.bottom+24;
    setTimeout(next,it.classList.contains('num')?120:65);
  })();
}
function showAll(){typeTok++;typed=true;seq.forEach(it=>it.classList&&it.classList.add('on'));}
txt.addEventListener('click',showAll);

/* ---------- show / hide text ---------- */
let textOn=false,ready=false;
const tt=$('tt');
function layout(){stage.classList.toggle('shifted',textOn&&ready);if(textOn&&ready)setTimeout(()=>{if(textOn&&ready)startTyping();},RM?0:1200);}
tt.onclick=()=>{textOn=!textOn;tt.classList.toggle('on',textOn);tt.setAttribute('aria-pressed',textOn);tt.setAttribute('aria-label',textOn?'إخفاء النص':'إظهار النص');layout();};
$('replay').onclick=playLabels;

/* ---------- loop ---------- */
const born=performance.now();
function frame(ms){const e=RM?1:ss(0,1,(ms-born)/900);render(RM?0:ms/1000,e);drawLabels(ms);requestAnimationFrame(frame);}
setTimeout(()=>{ready=true;playLabels();layout();},RM?0:900);

/* ---------- zoom & pan ---------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8,MID={x:724,y:543};
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prev=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prev.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
function reset(){sc=1;tx=0;ty=0;apply();}
svg.addEventListener('dblclick',reset);
$('zin').onclick=()=>zoomAt(1.3,MID);
$('zout').onclick=()=>zoomAt(1/1.3,MID);
$('zreset').onclick=reset;

/* ---------- fullscreen ---------- */
const root=document.documentElement,fsIco=$('fsIco');
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
let pseudo=false;
const setPseudo=v=>{pseudo=v;document.body.classList.toggle('pf',v);fsUpd();};
$('fs').onclick=()=>{
  if(fsEl()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}return;}
  if(pseudo){setPseudo(false);return;}
  const req=root.requestFullscreen||root.webkitRequestFullscreen;
  if(!req||(document.fullscreenEnabled===false&&document.webkitFullscreenEnabled!==true)){setPseudo(true);return;}
  try{const r=req.call(root);if(r&&r.then)r.catch(()=>setPseudo(true));else setTimeout(()=>{if(!fsEl())setPseudo(true);},350);}catch(e){setPseudo(true);}
};
const fsUpd=()=>{const on=!!fsEl()||pseudo;fsIco.setAttribute('d',on?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');$('fs').setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');};
document.addEventListener('fullscreenchange',fsUpd);document.addEventListener('webkitfullscreenchange',fsUpd);

apply();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
