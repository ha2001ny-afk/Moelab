<style>
/* Layout: one full-screen navy lab bench; every control is a physical part of the apparatus */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --pos:#ff6b6b; --neg:#5eaaff; --field:#62d98a; --force:#ffab5c; --accent:#7fd3ff;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --L:max(10px,env(safe-area-inset-left,0px)); --T:max(10px,env(safe-area-inset-top,0px));
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body)}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#ink{pointer-events:none}
#ink.on{pointer-events:auto;cursor:crosshair}
.btn{position:absolute;top:var(--T);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;z-index:3}
.btn[hidden]{display:none}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:20px;height:20px}
.fs{left:var(--L)}
.tipbtn{left:calc(var(--L) + 50px);color:#ffd27a}
.tipbtn svg{width:22px;height:22px}
.tipbtn:hover,.tipbtn.on{border-color:#ffd27a;background:rgba(255,210,122,.14)}
.penbtn{left:calc(var(--L) + 100px)}
.penbtn.on{border-color:var(--accent);background:rgba(127,211,255,.18);color:var(--accent)}
.clrbtn{left:calc(var(--L) + 150px);color:#ff9d9d}
.pal{position:absolute;top:calc(var(--T) + 50px);left:calc(var(--L) + 100px);width:42px;display:grid;gap:8px;justify-items:center;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.8);z-index:3}
.pal[hidden]{display:none}
.pal button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.pal button.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(8,20,41,.9) inset}
.toast{position:absolute;top:calc(var(--T) + 52px);left:var(--L);max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink);z-index:5}
.tip{position:absolute;top:calc(var(--T) + 50px);left:var(--L);width:min(340px,calc(100% - 20px));max-height:calc(100% - 80px);overflow:auto;background:rgba(8,20,41,.94);border:1px solid rgba(255,210,122,.35);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.75;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:4}
.tip h2{margin:0 0 8px;font-family:var(--f-display);font-size:16px;font-weight:600;color:#ffd27a;padding-left:28px;text-wrap:balance}
.tip p{margin:0 0 8px}
.tip .m,.tip b.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.tip p.m{text-align:center;color:var(--accent);font-weight:600}
.tip .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;direction:ltr;justify-content:flex-end}
.tip .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.tip .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.tip .x:hover{color:var(--ink)}
</style>
</head>
<body style="margin:0">

<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="ساق موصلة تنزلق على سكة بشكل حرف U داخل مجال مغناطيسي مع مصباح"></canvas>
  <canvas id="ink" aria-hidden="true"></canvas>
  <button class="btn fs" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="btn tipbtn" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
  <button class="btn penbtn" id="penBtn" aria-label="وضع القلم" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L16.5 4a2.1 2.1 0 0 1 3 3L8 18.5 4 20z"/><path d="M14.5 6l3 3"/></svg></button>
  <button class="btn clrbtn" id="clrBtn" aria-label="حذف الكتابة" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
  <div class="pal" id="pal" hidden>
    <button data-c="#ffd27a" style="background:#ffd27a" class="sel" aria-label="أصفر"></button>
    <button data-c="#ff6b6b" style="background:#ff6b6b" aria-label="أحمر"></button>
    <button data-c="#ffffff" style="background:#ffffff" aria-label="أبيض"></button>
  </div>
  <div class="tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
</div>

<script>
(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
/* physical state: x = rod position along the rail (m), v (m/s, + to the right), B (T), L (m), s = +1 field into the page */
const TL=1.0,R=1.0,MASS=0.1,BMAX=2,VMAXS=2,LMIN=0.1,LMAX=0.5;
const S={x:0.3,px:0.3,v:0,B:0.8,s:1,L:0.3,vset:0.8,auto:false,dir:1,emf:0,I:0,phase:0};
let W=0,H=0,DPR=1,narrow=false,G={},col={},time=0,drag=null,hover=null,placed=false;
const cam={z:1,x:0,y:0};

function readColors(){const cs=getComputedStyle(document.documentElement);
  ['deep','navy','glow','ink','muted','pos','neg','field','force','accent'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- geometry ---------- */
function layout(){
  const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;
  W=nw;H=nh;narrow=W<760||W<H*0.95;
  DPR=window.devicePixelRatio||1;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  let box,met,tr;
  if(narrow){
    G.bw=Math.min(W-24,330);G.bh=126;G.mw=142;G.mh=84;
    box={x:(W-G.bw)/2,y:H-G.bh-14};met={x:0,y:0};
    const top=158,bottom=box.y-56;
    G.hMax=clamp(bottom-top,110,340);G.hMin=G.hMax*0.3;
    tr={x0:34,x1:W-22,cy:(top+bottom)/2};}
  else{
    G.bw=300;G.bh=130;G.mw=160;G.mh=90;
    const tw=clamp(W*0.8,460,1100);
    tr={x0:W/2-tw/2+10,x1:W/2+tw/2+10,cy:H*0.44};
    met={x:W-G.mw-30,y:24};box={x:Math.max(24,tr.x0-40),y:H-G.bh-28};
    const top=120,bottom=box.y-50;
    G.hMax=clamp(2*Math.min(tr.cy-top,bottom-tr.cy),150,340);G.hMin=G.hMax*0.3;}
  if(!placed){G.box={...box};G.met={...met};}
  G.trBase=tr;applyTr();
  derive();
}
function applyTr(){const b=G.trBase,o=G.off||(G.off={x:0,y:0});G.tr={x0:b.x0+o.x,x1:b.x1+o.x,cy:b.cy+o.y};
  G.rx0=G.tr.x0+62;G.rx1=G.tr.x1-30;G.ppm=(G.rx1-G.rx0)/TL;}
function derive(){const b=G.box,w=G.bw;
  G.kB={x:b.x+w*0.14,y:b.y+48,r:18};G.dirB={x:b.x+w*0.38,y:b.y+48,r:17};
  G.kV={x:b.x+w*0.63,y:b.y+48,r:18};G.sw={x:b.x+w*0.87,y:b.y+52};}
const hPx=()=>G.hMin+(S.L-LMIN)/(LMAX-LMIN)*(G.hMax-G.hMin);
function rg(){const h=hPx(),t=G.tr;return{h,top:t.cy-h/2,bot:t.cy+h/2,xr:G.rx0+S.x*G.ppm,x0:t.x0,x1:t.x1,cy:t.cy};}

/* ---------- physics ---------- */
function step(dt){
  if(drag&&drag.type==='rod'){const vi=(S.x-S.px)/dt;S.v=lerp(S.v,vi,Math.min(1,dt*14));}
  else if(S.auto){S.v=S.dir*S.vset;S.x+=S.v*dt;
    if(S.x>=TL){S.x=TL;S.dir=-1;}else if(S.x<=0){S.x=0;S.dir=1;}}
  else{ // free rod: magnetic braking  m dv/dt = -B²L²v/R
    const kb=S.B*S.B*S.L*S.L/R;S.v*=Math.exp(-(kb/MASS+0.12)*dt);S.x+=S.v*dt;
    if(S.x>=TL){S.x=TL;S.v=0;}else if(S.x<=0){S.x=0;S.v=0;}
    if(Math.abs(S.v)<0.004)S.v=0;}
  S.px=S.x;
  S.emf=S.s*S.v*S.B*S.L;      // >0 : current flows anticlockwise on the screen
  S.I=S.emf/R;
  S.phase+=Math.sign(S.I)*(30+150*Math.min(1,Math.abs(S.I)))*dt*(Math.abs(S.I)>0.004?1:0);
}
const forceB=()=>-S.B*S.B*S.L*S.L*S.v/R;   // on the rod, along x

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,o={}){ctx.font=o.font||'600 13px system-ui, Tahoma, sans-serif';ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
const MONO='ui-monospace, Menlo, Consolas, monospace';
function sym(main,sub,x,y,color){ctx.font='italic 700 16px '+MONO;const w=ctx.measureText(main).width;ctx.font='600 10.5px '+MONO;const ws=sub?ctx.measureText(sub).width:0;
  const x0=x-(w+ws)/2;
  ctx.lineWidth=4;ctx.strokeStyle='rgba(8,20,41,.75)';ctx.lineJoin='round';ctx.textBaseline='middle';ctx.textAlign='left';ctx.direction='ltr';
  ctx.font='italic 700 16px '+MONO;ctx.strokeText(main,x0,y);ctx.fillStyle=color;ctx.fillText(main,x0,y);
  if(sub){ctx.font='600 10.5px '+MONO;ctx.strokeText(sub,x0+w+1,y+6);ctx.fillText(sub,x0+w+1,y+6);}}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function arrow(x,y,dx,dy,color,lw){const len=Math.hypot(dx,dy);if(len<6)return;const a=Math.atan2(dy,dx),hs=Math.min(9,len*0.45);
  ctx.strokeStyle=color;ctx.lineWidth=lw||3.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx-Math.cos(a)*hs,y+dy-Math.sin(a)*hs);ctx.stroke();arrowHead(x+dx-Math.cos(a)*hs*0.7,y+dy-Math.sin(a)*hs*0.7,a,hs,color);}
function signMark(x,y,r,positive){ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.2,r*0.24);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-r*0.5,y);ctx.lineTo(x+r*0.5,y);if(positive){ctx.moveTo(x,y-r*0.5);ctx.lineTo(x,y+r*0.5);}ctx.stroke();}
function pulseRing(x,y,r,color,ph){const pu=0.5+0.5*Math.sin(time*5+(ph||0));ctx.beginPath();ctx.arc(x,y,r+pu*5,0,7);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function knob(k,f,lit){const a0=Math.PI*0.75,ang=a0+f*Math.PI*1.5;
  for(let i=0;i<=12;i++){const a=a0+i/12*Math.PI*1.5;ctx.strokeStyle=i/12<=f+1e-6?col.accent:'rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(k.x+Math.cos(a)*(k.r+4),k.y+Math.sin(a)*(k.r+4));ctx.lineTo(k.x+Math.cos(a)*(k.r+8),k.y+Math.sin(a)*(k.r+8));ctx.stroke();}
  const kg=ctx.createRadialGradient(k.x-6,k.y-7,2,k.x,k.y,k.r);kg.addColorStop(0,'#5a6884');kg.addColorStop(1,'#1f2738');
  ctx.beginPath();ctx.arc(k.x,k.y,k.r,0,7);ctx.fillStyle=kg;ctx.fill();ctx.strokeStyle=lit?col.accent:'rgba(255,255,255,.3)';ctx.lineWidth=1.6;ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(k.x+Math.cos(ang)*5,k.y+Math.sin(ang)*5);ctx.lineTo(k.x+Math.cos(ang)*(k.r-5),k.y+Math.sin(ang)*(k.r-5));ctx.stroke();}
function lcd(cx,y,w,s){rr(cx-w/2,y,w,24,5);ctx.fillStyle='#08160f';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();
  txt(s,cx,y+13,{font:'600 13px '+MONO,color:'#7ef0a4',dir:'ltr'});}
function fieldMark(x,y,r,into,color){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1.8;ctx.lineCap='round';
  if(into){ctx.beginPath();ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(x,y,r*1.15,0,7);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*0.38,0,7);ctx.fill();}}

function drawBg(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(W*0.55,H*0.42,0,W*0.55,H*0.42,Math.max(W,H)*0.75);
  g.addColorStop(0,col.glow);g.addColorStop(0.55,col.navy);g.addColorStop(1,col.deep);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const h=ctx.createRadialGradient(W*0.5,-H*0.1,0,W*0.5,-H*0.1,H*0.7);
  h.addColorStop(0,'rgba(255,255,255,0.10)');h.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=h;ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*cam.x,DPR*cam.y);
}

/* ---------- magnetic field region ---------- */
function drawField(){const t=G.tr,fx=t.x0-18,fw=t.x1+14-fx,fy=t.cy-G.hMax/2-30,fh=G.hMax+60,f=S.B/BMAX;
  rr(fx,fy,fw,fh,14);ctx.fillStyle='rgba(98,217,138,'+(0.03+0.07*f)+')';ctx.fill();
  ctx.setLineDash([5,7]);ctx.strokeStyle='rgba(98,217,138,.35)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
  if(S.B>0.001){const nx=Math.max(3,Math.round(fw/46)),ny=Math.max(3,Math.round(fh/46));
    ctx.globalAlpha=0.3+0.65*f;
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++)fieldMark(fx+(i+0.5)*fw/nx,fy+(j+0.5)*fh/ny,3.5+2.5*f,S.s>0,col.field);
    ctx.globalAlpha=1;}
  sym('B','',fx+fw-14,fy-12,col.field);
  ctx.strokeStyle=col.field;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(fx+fw-20,fy-22);ctx.lineTo(fx+fw-8,fy-22);ctx.stroke();arrowHead(fx+fw-7,fy-22,0,3.5,col.field);}

/* ---------- rails, lamp, rod ---------- */
function loopPts(k){return[{x:k.xr,y:k.top},{x:k.x0,y:k.top},{x:k.x0,y:k.bot},{x:k.xr,y:k.bot},{x:k.xr,y:k.top}];}
function drawRails(k){
  const metal=(a,b,vert)=>{const g=vert?ctx.createLinearGradient(a-5,0,a+5,0):ctx.createLinearGradient(0,a-5,0,a+5);g.addColorStop(0,'#7a4f2a');g.addColorStop(0.45,'#f0b77a');g.addColorStop(1,'#8a5a30');return g;};
  ctx.save();ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=8;ctx.shadowOffsetY=4;
  ctx.fillStyle=metal(k.top);rr(k.x0-5,k.top-5,k.x1-k.x0+5,10,4);ctx.fill();
  ctx.fillStyle=metal(k.bot);rr(k.x0-5,k.bot-5,k.x1-k.x0+5,10,4);ctx.fill();
  ctx.fillStyle=metal(k.x0,0,true);rr(k.x0-5,k.top-5,10,k.h+10,4);ctx.fill();ctx.restore();
  // L handle under the lower rail
  const hx=k.x0+(k.x1-k.x0)*0.7,ha=hover==='lh'||(drag&&drag.type==='lh');
  rr(hx-18,k.bot+8,36,10,5);ctx.fillStyle=ha?col.accent:'rgba(232,236,242,.85)';ctx.fill();
  ctx.strokeStyle=col.deep;ctx.lineWidth=1;ctx.beginPath();for(let i=-1;i<=1;i++){ctx.moveTo(hx+i*6,k.bot+10.5);ctx.lineTo(hx+i*6,k.bot+15.5);}ctx.stroke();
  // L dimension
  const dx=k.x1-12;ctx.strokeStyle=col.muted;ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(dx-5,k.top+7);ctx.lineTo(dx+5,k.top+7);ctx.moveTo(dx,k.top+7);ctx.lineTo(dx,k.bot-7);ctx.moveTo(dx-5,k.bot-7);ctx.lineTo(dx+5,k.bot-7);ctx.stroke();
  ctx.fillStyle=col.navy;ctx.fillRect(dx-8,k.cy-10,16,20);txt('L',dx,k.cy,{font:'italic 700 15px '+MONO,dir:'ltr'});
}
function drawCurrent(k){const aI=Math.abs(S.I);if(aI<0.004)return;
  const pts=loopPts(k),len=[0];for(let i=1;i<pts.length;i++)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  const Lt=len[len.length-1],gap=26,n=Math.floor(Lt/gap),g=Lt/n,off=((S.phase%g)+g)%g;
  ctx.globalAlpha=Math.min(1,0.35+aI*2.5);
  for(let j=0;j<n;j++){const s=off+j*g;let i=1;while(i<len.length-1&&len[i]<s)i++;const f=(s-len[i-1])/((len[i]-len[i-1])||1);
    const x=pts[i-1].x+(pts[i].x-pts[i-1].x)*f,y=pts[i-1].y+(pts[i].y-pts[i-1].y)*f;
    ctx.beginPath();ctx.arc(x,y,3.6,0,7);ctx.fillStyle='#ffe28a';ctx.fill();ctx.beginPath();ctx.arc(x,y,6.5,0,7);ctx.fillStyle='rgba(255,226,138,.22)';ctx.fill();}
  // direction arrows  I
  const d=Math.sign(S.I),ax=k.x0+(k.xr-k.x0)*0.5,c='#ffe28a';
  if(k.xr-k.x0>90){arrow(ax+d*16,k.top-18,-d*32,0,c,2.4);sym('I','',ax,k.top-34,c);
    arrow(ax-d*16,k.bot+20,d*32,0,c,2.4);sym('I','',ax,k.bot+36,c);}
  ctx.globalAlpha=1;}
function drawLamp(k){const x=k.x0+32,yb=k.top-4,cy=yb-54,P=S.I*S.I*R,g=clamp(Math.sqrt(P/1.2),0,1);
  // halo
  if(g>0.01){const hg=ctx.createRadialGradient(x,cy,6,x,cy,40+95*g);hg.addColorStop(0,'rgba(255,224,120,'+(0.25+0.6*g)+')');hg.addColorStop(1,'rgba(255,224,120,0)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(x,cy,40+95*g,0,7);ctx.fill();}
  // pear-shaped glass

  const pos=e=>{const r=ink.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  pb.addEventListener('click',()=>{on=!on;sync();});
  cb.addEventListener('click',()=>{strokes=[];cur=null;redraw();sync();});
  pal.addEventListener('click',e=>{const c=e.target.dataset&&e.target.dataset.c;if(!c)return;color=c;[...pal.children].forEach(x=>x.classList.toggle('sel',x===e.target));});
  ink.addEventListener('pointerdown',e=>{if(!on)return;e.preventDefault();ink.setPointerCapture(e.pointerId);cur={c:color,p:[pos(e)],id:e.pointerId};strokes.push(cur);seg(cur,0);});
  ink.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==cur.id)return;const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e],n=cur.p.length;(ev.length?ev:[e]).forEach(x=>cur.p.push(pos(x)));seg(cur,n);});
  const end=e=>{if(cur&&e.pointerId===cur.id)cur=null;};
  ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);
  new ResizeObserver(size).observe(ink);size();sync();})();
</script>
</body>
