<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>الكشف عن الموجات الكهرومغناطيسية</title>
<style>
/* Layout: one full-screen navy lab bench; every control is a physical part of the apparatus */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --pos:#ff6b6b; --neg:#5eaaff; --field:#62d98a; --force:#ffab5c; --accent:#7fd3ff;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --L:max(10px,env(safe-area-inset-left,0px)); --T:max(10px,env(safe-area-inset-top,0px));
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body)}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#ink{pointer-events:none}
#ink.on{pointer-events:auto;cursor:crosshair}
.btn{position:absolute;top:var(--T);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;z-index:3}
.btn[hidden]{display:none}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:20px;height:20px}
.fs{left:var(--L)}
.tipbtn{left:calc(var(--L) + 50px);color:#ffd27a}
.tipbtn svg{width:22px;height:22px}
.tipbtn:hover,.tipbtn.on{border-color:#ffd27a;background:rgba(255,210,122,.14)}
.penbtn{left:calc(var(--L) + 100px)}
.penbtn.on{border-color:var(--accent);background:rgba(127,211,255,.18);color:var(--accent)}
.clrbtn{left:calc(var(--L) + 150px);color:#ff9d9d}
.pal{position:absolute;top:calc(var(--T) + 50px);left:calc(var(--L) + 100px);width:42px;display:grid;gap:8px;justify-items:center;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.8);z-index:3}
.pal[hidden]{display:none}
.pal button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.pal button.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(8,20,41,.9) inset}
.toast{position:absolute;top:calc(var(--T) + 52px);left:var(--L);max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink);z-index:5}
.tip{position:absolute;top:calc(var(--T) + 50px);left:var(--L);width:min(350px,calc(100% - 20px));max-height:calc(100% - 80px);overflow:auto;background:rgba(8,20,41,.94);border:1px solid rgba(255,210,122,.35);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.75;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:4}
.tip h2{margin:0 0 8px;font-family:var(--f-display);font-size:16px;font-weight:600;color:#ffd27a;padding-left:28px;text-wrap:balance}
.tip p{margin:0 0 8px}
.tip .m,.tip b.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.tip p.m{text-align:center;color:var(--accent);font-weight:600}
.tip .note{color:var(--muted);font-size:12.5px}
.tip .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;direction:ltr;justify-content:flex-end}
.tip .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.tip .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.tip .x:hover{color:var(--ink)}
/* no text selection, callout or tap highlight while handling the simulation */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
.stage{touch-action:none}
.tip{touch-action:pan-y}
.rail{position:absolute;left:var(--L);top:calc(var(--T) + 52px);display:flex;flex-direction:column;gap:6px;z-index:3}
.rail button{width:66px;height:56px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;align-content:center;gap:2px;padding:0;cursor:pointer;font-family:var(--f-body)}
.rail button b{font:700 18px var(--f-mono);line-height:1}
.rail button span{font-size:11px;color:var(--muted);line-height:1.2}
.rail button:hover{border-color:var(--accent)}
.rail button.on{background:var(--accent);border-color:var(--accent);color:var(--deep)}
.rail button.on span{color:var(--deep);font-weight:600}
.rail .frz{height:48px;margin-top:6px}
.rail .frz svg{width:16px;height:16px}
.rail .frz.on{background:rgba(255,210,122,.18);border-color:#ffd27a;color:#ffd27a}
.rail .frz.on span{color:#ffd27a}
.rail button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail.narrow{flex-direction:row;right:10px}
.rail.narrow button{flex:1;width:auto;height:50px;min-width:0}
.rail.narrow .frz{margin-top:0;flex:0 0 48px}
.rail.narrow .frz span{display:none}
.topw{position:absolute;top:var(--T);right:24px;width:min(640px,calc(100% - 260px));display:flex;flex-direction:column;gap:8px;z-index:2}
.topw.narrow{left:var(--L);right:10px;width:auto}
.plaque{display:flex;gap:10px;align-items:flex-start;background:rgba(8,20,41,.78);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.65;color:var(--ink);pointer-events:none}
.topw.narrow .plaque{font-size:13px;padding:7px 10px}
.plaque .no{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--deep);font:700 14px var(--f-mono)}
.plaque em{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
.chips[hidden]{display:none}
.chip{border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--deep);font-weight:600}
.sl{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0;background:rgba(8,20,41,.6);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.sl[hidden]{display:none}
.sl span{white-space:nowrap}
.sl output{font:600 12.5px var(--f-mono);color:#7ef0a4;direction:ltr;min-width:84px;white-space:nowrap;text-align:left}
.sl input{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.2);touch-action:none;margin:8px 0}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:2px solid var(--deep);cursor:pointer}
.sl input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--deep);cursor:pointer}
.pal{z-index:5}
</style>
</head>
<body style="margin:0">

<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="محاكاة الكشف عن موجات الراديو بمجالها الكهربائي (هوائي سلكي) وبمجالها المغناطيسي (هوائي حلقي)"></canvas>
  <canvas id="ink" aria-hidden="true"></canvas>
  <nav class="rail" id="rail" aria-label="المشاهد">
    <button data-p="1"><b>E</b><span>هوائي سلكي</span></button>
    <button data-p="2"><b>B</b><span>هوائي حلقي</span></button>
    <button class="frz" id="frz" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>تجميد</span></button>
  </nav>
  <div class="topw" id="topw">
    <div class="plaque" id="plaque"></div>
    <div class="bar">
      <div class="chips" id="chips"></div>
      <label class="sl" id="aL"><span id="aT"></span><input type="range" id="aR"><output id="aO"></output></label>
      <label class="sl" id="bL"><span id="bT"></span><input type="range" id="bR"><output id="bO"></output></label>
    </div>
  </div>
  <button class="btn fs" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="btn tipbtn" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
  <button class="btn penbtn" id="penBtn" aria-label="وضع القلم" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L16.5 4a2.1 2.1 0 0 1 3 3L8 18.5 4 20z"/><path d="M14.5 6l3 3"/></svg></button>
  <button class="btn clrbtn" id="clrBtn" aria-label="حذف الكتابة" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
  <div class="pal" id="pal" hidden>
    <button data-c="#ffd27a" style="background:#ffd27a" class="sel" aria-label="أصفر"></button>
    <button data-c="#ff6b6b" style="background:#ff6b6b" aria-label="أحمر"></button>
    <button data-c="#ffffff" style="background:#ffffff" aria-label="أبيض"></button>
  </div>
  <div class="tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
</div>

<script>
(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d'),plq=document.getElementById('plaque'),rail=document.getElementById('rail'),topw=document.getElementById('topw'),chips=document.getElementById('chips');
const $=id=>document.getElementById(id);
const SL=[{L:$('aL'),T:$('aT'),R:$('aR'),O:$('aO')},{L:$('bL'),T:$('bT'),R:$('bR'),O:$('bO')}];
const frz=$('frz');
/* 6-4 detecting radio waves.
   1: a straight wire antenna: E of the wave pushes its charges along the wire, emf ∝ E·û (cos of the tilt)
   2: a loop antenna: B of the wave threads the loop, Φ ∝ B·n̂ (cos of the turn), emf = −dΦ/dt
   In both the antenna drives a tuned LC circuit; its output is large only when f₀ = 1/(2π√LC) equals the wave frequency. */
const TAU=Math.PI*2,FW=1000e3,LT=200;
const fLC=C=>1/(TAU*Math.sqrt(LT*1e-6*C*1e-12));
const Q=12,resp=(f,f0)=>1/Math.sqrt(1+Q*Q*(f/f0-f0/f)**2);
const S={scene:1,frozen:false,t:0,C1:250,C2:250,th:20,al:20,usedRot:false,cT:0,cA:0,cR:0};
const V3={yaw:0.55,pitch:0.28};
let W=0,H=0,DPR=1,narrow=false,G={},col={},time=0,drag=null;
const cam={z:1,x:0,y:0};
function readColors(){const cs=getComputedStyle(document.documentElement);
  ['deep','navy','glow','ink','muted','pos','neg','field','force','accent'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
const fmtF=f=>Math.round(f/1e3)+' kHz';
const fA=0.5,phase=()=>TAU*fA*S.t;

/* ---------- controls ---------- */
function slider(i,title,min,max,step,val,out){const s=SL[i];s.L.hidden=false;s.T.textContent=title;s.R.min=min;s.R.max=max;s.R.step=step;s.R.value=val;s.O.textContent=out;}
function syncUI(){
  [...rail.querySelectorAll('[data-p]')].forEach(b=>{const on=+b.dataset.p===S.scene;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  chips.hidden=true;
  if(S.scene===1){slider(0,'C',50,500,1,S.C1,S.C1+' pF → '+fmtF(fLC(S.C1)));slider(1,'ميل الهوائي',0,90,1,S.th,S.th+'°');}
  else{slider(0,'C',50,500,1,S.C2,S.C2+' pF → '+fmtF(fLC(S.C2)));slider(1,'اتجاه الحلقة',0,90,1,S.al,S.al+'°');}
  frz.classList.toggle('on',S.frozen);frz.setAttribute('aria-pressed',S.frozen);frz.querySelector('span').textContent=S.frozen?'تشغيل':'تجميد';}
function changed(){plq.style.display='none';syncUI();layout();}
rail.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){S.scene=+b.dataset.p;cam.z=1;cam.x=0;cam.y=0;changed();}});
SL[0].R.addEventListener('input',()=>{const v=+SL[0].R.value;if(S.scene===1)S.C1=v;else S.C2=v;syncUI();});
SL[1].R.addEventListener('input',()=>{const v=+SL[1].R.value;if(S.scene===1)S.th=v;else S.al=v;syncUI();});
frz.addEventListener('click',()=>{S.frozen=!S.frozen;syncUI();});

/* ---------- geometry ---------- */
function layout(){
  const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;
  W=nw;H=nh;narrow=W<760||W<H*0.95;
  DPR=window.devicePixelRatio||1;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  rail.classList.toggle('narrow',narrow);topw.classList.toggle('narrow',narrow);
  const sr=cv.getBoundingClientRect();
  if(narrow)topw.style.top=(rail.getBoundingClientRect().bottom-sr.top+8)+'px';else topw.style.top='';
  const tb=topw.getBoundingClientRect().bottom-sr.top,rb=rail.getBoundingClientRect();
  G.A=narrow?{x0:10,x1:W-10,y0:tb+10,y1:H-12}:{x0:rb.right-sr.left+18,x1:W-24,y0:tb+12,y1:H-20};
}
/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,o={}){ctx.font=o.font||'600 13px system-ui, Tahoma, sans-serif';ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
const MONO='ui-monospace, Menlo, Consolas, monospace',SANS='system-ui, Tahoma, sans-serif';
function label(s,x,y,color,size,ltr){ctx.font=(ltr?'600 ':'600 ')+(size||12)+'px '+(ltr?MONO:SANS);ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction=ltr?'ltr':'rtl';
  ctx.lineWidth=4;ctx.strokeStyle='rgba(8,20,41,.85)';ctx.lineJoin='round';ctx.strokeText(s,x,y);ctx.fillStyle=color||col.ink;ctx.fillText(s,x,y);ctx.direction='ltr';}
function lab(b,s,x,y,color,size,ltr){const p=b.P(x,y);label(s,p.x,p.y,color,size,ltr);}
function badge(b,n,x,y){const p=b.P(x,y);ctx.beginPath();ctx.arc(p.x,p.y,11,0,TAU);ctx.fillStyle='#ffd27a';ctx.fill();txt(String(n),p.x,p.y+0.5,{font:'800 12px '+MONO,color:'#081429',dir:'ltr'});}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function signMark(x,y,r,positive){ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.2,r*0.24);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-r*0.5,y);ctx.lineTo(x+r*0.5,y);if(positive){ctx.moveTo(x,y-r*0.5);ctx.lineTo(x,y+r*0.5);}ctx.stroke();}
function charge(x,y,r,p){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=p?col.pos:col.neg;ctx.fill();signMark(x,y,r,p);}
function poly(P){ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++)ctx.lineTo(P[i][0],P[i][1]);}
const WIRE='#e0a35e';
function wire(P,c){poly(P);ctx.strokeStyle='#5a3b1c';ctx.lineWidth=6;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();poly(P);ctx.strokeStyle=c||WIRE;ctx.lineWidth=3;ctx.stroke();}
function dots(P,phase,color){const len=[0];for(let i=1;i<P.length;i++)len.push(len[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  const Lt=len[len.length-1],n=Math.max(1,Math.floor(Lt/22)),g=Lt/n,off=((phase%g)+g)%g;
  for(let j=0;j<n;j++){const s=off+j*g;let i=1;while(i<len.length-1&&len[i]<s)i++;const f=(s-len[i-1])/((len[i]-len[i-1])||1);
    const x=P[i-1][0]+(P[i][0]-P[i-1][0])*f,y=P[i-1][1]+(P[i][1]-P[i-1][1])*f;
    ctx.beginPath();ctx.arc(x,y,3.6,0,TAU);ctx.fillStyle=color||'#ffe28a';ctx.fill();ctx.beginPath();ctx.arc(x,y,6.5,0,TAU);ctx.fillStyle='rgba(255,226,138,.22)';ctx.fill();}}
// vertical coil between y0 and y1, bulging to side dir
function coil(x,y0,y1,dir,glow){const n=6,h=(y1-y0)/n;ctx.lineWidth=3.2;ctx.strokeStyle=WIRE;
  if(glow>0.02){ctx.save();ctx.shadowColor=col.field;ctx.shadowBlur=14*glow;}
  for(let i=0;i<n;i++){ctx.beginPath();ctx.ellipse(x+dir*7,y0+h*(i+0.5),14,h*0.62,0,0,TAU);ctx.stroke();}
  if(glow>0.02)ctx.restore();}
function capV(x,yc,variable,q){ctx.strokeStyle='#d3dbe8';ctx.lineWidth=4;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(x-20,yc-7);ctx.lineTo(x+20,yc-7);ctx.moveTo(x-20,yc+7);ctx.lineTo(x+20,yc+7);ctx.stroke();
  if(variable){ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-20,yc+18);ctx.lineTo(x+18,yc-16);ctx.stroke();arrowHead(x+20,yc-18,-0.73,6,'#ffffff');}
  if(q!=null&&Math.abs(q)>0.03){const n=Math.round(Math.abs(q)*4);for(let i=0;i<n;i++){const xx=x-15+i*10;charge(xx,yc-14,4,q>0);charge(xx,yc+14,4,q<0);}
    ctx.globalAlpha=Math.abs(q);ctx.strokeStyle=col.pos;ctx.lineWidth=1.4;ctx.beginPath();for(let i=0;i<4;i++){const xx=x-12+i*8;ctx.moveTo(xx,yc-4);ctx.lineTo(xx,yc+4);}ctx.stroke();ctx.globalAlpha=1;}}
function ground(x,y){ctx.strokeStyle='#d3dbe8';ctx.lineWidth=2.4;ctx.beginPath();for(let i=0;i<3;i++){const w=18-i*6;ctx.moveTo(x-w,y+i*6);ctx.lineTo(x+w,y+i*6);}ctx.stroke();}
function diode(x,y,on){ctx.fillStyle=on?'#ffe28a':'#d3dbe8';ctx.beginPath();ctx.moveTo(x-12,y-11);ctx.lineTo(x+10,y);ctx.lineTo(x-12,y+11);ctx.closePath();ctx.fill();ctx.strokeStyle=on?'#ffe28a':'#d3dbe8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+11,y-12);ctx.lineTo(x+11,y+12);ctx.stroke();
  if(on){ctx.save();ctx.globalAlpha=0.35;ctx.beginPath();ctx.arc(x,y,20,0,TAU);ctx.fillStyle='#ffe28a';ctx.fill();ctx.restore();}}
function earphone(x,y,amp,ph){const d=amp*4*Math.sin(ph);ctx.fillStyle='#3a4458';ctx.fillRect(x-10,y-22,16,44);ctx.beginPath();ctx.moveTo(x+6,y-20);ctx.lineTo(x+26+d,y-36);ctx.lineTo(x+26+d,y+36);ctx.lineTo(x+6,y+20);ctx.closePath();ctx.fillStyle='#8792a6';ctx.fill();
  ctx.strokeStyle='#e9edf3';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+26+d,y-36);ctx.lineTo(x+26+d,y+36);ctx.stroke();
  if(amp>0.05)for(let i=0;i<3;i++){const r=((time*60+i*22)%66)+14;ctx.globalAlpha=amp*(1-r/80);ctx.strokeStyle='#ffe28a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+26,y,r,-0.6,0.6);ctx.stroke();}ctx.globalAlpha=1;}

function drawBg(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(W*0.55,H*0.42,0,W*0.55,H*0.42,Math.max(W,H)*0.75);
  g.addColorStop(0,col.glow);g.addColorStop(0.55,col.navy);g.addColorStop(1,col.deep);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const h=ctx.createRadialGradient(W*0.5,-H*0.1,0,W*0.5,-H*0.1,H*0.7);
  h.addColorStop(0,'rgba(255,255,255,0.10)');h.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=h;ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*cam.x,DPR*cam.y);
}

function sym(main,sub,x,y,color){ctx.font='italic 700 16px '+MONO;const w=ctx.measureText(main).width;ctx.font='600 10.5px '+MONO;const ws=sub?ctx.measureText(sub).width:0;
  const x0=x-(w+ws)/2;
  ctx.lineWidth=4;ctx.strokeStyle='rgba(8,20,41,.75)';ctx.lineJoin='round';ctx.textBaseline='middle';ctx.textAlign='left';ctx.direction='ltr';
  ctx.font='italic 700 16px '+MONO;ctx.strokeText(main,x0,y);ctx.fillStyle=color;ctx.fillText(main,x0,y);
  if(sub){ctx.font='600 10.5px '+MONO;ctx.strokeText(sub,x0+w+1,y+6);ctx.fillText(sub,x0+w+1,y+6);}}
function arrow(x,y,dx,dy,color,lw){const len=Math.hypot(dx,dy);if(len<6)return;const a=Math.atan2(dy,dx),hs=Math.min(9,len*0.45);
  ctx.strokeStyle=color;ctx.lineWidth=lw||3.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx-Math.cos(a)*hs,y+dy-Math.sin(a)*hs);ctx.stroke();arrowHead(x+dx-Math.cos(a)*hs*0.7,y+dy-Math.sin(a)*hs*0.7,a,hs,color);}


function inBox(b,fn){ctx.save();ctx.translate(b.ox,b.oy);ctx.scale(b.s,b.s);fn();ctx.restore();}
/* ---------- 3D: X travel, Y = E, Z = B ---------- */
function geo(){const A=G.A,aw=A.x1-A.x0,ah=A.y1-A.y0,Lw=Math.max(200,aw-60),amp=Math.min(ah*0.16,narrow?66:80);
  return{A,aw,ah,cx:(A.x0+A.x1)/2,cy:A.y0+ah*(narrow?0.27:0.3),Lw,X0:0,xc:Lw/2,ampM:amp,lp:Math.min(Lw*0.42,300),D:Math.max(1300,Lw*1.8),Xa:Lw*(narrow?0.68:0.64)};}
function P3(g,X,Y,Z){const cy_=Math.cos(V3.yaw),sy=Math.sin(V3.yaw),cp=Math.cos(V3.pitch),sp=Math.sin(V3.pitch);
  const x=X-g.xc,xr=x*cy_-Z*sy,zr=x*sy+Z*cy_,yr=Y*cp-zr*sp,zz=Y*sp+zr*cp,f=g.D/(g.D-zz);return{x:g.cx+xr*f,y:g.cy-yr*f,f,z:zz};}
function R3(X,Y,Z){const cy_=Math.cos(V3.yaw),sy=Math.sin(V3.yaw),cp=Math.cos(V3.pitch),sp=Math.sin(V3.pitch);const xr=X*cy_-Z*sy,zr=X*sy+Z*cy_;return{x:xr,y:-(Y*cp-zr*sp)};}
const eAt=(g,X)=>Math.sin(phase()-TAU*X/g.lp);           // E and B of the wave (same phase)
const dAt=(g,X)=>Math.cos(phase()-TAU*X/g.lp);           // their rate of change
function wave(g){const P=(X,Y,Z)=>P3(g,X,Y,Z),stp=clamp(g.lp/24,3,8),E=[],B=[],base=[];
  for(let X=0;;X+=stp){const xx=Math.min(X,g.Lw),e=eAt(g,xx)*g.ampM;base.push(P(xx,0,0));E.push(P(xx,e,0));B.push(P(xx,0,e));if(xx>=g.Lw)break;}
  const a0=P(0,0,0),a1=P(g.Lw+26,0,0),ab=P(g.Lw+16,0,0);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(a0.x,a0.y);ctx.lineTo(a1.x,a1.y);ctx.stroke();arrowHead(a1.x,a1.y,Math.atan2(a1.y-ab.y,a1.x-ab.x),6,'rgba(255,255,255,.55)');
  const sheets=[{pts:B,c:col.field,fill:'rgba(98,217,138,.12)',z:P(g.xc,0,g.ampM).z},{pts:E,c:col.pos,fill:'rgba(255,107,107,.12)',z:P(g.xc,g.ampM,0).z}].sort((a,b)=>a.z-b.z);
  sheets.forEach(sh=>{ctx.beginPath();ctx.moveTo(base[0].x,base[0].y);sh.pts.forEach(p=>ctx.lineTo(p.x,p.y));for(let i=base.length-1;i>=0;i--)ctx.lineTo(base[i].x,base[i].y);ctx.closePath();ctx.fillStyle=sh.fill;ctx.fill();
    ctx.strokeStyle=sh.c;ctx.globalAlpha=0.5;ctx.lineWidth=1.1;base.forEach((b,i)=>{if(i%3)return;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(sh.pts[i].x,sh.pts[i].y);ctx.stroke();});
    ctx.globalAlpha=1;ctx.lineWidth=2.3;ctx.beginPath();ctx.moveTo(sh.pts[0].x,sh.pts[0].y);sh.pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();});
  const p=P(g.Lw*0.12,g.ampM+22,0);label('f = '+fmtF(FW),p.x,p.y,col.ink,12,true);}
function triad(){const ox=G.A.x1-50,oy=G.A.y0+52,ax=[[R3(1,0,0),'#ffffff','c'],[R3(0,1,0),col.pos,'E'],[R3(0,0,1),col.field,'B']];
  ax.forEach(([v,cl,l])=>{if(Math.hypot(v.x,v.y)>0.08)arrow(ox,oy,v.x*32,v.y*32,cl,2.2);sym(l,'',ox+v.x*43,oy+v.y*43,cl);});}
function rotHint(){if(!S.usedRot)label('اسحب لتدوير المشهد',(G.A.x0+G.A.x1)/2,G.A.y0+10,col.accent,12);}
function amplifier(b,x,y,out){inBox(b,()=>{rr(x,y,110,74,10);ctx.fillStyle='#2d3648';ctx.fill();ctx.strokeStyle=out>0.6?'#7ef0a4':'rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.stroke();
    for(let k=0;k<6;k++){rr(x+14+k*14,y+58-k*7,10,8+k*7,2);ctx.fillStyle=k<Math.round(out*6)?'#7ef0a4':'rgba(255,255,255,.15)';ctx.fill();}});
  lab(b,'RF amplifier',x+55,y+88,col.muted,11,true);}
function resistor(x,y0,y1){ctx.strokeStyle='#d3dbe8';ctx.lineWidth=3;ctx.lineJoin='miter';ctx.beginPath();ctx.moveTo(x,y0);const n=6,h=(y1-y0)/n;for(let i=0;i<n;i++)ctx.lineTo(x+(i%2?-10:10),y0+h*(i+0.5));ctx.lineTo(x,y1);ctx.stroke();}

/* ---------- scene 1: wire antenna, E field ---------- */
function scene1(){const g=geo(),P=(X,Y,Z)=>P3(g,X,Y,Z),A=g.A,th=S.th*Math.PI/180,u={y:Math.cos(th),z:Math.sin(th)},Ha=g.ampM*1.25;
  const e=eAt(g,g.Xa),emf=e*Math.cos(th),d=dAt(g,g.Xa)*Math.cos(th),f0=fLC(S.C1),R=resp(FW,f0),out=R*Math.abs(Math.cos(th));
  wave(g);
  // antenna rod, tilted by θ in the YZ plane; the wave's E pushes charges along it
  const top=P(g.Xa,Ha*u.y,Ha*u.z),bot=P(g.Xa,-Ha*u.y,-Ha*u.z),foot=P(g.Xa,-Ha-24,0);
  ctx.lineCap='round';ctx.strokeStyle='#56627a';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(top.x,top.y);ctx.lineTo(bot.x,bot.y);ctx.stroke();ctx.strokeStyle='#d3dbe8';ctx.lineWidth=4;ctx.stroke();
  if(Math.abs(d)>0.03){const ps=[[top.x,top.y],[bot.x,bot.y]];dots(ps,S.cA);}
  const n=Math.round(Math.abs(emf)*3);for(let i=0;i<n;i++){const f=1-i*0.14;charge(bot.x+(top.x-bot.x)*(0.5+f*0.45),bot.y+(top.y-bot.y)*(0.5+f*0.45),5,emf>0);charge(bot.x+(top.x-bot.x)*(0.5-f*0.45),bot.y+(top.y-bot.y)*(0.5-f*0.45),5,emf<0);}
  // E at the antenna and its part along the rod
  const c0=P(g.Xa,0,0);arrow(c0.x+18,c0.y,(P(g.Xa,e*g.ampM*0.9,0).x-c0.x),(P(g.Xa,e*g.ampM*0.9,0).y-c0.y),col.pos,3);
  // lead down to the circuit
  ctx.strokeStyle='#e0a35e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bot.x,bot.y);ctx.lineTo(foot.x,foot.y);ctx.stroke();
  // circuit (design 520 × 230, antenna enters at (460,0))
  const avail=A.y1-foot.y-8,s=clamp(Math.min(avail/236,(foot.x-A.x0-4)/440,(A.x1-foot.x)/20,1.15),0.35,1.15),b={s,ox:foot.x-460*s,oy:foot.y,P(x,y){return{x:this.ox+x*this.s,y:this.oy+y*this.s};}};
  const it=R*Math.cos(th)*dAt(g,g.Xa);
  inBox(b,()=>{wire([[460,0],[460,50]]);coil(460,50,160,-1,Math.abs(d));wire([[460,160],[460,206]]);ground(460,206);
    wire([[330,82],[330,24],[410,24],[410,50]]);wire([[410,160],[410,180],[330,180],[330,96]]);coil(410,50,160,1,out);capV(330,89,true,R*Math.cos(th)*e*0.9);
    wire([[330,24],[230,24],[230,70]]);wire([[230,140],[230,180],[330,180]]);resistor(230,70,140);
    if(out>0.04){dots([[330,82],[330,24],[410,24],[410,180],[330,180],[330,96]],S.cT);dots([[330,24],[230,24],[230,180],[330,180]],S.cR);}
    ctx.strokeStyle='#d3dbe8';ctx.lineWidth=2;[[60],[120]].forEach(([y])=>{ctx.beginPath();ctx.moveTo(222,y);ctx.lineTo(142,y);ctx.stroke();arrowHead(140,y,Math.PI,7,'#d3dbe8');});});
  amplifier(b,20,52,out);
  sym('L','',b.P(442,105).x,b.P(442,105).y,col.ink);sym('C','',b.P(296,89).x,b.P(296,89).y,col.ink);sym('R','',b.P(258,105).x,b.P(258,105).y,col.ink);
  lab(b,'f₀ = '+fmtF(f0),370,214,R>0.6?'#7ef0a4':col.muted,12,true);
  if(R>0.6)lab(b,'رنين',370,236,'#ffd27a',13);
  triad();rotHint();
  if(!S.frozen){S.cA+=d*90*G.dt;S.cT+=it*110*G.dt;S.cR+=it*70*G.dt;}}

/* ---------- scene 2: loop antenna, B field ---------- */
function scene2(){const g=geo(),P=(X,Y,Z)=>P3(g,X,Y,Z),A=g.A,al=S.al*Math.PI/180,Rl=g.ampM*1.05,e1={x:Math.cos(al),z:-Math.sin(al)};
  const Bv=eAt(g,g.Xa),flux=Bv*Math.cos(al),emf=dAt(g,g.Xa)*Math.cos(al),f0=fLC(S.C2),R=resp(FW,f0),out=R*Math.abs(Math.cos(al));
  const lp=s=>P(g.Xa+Rl*Math.cos(s)*e1.x,Rl*Math.sin(s),Rl*Math.cos(s)*e1.z);
  const ring=[];for(let k=0;k<=64;k++){const s=-Math.PI/2+0.12+k*(TAU-0.24)/64;ring.push(lp(s));}
  // the half of the loop behind the wave, then the wave, then the front half
    wave(g);
  // flux through the loop: the disc glows with |B·n̂|, an arrow shows B at the centre
  ctx.beginPath();ring.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle='rgba(98,217,138,'+(0.05+0.4*Math.abs(flux)).toFixed(3)+')';ctx.fill();
  const c=P(g.Xa,0,0),bt=P(g.Xa,0,Bv*g.ampM*1.2);if(Math.abs(Bv)>0.05)arrow(c.x,c.y,bt.x-c.x,bt.y-c.y,col.field,3.2);
  ctx.strokeStyle='#e0a35e';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ring.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  if(Math.abs(emf)>0.03)dots(ring.map(p=>[p.x,p.y]),S.cA);
  // leads from the loop's gap down to the circuit
  const l1=ring[0],l2=ring[ring.length-1],foot=P(g.Xa,-Rl-26,0);
  ctx.strokeStyle='#e0a35e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(l1.x,l1.y);ctx.lineTo(foot.x+8,foot.y);ctx.moveTo(l2.x,l2.y);ctx.lineTo(foot.x-8,foot.y);ctx.stroke();
  // circuit (design 520 × 230, leads enter at (292,0) and (308,0))
  const avail=A.y1-foot.y-8,s=clamp(Math.min(avail/236,(foot.x-A.x0-4)/292,(A.x1-foot.x-4)/124,1.15),0.35,1.15),b={s,ox:foot.x-300*s,oy:foot.y,P(x,y){return{x:this.ox+x*this.s,y:this.oy+y*this.s};}};
  const it=R*emf;
  inBox(b,()=>{wire([[292,0],[292,30],[220,30],[220,82]]);wire([[220,96],[220,200],[380,200],[380,160]]);wire([[308,0],[308,30],[380,30],[380,60]]);coil(380,60,160,1,out);capV(220,89,true,R*flux*0.9);
    wire([[220,30],[150,30],[150,70]]);wire([[150,150],[150,200],[220,200]]);resistor(150,70,150);
    if(out>0.04){dots([[220,82],[220,30],[380,30],[380,200],[220,200],[220,96]],S.cT);dots([[220,30],[150,30],[150,200],[220,200]],S.cR);}
    ctx.strokeStyle='#d3dbe8';ctx.lineWidth=2;[90,130].forEach(y=>{ctx.beginPath();ctx.moveTo(142,y);ctx.lineTo(132,y);ctx.stroke();arrowHead(130,y,Math.PI,7,'#d3dbe8');});});
  amplifier(b,10,74,out);
  sym('L','',b.P(410,110).x,b.P(410,110).y,col.ink);sym('C','',b.P(252,89).x,b.P(252,89).y,col.ink);sym('R','',b.P(176,110).x,b.P(176,110).y,col.ink);
  lab(b,'f₀ = '+fmtF(f0),300,222,R>0.6?'#7ef0a4':col.muted,12,true);
  if(R>0.6)lab(b,'رنين',300,244,'#ffd27a',13);
  triad();rotHint();
  if(!S.frozen){S.cA+=emf*80*G.dt;S.cT+=it*110*G.dt;S.cR+=it*70*G.dt;}}

/* ---------- loop ---------- */
function step(dt){G.dt=S.frozen?0:dt;if(!S.frozen)S.t+=dt;}
function draw(){drawBg();if(S.scene===1)scene1();else scene2();}
const ptrs=new Map();let pinch=null,lastTap=0;
function scr(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const s=scr(e);ptrs.set(e.pointerId,s);
  if(ptrs.size===2){drag=null;const[a,b]=[...ptrs.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},z0:cam.z,x0:cam.x,y0:cam.y};return;}
  if(ptrs.size>2)return;const now=performance.now();if(now-lastTap<320){cam.z=1;cam.x=0;cam.y=0;V3.yaw=0.55;V3.pitch=0.28;}lastTap=now;drag={s0:s,y0:V3.yaw,p0:V3.pitch};cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{const s=scr(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,s);
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const z=clamp(pinch.z0*d/pinch.d0,0.6,4),wx=(pinch.m0.x-pinch.x0)/pinch.z0,wy=(pinch.m0.y-pinch.y0)/pinch.z0;cam.z=z;cam.x=mid.x-wx*z;cam.y=mid.y-wy*z;return;}
  if(drag){V3.yaw=drag.y0-(s.x-drag.s0.x)*0.008;V3.pitch=clamp(drag.p0+(s.y-drag.s0.y)*0.008,-0.6,1.2);S.usedRot=true;}});
function pointerEnd(e){ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;return;}drag=null;cv.style.cursor='grab';}
cv.addEventListener('pointerup',pointerEnd);cv.addEventListener('pointercancel',pointerEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();const s=scr(e),f=Math.exp(-e.deltaY*0.0015),z=clamp(cam.z*f,0.6,4),wx=(s.x-cam.x)/cam.z,wy=(s.y-cam.y)/cam.z;
  cam.z=z;cam.x=s.x-wx*z;cam.y=s.y-wy*z;},{passive:false});

window.__explain=function(){const f0=fLC(S.scene===1?S.C1:S.C2),R=resp(FW,f0);
  if(S.scene===1)return{t:'الكشف بالمجال الكهربائي',b:`<p>المجال الكهربائي للموجة يحرك شحنات الهوائي على طوله، فتصبح قمته موجبة ثم سالبة بالتناوب، فيمر تيار متغير يحث جهداً مهتزاً في الدائرة الرنينية. أكبر استقبال عندما يكون الهوائي موازياً لـ E.</p><p class="m">emf ∝ E cosθ</p><div class="nums"><span>θ = ${S.th}°</span><span>f = ${fmtF(FW)}</span><span>f₀ = ${fmtF(f0)}</span><span>${Math.round(R*100)}%</span></div>`};
  return{t:'الكشف بالمجال المغناطيسي',b:`<p>المجال المغناطيسي المتغير للموجة يخترق حلقة الهوائي فيتغير الفيض فيها، فتتولد قوة دافعة كهربائية محتثة. أكبر استقبال عندما يكون مستوى الحلقة عمودياً على اتجاه الفيض.</p><p class="m">emf = −ΔΦ/Δt ،  Φ ∝ B cosα</p><div class="nums"><span>α = ${S.al}°</span><span>f = ${fmtF(FW)}</span><span>f₀ = ${fmtF(f0)}</span><span>${Math.round(R*100)}%</span></div>`};};

let last=performance.now();
function frame(now){const dt=Math.max(0.001,Math.min(0.05,(now-last)/1000));last=now;time+=dt;if(!W)layout();
  if(W){step(dt);draw();}requestAnimationFrame(frame);}
readColors();changed();
new ResizeObserver(()=>layout()).observe(cv);
requestAnimationFrame(frame);
})();

/* ---------- fullscreen ---------- */
(function(){const b=document.getElementById('fsBtn'),ico=document.getElementById('fsIco'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const t=document.createElement('div');t.className='toast';t.hidden=true;t.textContent='ملء الشاشة غير متاح هنا. افتح الملف أو الرابط بالمتصفح';document.querySelector('.stage').appendChild(t);
  let tm=0;const toast=()=>{t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>t.hidden=true,3200);};
  const sync=()=>{ico.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');b.setAttribute('aria-label',isFs()?'الخروج من ملء الشاشة':'ملء الشاشة');};
  b.addEventListener('click',()=>{
    if(isFs()){try{exit.call(document);}catch(e){}return;}
    if(!req||document.fullscreenEnabled===false){toast();return;}
    try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(toast);setTimeout(()=>{if(!isFs())toast();},700);}catch(e){toast();}});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);})();

/* ---------- lamp hint panel ---------- */
(function(){const b=document.getElementById('tipBtn'),p=document.getElementById('tipPanel'),t=document.getElementById('tipTitle'),body=document.getElementById('tipBody');
  let iv=0,last='';
  const fill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===last)return;last=h;t.textContent=r.t;body.innerHTML=r.b;};
  const open=v=>{p.hidden=!v;b.setAttribute('aria-expanded',v);b.classList.toggle('on',v);clearInterval(iv);if(v){last='';fill();iv=setInterval(fill,400);}};
  b.addEventListener('click',()=>open(p.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>open(false));})();

/* ---------- pen mode: write over the simulation, clear the writing ---------- */
(function(){const ink=document.getElementById('ink'),ix=ink.getContext('2d'),pb=document.getElementById('penBtn'),cb=document.getElementById('clrBtn'),pal=document.getElementById('pal');
  let on=false,strokes=[],cur=null,color='#ffd27a',dpr=1;
  function seg(s,from){const p=s.p,i0=Math.max(0,from-1);ix.setTransform(dpr,0,0,dpr,0,0);ix.lineCap='round';ix.lineJoin='round';ix.strokeStyle=s.c;ix.lineWidth=3.2;
    ix.beginPath();ix.moveTo(p[i0].x,p[i0].y);if(p.length===1)ix.lineTo(p[0].x+0.1,p[0].y);for(let i=i0+1;i<p.length;i++)ix.lineTo(p[i].x,p[i].y);ix.stroke();}
  function redraw(){ix.setTransform(1,0,0,1,0,0);ix.clearRect(0,0,ink.width,ink.height);strokes.forEach(s=>seg(s,0));}
  function size(){const w=ink.clientWidth,h=ink.clientHeight;if(!w||!h)return;dpr=window.devicePixelRatio||1;ink.width=Math.round(w*dpr);ink.height=Math.round(h*dpr);redraw();}
  function sync(){ink.classList.toggle('on',on);pb.classList.toggle('on',on);pb.setAttribute('aria-pressed',on);pal.hidden=!on;cb.hidden=!(on||strokes.length);}
  const pos=e=>{const r=ink.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  pb.addEventListener('click',()=>{on=!on;sync();});
  cb.addEventListener('click',()=>{strokes=[];cur=null;redraw();sync();});
  pal.addEventListener('click',e=>{const c=e.target.dataset&&e.target.dataset.c;if(!c)return;color=c;[...pal.children].forEach(x=>x.classList.toggle('sel',x===e.target));});
  ink.addEventListener('pointerdown',e=>{if(!on)return;e.preventDefault();ink.setPointerCapture(e.pointerId);cur={c:color,p:[pos(e)],id:e.pointerId};strokes.push(cur);seg(cur,0);});
  ink.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==cur.id)return;const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e],n=cur.p.length;(ev.length?ev:[e]).forEach(x=>cur.p.push(pos(x)));seg(cur,n);});
  const end=e=>{if(cur&&e.pointerId===cur.id)cur=null;};
  ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);
  new ResizeObserver(size).observe(ink);size();sync();})();

/* ---------- block text selection and the copy/paste callout on touch devices ---------- */
(function(){const stop=e=>e.preventDefault();
  ['selectstart','contextmenu','dragstart'].forEach(ev=>document.addEventListener(ev,stop));
  document.querySelectorAll('canvas').forEach(c=>c.addEventListener('touchstart',stop,{passive:false}));
  document.addEventListener('selectionchange',()=>{const s=window.getSelection&&window.getSelection();if(s&&s.rangeCount&&!s.isCollapsed)s.removeAllRanges();});})();
</script>
