<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>التكاثر اللاجنسي في البكتريا</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(16px,3.8vw,24px);font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:18px;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav{width:62px;height:62px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:26px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .nav:active{background:#d9ebf7}
  .nav:focus-visible,.dot:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  #dots{display:flex;gap:14px;align-items:center}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .bt{fill:#fff;font-weight:bold;font-size:23px;text-anchor:middle;dominant-baseline:central}
  #bn{transition:fill .5s}
</style>
</head>
<body>
<div id="top"><div id="title">التكاثر اللاجنسي في البكتريا</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 900 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe49a"/><stop offset=".55" stop-color="#f5c45a"/><stop offset="1" stop-color="#d4921f"/></linearGradient>
        <linearGradient id="gCyto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d2fa"/><stop offset=".35" stop-color="#a7a4ec"/><stop offset="1" stop-color="#5f5cc4"/></linearGradient>
        <radialGradient id="gSite"><stop offset="0" stop-color="#7dffb0"/><stop offset="1" stop-color="#1f8a48"/></radialGradient>
        <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="المرحلة السابقة">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="المرحلة التالية">◀</button>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
let seed=5;const rnd=()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rr=(a,b)=>a+(b-a)*rnd();

const STG=[
  ['اتصال الكروموسوم بالغشاء البلازمي','#2e8b57'],
  ['استطالة الخلية البكتيرية','#e0902a'],
  ['تضاعف الكروموسوم وبدء التخصر','#2f6fd6'],
  ['تباعد الكروموسومين وزيادة التخصر','#7b4bb3'],
  ['انقسام الخلية إلى خليتين متماثلتين','#c4423a']];

/* ---------------- cell shape: a capsule that elongates, pinches, then splits ---------------- */
const CX=450,CY=400,H=95,PW=70,L0=180;
const cap=(x,L,h)=>{const k=L-h,a=Math.abs(x);return a<=k?h:Math.sqrt(Math.max(0,h*h-(a-k)*(a-k)));};
const SH={L:L0,c:0,split:false,q:0,sep:0};
const pinch=x=>1-SH.c*Math.exp(-(x/PW)*(x/PW));
/* point on a daughter (side -1 / +1) at param t in [0,1], inset d -> [x, halfHeight, centerY] */
function dPt(s,t,d){const L=SH.L,l=L/2,q=SH.q;
  const xp=s<0?lerp(-(L-d),0,t):lerp(0,L-d,t),hp=cap(xp,L-d,H-d)*pinch(xp);
  const xc=s*(l+SH.sep),xk=lerp(xc-(l-d),xc+(l-d),t),hk=cap(xk-xc,l-d,H-d);
  return[lerp(xp,xk,q),lerp(hp,hk,q),-s*14*q];}
const N=90,sp=i=>(1-Math.cos(PI*i/N))/2;
function outline(d){let top=[],bot=[];
  if(!SH.split){for(let i=0;i<=N;i++){const x=lerp(-(SH.L-d),SH.L-d,sp(i)),h=cap(x,SH.L-d,H-d)*pinch(x);top.push([x,-h]);bot.push([x,h]);}
    return poly(top,bot,0);}
  let out='';[-1,1].forEach(s=>{top=[];bot=[];let dy=0;
    for(let i=0;i<=N;i++){const p=dPt(s,sp(i),d);dy=p[2];top.push([p[0],-p[1]]);bot.push([p[0],p[1]]);}
    out+=poly(top,bot,dy);});return out;}
function poly(top,bot,dy){let s='';top.forEach((p,i)=>s+=(i?'L':'M')+f1(CX+p[0])+','+f1(CY+dy+p[1]));
  for(let i=bot.length-1;i>=0;i--)s+='L'+f1(CX+bot[i][0])+','+f1(CY+dy+bot[i][1]);return s+'Z';}

/* ---------------- layers ---------------- */
const shadow=el('path',{fill:'#1f3a52',opacity:.16,filter:'url(#blur)',transform:'translate(0 26)'});
const wall=el('path',{fill:'url(#gWall)',stroke:'#b9801c','stroke-width':2,'stroke-linejoin':'round'});
const memb=el('path',{fill:'#bfe8c4',stroke:'#2f9e5a','stroke-width':3.4,'stroke-linejoin':'round'});
const cyto=el('path',{fill:'url(#gCyto)'});
const shine=el('path',{fill:'none',stroke:'#fff',opacity:.35,'stroke-width':5,'stroke-linecap':'round'});

/* ribosomes: stored in cell-relative coordinates so they stretch and split with the cell */
const ribG=G(view),ribs=[];
for(let i=0;i<46;i++){const u=rr(-.92,.92),v=rr(-.85,.85);
  if(Math.abs(u)<.06)continue;ribs.push({u,v,e:el('circle',{r:3,fill:'#3d3a96',opacity:.55},ribG)});}
function cellPt(u,v,d){
  if(!SH.split){const x=u*(SH.L-d),h=cap(x,SH.L-d,H-d)*pinch(x);return[CX+x,CY+v*h*.8];}
  const s=u<0?-1:1,p=dPt(s,u<0?u+1:u,d);return[CX+p[0],CY+p[2]+v*p[1]*.8];}

/* chromosome: a looped double strand */
let chd='';for(let i=0;i<=240;i++){const a=i/240*2*PI,k=.42;
  chd+=(i?'L':'M')+f1(26*(Math.cos(a)+k*Math.cos(4*a+.3)))+','+f1(15*(Math.sin(a)-k*Math.sin(4*a+.3)));}
const chrG=G(view);
function Chrom(){const g=G(chrG),stalk=el('line',{stroke:'#5a0f22','stroke-width':3.4,'stroke-linecap':'round'},chrG),
  site=el('circle',{r:5.5,fill:'url(#gSite)',stroke:'#fff','stroke-width':1.5},chrG),
  o=el('path',{d:chd+'Z',fill:'none',stroke:'#5a0f22','stroke-width':5,'stroke-linejoin':'round'},g),
  i=el('path',{d:chd+'Z',fill:'none',stroke:'#e2445f','stroke-width':2.2,'stroke-linejoin':'round'},g);
  return{g,stalk,site,o,i};}
const A=Chrom(),B=Chrom(),CL=B.i.getTotalLength();
function setChrom(c,x,y,rot,op,att,rev){
  c.g.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(1.5)`);c.g.setAttribute('opacity',f2(op));
  const top=y-30,mt=memTop(x);
  c.stalk.setAttribute('x1',f1(x));c.stalk.setAttribute('y1',f1(top));c.stalk.setAttribute('x2',f1(x));c.stalk.setAttribute('y2',f1(lerp(top,mt,att)));
  c.stalk.setAttribute('opacity',f2(att>0.01?op:0));c.site.setAttribute('cx',f1(x));c.site.setAttribute('cy',f1(mt));
  c.site.setAttribute('opacity',f2(att*op));c.site.setAttribute('r',f1(4.5+1.5*att));
  [c.o,c.i].forEach(p=>{if(rev<1){p.setAttribute('stroke-dasharray',`${f1(CL*rev)} ${f1(CL+10)}`);}else p.removeAttribute('stroke-dasharray');});}
function memTop(x){
  if(!SH.split)return CY-cap(x-CX,SH.L-8,H-8)*pinch(x-CX);
  const s=x<CX?-1:1;return CY-s*14*SH.q-(H-8);}

/* banner */
const bn=el('rect',{id:'bn',x:100,y:14,width:700,height:58,rx:20,fill:'#2e8b57'}),bt=el('text',{class:'bt',x:450,y:43});

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:1,dur:4.6};
let stage=0,T=0,t0=0,last=performance.now(),paused=false,P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

/* ---------------- render ---------------- */
function render(t){
  const u1=clamp(P,0,1),u2=clamp(P-1,0,1),u3=clamp(P-2,0,1),u4=clamp(P-3,0,1),u5=clamp(P-4,0,1);
  SH.L=L0+130*sm(u2,.05,.9)+40*sm(u4,0,.7);
  SH.c=.25*sm(u3,.3,1)+.67*sm(u4,.1,1)+.08*sm(u5,0,.3);
  SH.split=u5>=.3;SH.q=sm(u5,.3,.85);SH.sep=30*SH.q;
  const breathe=1.2*Math.sin(t*1.6);
  const Hb=H;  /* keep geometry stable; breathing done via shine */
  wall.setAttribute('d',outline(0));shadow.setAttribute('d',outline(0));
  memb.setAttribute('d',outline(8));cyto.setAttribute('d',outline(10));
  /* highlight streak along the top of each cell */
  let sh='';const segs=SH.split?[-1,1]:[0];
  segs.forEach(s=>{let first=true;for(let i=8;i<=N-8;i+=2){const tt=sp(i);let x,y;
      if(s===0){x=lerp(-(SH.L-30),SH.L-30,tt);const h=cap(x,SH.L-14,H-14)*pinch(x);if(h<20){first=true;continue;}y=CY-h+10;}
      else{const p=dPt(s,tt,30);if(p[1]<20){first=true;continue;}x=p[0];y=CY+p[2]-(cap(0,H,H)-14)+10;}
      sh+=(first?'M':'L')+f1(CX+x)+','+f1(y+breathe*.3);first=false;}});
  shine.setAttribute('d',sh);
  ribs.forEach((r,k)=>{const p=cellPt(r.u+.008*Math.sin(t*1.3+k),r.v+.05*Math.sin(t*1.7+k*2),22);r.e.setAttribute('cx',f1(p[0]));r.e.setAttribute('cy',f1(p[1]));});

  /* chromosomes */
  const wob=k=>4*Math.sin(t*1.3+k);
  const a1=sm(u1,.1,.7),att=sm(u1,.55,.95);
  const rep=sm(u3,.05,.55),mv3=sm(u3,.4,.9),mv4=sm(u4,0,.8),attB=sm(u3,.5,.68);
  let ax=-62*mv3,bx=62*mv3;
  ax=lerp(ax,-SH.L/2,mv4);bx=lerp(bx,SH.L/2,mv4);
  let ay=lerp(CY+15,CY-38,a1)+Math.sin(t*1.1)*3*(1-a1),by=CY-38;
  if(SH.split){ax=-(SH.L/2+SH.sep);bx=SH.L/2+SH.sep;ay=CY-38+14*SH.q;by=CY-38-14*SH.q;}
  const bOff=1-sm(u3,.35,.6);
  setChrom(A,CX+ax+(1-a1)*0,ay,wob(0),1,att,1);
  setChrom(B,CX+bx+8*bOff,by+6*bOff,wob(2),P>2?1:0,attB,rep>0.999?1:rep);
}
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render(T);requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');
STG.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','المرحلة '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);});
function setUI(){bn.style.fill=STG[stage][1];bt.removeAttribute('textLength');bt.textContent=STG[stage][0];
  try{if(bt.getComputedTextLength()>670){bt.setAttribute('textLength',670);bt.setAttribute('lengthAdjust','spacingAndGlyphs');}}catch(e){}
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+STG.length)%STG.length;const tgt=i+1;
  if(tgt<=P+1e-3)P=i;          /* going back or replaying: restart that stage */
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1.2,4.6*(tgt-P));
  setUI();}
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(stage-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(stage+1);if(e.key==='ArrowRight')go(stage-1);});
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:400});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:400});
document.getElementById('zreset').onclick=reset;
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
go(0);render(0);requestAnimationFrame(frame);
})();
</script>

<style>
  #qp,#qbtn,#hlbar{--ok:#1b7a3a;--okbg:#eef9f0;--navy:#1f3a52;--hint:#c4623a;box-sizing:border-box;font-family:Tahoma,"Segoe UI",Arial,sans-serif;direction:rtl}
  #qp *,#qp *:before,#qp *:after{box-sizing:border-box}
  /* ===== ministerial questions ===== */
  #qbtn{position:absolute;top:10px;left:62px;z-index:2147482000;height:44px;padding:0 16px 0 12px;border-radius:22px;border:2px solid var(--hint);background:var(--hint);color:#fff;font:bold clamp(14px,3.6vw,17px) Tahoma,"Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);display:flex;align-items:center;gap:6px}
  #qbtn b{background:#fff;color:var(--hint);border-radius:11px;min-width:22px;height:22px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
  #qp{position:absolute;inset:0;z-index:2147483000;background:#f4f7fa;display:none;flex-direction:column}
  #qp.on{display:flex;animation:qin .28s ease}
  @keyframes qin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  #qhd{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid #dde5ec}
  #qhd .t{flex:1;color:var(--navy);font-weight:bold;font-size:clamp(15px,3.8vw,19px)}
  #qx{width:40px;height:40px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:18px;cursor:pointer}
  #qchips{flex:none;display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#fff;border-bottom:1px solid #dde5ec;scrollbar-width:none}
  #qchips button{flex:none;height:34px;padding:0 14px;border-radius:17px;border:2px solid #c9d6e2;background:#fff;color:var(--navy);font:bold 14px Tahoma,Arial,sans-serif;cursor:pointer}
  #qchips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  #qbody{flex:1;overflow-y:auto;padding:14px 12px 18px;-webkit-user-select:text;user-select:text}
  #qp .qc{max-width:760px;margin:0 auto;background:#fff;border-radius:18px;border:2px solid #e1e8ef;box-shadow:0 4px 14px rgba(31,58,82,.08);padding:16px 16px 18px;animation:qin .25s ease}
  #qp .qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  #qp .qty{background:var(--navy);color:#fff;border-radius:8px;padding:4px 10px;font-weight:bold;font-size:14px}
  #qp .qfire{color:#b23c17;background:#fff1ea;border:1px solid #f3c7b3;border-radius:8px;padding:3px 9px;font-weight:bold;font-size:13px}
  #qp .qnum{margin-inline-start:auto;color:#7a8b9a;font-weight:bold;font-size:14px}
  #qp .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  #qp .tg{font-size:13px;font-weight:bold;border-radius:14px;padding:3px 10px;border:1.5px solid;direction:rtl;white-space:nowrap}
  #qp .tg.min{color:#1f3a52;border-color:#1f3a52;background:#eef4f9}
  #qp .tg.pre{color:#8a5a1a;border-color:#d9a85a;background:#fff7e8}
  #qp .tg.out{color:#6a3d8f;border-color:#b89ad3;background:#f6f0fb}
  #qp .tg.book{color:#1b7a3a;border-color:#8cc9a0;background:#eef9f0}
  #qp .qq{color:var(--navy);font-weight:bold;font-size:clamp(17px,4.4vw,22px);line-height:1.9}
  #qp .blank{display:inline-block;min-width:7em;border-bottom:2.5px dashed #9fb2c4;color:transparent;line-height:1.5;margin:0 3px;padding:0 4px;transition:.3s}
  #qp .rev .blank{color:var(--ok);border-bottom-style:solid;border-color:var(--ok);background:var(--okbg);border-radius:6px 6px 0 0;min-width:0}
  #qp .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  @media(max-width:520px){#qp .opts{grid-template-columns:1fr}}
  #qp .opt{text-align:right;padding:10px 12px;border-radius:12px;border:2px solid #c9d6e2;background:#fff;color:var(--navy);font:bold clamp(15px,3.9vw,18px) Tahoma,Arial,sans-serif;cursor:pointer}
  #qp .opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
  #qp .opt.ok:after{content:'  ✓'}
  #qp .opt.no{border-color:#c0392b;background:#fdecea;color:#c0392b}
  #qp .opt.no:after{content:'  ✗'}
  #qp .items{margin:10px 0 0;padding:0;list-style:none;counter-reset:it}
  #qp .items li{counter-increment:it;padding:9px 0;border-top:1px dashed #dde5ec;color:var(--navy);font-weight:bold;font-size:clamp(15px,4vw,19px);line-height:1.7}
  #qp .items li:before{content:counter(it,arabic-indic) ' - ';color:var(--hint)}
  #qp .items .tags{margin:4px 0 0}
  #qp .items .ia{display:none;color:var(--ok);background:var(--okbg);border-radius:8px;padding:2px 10px;margin-top:4px;width:fit-content}
  #qp .rev .items .ia{display:block}
  #qp .ans{display:none;margin-top:14px;border-radius:14px;background:var(--okbg);border:2px solid #9fd2b0;padding:12px 14px;color:#174d2a;font-size:clamp(15px,4vw,19px);line-height:1.9;font-weight:bold}
  #qp .rev .ans{display:block;animation:qin .25s ease}
  #qp .ans .h{color:var(--ok);font-size:14px;margin-bottom:2px}
  #qp .ans ol{margin:4px 0 0;padding-inline-start:26px;list-style:arabic-indic}
  #qp .ans dl{margin:0}.ans dt{color:var(--hint);display:inline}.ans dt:after{content:' : '}.ans dd{display:inline;margin:0}.ans dd:after{content:'';display:block}
  #qp .see{margin-top:14px;display:flex;justify-content:center}
  #qp .see button{height:42px;padding:0 18px;border-radius:21px;border:2px dashed var(--navy);background:#fff;color:var(--navy);font:bold 15px Tahoma,Arial,sans-serif;cursor:pointer}
  #qft{flex:none;height:84px;display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,14px);background:#fff;border-top:1px solid #dde5ec;padding:0 6px env(safe-area-inset-bottom,0px)}
  #qft button{min-width:clamp(88px,27vw,150px);height:54px;padding:0 clamp(8px,3vw,20px);border-radius:27px;border:3px solid var(--navy);background:#fff;color:var(--navy);font:bold clamp(15px,4vw,20px) Tahoma,Arial,sans-serif;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.2);white-space:nowrap}
  #qft #qa{border-color:var(--hint);background:var(--hint);color:#fff}
  #qft #qa.hide{background:#fff;color:var(--hint)}
  #qft button:disabled{opacity:.35;box-shadow:none;cursor:default}
  #hlbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2147482000;display:none;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:24px;padding:6px 6px 6px 14px;font-weight:bold;font-size:clamp(13px,3.4vw,16px);box-shadow:0 4px 12px rgba(0,0,0,.3);max-width:calc(100% - 140px);white-space:nowrap}
  #hlbar.on{display:flex}
  #hlbar span{overflow:hidden;text-overflow:ellipsis}
  #hlbar button{flex:none;height:34px;border-radius:17px;border:0;background:var(--hint);color:#fff;font:bold 14px Tahoma,Arial,sans-serif;padding:0 12px;cursor:pointer}
  body.hlmode #qbtn{display:none}
  #qp .tbw{overflow-x:auto;margin-top:6px;-webkit-overflow-scrolling:touch}
  #qp .tbw table{border-collapse:collapse;width:100%;table-layout:fixed;background:#fff;font-size:clamp(13px,3.5vw,16px);line-height:1.7}
  #qp .tbw th{background:var(--navy);color:#fff;padding:6px 8px;border:1px solid #9fb2c4}
  #qp .tbw td{padding:6px 8px;border:1px solid #c9d6e2;color:#174d2a;vertical-align:top;font-weight:bold}
  #qp .tbw tr:nth-child(even) td{background:#f4faf6}
  #qp .note{margin-top:8px;color:var(--hint);font-size:14px}
  .moe-fixed #qp,.moe-fixed #qbtn,.moe-fixed #hlbar{position:fixed}
  .moe-fixed #qp{z-index:2147483000}

<script>window.MOE_MIN_DATA={"sections":{},"names":{},"qs":[{"type":"اشرح","tags":["أسئلة الفصل"],"q":"اشرح عملية التكاثر اللاجنسي ( الانشطار الثنائي ) في البكتريا .","a":{"p":"تتكاثر البكتريا لاجنسياً بالانشطار الثنائي ويمكن إيجازها بالآتي :","ol":["يحصل اتصال للكروموسوم البكتيري في مواقع معينة من غشاء الخلية .","تتهيأ الخلية البكتيرية لعملية الانشطار الثنائي وذلك بتوسع جدار الخلية وغشائها وبالتالي الخلية بأكملها .","ينتج تضاعف ( DNA ) الخلية كروموسومين متماثلين ، وفي نفس الوقت يبدأ جدار الخلية وغشاؤها بالتخصر .","كنتيجة لاستطالة الخلية البكتيرية فإن الكروموسومين ينسحبان في اتجاهين متعاكسين ضمن الخلية ويتوزع السايتوبلازم في نفس الوقت ويزداد تخصر الخلية .","تنقسم الخلية لتنتج خليتين متماثلتين ."]}},{"type":"ما نوع","tags":["1/2005","2013 تمهيدي","1/2013","2020 تمهيدي"],"q":"ما نوع التكاثر اللاجنسي في البكتريا ؟","a":{"p":"الانشطار الثنائي ."}},{"type":"اختر","tags":["أسئلة الفصل","2024 تمهيدي","3/2024"],"q":"تتكاثر البكتريا لاجنسياً عن طريق :","opts":["التبرعم","الانشطار الثنائي","التجدد","تكوين الأبواغ"],"ans":1},{"type":"املأ الفراغ","tags":["2/2004","3/2014"],"q":"تضم البدائيات {البكتريا} و{الطحالب الخضر المزرقة} ."},{"type":"املأ الفراغ","tags":["2023 تمهيدي"],"q":"تتكاثر البكتريا لاجنسياً بـ {الانشطار الثنائي} وجنسياً بعملية {الاقتران} ."},{"type":"ارسم","tags":["2/1988","2/1993","1/2003","3/2014","1/2020","1/2019","2022 تمهيدي","2/2022"],"q":"ارسم مع التأشير التكاثر اللاجنسي في البكتريا ( الانشطار الثنائي ) .","a":{"p":"خمس مراحل ، والأجزاء المؤشرة : كروموسوم ، جدار الخلية ، الغشاء البلازمي ، سايتوبلازم . ( شاهد الرسم بالمحاكاة )"}}]};</script>
<script>
/* MoeLab — محرك الأسئلة الوزارية
   يُحقن تلقائياً داخل كل محاكاة لها أسئلة (لا تعدّل النسخ المحقونة يدوياً — عدّل هذا الملف ثم شغّل build.py).
   مبدأ الأمان: أي خطأ هنا يُخفي زر الوزاريات فقط ولا يؤثر على المحاكاة. */
(function(){try{
var D=window.MOE_MIN_DATA;if(!D||!D.qs||!D.qs.length)return;
var stage=document.getElementById('stage')||document.body;
/* محاكيات بقالب آخر (أزرار التكبير داخل .side خارج #stage): نضع العناصر فوق الصفحة كلها */
var ZB=document.querySelector('.zb')||(function(){var z=document.getElementById('zin');return z&&z.parentElement;})();
if(!document.querySelector('.zb')&&ZB&&!stage.contains(ZB)){stage=document.body;document.documentElement.classList.add('moe-fixed');}
var AR=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];});};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var tagK=function(s){return /الفصل|الكتاب|التلفزيون/.test(s)?'book':/خارج|الموصل|المتميزين|النازحين|المحاولات/.test(s)?'out':/تمهيدي|تكميلي/.test(s)?'pre':'min';};
var tagH=function(s){var k=tagK(s);return '<span class="tg '+k+'">'+esc(k==='book'?s:'وزاري '+s)+'</span>';};
var minCount=function(q){var t=(q.tags||[]).slice();(q.items||[]).forEach(function(i){t=t.concat(i.tags||[]);});return t.filter(function(s){return tagK(s)!=='book';}).length;};
var $=function(id){return document.getElementById(id);};

/* ---------- DOM ---------- */
var wrap=document.createElement('div');
wrap.innerHTML='<button id="qbtn" type="button" aria-label="الأسئلة الوزارية">📝 الوزاريات <b id="qcnt"></b></button>'+
 '<div id="hlbar"><span id="hlname"></span><button id="hlback" type="button">↩ رجوع للسؤال</button></div>'+
 '<div id="qp" role="dialog" aria-label="الأسئلة الوزارية">'+
  '<div id="qhd"><div class="t">📝 الأسئلة الوزارية</div><button id="qx" type="button" aria-label="إغلاق">✕</button></div>'+
  '<div id="qchips"></div><div id="qbody"></div>'+
  '<div id="qft"><button id="qprev" type="button">السابق ▶</button><button id="qa" type="button">إظهار الحل 💡</button><button id="qnext" type="button">التالي ◀</button></div>'+
 '</div>';
while(wrap.firstChild)stage.appendChild(wrap.firstChild);
/* place the button just to the right of the sim's zoom buttons (or under them if they are in a row) */
function placeBtn(){try{var b=$('qbtn'),zb=ZB,st=stage===document.body?{left:0,top:0,width:innerWidth,height:innerHeight}:stage.getBoundingClientRect();
  if(!zb){b.style.left='10px';b.style.top='10px';return;}
  var r=zb.getBoundingClientRect(),row=getComputedStyle(zb).flexDirection==='row';
  if(!r.width||!r.height){b.style.left='10px';b.style.top='10px';return;}
  var below=function(){b.style.left=Math.round(r.left-st.left)+'px';b.style.top=Math.round(r.bottom-st.top+8)+'px';};
  if(row||placeBtn.down){below();return;}
  b.style.left=Math.round(r.right-st.left+10)+'px';b.style.top=Math.round(r.top-st.top)+'px';
  /* if the sim shows its own caption/banner in that spot, move under the zoom buttons (and stay there) */
  var q=b.getBoundingClientRect(),hit=false;
  [].forEach.call(stage.querySelectorAll('*'),function(e){if(hit||e===b||(zb&&zb.contains(e))||e.closest('.zb,#qp,#hlbar,#qbtn'))return;
    if(e.parentElement!==stage&&!e.id)return;
    var cs=getComputedStyle(e);if(cs.position==='static'||cs.display==='none'||cs.visibility==='hidden'||!(e.textContent||'').trim())return;
    var x=e.getBoundingClientRect();if(!x.width||x.width>st.width*.9||x.height>120)return;
    if(x.left<q.right&&x.right>q.left&&x.top<q.bottom&&x.bottom>q.top)hit=true;});
  if(hit){placeBtn.down=true;below();}}catch(_){}}
placeBtn();setInterval(placeBtn,700);window.addEventListener('resize',placeBtn);document.addEventListener('fullscreenchange',function(){setTimeout(placeBtn,50);});

var qp=$('qp'),qbody=$('qbody'),qchips=$('qchips'),qa=$('qa'),qprev=$('qprev'),qnext=$('qnext');
var QS=D.qs,SEC=D.sections||{},NAMES=D.names||{};
$('qcnt').textContent=AR(QS.length);
var secKeys=Object.keys(SEC).filter(function(k){return QS.some(function(q){return q.sec===k;});});
if(secKeys.length<2)qchips.style.display='none';
var qsec='all',qi=0,qrev=false,qOpen=false;
var list=function(){return qsec==='all'?QS:QS.filter(function(q){return q.sec===qsec;});};
qchips.innerHTML=[['all','الكل']].concat(secKeys.map(function(k){return [k,SEC[k]];})).map(function(a){return '<button type="button" data-k="'+a[0]+'">'+esc(a[1])+'</button>';}).join('');
qchips.onclick=function(e){var b=e.target.closest('button');if(!b)return;qsec=b.dataset.k;qi=0;qrev=false;render();};

function ansH(a){var h='';if(!a)return h;if(a.p&&!a.tb)h+='<div>'+esc(a.p)+'</div>';
  if(a.ol)h+='<ol>'+a.ol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(a.tb)h+='<div class="tbw"><table><tr>'+a.tb.h.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>'+a.tb.r.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
  if(a.dl)h+='<dl>'+a.dl.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl>';if(a.p&&a.tb)h+='<div class="note">'+esc(a.p)+'</div>';return h;}
var SIM=null;function sim(){return SIM||(SIM=window.MOE_SIM||null);}
function canSee(k){var s=sim();return !!(k&&s&&s.groups&&s.groups[k]);}
function render(){try{render0();}catch(err){qOpen=false;qp.classList.remove('on');$('qbtn').style.display='none';if(window.console)console.warn('MoeLab ministerial:',err);}}
function render0(){
  var L=list(),q=L[qi];
  [].forEach.call(qchips.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===qsec);});
  var n=minCount(q);
  var h='<div class="qc'+(qrev?' rev':'')+'"><div class="qtop"><span class="qty">'+esc(q.type)+'</span>'+
    (n>=3?'<span class="qfire">🔥 تكرر وزارياً '+AR(n)+' مرات</span>':'')+'<span class="qnum">'+AR(qi+1)+' / '+AR(L.length)+'</span></div>';
  if(q.tags&&q.tags.length)h+='<div class="tags">'+q.tags.map(tagH).join('')+'</div>';
  h+='<div class="qq">'+esc(q.q).replace(/\{([^}]*)\}/g,'<span class="blank">$1</span>')+'</div>';
  if(q.opts)h+='<div class="opts">'+q.opts.map(function(o,k){return '<button type="button" class="opt'+(qrev&&k===q.ans?' ok':'')+'" data-k="'+k+'">'+'أبجد'[k]+' ) '+esc(o)+'</button>';}).join('')+'</div>';
  if(q.items)h+='<ol class="items">'+q.items.map(function(it){var t=it.tags||[];return '<li>'+esc(it.t)+(t.length?'<div class="tags">'+t.map(tagH).join('')+'</div>':'')+'<div class="ia">'+esc(it.a||q.common||'')+'</div></li>';}).join('')+'</ol>';
  if(q.a)h+='<div class="ans"><div class="h">✔ الجواب</div>'+ansH(q.a)+'</div>';
  if(canSee(q.hl))h+='<div class="see"><button type="button" id="qsee">📍 شوف '+esc(NAMES[q.hl]||'')+' بالمحاكاة</button></div>';
  qbody.innerHTML=h+'</div>';qbody.scrollTop=0;
  qa.textContent=qrev?'إخفاء الحل':'إظهار الحل 💡';qa.classList.toggle('hide',qrev);
  qprev.disabled=qi===0;qnext.disabled=qi>=L.length-1;
  [].forEach.call(qbody.querySelectorAll('.opt'),function(b){b.onclick=function(){if(+b.dataset.k===q.ans){qrev=true;render();}else b.classList.add('no');};});
  var s=$('qsee');if(s)s.onclick=function(){hlStart(q.hl);};
}
qa.onclick=function(){qrev=!qrev;render();};
qprev.onclick=function(){if(qi>0){qi--;qrev=false;render();}};
qnext.onclick=function(){if(qi<list().length-1){qi++;qrev=false;render();}};
function show(on){qOpen=on;qp.classList.toggle('on',on);if(on)render();}
$('qbtn').onclick=function(){hlStop();show(true);};
$('qx').onclick=function(){show(false);};

/* ---------- highlight inside the simulation (only if the sim registered window.MOE_SIM) ---------- */
var HL=null;
function els(keys,map){var a=[];keys.forEach(function(k){(map[k]||[]).forEach(function(e){a.push(e);});});return a;}
function bbox(arr){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;arr.forEach(function(e){try{var b=e.getBBox();if(!b.width&&!b.height)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}catch(_){}});return x0<x1?{x0:x0,y0:y0,x1:x1,y1:y1}:null;}
var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function hlStart(k){
  var s=sim();if(!canSee(k))return;show(false);
  try{s.finish();}catch(_){}
  var parts=s.groups[k],on=els(parts,s.parts),labs=els(parts,s.labels||{});
  var all=els(Object.keys(s.parts),s.parts),allL=els(Object.keys(s.labels||{}),s.labels||{});
  var v=s.view.get(),vb=s.view.box,b=bbox(on.concat(labs)),to=v;
  if(b){var pad=30,cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,ks=Math.max(1,Math.min(2.6,vb[2]/(b.x1-b.x0+2*pad),vb[3]/(b.y1-b.y0+2*pad)));
    to=[ks,vb[0]+vb[2]/2-cx*ks,vb[1]+vb[3]/2-cy*ks];}
  HL={k:k,s:s,on:new Set(on),labs:new Set(labs),all:all,allL:allL,glows:els(parts,s.glows||{}),t0:performance.now(),from:v,to:to};
  $('hlname').textContent='📍 '+(NAMES[k]||'');
  $('hlbar').classList.add('on');document.body.classList.add('hlmode');
  requestAnimationFrame(tick);
}
function hlStop(){if(!HL)return;var s=HL.s;HL=null;$('hlbar').classList.remove('on');document.body.classList.remove('hlmode');try{s.view.reset();}catch(_){}}
function tick(ms){
  if(!HL)return;
  try{
    var u=(ms-HL.t0)/1000,z=ease(Math.max(0,Math.min(1,u/.8))),L=function(a,b){return a+(b-a)*z;};
    HL.s.view.set(L(HL.from[0],HL.to[0]),L(HL.from[1],HL.to[1]),L(HL.from[2],HL.to[2]));
    var p=.5+.5*Math.sin(u*4.2);
    HL.all.forEach(function(e){if(!HL.on.has(e))e.setAttribute('opacity','0.18');});
    HL.allL.forEach(function(e){e.setAttribute('opacity',HL.labs.has(e)?'1':'0.15');});
    HL.glows.forEach(function(g){g.style.display='';g.setAttribute('opacity',(.35+.45*p).toFixed(2));});
    if(HL.s.pulse)HL.s.pulse(HL.k,p);
  }catch(e){hlStop();return;}
  requestAnimationFrame(tick);
}
$('hlback').onclick=function(){hlStop();show(true);};
/* any simulation button stops the highlight */
['go','prev','zreset'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',hlStop,true);});

/* keyboard: while the panel is open the arrows move between questions, not the simulation */
window.addEventListener('keydown',function(e){
  if(qOpen){e.stopImmediatePropagation();e.preventDefault();
    if(e.key==='ArrowLeft')qnext.click();else if(e.key==='ArrowRight')qprev.click();else if(e.key==='Escape')show(false);}
  else if(HL&&e.key==='Escape'){hlStop();}
},true);
}catch(err){try{var b=document.getElementById('qbtn');if(b)b.style.display='none';var p=document.getElementById('qp');if(p)p.style.display='none';}catch(_){} if(window.console)console.warn('MoeLab ministerial:',err);}})();

</script>
<!--MOE-MIN:END--></body>
