<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>أحداث الدورة المبيضية في أنثى الإنسان</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
  #go{min-width:170px;height:56px;padding:0 26px;border-radius:28px;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font:bold 21px Tahoma,"Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  #go:active{background:#d9ebf7}
  #go:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  .lb{fill:#1f3a52;font-size:19px;font-weight:bold;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
</style>
</head>
<body>
<div id="top"><div id="title">أحداث الدورة المبيضية في أنثى الإنسان</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 900 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gSt" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fdf1de"/><stop offset="1" stop-color="#f5d09c"/></radialGradient>
        <radialGradient id="gOo" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff5f7"/><stop offset=".6" stop-color="#f6bfcd"/><stop offset="1" stop-color="#e38aa2"/></radialGradient>
        <radialGradient id="gAnt" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f3f6fc"/><stop offset="1" stop-color="#b7c6e6"/></radialGradient>
        <radialGradient id="gF" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff2b8"/><stop offset=".55" stop-color="#f5b938"/><stop offset="1" stop-color="#c77a12"/></radialGradient>
        <radialGradient id="gCL" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fde3e9"/><stop offset=".6" stop-color="#f59ab2"/><stop offset="1" stop-color="#df5f80"/></radialGradient>
        <radialGradient id="gCLc" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#eeeaff"/><stop offset="1" stop-color="#b4aadf"/></radialGradient>
        <radialGradient id="gAlb" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f8e3f2"/><stop offset="1" stop-color="#d396c3"/></radialGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <pattern id="gran" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f8c74a"/><circle cx="2" cy="2" r="1.7" fill="#d9871a"/><circle cx="6" cy="6" r="1.7" fill="#e39a26"/></pattern>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl"><button id="go">ابدأ</button></div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const lp2=(p,q,u)=>[lerp(p[0],q[0],u),lerp(p[1],q[1],u)];
const bez=(a,c,b,u)=>lp2(lp2(a,c,u),lp2(c,b,u),u);
const show=(e,op)=>{if(op<.01){e.style.display='none';return false;}e.style.display='';e.setAttribute('opacity',f2(op));return true;};
const pop=v=>v*(1+.25*Math.sin(PI*v));

const DUR=[4,4.5,5,6,6,4.5,5,5];
const DARK='#1f2a44';
const world=G(view);
const Lova=G(world),Larr=G(world),Lobj=G(world),Llab=G(world),Ltok=G(world);

/* ---------------- building blocks ---------------- */
function Ball(parent,grad,r){const g=G(parent);
  el('circle',{r,fill:`url(#${grad})`,stroke:grad==='gF'?'#b06a0e':'#b8407f','stroke-width':1},g);
  el('ellipse',{cx:-r*.35,cy:-r*.4,rx:r*.3,ry:r*.2,fill:'#fff',opacity:.55},g);return{g,r};}
function setBall(b,p,s,op){if(!show(b.g,op*(s>.02?1:0)))return;b.g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f2(s)})`);}
function Arr(d,col){const g=G(Larr),p=el('path',{d,fill:'none',stroke:col,'stroke-width':3.2,'stroke-linecap':'round'},g),L=p.getTotalLength();
  const e=p.getPointAtLength(L),q=p.getPointAtLength(L-10),a=Math.atan2(e.y-q.y,e.x-q.x),c=Math.cos(a),s=Math.sin(a);
  const h=el('polygon',{points:[[e.x,e.y],[e.x-15*c+7*s,e.y-15*s-7*c],[e.x-15*c-7*s,e.y-15*s+7*c]].map(v=>v.map(f1).join(',')).join(' '),fill:col},g);
  return{g,p,h,L,at:u=>{const v=p.getPointAtLength(u*L);return[v.x,v.y];}};}
function drawArr(A,v){if(!show(A.g,v>.005?1:0))return;A.p.setAttribute('stroke-dasharray',`${f1(v*(A.L-8))} ${f1(A.L+20)}`);A.h.setAttribute('opacity',f2(sm(v,.9,1)));}
function lobed(R,n,amp,o){o=o||{};const ry=o.ry||1,ph=o.ph||0,a2=o.a2||0,n2=o.n2||0,N=180;let d='';
  for(let i=0;i<N;i++){const a=i/N*2*PI,w=o.abs?2*Math.abs(Math.cos(n*a/2+ph))-1:Math.cos(n*a+ph),r=R*(1+amp*w+a2*Math.sin(n2*a+1.3));
    d+=(i?'L':'M')+f1(r*Math.cos(a))+','+f1(r*ry*Math.sin(a));}return d+'Z';}
function Obj(x,y){return{g:G(Lobj),x,y};}
function setO(o,s,op){if(show(o.g,(op==null?1:op)*(s>.02?1:0)))o.g.setAttribute('transform',`translate(${o.x} ${o.y}) scale(${f2(s)})`);}
function Oocyte(p,r,zona){const g=G(p);
  if(zona)el('circle',{r:r*1.32,fill:'#fff',stroke:'#cdb8cf','stroke-width':1.2},g);
  el('circle',{r,fill:'url(#gOo)',stroke:'#c4607c','stroke-width':1.2},g);
  el('circle',{cx:-r*.12,cy:-r*.08,r:r*.38,fill:'#c94f6d'},g);
  el('circle',{cx:-r*.18,cy:-r*.14,r:r*.12,fill:'#7d1d3a'},g);return g;}
function Lab(lines,x,y,a,b){const g=G(Llab);
  el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#1f3a52','stroke-width':2},g);
  el('circle',{cx:b[0],cy:b[1],r:3.2,fill:'#1f3a52'},g);
  lines.forEach((s,i)=>{const t=el('text',{class:'lb',x,y:y+i*26},g);t.textContent=s;});return g;}

/* ---------------- ovary ---------------- */
const ovD='M130,425A320,235 0 1,1 770,425A320,235 0 1,1 130,425Z';
el('path',{d:ovD,fill:'none',stroke:'#e6ebf0','stroke-width':2,'stroke-dasharray':'8 10'},Lova);
const ovF=el('path',{d:ovD,fill:'url(#gSt)'},Lova);
const ovS=el('path',{d:ovD,fill:'none',stroke:'#e0873a','stroke-width':9,'stroke-linejoin':'round'},Lova);
const ovS2=el('path',{d:ovD,fill:'none',stroke:'#f7bd7a','stroke-width':3},Lova);
const OL=ovS.getTotalLength();

/* ---------------- follicles ---------------- */
/* 1 primordial */
const F1=Obj(255,320);
el('circle',{r:13,fill:'url(#gran)',stroke:'#c77a12','stroke-width':1.5},F1.g);Oocyte(F1.g,8,false);
/* 2 primary */
const F2=Obj(345,268);
el('circle',{r:28,fill:'url(#gran)',stroke:'#c77a12','stroke-width':2},F2.g);
const z2=el('circle',{r:12,fill:'#fff',stroke:'#cdb8cf','stroke-width':1.2},F2.g);Oocyte(F2.g,12,false);
/* 3 secondary */
const F3=Obj(475,265);
el('circle',{r:46,fill:'#eaa9cc',stroke:'#a8326f','stroke-width':2.5},F3.g);
el('circle',{r:40,fill:'url(#gran)',stroke:'#c77a12','stroke-width':1.5},F3.g);
const cav=[[-20,-14,8,5,-40],[-24,8,7,5,20],[-6,24,7,4.5,70],[-10,-27,5,3.5,-70],[12,26,5,3.5,100]].map(([x,y,rx,ry,rot])=>
  el('ellipse',{cx:x,cy:y,rx,ry,fill:'url(#gAnt)',stroke:'#93a8d2','stroke-width':1,transform:`rotate(${rot} ${x} ${y})`},F3.g));
Oocyte(G(F3.g,{transform:'translate(10 -4)'}),13,true);
/* 4 mature */
const F4=Obj(650,395);
el('circle',{r:86,fill:'#eaa9cc',stroke:'#a8326f','stroke-width':3},F4.g);
el('circle',{r:79,fill:'url(#gran)',stroke:'#c77a12','stroke-width':1.5},F4.g);
const ant=el('path',{d:lobed(50,5,.1,{a2:.05,n2:3}),fill:'url(#gAnt)',stroke:'#93a8d2','stroke-width':1.5},F4.g);
const cum=G(F4.g,{transform:'translate(38 32)'});
el('circle',{r:26,fill:'url(#gran)'},cum);
Oocyte(cum,15,true);
const pb=el('circle',{r:0,fill:'url(#gOo)',stroke:'#c4607c','stroke-width':1},cum);
/* 5 ovulation */
const F5=Obj(628,575);
el('path',{d:lobed(36,7,.16,{a2:.08,n2:13}),fill:'#eaa9cc',stroke:'#a8326f','stroke-width':2.5},F5.g);
el('path',{d:lobed(28,9,.2,{a2:.1,n2:5}),fill:'url(#gran)'},F5.g);
el('path',{d:lobed(17,6,.35,{ph:1}),fill:'url(#gAnt)',stroke:'#93a8d2','stroke-width':1},F5.g);
el('path',{d:'M8,-2Q30,8 48,22L40,34Q22,20 2,10Z',fill:'url(#gAnt)'},F5.g);
const glO=el('circle',{cx:628,cy:575,r:75,fill:'url(#gGlow)',opacity:0},Ltok);
const DR=[];for(let i=0;i<16;i++){const a=(28+(i/15-.5)*70)*PI/180,d=45+(i*37%50);
  DR.push({a,d,c:el('circle',{r:i%3?2.6:3.6,fill:i%2?'#f2b13a':'#c3d0ec',stroke:i%2?'#c77a12':'#8ea3cc','stroke-width':.8},Lobj)});}
const RO=G(Lobj);
el('circle',{r:25,fill:'url(#gran)',stroke:'#c77a12','stroke-width':1.2},RO);
Oocyte(RO,13,true);
el('circle',{cx:11,cy:-11,r:3.6,fill:'url(#gOo)',stroke:'#c4607c','stroke-width':1},RO);
/* 6 early corpus luteum */
const F6=Obj(500,600);
el('path',{d:lobed(34,7,.14,{a2:.06,n2:11}),fill:'#f2a6bd',stroke:'#b8407f','stroke-width':2.5},F6.g);
const c6=el('path',{d:lobed(19,6,.3,{ph:.5,a2:.1,n2:9}),fill:'#b3164f'},F6.g);
/* 7 corpus luteum */
const F7=Obj(335,525);
el('path',{d:lobed(64,11,.09,{abs:1}),fill:'url(#gCL)',stroke:'#c94f75','stroke-width':2.5},F7.g);
el('path',{d:lobed(44,11,.08,{abs:1,ph:.3}),fill:'none',stroke:'#e47f9e','stroke-width':2},F7.g);
const c7=el('path',{d:lobed(17,6,.35,{abs:1}),fill:'url(#gCLc)',stroke:'#8f86c2','stroke-width':1.2},F7.g);
/* 8 corpus albicans */
const F8=Obj(200,415);
el('path',{d:lobed(28,9,.13,{abs:1,ry:.62}),fill:'url(#gAlb)',stroke:'#9c4589','stroke-width':2},F8.g);
el('path',{d:lobed(15,7,.3,{ry:.5,ph:.4}),fill:'none',stroke:'#a6559a','stroke-width':1.4},F8.g);
el('path',{d:'M-18,0Q-12,-6 -6,0T6,0T18,0',fill:'none',stroke:'#a6559a','stroke-width':1.4},F8.g);

/* ---------------- arrows ---------------- */
const AR=[
  Arr('M270,310Q290,290 316,280',DARK),
  Arr('M377,262Q402,250 425,258',DARK),
  Arr('M525,258Q575,262 590,328',DARK),
  Arr('M645,486Q642,510 634,532',DARK),
  Arr('M588,585Q565,600 544,600',DARK),
  Arr('M460,604Q430,600 405,562',DARK),
  Arr('M276,474Q250,462 222,436',DARK)];

/* ---------------- labels ---------------- */
const L1=Lab(['مرحلة تكوّن','الحوصلة البدائية'],160,140,[180,180],[250,308]);
const L2=Lab(['مرحلة تكوّن','الحوصلة الأولية'],320,90,[328,130],[343,241]);
const L3=Lab(['مرحلة الحوصلة','الثانوية'],490,40,[488,80],[476,219]);
const L4=Lab(['مرحلة الحوصلة','الناضجة'],795,205,[775,245],[712,333]);
const L4b=Lab(['جسم قطبي أول'],835,360,[772,362],[702,413]);
const L4c=Lab(['خلية بيضية','ثانوية'],840,450,[785,452],[704,431]);
const L5=Lab(['مرحلة الإباضة'],640,700,[640,686],[628,610]);
const L7=Lab(['الجسم الأصفر'],320,690,[322,676],[330,595]);
const L8=Lab(['يضمحل الجسم الأصفر عند','عدم حصول حمل عند المرأة','ويتحول إلى كتلة صغيرة','تدعى الجسم الأبيض'],118,505,[150,490],[184,428]);
L8.querySelectorAll('text').forEach(t=>t.style.fontSize='17px');

/* travelling tokens */
const tkY=Ball(Ltok,'gF',10),tkP=Ball(Ltok,'gCL',10);
const TK=[[tkY,1.1,1.8,.05,.5],[tkY,1.8,2.4,.05,.5],[tkY,2,2.6,.05,.4],[tkY,1.3,1.3,.05,.3],[tkP,1.2,1.8,.05,.45],[tkP,1.8,2.3,.05,.45],[tkP,2.1,1.3,.05,.45]];

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:0,dur:1};
let stage=-1,T=0,t0=0,last=performance.now(),P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

function render(t){
  const u=i=>clamp(P-(i-1),0,1),s=[0,1,2,3,4,5,6,7,8].map(u);
  const br=k=>1+.03*Math.sin(t*1.6+k);

  /* 1 ovary + primordial follicle */
  const ov=sm(s[1],0,.5);
  [ovS,ovS2].forEach(p=>{if(show(p,ov>.003?1:0))p.setAttribute('stroke-dasharray',`${f1(ov*OL)} ${f1(OL+20)}`);});
  show(ovF,sm(s[1],.3,.6));
  setO(F1,pop(sm(s[1],.55,.75))*br(1));show(L1,sm(s[1],.7,.95));
  /* 2 primary */
  drawArr(AR[0],sm(s[2],0,.45));
  setO(F2,pop(sm(s[2],.5,.7))*br(2));z2.setAttribute('r',f1(lerp(12,17,sm(s[2],.65,.85))));
  show(L2,sm(s[2],.75,.95));
  /* 3 secondary */
  drawArr(AR[1],sm(s[3],0,.45));
  setO(F3,pop(sm(s[3],.5,.68))*br(3));
  cav.forEach((c,i)=>show(c,sm(s[3],.6+.06*i,.72+.06*i)));
  show(L3,sm(s[3],.8,.97));
  /* 4 mature */
  drawArr(AR[2],sm(s[4],0,.35));
  setO(F4,pop(sm(s[4],.38,.55))*br(4));
  ant.setAttribute('transform',`translate(-12 -10) scale(${f2(lerp(.25,1,sm(s[4],.45,.72)))})`);
  const pv=sm(s[4],.65,.82);
  pb.setAttribute('cx',f1(lerp(5,12.5,pv)));pb.setAttribute('cy',f1(lerp(-5,-12.5,pv)));pb.setAttribute('r',f1(4*pv));
  show(L4,sm(s[4],.5,.7));show(L4b,sm(s[4],.8,.93));show(L4c,sm(s[4],.84,.97));
  /* 5 ovulation */
  drawArr(AR[3],sm(s[5],0,.3));
  setO(F5,pop(sm(s[5],.28,.42))*br(5));
  glO.setAttribute('opacity',f2(.9*Math.sin(PI*sm(s[5],.3,.75))));
  DR.forEach((o,i)=>{const e=sm(s[5],.36+.012*i,.75);
    if(show(o.c,e>0?lerp(1,.5,sm(e,.7,1)):0)){const r=16+o.d*e;o.c.setAttribute('cx',f1(628+r*Math.cos(o.a)));o.c.setAttribute('cy',f1(575+r*Math.sin(o.a)));}});
  const e5=sm(s[5],.4,.82),rp=bez([628,575],[715,590],[772,650],e5);
  if(show(RO,s[5]>.36?1:0))RO.setAttribute('transform',`translate(${f1(rp[0])} ${f1(rp[1])}) scale(${f2(lerp(.55,1,e5)*br(6))})`);
  show(L5,sm(s[5],.78,.96));
  /* 6 early corpus luteum */
  drawArr(AR[4],sm(s[6],0,.4));
  setO(F6,pop(sm(s[6],.42,.65))*br(7));c6.setAttribute('transform',`scale(${f2(sm(s[6],.55,.8))})`);
  /* 7 corpus luteum */
  drawArr(AR[5],sm(s[7],0,.4));
  setO(F7,pop(sm(s[7],.42,.75))*br(8));c7.setAttribute('transform',`scale(${f2(sm(s[7],.6,.85))})`);
  show(L7,sm(s[7],.75,.95));
  /* 8 corpus albicans */
  drawArr(AR[6],sm(s[8],0,.4));
  setO(F8,pop(sm(s[8],.45,.7))*br(9));show(L8,sm(s[8],.7,.95));
  /* tokens */
  const used=new Set();
  TK.forEach(([tk,a,b,w0,w1],i)=>{const v=s[i+2];if(v>w0&&v<w1+.06&&!used.has(tk)){used.add(tk);
    setBall(tk,AR[i].at(sm(v,w0,w1)),lerp(a,b,sm(v,w0,w1)),1-sm(v,w1,w1+.06));}});
  [tkY,tkP].forEach(tk=>{if(!used.has(tk))show(tk.g,0);});
}

/* ---------------- one button ---------------- */
const btn=document.getElementById('go');
function go(i){const tgt=i+1;let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1,d);}
btn.onclick=()=>{if(stage>=DUR.length-1){P=0;stage=-1;}go(stage+1);};
let lbl='';
let paused=false;
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render(T);
  const nl=stage<0?'ابدأ':(stage>=DUR.length-1&&P>DUR.length-.001)?'إعادة ⟲':'التالي ◀';
  if(nl!==lbl){btn.textContent=nl;lbl=nl;}
  requestAnimationFrame(frame);}

/* ---------------- zoom & pan (gestures) ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();

"],"q":"ما منشأ الإيستروجين ؟","a":{"p":"الحوصلة المبيضية ."}},{"type":"ما موقع","tags":["2014 تمهيدي"],"q":"ما موقع هرمون البروجيسترون ؟","a":{"p":"رحم أو جدار رحم أنثى الإنسان ."}},{"type":"عرّف","tags":["2/1988"],"q":"عرّف هرمون المودق ( الإيستروجين ) ؟","a":{"p":"وهو هرمون يفرز من قبل الحويصلات المبيضية في الجهاز التناسلي الأنثوي في الإنسان ويعمل على تثخن أو تسمك في جدار الرحم الداخلي ويصبح وعائي وغدي ."}},{"type":"املأ الفراغ","tags":["1/2019","2025 تمهيدي","1/2024"],"q":"في الدورة المبيضية لأنثى الإنسان هرمونات جنسية أنثوية هي {المودق ( الإيستروجين )} و{هرمون البروجسترون} ."},{"type":"املأ الفراغ","tags":["أسئلة الفصل"],"q":"يعتمد إفراز حليب أنثى الإنسان على {استمرار الطفل في الرضاعة} ."},{"type":"املأ الفراغ","tags":["1/2023"],"q":"خلال الأيام ( 6-13 ) من الدورة الرحمية يزداد إنتاج هرمون {الإيستروجين ( المودق )} بوساطة {الحوصلة المبيضية أو حويصلة كراف} ."},{"type":"املأ الفراغ","tags":["2/2017 أسئلة خارج القطر"],"q":"خلال الأيام ( 15-28 ) من الدورة الرحمية يزداد إنتاج هرمون {البروجسترون} ."},{"type":"عدّد","tags":["1/2019 أسئلة خارج القطر","2/2021 تكميلي"],"q":"ما الهرمونات التي تسيطر على الدورة المبيضية لأنثى الإنسان ؟","a":{"ol":["الهرمونات المحفزة للمناسل .","الهرمون المحفز للحويصلات FSH .","الهرمون المحفز للجسم الأصفر LH ."]}},{"type":"حدد المسؤول","tags":["1/2020"],"q":"حدد المسؤول عن : إفراز هرمون البروجيسترون خلال الأشهر الأخيرة من الحمل .","a":{"p":"المشيمة ."}},{"type":"ما وظيفة","tags":["1/2023 أسئلة المتميزين"],"q":"ما وظيفة المشيمة ؟","a":{"p":"تعمل كغدة صماء لتعطي الكمية اللازمة من هرمون البروجسترون إلى جدار الرحم مباشرة بدلاً من إفرازه في مجرى الدم من الشهر الخامس حتى الولادة ."}},{"type":"حدد المسؤول","tags":["1/2022 أسئلة المتميزين"],"q":"حدد المسؤول عن : الدورة الحيضية التي تحدث خلال ( 1 - 5 ) من الدورة الرحمية .","a":{"p":"انخفاض مستوى الهرمونات الجنسية ( الإيستروجين والبروجسترون ) ."}},{"type":"حدد المسؤول","tags":["2/2023 أسئلة المتميزين"],"q":"حدد المسؤول عن : الدورة الرحمية .","a":{"p":"الهرمونات الجنسية الأنثوية هي المودق ( الإيستروجين ) وهرمون البروجسترون ."}},{"type":"وضّح","tags":["1/2023 أسئلة المتميزين"],"q":"ما أحداث طور النشوء اليوم ( 6 - 13 ) من الدورة الرحمية ؟","a":{"p":"يعاد إصلاح جدار الرحم الداخلي ، أو : يزداد إنتاج هرمون الإيستروجين ( المودق ) بوساطة الحوصلة المبيضية ويحصل تثخن أو تسمك في جدار الرحم الداخلي ويصبح وعائي وغدي ."}},{"type":"متى تحدث","tags":["1/2022"],"q":"متى تحصل : الإباضة ؟","a":{"p":"اليوم الرابع عشر من الدورة المبيضية ."}},{"type":"وضّح","tags":["1/2021","أسئلة الفصل"],"q":"ما أحداث الدورة الرحمية في الإنسان ( كيف تقسم أيام الدورة الرحمية حسب أحداثها ) ؟","a":{"ol":["خلال الأيام 1-5 يكون مستوى الهرمونات الجنسية واطئ مما يؤدي إلى تمزق في جدار الرحم والأوعية الدموية فيه ، ويخرج الدم إلى الخارج عن طريق المهبل خلال الحيض .","خلال الأيام 6-13 يزداد إنتاج هرمون الإيستروجين ( المودق ) بوساطة الحوصلة المبيضية ويحصل تثخن أو تسمك في جدار الرحم الداخلي ويصبح وعائي وغدي ، وهذا ما يدعى بطور التكاثر في الدورة الرحمية ، تحصل الإباضة عادة في اليوم 14 من دورة الـ 28 يوم .","خلال الأيام 15-28 يزداد إنتاج البروجسترون بوساطة الجسم الأصفر مسبباً زيادة مضاعفة في سمك جدار الرحم الداخلي وزيادة الغدد الرحمية التي تنتج إفرازات مخاطية ، وهذا يطلق عليها بالطور الإفرازي من الدورة الرحمية ، والجدار الداخلي للرحم في هذه الحالة مهيأً لاستقبال الجنين النامي ."]}},{"type":"ما ميزة","tags":["1/2025"],"q":"ما مميزات الأيام ( 1 - 5 ) من الدورة الرحمية في أنثى الإنسان ؟","a":{"ol":["يكون مستوى الهرمونات الجنسية واطئ مما يؤدي إلى تمزق في جدار الرحم والأوعية الدموية فيه .","يخرج الدم إلى الخارج عن طريق المهبل خلال الحيض ."]}},{"type":"ما ميزة","tags":["1/2025"],"q":"ما مميزات الأيام ( 15 - 28 ) من الدورة الرحمية في أنثى الإنسان ؟","a":{"p":"يزداد إنتاج البروجسترون بوساطة الجسم الأصفر مسبباً زيادة مضاعفة في سمك جدار الرحم الداخلي وزيادة الغدد الرحمية التي تنتج إفرازات مخاطية ، وهو الطور الإفرازي ، والجدار الداخلي للرحم يكون مهيأً لاستقبال الجنين النامي ."}}]};</script>
<script>
/* MoeLab — محرك الأسئلة الوزارية
   يُحقن تلقائياً داخل كل محاكاة لها أسئلة (لا تعدّل النسخ المحقونة يدوياً — عدّل هذا الملف ثم شغّل build.py).
   مبدأ الأمان: أي خطأ هنا يُخفي زر الوزاريات فقط ولا يؤثر على المحاكاة. */
(function(){try{
var D=window.MOE_MIN_DATA;if(!D||!D.qs||!D.qs.length)return;
var stage=document.getElementById('stage')||document.body;
var AR=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];});};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var tagK=function(s){return /الفصل|الكتاب|التلفزيون/.test(s)?'book':/خارج|الموصل|المتميزين|النازحين|المحاولات/.test(s)?'out':/تمهيدي|تكميلي/.test(s)?'pre':'min';};
var tagH=function(s){var k=tagK(s);return '<span class="tg '+k+'">'+esc(k==='book'?s:'وزاري '+s)+'</span>';};
var minCount=function(q){var t=(q.tags||[]).slice();(q.items||[]).forEach(function(i){t=t.concat(i.tags||[]);});return t.filter(function(s){return tagK(s)!=='book';}).length;};
var $=function(id){return document.getElementById(id);};

/* ---------- DOM ---------- */
var wrap=document.createElement('div');
wrap.innerHTML='<button id="qbtn" type="button" aria-label="الأسئلة الوزارية">📝 الوزاريات <b id="qcnt"></b></button>'+
 '<div id="hlbar"><span id="hlname"></span><button id="hlback" type="button">↩ رجوع للسؤال</button></div>'+
 '<div id="qp" role="dialog" aria-label="الأسئلة الوزارية">'+
  '<div id="qhd"><div class="t">📝 الأسئلة الوزارية</div><button id="qx" type="button" aria-label="إغلاق">✕</button></div>'+
  '<div id="qchips"></div><div id="qbody"></div>'+
  '<div id="qft"><button id="qprev" type="button">السابق ▶</button><button id="qa" type="button">إظهار الحل 💡</button><button id="qnext" type="button">التالي ◀</button></div>'+
 '</div>';
while(wrap.firstChild)stage.appendChild(wrap.firstChild);
/* place the button just to the right of the sim's zoom buttons (or under them if they are in a row) */
function placeBtn(){try{var b=$('qbtn'),zb=document.querySelector('.zb'),st=stage.getBoundingClientRect();
  if(!zb){b.style.left='10px';b.style.top='10px';return;}
  var r=zb.getBoundingClientRect(),row=getComputedStyle(zb).flexDirection==='row';
  if(!r.width||!r.height){b.style.left='10px';b.style.top='10px';return;}
  var below=function(){b.style.left=Math.round(r.left-st.left)+'px';b.style.top=Math.round(r.bottom-st.top+8)+'px';};
  if(row||placeBtn.down){below();return;}
  b.style.left=Math.round(r.right-st.left+10)+'px';b.style.top=Math.round(r.top-st.top)+'px';
  /* if the sim shows its own caption/banner in that spot, move under the zoom buttons (and stay there) */
  var q=b.getBoundingClientRect(),hit=false;
  [].forEach.call(stage.querySelectorAll('*'),function(e){if(hit||e===b||e.closest('.zb,#qp,#hlbar,#qbtn'))return;
    if(e.parentElement!==stage&&!e.id)return;
    var cs=getComputedStyle(e);if(cs.position==='static'||cs.display==='none'||cs.visibility==='hidden'||!(e.textContent||'').trim())return;
    var x=e.getBoundingClientRect();if(!x.width||x.width>st.width*.9||x.height>120)return;
    if(x.left<q.right&&x.right>q.left&&x.top<q.bottom&&x.bottom>q.top)hit=true;});
  if(hit){placeBtn.down=true;below();}}catch(_){}}
placeBtn();setInterval(placeBtn,700);window.addEventListener('resize',placeBtn);document.addEventListener('fullscreenchange',function(){setTimeout(placeBtn,50);});

var qp=$('qp'),qbody=$('qbody'),qchips=$('qchips'),qa=$('qa'),qprev=$('qprev'),qnext=$('qnext');
var QS=D.qs,SEC=D.sections||{},NAMES=D.names||{};
$('qcnt').textContent=AR(QS.length);
var secKeys=Object.keys(SEC).filter(function(k){return QS.some(function(q){return q.sec===k;});});
if(secKeys.length<2)qchips.style.display='none';
var qsec='all',qi=0,qrev=false,qOpen=false;
var list=function(){return qsec==='all'?QS:QS.filter(function(q){return q.sec===qsec;});};
qchips.innerHTML=[['all','الكل']].concat(secKeys.map(function(k){return [k,SEC[k]];})).map(function(a){return '<button type="button" data-k="'+a[0]+'">'+esc(a[1])+'</button>';}).join('');
qchips.onclick=function(e){var b=e.target.closest('button');if(!b)return;qsec=b.dataset.k;qi=0;qrev=false;render();};

function ansH(a){var h='';if(!a)return h;if(a.p&&!a.tb)h+='<div>'+esc(a.p)+'</div>';
  if(a.ol)h+='<ol>'+a.ol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(a.tb)h+='<div class="tbw"><table><tr>'+a.tb.h.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>'+a.tb.r.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
  if(a.dl)h+='<dl>'+a.dl.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl>';if(a.p&&a.tb)h+='<div class="note">'+esc(a.p)+'</div>';return h;}
var SIM=null;function sim(){return SIM||(SIM=window.MOE_SIM||null);}
function canSee(k){var s=sim();return !!(k&&s&&s.groups&&s.groups[k]);}
function render(){try{render0();}catch(err){qOpen=false;qp.classList.remove('on');$('qbtn').style.display='none';if(window.console)console.warn('MoeLab ministerial:',err);}}
function render0(){
  var L=list(),q=L[qi];
  [].forEach.call(qchips.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===qsec);});
  var n=minCount(q);
  var h='<div class="qc'+(qrev?' rev':'')+'"><div class="qtop"><span class="qty">'+esc(q.type)+'</span>'+
    (n>=3?'<span class="qfire">🔥 تكرر وزارياً '+AR(n)+' مرات</span>':'')+'<span class="qnum">'+AR(qi+1)+' / '+AR(L.length)+'</span></div>';
  if(q.tags&&q.tags.length)h+='<div class="tags">'+q.tags.map(tagH).join('')+'</div>';
  h+='<div class="qq">'+esc(q.q).replace(/\{([^}]*)\}/g,'<span class="blank">$1</span>')+'</div>';
  if(q.opts)h+='<div class="opts">'+q.opts.map(function(o,k){return '<button type="button" class="opt'+(qrev&&k===q.ans?' ok':'')+'" data-k="'+k+'">'+'أبجد'[k]+' ) '+esc(o)+'</button>';}).join('')+'</div>';
  if(q.items)h+='<ol class="items">'+q.items.map(function(it){var t=it.tags||[];return '<li>'+esc(it.t)+(t.length?'<div class="tags">'+t.map(tagH).join('')+'</div>':'')+'<div class="ia">'+esc(it.a||q.common||'')+'</div></li>';}).join('')+'</ol>';
  if(q.a)h+='<div class="ans"><div class="h">✔ الجواب</div>'+ansH(q.a)+'</div>';
  if(canSee(q.hl))h+='<div class="see"><button type="button" id="qsee">📍 شوف '+esc(NAMES[q.hl]||'')+' بالمحاكاة</button></div>';
  qbody.innerHTML=h+'</div>';qbody.scrollTop=0;
  qa.textContent=qrev?'إخفاء الحل':'إظهار الحل 💡';qa.classList.toggle('hide',qrev);
  qprev.disabled=qi===0;qnext.disabled=qi>=L.length-1;
  [].forEach.call(qbody.querySelectorAll('.opt'),function(b){b.onclick=function(){if(+b.dataset.k===q.ans){qrev=true;render();}else b.classList.add('no');};});
  var s=$('qsee');if(s)s.onclick=function(){hlStart(q.hl);};
}
qa.onclick=function(){qrev=!qrev;render();};
qprev.onclick=function(){if(qi>0){qi--;qrev=false;render();}};
qnext.onclick=function(){if(qi<list().length-1){qi++;qrev=false;render();}};
function show(on){qOpen=on;qp.classList.toggle('on',on);if(on)render();}
$('qbtn').onclick=function(){hlStop();show(true);};
$('qx').onclick=function(){show(false);};

/* ---------- highlight inside the simulation (only if the sim registered window.MOE_SIM) ---------- */
var HL=null;
function els(keys,map){var a=[];keys.forEach(function(k){(map[k]||[]).forEach(function(e){a.push(e);});});return a;}
function bbox(arr){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;arr.forEach(function(e){try{var b=e.getBBox();if(!b.width&&!b.height)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}catch(_){}});return x0<x1?{x0:x0,y0:y0,x1:x1,y1:y1}:null;}
var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function hlStart(k){
  var s=sim();if(!canSee(k))return;show(false);
  try{s.finish();}catch(_){}
  var parts=s.groups[k],on=els(parts,s.parts),labs=els(parts,s.labels||{});
  var all=els(Object.keys(s.parts),s.parts),allL=els(Object.keys(s.labels||{}),s.labels||{});
  var v=s.view.get(),vb=s.view.box,b=bbox(on.concat(labs)),to=v;
  if(b){var pad=30,cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,ks=Math.max(1,Math.min(2.6,vb[2]/(b.x1-b.x0+2*pad),vb[3]/(b.y1-b.y0+2*pad)));
    to=[ks,vb[0]+vb[2]/2-cx*ks,vb[1]+vb[3]/2-cy*ks];}
  HL={k:k,s:s,on:new Set(on),labs:new Set(labs),all:all,allL:allL,glows:els(parts,s.glows||{}),t0:performance.now(),from:v,to:to};
  $('hlname').textContent='📍 '+(NAMES[k]||'');
  $('hlbar').classList.add('on');document.body.classList.add('hlmode');
  requestAnimationFrame(tick);
}
function hlStop(){if(!HL)return;var s=HL.s;HL=null;$('hlbar').classList.remove('on');document.body.classList.remove('hlmode');try{s.view.reset();}catch(_){}}
function tick(ms){
  if(!HL)return;
  try{
    var u=(ms-HL.t0)/1000,z=ease(Math.max(0,Math.min(1,u/.8))),L=function(a,b){return a+(b-a)*z;};
    HL.s.view.set(L(HL.from[0],HL.to[0]),L(HL.from[1],HL.to[1]),L(HL.from[2],HL.to[2]));
    var p=.5+.5*Math.sin(u*4.2);
    HL.all.forEach(function(e){if(!HL.on.has(e))e.setAttribute('opacity','0.18');});
    HL.allL.forEach(function(e){e.setAttribute('opacity',HL.labs.has(e)?'1':'0.15');});
    HL.glows.forEach(function(g){g.style.display='';g.setAttribute('opacity',(.35+.45*p).toFixed(2));});
    if(HL.s.pulse)HL.s.pulse(HL.k,p);
  }catch(e){hlStop();return;}
  requestAnimationFrame(tick);
}
$('hlback').onclick=function(){hlStop();show(true);};
/* any simulation button stops the highlight */
['go','prev','zreset'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',hlStop,true);});

/* keyboard: while the panel is open the arrows move between questions, not the simulation */
window.addEventListener('keydown',function(e){
  if(qOpen){e.stopImmediatePropagation();e.preventDefault();
    if(e.key==='ArrowLeft')qnext.click();else if(e.key==='ArrowRight')qprev.click();else if(e.key==='Escape')show(false);}
  else if(HL&&e.key==='Escape'){hlStop();}
},true);
}catch(err){try{var b=document.getElementById('qbtn');if(b)b.style.display='none';var p=document.getElementById('qp');if(p)p.style.display='none';}catch(_){} if(window.console)console.warn('MoeLab ministerial:',err);}})();

</script>
