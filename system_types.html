<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>أنواع النظام</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#eef6fb;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;gap:12px;background:#1f3a52}
  #title{color:#fff;font-size:clamp(14px,3.6vw,22px);font-weight:bold}
  #badge{min-width:34px;height:34px;border-radius:50%;background:#fff;color:#1f3a52;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:radial-gradient(circle at 50% 45%,#f6fcff 0%,#cfe8f3 100%)}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;transition:opacity .3s}
  #ctrl{position:absolute;bottom:14px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px;pointer-events:none}
  #ctrl>*{pointer-events:auto}
  .nav{width:60px;height:60px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:26px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .nav:active{background:#d9ebf7}
  #dots{display:flex;gap:12px;align-items:center}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  .zb{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .zb button{display:flex;align-items:center;justify-content:center;padding:0}
  .zb svg{width:20px;height:20px;cursor:pointer;pointer-events:none}
  .pill{fill:#fff;stroke:#c4623a;stroke-width:2.5}
  .lbl{fill:#a8431b;font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .ln{stroke:#c4623a;stroke-width:2.2;fill:none}
  .td{fill:#c4623a;stroke:#fff;stroke-width:1.5}
  .hd{transition:opacity .35s}
  .hName{fill:#1f3a52;font-size:32px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .hEn{fill:#3f6f93;font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .capBox{fill:#1f3a52}
  .capTxt{fill:#fff;font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<div id="top"><div id="title">أنواع النظام</div><div id="badge"></div></div>
<div id="stage">
  <div class="zb"><button id="zin">+</button><button id="zout">−</button><button id="zreset">⟲</button><button id="fs" title="ملء الشاشة"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path id="fsI" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
  <svg id="svg" viewBox="0 0 900 760" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="gGlass" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#c9e6f5"/><stop offset=".35" stop-color="#eef8fd"/><stop offset="1" stop-color="#bfe0f1"/></linearGradient>
      <linearGradient id="gLiq" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbeb8c"/><stop offset="1" stop-color="#ecc53e"/></linearGradient>
      <linearGradient id="gShell" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#5d6164"/><stop offset=".3" stop-color="#9a9ea1"/><stop offset=".7" stop-color="#7d8184"/><stop offset="1" stop-color="#55595c"/></linearGradient>
      <linearGradient id="gCork" x1="0" x2="1"><stop offset="0" stop-color="#4a3322"/><stop offset=".45" stop-color="#7a5638"/><stop offset="1" stop-color="#3f2b1c"/></linearGradient>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <clipPath id="cFlask"><path id="flaskClip"/></clipPath>
      <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d63a3a"/></marker>
      <marker id="ahG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a8d90"/></marker>
    </defs>
    <g id="view"></g>
  </svg>
  <div id="ctrl">
    <button class="nav" id="prev">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next">◀</button>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg", PI=Math.PI;
const svg=document.getElementById('svg'), view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};

/* ---------- stages: 0 تمهيد، 1 مفتوح، 2 مغلق، 3 معزول ---------- */
const S=[
 {cap:0,th:0,open:1,vap:.55,aV:0,aH:0,blk:0,lb:{bnd:1,sys:1,env:1,vap:0,cap:0,ins:0,heat:0}},
 {cap:0,th:0,open:1,vap:1,  aV:1,aH:1,blk:0,lb:{bnd:0,sys:1,env:1,vap:1,cap:0,ins:0,heat:1}},
 {cap:1,th:0,open:0,vap:1,  aV:0,aH:1,blk:0,lb:{bnd:0,sys:1,env:1,vap:0,cap:1,ins:0,heat:1}},
 {cap:1,th:1,open:0,vap:.75,aV:0,aH:0,blk:1,lb:{bnd:0,sys:1,env:1,vap:0,cap:0,ins:1,heat:0}}
];
const TX=[
 {n:'النظام والمحيط',e:'System & Surroundings',c:'النظام: الماء — المحيط: كل ما حوله'},
 {n:'1- النظام المفتوح',e:'Open System',c:'يوجد تبادل للطاقة والمادة'},
 {n:'2- النظام المغلق',e:'Closed System',c:'يوجد تبادل للطاقة فقط'},
 {n:'3- النظام المعزول',e:'Isolated System',c:'لا يوجد تبادل للمادة والطاقة'}
];
const lerp=(a,b,e)=>{if(typeof a==='number')return a+(b-a)*e;if(Array.isArray(a))return a.map((v,i)=>lerp(v,b[i],e));const o={};for(const k in a)o[k]=lerp(a[k],b[k],e);return o;};
let cur=lerp(S[0],S[0],0),from=cur,to=S[0],t0=-1e9,idx=0;
const DUR=2400, ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------- geometry ---------- */
const FLASK='M415,150 L415,250 C415,292 320,302 320,352 L320,585 Q320,610 345,610 L555,610 Q580,610 580,585 L580,352 C580,302 485,292 485,250 L485,150 Z';
const SHELL_O='M391,126 L391,250 C391,304 296,312 296,362 L296,592 Q296,634 338,634 L562,634 Q604,634 604,592 L604,362 C604,312 509,304 509,250 L509,126 Z';
const SHELL_I='M403,138 L403,250 C403,298 308,307 308,357 L308,589 Q308,622 341,622 L559,622 Q592,622 592,589 L592,357 C592,307 497,298 497,250 L497,138 Z';
document.getElementById('flaskClip').setAttribute('d',FLASK);
const SURF=388;
const halfW=y=>y<250?30:y>345?126:30+96*(y-250)/95;   // inner half-width of flask at height y

/* ---------- scene ---------- */
const shell=el('g',{},view);
el('path',{d:SHELL_O,fill:'url(#gShell)',stroke:'#404346','stroke-width':2},shell);
el('path',{d:SHELL_I,fill:'#f3f6f8',stroke:'#c4c9cc','stroke-width':1.5},shell);

el('path',{d:FLASK,fill:'url(#gGlass)'},view);
const liqG=el('g',{'clip-path':'url(#cFlask)'},view);
const liq=el('path',{fill:'url(#gLiq)'},liqG);
const liqTop=el('path',{fill:'none',stroke:'#fff6c2','stroke-width':3,'stroke-opacity':.8},liqG);
const bub=[...Array(10)].map((_,k)=>({x:340+((k*53)%220),p:(k*.137)%1,v:.12+((k*7)%5)*.03,e:el('circle',{fill:'none',stroke:'#fff8d0','stroke-width':1.6},liqG)}));
const drops=[[372,330],[392,316],[528,318],[548,334],[440,270],[462,232],[438,200],[560,360],[344,372]].map(([x,y],k)=>el('ellipse',{cx:x,cy:y,rx:3.2,ry:4.2,fill:'#e4f3fb',stroke:'#7fb0cc','stroke-width':1},liqG));
el('path',{d:FLASK,fill:'none',stroke:'#7fb0cc','stroke-width':4,'stroke-linejoin':'round'},view);
el('path',{d:'M338,380 L338,560',stroke:'#fff','stroke-width':6,'stroke-linecap':'round','stroke-opacity':.55},view);
el('path',{d:'M424,165 L424,240',stroke:'#fff','stroke-width':4,'stroke-linecap':'round','stroke-opacity':.55},view);
el('rect',{x:407,y:142,width:86,height:12,rx:6,fill:'#d7ecf7',stroke:'#7fb0cc','stroke-width':3},view);

/* vapour particles */
const vg=el('g',{filter:'url(#blur)'},view);
const vp=[...Array(28)].map((_,k)=>({o:((k*37)%19)/19*2-1,p:(k*.0731)%1,v:.16+((k*11)%7)*.018,r:6+(k%4)*2,e:el('circle',{fill:'#9fbfd2'},vg)}));

/* cork */
const cork=el('g',{},view);
el('rect',{x:419,y:0,width:62,height:40,rx:5,fill:'url(#gCork)'},cork);
el('rect',{x:414,y:-8,width:72,height:14,rx:5,fill:'#3f2b1c'},cork);

/* thermos lid */
const lid=el('g',{},view);
el('rect',{x:384,y:96,width:132,height:44,rx:10,fill:'url(#gShell)',stroke:'#404346','stroke-width':2},lid);
el('rect',{x:396,y:88,width:108,height:14,rx:6,fill:'#5d6164'},lid);

/* arrows */
const arr=(x1,y1,x2,y2,col,mk,p)=>el('line',{x1,y1,x2,y2,stroke:col,'stroke-width':5,'stroke-linecap':'round','marker-end':`url(#${mk})`,'stroke-dasharray':'14 8'},p);
const heatG=el('g',{},view);
const hIn=arr(185,455,300,455,'#d63a3a','ah',heatG), hOut=arr(300,490,185,490,'#d63a3a','ah',heatG);
const vapG=el('g',{},view);
const vOut=arr(436,132,436,46,'#d63a3a','ah',vapG), vIn=arr(464,46,464,124,'#d63a3a','ah',vapG);
const blkG=el('g',{},view);
const bH=arr(178,472,262,472,'#8a8d90','ahG',blkG), bV=arr(450,18,450,62,'#8a8d90','ahG',blkG);
const X=(cx,cy)=>{const g=el('g',{},blkG);el('circle',{cx,cy,r:15,fill:'#fff',stroke:'#d63a3a','stroke-width':3},g);
  el('path',{d:`M${cx-6},${cy-6} L${cx+6},${cy+6} M${cx+6},${cy-6} L${cx-6},${cy+6}`,stroke:'#d63a3a','stroke-width':3.5,'stroke-linecap':'round'},g);return g;};
const x1=X(281,472), x2=X(450,79);

/* labels */
const LB=[
 {k:'bnd',s:'R',py:330,w:150,t:'حدود النظام'},
 {k:'sys',s:'R',py:500,w:110,t:'النظام'},
 {k:'env',s:'R',py:620,w:110,t:'المحيط'},
 {k:'vap',s:'L',py:120,w:140,t:'بخار الماء'},
 {k:'cap',s:'L',py:230,w:150,t:'غطاء محكم'},
 {k:'ins',s:'L',py:260,w:160,t:'عازل حراري'},
 {k:'heat',s:'L',py:560,w:110,t:'حرارة'}
];
const lg=el('g',{'pointer-events':'none'},view);
LB.forEach(l=>{
  l.px=l.s==='L'?20+l.w:880-l.w;const cx=l.s==='L'?20+l.w/2:880-l.w/2;
  l.g=el('g',{},lg);l.ln=el('line',{class:'ln',x1:l.px,y1:l.py},l.g);l.dt=el('circle',{class:'td',r:5},l.g);
  el('rect',{class:'pill',x:cx-l.w/2,y:l.py-19,width:l.w,height:38,rx:19},l.g);
  el('text',{class:'lbl',x:cx,y:l.py},l.g).textContent=l.t;
});
const setLn=(l,p,o)=>{l.ln.setAttribute('x2',p[0]);l.ln.setAttribute('y2',p[1]);l.dt.setAttribute('cx',p[0]);l.dt.setAttribute('cy',p[1]);l.g.setAttribute('opacity',o.toFixed(2));l.g.setAttribute('display',o<.02?'none':'');};

/* heading (right column) */
const hd=el('g',{class:'hd'},view);
const hName=el('text',{class:'hName',x:765,y:44},hd), hEn=el('text',{class:'hEn',x:765,y:82},hd);
const capBox=el('rect',{class:'capBox',y:106,height:40,rx:20},hd), capTxt=el('text',{class:'capTxt',x:765,y:126},hd);
function setHead(i){hName.textContent=TX[i].n;hEn.textContent=TX[i].e;capTxt.textContent=TX[i].c;
  let w=260;try{w=capTxt.getComputedTextLength()+40;}catch(e){}w=Math.max(w,160);
  const cx=Math.min(765,880-w/2);capTxt.setAttribute('x',cx);capBox.setAttribute('x',cx-w/2);capBox.setAttribute('width',w);}

/* ---------- render ---------- */
function render(s,t){
  /* liquid with gentle surface wave */
  const pts=[];for(let x=300;x<=600;x+=10)pts.push(x+','+(SURF+3*Math.sin(x*.045+t*2.2)+1.5*Math.sin(x*.11-t*3)).toFixed(1));
  liq.setAttribute('d','M'+pts.join(' L')+' L600,640 L300,640 Z');liqTop.setAttribute('d','M'+pts.join(' L'));
  bub.forEach(b=>{const u=(b.p+b.v*t)%1;b.e.setAttribute('cx',(b.x+4*Math.sin(t*3+b.x)).toFixed(1));b.e.setAttribute('cy',(600-u*205).toFixed(1));b.e.setAttribute('r',(2+u*3).toFixed(1));b.e.setAttribute('opacity',(Math.sin(PI*u)*.9).toFixed(2));});
  drops.forEach((d,k)=>d.setAttribute('opacity',(s.cap*(.55+.45*Math.sin(t*1.3+k))).toFixed(2)));

  /* vapour: open → escapes through the neck, closed → trapped under the cork */
  const top=175+(110-175)*s.open;
  vp.forEach(q=>{const u=(q.p+q.v*t)%1,y=SURF-8-u*(SURF-8-top),x=450+q.o*halfW(y)*.8+6*Math.sin(t*2+q.p*20);
    let o=s.vap*Math.sin(PI*Math.min(1,u*1.15))*.75;if(y<top+25)o*=Math.max(0,(y-top)/25);
    q.e.setAttribute('cx',x.toFixed(1));q.e.setAttribute('cy',y.toFixed(1));q.e.setAttribute('r',(q.r*(.6+.6*u)).toFixed(1));q.e.setAttribute('opacity',Math.max(0,o).toFixed(2));});

  /* cork drops in, thermos wraps around */
  cork.setAttribute('transform',`translate(0 ${(130-(1-s.cap)*110).toFixed(1)})`);cork.setAttribute('opacity',Math.min(1,s.cap*1.5).toFixed(2));
  const sc=1+.14*(1-s.th);
  shell.setAttribute('transform',`translate(450 380) scale(${sc.toFixed(3)}) translate(-450 -380)`);shell.setAttribute('opacity',s.th.toFixed(2));
  lid.setAttribute('transform',`translate(0 ${(-(1-s.th)*90).toFixed(1)})`);lid.setAttribute('opacity',s.th.toFixed(2));
  [shell,lid].forEach(g=>g.setAttribute('display',s.th<.01?'none':''));

  /* flowing arrows */
  const off=(-t*36%22).toFixed(1);
  [hIn,hOut,vOut,vIn,bH,bV].forEach(a=>a.setAttribute('stroke-dashoffset',off));
  heatG.setAttribute('opacity',s.aH.toFixed(2));vapG.setAttribute('opacity',s.aV.toFixed(2));
  const pulse=1+.08*Math.sin(t*4);
  blkG.setAttribute('opacity',s.blk.toFixed(2));
  x1.setAttribute('transform',`translate(281 472) scale(${pulse.toFixed(3)}) translate(-281 -472)`);
  x2.setAttribute('transform',`translate(450 79) scale(${pulse.toFixed(3)}) translate(-450 -79)`);
  [heatG,vapG,blkG].forEach(g=>g.setAttribute('display',+g.getAttribute('opacity')<.01?'none':''));

  /* labels */
  const L=s.lb;
  setLn(LB[0],[581,400],L.bnd);
  setLn(LB[1],[505,500],L.sys);
  setLn(LB[2],[690,560],L.env);
  setLn(LB[3],[430,96],L.vap);
  setLn(LB[4],[416,140],L.cap);
  setLn(LB[5],[300,362],L.ins);
  setLn(LB[6],[188,472],Math.max(L.heat,s.blk));
}
function frame(ms){const t=ms/1000,k=Math.min(1,(ms-t0)/DUR);cur=lerp(from,to,ease(k));render(cur,t);requestAnimationFrame(frame);}

/* ---------- navigation ---------- */
const badge=document.getElementById('badge'),dotsEl=document.getElementById('dots'),dots=[];
S.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>go(i);dotsEl.appendChild(b);dots.push(b);});
function setUI(i){badge.style.opacity=0;hd.style.opacity=0;
  setTimeout(()=>{badge.textContent=i?i:'';badge.style.opacity=i?1:0;setHead(i);hd.style.opacity=1;},200);
  dots.forEach((d,k)=>d.classList.toggle('on',k===i));}
function go(i){
  if(i<0||(i===idx&&t0>0))return;
  if(i>=S.length){svg.style.opacity=0;setTimeout(()=>{idx=0;from=to=S[0];cur=lerp(S[0],S[0],0);t0=-1e9;setUI(0);svg.style.opacity=1;},320);return;}
  from=cur;to=S[i];t0=performance.now();idx=i;setUI(i);
}
document.getElementById('next').onclick=()=>go(idx+1);
document.getElementById('prev').onclick=()=>go(idx-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(idx+1);if(e.key==='ArrowRight')go(idx-1);});
setHead(0);setUI(0);requestAnimationFrame(frame);

/* ---------- zoom & pan ---------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prev=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prev.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:380});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:380});
document.getElementById('zreset').onclick=reset;

/* ---------- fullscreen ---------- */
const D=document,R=D.documentElement,fsI=document.getElementById('fsI');
const isFs=()=>!!(D.fullscreenElement||D.webkitFullscreenElement);
document.getElementById('fs').onclick=()=>{
  try{
    if(isFs()){(D.exitFullscreen||D.webkitExitFullscreen).call(D);}
    else{const f=R.requestFullscreen||R.webkitRequestFullscreen;if(f){const p=f.call(R);if(p&&p.catch)p.catch(()=>{});}}
  }catch(e){}
};
const fsIcon=()=>fsI.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
D.addEventListener('fullscreenchange',fsIcon);D.addEventListener('webkitfullscreenchange',fsIcon);
apply();
})();
</script>
</body>
</html>
