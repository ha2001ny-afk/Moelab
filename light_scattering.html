<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>استطارة الضوء</title>
<style>
/* Layout: one full-screen navy lab bench; every control is a physical part of the apparatus or a clear button */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --accent:#7fd3ff; --warn:#ffc04d;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body)}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.fs{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.fs:hover{border-color:var(--accent)}
.fs:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fs svg{width:20px;height:20px}
.toast{position:absolute;top:max(62px,calc(env(safe-area-inset-top,0px) + 56px));right:max(10px,env(safe-area-inset-right,0px));max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink)}
.tipbtn{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:calc(max(10px,env(safe-area-inset-right,0px)) + 50px);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:#ffd27a;display:grid;place-items:center;cursor:pointer;padding:0}
.tipbtn:hover,.tipbtn.on{border-color:#ffd27a;background:rgba(255,210,122,.14)}
.tipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tipbtn svg{width:22px;height:22px}
.tip{box-sizing:border-box;position:absolute;top:max(60px,calc(env(safe-area-inset-top,0px) + 58px));right:max(10px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 20px));max-height:calc(100% - 80px);overflow:auto;background:rgba(8,20,41,.95);border:1px solid rgba(255,210,122,.35);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.8;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.tip h2{margin:0 0 8px;font-family:var(--f-display);font-size:16px;font-weight:600;color:#ffd27a;padding-left:28px;text-wrap:balance}
.tip p{margin:0 0 8px}
.tip .m,.tip b.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.tip p.m{text-align:center;color:var(--accent);font-weight:600}
.tip .note{color:var(--muted);font-size:13px}
.tip .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;direction:ltr;justify-content:flex-end}
.tip .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.tip .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.tip .x:hover{color:var(--ink)}
.parts{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;direction:rtl}
.parts button{height:42px;padding:0 12px 0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--muted);font:600 13px var(--f-body);cursor:pointer;display:flex;align-items:center;gap:7px}
.parts button i{width:9px;height:9px;border-radius:50%;border:1.6px solid currentColor;box-sizing:border-box;flex:none}
.parts button[aria-pressed="true"]{color:var(--ink);border-color:rgba(127,211,255,.6);background:rgba(127,211,255,.14)}
.parts button[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.parts button[aria-pressed="false"] span{text-decoration:line-through;text-decoration-thickness:1px}
.parts button:hover{border-color:var(--accent)}
.parts button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.parts .s{display:none}
@media (max-width:640px){.parts .l{display:none}.parts .s{display:inline}.parts button{padding:0 9px 0 10px;font-size:12.5px}}
@media (max-width:420px){.parts{gap:4px}.parts button{padding:0 7px 0 8px;font-size:12px;gap:5px}.parts button i{width:7px;height:7px}}
</style>

<body style="margin:0">

<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="محاكاة استطارة الضوء: لون السماء وقرص الشمس حسب ارتفاع الشمس، ومسار ضوء الشمس في الغلاف الجوي، وجدول مدى الاستطارة"></canvas>
  <button class="tipbtn" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
  <div class="tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
  <div class="parts" id="parts" role="group" aria-label="أجزاء المحاكاة">
    <button data-p="sky" aria-pressed="true"><i></i><span class="l">منظر السماء</span><span class="s">السماء</span></button>
    <button data-p="diag" aria-pressed="true"><i></i><span class="l">مسار الضوء</span><span class="s">المسار</span></button>
    <button data-p="ctrl" aria-pressed="false"><i></i><span class="l">جدول الاستطارة</span><span class="s">الجدول</span></button>
  </div>
  <button class="fs" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<script>
(function(){
const cv=document.getElementById('scene');let ctx=cv.getContext('2d');
/* state: el = sun elevation above the horizon (deg) */
const S={el:35,clouds:false,mc:'w',big:false};
const VIS={sky:true,diag:true,ctrl:false};let PL={};
const touched={sun:false};
let W=0,H=0,DPR=1,narrow=null,L=null,view={z:1,x:0,y:0},time=0,drag=null,hover=null;
const col={};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const F=(w,s,mono)=>w+' '+(s*(L?L.fs:1)).toFixed(1)+'px '+(mono?'ui-monospace, Menlo, Consolas, monospace':'system-ui, "Segoe UI", Tahoma, sans-serif');
function readColors(){const cs=getComputedStyle(document.documentElement);['deep','navy','glow','ink','muted','accent'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
const D2R=Math.PI/180,EL_MIN=-5,EL_MAX=85;
const TABLE=[{n:'بنفسجي',l:0.40,b:10},{n:'أزرق',l:0.48,b:5},{n:'أخضر',l:0.52,b:4},{n:'أصفر',l:0.58,b:3},{n:'برتقالي',l:0.60,b:2},{n:'أحمر',l:0.70,b:1}];
function lamArr(l){l*=1000;let r=0,g=0,b=0;if(l<440){r=-(l-440)/60;b=1;}else if(l<490){g=(l-440)/50;b=1;}else if(l<510){g=1;b=-(l-510)/20;}else if(l<580){r=(l-510)/70;g=1;}else if(l<645){r=1;g=-(l-645)/65;}else r=1;return[r*255,g*255,b*255];}

/* ---------- atmosphere: single-scattering Rayleigh (∝ 1/λ⁴) + a little Mie (dust) ---------- */
const RE=6371e3,RA=6471e3,HR=8000,HM=1200,BR=[5.8e-6,13.5e-6,33.1e-6],BM=10e-6,G=0.76,SUNI=20;
function sphere(o,d,r){const b=o[0]*d[0]+o[1]*d[1]+o[2]*d[2],c=o[0]*o[0]+o[1]*o[1]+o[2]*o[2]-r*r,h=b*b-c;if(h<0)return null;const s=Math.sqrt(h);return[-b-s,-b+s];}
function depthToSun(p,s){const t=sphere(p,s,RA);if(!t)return null;const e=sphere(p,s,RE);if(e&&e[0]>0)return null;const n=8,ds=t[1]/n;let dr=0,dm=0;
  for(let i=0;i<n;i++){const q=[p[0]+s[0]*ds*(i+0.5),p[1]+s[1]*ds*(i+0.5),p[2]+s[2]*ds*(i+0.5)],h=Math.hypot(...q)-RE;if(h<0)return null;dr+=Math.exp(-h/HR)*ds;dm+=Math.exp(-h/HM)*ds;}return[dr,dm];}
const OBS=[0,RE+2,0];
function sunDir(){const e=S.el*D2R;return[Math.cos(e),Math.sin(e),0];}
function skyColor(d,s){const t=sphere(OBS,d,RA);if(!t)return[0,0,0];let tmax=t[1];const e=sphere(OBS,d,RE);if(e&&e[0]>0)tmax=e[0];
  const n=16,ds=tmax/n;let odR=0,odM=0;const sR=[0,0,0],sM=[0,0,0],mu=d[0]*s[0]+d[1]*s[1]+d[2]*s[2];
  for(let i=0;i<n;i++){const q=[OBS[0]+d[0]*ds*(i+0.5),OBS[1]+d[1]*ds*(i+0.5),OBS[2]+d[2]*ds*(i+0.5)],h=Math.hypot(...q)-RE,hr=Math.exp(-h/HR)*ds,hm=Math.exp(-h/HM)*ds;odR+=hr;odM+=hm;
    const ls=depthToSun(q,s);if(!ls)continue;for(let c=0;c<3;c++){const at=Math.exp(-(BR[c]*(odR+ls[0])+BM*1.1*(odM+ls[1])));sR[c]+=at*hr;sM[c]+=at*hm;}}
  const pR=3/(16*Math.PI)*(1+mu*mu),pM=3/(8*Math.PI)*((1-G*G)*(1+mu*mu))/((2+G*G)*Math.pow(1+G*G-2*G*mu,1.5));
  return[0,1,2].map(c=>SUNI*(sR[c]*BR[c]*pR+sM[c]*BM*pM));}
function sunTrans(){const s=sunDir(),ls=depthToSun(OBS,s);if(!ls)return[0,0,0];return[0,1,2].map(c=>Math.exp(-(BR[c]*ls[0]+BM*1.1*ls[1])));}
const tone=v=>Math.pow(1-Math.exp(-v*0.85),1/2.2)*255;
/* air mass (Kasten–Young): how much air the sunlight crosses compared with an overhead sun */
const airMass=e=>e<-0.5?null:1/(Math.sin(Math.max(e,-0.5)*D2R)+0.50572*Math.pow(Math.max(e,-0.5)+6.07995,-1.6364));
/* transmission of each table colour through the air mass (Rayleigh optical depth at zenith ∝ λ⁻⁴) */
const transCol=(lum)=>{const am=airMass(S.el);if(!am)return 0;return Math.exp(-0.0088*Math.pow(lum,-4.05)*am);};

/* ---------- layout & panels ---------- */
function buildLayout(){L={fs:narrow?1.06:1,sky:{w:100,h:100},diag:{w:100,h:100},ctrl:{w:330,h:700}};}
function fitView(){view={z:1,x:0,y:0};}
function arrange(){PL={};if(!L)return;const m=10,top=H<500?56:62,aw=W-2*m,ah=H-top-m,gd=12;let x=m,y=top,w=aw,h=ah;const vis=['sky','diag'].filter(n=>VIS[n]);
  if(VIS.ctrl){if(!narrow){const cw=Math.min(340,aw*0.3);if(vis.length){PL.ctrl={x:W-m-cw,y:top,w:cw,h:ah};w=aw-cw-gd;}else PL.ctrl={x:(W-cw)/2,y:top,w:cw,h:ah};}
    else{const ch=vis.length?Math.min(440,ah*0.45):ah;PL.ctrl={x:m,y:H-m-ch,w:aw,h:ch};h=ah-ch-gd;}}
  if(vis.length===1)PL[vis[0]]={x,y,w,h};
  else if(vis.length===2){if(w/h>1.25){const hw=(w-gd)/2;PL.sky={x:x+hw+gd,y,w:hw,h};PL.diag={x,y,w:hw,h};}else{const hh=(h-gd)/2;PL.sky={x,y,w,h:hh};PL.diag={x,y:y+hh+gd,w,h:hh};}}
  for(const n in PL){PL[n].k=1;L[n].w=PL[n].w;L[n].h=PL[n].h;}skyKey='';}
function layout(){const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;W=nw;H=nh;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);const nn=W<H*0.95;if(nn!==narrow||!L){narrow=nn;buildLayout();skyKey='';}fitView();arrange();}
const toWorld=s=>({x:(s.x-view.x)/view.z,y:(s.y-view.y)/view.z});
function panelAt(w){for(const n in PL){const P=PL[n];if(w.x>=P.x-6&&w.x<=P.x+P.w+6&&w.y>=P.y-6&&w.y<=P.y+P.h+6)return n;}return null;}
function toLocal(s,n){const P=PL[n],w=toWorld(s);return{x:(w.x-P.x)/P.k,y:(w.y-P.y)/P.k};}
function setPanel(n){const P=PL[n],z=view.z*P.k;ctx.setTransform(DPR*z,0,0,DPR*z,DPR*(view.z*P.x+view.x),DPR*(view.z*P.y+view.y));}

/* ---------- helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,o={}){ctx.font=o.font||F(600,13);ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function arrow(x0,y0,x1,y1,c,lw){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();arrowHead(x1,y1,Math.atan2(y1-y0,x1-x0),lw*2.6+2,c);}
function pulseRing(x,y,r,color,ph){const pu=0.5+0.5*Math.sin(time*5+(ph||0));ctx.beginPath();ctx.arc(x,y,r+pu*5,0,7);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function chip(s,x,y,c,align){ctx.font=F(600,12);const w=ctx.measureText(s).width+18,h=24*L.fs,x0=align==='left'?x:align==='right'?x-w:x-w/2;rr(x0,y-h/2,w,h,h/2);ctx.fillStyle='rgba(6,13,28,.72)';ctx.fill();if(c){ctx.strokeStyle=c;ctx.lineWidth=1;ctx.stroke();}txt(s,x0+w/2,y+0.5,{font:F(600,12),color:c||col.ink});}
function drawBg(){ctx.setTransform(DPR,0,0,DPR,0,0);const g=ctx.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,Math.max(W,H)*0.75);g.addColorStop(0,col.glow);g.addColorStop(0.55,col.navy);g.addColorStop(1,col.deep);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

/* ---------- panel 1: the sky as the observer sees it ---------- */
const ELLO=-5,ELHI=62;let AZ=55;const simg=document.createElement('canvas');const sctx=simg.getContext('2d');let skyKey='',SUNC=[1,1,1],ZEN=[0,0,0],HOR=[0,0,0],idleT=0;
function renderSky(fine){const P=L.sky;if(!P||!PL.sky){const k2='h'+S.el.toFixed(2);if(k2!==skyKey){skyKey=k2;SUNC=sunTrans();ZEN=skyColor([0,1,0],sunDir()).map(tone);}return;}const SH=fine?96:48,SW=Math.max(24,Math.round(SH*P.w/P.h));AZ=clamp((ELHI-ELLO)/2*P.w/P.h,25,85);
  const key=S.el.toFixed(2)+'|'+SW+'|'+SH;if(key===skyKey)return;skyKey=key;simg.width=SW;simg.height=SH;const s=sunDir(),im=sctx.createImageData(SW,SH);
  for(let j=0;j<SH;j++){const el=(ELHI-(j+0.5)/SH*(ELHI-ELLO))*D2R;for(let i=0;i<SW;i++){const az=((i+0.5)/SW*2-1)*AZ*D2R,d=[Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az)];
    let c=el<0?[0,0,0]:skyColor(d,s);const Y=0.3*c[0]+0.59*c[1]+0.11*c[2];c=c.map(v=>Math.max(0,Y+(v-Y)*1.35));const k=(j*SW+i)*4;im.data[k]=tone(c[0]);im.data[k+1]=tone(c[1]);im.data[k+2]=tone(c[2]);im.data[k+3]=255;}}
  sctx.putImageData(im,0,0);SUNC=sunTrans();ZEN=skyColor([0,1,0],s).map(tone);HOR=skyColor([Math.cos(3*D2R),Math.sin(3*D2R),0.3],s).map(tone);}
function cloudBtn(){const P=L.sky,w=narrow?150:132,h=narrow?34:28;return{x:14,y:P.h-h-14,w,h};}
function skyY(el,P){const top=0,bot=P.h;return top+(ELHI-el)/(ELHI-ELLO)*(bot-top);}
const VAL=x=>0.25+0.75*Math.min(1,Math.abs(x-0.5)*2.6);const HILLS=[];for(let i=0;i<=60;i++){const x=i/60;HILLS.push((0.045+0.03*Math.sin(x*7.3+1)+0.02*Math.sin(x*17.1)+0.012*Math.sin(x*41))*VAL(x));}
const TREES=[];for(let i=0;i<34;i++){const x=Math.random();TREES.push({x,h:(0.05+Math.random()*0.07)*VAL(x),w:0.012+Math.random()*0.01});}
const CLOUDS=[{x:0.18,e:24,w:0.2,h:0.07},{x:0.42,e:38,w:0.26,h:0.08},{x:0.7,e:18,w:0.22,h:0.06},{x:0.88,e:31,w:0.17,h:0.06},{x:0.58,e:50,w:0.2,h:0.06}];
function drawSky(){const P=L.sky,w=P.w,h=P.h;ctx.save();rr(0,0,w,h,18);ctx.clip();
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(simg,0,0,w,h);
  const hy=skyY(0,P),sunX=w/2,sunY=skyY(S.el,P),sc=SUNC,sb=Math.max(sc[0],sc[1],sc[2],1e-6),scol=[255*sc[0]/sb,255*sc[1]/sb,255*sc[2]/sb];
  // sun glow and disc (colour = sunlight that is left after crossing the air)
  if(S.el>-1.2){const vis=clamp((S.el+1.2)/1.5,0,1),gr=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,h*0.45);gr.addColorStop(0,rgba(scol,0.55*vis));gr.addColorStop(0.15,rgba(scol,0.18*vis));gr.addColorStop(1,rgba(scol,0));ctx.fillStyle=gr;ctx.fillRect(0,0,w,h);
    ctx.beginPath();ctx.arc(sunX,sunY,15,0,7);ctx.fillStyle=rgba(scol.map(v=>Math.min(255,v*0.35+175)),vis);ctx.fill();ctx.beginPath();ctx.arc(sunX,sunY,15,0,7);ctx.fillStyle=rgba(scol,0.55*vis);ctx.fill();}
  // clouds: big droplets scatter all colours equally, so they are white (or lit by the sunset colour)
  if(S.clouds){const b=clamp((S.el+1)/14,0.15,1),amb=HOR.map((v,i)=>v*0.55+ZEN[i]*0.25),lit=S.el<-1?amb:scol.map((v,i)=>v*(0.5+0.5*b)*0.85+255*0.15*b);
    CLOUDS.forEach((c,ci)=>{const cx=((c.x+time*0.004*(ci%2?1:0.7))%1.2-0.1)*w,cy=skyY(c.e,P),cw=c.w*w*1.2,ch=c.h*h;
      for(let k=0;k<11;k++){const t=k/10,ox=(t-0.5)*cw,oy=-Math.sin(t*Math.PI)*ch*0.55+Math.sin(k*2.9)*ch*0.12,r=cw*(0.09+0.07*Math.sin(t*Math.PI))*(1+0.25*Math.sin(k*1.7));

  TABLE.slice().reverse().forEach((r,i)=>{const t=transCol(r.l),cc=lamArr(r.l),bx=x0+10+i*(bw2+8);rr(bx,base-gh,bw2,gh,5);ctx.fillStyle='rgba(255,255,255,.05)';ctx.fill();
    const hh=Math.max(1,gh*t);rr(bx,base-hh,bw2,hh,5);ctx.fillStyle=rgba(cc,0.9);ctx.fill();txt(`${Math.round(t*100)}%`,bx+bw2/2,base-hh-9,{font:F(600,10,1),color:col.ink,dir:'ltr'});txt(r.n,bx+bw2/2,base+12,{font:F(500,10),color:col.muted});});
  y=base+34;
  const am=airMass(S.el),rows=[['ارتفاع الشمس فوق الأفق',`${S.el.toFixed(1)}°`],['مسار الضوء في الهواء',am?`${am<10?am.toFixed(1):Math.round(am)} × مساره عند الزوال`:'الشمس تحت الأفق']];
  rows.forEach((r,i)=>{const yy=y+i*26;txt(r[0],x1,yy,{align:'right',font:F(500,12),color:col.muted});txt(r[1],x0,yy,{align:'left',font:F(600,12.5),dir:r[1].includes('×')?'rtl':'ltr'});});
  if(!narrow){y+=64;const sb=Math.max(...SUNC,1e-6),sc=S.el<-0.6?[40,30,30]:SUNC.map(v=>255*v/sb);
    [['لون قرص الشمس',sc],['لون السماء فوق الرأس',ZEN]].forEach((r,i)=>{const yy=y+i*34;txt(r[0],x1,yy,{align:'right',font:F(500,12),color:col.muted});rr(x0,yy-12,70,24,8);ctx.fillStyle=rgba(r[1],1);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.3)';ctx.stroke();});}}

function draw(){drawBg();const fn={sky:drawSky,diag:drawDiag,ctrl:drawCtrl};let any=false;
  for(const n of['sky','diag','ctrl'])if(PL[n]){setPanel(n);fn[n]();any=true;}
  if(!any){ctx.setTransform(DPR,0,0,DPR,0,0);const f=L.fs;L.fs=1;txt('كل الأجزاء مخفية: اختر جزءاً من الأزرار في الأعلى لإظهاره',W/2,H/2,{font:F(600,15),color:col.muted});L.fs=f;}}

/* ---------- input: drag the sun ---------- */
const ptrs=new Map();let pinch=null,lastTap=0;
function scr(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function hit(p,n){if(n==='sky'){const cb=cloudBtn();if(p.x>=cb.x&&p.x<=cb.x+cb.w&&p.y>=cb.y&&p.y<=cb.y+cb.h)return{type:'act',a:()=>S.clouds=!S.clouds,key:'cloud'};const P=L.sky,sy=skyY(S.el,P);if(Math.abs(p.x-P.w/2)<80&&p.y>0&&p.y<P.h)return{type:'sun',n,key:'sun'};return{type:'skydrag',n,key:'sun'};}
  if(n==='diag'){const s=sunPos2();if(Math.hypot(p.x-s.x,p.y-s.y)<50)return{type:'sun',n,key:'sun'};const g=dg();if(p.y<g.oy-10&&p.x>g.ox)return{type:'sun',n,key:'sun'};}return null;}
function setSun(p,n){let e;if(n==='sky'){const P=L.sky;e=ELHI-p.y/P.h*(ELHI-ELLO);}else{const g=dg();e=Math.atan2(g.py-p.y,Math.max(1,p.x-g.px))/D2R;}S.el=Math.round(clamp(e,EL_MIN,EL_MAX)*2)/2;touched.sun=true;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const s=scr(e);ptrs.set(e.pointerId,s);
  if(ptrs.size===2){drag=null;const[a,b]=[...ptrs.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},z0:view.z,x0:view.x,y0:view.y};return;}
  if(ptrs.size>2)return;const pn=panelAt(toWorld(s)),p=pn?toLocal(s,pn):null,h=pn?hit(p,pn):null;
  if(!h){const now=performance.now();if(now-lastTap<320)fitView();lastTap=now;drag={type:'pan',s0:s,x0:view.x,y0:view.y};cv.style.cursor='grabbing';return;}
  if(h.type==='act'){h.a();return;}drag={type:'sun',n:pn};setSun(p,pn);cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{const s=scr(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,s);
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},z=clamp(pinch.z0*d/pinch.d0,0.6,5),wx=(pinch.m0.x-pinch.x0)/pinch.z0,wy=(pinch.m0.y-pinch.y0)/pinch.z0;view={z,x:mid.x-wx*z,y:mid.y-wy*z};return;}
  if(!drag){const pn=panelAt(toWorld(s)),h=pn?hit(toLocal(s,pn),pn):null;hover=h?h.key:null;cv.style.cursor=h?(h.type==='act'?'pointer':'ns-resize'):'grab';return;}
  if(drag.type==='pan'){view.x=drag.x0+s.x-drag.s0.x;view.y=drag.y0+s.y-drag.s0.y;return;}
  if(drag.type==='sun'&&PL[drag.n])setSun(toLocal(s,drag.n),drag.n);});
function pointerEnd(e){ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;return;}drag=null;cv.style.cursor='grab';}
cv.addEventListener('pointerup',pointerEnd);cv.addEventListener('pointercancel',pointerEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();const s=scr(e),f=Math.exp(-e.deltaY*0.0015),z=clamp(view.z*f,0.6,5),wx=(s.x-view.x)/view.z,wy=(s.y-view.y)/view.z;view={z,x:s.x-wx*z,y:s.y-wy*z};},{passive:false});

/* ---------- teacher hint ---------- */
window.__explain=function(){const am=airMass(S.el),tb=transCol(0.48),tr=transCol(0.70);
  const nums=`<div class="nums" style="direction:rtl;justify-content:flex-start"><span dir="rtl">ارتفاع الشمس ⁦${S.el.toFixed(1)}°⁩</span>${am?`<span dir="rtl">مسار الضوء ≈ ⁦${am<10?am.toFixed(1):Math.round(am)}⁩ × مساره عند الزوال</span><span dir="rtl">الأزرق الباقي ⁦${Math.round(tb*100)}%⁩ · الأحمر ⁦${Math.round(tr*100)}%⁩</span>`:''}</div>`;
  const law=`<p style="text-align:center">شدة الضوء المستطار <b class="m">∝ 1/λ⁴</b> عندما <b class="m">d ≤ λ</b></p>`;
  const tryit=`<p class="note">جرّب: اسحب الشمس نحو الأفق ببطء وراقب لون السماء وقرص الشمس، وشغّل الغيوم من الأزرار في الأعلى.</p>`;
  const cloud=S.clouds?`<p class="note">الغيوم بيضاء لأن قطرات الماء فيها أكبر بكثير من الطول الموجي (d ≫ λ)، فتستطير الألوان كلها بالمقدار نفسه، وعند الغروب تكتسب لون الضوء الأحمر الساقط عليها.</p>`:'';
  if(S.el<-0.5)return{t:'الشمس تحت الأفق',b:`<p>غابت الشمس، لكن أعالي الغلاف الجوي ما زالت مضاءة، فيبقى في السماء ضوء خافت (الشفق) يغلب عليه الأحمر والبرتقالي قرب الأفق، لأن ضوء الشمس قطع مساراً طويلاً جداً في الهواء فاستُطير منه الأزرق.</p>${law}${cloud}${nums}${tryit}`};
  if(S.el<10)return{t:'لماذا يتلوّن الأفق بالأحمر عند الغروب والشروق؟',b:`<p>عندما تكون الشمس قرب الأفق يقطع ضوؤها مساراً في الغلاف الجوي أطول بكثير منه عند الزوال (نحو ${am?Math.round(am):''} مرة).</p><p>خلال هذا المسار الطويل يُستطار الضوء الأزرق (الطول الموجي القصير) بعيداً عن الحزمة، فلا يصل إلى عينك إلا الضوء الأحمر والبرتقالي <b>لقلة استطارتهما</b>، فتبدو الشمس والأفق باللون الأحمر.</p>${law}${cloud}${nums}${tryit}`};
  return{t:'لماذا تبدو السماء زرقاء نهاراً؟',b:`<p>عند سقوط ضوء الشمس (400 nm – 700 nm) على جزيئات الهواء التي أقطارها أصغر من الطول الموجي، يُستطار الضوء في جميع الاتجاهات بشدة تتناسب عكسياً مع الأس الرابع للطول الموجي.</p><p>لذلك يُستطار الأزرق والبنفسجي بمقدار أكبر بكثير من الأحمر (البنفسجي ⁦(0.70/0.40)⁴ ≈ 9.4⁩ أي نحو 10 أضعاف الأحمر)، وعندما ننظر إلى السماء يصل إلى عيوننا هذا الضوء المستطار فنراها زرقاء.</p><p class="note">ونراها زرقاء لا بنفسجية لأن ضوء الشمس فيه بنفسجي أقل، والعين أقل حساسية له.</p>${law}${cloud}${nums}${tryit}`};
};

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;if(!W)layout();if(W){if(drag&&drag.type==='sun')idleT=0;else idleT+=dt;renderSky(idleT>0.12);draw();}requestAnimationFrame(frame);}
readColors();layout();
document.querySelectorAll('#parts button').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.p;
  if(n==='clouds'){S.clouds=!S.clouds;b.setAttribute('aria-pressed',S.clouds);return;}VIS[n]=!VIS[n];b.setAttribute('aria-pressed',VIS[n]);if(!VIS[n]&&drag&&drag.n===n)drag=null;fitView();arrange();}));
new ResizeObserver(()=>layout()).observe(cv);
requestAnimationFrame(frame);
})();

(function(){const b=document.getElementById('fsBtn'),ico=document.getElementById('fsIco'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const t=document.createElement('div');t.className='toast';t.hidden=true;t.textContent='ملء الشاشة غير متاح هنا. افتح الملف أو الرابط بالمتصفح';document.querySelector('.stage').appendChild(t);
  let tm=0;const toast=()=>{t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>t.hidden=true,3200);};
  const sync=()=>{ico.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');b.setAttribute('aria-label',isFs()?'الخروج من ملء الشاشة':'ملء الشاشة');};
  b.addEventListener('click',()=>{
    if(isFs()){try{exit.call(document);}catch(e){}return;}
    if(!req||document.fullscreenEnabled===false){toast();return;}
    try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(toast);setTimeout(()=>{if(!isFs())toast();},700);}catch(e){toast();}});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);})();

(function(){const b=document.getElementById('tipBtn'),p=document.getElementById('tipPanel'),t=document.getElementById('tipTitle'),body=document.getElementById('tipBody');
  let iv=0,last='';
  const fill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===last)return;last=h;t.textContent=r.t;body.innerHTML=r.b;};
  const open=v=>{p.hidden=!v;b.setAttribute('aria-expanded',v);b.classList.toggle('on',v);clearInterval(iv);if(v){last='';fill();iv=setInterval(fill,400);}};
  b.addEventListener('click',()=>open(p.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>open(false));})();
</script>
