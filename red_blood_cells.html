<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>خلايا الدم في الإنسان</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(13px,3.4vw,22px);font-weight:bold;text-align:center;line-height:1.3}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:#fff}
  .zb{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .pill{fill:#fff;stroke:#e0552a;stroke-width:2.5}
  .lbl{fill:#a8431b;font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .cat{fill:#1f3a52;font-size:21px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .ln{stroke:#e0552a;stroke-width:2.4;fill:none}
  .brk{stroke:#3a4b5c;stroke-width:2;fill:none}
</style>
</head>
<body>
<div id="top"><div id="title">خلايا الدم في الإنسان</div></div>
<div id="stage">
  <div class="zb"><button id="zin">+</button><button id="zout">−</button><button id="zreset">⟲</button><button id="pause">⏸</button><button id="fs">⛶</button></div>
  <svg id="svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- Cell Drop Shadow -->
      <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1f3a52" flood-opacity="0.14"/>
      </filter>

      <!-- Cytoplasm Gradients -->
      <radialGradient id="gBasoCyto" cx="38%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#f3eaf8"/>
        <stop offset="70%" stop-color="#d7c2e8"/>
        <stop offset="100%" stop-color="#b497cf"/>
      </radialGradient>
      <radialGradient id="gEosCyto" cx="38%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#fae5db"/>
        <stop offset="68%" stop-color="#eab49e"/>
        <stop offset="100%" stop-color="#c97d63"/>
      </radialGradient>
      <radialGradient id="gNeuCyto" cx="38%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#fbf0f7"/>
        <stop offset="70%" stop-color="#ead0e3"/>
        <stop offset="100%" stop-color="#cba6c3"/>
      </radialGradient>
      <radialGradient id="gLymCyto" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#e3eef8"/>
        <stop offset="72%" stop-color="#b4cbe4"/>
        <stop offset="100%" stop-color="#87a4c7"/>
      </radialGradient>
      <radialGradient id="gMonoCyto" cx="38%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#e8eff5"/>
        <stop offset="70%" stop-color="#bdcddb"/>
        <stop offset="100%" stop-color="#8ea3b8"/>
      </radialGradient>

      <!-- Purple Nucleus Gradient -->
      <radialGradient id="gNuc" cx="35%" cy="30%" r="68%">
        <stop offset="0%" stop-color="#9e7bb8"/>
        <stop offset="45%" stop-color="#5e327a"/>
        <stop offset="85%" stop-color="#3c1954"/>
        <stop offset="100%" stop-color="#270d38"/>
      </radialGradient>
      <radialGradient id="gMonoNuc" cx="35%" cy="30%" r="68%">
        <stop offset="0%" stop-color="#b594a8"/>
        <stop offset="50%" stop-color="#754967"/>
        <stop offset="90%" stop-color="#4f2943"/>
        <stop offset="100%" stop-color="#38182e"/>
      </radialGradient>

      <!-- Red Blood Cell Gradients (Biconcave 3D appearance) -->
      <radialGradient id="gRBCOuter" cx="36%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#e65340"/>
        <stop offset="45%" stop-color="#b82518"/>
        <stop offset="82%" stop-color="#851309"/>
        <stop offset="100%" stop-color="#590903"/>
      </radialGradient>
      <radialGradient id="gRBCDim" cx="55%" cy="55%" r="55%">
        <stop offset="0%" stop-color="#5e0b05"/>
        <stop offset="60%" stop-color="#8f180e"/>
        <stop offset="90%" stop-color="#c93829"/>
        <stop offset="100%" stop-color="#a82014"/>
      </radialGradient>

      <!-- Platelet Gradient -->
      <radialGradient id="gPlat" cx="40%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#b89cd9"/>
        <stop offset="55%" stop-color="#7d5ba6"/>
        <stop offset="100%" stop-color="#4e3273"/>
      </radialGradient>

      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0,0L10,5L0,10Z" fill="#e0552a"/>
      </marker>
    </defs>
    <g id="view"></g>
  </svg>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
let rs=23;const rnd=()=>{rs=(rs*9301+49297)%233280;return rs/233280;};

/* ---------- Pure White Background ---------- */
el('rect',{x:0,y:0,width:900,height:700,fill:'#ffffff'});

/* ---------- Top Classification Brackets (حبيبية / لا حبيبية) ---------- */
const brkG=G(view);
// Granulocytes bracket (حبيبية) covering Basophil (735), Eosinophil (575), Neutrophil (415)
el('path',{class:'brk',d:'M 390,92 L 390,64 L 540,64 M 610,64 L 760,64 L 760,92'},brkG);
el('text',{class:'cat',x:575,y:64},brkG).textContent='حبيبية';

// Agranulocytes bracket (لا حبيبية) covering Lymphocyte (270), Monocyte (130)
el('path',{class:'brk',d:'M 105,92 L 105,64 L 155,64 M 245,64 L 295,64 L 295,92'},brkG);
el('text',{class:'cat',x:200,y:64},brkG).textContent='لا حبيبية';

/* ---------- Helper: Wavy Membrane Path ---------- */
function wavyCirclePath(R, bumps, amp, phase){
  const pts=72;
  let d='';
  for(let i=0;i<=pts;i++){
    const a=(i/pts)*PI*2;
    const r = R + amp*Math.sin(bumps*a + phase) + (amp*0.5)*Math.cos((bumps-3)*a - phase*0.7);
    const x = r*Math.cos(a), y = r*Math.sin(a);
    d += (i===0?'M':'L') + x.toFixed(1)+','+y.toFixed(1);
  }
  return d+'Z';
}

/* ---------- 1. Basophil (قعدة) - X:735, Y:185 ---------- */
const baso={cx:735,cy:185,r:56,x:735,y:185,grans:[]};
baso.g=G(view,{filter:'url(#drop)'});
el('circle',{r:baso.r,fill:'url(#gBasoCyto)',stroke:'#9d7db8','stroke-width':2},baso.g);
baso.nuc=el('path',{
  d:'M-22,-18 C-5,-32 25,-22 26,-4 C27,12 8,16 14,26 C20,35 -12,38 -25,20 C-36,4 -10,-2 -22,-18 Z',
  fill:'url(#gNuc)',opacity:0.85
},baso.g);
const basoGranG=G(baso.g);
for(let i=0;i<68;i++){
  const a=rnd()*PI*2, dist=Math.sqrt(rnd())*(baso.r-7);
  const gx=dist*Math.cos(a), gy=dist*Math.sin(a);
  const gr=2.8+rnd()*3.6;
  const col = rnd()>0.35 ? '#3b1c63' : (rnd()>0.5 ? '#232b69' : '#6c3a9e');
  const c=el('circle',{cx:gx.toFixed(1),cy:gy.toFixed(1),r:gr.toFixed(1),fill:col,stroke:'#bba1d4','stroke-width':0.5,opacity:0.92},basoGranG);
  baso.grans.push({c,gx,gy,ph:rnd()*6.28});
}

/* ---------- 2. Eosinophil (حامضية) - X:575, Y:185 ---------- */
const eos={cx:575,cy:185,r:56,x:575,y:185,grans:[]};
eos.g=G(view,{filter:'url(#drop)'});
el('circle',{r:eos.r,fill:'url(#gEosCyto)',stroke:'#b86b52','stroke-width':2},eos.g);
const eosGranG=G(eos.g);
for(let i=0;i<85;i++){
  const a=rnd()*PI*2, dist=Math.sqrt(rnd())*(eos.r-6);
  const gx=dist*Math.cos(a), gy=dist*Math.sin(a);
  const gr=2.0+rnd()*2.2;
  const col = rnd()>0.4 ? '#c95238' : '#e07a5f';
  const c=el('circle',{cx:gx.toFixed(1),cy:gy.toFixed(1),r:gr.toFixed(1),fill:col,opacity:0.85},eosGranG);
  eos.grans.push({c,gx,gy,ph:rnd()*6.28});
}
eos.nuc=G(eos.g);
el('path',{d:'M -16,12 Q 0,32 18,14',fill:'none',stroke:'#421c5c','stroke-width':4.5,'stroke-linecap':'round'},eos.nuc);
el('path',{d:'M-14,-28 C-30,-28 -36,-4 -26,14 C-18,26 -4,18 -4,2 C-4,-12 -2,-28 -14,-28 Z',fill:'url(#gNuc)'},eos.nuc);
el('ellipse',{cx:-19,cy:-10,rx:5,ry:8,fill:'#b99bd1',opacity:0.35},eos.nuc);
el('path',{d:'M18,-22 C32,-22 38,2 28,20 C20,32 6,24 6,8 C6,-8 6,-22 18,-22 Z',fill:'url(#gNuc)'},eos.nuc);
el('ellipse',{cx:20,cy:-4,rx:5,ry:8,fill:'#b99bd1',opacity:0.35},eos.nuc);

/* ---------- 3. Neutrophil (متعادلة) - X:415, Y:185 ---------- */
const neu={cx:415,cy:185,r:56,x:415,y:185,grans:[]};
neu.g=G(view,{filter:'url(#drop)'});
el('circle',{r:neu.r,fill:'url(#gNeuCyto)',stroke:'#b58dad','stroke-width':2},neu.g);
const neuGranG=G(neu.g);
for(let i=0;i<60;i++){
  const a=rnd()*PI*2, dist=Math.sqrt(rnd())*(neu.r-6);
  const gx=dist*Math.cos(a), gy=dist*Math.sin(a);
  const c=el('circle',{cx:gx.toFixed(1),cy:gy.toFixed(1),r:(1.4+rnd()*1.3).toFixed(1),fill:'#b37ba8',opacity:0.65},neuGranG);
  neu.grans.push({c,gx,gy,ph:rnd()*6.28});
}
neu.nuc=G(neu.g);
el('path',{d:'M -4,-22 Q -14,0 -20,12 M -4,-22 Q 10,-2 18,14 M -20,12 Q 0,24 18,14',fill:'none',stroke:'#3c1954','stroke-width':3.2},neu.nuc);
el('path',{d:'M-12,-36 C-2,-42 14,-36 12,-22 C10,-10 -8,-10 -14,-20 C-18,-28 -16,-32 -12,-36 Z',fill:'url(#gNuc)'},neu.nuc);
el('path',{d:'M-34,4 C-22,-4 -8,6 -12,20 C-16,32 -34,30 -38,18 C-40,10 -38,6 -34,4 Z',fill:'url(#gNuc)'},neu.nuc);
el('path',{d:'M12,2 C26,-4 38,10 30,24 C22,36 4,32 6,16 C8,8 8,4 12,2 Z',fill:'url(#gNuc)'},neu.nuc);
[[-2,-28],[-24,14],[20,16]].forEach(([hx,hy])=>el('circle',{cx:hx,cy:hy,r:4.5,fill:'#c3a6db',opacity:0.35},neu.nuc));

/* ---------- 4. Lymphocyte (لمفية) - X:270, Y:185 ---------- */
const lym={cx:270,cy:185,r:48,x:270,y:185};
lym.g=G(view,{filter:'url(#drop)'});
lym.mem=el('path',{d:wavyCirclePath(lym.r, 9, 2.2, 0),fill:'url(#gLymCyto)',stroke:'#7694b8','stroke-width':2},lym.g);
lym.nuc=G(lym.g);
el('path',{
  d:'M -3,-36 C 22,-38 38,-18 36,6 C 34,28 14,38 -8,36 C -28,34 -38,14 -35,-8 C -32,-26 -18,-35 -3,-36 Z',
  fill:'url(#gNuc)'
},lym.nuc);
el('ellipse',{cx:-10,cy:-12,rx:14,ry:9,transform:'rotate(-25 -10 -12)',fill:'#b594d1',opacity:0.3},lym.nuc);

/* ---------- 5. Monocyte (وحيدة) - X:130, Y:185 ---------- */
const mono={cx:130,cy:185,r:60,x:130,y:185};
mono.g=G(view,{filter:'url(#drop)'});
mono.mem=el('path',{d:wavyCirclePath(mono.r, 8, 3.8, 1.5),fill:'url(#gMonoCyto)',stroke:'#7a90a6','stroke-width':2},mono.g);
mono.nuc=G(mono.g);
el('path',{
  d:'M -32,-14 C -36,-34 -8,-44 16,-32 C 38,-20 42,10 28,30 C 18,44 2,40 4,24 C 6,10 -2,-2 -14,2 C -26,6 -28,2 -32,-14 Z',
  fill:'url(#gMonoNuc)'
},mono.nuc);
el('ellipse',{cx:6,cy:-16,rx:14,ry:7,transform:'rotate(20 6 -16)',fill:'#cfbad1',opacity:0.35},mono.nuc);

/* ---------- 6. Red Blood Cell (كرية حمراء) - X:445, Y:465 ---------- */
const rbc={cx:445,cy:465,r:52,x:445,y:465};
rbc.g=G(view,{filter:'url(#drop)'});
el('ellipse',{rx:52,ry:50,fill:'url(#gRBCOuter)',stroke:'#6e0e06','stroke-width':1.5},rbc.g);
el('ellipse',{cx:2,cy:2,rx:27,ry:25,fill:'url(#gRBCDim)'},rbc.g);
el('path',{d:'M -36,-18 A 40,38 0 0,1 18,-38',fill:'none',stroke:'#ff9b8f','stroke-width':3.5,'stroke-linecap':'round',opacity:0.55},rbc.g);

/* ---------- 7. Platelets (صفيحات دموية) - X:625, Y:465 ---------- */
const platCenter={cx:625,cy:465};
const platG=G(view,{filter:'url(#drop)'});
const platOffsets=[
  {dx:-44, dy:-18, sc:1.05, rot:10},
  {dx:2,   dy:-42, sc:0.82, rot:45},
  {dx:32,  dy:-12, sc:0.95, rot:-20},
  {dx:-6,  dy:-6,  sc:0.70, rot:15},
  {dx:-22, dy:28,  sc:0.88, rot:30},
  {dx:22,  dy:28,  sc:0.80, rot:-35}
];
const platelets=[];
function starPlateletPath(rIn, rOut, spikes){
  let d='';
  const total=spikes*2;
  for(let i=0;i<total;i++){
    const a=(i/total)*PI*2;
    const r=(i%2===0)? rOut : rIn;
    const x=r*Math.cos(a), y=r*Math.sin(a);
    d+=(i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
    if(i%2===1){
      const na=((i+1)/total)*PI*2;
      const mx=(rIn*0.75)*Math.cos((a+na)/2), my=(rIn*0.75)*Math.sin((a+na)/2);
      d+=' Q'+mx.toFixed(1)+','+my.toFixed(1)+' ';
    }
  }
  return d+'Z';
}
platOffsets.forEach((p,idx)=>{
  const g=G(platG);
  el('path',{d:starPlateletPath(9, 22, 6 + (idx%2)),fill:'url(#gPlat)',stroke:'#5c3c87','stroke-width':1},g);
  el('circle',{r:4.5,fill:'#3b1d63',opacity:0.75},g);
  el('circle',{cx:-2,cy:-2,r:2,fill:'#d7c4ed',opacity:0.6},g);
  platelets.push({g, baseDx:p.dx, baseDy:p.dy, sc:p.sc, baseRot:p.rot, x:platCenter.cx+p.dx, y:platCenter.cy+p.dy, ph:idx*1.3});
});

/* ---------- 8. Interactive Pill Labels ---------- */
const labs=[];
function label(txt,cx,py,w,tfs){
  const h=36,g=G(view,{'pointer-events':'none'}),
  lns=tfs.map(()=>el('line',{class:'ln','marker-end':'url(#ah)'},g));
  el('rect',{class:'pill',x:cx-w/2,y:py-h/2,width:w,height:h,rx:18},g);
  el('text',{class:'lbl',x:cx,y:py},g).textContent=txt;
  labs.push(()=>tfs.forEach((f,i)=>{
    const p=f(),a=lns[i];
    a.setAttribute('x1',p.sx!==undefined?p.sx:cx);
    a.setAttribute('y1',p.sy!==undefined?p.sy:py);
    a.setAttribute('x2',p[0].toFixed(1));
    a.setAttribute('y2',p[1].toFixed(1));
  }));
}

// Top Row Labels (White Blood Cells)
label('قعدة', 735, 305, 105, [
  ()=>{ const p=[baso.x, baso.y+baso.r+4]; p.sx=735; p.sy=287; return p; }
]);

label('حامضية', 575, 305, 115, [
  ()=>{ const p=[eos.x, eos.y+eos.r+4]; p.sx=575; p.sy=287; return p; }
]);

label('متعادلة', 415, 305, 115, [
  ()=>{ const p=[neu.x, neu.y+neu.r+4]; p.sx=415; p.sy=287; return p; }
]);

label('لمفية', 270, 305, 105, [
  ()=>{ const p=[lym.x, lym.y+lym.r+4]; p.sx=270; p.sy=287; return p; }
]);

label('وحيدة', 130, 305, 105, [
  ()=>{ const p=[mono.x, mono.y+mono.r+4]; p.sx=130; p.sy=287; return p; }
]);

// Bottom Row Labels (Red Blood Cell & Platelets)
label('كرية حمراء', 445, 590, 135, [
  ()=>{ const p=[rbc.x, rbc.y+rbc.r+4]; p.sx=445; p.sy=572; return p; }
]);

label('صفيحات دموية', 625, 590, 155, [
  ()=>{ const p=[platelets[4].x, platelets[4].y+18]; p.sx=610; p.sy=572; return p; },
  ()=>{ const p=[platelets[5].x, platelets[5].y+18]; p.sx=640; p.sy=572; return p; }
]);

/* ---------- 9. Animation Loop ---------- */
let T=0,last=performance.now(),paused=false;
function frame(ms){
  const dt=Math.min(.05,(ms-last)/1000);last=ms;if(!paused)T+=dt;const t=T;

  const cells=[
    {o:baso, ph:0.0, rotAmp:3.5},
    {o:eos,  ph:1.2, rotAmp:4.0},
    {o:neu,  ph:2.4, rotAmp:4.5},
    {o:lym,  ph:3.6, rotAmp:3.0},
    {o:mono, ph:4.8, rotAmp:3.5}
  ];
  cells.forEach(({o,ph,rotAmp})=>{
    o.x = o.cx + 3.2*Math.sin(t*1.1 + ph);
    o.y = o.cy + 4.0*Math.cos(t*0.9 + ph);
    const rot = rotAmp*Math.sin(t*0.7 + ph);
    o.g.setAttribute('transform',`translate(${o.x.toFixed(1)} ${o.y.toFixed(1)}) rotate(${rot.toFixed(2)})`);
  });

  lym.mem.setAttribute('d', wavyCirclePath(lym.r, 9, 2.2, t*2.2));
  mono.mem.setAttribute('d', wavyCirclePath(mono.r, 8, 3.8, -t*1.8 + 1.5));

  [baso, eos, neu].forEach(cell=>{
    cell.grans.forEach(gr=>{
      const dx=gr.gx + 1.1*Math.sin(t*2.4 + gr.ph);
      const dy=gr.gy + 1.1*Math.cos(t*2.1 + gr.ph);
      gr.c.setAttribute('cx',dx.toFixed(1));
      gr.c.setAttribute('cy',dy.toFixed(1));
    });
  });

  rbc.x = rbc.cx + 3.5*Math.cos(t*1.0);
  rbc.y = rbc.cy + 4.2*Math.sin(t*1.2);
  const rbcRot = 6*Math.sin(t*0.8);
  const rbcScaleX = 1 + 0.04*Math.sin(t*1.5);
  rbc.g.setAttribute('transform',`translate(${rbc.x.toFixed(1)} ${rbc.y.toFixed(1)}) rotate(${rbcRot.toFixed(1)}) scale(${rbcScaleX.toFixed(3)} 1)`);

  platelets.forEach(p=>{
    p.x = platCenter.cx + p.baseDx + 3.0*Math.sin(t*1.5 + p.ph);
    p.y = platCenter.cy + p.baseDy + 3.0*Math.cos(t*1.3 + p.ph);
    const rot = p.baseRot + 8*Math.sin(t*1.1 + p.ph);
    const sc = p.sc*(1 + 0.05*Math.sin(t*2.2 + p.ph));
    p.g.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${sc.toFixed(3)})`);
  });

  labs.forEach(f=>f());
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------- zoom & pan ---------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:350});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:350});
document.getElementById('zreset').onclick=reset;

/* ---------- fullscreen ---------- */
const fsBtn=document.getElementById('fs'),de=document.documentElement;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{
  const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;
    if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
    setFs(true);
  }else{
    if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}
    setFs(false);
  }
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
})();
</script>
</body>
