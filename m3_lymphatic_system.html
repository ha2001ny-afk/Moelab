<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>الجهاز اللمفاوي</title>
<meta name="theme-color" content="#1f3a52">
<meta name="mobile-web-app-capable" content="yes">

<style>
  /* Same plate pattern as the vitamins reference: navy title bar, full stage, round control buttons.
     Home = one frosted-glass topic card over a soft coloured field; each card opens its own view. */
  :root{--navy:#1f3a52;--rust:#c4623a;--ink:#26384a;--paper:#eef6fb;--white:#ffffff;--muted:#5f7387;
        --glass:rgba(255,255,255,.66);--glass-b:rgba(255,255,255,.78);
        --c-lym:#2e7d4f;color-scheme:light;
        /* offline: fonts already on the device only (Cairo is used if installed) */
        --ff:"Cairo","Segoe UI","SF Arabic","Geeza Pro","Noto Sans Arabic","Noto Kufi Arabic","Noto Naskh Arabic",Tahoma,"Droid Arabic Naskh",Arial,sans-serif;
        --az:1;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  /* automatic scale for large screens (smart TV / 4K / big monitors) */
  @media (min-width:1600px) and (min-height:820px){:root{--az:1.18}}
  @media (min-width:2200px) and (min-height:1150px){:root{--az:1.5}}
  @media (min-width:3000px) and (min-height:1600px){:root{--az:2}}
  [hidden]{display:none!important}
  html{height:100%;overflow:hidden;background:var(--paper)}
  body{position:relative;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);direction:rtl;
       font-family:var(--ff);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:var(--navy);
       padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:7}
  #title{color:var(--white);font-size:clamp(15px,3.6vw,22px);font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stage{position:absolute;top:0;bottom:0;left:0;right:0;overflow:hidden;background:#e9f3f9}
  /* coloured field behind the glass so the frosting reads */
  #field{position:absolute;inset:-10%;pointer-events:none}
  #field i{position:absolute;border-radius:50%;opacity:.55}
  #field i:nth-child(1){width:46vmax;height:46vmax;background:radial-gradient(closest-side,#8fd6a8,transparent);top:2%;right:-6%}
  #field i:nth-child(2){width:40vmax;height:40vmax;background:radial-gradient(closest-side,#c9e98f,transparent);bottom:-4%;left:30%}
  #field i:nth-child(3){width:38vmax;height:38vmax;background:radial-gradient(closest-side,#9cc8f0,transparent);top:12%;left:-8%}
  #field i:nth-child(4){width:24vmax;height:24vmax;background:radial-gradient(closest-side,#c3b5f2,transparent);bottom:8%;right:16%;opacity:.45}
  #field::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(31,58,82,.08) 1px,transparent 1px);background-size:22px 22px}
  .view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
        padding:max(24px,calc(env(safe-area-inset-top,0px) + 12px)) max(16px,env(safe-area-inset-right,0px)) max(32px,calc(env(safe-area-inset-bottom,0px) + 16px)) calc(68px * var(--az,1) + env(safe-area-inset-left,0px));box-sizing:border-box;overscroll-behavior:contain}
  .view>*{zoom:calc(var(--z,1) * var(--az,1))}
  .glass{background:var(--glass);border:1.5px solid var(--glass-b);border-radius:26px;
         
         box-shadow:0 18px 40px rgba(31,58,82,.16),inset 0 1px 0 rgba(255,255,255,.9)}
  /* coloured glass: each card / pane is tinted with its own colour */
  .tint{background:linear-gradient(155deg,var(--tint) 0%,rgba(255,255,255,.30) 62%,var(--tint2) 100%);border-color:var(--tintb)}
  .tint .art{background:transparent;border-color:transparent}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(255,255,255,.82)}.tint{background:linear-gradient(155deg,var(--tint) 0%,rgba(255,255,255,.9) 62%)}}
  /* home */
  #home{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(18px,3vh,32px)}
  #home>.lead{margin-top:auto}#home>.grid{margin-bottom:auto}
  .lead{margin-bottom:0;margin-inline:0;text-align:center;display:flex;flex-direction:column;gap:2px}
  .lead b{font-size:clamp(24px,4.4vw,40px);font-weight:800;color:var(--navy);text-wrap:balance}
  .lead span{font-size:clamp(14px,2vw,17px);font-weight:600;color:var(--muted)}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,3vw,40px);width:100%;max-width:980px}
  .card{position:relative;flex:1 1 320px;max-width:440px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;
        padding:18px 18px 22px;cursor:pointer;font:inherit;color:inherit;text-align:center;overflow:hidden;
        transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
  .card:nth-child(2){animation-delay:.15s}.card:nth-child(3){animation-delay:.3s}
  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  .card::before{content:"";position:absolute;inset:auto -20% -40% -20%;height:70%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.22;pointer-events:none}
  .card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);transition:left .7s}
  @media (hover:hover) and (pointer:fine){
    .card:hover{transform:translateY(-6px);box-shadow:0 26px 50px rgba(31,58,82,.22),inset 0 1px 0 #fff}
    .card:hover::after{left:130%}}
  .card:active{transform:scale(.98)}
  .card:focus-visible{transform:translateY(-6px)}
  .card:focus-visible{outline:3px solid var(--rust);outline-offset:4px}
  .art{width:100%;aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center;
       border-radius:18px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8)}
  .art svg,.art img{width:100%;height:100%;display:block}
  .art img{object-fit:contain}
  .num{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.18);z-index:1}
  .ar{font-size:clamp(20px,2.4vw,26px);font-weight:800;color:var(--c);line-height:1.35;margin-top:6px;text-wrap:balance}
  .en{direction:ltr;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .go{margin-top:8px;display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border-radius:999px;background:var(--c);color:#fff;font-weight:800;font-size:14px}
  .go svg{width:16px;height:16px}
  /* disease view */
  .dz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;max-width:1180px;margin:0 auto;align-items:start}
  .dz .pane{padding:18px;min-width:0}
  .dz .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .dz .hd b{font-size:clamp(22px,3vw,32px);font-weight:800;color:var(--c)}
  .dz .hd span{direction:ltr;font-weight:700;color:var(--muted)}
  .dz .big{aspect-ratio:var(--ar,4/3);position:relative}
  .slot{min-height:260px;border:2.5px dashed rgba(31,58,82,.25);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:24px;box-sizing:border-box}
  .slot b{color:var(--navy);font-size:18px}
  .side{position:sticky;top:0}
  .facts{margin:14px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .facts div{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:8px 12px;min-width:0}
  .facts dt{font-size:13px;font-weight:700;color:var(--muted)}
  .facts dd{margin:0;font-size:16px;font-weight:800;color:var(--navy)}
  .facts i,.intro i{font-family:Georgia,"Times New Roman",serif;font-weight:700;color:var(--c)}
  .steps{display:flex;flex-wrap:wrap;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.65);width:fit-content;max-width:100%;box-sizing:border-box}
  .steps button{border:0;border-radius:999px;padding:7px 16px 7px 12px;font:800 16px var(--ff);color:var(--navy);background:transparent;cursor:pointer;display:flex;align-items:center;gap:8px}
  .steps .sn{width:24px;height:24px;border-radius:50%;background:rgba(31,58,82,.12);display:flex;align-items:center;justify-content:center;font-size:13px}
  .steps button[aria-selected="true"]{background:var(--c);color:#fff}
  .steps button[aria-selected="true"] .sn{background:rgba(255,255,255,.3)}
  .sec{min-height:320px;padding:6px 4px}
  .sec h3{display:flex;align-items:center;gap:10px;margin:18px 0 14px;font-size:clamp(22px,2.6vw,28px);font-weight:800;color:var(--c)}
  .sec h3 small{font-size:.62em;color:var(--muted);font-weight:700}
  .hi{width:42px;height:42px;border-radius:12px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .hi svg{width:24px;height:24px}
  .intro{margin:0;font-size:clamp(17px,1.8vw,20px);line-height:2.05;font-weight:600;max-width:62ch}
  .tx mark,.intro mark{background:linear-gradient(transparent 55%,rgba(31,58,82,.12) 55%);background:linear-gradient(transparent 55%,color-mix(in srgb,var(--c) 24%,transparent) 55%);color:var(--navy);font-weight:800;padding:0 2px}
  .steps{border-radius:22px}
  .sec h4{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:clamp(17px,1.9vw,21px);font-weight:800;color:var(--navy)}
  .sec h4::before{content:"";width:6px;height:1.3em;border-radius:3px;background:var(--c);flex:none}
  .sec h4 small{direction:ltr;font-size:.72em;color:var(--muted);font-weight:700}
  .sec .intro+ol,.sec h4+ol{margin-top:6px}
  .sec .intro.s{font-size:clamp(16px,1.7vw,19px);line-height:1.95;margin:0 0 10px;max-width:none}
  .tx b{color:var(--c);font-weight:800}
  .think{position:relative;margin:20px 0 4px;padding:14px 16px 14px 16px;border-radius:18px;border:2.5px dashed #3c9a3c;background:rgba(236,250,232,.75);display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
  .think .tb{width:46px;height:46px;border-radius:50%;background:#ffd43b;color:#7a5a00;display:flex;align-items:center;justify-content:center;animation:bulb 2.4s ease-in-out infinite}
  .think .tb svg{width:26px;height:26px}
  .think b{display:block;color:#2e7d32;font-size:18px;font-weight:800}
  .think span{font-size:clamp(16px,1.7vw,19px);font-weight:700;line-height:1.8;color:var(--navy)}
  @keyframes bulb{0%,100%{box-shadow:0 0 0 0 rgba(255,212,59,.6)}50%{box-shadow:0 0 0 10px rgba(255,212,59,0)}}
  .dz .big.swap{animation:swapIn .5s ease}
  @keyframes swapIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .dz .big{max-height:62vh;margin-inline:auto}
  .spotr{fill:none;stroke:var(--c);stroke-width:6;stroke-dasharray:22 14;animation:ants 1.2s linear infinite}
  @keyframes ants{to{stroke-dashoffset:-36}}
  .facts.swap{animation:swapIn .45s ease}
  .sec ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .sec li{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:start;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95)}
  .ii{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center}
  .ii svg{width:26px;height:26px}
  .nb{font-weight:800;font-size:20px;color:var(--c);line-height:46px}
  .tx{font-size:clamp(16px,1.7vw,19px);font-weight:600;line-height:1.85;padding-top:6px}
  .ln{opacity:0;animation:lnIn .6s cubic-bezier(.2,.8,.2,1) var(--d,0s) forwards}
  @keyframes lnIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  .nav button{border:2px solid var(--c);border-radius:999px;padding:7px 20px;font:800 15px var(--ff);cursor:pointer;background:var(--white);color:var(--c)}
  .nav #nxt{background:var(--c);color:#fff}
  .nav button:disabled{opacity:.35;cursor:default}
  /* tablets in portrait (iPad) and below: one column, picture on top */
  @media (max-width:920px){.dz{grid-template-columns:minmax(0,1fr)}.side{position:static}
    .dz .side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;align-items:center}
    .dz .side .hd{grid-column:1/-1}.dz .side .facts{margin:0}.dz .big{max-height:300px}}
  @media (max-width:760px){.sec li{grid-template-columns:auto minmax(0,1fr)}.sec .nb{display:none}}
  /* phones */
  @media (max-width:560px){
    .dz .side{display:block}.dz .big{max-height:320px;margin:0 auto}.dz .side .facts{margin-top:12px}
    .dz .pane{padding:14px}.glass{border-radius:20px}
    .steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;border-radius:18px}
    .steps button{justify-content:center;padding:8px 10px}
    .sec{min-height:0}.sec li{padding:10px;gap:10px}.ii{width:40px;height:40px}.ii svg{width:22px;height:22px}
    .nav button{flex:1;padding:9px 10px}
    .card{flex-basis:100%;max-width:420px}}
  @media (max-width:360px){.facts{grid-template-columns:minmax(0,1fr)}.steps button{font-size:14px}}
  /* phones in landscape: short screens */
  @media (max-height:520px) and (orientation:landscape){
    .card{flex:1 1 200px;max-width:280px;padding:12px 12px 14px}.ar{font-size:18px}.go{display:none}
    .lead b{font-size:22px}.dz{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}.side{position:sticky}
    .dz .side{display:block}.dz .big{max-height:none}}
  /* controls (same as reference) */
  .zb{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:8;zoom:var(--az,1)}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);background:var(--white);color:var(--navy);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
  .zb button svg{width:20px;height:20px}
  .zb .zt{font-size:26px;font-weight:700;line-height:1}
  .zb button:disabled{opacity:.4;cursor:default}
  #home-btn{background:var(--rust);border-color:var(--rust);color:var(--white)}
  #play.on{background:var(--navy);color:var(--white)}
  button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
  @media (max-width:720px) and (min-height:521px),(max-aspect-ratio:4/5){
    .zb{flex-direction:row;gap:6px;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px))}
    .zb button{width:34px;height:34px}.zb .zt{font-size:21px}.zb button svg{width:16px;height:16px}
    .view{padding-top:calc(56px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
    .zb{padding:4px;border-radius:999px;background:rgba(238,246,251,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  }
  body.pf #top{display:none}
  body.pf #stage{top:0}
  /* ===== inside a topic: everything floats directly on the page — no panes, boxes, borders or backgrounds ===== */
  #detail{overflow-x:auto;touch-action:auto}
  #detail .pane{background:none;border:0;border-radius:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:4px 6px}
  #detail .art,#detail .big{background:none;border:0;border-radius:0}
  #detail .facts{gap:6px 18px}
  #detail .facts div{background:none;border:0;border-radius:0;padding:4px 0}
  #detail .facts dt{font-size:13px}
  #detail .steps{background:none;padding:0;gap:6px 8px}
  #detail .steps button{background:rgba(31,58,82,.07)}
  #detail .steps button[aria-selected="true"]{background:var(--c)}
  #detail .sec li{background:none;border:0;border-radius:0;padding:6px 0}
  #detail .ii{background:none;border:0;border-radius:0;width:34px;height:40px}
  #detail .ii svg{width:30px;height:30px}
  #detail .think{background:none;border:0;border-radius:0;padding:0}
  #detail .nav button{background:none}
  #detail .nav #nxt{background:var(--c)}
  /* pinch-zoomable figure */
  #detail .big{overflow:hidden;touch-action:auto;cursor:zoom-in}
  #detail .big.zoomed{cursor:grab}
  #detail .big.zoomed:active{cursor:grabbing}
  #detail .big svg{transform-origin:0 0;will-change:transform}
  #detail .big .rz{position:absolute;top:6px;left:6px;z-index:2;display:none;align-items:center;gap:4px;padding:4px 10px;border:0;border-radius:999px;background:var(--navy);color:#fff;font:800 13px var(--ff);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  #detail .big.zoomed .rz{display:flex}
  #detail .big .rz svg{width:14px;height:14px}
  @media (max-width:560px){#detail .pane{padding:2px 0}#detail .ii{width:28px}#detail .ii svg{width:26px;height:26px}}
  /* layout inside a topic: explanation on the right, figure on the left (bigger), no title above the figure */
  #detail .hd{display:none}
  #detail .dz{grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:1320px;gap:28px}
  #detail .dz>#lesson{order:1}
  #detail .dz>.side{order:2;padding-top:6px}
  #detail .dz .big{max-height:76vh;width:100%}
  @media (max-width:920px){#detail .dz{grid-template-columns:minmax(0,1fr)}#detail .dz>.side{order:0}#detail .dz .big{max-height:52vh}}
  @media (max-height:520px) and (orientation:landscape){#detail .dz{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}#detail .dz .big{max-height:80vh}}
  /* topic title band above the step buttons */
  .tband{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 14px;margin:0 0 14px;padding:10px 20px;border-radius:16px;
         background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#1f3a52));background-color:var(--c);color:#fff;
         box-shadow:0 8px 20px color-mix(in srgb,var(--c) 30%,transparent)}
  .tband b{font-size:clamp(20px,2.6vw,28px);font-weight:800;line-height:1.4}
  .tband span{font-size:clamp(12px,1.3vw,15px);font-weight:700;opacity:.85}
  @media (max-width:560px){.tband{padding:8px 14px;border-radius:14px}}
  @media print{.zb,#field{display:none}html,body,#stage,.view{position:static;height:auto;overflow:visible}}
  @media (prefers-reduced-motion:reduce){.card,.ln,.spotr,.think .tb,.dz .big.swap,.facts.swap{animation:none;opacity:1}.card::after{display:none}}
</style>
<script>/* منع تكبير الصفحة كاملة بإصبعين (آيباد/سفاري) — التكبير داخل المحاكاة يبقى شغال */
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();});});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1&&e.cancelable&&!(e.target.closest&&e.target.closest('.big')))e.preventDefault();},{passive:false});
</script></head>
<body>
<div id="stage">
  <div id="field"><i></i><i></i><i></i><i></i></div>
  <div id="home" class="view">
    <p class="lead"><b>الجهاز اللمفاوي</b><span>اختر البطاقة لبدء الشرح</span></p>
    <div class="grid" id="grid"></div>
  </div>
