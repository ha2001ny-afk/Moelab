  s.sp.forEach((p,i)=>{[-1,-.5,0,.5,1].forEach((o,k)=>{const d=polar[i][k];d.setAttribute('d',`M${CX+p.x1},${CY+p.y1}Q${CX+(p.x1+p.x2)/2},${CY+(p.y1+p.y2)/2+o*2*p.h} ${CX+p.x2},${CY+p.y2}`);d.setAttribute('stroke-opacity',(p.pf*.6).toFixed(2));});});
  const KM=idx<=MI?KMI:KMII;
  kin.forEach((ln,id)=>{const m=KM[id],p=s.sp[m[0]],c=s.ch[id];
    ln.setAttribute('x1',CX+(m[1]?p.x2:p.x1));ln.setAttribute('y1',CY+(m[1]?p.y2:p.y1));ln.setAttribute('x2',CX+c.x);ln.setAttribute('y2',CY+c.y);ln.setAttribute('stroke-opacity',(p.kf*.7).toFixed(2));});
  s.nuc.forEach((q,i)=>{const o=nuc[i],cx=CX+q.x,cy=CY+q.y;o.g.setAttribute('display',Math.max(q.f,q.e)<.02?'none':'');
    for(const e of[o.f,o.e]){e.setAttribute('cx',cx);e.setAttribute('cy',cy);e.setAttribute('rx',q.r);e.setAttribute('ry',q.r*.97);}
    o.f.setAttribute('fill-opacity',q.f);o.e.setAttribute('stroke-opacity',Math.min(1,q.e*1.2));
    o.e.setAttribute('stroke-dasharray',(3+8*q.e).toFixed(1)+' '+(6+16*(1-q.e)).toFixed(1));o.e.setAttribute('stroke-dashoffset',(t*8).toFixed(1));});
  {const q=s.nuc[0];nlE.setAttribute('cx',CX+q.x+42);nlE.setAttribute('cy',CY+q.y+38);nlE.setAttribute('opacity',s.nl.toFixed(2));}
  s.ch.forEach((c,id)=>{
    const lf=id<4?1:.72,co=Math.cos(c.rot*PI/180),si=Math.sin(c.rot*PI/180),pts=[];
    const bp=[];
    for(let k=0;k<K;k++){const tt=k/(K-1)*2-1,th=thr[id>>1][k],j=2.5*Math.sin(t*2+k*.7+(id>>1))*(1-c.co);
      const lx=(1-c.co)*(th[0]*c.sc*lf+j)+c.co*(c.be*24*lf*Math.abs(tt-c.bc)),ly=(1-c.co)*(th[1]*c.sc*lf)+c.co*tt*30*lf*c.ln;
      const px=CX+c.x+lx*co-ly*si,py=CY+c.y+lx*si+ly*co;
      pts.push(px.toFixed(1)+','+py.toFixed(1));if(k%4===2)bp.push([px,py]);}
    beads[id].forEach((b,i)=>{b.setAttribute('cx',bp[i][0].toFixed(1));b.setAttribute('cy',bp[i][1].toFixed(1));b.setAttribute('opacity',s.bd.toFixed(2));b.setAttribute('display',s.bd<.02?'none':'');});
    const w=(2+c.co*4.5).toFixed(1);
    chr[id].setAttribute('points',pts.join(' '));chr[id].setAttribute('stroke-width',w);
    if(ov[id]){ov[id].setAttribute('points',pts.slice(0,K0+1).join(' '));ov[id].setAttribute('stroke-width',w);ov[id].setAttribute('opacity',s.mx.toFixed(2));}
    const l0=c.co*c.be*24*lf*Math.abs(c.bc);cmr[id].setAttribute('cx',CX+c.x+l0*co);cmr[id].setAttribute('cy',CY+c.y+l0*si);cmr[id].setAttribute('opacity',Math.max(0,c.co*2-1));
  });
  cen.forEach((g,i)=>{const p=s.sp[i>>1],a=s.ca[i];g.setAttribute('display',a<.02?'none':'');g.setAttribute('opacity',a);
    g.setAttribute('transform',`translate(${CX+(i%2?p.x2:p.x1)} ${CY+(i%2?p.y2:p.y1)}) scale(${(1+.08*Math.sin(t*3+i)).toFixed(3)})`);});
  /* labels */
  const q0=s.nuc[0],tg=[
    [CX+q0.x-.4*q0.r,CY+q0.y-.4*q0.r],
    [CX+q0.x-.707*q0.r,CY+q0.y-.707*q0.r],
    [CX+s.ch[0].x,CY+s.ch[0].y],
    fiberPt(s.sp[idx<=MI?0:1],1,.25),
    [CX+q0.x+42,CY+q0.y+38],
    [CX+(s.ch[0].x+s.ch[2].x)/2,CY+s.ch[0].y+28],
    [CX+(s.ch[0].x+s.ch[2].x)/2,CY+s.ch[0].y+22],
    [CX+(s.ch[0].x+s.ch[3].x)/2,CY+s.ch[0].y-12],
    [CX+(s.ch[0].x+s.ch[3].x)/2,CY+s.ch[0].y+s.ch[0].bc*30*s.ch[0].ln]];
  LB.forEach((l,k)=>{const a=s.lab[k];l.g.setAttribute('opacity',a.toFixed(2));if(a<.02)return;l.ln.setAttribute('x2',tg[k][0]);l.ln.setAttribute('y2',tg[k][1]);l.dt.setAttribute('cx',tg[k][0]);l.dt.setAttribute('cy',tg[k][1]);});
}
function frame(ms){const t=ms/1000,k=Math.min(1,(ms-t0)/DUR);cur=lerp(from,to,ease(k));render(cur,t);requestAnimationFrame(frame);}


/* ---------------- شرح ادوار الطور التمهيدي I ---------------- */
const E=t=>'<span class="en">'+t+'</span>';
const INFO=[
 ['الدور القلادي ('+E('Leptotene')+')','تكون الكروموسومات في هذا الدور بشكل خيوط طويلة نحيفة مفردة ذات تثخنات شبيهة بالفصوص او الخرز مما يضفي على الكروموسومات شكل القلادة ، ويكون ال '+E('DNA')+' متضاعفا في كل كروموسوم .'],
 ['الدور الازدواجي ('+E('Zygotene')+')','تتراصف الكروموسومات المتماثلة في هذا الدور وتزدوج، وبعد ازدواجها يلتوي بعضها على البعض الآخر وتدعى العملية بالأيثاق او التشابك ('+E('Synapsis')+') ويسمى الكروموسومان المزدوجان بالثنائي ('+E('Bivalent')+') ، وهذه العملية تشكل صفة مميزة للانقسام الاختزالي اذ لاتحدث في الانقسام الخيطي (الاعتيادي) .'],
 ['الدور التغلظي ('+E('Pachytene')+')','يزداد في هذا الدور تكثف الكروموسومات وتغلظها ويقل طولها. ويظهر في هذا الدور تضاعف كل كروموسوم الى كروماتيدين واضحين ، يرتبطان فيما بينهما بوساطة جزئيهما المركزيين ('+E('Centromeres')+') ويطلق على كل كروماتيدين يكونا نفس الكروموسوم بالشقيقين ('+E('Sister Chromatides')+') يظهر في هذا الدور كل زوج من الكروموسومات المتماثلة مكونا من حزمة مؤلفة من اربعة كروماتيدات ، وتدعى هذه الحزمة بالرباعي ('+E('Tetrad')+') ، ولناخذ مثلاً خلية الانسان نجدها تحوي في هذا الدور (23) رباعياً اي (92) كروماتيد كمجموع كلي ويحصل في هذا الدور تبادل في مواقع المورثات بين الكرموسومين المتماثلين وتدعى عملية التبادل هذه بالتعابر ('+E('Crossing Over')+') .'],
 ['الدور الانفراجي ('+E('Diplotene')+')','يبدأ في هذا الدور كل كروموسومين متماثلين الابتعاد عن بعضهما ، ويبقى الكروماتيدان غير الشقيقين مرتبطان بنقطة واحدة او اكثر ، وتدعى نقاط الارتباط بالتصالبات ('+E('Chiasmata')+') ويختلف موقع وعدد التصالبات من كروموسوم الى آخر ومن خلية الى اخرى وتتبادل قطع الكروماتيدات غير الشقيقة في كل منطقة تصالب ('+E('Chiasma')+') بعضها مع بعض.'],
 ['الدور الحركي ('+E('Diakinesis')+')','يمثل هذا الدور آخر ادوار الطور التمهيدي وفيه تزداد الكروموسومات ( كروماتيدات الكروموسومات المتماثلة ) قصراً وتغلظاً ، تبدأ النوية والغشاء النووي بالانحلال التدريجي وتتحرك مواقع التصالبات باتجاه نهايات الكروموسومات وينتج عن ذلك تناقص في عدد التصالبات .']
];
const infoEl=document.getElementById('info'),infoBtn=document.getElementById('zinfo');let infoClosed=false;
const stageEl=document.getElementById('stage');
function placeInfo(){
  svg.style.width='';svg.style.height='';svg.style.marginRight='';
  if(infoEl.hidden){infoEl.classList.remove('side');return;}
  const W=stageEl.clientWidth,Hh=stageEl.clientHeight;
  const side=W>Hh*1.15&&W>=700;infoEl.classList.toggle('side',side);
  if(side){const pw=infoEl.offsetWidth+24;svg.style.width=(W-pw)+'px';svg.style.marginRight=pw+'px';}
  else{svg.style.height=Math.max(200,Hh-infoEl.offsetHeight-110)+'px';}
}
function showInfo(i){const ok=i<INFO.length;infoBtn.style.display=ok?'':'none';
  if(ok){document.getElementById('infoT').innerHTML=INFO[i][0];document.getElementById('infoB').innerHTML=INFO[i][1];infoEl.scrollTop=0;}
  infoEl.hidden=!ok||infoClosed;placeInfo();}
addEventListener('resize',placeInfo);
document.getElementById('infoX').onclick=()=>{infoClosed=true;infoEl.hidden=true;placeInfo();};
infoBtn.onclick=()=>{infoClosed=!infoClosed;showInfo(idx);};
infoEl.addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------------- navigation ---------------- */
const subTitle=document.getElementById('subTitle'),dotsEl=document.getElementById('dots'),dots=[];
names.forEach((_,i)=>{const b=document.createElement('button');b.className=i<5?'dot sub':'dot';if(i===5||i===8)b.style.marginInlineStart='14px';b.onclick=()=>go(i);dotsEl.appendChild(b);dots.push(b);});
function setUI(i){showInfo(i);subTitle.style.opacity=0;setTimeout(()=>{subTitle.textContent=names[i];subTitle.style.opacity=1;},180);dots.forEach((d,k)=>d.classList.toggle('on',k===i));}
function go(i){
  if(i<0||(i===idx&&t0>0))return;
  if(i>=S.length){svg.style.opacity=0;setTimeout(()=>{idx=0;from=to=PRE;cur=lerp(PRE,PRE,0);t0=-1e9;svg.style.opacity=1;go2(0);},320);return;}
  go2(i);
}
function go2(i){from=cur;to=S[i];t0=performance.now();idx=i;setUI(i);}
document.getElementById('next').onclick=()=>go(idx+1);
document.getElementById('prev').onclick=()=>go(idx-1);

/* ---------------- fullscreen ---------------- */
function toggleFS(){
  const d=document,de=d.documentElement;
  const req=de.requestFullscreen||de.webkitRequestFullscreen||de.mozRequestFullScreen||de.msRequestFullscreen;
  const exit=d.exitFullscreen||de.webkitExitFullscreen||de.mozCancelFullScreen||de.msExitFullscreen;
  const isFS=d.fullscreenElement||d.webkitFullscreenElement;
  if(!isFS){if(req)req.call(de).catch(()=>{});}
  else{if(exit)exit.call(d).catch(()=>{});}
}
document.getElementById('zfs').onclick=toggleFS;

/* keyboard navigation */
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown')go(idx+1);
  else if(e.key==='ArrowRight'||e.key==='PageUp')go(idx-1);
  else if(e.key==='f'||e.key==='F')toggleFS();
  else if(e.key==='+'||e.key==='=')zoomAt(1.3,{x:450,y:350});
  else if(e.key==='-'||e.key==='_')zoomAt(1/1.3,{x:450,y:350});
  else if(e.key==='0')reset();
});

go2(0);requestAnimationFrame(frame);

/* ---------------- zoom & pan ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:350});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:350});
document.getElementById('zreset').onclick=reset;
apply();
})();

<script>window.MOE_MIN_DATA={"sections":{"g":"عام","m1":"الانقسام الاختزالي الأول","m2":"الانقسام الاختزالي الثاني"},"names":{},"qs":[{"sec":"g","type":"ما وظيفة","tags":["1/2017 أسئلة خارج القطر"],"q":"ما وظيفة الانقسام الاختزالي ؟","a":{"p":"الحفاظ على عدد ثابت من الكروموسومات لأفراد الأنواع المختلفة من الأحياء خلال عملية تعاقب الأجيال الذي يتم خلاله تكوين الأمشاج كالبيوض والنطف في الحيوانات والأبواغ في النباتات ."}},{"sec":"g","type":"متى ولماذا","tags":["2/1988","3/2014"],"q":"متى تحدث عملية الانقسام الاختزالي ؟ وما أهميتها ؟","a":{"dl":[["متى تحدث","تحدث عملية الانقسام الاختزالي خلال تكوين الأمشاج ( البيوض والنطف في الحيوانات والأبواغ في النباتات ) ."],["أهميتها","تهدف عملية الانقسام الاختزالي إلى الحفاظ على عدد ثابت من الكروموسومات لأفراد الأنواع المختلفة من الأحياء خلال عملية تعاقب الأجيال ."]]}},{"sec":"g","type":"علّل","tags":["2/1997"],"q":"حدوث عملية الانشطار الاختزالي .","a":{"p":"وذلك للحفاظ على عدد ثابت من الكروموسومات لأفراد الأنواع المختلفة من الأحياء خلال عملية تعاقب الأجيال الذي يتم خلاله تكوين الأمشاج كالبيوض والنطف في الحيوانات والأبواغ في النباتات ."}},{"sec":"g","type":"حدد المسؤول","tags":["1/2022","2/2025"],"q":"حدد المسؤول عن : ثبات عدد الكروموسومات وعدم تضاعفها عبر الأجيال ؟","a":{"p":"عملية الانقسام الاختزالي ."}},{"sec":"g","type":"علّل","tags":["2/2023 أسئلة المتميزين"],"q":"يحافظ الانقسام الاختزالي على عدد الكروموسومات ثابت عبر الأجيال .","a":{"p":"وذلك لأنه يتم خلال الانقسام الاختزالي اختزال عدد الكروموسومات إلى نصف العدد الكامل لكروموسومات الخلايا الجسمية ، ولذلك نجد أن الأمشاج تحتوي نصف عدد الكروموسومات الموجود في الخلايا الجسمية ، وعند التحام نواتين لخليتين أو مشيجين لتكوين أول خلية جنينية فإن الأخيرة تحوي عدد كامل من الكروموسومات ."}},{"sec":"g","type":"املأ الفراغ","tags":["1/2023"],"q":"تتم عملية الانقسام الاختزالي من خلال انقسامين نووين ، يتم خلال الانقسام الأول فصل {الكروموسومات المتماثلة} ، أما الانقسام الثاني فيتم فيه فصل {كروماتيدي الكروموسوم أو الكروماتيدات الشقيقة} ."},{"sec":"m1","type":"ما ميزة","tags":["1/2023 أسئلة المتميزين"],"q":"ما ميزة الطور التمهيدي الأول ؟","a":{"p":"يمتاز هذا الطور بكونه بطيء حيث يتضمن خمسة أدوار ذات ميزات خاصة بها ."}},{"sec":"m1","type":"وضّح","tags":["1/2001"],"q":"ما هي التغيرات التي تطرأ على الكروموسومات في الدور القلادي ؟","a":{"p":"تكون الكروموسومات في هذا الدور بشكل خيوط طويلة نحيفة مفردة ذات تثخنات شبيهة بالفصوص أو الخرز مما يضفي على الكروموسومات شكل القلادة ، ويكون الـ DNA متضاعفاً في كل كروموسوم ."}},{"sec":"m1","type":"ما ميزة","tags":["2/2021","1/2025"],"q":"ما ميزات الكروموسومات في الدور القلادي ؟","a":{"ol":["تكون الكروموسومات بشكل خيوط طويلة .","نحيفة .","مفردة .","ذات تثخنات شبيهة بالفصوص أو الخرز مما يضفي على الكروموسومات شكل القلادة .","يكون الـ DNA متضاعفاً في كل كروموسوم ."]}},{"sec":"m1","type":"عرّف","tags":["2/2016 أسئلة خارج القطر"],"q":"عرّف الثنائي ؟","a":{"p":"وهو عبارة عن كروموسومان متماثلان مزدوجان حيث يلتوي بعضهما على البعض الآخر ، وتحدث هذه الظاهرة في الدور الازدواجي من الطور التمهيدي الأول وتعتبر صفة مميزة للانقسام الاختزالي فقط ."}},{"sec":"m1","type":"علّل","tags":["1/2006","1/2008"],"q":"الإيثاق ( التشابك ) صفة مميزة للانقسام الاختزالي .","a":{"p":"لأن عملية الإيثاق ( التشابك ) لا تحدث في الانقسام الخيطي ( الاعتيادي ) إذ تتراصف الكروموسومات المتماثلة وتزدوج وبعد ازدواجها يلتوي بعضها على البعض الآخر بعملية الإيثاق ( التشابك ) ويسمى الكروموسومان المزدوجان بالثنائي ."}},{"sec":"m1","type":"علّل","tags":["2/2004"],"q":"يظهر عدد الكروموسومات في الدور الازدواجي كأنه نصف العدد الأصلي .","a":{"p":"وذلك بسبب تراصف الكروموسومات المتماثلة في هذا الدور وازدواجهما وبعد اكتمال ازدواجهما يلتوي بعضها على البعض وتدعى العملية بالإيثاق أو التشابك ."}},{"sec":"m1","type":"ما ميزة","tags":["1/2019"],"q":"ما مميزات الدور الازدواجي ؟","a":{"ol":["تتراصف الكروموسومات المتماثلة في هذا الدور وتزدوج .","بعد ازدواجها يلتوي بعضها على البعض الآخر وتدعى العملية بالإيثاق أو التشابك .","يسمى الكروموسومان المزدوجان بالثنائي ."]}},{"sec":"m1","type":"املأ الفراغ","tags":["2023 تمهيدي"],"q":"يتضاعف الجسيم المركزي في الطور {البيني} ويحدث الإيثاق في الدور {الازدواجي} ."},{"sec":"m1","type":"عرّف","tags":["1/2016","1/2025"],"q":"عرّف التعابر ( العبور ) ؟","a":{"p":"وهي ظاهرة تحصل في الدور التغلظي من الطور التمهيدي الأول للانقسام الاختزالي الأول ، ويحصل فيها تبادل في مواقع المورثات بين الكروموسومين المتماثلين ."}},{"sec":"m1","type":"وضّح","tags":["1/2018"],"q":"ماذا يحدث للكروموسومات في الدور التغلظي ؟ وضّح ذلك .","a":{"ol":["يزداد في هذا الدور تكثف الكروموسومات وتغلظها ويقل طولها .","ويظهر في هذا الدور تضاعف كل كروموسوم إلى كروماتيدين واضحين .","يرتبطان فيما بينهما بوساطة جزيئهما المركزيين .","ويطلق على كل كروماتيدين يكونا نفس الكروموسوم بالشقيقين .","يظهر في هذا الدور كل زوج من الكروموسومات المتماثلة مكوناً من حزمة مؤلفة من أربعة كروماتيدات ، وتدعى هذه الحزمة بالرباعي ، ولنأخذ مثلاً خلية الإنسان نجدها تحوي في هذا الدور ( 23 ) رباعياً أي ( 92 ) كروماتيد كمجموع كلي .","يحصل في هذا الدور تبادل في مواقع المورثات بين الكروموسومين المتماثلين وتدعى عملية التبادل هذه بالتعابر ."]}},{"sec":"m1","type":"اختر","tags":["1/2023"],"q":"تحدث عملية التعابر في الدور :","opts":["التغلظي","الانفراجي","الحركي"],"ans":0},{"sec":"m1","type":"وضّح","tags":["2/2004"],"q":"ما هي التغيرات التي تحصل في الدور الانفراجي للانقسام الاختزالي ؟","a":{"ol":["يبدأ في هذا الدور كل كروموسومين متماثلين بالتنافر والابتعاد عن بعضهما ،","ويبقى الكروماتيدان غير الشقيقين مرتبطان بنقطة واحدة أو أكثر ،","تدعى نقاط الارتباط ( بالتصالبات ) ويختلف موقع وعدد التصالبات من كروموسوم إلى آخر ومن خلية إلى أخرى .","تتبادل قطع الكروماتيدات غير الشقيقة في كل منطقة تصالب بعضها مع بعض ."]}},{"sec":"m1","type":"الموقع والأهمية","tags":["1/2024","2025 تمهيدي","1/2019","1/2021","2022 تمهيدي"],"q":"ما موقع وأهمية التصالبات ؟","a":{"dl":[["الموقع","بين الكروماتيدين غير الشقيقين ، أو : الكروماتيدات غير الشقيقة ."],["الأهمية","يتم من خلالها تتبادل قطع الكروماتيدات غير الشقيقة في كل منطقة تصالب بعضها مع بعض . أو : تمثل مواقع تبادل قطع الكروماتيدات غير الشقيقة . أو : تمثل مواقع تبادل المورثات بين الكروموسومين المتماثلين ."]]}},{"sec":"m1","type":"وضّح","tags":["2015 تمهيدي","2/2017 أسئلة خارج القطر","1/2009"],"q":"اشرح الدور الحركي للانقسام الاختزالي ( ما الذي يحدث فيه / ما مميزاته ) ؟","a":{"ol":["يمثل هذا الدور آخر أدوار الطور التمهيدي .","وفيه تزداد الكروموسومات ( كروماتيدات الكروموسومات المتماثلة ) قصراً وتغلظاً .","تبدأ النوية والغشاء النووي بالانحلال التدريجي .","وتتحرك مواقع التصالبات باتجاه نهايات الكروموسومات وينتج عن ذلك تناقص في عدد التصالبات ."]}},{"sec":"m1","type":"علّل","tags":["2/2013","1/2018","1/2019 أسئلة خارج القطر","2/2020 تكميلي","2/2022","2023 تمهيدي","2/2023"],"q":"يقل ( يتناقص ) عدد التصالبات في الدور الحركي .","a":{"p":"لأن مواقع التصالبات تتحرك باتجاه نهايات الكروموسومات مما ينتج عن ذلك تناقص في عدد التصالبات ."}},{"sec":"m1","type":"وضّح","tags":["2/2025"],"q":"ما أهم الأحداث التي تحصل في الطور الاستوائي الأول للانقسام الاختزالي ( اذكر مميزاته ) ؟","a":{"ol":["تترتب الكروموسومات المتماثلة في هذا الطور على خط استواء الخلية بشكل مجاميع كروموسومية ثنائية .","تظهر الأجزاء المركزية .","يظهر المغزل بأليافه التي يتصل بعضها بالأجزاء المركزية ."]}},{"sec":"m1","type":"وضّح","tags":["2/2017 أسئلة خارج القطر"],"q":"ما أهم الأحداث التي تحصل في الطور الانفصالي الأول للانقسام الاختزالي ؟","a":{"ol":["في هذا الطور ينفصل الكروموسومان المتماثلان عن بعضهما ، ويتحركان باتجاهين متعاكسين باتجاه قطبي الخلية .","يبقى كروماتيدا كل كروموسوم مرتبطين مع بعض في منطقة جزيئهما المركزيين ."]}},{"sec":"m1","type":"وضّح","tags":[],"q":"ما أهم الأحداث التي تحصل في الطور النهائي الأول للانقسام الاختزالي ؟","a":{"ol":["تتجمع الكروموسومات الجديدة عند القطبين .","غالباً ما يختفي المغزل في هذا الطور .","وتبدأ النوية والغلاف أو الغشاء النووي بالتكون والذي يحيط بمجموعتي الكروموسومات في قطبي الخلية ، وتكون هذه المجموعة أحادية ( تحوي نصف العدد الكلي من الكروموسومات ) .","يتبع عملية الانقسام النووي الانقسام السايتوبلازمي كالذي يحصل في الانقسام الخيطي فيكتمل تكوين الخليتين الجديدتين ، واللتين تكونان مهيئتين للانقسام الاختزالي الثاني ."]}},{"sec":"m2","type":"ما ميزة","tags":["1/2010"],"q":"اذكر ميزة الطور الانفصالي الثاني .","a":{"ol":["تنفصل كروماتيدات كل كروموسوم عن بعضها من خلال انفصال جزيئهما المركزيين .","فيصبح كل كروماتيد ممثلاً لكروموسوماً بنوياً مستقلاً يتحرك باتجاه أحد قطبي الخلية بوساطة خيوط المغزل ."]}},{"sec":"m2","type":"قارن","tags":["2/2011"],"q":"قارن بين الطور الانفصالي الأول والطور الانفصالي الثاني للانقسام الاختزالي .","a":{"tb":{"h":["الطور الانفصالي الأول","الطور الانفصالي الثاني"],"r":[["ينفصل الكروموسومان المتماثلان عن بعضهما ويتحركان باتجاهين متعاكسين نحو قطبي الخلية","تنفصل كروماتيدات كل كروموسوم عن بعضها من خلال انفصال جزيئهما المركزيين"],["يبقى كروماتيدا كل كروموسوم مرتبطين مع بعض في منطقة جزيئهما المركزيين","يصبح كل كروماتيد ممثلاً لكروموسوماً بنوياً مستقلاً يتحرك باتجاه أحد قطبي الخلية بوساطة خيوط المغزل"],["يحدث خلال الانقسام الاختزالي الأول","يحدث خلال الانقسام الاختزالي الثاني"]]}}},{"sec":"m1","type":"املأ الفراغ","tags":["2/2018 أسئلة خارج القطر"],"q":"يحدث الإيثاق في {الدور الازدواجي} أما التصالبات فتظهر في {الدور الانفراجي} ."},{"sec":"m1","type":"املأ الفراغ","tags":["2/2021","3/2023 تكميلي"],"q":"يحدث الإيثاق في الدور {الازدواجي} ومضاعفة DNA في الطور {البيني} ."},{"sec":"m1","type":"اختر","tags":["2022 تمهيدي"],"q":"يحدث الإيثاق في الدور :","opts":["الازدواجي","التغلظي","الانفراجي"],"ans":0},{"sec":"m1","type":"املأ الفراغ","tags":["2/2025"],"q":"يحدث الإيثاق في الدور {الازدواجي} وتحدث التصالبات في الدور {الانفراجي} ."},{"sec":"m2","type":"قارن","tags":["أسئلة الفصل"],"q":"كيف تميز بين الطور النهائي الأول والطور النهائي الثاني للانقسام الاختزالي ؟","a":{"tb":{"h":["الطور النهائي الأول للانقسام الاختزالي","الطور النهائي الثاني للانقسام الاختزالي"],"r":[["تتجمع الكروموسومات الجديدة عند القطبين","تتجمع في هذا الطور الكروموسومات عند قطبي الخلية فتزداد طولاً وتقل سمكاً إلى أن تفقد سمتها"],["وتبدأ النوية والغلاف أو الغشاء النووي بالتكون والذي يحيط بمجموعتي الكروموسومات في قطبي الخلية","يظهر الغشاء النووي والنويات لتتكون نواتان جديدتان من نواة واحدة أصلية"],["يتبع عملية الانقسام النووي الانقسام السايتوبلازمي كالذي يحصل في الانقسام الخيطي فيكتمل تكوين الخليتين الجديدتين ، واللتين تكونان مهيئتين للانقسام الاختزالي الثاني","وفي بعض الخلايا النباتية تتكون الصفيحة الخلوية عبر المغزل ثم تتكون الصفيحة الوسطى ثم جدار الخلية ، أما في الخلايا الحيوانية فيتكون الغشاء السايتوبلازمي بين النواتين الجديدتين ليفصلهما عن بعضهما"],["غالباً ما يختفي المغزل في هذا الطور","تظهر المادة الكروماتينية بشكل خيوط دقيقة"]]}}},{"sec":"m2","type":"ميّز","tags":["2/2021"],"q":"كيف تميز بين الطور الاستوائي الأول والطور الاستوائي الثاني للانقسام الاختزالي ؟","a":{"ol":["في الطور الاستوائي الأول : تكون الكروموسومات مرتبة بشكل حزم مكونة من أربعة كروماتيدات ( رباعيات ) ، أما في الطور الاستوائي الثاني : تتألف من كروماتيدين .","في الطور الاستوائي الأول : تترتب الكروموسومات المتماثلة بشكل مجاميع كروموسومية ثنائية ، أما في الطور الاستوائي الثاني : تترتب الكروموسومات بشكل مجاميع كروموسومية أحادية ."]}},{"sec":"g","type":"متى تحدث","tags":["2/2023"],"q":"متى تحدث : مضاعفة DNA ؟","a":{"p":"الطور البيني ."}},{"sec":"g","type":"املأ الفراغ","tags":["2/2024 نظام المحاولات"],"q":"يحصل الانقسام الاختزالي في الخلايا {الجنسية ( الأمشاج )} بينما يحصل الانقسام الخيطي في الخلايا {الجسمية} ."},{"sec":"g","type":"قارن","tags":["1/1995","2/2005","2/2013","3/2019","2025 تمهيدي","2/2022","3/2023","3/2024"],"q":"قارن بين الانقسام الخيطي والانقسام الاختزالي . ( وردت أيضاً : اذكر ثلاثة / أربعة / خمسة فروق فقط )","a":{"tb":{"h":["الانقسام الخيطي","الانقسام الاختزالي"],"r":[["انقسام واحد","انقسامين"],["تتكون خليتين متماثلتين من كل انقسام","تتكون أربع خلايا غير متماثلة من كل انقسام"],["الخلية المتكونة متماثلة وراثياً","الخلايا مختلفة وراثياً"],["عدد الكروموسومات في الخليتين المتكونتين يماثل عددها في الخلية الأم","عدد الكروموسومات في الخلايا المتكونة نصف العدد الموجود في الخلية الأم"],["يحصل انقسام في الخلايا الجسمية","يحصل الانقسام في الخلايا الجنسية ( الأمشاج )"],["يحصل الانقسام خلال دورة الحياة بشكل مستمر","يحصل بعد النضج الجنسي فقط"],["يشارك هذا الانقسام في النمو وإصلاح التلف في الخلايا والتكاثر اللاجنسي","يشارك في التكاثر الجنسي ونقل المادة الوراثية من الآباء إلى الأبناء"]]}}},{"sec":"m1","type":"في أي طور","q":"في أي دور أو طور يحدث كل مما يأتي ؟","items":[{"t":"حدوث الإيثاق ( التشابك )","tags":["1/2014","2/2015","2016 تمهيدي","1/2019 أسئلة خارج القطر","2025 تمهيدي"],"a":"الدور الازدواجي للطور التمهيدي الأول للانقسام الاختزالي"},{"t":"تكوين الرباعيات","tags":["2/2015","1/2016"],"a":"الدور التغلظي للطور التمهيدي الأول للانقسام الاختزالي"},{"t":"حدوث عملية العبور ( التعابر )","tags":["1/2013","1/2022","3/2023","2025 تمهيدي"],"a":"الدور التغلظي للطور التمهيدي الأول للانقسام الاختزالي"},{"t":"تكوين التصالبات","tags":["1/2014","2/2015","2/2016","2016 تمهيدي"],"a":"الدور الانفراجي للطور التمهيدي الأول للانقسام الاختزالي"},{"t":"تناقص عدد التصالبات","tags":["1/2016","2021 تمهيدي","3/2023"],"a":"الدور الحركي للطور التمهيدي الأول للانقسام الاختزالي"},{"t":"ظهور الأجزاء المركزية","tags":["1/2013"],"a":"الطور الاستوائي الأول للانقسام الاختزالي"},{"t":"تكوين النوية والغلاف النووي","tags":["3/2016 أسئلة خارج القطر"],"a":"الطور النهائي الأول للانقسام الاختزالي"}]}]};</script>
<script>
/* MoeLab — محرك الأسئلة الوزارية
   يُحقن تلقائياً داخل كل محاكاة لها أسئلة (لا تعدّل النسخ المحقونة يدوياً — عدّل هذا الملف ثم شغّل build.py).
   مبدأ الأمان: أي خطأ هنا يُخفي زر الوزاريات فقط ولا يؤثر على المحاكاة. */
(function(){try{
var D=window.MOE_MIN_DATA;if(!D||!D.qs||!D.qs.length)return;
var stage=document.getElementById('stage')||document.body;
var AR=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];});};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var tagK=function(s){return /الفصل|الكتاب|التلفزيون/.test(s)?'book':/خارج|الموصل|المتميزين|النازحين|المحاولات/.test(s)?'out':/تمهيدي|تكميلي/.test(s)?'pre':'min';};
var tagH=function(s){var k=tagK(s);return '<span class="tg '+k+'">'+esc(k==='book'?s:'وزاري '+s)+'</span>';};
var minCount=function(q){var t=(q.tags||[]).slice();(q.items||[]).forEach(function(i){t=t.concat(i.tags||[]);});return t.filter(function(s){return tagK(s)!=='book';}).length;};
var $=function(id){return document.getElementById(id);};

/* ---------- DOM ---------- */
var wrap=document.createElement('div');
wrap.innerHTML='<button id="qbtn" type="button" aria-label="الأسئلة الوزارية">📝 الوزاريات <b id="qcnt"></b></button>'+
 '<div id="hlbar"><span id="hlname"></span><button id="hlback" type="button">↩ رجوع للسؤال</button></div>'+
 '<div id="qp" role="dialog" aria-label="الأسئلة الوزارية">'+
  '<div id="qhd"><div class="t">📝 الأسئلة الوزارية</div><button id="qx" type="button" aria-label="إغلاق">✕</button></div>'+
  '<div id="qchips"></div><div id="qbody"></div>'+
  '<div id="qft"><button id="qprev" type="button">السابق ▶</button><button id="qa" type="button">إظهار الحل 💡</button><button id="qnext" type="button">التالي ◀</button></div>'+
 '</div>';
while(wrap.firstChild)stage.appendChild(wrap.firstChild);
/* place the button just to the right of the sim's zoom buttons (or under them if they are in a row) */
function placeBtn(){try{var b=$('qbtn'),zb=document.querySelector('.zb'),st=stage.getBoundingClientRect();
  if(!zb){b.style.left='10px';b.style.top='10px';return;}
  var r=zb.getBoundingClientRect(),row=getComputedStyle(zb).flexDirection==='row';
  if(!r.width||!r.height){b.style.left='10px';b.style.top='10px';return;}
  var below=function(){b.style.left=Math.round(r.left-st.left)+'px';b.style.top=Math.round(r.bottom-st.top+8)+'px';};
  if(row||placeBtn.down){below();return;}
  b.style.left=Math.round(r.right-st.left+10)+'px';b.style.top=Math.round(r.top-st.top)+'px';
  /* if the sim shows its own caption/banner in that spot, move under the zoom buttons (and stay there) */
  var q=b.getBoundingClientRect(),hit=false;
  [].forEach.call(stage.querySelectorAll('*'),function(e){if(hit||e===b||e.closest('.zb,#qp,#hlbar,#qbtn'))return;
    if(e.parentElement!==stage&&!e.id)return;
    var cs=getComputedStyle(e);if(cs.position==='static'||cs.display==='none'||cs.visibility==='hidden'||!(e.textContent||'').trim())return;
    var x=e.getBoundingClientRect();if(!x.width||x.width>st.width*.9||x.height>120)return;
    if(x.left<q.right&&x.right>q.left&&x.top<q.bottom&&x.bottom>q.top)hit=true;});
  if(hit){placeBtn.down=true;below();}}catch(_){}}
placeBtn();setInterval(placeBtn,700);window.addEventListener('resize',placeBtn);document.addEventListener('fullscreenchange',function(){setTimeout(placeBtn,50);});

var qp=$('qp'),qbody=$('qbody'),qchips=$('qchips'),qa=$('qa'),qprev=$('qprev'),qnext=$('qnext');
var QS=D.qs,SEC=D.sections||{},NAMES=D.names||{};
$('qcnt').textContent=AR(QS.length);
var secKeys=Object.keys(SEC).filter(function(k){return QS.some(function(q){return q.sec===k;});});
if(secKeys.length<2)qchips.style.display='none';
var qsec='all',qi=0,qrev=false,qOpen=false;
var list=function(){return qsec==='all'?QS:QS.filter(function(q){return q.sec===qsec;});};
qchips.innerHTML=[['all','الكل']].concat(secKeys.map(function(k){return [k,SEC[k]];})).map(function(a){return '<button type="button" data-k="'+a[0]+'">'+esc(a[1])+'</button>';}).join('');
qchips.onclick=function(e){var b=e.target.closest('button');if(!b)return;qsec=b.dataset.k;qi=0;qrev=false;render();};

function ansH(a){var h='';if(!a)return h;if(a.p&&!a.tb)h+='<div>'+esc(a.p)+'</div>';
  if(a.ol)h+='<ol>'+a.ol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(a.tb)h+='<div class="tbw"><table><tr>'+a.tb.h.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>'+a.tb.r.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
  if(a.dl)h+='<dl>'+a.dl.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl>';if(a.p&&a.tb)h+='<div class="note">'+esc(a.p)+'</div>';return h;}
var SIM=null;function sim(){return SIM||(SIM=window.MOE_SIM||null);}
function canSee(k){var s=sim();return !!(k&&s&&s.groups&&s.groups[k]);}
function render(){try{render0();}catch(err){qOpen=false;qp.classList.remove('on');$('qbtn').style.display='none';if(window.console)console.warn('MoeLab ministerial:',err);}}
function render0(){
  var L=list(),q=L[qi];
  [].forEach.call(qchips.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===qsec);});
  var n=minCount(q);
  var h='<div class="qc'+(qrev?' rev':'')+'"><div class="qtop"><span class="qty">'+esc(q.type)+'</span>'+
    (n>=3?'<span class="qfire">🔥 تكرر وزارياً '+AR(n)+' مرات</span>':'')+'<span class="qnum">'+AR(qi+1)+' / '+AR(L.length)+'</span></div>';
  if(q.tags&&q.tags.length)h+='<div class="tags">'+q.tags.map(tagH).join('')+'</div>';
  h+='<div class="qq">'+esc(q.q).replace(/\{([^}]*)\}/g,'<span class="blank">$1</span>')+'</div>';
  if(q.opts)h+='<div class="opts">'+q.opts.map(function(o,k){return '<button type="button" class="opt'+(qrev&&k===q.ans?' ok':'')+'" data-k="'+k+'">'+'أبجد'[k]+' ) '+esc(o)+'</button>';}).join('')+'</div>';
  if(q.items)h+='<ol class="items">'+q.items.map(function(it){var t=it.tags||[];return '<li>'+esc(it.t)+(t.length?'<div class="tags">'+t.map(tagH).join('')+'</div>':'')+'<div class="ia">'+esc(it.a||q.common||'')+'</div></li>';}).join('')+'</ol>';
  if(q.a)h+='<div class="ans"><div class="h">✔ الجواب</div>'+ansH(q.a)+'</div>';
  if(canSee(q.hl))h+='<div class="see"><button type="button" id="qsee">📍 شوف '+esc(NAMES[q.hl]||'')+' بالمحاكاة</button></div>';
  qbody.innerHTML=h+'</div>';qbody.scrollTop=0;
  qa.textContent=qrev?'إخفاء الحل':'إظهار الحل 💡';qa.classList.toggle('hide',qrev);
  qprev.disabled=qi===0;qnext.disabled=qi>=L.length-1;
  [].forEach.call(qbody.querySelectorAll('.opt'),function(b){b.onclick=function(){if(+b.dataset.k===q.ans){qrev=true;render();}else b.classList.add('no');};});
  var s=$('qsee');if(s)s.onclick=function(){hlStart(q.hl);};
}
qa.onclick=function(){qrev=!qrev;render();};
qprev.onclick=function(){if(qi>0){qi--;qrev=false;render();}};
qnext.onclick=function(){if(qi<list().length-1){qi++;qrev=false;render();}};
function show(on){qOpen=on;qp.classList.toggle('on',on);if(on)render();}
$('qbtn').onclick=function(){hlStop();show(true);};
$('qx').onclick=function(){show(false);};

/* ---------- highlight inside the simulation (only if the sim registered window.MOE_SIM) ---------- */
var HL=null;
function els(keys,map){var a=[];keys.forEach(function(k){(map[k]||[]).forEach(function(e){a.push(e);});});return a;}
function bbox(arr){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;arr.forEach(function(e){try{var b=e.getBBox();if(!b.width&&!b.height)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}catch(_){}});return x0<x1?{x0:x0,y0:y0,x1:x1,y1:y1}:null;}
var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function hlStart(k){
  var s=sim();if(!canSee(k))return;show(false);
  try{s.finish();}catch(_){}
  var parts=s.groups[k],on=els(parts,s.parts),labs=els(parts,s.labels||{});
  var all=els(Object.keys(s.parts),s.parts),allL=els(Object.keys(s.labels||{}),s.labels||{});
  var v=s.view.get(),vb=s.view.box,b=bbox(on.concat(labs)),to=v;
  if(b){var pad=30,cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,ks=Math.max(1,Math.min(2.6,vb[2]/(b.x1-b.x0+2*pad),vb[3]/(b.y1-b.y0+2*pad)));
    to=[ks,vb[0]+vb[2]/2-cx*ks,vb[1]+vb[3]/2-cy*ks];}
  HL={k:k,s:s,on:new Set(on),labs:new Set(labs),all:all,allL:allL,glows:els(parts,s.glows||{}),t0:performance.now(),from:v,to:to};
  $('hlname').textContent='📍 '+(NAMES[k]||'');
  $('hlbar').classList.add('on');document.body.classList.add('hlmode');
  requestAnimationFrame(tick);
}
function hlStop(){if(!HL)return;var s=HL.s;HL=null;$('hlbar').classList.remove('on');document.body.classList.remove('hlmode');try{s.view.reset();}catch(_){}}
function tick(ms){
  if(!HL)return;
  try{
    var u=(ms-HL.t0)/1000,z=ease(Math.max(0,Math.min(1,u/.8))),L=function(a,b){return a+(b-a)*z;};
    HL.s.view.set(L(HL.from[0],HL.to[0]),L(HL.from[1],HL.to[1]),L(HL.from[2],HL.to[2]));
    var p=.5+.5*Math.sin(u*4.2);
    HL.all.forEach(function(e){if(!HL.on.has(e))e.setAttribute('opacity','0.18');});
    HL.allL.forEach(function(e){e.setAttribute('opacity',HL.labs.has(e)?'1':'0.15');});
    HL.glows.forEach(function(g){g.style.display='';g.setAttribute('opacity',(.35+.45*p).toFixed(2));});
    if(HL.s.pulse)HL.s.pulse(HL.k,p);
  }catch(e){hlStop();return;}
  requestAnimationFrame(tick);
}
$('hlback').onclick=function(){hlStop();show(true);};
/* any simulation button stops the highlight */
['go','prev','zreset'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',hlStop,true);});

/* keyboard: while the panel is open the arrows move between questions, not the simulation */
window.addEventListener('keydown',function(e){
  if(qOpen){e.stopImmediatePropagation();e.preventDefault();
    if(e.key==='ArrowLeft')qnext.click();else if(e.key==='ArrowRight')qprev.click();else if(e.key==='Escape')show(false);}
  else if(HL&&e.key==='Escape'){hlStop();}
},true);
}catch(err){try{var b=document.getElementById('qbtn');if(b)b.style.display='none';var p=document.getElementById('qp');if(p)p.style.display='none';}catch(_){} if(window.console)console.warn('MoeLab ministerial:',err);}})();

</script>
<!--MOE-MIN:END--></body>
</html>
