<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مختبر هاليدات الألكيل</title>
<style>
/* VOICE: a clear teaching instrument, calm and precise
   IDEA: a molecular lab bench where atoms and bonds visibly change
   PICTURE: large SVG ball-and-stick molecules, animated bonds, magnifier window
   COLOUR and TYPE: white ground, lab green header, CPK atom colours; Cairo
   LAYOUT: green bar with tabs, wide stage, side control panel (bottom on phones) */
:root{--bg:#ffffff;--ink:#1d2b22;--muted:#5d6b63;--panel:#f3f7f4;--line:#dbe5df;--bond:#2b3430;--green:#1e7b4d;--green2:#145c38}
body.dark{--ink:#eef4f0;--muted:#a8b8af;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.15);--bond:#e4ebe7}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Cairo,Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden;transition:background .3s}
header{background:linear-gradient(180deg,var(--green),var(--green2));color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.18);z-index:5}
header h1{font-size:20px;margin:0;font-weight:800;white-space:nowrap}
header h1 small{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:-4px}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
nav button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:7px 16px;min-height:40px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
nav button.on{background:#fff;color:var(--green2)}
nav button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.18);margin-inline-end:6px;font-size:12px}
nav button.on b{background:var(--green);color:#fff}
.tools{display:flex;gap:6px;position:relative}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;cursor:pointer}
.ib svg{width:22px;height:22px}
.pop{position:absolute;top:50px;inset-inline-end:0;background:#fff;color:#222;border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;grid-template-columns:repeat(4,40px);gap:8px;z-index:20}
.pop.show{display:grid}
.pop button{width:40px;height:40px;border-radius:50%;border:2px solid #ccc;cursor:pointer}
.pop button.on{outline:3px solid var(--green);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
aside{border-inline-end:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
aside h3{font-size:14px;margin:14px 0 8px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
aside h3:first-child{margin-top:0}
.hint{font-weight:400;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:5px 10px;min-height:40px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.chip small{font-size:12px;color:var(--muted);font-weight:400}
.chip.on{border-color:var(--green);background:var(--green);color:#fff}
.chip.on small{color:#e3f3ea}
.hal{display:flex;gap:10px;justify-content:space-between}
.hx{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 45%),var(--c);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;cursor:grab;touch-action:none;box-shadow:0 3px 8px rgba(0,0,0,.25);user-select:none;transition:transform .15s}
.hx.on{transform:scale(1.12);outline:3px solid #ffb703;outline-offset:3px}
.hx[data-x=F] span{color:#163}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
.lbl{font-size:12px;color:var(--muted)}
.big{font-size:22px;font-weight:800;line-height:1.3}
.muted{color:var(--muted);font-size:13px;margin:2px 0}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.row b{font-size:16px;unicode-bidi:isolate}
.clsb{margin-top:8px;border-radius:10px;padding:8px 10px;background:color-mix(in srgb,var(--c) 14%,transparent);border-inline-start:5px solid var(--c);font-size:13px}
.clsb b{display:block;font-size:18px;color:var(--c)}
.key{margin-top:12px;display:grid;gap:4px;font-size:13px}
.key div{display:flex;gap:8px;align-items:center}
.key i{font-style:normal;font-weight:800;color:#fff;background:var(--c);border-radius:6px;padding:0 8px;min-width:64px;text-align:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:8px 14px;min-height:44px;background:var(--green);color:#fff;cursor:pointer;width:100%;margin-top:12px}
.rule{font-size:14px}
.rule b{color:var(--green)}
body.dark .rule b{color:#69db9c}
.stage{position:relative;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#svg:active{cursor:grabbing}
.cap{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:6px 18px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.18);max-width:90%;text-align:center;transition:opacity .3s;pointer-events:none}
.cap:empty{opacity:0}
.eq{position:absolute;bottom:72px;left:0;right:0;margin:auto;width:fit-content;transform:translateY(10px);background:var(--bg);border:2px solid var(--green);border-radius:16px;padding:8px 18px;box-shadow:0 8px 24px rgba(0,0,0,.15);opacity:0;transition:.4s;pointer-events:none;text-align:center;max-width:94%}
.eq.show{opacity:1;transform:none}
.eqf{font-size:22px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-family:Cairo,sans-serif}
.eqf .t,.eqn{opacity:0;transform:translateY(6px);transition:.35s}
.eqf .t.on,.eqn.on{opacity:1;transform:none}
.arw{display:inline-flex;flex-direction:column;align-items:center;line-height:1;color:var(--green)}
.arw small{font-size:13px}
.eqn{font-size:14px;color:var(--muted)}
.ctl{position:absolute;bottom:12px;inset-inline-start:12px;display:flex;gap:6px;flex-wrap:wrap}
.zm{position:absolute;bottom:12px;inset-inline-end:12px;display:flex;gap:6px}
.cb{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;min-height:44px;min-width:44px;padding:0 12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cb.go{background:#ffb703;border-color:#ffb703;color:#222;animation:pulse 1s infinite}
.cb:disabled{opacity:.4;cursor:default;animation:none}
.cb.mode.on{background:var(--green);color:#fff;border-color:var(--green)}
button:focus-visible,.hx:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,183,3,.3)}}
.ghost{position:fixed;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;pointer-events:none;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.35)}
/* svg */
.bl{stroke:var(--bond);stroke-linecap:round}
.bh{stroke-linecap:round;stroke-width:16}
.atom{filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.al{text-anchor:middle;dominant-baseline:central;font-weight:800;pointer-events:none;font-family:Cairo,sans-serif}
.chg{font-size:22px;font-weight:800;fill:#e64980;text-anchor:middle;dominant-baseline:central}
.ring{fill:none;stroke-width:3.5;stroke-dasharray:9 6;animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
.selr{fill:none;stroke:#ffb703;stroke-width:4}
.popin{animation:popin .45s cubic-bezier(.3,1.7,.5,1) both;transform-box:fill-box;transform-origin:center}
.svt{fill:var(--ink);font-family:Cairo,sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:central}
.svm{fill:var(--muted);font-family:Cairo,sans-serif;text-anchor:middle;dominant-baseline:central}
.mag{fill:var(--bg);stroke:var(--green);stroke-width:7}
.arr{fill:none;stroke:#e8590c;stroke-width:3.5;marker-end:url(#ar)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popin{from{transform:scale(0)}}
@media(max-width:820px){
 main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
 aside{order:2;max-height:38vh;border:0;border-top:1px solid var(--line)}
 header h1 small{display:none}
 .eqf{font-size:17px}
 .eq{bottom:66px}
 header{gap:6px;padding:6px 10px}
 header h1{font-size:17px;flex:1}
 nav{order:3;flex-basis:100%;flex-wrap:nowrap}
 nav button{font-size:13px;padding:4px 8px;white-space:nowrap;flex:1}
 nav button b{display:none}
 .ib{width:38px;height:38px}
 .zm{top:auto;bottom:66px;flex-direction:column}
 .cap{font-size:13px;padding:4px 12px}
 aside{max-height:34vh}
}
@media(prefers-reduced-motion:reduce){.ring,.cb.go{animation:none}}
</style>
</head>
<body>
<header>
 <h1>هاليدات الألكيل<small>مختبر جزيئي تفاعلي</small></h1>
 <nav id="tabs">
  <button data-s="s1"><b>1</b>التكوين والتصنيف</button>
  <button data-s="s2"><b>2</b>التحضير</button>
  <button data-s="s3"><b>3</b>الخواص الكيميائية</button>
 </nav>
 <div class="tools">
  <button class="ib" id="bgBtn" title="لون الخلفية" aria-label="لون الخلفية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.3" fill="currentColor"/><circle cx="10" cy="7" r="1.3" fill="currentColor"/><circle cx="15" cy="7.5" r="1.3" fill="currentColor"/></svg></button>
  <div class="pop" id="pop"></div>
  <button class="ib" id="fsBtn" title="ملء الشاشة" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
 </div>
</header>
<main>
 <aside id="panel"></aside>
 <section class="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
   <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8590c"/></marker>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79a6b"/><stop offset="1" stop-color="#9b6f45"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9f5ff" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#d3e9fb" stop-opacity=".55"/></linearGradient>
    <clipPath id="magclip"><circle cx="-30" cy="-150" r="185"/></clipPath>
   </defs>
   <g id="world"></g>
  </svg>
  <div class="cap" id="cap"></div>
  <div class="eq" id="eq"></div>
  <div class="ctl">
   <button class="cb mode" id="modeBtn">خطوة بخطوة</button>
   <button class="cb" id="nextBtn" disabled>التالي ◀</button>
   <button class="cb" id="resetBtn">↺ إعادة</button>
  </div>
  <div class="zm">
   <button class="cb" id="zin" aria-label="تكبير">+</button>
   <button class="cb" id="zout" aria-label="تصغير">−</button>
   <button class="cb" id="zfit" aria-label="ملاءمة">⤢</button>
  </div>
 </section>
</main>
<script>
{
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const svg=$('#svg'),world=$('#world');
const G=110,HB=62;
const EL={C:{c:'#3c4247',r:21,t:'#fff'},H:{c:'#ffffff',r:13,t:'#333',s:'#98a39d'},F:{c:'#8fd14f',r:17,t:'#173d12'},Cl:{c:'#22a845',r:22,t:'#fff'},Br:{c:'#a8322d',r:25,t:'#fff'},I:{c:'#7b2a9c',r:28,t:'#fff'},O:{c:'#e23b3b',r:20,t:'#fff'},N:{c:'#3b5bdb',r:20,t:'#fff'},K:{c:'#9c5bd6',r:22,t:'#fff'},R:{c:'#59636a',r:27,t:'#fff'}};
const HAL={F:{p:'فلورو',d:'فلوريد',n:'الفلور'},Cl:{p:'كلورو',d:'كلوريد',n:'الكلور'},Br:{p:'برومو',d:'بروميد',n:'البروم'},I:{p:'يودو',d:'يوديد',n:'اليود'}};
const CLS={1:{n:'أولي',d:'1°',c:'#2f9e44'},2:{n:'ثانوي',d:'2°',c:'#1c7ed6'},3:{n:'ثالثي',d:'3°',c:'#e03131'}};
const NUMW={1:'ذرة كاربون واحدة',2:'ذرتي كاربون',3:'ثلاث ذرات كاربون'};
const SD='₀₁₂₃₄₅₆₇₈₉';
const fm=s=>s.replace(/\d/g,d=>SD[d]);
const L=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const ramp=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
function mk(tag,at,p){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e}
function txt(x,y,s,cls,p,extra){const e=mk('text',Object.assign({x,y,class:cls},extra||{}),p);e.textContent=s;return e}

/* ---------- scene engine ---------- */
class Scene{
 constructor(){this.g=mk('g',{},world);this.gs=mk('g',{},this.g);this.gb=mk('g',{},this.g);this.ga=mk('g',{},this.g);this.gf=mk('g',{},this.g);this.A={};this.B={}}
 destroy(){this.g.remove()}
 atom(id,el,x,y,o){const d=EL[el];const a=Object.assign({id,el,x,y,s:1,op:1,lab:el,charge:'',r:d.r},o||{});
  const g=mk('g',{class:'atom'},this.ga);
  mk('circle',{r:a.r,fill:d.c,stroke:d.s||'rgba(0,0,0,.35)','stroke-width':1.5},g);
  mk('circle',{r:a.r*.42,cx:-a.r*.32,cy:-a.r*.36,fill:'#fff',opacity:.3},g);
  const t=mk('text',{class:'al',fill:d.t,'font-size':a.lab.length>2?12:a.lab.length>1?15:16},g);t.textContent=a.lab;
  a.chE=mk('text',{class:'chg',x:a.r*.9,y:-a.r*.85},g);
  a.g=g;a._t='';this.A[id]=a;return a}
 bond(id,a,b,o){const B=Object.assign({id,a,b,order:1,o2:1,op:1,grow:1,dash:0,hl:0,hc:'#ffb703',w:4.5},o||{});
  const g=mk('g',{},this.gb);B.h=mk('line',{class:'bh'},g);B.ls=[0,1,2].map(()=>mk('line',{class:'bl'},g));B.g=g;this.B[id]=B;return B}
 rmA(id){const a=this.A[id];if(a){a.g.remove();delete this.A[id]}}
 rmB(id){const b=this.B[id];if(b){b.g.remove();delete this.B[id]}}
 findB(a,b){return this.B['C'+a+'_'+b]||this.B['C'+b+'_'+a]}
 render(){
  for(const id in this.A){const a=this.A[id];const t=`translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) scale(${a.s.toFixed(3)})`;if(t!==a._t){a.g.setAttribute('transform',t);a._t=t}a.g.style.opacity=a.op;if(a.chE.textContent!==a.charge)a.chE.textContent=a.charge}
  for(const id in this.B){const b=this.B[id],A=this.A[b.a],C=this.A[b.b];
   if(!A||!C){b.g.style.display='none';continue}
   const op=b.op*Math.min(A.op,C.op);b.g.style.display=op<.01?'none':'';b.g.style.opacity=op;
   const x1=A.x,y1=A.y,x2=L(A.x,C.x,b.grow),y2=L(A.y,C.y,b.grow);
   const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
   const offs=b.order===1?[0]:b.order===2?[4.8*b.o2,-4.8*b.o2]:[-7,0,7];
   b.ls.forEach((l,i)=>{if(i>=offs.length){l.style.display='none';return}const o=offs[i];l.style.display='';
    l.setAttribute('x1',x1+nx*o);l.setAttribute('y1',y1+ny*o);l.setAttribute('x2',x2+nx*o);l.setAttribute('y2',y2+ny*o);
    l.style.opacity=(b.order===2&&i===1)?b.o2:1;l.style.strokeWidth=b.order>1?3.6:b.w;l.style.strokeDasharray=b.dash?'7 7':'none'});
   b.h.setAttribute('x1',x1);b.h.setAttribute('y1',y1);b.h.setAttribute('x2',x2);b.h.setAttribute('y2',y2);b.h.style.stroke=b.hc;b.h.style.opacity=b.hl*.55}
 }
}
let sc=null,cur=null,curKey='s1';

/* ---------- sequencing ---------- */
let token=0,stepMode=false,nextRes=null;
const nextBtn=$('#nextBtn');
function tween(ms,fn,my){return new Promise((res,rej)=>{const t0=performance.now();const f=now=>{if(my!==token)return rej('x');const t=Math.min(1,(now-t0)/ms);fn(ease(t),t);t<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)})}
function dropNext(){if(nextRes){const r=nextRes;nextRes=null;r.rej('x')}nextBtn.disabled=true;nextBtn.classList.remove('go')}
function runner(){dropNext();const my=++token;let first=true;return{
 tw:(ms,fn)=>tween(ms,fn,my),wait:ms=>tween(ms,()=>{},my),
 step:async c=>{if(my!==token)throw'x';if(stepMode&&!first){nextBtn.disabled=false;nextBtn.classList.add('go');await new Promise((res,rej)=>{nextRes={res,rej}});nextBtn.disabled=true;nextBtn.classList.remove('go')}first=false;if(my!==token)throw'x';cap(c)}}}
function cancel(){dropNext();token++}
async function seq(fn){const R=runner();try{await fn(R)}catch(e){if(e!=='x')console.error(e)}}
nextBtn.onclick=()=>{if(nextRes){const r=nextRes;nextRes=null;r.res()}};
const capE=$('#cap');function cap(s){capE.textContent=s||''}
const eqE=$('#eq');
function eqSet(parts,names){eqE.innerHTML=`<div class="eqf" dir="ltr">${parts.map(p=>`<span class="t">${p}</span>`).join('')}</div><div class="eqn">${names}</div>`;eqE.classList.add('show')}
async function eqReveal(R){for(const t of eqE.querySelectorAll('.t,.eqn')){t.classList.add('on');await R.wait(300)}}
function eqHide(){eqE.classList.remove('show');eqE.innerHTML=''}
const ARW='<span class="arw">→</span>',ARWH='<span class="arw"><small>Δ</small>→</span>';

/* ---------- view: pan / zoom ---------- */
let V={x:-500,y:-300,w:1000,h:600};
function setV(){svg.setAttribute('viewBox',`${V.x} ${V.y} ${V.w} ${V.h}`)}
function toW(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
function zoomAt(cx,cy,f){const p=toW(cx,cy);const nw=Math.max(260,Math.min(3200,V.w/f));const k=nw/V.w;V.x=p.x-(p.x-V.x)*k;V.y=p.y-(p.y-V.y)*k;V.w=nw;V.h*=k;setV()}
function fit(){V=Object.assign({},cur.view);if(svg.clientWidth&&svg.clientWidth<600){const k=.72,cx=V.x+V.w/2,cy=V.y+V.h/2;V.w*=k;V.h*=k;V.x=cx-V.w/2;V.y=cy-V.h/2}setV()}
const P=new Map();let dragging=false,moved=false,down=null;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(P.size===1){moved=false;down={x:e.clientX,y:e.clientY};dragging=!!(cur.grab&&cur.grab(toW(e.clientX,e.clientY)))}
 else{if(dragging&&cur.drop)cur.drop(null,false);dragging=false;moved=true}});
svg.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;
 if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)moved=true;

  cap(ni===nj?'العددان متساويان (ألكين متناظر): الناتج واحد':'الكاربون الأكثر هيدروجيناً يستقبل ذرة H');
  await R.wait(900);
  await R.step('انفتاح الآصرة المزدوجة وارتباط H بالكاربون الأكثر هيدروجيناً');bA.remove();bB.remove();
  const nH=sc.bond('nH','C'+ca,'hH',{grow:0});const hs0={x:hH.x,y:hH.y},xs0={x:hX.x,y:hX.y};
  const caH=s2.H.filter(h=>sc.A[h].c===ca),cbH=s2.H.filter(h=>sc.A[h].c===cb);
  await R.tw(1300,t=>{hb.op=1-ramp(t,0,.4);db.o2=1-t;db.hl=.8*(1-t);hH.x=L(hs0.x,Ca.x,t);hH.y=L(hs0.y,Ca.y-HB,t);nH.grow=ramp(t,.45,1);
   hX.x=L(xs0.x,Cb.x+sg*70,t);hX.y=L(xs0.y,Cb.y-170,t);caH.forEach(h=>{const A=sc.A[h];A.x=L(A.rx,A.px,t);A.y=L(A.ry,A.py,t)});
   if(t>.5){hX.charge='−';Cb.charge='+'}});
  sc.rmB('hb');db.order=1;ring.setAttribute('cx',Cb.x);ring.setAttribute('cy',Cb.y);ring.setAttribute('stroke','#e8590c');
  await R.step('ارتباط '+X+' بذرة الكاربون الأخرى');
  const nX=sc.bond('nX','C'+cb,'hX',{grow:0});const xs1={x:hX.x,y:hX.y},ty=Cb.y-(HB+EL[X].r-13+5);
  await R.tw(1100,t=>{hX.x=L(xs1.x,Cb.x,t);hX.y=L(xs1.y,ty,t);nX.grow=ramp(t,.4,1);cbH.forEach(h=>{const A=sc.A[h];A.x=L(A.rx,A.px,t);A.y=L(A.ry,A.py,t)});if(t>.7){hX.charge='';Cb.charge=''}});
  await R.step('الناتج حسب قاعدة ماركوفنيكوف');fx.remove();
  const pn=a.p[0].replace('{p}',HAL[X].p);s2.lbl.textContent=pn;s2.lbl.classList.add('popin');
  eqSet([fm(a.f),'+',HX.f,ARW,fm(a.p[1].replace('X',X))],`${a.n} + ${HX.n} ← ${pn}`);await eqReveal(R);
  s2.done=true}finally{s2.busy=false}})}

/* ================= STAGE 3 ================= */
const SUBS=[
 {n:'كلوروميثان',f:'CH3Cl',X:'Cl',g:['H','H','H'],o:['ميثانول','CH3OH'],c:['إيثان نتريل','CH3CN']},
 {n:'بروموإيثان',f:'CH3CH2Br',X:'Br',g:['CH3','H','H'],o:['إيثانول','CH3CH2OH'],c:['بروبان نتريل','CH3CH2CN']},
 {n:'1-بروموبروبان',f:'CH3CH2CH2Br',X:'Br',g:['C2H5','H','H'],o:['1-بروبانول','CH3CH2CH2OH'],c:['بيوتان نتريل','CH3CH2CH2CN']},
 {n:'2-يودوبروبان',f:'CH3CHICH3',X:'I',g:['CH3','CH3','H'],o:['2-بروبانول','CH3CH(OH)CH3'],c:['2-مثيل بروبان نتريل','CH3CH(CN)CH3']}];
const RG={koh:{n:'محلول KOH المائي',f:'KOH(aq)',lab:'KOH',sub:'مائي',nu:'OH⁻',col:'#d6ebff',mix:'#cdeedc',x:-360},
 kcn:{n:'KCN',f:'KCN',lab:'KCN',sub:'سيانيد',nu:'CN⁻',col:'#e9e2ff',mix:'#e2d9f6',x:-200}};
const SALT={Cl:'كلوريد البوتاسيوم',Br:'بروميد البوتاسيوم',I:'يوديد البوتاسيوم'};
const M={x:-30,y:-150},FX=170;
const s3={s:1,busy:false,done:false,b:{},drag:null};
function bottleT(b){b.g.setAttribute('transform',`translate(${b.x},${b.y}) rotate(${b.rot} 0 -70)`)}
const ST3={view:{x:-560,y:-360,w:1120,h:640},hint:'اسحب قنينة KOH المائي إلى الدورق، أو اضغط عليها',steps:true,
 panel:()=>`<h3>هاليد الألكيل في الدورق</h3><div class="chips">${SUBS.map((m,i)=>`<button class="chip ${i===s3.s?'on':''}" data-s3="${i}">${m.n}<small dir="ltr">${fm(m.f)}</small></button>`).join('')}</div>
 <div class="card rule"><div class="lbl">تفاعل التعويض النيوكليوفيلي</div>يهاجم <b>النيوكليوفيل</b> ذرة الكاربون من الجهة المعاكسة للهالوجين، فيخرج <b>أيون الهاليد</b> ويحلّ النيوكليوفيل محلّه.<div class="row" style="justify-content:center;margin-top:6px"><b dir="ltr">R–X + OH⁻ → R–OH + X⁻</b></div></div>
 <div class="key"><div><i style="--c:#4dabf7">KOH(aq)</i>يكوّن كحولاً</div><div><i style="--c:#9775fa">KCN</i>يكوّن نتريلاً</div></div>`,
 bind(p){p.querySelectorAll('[data-s3]').forEach(b=>b.onclick=()=>{s3.s=+b.dataset.s3;go('s3')})},
 init(){s3.busy=false;s3.done=false;s3.drag=null;const g=sc.gs,sub=SUBS[s3.s];
  mk('rect',{x:-540,y:200,width:1080,height:24,rx:6,fill:'url(#wood)'},g);
  for(const x of[-500,480])mk('rect',{x,y:222,width:22,height:70,fill:'#8a6240'},g);
  mk('rect',{x:FX-80,y:180,width:160,height:20,rx:5,fill:'#5d6870'},g);s3.glow=mk('rect',{x:FX-62,y:175,width:124,height:6,rx:3,fill:'#ff6b35',opacity:0},g);
  txt(FX+60,190,'Δ','svt',g,{'font-size':14,style:'fill:#fff'});
  s3.liq=mk('path',{d:`M${FX-50} 120 L${FX-74} 172 Q${FX-77} 178 ${FX-68} 178 L${FX+68} 178 Q${FX+77} 178 ${FX+74} 172 L${FX+50} 120 Z`,fill:'#f6e7a0',opacity:.9},g);
  mk('path',{d:`M${FX-16} 18 L${FX-16} 75 L${FX-75} 171 Q${FX-80} 180 ${FX-68} 180 L${FX+68} 180 Q${FX+80} 180 ${FX+75} 171 L${FX+16} 75 L${FX+16} 18`,fill:'url(#glass)',stroke:'#7d8f99','stroke-width':3,'stroke-linejoin':'round'},g);
  mk('rect',{x:FX-22,y:12,width:44,height:8,rx:3,fill:'#9fb0b9'},g);
  mk('rect',{x:FX-52,y:128,width:104,height:28,rx:7,fill:'#fff',stroke:'#c9d3d8'},g);txt(FX,142,fm(sub.f),'svt',g,{'font-size':15,style:'fill:#222',direction:'ltr'});
  s3.drops=mk('g',{},g);
  for(const k in RG){const r=RG[k];const bg=mk('g',{style:'cursor:grab'},g);
   mk('rect',{x:-33,y:-122,width:66,height:122,rx:12,fill:r.col,stroke:'#8aa0ad','stroke-width':2.5},bg);
   mk('rect',{x:-12,y:-142,width:24,height:22,fill:r.col,stroke:'#8aa0ad','stroke-width':2.5},bg);
   mk('rect',{x:-15,y:-156,width:30,height:15,rx:4,fill:'#2f3a40'},bg);
   mk('rect',{x:-28,y:-92,width:56,height:50,rx:6,fill:'#fff',stroke:'#c9d3d8'},bg);
   txt(0,-74,r.lab,'svt',bg,{'font-size':15,style:'fill:#222'});txt(0,-54,r.sub,'svm',bg,{'font-size':12,style:'fill:#555'});
   s3.b[k]={g:bg,x:r.x,y:200,rot:0,hx:r.x};bottleT(s3.b[k])}
  s3.cone=mk('path',{d:'',fill:'rgba(30,123,77,.08)',stroke:'rgba(30,123,77,.35)','stroke-width':2,opacity:0},g);
  s3.mag=mk('g',{style:'display:none'},g);mk('circle',{cx:0,cy:0,r:190,class:'mag'},s3.mag);txt(0,-165,'نافذة جزيئية مكبّرة','svm',s3.mag,{'font-size':14});
  sc.gb.setAttribute('clip-path','url(#magclip)');sc.ga.setAttribute('clip-path','url(#magclip)');sc.gf.setAttribute('clip-path','url(#magclip)')},
 grab(w){if(s3.busy||s3.done)return false;for(const k in s3.b){const b=s3.b[k];if(Math.abs(w.x-b.x)<40&&w.y<b.y+4&&w.y>b.y-160){s3.drag={k,w};return true}}return false},
 drag(w){const d=s3.drag,b=s3.b[d.k];b.x+=w.x-d.w.x;b.y+=w.y-d.w.y;d.w=w;bottleT(b)},
 drop(w,tap){const d=s3.drag;s3.drag=null;if(!d)return;const b=s3.b[d.k];
  if(tap||(Math.abs(b.x-FX)<130&&b.y<240))react3(d.k);else{const x0=b.x,y0=b.y;tween(400,t=>{b.x=L(x0,b.hx,t);b.y=L(y0,200,t);bottleT(b)},token).catch(()=>{})}}
};
function lerpCol(a,b,t){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(L(v,B[i],t)).toString(16).padStart(2,'0')).join('')}
function react3(k){if(s3.busy||s3.done)return;s3.busy=true;
 seq(async R=>{try{
  const sub=SUBS[s3.s],rg=RG[k],X=sub.X,b=s3.b[k],isOH=k==='koh',prod=isOH?sub.o:sub.c;
  await R.step('إضافة '+rg.n+' إلى '+sub.n+' مع التسخين');
  const bx0=b.x,by0=b.y;await R.tw(800,t=>{b.x=L(bx0,FX-90,t);b.y=L(by0,40,t);b.rot=75*t;bottleT(b)});
  const drops=[0,1,2,3,4,5].map(()=>mk('ellipse',{rx:4,ry:6,fill:rg.col,stroke:'#7fa4c0'},s3.drops));const c0=s3.liq.getAttribute('fill');
  await R.tw(1600,(e,t)=>{drops.forEach((d,i)=>{const u=(t*4+i/6)%1;d.setAttribute('cx',FX-12+u*8);d.setAttribute('cy',L(-45,130,u));d.style.opacity=t<.9?1:0});s3.liq.setAttribute('fill',lerpCol(c0,rg.mix,t));s3.glow.setAttribute('opacity',t*.9)});
  s3.drops.innerHTML='';
  await R.tw(600,t=>{b.x=L(FX-90,b.hx,t);b.y=L(40,200,t);b.rot=75*(1-t);bottleT(b)});
  await R.step('نكبّر المشهد لنرى الجزيئات');
  s3.mag.style.display='';const a1=Math.PI*.18,a2=Math.PI*.62;
  s3.cone.setAttribute('d',`M${FX-14} 20 L${M.x+190*Math.cos(a1)} ${M.y+190*Math.sin(a1)} L${M.x+190*Math.cos(a2)} ${M.y+190*Math.sin(a2)} Z`);
  await R.tw(700,t=>{const x=L(FX,M.x,t),y=L(60,M.y,t);s3.mag.setAttribute('transform',`translate(${x},${y}) scale(${Math.max(.01,t)})`);s3.cone.setAttribute('opacity',t)});
  const C=sc.atom('Cc','C',M.x-10,M.y,{op:0});const dX=HB+EL[X].r-13+8;
  sc.bond('CX','Cc','Xx');const Xa=sc.atom('Xx',X,C.x+dX,C.y,{op:0});
  const base=[{x:-.4,y:-.92,d:0,s:1,o:1},{x:-.4,y:.55,d:.3,s:1.1,o:1},{x:-.4,y:.38,d:-.3,s:.85,o:.6}];
  const subs=sub.g.map((gl,i)=>{const isH=gl==='H';sc.bond('bs'+i,'Cc','s'+i,{dash:i===2?1:0,w:i===1?7:4.5});return sc.atom('s'+i,isH?'H':'R',0,0,{lab:isH?'H':fm(gl),op:0,len:isH?HB:HB+14})});
  const setU=u=>subs.forEach((a,i)=>{const q=base[i];a.x=C.x+(L(q.x,-q.x,u)+q.d)*a.len;a.y=C.y+q.y*a.len;a.s=q.s});
  setU(0);await R.tw(500,t=>{C.op=Xa.op=t;subs.forEach((a,i)=>a.op=base[i].o*t)});
  txt(M.x,M.y+155,sub.n,'svt',sc.gf,{'font-size':17}).classList.add('popin');
  await R.step('أيون '+rg.nu+' (نيوكليوفيل) يهاجم من الجهة المعاكسة للهالوجين');
  const n1=sc.atom('n1',isOH?'O':'C',C.x-270,C.y,{op:0,charge:'−'});const n2=isOH?sc.atom('n2','H',0,0,{op:0}):sc.atom('n2','N',0,0,{op:0});
  sc.bond('nb','n1','n2',{order:isOH?1:3});const off=isOH?{x:-38,y:-42}:{x:-60,y:0};
  const nu=x=>{n1.x=x;n1.y=C.y;n2.x=x+off.x;n2.y=C.y+off.y};nu(C.x-270);
  await R.tw(1000,t=>{nu(L(C.x-270,C.x-150,t));n1.op=n2.op=Math.min(1,t*2)});
  const fx=mk('g',{},sc.gf);
  const a1p=mk('path',{class:'arr',d:`M${C.x-145} ${C.y-26} Q${C.x-80} ${C.y-95} ${C.x-22} ${C.y-26}`,opacity:0},fx);
  const a2p=mk('path',{class:'arr',d:`M${C.x+dX/2} ${C.y+8} Q${C.x+dX/2+12} ${C.y+62} ${Xa.x} ${Xa.y+EL[X].r+6}`,opacity:0},fx);
  await R.tw(500,t=>{a1p.setAttribute('opacity',t);a2p.setAttribute('opacity',t)});await R.wait(500);
  await R.step('الحالة الانتقالية: آصرة تتكوّن وآصرة تنكسر');
  const cn=sc.bond('cn','Cc','n1',{dash:1,op:0});sc.B.CX.dash=1;
  const br=mk('g',{opacity:0},fx);txt(C.x-175,C.y,'[','svt',br,{'font-size':150,style:'font-weight:300'});txt(C.x+dX+52,C.y,']','svt',br,{'font-size':150,style:'font-weight:300'});txt(C.x+dX+78,C.y-62,'‡','svt',br,{'font-size':26});
  const xx0=Xa.x;
  await R.tw(1000,t=>{nu(L(C.x-150,C.x-112,t));Xa.x=L(xx0,xx0+16,t);cn.op=t;setU(.5*t);a1p.setAttribute('opacity',1-t*.6);a2p.setAttribute('opacity',1-t*.6);br.setAttribute('opacity',t*.6)});
  await R.wait(500);
  await R.step('خروج أيون الهاليد '+X+'⁻ وتكوّن '+prod[0]);
  const fd=C.x-(HB+EL[n1.el].r-13+6),xx1=Xa.x;
  await R.tw(1200,t=>{nu(L(C.x-112,fd,t));setU(.5+.5*t);Xa.x=L(xx1,xx1+38,t);sc.B.CX.op=1-ramp(t,0,.5);if(t>.5){cn.dash=0;n1.charge='';Xa.charge='−'}br.setAttribute('opacity',.6*(1-t));a1p.setAttribute('opacity',.4*(1-t));a2p.setAttribute('opacity',.4*(1-t))});
  fx.remove();
  const K=sc.atom('K','K',Xa.x-10,Xa.y+150,{op:0,charge:'+'});
  await R.tw(700,t=>{K.op=t;K.y=L(Xa.y+150,Xa.y+60,t);K.x=Xa.x-10});
  await R.step('الناتج: '+prod[0]);
  sc.gf.querySelectorAll('text').forEach(e=>e.textContent=prod[0]);
  eqSet([fm(sub.f),'+',rg.f,ARWH,fm(prod[1]),'+','K'+X],`${sub.n} + ${isOH?'هيدروكسيد البوتاسيوم':'سيانيد البوتاسيوم'} ← ${prod[0]} + ${SALT[X]}`);await eqReveal(R);
  s3.glow.setAttribute('opacity',0);s3.done=true}finally{s3.busy=false}})}

/* ---------- stage switching ---------- */
const STAGES={s1:ST1,s2:ST2,s3:ST3},panel=$('#panel');
function go(k){cancel();curKey=k;cur=STAGES[k];if(sc)sc.destroy();sc=new Scene();eqHide();
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.s===k));
 panel.innerHTML=cur.panel();cur.bind(panel);cur.init();fit();cap(cur.hint);
 $('#modeBtn').style.display=nextBtn.style.display=cur.steps?'':'none';
 try{localStorage.setItem('ahl-stage',k)}catch(e){}}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.s));
$('#resetBtn').onclick=()=>go(curKey);
const modeBtn=$('#modeBtn');modeBtn.onclick=()=>{stepMode=!stepMode;modeBtn.classList.toggle('on',stepMode);modeBtn.textContent=stepMode?'وضع: خطوة بخطوة':'خطوة بخطوة'};

/* ---------- background colours & fullscreen ---------- */
const BGS=[['#ffffff','أبيض'],['#0f1b2d','كحلي'],['#0d2a1c','أخضر غامق'],['#1b1c20','فحمي'],['#241634','بنفسجي غامق'],['#2b1e14','بني غامق'],['#0e2a2f','تركوازي غامق'],['#2a1018','عنابي']];
const pop=$('#pop');pop.innerHTML=BGS.map(([c,n])=>`<button data-c="${c}" title="${n}" aria-label="${n}" style="background:${c}"></button>`).join('');
function setBg(c){document.documentElement.style.setProperty('--bg',c);document.body.classList.toggle('dark',c!=='#ffffff');pop.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));try{localStorage.setItem('ahl-bg',c)}catch(e){}}
pop.onclick=e=>{const c=e.target.dataset.c;if(c){setBg(c);pop.classList.remove('show')}};
$('#bgBtn').onclick=e=>{e.stopPropagation();pop.classList.toggle('show')};
document.addEventListener('click',e=>{if(!pop.contains(e.target))pop.classList.remove('show')});
$('#fsBtn').onclick=()=>{try{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const el=d.documentElement;const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(p&&p.catch)p.catch(()=>{})}}catch(e){}};
addEventListener('resize',()=>{});

let bg0='#ffffff',st0='s1';try{bg0=localStorage.getItem('ahl-bg')||bg0;st0=localStorage.getItem('ahl-stage')||st0}catch(e){}
setBg(bg0);go(STAGES[st0]?st0:'s1');
(function loop(){if(sc)sc.render();requestAnimationFrame(loop)})();
}
