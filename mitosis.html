<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>أطوار الانقسام الخيطي</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #eef6fb;
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: clamp(54px, 7vh, 64px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1f3a52;
    padding: 4px 12px;
    box-sizing: border-box;
    z-index: 20;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  #mainTitle {
    color: #38bdf8;
    font-size: clamp(15px, 3.2vw, 19px);
    font-weight: 900;
    line-height: 1.2;
    text-align: center;
  }
  #subTitle {
    color: #ffffff;
    font-size: clamp(12px, 2.4vw, 15px);
    font-weight: bold;
    line-height: 1.2;
    text-align: center;
    transition: opacity .22s ease;
  }
  #stage {
    position: absolute;
    top: clamp(54px, 7vh, 64px);
    bottom: 0;
    left: 0;
    right: 0;
    background: radial-gradient(circle at 50% 45%, #ffffff 0%, #e3f0f8 100%);
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
    transition: opacity .3s;
  }
  svg:active {
    cursor: grabbing;
  }
  #ctrl {
    position: absolute;
    bottom: 16px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    pointer-events: none;
    z-index: 10;
  }
  #ctrl > * {
    pointer-events: auto;
  }
  .nav {
    width: clamp(48px, 6.5vw, 60px);
    height: clamp(48px, 6.5vw, 60px);
    border-radius: 50%;
    border: 3px solid #1f3a52;
    background: #fff;
    color: #1f3a52;
    font-size: clamp(20px, 3vw, 26px);
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.25);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s, background-color .2s;
  }
  .nav:active {
    background: #d9ebf7;
    transform: scale(0.92);
  }
  #dots {
    display: flex;
    gap: 9px;
    align-items: center;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid #1f3a52;
    background: #fff;
    padding: 0;
    cursor: pointer;
    transition: all .3s;
  }
  .dot.on {
    background: #c4623a;
    border-color: #c4623a;
    transform: scale(1.45);
  }
  .zb {
    position: absolute;
    top: 12px;
    left: max(12px, env(safe-area-inset-left, 12px));
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 25;
  }
  .zb button {
    width: clamp(38px, 5vw, 42px);
    height: clamp(38px, 5vw, 42px);
    border-radius: 50%;
    border: 2px solid #1f3a52;
    background: #fff;
    color: #1f3a52;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s, background-color .2s;
  }
  .zb button:active {
    background: #e2e8f0;
    transform: scale(0.92);
  }
  .pill {
    fill: #fff;
    stroke: #c4623a;
    stroke-width: 2.5;
  }
  .lbl {
    fill: #a8431b;
    font-size: 19px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: central;
  }
  .ln {
    stroke: #c4623a;
    stroke-width: 2.2;
    fill: none;
  }
  .td {
    fill: #c4623a;
    stroke: #fff;
    stroke-width: 1.5;
  }

  @media (orientation: portrait) and (max-width: 768px) {
    .zb { flex-direction: row; }
    .lbl { font-size: 14.5px; }
  }
</style>
</head>
<body>
<div id="top">
  <div id="mainTitle">أطوار الانقسام الخيطي (الاعتيادي)</div>
  <div id="subTitle">الطور البيني المتأخر</div>
</div>

<div id="stage">
  <div class="zb">
    <button id="zin" title="تكبير">+</button>
    <button id="zout" title="تصغير">−</button>
    <button id="zreset" title="إعادة ضبط">⟲</button>
    <button id="zfs" title="ملء الشاشة">⛶</button>
  </div>
  <svg id="svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="gCell" cx="45%" cy="40%" r="75%">
        <stop offset="0%" stop-color="#fde9c4"/>
        <stop offset="1" stop-color="#f2c07a"/>
      </radialGradient>
      <radialGradient id="gNuc" cx="40%" cy="38%" r="70%">
        <stop offset="0%" stop-color="#8fb0f7"/>
        <stop offset="0.7" stop-color="#4a78d8"/>
        <stop offset="1" stop-color="#2f58b8"/>
      </radialGradient>
    </defs>
    <g id="view"></g>
  </svg>
  <div id="ctrl">
    <button class="nav" id="prev" title="السابق">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next" title="التالي">◀</button>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg", CX=450, CY=350;
const svg=document.getElementById('svg'), view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};

/* ---------------- stages ---------------- */
const names=[
  "الطور البيني المتأخر",
  "الطور التمهيدي",
  "الطور الاستوائي الأول",
  "الطور الاستوائي",
  "الطور الانفصالي",
  "الطور النهائي",
  "الانقسام السايتوبلازمي",
  "الطور البيني المبكر"
];
const off=[[-22,-24],[22,-20],[-20,22],[24,26]], pos3=[[-25,-60],[38,-25],[-42,28],[22,62]], base3=[25,-30,70,-10], ys=[-85,-28,28,85];
const mk=f=>{const a=[];for(let i=0;i<4;i++)for(let w=0;w<2;w++)a.push(f(i,w));return a;};
const n=(x,r,env,fill,nuc)=>({x,r,env,fill,nuc});
const C=(x,y,rot,cond,bend,sc)=>({x,y,rot,cond,bend,sc});
const tel=(d,s)=>mk((i,w)=>C((w?d:-d)+off[i][0]*.7,off[i][1]*.7,0,0,0,s));
const S=[
 {cell:[0,210,150],A:n(0,80,1,.9,1),B:n(115,62,0,0,0),cen:[-9,98,9,98],sp:[0,0,0],lab:[1,1,1,1,0],
  ch:mk((i,w)=>C(off[i][0],off[i][1],0,0,0,1))},
 {cell:[0,210,150],A:n(0,82,.5,.35,0),B:n(115,62,0,0,0),cen:[-175,0,175,0],sp:[.7,0,40],lab:[0,0,1,0,1],
  ch:mk((i,w)=>C(off[i][0]*1.35,off[i][1]*1.35,w?-28:28,1,0,1))},
 {cell:[0,210,150],A:n(0,85,0,0,0),B:n(115,62,0,0,0),cen:[-175,0,175,0],sp:[1,1,70],lab:[0,0,1,0,1],
  ch:mk((i,w)=>C(pos3[i][0],pos3[i][1],base3[i]+(w?-28:28),1,0,1))},
 {cell:[0,210,150],A:n(-115,62,0,0,0),B:n(115,62,0,0,0),cen:[-175,0,175,0],sp:[1,1,78],lab:[0,0,1,0,1],
  ch:mk((i,w)=>C(0,ys[i],w?-28:28,1,0,1))},
 {cell:[0,225,140],A:n(-115,62,0,0,0),B:n(115,62,0,0,0),cen:[-195,0,195,0],sp:[1,1,68],lab:[0,0,1,0,1],
  ch:mk((i,w)=>C(w?145:-145,ys[i]*.8,0,1,w?-.75:.75,1))},
 {cell:[45,170,125],A:n(-115,62,1,.9,1),B:n(115,62,1,.9,1),cen:[-190,0,190,0],sp:[.7,0,50],lab:[1,1,1,0,1],ch:tel(115,.55)},
 {cell:[100,118,120],A:n(-115,66,1,.9,1),B:n(115,66,1,.9,1),cen:[-185,0,185,0],sp:[.4,0,30],lab:[1,1,1,0,1],ch:tel(115,.55)},
 {cell:[125,100,110],A:n(-125,72,1,.9,1),B:n(125,72,1,.9,1),cen:[-125,88,125,88],sp:[0,0,0],lab:[1,1,1,1,0],ch:tel(125,.65)}
];
const lerp=(a,b,e)=>{if(typeof a==='number')return a+(b-a)*e;if(Array.isArray(a))return a.map((v,i)=>lerp(v,b[i],e));const o={};for(const k in a)o[k]=lerp(a[k],b[k],e);return o;};
let cur=lerp(S[0],S[0],0), from=cur, to=S[0], t0=-1e9, idx=0;
const DUR=2800, ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------------- scene elements ---------------- */
const cellP=el('path',{fill:'url(#gCell)',stroke:'#d08a35','stroke-width':5,'stroke-linejoin':'round'},view);
const polar=[0,1,2,3,4].map(()=>el('path',{fill:'none',stroke:'#8a6a45','stroke-width':1.4},view));
const kin=[0,1,2,3,4,5,6,7].map(()=>el('line',{stroke:'#8a6a45','stroke-width':1.3},view));
const nuc=[0,1].map(()=>{const g=el('g',{},view);return{g,f:el('ellipse',{fill:'url(#gNuc)'},g),e:el('ellipse',{fill:'none',stroke:'#27459f','stroke-width':3.5,'stroke-linecap':'round'},g),o:el('circle',{fill:'#13265e'},g)};});
const K=36, thr=[];
for(let id=0;id<8;id++){const p1=id*1.7+.3,p2=id*2.9+1,p3=id*.8,a=[];
  for(let k=0;k<K;k++){const t=k/(K-1)*2-1;a.push([30*Math.sin(2.6*Math.PI*t+p1)+9*Math.sin(6*Math.PI*t+p2),42*t+18*Math.cos(3.4*Math.PI*t+p3)+7*Math.sin(7*Math.PI*t+p1)]);}
  thr.push(a);}
const chr=[...Array(8)].map((_,id)=>el('polyline',{fill:'none',stroke:(id>>1)<2?'#1e8e3e':'#b0176b','stroke-linecap':'round','stroke-linejoin':'round'},view));
const cmr=[...Array(8)].map(()=>el('circle',{r:4.2,fill:'#fff',stroke:'#333','stroke-width':1.2},view));
const cen=[0,1].map(()=>{const g=el('g',{},view);el('circle',{r:15,fill:'#fff','fill-opacity':.4},g);el('rect',{x:-10,y:-3,width:18,height:6,rx:3,fill:'#6b3f14'},g);el('rect',{x:3,y:-10,width:6,height:18,rx:3,fill:'#6b3f14'},g);return g;});

/* labels */
const LB=[{s:'L',py:150,w:170,t:'الغلاف النووي'},{s:'R',py:140,w:110,t:'النوية'},{s:'R',py:300,w:150,t:'كروموسوم'},{s:'L',py:540,w:240,t:'مريكزا الجسيم المركزي'},{s:'R',py:520,w:170,t:'الياف المغزل'}];
const lg=el('g',{'pointer-events':'none'},view);
LB.forEach(l=>{
  l.px=l.s==='L'?20+l.w:880-l.w; const cx=l.s==='L'?20+l.w/2:880-l.w/2;
  l.g=el('g',{},lg); l.ln=el('line',{class:'ln',x1:l.px,y1:l.py},l.g); l.dt=el('circle',{class:'td',r:5},l.g);
  el('rect',{class:'pill',x:cx-l.w/2,y:l.py-19,width:l.w,height:38,rx:19},l.g);
  el('text',{class:'lbl',x:cx,y:l.py},l.g).textContent=l.t;
});
function fiberPt(s,o,u){const ax=CX+s.cen[0],ay=CY+s.cen[1],bx=CX+s.cen[2],by=CY+s.cen[3],H=s.sp[2];
  const qx=(ax+bx)/2,qy=(ay+by)/2+o*2*H,m=1-u;return[m*m*ax+2*m*u*qx+u*u*bx,m*m*ay+2*m*u*qy+u*u*by];}
function target(k,s){
  if(k===0)return[CX+s.A.x-.707*s.A.r,CY-.707*s.A.r];
  if(k===1){const b=s.B.nuc>.5,q=b?s.B:s.A,sg=b?-1:1;return[CX+q.x+sg*.22*q.r,CY-.28*q.r];}
  if(k===2){const i=(s.ch[3].x-s.ch[2].x>40)?3:2;return[CX+s.ch[i].x,CY+s.ch[i].y];}
  if(k===3)return[CX+s.cen[0],CY+s.cen[1]];
  return fiberPt(s,1,.8);
}

/* ---------------- render ---------------- */
const ell=(x,rx,ry)=>`M${x-rx},${CY}A${rx},${ry} 0 1 0 ${x+rx},${CY}A${rx},${ry} 0 1 0 ${x-rx},${CY}Z`;
function cellD(c,rx,ry){
  if(c>=rx-.5)return ell(CX-c,rx,ry)+ell(CX+c,rx,ry);
  const W=c+rx,e=(x,m)=>ry*Math.sqrt(Math.max(0,1-((x-m)/rx)**2)),T=[],B=[];
  for(let k=0;k<=90;k++){const x=W*Math.sin(-Math.PI/2+Math.PI*k/90),h=Math.max(e(x,-c),e(x,c));T.push((CX+x).toFixed(1)+','+(CY-h).toFixed(1));B.push((CX+x).toFixed(1)+','+(CY+h).toFixed(1));}
  return 'M'+T.join('L')+'L'+B.reverse().join('L')+'Z';
}
function render(s,t){
  cellP.setAttribute('d',cellD(s.cell[0],s.cell[1],s.cell[2]));
  const ax=CX+s.cen[0],ay=CY+s.cen[1],bx=CX+s.cen[2],by=CY+s.cen[3],pf=s.sp[0],kf=s.sp[1];
  [-1,-.5,0,.5,1].forEach((o,k)=>{polar[k].setAttribute('d',`M${ax},${ay}Q${(ax+bx)/2},${(ay+by)/2+o*2*s.sp[2]} ${bx},${by}`);polar[k].setAttribute('stroke-opacity',pf*.6);});
  kin.forEach((ln,id)=>{const c=s.ch[id],px=id%2?bx:ax,py=id%2?by:ay;
    ln.setAttribute('x1',px);ln.setAttribute('y1',py);ln.setAttribute('x2',CX+c.x);ln.setAttribute('y2',CY+c.y);ln.setAttribute('stroke-opacity',kf*.7);});
  [s.A,s.B].forEach((q,i)=>{const o=nuc[i],vis=Math.max(q.fill,q.env);o.g.setAttribute('display',vis<.02?'none':'');
    const cx=CX+q.x;
    o.f.setAttribute('cx',cx);o.f.setAttribute('cy',CY);o.f.setAttribute('rx',q.r);o.f.setAttribute('ry',q.r*.97);o.f.setAttribute('fill-opacity',q.fill);
    o.e.setAttribute('cx',cx);o.e.setAttribute('cy',CY);o.e.setAttribute('rx',q.r);o.e.setAttribute('ry',q.r*.97);o.e.setAttribute('stroke-opacity',Math.min(1,q.env*1.2));
    o.e.setAttribute('stroke-dasharray',(3+8*q.env).toFixed(1)+' '+(6+16*(1-q.env)).toFixed(1));o.e.setAttribute('stroke-dashoffset',(t*8).toFixed(1));
    o.o.setAttribute('cx',cx+(i?-1:1)*.22*q.r);o.o.setAttribute('cy',CY-.28*q.r);o.o.setAttribute('r',.14*q.r);o.o.setAttribute('fill-opacity',q.nuc);});
  s.ch.forEach((c,id)=>{
    const co=Math.cos(c.rot*Math.PI/180),si=Math.sin(c.rot*Math.PI/180),pts=[];
    for(let k=0;k<K;k++){const tt=k/(K-1)*2-1,th=thr[id][k],j=2.5*Math.sin(t*2+k*.7+id)*(1-c.cond);
      const lx=(1-c.cond)*(th[0]*c.sc+j)+c.cond*(c.bend*27*Math.abs(tt)),ly=(1-c.cond)*(th[1]*c.sc)+c.cond*tt*34;
      pts.push((CX+c.x+lx*co-ly*si).toFixed(1)+','+(CY+c.y+lx*si+ly*co).toFixed(1));}
    chr[id].setAttribute('points',pts.join(' '));chr[id].setAttribute('stroke-width',(2+c.cond*5).toFixed(1));
    cmr[id].setAttribute('cx',CX+c.x);cmr[id].setAttribute('cy',CY+c.y);cmr[id].setAttribute('opacity',Math.max(0,c.cond*2-1));
  });
  cen.forEach((g,i)=>g.setAttribute('transform',`translate(${i?bx:ax} ${i?by:ay}) scale(${(1+.08*Math.sin(t*3+i)).toFixed(3)})`));
  LB.forEach((l,k)=>{const a=s.lab[k];l.g.setAttribute('opacity',a.toFixed(2));if(a<.02)return;const p=target(k,s);
    l.ln.setAttribute('x2',p[0]);l.ln.setAttribute('y2',p[1]);l.dt.setAttribute('cx',p[0]);l.dt.setAttribute('cy',p[1]);});
}
function frame(ms){const t=ms/1000,k=Math.min(1,(ms-t0)/DUR);cur=lerp(from,to,ease(k));render(cur,t);requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const subTitle=document.getElementById('subTitle'), dotsEl=document.getElementById('dots'), dots=[];
names.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>go(i);dotsEl.appendChild(b);dots.push(b);});
function setUI(i){subTitle.style.opacity=0;setTimeout(()=>{subTitle.textContent=names[i];subTitle.style.opacity=1;},180);dots.forEach((d,k)=>d.classList.toggle('on',k===i));}
function go(i){
  if(i===idx&&t0>0)return;
  if(i<0)return;
  if(i>=S.length){ // loop back to the first phase
    svg.style.opacity=0;setTimeout(()=>{idx=0;from=to=S[0];cur=lerp(S[0],S[0],0);t0=-1e9;setUI(0);svg.style.opacity=1;},320);return;}
  from=cur;to=S[i];t0=performance.now();idx=i;setUI(i);
}
document.getElementById('next').onclick=()=>go(idx+1);
document.getElementById('prev').onclick=()=>go(idx-1);

/* ---------------- fullscreen ---------------- */
function toggleFS(){
  const d=document,de=d.documentElement;
  const req=de.requestFullscreen||de.webkitRequestFullscreen||de.mozRequestFullScreen||de.msRequestFullscreen;
  const exit=d.exitFullscreen||de.webkitExitFullscreen||de.mozCancelFullScreen||de.msExitFullscreen;
  const isFS=d.fullscreenElement||d.webkitFullscreenElement;
  if(!isFS){if(req)req.call(de).catch(()=>{});}
  else{if(exit)exit.call(d).catch(()=>{});}
}
document.getElementById('zfs').onclick=toggleFS;

/* keyboard navigation */
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown')go(idx+1);
  else if(e.key==='ArrowRight'||e.key==='PageUp')go(idx-1);
  else if(e.key==='f'||e.key==='F')toggleFS();
  else if(e.key==='+'||e.key==='=')zoomAt(1.3,{x:450,y:350});
  else if(e.key==='-'||e.key==='_')zoomAt(1/1.3,{x:450,y:350});
  else if(e.key==='0')reset();
});

setUI(0);requestAnimationFrame(frame);

/* ---------------- zoom & pan ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prev=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prev.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
svg.addEventListener('dblclick',reset);
