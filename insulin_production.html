<body>
<div id="top"><div id="title">شكل 43 - 5 , توجيه خلايا البكتريا لانتاج انسولين الانسان</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>

        <linearGradient id="gBac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef27a"/><stop offset=".6" stop-color="#c8d443"/><stop offset="1" stop-color="#9fae27"/></linearGradient>
        <radialGradient id="gHum" cx=".3" cy=".75" r=".9"><stop offset="0" stop-color="#fbe7b0"/><stop offset=".7" stop-color="#efc56d"/><stop offset="1" stop-color="#d9a246"/></radialGradient>
        <radialGradient id="gNuc" cx=".45" cy=".45" r=".6"><stop offset="0" stop-color="#ffe9dc"/><stop offset="1" stop-color="#f6b9a0"/></radialGradient>
        <radialGradient id="gEnz" cx=".38" cy=".33" r=".72"><stop offset="0" stop-color="#f6e6ff"/><stop offset=".55" stop-color="#b27ae6"/><stop offset="1" stop-color="#6a2ea6"/></radialGradient>
        <radialGradient id="gLig" cx=".38" cy=".33" r=".72"><stop offset="0" stop-color="#e9fff6"/><stop offset=".5" stop-color="#55cfa0"/><stop offset="1" stop-color="#16805a"/></radialGradient>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const op=(e,a)=>e.setAttribute('opacity',f2(a));
const place=(g,x,y,s,r)=>g.setAttribute('transform',`translate(${f1(x)} ${f1(y)})`+(r?` rotate(${f1(r)})`:'')+(s==null?'':` scale(${f2(Math.max(s,.001))})`));

const TITLE='شكل 43 - 5 , توجيه خلايا البكتريا لانتاج انسولين الانسان';
/* 1 عزل DNA · 2 القطع بالإنزيم القاطع · 3 الربط · 4 الإدخال إلى البكتيريا · 5 التضاعف · 6 إنتاج الإنسولين */
const DUR=[4,6,6,5,5,5];

const GREEN='#2e8b57',GREEN2='#8fdcaa',GENE='#f39c12',GENE2='#ffd98a',BLUE='#2f6fd0',ARROW='#34417d';

const world=G(view);
const arrL=G(world),objL=G(world),fxL=G(world),txtL=G(world);

/* ---------- drawing helpers ---------- */
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
function tangle(g,rx,ry,col,w){const a=[1,2,3].map(()=>rnd()*6),k=[3+Math.floor(rnd()*3),5+Math.floor(rnd()*3)];let d='';
  for(let i=0;i<=220;i++){const t=2*PI*i/220;
    d+=(i?'L':'M')+f1(rx*(.62*Math.sin(t+a[0])+.38*Math.sin(k[1]*t+a[1])))+','+f1(ry*(.62*Math.cos(2*t+a[2])+.38*Math.cos(k[0]*t)));}
  el('path',{d:d+'Z',fill:'none',stroke:col,'stroke-width':w||1.6,'stroke-linejoin':'round'},g);}
function arcD(r,a0,a1){const p=a=>[r*Math.cos(a*PI/180),r*Math.sin(a*PI/180)],s=p(a0),e=p(a1);
  return`M${f1(s[0])},${f1(s[1])}A${r},${r} 0 ${a1-a0>180?1:0} 1 ${f1(e[0])},${f1(e[1])}`;}
/* plasmid: a green ring with an opening at angle 0 that the human gene (orange) fills */
function plasmid(parent,r,w){const g=G(parent);
  const ring=[el('path',{fill:'none',stroke:GREEN,'stroke-width':w,'stroke-linecap':'butt'},g),el('path',{fill:'none',stroke:GREEN2,'stroke-width':w*.32},g)];
  const ins=G(g,{opacity:0});
  el('path',{d:arcD(r,-31,31),fill:'none',stroke:GENE,'stroke-width':w},ins);el('path',{d:arcD(r,-31,31),fill:'none',stroke:GENE2,'stroke-width':w*.32},ins);
  const sticky=G(g,{opacity:0});
  return{g,r,w,ring,ins,sticky,setGap(gap){const d=gap>.5?arcD(r,gap/2,360-gap/2):arcD(r,0.01,359.99)+'Z';ring.forEach(p=>p.setAttribute('d',d));
    while(sticky.firstChild)sticky.removeChild(sticky.firstChild);
    if(gap>2)[[gap/2,1],[-gap/2,-1]].forEach(([a,s])=>{const rr=r+s*w*.25,A=a*PI/180,tx=-Math.sin(A)*s,ty=Math.cos(A)*s;
      const x=rr*Math.cos(A),y=rr*Math.sin(A);
      el('line',{x1:f1(x),y1:f1(y),x2:f1(x-tx*9),y2:f1(y-ty*9),stroke:GREEN,'stroke-width':w*.5},sticky);});}};}
function bacterium(parent,w,h,pl){const g=G(parent);
  el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:h/2,fill:'url(#gBac)',stroke:'#7f8c1f','stroke-width':2.5},g);
  el('rect',{x:-w/2+h*.35,y:-h/2+6,width:w-h*.7,height:h*.18,rx:h*.09,fill:'#fff',opacity:.35},g);
  const c=G(g,{transform:`translate(${f1(-w*.12)} 2)`});tangle(c,w*.2,h*.3,'#8a3a2a',1.5);
  if(pl){const p=G(g,{transform:`translate(${f1(w*.25)} 0)`});
    el('circle',{r:h*.22,fill:'none',stroke:GREEN,'stroke-width':4.5},p);el('circle',{r:h*.22,fill:'none',stroke:GREEN2,'stroke-width':1.5},p);
    if(pl===2){el('path',{d:arcD(h*.22,-28,28),fill:'none',stroke:GENE,'stroke-width':4.5},p);}}
  return g;}
function enzyme(parent,grad,name){const g=G(parent,{opacity:0});
  el('ellipse',{rx:26,ry:18,fill:`url(#${grad})`,stroke:'#4b2370','stroke-width':1.2},g);
  el('ellipse',{cx:-8,cy:-7,rx:9,ry:4.5,fill:'#fff',opacity:.6},g);
  el('text',{class:'enz',x:0,y:-32},g).textContent=name;return g;}
function dnaPiece(parent,x0,x1,col){const g=G(parent),w=x1-x0;
  el('rect',{x:x0,y:-9,width:w,height:18,rx:3,fill:col,stroke:'rgba(0,0,0,.35)','stroke-width':1},g);
  for(let x=x0+5;x<x1-2;x+=8)el('line',{x1:x,y1:-6,x2:x,y2:6,stroke:'#fff','stroke-width':1.6,opacity:.75},g);
  el('line',{x1:x0+1,y1:0,x2:x1-1,y2:0,stroke:'rgba(0,0,0,.25)','stroke-width':1},g);return g;}
function glow(x,y,r){return el('circle',{cx:x,cy:y,r,fill:'url(#gGlow)',opacity:0},fxL);}

/* ---------- arrows that grow ---------- */
function arrow(x1,y1,x2,y2){const g=G(arrL,{opacity:0}),ln=el('path',{stroke:ARROW,'stroke-width':4,fill:'none','stroke-linecap':'round'},g),hd=el('path',{fill:ARROW},g);
  return{g,set(k){op(g,k>0?1:0);if(k<=0)return;const ex=lerp(x1,x2,k),ey=lerp(y1,y2,k),L=Math.hypot(ex-x1,ey-y1)||1,ux=(ex-x1)/L,uy=(ey-y1)/L,bx=ex-13*ux,by=ey-13*uy;
    ln.setAttribute('d',`M${x1},${y1}L${f1(bx)},${f1(by)}`);hd.setAttribute('d',`M${f1(ex)},${f1(ey)}L${f1(bx-7*uy)},${f1(by+7*ux)}L${f1(bx+7*uy)},${f1(by-7*ux)}Z`);}};}
/* labels with a thin leader line, and the step captions */
function label(lines,x,y,lx1,ly1,lx2,ly2,cls){const g=G(txtL,{opacity:0});
  if(lx1!=null)el('line',{x1:lx1,y1:ly1,x2:lx2,y2:ly2,stroke:'#333','stroke-width':1.4},g);
  lines.forEach((t,k)=>{el('text',{class:cls||'lbl',x,y:y+(k-(lines.length-1)/2)*29},g).textContent=t;});return g;}
const cap=(lines,x,y)=>label(lines,x,y,null,0,0,0,'cap');

/* ================= objects ================= */
/* human cell (top right) with its nucleus */
const human=G(objL,{opacity:0});
el('circle',{cx:1300,cy:-70,r:265,fill:'url(#gHum)',stroke:'#c98e2e','stroke-width':2},human);
el('circle',{cx:1215,cy:45,r:82,fill:'url(#gNuc)',stroke:'#c0392b','stroke-width':7},human);
{const n=G(human,{transform:'translate(1215 45)'});seed=7;tangle(n,58,48,'#2f6fd0',2.2);tangle(n,50,40,'#5b8fe0',1.6);}
/* donor bacterium (top left) */
seed=3;const bac0=bacterium(objL,200,86,1);
/* isolated human DNA: two flanks and the insulin gene */
const dnaL=dnaPiece(objL,870,960,BLUE),gene=dnaPiece(objL,-30,30,GENE),dnaR=dnaPiece(objL,1020,1110,BLUE);
[dnaL,gene,dnaR].forEach(g=>op(g,0));
/* the isolated plasmid becomes the recombinant one */
const plas=plasmid(objL,48,12);op(plas.g,0);
/* recombinant plasmid going into the host */
const mini=G(objL,{opacity:0});
el('circle',{r:16,fill:'none',stroke:GREEN,'stroke-width':5},mini);el('circle',{r:16,fill:'none',stroke:GREEN2,'stroke-width':1.6},mini);
el('path',{d:arcD(16,-21,21),fill:'none',stroke:GENE,'stroke-width':5},mini);
/* host bacterium and its daughters */
seed=11;const host=bacterium(objL,180,72,0);op(host,0);
const HOSTX=660,HOSTY=520;
objL.appendChild(mini);   /* the plasmid must sit on top of the host cell */
const DX=[420,580,740,900],DY=640;
const kids=DX.map((x,i)=>{seed=20+i*5;const g=bacterium(objL,180,72,2);op(g,0);return g;});
/* enzymes */
const enzB=enzyme(objL,'gEnz','إنزيم قاطع'),enzH=enzyme(objL,'gEnz','إنزيم قاطع'),lig=enzyme(objL,'gLig','إنزيم ربط');
/* flashes */
const flB=glow(378,250,45),flH1=glow(960,240,40),flH2=glow(1020,240,40),flLig=glow(715,380,55);
/* insulin made by the bacteria */
const ins=[];for(let i=0;i<16;i++){const c=el('g',{opacity:0},fxL);
  el('circle',{cx:-4,r:5,fill:'#e2452b',stroke:'#fff','stroke-width':1.2},c);el('circle',{cx:4,r:5,fill:'#c0392b',stroke:'#fff','stroke-width':1.2},c);
  ins.push({c,k:i%4,ph:i/16+(i%3)*.11,ang:-PI/2+((i*1.7)%2-1)*.9});}

/* arrows */
const a1b=arrow(270,125,312,192),a1h=arrow(1170,120,1075,222);
const a3l=arrow(385,285,590,360),a3r=arrow(965,345,735,372);
const a4=arrow(660,447,660,478),a5=arrow(660,562,660,600);

/* labels */
const lBac=label(['خلية بكتيرية'],60,190,105,175,150,135);
const lPla=label(['بلازميد'],370,40,340,48,288,82);
const lHum=label(['خلية إنسان'],960,55,1005,62,1045,75);
const lDna=label(['DNA إنسان يحتوي','على جين الإنسولين'],1225,252);
const lSticky=label(['أطراف دبقة'],480,305,430,295,386,262);
const lGene=label(['جين إنسولين الإنسان'],1160,322,1065,322,1030,322);
const lRec=label(['بلازميد معاد التركيب'],450,400,545,396,602,388);
const lHost=label(['بكتيريا معادة التركيب'],930,520,840,520,752,520);
const lKids=label(['خلايا بكتيرية قادرة على','إنتاج الإنسولين الإنساني'],1150,640,1050,640,992,640);
/* step captions */
const c1b=cap(['* عزل DNA'],455,150),c1h=cap(['* عزل DNA'],930,165);
const c2b=cap(['* يقطع DNA بوساطة','الإنزيم القاطع'],135,290),c2h=cap(['* يقطع DNA بوساطة الإنزيم القاطع'],1130,375);
const c3=cap(['* ربط الجين مع البلازميد','بوساطة إنزيم ربط DNA'],930,445);
const c4=cap(['* إدخال البلازميد معاد التركيب','إلى خلية بكتيريا عائل'],355,520);
const c5=cap(['* تتضاعف خلية البكتيريا منتجة خلايا','جديدة تحتوي على جين الإنسولين'],140,655);
const c6=cap(['* تنتج البكتيريا','إنسولين الإنسان'],215,585);

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:1,dur:DUR[0]};
let stage=0,T=0,t0=0,paused=false,P=0,last=performance.now();
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

/* ---------------- render ---------------- */
function render(){
  const [u0,u1,u2,u3,u4,u5]=DUR.map((_,i)=>clamp(P-i,0,1));
  /* 1 — isolate the DNA from both cells */
  const s0=sm(u0,0,.3);op(human,s0);op(bac0,s0);place(bac0,220,100,.7+.3*s0);
  a1b.set(sm(u0,.3,.55));a1h.set(sm(u0,.3,.55));
  const iso=sm(u0,.5,.8);
  op(lBac,sm(u0,.2,.45));op(lPla,sm(u0,.25,.5));op(lHum,sm(u0,.2,.45));op(lDna,sm(u0,.7,.95));
  op(c1b,sm(u0,.6,.9));op(c1h,sm(u0,.6,.9));

  /* 2 — the restriction enzyme cuts the plasmid and cuts the gene out of the human DNA */
  const ev=sm(u1,0,.12)*(1-sm(u1,.62,.8));
  op(enzB,ev);place(enzB,lerp(470,384,sm(u1,.1,.38)),lerp(250,250,0)-lerp(0,60,sm(u1,.62,.8)));
  const hx=u1<.32?lerp(990,960,sm(u1,.1,.28)):lerp(960,1020,sm(u1,.34,.5));
  op(enzH,ev);place(enzH,hx,lerp(175,238,sm(u1,.1,.28))-lerp(0,60,sm(u1,.62,.8)));
  op(flB,Math.sin(PI*sm(u1,.38,.6))*.9);op(flH1,Math.sin(PI*sm(u1,.26,.42))*.9);op(flH2,Math.sin(PI*sm(u1,.44,.6))*.9);
  const gap=60*sm(u1,.42,.55),drop=sm(u1,.55,.8),spread=sm(u1,.5,.7);
  plas.setGap(gap);
  op(lSticky,sm(u1,.7,.95)*(1-sm(u2,0,.15)));op(lGene,sm(u1,.75,1)*(1-sm(u2,0,.15)));
  op(c2b,sm(u1,.6,.9));op(c2h,sm(u1,.6,.9));

  /* 3 — plasmid and gene meet in the middle; DNA ligase seals them */
  const mv=sm(u2,.15,.55),join=sm(u2,.55,.75);
  a3l.set(sm(u2,0,.2));a3r.set(sm(u2,0,.2));
  place(plas.g,lerp(330,660,mv),lerp(250,380,mv),lerp(.6,1,iso)*(1+.15*mv));op(plas.g,iso);
  op(plas.ins,join);op(plas.sticky,sm(u1,.5,.6)*(1-join));
  [dnaL,dnaR].forEach((g,k)=>{place(g,(k?1:-1)*14*spread,240);op(g,iso);});
  place(gene,lerp(990,660+48*1.15,mv),lerp(240+80*drop,380,mv),1+.15*mv*0,90*mv);op(gene,iso*(1-join));
  op(lig,sm(u2,.5,.62)*(1-sm(u2,.85,1)));place(lig,760,345);
  op(flLig,Math.sin(PI*sm(u2,.55,.95))*.9);
  op(lRec,sm(u2,.75,1));op(c3,sm(u2,.6,.9));

  /* 4 — the recombinant plasmid enters a host bacterium */
  const hs=sm(u3,0,.25);op(host,hs);place(host,HOSTX,HOSTY,.7+.3*hs);a4.set(sm(u3,.1,.3));
  const ent=sm(u3,.3,.8);op(mini,sm(u3,.25,.35));place(mini,lerp(660,HOSTX+45,ent),lerp(380,HOSTY,ent),lerp(3.4,1,ent));
  op(lHost,sm(u3,.75,1));op(c4,sm(u3,.5,.85));

  /* 5 — the bacterium divides; every new cell carries the insulin gene */
  a5.set(sm(u4,0,.2));
  kids.forEach((g,i)=>{const k=sm(u4,.15+.1*i,.55+.1*i);op(g,k);place(g,lerp(HOSTX,DX[i],k),lerp(HOSTY+30,DY,k),lerp(.3,.72,k));});
  op(lKids,sm(u4,.65,.95));op(c5,sm(u4,.5,.85));

  /* 6 — insulin leaves the bacteria */
  const iv=sm(u5,0,.3);
  ins.forEach(q=>{const f=(T*.35+q.ph)%1,r=30+70*f;
    place(q.c,DX[q.k]+Math.cos(q.ang)*r,DY-10+Math.sin(q.ang)*r*.9,.8,f*120);op(q.c,iv*Math.sin(PI*f));});
  op(c6,sm(u5,.3,.6));
}
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render();requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');
DUR.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','المرحلة '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);});
function setUI(){document.title=TITLE;[...dotsEl.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+DUR.length)%DUR.length;const tgt=i+1;
  if(tgt<=P+1e-3)P=i;
  let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  if(tgt-P>1.01)d*=.6;
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1.2,d);
  setUI();}
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(stage-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(stage+1);if(e.key==='ArrowRight')go(stage-1);});
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:650,y:350});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:650,y:350});
document.getElementById('zreset').onclick=reset;
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
go(0);render();requestAnimationFrame(frame);
})();
</script>
