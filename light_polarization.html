<title>نشاط استقطاب موجات الضوء</title>
<style>
/* Layout: one full-screen navy lab bench; every control is a physical part of the apparatus or a clear button */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --accent:#7fd3ff; --warn:#ffc04d;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body)}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.fs{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.fs:hover{border-color:var(--accent)}
.fs:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fs svg{width:20px;height:20px}
.toast{position:absolute;top:max(62px,calc(env(safe-area-inset-top,0px) + 56px));right:max(10px,env(safe-area-inset-right,0px));max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink)}
.tipbtn{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:calc(max(10px,env(safe-area-inset-right,0px)) + 50px);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:#ffd27a;display:grid;place-items:center;cursor:pointer;padding:0}
.tipbtn:hover,.tipbtn.on{border-color:#ffd27a;background:rgba(255,210,122,.14)}
.tipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tipbtn svg{width:22px;height:22px}
.tip{box-sizing:border-box;position:absolute;top:max(60px,calc(env(safe-area-inset-top,0px) + 58px));right:max(10px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 20px));max-height:calc(100% - 80px);overflow:auto;background:rgba(8,20,41,.95);border:1px solid rgba(255,210,122,.35);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.8;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.tip h2{margin:0 0 8px;font-family:var(--f-display);font-size:16px;font-weight:600;color:#ffd27a;padding-left:28px;text-wrap:balance}
.tip p{margin:0 0 8px}
.tip .m,.tip b.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.tip p.m{text-align:center;color:var(--accent);font-weight:600}
.tip .note{color:var(--muted);font-size:13px}
.tip .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;direction:ltr;justify-content:flex-end}
.tip .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.tip .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.tip .x:hover{color:var(--ink)}
.parts{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;direction:rtl}
.parts button{height:42px;padding:0 12px 0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--muted);font:600 13px var(--f-body);cursor:pointer;display:flex;align-items:center;gap:7px}
.parts button i{width:9px;height:9px;border-radius:50%;border:1.6px solid currentColor;box-sizing:border-box;flex:none}
.parts button[aria-pressed="true"]{color:var(--ink);border-color:rgba(127,211,255,.6);background:rgba(127,211,255,.14)}
.parts button[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.parts button[aria-pressed="false"] span{text-decoration:line-through;text-decoration-thickness:1px}
.parts button:hover{border-color:var(--accent)}
.parts button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.parts .s{display:none}
@media (max-width:640px){.parts .l{display:none}.parts .s{display:inline}.parts button{padding:0 9px 0 10px;font-size:12.5px}}
@media (max-width:420px){.parts{gap:4px}.parts button{padding:0 7px 0 8px;font-size:12px;gap:5px}.parts button i{width:7px;height:7px}}
</style>

<body style="margin:0">

<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="محاكاة استقطاب موجات الضوء: مصدر ضوئي وشريحتان من التورمالين (مستقطب ومحلل) يدوّرهما الطالب، والعين ترى شدة الضوء النافذ"></canvas>
  <button class="tipbtn" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
  <div class="tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
  <div class="parts" id="parts" role="group" aria-label="إدخال الشرائح وإظهار أجزاء المحاكاة">
    <button data-p="pol" aria-pressed="true"><i></i><span class="l">المستقطب</span><span class="s">مستقطب</span></button>
    <button data-p="ana" aria-pressed="true"><i></i><span class="l">المحلل</span><span class="s">محلل</span></button>
    <button data-p="front" aria-pressed="true"><i></i><span class="l">المنظر الأمامي</span><span class="s">أمامي</span></button>
    <button data-p="lab" aria-pressed="true"><i></i><span class="l">التسميات</span><span class="s">تسميات</span></button>
  </div>
  <button class="fs" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<script>
(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
/* ---------- the bench: light travels along +x from the source to the eye ---------- */
const XS=0,XP=5.0,XA=10.2,XE=15.0,R=1.35,PT=0.09,FLOOR=-2.3,E0=0.95;
const K=2*Math.PI/1.5,OM=2*Math.PI*0.55;
const S={ap:0,apT:0,aa:Math.PI/3,aaT:Math.PI/3,inP:true,inA:true,showFront:true,showLab:true};
const ins={P:1,A:1};
const touched={pol:false,ana:false,orbit:false};
let W=0,H=0,DPR=1,narrow=null,view={F:1,ox:0,oy:0},time=0,drag=null,hover=null;
const defYaw=()=>(narrow?74:32)*Math.PI/180,defPitch=()=>(narrow?34:15)*Math.PI/180;
const cam={yaw:32*Math.PI/180,pitch:15*Math.PI/180,dist:21,T:[7.2,0,0]};
const col={};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FS=()=>narrow?1.12:1;
const F=(w,s,mono)=>w+' '+(s*FS()).toFixed(1)+'px '+(mono?'ui-monospace, Menlo, Consolas, monospace':'system-ui, "Segoe UI", Tahoma, sans-serif');
function readColors(){const cs=getComputedStyle(document.documentElement);['deep','navy','glow','ink','muted','accent'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
const wrapA=a=>{a=((a+Math.PI/2)%Math.PI+Math.PI)%Math.PI-Math.PI/2;return a;};   // axis angle in (-90°,90°]
const deg=a=>Math.round(a*180/Math.PI);

/* ---------- optics ---------- */
function optics(){const P=S.inP&&ins.P>0.5,A=S.inA&&ins.A>0.5;let I1=1,pol1=null;
  if(P){I1=0.5;pol1=S.ap;}
  let I2=I1,pol2=pol1,th=null;
  if(A){if(pol1===null){I2=I1*0.5;}else{th=wrapA(S.aa-S.ap);I2=I1*Math.cos(th)**2;}pol2=S.aa;}
  return{P,A,I1,I2,pol1,pol2,th};}

/* ---------- camera (360° orbit) ---------- */
let B={};
function camBasis(){cam.dist=narrow?32:21;const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const dir=[-sy*cp,sp,cy*cp],pos=[cam.T[0]+dir[0]*cam.dist,cam.T[1]+dir[1]*cam.dist,cam.T[2]+dir[2]*cam.dist],f=[-dir[0],-dir[1],-dir[2]];
  const r=[-f[2],0,f[0]],rl=Math.hypot(r[0],r[2])||1;r[0]/=rl;r[2]/=rl;const u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]];B={pos,f,r,u};}
function P(x,y,z){const d0=x-B.pos[0],d1=y-B.pos[1],d2=z-B.pos[2],dep=Math.max(0.3,d0*B.f[0]+d1*B.f[1]+d2*B.f[2]);
  return{x:view.ox+view.F*(d0*B.r[0]+d1*B.r[1]+d2*B.r[2])/dep,y:view.oy-view.F*(d0*B.u[0]+d1*B.u[1]+d2*B.u[2])/dep,d:dep};}
function frontRect(){const sz=narrow?Math.min(W*0.44,190):Math.min(250,H*0.36);return{x:14,y:H-sz-14,w:sz,h:sz};}
function fit(){const sv={yaw:cam.yaw,pitch:cam.pitch};cam.yaw=defYaw();cam.pitch=defPitch();camBasis();view={F:1,ox:0,oy:0};
  const pts=[[-1.6,1.2,0],[-1.6,FLOOR,1.2],[-1.6,-0.5,-0.5],[XP,R+0.9,-R],[XP,FLOOR,R],[XA,R+0.9,R],[XA,FLOOR,-R],[XE+0.6,1.2,0],[XE+0.6,FLOOR,1.2],[XS,FLOOR,-1.5],[XE,FLOOR,-1.5]];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;pts.forEach(p=>{const q=P(...p);x0=Math.min(x0,q.x);x1=Math.max(x1,q.x);y0=Math.min(y0,q.y);y1=Math.max(y1,q.y);});
  const top=62,bot=narrow?(S.showFront?frontRect().h+24:20):24,m=16,aw=W-2*m,ah=H-top-bot;
  const F0=Math.min(aw/(x1-x0),ah/(y1-y0));view={F:F0,ox:m+aw/2-F0*(x0+x1)/2,oy:top+ah/2-F0*(y0+y1)/2};cam.yaw=sv.yaw;cam.pitch=sv.pitch;}
function layout(){const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;W=nw;H=nh;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);const nn=W<H*0.95;if(nn!==narrow){narrow=nn;cam.yaw=defYaw();cam.pitch=defPitch();}fit();}

/* ---------- drawing helpers ---------- */
function txt(s,x,y,o={}){ctx.font=o.font||F(600,13);ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function poly(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();}
function pulseRing(x,y,r,color,ph){const pu=0.5+0.5*Math.sin(time*5+(ph||0));ctx.beginPath();ctx.arc(x,y,r+pu*5,0,7);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function vec3(a,b,color,lw,both){const p=P(...a),q=P(...b),l=Math.hypot(q.x-p.x,q.y-p.y);if(l<2)return;ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
  const ang=Math.atan2(q.y-p.y,q.x-p.x),hs=Math.min(lw*3.2,l*0.45);arrowHead(q.x,q.y,ang,hs,color);if(both)arrowHead(p.x,p.y,ang+Math.PI,hs,color);}
function tag(s,x,y,c){ctx.font=F(600,12.5);const w=ctx.measureText(s).width+18,h=24*FS();rr(x-w/2,y-h/2,w,h,h/2);ctx.fillStyle='rgba(8,20,41,.86)';ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=1.3;ctx.stroke();txt(s,x,y+0.5,{color:c,font:F(600,12.5)});}
function drawBg(){ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,Math.max(W,H)*0.75);g.addColorStop(0,col.glow);g.addColorStop(0.55,col.navy);g.addColorStop(1,col.deep);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function drawFloor(){const c=[P(-2,FLOOR,-2.6),P(XE+1.6,FLOOR,-2.6),P(XE+1.6,FLOOR,2.6),P(-2,FLOOR,2.6)];poly(c);ctx.fillStyle='rgba(127,170,230,.09)';ctx.fill();
  ctx.strokeStyle='rgba(160,195,240,.10)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=-2;x<=XE+1.6;x+=1){const a=P(x,FLOOR,-2.6),b=P(x,FLOOR,2.6);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);}
  for(let z=-2;z<=2;z+=1){const a=P(-2,FLOOR,z),b=P(XE+1.6,FLOOR,z);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);}ctx.stroke();
  // optical rail
  const r0=P(-1,FLOOR+0.02,0),r1=P(XE,FLOOR+0.02,0);ctx.strokeStyle='rgba(150,165,190,.5)';ctx.lineWidth=Math.max(3,view.F*0.12/cam.dist);ctx.beginPath();ctx.moveTo(r0.x,r0.y);ctx.lineTo(r1.x,r1.y);ctx.stroke();}

/* ---------- light beam and its electric field ---------- */
function hull(pts){pts=pts.slice().sort((a,b)=>a.x-b.x||a.y-b.y);const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x),lo=[],up=[];
  for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}up.pop();lo.pop();return lo.concat(up);}
function ring(x,r,n=28,cy=0,cz=0){const a=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push(P(x,cy+r*Math.cos(t),cz+r*Math.sin(t)));}return a;}
/* shaded cylinder along x (light from above) */
function cyl(x0,x1,r,c1,c2,c3,cy=0){const A=ring(x0,r,28,cy),Bv=ring(x1,r,28,cy),h=hull(A.concat(Bv));poly(h);
  const a=P(x0,cy,0),b=P(x1,cy,0);let nx=-(b.y-a.y),ny=b.x-a.x;const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;if(ny>0){nx=-nx;ny=-ny;}
  const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},rr=Math.max(4,...h.map(p=>Math.abs((p.x-m.x)*nx+(p.y-m.y)*ny)));
  const g=ctx.createLinearGradient(m.x+nx*rr,m.y+ny*rr,m.x-nx*rr,m.y-ny*rr);g.addColorStop(0,c1);g.addColorStop(0.42,c2);g.addColorStop(1,c3);ctx.fillStyle=g;ctx.fill();
  return{A,B:Bv};}
const BR=0.42,LAM=2*Math.PI/K;
const MOTES=[];for(let i=0;i<70;i++)MOTES.push({u:Math.random(),r:Math.sqrt(Math.random())*BR*0.95,a:Math.random()*6.283,s:0.5+Math.random(),tw:Math.random()*6.283});
/* soft volumetric beam: a glowing tube whose brightness follows the intensity */
function beam(x0,x1,I){if(I<0.004)return;ctx.save();ctx.globalCompositeOperation='lighter';
  const h=hull(ring(x0,BR,24).concat(ring(x1,BR,24)));poly(h);ctx.fillStyle=`rgba(255,236,190,${0.10*I})`;ctx.fill();
  const h2=hull(ring(x0,BR*0.45,18).concat(ring(x1,BR*0.45,18)));poly(h2);ctx.fillStyle=`rgba(255,246,222,${0.16*I})`;ctx.fill();
  // dust in the beam makes the light visible
  const len=x1-x0;MOTES.forEach(m=>{const u=(m.u+time*0.012*m.s)%1,x=XS+u*(XE-XS);if(x<x0||x>x1)return;const q=P(x,m.r*Math.cos(m.a+time*0.2),m.r*Math.sin(m.a+time*0.2)),tw=0.4+0.6*Math.abs(Math.sin(time*2+m.tw));
    ctx.beginPath();ctx.arc(q.x,q.y,Math.max(0.8,view.F*0.018/q.d),0,7);ctx.fillStyle=`rgba(255,250,230,${0.8*I*tw})`;ctx.fill();});
  ctx.restore();}
function rndAng(j){return 1.3*j+2.2*Math.sin(time*1.9+j*0.77)+1.4*Math.sin(time*3.1+j*1.91);}
/* unpolarized: at every slice of the beam the field points in many random directions; polarized: one direction only */
function dbl(x,a,e,color,lw){const p=[x,-e*Math.cos(a),-e*Math.sin(a)],q=[x,e*Math.cos(a),e*Math.sin(a)];vec3(p,q,color,lw,true);}
/* like figures 17 and 18: planes perpendicular to the beam that travel with the light.
   unpolarized: a star of double arrows (E in all directions); polarized: one double arrow along the axis */
const PLD=1.25,PLV=0.9;
function fieldRegion(x0,x1,pol,amp,color,rgb){if(amp<0.02)return;const L=x1-x0,n=Math.max(1,Math.floor(L/PLD));
  for(let k=0;k<n;k++){const u=((k*PLD+PLV*time)%(n*PLD))/(n*PLD),x=x0+u*L,fade=Math.min(1,u*6,(1-u)*6);if(fade<=0.02)continue;
    ctx.save();ctx.globalAlpha=fade;
    const disc=ring(x,0.95,32);poly(disc);ctx.fillStyle=`rgba(${rgb},.07)`;ctx.fill();ctx.strokeStyle=`rgba(${rgb},.28)`;ctx.lineWidth=1;ctx.stroke();
    const c=P(x,0,0);ctx.beginPath();ctx.arc(c.x,c.y,2.5,0,7);ctx.fillStyle=color;ctx.fill();
    if(pol===null){const off=0.35*Math.sin(time*0.7+k*1.9);for(let m=0;m<4;m++)dbl(x,off+m*Math.PI/4,amp*0.82,color,2);}
    else dbl(x,pol,amp*0.9,color,2.6);
    ctx.restore();}}
/* thick propagation arrow (direction of travel) */
function propArrow(xm,color){vec3([xm-0.55,0,0],[xm+0.55,0,0],color,5);}

/* ---------- source, plates, eye ---------- */
function drawSource(){const cx=B.pos[0],front=cx>0,back=cx<-1.5;
  // stand and base
  const s0=P(-0.9,-0.38,0),s1=P(-0.9,FLOOR,0);ctx.strokeStyle='#5f6b80';ctx.lineWidth=Math.max(3,view.F*0.1/s0.d);ctx.beginPath();ctx.moveTo(s0.x,s0.y);ctx.lineTo(s1.x,s1.y);ctx.stroke();
  const fb=P(-0.9,FLOOR,0);ctx.beginPath();ctx.ellipse(fb.x,fb.y,Math.max(8,view.F*0.5/fb.d),Math.max(3,view.F*0.18/fb.d),0,0,7);ctx.fillStyle='#4a5468';ctx.fill();
  // power cable
  const c0=P(-1.5,-0.15,0),c1=P(-2.6,-0.6,0.3),c2=P(-2.4,FLOOR,0.9),c3=P(-1.9,FLOOR,1.4);ctx.strokeStyle='#14181f';ctx.lineWidth=Math.max(2,view.F*0.06/c0.d);ctx.beginPath();ctx.moveTo(c0.x,c0.y);ctx.bezierCurveTo(c1.x,c1.y,c2.x,c2.y,c3.x,c3.y);ctx.stroke();

  const body=cyl(-1.5,-0.28,0.4,'#7a879f','#343e54','#141a26');

  const tryit=`<p class="note">جرّب: اسحب المقبض الأصفر لتدوير أي شريحة، أو انقر على الشريحة لتدويرها 15°. أخرج إحدى الشريحتين أو أدخلها من الأزرار في الأعلى، واسحب الخلفية لتدور حول المشهد 360°.</p>`;
  const why=`<p class="note">بلورة التورمالين تترتب جزيئاتها بشكل سلاسل طويلة، فتسمح بمرور الضوء الذي يهتز مجاله الكهربائي عمودياً على السلاسل (على امتداد محور النفاذ) وتمتص الباقي.</p>`;
  if(!o.P&&!o.A)return{t:'ضوء غير مستقطب',b:`<p>الضوء الخارج من المصدر <b>غير مستقطب</b>: موجات مستعرضة يهتز مجالها الكهربائي في <b>جميع الاتجاهات</b> وبشكل عشوائي، في مستويات متوازية عمودية على خط انتشار الموجة، كما في الشكل (18-b).</p><p>أدخل شريحة المستقطب من الزر في الأعلى ولاحظ ما يحدث.</p>${nums}${tryit}`};
  if(o.P!==o.A){const nm=o.P?'المستقطب':'المحلل';return{t:'لماذا لا تتغير شدة الضوء عند تدوير شريحة واحدة؟',b:`<p>الضوء الساقط على ${nm} غير مستقطب: مجاله يهتز في جميع الاتجاهات بالتساوي، فمهما دوّرت الشريحة يكون في الضوء مقدار متساوٍ من الاهتزاز باتجاه محور نفاذها.</p><p>لذلك تمرّ دائماً <b>نصف شدة الضوء</b>، لكن الضوء النافذ يصبح <b>مستقطباً</b>: مجاله الكهربائي يهتز باتجاه واحد هو محور النفاذ، كما في الشكل (18-a).</p>${why}<p>أدخل الشريحة الثانية لترى أثر الزاوية بين الشريحتين.</p>${nums}${tryit}`};}
  const base=`<p>المستقطب يجعل الضوء مستقطباً بسعة <b class="m">E₀</b> باتجاه محوره. والمحلل لا يمرّر إلا مركّبة هذا المجال باتجاه محوره، وهي <b class="m">E₀ cosθ</b>، حيث θ الزاوية بين محوري الشريحتين (الشكل 17).</p><p style="text-align:center"><b class="m">E = E₀ cosθ</b><br><b class="m">I = I₀ cos²θ</b></p>`;
  if(th<=3)return{t:'المحوران متوازيان: أقصى إضاءة',b:`<p>عندما يكون محور المحلل موازياً لمحور المستقطب (θ = 0)، يمرّ الضوء المستقطب كله، فتكون الإضاءة أشد ما يمكن (I = I₀).</p>${base}${nums}${tryit}`};
  if(th>=87)return{t:'المحوران متعامدان: ظلام تام',b:`<p>عندما يكون محور المحلل عمودياً على محور المستقطب (θ = 90°)، لا يبقى للمجال الكهربائي أي مركّبة باتجاه محور المحلل (cos 90° = 0)، فيُمتص الضوء كله ولا يصل شيء إلى العين.</p>${base}${nums}${tryit}`};
  return{t:'لماذا تتغير شدة الإضاءة عند تدوير الشريحة الثانية؟',b:`<p>للشريحتين التركيب نفسه، لكن الضوء الساقط على المحلل <b>مستقطب</b> باتجاه واحد. فعند تدوير المحلل تتغير الزاوية θ، ويتغير معها المقدار الذي يمرّ من المجال.</p><p>عند θ = ${th}° يمرّ <b class="m">cos ${th}° = ${Math.cos(th*Math.PI/180).toFixed(2)}</b> من سعة المجال، أي <b class="m">${(o.I2/o.I1).toFixed(2)}</b> من شدة الضوء المستقطب.</p>${base}${nums}${tryit}`};
};

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;if(!W)layout();if(W){update(dt);draw();}requestAnimationFrame(frame);}
readColors();layout();
document.querySelectorAll('#parts button').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.p;
  if(n==='pol')S.inP=!S.inP;else if(n==='ana')S.inA=!S.inA;else if(n==='front')S.showFront=!S.showFront;else S.showLab=!S.showLab;
  b.setAttribute('aria-pressed',{pol:S.inP,ana:S.inA,front:S.showFront,lab:S.showLab}[n]);fit();}));
new ResizeObserver(()=>layout()).observe(cv);
requestAnimationFrame(frame);
})();

(function(){const b=document.getElementById('fsBtn'),ico=document.getElementById('fsIco'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const t=document.createElement('div');t.className='toast';t.hidden=true;t.textContent='ملء الشاشة غير متاح هنا. افتح الملف أو الرابط بالمتصفح';document.querySelector('.stage').appendChild(t);
  let tm=0;const toast=()=>{t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>t.hidden=true,3200);};
  const sync=()=>{ico.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');b.setAttribute('aria-label',isFs()?'الخروج من ملء الشاشة':'ملء الشاشة');};
  b.addEventListener('click',()=>{
    if(isFs()){try{exit.call(document);}catch(e){}return;}
    if(!req||document.fullscreenEnabled===false){toast();return;}
    try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(toast);setTimeout(()=>{if(!isFs())toast();},700);}catch(e){toast();}});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);})();

(function(){const b=document.getElementById('tipBtn'),p=document.getElementById('tipPanel'),t=document.getElementById('tipTitle'),body=document.getElementById('tipBody');
  let iv=0,last='';
  const fill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===last)return;last=h;t.textContent=r.t;body.innerHTML=r.b;};
  const open=v=>{p.hidden=!v;b.setAttribute('aria-expanded',v);b.classList.toggle('on',v);clearInterval(iv);if(v){last='';fill();iv=setInterval(fill,400);}};
  b.addEventListener('click',()=>open(p.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>open(false));})();
</script>
</body>
