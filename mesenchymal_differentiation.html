<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>تمايز الخلية الحشوية المتوسطة</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#eef6fb;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #head{position:fixed;top:0;left:0;right:0;height:56px;z-index:8;display:flex;align-items:center;justify-content:center;background:#1f3a52;box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:none}
  #title{color:#fff;font-weight:bold;font-size:clamp(14px,3.2vw,23px);transition:opacity .35s;white-space:nowrap}
  #views{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;z-index:8}
  .nav{width:60px;height:60px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:26px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);padding:0;line-height:1}
  .nav:active{background:#d9ebf7}
  #dots{display:flex;gap:12px;align-items:center}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  #stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 45%,#f6fcff 0%,#cfe8f3 100%)}
  #stage.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;width:1200px;height:800px;transform-origin:0 0}
  #cell{position:absolute;left:0;top:0;width:1200px;height:800px;pointer-events:none;-webkit-user-drag:none}
  #lab{position:absolute;left:0;top:0;width:1200px;height:800px;overflow:visible;pointer-events:none}
  #lab text{font:bold 30px Tahoma,"Segoe UI",Arial,sans-serif;fill:#000;text-anchor:middle;dominant-baseline:central}
  #lab line{stroke:#000;stroke-width:1.3}
  #lab circle{fill:#000}
  #lab g{transition:opacity .6s}
  .side{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:7}
  .btn{width:50px;height:50px;border-radius:50%;border:2px solid #222;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.16);padding:0;transition:transform .15s,opacity .2s}
  .btn:active{transform:scale(.92)}
  .btn svg{width:24px;height:24px;fill:none;stroke:#222;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  .btn.off{opacity:.4}
  @media (max-width:700px){.side{top:68px;transform:none}.btn{width:42px;height:42px}.btn svg{width:20px;height:20px}}
</style>

  const pa=sa.p,pb=sb.p,x=lerp(pa[0],pb[0],e),y=lerp(pa[1],pb[1],e);
  const ka=lerp(1,sb.w/sa.w,e),kb=lerp(sa.w/sb.w,1,e);
  drawSprite(ida,x,y,sa.w*ka,sa.h*lerp(1,sb.h/sa.h,e),(1-mix)*alpha);drawSprite(idb,x,y,sb.w*kb,sb.h*lerp(sa.h/sb.h,1,e),mix*alpha);}

/* ---------- the two independent paths ---------- */
const T_LAB=1.4,T_GO=4.6;
const PATHS=[
 {title:'تمايز الخلية الحشوية المتوسطة - إلى الأرومة الليفية',end:T_GO+7.5},
 {title:'تمايز الخلية الحشوية المتوسطة - إلى الخلية الدهنية',end:T_GO+5.6+.5+6.2}];
let cur=0,tStart=0,tNow=0;
function frame(path,t,time){
  const intro=sm(t/1.0),scl=lerp(.94,1,intro);
  if(path===0){
    const e=ease(clamp((t-T_GO)/7)),mix=sm((e-.18)/.64);
    drawBody('M','F',e,mix,intro,time,scl);
    drawGlide('Mn',spr('M'),'Fn',spr('F'),e,mix,intro);
  }else{
    const e1=ease(clamp((t-T_GO)/5.4)),t2=t-T_GO-5.9,e2=ease(clamp(t2/6)),m1=sm((e1-.18)/.64),m2=sm((e2-.18)/.64);
    if(t2<0){drawBody('M','Am',e1,m1,intro,time,scl);
      drawGlide('Mn',spr('M'),'Amn',spr('Am'),e1,m1,intro);
      KF.Am.drops.forEach((d,i)=>{const a=sm((e1-.5-i*.07)/.3),s=spr('Am',d);drawSprite('Amd'+i,s.p[0],s.p[1],s.w*(.3+.7*a),s.h*(.3+.7*a),a*.98);});}
    else{drawBody('Am','Af',e2,m2,1,time,1);
      drawGlide('Amn',spr('Am'),'Afn',spr('Af'),e2,m2,1);
      const big=spr('Af',KF.Af.big),bp=big.p;
      drawSprite('Afbig',bp[0],bp[1],big.w*lerp(.35,1,sm(e2*1.05)),big.h*lerp(.35,1,sm(e2*1.05)),sm((e2-.42)/.5));
      KF.Am.drops.forEach((d,i)=>{const s=spr('Am',d),q=ease(clamp((e2-i*.05)/.8)),k=lerp(1,big.w/s.w*.9,q),a=1-sm((q-.72)/.28);
        drawSprite('Amd'+i,lerp(s.p[0],bp[0],q),lerp(s.p[1],bp[1],q),s.w*k,s.h*k,a);});}
  }
}
function render(time){
  gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  frame(cur,(time-tStart)/1000,time/1000);
}

/* ---------- labels ---------- */
const lab=document.getElementById('lab'),SVGNS='http://www.w3.org/2000/svg';let labelsOn=true,LB=[];
function LBL_M(){const n=spr('M').p;return[{t:'النواة',tx:420,ty:150,p:n},{t:'البروزات السايتوبلازمية',tx:985,ty:58,p:wp('M',KF.M.cx+.78*581.2*Math.cos(5.655),KF.M.cy+.78*581.2*Math.sin(5.655))}];}
function LBL_F(){const n=spr('F').p;return[{t:'النواة',tx:400,ty:215,p:n},{t:'السايتوبلازم',tx:240,ty:600,p:wp('F',200,128)},{t:'الشكل المغزلي للخلية',tx:880,ty:610,p:wp('F',420,150)}];}
function LBL_A(){const n=spr('Af').p,b=spr('Af',KF.Af.big).p;return[{t:'النواة',tx:930,ty:170,p:n},{t:'السايتوبلازم',tx:960,ty:560,p:wp('Af',735,325)},{t:'القطرة الدهنية الكبيرة',tx:320,ty:130,p:b}];}
function buildLabels(list){lab.innerHTML='';LB=list.map(L=>{const g=document.createElementNS(SVGNS,'g');g.setAttribute('opacity',0);
  const ln=document.createElementNS(SVGNS,'line'),dt=document.createElementNS(SVGNS,'circle'),tx=document.createElementNS(SVGNS,'text');dt.setAttribute('r',3.2);tx.textContent=L.t;tx.setAttribute('x',L.tx);tx.setAttribute('y',L.ty);
  g.append(ln,dt,tx);lab.appendChild(g);return{g,ln,dt,tx,L,ready:false};});layoutLabels();}
function layoutLabels(){LB.forEach(o=>{const L=o.L;o.tx.setAttribute('x',L.tx);o.tx.setAttribute('y',L.ty);const b=o.tx.getBBox(),cx=b.x+b.width/2,cy=b.y+b.height/2,dx=L.p[0]-cx,dy=L.p[1]-cy;
  const s=Math.min((b.width/2+8)/Math.abs(dx||1e-6),(b.height/2+6)/Math.abs(dy||1e-6));
  o.ln.setAttribute('x1',cx+dx*s);o.ln.setAttribute('y1',cy+dy*s);o.ln.setAttribute('x2',L.p[0]);o.ln.setAttribute('y2',L.p[1]);o.dt.setAttribute('cx',L.p[0]);o.dt.setAttribute('cy',L.p[1]);});}
let labState='',labList=null;
function setLabels(state){if(state===labState)return;labState=state;
  if(!state){LB.forEach(o=>o.g.setAttribute('opacity',0));return;}
  const list=state==='M'?LBL_M():state==='F'?LBL_F():LBL_A();buildLabels(list);
  LB.forEach((o,i)=>setTimeout(()=>{if(labState===state)o.g.setAttribute('opacity',labelsOn?1:0);},60+i*350));}
function labelPlan(path,t){
  const e1=path===0?T_GO+7.5:T_GO+5.9+6+0.5;
  if(t<T_LAB||(t>T_GO-.3&&t<e1))return '';
  return t<T_GO-.3?'M':(path===0?'F':'A');}

/* ---------- loop / navigation ---------- */
let raf=0;
function loop(now){tNow=now;render(now);setLabels(labelPlan(cur,(now-tStart)/1000));raf=requestAnimationFrame(loop);}
function begin(){if(!gl){document.getElementById('title').textContent='المتصفح لا يدعم WebGL';return;}initGL();tStart=performance.now();setTitle();requestAnimationFrame(loop);}
function setTitle(){const tt=document.getElementById('title');tt.style.opacity=0;setTimeout(()=>{tt.textContent=PATHS[cur].title;tt.style.opacity=1;},300);}
function go(i,force){i=clamp(i,0,1);if(i===cur&&!force)return;cur=i;document.getElementById('vA').classList.toggle('on',i===0);document.getElementById('vB').classList.toggle('on',i===1);
  tStart=performance.now();labState='';setLabels('');setTitle();}
document.getElementById('vA').onclick=()=>go(0,cur===0);
document.getElementById('vB').onclick=()=>go(1,cur===1);
document.getElementById('next').onclick=()=>go(cur===0?1:0,true);
document.getElementById('prev').onclick=()=>go(cur===1?0:1,true);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')document.getElementById('next').click();if(e.key==='ArrowRight')document.getElementById('prev').click();});
const lb=document.getElementById('lbl');
lb.onclick=()=>{labelsOn=!labelsOn;lb.classList.toggle('off',!labelsOn);LB.forEach(o=>o.g.setAttribute('opacity',labelsOn&&labState?1:0));};

/* ---------- view: fit, zoom, pan, pinch ---------- */
const world=document.getElementById('world'),stage=document.getElementById('stage');
let fit=1,zoom=1,px=0,py=0;
const headH=()=>document.getElementById('head').offsetHeight+6,footH=()=>document.getElementById('views').offsetHeight+28;
function apply(){world.style.transform=`translate(${px.toFixed(1)}px,${py.toFixed(1)}px) scale(${(fit*zoom).toFixed(4)})`;}
function fitView(){const w=stage.clientWidth,h=stage.clientHeight-headH()-footH();fit=Math.min(w/1200,h/800);zoom=1;px=(w-1200*fit)/2;py=headH()+(h-800*fit)/2;apply();
  const fs=Math.max(30,15/fit).toFixed(1)+'px';lab.querySelectorAll('text').forEach(t=>t.style.fontSize=fs);lab.style.setProperty('--fs',fs);document.getElementById('lab').dataset.fs=fs;if(LB.length)layoutLabels();}
function zoomAt(k,cx,cy){const nz=clamp(zoom*k,.5,8);k=nz/zoom;px=cx-(cx-px)*k;py=cy-(cy-py)*k;zoom=nz;apply();}
const ctr=()=>[stage.clientWidth/2,(stage.clientHeight+headH()-footH())/2];
document.getElementById('zin').onclick=()=>zoomAt(1.3,...ctr());
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,...ctr());
const fsIco=document.getElementById('fsIco');let pseudo=false;
const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement||pseudo);
const setFsIcon=()=>{fsIco.innerHTML=isFs()?'<path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/>':'<path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/>';
  document.getElementById('fs').title=isFs()?'الخروج من ملء الشاشة':'ملء الشاشة';};
function enterFs(){const e=document.documentElement,r=e.requestFullscreen||e.webkitRequestFullscreen||e.webkitRequestFullScreen||e.msRequestFullscreen;
  const fallback=()=>{pseudo=true;document.body.classList.add('pseudo');window.scrollTo(0,1);setFsIcon();setTimeout(fitView,300);};
  if(!r||!(document.fullscreenEnabled||document.webkitFullscreenEnabled)){fallback();return;}
  try{const pr=r.call(e,{navigationUI:'hide'});if(pr&&pr.catch)pr.catch(fallback);}catch(err){fallback();}}
function exitFs(){if(pseudo){pseudo=false;document.body.classList.remove('pseudo');setFsIcon();fitView();return;}
  const d=document,x=d.exitFullscreen||d.webkitExitFullscreen||d.webkitCancelFullScreen||d.msExitFullscreen;if(x)x.call(d);}
document.getElementById('fs').onclick=()=>isFs()?exitFs():enterFs();
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{setFsIcon();setTimeout(fitView,60);}));
setFsIcon();
const P=new Map(),loc=e=>[e.clientX,e.clientY];
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);P.set(e.pointerId,loc(e));stage.classList.add('drag');});
stage.addEventListener('pointermove',e=>{
  if(!P.has(e.pointerId))return;const prev=new Map(P),c=loc(e);P.set(e.pointerId,c);
  if(P.size===1){const o=prev.get(e.pointerId);px+=c[0]-o[0];py+=c[1]-o[1];apply();}
  else{const id=[...P.keys()].slice(0,2),a0=prev.get(id[0]),b0=prev.get(id[1]),a1=P.get(id[0]),b1=P.get(id[1]);
    const d0=Math.hypot(a0[0]-b0[0],a0[1]-b0[1])||1,d1=Math.hypot(a1[0]-b1[0],a1[1]-b1[1]);
    px+=(a1[0]+b1[0]-a0[0]-b0[0])/2;py+=(a1[1]+b1[1]-a0[1]-b0[1])/2;zoomAt(d1/d0,(a1[0]+b1[0])/2,(a1[1]+b1[1])/2);}
});
const up=e=>{P.delete(e.pointerId);if(!P.size)stage.classList.remove('drag');};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY);},{passive:false});
stage.addEventListener('dblclick',fitView);
addEventListener('resize',fitView);addEventListener('orientationchange',()=>setTimeout(fitView,300));
fitView();
window.__dbg={set:(p,t)=>{cur=p;tStart=performance.now()-t*1000;labState='';}};
})();
</script>
