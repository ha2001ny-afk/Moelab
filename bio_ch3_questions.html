<style>

</style></head><body>

       '١- لا تحوي عامل الخصوبة .<br>٢- لا تحوي على هذه الزوائد .<br>٣- تسلك كخلية أنثوية مستلمة .<br>٤- كذلك تشترك في تكوين سلالة جديدة .<br>٥- القطعة الكروموسومية المنتقلة إليها لا تزيد حجم الكروموسوم الموجود أصلاً لأنها تحل محل جزء مساوٍ لها .']},
   {k:'cols',t:'قارن : الأركيكونيا والأنثريديا',h:'قارن بين الأركيكونيا والأنثريديا :',q:'',heads:['الأركيكونيا','الأنثريديا'],
    a:['١- حافظة مشيجية أنثوية .<br>٢- تحمل أمشاجاً أنثوية ( بيوض ) .<br>٣- تقع في الطرف البعيد عن أشباه الجذور .<br>٤- أحادية المجموعة الكروموسومية ( س ) .<br>٥- يحصل بداخلها الإخصاب وتتكون الزيجة ويتكون الطور البوغي .',
       '١- حافظة مشيجية ذكرية .<br>٢- تحمل أمشاجاً ذكرية .<br>٣- تقع في الطرف القريب من أشباه الجذور .<br>٤- كذلك أحادية المجموعة الكروموسومية ( س ) .<br>٥- لا يحصل بداخلها ذلك .']},
   {k:'cols',t:'قارن : الكأسية والتويجية',h:'قارن بين الأوراق الكأسية والأوراق التويجية :',q:'',heads:['الأوراق الكأسية','الأوراق التويجية'],
    a:['١- يطلق على مجموعها الكأس .<br>٢- وظيفتها حماية برعم الزهرة قبل انفتاحه .<br>٣- تكون في الغالب خضراء اللون لكنها قد تكون ملونة أحياناً .<br>٤- يختلف عددها حسب نوع النبات .<br>٥- ليس لها دور في التكاثر الجنسي .',
       '١- يطلق على مجموعها التويج .<br>٢- وظيفتها جذب الحشرات لأجل حصول التلقيح الخلطي .<br>٣- تكون متباينة في حجمها وشكلها ولونها باختلاف النبات .<br>٤- عددها مساوٍ لعدد الأوراق الكأسية كما في السوسن أو من مضاعفاته كما في الروز .<br>٥- كذلك ليس لها دور في التكاثر الجنسي .']},
   {k:'cols',t:'قارن : التلقيح الخلطي والذاتي',h:'قارن بين التلقيح الخلطي والتلقيح الذاتي :',q:'',heads:['التلقيح الخلطي','التلقيح الذاتي'],
    a:['١- يتم بانتقال حبوب اللقاح من متك زهرة إلى ميسم زهرة أخرى لنبات آخر من نفس النوع وربما أنواع أخرى تنتمي لنفس الجنس .<br>٢- النباتات الناتجة منه تكون بذورها وثمارها أكبر حجماً وأكثر عدداً .<br>٣- أكثر أهمية من التلقيح الذاتي .<br>٤- مثاله النخيل .',
       '١- يتم بانتقال حبوب اللقاح من متك زهرة إلى ميسم نفس الزهرة أو زهرة أخرى لنفس النبات .<br>٢- النباتات الناتجة مشابهة لآبائها .<br>٣- أقل أهمية .<br>٤- مثاله الحنطة والشعير والرز والقطن والفاصوليا وغيرها .']},
   {k:'cols',t:'قارن : الثمار المركبة والمتجمعة',h:'قارن بين الثمار المركبة والثمار المتجمعة :',q:'',heads:['الثمار المركبة','الثمار المتجمعة'],
    a:['١- تتكون من عدة أزهار متجمعة .<br>٢- تنشأ من كل زهرة ثمرة .<br>٣- تبقى مرتبطة مع بعضها عند النضج .<br>٤- مثالها الأناناس .',
       '١- تتكون من كربلات عديدة منفصلة .<br>٢- تنشأ من زهرة واحدة ترتبط الثمرات معاً بتخت واحد .<br>٣- ترتبط بتخت واحد لكنها منفصلة .<br>٤- مثالها العليق ( التوت ) الأسود .']},
   {k:'cols',t:'قارن : البيوضة والولودة',h:'قارن بين الحشرات البيوضة والحشرات البيوضة الولودة :',q:'',heads:['الحشرات البيوضة','الحشرات البيوضة الولودة'],
    a:['١- تضع بيوضاً مخصبة .<br>٢- تضع بيوضها في حفر خاصة تحفرها بواسطة آلة وضع البيض أو تلصقها على أوراق النباتات أو تضعها في حفر تحفرها في سيقان نباتات معينة .<br>٣- تفقس البيوض خارج جسم الحشرة .<br>٤- مثالها الصرصر والجراد .',
       '١- تضع يرقات أو حوريات .<br>٢- تحتفظ بالبيوض المخصبة داخل جسمها وتحديداً في القناة المبيضية المشتركة حتى ينمو الجنين ويتكامل .<br>٣- تفقس البيوض داخل المهبل ثم تطرح خارجاً .<br>٤- مثالها حشرة المن وذباب الكلب .']},
   {k:'cols',t:'قارن : الاقتران والإخصاب الذاتي',h:'قارن بين طريقة الاقتران وطريقة الإخصاب الذاتي في البراميسيوم :',q:'',heads:['طريقة الاقتران','طريقة الإخصاب الذاتي'],
    a:['١- يتكون جسر بروتوبلازمي بين البراميسيومين المقترنين .<br>٢- يحصل تبادل للأنوية .<br>٣- تكون النواة المندمجة متباينة العوامل الوراثية .<br>٤- تعطي براميسيومات هجائن في الطرز الوراثية .',
       '١- تشبه عملية الاقتران .<br>٢- لا يحصل تبادل للأنوية .<br>٣- تكون النواة المندمجة متماثلة العوامل الوراثية .<br>٤- تعطي براميسيومات متماثلة ( نقية ) دائماً في الطرز الوراثية .']}
  ]},

 {name:'السؤال الخامس',short:'س٥',type:'why',time:45,
  head:'عرّف المصطلحات العلمية التالية :',
  sub:'التعاريف',
  items:[
   ['الإخصاب المزدوج','عملية تكاثرية جنسية تعتبر ظاهرة مميزة للنباتات الزهرية ، وتتم باتحاد إحدى الخليتين الذكريتين مع خلية البيضة لتكوين بيضة مخصبة ( ٢س ) ، واتحاد الخلية الذكرية الثانية مع النواتين القطبيتين لتكوين نواة السويداء ( ٣س ) .'],
   ['القصرة','غلاف البذرة الواقي الذي ينشأ من غلاف أو غلافي البويض .'],
   ['الثمار الكاذبة','الثمار الناتجة من نمو أجزاء غير المبيض في الزهرة ، حيث تنمو من تضخم التخت كما في التفاح أو تضخم الأغلفة الزهرية كما في التوت .'],
   ['الثمار المضاعفة ( المركبة )','الثمار المتكونة من عدة أزهار متجمعة تنشأ من كل واحدة منها ثمرة وتبقى مرتبطة مع بعضها الآخر عند النضج كما في الأناناس .'],
   ['أنبوب اللقاح','أنبوب ذو قطر ضيق ينشأ من نمو حبة اللقاح بعد سقوطها على الميسم ، ينمو ويخترق الميسم والقلم ويصل إلى المبيض الذي يحوي البويضات .'],
   ['الوسادة التناسلية','انتفاخ يوجد في الإصبع الأول لذكر الضفدع يظهر أثناء التناسل ويساعد في مسك الأنثى لفترة من الوقت أثناء الجماع .'],
   ['حويصلة كراف','تركيب كروي أو بيضوي اكتشفه العالم كراف ، وسمي الحوصلة المبيضية ، توجد في مبيض الفقريات ومنها أنثى الإنسان ، وتحتوي على خلية البيضة وخلايا حوصلية محيطة بها وفراغ يدعى الغار والغشاء الحوصلي .']
  ]},

 {name:'السؤال السابع',short:'س٧',type:'why',time:120,
  head:'اكتب نبذة مختصرة عن كل من المواضيع التالية :',
  sub:'نبذة مختصرة',
  items:[
   ['دور النحل في عملية تلقيح النباتات .','إن النحل هو أكثر الحشرات تلقيحاً حيث يقدر بعض الاقتصاديين عوائد تلقيح النحل ( أكثر من مائتي مليار دولار ) على مستوى العالم سنوياً ، حيث عندما تحط النحلة على زهرة معينة تعلق حبوب اللقاح في أرجلها وشعر جسمها ، وعند انتقالها إلى زهرة أخرى لنبات آخر من نفس النوع تنقل معها حبوب اللقاح وبذلك يتم التلقيح الخلطي ، لذلك يفضل المزارعون إقامة خلايا النحل قرب البساتين لإنتاج نباتات أكبر حجماً وأكثر عدداً وأسرع نمواً .'],
   ['مراحل تكوين الجنين في نباتات ذوات الفلقتين .','أ- مرحلة تكوين الزيجة : وفيها يتم الإخصاب المزدوج الذي يكوّن البيضة المخصبة .<br>ب- مرحلة الجنين الأولي : متعدد الخلايا جزؤه القاعدي أو الوظيفي معطل ( معلق ) .<br>ج- مرحلة التكور ( الكرة ) : الجنين بشكل كرة صغيرة .<br>د- مرحلة القلب : الجنين بشكل قلب وتظهر الفلقتان .<br>هـ- مرحلة الطوربيد : الجنين بشكل طوربيد وتتكون الفلقتان بوضوح .<br>و- مرحلة الجنين الناضج : ينمو الجنين ويتمايز إلى جنين حقيقي مكون من محور جنيني مقسم إلى رويشة وجذير وسويق فلقي ، ويحمل السويق الفلقي فلقتين أو فلقة واحدة .'],
   ['الجهاز التكاثري الذكري في الضفدع .','يتكون الجهاز التناسلي الذكري في الضفدع من الأجزاء التالية :<br>١- زوج من الخصى : والخصية تركيب بيضوي متطاول لونها أصفر فاتح ، ترتبط بالجدار الداخلي للجسم بواسطة مساريق الخصية ، ويوجد قرب النهاية الأمامية للخصية عدة بروزات إصبعية الشكل يطلق عليها الأجسام الدهنية ، وتحوي الخصية نبيبات منوية ملتوية ذات بطانة ظهارية مسؤولة عن نشوء النطف بعملية تكوين النطف .<br>٢- الأقنية الصادرة : ( ١٠ - ١٢ ) قناة في الغالب ترتبط بالنبيبات المنوية من جهة وتتصل بنبيبات الكلية من جهة أخرى .<br>٣- القناتان الناقلتان للحيامن : وهما مشتركتان مع قناتي الكليتين لذلك يطلق عليهما القناتين البوليتين التناسليتين حيث تقومان بنقل البول والنطف وتفتح القناتان في المجمع ، وقد تتوسع القناة الناقلة للنطف في جزئها الخلفي في بعض الضفادع لتكوّن حويصلة منوية تخزن فيها النطف ، ولا يمتلك الضفدع أعضاء جماع ذكرية خارجية .']
  ]},
 {name:'السؤال الثامن',short:'س٨',type:'why',time:120,
  head:'اكتب ما تعرفه عن كل مما يأتي :',
  sub:'اكتب ما تعرفه',
  items:[
   ['خطوات التكاثر اللاجنسي في البكتريا ، موضحاً ذلك بالرسم .','١- يحصل اتصال للكروموسوم البكتيري في مواقع معينة من غشاء الخلية مما يؤشر إلى أن الخلية البكتيرية مهيأة للانقسام .<br>٢- تتهيأ الخلية البكتيرية لعملية الانشطار الثنائي وذلك بتوسع جدار الخلية وغشائها وبالتالي الخلية بأكملها .<br>٣- ينتج تضاعف ( DNA ) الخلية كروموسومين متماثلين ، وفي نفس الوقت يبدأ جدار الخلية وغشاؤها بالتخصر .<br>٤- كنتيجة لاستطالة الخلية البكتيرية فإن الكروموسومين ينسحبان في اتجاهين متعاكسين ضمن الخلية ويتوزع السايتوبلازم في نفس الوقت ويزداد تخصر الخلية .<br>٥- تنقسم الخلية لتنتج خليتين متماثلتين .<br><b>الرسم :</b> خمس مراحل للانشطار الثنائي مع تأشير : كروموسوم ، جدار الخلية ، الغشاء البلازمي ، سايتوبلازم ( شاهد محاكاة الانشطار الثنائي ) .'],
   ['ظاهرة تعاقب الأجيال في عملية تكاثر النباتات .','وهي ظاهرة واضحة في تكاثر النباتات ، وتعني أن دورة حياة النبات الكاملة تمر في طورين هما :<br>١- الطور البوغي ( ٢س ) : وهو الطور اللاجنسي الذي تنتج فيه الأبواغ ، وعندما ينضج تعاني الخلايا الأم للأبواغ انقساماً اختزالياً فتتكون أبواغ ( س ) تحدد بدء الطور المشيجي .<br>٢- الطور المشيجي ( س ) : وهو الطور الجنسي الذي تنتج فيه الأمشاج ، وبعد الإخصاب بين الأمشاج الذكرية والأنثوية يبدأ الطور البوغي وهكذا تتعاقب الأجيال .<br><b>المخطط :</b> الطور البوغي ( ٢س ) ← حافظة بوغية ← انقسام اختزالي ← أبواغ ( س ) ← الطور المشيجي ( س ) ← أمشاج ( س ) ← إخصاب ← زيجة ( ٢س ) ← الطور البوغي .'],
   ['أحداث الدورة الرحمية في أنثى الإنسان .','١- خلال الأيام ( ١ - ٥ ) : يكون مستوى الهرمونات الجنسية واطئاً مما يؤدي إلى تمزق في جدار الرحم والأوعية الدموية فيه ، ويخرج الدم إلى الخارج عن طريق المهبل خلال الحيض .<br>٢- خلال الأيام ( ٦ - ١٣ ) : يزداد إنتاج هرمون الإيستروجين ( المودق ) بواسطة الحوصلة المبيضية ويحصل تثخن أو تسمك في جدار الرحم الداخلي ويصبح وعائياً وغدياً ، وهذا يدعى طور التكاثر .<br><b>ملاحظة :</b> تحصل الإباضة عادة في اليوم ١٤ من الدورة الحيضية ( أي دورة الـ ٢٨ يوم ) .<br>٣- خلال الأيام ( ١٥ - ٢٨ ) : يزداد إنتاج البروجسترون بواسطة الجسم الأصفر مسبباً زيادة مضاعفة في سمك جدار الرحم الداخلي وزيادة الغدد الرحمية التي تنتج إفرازات مخاطية ، وهذا يطلق عليه الطور الإفرازي من الدورة الرحمية .']
  ]},
 {name:'السؤال التاسع',short:'س٩',type:'why',time:60,
  head:'ماذا يحدث في الحالات التالية ؟',
  sub:'ماذا يحدث',
  items:[
   ['وجود الخصيتين داخل تجويف البطن في ذكر الإنسان .','تتعرض للضغط من قبل الأنسجة وتتأثر بالحرارة فلا تنتج النطف ( لأن الخصية لا تنتج النطف إلا في درجة حرارة أقل من حرارة الجسم ) ، لذلك فهي محمية بكيس ومتدلية خارج الجسم .'],
   ['غياب الأهداب في بطانة قناة فالوب .','إن وظيفة الأهداب المبطنة لقناة البيض دفع البيوض إلى الرحم في مسيرتها ، وإذا فقدت فإن البيوض يصعب وصولها إلى الرحم وقد لا تصل .']
  ]},
 {name:'السؤال العاشر',short:'س١٠',type:'why',time:120,
  head:'وضّح بالرسم مع كتابة البيانات :',
  sub:'الرسم مع البيانات',
  items:[
   ['تكوين النطف في الثدييات .','<b>البيانات :</b> سليفة النطفة ( ٢س ) ← خلية نطفية أولية ( ٢س ) ← انقسام اختزالي أول ← خليتان نطفيتان ثانويتان ( س ) ← انقسام اختزالي ثانٍ ← أربع أرومات نطف ( س ) ← عملية التحول النطفي ← نطف ( س ) .<br>( شاهد محاكاة تكوين النطف في الثدييات )'],
   ['تركيب الثمرة .','<b>البيانات :</b> البذرة ، الطبقة الداخلية ( النواة ) ، الطبقة الوسطى ( الجزء الطري ) ، الطبقة الخارجية ( الجلد أو الغطاء ) .<br>( شاهد محاكاة تركيب الثمرة )'],
   ['جهاز التكاثر الذكري والأنثوي في الحشرات .','<b>الجهاز الذكري :</b> خصية ، وعاء ناقل ، حوصلة منوية ، غدد مساعدة ، قناة قاذفة ، قضيب .<br><b>الجهاز الأنثوي :</b> مبيض ، قناة بيض جانبية ، قناة البيض الرئيسية ( المشتركة ) ، مستودع منوي وغدته ، غدد مساعدة ، المهبل .<br>( شاهد محاكاة الجهاز التكاثري في الحشرات )']
  ]},
 {name:'السؤال الحادي عشر',short:'س١١',type:'why',time:60,
  head:'علّل وفسّر الحقائق التالية :',
  sub:'فسّر الحقائق العلمية ( علّل )',
  items:[
   ['عملية التكاثر تؤمن بقاء النوع .','لأنه يؤمن الاستمرار في البقاء من خلال قابلية الكائنات الحية على التكاثر وإنتاج أفراد جديدة .'],
   ['يقوم بوظيفة التكاثر في بعض الأنواع الحيوانية عدد قليل من أفراد الجيل الواحد .','لامتلاك تلك الأفراد أعضاء تكاثرية دون غيرها كما في أفراد خلية نحل العسل ، حيث نجد أن الأغلبية الساحقة من أفراد الخلية إناث عاملات ليس لها دور في التكاثر ، أما الذكور فهي التي تقوم بالتكاثر مع أنثى واحدة هي الملكة .'],
   ['تعدّ ظاهرة تعاقب الأجيال أفضل صور التكاثر .','لأن تعاقب الأجيال يحدث فيه تعاقب عمليتين تكاثريتين هما الطور اللاجنسي الذي يكوّن الأبواغ والطور الجنسي الذي يكوّن الأمشاج .'],
   ['في التكاثر اللاجنسي تهلك الأفراد عند تغير ظروف البيئة .','لأن التكاثر اللاجنسي ينتج كائنات متشابهة فيصبح الظرف البيئي المميت لإحداها مميتاً لأجمعها .'],
   ['إنتاج حبوب اللقاح بأعداد كبيرة .','لضمان حصول التلقيح الخلطي حيث تنتشر حبوب اللقاح التي تقدر بالمئات من كل متك .'],
   ['وجود النقير في كل من البويض والبذرة .','لأن البذرة هي بويض ناضج مع محتوياته وأغلفته ومن ضمنها النقير ؛ فوجوده في البويض لكي يدخل منه أنبوب اللقاح ويحدث الإخصاب المزدوج ، ووجوده في البذرة لكي يدخل الماء من خلاله عند الإنبات .'],
   ['وجود غدة كوبر والبروستات والحوصلة المنوية في الجهاز التناسلي لذكر الإنسان .','لأن هذه الغدد تشترك في إفراز السائل المنوي الذي تسبح فيه النطف ، وتفرز سائلاً مخاطياً يساعد في حركة النطف ويعادل الحموضة في السائل المنوي ( كما في الغدة البصلية الإحليلية ) .'],
   ['تستطيع الفيروسات التكاثر والنمو داخل الخلايا الحية ، ولكنها تفقد هذه القدرة خارجها .','لأنها لا تمتلك الآلية الخلوية لبقائها مستقلة أثناء التكاثر ( لا تمتلك العضيات الخلوية بضمنها الأجهزة الأنزيمية الضرورية للتنفس وبناء البروتين ومضاعفة الحامض النووي ) .'],
   ['يفرز ذنب الفيروس أنزيماً عند التصاقه بالخلية البكتيرية .','ليساعد في إذابة منطقة الالتصاق وتكوين ثقب في جدار البكتريا يدخل من خلاله DNA الفايروس .'],
   ['التكاثر عن طريق الأبواغ من أفضل صور التكاثر اللاجنسي .','لأن الأبواغ تمتاز بـ : أ- مقاومتها للظروف الخارجية غير الملائمة . ب- تنتقل عن طريق الماء أو الهواء بسهولة حيث توجد أبواغ سابحة بواسطة الأسواط .'],
   ['تتباين وظيفة الغدتين المساعدتين في الحشرات .','لأنها تكون مسؤولة عن تكوين كيس البيض في بعض الحشرات كما في الصرصر ، وقد تستعمل للدفاع كما في عاملات النحل ، وفي النمل تستخدم في تعيين مسار الحشرة ، أما في الذكور فتفرز سائلاً مخاطياً يحيط بالنطف ويشكل كيس النطف .']
  ]}
];
const L=['أ','ب','ج','د'];
/* ========================================== */

const ar=n=>n.toLocaleString('ar-EG'),$=id=>document.getElementById(id),plain=h=>h.replace(/<[^>]+>/g,'');
const scr={menu:$('menu'),intro:$('intro'),qs:$('qs'),rev:$('rev')};
const btn=$('go'),pbtn=$('prev'),abtn=$('ans'),ring=$('ring'),badge=$('badge'),tleft=$('tleft'),ansBox=$('ansBox'),stmt=$('stmt');
const RL=2*Math.PI*58;ring.style.strokeDasharray=RL;
const REV=SECS.map(s=>Array(s.items.length).fill(false)),PICK=SECS.map(s=>s.items.map(()=>new Set())),opts=$('opts');
const FILL=SECS.map(s=>s.items.map(it=>s.type==='fill'?it[1].map(()=>false):s.type==='mixed'?it.a.map(()=>false):null));
const MIX=()=>S().type==='mixed',LR=()=>S().type==='why'||MIX(),K=i=>MIX()?S().items[i].k:S().type,
  Qt=i=>MIX()?S().items[i].q:S().items[i][0],Ans=i=>MIX()?S().items[i].a:S().items[i][1];
function setDone(i,v){rev()[i]=v;const f=FILL[sec][i];if(f)f.fill(v);if(!v)PICK[sec][i].clear();}
function blank(k){if(idx<0||idx>=N())return;const f=FILL[sec][idx];f[k]=!f[k];const was=rev()[idx];rev()[idx]=f.every(Boolean);
  if(was&&!rev()[idx]){rem=S().time;running=true;}paintAns(rev()[idx]&&!was);}
let sec=-1,idx=-1,rem=30,running=false,paused=false,dots=[],items=[];
const S=()=>SECS[sec],N=()=>S().items.length,rev=()=>REV[sec];

/* menu cards */
const cards=SECS.map((s,k)=>{const c=document.createElement('div');c.className='mc';
  c.innerHTML=`<div class="mn">${ar(k+1)}</div><div class="mt"><b>${s.name}</b><i>${s.sub} — ${ar(s.items.length)} فقرة</i><div class="bar"><s></s></div></div><div class="go">◀</div>`;
  c.onclick=()=>open(k,-1);$('mlist').appendChild(c);return c;});
function paintMenu(){cards.forEach((c,k)=>{const r=REV[k];c.querySelector('s').style.width=(100*r.filter(Boolean).length/r.length)+'%';});}

function build(){const s=S();
  $('dots').innerHTML='';dots=s.items.map((q,i)=>{const d=document.createElement('div');d.className='dot';d.textContent=ar(i+1);d.onclick=()=>show(i);$('dots').appendChild(d);return d;});
  const g=$('grid');g.innerHTML='';g.classList.toggle('long',LR());
  items=s.items.map((q,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML=`<b>${ar(i+1)}</b><span></span>`;
    d.onclick=()=>{if(LR())show(i);else{setDone(i,!rev()[i]);paintRev();}};g.appendChild(d);return d;});
  $('qhead').textContent=s.short+' / '+s.head;
  $('iNum').textContent=ar(sec+1);$('iName').textContent=s.name;$('iHead').textContent=s.head;
  $('iNote').textContent=`${ar(s.items.length)} فقرة — فكّر جيداً قبل ظهور الحل`;
  $('rTitle').textContent='مراجعة إجابات '+s.name;
  stmt.classList.toggle('long',s.type!=='term');ansBox.classList.toggle('long',s.type==='why');
  const mcq=s.type==='mcq',fill=s.type==='fill',mix=s.type==='mixed';ansBox.style.display=mcq||fill||mix?'none':'';opts.style.display=mcq?'grid':'none';
  g.classList.toggle('mcq',mcq||fill||mix);stmt.classList.toggle('fill',fill);stmt.classList.remove('cols');scr.qs.classList.toggle('compact',mix);}
function pick(k){if(idx<0||idx>=N()||rev()[idx])return;const it=S().items[idx];
  if(k===it[2]){rev()[idx]=true;paintAns(true);return;}
  PICK[sec][idx].add(k);const o=opts.children[k];o.classList.add('bad');o.classList.remove('shk');void o.offsetWidth;o.classList.add('shk');}

function anim(e){e.classList.remove('in');void e.offsetWidth;e.classList.add('in');}
function setTimer(v){rem=v;const T=S().time,late=rem<=0,done=idx>=0&&idx<N()&&rev()[idx];
  ring.style.strokeDashoffset=done?0:RL*(1-Math.max(0,rem)/T);
  ring.setAttribute('stroke',done?'#1b7a3a':late?'#c62828':rem<=T/3?'#e0a020':'#c4623a');
  tleft.textContent=done?'✔ تم الحل':late?'⏰ انتهى الوقت':ar(Math.ceil(rem))+' ثانية';
  tleft.classList.toggle('late',late&&!done);}
function paintAns(burst){const o=rev()[idx],it=S().items[idx],a=it[1];
  if(S().type==='mcq'){[...opts.children].forEach((e,k)=>{e.classList.toggle('ok',o&&k===it[2]);e.classList.toggle('dim',o&&k!==it[2]);e.classList.toggle('bad',PICK[sec][idx].has(k));});
    const p=$('par');if(p)p.innerHTML=o?`<b>${L[it[2]]}</b>`:'&nbsp;&nbsp;';}
  else if(FILL[sec][idx]){const f=FILL[sec][idx],A=Ans(idx);stmt.querySelectorAll('.bl').forEach((b,k)=>{const on=f[k];
    if(on&&!b.classList.contains('on')){b.classList.add('on');b.innerHTML=`<i>${A[k]}</i>`;}
    else if(!on&&b.classList.contains('on')){b.classList.remove('on');b.innerHTML='';}});}
  else{ansBox.classList.toggle('open',o);
  ansBox.innerHTML=o?(S().type==='why'?`<span><em>ج /</em>${a}</span>`:`<span>${a}</span>`):'؟ ؟ ؟';}
  dots.forEach((d,i)=>{d.classList.toggle('done',rev()[i]);d.classList.toggle('cur',i===idx);});
  if(o){running=false;badge.classList.remove('late');if(burst)celebrate();}
  setTimer(rem);ui();}
function paintRev(){let c=0;const why=LR();
  items.forEach((d,i)=>{const o=rev()[i];if(o)c++;d.classList.toggle('done',o);
    const it=S().items[i],mcq=S().type==='mcq';
    d.querySelector('span').textContent=why?(o?'✔ ':'')+(MIX()?it.t:plain(it[0])):!o?'؟ ؟ ؟':mcq?`${L[it[2]]} ) ${it[1][it[2]]}`:Array.isArray(it[1])?it[1].join(' ، '):it[1];});
  $('score').textContent=`تم حل ${ar(c)} من ${ar(N())} فقرة`+(why?' — اضغط على أي فقرة لفتحها':'');ui();}

function screen(n){for(const k in scr)scr[k].classList.toggle('on',k===n);}
function open(k,i){if(k!==sec){sec=k;build();}show(i);}
function home(){sec=-1;idx=-1;running=false;screen('menu');anim(scr.menu);paintMenu();ui();}
function show(i){idx=i;
  if(i<0){screen('intro');anim(scr.intro);}
  else if(i<N()){screen('qs');$('num').textContent=ar(i+1);const it=S().items[i];
    if(S().type==='mcq'){stmt.innerHTML=`<div><span class="par" id="par"></span>${it[0]}</div>`;opts.innerHTML='';
      it[1].forEach((t,k)=>{const e=document.createElement('div');e.className='op';e.innerHTML=`<b>${L[k]}</b><span>${t}</span>`;e.onclick=()=>pick(k);opts.appendChild(e);});}
    else if(K(i)==='fill'||K(i)==='cols'){
      if(MIX()){stmt.classList.toggle('fill',K(i)==='fill');stmt.classList.toggle('cols',K(i)==='cols');$('qhead').textContent=S().short+' / '+it.h;}
      if(K(i)==='fill'){let k=0;stmt.innerHTML=Qt(i).replace(/__/g,()=>`<span class="bl" data-k="${k++}"></span>`);}
      else stmt.innerHTML=(it.q?`<div class="ctitle ${it.tight?'tight':''}">${it.q}</div>`:'')+`<div class="cgrid ${it.tight?'tight':''}">${it.heads.map((h,k)=>`<div><div class="chead">${h}</div><span class="bl cb" data-k="${k}"></span></div>`).join('')}</div>`;
      stmt.querySelectorAll('.bl').forEach(b=>b.onclick=()=>blank(+b.dataset.k));}
    else stmt.innerHTML=it[0];anim(stmt);anim(badge);anim(ansBox.parentNode);
    badge.classList.remove('late');rem=S().time;running=!rev()[i];paintAns(false);}
  else{screen('rev');anim(scr.rev);paintRev();}
  ui();}

function ui(){
  if(sec<0){btn.textContent='ابدأ';btn.disabled=false;pbtn.disabled=true;abtn.disabled=true;abtn.textContent='إظهار الحل 💡';abtn.classList.remove('hide');return;}
  const n=N();btn.disabled=false;
  btn.textContent=idx<0?'ابدأ':idx<n-1?'التالي ◀':idx===n-1?'المراجعة ◀':'القائمة ⌂';
  pbtn.disabled=false;
  if(idx<0){abtn.disabled=true;abtn.textContent='إظهار الحل 💡';abtn.classList.remove('hide');}
  else if(idx<n){abtn.disabled=false;const f=FILL[sec][idx];
    abtn.textContent=rev()[idx]?'إخفاء الحل':f&&f.length>1?`إظهار ${ar(f.filter(Boolean).length+1)}/${ar(f.length)} 💡`:'إظهار الحل 💡';
    abtn.classList.toggle('hide',rev()[idx]);}
  else if(LR()){abtn.disabled=true;abtn.textContent='إظهار الحل 💡';abtn.classList.remove('hide');}
  else{const all=rev().every(Boolean);abtn.disabled=false;abtn.textContent=all?'إخفاء الكل':'إظهار الكل 💡';abtn.classList.toggle('hide',all);}
}
function toggleAns(){if(sec<0||idx<0)return;const r=rev();
  if(idx<N()){const f=FILL[sec][idx];
    if(f&&!r[idx]){blank(f.indexOf(false));return;}
    setDone(idx,!r[idx]);if(!r[idx]){rem=S().time;running=true;}paintAns(r[idx]);}
  else if(!LR()){const all=r.every(Boolean);r.forEach((v,i)=>setDone(i,!all));paintRev();}}

function celebrate(){const g=$('glow');g.classList.remove('go');void g.offsetWidth;g.classList.add('go');
  const C=['#c4623a','#1b7a3a','#ffb000','#1f3a52','#c62828','#7a64c8'],w=ansBox.parentNode;
  for(let k=0;k<26;k++){const s=document.createElement('i');s.className='cf';const a=Math.random()*2*Math.PI,r=180+Math.random()*220;
    s.style.background=C[k%C.length];s.style.setProperty('--dx',(Math.cos(a)*r*1.4).toFixed(0)+'px');s.style.setProperty('--dy',(Math.sin(a)*r*.7-60).toFixed(0)+'px');
    s.style.setProperty('--r',(Math.random()*720-360).toFixed(0)+'deg');w.appendChild(s);setTimeout(()=>s.remove(),1400);}}

btn.onclick=()=>{if(sec<0){open(0,-1);return;}
  if(idx>=N())home();else show(idx+1);};
pbtn.onclick=()=>{if(sec<0)return;if(idx<0)home();else show(idx-1);};
abtn.onclick=toggleAns;
ansBox.onclick=toggleAns;
$('home').onclick=home;
badge.onclick=()=>{if(idx<0||idx>=N()||rev()[idx])return;badge.classList.remove('late');rem=S().time;running=true;setTimer(rem);};

/* timer loop */
let last=performance.now();
function frame(ms){const dt=Math.min(.1,(ms-last)/1000);last=ms;
  if(running&&!paused&&sec>=0&&idx>=0&&idx<N()){rem-=dt;if(rem<=0){rem=0;running=false;badge.classList.add('late');}setTimer(rem);}
  requestAnimationFrame(frame);}

/* ---------------- zoom & pan (gestures) ---------------- */
const cv=$('cv'),board=$('board'),BW=1000,BH=720,MIN=.6,MAX=8,NOPAN='.dot,.it,.ans,.badge,.mc,.op,.bl';
let fit=1,SC=1,tx=0,ty=0;
const apply=()=>board.style.transform=`translate(${tx}px,${ty}px) scale(${SC})`;
function reset(){const w=cv.clientWidth,h=cv.clientHeight;fit=Math.min(w/BW,h/BH);SC=fit;tx=(w-BW*SC)/2;ty=(h-BH*SC)/2;apply();}
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function zoomAt(k,p){const ns=Math.min(fit*MAX,Math.max(fit*MIN,SC*k));k=ns/SC;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;SC=ns;apply();}
const mid=()=>({x:cv.clientWidth/2,y:cv.clientHeight/2});
const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{if(e.target.closest(NOPAN))return;cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,pt(e));});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=pt(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,pt(e));},{passive:false});
cv.addEventListener('dblclick',e=>{if(!e.target.closest(NOPAN))reset();});
$('zin').onclick=()=>zoomAt(1.3,mid());
$('zout').onclick=()=>zoomAt(1/1.3,mid());
$('zreset').onclick=reset;
$('pause').onclick=function(){paused=!paused;document.body.classList.toggle('paused',paused);this.textContent=paused?'▶':'⏸';};
addEventListener('resize',reset);
const fsBtn=$('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';fsBtn.setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');requestAnimationFrame(reset);}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  if(e.key==='ArrowLeft'||e.key===' '){e.preventDefault();btn.click();}
  else if(e.key==='ArrowRight')pbtn.click();
  else if(e.key==='Home'||e.key==='Escape'&&!fsEl())home();
  else if('1234'.includes(e.key)&&e.key.length===1&&sec>=0&&S().type==='mcq')pick(+e.key-1);
  else if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!abtn.disabled)toggleAns();}});
reset();home();requestAnimationFrame(frame);
})();
</script>
</body></html>
