<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<title>الغدد الملحقة بالجهاز الهضمي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
  /* Same pattern as the reference: full-screen plates, labels arrive one by one, then the picture slides
     right while the text panel opens on the LEFT. The panel holds one button per part; a button opens its full text.
     Deliberately a single light theme, matching the white-ground anatomical plates. */
  :root{--navy:#1f3a52;--rust:#c4623a;--rustD:#a8431b;--ink:#26384a;--muted:#5d7488;--paper:#eef6fb;--white:#ffffff;--eqbg:#fff6ef;--eqline:#f0d2c2;--line:#cfe0ec;color-scheme:light}
  html{height:100%;box-sizing:border-box;overflow:hidden;background:var(--paper)}
  *,*:before,*:after{box-sizing:inherit}
  body{position:relative;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);direction:rtl;
       font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--navy);padding:0 16px}
  #title{color:var(--white);font-size:clamp(15px,3.6vw,22px);font-weight:800}
  #badge{min-width:34px;height:34px;border-radius:50%;background:var(--white);color:var(--navy);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#f6fcff 0%,#cfe8f3 100%)}

  #draw{position:absolute;top:0;right:0;width:100%;height:calc(100% - 84px);z-index:2;
        transition:width 1.4s cubic-bezier(.65,0,.35,1),height 1.4s cubic-bezier(.65,0,.35,1)}
  .shifted #draw{width:56%}
  #draw>svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;overflow:visible;direction:ltr;transition:opacity .5s ease}
  #draw>svg:active{cursor:grabbing}
  #draw>svg.off{opacity:0;pointer-events:none}

  .lbl text{font-family:"Cairo",Tahoma,Arial,sans-serif;font-weight:800;fill:#141414;stroke:var(--white);stroke-linejoin:round;paint-order:stroke;transition:fill .35s}
  .lbl.hot text,.lbl.focus text{fill:var(--rustD)}
  .lbl .halo{fill:none;stroke:var(--white);stroke-linecap:round;stroke-linejoin:round}
  .lbl .ln{fill:none;stroke:#141414;stroke-linecap:round;stroke-linejoin:round;transition:stroke .35s}
  .lbl.focus .ln{stroke:var(--rustD)}
  .lbl .dot{fill:#141414;stroke:var(--white);transition:fill .35s}
  .lbl.focus .dot{fill:var(--rust)}
  .lbl .ring{fill:none;stroke:var(--rust)}
  .lbl .hit{fill:transparent;cursor:pointer}
  .lbl text,.lbl .tg{cursor:pointer}

  #trip{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(255,255,255,.92);border:1.5px solid var(--line);
        border-radius:999px;padding:4px 14px;font-size:clamp(12.5px,1.3vw,15px);font-weight:700;color:var(--muted);white-space:nowrap;box-shadow:0 2px 8px rgba(31,58,82,.12);pointer-events:none;transition:opacity .4s}
  #trip b{color:var(--rustD);font-weight:800}
  #trip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-start:6px;vertical-align:middle;background:#c8893a;box-shadow:0 0 0 3px rgba(196,98,58,.18)}

  #txt{position:absolute;top:16px;bottom:84px;left:68px;width:calc(44% - 84px);overflow-y:auto;z-index:1;
       padding:4px 14px 4px 6px;opacity:0;transform:translateX(-40px);pointer-events:none;scrollbar-width:thin;
       transition:opacity .7s ease .4s,transform .9s cubic-bezier(.2,.7,.2,1) .4s;-webkit-user-select:text;user-select:text}
  .shifted #txt{opacity:1;transform:none;pointer-events:auto}
  #txtIn{max-width:600px}
  @media (max-width:720px),(max-aspect-ratio:4/5){
    .shifted #draw{width:100%;height:40%}
    #txt{top:calc(40% + 2px);left:16px;right:16px;width:auto;bottom:80px;padding:4px;transform:translateY(40px)}
    .zb{gap:6px;top:8px;left:8px}
    .zb button{width:34px;height:34px;font-size:18px}
    .zb button svg{width:16px;height:16px}
    #trip{top:auto;bottom:6px;white-space:normal;max-width:calc(100% - 24px);text-align:center}
  }
  #txt h2{margin:0 0 6px;color:var(--navy);font-size:clamp(17px,1.7vw,21px);font-weight:800;line-height:1.6;text-wrap:balance}
  #txt .en{display:inline-block;margin-inline-start:8px;font-size:.68em;color:var(--rust);font-weight:700;direction:ltr;unicode-bidi:isolate;font-family:"Segoe UI",Arial,sans-serif}
  #txt .intro{margin:0 0 12px;font-size:clamp(14px,1.25vw,15.5px);line-height:1.9;color:var(--ink)}
  #txt p{margin:0 0 10px;font-size:clamp(14px,1.25vw,15.5px);line-height:1.95;color:var(--ink)}
  #txt h4{margin:12px 0 6px;color:var(--rustD);font-size:clamp(14px,1.25vw,15.5px);font-weight:800}
  #txt b{font-weight:800;color:var(--navy)}

  .accs{display:flex;flex-direction:column;gap:8px;padding-bottom:16px}
  .item{opacity:0;transform:translateY(10px);transition:opacity .4s,transform .45s cubic-bezier(.2,.7,.2,1)}
  .item.on{opacity:1;transform:none}
  .acc{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:1.5px solid var(--line);background:var(--white);border-radius:12px;
       font-family:inherit;font-size:clamp(14.5px,1.35vw,16.5px);font-weight:800;color:var(--navy);cursor:pointer;text-align:right;
       box-shadow:0 2px 6px rgba(31,58,82,.07);transition:border-color .3s,background .3s,box-shadow .3s}
  .acc:hover{border-color:#a9c6da;box-shadow:0 4px 12px rgba(31,58,82,.12)}
  .acc .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--white);font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .3s}
  .acc .en{font-size:.72em!important}
  .acc .chev{flex:none;margin-inline-start:auto;width:18px;height:18px;color:var(--muted);transition:transform .4s}
  .item.open .acc{border-color:var(--rust);background:var(--eqbg);box-shadow:0 4px 14px rgba(196,98,58,.18)}
  .item.open .acc .n{background:var(--rust)}
  .item.open .acc .chev{transform:rotate(180deg);color:var(--rust)}
  .bw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.3,.7,.2,1)}
  .item.open .bw{grid-template-rows:1fr}
  .bi{overflow:hidden;min-height:0}
  .bin{margin:8px 4px 4px 0;padding:10px 14px 6px;border-inline-start:3px solid var(--rust);background:rgba(255,255,255,.65);border-radius:0 0 10px 10px}
  #txt ol{list-style:none;margin:2px 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
  #txt li{display:flex;gap:9px;align-items:flex-start;font-size:clamp(13.5px,1.2vw,15px);line-height:1.85;color:var(--ink)}
  #txt li>span:last-child{min-width:0}
  .num{flex:none;width:21px;height:21px;margin-top:4px;border-radius:50%;background:var(--rust);color:var(--white);font-weight:700;font-size:12px;
       display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.4);transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1)}
  .num.dot{width:9px;height:9px;margin:11px 6px 0 6px;font-size:0}
  .num.on{opacity:1;transform:none}
  .golink{display:inline-flex;align-items:center;gap:6px;margin:4px 0 10px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--rust);background:var(--white);
          color:var(--rustD);font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;opacity:0;transition:opacity .4s,background .25s}
  .golink.on{opacity:1}
  .fig{margin:4px 0 12px;padding:8px;background:var(--white);border:1.5px solid var(--line);border-radius:12px;opacity:0;transition:opacity .5s;text-align:center}
  .fig.on{opacity:1}
  .fig img{display:block;width:100%;max-width:260px;margin:0 auto;border-radius:8px}
  .fig figcaption{margin-top:6px;font-size:13px;font-weight:700;color:var(--muted)}
  .golink:hover{background:var(--eqbg)}
  .w{display:inline-block;opacity:0;transform:translateY(5px);filter:blur(3px);transition:opacity .45s ease,transform .45s ease,filter .45s ease}
  .w.on{opacity:1;transform:none;filter:none}

  #ctrl{position:absolute;bottom:12px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px;pointer-events:none;z-index:4}
  #ctrl>*{pointer-events:auto}
  .nav{width:56px;height:56px;border-radius:50%;border:3px solid var(--navy);background:var(--white);color:var(--navy);font-size:24px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.22);transition:opacity .3s;font-family:inherit;padding:0}
  .nav:active{background:#d9ebf7}
  .nav:disabled{opacity:.3;cursor:default}
  #dots{display:flex;gap:12px;align-items:center}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--navy);background:var(--white);padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:var(--rust);border-color:var(--rust);transform:scale(1.45)}
  .zb{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);background:var(--white);color:var(--navy);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:background .25s,color .25s}
  .zb button svg{width:20px;height:20px;cursor:pointer}
  #tt.on,#play.on{background:var(--navy);color:var(--white)}
  button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
  body.pf #top{display:none}
  body.pf #stage{top:0}
  @media (max-width:720px),(max-aspect-ratio:4/5){
    .zb{flex-direction:row;gap:6px;top:8px;left:8px}
    .zb button{width:34px;height:34px;font-size:18px}
    .zb button svg{width:16px;height:16px}
    #trip{display:none}
  }
  @media (prefers-reduced-motion:reduce){#draw,#txt,.w,.num,.item,.bw,#draw>svg{transition:none!important}}
</style>
</head>
<body>

<div id="top"><div id="title">الغدد الملحقة بالجهاز الهضمي</div><div id="badge">١</div></div>
<div id="stage">
  <div id="draw"><div id="trip"><i id="tripDot"></i> إفراز اللعاب: <b id="tripName">الغدة النكفية</b></div></div>
  <div id="txt"><div id="txtIn"></div></div>
  <div class="zb">
    <button id="tt" aria-label="إظهار الغدد الملحقة" aria-pressed="false" title="الغدد الملحقة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 11h16M4 16h12M4 21h9"/></svg></button>
    <button id="play" class="on" aria-label="إيقاف إفراز اللعاب" aria-pressed="true" title="إفراز اللعاب"><svg viewBox="0 0 24 24" fill="currentColor"><path id="playIco" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
    <button id="replay" aria-label="إعادة عرض التأشيرات" title="إعادة التأشيرات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg></button>
    <button id="zin" aria-label="تكبير">+</button>
    <button id="zout" aria-label="تصغير">−</button>
    <button id="zreset" aria-label="إعادة الضبط">⟲</button>
    <button id="fs" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="الشكل السابق">&#8594;</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="الشكل التالي">&#8592;</button>
  </div>
</div>

function polyAt(pts,len,f){let d=f*len;for(let i=1;i<pts.length;i++){const a=pts[i-1],c=pts[i],l=Math.hypot(c[0]-a[0],c[1]-a[1]);if(d<=l||i===pts.length-1){const k=l?Math.min(1,d/l):0;return[a[0]+(c[0]-a[0])*k,a[1]+(c[1]-a[1])*k];}d-=l;}return pts[pts.length-1];}
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>{a=hex(a);b=hex(b);return'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')+')';};

  const view=el('g',{},svg);
  S.svg=svg;S.view=view;S.si=si;
  const body=el('g',{},view);S.body=body;
  el('use',{href:'#img'+si},body);

  /* one masked copy of the plate per moving region */
  let mid=0;
  const overlay=(cx,cy,rx,ry,par)=>{
    const id=`m${si}_${mid++}`,pad=1.25;
    const m=el('mask',{id,maskUnits:'userSpaceOnUse',x:cx-rx*pad,y:cy-ry*pad,width:rx*2*pad,height:ry*2*pad},defs);

    const g=el('g',{mask:`url(#${id})`},par||body),inner=el('g',{},g);el('use',{href:'#img'+si},inner);
    return{m,e,inner,move(x,y){m.setAttribute('x',x-rx*pad);m.setAttribute('y',y-ry*pad);e.setAttribute('cx',x);e.setAttribute('cy',y);}};
  };
  S.regions.forEach(R=>{R.o=overlay(R.c[0],R.c[1],R.r[0],R.r[1]);});

  /* saliva drops along the ducts */
  const fx=el('g',{},body);

  S.regions.filter(R=>R.kind==='gland'&&!R.soft).forEach(R=>{R.glow=el('ellipse',{cx:R.c[0],cy:R.c[1],rx:R.r[0]*1.05,ry:R.r[1]*1.05,fill:`url(#warm${si})`,opacity:0},fx);});
  S.juices.forEach(Jc=>{const p=Jc.pts[Jc.pts.length-1];Jc.rip=el('circle',{cx:p[0],cy:p[1],r:0,fill:'none',stroke:Jc.blood?'none':(Jc.col||'#e9f7ff'),'stroke-width':S.lw,opacity:0},fx);});
  S.gr=(S.grains||[]).map((p,k)=>({p,k,e:el('circle',{cx:p[0],cy:p[1],r:5,fill:'#f4eedf',stroke:'#ffffff','stroke-width':1.6,opacity:0},fx)}));
  /* draw the duct drops above the glow */
  S.juices.forEach(Jc=>Jc.ds.forEach(d=>fx.appendChild(d)));

  /* labels */
  const lg=el('g',{},view);
  S.labels.forEach((o,li)=>{
    const g=el('g',{class:'lbl'},lg);o.g=g;o.parts=[];const sw=S.lw;

      const d='M'+pts.map(q=>q.join(' ')).join('L'),len=polyLen(pts);
      const halo=el('path',{class:'halo',d,'stroke-width':sw*2.1,'stroke-dasharray':len,'stroke-dashoffset':len},g);

      const ring=el('circle',{class:'ring',cx:pts[0][0],cy:pts[0][1],r:0,opacity:0,'stroke-width':sw*.7},g);
      const dot=el('circle',{class:'dot',cx:pts[0][0],cy:pts[0][1],r:0,'stroke-width':sw*.6},g);

let cur=0,lblStart=null,focus={set:new Set(),t0:0};
function drawLabels(now){
  const S=SLIDES[cur];
  const t=lblStart===null?-1:(RM?1e6:(now-lblStart)/1000),ft=(now-focus.t0)/1000;
  S.labels.forEach((o,i)=>{
    const u=t-i*S.step,f=focus.set.has(i);
    const pd=ss(0,.45,u),pl=ss(.35,1.4,u),pt=ss(1.15,DUR,u),pr=ss(0,.9,u);
    o.parts.forEach(q=>{
      let r=S.lw*2*pd*(1+.35*Math.sin(PI*Math.min(1,Math.max(0,u)/.45)));
      if(f)r*=1.35;
      q.dot.setAttribute('r',r.toFixed(2));
      let rr=S.lw*2+S.lw*6*pr,ro=u>0&&u<.9?(1-pr)*.9:0;
      if(f&&!RM){const k=(ft%1.4)/1.4;rr=S.lw*2+S.lw*9*k;ro=.95*(1-k);}
      q.ring.setAttribute('r',rr.toFixed(1));q.ring.setAttribute('opacity',ro.toFixed(2));
      const off=(q.len*(1-pl)).toFixed(1);q.ln.setAttribute('stroke-dashoffset',off);q.halo.setAttribute('stroke-dashoffset',off);q.ln.setAttribute('opacity',pl>0?1:0);q.halo.setAttribute('opacity',pl>0?1:0);
    });
    o.tg.setAttribute('opacity',pt.toFixed(3));o.tg.setAttribute('transform',`translate(0 ${(S.fs*.35*(1-pt)).toFixed(1)})`);
    o.g.classList.toggle('focus',f);
  });
}

function animate(S,t,e){
  const C=S.cycle,cm=t%C.T,si=C.stages.findIndex(s=>cm>=s.t0&&cm<s.t0+s.d),st=C.stages[si];
  const u=(cm-st.t0)/st.d,on=ss(0,.12,u)*(1-ss(.88,1,u));
  /* how strongly each gland works right now */
  const act=g=>g===st.g?.25+.75*on:.25;
  S.regions.forEach(R=>{
    const [cx,cy]=R.c;let tr='';
    if(R.kind==='gland'){const a=act(R.g),s=1+(R.soft?.004+.01*a:.008+.03*a)*(.5+.5*Math.sin(t*5.2+R.g));
      tr=`translate(${cx} ${cy}) scale(${s.toFixed(4)}) translate(${-cx} ${-cy})`;
      if(R.glow)R.glow.setAttribute('opacity',(e*(a-.25)*.9*(.65+.35*Math.sin(t*5.2+R.g))).toFixed(3));}
    else if(R.kind==='gb'){const k=st.g===0?1+.04*ss(0,1,u):st.g===1?1.04-.12*ss(0,.7,u):.92+.08*ss(0,1,u);
      tr=`translate(${cx} ${cy}) scale(${k.toFixed(4)}) translate(${-cx} ${-cy})`;}
    else if(R.kind==='churn'){const a=1.4*Math.sin(t*1.25),s=1+.02*Math.sin(t*2.5);tr=`rotate(${a.toFixed(3)} ${cx} ${cy}) translate(${cx} ${cy}) scale(${s.toFixed(4)}) translate(${-cx} ${-cy})`;}
    else if(R.kind==='wave'){const w=Math.max(0,Math.sin(2*PI*t/R.per-R.i*.7)),s=1+.035*w*w;tr=`translate(${cx} ${cy}) scale(${s.toFixed(4)}) translate(${-cx} ${-cy})`;}
    else if(R.kind==='tongue'){const a=1.3*Math.sin(t*1.4),dy=2.5*Math.sin(t*2.1);tr=`translate(0 ${dy.toFixed(2)}) rotate(${a.toFixed(3)} ${R.pivot[0]} ${R.pivot[1]})`;}
    R.o.inner.setAttribute('transform',tr);
  });
  /* saliva along the ducts, and a ripple where each duct opens into the mouth */
  S.juices.forEach(Jc=>{const b=Jc.st<0?1:Jc.st===st.g?on:0,vis=Jc.blood?.8:.18+.82*b;
    Jc.ds.forEach((d,k)=>{const q=(t/Jc.per+k/Jc.n)%1,p=polyAt(Jc.pts,Jc.len,q);
      d.setAttribute('cx',p[0].toFixed(1));d.setAttribute('cy',p[1].toFixed(1));d.setAttribute('opacity',(e*vis*Math.sin(PI*q)).toFixed(3));});
    const r=((t/Jc.per)*Jc.n)%1;
    Jc.rip.setAttribute('r',(S.lw*2+S.lw*8*r).toFixed(1));Jc.rip.setAttribute('opacity',(Jc.blood?0:e*b*(1-r)*.9).toFixed(3));});
  /* starch grains turn into sugar as saliva reaches them */
  const sweet=(t%C.T)/C.T;if(S.gr.length)
  S.gr.forEach(g=>{const k=ss(.08+g.k*.06,.35+g.k*.06,sweet)*(1-ss(.93,1,sweet));
    g.e.setAttribute('fill',mix('#f4eedf','#f2b33a',k));g.e.setAttribute('r',(5-1.4*k+.5*Math.sin(t*3+g.k)).toFixed(2));
    g.e.setAttribute('opacity',(e*.95).toFixed(3));});
  setStage(S,si);
  S.body.setAttribute('opacity',e.toFixed(3));
  const s=.95+.05*e;S.body.setAttribute('transform',`translate(${S.w/2} ${S.h/2}) scale(${s.toFixed(4)}) translate(${-S.w/2} ${-S.h/2})`);
}
function setStage(S,si){
  if(si===stageNow)return;stageNow=si;
  S.labels.forEach(o=>o.g.classList.remove('hot'));
  const st=S.cycle.stages[si];
  tripName.textContent=st.n;tripDot.style.background=st.col;
  st.lab.forEach(i=>S.labels[i].g.classList.add('hot'));
}

const mk=(tag,cls,par,s)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(s!=null)e.textContent=s;if(par)par.appendChild(e);return e;};
const LAT=/[A-Za-z]/;
function words(par,s){
  const toks=s.split(/\s+/),out=[];
  for(let k=0;k<toks.length;k++){
    let w=toks[k],cls='w';
    if(LAT.test(w)){while(k+1<toks.length&&LAT.test(toks[k+1])&&!/\)/.test(w))w+=' '+toks[++k];cls+=' en-run';}
    if(out.length)par.appendChild(document.createTextNode(' '));
    const sp=mk('span',cls,par,w);
    if(cls.includes('en-run')){sp.dir='ltr';sp.style.unicodeBidi='isolate';}
    out.push(sp);
  }
  return out;
}

    b.type='button';b.setAttribute('aria-expanded','false');
    mk('span','n',b,AR(i+1));if(it.s)b.title='يعرض شكل الكبد والبنكرياس';const tt=mk('span','',b,it.t);tt.appendChild(document.createTextNode(' '));mk('span','en',tt,'('+it.en+')');
    const ch=document.createElementNS(NS,'svg');ch.setAttribute('viewBox','0 0 24 24');ch.setAttribute('class','chev');
    el('path',{d:'M6 9l6 6 6-6',fill:'none',stroke:'currentColor','stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round'},ch);b.appendChild(ch);
    const bw=mk('div','bw',item),bi=mk('div','bi',bw);
    b.onclick=()=>toggleItem(i);
    itemEls.push({item,b,bi,built:null});
  });
}
function buildBody(i){
  const it=TXT.items[i],E=itemEls[i];if(E.built)return E.built;
  const box=mk('div','bin',E.bi),seq=[];
  it.body.forEach(B=>{
    if(B.p)seq.push(...words(mk('p','',box),B.p));
    if(B.h)seq.push(...words(mk('h4','',box),B.h));
    if(B.li){const ol=mk('ol','',box);B.li.forEach((f,k)=>{const li=mk('li','',ol);
      seq.push(mk('span','num'+(B.m==='dot'?' dot':''),li,B.m==='abc'?ABC[k]:''));
      const sp=mk('span','',li);
      if(Array.isArray(f)){const b=mk('b','',sp);seq.push(...words(b,f[0]));sp.appendChild(document.createTextNode(' '));seq.push(...words(sp,f[1]));}
      else seq.push(...words(sp,f));});}
    if(B.fig){const f=mk('figure','fig',box),im=mk('img','',f);im.src=FIG[B.fig];im.alt=B.cap;const c=mk('figcaption','',f);seq.push(f);seq.push(...words(c,B.cap));}
    if(B.go!=null){const g=mk('button','golink',box,B.t+' ←');g.type='button';g.onclick=()=>go(B.go);seq.push(g);}
  });
  E.built=seq;return seq;
}
function toggleItem(i){
  const E=itemEls[i];if(!E)return;
  if(openIdx===i){E.item.classList.remove('open');E.b.setAttribute('aria-expanded','false');openIdx=-1;pulse([]);return;}
  itemEls.forEach((x,k)=>{x.item.classList.remove('open');x.b.setAttribute('aria-expanded','false');});
  openIdx=i;E.item.classList.add('open');E.b.setAttribute('aria-expanded','true');
  const seq=buildBody(i),tok=++typeTok;
  if(RM)seq.forEach(s=>s.classList.add('on'));
  else seq.forEach((s,k)=>setTimeout(()=>{if(tok===typeTok||s.classList)s.classList.add('on');},120+k*14));
  const it=TXT.items[i];if(it.s!==cur)go(it.s);pulse(it.lab);
  setTimeout(()=>{const top=E.item.offsetTop-6;txt.scrollTo({top,behavior:RM?'auto':'smooth'});},RM?0:260);
}
function startTyping(){
  if(typed)return;typed=true;const tok=++typeTok;
  if(RM){showAll();return;}
  headSeq.forEach((s,k)=>setTimeout(()=>{if(tok===typeTok)s.classList.add('on');},k*45));
  const t0=headSeq.length*45+150;
  itemEls.forEach((x,k)=>setTimeout(()=>x.item.classList.add('on'),t0+k*110));
}
function showAll(){typed=true;headSeq.forEach(s=>s.classList.add('on'));itemEls.forEach(x=>x.item.classList.add('on'));}
function openFromImage(i){
  if(!textOn){setText(true);setTimeout(()=>{showAll();if(openIdx!==i)toggleItem(i);},RM?0:1000);}
  else{showAll();if(openIdx!==i)toggleItem(i);else pulse(TXT.items[i].lab);}
}

/* ===================== show / hide text ===================== */
let textOn=false,ready=false;
const tt=$('tt');
function setText(v){textOn=v;tt.classList.toggle('on',textOn);tt.setAttribute('aria-pressed',textOn);tt.setAttribute('aria-label',textOn?'إخفاء الغدد الملحقة':'إظهار الغدد الملحقة');layout();}
function layout(){stage.classList.toggle('shifted',textOn&&ready);if(textOn&&ready)setTimeout(()=>{if(textOn&&ready)startTyping();},RM?0:1100);}
tt.onclick=()=>setText(!textOn);
$('replay').onclick=()=>{playLabels();};
const playBtn=$('play'),playIco=$('playIco');
function setPlay(v){playing=v;playBtn.classList.toggle('on',v);playBtn.setAttribute('aria-pressed',v);playBtn.setAttribute('aria-label',v?'إيقاف إفراز اللعاب':'تشغيل إفراز اللعاب');
  playIco.setAttribute('d',v?'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z':'M8 5l11 7-11 7z');}
playBtn.onclick=()=>setPlay(!playing);setPlay(playing);

/* ===================== slides ===================== */
const dots=$('dots'),badge=$('badge');
SLIDES.forEach((S,i)=>{const b=mk('button','dot',dots);b.setAttribute('aria-label','الشكل '+AR(i+1));b.onclick=()=>go(i);S.dotEl=b;});
let born=performance.now(),textBuilt=false;
function go(i){
  if(i<0||i>=SLIDES.length)return;
  if(i!==cur){SLIDES[cur].svg.classList.add('off');cur=i;SLIDES[cur].svg.classList.remove('off');}
  SLIDES.forEach((S,k)=>S.dotEl.classList.toggle('on',k===cur));
  badge.textContent=AR(cur+1);
  $('prev').disabled=cur===0;$('next').disabled=cur===SLIDES.length-1;
  reset();born=performance.now();lblStart=null;jt=0;stageNow=-2;
  trip.firstChild.nextSibling.textContent=' '+SLIDES[cur].cycle.name+': ';
  if(!textBuilt){buildText();textBuilt=true;}
  /* keep the open part highlighted only if it belongs to this plate */
  if(openIdx>=0&&TXT.items[openIdx].s===cur)pulse(TXT.items[openIdx].lab);else pulse([]);
  setTimeout(()=>{if(ready)playLabels();},RM?0:700);
}
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;if(e.key==='ArrowLeft')go(cur+1);else if(e.key==='ArrowRight')go(cur-1);});

/* ===================== loop ===================== */
function frame(ms){
  const dt=lastMs===null?0:Math.min(.1,(ms-lastMs)/1000);lastMs=ms;
  if(playing)jt+=dt;
  const e=RM?1:ss(0,1,(ms-born)/900);
  animate(SLIDES[cur],RM?1.5:jt,e);drawLabels(ms);requestAnimationFrame(frame);
}
setTimeout(()=>{ready=true;playLabels();layout();},RM?0:900);

/* ===================== zoom & pan ===================== */
let sc=1,tx=0,ty=0,dragged=false,downAt=null;const MIN=.6,MAX=8;
const apply=()=>SLIDES[cur].view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function mid(){const v=SLIDES[cur].vb;return{x:v[0]+v[2]/2,y:v[1]+v[3]/2};}
function toView(e){const svg=SLIDES[cur].svg,p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
SLIDES.forEach(S=>{const svg=S.svg;
  svg.addEventListener('pointerdown',e=>{if(e.target.closest('.lbl')&&e.pointerType!=='touch'){}svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));dragged=false;downAt=[e.clientX,e.clientY];});
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;
    if(downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6)dragged=true;
    const prev=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
    if(ptrs.size===1){const o=prev.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
    else{dragged=true;const ids=[...ptrs.keys()].slice(0,2),a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
      const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
      tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
  });
  const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
  svg.addEventListener('dblclick',e=>{if(!e.target.closest('.lbl'))reset();});
});
function reset(){sc=1;tx=0;ty=0;apply();}
$('zin').onclick=()=>zoomAt(1.3,mid());
$('zout').onclick=()=>zoomAt(1/1.3,mid());
$('zreset').onclick=reset;

/* ===================== fullscreen ===================== */
const root=document.documentElement,fsIco=$('fsIco');
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
let pseudo=false;
const setPseudo=v=>{pseudo=v;document.body.classList.toggle('pf',v);fsUpd();};
$('fs').onclick=()=>{
  if(fsEl()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}return;}
  if(pseudo){setPseudo(false);return;}
  const req=root.requestFullscreen||root.webkitRequestFullscreen;
  if(!req||(document.fullscreenEnabled===false&&document.webkitFullscreenEnabled!==true)){setPseudo(true);return;}
  try{const r=req.call(root);if(r&&r.then)r.catch(()=>setPseudo(true));else setTimeout(()=>{if(!fsEl())setPseudo(true);},350);}catch(e){setPseudo(true);}
};
const fsUpd=()=>{const on=!!fsEl()||pseudo;fsIco.setAttribute('d',on?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');$('fs').setAttribute('aria-label',on?'الخروج من ملء الشاشة':'ملء الشاشة');};
document.addEventListener('fullscreenchange',fsUpd);document.addEventListener('webkitfullscreenchange',fsUpd);

go(0);
requestAnimationFrame(frame);
})();
</script>
