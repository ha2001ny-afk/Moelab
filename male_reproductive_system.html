<style>

  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:18px;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav{width:62px;height:62px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:26px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .nav:active{background:#d9ebf7}
  .nav:focus-visible,.dot:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  #dots{display:flex;gap:12px;align-items:center}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .bt{fill:#fff;font-weight:bold;font-size:23px;text-anchor:middle;dominant-baseline:central}
  .cl{fill:#1f3a52;font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .lp rect{fill:#fff;stroke:#1f3a52;stroke-width:2}

  .lp.act text{fill:#fff}

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,D2R=PI/180;
const svg=document.getElementById('svg'),view=document.getElementById('view'),titleEl=document.getElementById('title');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const att=(e,a)=>{for(const k in a)e.setAttribute(k,typeof a[k]==='number'?f1(a[k]):a[k]);};
let seed=11;const rnd=()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rr=(a,b)=>a+(b-a)*rnd();
const ptsD=pts=>pts.map((p,i)=>(i?'L':'M')+f1(p[0])+','+f1(p[1])).join('');

/* pages: [top title, banner colour, banner text] */
const PAGES=[
  ['الجهاز التناسلي الذكري في الإنسان','#2e8b57','مسار النطف: الخصية ← البربخ ← القناة الناقلة ← القناة القاذفة ← الإحليل'],
  ['نطفة الإنسان الناضجة','#2f6fd6','أجزاء النطفة: الرأس ← العنق ← القطعة الوسطية ← الذيل']];
const DUR=[15,10];

const world=G(view,{transform:'translate(0 34)'});

/* tube = dark outline + light core (+ optional highlight) */
function tube(p,d,c,wo,wi,hl){const g=G(p);
  el('path',{d,fill:'none',stroke:c[0],'stroke-width':wo,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  el('path',{d,fill:'none',stroke:c[1],'stroke-width':wi,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  if(hl)el('path',{d,fill:'none',stroke:hl,'stroke-width':1.4,opacity:.75,'stroke-linecap':'round',transform:'translate(-1.2 -.8)'},g);
  return g;}

/* labels: pill + leader line + target dot */
function Label(p,txt,pc,tg){const g=G(p,{class:'lp',opacity:0});
  const ln=el('line',{class:'lead'},g),glow=el('circle',{r:17,fill:'url(#gGlow)',opacity:0},g),
        dot=el('circle',{r:4.5,fill:'#c4623a',stroke:'#fff','stroke-width':1.5},g);
  const pg=G(g),rc=el('rect',{rx:15,y:-16,height:32},pg),tx=el('text',{class:'cl',x:0,y:1},pg);tx.textContent=txt;
  let w=0;try{w=tx.getComputedTextLength();}catch(e){}if(!w)w=txt.length*11;w+=30;
  att(rc,{x:-w/2,width:w});
  return{g,ln,glow,dot,pg,pc,tg,hw:w/2,hh:16};}
function setLabel(L,a,act,t,tg){tg=tg||L.tg;
  if(a<=0){L.g.setAttribute('opacity',0);return;}L.g.setAttribute('opacity',1);
  const dx=tg[0]-L.pc[0],dy=tg[1]-L.pc[1];
  const k=Math.min(1,Math.abs(dx)>.01?L.hw/Math.abs(dx):1e9,Math.abs(dy)>.01?L.hh/Math.abs(dy):1e9);
  const sx=L.pc[0]+dx*k,sy=L.pc[1]+dy*k,dr=sm(a,0,.55);
  att(L.ln,{x1:sx,y1:sy,x2:lerp(sx,tg[0],dr),y2:lerp(sy,tg[1],dr)});
  att(L.dot,{cx:tg[0],cy:tg[1]});L.dot.setAttribute('opacity',f2(sm(a,.45,.6)));
  att(L.glow,{cx:tg[0],cy:tg[1]});L.glow.setAttribute('opacity',f2(act*(.55+.45*Math.sin(t*6))));
  const pa=sm(a,.35,1);L.pg.setAttribute('opacity',f2(pa));
  L.pg.setAttribute('transform',`translate(${f1(L.pc[0])} ${f1(L.pc[1])}) scale(${f2(.6+.4*pa)})`);
  L.g.classList.toggle('act',act>.5);}

/* ================= page 1: male reproductive system ================= */
const A=G(world),body=G(A);
const LV=['#c7781e','#ffc35a'],VAS="M318,624 C312,634 298,632 294,614 C290,590 288,560 288,520 C289,440 296,330 300,240 C303,170 305,110 308,85 C311,60 330,52 345,62 C360,74 372,98 384,120 C402,155 422,195 440,236";
const EPI="M388,530 C376,512 348,510 332,524 C318,538 315,566 318,594 C320,610 322,618 318,624";
const MIR='matrix(-1 0 0 1 900 0)';
const backL=G(body),backR=G(body,{transform:MIR});
function back(g){
  tube(g,'M386,70 C384,52 378,40 371,28',['#c27482','#f2bcc3'],11,6.5,'#fff');}          /* ureter */
back(backL);back(backR);

/* bladder */
el('path',{d:'M340,100 C335,62 400,58 450,60 C500,58 565,62 560,100 C556,170 515,222 470,240 L430,240 C385,222 344,170 340,100Z',fill:'url(#gBlad)',stroke:'#c06a64','stroke-width':2.5},body);
['M360,98 C400,122 500,122 540,98','M368,140 C410,166 490,166 532,140','M392,186 C424,206 476,206 508,186'].forEach(d=>

}

/* penis */
const pen=G(body);
el('path',{d:'M398,482 L400,345 C402,330 412,322 425,322 L475,322 C488,322 498,330 500,345 L502,482 Z',fill:'url(#gPen)',stroke:'#b8657c','stroke-width':2},pen);

for(let i=0;i<34;i++){const y=rr(330,476),x=rr(468,492);if(y>350||Math.abs(x-479)<(y-300)*.5)el('circle',{cx:f1(x),cy:f1(y),r:f1(rr(1.2,2.4)),fill:'#d9809a',opacity:.75},pen);}

/* prostate (right half shown in section) */
el('ellipse',{cx:450,cy:268,rx:54,ry:36,fill:'url(#gPro)',stroke:'#b84a5a','stroke-width':2.4},body);
el('path',{d:'M452,236 A48,30 0 0 1 452,300 Z',fill:'#fbc6c3',opacity:.85},body);
for(let a=-70;a<=70;a+=14){const c=Math.cos(a*D2R),s=Math.sin(a*D2R);
  el('line',{x1:f1(458+c*8),y1:f1(268+s*6),x2:f1(458+c*40),y2:f1(268+s*28),stroke:'#cc5a6a','stroke-width':1.3,opacity:.6},body);}

const frontL=G(body),frontR=G(body,{transform:MIR});
function front(g,section){
  el('ellipse',{cx:360,cy:590,rx:44,ry:56,fill:'#1f3a52',opacity:.13,filter:'url(#blur)'},g);
  if(!section){
    el('ellipse',{cx:360,cy:578,rx:42,ry:56,fill:'url(#gTes)',stroke:'#b8553a','stroke-width':2.5},g);
    el('ellipse',{cx:350,cy:556,rx:14,ry:24,fill:'#fff',opacity:.22},g);
  }else{
    el('ellipse',{cx:360,cy:578,rx:42,ry:56,fill:'#f3a06b',stroke:'#b8553a','stroke-width':2.5},g);
    const c=G(g,{'clip-path':'url(#tclip)'}),M=[346,548];
    el('rect',{x:300,y:510,width:120,height:130,fill:'url(#gSec)'},c);
    const AN=[-25,8,38,66,94,122,150,182,212];
    AN.forEach(a=>el('line',{x1:M[0],y1:M[1],x2:f1(M[0]+110*Math.cos(a*D2R)),y2:f1(M[1]+110*Math.sin(a*D2R)),stroke:'#c4683a','stroke-width':2},c));
    for(let i=0;i<AN.length-1;i++){const b=(AN[i]+AN[i+1])/2*D2R,h=(AN[i+1]-AN[i])/2*D2R,ph=rr(0,6),pts=[];
      for(let r=10;r<=95;r+=1.5){const lat=Math.sin(r*.42+ph)*r*Math.tan(h)*.62;
        pts.push([M[0]+r*Math.cos(b)-lat*Math.sin(b),M[1]+r*Math.sin(b)+lat*Math.cos(b)]);}
      tube(c,ptsD(pts),['#b9581f','#ffa24a'],3.6,1.8);}
    for(let i=0;i<16;i++){const a=rr(0,2*PI),r=rr(0,11);el('circle',{cx:f1(M[0]+r*Math.cos(a)),cy:f1(M[1]+r*Math.sin(a)),r:2.2,fill:'#c4521e'},c);}
    ['M346,548 C352,536 362,528 370,520','M346,548 C346,536 350,526 356,518','M346,548 C340,538 338,530 340,522'].forEach(d=>
      el('path',{d,fill:'none',stroke:'#c4521e','stroke-width':1.6},g));
  }
  const ep=tube(g,EPI,['#c7781e','#ffc760'],17,13);
  el('path',{d:EPI,fill:'none',stroke:'#e39a32','stroke-width':9,'stroke-dasharray':'3 5','stroke-linecap':'round'},ep);
  tube(g,VAS,LV,9,5,'#fff1c2');
  el('path',{d:'M440,236 L447,300',fill:'none',stroke:'#7a2140','stroke-width':3.2,'stroke-linecap':'round'},g);
}
front(frontL,false);front(frontR,true);

/* urethra + bulbourethral (Cowper's) glands */
tube(body,'M450,238 L450,482',['#a8325a','#e47a98'],7.5,3.2);
[[430,314],[470,314]].forEach(([x,y])=>{
  el('path',{d:`M${x},${y} Q${x+(450-x)*.5},${y+4} 450,${y+16}`,fill:'none',stroke:'#a8325a','stroke-width':1.6},body);
  el('circle',{cx:x,cy:y,r:8.5,fill:'url(#gVes)',stroke:'#b37a24','stroke-width':1.8},body);});

/* sperm route (left side; right side is mirrored) */
const ROUTE="M360,592 C358,565 372,540 388,530 C376,512 348,510 332,524 C318,538 315,566 318,594 C320,610 322,618 318,624 "+VAS.replace(/^M[^C]*/,'')+" L447,300 L450,312 L450,484";
const rp=el('path',{d:ROUTE,fill:'none',stroke:'none',opacity:0},A),RL=rp.getTotalLength();
const flow=G(A),SP=[];
for(let s=0;s<2;s++)for(let k=0;k<8;k++){const g=G(flow);
  const tl=el('path',{d:'M-3,0 C-6,-2.6 -8,2.6 -11,0 C-14,-2.6 -16,2.6 -19,0',fill:'none',stroke:'#2f4f8f','stroke-width':1.4,'stroke-linecap':'round'},g);

const L1=[
  ['خصية',[360,658],[360,622]],
  ['نبيبات منوية',[548,658],[528,604]],
  ['بربخ',[342,484],[348,512]],
  ['قناة ناقلة',[170,180],[303,180]],
  ['حويصلة منوية',[742,192],[508,190]],
  ['القناة القاذفة',[168,262],[444,272]],
  ['غدة البروستات',[745,262],[490,262]],
  ['غدتا كوبر',[165,348],[430,314]],
  ['القضيب',[742,412],[480,412]]].map(([t,p,q])=>Label(A,t,p,q));

/* ================= page 2: mature human sperm ================= */
const B=G(world),spG=G(B);
el('ellipse',{cx:470,cy:420,rx:400,ry:22,fill:'#1f3a52',opacity:.06,filter:'url(#blur)'},B);
const X0=372,X1=790,X2=864;
const tEnd=el('path',{fill:'#9dbad1',stroke:'#6b8eab','stroke-width':2,'stroke-linejoin':'round'},spG);
const tMain=el('path',{fill:'#eaa645',stroke:'#b5762b','stroke-width':2.2,'stroke-linejoin':'round'},spG);
const tCore=el('path',{fill:'none',stroke:'#fde4b0','stroke-width':4.5,opacity:.8,'stroke-linecap':'round'},spG);
const tAx=el('path',{fill:'none',stroke:'#c98a35','stroke-width':1.2},spG);
/* midpiece with mitochondrial spiral */
el('rect',{x:270,y:383,width:110,height:34,rx:13,fill:'url(#gMid)',stroke:'#e0743a','stroke-width':2.6},spG);
for(let x=281;x<=370;x+=6.4)el('ellipse',{cx:f1(x),cy:400,rx:3.3,ry:14.5,fill:'none',stroke:'#b52a3c','stroke-width':2.1},spG);
/* neck */
el('path',{d:'M248,388 L276,391 L276,409 L248,412Z',fill:'#2b7a86',stroke:'#1e5c66','stroke-width':1.5},spG);
el('rect',{x:256,y:394,width:7,height:12,rx:2,fill:'#174a52'},spG);
/* head: membrane, nucleus, posterior region */
el('path',{d:'M92,400 C92,350 135,343 182,346 C222,349 244,370 260,386 L260,414 C244,430 222,451 182,454 C135,457 92,450 92,400Z',fill:'#f3a35c',stroke:'#c9702c','stroke-width':2},spG);
el('path',{d:'M101,400 C101,357 139,352 180,354 C214,357 233,374 247,388 L247,412 C233,426 214,443 180,446 C139,448 101,443 101,400Z',fill:'url(#gHead)'},spG);
el('ellipse',{cx:222,cy:400,rx:22,ry:39,fill:'url(#gNk)',opacity:.92},spG);
el('ellipse',{cx:150,cy:378,rx:32,ry:13,fill:'#fff',opacity:.28},spG);

function tailY(x,t){const s=x-X0,A=26*clamp(s/220,0,1)+7*clamp((s-260)/230,0,1);return 400+A*Math.sin(2*PI*s/250-t*5.5);}
function ribbon(xa,xb,wa,wb,t,n){const top=[],bot=[],cen=[];
  for(let i=0;i<=n;i++){const x=lerp(xa,xb,i/n),y=tailY(x,t),dy=(tailY(x+1,t)-tailY(x-1,t))/2,l=Math.hypot(1,dy),nx=-dy/l,ny=1/l,w=lerp(wa,wb,i/n)/2;
    top.push([x+nx*w,y+ny*w]);bot.push([x-nx*w,y-ny*w]);cen.push([x,y]);}
  return{d:ptsD(top.concat(bot.reverse()))+'Z',c:ptsD(cen)};}

const L2=[
  ['الرأس',[160,288],[160,374]],
  ['عنق',[205,548],[262,404]],
  ['قطعة وسطية',[338,522],[328,412]],
  ['ذيل',[600,282],null]].map(([t,p,q])=>Label(B,t,p,q||[600,400]));

/* banner */
const bn=el('rect',{id:'bn',x:40,y:14,width:820,height:58,rx:20,fill:'#2e8b57'}),bt=el('text',{class:'bt',x:450,y:43});

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:1,dur:DUR[0]};
let stage=0,T=0,t0=0,last=performance.now(),paused=false,P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

/* ---------------- render ---------------- */
function render(t){
  const u1=clamp(P,0,1),u2=clamp(P-1,0,1);

  /* ===== page 1 ===== */
  const opA=1-sm(u2,0,.14);
  A.setAttribute('opacity',f2(opA));A.setAttribute('transform',`translate(${f1(-520*sm(u2,0,.16))} 0)`);A.style.display=opA<.01?'none':'';
  if(opA>=.01){
    const intro=sm(u1,0,.07);
    body.setAttribute('opacity',f2(.15+.85*intro));
    body.setAttribute('transform',`translate(450 360) scale(${f2(.94+.06*intro)}) translate(-450 -360)`);
    L1.forEach((L,i)=>{const st=.08+i*.1;setLabel(L,clamp((u1-st)/.06,0,1),(u1>=st&&u1<st+.1&&u1<.995)?1:0,t);});
    const fo=sm(u1,.04,.12);flow.setAttribute('opacity',f2(fo));
    if(fo>.01)SP.forEach(p=>{const q=((t*RL/16)/RL+p.off)%1,s=q*RL;
      const a=rp.getPointAtLength(s),b=rp.getPointAtLength(Math.max(0,s-3));
      let x=a.x,ang=Math.atan2(a.y-b.y,a.x-b.x)/D2R;if(p.side){x=900-x;ang=180-ang;}
      p.g.setAttribute('opacity',f2(sm(q,0,.03)*(1-sm(q,.95,1))));
      p.g.setAttribute('transform',`translate(${f1(x)} ${f1(a.y)}) rotate(${f1(ang)})`);
      p.tl.setAttribute('transform',`scale(1 ${f2(Math.sin(t*14+p.off*20))})`);});
  }

  /* ===== page 2 ===== */
  const opB=sm(u2,.1,.22);
  B.setAttribute('opacity',f2(opB));B.setAttribute('transform',`translate(${f1(560*(1-sm(u2,.1,.28)))} -40)`);B.style.display=opB<.01?'none':'';
  if(opB>=.01){
    const sx=700*(1-sm(u2,.15,.45)),r=1.3*Math.sin(t*5.5+.8),rc=Math.cos(r*D2R),rs=Math.sin(r*D2R);
    spG.setAttribute('transform',`translate(${f1(sx)} 0) rotate(${f2(r)} ${X0} 400)`);
    const m=ribbon(X0,X1,24,13,t,72),e=ribbon(X1-6,X2,9,1.5,t,26);
    tMain.setAttribute('d',m.d);tCore.setAttribute('d',m.c);tAx.setAttribute('d',m.c);tEnd.setAttribute('d',e.d);
    const rot=p=>{const dx=p[0]-X0,dy=p[1]-400;return[X0+dx*rc-dy*rs+sx,400+dx*rs+dy*rc];};
    L2.forEach((L,i)=>{const st=.46+i*.12,tg=i===3?[600,tailY(600,t)]:L.tg;
      setLabel(L,clamp((u2-st)/.07,0,1),(u2>=st&&u2<st+.12&&u2<.995)?1:0,t,rot(tg));});
  }
}
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render(T);requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');
PAGES.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','الصفحة '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);});
function setUI(){titleEl.textContent=PAGES[stage][0];document.title=PAGES[stage][0];
  bn.style.fill=PAGES[stage][1];bt.removeAttribute('textLength');bt.textContent=PAGES[stage][2];
  try{if(bt.getComputedTextLength()>790){bt.setAttribute('textLength',790);bt.setAttribute('lengthAdjust','spacingAndGlyphs');}}catch(e){}
  [...dotsEl.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+PAGES.length)%PAGES.length;const tgt=i+1;
  if(tgt<=P+1e-3)P=i;          /* going back or replaying: restart that page */
  let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  if(tgt-P>1.01)d*=.6;
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1.2,d);
  setUI();}
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(stage-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(stage+1);if(e.key==='ArrowRight')go(stage-1);});
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:400});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:400});
document.getElementById('zreset').onclick=reset;
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
go(0);render(0);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
