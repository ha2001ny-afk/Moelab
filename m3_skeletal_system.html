<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#1f3a52"><title>الجهاز الهيكلي للأنسان</title><style>
:root{--navy:#1f3a52;--orange:#e0552a;--green:#2b8a3e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white;color:var(--navy);font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
#top{position:absolute;top:0;left:0;right:0;height:56px;background:var(--navy);display:flex;justify-content:center;align-items:center;color:white;font-size:clamp(15px,3.5vw,22px);font-weight:700;z-index:9}
#nav{position:absolute;top:56px;left:0;right:0;height:54px;display:flex;justify-content:center;align-items:center;gap:10px;border-bottom:1px solid #e3e8ee;background:white;z-index:9}
#nav button{font-family:inherit;font-weight:bold;font-size:clamp(12px,2.8vw,15px);border:2px solid var(--navy);background:white;color:var(--navy);padding:9px 17px;border-radius:24px;cursor:pointer;transition:background .2s,color .2s}
#nav button.active{background:var(--navy);color:#fff}
#stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff;overflow:hidden}
#sv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sv:active{cursor:grabbing}
#view{transform-origin:0 0}
#controls{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:9px;z-index:7}
#controls button{height:43px;width:43px;border-radius:50%;background:#fff;border:2px solid var(--navy);color:var(--navy);font-size:22px;cursor:pointer;box-shadow:0 3px 7px #0002;display:grid;place-items:center}
#controls button:hover{background:#e8f1f9}
#status{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;border-radius:24px;padding:10px 21px;font-size:clamp(12px,3vw,16px);font-weight:bold;z-index:7;box-shadow:0 6px 20px #0002}
.lab{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .7s cubic-bezier(.25,.8,.3,1);cursor:pointer}
.lab.show{opacity:1;transform:translateY(0)}
.connector{fill:none;stroke:var(--orange);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset 1.15s ease}
.lab.show .connector{stroke-dashoffset:0}
.labelpill{fill:white;stroke:var(--orange);stroke-width:2.2}
.labeltext{fill:#9c3e20;font-size:19px;text-anchor:middle;dominant-baseline:middle;font-weight:700}
.lab:hover .labelpill,.lab.selected .labelpill{fill:var(--orange)}
.lab:hover .labeltext,.lab.selected .labeltext{fill:white}
.hotspot{cursor:pointer;fill:#e0552a;stroke:white;stroke-width:4;opacity:0;transition:opacity .4s,fill .25s}
.hotspot.on{opacity:.9}.hotspot:hover{fill:#2b8a3e}
.halo{fill:none;stroke:#e0552a;stroke-width:5;opacity:0;pointer-events:none}
.halo.animate{animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{0%{opacity:0;r:6}40%{opacity:.9;r:23}100%{opacity:0;r:35}}
#tip{position:absolute;top:13px;left:50%;transform:translateX(-50%);color:#63758a;font-size:clamp(11px,2.7vw,15px);pointer-events:none;white-space:nowrap;z-index:4}
body.fs #top{display:none}body.fs #stage{top:0}.labels-hidden .lab,.labels-hidden .hotspot{opacity:0 !important;pointer-events:none !important}
@media(max-width:700px){#controls{top:9px;left:7px;gap:6px}#controls button{height:37px;width:37px;font-size:19px}#status{bottom:8px;padding:8px 15px}#tip{top:auto;bottom:53px}}
</style></head>

const make=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const key in attrs)e.setAttribute(key,String(attrs[key]));parent.appendChild(e);return e;};

  make('path',{'class':'connector',d:`M ${rightEdge} ${p.ly} L ${left?210:890} ${p.ly} L ${jointX} ${p.y} L ${p.x} ${p.y}`},group);
  make('rect',{'class':'labelpill',x:x-105,y:p.ly-21,width:210,height:42,rx:21},group);
  const txt=make('text',{'class':'labeltext',x,y:p.ly+1},group);txt.textContent=p.name;
  const hot=make('circle',{'class':'hotspot',cx:p.x,cy:p.y,r:11,'data-id':p.id},dots);
  const halo=make('circle',{'class':'halo',cx:p.x,cy:p.y,r:7},dots);
  group.addEventListener('click',e=>{e.stopPropagation();spotlight(p.id)});
  hot.addEventListener('click',e=>{e.stopPropagation();choose(p.id)});
  labelRefs.push({group,hot,halo});
});
let labelsVisible=true,timers=[],shown=0;
function clearTimers(){timers.forEach(clearTimeout);timers=[];}

function reveal(i){const o=labelRefs[i];o.group.classList.add('show');o.hot.classList.add('on');shown=Math.max(shown,i+1)}
function hideAll(){labelRefs.forEach(o=>{o.group.classList.remove('show','selected');o.hot.classList.remove('on');o.halo.classList.remove('animate')});shown=0}
function spotlight(i){const o=labelRefs[i];o.group.classList.add('show','selected');o.hot.classList.add('on');o.halo.classList.remove('animate');void o.halo.getBoundingClientRect();o.halo.classList.add('animate');setMessage(PARTS[i].name);timers.push(setTimeout(()=>o.group.classList.remove('selected'),1550));}
function introduction(){clearTimers();hideAll();setMessage('تظهر التأشيرات بالتتابع — اضغط على أي عظم');PARTS.forEach((p,i)=>timers.push(setTimeout(()=>{reveal(i);if(i===PARTS.length-1)setMessage('اضغط على التأشيرات أو أخفها من زر اليسار')},450+i*850)))}
function choose(i){spotlight(i);}

let sc=1,tx=0,ty=0;

function zoom(factor,point){let next=Math.max(.6,Math.min(5,sc*factor));let k=next/sc;tx=point.x-(point.x-tx)*k;ty=point.y-(point.y-ty)*k;sc=next;apply()}
function center(){return {x:550,y:725}}
function reset(){sc=1;tx=0;ty=0;apply()}
$('zin').onclick=()=>zoom(1.3,center());$('zout').onclick=()=>zoom(1/1.3,center());$('zreset').onclick=reset;
