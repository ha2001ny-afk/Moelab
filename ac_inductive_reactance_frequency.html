<title>نشاط (1) يوضح تأثير تغيير تردد التيار في مقدار رادة الحث</title>
<style>
/* Layout: one full-screen navy lab bench; every control is a physical part of the apparatus */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --pos:#ff6b6b; --neg:#5eaaff; --field:#62d98a; --force:#ffab5c; --accent:#7fd3ff;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --L:max(10px,env(safe-area-inset-left,0px)); --T:max(10px,env(safe-area-inset-top,0px));
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body)}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#ink{pointer-events:none}
#ink.on{pointer-events:auto;cursor:crosshair}
.btn{position:absolute;top:var(--T);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;z-index:3}
.btn[hidden]{display:none}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:20px;height:20px}
.fs{left:var(--L)}
.tipbtn{left:calc(var(--L) + 50px);color:#ffd27a}
.tipbtn svg{width:22px;height:22px}
.tipbtn:hover,.tipbtn.on{border-color:#ffd27a;background:rgba(255,210,122,.14)}
.penbtn{left:calc(var(--L) + 100px)}
.penbtn.on{border-color:var(--accent);background:rgba(127,211,255,.18);color:var(--accent)}
.clrbtn{left:calc(var(--L) + 150px);color:#ff9d9d}
.tabs{position:absolute;top:calc(var(--T) + 50px);left:var(--L);display:flex;gap:6px;z-index:3;max-width:calc(100% - 20px)}
.tab{font:600 12.5px var(--f-body);padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab.on{background:rgba(127,211,255,.18);border-color:var(--accent);color:var(--ink)}
.pal{position:absolute;top:calc(var(--T) + 92px);left:calc(var(--L) + 100px);width:42px;display:grid;gap:8px;justify-items:center;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.8);z-index:3}
.pal[hidden]{display:none}
.pal button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.pal button.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(8,20,41,.9) inset}
.toast{position:absolute;top:calc(var(--T) + 92px);left:var(--L);max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink);z-index:5}
.tip{position:absolute;top:calc(var(--T) + 92px);left:var(--L);width:min(340px,calc(100% - 20px));max-height:calc(100% - 120px);overflow:auto;background:rgba(8,20,41,.94);border:1px solid rgba(255,210,122,.35);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.75;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:4}
.tip h2{margin:0 0 8px;font-family:var(--f-display);font-size:16px;font-weight:600;color:#ffd27a;padding-left:28px;text-wrap:balance}
.tip p{margin:0 0 8px}
.tip .m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.tip p.m{text-align:center;color:var(--accent);font-weight:600}
.tip .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;direction:ltr;justify-content:flex-end}
.tip .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.tip .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.tip .x:hover{color:var(--ink)}
/* no text selection, callout or tap highlight while handling the simulation */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
.stage{touch-action:none}
.tip{touch-action:pan-y}
</style>

<body style="margin:0">

<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="نشاط يوضح تأثير تغير تردد التيار في مقدار رادة الحث: ثلاثة أشكال منفصلة قابلة للتحريك هي الدائرة وأجهزة القياس والمخطط البياني"></canvas>
  <canvas id="ink" aria-hidden="true"></canvas>
  <button class="btn fs" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="btn tipbtn" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
  <button class="btn penbtn" id="penBtn" aria-label="وضع القلم" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L16.5 4a2.1 2.1 0 0 1 3 3L8 18.5 4 20z"/><path d="M14.5 6l3 3"/></svg></button>
  <button class="btn clrbtn" id="clrBtn" aria-label="حذف الكتابة" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
  <div class="tabs" id="tabs">
    <button class="tab on" data-m="circuit" aria-pressed="true">الدائرة</button>
    <button class="tab on" data-m="meters" aria-pressed="true">أجهزة القياس</button>
    <button class="tab on" data-m="graph" aria-pressed="true">المخطط البياني</button>
  </div>
  <div class="pal" id="pal" hidden>
    <button data-c="#ffd27a" style="background:#ffd27a" class="sel" aria-label="أصفر"></button>
    <button data-c="#ff6b6b" style="background:#ff6b6b" aria-label="أحمر"></button>
    <button data-c="#ffffff" style="background:#ffffff" aria-label="أبيض"></button>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
</div>

<script>
(function(){
const toastEl=document.getElementById('toast');let ttm=0;
window.__toast=s=>{toastEl.textContent=s;toastEl.hidden=false;clearTimeout(ttm);ttm=setTimeout(()=>toastEl.hidden=true,2600);};
})();

(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,narrow=false,col={},time=0,drag=null,hover=null;
const cam={z:1,x:0,y:0};
const MONO='ui-monospace, Menlo, Consolas, monospace',SANS='system-ui, Tahoma, sans-serif';
const TOP=104;                       // space kept for the buttons and the scene tabs
const TAU=Math.PI*2;

function readColors(){const cs=getComputedStyle(document.documentElement);
  ['deep','navy','glow','ink','muted','pos','neg','field','force','accent'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,o={}){ctx.font=o.font||'600 13px '+SANS;ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
function sym(main,sub,x,y,color){ctx.font='italic 700 16px '+MONO;const w=ctx.measureText(main).width;ctx.font='600 10.5px '+MONO;const ws=sub?ctx.measureText(sub).width:0;
  const x0=x-(w+ws)/2;ctx.lineWidth=4;ctx.strokeStyle='rgba(8,20,41,.75)';ctx.lineJoin='round';ctx.textBaseline='middle';ctx.textAlign='left';ctx.direction='ltr';
  ctx.font='italic 700 16px '+MONO;ctx.strokeText(main,x0,y);ctx.fillStyle=color;ctx.fillText(main,x0,y);
  if(sub){ctx.font='600 10.5px '+MONO;ctx.strokeText(sub,x0+w+1,y+6);ctx.fillText(sub,x0+w+1,y+6);}}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function arrow(x,y,dx,dy,color,lw){const len=Math.hypot(dx,dy);if(len<6)return;const a=Math.atan2(dy,dx),hs=Math.min(9,len*0.45);
  ctx.strokeStyle=color;ctx.lineWidth=lw||3.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx-Math.cos(a)*hs,y+dy-Math.sin(a)*hs);ctx.stroke();arrowHead(x+dx-Math.cos(a)*hs*0.7,y+dy-Math.sin(a)*hs*0.7,a,hs,color);}
function pulseRing(x,y,r,color,ph){const pu=0.5+0.5*Math.sin(time*5+(ph||0));ctx.beginPath();ctx.arc(x,y,r+pu*5,0,7);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function lcd(cx,y,w,s){rr(cx-w/2,y,w,24,5);ctx.fillStyle='#08160f';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();
  txt(s,cx,y+13,{font:'600 13px '+MONO,color:'#7ef0a4',dir:'ltr'});}
const isLit=k=>hover===k||(drag&&drag.key===k);
function knob(k,lit){const f=(k.get()-k.min)/(k.max-k.min),a0=Math.PI*0.75,ang=a0+f*Math.PI*1.5;
  for(let i=0;i<=12;i++){const a=a0+i/12*Math.PI*1.5;ctx.strokeStyle=i/12<=f+1e-6?col.accent:'rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(k.x+Math.cos(a)*(k.r+4),k.y+Math.sin(a)*(k.r+4));ctx.lineTo(k.x+Math.cos(a)*(k.r+8),k.y+Math.sin(a)*(k.r+8));ctx.stroke();}
  const kg=ctx.createRadialGradient(k.x-6,k.y-7,2,k.x,k.y,k.r);kg.addColorStop(0,'#5a6884');kg.addColorStop(1,'#1f2738');
  ctx.beginPath();ctx.arc(k.x,k.y,k.r,0,7);ctx.fillStyle=kg;ctx.fill();ctx.strokeStyle=lit?col.accent:'rgba(255,255,255,.3)';ctx.lineWidth=1.6;ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(k.x+Math.cos(ang)*5,k.y+Math.sin(ang)*5);ctx.lineTo(k.x+Math.cos(ang)*(k.r-5),k.y+Math.sin(ang)*(k.r-5));ctx.stroke();}
function toggle(s,on,lit,c){rr(s.x-16,s.y-10,32,20,5);ctx.fillStyle='#151b28';ctx.fill();ctx.strokeStyle=lit?col.accent:'rgba(255,255,255,.25)';ctx.lineWidth=1.4;ctx.stroke();
  ctx.save();ctx.translate(s.x,s.y+2);ctx.rotate(on?-0.55:0.55);rr(-3,-22,6,22,3);ctx.fillStyle='#dfe5ee';ctx.fill();ctx.beginPath();ctx.arc(0,-22,5,0,7);ctx.fillStyle=on?c:'#e9edf3';ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(s.x,s.y+2,4,0,7);ctx.fillStyle='#8792a6';ctx.fill();}
function panel(x,y,w,h,lit,r){r=r||12;
  if(lit){rr(x-6,y-6,w+12,h+12,r+4);ctx.strokeStyle=col.accent;ctx.globalAlpha=.5;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
  ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;
  rr(x,y,w,h,r);const bg=ctx.createLinearGradient(0,y,0,y+h);bg.addColorStop(0,'#3d4a63');bg.addColorStop(1,'#232c3e');ctx.fillStyle=bg;ctx.fill();ctx.restore();
  rr(x,y,w,h,r);ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();}
function glass(x,y,w,h,title){rr(x,y,w,h,12);ctx.fillStyle='rgba(8,20,41,.55)';ctx.fill();ctx.strokeStyle='rgba(234,240,250,.16)';ctx.lineWidth=1;ctx.stroke();
  if(title)txt(title,x+w-12,y+14,{font:'600 11.5px '+SANS,color:col.muted,align:'right'});}
const small={font:'500 11px '+SANS};
/* pointer handlers shared by the scenes */
function knobH(k,key){let s0,v0;return{key,cursor:'ns-resize',down(p,s){s0=s;v0=k.get();},move(p,s){const v=v0+((s.x-s0.x)-(s.y-s0.y))*(k.max-k.min)*0.006;k.set(clamp(Math.round(v/k.step)*k.step,k.min,k.max));}};}
const tapH=(fn,key)=>({key,cursor:'pointer',tap:true,down(){fn();}});
const nearK=(p,k)=>Math.hypot(k.x-p.x,k.y-p.y)<k.r+12;
const nearS=(p,s)=>Math.abs(p.x-s.x)<24&&p.y>s.y-30&&p.y<s.y+18;

function drawBg(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(W*0.55,H*0.42,0,W*0.55,H*0.42,Math.max(W,H)*0.75);
  g.addColorStop(0,col.glow);g.addColorStop(0.55,col.navy);g.addColorStop(1,col.deep);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const h=ctx.createRadialGradient(W*0.5,-H*0.1,0,W*0.5,-H*0.1,H*0.7);
  h.addColorStop(0,'rgba(255,255,255,0.10)');h.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=h;ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*cam.x,DPR*cam.y);
}

/* =====================  SHARED STATE  =====================
   Activity 1: a coil of negligible resistance on an oscillator. The voltmeter reading V is held constant
   while the frequency rises:  X_L = 2 pi f L grows in proportion to f, so the ammeter reading I = V / X_L falls.
   The sloshing of the current dots is 100 times slower than f so the eye can follow it. */
const S={V:6,L:50,f:20,on:false,th:0,touched:false};   // L in mH, f in Hz, V and I are meter (effective) readings
const FMIN=20,FMAX=200,XMAX=150,VFS=12;
const disp={I:0,V:0,sw:0};                               // what the needles and the switch blade show (they lag a little)
const XL=()=>TAU*S.f*S.L/1000;
const Ieff=()=>S.on?S.V/XL():0;
/* ammeter range: chosen from V and L only, so turning f sweeps the needle without a range jump */
const IFS=()=>{const m=S.V/(TAU*FMIN*S.L/1000);return[0.2,0.4,1,2,4].find(v=>v>=m-1e-9)||4;};
const fmtI=v=>v.toFixed(v<1?3:2);
function advance(dt){S.th=(S.th+TAU*S.f/100*dt)%TAU;const k=Math.min(1,dt*9);
  disp.I=lerp(disp.I,Ieff(),k);disp.V=lerp(disp.V,S.on?S.V:0,k);disp.sw=lerp(disp.sw,S.on?1:0,Math.min(1,dt*14));}

/* the control panel: frequency, inductance and voltage knobs, the circuit switch, and the two derived readings */
function ctrlParts(b){const y=b.y+64;return{
  kf:{x:b.x+b.w*0.14,y,r:16,min:FMIN,max:FMAX,step:5,get:()=>S.f,set:v=>{S.f=v;S.touched=true;}},
  kL:{x:b.x+b.w*0.40,y,r:16,min:20,max:100,step:10,get:()=>S.L,set:v=>S.L=v},
  kV:{x:b.x+b.w*0.66,y,r:16,min:2,max:10,step:1,get:()=>S.V,set:v=>S.V=v},
  sw:{x:b.x+b.w*0.88,y:b.y+56}};}
function ctrlDraw(b){const c=ctrlParts(b),ly=b.y+101,lw=Math.min(172,b.w*0.47);panel(b.x,b.y,b.w,b.h,false);
  lcd(c.kf.x,b.y+8,70,S.f+' Hz');lcd(c.kL.x,b.y+8,70,S.L+' mH');lcd(c.kV.x,b.y+8,70,S.V+' V');
  knob(c.kf,isLit('kf'));knob(c.kL,isLit('kL'));knob(c.kV,isLit('kV'));
  if(S.on&&!S.touched&&!drag)pulseRing(c.kf.x,c.kf.y,24,col.accent,0);
  sym('f','',c.kf.x,ly,col.accent);sym('L','',c.kL.x,ly,col.field);sym('V','',c.kV.x,ly,col.neg);
  if(!S.on&&!drag)pulseRing(c.sw.x,c.sw.y-6,20,col.accent,0);
  toggle(c.sw,S.on,isLit('sw'),'#7ef0a4');txt('المفتاح',c.sw.x,ly,{...small,color:col.muted});
  lcd(b.x+b.w*0.26,b.y+116,lw,'XL = 2πfL = '+XL().toFixed(2)+' Ω');lcd(b.x+b.w*0.74,b.y+116,lw,S.on?'I = V/XL = '+fmtI(Ieff())+' A':'I = 0 A');}
function ctrlHit(p,b){const c=ctrlParts(b);
  if(nearK(p,c.kf))return knobH(c.kf,'kf');
  if(nearK(p,c.kL))return knobH(c.kL,'kL');
  if(nearK(p,c.kV))return knobH(c.kV,'kV');
  if(nearS(p,c.sw))return tapH(()=>S.on=!S.on,'sw');
  return null;}

/* an analogue meter: sector face, scale 0..fs, needle, digital reading under it */
function dial(cx,cy,R,val,fs,unit,color,read){const a0=Math.PI+0.3,a1=TAU-0.3;
  ctx.beginPath();ctx.moveTo(cx,cy+4);ctx.arc(cx,cy,R+9,a0-0.16,a1+0.16);ctx.closePath();ctx.fillStyle='#0b1830';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R,a0,a1);ctx.strokeStyle=color;ctx.globalAlpha=.8;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
  for(let k=0;k<=20;k++){const a=a0+(a1-a0)*k/20,big=k%5===0,r1=R-(big?9:5);ctx.strokeStyle=big?'#eaf0fa':'rgba(234,240,250,.5)';ctx.lineWidth=big?1.8:1;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.stroke();
    if(big)txt(String(parseFloat((fs*k/20).toFixed(2))),cx+Math.cos(a)*(R-20),cy+Math.sin(a)*(R-20),{font:'600 10px '+MONO,color:col.muted,dir:'ltr'});}
  txt(unit,cx,cy-R*0.36,{font:'700 17px '+MONO,color,dir:'ltr'});
  const a=a0+(a1-a0)*clamp(val/fs,0,1.03);ctx.strokeStyle='#ffd27a';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*(R-7),cy+Math.sin(a)*(R-7));ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.fillStyle='#dfe5ee';ctx.fill();
  lcd(cx,cy+10,104,read);}

function numsHtml(){return `<div class="nums"><span>V = ${S.on?S.V:0} V</span><span>L = ${S.L} mH</span><span>f = ${S.f} Hz</span><span>XL = 2πfL = ${XL().toFixed(2)} Ω</span><span>I = V/XL = ${fmtI(Ieff())} A</span></div>`;}

/* =====================  THE THREE FIGURES  =====================
   Each figure is its own bench panel: drag it by any free part to move it, drag its bottom-left corner to resize it.
   All of them read the same f, L and V, so they always agree. Panels draw in their own local coordinates. */
let arranged=false,focus='circuit',order=['circuit','meters','graph','ctrl'];
const PN={
  /* --- figure 13: coil, ammeter and oscillator in series, the voltmeter across the coil, and a switch --- */
  circuit:{show:true,x:0,y:0,w:360,h:190,sc:1,off:0,

function arrange(){const avail=H-TOP-10,c=PN.circuit,me=PN.meters,gr=PN.graph,ct=PN.ctrl;
  if(narrow){const colw=Math.min(W-24,480);
    c.w=colw;c.h=190;me.w=colw;me.h=130;gr.w=colw;gr.h=170;ct.w=Math.min(colw,460);ct.h=148;
    const k=clamp(avail/(c.h+me.h+gr.h+ct.h+24),0.6,1),x0=(W-colw*k)/2;let y=TOP;
    [c,me,gr,ct].forEach(p=>{p.sc=k;p.x=x0+(colw-p.w)*k/2;p.y=y;y+=(p.h+8)*k;});
  }else{const cw=Math.min(520,W-430);c.w=cw;c.h=230;me.w=cw;me.h=212;gr.w=380;gr.h=286;ct.w=380;ct.h=148;
    const k=clamp(avail/(c.h+8+me.h),0.6,1),x0=(W-(cw+16+380)*k)/2;
    c.sc=me.sc=gr.sc=ct.sc=k;c.x=me.x=x0;c.y=TOP;me.y=TOP+(c.h+8)*k;gr.x=ct.x=x0+(cw+16)*k;gr.y=TOP;ct.y=TOP+(gr.h+8)*k;}
  order=['circuit','meters','graph','ctrl'];}
function toFront(id){order=order.filter(o=>o!==id);order.push(id);if(id!=='ctrl')focus=id;}

function moveH(P){let ox,oy;return{pid:P.id,key:'mv'+P.id,cursor:'move',down(p){ox=p.x-P.x;oy=p.y-P.y;arranged=true;},move(p){P.x=p.x-ox;P.y=p.y-oy;}};}

function hitAll(p){for(let i=order.length-1;i>=0;i--){const P=PN[order[i]];if(!P.show)continue;
    const L=q=>({x:(q.x-P.x)/P.sc,y:(q.y-P.y)/P.sc}),l=L(p);if(l.x<0||l.x>P.w||l.y<0||l.y>P.h)continue;

function explainAll(){const nums=numsHtml();

  if(focus==='graph')return{t:'المخطط البياني: خط مستقيم يمر بنقطة الأصل',b:`<p>العلاقة بين رادة الحث <span class="m">X<sub>L</sub></span> وتردد التيار <span class="m">f</span> علاقة طردية، لذلك يكون مخططها خطاً مستقيماً يمر بنقطة الأصل:</p><p class="m">X<sub>L</sub> ∝ f</p><p>هذا بثبوت معامل الحث الذاتي <span class="m">L</span>. ميل الخط يساوي <span class="m">2πL</span>، فإذا أدرت مفتاح <span class="m">L</span> تغيّر ميل الخط: ملف بحثّ أكبر يعطي خطاً أشد انحداراً.</p><p>المنحني المتقطع الأزرق يبين قراءة الأميتر: تهبط كلما صعدت رادة الحث. اسحب النقطة على المخطط لتغيير التردد.</p>${nums}`};

  return{t:'بزيادة التردد تنقص قراءة الأميتر',b:`<p>الفولطية بين طرفي الملف بقيت ثابتة (قراءة الفولطميتر لم تتغير)، ومع ذلك نقص التيار عند زيادة التردد. معنى ذلك أن معاكسة الملف للتيار، أي رادة الحث، قد ازدادت:</p><p class="m">X<sub>L</sub> = 2πfL</p><p class="m">I = V / X<sub>L</sub></p><p>نستنتج أن رادة الحث <span class="m">X<sub>L</sub></span> تتناسب طردياً مع تردد التيار <span class="m">f</span> بثبوت معامل الحث الذاتي <span class="m">L</span>.</p><p>جرّب: ضاعِف التردد ولاحظ أن <span class="m">X<sub>L</sub></span> تتضاعف وقراءة الأميتر تنزل إلى النصف.</p>${nums}`};}

/* ---------- fullscreen ---------- */
(function(){const b=document.getElementById('fsBtn'),ico=document.getElementById('fsIco'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const toast=()=>window.__toast('ملء الشاشة غير متاح هنا. افتح الملف أو الرابط بالمتصفح');
  const sync=()=>{ico.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');b.setAttribute('aria-label',isFs()?'الخروج من ملء الشاشة':'ملء الشاشة');};
  b.addEventListener('click',()=>{
    if(isFs()){try{exit.call(document);}catch(e){}return;}
    if(!req||document.fullscreenEnabled===false){toast();return;}
    try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(toast);setTimeout(()=>{if(!isFs())toast();},700);}catch(e){toast();}});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);})();

/* ---------- lamp hint panel ---------- */
(function(){const b=document.getElementById('tipBtn'),p=document.getElementById('tipPanel'),t=document.getElementById('tipTitle'),body=document.getElementById('tipBody');
  let iv=0,last='';
  const fill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===last)return;last=h;t.textContent=r.t;body.innerHTML=r.b;};
  const open=v=>{p.hidden=!v;b.setAttribute('aria-expanded',v);b.classList.toggle('on',v);clearInterval(iv);if(v){last='';fill();iv=setInterval(fill,400);}};
  b.addEventListener('click',()=>open(p.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>open(false));})();

/* ---------- pen mode: write over the simulation, clear the writing ---------- */
(function(){const ink=document.getElementById('ink'),ix=ink.getContext('2d'),pb=document.getElementById('penBtn'),cb=document.getElementById('clrBtn'),pal=document.getElementById('pal');
  let on=false,strokes=[],cur=null,color='#ffd27a',dpr=1;
  function seg(s,from){const p=s.p,i0=Math.max(0,from-1);ix.setTransform(dpr,0,0,dpr,0,0);ix.lineCap='round';ix.lineJoin='round';ix.strokeStyle=s.c;ix.lineWidth=3.2;
    ix.beginPath();ix.moveTo(p[i0].x,p[i0].y);if(p.length===1)ix.lineTo(p[0].x+0.1,p[0].y);for(let i=i0+1;i<p.length;i++)ix.lineTo(p[i].x,p[i].y);ix.stroke();}
  function redraw(){ix.setTransform(1,0,0,1,0,0);ix.clearRect(0,0,ink.width,ink.height);strokes.forEach(s=>seg(s,0));}
  function size(){const w=ink.clientWidth,h=ink.clientHeight;if(!w||!h)return;dpr=window.devicePixelRatio||1;ink.width=Math.round(w*dpr);ink.height=Math.round(h*dpr);redraw();}
  function sync(){ink.classList.toggle('on',on);pb.classList.toggle('on',on);pb.setAttribute('aria-pressed',on);pal.hidden=!on;cb.hidden=!(on||strokes.length);}
  const pos=e=>{const r=ink.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  pb.addEventListener('click',()=>{on=!on;sync();});
  cb.addEventListener('click',()=>{strokes=[];cur=null;redraw();sync();});
  pal.addEventListener('click',e=>{const c=e.target.dataset&&e.target.dataset.c;if(!c)return;color=c;[...pal.children].forEach(x=>x.classList.toggle('sel',x===e.target));});
  ink.addEventListener('pointerdown',e=>{if(!on)return;e.preventDefault();ink.setPointerCapture(e.pointerId);cur={c:color,p:[pos(e)],id:e.pointerId};strokes.push(cur);seg(cur,0);});
  ink.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==cur.id)return;const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e],n=cur.p.length;(ev.length?ev:[e]).forEach(x=>cur.p.push(pos(x)));seg(cur,n);});
  const end=e=>{if(cur&&e.pointerId===cur.id)cur=null;};
  ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);
  new ResizeObserver(size).observe(ink);size();sync();})();

/* ---------- block text selection and the copy/paste callout on touch devices ---------- */
(function(){const stop=e=>e.preventDefault();
  ['selectstart','contextmenu','dragstart'].forEach(ev=>document.addEventListener(ev,stop));
  document.querySelectorAll('canvas').forEach(c=>c.addEventListener('touchstart',stop,{passive:false}));
  document.addEventListener('selectionchange',()=>{const s=window.getSelection&&window.getSelection();if(s&&s.rangeCount&&!s.isCollapsed)s.removeAllRanges();});})();
</script>
