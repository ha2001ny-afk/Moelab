<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>تعاليل وزارية — التلقائية وفق علاقة كبس</title>
<style>
:root{--bg0:#081429;--bg1:#10264a;--bg2:#1d3d6e;--ink:#eaf0fa;--mut:#a3b3cc;--acc:#7fd3ff;--gold:#ffd27a;--plus:#ff9a6b;--minus:#6fd0ff;--ok:#7fe8bb;--bad:#ff8a8a;--line:rgba(127,211,255,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg0)}
body{background:radial-gradient(ellipse at 50% 25%,var(--bg2) 0%,var(--bg1) 45%,var(--bg0) 100%)}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(156,197,233,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(156,197,233,.04) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column;padding:10px 16px 10px;gap:10px}
/* الشريط العلوي */
.top{display:flex;align-items:center;gap:12px;position:relative;z-index:30;flex:0 0 auto}
.brand{margin-inline-end:auto;font-size:16px;font-weight:800;color:var(--acc)}
.brand span{color:var(--mut);font-weight:600;font-size:12.5px;margin-inline-start:8px}
.tools{display:flex;gap:4px;align-items:center;background:rgba(8,20,41,.8);border:1px solid var(--line);border-radius:14px;padding:4px}
.tb{width:40px;height:40px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.tb:hover{background:rgba(127,211,255,.1)}
.tb[aria-pressed="true"]{background:rgba(127,211,255,.18);border-color:rgba(127,211,255,.6);color:var(--acc)}
.tb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;height:26px;background:var(--line);margin:0 3px}
.penx{display:none;gap:6px;align-items:center}
.penx.on{display:flex}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{transform:scale(1.2);border-color:#fff}
.sz{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{background:rgba(127,211,255,.18);border-color:rgba(127,211,255,.6)}
/* بطاقة السؤال */
.qcard{flex:0 0 auto;position:relative;z-index:5;display:flex;align-items:center;gap:18px;background:rgba(8,20,41,.85);border:1.5px solid rgba(255,210,122,.55);border-radius:18px;padding:14px 20px;box-shadow:0 12px 36px rgba(0,0,0,.35)}
.qnum{flex:0 0 auto;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:24px;font-weight:900;color:#2a1d00;background:linear-gradient(135deg,#ffe3a1,#e9b955)}
.qbody{flex:1;min-width:0}
.qtext{font-size:clamp(17px,1.75vw,25px);line-height:1.55;font-weight:800;margin:0}
.qeq{direction:ltr;text-align:right;font-family:"Cambria Math","Times New Roman",serif;color:var(--acc);font-size:clamp(17px,1.7vw,24px);margin-top:2px}
.years{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;padding-inline-start:16px;border-inline-start:1px dashed rgba(255,210,122,.4)}
.years small{font-size:11.5px;color:var(--gold);font-weight:700}
.years div{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:220px}
.years b{background:rgba(255,210,122,.14);border:1px solid rgba(255,210,122,.6);color:var(--gold);font-size:13.5px;padding:3px 10px;border-radius:20px;white-space:nowrap}
/* منطقة الحل */
.sol{flex:1 1 auto;min-height:0;position:relative;z-index:5;border-radius:18px;background:rgba(8,20,41,.45);border:1px solid var(--line);overflow:hidden}
#fit{position:absolute;top:0;left:50%;transform-origin:top center}
.row{display:grid;grid-template-columns:auto auto auto;gap:22px;align-items:stretch;justify-content:center;padding:0}
.rows{display:flex;flex-direction:column;gap:22px;padding:20px 24px 22px}
.rtitle{grid-column:1/-1;justify-self:start;font-size:20px;font-weight:800;color:var(--gold);background:rgba(255,210,122,.1);border:1px solid rgba(255,210,122,.45);padding:4px 18px;border-radius:12px;margin-bottom:-8px}
.card .ch{margin-bottom:2px}
.card{justify-content:flex-start;background:linear-gradient(180deg,rgba(20,44,82,.7),rgba(10,24,48,.75));border:1px solid rgba(127,211,255,.22);border-radius:18px;padding:16px 22px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;color:var(--acc)}
.ch i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(127,211,255,.18);border:1px solid rgba(127,211,255,.6);font-size:15px}
.st{opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .4s,transform .4s,visibility 0s .4s}
.st.vis{opacity:1;visibility:visible;transform:none;transition:opacity .4s,transform .4s}
.fact{display:grid;grid-template-columns:58px 42px auto;align-items:center;column-gap:12px;font-size:23px}
.fact .why{line-height:1.35;max-width:330px}
.fact em{display:block;font-style:normal;color:var(--mut);font-size:16px}
.sym{direction:ltr;text-align:left;font-family:"Cambria Math","Times New Roman",serif;font-style:italic;font-weight:700;font-size:27px}
.sg{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:11px;font-weight:900;font-size:27px;font-family:"Times New Roman",serif;line-height:1}
.sg.p{background:rgba(255,154,107,.16);color:var(--plus);border:1.5px solid rgba(255,154,107,.65)}
.sg.m{background:rgba(111,208,255,.14);color:var(--minus);border:1.5px solid rgba(111,208,255,.6)}
.math{direction:ltr;display:flex;align-items:flex-start;justify-content:center;gap:20px;font-family:"Cambria Math","Times New Roman",serif;font-size:44px;font-weight:700;padding:6px 6px 0}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.col .t{font-style:italic;white-space:nowrap;line-height:1.1}
.col .op{font-style:normal}
.col .u{height:40px;display:grid;place-items:center}
.mt{position:relative;display:grid;grid-template-rows:auto 40px 40px;row-gap:10px;justify-items:center}
.mt .t{font-style:italic;white-space:nowrap;line-height:1.1}.mt .op{font-style:normal}
.mt .sS{justify-self:end}
.arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.arc path{fill:none;stroke:var(--gold);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset .8s .15s}
.vis .arc path{stroke-dashoffset:0}
.mt .tsig{opacity:0;transform:scale(.6);transition:.4s .8s}
.vis .mt .tsig{opacity:1;transform:none}
.gsig{opacity:0;transition:opacity .4s}
.gsig.on{opacity:1}
.calc{text-align:center;font-size:17px;color:var(--gold);margin-top:16px}
.calc span{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Consolas,monospace}
.why2{font-size:18px;color:var(--mut);line-height:1.55;max-width:420px;border-top:1px dashed rgba(127,211,255,.25);padding-top:10px;margin-top:auto}
.why2 b{color:var(--gold)}
.cmp{max-width:460px;direction:ltr;display:flex;align-items:center;justify-content:center;gap:16px;font-family:"Cambria Math","Times New Roman",serif;font-size:40px;font-weight:700;padding:8px 14px;border-radius:14px;background:rgba(255,210,122,.06);border:1px solid rgba(255,210,122,.3)}
.cmp .c{display:flex;flex-direction:column;align-items:center;gap:6px}
.cmp .rel{color:var(--gold)}
.cmp .ar{color:var(--gold);font-size:.85em}
.abs{font-size:14px;color:var(--mut);text-align:center}
.concl{max-width:460px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:23px;font-weight:800;padding:12px 18px;border-radius:14px;text-align:center;line-height:1.4}
.concl.ok{background:rgba(127,232,187,.12);border:1.5px solid rgba(127,232,187,.75);color:var(--ok)}
.concl.bad{background:rgba(255,138,138,.1);border:1.5px solid rgba(255,138,138,.75);color:var(--bad)}
.concl .l{direction:ltr;unicode-bidi:isolate;font-family:"Cambria Math","Times New Roman",serif;white-space:nowrap}
.rows.multi{flex-direction:row;align-items:flex-start;justify-content:center}
.multi .row{grid-template-columns:auto auto;grid-template-rows:auto auto 1fr;gap:16px}
.multi .row .card:nth-of-type(2){grid-column:1;grid-row:2}
.multi .row .card:nth-of-type(3){grid-column:1;grid-row:3}
.multi .row .card:nth-of-type(4){grid-column:2;grid-row:2/4}
.multi .rtitle{margin-bottom:0}
.narrow .rows.multi{flex-direction:column}
.narrow .multi .row{grid-template-columns:1fr}
.narrow .multi .row .card{grid-column:auto!important;grid-row:auto!important}
/* الشريط السفلي */
.bottom{flex:0 0 auto;display:flex;align-items:center;gap:12px;position:relative;z-index:30}
.qtabs{flex:1;display:flex;gap:6px;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:2px}
.qtabs button{flex:0 0 auto;min-width:46px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.85);color:var(--ink);font-size:14.5px;font-weight:700;cursor:pointer;padding:0 10px}
.qtabs button[aria-selected="true"]{background:rgba(127,211,255,.2);border-color:var(--acc);color:var(--acc)}
.nav{display:flex;align-items:center;gap:8px;background:rgba(8,20,41,.85);border:1px solid var(--line);border-radius:30px;padding:4px}
.arr{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(127,211,255,.6);background:rgba(127,211,255,.08);color:var(--acc);display:grid;place-items:center;cursor:pointer}
.arr.next{background:linear-gradient(135deg,rgba(127,211,255,.35),rgba(8,20,41,.9))}
.arr:disabled{opacity:.3;cursor:default}
.arr svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cnt{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--mut);direction:ltr;min-width:44px;text-align:center}
#ink{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(8,20,41,.95);border:1px solid var(--line);padding:9px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
/* شاشات ضيقة (موبايل بالطول): الحل يتكدس عمودياً */
.narrow .row{grid-template-columns:1fr}
.narrow .rows{padding:14px 12px}
@media (max-width:700px){
  .app{padding:8px 8px 8px;gap:8px}.brand span{display:none}.brand{font-size:14px}.tb{width:36px;height:36px}
  .qcard{flex-wrap:wrap;padding:12px 14px;gap:10px}.qnum{width:40px;height:40px;font-size:19px;border-radius:12px}
  .years{order:-1;width:100%;flex-direction:row;padding:0 0 6px;border:none;border-bottom:1px dashed rgba(255,210,122,.4)}.years div{max-width:none;justify-content:flex-start}
  .bottom{flex-wrap:wrap;justify-content:center}.qtabs{order:2;flex-basis:100%;justify-content:flex-start}
  .penx.on{position:absolute;top:48px;left:0;background:rgba(8,20,41,.95);border:1px solid var(--line);border-radius:12px;padding:6px}
}
@media (max-height:520px){
  .app{padding:6px 10px;gap:6px}.brand{display:none}.top{position:absolute;top:6px;left:10px}
  .qcard{padding:8px 14px;margin-left:190px}.qnum{width:38px;height:38px;font-size:18px}.qtext{font-size:15.5px}.qeq{font-size:16px}.years b{font-size:11.5px;padding:2px 7px}
  .arr{width:38px;height:38px}.qtabs button{height:34px;min-width:40px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">تعاليل وزارية: التلقائية وفق علاقة كبس<span>كيمياء السادس العلمي • الفصل الأول</span></div>
    <div class="tools" role="toolbar" aria-label="أدوات السبورة">
      <div class="penx" id="penx">
        <button class="sw" data-c="#ffffff" style="background:#ffffff" aria-label="أبيض"></button>
        <button class="sw" data-c="#ffd27a" style="background:#ffd27a" aria-label="أصفر" aria-pressed="true"></button>
        <button class="sw" data-c="#ff5a5a" style="background:#ff5a5a" aria-label="أحمر"></button>
        <button class="sw" data-c="#5ee89a" style="background:#5ee89a" aria-label="أخضر"></button>
        <button class="sw" data-c="#56c2ff" style="background:#56c2ff" aria-label="أزرق"></button>
        <span class="sep"></span>
        <button class="sz" data-w="3" aria-label="خط رفيع" aria-pressed="true"><i style="width:5px;height:5px"></i></button>
        <button class="sz" data-w="7" aria-label="خط سميك"><i style="width:11px;height:11px"></i></button>
        <span class="sep"></span>
      </div>
      <button class="tb" id="pen" aria-pressed="false" aria-label="قلم" title="قلم"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
      <button class="tb" id="eraser" aria-pressed="false" aria-label="ممحاة" title="ممحاة"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.5 15.5l9-9a2 2 0 012.8 0l3.2 3.2a2 2 0 010 2.8L13 19H8.5z"/><path d="M9 11l5 5"/></svg></button>
      <button class="tb" id="clear" aria-label="مسح كل الكتابة" title="مسح كل الكتابة"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      <span class="sep"></span>
      <button class="tb" id="fs" aria-label="ملء الشاشة" title="ملء الشاشة"><svg viewBox="0 0 24 24"><path id="fsPath" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>
  <section class="qcard">
    <div class="qnum" id="qnum">1</div>
    <div class="qbody"><p class="qtext" id="qtext"></p><div class="qeq" id="qeq"></div></div>
    <div class="years"><small>وزاري</small><div id="years"></div></div>
  </section>
  <main class="sol" id="sol" aria-live="polite"><div id="fit"></div></main>
  <footer class="bottom">
    <nav class="qtabs" id="qtabs" role="tablist" aria-label="الأسئلة"></nav>
    <div class="nav">
      <button class="arr" id="prev" aria-label="الخطوة السابقة" title="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <span class="cnt" id="cnt">0 / 0</span>
      <button class="arr next" id="next" aria-label="الخطوة التالية" title="التالي"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
  </footer>
  <canvas id="ink"></canvas>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const Q=[
 {years:['2016 ت','2020 د1','2017 د1'],q:'علل: لا تتفكك كاربونات الكالسيوم بدرجات الحرارة الاعتيادية، وضح ذلك وفق علاقة كبس.',
  eq:'CaCO<sub>3(s)</sub> → CaO<sub>(s)</sub> + CO<sub>2(g)</sub>',
  parts:[{G:'p',S:'p',H:'p',g:'التفكك غير تلقائي',s:'زيادة العشوائية',sx:'(صلب ← صلب + غاز)',h:'ماص للحرارة',hx:'(تفكك)',
    why:'عند درجات الحرارة <b>الاعتيادية</b> تكون <b>T</b> واطئة فيكون مقدار الحد <b>T.ΔS</b> صغيراً وأقل من مقدار <b>ΔH</b>',cmp:'>',
    concl:'إذن لا تتفكك كاربونات الكالسيوم في درجات الحرارة الاعتيادية'}]},
 {years:['2018 ت','2021 د2','2017 ت','2020 ت','2019 ت'],q:'عملية انصهار الجليد تلقائية في الظروف الاعتيادية، وضح ذلك وفق علاقة كبس.',
  eq:'H<sub>2</sub>O<sub>(s)</sub> → H<sub>2</sub>O<sub>(l)</sub>',
  parts:[{G:'m',S:'p',H:'p',g:'انصهار الجليد تلقائي',s:'زيادة العشوائية',sx:'(صلب ← سائل)',h:'ماص للحرارة',hx:'(انصهار)',
    why:'في الظروف <b>الاعتيادية</b> (أعلى من 0°C) تكون <b>T</b> كبيرة بما يكفي فيصبح مقدار <b>T.ΔS</b> أكبر من مقدار <b>ΔH</b>',cmp:'<',
    concl:'إذن انصهار الجليد تلقائي في الظروف الاعتيادية'}]},
 {years:['2023 د3','2025 ت'],q:'يجري التفاعل التالي تلقائياً عند درجات الحرارة العالية، وضح ذلك وفق علاقة كبس.',
  eq:'2HgO<sub>(s)</sub> → 2Hg<sub>(l)</sub> + O<sub>2(g)</sub>',
  parts:[{G:'m',S:'p',H:'p',g:'تلقائي',s:'زيادة العشوائية',sx:'(تحول من صلب إلى سائل وغاز)',h:'ماص للحرارة',hx:'(لأنه تفكك)',
    why:'عند درجات الحرارة <b>العالية</b> تكون <b>T</b> كبيرة فيصبح مقدار <b>T.ΔS</b> أكبر من مقدار <b>ΔH</b>',cmp:'<',
    concl:'إذن التفكك تلقائي عند درجات الحرارة العالية'}]},
 {years:['2023 د1'],q:'يكون تفكك كلوريد الأمونيوم NH<sub>4</sub>Cl تلقائياً عند درجات الحرارة العالية، وضح ذلك على ضوء علاقة كبس.',
  eq:'NH<sub>4</sub>Cl<sub>(s)</sub> → NH<sub>3(g)</sub> + HCl<sub>(g)</sub>',
  parts:[{G:'m',S:'p',H:'p',g:'تلقائي',s:'زيادة العشوائية',sx:'(صلب ← غازات)',h:'ماص للحرارة',hx:'(تفكك)',
    why:'عند درجات الحرارة <b>العالية</b> تكون <b>T</b> كبيرة فيصبح مقدار <b>T.ΔS</b> أكبر من مقدار <b>ΔH</b>',cmp:'<',
    concl:'إذن التفكك تلقائي عند درجات الحرارة العالية'}]},
 {years:['2014 د1','2018 د1','2020 د2','2023 د2','2022 د2'],q:'لا ينجمد الماء تحت الظروف الاعتيادية، وضح ذلك وفق علاقة كبس.',
  eq:'H<sub>2</sub>O<sub>(l)</sub> → H<sub>2</sub>O<sub>(s)</sub>',
  parts:[{G:'p',S:'m',H:'m',g:'غير تلقائي',s:'نقصان العشوائية',sx:'(سائل ← صلب)',h:'باعث للحرارة',hx:'(انجماد)',
    why:'في الظروف <b>الاعتيادية</b> تكون <b>T</b> كبيرة فيصبح مقدار <b>T.ΔS</b> أكبر من مقدار <b>ΔH</b>',cmp:'<',
    concl:'إذن الماء لا ينجمد في الظروف الاعتيادية'}]},
 {years:['2017 د2 موصل'],q:'ينجمد الماء تلقائياً بدرجات الحرارة المنخفضة جداً وليس بالظروف الاعتيادية، وضح حسب علاقة كبس.',
  eq:'H<sub>2</sub>O<sub>(l)</sub> → H<sub>2</sub>O<sub>(s)</sub>',
  parts:[{title:'عند درجات الحرارة المنخفضة جداً',G:'m',S:'m',H:'m',g:'التجمد تلقائي',s:'نقصان العشوائية',sx:'',h:'باعث للحرارة',hx:'',
    why:'عند درجات الحرارة <b>المنخفضة</b> تكون <b>T</b> صغيرة فيكون مقدار <b>T.ΔS</b> أقل من مقدار <b>ΔH</b>',cmp:'>',
    concl:'إذن تجمد الماء تلقائي في درجات الحرارة المنخفضة'},
   {title:'في الظروف الاعتيادية',G:'p',S:'m',H:'m',g:'التجمد غير تلقائي',s:'نقصان العشوائية',sx:'',h:'باعث للحرارة',hx:'',
    why:'في الظروف <b>الاعتيادية</b> تكون <b>T</b> كبيرة فيصبح مقدار <b>T.ΔS</b> أكبر من مقدار <b>ΔH</b>',cmp:'<',
    concl:'إذن الماء لا يتجمد تلقائياً في الظروف الاعتيادية'}]},
 {years:['2014 ت'],q:'ذوبان ملح الطعام في الماء عملية تلقائية وهي ماصة للحرارة، علل ذلك في ضوء علاقة كبس.',
  eq:'NaCl<sub>(s)</sub> → NaCl<sub>(aq)</sub>',
  parts:[{G:'m',S:'p',H:'p',g:'عملية تلقائية',s:'زيادة العشوائية',sx:'(ذوبان صلب في سائل)',h:'ماص للحرارة',hx:'',
    why:'الزيادة في العشوائية كبيرة فيكون مقدار <b>T.ΔS</b> أكبر من مقدار <b>ΔH</b> (حرارة الذوبان صغيرة)',cmp:'<',
    concl:'لذلك ΔG سالبة وذوبان الملح تلقائي'}]},
 {years:['2021 د1'],q:'يجري التفاعل التالي تلقائياً عند درجات الحرارة المنخفضة، وضح ذلك وفق علاقة كبس.',
  eq:'NH<sub>3(g)</sub> + HCl<sub>(g)</sub> → NH<sub>4</sub>Cl<sub>(s)</sub>',
  parts:[{G:'m',S:'m',H:'m',g:'تلقائي عند درجة الحرارة المنخفضة',s:'نقصان الانتروبي',sx:'(تحول من غازات (أعلى انتروبي) إلى مادة صلبة (أقل انتروبي))',h:'باعث للحرارة',hx:'(لأنه يمثل تكوين مادة NH₄Cl)',
    why:'عند درجات الحرارة <b>المنخفضة</b> تكون <b>T</b> صغيرة فيكون مقدار <b>T.ΔS</b> أقل من مقدار <b>ΔH</b>',cmp:'>',
    concl:'فعليه تكون ΔG سالبة والتفاعل تلقائي'}]},
 {years:['2024 د2'],q:'يذوب غاز SO<sub>2</sub> في الماء تلقائياً ويبعث حرارة أثناء عملية ذوبانه، وضح ذلك وفق علاقة كبس.',
  eq:'SO<sub>2(g)</sub> → SO<sub>2(aq)</sub>',
  parts:[{G:'m',S:'m',H:'m',g:'تلقائي',s:'نقصان العشوائية',sx:'(ذوبان غاز في سائل)',h:'باعث للحرارة',hx:'',
    why:'الحرارة المنبعثة كبيرة فيكون مقدار <b>ΔH</b> أكبر من مقدار <b>T.ΔS</b>',cmp:'>',
    concl:'إذن عملية الذوبان تلقائية'}]}
];

const $=id=>document.getElementById(id);
const neg=x=>x==='p'?'m':'p';
const SG=x=>`<span class="sg ${x}">${x==='p'?'+':'−'}</span>`;
const SGt=x=>x==='p'?'+':'−';
let qi=0, step=0, steps=[];
const fitEl=$('fit'), solEl=$('sol');
function build(d){
  fitEl.innerHTML='';steps=[];
  const rows=document.createElement('div');rows.className='rows'+(d.parts.length>1?' multi':'');fitEl.appendChild(rows);
  d.parts.forEach(p=>{
    const tS=neg(p.S);
    const row=document.createElement('div');row.className='row';rows.appendChild(row);
    let title=null;if(p.title){title=document.createElement('div');title.className='rtitle st';title.textContent=p.title;row.appendChild(title)}
    const card=(n,h)=>{const c=document.createElement('div');c.className='card st';c.innerHTML=`<div class="ch"><i>${n}</i>${h}</div>`;row.appendChild(c);return c};
    const add=(c,html,extra)=>{const e=document.createElement('div');e.className='st';e.innerHTML=html;c.appendChild(e);const o={el:e,card:c,title,...extra};steps.push(o);return o};
    const c1=card(1,'الإشارات'), c2=card(2,'علاقة كبس'), c3=card(3,'المقارنة والاستنتاج');
    const fact=(sym,sg,t,x)=>`<div class="fact"><span class="sym">${sym}</span>${SG(sg)}<span class="why">${t}${x?`<em>${x}</em>`:''}</span></div>`;
    add(c1,fact('ΔG',p.G,p.g,''));
    add(c1,fact('ΔS',p.S,p.s,p.sx));
    add(c1,fact('ΔH',p.H,p.h,p.hx));
    const eq=add(c2,`<div class="math">
        <div class="col"><span class="t">ΔG</span><span class="u gsig">${SG(p.G)}</span></div>
        <div class="col"><span class="t op">=</span></div>
        <div class="col"><span class="t">ΔH</span><span class="u">${SG(p.H)}</span></div>
        <div class="mt"><span class="t"><span class="op">−</span>&thinsp;T.ΔS</span><span class="sS">${SG(p.S)}</span>
          <svg class="arc" viewBox="0 0 120 120" preserveAspectRatio="none"><path vector-effect="non-scaling-stroke" d="M8 24 C 4 60, 22 64, 58 58"/></svg>
          <span class="tsig">${SG(tS)}</span></div>
      </div><div class="calc">إشارة الحد <span>−T.ΔS</span> : <span>(−) × (${SGt(p.S)}) = (${SGt(tS)})</span></div>`,{eq:true});
    const whyEl=document.createElement('div');whyEl.className='st why2';whyEl.innerHTML=p.why;c2.appendChild(whyEl);
    const cm=add(c3,`<div class="cmp"><div class="c"><span>ΔH</span>${SG(p.H)}</div><span class="rel">${p.cmp}</span><div class="c"><span>T.ΔS</span>${SG(tS)}</div><span class="ar">⟹</span><div class="c"><span>ΔG</span>${SG(p.G)}</div></div><div class="abs">المقارنة بين مقداري الحدين — والإشارة تتبع الحد الأكبر</div>`,{eqRef:eq,extra:whyEl});
    add(c3,`<div class="concl ${p.G==='m'?'ok':'bad'}"><span class="l">ΔG ${p.G==='m'?'(−)':'(+)'}</span><span>${p.concl}</span></div>`);
  });
}
function load(i){
  qi=i;step=0;const d=Q[i];
  $('qnum').textContent=i+1;$('qtext').innerHTML=d.q;$('qeq').innerHTML=d.eq||'';
  $('years').innerHTML=d.years.map(y=>`<b>${y}</b>`).join('');
  build(d);
  [...$('qtabs').children].forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));
  clearInk();render();fit();
}
function render(){
  steps.forEach((o,j)=>{const on=j<step;o.el.classList.toggle('vis',on);if(o.extra)o.extra.classList.toggle('vis',on)});
  // البطاقات والعناوين تظهر مع أول خطوة فيها
  fitEl.querySelectorAll('.card').forEach(c=>c.classList.toggle('vis',steps.some((o,j)=>j<step&&o.card===c)));
  fitEl.querySelectorAll('.rtitle').forEach(t=>t.classList.toggle('vis',steps.some((o,j)=>j<step&&o.title===t)));
  // إشارة ΔG في المعادلة تظهر عند المقارنة
  steps.forEach((o,j)=>{if(o.eqRef)o.eqRef.el.querySelector('.gsig').classList.toggle('on',j<step)});
  $('cnt').textContent=`${step} / ${steps.length}`;
  $('prev').disabled=step===0;$('next').disabled=step===steps.length;
}
function fit(){
  const W=solEl.clientWidth, H=solEl.clientHeight;if(!W||!H)return;
  const narrow=W<640;document.getElementById('app').classList.toggle('narrow',narrow);
  fitEl.style.transform='none';
  if(narrow){fitEl.style.position='static';fitEl.style.width='100%';solEl.style.overflowY='auto';return}
  fitEl.style.position='absolute';solEl.style.overflowY='hidden';
  // عرض طبيعي للمحتوى ثم تكبير/تصغير ليملأ المساحة كاملة
  fitEl.style.width='max-content';
  const nw=fitEl.scrollWidth, nh=fitEl.scrollHeight;
  let k=Math.min(W/nw,H/nh,1.7);
  fitEl.style.transform=`translateX(-50%) scale(${k})`;
  fitEl.style.top=Math.max(0,(H-nh*k)/2)+'px';
}
addEventListener('resize',()=>requestAnimationFrame(fit));
new ResizeObserver(()=>requestAnimationFrame(fit)).observe(solEl);
$('next').onclick=()=>{if(step<steps.length){step++;render()}};
$('prev').onclick=()=>{if(step>0){step--;render()}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown'){e.preventDefault();$('next').click()}else if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();$('prev').click()}});
Q.forEach((d,i)=>{const b=document.createElement('button');b.textContent=`س${i+1}`;b.title=d.q.replace(/<[^>]+>/g,'');b.setAttribute('role','tab');b.onclick=()=>load(i);$('qtabs').appendChild(b)});

/* السبورة */
const cv=$('ink'), cx=cv.getContext('2d');let tool=null, color='#ffd27a', width=3, drawing=null;
function size(){const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1, old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;if(cv.width)old.getContext('2d').drawImage(cv,0,0);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);cx.setTransform(1,0,0,1,0,0);if(old.width)cx.drawImage(old,0,0);cx.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',size);new ResizeObserver(()=>size()).observe(cv);
const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function clearInk(){cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.restore()}
function setTool(t){tool=tool===t?null:t;$('pen').setAttribute('aria-pressed',String(tool==='pen'));$('eraser').setAttribute('aria-pressed',String(tool==='eraser'));
  cv.classList.toggle('on',!!tool);$('penx').classList.toggle('on',tool==='pen');
  if(tool==='pen')toast('القلم مفعّل — اضغط القلم مرة ثانية لإيقافه');if(tool==='eraser')toast('الممحاة مفعّلة — اسحب فوق الكتابة لمسحها')}
$('pen').onclick=()=>setTool('pen');$('eraser').onclick=()=>setTool('eraser');
$('clear').onclick=()=>{clearInk();toast('تم مسح الكتابة')};
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{color=b.dataset.c;document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
document.querySelectorAll('.sz').forEach(b=>b.onclick=()=>{width=+b.dataset.w;document.querySelectorAll('.sz').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
function stroke(){cx.lineCap='round';cx.lineJoin='round';if(tool==='eraser'){cx.globalCompositeOperation='destination-out';cx.strokeStyle='#000';cx.lineWidth=34}else{cx.globalCompositeOperation='source-over';cx.strokeStyle=color;cx.lineWidth=width}}
cv.addEventListener('pointerdown',e=>{if(!tool)return;cv.setPointerCapture(e.pointerId);drawing=pt(e);stroke();cx.beginPath();cx.arc(drawing.x,drawing.y,cx.lineWidth/2,0,Math.PI*2);cx.fillStyle=tool==='eraser'?'#000':color;cx.fill()});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const list=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of list){const p=pt(ev);stroke();cx.beginPath();cx.moveTo(drawing.x,drawing.y);cx.lineTo(p.x,p.y);cx.stroke();drawing=p}});
const endDraw=()=>{drawing=null};cv.addEventListener('pointerup',endDraw);cv.addEventListener('pointercancel',endDraw);
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
$('fs').onclick=async()=>{try{if(isFS()){await (document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const r=document.documentElement;await (r.requestFullscreen||r.webkitRequestFullscreen).call(r)}}catch{toast('تعذّر ملء الشاشة في هذا الإطار')}};
document.addEventListener('fullscreenchange',()=>{$('fsPath').setAttribute('d',isFS()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');setTimeout(()=>{size();fit()},100)});
window.__q={load,all:()=>{step=steps.length;render()},next:()=>$('next').click()};
load(0);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
</script>
