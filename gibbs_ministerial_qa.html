/* ================= القلم والممحاة ================= */
const ink=$('ink'), ictx=ink.getContext('2d');
const PEN_COLS=['#e53935','#1e66d0','#1a2433','#1b8a4a','#f08c00','#7b3fc4'];
const PEN={on:false,col:PEN_COLS[0],w:6,erase:false,strokes:{},live:new Map()};
const strokes=()=>PEN.strokes[E.id+layout]||(PEN.strokes[E.id+layout]=[]);
$('swatches').innerHTML=PEN_COLS.map((c,i)=>`<button class="sw" data-c="${c}" style="background:${c}" aria-label="لون ${i+1}" aria-pressed="${i===0}"></button>`).join('');
function penUI(){
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',!PEN.erase&&b.dataset.c===PEN.col));
  document.querySelectorAll('.wd').forEach(b=>{b.setAttribute('aria-pressed',+b.dataset.w===PEN.w&&!PEN.erase);b.style.color=PEN.col});
  $('eraser').setAttribute('aria-pressed',PEN.erase);
}
function setPen(on){PEN.on=on;$('pen').setAttribute('aria-pressed',on);$('penbar').hidden=!on;ink.classList.toggle('on',on);if(on)$('toast').hidden=true;penUI()}
function strokePath(st){
  ictx.globalCompositeOperation=st.erase?'destination-out':'source-over';
  ictx.strokeStyle=st.erase?'#000':st.col;ictx.fillStyle=ictx.strokeStyle;ictx.lineWidth=st.w;ictx.lineCap='round';ictx.lineJoin='round';
  const p=st.pts;if(p.length===1){ictx.beginPath();ictx.arc(p[0].x,p[0].y,st.w/2,0,TAU);ictx.fill();return}
  ictx.beginPath();ictx.moveTo(p[0].x,p[0].y);
  for(let i=1;i<p.length-1;i++){const m={x:(p[i].x+p[i+1].x)/2,y:(p[i].y+p[i+1].y)/2};ictx.quadraticCurveTo(p[i].x,p[i].y,m.x,m.y)}
  ictx.lineTo(p[p.length-1].x,p[p.length-1].y);ictx.stroke();
}
function redrawInk(){ictx.setTransform(1,0,0,1,0,0);ictx.clearRect(0,0,ink.width,ink.height);if(!inSim)return;
  ictx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);strokes().forEach(strokePath);ictx.globalCompositeOperation='source-over'}
ink.addEventListener('pointerdown',e=>{if(!PEN.on)return;e.preventDefault();ink.setPointerCapture(e.pointerId);
  const st={col:PEN.col,w:PEN.erase?28:PEN.w,erase:PEN.erase,pts:[toV(e)]};strokes().push(st);PEN.live.set(e.pointerId,st);redrawInk()});
ink.addEventListener('pointermove',e=>{const st=PEN.live.get(e.pointerId);if(!st)return;
  const p=toV(e),q=st.pts[st.pts.length-1];if(d2(p,q)<1.2)return;st.pts.push(p);redrawInk()});
const inkEnd=e=>PEN.live.delete(e.pointerId);
ink.addEventListener('pointerup',inkEnd);ink.addEventListener('pointercancel',inkEnd);
$('pen').onclick=()=>setPen(!PEN.on);
$('penClose').onclick=()=>setPen(false);
$('swatches').onclick=e=>{const b=e.target.closest('.sw');if(!b)return;PEN.col=b.dataset.c;PEN.erase=false;penUI()};
document.querySelectorAll('.wd').forEach(b=>b.onclick=()=>{PEN.w=+b.dataset.w;PEN.erase=false;penUI()});
$('eraser').onclick=()=>{PEN.erase=!PEN.erase;penUI()};
$('undo').onclick=()=>{strokes().pop();redrawInk()};
$('clear').onclick=()=>{PEN.strokes[E.id+layout]=[];redrawInk()};
addEventListener('keydown',e=>{if(PEN.on&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('undo').click()}
  if(e.key==='f'||e.key==='F'){if(document.activeElement===document.body&&inSim)$('fullscreen').click()}});

/* ================= الصفحة الرئيسية والتنقل ================= */
const ICONS={
  beaker:'<svg viewBox="0 0 48 48"><path d="M14 8h20M16 8v30a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V8" fill="#eaf4fb" stroke="#1a2433" stroke-width="2"/><path d="M16 24h16v14a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3z" fill="#9cc9ec"/><rect x="21" y="30" width="3" height="3" fill="#fff" stroke="#7a8a9a"/><rect x="26" y="34" width="3" height="3" fill="#fff" stroke="#7a8a9a"/></svg>',
  tube:'<svg viewBox="0 0 48 48"><rect x="4" y="18" width="40" height="12" rx="6" fill="#eaf4fb" stroke="#1a2433" stroke-width="2"/><rect x="25" y="19" width="4" height="10" fill="#fff" stroke="#b8c2cc"/><circle cx="12" cy="24" r="2" fill="#2f6fd6"/><circle cx="38" cy="24" r="2" fill="#3aa35b"/><path d="M10 34c4 3 8 3 12 0s8-3 12 0" stroke="#f08c00" stroke-width="2" fill="none"/></svg>',
  flame:'<svg viewBox="0 0 48 48"><path d="M10 26l26-12a4 4 0 0 1 3 7L13 33" fill="#eaf4fb" stroke="#1a2433" stroke-width="2"/><path d="M14 30c-3-1-4-3-3-5" stroke="#d64a1e" stroke-width="3" fill="none"/><path d="M14 46c-5 0-7-4-5-8 1-3 4-4 5-8 2 4 5 6 5 9 0 4-2 7-5 7z" fill="#5b8cff"/></svg>',
  snow:'<svg viewBox="0 0 48 48"><path d="M24 6v36M8 15l32 18M8 33l32-18" stroke="#1e66d0" stroke-width="2.4" stroke-linecap="round"/><path d="M20 9l4 3 4-3M20 39l4-3 4 3" stroke="#1e66d0" stroke-width="2" fill="none"/></svg>',
  ice:'<svg viewBox="0 0 48 48"><path d="M12 14l12-6 12 6v14l-12 6-12-6z" fill="#dff1fb" stroke="#1e66d0" stroke-width="2"/><path d="M12 14l12 6 12-6M24 20v14" stroke="#1e66d0" stroke-width="1.6" fill="none"/><path d="M18 40c2 2 4 2 6 0" stroke="#5aa9e6" stroke-width="2" fill="none"/><circle cx="34" cy="40" r="2.4" fill="#5aa9e6"/></svg>',
  gas:'<svg viewBox="0 0 48 48"><rect x="28" y="12" width="12" height="30" rx="5" fill="#5c646e"/><rect x="28" y="24" width="12" height="6" fill="#f0c828"/><path d="M8 22h18v18a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z" fill="#f0b4ba" stroke="#1a2433" stroke-width="2"/><circle cx="15" cy="34" r="2" fill="#fff"/><circle cx="19" cy="29" r="1.4" fill="#fff"/></svg>'};
$('cards').innerHTML=EXPS.map((x,i)=>`<article class="card" role="button" tabindex="0" data-id="${x.id}" aria-label="السؤال ${i+1}">
  <div class="top"><div class="num">${i+1}</div><div class="ico">${ICONS[x.ico]}</div><div class="yrs">${x.years.map(y=>`<span>${y}</span>`).join('')}</div></div>
  <h3>${x.q}</h3><div class="eq">${x.eq}</div><span class="go">ابدأ المحاكاة</span></article>`).join('');
$('cards').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)location.hash=c.dataset.id});
$('cards').addEventListener('keydown',e=>{const c=e.target.closest('.card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();location.hash=c.dataset.id}});
$('homeBtn').onclick=()=>{location.hash='home'};
function openExp(id){
  const x=EXPS.find(q=>q.id===id);
  if(!x){inSim=false;$('home').hidden=false;$('tools').hidden=true;$('badge').hidden=true;setPen(false);$('toast').hidden=true;draw(0);redrawInk();return}
  E=x;inSim=true;initState();view={...VIEW0};goal=null;set2D(false);spin=false;$('spin').setAttribute('aria-pressed',false);
  $('home').hidden=true;$('tools').hidden=false;setPen(false);
  const i=EXPS.indexOf(x)+1;$('badge').innerHTML=`<b>السؤال ${i} · وزاري</b>`+x.years.map(y=>`<span>${y}</span>`).join('');$('badge').hidden=false;
  redrawInk();toast(x.tip);paint();
}
const route=()=>openExp(location.hash.slice(1));
addEventListener('hashchange',route);

function resize(){const r=cv.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ink.width=cv.width;ink.height=cv.height;layout=W/H>=.9?'land':'port';L=LAY[layout];
  s=Math.min(W/L.w,H/L.h);ox=(W-L.w*s)/2;oy=(H-L.h*s)/2;redrawInk();paint()}
new ResizeObserver(resize).observe(cv);resize();route();
window.__sim={get E(){return E},get S(){return S},open:id=>{location.hash=id},setT,dG,spont,
  step:sec=>{for(let i=0;i<sec*30;i++)update(1/30);draw(performance.now())},tap:id=>SC[E.scene].tap(id),setPen};
}
</script>
</body>
</html>
