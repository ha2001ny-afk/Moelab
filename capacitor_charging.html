<style>
/* Layout: one full-screen navy lab bench; the Figure 27 circuit sits on a board, battery below it, live I–t chart beside it */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --pos:#ff6b6b; --neg:#5eaaff; --field:#62d98a; --force:#ffab5c; --accent:#7fd3ff;
  --wire-p:#e94848; --wire-n:#1b2029; --plate:#8593a9; --warn:#ffc04d; --lamp:#ffd27a; --res:#2aa58f;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body);margin:0}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}

.hdr{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:calc(100% - 84px - env(safe-area-inset-left,0px));display:flex;gap:14px;align-items:flex-start;pointer-events:none}
.hdr>*{pointer-events:auto}
.hbtns{display:flex;flex-direction:column;gap:7px;flex:none}
.hbtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;min-width:126px;border-radius:10px;border:1px solid var(--line);background:rgba(8,20,41,.62);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;text-align:start}
.hbtn svg{width:17px;height:17px;flex:none;color:var(--accent)}
.hbtn:hover{border-color:var(--accent)}
.hbtn.on{border-color:var(--accent);background:rgba(127,211,255,.14);color:var(--accent)}
.hbtn:focus-visible,.sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.htitle{min-width:0;padding-top:2px}
.eyebrow{display:inline-block;font:600 12px var(--f-display);color:var(--force);background:rgba(255,171,92,.14);border:1px solid rgba(255,171,92,.3);border-radius:999px;padding:1px 10px;letter-spacing:.02em}
.htitle h1{margin:6px 0 0;font:600 20px/1.45 var(--f-display);color:var(--ink);max-width:330px;text-wrap:balance}
@media (max-width:759px){.htitle h1{font-size:15px;line-height:1.5}.hbtn{min-width:118px;font-size:13px;height:34px}}

.lbtns{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.sbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.sbtn:hover{border-color:var(--accent)}
.sbtn svg{width:20px;height:20px}
.sbtn.lamp{color:var(--lamp)}
.sbtn.lamp:hover,.sbtn.lamp.on{border-color:var(--lamp);background:rgba(255,210,122,.14)}
.toast{position:absolute;top:max(110px,calc(env(safe-area-inset-top,0px) + 104px));left:max(10px,env(safe-area-inset-left,0px));max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink)}

.pane{position:absolute;overflow:auto;background:rgba(8,20,41,.95);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.8;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.pane h2{margin:0 0 8px;font:600 16px var(--f-display);padding-left:30px;text-wrap:balance}
.pane p{margin:0 0 8px}
.pane .m,.pane b.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.pane p.m{text-align:center;color:var(--accent);font-weight:600;font-size:15px}
.pane .note{color:var(--muted);font-size:13px}
.pane .hl{color:var(--force);font-weight:600}
.pane .q{color:var(--lamp);font-weight:600}
.pane .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;direction:ltr;justify-content:flex-end}
.pane .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.pane .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.pane .x:hover{color:var(--ink)}
.tip{top:max(110px,calc(env(safe-area-inset-top,0px) + 104px));left:max(10px,env(safe-area-inset-left,0px));width:min(340px,calc(100% - 20px));max-height:calc(100% - 130px);border:1px solid rgba(255,210,122,.35)}
.tip h2{color:var(--lamp)}
.info{right:max(12px,env(safe-area-inset-right,0px));width:min(410px,calc(100% - 24px));border:1px solid rgba(127,211,255,.32)}
.info h2{color:var(--accent)}
.info ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.info ul li{display:flex;gap:10px;align-items:flex-start}
.info ul li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:10px}
.info ol{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.info ol li{display:flex;gap:10px;align-items:flex-start}
.info .ck{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 13px var(--f-mono);color:var(--muted);margin-top:2px}
.info li.ok .ck{background:var(--field);border-color:var(--field);color:#062012}
.info li.ok>div{color:var(--muted)}
.info .fig{color:var(--accent);font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;font-size:12.5px}
.info .reset{margin-top:12px;font:600 13px var(--f-body);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:6px 14px;cursor:pointer}
.info .reset:hover{border-color:var(--accent)}
.info .box{border:1px solid rgba(255,171,92,.35);background:rgba(255,171,92,.08);border-radius:10px;padding:8px 12px;margin:8px 0}
.info .box p:last-child{margin:0}
.info .think{border:1px solid rgba(255,107,107,.4);background:rgba(255,107,107,.08);border-radius:10px;padding:8px 12px;margin:10px 0 4px}
.info .think b.t{color:var(--pos);font-family:var(--f-display)}
.info details{margin-top:4px}
.info summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
.info summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body style="margin:0">

<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="دائرة شحن متسعة فيها بطارية ومقاومة ومصباحان وكلفانوميتر ومفتاح مزدوج، ومخطط تيار الشحن مع الزمن"></canvas>

  <header class="hdr" id="hdr">
    <div class="hbtns">
      <button class="hbtn" data-p="tools" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>أدوات النشاط</button>
      <button class="hbtn" data-p="steps" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>خطوات النشاط</button>
      <button class="hbtn" data-p="concl" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></svg>الاستنتاج</button>
    </div>
    <div class="htitle">
      <span class="eyebrow">نشاط</span>
      <h1>كيفية شحن المتسعة</h1>
    </div>
  </header>
  <div class="pane info" id="infoPanel" hidden role="dialog" aria-labelledby="infoTitle"><button class="x" id="infoClose" aria-label="إغلاق">×</button><h2 id="infoTitle"></h2><div id="infoBody"></div></div>

  <div class="lbtns">
    <button class="sbtn lamp" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
    <button class="sbtn" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="pane tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
</div>

<script>
(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d'),hdr=document.getElementById('hdr');
const CAP=1000e-6,RDIS=1000,VMAX=12,IREF=0.012,GFS=0.025,TWIN=12,YMAX=25;
const RES=[{v:500,n:'500 Ω',b:['#3fae5a','#1b2029','#7a4a2a']},{v:1000,n:'1 kΩ',b:['#7a4a2a','#1b2029','#e94848']},{v:2000,n:'2 kΩ',b:['#e94848','#1b2029','#e94848']}];
const S={V:12,Q:0,I:0,k:0,res:1,nv:0,nvel:0,kAng:0,kLen:0.72,b1:0,b2:0,eph:0};
const done=[false,false,false];
const leads={'B+':null,'B-':null};              // {port:'X'|'Y'} or {port:null,x,y} while held
let trace=null,ghost=null,lastClosed=false;const rDone=new Set(),fresh=[];
let W=0,H=0,DPR=1,narrow=false,G={},col={},time=0,drag=null,hover=null,selTerm=null,ranks={};
let placedBoard=false,placedBat=false,placedPlot=false,placedTray=false;
const cam={z:1,x:0,y:0};

function readColors(){const cs=getComputedStyle(document.documentElement);
  ['deep','navy','glow','ink','muted','pos','neg','field','accent','wire-p','wire-n','plate','warn','line','force','lamp','res'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- layout ---------- */
function layout(){
  const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;
  W=nw;H=nh;narrow=W<900;
  DPR=window.devicePixelRatio||1;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const hr=hdr.getBoundingClientRect(),sr=cv.getBoundingClientRect(),hb=hr.bottom-sr.top,hl=hr.left-sr.left;
  const bh=narrow?116:128;let board,bat,plot,tray;
  if(!narrow){
    const plW=clamp(W*0.28,300,380),plH=clamp(H*0.38,230,280);
    plot={x:W-24-plW,y:hb+18,w:plW,h:plH};
    tray={x:plot.x+plW-122,y:plot.y+plH+26,w:122};
    const left=70;let top=30,right=Math.min(plot.x-36,hl-20);
    if(right-left<440){top=hb+12;right=plot.x-36;}
    const avail=right-left,BW=clamp(avail,380,680),BH=clamp(H-top-34-bh-24,230,370);
    board={x:left+Math.max(0,(avail-BW)/2),y:top,w:BW,h:BH};
    bat={x:board.x+BW*0.58-95,y:board.y+BH+34,w:190,h:bh};
  }else{
    const BW=Math.min(W-20,640),BH=clamp(Math.min(BW*0.72,H*0.36),220,330);
    board={x:(W-BW)/2,y:hb+12,w:BW,h:BH};
    const bw=Math.min(200,BW-122-14);
    bat={x:board.x,y:board.y+BH+34,w:bw,h:bh};
    tray={x:board.x+BW-122,y:bat.y-8,w:122};
    const plW=Math.min(W-20,560),py=bat.y+bh+24;
    plot={x:(W-plW)/2,y:py,w:plW,h:clamp(H-py-14,170,240)};
  }
  if(!placedBoard)G.board=board;
  if(!placedBat)G.bat=bat;
  if(!placedPlot)G.plot=plot;
  if(!placedTray)G.tray=tray;
  parts();
}
function parts(){const b=G.board,x0=b.x,y0=b.y,BW=b.w,BH=b.h,m=Math.max(40,BW*0.09);
  const P={xL:x0+m,xR:x0+BW-m,yT:y0+46,yM:y0+BH*0.5,yB:y0+BH-46};
  P.xG=x0+BW*(BW<520?0.36:0.30);P.small=BW<520;P.xC=x0+BW*0.53;P.xK=x0+BW*0.74;P.xRr=x0+BW*0.30;
  P.gap=clamp(BW*0.025,12,18);P.ax=P.xC-P.gap-7;P.bx=P.xC+P.gap+7;
  P.ph=Math.min(44,(P.yB-P.yT)*0.2);P.cd=Math.min(36,(P.yB-P.yM)*0.42);
  P.c1={x:P.xR,y:P.yM+P.cd};P.c2={x:P.xR,y:P.yM-P.cd};P.pv={x:P.xK,y:P.yM};
  P.a1=Math.atan2(P.cd,P.xR-P.xK);P.bl=Math.hypot(P.xR-P.xK,P.cd);
  P.L2={x:P.xL,y:(P.yT+P.yM)/2};P.L1={x:P.xL,y:(P.yM+P.yB)/2};
  P.X={x:x0+BW*0.50,y:P.yB};P.Y={x:x0+BW*0.66,y:P.yB};
  G.P=P;
  const t=G.bat;
  G.T={'B+':{x:t.x+t.w*0.26,y:t.y-17},'B-':{x:t.x+t.w*0.74,y:t.y-17}};
  G.knob={x:t.x+34,y:t.y+t.h-36,r:18};
  G.lcd={x:t.x+62,y:t.y+t.h-50,w:Math.max(56,t.w-80),h:28};
}
const portPos=id=>id==='X'?G.P.X:G.P.Y;
const leadAt=port=>['B+','B-'].find(k=>leads[k]&&leads[k].port===port);
function battState(){const p=leads['B+']&&leads['B+'].port,n=leads['B-']&&leads['B-'].port;return{ok:!!(p&&n&&p!==n),sign:p==='X'?1:-1};}

/* ---------- physics ---------- */
function step(dt){
  const b=battState(),R=RES[S.res].v,prev=S.Q;let closed=false,tg=0;
  if(b.ok&&b.sign>0)done[0]=true;
  if(S.k===1&&b.ok){closed=true;tg=b.sign*CAP*S.V;const tau=R*CAP;S.Q=tg+(S.Q-tg)*Math.exp(-dt/tau);S.I=(tg-(prev+S.Q)/2)/tau;}
  else if(S.k===2){const tau=RDIS*CAP;S.Q*=Math.exp(-dt/tau);if(Math.abs(S.Q)<1e-8)S.Q=0;S.I=-((prev+S.Q)/2)/tau;}
  else S.I=0;
  // record the charging curve (Figure 28) every time the charging loop closes
  if(closed&&!lastClosed){if(trace&&trace.pts.length>5)ghost=trace;
    trace={R,n:RES[S.res].n,V:S.V,pts:[[0,Math.abs(tg-prev)/(R*CAP)]],t:0,fresh:S.V>=1&&Math.abs(prev)<0.05*CAP*S.V,complete:false};}
  lastClosed=closed;
  if(closed&&trace){trace.t+=dt;if(trace.t<=TWIN)trace.pts.push([trace.t,Math.abs(S.I)]);
    if(!trace.complete&&Math.abs(S.Q-tg)<0.01*CAP*Math.max(S.V,0.1)){trace.complete=true;
      if(trace.fresh&&b.sign>0&&done[0]){done[1]=true;rDone.add(trace.R);
        fresh.push({R:trace.R,n:trace.n,V:trace.V,I0m:Math.max(...trace.pts.map(q=>q[1])),I0c:trace.V/trace.R});if(fresh.length>4)fresh.shift();
        if(rDone.size>=2)done[2]=true;}}}
  // galvanometer needle: centre-zero, damped spring
  const tn=clamp(S.I/GFS*5,-5.8,5.8);S.nvel+=(90*(tn-S.nv)-12*S.nvel)*dt;S.nv+=S.nvel*dt;
  if(Math.abs(S.nv)>5.9){S.nv=Math.sign(S.nv)*5.9;S.nvel*=-0.3;}
  // lamp filaments
  const i1=closed?Math.abs(S.I):0,i2=S.k===2?Math.abs(S.I):0,f=Math.min(1,dt*14);
  S.b1+=(clamp(i1/IREF,0,1.3)-S.b1)*f;S.b2+=(clamp(i2/IREF,0,1.3)-S.b2)*f;
  // switch blade
  if(!(drag&&drag.type==='blade')){const P=G.P,ta=S.k===1?P.a1:S.k===2?-P.a1:0,tl=S.k===0?0.72:1;S.kAng+=(ta-S.kAng)*f;S.kLen+=(tl-S.kLen)*f;}
  if(Math.abs(S.I)>2e-5)S.eph+=Math.sign(S.I)*(40+170*Math.min(1,Math.abs(S.I)/IREF))*dt;
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,o={}){ctx.font=o.font||'600 13px system-ui, Tahoma, sans-serif';ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
function rich(parts,x,y,o={}){const f=o.font||'600 14px ui-monospace, Menlo, Consolas, monospace',fs=o.sub||'600 10px ui-monospace, Menlo, Consolas, monospace';
  ctx.direction='ltr';ctx.textBaseline='middle';let w=0;parts.forEach(p=>{ctx.font=p[1]?fs:f;w+=ctx.measureText(p[0]).width;});
  let cx=o.align==='left'?x:o.align==='right'?x-w:x-w/2;ctx.fillStyle=o.color||col.ink;ctx.textAlign='left';
  parts.forEach(p=>{ctx.font=p[1]?fs:f;ctx.fillText(p[0],cx,y+(p[1]?4:0));cx+=ctx.measureText(p[0]).width;});return w;}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function signMark(x,y,r,positive){ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.3,r*0.22);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-r*0.5,y);ctx.lineTo(x+r*0.5,y);if(positive){ctx.moveTo(x,y-r*0.5);ctx.lineTo(x,y+r*0.5);}ctx.stroke();}
function charge(x,y,r,positive){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=positive?col.pos:col.neg;ctx.fill();signMark(x,y,r,positive);}
function pulseRing(x,y,r,color,ph){const pu=0.5+0.5*Math.sin(time*5+(ph||0));ctx.beginPath();ctx.arc(x,y,r+pu*5,0,7);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function pulseRect(x,y,w,h,color){const pu=0.5+0.5*Math.sin(time*5),e=3+pu*4;rr(x-e,y-e,w+2*e,h+2*e,10);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function strokePts(pts){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}
function measure(pts){const len=[0];for(let i=1;i<pts.length;i++)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));return{pts,len,L:len[len.length-1]};}
function at(pl,s){const{pts,len}=pl;let i=1;while(i<len.length-1&&len[i]<s)i++;const f=(s-len[i-1])/((len[i]-len[i-1])||1);return{x:pts[i-1].x+(pts[i].x-pts[i-1].x)*f,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*f};}
/* straight runs, right angles, small rounded corners (a point with r:0 stays sharp, e.g. a junction) */
function rounded(pts,r){const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){const a=pts[i-1],c=pts[i],b=pts[i+1],rc=c.r!=null?c.r:r;
    const da=Math.hypot(a.x-c.x,a.y-c.y),db=Math.hypot(b.x-c.x,b.y-c.y);if(da<1||db<1||rc<=0){out.push(c);continue;}
    const k=Math.min(rc,da/2,db/2),p1={x:c.x+(a.x-c.x)/da*k,y:c.y+(a.y-c.y)/da*k},p2={x:c.x+(b.x-c.x)/db*k,y:c.y+(b.y-c.y)/db*k};
    for(let j=0;j<=6;j++){const t=j/6,u=1-t;out.push({x:u*u*p1.x+2*u*t*c.x+t*t*p2.x,y:u*u*p1.y+2*u*t*c.y+t*t*p2.y});}}
  out.push(pts[pts.length-1]);return out;}
function distSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(p.x-a.x-dx*t,p.y-a.y-dy*t);}

/* next thing the student should touch */
function hint(){const b=battState(),R=RES[S.res].v,charged=Math.abs(S.Q)>0.1*CAP*Math.max(S.V,1);
  if(!done[0]){if(!leads['B+']||!leads['B+'].port)return'B+';if(!leads['B-']||!leads['B-'].port)return'B-';return b.sign<0?'swap':null;}
  if(!done[1]){if(S.V<1)return'knob';
    if(S.k===1)return trace&&trace.complete&&!trace.fresh?'c2':null;
    if(S.k===2)return charged?null:'c1';return charged?'c2':'c1';}
  if(!done[2]){
    if(S.k===1)return trace&&trace.complete?'c2':null;
    if(charged)return S.k===2?null:'c2';
    return rDone.has(R)?'tray':'c1';}
  return null;}

const ptrs=new Map();let pinch=null,lastTap=0;
function scr(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
const toWorld=s=>({x:(s.x-cam.x)/cam.z,y:(s.y-cam.y)/cam.z});
const inR=(p,x,y,w,h)=>p.x>x&&p.x<x+w&&p.y>y&&p.y<y+h;
function hit(p){const Rp=Math.max(14,20/cam.z),R=Math.max(18,26/cam.z),P=G.P;
  for(const id of['X','Y']){const q=portPos(id);if(Math.hypot(q.x-p.x,q.y-p.y)<Rp)return{type:'port',id,key:'port-'+id};}
  for(const k of['B+','B-']){const q=G.T[k];if(Math.hypot(q.x-p.x,q.y+8-p.y)<R)return{type:'term',k,key:'term'+k};}
  const kn=G.knob;if(Math.hypot(kn.x-p.x,kn.y-p.y)<kn.r+10)return{type:'knob',key:'knob'};
  for(const c of['c1','c2'])if(Math.hypot(P[c].x-p.x,P[c].y-p.y)<Rp)return{type:'contact',k:c==='c1'?1:2,key:c};
  const L=P.bl*S.kLen,tip={x:P.xK+Math.cos(S.kAng)*L,y:P.yM+Math.sin(S.kAng)*L};
  if(distSeg(p,P.pv,tip)<Math.max(12,16/cam.z))return{type:'blade',key:'blade'};
  const t=G.tray;for(let i=0;i<RES.length;i++)if(inR(p,t.x,t.y+18+i*36,t.w,30))return{type:'tile',i,key:'tile'+i};
  if(inR(p,t.x,t.y-4,t.w,22))return{type:'tile',i:null,key:'tray'};
  const pl=G.plot;if(inR(p,pl.x,pl.y,pl.w,pl.h))return{type:'plot',key:'plot'};
  const b=G.bat;if(inR(p,b.x-4,b.y-6,b.w+8,b.h+10))return{type:'bat',key:'bat'};
  const bd=G.board;if(inR(p,bd.x,bd.y,bd.w,bd.h))return{type:'board',key:'board'};
  return null;}
function cursorFor(h){if(!h)return'grab';return h.type==='knob'?'ns-resize':['bat','plot','board'].includes(h.type)||h.key==='tray'?'move':'pointer';}
function nearestFreePort(p,k){const R=70/cam.z+20;let best=null,bd=R;['X','Y'].forEach(id=>{const o=leadAt(id);if(o&&o!==k)return;const q=portPos(id),d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=id;}});return best;}
function cancelDrag(){if(drag&&drag.type==='wire')leads[drag.k]=drag.prevPort?{port:drag.prevPort}:null;drag=null;}

cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);
  const s=scr(e);ptrs.set(e.pointerId,s);

  if(h.type==='port'){const owner=leadAt(h.id);
    if(owner){leads[owner]={port:null,x:p.x,y:p.y};drag={type:'wire',k:owner,prevPort:h.id,s0:s,moved:false};}

cv.addEventListener('pointermove',e=>{const s=scr(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,s);
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const z=clamp(pinch.z0*d/pinch.d0,0.6,4),wx=(pinch.m0.x-pinch.x0)/pinch.z0,wy=(pinch.m0.y-pinch.y0)/pinch.z0;

  if(drag.type==='pan'){cam.x=drag.x0+s.x-drag.s0.x;cam.y=drag.y0+s.y-drag.s0.y;return;}
  if(drag.type==='wire'){if(mv)drag.moved=true;const l=leads[drag.k];l.x=p.x;l.y=p.y;const np=nearestFreePort(p,drag.k);hover=np?'port-'+np:null;}
  else if(drag.type==='blade'){if(mv)drag.moved=true;if(drag.moved){const P=G.P;S.kAng=clamp(Math.atan2(p.y-P.yM,p.x-P.xK),-P.a1*1.3,P.a1*1.3);S.kLen+=(1-S.kLen)*0.3;}}
  else if(drag.type==='tray'){if(mv)drag.moved=true;if(drag.moved){G.tray.x=p.x-drag.ox;G.tray.y=p.y-drag.oy;placedTray=true;}}

  else if(drag.type==='plot'){G.plot.x=p.x-drag.ox;G.plot.y=p.y-drag.oy;placedPlot=true;}
  else if(drag.type==='board'){G.board.x=p.x-drag.ox;G.board.y=p.y-drag.oy;placedBoard=true;parts();}
  else if(drag.type==='knob'){const v=clamp(Math.round((drag.v0+((s.x-drag.s0.x)-(s.y-drag.s0.y))*0.05)*2)/2,0,VMAX);if(v!==S.V){S.V=v;spoil();}}});

function pointerEnd(e){ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;return;}
  if(!drag)return;
  if(drag.type==='wire'){const l=leads[drag.k];
    if(!drag.moved){
      if(drag.fromTerm){if(drag.prevPort){leads[drag.k]={port:drag.prevPort};selTerm=null;}else{leads[drag.k]=null;selTerm=drag.k;}}
      else leads[drag.k]=null;
    }else{const pp=nearestFreePort({x:l.x,y:l.y},drag.k);leads[drag.k]=pp?{port:pp}:null;selTerm=null;}
    hover=null;}
  if(drag.type==='blade'){const a1=G.P.a1;if(!drag.moved)S.k=S.k===1?2:1;else S.k=S.kAng>a1*0.5?1:S.kAng<-a1*0.5?2:0;}

    return{t:'المتسعة غير مشحونة',b:`<p>فرغت المتسعة من شحنتها. لتكرار الشحن ضع المفتاح k في الموقع (1)، ويمكنك قبل ذلك اختيار مقاومة أخرى من صينية المقاومات لتقارن منحني تيار الشحن.</p>${nums}`};}
  if(!b.ok)return{t:'الدائرة غير مكتملة',b:`<p>البطارية غير موصولة بالدائرة. اسحب سلك القطب الموجب إلى النقطة القريبة من المقاومة R، وسلك القطب السالب إلى النقطة الأخرى، كما في الشكل (27).</p><p class="note">يمكنك أيضاً النقر على قطب البطارية ثم النقر على النقطة.</p>`};
  if(S.k===0){

    return{t:'المفتاح k مفتوح',b:`<p>ذراع المفتاح k لا يلامس أي موقع، فالدائرة مفتوحة. انقر على الموقع (1) أو اسحب الذراع إليه لربط صفيحتي المتسعة بين قطبي البطارية.</p>${rev}`};}
  if(S.V<0.5)return{t:'جهد البطارية صفر',b:`<p>أدر مقبض البطارية لرفع فرق جهدها.</p>`};
  if(I>0.01*S.V/R)return{t:'المتسعة تُشحن',b:`<p>لحظة إغلاق الدائرة تكون المتسعة غير مشحونة، فيقع فرق جهد البطارية كله على المقاومة ويكون التيار أكبر ما يمكن:</p><p class="m">I = ΔV<sub>battery</sub> / R = ${S.V.toFixed(1)} / ${R} = ${(S.V/R*1000).toFixed(1)} mA</p><p>تسحب البطارية الإلكترونات من الصفيحة A وتدفعها إلى الصفيحة B. كلما تراكمت الشحنة ازداد فرق الجهد بين الصفيحتين ΔV<sub>C</sub> وقلّ فرق الجهد على المقاومة <b class="m">ΔV<sub>R</sub> = ΔV<sub>battery</sub> − ΔV<sub>C</sub></b>، فيتناقص التيار ويخفت المصباح L<sub>1</sub>.</p>${rev}${nums}`};
  return{t:'اكتمل شحن المتسعة',b:`<p>تساوى جهد كل صفيحة مع جهد قطب البطارية المتصل بها، فأصبح:</p><p class="m">ΔV<sub>C</sub> = ΔV<sub>battery</sub> = ${S.V.toFixed(1)} V</p><p>لا يتوافر فرق جهد على طرفي المقاومة، فالتيار صفر: رجع مؤشر الكلفانوميتر إلى الصفر وانطفأ المصباح L<sub>1</sub>. المتسعة المشحونة في دائرة التيار المستمر تعمل كمفتاح مفتوح.</p><p class="m">Q = C ΔV = 1000 µF × ${S.V.toFixed(1)} V = ${(Math.abs(S.Q)*1000).toFixed(1)} mC</p>${rev}${nums}`};

  const req=el.requestFullscreen||el.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const t=document.createElement('div');t.className='toast';t.hidden=true;t.textContent='ملء الشاشة غير متاح هنا. افتح الملف أو الرابط بالمتصفح';document.querySelector('.stage').appendChild(t);
  let tm=0;const toast=()=>{t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>t.hidden=true,3200);};
  const sync=()=>{ico.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');b.setAttribute('aria-label',isFs()?'الخروج من ملء الشاشة':'ملء الشاشة');};
  b.addEventListener('click',()=>{
    if(isFs()){try{exit.call(document);}catch(e){}return;}
    if(!req||document.fullscreenEnabled===false){toast();return;}
    try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(toast);setTimeout(()=>{if(!isFs())toast();},700);}catch(e){toast();}});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);})();

/* panels: activity tools / steps / conclusion, and the lamp hint */
(function(){
  const hdr=document.getElementById('hdr'),info=document.getElementById('infoPanel'),iT=document.getElementById('infoTitle'),iB=document.getElementById('infoBody');
  const tip=document.getElementById('tipPanel'),tT=document.getElementById('tipTitle'),tB=document.getElementById('tipBody'),tipBtn=document.getElementById('tipBtn');
  const btns=[...document.querySelectorAll('.hbtn')];
  const STEPS=[
    'نربط الدائرة الكهربائية كما في الشكل (27): نصل القطب الموجب للبطارية بالنقطة القريبة من المقاومة R، والقطب السالب بالنقطة الأخرى. <span class="fig">(27)</span>',
    'نجعل المفتاح k في الموقع (1)، أي نربط صفيحتي المتسعة بين قطبي البطارية لغرض شحنها. نلاحظ انحراف مؤشر الكلفانوميتر (G) لحظياً نحو اليمين ثم يعود بسرعة إلى الصفر، ونلاحظ في الوقت نفسه توهج المصباح L<sub>1</sub> بضوء ساطع لبرهة من الزمن ثم ينطفئ، وكأن البطارية غير مربوطة في الدائرة.',
    'نتابع منحني تيار الشحن مع الزمن. نضع المفتاح k في الموقع (2) لتفريغ المتسعة، ثم نختار مقاومة أخرى ونعيد الشحن، ونقارن تيار الشحن الابتدائي في المنحنيين. <span class="fig">(28)</span>'];
  const R=n=>`<b class="m">${n}</b>`;
  const P={
    tools:()=>({t:'أدوات النشاط',b:`<ul>
      <li><div>بطارية فولطيتها مناسبة، يُضبط جهدها بالمقبض الدوّار من ${R('0')} إلى ${R('12 V')}.</div></li>
      <li><div>كلفانوميتر ${R('(G)')} صفره في وسط التدريجة.</div></li>
      <li><div>متسعة ${R('(C)')} ذات الصفيحتين المتوازيتين ${R('A')} و ${R('B')}، سعتها ${R('1000 µF')}.</div></li>
      <li><div>مفتاح مزدوج ${R('(k)')} له موقعان: ${R('1')} للشحن و ${R('2')} للتفريغ.</div></li>
      <li><div>مقاومة ثابتة ${R('R')}: ${R('500 Ω')} أو ${R('1 kΩ')} أو ${R('2 kΩ')}.</div></li>
      <li><div>مصباحان متماثلان ${R('L₁')} و ${R('L₂')}.</div></li>
      <li><div>أسلاك توصيل.</div></li></ul>
      <p class="note" style="margin-top:10px">يمكنك سحب لوحة الدائرة والبطارية والمخطط وصينية المقاومات إلى أي مكان على الشاشة.</p>`}),
    steps:()=>{const d=window.__sim?window.__sim.done:[];return{t:'خطوات النشاط',b:`<ol>${STEPS.map((s,i)=>`<li class="${d[i]?'ok':''}"><span class="ck">${d[i]?'✓':i+1}</span><div>${s}</div></li>`).join('')}</ol>${d.every(Boolean)?'<p class="note" style="margin-top:10px">أكملت خطوات النشاط. افتح الاستنتاج.</p>':''}<button class="reset" type="button" data-act="reset">إعادة النشاط</button>`};},
    concl:()=>{const f=window.__sim?window.__sim.fresh():[];let mine='<p class="note">أكمل خطوات النشاط لترى قياساتك هنا.</p>';
      if(f.length){const l=f[f.length-1];
        mine=`<div class="box"><p>من قياسك: عند ${R('R = '+l.n)} و ${R('ΔV = '+l.V.toFixed(1)+' V')} بدأ تيار الشحن بمقدار ${R((l.I0m*1000).toFixed(1)+' mA')}، وهو يساوي ${R('ΔV/R = '+(l.I0c*1000).toFixed(1)+' mA')}، ثم تناقص إلى الصفر.</p>`;
        const byR={};f.forEach(x=>byR[x.R]=x);const ks=Object.keys(byR).map(Number).sort((a,b)=>a-b);
        if(ks.length>1)mine+=`<p>${ks.map(k=>R(byR[k].n+' → '+(byR[k].I0m*1000).toFixed(1)+' mA')).join('، ')}</p><p>كلما كبرت المقاومة R صغر تيار الشحن الابتدائي واستغرق الشحن زمناً أطول.</p>`;
        mine+='</div>';}
      return{t:'نستنتج من النشاط',b:`<p class="q">لماذا يرجع مؤشر الكلفانوميتر إلى الصفر؟</p>
      <p>بعد اكتمال عملية شحن المتسعة يتساوى جهد كل صفيحة مع جهد قطب البطارية المتصل بها، فتصبح المتسعة مشحونة بكامل شحنتها، وعندها يكون فرق الجهد بين صفيحتي المتسعة مساوياً لفرق الجهد بين قطبي البطارية:</p>
      <p class="m">ΔV<sub>C</sub> = ΔV<sub>battery</sub></p>
      <p>وفي هذه الحالة لا يتوافر فرق جهد على طرفي المقاومة في الدائرة، مما يجعل التيار في الدائرة يساوي صفراً.</p>
      <p class="hl">لذا فإن وجود المتسعة في دائرة التيار المستمر يُعد مفتاحاً مفتوحاً بعد أن تُشحن.</p>
      <p>ولأن صفيحتي المتسعة معزولتان عن بعضهما، تتراكم الإلكترونات على الصفيحة B المربوطة بالقطب السالب للبطارية فتُشحن بالشحنة السالبة ${R('(−Q)')}، في حين تُشحن الصفيحة A المربوطة بالقطب الموجب بالشحنة الموجبة ${R('(+Q)')} وبالمقدار نفسه بطريقة الحث.</p>
      <p>يبين المخطط البياني في الشكل (28) العلاقة بين تيار شحن المتسعة والزمن: يبدأ تيار الشحن ${R('(I)')} بمقدار كبير لحظة إغلاق دائرة الشحن، ومقداره يساوي:</p>
      <p class="m">I = ΔV<sub>battery</sub> / R</p>
      <p>ثم يتناقص مقداره إلى الصفر بسرعة عند اكتمال الشحن، إذ إن: ${R('I')} تيار الشحن، ${R('R')} المقاومة في الدائرة، ${R('ΔV<sub>battery</sub>')} فرق جهد البطارية.</p>
      ${mine}
      <div class="think"><b class="t">فكّر:</b> المتسعة الموضوعة في دائرة التيار المستمر تُعد كمفتاح مفتوح؟
      <details><summary>الجواب</summary><p style="margin:6px 0 0">نعم، بعد اكتمال شحنها. فعندما يصبح ${R('ΔV<sub>C</sub> = ΔV<sub>battery</sub>')} ينعدم فرق الجهد على المقاومة وينقطع التيار المستمر في الدائرة. أما لحظة إغلاق الدائرة فيمر تيار شحن كبير لبرهة قصيرة فقط.</p></details></div>`};}};
  let cur=null,iv=0,lastH='';
  const place=()=>{const top=hdr.getBoundingClientRect().bottom-document.querySelector('.stage').getBoundingClientRect().top+10;info.style.top=top+'px';info.style.maxHeight=`calc(100% - ${top+16}px)`;};
  const fill=()=>{if(!cur)return;const r=P[cur](),h=r.t+'|'+r.b;if(h===lastH)return;
    const open=iB.querySelector('details[open]');lastH=h;iT.textContent=r.t;iB.innerHTML=r.b;if(open){const d=iB.querySelector('details');if(d)d.open=true;}};
  const openInfo=n=>{cur=cur===n?null:n;btns.forEach(b=>{const on=b.dataset.p===cur;b.classList.toggle('on',on);b.setAttribute('aria-expanded',on);});
    info.hidden=!cur;clearInterval(iv);if(cur){openTip(false);place();lastH='';fill();iv=setInterval(fill,400);}};
  btns.forEach(b=>b.addEventListener('click',()=>openInfo(b.dataset.p)));
  document.getElementById('infoClose').addEventListener('click',()=>openInfo(cur));
  iB.addEventListener('click',e=>{if(e.target.closest('[data-act="reset"]')&&window.__sim){window.__sim.reset();lastH='';fill();}});
  window.addEventListener('resize',()=>{if(cur)place();});
  let tiv=0,tLast='';
  const tfill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===tLast)return;tLast=h;tT.textContent=r.t;tB.innerHTML=r.b;};
  function openTip(v){tip.hidden=!v;tipBtn.setAttribute('aria-expanded',v);tipBtn.classList.toggle('on',v);clearInterval(tiv);if(v){if(cur)openInfo(cur);tLast='';tfill();tiv=setInterval(tfill,400);}}
  tipBtn.addEventListener('click',()=>openTip(tip.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>openTip(false));
})();
</script>
