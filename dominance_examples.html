<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>امثلة السيادة غير التامة والسيادة المشاركة</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:14px;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav{width:62px;height:62px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:26px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);flex:none}
  .nav:active{background:#d9ebf7}
  .nav:focus-visible,.dot:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  #dots{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:60vw}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .tx{fill:#1f3a52;font-size:14.5px;font-weight:bold;dominant-baseline:central;direction:rtl}
  .lb{fill:#1f3a52;font-size:13px;font-weight:bold;dominant-baseline:central;direction:rtl}
  .gt{fill:#1b1b1b;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:22px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .gm{fill:#2a1206;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:19px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .ct{fill:#1b1b1b;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:17px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .rl{fill:#1f3a52;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:28px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .ar{fill:#1f3a52;font-size:14px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .pc{fill:#1f3a52;font-size:13.5px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .hd{fill:#fff;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .sx{fill:#1f3a52;font-size:26px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .sy{fill:#1f3a52;font-size:16px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .th{fill:#1f3a52;font-size:12.5px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .tn{fill:#c4623a;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:21px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .gn{fill:#1b1b1b;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:16px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .cn{fill:#c4623a;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:17px;text-anchor:middle;dominant-baseline:central;direction:ltr}
</style>
</head>
<body>

<div id="top"><div id="title">امثلة السيادة غير التامة والسيادة المشاركة</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 420 400" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gGam" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#ffb184"/><stop offset=".55" stop-color="#ef6d31"/><stop offset="1" stop-color="#c9501c"/></radialGradient>
        <linearGradient id="gGeno" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff38a"/><stop offset="1" stop-color="#ffe23a"/></linearGradient>
        <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fb"/><stop offset="1" stop-color="#e4eaf0"/></linearGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".9"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
        <!-- اللون الغباري: خليط من شعر احمر وشعر ابيض -->
        <pattern id="roan" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#f3b9ad"/><circle cx="2" cy="2" r="1.5" fill="#fff"/><circle cx="5.5" cy="5.5" r="1.5" fill="#fff"/></pattern>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="المرحلة السابقة">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="المرحلة التالية">◀</button>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,NAVY='#1f3a52',ORG='#c4623a';
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const sub=(u,a,b)=>clamp((u-a)/(b-a),0,1);

const TITLE='امثلة السيادة غير التامة والسيادة المشاركة';
/* مثال1: نص · ابوان+امشاج · مربع بونيت ونسب | مثال2: مثله | مثال3: نص · P1→F1 · P2+امشاج · مربع بونيت ونسب */
const DUR=[12,8,13, 11,8,14, 13,12,8,13];

const world=G(view);
const glowL=G(world),boxL=G(world),arrL=G(world),gridL=G(world),txtL=G(world),objL=G(world),mvL=G(world);

/* ---------- symbols with superscripts:  "I^AI^B" → Iᴬ Iᴮ ---------- */
function runs(s){const o=[];let b='';for(let i=0;i<s.length;i++){if(s[i]==='^'&&i+1<s.length){if(b)o.push({t:b});b='';o.push({t:s[i+1],s:1});i++;}else b+=s[i];}if(b)o.push({t:b});return o;}
function rich(t,str,fs){while(t.firstChild)t.removeChild(t.firstChild);let pend=0;const up=fs*.36;
  runs(str).forEach(r=>{const s=el('tspan',{},t);s.textContent=r.t;
    if(r.s){s.setAttribute('font-size',f1(fs*.62));s.setAttribute('dy',f1(pend-up));pend=up;}
    else if(pend){s.setAttribute('dy',f1(pend));pend=0;}});return t;}

/* ---------- builders ---------- */
const op=(e,a)=>e.setAttribute('opacity',f2(a));
function place(o,x,y,s,a){o.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) scale(${f2(s)})`);o.setAttribute('opacity',f2(a));}
const glow=(x,y,r)=>el('circle',{cx:x,cy:y,r:r||60,fill:'url(#gGlow)',opacity:0},glowL);
const box=(x,y,w,h)=>el('rect',{x,y,width:w,height:h,rx:6,fill:'url(#gBox)',stroke:NAVY,'stroke-width':2,opacity:0},boxL);
function geno(p,s,w){w=w||96;const g=G(p,{opacity:0});
  el('rect',{x:-w/2,y:-18,width:w,height:36,rx:4,fill:'url(#gGeno)',stroke:'#d9b80f','stroke-width':1.5},g);
  rich(el('text',{class:'gt',x:0,y:1},g),s,22);return g;}
function gam(p,s){const g=G(p,{opacity:0});
  el('circle',{cx:1.5,cy:2.5,r:22,fill:NAVY,opacity:.18,filter:'url(#blur)'},g);
  el('circle',{cx:0,cy:0,r:22,fill:'url(#gGam)',stroke:'#b84e1e','stroke-width':2},g);
  rich(el('text',{class:'gm',x:0,y:1},g),s,19);return g;}
function rowLbl(x,y,n){const t=el('text',{class:'rl',x,y,opacity:0},txtL);
  t.textContent=n[0];if(n.length>1){const s=el('tspan',{'font-size':17,dy:8},t);s.textContent=n.slice(1);}return t;}
function varrow(x,y0,y1){const g=G(arrL,{opacity:0}),L=y1-y0;
  el('rect',{x:-2.5,y:0,width:5,height:L-14,fill:NAVY},g);
  el('path',{d:`M-10,${L-16} L0,${L} L10,${L-16}Z`,fill:NAVY},g);
  return{g,x,y0};}
const grow=(A,s)=>{A.g.setAttribute('opacity',s>0?1:0);A.g.setAttribute('transform',`translate(${A.x} ${A.y0}) scale(1 ${f2(Math.max(s,.001))})`);};
function txt(s,x,y,c,p){const t=el('text',{class:c,x,y,opacity:0},p||txtL);t.textContent=s;return t;}
function head(s,y,w,cx){const g=G(txtL,{opacity:0});
  el('rect',{x:cx-w/2,y:y-15,width:w,height:30,rx:15,fill:ORG},g);
  el('text',{class:'hd',x:cx,y:y+1},g).textContent=s;return g;}
function pct(s,n,x,y){const t=el('text',{class:'pc',x,y,opacity:0},txtL);
  const a=el('tspan',{},t);a.textContent=s+' ';const b=el('tspan',{fill:ORG,'font-size':16},t);b.textContent=n+' %';return t;}

/* paragraph with automatic line wrapping; allele symbols (I^A …), blood groups and ratios are coloured */
const HL=/^(\d[\d:\/]*|[A-Z]{1,2}|\([A-Z]\))$/;
function setLine(t,words){while(t.firstChild)t.removeChild(t.firstChild);let pend=0;
  const add=(s,c)=>{const sp=document.createElementNS(NS,'tspan');sp.textContent=s;if(c)sp.setAttribute('fill',c);t.appendChild(sp);
    if(pend){sp.setAttribute('dy',f1(pend));pend=0;}return sp;};
  words.forEach((w,i)=>{if(i)add(' ');
    if(w.includes('^'))runs(w).forEach(r=>{if(r.s){const sp=document.createElementNS(NS,'tspan');sp.textContent=r.t;sp.setAttribute('fill',ORG);
        sp.setAttribute('font-size','9.5');sp.setAttribute('dy',f1(pend-5.5));pend=5.5;t.appendChild(sp);}
      else add(r.t,ORG);});
    else add(w,HL.test(w)?ORG:null);});}
function para(str,o){const words=str.split(/\s+/),lines=[];let cur=[],y=o.y;
  const mk=()=>el('text',{class:o.cls||'tx',x:o.x,y,'text-anchor':o.anchor||'start',opacity:0},txtL);
  let t=mk();
  for(const w of words){const trial=cur.concat(w);setLine(t,trial);
    if(t.getComputedTextLength()>o.w&&cur.length){setLine(t,cur);lines.push(t);y+=o.lh;t=mk();cur=[w];setLine(t,cur);}
    else cur=trial;}
  setLine(t,cur);lines.push(t);return{lines,y:y+o.lh};}
function rev(arr,u,a,b){const n=arr.length;
  arr.forEach((g,i)=>{const s=sm(u,a+(b-a)*i/n,Math.min(b,a+(b-a)*(i+1.6)/n));
    [].concat(g).forEach(e=>{op(e,s);e.setAttribute('transform',`translate(${f1(12*(1-s))} 0)`);});});}

const geo=CL=>({BX:CL+58,BW:352,MX:CL+234,XL:CL+150,XR:CL+318});

/* ---------- الابوان ---------- */
function parents(CL,y,lab,lbR,lbL,gR,gL){const g=geo(CL),o=Object.assign({y,gy:y+68,end:y+96},g);
  o.box=box(g.BX,y,g.BW,96);o.lab=rowLbl(CL+30,y+48,lab);
  o.lbR=para(lbR,{x:g.XR,y:y+18,w:150,lh:19,cls:'lb',anchor:'middle'}).lines;
  o.lbL=para(lbL,{x:g.XL,y:y+18,w:150,lh:19,cls:'lb',anchor:'middle'}).lines;
  o.gR=geno(objL,gR);o.gL=geno(objL,gL);o.x=txt('×',g.MX,o.gy,'sx');
  o.render=u=>{let a=sm(u,0,.25);op(o.box,a);op(o.lab,a);
    o.lbR.forEach(l=>op(l,sm(u,.15,.4)));o.lbL.forEach(l=>op(l,sm(u,.25,.5)));
    a=sm(u,.3,.6);place(o.gR,g.XR,o.gy,.4+.6*a,a);a=sm(u,.42,.72);place(o.gL,g.XL,o.gy,.4+.6*a,a);op(o.x,sm(u,.7,.9));};
  return o;}

/* ---------- الجيل الاول (للمثال الثالث) ---------- */
function f1Block(CL,P,mRs,mLs,Fs,pcS){const {BX,BW,MX,XL,XR}=P,b=P.end,o={};
  o.A1=varrow(MX,b+3,b+40);o.mei=txt('انقسام اختزالي',MX+70,b+21,'ar');
  o.bG=box(BX,b+42,BW,60);o.lG=rowLbl(CL+30,b+72,'G1');
  o.mR=gam(objL,mRs);o.mL=gam(objL,mLs);
  o.A2=varrow(MX,b+105,b+140);
  o.bF=box(BX,b+142,BW,95);o.lF=rowLbl(CL+30,b+189,'F1');
  o.mv=[gam(mvL,mLs),gam(mvL,mRs)];o.F=geno(objL,Fs);o.gl=glow(MX,b+174,70);
  o.pc=pct(pcS,'100',MX,b+215);o.end=b+237;
  o.render=u=>{let a,mv,fd,on;
    grow(o.A1,sm(u,0,.15));op(o.mei,sm(u,.08,.2));
    a=sm(u,.1,.22);op(o.bG,a);op(o.lG,a);
    a=sm(u,.18,.4);place(o.mR,XR,lerp(P.gy,b+72,a),.5+.5*a,sm(u,.18,.24));
    a=sm(u,.28,.5);place(o.mL,XL,lerp(P.gy,b+72,a),.5+.5*a,sm(u,.28,.34));
    grow(o.A2,sm(u,.48,.6));a=sm(u,.52,.62);op(o.bF,a);op(o.lF,a);
    mv=sm(u,.6,.78);fd=sm(u,.74,.82);on=u>.6?1:0;
    place(o.mv[0],lerp(XL,MX-22,mv),lerp(b+72,b+174,mv),1-.2*mv,on*(1-fd));
    place(o.mv[1],lerp(XR,MX+22,mv),lerp(b+72,b+174,mv),1-.2*mv,on*(1-fd));
    a=sm(u,.76,.88);place(o.F,MX,b+174,.4+.6*a,a);
    op(o.gl,Math.sin(PI*sm(u,.76,1)));op(o.pc,sm(u,.86,.97));};
  return o;}

/* ---------- مربع بونيت 2×2 ---------- */
function punnett(CL,y,P,mG,fG,order,cols,gLab,fLab){const CS=62,X0=P.MX-CS*1.5,gt=y,o={};
  const cx=c=>X0+CS*(c+1)+CS/2,ry=k=>gt+CS*(k+1)+CS/2;
  o.grid=G(gridL,{opacity:0});
  for(let i=0;i<3;i++)for(let j=0;j<3;j++)
    el('rect',{x:X0+CS*j,y:gt+CS*i,width:CS,height:CS,fill:(i===0||j===0)?'#eef2f6':'#fff',stroke:NAVY,'stroke-width':1.6},o.grid);
  el('line',{x1:X0,y1:gt,x2:X0+CS,y2:gt+CS,stroke:NAVY,'stroke-width':1.6},o.grid);
  el('text',{class:'sy',x:X0+45,y:gt+17},o.grid).textContent='♂';
  el('text',{class:'sy',x:X0+17,y:gt+45},o.grid).textContent='♀';
  o.lG=rowLbl(CL+30,gt+CS/2,gLab);o.lF=rowLbl(CL+30,gt+CS*2,fLab);
  o.MG=mG.map(s=>gam(objL,s));o.FG=fG.map(s=>gam(objL,s));
  const key=s=>s.split('^')[1];
  o.cells=[];
  for(let k=0;k<2;k++)for(let c=0;c<2;c++){
    const pair=[fG[k],mG[c]].sort((a,b)=>order.indexOf(key(a))-order.indexOf(key(b)));
    const s=pair.join(''),p=pair.filter(q=>key(q)===order[1]).length,x=cx(c),yy=ry(k);
    const ov=el('rect',{x:x-CS/2+1,y:yy-CS/2+1,width:CS-2,height:CS-2,fill:cols[p],opacity:0},gridL);
    const t=G(objL,{opacity:0});rich(el('text',{class:'ct',x:0,y:1},t),s,17);
    o.cells.push({k,c,x,y:yy,ov,t,p,gl:glow(x,yy,36),m:[gam(mvL,mG[c]),gam(mvL,fG[k])]});}
  o.renderG=u=>{let a;op(o.grid,sm(u,0,.25));a=sm(u,.1,.3);op(o.lG,a);op(o.lF,a);
    o.MG.forEach((g,c)=>{const s0=.25+c*.12;a=sm(u,s0,s0+.3);place(g,lerp(P.XL,cx(c),a),lerp(P.gy,gt+CS/2,a),.5+.4*a,sm(u,s0,s0+.06));});
    o.FG.forEach((g,k)=>{const s0=.55+k*.12;a=sm(u,s0,s0+.3);place(g,lerp(P.XR,X0+CS/2,a),lerp(P.gy,ry(k),a),.5+.4*a,sm(u,s0,s0+.06));});};
  o.renderC=u=>{o.cells.forEach((q,i)=>{const s0=.04+i*.22;
    const mv=sm(u,s0,s0+.12),fd=sm(u,s0+.1,s0+.16),on=u>s0?1:0;
    place(q.m[0],lerp(cx(q.c),q.x+11,mv),lerp(gt+CS/2,q.y,mv),.9-.45*mv,on*(1-fd));
    place(q.m[1],lerp(X0+CS/2,q.x-11,mv),q.y,.9-.45*mv,on*(1-fd));
    const a=sm(u,s0+.12,s0+.2);place(q.t,q.x,q.y,.4+.6*a,a);
    op(q.gl,Math.sin(PI*sm(u,s0+.12,s0+.28)));});};
  o.end=gt+CS*3;return o;}

/* ---------- جدول النسبة المظهرية والوراثية ---------- */
function table(CL,y,phen,gen,frac,cols,cells){const o={},RH1=66,RH2=64;
  const C=[[320,392],[225,320],[130,225],[35,130]].map(([a,b])=>[CL+a,CL+b]),mid=i=>(C[i][0]+C[i][1])/2;
  o.frame=G(boxL,{opacity:0});
  C.forEach(([a,b],i)=>el('rect',{x:a,y,width:b-a,height:RH1,fill:i?'#fff':'#eef2f6',stroke:NAVY,'stroke-width':1.6},o.frame));
  o.hc=[1,2,3].map(i=>el('rect',{x:C[i][0]+1,y:y+1,width:C[i][1]-C[i][0]-2,height:RH1-2,fill:cols[i-1],opacity:0},boxL));
  o.lab1=[txt('النسبة',mid(0),y+23,'th'),txt('المظهرية',mid(0),y+43,'th')];
  o.ph=phen.map((s,i)=>[txt('121'[i],mid(i+1),y+20,'tn'),txt(s,mid(i+1),y+47,'th')]);
  o.colon=[1,2].map(i=>{const g=G(txtL,{opacity:0});el('rect',{x:C[i][0]-4,y:y+11,width:8,height:18,fill:'#fff'},g);
    el('text',{class:'tn',x:C[i][0],y:y+19},g).textContent=':';return g;});
  const y2=y+RH1;
  o.frame2=G(boxL,{opacity:0});
  C.forEach(([a,b],i)=>el('rect',{x:a,y:y2,width:b-a,height:RH2,fill:i?'#fff':'#eef2f6',stroke:NAVY,'stroke-width':1.6},o.frame2));
  o.lab2=[txt('النسبة',mid(0),y2+22,'th'),txt('الوراثية',mid(0),y2+42,'th')];
  o.gen=gen.map((g,i)=>{const t=el('text',{class:'gn',x:mid(i+1),y:y2+22,opacity:0},txtL);rich(t,g,16);return[t,txt(frac[i],mid(i+1),y2+46,'cn')];});
  const ys=y2+RH2+34;
  o.sb=el('rect',{x:CL+42,y:ys-18,width:350,height:36,rx:18,fill:'#fff4ec',stroke:ORG,'stroke-width':1.6,opacity:0},boxL);
  o.sl=para('النسبة المظهرية = النسبة الوراثية = 1:2:1',{x:CL+217,y:ys,w:330,lh:28,anchor:'middle'}).lines;
  o.sg=glow(CL+217,ys,80);
  o.render=u=>{let a=sm(u,0,.12);op(o.frame,a);o.lab1.forEach(t=>op(t,a));
    [0,1,2].forEach(i=>{const s0=.12+i*.14;a=sm(u,s0,s0+.12);
      cells.forEach(q=>{if(q.p===i)op(q.ov,a);});op(o.hc[i],a);o.ph[i].forEach(t=>op(t,a));if(i)op(o.colon[i-1],a);});
    a=sm(u,.56,.66);op(o.frame2,a);o.lab2.forEach(t=>op(t,a));
    o.gen.forEach((p,i)=>{a=sm(u,.64+i*.07,.72+i*.07);p.forEach(t=>op(t,a));});
    a=sm(u,.86,.96);op(o.sb,a);o.sl.forEach(l=>op(l,a));op(o.sg,Math.sin(PI*sm(u,.88,1)));};
  o.end=ys+24;return o;}

/* ---------- مثال كامل في عمود واحد ---------- */
function example(CL,c){const o={};
  o.h=head(c.title,24,130,CL+210);
  let r=para(c.text,{x:CL+408,y:66,w:396,lh:28});
  o.seq=[[o.h],...r.lines.map(l=>[l])];let y=r.y+8;
  if(c.p1){o.P1=parents(CL,y,'P1',...c.p1);o.F1=f1Block(CL,o.P1,...c.f1);y=o.F1.end+30;}
  o.P=parents(CL,y,c.pLab,...c.p);y=o.P.end+34;
  o.Q=punnett(CL,y,o.P,c.mG,c.fG,c.order,c.cols,c.gLab,c.fLab);y=o.Q.end+28;
  o.T=table(CL,y,c.phen,c.gen,['1/4','1/2','1/4'],c.cols,o.Q.cells);y=o.T.end;
  if(c.note){y+=26;o.nh=head('ملاحظة',y,100,CL+352);r=para(c.note,{x:CL+408,y:y+40,w:396,lh:28});o.note=[[o.nh],...r.lines.map(l=>[l])];y=r.y;}
  o.end=y;return o;}

/* three columns, read right-to-left */
const CR=840,CM=420,CL0=0;

const E1=example(CR,{title:'مثال ( 1 )',
  text:'عن مجاميع الدم A ، B ، AB في الانسان : ان هذه المجاميع يحددها العاملان I^A و I^B وهما يمثلان مستضدين Antigens يوجدان ضمن غشاء خلايا الدم الحمر . ان الطراز الوراثي لفرد ينتمي الى مجموعة الدم AB هو I^AI^B ، اذ لا يسود اي من الاليلين I^A و I^B على الاخر ، وبالطبع فان خلايا الدم AB تحمل كلا المستضدين A و B في اغشيتها . وعند زواج اباء يحمل كل منهما الطراز الوراثي I^AI^B فمن المحتمل الحصول على اطفال بالنسبة المظهرية والوراثية الاتية :',
  pLab:'P',p:['♀ ام فصيلة دمها AB','♂ اب فصيلة دمه AB','I^AI^B','I^AI^B'],
  mG:['I^A','I^B'],fG:['I^A','I^B'],order:['A','B'],gLab:'G',fLab:'F1',
  cols:['#cfe6f7','#eadcf3','#fde0cc'],phen:['فصيلة A','فصيلة AB','فصيلة B'],gen:['I^AI^A','I^AI^B','I^BI^B']});

const E2=example(CM,{title:'مثال ( 2 )',
  text:'عن نظام الدم MN في الانسان : ان الفرد ذو مجموعة الدم M يمتلك المستضد M في حين ان الفرد ذا مجموعة N يمتلك المستضد N اما الفرد ذو مجموعة الدم MN فيمتلك كلا المستضدين M و N في غشاء خلايا الدم الحمر لذا فعند زواج اباء ذي تركيب وراثي L^ML^N فمن المحتمل حصولهم على اولاد بالنسبة الوراثية الاتية :',
  pLab:'P',p:['♀ ام فصيلة دمها MN','♂ اب فصيلة دمه MN','L^ML^N','L^ML^N'],
  mG:['L^M','L^N'],fG:['L^M','L^N'],order:['M','N'],gLab:'G',fLab:'F1',
  cols:['#d8f0d4','#fff0b8','#cfe6f7'],phen:['فصيلة M','فصيلة MN','فصيلة N'],gen:['L^ML^M','L^ML^N','L^NL^N'],
  note:'لقد استخدم الرمز L نسبة للعالم لاندشتاينر ( Landsteiner ) مكتشف مستضدي هاتين المجموعتين واللذين هما نوعان من جزيئات الكلايكوبروتين ( Glycoprotein ) .'});

const E3=example(CL0,{title:'مثال ( 3 )',
  text:'عن لون الشعر في بعض سلالات الماشية ذات القرون القصيرة Short horns : يوجد أليلان ( حليلان ) يتحكمان بلون الشعر احدهما مسؤول عن ظهور اللون الاحمر C^R والاخر مسؤول عن ظهور اللون الابيض C^W ، حيث ان C من Color اي لون و R من Red اي احمر و W من White اي ابيض . وعند تضريب فردين احدهما احمر والاخر ابيض الشعر فان جميع افراد الجيل الاول تكون « غبارية » اي ذات شعر احمر مبيض وبالفحص الدقيق وجد ان هذا اللون هو خليط من شعر بعضه احمر والبعض الاخر ابيض . وعند اجراء تزاوج مابين افراد الجيل الاول ، تم الحصول على النسبة المظهرية والوراثية الآتية في الجيل الثاني :',
  p1:['♀ بقرة حمراء الشعر','♂ ثور ابيض الشعر','C^RC^R','C^WC^W'],
  f1:['C^R','C^W','C^RC^W','غبارية اللون ( احمر مبيض )'],
  pLab:'P2',p:['♀ بقرة غبارية ( F₁ )','♂ ثور غباري ( F₁ )','C^RC^W','C^RC^W'],
  mG:['C^R','C^W'],fG:['C^R','C^W'],order:['R','W'],gLab:'G2',fLab:'F2',
  cols:['#f3b9ad','url(#roan)','#f7f5f2'],phen:['احمر','غباري','ابيض'],gen:['C^RC^R','C^RC^W','C^WC^W']});

/* ---------- whole page in one view ---------- */
const H=Math.max(E1.end,E2.end,E3.end)+14;
const SEP=[CM,CR].map(x=>el('line',{x1:x+4,y1:12,x2:x+4,y2:H-12,stroke:'#b9c8d6','stroke-width':1.5,'stroke-dasharray':'6 6',opacity:0},boxL));
const VB=[-52,0,1316,H];svg.setAttribute('viewBox',VB.join(' '));

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:1,dur:DUR[0]};
let stage=0,T=0,t0=0,paused=false,P=0,last=performance.now();
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

function playEx(E,uText,uP,uC){
  rev(E.seq,uText,0,.9);
  E.P.render(sub(uP,0,.45));E.Q.renderG(sub(uP,.45,1));
  const end=E.note?.86:1;
  E.Q.renderC(sub(uC,0,.4*end));E.T.render(sub(uC,.4*end,end));
  if(E.note)rev(E.note,uC,.86,1);}

/* ---------------- render ---------------- */
function render(){
  const u=DUR.map((_,i)=>clamp(P-i,0,1));
  SEP.forEach(l=>op(l,sm(u[0],0,.15)));
  /* مثال 1 */ playEx(E1,u[0],u[1],u[2]);
  /* مثال 2 */ playEx(E2,u[3],u[4],u[5]);
  /* مثال 3 */
  rev(E3.seq,u[6],0,.9);
  E3.P1.render(sub(u[7],0,.32));E3.F1.render(sub(u[7],.32,1));
  E3.P.render(sub(u[8],0,.45));E3.Q.renderG(sub(u[8],.45,1));
  E3.Q.renderC(sub(u[9],0,.4));E3.T.render(sub(u[9],.4,1));
}
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render();requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');
DUR.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','المرحلة '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);});
function setUI(){document.title=TITLE;[...dotsEl.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+DUR.length)%DUR.length;const tgt=i+1;
  if(tgt<=P+1e-3)P=i;
  let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  if(tgt-P>1.01)d*=.6;
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1.2,d);
  setUI();}
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(stage-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(stage+1);if(e.key==='ArrowRight')go(stage-1);});
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
function apply(){view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);}
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const camC=()=>({x:VB[0]+VB[2]/2,y:VB[3]/2});
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,camC());
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,camC());
document.getElementById('zreset').onclick=reset;
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
go(0);step();render();requestAnimationFrame(frame);
})();
</script>
</body>
