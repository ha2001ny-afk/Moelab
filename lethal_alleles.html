<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>الأليلات المميتة</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:14px;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav{width:62px;height:62px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:26px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);flex:none}
  .nav:active{background:#d9ebf7}
  .nav:focus-visible,.dot:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  #dots{display:flex;gap:9px;align-items:center}
  .dot{width:13px;height:13px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .tx{fill:#1f3a52;font-size:14.5px;font-weight:bold;dominant-baseline:central;direction:rtl}
  .lb{fill:#1f3a52;font-size:13px;font-weight:bold;dominant-baseline:central;direction:rtl}
  .gt{fill:#1b1b1b;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:22px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .gm{fill:#2a1206;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:19px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .gn{fill:#1b1b1b;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:17px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .rl{fill:#1f3a52;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:28px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .ar{fill:#1f3a52;font-size:14px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .pc{fill:#1f3a52;font-size:13.5px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .dd{fill:#d32f2f;font-size:13.5px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .th{fill:#1f3a52;font-size:13px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .hd{fill:#fff;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .sx{fill:#1f3a52;font-size:26px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<div id="top"><div id="title">الأليلات المميتة</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 420 400" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gGam" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#ffb184"/><stop offset=".55" stop-color="#ef6d31"/><stop offset="1" stop-color="#c9501c"/></radialGradient>
        <linearGradient id="gGeno" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff38a"/><stop offset="1" stop-color="#ffe23a"/></linearGradient>
        <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fb"/><stop offset="1" stop-color="#e4eaf0"/></linearGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".9"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <radialGradient id="gRbc" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#e2545a"/><stop offset="1" stop-color="#a8222b"/></radialGradient>
        <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="المرحلة السابقة">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="المرحلة التالية">◀</button>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,NAVY='#1f3a52',ORG='#c4623a',RED='#d32f2f';
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));

const TITLE='الأليلات المميتة';
/* التعريف · فقر الدم المنجلي · الجدول · الدجاج الزاحف · P1+G1 · F1 · الفئران الصفراء · P1+G1 · F1 · امثلة اخرى */
const DUR=[9,11,9,9,8,10,11,8,10,6];

const world=G(view);
const glowL=G(world),boxL=G(world),arrL=G(world),txtL=G(world),objL=G(world),mvL=G(world);

/* ---------- builders ---------- */
const op=(e,a)=>e.setAttribute('opacity',f2(a));
function place(o,x,y,s,a){o.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) scale(${f2(s)})`);o.setAttribute('opacity',f2(a));}
const glow=(x,y,r)=>el('circle',{cx:x,cy:y,r:r||60,fill:'url(#gGlow)',opacity:0},glowL);
const box=(x,y,w,h)=>el('rect',{x,y,width:w,height:h,rx:6,fill:'url(#gBox)',stroke:NAVY,'stroke-width':2,opacity:0},boxL);
function geno(p,s,w){w=w||84;const g=G(p,{opacity:0});
  el('rect',{x:-w/2,y:-18,width:w,height:36,rx:4,fill:'url(#gGeno)',stroke:'#d9b80f','stroke-width':1.5},g);
  el('text',{class:'gt',x:0,y:1},g).textContent=s;return g;}
function gam(p,s){const g=G(p,{opacity:0});
  el('circle',{cx:1.5,cy:2.5,r:22,fill:NAVY,opacity:.18,filter:'url(#blur)'},g);
  el('circle',{cx:0,cy:0,r:22,fill:'url(#gGam)',stroke:'#b84e1e','stroke-width':2},g);
  el('text',{class:'gm',x:0,y:1},g).textContent=s;return g;}
function rowLbl(x,y,n){const t=el('text',{class:'rl',x,y,opacity:0},txtL);
  t.textContent=n[0];const s=el('tspan',{'font-size':17,dy:8},t);s.textContent=n[1];return t;}
function varrow(x,y0,y1){const g=G(arrL,{opacity:0}),L=y1-y0;
  el('rect',{x:-2.5,y:0,width:5,height:L-14,fill:NAVY},g);
  el('path',{d:`M-10,${L-16} L0,${L} L10,${L-16}Z`,fill:NAVY},g);
  return{g,x,y0};}
const grow=(A,s)=>{A.g.setAttribute('opacity',s>0?1:0);A.g.setAttribute('transform',`translate(${A.x} ${A.y0}) scale(1 ${f2(Math.max(s,.001))})`);};
function txt(s,x,y,c,p){const t=el('text',{class:c,x,y,opacity:0},p||txtL);t.textContent=s;return t;}
function head(s,y,w,cx){const g=G(txtL,{opacity:0});
  el('rect',{x:cx-w/2,y:y-15,width:w,height:30,rx:15,fill:ORG},g);
  el('text',{class:'hd',x:cx,y:y+1},g).textContent=s;return g;}

/* علامة الموت : خطان احمران متقاطعان */
function deathX(g){return el('path',{d:'M-22,-24 L24,22 M24,-24 L-22,22',stroke:RED,'stroke-width':4.5,'stroke-linecap':'round',fill:'none',opacity:0},g);}

/* دجاجة : c زاحفة (ارجل قصيرة ملتوية) · n اعتيادية · d زاحفة نقية ميتة */
function hen(p,k){const g=G(p,{opacity:0}),b=G(g),LC='#e3a21a',EC='#9c8560';
  el('path',{d:k==='n'?'M-4,12 L-6,30 M4,12 L6,30 M-11,30 L-1,30 M1,30 L11,30':'M-4,12 L-9,18 L-4,22 M4,12 L0,18 L5,22 M-10,22 L0,22 M0,22 L10,22',
    stroke:LC,'stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round',fill:'none'},b);
  el('path',{d:'M-14,-2 L-28,-17 L-23,1 L-30,-5 L-18,10Z',fill:'#e7d3ad',stroke:EC,'stroke-width':1.3,'stroke-linejoin':'round'},b);
  el('ellipse',{cx:0,cy:2,rx:20,ry:13,fill:'#f6ead3',stroke:EC,'stroke-width':1.5},b);
  el('path',{d:'M-9,0 Q3,-5 10,4 Q1,11 -9,6Z',fill:'#e7d3ad',stroke:EC,'stroke-width':1},b);
  el('circle',{cx:15,cy:-12,r:8,fill:'#f6ead3',stroke:EC,'stroke-width':1.5},b);
  el('path',{d:'M9,-18 Q10,-27 13,-20 Q15,-28 17,-20 Q20,-27 21,-17Z',fill:'#d8263b'},b);
  el('path',{d:'M22,-14 L29,-11 L22,-8Z',fill:'#f0a020'},b);
  el('ellipse',{cx:22,cy:-5,rx:2.2,ry:3.4,fill:'#d8263b'},b);
  el('circle',{cx:17,cy:-13,r:1.6,fill:'#222'},b);
  g._b=b;g._x=k==='d'?deathX(g):null;return g;}

/* فأر : y اصفر · g رمادي · d اصفر نقي ميت */
function mouse(p,k){const g=G(p,{opacity:0}),b=G(g);
  const [c,s]=k==='g'?['#a3a8ad','#6b7075']:['#f2c53d','#b88a12'];
  el('path',{d:'M-19,4 C-30,9 -32,-6 -40,-2',stroke:s,'stroke-width':2.2,fill:'none','stroke-linecap':'round'},b);
  el('ellipse',{cx:-9,cy:12,rx:3.5,ry:1.8,fill:'#f2a3b0'},b);el('ellipse',{cx:9,cy:12,rx:3.5,ry:1.8,fill:'#f2a3b0'},b);
  el('ellipse',{cx:-2,cy:2,rx:20,ry:11,fill:c,stroke:s,'stroke-width':1.5},b);
  el('ellipse',{cx:16,cy:-1,rx:11,ry:8,fill:c,stroke:s,'stroke-width':1.5},b);
  el('circle',{cx:11,cy:-9,r:6,fill:c,stroke:s,'stroke-width':1.5},b);
  el('circle',{cx:11,cy:-9,r:3.3,fill:'#f2a3b0'},b);
  el('circle',{cx:20,cy:-3,r:1.6,fill:'#222'},b);
  el('circle',{cx:27,cy:0,r:2,fill:'#e07a8b'},b);
  el('path',{d:'M25,2 L33,5 M25,1 L33,0',stroke:s,'stroke-width':.8},b);
  g._b=b;g._x=k==='d'?deathX(g):null;return g;}

/* خلية دم حمراء : طبيعية (قرصية مقعرة) او منجلية */
function rbc(p,sick){const g=G(p,{opacity:0});
  if(!sick){el('circle',{r:17,fill:'url(#gRbc)',stroke:'#8e1a20','stroke-width':1.5},g);
    el('ellipse',{rx:8,ry:7,fill:'#ec8a8a',opacity:.8},g);}
  else el('path',{d:'M-25,7 Q-6,-23 25,4 Q2,-7 -25,7Z',fill:'url(#gRbc)',stroke:'#8e1a20','stroke-width':1.5,'stroke-linejoin':'round'},g);
  return g;}

/* paragraph with automatic line wrapping (right-aligned); symbols and ratios are coloured */
const HL=/^(\(?(Hb[ᴬˢ]?|[CcYy]{1,2})\)?|[\d:/]+)$/;
function setLine(t,words){while(t.firstChild)t.removeChild(t.firstChild);
  words.forEach((w,i)=>{if(i)t.appendChild(document.createTextNode(' '));
    if(HL.test(w)){const s=document.createElementNS(NS,'tspan');s.setAttribute('fill',ORG);s.textContent=w;t.appendChild(s);}
    else t.appendChild(document.createTextNode(w));});}
function para(str,o){const words=str.split(/\s+/),lines=[];let cur=[],y=o.y;
  const mk=()=>el('text',{class:o.cls||'tx',x:o.x,y,'text-anchor':o.anchor||'start',opacity:0},txtL);
  let t=mk();
  for(const w of words){const trial=cur.concat(w);setLine(t,trial);
    if(t.getComputedTextLength()>o.w&&cur.length){setLine(t,cur);lines.push(t);y+=o.lh;t=mk();cur=[w];setLine(t,cur);}
    else cur=trial;}
  setLine(t,cur);lines.push(t);return{lines,y:y+o.lh};}
function rev(arr,u,a,b){const n=arr.length;
  arr.forEach((g,i)=>{const s=sm(u,a+(b-a)*i/n,Math.min(b,a+(b-a)*(i+1.6)/n));
    [].concat(g).forEach(e=>{op(e,s);e.setAttribute('transform',`translate(${f1(12*(1-s))} 0)`);});});}
const block=(h,lines)=>[[h],...lines.map(l=>[l])];

/* three columns, read right-to-left: التعريف وفقر الدم المنجلي · الدجاج الزاحف · الفئران الصفراء */
const CR=840,CM=420,CL=0,BW=352;
let r;

/* ---------- تزاوج فردين هجينين : P1 · G1 · F1 ---------- */
const PAIR=[[0,0],[0,1],[1,0],[1,1]];
function cross(X,y0,c){
  const o={},BX=X+58,MX=X+234,XL=X+150,XR=X+318;
  const yP=y0+86,yG=y0+200,yF=y0+302,yO=y0+358;
  o.bP=box(BX,y0,BW,130);o.lP=rowLbl(X+30,y0+65,'P1');
  o.lbR=para(c.lr,{x:XR,y:y0+24,w:150,lh:19,cls:'lb',anchor:'middle'}).lines;
  o.lbL=para(c.ll,{x:XL,y:y0+24,w:150,lh:19,cls:'lb',anchor:'middle'}).lines;
  o.gR=geno(objL,c.p,60);o.gL=geno(objL,c.p,60);
  o.oR=c.org(objL,c.pk);o.oL=c.org(objL,c.pk);o.x=txt('×',MX,yP,'sx');
  o.A1=varrow(MX,y0+133,y0+168);o.mei=txt('انقسام اختزالي',MX+70,y0+150,'ar');
  o.bG=box(BX,y0+170,BW,60);o.lG=rowLbl(X+30,yG,'G1');
  const GL=[XL-26,XL+26],GR=[XR-26,XR+26];
  o.GLg=c.g.map(s=>gam(objL,s));o.GRg=c.g.map(s=>gam(objL,s));
  o.A2=varrow(MX,y0+233,y0+268);
  o.bF=box(BX,y0+270,BW,212);o.lF=rowLbl(X+30,y0+376,'F1');
  const FX=[X+102,X+190,X+278,X+366];
  o.cb=PAIR.map(([a,b],i)=>({a,b,g:geno(objL,c.f[i],62),gl:glow(FX[i],yF,40),
    m:[gam(mvL,c.g[a]),gam(mvL,c.g[b])],org:c.org(objL,c.fk[i])}));
  o.plus=[1,2,3].map(i=>txt('+',(FX[i-1]+FX[i])/2,yF,'sx'));
  o.br=el('path',{d:`M${FX[1]},${y0+390} L${FX[1]},${y0+398} L${FX[2]},${y0+398} L${FX[2]},${y0+390} M${MX},${y0+398} L${MX},${y0+404}`,stroke:NAVY,'stroke-width':2,fill:'none',opacity:0},txtL);
  o.nm=[txt(c.nm[0],FX[0],y0+414,'dd'),txt(c.nm[1],MX,y0+414,'pc'),txt(c.nm[2],FX[3],y0+414,'pc')];
  o.sum=c.sum.map((s,i)=>para(s,{x:MX,y:y0+442+i*25,w:340,lh:25,anchor:'middle'}).lines);
  o.end=y0+482;
  /* المرحلة الاولى : الآباء وامشاجهم */
  o.r1=u=>{let a=sm(u,0,.15);op(o.bP,a);op(o.lP,a);
    [...o.lbR,...o.lbL].forEach(l=>op(l,sm(u,.08,.22)));
    a=sm(u,.15,.35);place(o.gR,XR,yP,.4+.6*a,a);place(o.gL,XL,yP,.4+.6*a,a);
    place(o.oR,XR+58,yP,.5+.3*a,a);place(o.oL,XL-58,yP,.5+.3*a,a);
    op(o.x,sm(u,.3,.38));grow(o.A1,sm(u,.4,.52));op(o.mei,sm(u,.45,.55));
    a=sm(u,.48,.58);op(o.bG,a);op(o.lG,a);
    o.GLg.forEach((g,i)=>{const s0=.58+i*.08;a=sm(u,s0,s0+.16);place(g,lerp(XL,GL[i],a),lerp(yP,yG,a),.5+.5*a,sm(u,s0,s0+.04));});
    o.GRg.forEach((g,i)=>{const s0=.74+i*.08;a=sm(u,s0,s0+.16);place(g,lerp(XR,GR[i],a),lerp(yP,yG,a),.5+.5*a,sm(u,s0,s0+.04));});};
  /* المرحلة الثانية : اتحاد الامشاج وظهور الافراد ثم موت النقي للاليل المميت */
  o.r2=u=>{grow(o.A2,sm(u,0,.08));let a=sm(u,.04,.12);op(o.bF,a);op(o.lF,a);
    o.cb.forEach((q,i)=>{const s0=.12+i*.15;
      const mv=sm(u,s0,s0+.09),fd=sm(u,s0+.08,s0+.12),on=u>s0?1:0;
      place(q.m[0],lerp(GL[q.a],FX[i]-14,mv),lerp(yG,yF,mv),.9-.45*mv,on*(1-fd));
      place(q.m[1],lerp(GR[q.b],FX[i]+14,mv),lerp(yG,yF,mv),.9-.45*mv,on*(1-fd));
      a=sm(u,s0+.09,s0+.14);place(q.g,FX[i],yF,.4+.6*a,a);
      op(q.gl,Math.sin(PI*sm(u,s0+.09,s0+.19)));
      a=sm(u,s0+.11,s0+.17);place(q.org,FX[i],yO,.4+.35*a,a);
      if(i)op(o.plus[i-1],sm(u,s0,s0+.06));});
    a=sm(u,.74,.84);op(o.br,a);o.nm.forEach(t=>op(t,a));
    o.cb.forEach(q=>{if(q.org._x){op(q.org._x,a);op(q.org._b,1-.55*a);}});
    o.sum.forEach((ls,i)=>ls.forEach(l=>op(l,sm(u,.84+i*.06,.92+i*.06))));};
  return o;}

/* =================== التعريف =================== */
const hA=head('ج - الأليلات المميتة (Lethal alleles)',24,320,CR+210);
r=para('الأليل المميت هو الذي يؤدي تعبيره الى هلاك الفرد الذي يرثه بصورة نقية سائدة في بعض الحالات او بصورة متنحية في حالات اخرى ومن الامثلة على هذه الأليلات مايأتي :',{x:CR+408,y:66,w:396,lh:28});
const seqA=block(hA,r.lines);const endA=r.y;

/* =================== مثال 1 : فقر الدم المنجلي =================== */
const hB=head('مثال (1) : فقر الدم المنجلي',endA+20,240,CR+210);
r=para('أليل فقر الدم المنجلي (Sickle-cell anaemia) يرجع هذا المرض الوراثي الى أليل طافر متنحي Hbˢ يؤثر على نوعية خضاب الدم Hb (الهيموكلوبين) فيصبح من النوع الشاذ (هيموكلوبين S) ، وكذلك يؤثر على شكل خلايا الدم الحمر حيث تصبح منجلية الشكل .',{x:CR+408,y:endA+62,w:396,lh:28});
const seqB=block(hB,r.lines);
const bY=r.y-4,R={};
R.box=box(CR+8,bY,400,122);
R.div=el('line',{x1:CR+208,y1:bY+10,x2:CR+208,y2:bY+112,stroke:'#b9c8d6','stroke-width':1.5,'stroke-dasharray':'5 5',opacity:0},boxL);
R.nc=[[CR+58,bY+40,0],[CR+108,bY+62,0],[CR+158,bY+38,0]].map(([x,y,rt],i)=>({g:rbc(objL,false),x,y,r:rt,i}));
R.sc=[[CR+262,bY+42,-18],[CR+312,bY+64,24],[CR+360,bY+38,-4]].map(([x,y,rt],i)=>({g:rbc(objL,true),x,y,r:rt,i:i+3}));
R.lb=[txt('(أ) مصاب : خلايا منجلية الشكل',CR+308,bY+102,'pc'),txt('(ب) سليم : خلايا طبيعية',CR+108,bY+102,'pc')];
const endR=bY+122;

/* =================== التأثير المتعدد والجدول =================== */
r=para('يتضح مما تقدم بأن هذا الأليل المميت يكون ذو تأثير متعدد (Pleiotropic) . وفيما يلي جدول يبين الطراز الوراثي والمظهري للنسل الناتج من التزاوج بين ابوين كلاهما هجين لأليل فقر الدم المنجلي :',{x:CR+408,y:endR+28,w:396,lh:28});
const seqP=r.lines.map(l=>[l]);
const yT=r.y-2,RH1=44,RH2=58,TC=[[CR+300,CR+404],[CR+204,CR+300],[CR+108,CR+204],[CR+12,CR+108]];
const tm=i=>(TC[i][0]+TC[i][1])/2;
const Tb={frame:G(boxL,{opacity:0})};
TC.forEach(([a,b],i)=>[[yT,RH1],[yT+RH1,RH2]].forEach(([y,h])=>el('rect',{x:a,y,width:b-a,height:h,fill:i?'#fff':'#eef2f6',stroke:NAVY,'stroke-width':1.6},Tb.frame)));
Tb.hd=[txt('الطراز الوراثي',tm(0),yT+RH1/2,'th'),txt('الطراز المظهري',tm(0),yT+RH1+RH2/2,'th')];
const TG=['HbᴬHbᴬ','HbᴬHbˢ','HbˢHbˢ'],TP=[['سليم'],['حامل للمورثة','(الأليل)'],['يموت بعد','عمر المراهقة']],TCOL=['#d8f0d4','#fff3c4','#f8d3d3'];
Tb.cols=[1,2,3].map(i=>{const yc=yT+RH1+RH2/2,L=TP[i-1];
  const ov=el('rect',{x:TC[i][0]+1,y:yT+RH1+1,width:TC[i][1]-TC[i][0]-2,height:RH2-2,fill:TCOL[i-1],opacity:0},boxL);
  return[ov,txt(TG[i-1],tm(i),yT+RH1/2,'gn'),...L.map((s,j)=>txt(s,tm(i),yc+(j-(L.length-1)/2)*20,i===3?'dd':'th'))];});
const endT=yT+RH1+RH2;

/* =================== مثال 2 : الدجاج الزاحف =================== */
const hC=head('مثال (2) : الدجاج الزاحف',24,230,CM+210);
r=para('الأليل السائد للدجاج الزاحف : يظهر هذا النوع من الدجاج في حالة وجود الأليل السائد المميت (C) مع الأليل العادي (c) ، وهي لاتستطيع السير بصورة اعتيادية بسبب قصر والتواء الارجل ، اما الافراد النقية في هذا الجين (CC) فهي عادة تموت . وفيما يلي مثال عن تزاوج اباء زاحفة :',{x:CM+408,y:66,w:396,lh:28});
const seqC=block(hC,r.lines);
const Ck=cross(CM,r.y+2,{lr:'♀ دجاجة زاحفة',ll:'♂ ديك زاحف',p:'Cc',g:['C','c'],org:hen,pk:'c',
  f:['CC','Cc','Cc','cc'],fk:['d','c','c','n'],nm:['ميت','زاحف','اعتيادي'],
  sum:['النسبة المظهرية للافراد الحية :','2 زاحف : 1 اعتيادي ( بدلاً من 3 : 1 )']});

/* =================== امثلة اخرى =================== */
const hO=head('امثلة اخرى',Ck.end+30,130,CM+210);
r=para('ومن الامثلة الاخرى عن الجينات المميتة ذات التأثير المظهري السائد هي صفة مفرج الجناحين في حشرة ذبابة الفاكهة وصفة انعدام الشعر في الكلاب المكسيكية .',{x:CM+408,y:Ck.end+72,w:396,lh:28});
const seqO=block(hO,r.lines);const endO=r.y;

/* =================== مثال 3 : الفئران الصفراء =================== */
const hM=head('مثال (3) : الفئران الصفراء',24,230,CL+210);
r=para('الأليل السائد للفئران الصفراء : وهذه تشبه الحالة السابقة فعند تضريب فئران هجينة مع بعضها ينتج موت ربع الاجنة الصفراء والتي هي نقية في الأليل المميت YY مما يؤدي الى تحوير النسبة المظهرية 3 : 1 الى 2/3 صفراء هجينة : 1/3 رمادية . اذن الفئران الصفراء تكون دائما هجينة اي حاملة للجين المميت ولكنها غير متأثرة به . وللجين المميت اهمية في تصميم بعض التجارب الوراثية وفيما يلي تضريب لفردين هجينين لهذا الأليل المميت :',{x:CL+408,y:66,w:396,lh:28});
const seqM=block(hM,r.lines);
const Ms=cross(CL,r.y+2,{lr:'♀ فأرة صفراء هجينة',ll:'♂ فأر اصفر هجين',p:'Yy',g:['Y','y'],org:mouse,pk:'y',
  f:['YY','Yy','Yy','yy'],fk:['d','y','y','g'],nm:['اصفر يموت','اصفر','رمادي'],
  sum:['النسبة المظهرية للافراد الحية :','2/3 صفراء هجينة : 1/3 رمادية']});

/* ---------- whole page in one view ---------- */
const H=Math.max(endT,endO,Ms.end)+14;
const SEP=[CM,CR].map(x=>el('line',{x1:x+4,y1:12,x2:x+4,y2:H-12,stroke:'#b9c8d6','stroke-width':1.5,'stroke-dasharray':'6 6',opacity:0},boxL));
const VB=[-52,0,1316,H];svg.setAttribute('viewBox',VB.join(' '));

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:1,dur:DUR[0]};
let stage=0,T=0,t0=0,paused=false,P=0,last=performance.now();
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

/* خلايا الدم تطفو برفق */
function cell(c,a){c.g.setAttribute('transform',`translate(${f1(c.x)} ${f1(c.y+2*Math.sin(T*1.6+c.i))}) rotate(${f1(c.r+5*Math.sin(T*.9+c.i))}) scale(${f2(.5+.5*a)})`);op(c.g,a);}

/* ---------------- render ---------------- */
function render(){
  const u=DUR.map((_,i)=>clamp(P-i,0,1));
  let a;

  /* 1 — التعريف */
  SEP.forEach(l=>op(l,sm(u[0],0,.15)));
  rev(seqA,u[0],0,.9);

  /* 2 — فقر الدم المنجلي وشكل الخلايا */
  rev(seqB,u[1],0,.6);
  a=sm(u[1],.55,.65);op(R.box,a);op(R.div,a);
  R.nc.forEach((c,i)=>cell(c,sm(u[1],.62+i*.05,.72+i*.05)));
  R.sc.forEach((c,i)=>cell(c,sm(u[1],.75+i*.05,.85+i*.05)));
  a=sm(u[1],.86,.96);R.lb.forEach(t=>op(t,a));

  /* 3 — التأثير المتعدد والجدول */
  rev(seqP,u[2],0,.5);
  a=sm(u[2],.48,.6);op(Tb.frame,a);Tb.hd.forEach(t=>op(t,a));
  Tb.cols.forEach((c,i)=>{a=sm(u[2],.6+i*.12,.72+i*.12);c.forEach(e=>op(e,a));});

  /* 4 ، 5 ، 6 — الدجاج الزاحف */
  rev(seqC,u[3],0,.9);
  Ck.r1(u[4]);Ck.r2(u[5]);

  /* 7 ، 8 ، 9 — الفئران الصفراء */
  rev(seqM,u[6],0,.9);
  Ms.r1(u[7]);Ms.r2(u[8]);

  /* 10 — امثلة اخرى */
  rev(seqO,u[9],0,.9);
}
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render();requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');
DUR.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','المرحلة '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);});
function setUI(){document.title=TITLE;[...dotsEl.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+DUR.length)%DUR.length;const tgt=i+1;
  if(tgt<=P+1e-3)P=i;
  let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  if(tgt-P>1.01)d*=.6;
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1.2,d);
  setUI();}
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(stage-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(stage+1);if(e.key==='ArrowRight')go(stage-1);});
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
function apply(){view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);}
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const camC=()=>({x:VB[0]+VB[2]/2,y:VB[3]/2});
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,camC());
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,camC());
document.getElementById('zreset').onclick=reset;
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
go(0);step();render();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
