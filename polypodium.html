<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);

const lp2=(p,q,u)=>[lerp(p[0],q[0],u),lerp(p[1],q[1],u)];
const show=(e,op)=>{if(op<.01){e.style.display='none';return false;}e.style.display='';e.setAttribute('opacity',f2(op));return true;};
const pop=v=>v*(1+.25*Math.sin(PI*v));
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

const DUR=[5,4,4,6,4,5.5,5,6,4.5,6];
const DARK='#1f2a44',BRN='#a0522d',GRN='#2f7a2a';
const world=G(view);
/* background: sporophyte (2س) above, gametophyte (س) below */
el('rect',{x:0,y:420,width:900,height:300,fill:'#f4e8cc'},world);
el('line',{x1:20,y1:420,x2:880,y2:420,stroke:'#a0522d','stroke-width':2.5,'stroke-dasharray':'10 7'},world);
const Lbk=G(world),Larr=G(world),Lglow=G(world),Lobj=G(world),Ltok=G(world);
{const a=el('text',{class:'lr',x:42,y:398},world);a.textContent='2س';const b=el('text',{class:'lr',x:42,y:444},world);b.textContent='س';}

/* ---------------- building blocks ---------------- */
function Ball(parent,grad,r){const g=G(parent);
  el('circle',{r,fill:`url(#${grad})`,stroke:grad==='gB'?'#10165a':'#9a520c','stroke-width':1},g);
  el('ellipse',{cx:-r*.35,cy:-r*.4,rx:r*.3,ry:r*.2,fill:'#fff',opacity:.55},g);return{g,r};}
function setBall(b,p,s,op){if(!show(b.g,op*(s>.02?1:0)))return;b.g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f2(s)})`);}
function Box(x,y,w,h,lines){const g=G(Lobj);
  el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:4,fill:'#fff',stroke:'#1f3a52','stroke-width':2.2},g);
  lines.forEach((s,i)=>{const t=el('text',{class:'bx',x:0,y:(i-(lines.length-1)/2)*27},g);t.textContent=s;});
  return{g,x,y};}
function setBox(b,v){if(show(b.g,v))b.g.setAttribute('transform',`translate(${b.x} ${b.y}) scale(${f2(.85+.15*v)})`);}
function Txt(x,y,s,cls,rot){const t=el('text',{class:cls||'lb',x,y},Lobj);t.textContent=s;if(rot)t.setAttribute('transform',`rotate(${rot} ${x} ${y})`);return t;}
function Arr(d,col){const g=G(Larr),p=el('path',{d,fill:'none',stroke:col,'stroke-width':3.2,'stroke-linecap':'round'},g),L=p.getTotalLength();
  const e=p.getPointAtLength(L),q=p.getPointAtLength(L-10),a=Math.atan2(e.y-q.y,e.x-q.x),c=Math.cos(a),s=Math.sin(a);
  const h=el('polygon',{points:[[e.x,e.y],[e.x-15*c+7*s,e.y-15*s-7*c],[e.x-15*c-7*s,e.y-15*s+7*c]].map(v=>v.map(f1).join(',')).join(' '),fill:col},g);
  return{g,p,h,L,at:u=>{const v=p.getPointAtLength(u*L);return[v.x,v.y];}};}
function drawArr(A,v){if(!show(A.g,v>.005?1:0))return;A.p.setAttribute('stroke-dasharray',`${f1(v*(A.L-8))} ${f1(A.L+20)}`);A.h.setAttribute('opacity',f2(sm(v,.9,1)));}
const path=(d,a,p)=>el('path',Object.assign({d,fill:'none','stroke-linecap':'round'},a),p);
function grow(g,bx,by,v){if(!show(g,v>.01?1:0))return;g.setAttribute('transform',`translate(${bx} ${by}) scale(${f2(lerp(.45,1,v))} ${f2(Math.max(.01,v))}) translate(${-bx} ${-by})`);}
function popAt(g,cx,cy,v,k){if(!show(g,v>.01?1:0))return;g.setAttribute('transform',`translate(${cx} ${cy}) scale(${f2(pop(v)*(k||1))}) translate(${-cx} ${-cy})`);}
function Dash(p,v){const L=p.__L||(p.__L=p.getTotalLength());p.setAttribute('stroke-dasharray',`${f1(v*L)} ${f1(L+10)}`);}
function frond(par,b,c,t,w){const g=G(par);
  const P=u=>[(1-u)*(1-u)*b[0]+2*(1-u)*u*c[0]+u*u*t[0],(1-u)*(1-u)*b[1]+2*(1-u)*u*c[1]+u*u*t[1]];
  const D=u=>[2*(1-u)*(c[0]-b[0])+2*u*(t[0]-c[0]),2*(1-u)*(c[1]-b[1])+2*u*(t[1]-c[1])];
  const st=w>15?.036:.08;
  for(let u=.12;u<.97;u+=st){const p=P(u),d=D(u),m=Math.hypot(d[0],d[1]),tx=d[0]/m,ty=d[1]/m,nx=-ty,ny=tx;
    const l=2+w*Math.sin(PI*Math.min(1,(u-.08)/.92))*(1-.3*u);
    [-1,1].forEach(s=>path(`M${f1(p[0])},${f1(p[1])} L${f1(p[0]+nx*s*l+tx*l*.32)},${f1(p[1]+ny*s*l+ty*l*.32)}`,{stroke:'#62b844','stroke-width':w>15?4.4:3},g));}
  let dd='M'+b.join(',');for(let u=.05;u<=1.001;u+=.05){const p=P(u);dd+=` L${f1(p[0])},${f1(p[1])}`;}
  path(dd,{stroke:GRN,'stroke-width':w>15?3:2},g);return{g,b};}
const HEART='M447,322 C428,296 380,304 384,352 C388,392 424,414 450,436 C470,414 504,392 508,352 C512,304 466,296 447,322Z';
function Heart(par,cx,cy,s){const g=G(par,{transform:`translate(${cx} ${cy}) scale(${s}) translate(-447 -378)`});
  el('path',{d:HEART,fill:'url(#gHeart)',stroke:'#3d7d22','stroke-width':2/s},g);return g;}
function Sperm(){const g=G(Ltok);path('M0,0 q-5,-4 -10,0 t-10,0',{stroke:'#b8650f','stroke-width':1.6},g);el('circle',{r:3.8,fill:'url(#gO)',stroke:'#9a520c','stroke-width':.8},g);return g;}

/* ================= 1) sporophyte ================= */
const BXs=Box(450,46,230,48,['الطور البوغي 2س']);
const glS=el('circle',{cx:450,cy:200,r:150,fill:'url(#gGlow)',opacity:0},Lglow);
const spoBase=G(Lobj);
for(let i=0;i<13;i++){const x=372+i*13,y=301;path(`M${x},${y} Q${f1(x+(rnd()-.5)*14)},${y+14} ${f1(x+(rnd()-.5)*22)},${f1(322+rnd()*14)}`,{stroke:'#a9714a','stroke-width':1.5},spoBase);}
path('M366,301 Q452,293 538,303',{stroke:'#8b5a2b','stroke-width':6},spoBase);
const spoF=[[[400,300],[360,240],[345,150]],[[428,298],[400,190],[398,104]],[[455,297],[450,180],[458,88]],[[482,298],[505,190],[515,106]],[[508,300],[545,235],[560,150]]].map(a=>frond(Lobj,a[0],a[1],a[2],24));
/* ================= 2) leaflet with sori (underside) ================= */
const A2=Arr('M574,205 Q602,188 628,196',DARK);
const lf=G(Lobj),lfIn=G(lf,{transform:'translate(712 170) rotate(-20)'});
el('path',{d:'M-75,0 Q-40,-34 10,-32 Q60,-28 80,0 Q60,28 10,32 Q-40,34 -75,0Z',fill:'#4a9e3c',stroke:'#2a6a2a','stroke-width':2},lfIn);
path('M-72,0 L78,0',{stroke:'#2a6a2a','stroke-width':2.5},lfIn);
const sori=G(lfIn);
for(let x=-48;x<=62;x+=18)[-14,14].forEach(y=>{el('circle',{cx:x,cy:y*(1-Math.abs(x-7)/150),r:6.5,fill:'url(#gSori)',stroke:'#6a2a05','stroke-width':.8},sori);});
const lLf=Txt(712,96,'وريقة (السطح السفلي)'),lSo=Txt(838,212,'حوافظ أبواغ');
/* ================= 3) sporangium ================= */
const A3=Arr('M742,206 Q770,258 762,320',DARK);
const SPG=[760,358],spg=G(Lobj);
path('M752,376 Q745,395 735,408',{stroke:'#8a4a1a','stroke-width':4},spg);
el('ellipse',{cx:760,cy:358,rx:28,ry:20,fill:'url(#gSpg)',stroke:'#8a4a1a','stroke-width':2},spg);
const spgIn=G(spg);[[-10,-4],[0,-7],[10,-3],[-5,6],[6,6],[15,3]].forEach(([x,y])=>{const b=Ball(spgIn,'gO',4);b.g.setAttribute('transform',`translate(${760+x} ${358+y})`);});
const ann=G(spg);
for(let k=0;k<=13;k++){const a=lerp(-195,15,k/13)*PI/180,c=Math.cos(a),s=Math.sin(a);
  path(`M${f1(760+28*c)},${f1(358+20*s)} L${f1(760+36*c)},${f1(358+28*s)}`,{stroke:'#7a3a10','stroke-width':4.5},ann);}
const lSpg=Txt(640,358,'حافظة أبواغ 2س');
/* ================= 4) meiosis -> spores ================= */
const BXm=Box(816,446,158,40,['انقسام اختزالي']);
const A4=Arr('M750,388 Q750,440 730,478',BRN);
const SPC=[[712,492],[730,488],[748,495],[718,508],[736,506],[752,512],[726,522],[744,524]];
const spores=SPC.map(()=>Ball(Lobj,'gO',6));
const lSp=Txt(812,512,'أبواغ س');
/* ================= 5) germination ================= */
const A5=Arr('M722,532 Q712,556 700,568',BRN);
const germ=G(Lobj),gFil=path('M688,588 q-9,5 -18,3 t-18,4',{stroke:'#4caf50','stroke-width':7},germ);
path('M688,594 q2,8 -2,14',{stroke:'#b07a4a','stroke-width':1.5},germ);
const gSp=Ball(germ,'gO',8);gSp.g.setAttribute('transform','translate(692 588)');
const lGe=Txt(782,590,'إنبات البوغ');
/* ================= 6) prothallus ================= */
const A6=Arr('M640,600 Q600,628 548,612',BRN),lA6=Txt(600,646,'انقسام خيطي','lb',-8);
const PR=G(Lobj);
for(let i=0;i<9;i++){const sx=428+i*6,ex=400+i*12+rnd()*6;path(`M${sx},655 Q${f1(lerp(sx,ex,.5)+(rnd()-.5)*10)},675 ${f1(ex)},${f1(692+rnd()*12)}`,{stroke:'#b07a4a','stroke-width':1.6},PR);}
Heart(PR,450,585,1.4);
const lRh=Txt(560,694,'أشباه الجذور');
const BXg=Box(275,690,190,40,['الطور المشيجي س']);
/* ================= 7) sex organs ================= */
const org=G(Lobj);
[[436,530],[450,526],[464,531]].forEach(([x,y])=>{el('ellipse',{cx:x,cy:y,rx:5,ry:7,fill:'#1f6a2a'},org);});
[[440,632],[456,642],[472,628],[430,644]].forEach(([x,y])=>el('circle',{cx:x,cy:y,r:5,fill:'#8bd06a',stroke:'#1f6a2a','stroke-width':1.5},org));
const cn=[path('M272,540 L430,529',{stroke:'#1f3a52','stroke-width':1.8,'stroke-dasharray':'5 4'},Lobj),path('M270,626 L426,636',{stroke:'#1f3a52','stroke-width':1.8,'stroke-dasharray':'5 4'},Lobj)];
const water=el('ellipse',{cx:250,cy:582,rx:72,ry:90,fill:'#bfe0f7',opacity:0,stroke:'#7fb1d6','stroke-width':1.5,'stroke-dasharray':'4 4'},Lbk);
const arG=G(Lobj);
el('rect',{x:244,y:494,width:12,height:32,rx:5,fill:'#4caf50',stroke:'#1b5e20','stroke-width':2},arG);
el('ellipse',{cx:250,cy:546,rx:21,ry:23,fill:'#4caf50',stroke:'#1b5e20','stroke-width':2.5},arG);
const EGG=[250,548],eggO=Ball(Lobj,'gO',10),eggB=Ball(Lobj,'gB',10);
const anG=G(Lobj);
el('circle',{cx:250,cy:626,r:19,fill:'#8bd06a',stroke:'#1b5e20','stroke-width':2.5},anG);
[[-7,-5],[5,-7],[8,4],[-6,7],[0,0],[-1,-11]].forEach(([x,y])=>el('circle',{cx:250+x,cy:626+y,r:2.6,fill:'#e08a1a'},anG));
const lAr=Txt(132,540,'أركيكونيوم'),lAn=Txt(132,628,'أنثريديوم');
/* ================= 8) fertilisation ================= */
const BXf=Box(305,468,100,40,['إخصاب']);
const sperms=[0,1,2,3,4].map(()=>Sperm()),lNt=Txt(306,590,'نطف');
const glE=el('circle',{cx:250,cy:548,r:55,fill:'url(#gGlow)',opacity:0},Ltok);
const spP=(i,u)=>[250+(16*Math.sin(u*PI*4+i*1.3)+(i-2)*11)*(1-u),lerp(608,552,u)];
/* ================= 9) zygote ================= */
const A9=Arr('M230,526 Q178,470 210,394',DARK);
const ZP=[215,372],zyg=Ball(Ltok,'gB',16),lZy=Txt(118,372,'زيجة 2س');
/* ================= 10) young sporophyte ================= */
const A10=Arr('M215,350 Q205,305 218,282',DARK),lA10=Txt(130,312,'انقسام خيطي');
const ys=G(Lobj);
path('M222,262 Q218,276 212,290 M224,262 Q232,276 236,288',{stroke:'#8b5a2b','stroke-width':1.8},ys);
Heart(ys,220,252,.45);
frond(ys,[223,246],[204,205],[232,165],11);frond(ys,[226,247],[250,220],[257,192],8);
const lYs=Txt(222,140,'طور بوغي فتي');
const A11=Arr('M266,212 Q320,236 368,240',DARK);
/* travelling token */
const tkO=Ball(Ltok,'gO',9);

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:0,dur:1};
let stage=-1,T=0,t0=0,last=performance.now(),P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

function render(t){
  const u=i=>clamp(P-(i-1),0,1),s1=u(1),s2=u(2),s3=u(3),s4=u(4),s5=u(5),s6=u(6),s7=u(7),s8=u(8),s9=u(9),s10=u(10);
  const br=k=>1+.03*Math.sin(t*1.6+k);
  /* 1 sporophyte */
  setBox(BXs,sm(s1,0,.25));show(spoBase,sm(s1,.05,.3));
  spoF.forEach((f,i)=>grow(f.g,f.b[0],f.b[1],sm(s1,.15+.08*i,.6+.08*i)));
  glS.setAttribute('opacity',f2(.8*Math.sin(PI*sm(s10,.75,1))));
  /* 2 leaflet + sori */
  drawArr(A2,sm(s2,0,.45));popAt(lf,712,170,sm(s2,.35,.7),br(1));
  show(sori,sm(s2,.6,.85));show(lLf,sm(s2,.55,.8));show(lSo,sm(s2,.7,.95));
  /* 3 sporangium */
  drawArr(A3,sm(s3,0,.45));popAt(spg,760,358,sm(s3,.35,.7),br(2));show(lSpg,sm(s3,.6,.9));
  /* 4 meiosis: sporangium opens, spores (س) released */
  setBox(BXm,sm(s4,0,.2));drawArr(A4,sm(s4,.1,.45));
  ann.setAttribute('transform',`rotate(${f1(-50*sm(s4,.3,.45))} 734 362)`);
  show(spgIn,1-sm(s4,.35,.5));
  const e0=A4.at(1);
  spores.forEach((b,j)=>{const v=sm(s4,.35+.035*j,.75+.03*j),a=A4.at(v),p=[a[0]+(SPC[j][0]-e0[0])*v,a[1]+(SPC[j][1]-e0[1])*v];
    setBall(b,p,lerp(.6,1,v)*br(j),s4>.35+.035*j?(j===0?1-sm(s5,.1,.3):1):0);});
  show(lSp,sm(s4,.8,.95));
  /* 5 germination */
  drawArr(A5,sm(s5,0,.4));
  const g5=sm(s5,.3,.5);if(show(germ,g5>.01?1:0)){Dash(gFil,sm(s5,.5,.85));}
  if(s5<.3&&s5>.1)setBall(tkO,A5.at(sm(s5,.1,.3)),.7,1);
  show(lGe,sm(s5,.6,.85));
  /* 6 prothallus */
  drawArr(A6,sm(s6,0,.4));show(lA6,sm(s6,.25,.5));
  if(s6>.05&&s6<.45)setBall(tkO,A6.at(sm(s6,.05,.4)),1,1-sm(s6,.38,.45));else if(!(s5<.3&&s5>.1))show(tkO.g,0);
  popAt(PR,450,640,sm(s6,.4,.8),br(4));show(lRh,sm(s6,.7,.9));setBox(BXg,sm(s6,.75,.95));
  /* 7 sex organs */
  show(org,sm(s7,0,.3));cn.forEach((c,i)=>{if(show(c,s7>.2?1:0))Dash(c,sm(s7,.2+.1*i,.45+.1*i));});

ولها إلى الثالوس الأولي"],["يمثل الطور السائد","يمثل الطور غير السائد"]]}}},{"type":"املأ الفراغ","tags":["3/2014"],"q":"يحمل الثالوس حافظات مشيجية ذكرية تدعى {أنثريديوم} وحافظات مشيجية أنثوية تدعى {أركيكونيوم} ."},{"type":"املأ الفراغ","tags":["1/2016"],"q":"الحافظات المشيجية الذكرية للسراخس تسمى {الأنثريديا} والحافظة الأنثوية {الأركيكونيا} ."},{"type":"املأ الفراغ","tags":["1/2020","3/2023","2021 تمهيدي","أسئلة الفصل"],"q":"الثالوس الأولي تركيب قلبي الشكل يحمل {أركيكونات} وهي حافظات مشيجية أنثوية و{أنثريدات} وهي حافظات مشيجية ذكرية ."},{"type":"املأ الفراغ","tags":["2/2021 تكميلي"],"q":"{الثالوس الأولي} تركيب قلبي الشكل أخضر اللون يحمل الأركيكونيوم والأنثريديوم وينمو من طرفه المدبب أشباه الجذور ."},{"type":"املأ الفراغ","tags":["1/2022"],"q":"في السرخسيات الطور السائد هو {الطور البوغي} والحافظة البوغية تتخذ موقعاً على {السطح السفلي للأوراق} ."},{"type":"املأ الفراغ","tags":["1/2024 نظام المحاولات"],"q":"يتكون الزايكوت في السرخسيات نتيجة {عملية الإخصاب} وهو يتكون داخل {الأركيكونيوم} ."}]};</script>
<script>
/* MoeLab — محرك الأسئلة الوزارية
   يُحقن تلقائياً داخل كل محاكاة لها أسئلة (لا تعدّل النسخ المحقونة يدوياً — عدّل هذا الملف ثم شغّل build.py).
   مبدأ الأمان: أي خطأ هنا يُخفي زر الوزاريات فقط ولا يؤثر على المحاكاة. */
(function(){try{
var D=window.MOE_MIN_DATA;if(!D||!D.qs||!D.qs.length)return;
var stage=document.getElementById('stage')||document.body;
/* محاكيات بقالب آخر (أزرار التكبير داخل .side خارج #stage): نضع العناصر فوق الصفحة كلها */
var ZB=document.querySelector('.zb')||(function(){var z=document.getElementById('zin');return z&&z.parentElement;})();
if(!document.querySelector('.zb')&&ZB&&!stage.contains(ZB)){stage=document.body;document.documentElement.classList.add('moe-fixed');}
var AR=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];});};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var tagK=function(s){return /الفصل|الكتاب|التلفزيون/.test(s)?'book':/خارج|الموصل|المتميزين|النازحين|المحاولات/.test(s)?'out':/تمهيدي|تكميلي/.test(s)?'pre':'min';};
var tagH=function(s){var k=tagK(s);return '<span class="tg '+k+'">'+esc(k==='book'?s:'وزاري '+s)+'</span>';};
var minCount=function(q){var t=(q.tags||[]).slice();(q.items||[]).forEach(function(i){t=t.concat(i.tags||[]);});return t.filter(function(s){return tagK(s)!=='book';}).length;};
var $=function(id){return document.getElementById(id);};

/* ---------- DOM ---------- */
var wrap=document.createElement('div');
wrap.innerHTML='<button id="qbtn" type="button" aria-label="الأسئلة الوزارية">📝 الوزاريات <b id="qcnt"></b></button>'+
 '<div id="hlbar"><span id="hlname"></span><button id="hlback" type="button">↩ رجوع للسؤال</button></div>'+
 '<div id="qp" role="dialog" aria-label="الأسئلة الوزارية">'+
  '<div id="qhd"><div class="t">📝 الأسئلة الوزارية</div><button id="qx" type="button" aria-label="إغلاق">✕</button></div>'+
  '<div id="qchips"></div><div id="qbody"></div>'+
  '<div id="qft"><button id="qprev" type="button">السابق ▶</button><button id="qa" type="button">إظهار الحل 💡</button><button id="qnext" type="button">التالي ◀</button></div>'+
 '</div>';
while(wrap.firstChild)stage.appendChild(wrap.firstChild);
/* place the button just to the right of the sim's zoom buttons (or under them if they are in a row) */
function placeBtn(){try{var b=$('qbtn'),zb=ZB,st=stage===document.body?{left:0,top:0,width:innerWidth,height:innerHeight}:stage.getBoundingClientRect();
  if(!zb){b.style.left='10px';b.style.top='10px';return;}
  var r=zb.getBoundingClientRect(),row=getComputedStyle(zb).flexDirection==='row';
  if(!r.width||!r.height){b.style.left='10px';b.style.top='10px';return;}
  var below=function(){b.style.left=Math.round(r.left-st.left)+'px';b.style.top=Math.round(r.bottom-st.top+8)+'px';};
  if(row||placeBtn.down){below();return;}
  b.style.left=Math.round(r.right-st.left+10)+'px';b.style.top=Math.round(r.top-st.top)+'px';
  /* if the sim shows its own caption/banner in that spot, move under the zoom buttons (and stay there) */
  var q=b.getBoundingClientRect(),hit=false;
  [].forEach.call(stage.querySelectorAll('*'),function(e){if(hit||e===b||(zb&&zb.contains(e))||e.closest('.zb,#qp,#hlbar,#qbtn'))return;
    if(e.parentElement!==stage&&!e.id)return;
    var cs=getComputedStyle(e);if(cs.position==='static'||cs.display==='none'||cs.visibility==='hidden'||!(e.textContent||'').trim())return;
    var x=e.getBoundingClientRect();if(!x.width||x.width>st.width*.9||x.height>120)return;
    if(x.left<q.right&&x.right>q.left&&x.top<q.bottom&&x.bottom>q.top)hit=true;});
  if(hit){placeBtn.down=true;below();}}catch(_){}}
placeBtn();setInterval(placeBtn,700);window.addEventListener('resize',placeBtn);document.addEventListener('fullscreenchange',function(){setTimeout(placeBtn,50);});

var qp=$('qp'),qbody=$('qbody'),qchips=$('qchips'),qa=$('qa'),qprev=$('qprev'),qnext=$('qnext');
var QS=D.qs,SEC=D.sections||{},NAMES=D.names||{};
$('qcnt').textContent=AR(QS.length);
var secKeys=Object.keys(SEC).filter(function(k){return QS.some(function(q){return q.sec===k;});});
if(secKeys.length<2)qchips.style.display='none';
var qsec='all',qi=0,qrev=false,qOpen=false;
var list=function(){return qsec==='all'?QS:QS.filter(function(q){return q.sec===qsec;});};
qchips.innerHTML=[['all','الكل']].concat(secKeys.map(function(k){return [k,SEC[k]];})).map(function(a){return '<button type="button" data-k="'+a[0]+'">'+esc(a[1])+'</button>';}).join('');
qchips.onclick=function(e){var b=e.target.closest('button');if(!b)return;qsec=b.dataset.k;qi=0;qrev=false;render();};

function ansH(a){var h='';if(!a)return h;if(a.p&&!a.tb)h+='<div>'+esc(a.p)+'</div>';
  if(a.ol)h+='<ol>'+a.ol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(a.tb)h+='<div class="tbw"><table><tr>'+a.tb.h.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>'+a.tb.r.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
  if(a.dl)h+='<dl>'+a.dl.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl>';if(a.p&&a.tb)h+='<div class="note">'+esc(a.p)+'</div>';return h;}
var SIM=null;function sim(){return SIM||(SIM=window.MOE_SIM||null);}
function canSee(k){var s=sim();return !!(k&&s&&s.groups&&s.groups[k]);}
function render(){try{render0();}catch(err){qOpen=false;qp.classList.remove('on');$('qbtn').style.display='none';if(window.console)console.warn('MoeLab ministerial:',err);}}
function render0(){
  var L=list(),q=L[qi];
  [].forEach.call(qchips.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===qsec);});
  var n=minCount(q);
  var h='<div class="qc'+(qrev?' rev':'')+'"><div class="qtop"><span class="qty">'+esc(q.type)+'</span>'+
    (n>=3?'<span class="qfire">🔥 تكرر وزارياً '+AR(n)+' مرات</span>':'')+'<span class="qnum">'+AR(qi+1)+' / '+AR(L.length)+'</span></div>';
  if(q.tags&&q.tags.length)h+='<div class="tags">'+q.tags.map(tagH).join('')+'</div>';
  h+='<div class="qq">'+esc(q.q).replace(/\{([^}]*)\}/g,'<span class="blank">$1</span>')+'</div>';
  if(q.opts)h+='<div class="opts">'+q.opts.map(function(o,k){return '<button type="button" class="opt'+(qrev&&k===q.ans?' ok':'')+'" data-k="'+k+'">'+'أبجد'[k]+' ) '+esc(o)+'</button>';}).join('')+'</div>';
  if(q.items)h+='<ol class="items">'+q.items.map(function(it){var t=it.tags||[];return '<li>'+esc(it.t)+(t.length?'<div class="tags">'+t.map(tagH).join('')+'</div>':'')+'<div class="ia">'+esc(it.a||q.common||'')+'</div></li>';}).join('')+'</ol>';
  if(q.a)h+='<div class="ans"><div class="h">✔ الجواب</div>'+ansH(q.a)+'</div>';
  if(canSee(q.hl))h+='<div class="see"><button type="button" id="qsee">📍 شوف '+esc(NAMES[q.hl]||'')+' بالمحاكاة</button></div>';
  qbody.innerHTML=h+'</div>';qbody.scrollTop=0;
  qa.textContent=qrev?'إخفاء الحل':'إظهار الحل 💡';qa.classList.toggle('hide',qrev);
  qprev.disabled=qi===0;qnext.disabled=qi>=L.length-1;
  [].forEach.call(qbody.querySelectorAll('.opt'),function(b){b.onclick=function(){if(+b.dataset.k===q.ans){qrev=true;render();}else b.classList.add('no');};});
  var s=$('qsee');if(s)s.onclick=function(){hlStart(q.hl);};
}
qa.onclick=function(){qrev=!qrev;render();};
qprev.onclick=function(){if(qi>0){qi--;qrev=false;render();}};
qnext.onclick=function(){if(qi<list().length-1){qi++;qrev=false;render();}};
function show(on){qOpen=on;qp.classList.toggle('on',on);if(on)render();}
$('qbtn').onclick=function(){hlStop();show(true);};
$('qx').onclick=function(){show(false);};

/* ---------- highlight inside the simulation (only if the sim registered window.MOE_SIM) ---------- */
var HL=null;
function els(keys,map){var a=[];keys.forEach(function(k){(map[k]||[]).forEach(function(e){a.push(e);});});return a;}
function bbox(arr){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;arr.forEach(function(e){try{var b=e.getBBox();if(!b.width&&!b.height)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}catch(_){}});return x0<x1?{x0:x0,y0:y0,x1:x1,y1:y1}:null;}
var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function hlStart(k){
  var s=sim();if(!canSee(k))return;show(false);
  try{s.finish();}catch(_){}
  var parts=s.groups[k],on=els(parts,s.parts),labs=els(parts,s.labels||{});
  var all=els(Object.keys(s.parts),s.parts),allL=els(Object.keys(s.labels||{}),s.labels||{});
  var v=s.view.get(),vb=s.view.box,b=bbox(on.concat(labs)),to=v;
  if(b){var pad=30,cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,ks=Math.max(1,Math.min(2.6,vb[2]/(b.x1-b.x0+2*pad),vb[3]/(b.y1-b.y0+2*pad)));
    to=[ks,vb[0]+vb[2]/2-cx*ks,vb[1]+vb[3]/2-cy*ks];}
  HL={k:k,s:s,on:new Set(on),labs:new Set(labs),all:all,allL:allL,glows:els(parts,s.glows||{}),t0:performance.now(),from:v,to:to};
  $('hlname').textContent='📍 '+(NAMES[k]||'');
  $('hlbar').classList.add('on');document.body.classList.add('hlmode');
  requestAnimationFrame(tick);
}
function hlStop(){if(!HL)return;var s=HL.s;HL=null;$('hlbar').classList.remove('on');document.body.classList.remove('hlmode');try{s.view.reset();}catch(_){}}
function tick(ms){
  if(!HL)return;
  try{
    var u=(ms-HL.t0)/1000,z=ease(Math.max(0,Math.min(1,u/.8))),L=function(a,b){return a+(b-a)*z;};
    HL.s.view.set(L(HL.from[0],HL.to[0]),L(HL.from[1],HL.to[1]),L(HL.from[2],HL.to[2]));
    var p=.5+.5*Math.sin(u*4.2);
    HL.all.forEach(function(e){if(!HL.on.has(e))e.setAttribute('opacity','0.18');});
    HL.allL.forEach(function(e){e.setAttribute('opacity',HL.labs.has(e)?'1':'0.15');});
    HL.glows.forEach(function(g){g.style.display='';g.setAttribute('opacity',(.35+.45*p).toFixed(2));});
    if(HL.s.pulse)HL.s.pulse(HL.k,p);
  }catch(e){hlStop();return;}
  requestAnimationFrame(tick);
}
$('hlback').onclick=function(){hlStop();show(true);};
/* any simulation button stops the highlight */
['go','prev','zreset'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',hlStop,true);});

/* keyboard: while the panel is open the arrows move between questions, not the simulation */
window.addEventListener('keydown',function(e){
  if(qOpen){e.stopImmediatePropagation();e.preventDefault();
    if(e.key==='ArrowLeft')qnext.click();else if(e.key==='ArrowRight')qprev.click();else if(e.key==='Escape')show(false);}
  else if(HL&&e.key==='Escape'){hlStop();}
},true);
}catch(err){try{var b=document.getElementById('qbtn');if(b)b.style.display='none';var p=document.getElementById('qp');if(p)p.style.display='none';}catch(_){} if(window.console)console.warn('MoeLab ministerial:',err);}})();

</script>
<!--MOE-MIN:END--></body>
</html>
