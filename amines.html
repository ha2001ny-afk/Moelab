<title>مختبر الأمينات</title>
<style>

   COLOUR and TYPE: أبيض افتراضياً مع خلفيات غامقة اختيارية، خط Tajawal
   LAYOUT: تبويبات في الأعلى، المعادلة فوق المشهد، أدوات القلم بجانبها */
:root{--bg:#fff;--ink:#1b2430;--muted:#5b6877;--line:#dbe2ea;--chip:#f1f4f8;--acc:#1769d1;--pop:#fff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--ink);font:500 15px/1.5 Tajawal,system-ui,Tahoma,sans-serif;transition:background .3s}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);line-height:1.2}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:700 14px Tajawal,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.tab b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);margin-inline-end:6px;font-size:12px}
.tab[aria-selected=true]{background:var(--acc);border-color:transparent;color:#fff}
.tab[aria-selected=true] b{background:rgba(255,255,255,.25)}
.tools{display:flex;gap:6px;flex:none}
.ib{width:42px;height:42px;padding:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--chip);color:var(--ink);cursor:pointer}
.ib:hover{border-color:var(--acc);color:var(--acc)}
.ib[aria-pressed=true]{background:var(--acc);color:#fff;border-color:transparent}
.ib svg{width:20px;height:20px}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sub{display:flex;gap:10px;align-items:center;padding:6px 12px;overflow-x:auto;border-bottom:1px solid var(--line);min-height:48px;scrollbar-width:thin}
.grp{display:flex;gap:5px;flex:none;padding-inline-end:10px;border-inline-end:1px solid var(--line)}
.chip{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:700 13px Tajawal,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:transparent}
.hint{color:var(--muted);font-size:13px;white-space:nowrap}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#ink{z-index:2;pointer-events:none}
#ink.on{pointer-events:auto;cursor:crosshair}
#eq{position:absolute;z-index:3;top:8px;left:50%;transform:translateX(-50%);direction:ltr;unicode-bidi:isolate;white-space:nowrap;max-width:96%;overflow:hidden;font:700 clamp(15px,2.1vw,22px)/1.25 Tajawal,system-ui,sans-serif;padding:7px 16px;border-radius:12px;background:var(--chip);border:1px solid var(--line);pointer-events:none;display:flex;align-items:center}
#eq .p{opacity:0;transition:opacity .7s;display:inline-flex;align-items:center}
#eq .p.on{opacity:1}
.arr{display:inline-flex;flex-direction:column;align-items:center;margin:0 10px}
.arr small{font-size:.56em;line-height:1.15;color:var(--muted);unicode-bidi:plaintext}
.arr i{display:block;width:74px;height:2px;background:currentColor;position:relative;margin:2px 0}
.arr i::after{content:"";position:absolute;right:-2px;top:-5px;border-left:10px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
#rxbar{position:absolute;z-index:4;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
#rxbar .ib{width:38px;height:38px;border-radius:50%}
#rxbar input{width:min(240px,40vw);accent-color:var(--acc)}
#rxbar span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.pop{position:absolute;z-index:6;top:8px;left:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:14px;background:var(--pop);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:calc(100% - 20px)}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:3px solid var(--acc);outline-offset:2px}
.pop .lbl{font-size:12px;color:var(--muted);padding:0 4px}
.th{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--chip);display:grid;place-items:center;cursor:pointer;padding:0}
.th[aria-pressed=true]{outline:3px solid var(--acc)}
.th i{display:block;background:var(--ink);border-radius:9px}
#toast{position:absolute;z-index:7;left:50%;bottom:62px;transform:translateX(-50%);max-width:min(92vw,560px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;text-align:center;transition:opacity .4s;pointer-events:none}
[hidden]{display:none!important}
header{background:#137a4c;color:#fff;border-bottom-color:#0f6340}
header .brand small{color:rgba(255,255,255,.78)}
header .tab,header .ib{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
header .tab b{background:rgba(255,255,255,.2)}
header .tab[aria-selected=true]{background:#fff;color:#137a4c}
header .tab[aria-selected=true] b{background:#137a4c;color:#fff}
header .ib:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.22)}
header .ib[aria-pressed=true]{background:#fff;color:#137a4c;border-color:transparent}
header button:focus-visible{outline-color:#fff}
@media(max-width:760px){.brand small{display:none}.brand{font-size:15px}.tab{padding:0 10px;font-size:13px}.ib{width:38px;height:38px}}
@media(max-width:520px){.brand{display:none}}
</style>

</header>
<div class="sub" id="sub"></div>
