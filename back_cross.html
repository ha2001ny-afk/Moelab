<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>التضريب الرجعي</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:18px;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav{width:62px;height:62px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:26px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .nav:active{background:#d9ebf7}
  .nav:focus-visible,.dot:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  #dots{display:flex;gap:12px;align-items:center}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .gt{fill:#1b1b1b;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:24px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .gm{fill:#2a1206;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:22px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .rl{fill:#1f3a52;font-family:"Times New Roman",Georgia,serif;font-weight:bold;font-size:30px;text-anchor:middle;dominant-baseline:central;direction:ltr}
  .ar{fill:#1f3a52;font-size:15px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .lb{fill:#1f3a52;font-size:13px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .pc{fill:#1f3a52;font-size:14px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .hd{fill:#fff;font-size:14px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .sx{fill:#1f3a52;font-size:24px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<div id="top"><div id="title">التضريب الرجعي</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="235 0 390 445" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="gGam" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#ffb184"/><stop offset=".55" stop-color="#ef6d31"/><stop offset="1" stop-color="#c9501c"/></radialGradient>
        <linearGradient id="gGeno" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff38a"/><stop offset="1" stop-color="#ffe23a"/></linearGradient>
        <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fb"/><stop offset="1" stop-color="#e4eaf0"/></linearGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".9"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="المرحلة السابقة">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="المرحلة التالية">◀</button>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));

const TITLE='التضريب الرجعي';
const DUR=[5,5,8,4];          /* P1 · G1 · F1 · التعريف */

const world=G(view);
const glowL=G(world),boxL=G(world),arrL=G(world),gridL=G(world),objL=G(world),mvL=G(world);

/* ---------- builders ---------- */
const box=(y,h)=>el('rect',{x:300,y,width:300,height:h,rx:6,fill:'url(#gBox)',stroke:'#1f3a52','stroke-width':2,opacity:0},boxL);
function geno(p,s){const g=G(p,{opacity:0});
  el('rect',{x:-33,y:-18,width:66,height:36,rx:4,fill:'url(#gGeno)',stroke:'#d9b80f','stroke-width':1.5},g);
  el('text',{class:'gt',x:0,y:1},g).textContent=s;return g;}
function gam(p,s){const g=G(p,{opacity:0});
  el('circle',{cx:1.5,cy:2.5,r:21,fill:'#1f3a52',opacity:.18,filter:'url(#blur)'},g);
  el('circle',{cx:0,cy:0,r:21,fill:'url(#gGam)',stroke:'#b84e1e','stroke-width':2},g);
  el('text',{class:'gm',x:0,y:1},g).textContent=s;return g;}
function rowLbl(y,n){const t=el('text',{class:'rl',x:268,y,opacity:0},world);
  t.textContent=n[0];const s=el('tspan',{'font-size':18,dy:9},t);s.textContent=n[1];return t;}
function varrow(y0,y1){const g=G(arrL,{opacity:0}),L=y1-y0;
  el('rect',{x:-2.5,y:0,width:5,height:L-14,fill:'#1f3a52'},g);
  el('path',{d:`M-10,${L-16} L0,${L} L10,${L-16}Z`,fill:'#1f3a52'},g);
  return{g,y0};}
const cross=y=>{const t=el('text',{class:'sx',x:450,y,opacity:0},objL);t.textContent='×';return t;};
const glow=(x,y,r)=>el('circle',{cx:x,cy:y,r:r||60,fill:'url(#gGlow)',opacity:0},glowL);
function txt(s,x,y,c,p){const t=el('text',{class:c,x,y,opacity:0},p||world);t.textContent=s;return t;}
function pct(s,n,x,y){const t=el('text',{class:'pc',x,y,opacity:0},world);
  const a=el('tspan',{},t);a.textContent=s+' ';const b=el('tspan',{fill:'#c4623a','font-size':17},t);b.textContent=n+' %';return t;}
function head(s,y){const g=G(world,{opacity:0});
  el('rect',{x:310,y:y-13,width:280,height:26,rx:13,fill:'#c4623a'},g);
  el('text',{class:'hd',x:450,y:y+1},g).textContent=s;return g;}
const op=(e,a)=>e.setAttribute('opacity',f2(a));
function place(o,x,y,s,op){o.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) scale(${f2(s)})`);o.setAttribute('opacity',f2(op));}
const grow=(A,s)=>{A.g.setAttribute('opacity',s>0?1:0);A.g.setAttribute('transform',`translate(450 ${A.y0}) scale(1 ${f2(Math.max(s,.001))})`);};

/* ---------- layout ---------- */
const XL=380,XR=520,PY=80,GY=170,FY=264,RX1=495,RX2=545;

const hd=head('تضريب فرد هجين مع الأب السائد النقي',19);

/* P1 */
const bP=box(36,66),lP=rowLbl(PY,'P1');
const lbL=txt('♀ نبتة طويلة الساق نقية',XL,52,'lb'),lbR=txt('♂ نبات طويل الساق هجين',XR,52,'lb');
const gL=geno(objL,'TT'),gR=geno(objL,'Tt'),x1=cross(PY);

/* G1 */
const A1=varrow(104,138),mei=txt('انقسام اختزالي',528,121,'ar');
const bG=box(140,60),lG=rowLbl(GY,'G1');
const gmL=gam(objL,'T'),gmR1=gam(objL,'T'),gmR2=gam(objL,'t');

/* F1 */
const A2=varrow(202,236);
const bF=box(238,80),lF=rowLbl(278,'F1');
const plus=txt('+',450,FY,'sx');
const CELLS=[[385,'TT',RX1,'T'],[515,'Tt',RX2,'t']].map(([x,s,sx,ms])=>({
  x,sx,g:geno(objL,s),gl:glow(x,FY,55),m:[gam(mvL,'T'),gam(mvL,ms)]}));
const res=pct('طويل الساق','100',450,300);

/* definition card */
const card=G(world,{opacity:0});
el('rect',{x:300,y:338,width:300,height:96,rx:8,fill:'#fff8d6',stroke:'#c4623a','stroke-width':2},card);
const ct=el('text',{class:'ar',x:450,y:358},card);
el('tspan',{},ct).textContent='التضريب الرجعي ';
const ce=el('tspan',{'font-family':'"Times New Roman",Georgia,serif','font-size':16,fill:'#c4623a'},ct);ce.textContent='(Back Cross)';
txt('تضريب بين أفراد هجينة من الجيل الأول',450,386,'lb',card).setAttribute('opacity',1);
txt('مع أحد الأبوين أو مع فرد يماثل أحدهما',450,410,'lb',card).setAttribute('opacity',1);

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:1,dur:DUR[0]};
let stage=0,T=0,t0=0,paused=false,P=0,last=performance.now();
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

/* ---------------- render ---------------- */
function render(){
  const u=DUR.map((_,i)=>clamp(P-i,0,1));
  let a,mv,fd,on;

  /* P1: ♀ TT × ♂ Tt */
  op(hd,sm(u[0],0,.2));
  a=sm(u[0],.1,.35);op(bP,a);op(lP,a);
  op(lbL,sm(u[0],.25,.45));a=sm(u[0],.3,.6);place(gL,XL,PY,.4+.6*a,a);
  op(lbR,sm(u[0],.4,.6));a=sm(u[0],.45,.75);place(gR,XR,PY,.4+.6*a,a);
  op(x1,sm(u[0],.7,.9));

  /* G1: the pure parent gives only T, the hybrid gives T and t */
  grow(A1,sm(u[1],0,.2));op(mei,sm(u[1],.1,.25));
  a=sm(u[1],.15,.3);op(bG,a);op(lG,a);
  a=sm(u[1],.25,.55);place(gmL,XL,lerp(PY,GY,a),.5+.5*a,sm(u[1],.25,.32));
  a=sm(u[1],.4,.7);place(gmR1,lerp(XR,RX1,a),lerp(PY,GY,a),.5+.5*a,sm(u[1],.4,.47));
  a=sm(u[1],.55,.85);place(gmR2,lerp(XR,RX2,a),lerp(PY,GY,a),.5+.5*a,sm(u[1],.55,.62));

  /* F1: ♀ gamete T meets each ♂ gamete in turn */
  grow(A2,sm(u[2],0,.15));
  a=sm(u[2],.05,.2);op(bF,a);op(lF,a);
  CELLS.forEach((c,k)=>{const s0=.15+k*.33;
    mv=sm(u[2],s0,s0+.18);fd=sm(u[2],s0+.15,s0+.24);on=u[2]>s0?1:0;
    place(c.m[0],lerp(XL,c.x-14,mv),lerp(GY,FY,mv),1-.25*mv,on*(1-fd));
    place(c.m[1],lerp(c.sx,c.x+14,mv),lerp(GY,FY,mv),1-.25*mv,on*(1-fd));
    a=sm(u[2],s0+.18,s0+.3);place(c.g,c.x,FY,.4+.6*a,a);
    op(c.gl,Math.sin(PI*sm(u[2],s0+.18,s0+.42)));});
  op(plus,sm(u[2],.5,.6));
  op(res,sm(u[2],.82,.95));

  /* definition */
  a=sm(u[3],.1,.5);card.setAttribute('opacity',f2(a));
  card.setAttribute('transform',`translate(0 ${f1(20*(1-a))})`);
}
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render();requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');
DUR.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','المرحلة '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);});
function setUI(){document.title=TITLE;[...dotsEl.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+DUR.length)%DUR.length;const tgt=i+1;
  if(tgt<=P+1e-3)P=i;          /* going back or replaying: restart that stage */
  let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  if(tgt-P>1.01)d*=.6;
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1.2,d);
  setUI();}
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(stage-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(stage+1);if(e.key==='ArrowRight')go(stage-1);});
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:430,y:220});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:430,y:220});
document.getElementById('zreset').onclick=reset;
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
go(0);render();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
