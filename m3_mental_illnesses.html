<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>الأمراض النفسية</title>
<style>
  html,body{touch-action:pan-x pan-y}
  html,body{margin:0;height:100%;overflow:hidden;background:#f4f7fa;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(13px,3.4vw,22px);font-weight:bold;text-align:center;line-height:1.3}
  #nav{position:absolute;top:56px;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border-bottom:1px solid #e3e8ee;padding:0 6px;box-sizing:border-box;overflow-x:auto;z-index:6}
  #nav button{flex:0 0 auto;height:38px;padding:0 14px;border-radius:19px;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-family:inherit;font-weight:bold;font-size:clamp(11px,3.1vw,16px);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap;transition:.2s}
  #nav button.on{background:#1f3a52;color:#fff}
  #stage{position:absolute;top:108px;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .zb{position:fixed;top:118px;left:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:18px;font-weight:bold;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);font-family:inherit}
  body.fs #top{display:none}
  body.fs #nav{top:0}
  body.fs #stage{top:52px}
  body.fs .zb{top:62px}

  .page{display:none;max-width:1250px;margin:0 auto;padding:14px 14px 24px 64px;box-sizing:border-box;font-size:calc(15px * var(--fz,1))}
  .page.on{display:block}
  .hero{background:linear-gradient(135deg,#eef1f4,#dfe4ea);color:#1f3a52;border:1px solid #d3dae2;border-radius:18px;padding:16px 20px;box-shadow:0 4px 14px rgba(31,58,82,.12);position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;left:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(31,58,82,.05)}
  .hero h2{margin:0 0 4px;font-size:1.5em;display:inline-block;margin-left:10px}
  .hero .en{display:inline-block;background:rgba(31,58,82,.1);border-radius:12px;padding:2px 12px;font-size:.85em;letter-spacing:.5px;direction:ltr}
  .hero p{margin:10px 0 0;line-height:1.9;font-size:1em;color:#2b3a47}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;align-items:start}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{background:#fff;color:#1f3a52;border-radius:10px;padding:6px 10px;font-size:.82em;font-weight:bold;box-shadow:0 2px 5px rgba(0,0,0,.12)}
  .chip b{color:#e0552a}

  .sec{background:#fff;border-radius:16px;box-shadow:0 3px 12px rgba(0,0,0,.07);overflow:hidden;border-top:6px solid var(--c)}
  .sh{display:flex;align-items:center;gap:10px;padding:12px 12px 8px;cursor:pointer}
  .ic{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
  .sh h3{margin:0;font-size:1.15em;color:var(--c);flex:1}
  ol{padding:0 10px 12px !important}
  li{padding:8px 9px !important;margin-top:7px !important;line-height:1.75 !important;gap:9px !important;font-size:.95em}
  li .n{width:24px !important;height:24px !important}
  @media (max-width:700px){
    .grid{gap:6px}.page{padding:10px 8px 20px 54px;font-size:calc(12px * var(--fz,1))}
    .sh{flex-direction:column;text-align:center;gap:4px;padding:8px 4px 4px}.sh h3 small{display:block;margin:0}.arr{display:none}
    ol{padding:0 5px 8px !important}li{flex-direction:column;align-items:center;text-align:center;gap:4px !important;padding:6px !important}
    .ic{width:30px;height:30px;font-size:15px}
  }
  .sh h3 small{color:#8a97a3;font-weight:normal;font-size:.7em;margin-right:6px}
  .arr{color:var(--c);font-size:18px;transition:transform .3s}
  .sec.closed .arr{transform:rotate(90deg)}
  .sec.closed ol{display:none}
  ol{list-style:none;margin:0;padding:0 16px 14px}
  li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;margin-top:8px;border-radius:12px;background:var(--bg);line-height:1.9;opacity:0;transform:translateX(-24px)}
  li.in{animation:slide .45s ease forwards}
  @keyframes slide{to{opacity:1;transform:none}}
  li .n{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--c);border:2px solid var(--c);font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:.85em;margin-top:3px}
  .s1{--c:#d9480f;--bg:#fff3ec}
  .s2{--c:#2b8a3e;--bg:#eefaf1}
  .s3{--c:#1971c2;--bg:#ecf4fd}
  .hero{opacity:0;transform:translateY(14px)}
  .page.on .hero{animation:up .5s ease forwards}
  @keyframes up{to{opacity:1;transform:none}}
  @media (max-width:420px){#nav{gap:5px}#nav button{padding:0 9px}.page{padding:14px 10px 30px 58px}}
  @media (max-height:460px){
    #top{height:44px}#nav{top:44px;height:44px}#nav button{height:32px}#stage{top:88px}body.fs #stage{top:44px}
    .zb{top:96px;left:6px;gap:6px}.zb button{width:36px;height:36px;font-size:16px}body.fs .zb{top:52px}
  }
</style>
</head>
<body>
<div id="top"><div id="title">الأمراض النفسية</div></div>
<div id="nav"><button class="on">مقدمة</button><button>الكآبة</button><button>انفصام الشخصية</button></div>
<div class="zb"><button id="zin">+A</button><button id="zout">−A</button><button id="fs">⛶</button></div>
<div id="stage"></div>

<script>
(function(){
const D=[
 {tab:"مقدمة",ar:"الأمراض النفسية",en:"Mental Illnesses",
  desc:"يصنف الطب النفسي كفرع مستقل ومهم من فروع الطب، ويمكن إدراج الأمراض النفسية ضمن الجهاز العصبي لكون منشأ هذه الأمراض بسبب خلل في عمل الدماغ والأعصاب، وتظهر تأثيراتها جلية في ذلك على الاضطرابات في سلوك الإنسان وتصرفاته، والتي يكون الجهاز العصبي وأعضاؤه مسؤولين عن التحكم بها وتنظيمها.",
  chips:[["المنشأ","خلل في عمل الدماغ والأعصاب"],["التأثير","اضطراب السلوك والتصرفات"],["من أبرزها","الكآبة، انفصام الشخصية"]],
  secs:[["s1","⚠","عوامل الإصابة","Causes",["تلعب العادات السيئة ونمط الحياة غير الصحي كالتدخين وتناول الكحول والمخدرات والركون إلى الكسل معظم الأوقات دوراً مهماً في إصابة الإنسان بالأمراض النفسية.","العوامل الوراثية التي تنتقل بين أفراد العائلة."]],
        ["s2","✅","نمط الحياة الصحي","Healthy Life",["كلما كان نمط حياتنا صحياً ومنتظماً كان أداء الجهاز العصبي جيداً.","مما يمكّن الإنسان من أداء دوره في الحياة المتمثل بالعمل والإنتاج، وكونه فرداً صالحاً ومفيداً للمجتمع."]],
        ["s3","🧬","الحد من الانتشار","Limiting Spread",["يمكن تشخيص العوامل الوراثية مبكراً في الوقت الحاضر عن طريق الخارطة الجينية للإنسان.","تجنب الزواج بين العائلات التي يعاني أفرادها من هذه الأمراض لضمان عدم انتشار الأمراض النفسية بشكل أوسع."]]]},
 {tab:"الكآبة",ar:"الكآبة",en:"Depression",
  desc:"يقصد بها حالة من الكسل الجسدي الشديد التي تصيب الإنسان بسبب تعرضه لظروف حياتية معينة، وتكون ناتجة أيضاً بسبب حالات الإدمان على المواد المخدرة والكحولية وبعض أنواع الأدوية غير الموصوفة من قبل الطبيب. وقد تكون الكآبة مؤقتة أو دائمية.",
  chips:[["السبب","ظروف حياتية معينة"],["الإدمان","المواد المخدرة والكحولية"],["الأدوية","غير الموصوفة من الطبيب"],["النوع","مؤقتة أو دائمية"]],
  secs:[["s1","🌡","الأعراض","Symptoms",["الشعور المستمر بالإرهاق والحزن وعدم الرغبة بالاختلاط مع الآخرين والميل للانعزال.","صداع أو دوار مستمرين.","عدم السيطرة على الانفعالات كالغضب الشديد وعدم القدرة على إنجاز الأعمال اليدوية."]],
        ["s2","💊","العلاج والوقاية","Remedy and Prevention",["مراجعة الطبيب النفسي فوراً في حالة الشعور بأي من الأعراض أعلاه، أو عند الوقوع في مشكلة أو التعرض لظرف معين يصعب على المريض التعامل معه أو حله بشكل سليم.","الالتزام بالعلاج الذي يصفه الطبيب النفسي وعدم تناول أدوية غير موصوفة من قبله.","الامتناع عن تناول الكحول والتدخين وتجنب تناول المواد المخدرة بكافة أنواعها.","الالتزام بنظام حياة صحي وتجنب السهر لأوقات متأخرة.","إشغال أوقات الفراغ بهوايات مفيدة مثل الرياضة والمطالعة والرسم وغيرها."]]]},
 {tab:"انفصام الشخصية",ar:"انفصام الشخصية",en:"Schizophrenia",
  desc:"مرض نفسي وراثي غالباً سببه خلل في عمل الجهاز العصبي المركزي، ينتج من تغيرات غير طبيعية في عمل وتركيب الإنزيمات والناقلات العصبية داخل الجهاز العصبي. وقد يختفي المرض إذا ما تم تشخيصه وعلاجه بوقت مبكر، أو تتم السيطرة على أعراضه بحيث لا يشكل المريض خطراً على حياته وعلى المجتمع.",
  chips:[["النوع","وراثي غالباً"],["السبب","خلل في الجهاز العصبي المركزي"],["المنشأ","الإنزيمات والناقلات العصبية"],["العلاج المبكر","قد يُخفي المرض"]],
  secs:[["s1","🌡","الأعراض","Symptoms",["الهلوسة وتناقض الأفكار الشديد مع تغير المزاج المفاجئ للمريض وبدون سبب.","اضطراب الذاكرة وعدم القدرة على التعامل مع الآخرين بشكل سليم.","الأرق وانعدام التركيز."]],
        ["s2","💊","العلاج والوقاية","Remedy and Prevention",["عرض المريض من قبل عائلته على الأطباء المتخصصين فور ملاحظة أحد الأعراض أعلاه لتجنب تدهور حالته الصحية.","قد يتطلب الأمر وضع المريض في المستشفيات النفسية المتخصصة لمراقبة علاجه وحالته لحين تماثله للشفاء أو السيطرة على المرض.","تجنب الزيجات بين العوائل التي تحمل تاريخاً طبياً متكرراً للإصابة بهذا المرض لضمان إنجاب أفراد أصحاء نفسياً وبدنياً.","الابتعاد عن كل مصادر المواد المخدرة والكحول، والتواجد في الأماكن التي تخلو من مسببات الضوضاء قدر الإمكان.","تجنب الإجهاد لفترات طويلة أثناء العمل وأخذ فترات مناسبة من الراحة تتمثل بممارسة عادات صحية كالمشي والهوايات المفيدة الأخرى."]]]}
];
const stage=document.getElementById('stage');
const pages=D.map((d,i)=>{
  const pg=document.createElement('div');pg.className='page'+(i?'':' on');
  let h=`<div class="hero"><h2>${d.ar}</h2><span class="en">${d.en}</span><p>${d.desc}</p><div class="chips">${d.chips.map(c=>`<span class="chip"><b>${c[0]}:</b> ${c[1]}</span>`).join('')}</div></div>`;
  h+=`<div class="grid" style="grid-template-columns:repeat(${d.secs.length},1fr)">`;
  d.secs.forEach(([cls,ic,t,en,items])=>{h+=`<div class="sec ${cls}"><div class="sh"><div class="ic">${ic}</div><h3>${t}<small>(${en})</small></h3><span class="arr">▼</span></div><ol>${items.map((x,j)=>`<li><span class="n">${j+1}</span><span>${x}</span></li>`).join('')}</ol></div>`;});
  h+='</div>';
  pg.innerHTML=h;stage.appendChild(pg);return pg;});

/* staggered reveal of items as they scroll into view */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const lis=e.target.querySelectorAll('li');lis.forEach((li,j)=>{li.classList.remove('in');li.style.animationDelay=(j*.15)+'s';void li.offsetWidth;li.classList.add('in');});io.unobserve(e.target);}}),{root:stage,threshold:.15});
function reveal(pg){pg.querySelectorAll('li').forEach(li=>li.classList.remove('in'));pg.querySelectorAll('.sec').forEach(s=>io.observe(s));}
document.querySelectorAll('.sh').forEach(sh=>sh.onclick=()=>{const s=sh.parentNode;s.classList.toggle('closed');if(!s.classList.contains('closed')){s.querySelectorAll('li').forEach((li,j)=>{li.classList.remove('in');li.style.animationDelay=(j*.12)+'s';void li.offsetWidth;li.classList.add('in');});}});

const tabs=[...document.querySelectorAll('#nav button')];
function go(i){tabs.forEach((b,k)=>b.classList.toggle('on',k===i));pages.forEach((p,k)=>{p.classList.toggle('on',k===i);});
  const h=pages[i].querySelector('.hero');h.style.animation='none';void h.offsetWidth;h.style.animation='';
  stage.scrollTop=0;reveal(pages[i]);}
tabs.forEach((b,k)=>b.onclick=()=>go(k));

/* text size */
let fz=1;const setFz=()=>pages.forEach(p=>p.style.setProperty('--fz',fz));
document.getElementById('zin').onclick=()=>{fz=Math.min(1.6,fz+.1);setFz();};
document.getElementById('zout').onclick=()=>{fz=Math.max(.8,fz-.1);setFz();};
/* تكبير وتصغير بإصبعين */
(function(){var d0=0,z0=1;var dist=function(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);};
document.addEventListener('touchstart',function(e){if(e.touches.length===2){d0=dist(e.touches)||1;z0=fz;}else d0=0;},{passive:true});
document.addEventListener('touchmove',function(e){if(e.touches.length===2&&d0){fz=Math.min(1.6,Math.max(.8,z0*dist(e.touches)/d0));setFz();}},{passive:true});
document.addEventListener('touchend',function(e){if(e.touches.length<2)d0=0;},{passive:true});})();


/* fullscreen (template) */
const fsBtn=document.getElementById('fs'),docEl=document.documentElement;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=docEl.requestFullscreen||docEl.webkitRequestFullscreen;if(r){try{const p=r.call(docEl);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));

go(0);
})();
</script>
</body>
</html>
