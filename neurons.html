<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>تركيب الخلية العصبية وأنواعها</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(13px,3.4vw,22px);font-weight:bold;text-align:center;line-height:1.3}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  .zb{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .pill{fill:#fff;stroke:#e0552a;stroke-width:2.5}
  .lbl{fill:#a8431b;font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .zone{fill:#e0693a;font-size:21px;font-weight:bold;text-anchor:middle}
  .ln{stroke:#e0552a;stroke-width:2.4;fill:none}
</style>
</head>
<body>
<div id="top"><div id="title">تركيب الخلية العصبية وأنواعها</div></div>
<div id="stage">
  <div class="zb"><button id="zin">+</button><button id="zout">−</button><button id="zreset">⟲</button><button id="pause">⏸</button><button id="fs">⛶</button></div>
  <svg id="svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="gBody" cx="0.38" cy="0.32" r="0.78"><stop offset="0" stop-color="#ffdc8c"/><stop offset="0.55" stop-color="#f6aa30"/><stop offset="1" stop-color="#e2861a"/></radialGradient>
      <radialGradient id="gNuc" cx="0.35" cy="0.35" r="0.8"><stop offset="0" stop-color="#cbb6ec"/><stop offset="0.55" stop-color="#9379ca"/><stop offset="1" stop-color="#644a9f"/></radialGradient>
      <linearGradient id="gMy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b51ab"/><stop offset="0.35" stop-color="#9d96e4"/><stop offset="0.7" stop-color="#7d74cf"/><stop offset="1" stop-color="#4e4497"/></linearGradient>
      <radialGradient id="gGlow"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#fff59a" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd23c" stop-opacity="0"/></radialGradient>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#e0552a"/></marker>
    </defs>
    <g id="view"></g>
  </svg>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,RAD=PI/180;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
let rs=11;const rnd=()=>{rs=(rs*9301+49297)%233280;return rs/233280;};
const lerp=(a,b,u)=>a+(b-a)*u;
const OUT='#de8618',INN='#fcc35a',BODYC='#f4a52d';

/* ---------- layers ---------- */
const gO=G(view),gI=G(view),gB=G(view),gMy=G(view),gK=G(view),gFx=G(view);

/* ---------- branching trees (dendrites / terminals) ---------- */
const trees=[];
function branch(ang,len,w,depth,spread){
  const n={ang,len,w,ph:rnd()*6.28,kids:[]};
  if(depth>0){const k=depth>1&&rnd()<.4?3:2;
    for(let j=0;j<k;j++){const a=-spread/2+spread*j/(k-1)+(rnd()-.5)*.25;
      n.kids.push(branch(a,len*(.66+rnd()*.14),Math.max(2.2,w*.64),depth-1,spread*.92));}}
  return n;}
function build(n,knobs){
  n.o=el('line',{stroke:OUT,'stroke-width':(n.w+2.6).toFixed(1),'stroke-linecap':'round'},gO);
  n.i=el('line',{stroke:INN,'stroke-width':Math.max(1,n.w*.42).toFixed(1),'stroke-linecap':'round',opacity:.9},gI);
  if(knobs&&!n.kids.length){n.kb=el('circle',{r:7,fill:'url(#gBody)',stroke:'#cf7a14','stroke-width':1.5},gK);
    n.kg=el('circle',{r:13,fill:'url(#gGlow)',opacity:0},gFx);}
  n.kids.forEach(k=>build(k,knobs));}
function tree(n,x,y,a,amp,knobs){build(n,knobs);const T={n,x,y,a,amp};trees.push(T);return T;}
function upd(n,x,y,pa,t,amp){
  const a=pa+n.ang+amp*Math.sin(t*1.25+n.ph);
  const ex=x+Math.cos(a)*n.len,ey=y+Math.sin(a)*n.len;n.st=[x,y];n.end=[ex,ey];
  for(const L of [n.o,n.i]){L.setAttribute('x1',x.toFixed(1));L.setAttribute('y1',y.toFixed(1));L.setAttribute('x2',ex.toFixed(1));L.setAttribute('y2',ey.toFixed(1));}
  if(n.kb){for(const c of [n.kb,n.kg]){c.setAttribute('cx',ex.toFixed(1));c.setAttribute('cy',ey.toFixed(1));}}
  n.kids.forEach(k=>upd(k,ex,ey,a,t,amp*1.6));}
function chain(n,idx){const ns=[n];while(n.kids.length){n=n.kids[Math.min(idx,n.kids.length-1)];ns.push(n);}return ns;}
function leaves(n,o){o=o||[];if(!n.kids.length)o.push(n);n.kids.forEach(k=>leaves(k,o));return o;}

/* ---------- shared parts ---------- */
function myelin(x,y,h){el('rect',{x:x-15,y,width:30,height:h,rx:10,fill:'url(#gMy)',stroke:'#463d8e','stroke-width':1.5},gMy);
  el('rect',{x:x-9,y:y+5,width:5,height:h-10,rx:2.5,fill:'#d2cdf6',opacity:.35},gMy);}
function knob(x,y){
  el('path',{d:`M${x-5},${y-20} Q${x-6},${y-7} ${x-16},${y-4} L${x+16},${y-4} Q${x+6},${y-7} ${x+5},${y-20} Z`,fill:BODYC},gB);
  el('ellipse',{cx:x,cy:y,rx:22,ry:11,fill:'url(#gBody)',stroke:'#d98318','stroke-width':1.5},gB);
  el('ellipse',{cx:x-6,cy:y-4,rx:9,ry:3,fill:'#fff',opacity:.35},gB);
  return el('ellipse',{cx:x,cy:y,rx:22,ry:11,fill:'#fff3a0',opacity:0},gB);}
function nucleus(x,y,rx,ry){const g=G(gB);
  el('ellipse',{rx,ry,fill:'url(#gNuc)',stroke:'#5d4593','stroke-width':1.5},g);
  el('circle',{cx:-rx*.2,cy:-ry*.15,r:rx*.28,fill:'#5b3f8f',opacity:.7},g);
  el('ellipse',{cx:-rx*.35,cy:-ry*.45,rx:rx*.35,ry:ry*.15,fill:'#fff',opacity:.35},g);
  return {g,x,y,ph:rnd()*6.28};}
function blob(cx,cy,R,bul,t){const N=48,pts=[];
  for(let k=0;k<N;k++){const th=k/N*2*PI;let r=R+3*Math.sin(3*th+t*.9)+2*Math.sin(5*th-t*.7+1);
    bul.forEach(b=>{const d=Math.atan2(Math.sin(th-b),Math.cos(th-b));r+=12*Math.exp(-d*d/.025);});
    pts.push([cx+r*Math.cos(th),cy+r*Math.sin(th)]);}
  const f=v=>v.toFixed(1);const pm=pts[N-1],p0=pts[0];let d=`M${f((pm[0]+p0[0])/2)},${f((pm[1]+p0[1])/2)}`;
  for(let k=0;k<N;k++){const p=pts[k],q=pts[(k+1)%N];d+=`Q${f(p[0])},${f(p[1])} ${f((p[0]+q[0])/2)},${f((p[1]+q[1])/2)}`;}
  return d+'Z';}

/* =========== A: multipolar =========== */
const A={cx:200,cy:150};
const aAng=[-90,-120,-60,-150,-30,-178,2,152,28];
const tA=aAng.map(d=>{const a=d*RAD;return tree(branch(0,32+rnd()*8,9,2,1.0),A.cx+38*Math.cos(a),A.cy+38*Math.sin(a),a,.05);});
const aBul=aAng.map(d=>d*RAD).concat([PI/2]);
el('line',{x1:200,y1:190,x2:200,y2:600,stroke:OUT,'stroke-width':10},gO);
el('line',{x1:200,y1:190,x2:200,y2:600,stroke:INN,'stroke-width':3.5,opacity:.9},gI);
el('path',{d:'M180,182 Q193,212 195,250 L205,250 Q207,212 220,182 Z',fill:BODYC},gB);
A.b=el('path',{fill:'url(#gBody)',stroke:'#e08a1d','stroke-width':1.2},gB);
const mot=[0,1,2,3,4].map(()=>({x:A.cx-26+rnd()*52,y:A.cy-26+rnd()*52,ph:rnd()*6.28,e:el('circle',{r:(5+rnd()*6).toFixed(1),fill:'#ffe6a8',opacity:.3},gB)}));
el('ellipse',{cx:A.cx-14,cy:A.cy-18,rx:18,ry:10,fill:'#fff',opacity:.22},gB);
A.n=nucleus(A.cx,A.cy,15,19);
for(let i=0;i<7;i++)myelin(200,248+i*49,43);
const kA=knob(200,612);

/* =========== B: bipolar =========== */
const B={cx:520,cy:338};
const bRoot={ang:0,len:172,w:12,ph:0,kids:[branch(-.6,40,7,2,.9),branch(.04,46,7,2,.8),branch(.62,40,7,2,.9)]};
tree(bRoot,520,300,-90*RAD,.018);
el('path',{d:'M506,292 Q515,272 514,250 L526,250 Q525,272 534,292 Z',fill:BODYC},gB);
el('path',{d:'M492,372 Q513,402 514,448 L516,606 L524,606 L526,448 Q527,402 548,372 Z',fill:BODYC,stroke:'#e29022','stroke-width':1},gB);
el('line',{x1:520,y1:430,x2:520,y2:598,stroke:INN,'stroke-width':3,opacity:.8},gB);
B.e=el('ellipse',{cx:B.cx,cy:B.cy,rx:46,ry:57,fill:'url(#gBody)',stroke:'#e29022','stroke-width':1.2},gB);
el('ellipse',{cx:B.cx-16,cy:B.cy-24,rx:16,ry:11,fill:'#fff',opacity:.22},gB);
B.n=nucleus(B.cx,B.cy,13,18);
const kB=knob(520,612);

/* =========== C: unipolar =========== */
const C={x:750,bx:815,by:316};
const cRoot={ang:0,len:20,w:11,ph:1,kids:[branch(-.72,52,8,2,.95),branch(.72,52,8,2,.95)]};
tree(cRoot,750,150,-90*RAD,.02);
const cT={ang:0,len:26,w:9,ph:2,kids:[branch(-.95,48,6,0,0),branch(-.32,42,6,1,.55),branch(.32,42,6,1,.55),branch(.95,48,6,0,0)]};
tree(cT,750,528,90*RAD,.02,true);
el('line',{x1:750,y1:140,x2:750,y2:532,stroke:OUT,'stroke-width':10},gO);
el('line',{x1:750,y1:140,x2:750,y2:532,stroke:INN,'stroke-width':3.5,opacity:.9},gI);
el('path',{d:'M752,336 Q786,338 800,322',fill:'none',stroke:OUT,'stroke-width':13,'stroke-linecap':'round'},gO);
el('path',{d:'M752,336 Q786,338 800,322',fill:'none',stroke:INN,'stroke-width':5,'stroke-linecap':'round',opacity:.9},gI);
C.c=el('circle',{cx:C.bx,cy:C.by,r:29,fill:'url(#gBody)',stroke:'#e29022','stroke-width':1.2},gB);
el('ellipse',{cx:C.bx-9,cy:C.by-12,rx:10,ry:6,fill:'#fff',opacity:.22},gB);
C.n=nucleus(C.bx,C.by,10,13);
[[150,45],[200,32],[237,25],[267,38],[350,48],[403,37],[445,37],[487,38]].forEach(s=>myelin(750,s[0],s[1]));
const cKnobs=leaves(cT);

/* ---------- nerve impulses ---------- */
function mkRoute(w,rest){let T=rest;w.forEach(x=>T+=(x.d||0)+(x.h||0));return {w,T};}
function rpos(R,t){let tt=t%R.T;
  for(let i=0;i<R.w.length;i++){const w=R.w[i],p=w.p();
    if(i>0&&w.d){if(tt<w.d){const q=R.w[i-1].p(),u=tt/w.d;return {x:lerp(q[0],p[0],u),y:lerp(q[1],p[1],u),i,h:0};}tt-=w.d;}
    if(tt<(w.h||0))return {x:p[0],y:p[1],i,h:Math.sin(PI*tt/w.h)};tt-=(w.h||0);}
  return null;}
function fromLeaf(root,idx){const c=chain(root,idx),w=[{p:()=>c[c.length-1].end}];
  for(let k=c.length-1;k>=0;k--){const n=c[k];w.push({p:()=>n.st,d:.18});}return w;}
const pt=(x,y,d,h)=>({p:()=>[x,y],d,h});

const wA=fromLeaf(tA[0].n,0);
wA.push(pt(A.cx,A.cy,.2,.35),pt(200,246,.3,.06));
for(let i=0;i<6;i++)wA.push(pt(200,294+49*i,.07,.13));
wA.push(pt(200,588,.07,.06),pt(200,612,.12,.45));
const rA=mkRoute(wA,.9);

const wB=fromLeaf(bRoot,1);
wB.push(pt(B.cx,B.cy,.15,.3),pt(520,448,.3,0),pt(520,604,.9,0),pt(520,612,.05,.45));
const rB=mkRoute(wB,.9);

const wC=fromLeaf(cRoot,0);
[197.5,234.5,264.5].forEach(y=>wC.push(pt(750,y,.08,.13)));
wC.push(pt(750,308,.07,.05),pt(750,336,.1,.12));
[400.5,442.5,484.5].forEach(y=>wC.push(pt(750,y,.08,.13)));
wC.push(pt(750,527,.07,.05),{p:()=>cT.end,d:.1,h:.5});
const rC=mkRoute(wC,.9);

const imp=[[rA,0,kA],[rB,1.3,kB],[rC,2.6,null]].map(a=>({R:a[0],off:a[1],k:a[2],g:el('circle',{r:8,fill:'url(#gGlow)',opacity:0},gFx)}));

/* ---------- labels ---------- */
const labs=[];
function label(txt,cx,py,w,tfs){const h=34,g=G(view,{'pointer-events':'none'}),
  lns=tfs.map(()=>el('line',{class:'ln','marker-end':'url(#ah)'},g));
  el('rect',{class:'pill',x:cx-w/2,y:py-h/2,width:w,height:h,rx:17},g);el('text',{class:'lbl',x:cx,y:py},g).textContent=txt;
  labs.push(()=>tfs.forEach((f,i)=>{const p=f(),a=lns[i];a.setAttribute('x1',cx);a.setAttribute('y1',py);a.setAttribute('x2',p[0].toFixed(1));a.setAttribute('y2',p[1].toFixed(1));}));}
label('تشجر',395,40,90,[()=>tA[4].n.kids[0].end]);
label('جسم الخلية',400,250,130,[()=>[228,182]]);
label('غلاف نخاعيني',85,416,150,[()=>[185,416]]);
label('محور',330,515,90,[()=>[204,490]]);
label('تشجر',645,195,90,[()=>[lerp(bRoot.st[0],bRoot.end[0],.5)+7,lerp(bRoot.st[1],bRoot.end[1],.5)]]);
label('جسم الخلية',655,338,130,[()=>[566,338]]);
label('محور',645,505,90,[()=>[524,505]]);
label('محور',920,234.5,90,[()=>[754,234.5]]);
label('جسم الخلية',925,316,130,[()=>[846,316]]);
label('محور',920,442.5,90,[()=>[754,442.5]]);
label('غلاف نخاعيني',915,505,150,[()=>[765,505]]);
el('text',{class:'zone',x:200,y:680},view).textContent='خلية متعددة الأقطاب';
el('text',{class:'zone',x:520,y:680},view).textContent='خلية ثنائية القطب';
el('text',{class:'zone',x:750,y:680},view).textContent='خلية أحادية القطب';

/* ---------- animation ---------- */
let T=0,last=performance.now(),paused=false;
function moveNuc(n,t){n.g.setAttribute('transform',`translate(${(n.x+1.8*Math.sin(t*.6+n.ph)).toFixed(1)} ${(n.y+1.5*Math.cos(t*.8+n.ph)).toFixed(1)})`);}
function frame(ms){
  const dt=Math.min(.05,(ms-last)/1000);last=ms;T+=paused?0:dt;const t=T;
  trees.forEach(R=>upd(R.n,R.x,R.y,R.a,t,R.amp));
  /* cell bodies */
  A.b.setAttribute('d',blob(A.cx,A.cy,44,aBul,t));
  mot.forEach(m=>{m.e.setAttribute('cx',(m.x+4*Math.sin(t*.5+m.ph)).toFixed(1));m.e.setAttribute('cy',(m.y+4*Math.cos(t*.4+m.ph)).toFixed(1));});
  B.e.setAttribute('rx',(46+1.5*Math.sin(t*1.1)).toFixed(1));B.e.setAttribute('ry',(57+1.5*Math.sin(t*1.1+1.4)).toFixed(1));
  C.c.setAttribute('r',(29+1.2*Math.sin(t*1.2+.7)).toFixed(1));
  [A.n,B.n,C.n].forEach(n=>moveNuc(n,t));
  /* impulses */
  imp.forEach(I=>{const r=rpos(I.R,t+I.off);
    if(!r){I.g.setAttribute('opacity',0);if(I.k)I.k.setAttribute('opacity',0);else cKnobs.forEach(n=>n.kg.setAttribute('opacity',0));return;}
    I.g.setAttribute('opacity',1);I.g.setAttribute('cx',r.x.toFixed(1));I.g.setAttribute('cy',r.y.toFixed(1));I.g.setAttribute('r',(8+10*r.h).toFixed(1));
    const fl=r.i===I.R.w.length-1?r.h:0;
    if(I.k)I.k.setAttribute('opacity',(fl*.75).toFixed(2));else cKnobs.forEach(n=>n.kg.setAttribute('opacity',fl.toFixed(2)));});
  labs.forEach(f=>f());
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------- zoom & pan ---------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
const reset=()=>{sc=1;tx=0;ty=0;apply();};
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:500,y:350});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:500,y:350});
document.getElementById('zreset').onclick=reset;

/* ---------- fullscreen ---------- */
const fsBtn=document.getElementById('fs'),docEl=document.documentElement;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{
  const on=!document.body.classList.contains('fs');
  if(on){const r=docEl.requestFullscreen||docEl.webkitRequestFullscreen;
    if(r){try{const p=r.call(docEl);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
    setFs(true);
  }else{
    if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}
    setFs(false);
  }
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
})();
</script>
</body>
</html>
