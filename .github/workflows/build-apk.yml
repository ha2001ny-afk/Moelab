name: بناء تطبيق الأندرويد

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon assembleRelease

      - name: Publish APK to the site
        run: |
          mkdir -p download
          cp android-app/app/build/outputs/apk/release/app-release.apk download/MoeLab.apk
          ls -la download
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/MoeLab.apk
          git commit -m "تحديث تطبيق الأندرويد MoeLab.apk [skip ci]" || echo "no changes"
          git pull --rebase origin main
          git push origin HEAD:main
