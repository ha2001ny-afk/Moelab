<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>النسيج الظهاري الحرشفي البسيط</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(13px,3.4vw,22px);font-weight:bold;text-align:center;line-height:1.3}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#f8fafc}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  .zb{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .pill{fill:#fff;stroke:#e0552a;stroke-width:2.5}
  .lbl{fill:#a8431b;font-size:18px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .ln{stroke:#e0552a;stroke-width:2.4;fill:none}
</style>
</head>
<body>
<div id="top"><div id="title">شكل (2-7 ب): رسم تخطيطي - النسيج الظهاري الحرشفي البسيط</div></div>
<div id="stage">
  <div class="zb">
    <button id="zin" title="تكبير">+</button>
    <button id="zout" title="تصغير">−</button>
    <button id="zreset" title="إعادة ضبط">⟲</button>
    <button id="pause" title="إيقاف مؤقت">⏸</button>
    <button id="fs" title="ملء الشاشة">⛶</button>
  </div>
  <svg id="svg" viewBox="0 0 950 680" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- تدرجات نسيجية ملائمة للمظهر المجهري الصبغي -->
      <linearGradient id="gCyto" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#b683a7"/>
        <stop offset="50%" stop-color="#a46d94"/>
        <stop offset="100%" stop-color="#8c587d"/>
      </linearGradient>

      <linearGradient id="gCytoSide" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9d648b"/>
        <stop offset="100%" stop-color="#734163"/>
      </linearGradient>

      <radialGradient id="gNuc" cx="40%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#ce9fc3"/>
        <stop offset="35%" stop-color="#804770"/>
        <stop offset="100%" stop-color="#461f3d"/>
      </radialGradient>

      <linearGradient id="gBase" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="50%" stop-color="#334155"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>

      <linearGradient id="gCT" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#faedd9"/>
        <stop offset="50%" stop-color="#ebd1af"/>
        <stop offset="100%" stop-color="#dcbe96"/>
      </linearGradient>

      <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
      </filter>

      <!-- رأس سهم التأشير -->
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0,0L10,5L0,10Z" fill="#e0552a"/>
      </marker>
    </defs>

    <g id="view"></g>
  </svg>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg", PI=Math.PI;
const svg=document.getElementById('svg'), view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, lerp=(a,b,u)=>a+(b-a)*u;

/* ---------- مجموعة رسم المجسم النسيجي ثلاثي الأبعاد ---------- */
const blockG = G(view, {filter: 'url(#shadow)'});

// 1. طبقة النسيج الضام السفلية (Connective Tissue Base)
el('path', {
  d: 'M 100,430 L 580,430 Q 640,430 670,390 L 670,470 Q 640,510 580,510 L 100,510 Z',
  fill: 'url(#gCT)', stroke: '#bca07e', 'stroke-width': '2'
}, blockG);

// ألياف الكولاجين المتموجة داخل النسيج الضام
const fiberG = G(blockG);
const fiberPaths = [
  'M 110,455 Q 230,448 350,456 T 570,452',
  'M 120,475 Q 240,482 370,474 T 590,478',
  'M 110,492 Q 220,486 360,494 T 580,492',
  'M 300,442 Q 420,438 540,446',
  'M 580,452 Q 625,445 660,420',
  'M 585,478 Q 630,475 665,445'
];
fiberPaths.forEach(d => {
  el('path', {d, fill: 'none', stroke: '#c7a780', 'stroke-width': '2', 'stroke-linecap': 'round'}, fiberG);
});

// نوى الخلايا الليفية المبعثرة في النسيج الضام (Fibroblast nuclei)
const ctNuclei = [
  {x: 180, y: 465, rx: 14, ry: 5, rot: -8},
  {x: 320, y: 485, rx: 16, ry: 6, rot: 5},
  {x: 480, y: 462, rx: 15, ry: 5.5, rot: -4},
  {x: 620, y: 440, rx: 12, ry: 5, rot: -15}
];
ctNuclei.forEach(n => {
  el('ellipse', {
    cx: n.x, cy: n.y, rx: n.rx, ry: n.ry,
    fill: '#4a2840',
    transform: `rotate(${n.rot} ${n.x} ${n.y})`
  }, fiberG);
});

// 2. الغشاء القاعدي (Basement Membrane) - شريط داكن مميز
const bmPath = el('path', {
  d: 'M 100,418 L 580,418 Q 640,418 674,378 L 671,390 Q 640,430 580,430 L 100,430 Z',
  fill: 'url(#gBase)', stroke: '#0f172a', 'stroke-width': '1.5'
}, blockG);

// 3. المقطع الجانبي لطبقة الخلايا الحرشفية (Front Epithelial Cut)
el('path', {
  d: 'M 100,380 L 580,380 Q 640,380 678,340 L 674,378 Q 640,418 580,418 L 100,418 Z',
  fill: 'url(#gCytoSide)', stroke: '#5a2d4e', 'stroke-width': '2'
}, blockG);

// نواة مسطحة ظاهرة في القطاع العرضي للخلايا (Cross-section Flattened Nucleus)
const sideNuc = el('ellipse', {
  cx: 190, cy: 400, rx: 42, ry: 10,
  fill: 'url(#gNuc)', stroke: '#461f3d', 'stroke-width': '1.5'
}, blockG);

// 4. السطح العلوي للخلايا الحرشفية المضلعة (Top Polygonal Surface View)
const topSurfaceG = G(blockG);

// رسم السطح العلوي العام المتدرج
el('path', {
  d: 'M 100,120 L 600,120 Q 660,180 678,340 L 580,380 Q 520,380 100,380 Z',
  fill: 'url(#gCyto)', stroke: '#4a1e3e', 'stroke-width': '2.5'
}, topSurfaceG);

// خطوط الاتصال المتعرجة بين الخلايا الحرشفية المجاورة (Cell Junctions)
const cellBorders = [
  'M 100,230 Q 150,225 180,240 T 260,250',
  'M 260,250 Q 280,180 290,120',
  'M 260,250 Q 330,300 400,270',
  'M 400,270 Q 420,200 440,120',
  'M 400,270 Q 490,320 580,300',
  'M 580,300 Q 625,230 645,180',
  'M 580,300 Q 630,335 678,340',
  'M 400,270 Q 390,330 380,380'
];
cellBorders.forEach(d => {
  el('path', {d, fill: 'none', stroke: '#421637', 'stroke-width': '2.6', 'stroke-linecap': 'round'}, topSurfaceG);
});

// النواة المركزية الرئيسية الكبيرة البيضوية (The Main Nucleus)
const mainNucG = G(topSurfaceG);
const mainNuc = el('ellipse', {
  cx: 330, cy: 200, rx: 46, ry: 30,
  fill: 'url(#gNuc)', stroke: '#361330', 'stroke-width': '2',
  transform: 'rotate(-8 330 200)'
}, mainNucG);

// بريق ولمعان النواة السطحي
const nucShine = el('ellipse', {
  cx: 320, cy: 192, rx: 20, ry: 10,
  fill: '#fff', opacity: '0.35',
  transform: 'rotate(-12 320 192)'
}, mainNucG);

// نوى الخلايا الحرشفية المجاورة على السطح
const otherNucData = [
  {cx: 180, cy: 160, rx: 34, ry: 24, rot: 10},
  {x: 520, y: 210, rx: 38, ry: 26, rot: -15},
  {cx: 490, cy: 350, rx: 32, ry: 22, rot: -5},
  {cx: 260, cy: 330, rx: 36, ry: 23, rot: 8}
];
otherNucData.forEach(d => {
  const g = G(topSurfaceG);
  el('ellipse', {
    cx: d.cx || d.x, cy: d.cy || d.y, rx: d.rx, ry: d.ry,
    fill: 'url(#gNuc)', stroke: '#361330', 'stroke-width': '1.8',
    transform: `rotate(${d.rot} ${d.cx||d.x} ${d.cy||d.y})`
  }, g);
  el('ellipse', {
    cx: (d.cx || d.x) - 6, cy: (d.cy || d.y) - 5, rx: d.rx * 0.45, ry: d.ry * 0.4,
    fill: '#fff', opacity: '0.25',
    transform: `rotate(${d.rot} ${(d.cx||d.x)-6} ${(d.cy||d.y)-5})`
  }, g);
});

/* ---------- نظام التأشيرات المنهجي التفاعلي ---------- */
const labs = [];
function label(txt, cx, py, w, tfs){
  const h=36, g=G(view,{'pointer-events':'none'}),
  lns=tfs.map(()=>el('line',{class:'ln','marker-end':'url(#ah)'},g));
  el('rect',{class:'pill',x:cx-w/2,y:py-h/2,width:w,height:h,rx:18},g);
  el('text',{class:'lbl',x:cx,y:py},g).textContent=txt;
  labs.push(()=>tfs.forEach((f,i)=>{
    const p=f(), a=lns[i];
    a.setAttribute('x1', p.sx!==undefined ? p.sx : cx - w/2);
    a.setAttribute('y1', p.sy!==undefined ? p.sy : py);
    a.setAttribute('x2', p[0].toFixed(1));
    a.setAttribute('y2', p[1].toFixed(1));
  }));
}

// إحداثيات ومواضع التأشيرات الأربعة المنهجية
let nucTarget = [330, 200];
let cellTarget = [370, 150];
let bmTarget = [645, 405];
let ctTarget = [570, 485];

label('خلية حرشفية', 830, 130, 150, [() => cellTarget]);
label('نواة', 830, 215, 120, [() => nucTarget]);
label('غشاء قاعدي', 830, 395, 150, [() => bmTarget]);
label('نسيج ضام', 830, 490, 140, [() => ctTarget]);

/* ---------- محرك الحركة الحيوية الناعمة ---------- */
let T=0, last=performance.now(), paused=false;

function frame(ms){
  const dt=Math.min(.05, (ms-last)/1000);
  last=ms;
  if(!paused) T+=dt;
  const t = T;

  // تنفس وحركة مجهرية خفيفة جداً للنواة والسائل السيتوبلازمي
  const pulse = Math.sin(t * 1.6);
  const nucScale = 1 + 0.025 * pulse;
  mainNucG.setAttribute('transform', `translate(330 200) scale(${nucScale.toFixed(3)}) translate(-330 -200)`);

  nucTarget = [330 + 1.5 * Math.cos(t), 200 + 1.5 * pulse];
  cellTarget = [370 + 2 * Math.sin(t * 0.8), 150 + 1.2 * Math.cos(t * 0.8)];

  // تحديث أسهم التأشير
  labs.forEach(f => f());

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.getElementById('pause').onclick = function(){
  paused = !paused;
  this.textContent = paused ? '▶' : '⏸';
};

/* ---------- التحكم باللمس والتكبير والتحريك (Pan & Zoom) ---------- */
let sc=1, tx=0, ty=0;
const MIN=0.6, MAX=7;
const apply = () => view.setAttribute('transform', `translate(${tx} ${ty}) scale(${sc})`);

function toView(e){
  const p = svg.createSVGPoint();
  p.x = e.clientX;
  p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

function zoomAt(k, p){
  const ns = Math.min(MAX, Math.max(MIN, sc * k));
  k = ns / sc;
  tx = p.x - (p.x - tx) * k;
  ty = p.y - (p.y - ty) * k;
  sc = ns;
  apply();
}

const ptrs = new Map();
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, toView(e));
});

svg.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  const prv = new Map(ptrs), cu = toView(e);
  ptrs.set(e.pointerId, cu);

  if(ptrs.size === 1){
    const o = prv.get(e.pointerId);
    tx += cu.x - o.x;
    ty += cu.y - o.y;
    apply();
  } else {
    const ids = [...ptrs.keys()].slice(0, 2);
    const a0 = prv.get(ids[0]), b0 = prv.get(ids[1]);
    const a1 = ptrs.get(ids[0]), b1 = ptrs.get(ids[1]);
    const d0 = Math.hypot(a0.x - b0.x, a0.y - b0.y) || 1;
    const d1 = Math.hypot(a1.x - b1.x, a1.y - b1.y);
    const m0 = {x: (a0.x + b0.x)/2, y: (a0.y + b0.y)/2};
    const m1 = {x: (a1.x + b1.x)/2, y: (a1.y + b1.y)/2};
    tx += m1.x - m0.x;
    ty += m1.y - m0.y;
    zoomAt(d1 / d0, m1);
  }
});

const up = e => ptrs.delete(e.pointerId);
svg.addEventListener('pointerup', up);
svg.addEventListener('pointercancel', up);

svg.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, toView(e));
}, {passive: false});

const reset = () => { sc = 1; tx = 0; ty = 0; apply(); };
svg.addEventListener('dblclick', reset);

document.getElementById('zin').onclick = () => zoomAt(1.3, {x: 475, y: 340});
document.getElementById('zout').onclick = () => zoomAt(1/1.3, {x: 475, y: 340});
document.getElementById('zreset').onclick = reset;

/* ---------- ملء الشاشة الكامل (Fullscreen) ---------- */
const fsBtn = document.getElementById('fs'), de = document.documentElement;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;

function setFs(on){
  document.body.classList.toggle('fs', on);
  fsBtn.textContent = on ? '✕' : '⛶';
  reset();
}

fsBtn.onclick = () => {
  const on = !document.body.classList.contains('fs');
  if(on){
    const r = de.requestFullscreen || de.webkitRequestFullscreen;
    if(r){ try{ const p = r.call(de); if(p && p.catch) p.catch(()=>{}); }catch(e){} }
    setFs(true);
  } else {
    if(fsEl()){ const x = document.exitFullscreen || document.webkitExitFullscreen; try{ x.call(document); }catch(e){} }
    setFs(false);
  }
};

['fullscreenchange','webkitfullscreenchange'].forEach(ev => {
  document.addEventListener(ev, () => {
    if(!fsEl() && document.body.classList.contains('fs')) setFs(false);
  });
});

apply();
})();
</script>
</body>
</html>
