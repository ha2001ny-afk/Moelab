<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>الخلية الدهنية</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#eef6fb;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #head{position:fixed;top:0;left:0;right:0;height:56px;z-index:8;display:flex;align-items:center;justify-content:center;background:#1f3a52;box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:none}
  #title{color:#fff;font-weight:bold;font-size:clamp(15px,3.6vw,23px);transition:opacity .35s;white-space:nowrap}
  #views{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;z-index:8}
  .nav{width:60px;height:60px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:26px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);padding:0;line-height:1}
  .nav:active{background:#d9ebf7}
  #dots{display:flex;gap:12px;align-items:center}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  #stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 45%,#f6fcff 0%,#cfe8f3 100%)}
  #stage.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;width:1200px;height:800px;transform-origin:0 0}
  #scene{position:absolute;left:0;top:0;width:1200px;height:800px;transition:opacity .35s}
  #cv,#scene img{position:absolute;left:0;top:0;pointer-events:none;-webkit-user-drag:none}
  #cv{left:220px;top:110px;width:760px;height:580px}
  #cellLayer,#tissue{position:absolute;left:0;top:0;width:1200px;height:800px;transform-origin:600px 400px}
  #parts img{width:17px;will-change:transform,opacity}
  #scene #tis{left:310px;top:185px;width:580px;opacity:1;z-index:1}
  #skin,#deep{z-index:0}
  #heat{position:absolute;left:0;top:0;z-index:2}
  #cellStill{opacity:0}
  #tissue{opacity:0}
  #skin{position:absolute;left:318px;width:564px;top:112px;height:88px;border-radius:14px 14px 0 0;background:linear-gradient(#f3d2bf,#e9b9a0 35%,#e3a891 100%);border-top:3px solid #d99a7e;box-shadow:0 6px 14px rgba(160,80,60,.18)}
  #deep{position:absolute;left:318px;width:564px;top:592px;height:110px;border-radius:0 0 14px 14px;background:linear-gradient(#c9504a,#a8343a 60%,#8f2a33);box-shadow:0 -6px 14px rgba(160,40,40,.25)}
  .hp{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,170,1) 0,rgba(255,170,60,.9) 35%,rgba(255,90,30,0) 70%);will-change:transform,opacity}
  #lab{position:absolute;left:0;top:0;width:1200px;height:800px;overflow:visible;pointer-events:none}
  #lab text{font:bold 30px Tahoma,"Segoe UI",Arial,sans-serif;fill:#000;text-anchor:middle;dominant-baseline:central}
  #lab line{stroke:#000;stroke-width:1.3}
  #lab circle{fill:#000}
  .side{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:7}
  .btn{width:50px;height:50px;border-radius:50%;border:2px solid #222;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.16);padding:0;transition:transform .15s,opacity .2s}
  .btn:active{transform:scale(.92)}
  .btn svg{width:24px;height:24px;fill:none;stroke:#222;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  .btn.off{opacity:.4}
  @media (max-width:700px){.side{top:68px;transform:none}.btn{width:42px;height:42px}.btn svg{width:20px;height:20px}.nav{width:52px;height:52px;font-size:22px}#dots{gap:9px}.dot{width:12px;height:12px}}
</style>

const putI=(el,p,sc,o,f)=>{el.style.display=o<.004?'none':'';el.style.opacity=o.toFixed(3);
  el.style.transform=`translate(${p[0].toFixed(1)}px,${p[1].toFixed(1)}px) translate(-50%,-50%) scale(${sc.toFixed(3)})`;el.style.filter=f||'none';};

/* ================= tissue under the skin + heat ================= */
$('tis').src=IMG.tis;
const heat=$('heat'),HP=[...Array(22)].map((_,i)=>{const e=document.createElement('div');e.className='hp';heat.appendChild(e);
  return{e,x:345+i*24+rnd()*12,ph:rnd(),sp:.1+rnd()*.06,through:i%7===3};});

/* ================= the story as a function of s (0 … 4) ================= */
const TITLES=['الخلية الدهنية (Adipose Cell)','تخزين الدهون','انضغاط السايتوبلازم وإزاحة النواة','تحلل الدهون','النسيج الدهني تحت الجلد'];
const DUR=[7,5,7,5];
let gNow=0,layerT={s:1,x:0,y:0};
function render(s,t){
  const F=i=>clamp(s-i);const f1=F(0),f2=F(1),f3=F(2),f4=F(3);
  /* droplet size */
  const g=.11*ease(sm((f1-.15)/.85))+.09*ease(f2)-.27*ease(sm((f3-.1)/.85))+.07*ease(sm(f4/.6));
  const gi=g+.004*Math.sin(t*.8);gNow=g;
  /* zoom out into the tissue */
  const z=ease(f4), ls=1-.75*z, lx=0, ly=0;layerT={s:ls,x:lx,y:ly};
  $('cellLayer').style.transform=`scale(${ls.toFixed(4)})`;$('cellLayer').style.opacity=(1-sm((f4-.2)/.45)).toFixed(3);
  if(gl&&ready){gl.uniform1f(U.t,t);gl.uniform1f(U.k,1+gi);gl.uniform1f(U.kc,1+.4*gi);
    gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
  /* fatty acids enter, cross the cytoplasm and join the droplet (turning into stored triglyceride) */
  INN.forEach(p=>{
    const f=p.st===1?f1:f2,u=clamp((f-p.d)/.36);
    if(u<=0||u>=1||s>=3.02){p.el.style.display='none';return;}
    const a=p.a+.15*Math.sin(u*3+p.a),rc=rcA(a),rd=rdA(a);
    const r0=mix(rc*1.45,rd*.9,ease(u));
    const P=fwd([D[0]+Math.cos(a)*r0,D[1]+Math.sin(a)*r0],g),W=toW(P);
    const merge=sm((u-.72)/.28);
    putI(p.el,W,(1-.5*merge),sm(u/.12)*(1-merge),`hue-rotate(${(-38*merge).toFixed(1)}deg) saturate(${(1+merge).toFixed(2)})`);
  });
  /* lipolysis: fatty acids leave the droplet and the cell */
  OUT.forEach(p=>{
    const u=clamp((f3-p.d)/.4);
    if(u<=0||u>=1||s>=4){p.el.style.display='none';return;}
    const a=p.a+.12*Math.sin(u*3+p.a),rc=rcA(a),rd=rdA(a);
    const r0=mix(rd*.92,rc*1.5,ease(u));
    const P=fwd([D[0]+Math.cos(a)*r0,D[1]+Math.sin(a)*r0],g),W=toW(P);
    const born=sm(u/.2);
    putI(p.el,W,.5+.5*born,born*(1-sm((u-.75)/.25)),`hue-rotate(${(-38*(1-born)).toFixed(1)}deg) saturate(${(2-born).toFixed(2)})`);
  });
  /* tissue */
  $('tissue').style.opacity=sm((f4-.3)/.5).toFixed(3);
  const tb=1+.004*Math.sin(t*.7);$('tis').style.transform=`scale(${(.92+.08*sm((f4-.2)/.6))*tb})`;
  /* heat from the body rises, is held back by the fat layer */
  const hOn=sm((f4-.6)/.4);
  HP.forEach(h=>{
    const u=(t*h.sp+h.ph)%1;let y,o;
    if(h.through){y=mix(680,120,u);o=(1-u*.85)*.85;}
    else{const up=u<.55?u/.55:1-(u-.55)/.45;y=mix(680,560,Math.sin(up*Math.PI/2));o=.95*Math.sin(u*Math.PI);}
    const x=h.x+8*Math.sin(t*1.3+h.ph*9);
    h.e.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${h.through?.7:1})`;h.e.style.opacity=(o*hOn).toFixed(3);
  });
}

/* ================= labels (appear one after another) ================= */
const NSV="http://www.w3.org/2000/svg",labSvg=$('lab');
const sv=(n,a,p)=>{const e=document.createElementNS(NSV,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const LB=[{t:'النواة',x:1050,y:200,p:[985,382]},{t:'السايتوبلازم',x:1050,y:640,p:[1050,868]},{t:'القطرة الدهنية',x:155,y:250,p:[430,470]}];
LB.forEach(l=>{l.g=sv('g',{opacity:0},labSvg);l.ln=sv('line',{},l.g);l.dt=sv('circle',{r:3.2},l.g);l.tx=sv('text',{x:l.x,y:l.y},l.g);l.tx.textContent=l.t;
  l.g.style.transition='opacity .6s';});
let labelsOn=true,labT=[];
function updLabels(){
  LB.forEach(l=>{const P=toW(fwd(l.p,gNow)),p=[600+(P[0]-600)*layerT.s+layerT.x,400+(P[1]-400)*layerT.s+layerT.y];
    if(!l.bb){try{l.bb=l.tx.getBBox();}catch(e){return;}}
    const b=l.bb,cx=b.x+b.width/2,cy=b.y+b.height/2,dx=p[0]-cx,dy=p[1]-cy,s=Math.min((b.width/2+8)/Math.abs(dx||1e-6),(b.height/2+6)/Math.abs(dy||1e-6));
    l.ln.setAttribute('x1',cx+dx*s);l.ln.setAttribute('y1',cy+dy*s);l.ln.setAttribute('x2',p[0]);l.ln.setAttribute('y2',p[1]);l.dt.setAttribute('cx',p[0]);l.dt.setAttribute('cy',p[1]);});
}
function hideLabel(){labT.forEach(clearTimeout);labT=[];LB.forEach(l=>{l.g.style.transition='opacity .25s';l.g.setAttribute('opacity',0);});}
function showLabel(){hideLabel();if(!labelsOn||anim||Math.round(S)!==0)return;
  LB.forEach((l,i)=>labT.push(setTimeout(()=>{l.g.style.transition='opacity .6s';l.g.setAttribute('opacity',1);},250+i*700)));}
const lb=$('lbl');lb.onclick=()=>{labelsOn=!labelsOn;lb.classList.toggle('off',!labelsOn);if(!anim)showLabel();};

/* ================= stepping (template controls) ================= */
const dotsEl=$('dots'),dots=[];
TITLES.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i?'':' on');b.title=TITLES[i];b.onclick=()=>go(i);dotsEl.appendChild(b);dots.push(b);});
let S=0,from=0,goal=0,t0=0,dur=1,anim=false;
function setUI(i){dots.forEach((d,k)=>d.classList.toggle('on',k===i));const tt=$('title');tt.style.opacity=0;setTimeout(()=>{tt.textContent=TITLES[i];tt.style.opacity=1;},300);}
function go(i){
  if(i<0||i>=TITLES.length||(i===goal&&(anim||S===i)))return;
  setUI(i);hideLabel();
  if(i<Math.round(S)||(anim&&i<goal)){const sc=$('scene');sc.style.opacity=0;anim=false;
    setTimeout(()=>{S=from=goal=i;sc.style.opacity=1;setTimeout(showLabel,400);},350);return;}
  from=S;goal=i;let d=0;for(let k=Math.floor(from);k<goal;k++)d+=DUR[k]*(k===Math.floor(from)?1-(from-k):1);
  dur=d*(goal-from>1.01?.55:1)*1000;t0=performance.now();anim=true;
}
$('next').onclick=()=>{const c=anim?goal:Math.round(S);if(c<TITLES.length-1)go(c+1);else go(0);};
$('prev').onclick=()=>{const c=anim?goal:Math.round(S);if(c>0)go(c-1);};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('next').click();if(e.key==='ArrowRight')$('prev').click();});
function frame(now){
  if(anim){const k=clamp((now-t0)/dur);S=from+(goal-from)*(goal-from>1.01?ease(k):k);if(k>=1){anim=false;S=goal;showLabel();}}
  render(S,now/1000);updLabels();requestAnimationFrame(frame);
}

/* ================= view: fit, zoom, pan, pinch, fullscreen (template) ================= */
const world=$('world'),stage=$('stage');
let fit=1,zoom=1,px=0,py=0;
const headH=()=>$('head').offsetHeight+6,footH=()=>$('views').offsetHeight+28;
function apply(){world.style.transform=`translate(${px.toFixed(1)}px,${py.toFixed(1)}px) scale(${(fit*zoom).toFixed(4)})`;}
function fitView(){const w=stage.clientWidth,h=stage.clientHeight-headH()-footH();fit=Math.min(w/1200,h/800);zoom=1;px=(w-1200*fit)/2;py=headH()+(h-800*fit)/2;apply();
  LB.forEach(l=>{l.tx.style.fontSize=Math.max(30,15/fit).toFixed(1)+'px';l.bb=null;});}
function zoomAt(k,cx,cy){const nz=clamp(zoom*k,.5,8);k=nz/zoom;px=cx-(cx-px)*k;py=cy-(cy-py)*k;zoom=nz;apply();}
const ctr=()=>[stage.clientWidth/2,(stage.clientHeight+headH()-footH())/2];
$('zin').onclick=()=>zoomAt(1.3,...ctr());
$('zout').onclick=()=>zoomAt(1/1.3,...ctr());
const fsIco=$('fsIco');let pseudo=false;
const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement||pseudo);
const setFsIcon=()=>{fsIco.innerHTML=isFs()?'<path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/>':'<path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/>';
  $('fs').title=isFs()?'الخروج من ملء الشاشة':'ملء الشاشة';};
function enterFs(){const e=document.documentElement,r=e.requestFullscreen||e.webkitRequestFullscreen||e.webkitRequestFullScreen||e.msRequestFullscreen;
  const fallback=()=>{pseudo=true;document.body.classList.add('pseudo');window.scrollTo(0,1);setFsIcon();setTimeout(fitView,300);};
  if(!r||!(document.fullscreenEnabled||document.webkitFullscreenEnabled)){fallback();return;}
  try{const pr=r.call(e,{navigationUI:'hide'});if(pr&&pr.catch)pr.catch(fallback);}catch(err){fallback();}}
function exitFs(){if(pseudo){pseudo=false;document.body.classList.remove('pseudo');setFsIcon();fitView();return;}
  const d=document,x=d.exitFullscreen||d.webkitExitFullscreen||d.webkitCancelFullScreen||d.msExitFullscreen;if(x)x.call(d);}
$('fs').onclick=()=>isFs()?exitFs():enterFs();
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{setFsIcon();setTimeout(fitView,60);}));
setFsIcon();
const P=new Map(),loc=e=>[e.clientX,e.clientY];
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);P.set(e.pointerId,loc(e));stage.classList.add('drag');});
stage.addEventListener('pointermove',e=>{
  if(!P.has(e.pointerId))return;const prev=new Map(P),c=loc(e);P.set(e.pointerId,c);
  if(P.size===1){const o=prev.get(e.pointerId);px+=c[0]-o[0];py+=c[1]-o[1];apply();}
  else{const id=[...P.keys()].slice(0,2),a0=prev.get(id[0]),b0=prev.get(id[1]),a1=P.get(id[0]),b1=P.get(id[1]);
    const d0=Math.hypot(a0[0]-b0[0],a0[1]-b0[1])||1,d1=Math.hypot(a1[0]-b1[0],a1[1]-b1[1]);
    px+=(a1[0]+b1[0]-a0[0]-b0[0])/2;py+=(a1[1]+b1[1]-a0[1]-b0[1])/2;zoomAt(d1/d0,(a1[0]+b1[0])/2,(a1[1]+b1[1])/2);}
});
const up=e=>{P.delete(e.pointerId);if(!P.size)stage.classList.remove('drag');};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY);},{passive:false});
stage.addEventListener('dblclick',fitView);
addEventListener('resize',fitView);addEventListener('orientationchange',()=>setTimeout(fitView,300));

fitView();requestAnimationFrame(frame);
const sc=$('scene');sc.style.opacity=0;setTimeout(()=>{sc.style.transition='opacity .9s';sc.style.opacity=1;setTimeout(()=>{sc.style.transition='opacity .35s';showLabel();},950);},60);
})();
</script>

<script>window.MOE_MIN_DATA={"sections":{},"names":{},"qs":[{"type":"عدّد","tags":["1/2015 أسئلة النازحين","2/2018","3/2019"],"q":"عدّد خمساً ( أربعاً / ستاً ) من خلايا النسيج الضام .","a":{"ol":["الأرومة الليفية .","البلعم الكبير .","الخلية الدهنية .","الخلية الحشوية المتوسطة .","الخلية البلازمية .","الخلية البدينة .","الخلية الصباغية .","الخلية الشبكية ."]}},{"type":"عرّف","tags":["2/2020","2/2022"],"q":"عرّف الخلية الدهنية ؟","a":{"p":"وهي خلية كروية الشكل تحوي قطيرة دهنية كبيرة تشغل معظم حجم الخلية والسايتوبلازم فيها يكون ممثلاً بحلقة نحيفة والنواة تكون مسطحة محيطية الموقع أي جانبية الموقع ، وتعمل الخلية الدهنية على خزن الدهون لتوليد الطاقة وحماية الفرد من فقدان الحرارة ."}},{"type":"ما ميزة","tags":["1/2022","2023 تمهيدي"],"q":"ما مميزات الخلية الدهنية ؟","a":{"ol":["خلية كروية الشكل .","تحوي قطيرة دهنية كبيرة تشغل معظم حجم الخلية .","السايتوبلازم فيها يكون ممثلاً بحلقة نحيفة .","النواة تكون مسطحة محيطية الموقع أي جانبية الموقع .","تعمل الخلية الدهنية على خزن الدهون لتوليد الطاقة وحماية الفرد من فقدان الحرارة ."]}},{"type":"ما ميزة","tags":["1/2018 أسئلة خارج القطر"],"q":"اذكر مميزات نواة الخلية الدهنية .","a":{"p":"النواة تكون مسطحة محيطية الموقع أي جانبية الموقع ."}},{"type":"علّل","tags":["2/2022 أسئلة المتميزين"],"q":"يكون سايتوبلازم الخلية الدهنية ممثلاً بحلقة نحيفة .","a":{"p":"لاحتواء الخلية على قطيرة دهنية كبيرة تشغل معظم حجم الخلية ."}},{"type":"ما موقع","tags":["2/2022 أسئلة المتميزين"],"q":"ما موقع القطيرة الدهنية ؟","a":{"p":"سايتوبلازم الخلية الدهنية ."}},{"type":"ما موقع","tags":["1/2024"],"q":"ما موقع النواة في الخلايا الدهنية ؟","a":{"p":"محيطية الموقع أو جانبية الموقع في الخلية الدهنية ."}},{"type":"ما ميزة","tags":["1/1993"],"q":"ما هي مواصفات النسيج الضام الشحمي ؟","a":{"ol":["تسود فيه الخلايا الدهنية .","يوجد تحت الجلد وفي مواقع خزن الدهون وأيضها .","وظيفته خزن الدهون وتوليد الطاقة والحماية من فقدان حرارة الجسم ."]}}]};</script>
<script>
/* MoeLab — محرك الأسئلة الوزارية
   يُحقن تلقائياً داخل كل محاكاة لها أسئلة (لا تعدّل النسخ المحقونة يدوياً — عدّل هذا الملف ثم شغّل build.py).
   مبدأ الأمان: أي خطأ هنا يُخفي زر الوزاريات فقط ولا يؤثر على المحاكاة. */
(function(){try{
var D=window.MOE_MIN_DATA;if(!D||!D.qs||!D.qs.length)return;
var stage=document.getElementById('stage')||document.body;
/* محاكيات بقالب آخر (أزرار التكبير داخل .side خارج #stage): نضع العناصر فوق الصفحة كلها */
var ZB=document.querySelector('.zb')||(function(){var z=document.getElementById('zin');return z&&z.parentElement;})();
if(!document.querySelector('.zb')&&ZB&&!stage.contains(ZB)){stage=document.body;document.documentElement.classList.add('moe-fixed');}
var AR=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];});};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var tagK=function(s){return /الفصل|الكتاب|التلفزيون/.test(s)?'book':/خارج|الموصل|المتميزين|النازحين|المحاولات/.test(s)?'out':/تمهيدي|تكميلي/.test(s)?'pre':'min';};
var tagH=function(s){var k=tagK(s);return '<span class="tg '+k+'">'+esc(k==='book'?s:'وزاري '+s)+'</span>';};
var minCount=function(q){var t=(q.tags||[]).slice();(q.items||[]).forEach(function(i){t=t.concat(i.tags||[]);});return t.filter(function(s){return tagK(s)!=='book';}).length;};
var $=function(id){return document.getElementById(id);};

/* ---------- DOM ---------- */
var wrap=document.createElement('div');
wrap.innerHTML='<button id="qbtn" type="button" aria-label="الأسئلة الوزارية">📝 الوزاريات <b id="qcnt"></b></button>'+
 '<div id="hlbar"><span id="hlname"></span><button id="hlback" type="button">↩ رجوع للسؤال</button></div>'+
 '<div id="qp" role="dialog" aria-label="الأسئلة الوزارية">'+
  '<div id="qhd"><div class="t">📝 الأسئلة الوزارية</div><button id="qx" type="button" aria-label="إغلاق">✕</button></div>'+
  '<div id="qchips"></div><div id="qbody"></div>'+
  '<div id="qft"><button id="qprev" type="button">السابق ▶</button><button id="qa" type="button">إظهار الحل 💡</button><button id="qnext" type="button">التالي ◀</button></div>'+
 '</div>';
while(wrap.firstChild)stage.appendChild(wrap.firstChild);
/* place the button just to the right of the sim's zoom buttons (or under them if they are in a row) */
function placeBtn(){try{var b=$('qbtn'),zb=ZB,st=stage===document.body?{left:0,top:0,width:innerWidth,height:innerHeight}:stage.getBoundingClientRect();
  if(!zb){b.style.left='10px';b.style.top='10px';return;}
  var r=zb.getBoundingClientRect(),row=getComputedStyle(zb).flexDirection==='row';
  if(!r.width||!r.height){b.style.left='10px';b.style.top='10px';return;}
  var below=function(){b.style.left=Math.round(r.left-st.left)+'px';b.style.top=Math.round(r.bottom-st.top+8)+'px';};
  if(row||placeBtn.down){below();return;}
  b.style.left=Math.round(r.right-st.left+10)+'px';b.style.top=Math.round(r.top-st.top)+'px';
  /* if the sim shows its own caption/banner in that spot, move under the zoom buttons (and stay there) */
  var q=b.getBoundingClientRect(),hit=false;
  [].forEach.call(stage.querySelectorAll('*'),function(e){if(hit||e===b||(zb&&zb.contains(e))||e.closest('.zb,#qp,#hlbar,#qbtn'))return;
    if(e.parentElement!==stage&&!e.id)return;
    var cs=getComputedStyle(e);if(cs.position==='static'||cs.display==='none'||cs.visibility==='hidden'||!(e.textContent||'').trim())return;
    var x=e.getBoundingClientRect();if(!x.width||x.width>st.width*.9||x.height>120)return;
    if(x.left<q.right&&x.right>q.left&&x.top<q.bottom&&x.bottom>q.top)hit=true;});
  if(hit){placeBtn.down=true;below();}}catch(_){}}
placeBtn();setInterval(placeBtn,700);window.addEventListener('resize',placeBtn);document.addEventListener('fullscreenchange',function(){setTimeout(placeBtn,50);});

var qp=$('qp'),qbody=$('qbody'),qchips=$('qchips'),qa=$('qa'),qprev=$('qprev'),qnext=$('qnext');
var QS=D.qs,SEC=D.sections||{},NAMES=D.names||{};
$('qcnt').textContent=AR(QS.length);
var secKeys=Object.keys(SEC).filter(function(k){return QS.some(function(q){return q.sec===k;});});
if(secKeys.length<2)qchips.style.display='none';
var qsec='all',qi=0,qrev=false,qOpen=false;
var list=function(){return qsec==='all'?QS:QS.filter(function(q){return q.sec===qsec;});};
qchips.innerHTML=[['all','الكل']].concat(secKeys.map(function(k){return [k,SEC[k]];})).map(function(a){return '<button type="button" data-k="'+a[0]+'">'+esc(a[1])+'</button>';}).join('');
qchips.onclick=function(e){var b=e.target.closest('button');if(!b)return;qsec=b.dataset.k;qi=0;qrev=false;render();};

function ansH(a){var h='';if(!a)return h;if(a.p&&!a.tb)h+='<div>'+esc(a.p)+'</div>';
  if(a.ol)h+='<ol>'+a.ol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(a.tb)h+='<div class="tbw"><table><tr>'+a.tb.h.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>'+a.tb.r.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
  if(a.dl)h+='<dl>'+a.dl.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl>';if(a.p&&a.tb)h+='<div class="note">'+esc(a.p)+'</div>';return h;}
var SIM=null;function sim(){return SIM||(SIM=window.MOE_SIM||null);}
function canSee(k){var s=sim();return !!(k&&s&&s.groups&&s.groups[k]);}
function render(){try{render0();}catch(err){qOpen=false;qp.classList.remove('on');$('qbtn').style.display='none';if(window.console)console.warn('MoeLab ministerial:',err);}}
function render0(){
  var L=list(),q=L[qi];
  [].forEach.call(qchips.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===qsec);});
  var n=minCount(q);
  var h='<div class="qc'+(qrev?' rev':'')+'"><div class="qtop"><span class="qty">'+esc(q.type)+'</span>'+
    (n>=3?'<span class="qfire">🔥 تكرر وزارياً '+AR(n)+' مرات</span>':'')+'<span class="qnum">'+AR(qi+1)+' / '+AR(L.length)+'</span></div>';
  if(q.tags&&q.tags.length)h+='<div class="tags">'+q.tags.map(tagH).join('')+'</div>';
  h+='<div class="qq">'+esc(q.q).replace(/\{([^}]*)\}/g,'<span class="blank">$1</span>')+'</div>';
  if(q.opts)h+='<div class="opts">'+q.opts.map(function(o,k){return '<button type="button" class="opt'+(qrev&&k===q.ans?' ok':'')+'" data-k="'+k+'">'+'أبجد'[k]+' ) '+esc(o)+'</button>';}).join('')+'</div>';
  if(q.items)h+='<ol class="items">'+q.items.map(function(it){var t=it.tags||[];return '<li>'+esc(it.t)+(t.length?'<div class="tags">'+t.map(tagH).join('')+'</div>':'')+'<div class="ia">'+esc(it.a||q.common||'')+'</div></li>';}).join('')+'</ol>';
  if(q.a)h+='<div class="ans"><div class="h">✔ الجواب</div>'+ansH(q.a)+'</div>';
  if(canSee(q.hl))h+='<div class="see"><button type="button" id="qsee">📍 شوف '+esc(NAMES[q.hl]||'')+' بالمحاكاة</button></div>';
  qbody.innerHTML=h+'</div>';qbody.scrollTop=0;
  qa.textContent=qrev?'إخفاء الحل':'إظهار الحل 💡';qa.classList.toggle('hide',qrev);
  qprev.disabled=qi===0;qnext.disabled=qi>=L.length-1;
  [].forEach.call(qbody.querySelectorAll('.opt'),function(b){b.onclick=function(){if(+b.dataset.k===q.ans){qrev=true;render();}else b.classList.add('no');};});
  var s=$('qsee');if(s)s.onclick=function(){hlStart(q.hl);};
}
qa.onclick=function(){qrev=!qrev;render();};
qprev.onclick=function(){if(qi>0){qi--;qrev=false;render();}};
qnext.onclick=function(){if(qi<list().length-1){qi++;qrev=false;render();}};
function show(on){qOpen=on;qp.classList.toggle('on',on);if(on)render();}
$('qbtn').onclick=function(){hlStop();show(true);};
$('qx').onclick=function(){show(false);};

/* ---------- highlight inside the simulation (only if the sim registered window.MOE_SIM) ---------- */
var HL=null;
function els(keys,map){var a=[];keys.forEach(function(k){(map[k]||[]).forEach(function(e){a.push(e);});});return a;}
function bbox(arr){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;arr.forEach(function(e){try{var b=e.getBBox();if(!b.width&&!b.height)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}catch(_){}});return x0<x1?{x0:x0,y0:y0,x1:x1,y1:y1}:null;}
var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function hlStart(k){
  var s=sim();if(!canSee(k))return;show(false);
  try{s.finish();}catch(_){}
  var parts=s.groups[k],on=els(parts,s.parts),labs=els(parts,s.labels||{});
  var all=els(Object.keys(s.parts),s.parts),allL=els(Object.keys(s.labels||{}),s.labels||{});
  var v=s.view.get(),vb=s.view.box,b=bbox(on.concat(labs)),to=v;
  if(b){var pad=30,cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,ks=Math.max(1,Math.min(2.6,vb[2]/(b.x1-b.x0+2*pad),vb[3]/(b.y1-b.y0+2*pad)));
    to=[ks,vb[0]+vb[2]/2-cx*ks,vb[1]+vb[3]/2-cy*ks];}
  HL={k:k,s:s,on:new Set(on),labs:new Set(labs),all:all,allL:allL,glows:els(parts,s.glows||{}),t0:performance.now(),from:v,to:to};
  $('hlname').textContent='📍 '+(NAMES[k]||'');
  $('hlbar').classList.add('on');document.body.classList.add('hlmode');
  requestAnimationFrame(tick);
}
function hlStop(){if(!HL)return;var s=HL.s;HL=null;$('hlbar').classList.remove('on');document.body.classList.remove('hlmode');try{s.view.reset();}catch(_){}}
function tick(ms){
  if(!HL)return;
  try{
    var u=(ms-HL.t0)/1000,z=ease(Math.max(0,Math.min(1,u/.8))),L=function(a,b){return a+(b-a)*z;};
    HL.s.view.set(L(HL.from[0],HL.to[0]),L(HL.from[1],HL.to[1]),L(HL.from[2],HL.to[2]));
    var p=.5+.5*Math.sin(u*4.2);
    HL.all.forEach(function(e){if(!HL.on.has(e))e.setAttribute('opacity','0.18');});
    HL.allL.forEach(function(e){e.setAttribute('opacity',HL.labs.has(e)?'1':'0.15');});
    HL.glows.forEach(function(g){g.style.display='';g.setAttribute('opacity',(.35+.45*p).toFixed(2));});
    if(HL.s.pulse)HL.s.pulse(HL.k,p);
  }catch(e){hlStop();return;}
  requestAnimationFrame(tick);
}
$('hlback').onclick=function(){hlStop();show(true);};
/* any simulation button stops the highlight */
['go','prev','zreset'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',hlStop,true);});

/* keyboard: while the panel is open the arrows move between questions, not the simulation */
window.addEventListener('keydown',function(e){
  if(qOpen){e.stopImmediatePropagation();e.preventDefault();
    if(e.key==='ArrowLeft')qnext.click();else if(e.key==='ArrowRight')qprev.click();else if(e.key==='Escape')show(false);}
  else if(HL&&e.key==='Escape'){hlStop();}
},true);
}catch(err){try{var b=document.getElementById('qbtn');if(b)b.style.display='none';var p=document.getElementById('qp');if(p)p.style.display='none';}catch(_){} if(window.console)console.warn('MoeLab ministerial:',err);}})();

</script>
<!--MOE-MIN:END--></body>
</html>
