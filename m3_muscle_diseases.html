<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><script>(function(){try{var l=JSON.parse(localStorage.getItem('moe_offline_license')||'null');var n=Date.now();if(window.top===window.self||!l||n>l.offlineExpiry||(l.officialExpiry&&n>l.officialExpiry))location.replace('portal.html');}catch(e){location.replace('portal.html');}})();</script>
<title>أمراض الجهاز العضلي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /* Layout: three plates on one full-screen stage. Each plate fills it, its labels arrive one by one,
     then the picture slides left (top on phones) while the text types in on the right.
     Deliberately a single light theme, matching the white-ground anatomical plates. */
  :root{--navy:#1f3a52;--rust:#c4623a;--rustD:#a8431b;--ink:#26384a;--muted:#5d7488;--paper:#eef6fb;--white:#ffffff;--eqbg:#fff6ef;--eqline:#f0d2c2;color-scheme:light}
  html{height:100%;box-sizing:border-box;overflow:hidden;background:var(--paper)}
  body{position:relative;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);direction:rtl;
       font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--navy);padding:0 16px}
  #title{color:var(--white);font-size:clamp(15px,3.6vw,22px);font-weight:800}
  #badge{min-width:34px;height:34px;border-radius:50%;background:var(--white);color:var(--navy);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:radial-gradient(circle at 50% 45%,#f6fcff 0%,#cfe8f3 100%)}

  #draw{position:absolute;top:0;left:0;width:100%;height:calc(100% - 84px);z-index:2;
        transition:width 1.4s cubic-bezier(.65,0,.35,1),height 1.4s cubic-bezier(.65,0,.35,1)}
  .shifted #draw{width:55%}
  #draw>svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;overflow:visible;direction:ltr;transition:opacity .5s ease}
  #draw>svg:active{cursor:grabbing}
  #draw>svg.off{opacity:0;pointer-events:none}

  .lbl text{font-family:"Cairo",Tahoma,Arial,sans-serif;font-weight:800;fill:#141414;stroke:var(--white);stroke-linejoin:round;paint-order:stroke}
  .lbl .halo{fill:none;stroke:var(--white);stroke-linecap:round;stroke-linejoin:round}
  .lbl .ln{fill:none;stroke:#141414;stroke-linecap:round;stroke-linejoin:round}
  .lbl .dot{fill:#141414;stroke:var(--white)}
  .lbl .ring{fill:none;stroke:var(--rust)}
  .lbl .head{fill:#141414;stroke:var(--white);stroke-linejoin:round}

  #txt{position:absolute;top:24px;bottom:84px;right:28px;width:calc(45% - 48px);box-sizing:border-box;overflow-y:auto;z-index:1;
       padding:4px 6px 4px 14px;opacity:0;transform:translateX(40px);pointer-events:none;scrollbar-width:thin;
       transition:opacity .7s ease .4s,transform .9s cubic-bezier(.2,.7,.2,1) .4s;-webkit-user-select:text;user-select:text}
  .shifted #txt{opacity:1;transform:none;pointer-events:auto}
  .instant #draw,.instant #txt{transition:none!important}
  #txtIn{max-width:560px}
  @media (max-width:720px),(max-aspect-ratio:4/5){
    .shifted #draw{width:100%;height:40%}
    #txt{top:calc(40% + 2px);left:16px;right:16px;width:auto;bottom:80px;padding:4px;transform:translateY(40px)}
  }
  #txt h2{margin:0 0 10px;color:var(--navy);font-size:clamp(17px,1.7vw,21px);font-weight:800;line-height:1.6;text-wrap:balance}
  #txt .en{display:inline-block;margin-inline-start:8px;font-size:.68em;color:var(--rust);font-weight:700;direction:ltr;unicode-bidi:isolate;font-family:"Segoe UI",Arial,sans-serif}
  #txt p{margin:0 0 12px;font-size:clamp(14px,1.25vw,15.5px);line-height:1.95;color:var(--ink)}
  #txt h3{margin:14px 0 8px;color:var(--rustD);font-size:clamp(14.5px,1.3vw,16px);font-weight:800}
  #txt .eq{margin:4px 0 14px;padding:10px 12px;border:1px solid var(--eqline);background:var(--eqbg);border-radius:8px;font-size:clamp(13.5px,1.2vw,15px);line-height:1.9;color:var(--ink);font-weight:700;text-align:center}
  #txt .eq .w.arrow{color:var(--rust);font-weight:800}
  #txt ol{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  #txt li{display:flex;gap:9px;align-items:flex-start;font-size:clamp(13.5px,1.2vw,15px);line-height:1.85;color:var(--ink)}
  #txt li>span:last-child{min-width:0}
  .num{flex:none;width:21px;height:21px;margin-top:4px;border-radius:50%;background:var(--rust);color:var(--white);font-weight:700;font-size:12px;
       display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.4);transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1)}
  .num.on{opacity:1;transform:none}
  .w{display:inline-block;opacity:0;transform:translateY(5px);filter:blur(3px);transition:opacity .45s ease,transform .45s ease,filter .45s ease}
  .w.on{opacity:1;transform:none;filter:none}

  #ctrl{position:absolute;bottom:12px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px;pointer-events:none;z-index:4}
  #ctrl>*{pointer-events:auto}
  .nav{width:56px;height:56px;border-radius:50%;border:3px solid var(--navy);background:var(--white);color:var(--navy);font-size:24px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.22);transition:opacity .3s;font-family:inherit;padding:0}
  .nav:active{background:#d9ebf7}
  .nav:disabled{opacity:.3;cursor:default}
  #dots{display:flex;gap:12px;align-items:center}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--navy);background:var(--white);padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:var(--rust);border-color:var(--rust);transform:scale(1.45)}
  .zb{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);background:var(--white);color:var(--navy);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:background .25s,color .25s}
  .zb button svg{width:20px;height:20px;cursor:pointer}
  #tt.on{background:var(--navy);color:var(--white)}
  button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
  body.pf #top{display:none}
  body.pf #stage{top:0}
  @media (prefers-reduced-motion:reduce){#draw,#txt,.w,.num,#draw>svg{transition:none!important}}
</style>
</head>
<body>

<div id="top"><div id="title">بعض أمراض الجهاز العضلي</div><div id="badge">١</div></div>
<div id="stage">
  <div id="draw"></div>
  <div id="txt" title="انقر لإظهار النص كاملاً"><div id="txtIn"></div></div>
  <div class="zb">
    <button id="tt" aria-label="إظهار النص" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 11h16M8 16h12M11 21h9"/></svg></button>
    <button id="replay" aria-label="إعادة عرض التأشيرات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg></button>
    <button id="zin" aria-label="تكبير">+</button>
    <button id="zout" aria-label="تصغير">−</button>
    <button id="zreset" aria-label="إعادة الضبط">⟲</button>
    <button id="fs" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="المرض السابق">&#8594;</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="المرض التالي">&#8592;</button>
  </div>
</div>

  rg('gHeat1',[[0,'#ffb04a',.55],[1,'#ff7a1a',0]]);

      S.parts.forEach((a,i)=>{const f=i?fb:fa,br=.006*Math.sin(2*PI*t/2.2+i*PI)-(i?.01*f*(.5+.5*Math.sin(2*PI*t/1.6)):0);

    };

        const dot=el('circle',{class:'dot',cx:pts[0][0],cy:pts[0][1],r:0,'stroke-width':sw*.6},g);

      const c=[(o.a[0]+o.b[0])/2,(o.a[1]+o.b[1])/2],half=Math.abs(o.b[0]-o.a[0])/2;

      o.ml=el('path',{class:'ln','stroke-width':sw*1.1,stroke:'#141414'},g);
      o.hA=el('path',{class:'head','stroke-width':sw*.8,d:`M0 0L${sw*5} ${-sw*3.2}L${sw*5} ${sw*3.2}Z`},g);
      o.hB=el('path',{class:'head','stroke-width':sw*.8,d:`M0 0L${-sw*5} ${-sw*3.2}L${-sw*5} ${sw*3.2}Z`},g);
      o.ends=[o.a,o.b].map(p=>el('path',{class:'ln','stroke-width':sw*.9,d:`M${p[0]} ${p[1]-sw*6}V${p[1]+sw*6}`,opacity:0},g));
    }
    if(o.t){o.tg=el('g',{opacity:0},g);
      o.t.forEach((s,k)=>{const t=el('text',{x:o.x,y:o.y+k*(o.dy||0),'text-anchor':o.a||'middle','font-size':S.fs,'stroke-width':S.fs*.18},o.tg);if(o.fill)t.style.fill=o.fill;t.textContent=s;});}
  });

      });

const mk=(tag,cls,par,s)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(s!=null)e.textContent=s;if(par)par.appendChild(e);return e;};
const LAT=/[A-Za-z]/;
function words(par,s){
  const toks=s.split(/\s+/),out=[];
  for(let k=0;k<toks.length;k++){
    let w=toks[k],cls='w';
    if(LAT.test(w)){while(k+1<toks.length&&LAT.test(toks[k+1])&&!/\)$/.test(w))w+=' '+toks[++k];cls+=' en-run';}
    if(out.length)par.appendChild(document.createTextNode(' '));
    const sp=mk('span',cls+(w==='←'?' arrow':''),par,w);
    if(cls.includes('en-run')){sp.dir='ltr';sp.style.unicodeBidi='isolate';}
    out.push(sp);
  }
  return out;
}
let seq=[],typeTok=0,typed=false;
function buildText(){
  typeTok++;typed=false;seq=[];txtIn.textContent='';txt.scrollTop=0;
  SLIDES[cur].text.forEach(b=>{
    if(b.h2){const h=mk('h2','',txtIn);seq.push(...words(h,AR(cur+1)+'. '+b.h2));if(b.en){h.appendChild(document.createTextNode(' '));seq.push(mk('span','w en',h,'('+b.en+')'));}seq.push({pause:300});}
    if(b.p){seq.push(...words(mk('p','',txtIn),b.p),{pause:300});}
    if(b.eq){seq.push(...words(mk('div','eq',txtIn),b.eq),{pause:350});}
    if(b.h3){const h=mk('h3','',txtIn);seq.push(...words(h,b.h3));if(b.en){h.appendChild(document.createTextNode(' '));seq.push(mk('span','w en',h,'('+b.en+')'));}seq.push({pause:200});}
    if(b.ol){const ol=mk('ol','',txtIn);b.ol.forEach((f,k)=>{const li=mk('li','',ol);seq.push(mk('span','num',li,AR(k+1)));seq.push(...words(mk('span','',li),f),{pause:180});});}
  });
}
function startTyping(){
  if(typed)return;typed=true;const tok=++typeTok;
  if(RM){showAll();return;}
  let k=0;
  (function next(){
    if(tok!==typeTok)return;
    while(k<seq.length&&seq[k].pause===undefined&&seq[k].classList.contains('on'))k++;
    const it=seq[k++];if(!it)return;
    if(it.pause!==undefined){setTimeout(next,it.pause);return;}
    it.classList.add('on');
    const b=it.getBoundingClientRect(),c=txt.getBoundingClientRect();
    if(b.bottom>c.bottom-8)txt.scrollTop+=b.bottom-c.bottom+24;
    setTimeout(next,it.classList.contains('num')?120:60);

}

let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;

function mid(){const v=SLIDES[cur].vb;return{x:v[0]+v[2]/2,y:v[1]+v[3]/2};}
function toView(e){const svg=SLIDES[cur].svg,p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
SLIDES.forEach(S=>{const svg=S.svg;
  svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;const prev=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
    if(ptrs.size===1){const o=prev.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
    else{const ids=[...ptrs.keys()].slice(0,2),a0=prev.get(ids[0]),b0=prev.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
      const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
      tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
  });
  const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
