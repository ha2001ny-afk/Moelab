<style>

<div id="top"><div id="title">التناضح (Osmosis)</div></div>
<div id="stage">
  <div class="zb"><button id="zin">+</button><button id="zout">−</button><button id="zreset">⟲</button><button id="home">⌂</button><button id="pause">⏸</button><button id="fs">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 900 760" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#2f6fd6"/></marker>

        الخلية النباتية
      </button>
    </div>

</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,CX=450,CY=375;
const svg=document.getElementById('svg'),view=document.getElementById('view');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,f1=v=>v.toFixed(1);
const hx=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');};
let rs=3;const rnd=()=>{rs=(rs*9301+49297)%233280;return rs/233280;};

/* ---------------- state ---------------- */
let type='A',stage=0,T=0,stageT0=0,reborn=false,paused=false,last=performance.now();
const S={conc:.5,flow:0,size:1,cren:0,burst:-1,alpha:1,entry:1,ws:1,pp:.96,vf:.72};
const sm=(v,t,r,dt)=>v+(t-v)*(1-Math.exp(-r*dt));
const STG={A:[['أ - محلول متعادل التركيز','Isotonic Solution','#2e8b57'],['ب - محلول واطئ التركيز','Hypotonic Solution','#2f6fd6'],['ج - محلول عالي التركيز','Hypertonic Solution','#d9622b']],
  P:[['أ - محلول متعادل التركيز','Isotonic Solution','#2e8b57'],['ب - محلول واطئ التركيز','Hypotonic Solution','#2f6fd6'],['ج - محلول عالي التركيز','Hypertonic Solution','#d9622b'],['حالة ازالة البلزمة','Deplasmolysis','#7b4bb3']]};

/* ---------------- shapes ---------------- */
const sup=(th,a,b)=>{const c=Math.abs(Math.cos(th))/a,s=Math.abs(Math.sin(th))/b;return Math.pow(Math.pow(c,3.6)+Math.pow(s,3.6),-1/3.6);};
const EoA=th=>{const R=105*S.size,w=1-.7*clamp((S.size-1)/.5,0,1),sp=1-Math.abs(Math.sin(4.5*th+T*.3));
  return R*(1+w*(.06*Math.sin(3*th+T*.5)+.04*Math.sin(5*th-T*.4))+S.cren*.09*(Math.pow(sp,3)*2-.5));};
const EW=th=>sup(th,S.ws*125,S.ws*170),EWI=th=>EW(th)-15;
const AP=()=>(S.ws*125-16)*S.pp,BP=()=>(S.ws*170-16)*S.pp;
const EP=th=>sup(th,AP(),BP())*(1+.025*(1-S.pp)*Math.sin(5*th+T*.8));
const Eo=th=>type==='A'?EoA(th):EW(th),Ei=th=>type==='A'?EoA(th):EP(th);
const pol=(x,y)=>{const dx=x-CX,dy=y-CY;return[Math.atan2(dy,dx),Math.hypot(dx,dy)];};
const polyD=(fn,N)=>{let d='';for(let i=0;i<N;i++){const th=2*PI*i/N,r=fn(th);d+=(i?'L':'M')+f1(CX+r*Math.cos(th))+','+f1(CY+r*Math.sin(th));}return d+'Z';};

/* ---------------- scene layers ---------------- */
const tank=el('rect',{x:190,y:110,width:520,height:530,rx:24,fill:'#cfe4f6',stroke:'#7aa6c8','stroke-width':4});
const outG=G(view),AG=G(view),PG=G(view),inG=G(view),arrG=G(view),watG=G(view),labG=G(view,{'pointer-events':'none'});
/* animal cell */
const aFill=el('path',{},AG),aBlobs=[[40,-30,17,12],[-45,25,15,11],[30,45,13,10]].map(b=>({b,e:el('ellipse',{fill:'#9a90bf','fill-opacity':.7},AG)}));
const aNuc=el('circle',{fill:'#7a2f9a',stroke:'#4b1766','stroke-width':2.5},AG),aNl=el('circle',{fill:'#4b1766'},AG);
const aStroke=el('path',{fill:'none',stroke:'#6d6590','stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round'},AG);
const spikeG=G(AG),spike=el('polygon',{fill:'#e8582e',stroke:'#a62a10','stroke-width':2.5,'stroke-linejoin':'round'},spikeG);
const debris=[...Array(24)].map(()=>({x:0,y:0,vx:0,vy:0,age:9,e:el('circle',{r:4,fill:'#b7aed0',stroke:'#6d6590','stroke-width':1.2,opacity:0},AG)}));
/* plant cell */
const pGapFill=el('path',{},PG),pProto=el('path',{fill:'#f3b394',stroke:'#c2462e','stroke-width':3.5,'stroke-linejoin':'round'},PG);
const pVac=el('path',{fill:'#cdeee7',stroke:'#7cc3b5','stroke-width':2.5},PG),pNuc=el('ellipse',{rx:19,ry:17,fill:'#5b2f9c',stroke:'#2a1450','stroke-width':2.5},PG);
const pCh=[...Array(7)].map((_,i)=>({a:i*PI*2/7+.3,e:el('ellipse',{rx:13,ry:7.5,fill:'#47b04f',stroke:'#1f6b2e','stroke-width':1.8},PG)}));
const pWall=el('path',{fill:'none',stroke:'#2f8f3f','stroke-width':15,'stroke-linejoin':'round'},PG),pWall2=el('path',{fill:'none',stroke:'#7bc97f','stroke-width':2,'stroke-opacity':.7},PG);

/* ---------------- particles ---------------- */
const SOL={fill:'#f08a1c',stroke:'#b8590a','stroke-width':1.2};
function solute(parent,kind,thr){const p={kind,thr,x:CX,y:CY,vx:(rnd()-.5)*.6,vy:(rnd()-.5)*.6,seeded:false,e:el('circle',{r:5,...SOL},parent)};return p;}
const outs=[...Array(46)].map((_,i)=>solute(outG,'out',(i+.5)/46)),ins=[...Array(14)].map(()=>solute(inG,'in',0)),gaps=[...Array(12)].map((_,i)=>solute(inG,'gap',(i+.5)/12));
const validOut=(x,y)=>{if(x<208||x>692||y<128||y>622)return false;const q=pol(x,y);return q[1]>Eo(q[0])+11;};
const validIn=(x,y)=>{const q=pol(x,y);return q[1]<Ei(q[0])-11;};
const validGap=(x,y)=>{const q=pol(x,y);return q[1]>EP(q[0])+10&&q[1]<EWI(q[0])-8;};
function seed(p,v,fn){for(let k=0;k<400;k++){const x=210+rnd()*480,y=130+rnd()*490;if(v(x,y)){p.x=x;p.y=y;return true;}}return false;}
function walk(p,dt,v,fix){
  p.vx+=(rnd()-.5)*.1;p.vy+=(rnd()-.5)*.1;const s=Math.hypot(p.vx,p.vy);if(s>.5){p.vx*=.5/s;p.vy*=.5/s;}
  const nx=p.x+p.vx,ny=p.y+p.vy;if(v(nx,ny)){p.x=nx;p.y=ny;}else{p.vx=-p.vx;p.vy=-p.vy;}
  if(!v(p.x,p.y))fix(p);}
const fixOut=p=>{const q=pol(p.x,p.y),r=Eo(q[0])+13;p.x=CX+r*Math.cos(q[0]);p.y=CY+r*Math.sin(q[0]);if(!validOut(p.x,p.y))seed(p,validOut);};
const fixIn=p=>{const q=pol(p.x,p.y),r=Math.max(0,Ei(q[0])-14)*rnd();p.x=CX+r*Math.cos(q[0]);p.y=CY+r*Math.sin(q[0]);};
const fixGap=p=>{const q=pol(p.x,p.y),r=clamp(q[1],EP(q[0])+12,EWI(q[0])-10);p.x=CX+r*Math.cos(q[0]);p.y=CY+r*Math.sin(q[0]);};
outs.forEach(p=>seed(p,validOut));ins.forEach(p=>seed(p,validIn));
const water=[...Array(46)].map(()=>({th:rnd()*2*PI,dir:1,u:rnd(),spd:.45+rnd()*.35,e:el('circle',{r:3.8,fill:'#4aa3ff',stroke:'#1f6fd0','stroke-width':.9},watG)}));
const arrows=[0,5,2,7,4,9,1,6,3,8].map((p,k)=>({th:2*PI*k/10+.3,off:-1+2*p/9,e:el('line',{stroke:'#2f6fd6','stroke-width':5,'stroke-linecap':'round','stroke-dasharray':'13 8','marker-end':'url(#ab)'},arrG)}));

/* ---------------- labels ---------------- */
const labs=[];
function label(txt,side,py,w,tf,show){const h=36,cx=side==='L'?20+w/2:880-w/2,g=G(labG),ln=el('line',{class:'ln','marker-end':'url(#ah)'},g);
  el('rect',{class:'pill',x:cx-w/2,y:py-h/2,width:w,height:h,rx:18},g);el('text',{class:'lbl',x:cx,y:py},g).textContent=txt;
  const o={a:0,upd(dt){o.a=sm(o.a,show()?1:0,6,dt);g.setAttribute('opacity',o.a.toFixed(2));if(o.a<.02)return;const p=tf();ln.setAttribute('x1',cx);ln.setAttribute('y1',py);ln.setAttribute('x2',f1(p[0]));ln.setAttribute('y2',f1(p[1]));}};labs.push(o);return o;}
const at=(th,k)=>{const r=Eo(th)*(k||1);return[CX+r*Math.cos(th),CY+r*Math.sin(th)];};
const isA=()=>type==='A',isP=()=>type==='P';
const wound=-.35;
/* animal */
label('غشاء الخلية','L',200,150,()=>at(3.5),()=>isA()&&stage===0);
label('انتفاخ الخلية','R',250,150,()=>at(-.9),()=>isA()&&stage===1&&S.burst<0);
label('تمزق الخلية','R',250,150,()=>at(wound),()=>isA()&&stage===1&&S.burst>=.5);
label('انكماش الخلية','R',250,150,()=>at(-.9),()=>isA()&&stage===2&&S.size<.88);
/* plant */
const vacGeo=()=>({cx:CX-.1*AP(),cy:CY,a:AP()*S.vf,b:BP()*S.vf});
const nucPos=()=>[CX+.62*AP(),CY+.1*BP()];
const chPos=i=>{const a=pCh[i].a+T*.04,r=EP(a)*.86;return[CX+r*Math.cos(a),CY+r*Math.sin(a)];};
label('فجوة مركزية','L',210,150,()=>{const v=vacGeo();return[v.cx-.3*v.a,v.cy-.2*v.b];},()=>isP()&&stage===0);
label('نواة','L',330,150,()=>nucPos(),()=>isP()&&stage===0);
label('بلاستيدات','L',450,150,()=>chPos(3),()=>isP()&&stage===0);
label('جدار الخلية','R',230,150,()=>{const th=-.7,r=EW(th)-7;return[CX+r*Math.cos(th),CY+r*Math.sin(th)];},()=>isP()&&stage===0);
label('غشاء الخلية','R',340,150,()=>{const th=.35,r=EP(th);return[CX+r*Math.cos(th),CY+r*Math.sin(th)];},()=>isP()&&stage===0);
label('البلزمة','R',450,150,()=>{const th=PI*.93,r=(EP(th)+EWI(th))/2;return[CX+r*Math.cos(th),CY+r*Math.sin(th)];},()=>isP()&&stage===2&&S.pp<.8);

/* banner + legend */
const bn=el('rect',{id:'bn',x:190,y:20,width:520,height:68,rx:20,fill:'#2e8b57'});
const bt=el('text',{class:'bt',x:450,y:50}),be=el('text',{class:'be',x:450,y:74});
el('circle',{cx:340,cy:680,r:6,fill:'#4aa3ff',stroke:'#1f6fd0'});el('text',{class:'leg',x:420,y:686}).textContent='جزيئات الماء';
el('circle',{cx:530,cy:680,r:6,fill:'#f08a1c',stroke:'#b8590a'});el('text',{class:'leg',x:610,y:686}).textContent='مادة ذائبة';

/* ---------------- simulation step ---------------- */
function spawnDebris(){const q=wound;debris.forEach(d=>{const a=q+(rnd()-.5)*1.7,s=40+rnd()*90,r=Eo(q);d.x=CX+r*Math.cos(q);d.y=CY+r*Math.sin(q);d.vx=Math.cos(a)*s;d.vy=Math.sin(a)*s;d.age=0;});}
function step(dt){
  if(isA()){
    const tc=[.5,.1,1][stage];S.conc=sm(S.conc,tc,1.1,dt);
    if(reborn){S.alpha=Math.max(0,S.alpha-dt*2.6);S.flow=sm(S.flow,0,3,dt);if(S.alpha<=0){S.size=1;S.cren=0;S.burst=-1;debris.forEach(d=>d.age=9);reborn=false;stageT0=T;S.entry=1;}}
    else{S.alpha=Math.min(1,S.alpha+dt*2.6);const u=T-stageT0;
      if(stage===0){S.flow=sm(S.flow,0,2,dt);S.size=sm(S.size,1,1.2,dt);S.cren=sm(S.cren,0,1.2,dt);}
      else if(stage===1){S.cren=sm(S.cren,0,1.5,dt);
        if(S.burst<0){S.size=S.entry+(1.5-S.entry)*ease(clamp(u/5,0,1));S.flow=sm(S.flow,.9,2,dt);if(u>5.2){S.burst=0;spawnDebris();}}
        else{S.burst+=dt;S.size=sm(S.size,1.3,.6,dt);S.flow=sm(S.flow,.15,2,dt);}}
      else{S.size=sm(S.size,.68,.55,dt);S.cren=sm(S.cren,1,.5,dt);S.flow=sm(S.flow,u<5?-.9:-.3,1.5,dt);}}
  }else{
    S.conc=sm(S.conc,[.5,.1,1,.5][stage],1.1,dt);const u=T-stageT0;
    const tg=[[1,.96,.72,0],[1.06,1,.86,u<5?.85:.3],[1,.64,.42,u<5?-.9:-.2],[1,.96,.72,u<5?.8:0]][stage];
    S.ws=sm(S.ws,tg[0],.8,dt);S.pp=sm(S.pp,tg[1],.6,dt);S.vf=sm(S.vf,tg[2],.6,dt);S.flow=sm(S.flow,tg[3],2,dt);
  }
}

/* ---------------- render ---------------- */
function drawA(){
  const N=90;let d='';for(let i=0;i<N;i++){const th=2*PI*i/N,r=EoA(th);d+=(i?'L':'M')+f1(CX+r*Math.cos(th))+','+f1(CY+r*Math.sin(th));}
  aFill.setAttribute('d',d+'Z');aFill.setAttribute('fill',mix('#8c80b4','#d9d3ec',clamp((S.size-.65)/.9,0,1)));
  const gh=S.burst>=0?.32*Math.min(1,S.burst/.6):0;let sd='';const M=90;
  for(let k=0;k<=M;k++){const th=wound+gh+(2*PI-2*gh)*k/M,r=EoA(th);sd+=(k?'L':'M')+f1(CX+r*Math.cos(th))+','+f1(CY+r*Math.sin(th));}
  aStroke.setAttribute('d',gh>0?sd:sd+'Z');aStroke.setAttribute('stroke',S.burst>=0?'#a8584a':'#6d6590');
  const k=Math.pow(S.size,.8);
  aBlobs.forEach((o,i)=>{o.e.setAttribute('cx',f1(CX+o.b[0]*k+3*Math.sin(T*.6+i)));o.e.setAttribute('cy',f1(CY+o.b[1]*k+3*Math.cos(T*.5+i)));o.e.setAttribute('rx',f1(o.b[2]*(.8+.2*S.size)));o.e.setAttribute('ry',f1(o.b[3]*(.8+.2*S.size)));});
  const nr=26*(.8+.2*S.size),nx=CX-8*S.size+2*Math.sin(T*.5),ny=CY+4*S.size+2*Math.cos(T*.4);
  aNuc.setAttribute('cx',f1(nx));aNuc.setAttribute('cy',f1(ny));aNuc.setAttribute('r',f1(nr));aNl.setAttribute('cx',f1(nx+6));aNl.setAttribute('cy',f1(ny-5));aNl.setAttribute('r',f1(nr*.32));
  /* burst wound */
  if(S.burst>=0){const sb=Math.min(1,S.burst/.8),wr=Eo(wound),wx=CX+wr*Math.cos(wound),wy=CY+wr*Math.sin(wound);let pts='';
    for(let i=0;i<16;i++){const a=2*PI*i/16,r=(i%2?10:(30+8*Math.sin(T*6+i))*sb);pts+=f1(wx+r*Math.cos(a))+','+f1(wy+r*Math.sin(a))+' ';}
    spike.setAttribute('points',pts);spikeG.setAttribute('opacity',(.6+.4*Math.min(1,S.burst))*Math.max(.55,1-S.burst*.1));spikeG.style.display='';}
  else spikeG.style.display='none';
  debris.forEach(p=>{if(p.age<3.6){p.age+=0;p.e.setAttribute('cx',f1(p.x));p.e.setAttribute('cy',f1(p.y));p.e.setAttribute('opacity',(1-p.age/3.6).toFixed(2));}else p.e.setAttribute('opacity',0);});
  AG.setAttribute('opacity',S.alpha.toFixed(2));
}
function drawP(){
  const wi=polyD(EWI,80);pGapFill.setAttribute('d',wi);pGapFill.setAttribute('fill',mix('#eef8ff','#9ec3e6',S.conc));
  pProto.setAttribute('d',polyD(EP,80));
  const v=vacGeo(),vd=(()=>{let d='';for(let i=0;i<70;i++){const th=2*PI*i/70,r=sup(th,v.a,v.b);d+=(i?'L':'M')+f1(v.cx+r*Math.cos(th))+','+f1(v.cy+r*Math.sin(th));}return d+'Z';})();

function frame(ms){
  const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;
  step(dt);
  tank.setAttribute('fill',mix('#eef8ff','#9ec3e6',S.conc));
  AG.style.display=isA()?'':'none';PG.style.display=isP()?'':'none';
  if(isA()){drawA();debris.forEach(p=>{if(p.age<3.6){p.age+=dt;p.vx*=.985;p.vy*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;}});}else drawP();

    if(!p.seeded){const th=rnd()*2*PI,a=EP(th),b=EWI(th);const r=a+(b-a)*(.2+.6*rnd());p.x=CX+r*Math.cos(th);p.y=CY+r*Math.sin(th);p.seeded=true;}

  arrows.forEach(a=>{const dv=clamp((S.flow-a.off)*3,-1,1),sg=dv>=0?1:-1,eo=Eo(a.th),ei=Ei(a.th),c=Math.cos(a.th),s=Math.sin(a.th);
    const r1=sg>0?eo+62:ei-12,r2=sg>0?ei-8:eo+52;
    a.e.setAttribute('x1',f1(CX+c*r1));a.e.setAttribute('y1',f1(CY+s*r1));a.e.setAttribute('x2',f1(CX+c*r2));a.e.setAttribute('y2',f1(CY+s*r2));
    a.e.setAttribute('stroke-opacity',((.2+.8*Math.min(1,Math.abs(dv)*3))*vis).toFixed(2));a.e.setAttribute('stroke-dashoffset',f1(-T*45));});

    const ro=Eo(w.th)+55,ri=Ei(w.th)-45,r=w.dir>0?ro+(ri-ro)*w.u:ri+(ro-ri)*w.u;

  labs.forEach(l=>l.upd(dt||.0001));

}

function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}

  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};

const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);

svg.addEventListener('dblclick',reset);

3","3/2024 نظام المحاولات"],"q":"عرّف البلزمة ( الانكماش ) ؟","a":{"p":"هي ظاهرة ابتعاد الغشاء الخلوي عن جدار الخلية وهو ناتج بالطبع عن خروج الماء من الخلية إلى الخارج عند وضعها في محلول عالي التركيز . أو : هو ابتعاد الغشاء البلازمي عن جدار الخلية النباتية بعد وضعها في محلول عالي التركيز وهو بالطبع ناتج عن خروج الماء من الخلية ، ولكن عند إضافة الماء للمحلول تعود الخلية إلى وضعها الطبيعي الأول ( وتسمى هذه الحالة العكسية بحالة إزالة البلزمة ) ."}},{"type":"ماذا يحدث","tags":["3/2023 أسئلة المتميزين"],"q":"ما الذي يحدث عند إضافة محلول السكر إلى القمع في تجربة التناضح ؟","a":{"p":"عند إضافة محلول سكري إلى القمع نلاحظ ارتفاع مستوى الماء في أنبوبة القمع الزجاجي مشيراً إلى أن الماء يمر خلال غشاء السليوفان إلى محلول السكر في القمع مسبباً ضغطاً هيدروستاتيكياً ، ويتوقف دخول جزيئات الماء عندما يتساوى الضغط الهيدروستاتيكي مع الضغط التناضحي ."}},{"type":"أي عملية","tags":["2/2017 أسئلة خارج القطر"],"q":"أي عملية تحصل بعد : إضافة ماء إلى المحلول المحيط بالخلية التي تعاني البلزمة ؟","a":{"p":"إزالة البلزمة ."}},{"type":"ما منشأ","tags":["2/2025"],"q":"ما منشأ البلزمة ؟","a":{"p":"وضع الخلية النباتية في محلول عالي التركيز وهو خروج الماء من الخلية ."}},{"type":"ماذا يحدث","tags":["1/2015","1/2021"],"q":"ماذا يحصل لخلية حيوانية عند وضعها في : 1. محلول عالي التركيز 2. محلول واطئ التركيز ؟ مبيناً السبب في الحالتين .","a":{"ol":["يحدث فيها انكماش ( بلزمة ) وذلك نتيجة لخروج الماء من الخلية .","يحدث فيها انتفاخ الخلية الحيوانية وتمزقها بسبب دخول الماء إليها ."]}},{"type":"اذكر السبب","tags":["2/1999","2/2007"],"q":"اذكر سبب البلزمة .","a":{"p":"خروج الماء من داخل الخلية إلى خارجها ."}},{"type":"ماذا ينتج","q":"ماذا ينتج عند :","items":[{"t":"وضع كرية دم حمراء في ماء مقطر","tags":["1/2006"],"a":"انتفاخ الخلية ."},{"t":"تعرض كرية دم حمراء للهواء","tags":[],"a":"انكماش الخلية ."},{"t":"اختلاف التركيز بين الخلية ومحيطها الخارجي الأقل منه","tags":["1/2022"],"a":"ينتج عنها اكتساب الخلية للماء وانتفاخ الخلية الحيوانية وتمزقها . ملاحظة : إذا ذكر الطالب بين الأقواس فقط ( انتفاخ الخلية وتمزقها ) فالإجابة صحيحة ."},{"t":"وضع خلية حيوانية حية في محلول عالٍ التركيز","tags":["1/2024 نظام المحاولات"],"a":"خروج الماء من داخل الخلية مما يسبب انكماش الخلية . أو : ينتج انكماش ( بلزمة ) وذلك نتيجة لخروج الماء من الخلية ."}]},{"type":"علّل","tags":["2/2016 أسئلة خارج القطر"],"q":"إن حجم الخلية النباتية لا يتغير كثيراً بالمقارنة مع الخلية الحيوانية عند وضعها في محلول عالٍ التركيز .","a":{"p":"بسبب وجود الجدار الخلوي في الخلايا النباتية الذي تفتقر إليه الخلايا الحيوانية ( وإن ما يحدث هو ابتعاد الغشاء الخلوي من جدار الخلية ) ."}},{"type":"علّل","tags":["2015 تمهيدي","1/2018","2025 تمهيدي"],"q":"تنكمش الخلية الحيوانية عند وضعها في محلول عالي التركيز ( أعلى تركيزاً منها ) .","a":{"p":"لأن حركة الماء تكون من السايتوبلازم إلى المحلول الخارجي مما يترتب عليه انكماش الخلية . أو : بسبب خروج الماء من داخل الخلية إلى المحلول عالي التركيز فيسبب انكماش الخلية ."}},{"type":"علّل","tags":["2/2020","2023 تمهيدي"],"q":"تعاني الخلية من البلزمة عند وضعها في محلول عالي التركيز .","a":{"p":"وذلك بسبب حركة الماء من السايتوبلازم إلى المحلول الخارجي فيسبب ابتعاد الغشاء الخلوي عن جدار الخلية ( انكماش الخلية ) . أو : بسبب ابتعاد الغشاء البلازمي عن الجدار الخلوي نتيجة لخروج الماء من الخلية ."}},{"type":"علّل","tags":["1/1993"],"q":"حفظ المواد الغذائية في محاليل ملحية أو سكرية مركزة .","a":{"p":"لحماية الأغذية من تأثير الأحياء المحللة والتي تسبب فساد الأطعمة إذ تحصل ظاهرة الانكماش في الأحياء المحللة لوجودها في محلول عالي التركيز مما يؤدي إلى موتها بسبب فقدانها لمائها ."}},{"type":"علّل","tags":["2021 تمهيدي"],"q":"تعاني الخلية من الانتفاخ عند وضعها في محلول واطئ التركيز .","a":{"p":"بما أن هذا المحلول يتميز بتركيز منخفض من المواد الذائبة مقارنةً بالمواد الذائبة في سايتوبلازم الخلية الموجودة فيه فإن الخلية سوف تكتسب الماء وقد يؤدي دخول الماء إلى انتفاخ الخلية ."}},{"type":"ارسم","tags":["1/2016 أسئلة خارج القطر"],"q":"ارسم مع التأشير التناضح في الخلية الحيوانية .","a":{"p":"ثلاث خلايا حيوانية : أ- في محلول متعادل التركيز ، ب- في محلول واطئ التركيز ( انتفاخ وتمزق ) ، ج- في محلول عالي التركيز ( انكماش ) ، مع تأشير غشاء الخلية . ( شاهد الرسم بالمحاكاة )"}},{"type":"ارسم","tags":["1/2025"],"q":"ارسم مع التأشير خلية نباتية في محلول متبادل ( متعادل ) .","a":{"p":"الأجزاء المؤشرة : جدار الخلية ، غشاء الخلية ، نواة ، فجوة مركزية ، بلاستيدات . ( شاهد الرسم بالمحاكاة )"}}]};</script>
<script>
/* MoeLab — محرك الأسئلة الوزارية
   يُحقن تلقائياً داخل كل محاكاة لها أسئلة (لا تعدّل النسخ المحقونة يدوياً — عدّل هذا الملف ثم شغّل build.py).
   مبدأ الأمان: أي خطأ هنا يُخفي زر الوزاريات فقط ولا يؤثر على المحاكاة. */
(function(){try{
var D=window.MOE_MIN_DATA;if(!D||!D.qs||!D.qs.length)return;
var stage=document.getElementById('stage')||document.body;
/* محاكيات بقالب آخر (أزرار التكبير داخل .side خارج #stage): نضع العناصر فوق الصفحة كلها */
var ZB=document.querySelector('.zb')||(function(){var z=document.getElementById('zin');return z&&z.parentElement;})();
if(!document.querySelector('.zb')&&ZB&&!stage.contains(ZB)){stage=document.body;document.documentElement.classList.add('moe-fixed');}
var AR=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];});};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var tagK=function(s){return /الفصل|الكتاب|التلفزيون/.test(s)?'book':/خارج|الموصل|المتميزين|النازحين|المحاولات/.test(s)?'out':/تمهيدي|تكميلي/.test(s)?'pre':'min';};
var tagH=function(s){var k=tagK(s);return '<span class="tg '+k+'">'+esc(k==='book'?s:'وزاري '+s)+'</span>';};
var minCount=function(q){var t=(q.tags||[]).slice();(q.items||[]).forEach(function(i){t=t.concat(i.tags||[]);});return t.filter(function(s){return tagK(s)!=='book';}).length;};
var $=function(id){return document.getElementById(id);};

/* ---------- DOM ---------- */
var wrap=document.createElement('div');
wrap.innerHTML='<button id="qbtn" type="button" aria-label="الأسئلة الوزارية">📝 الوزاريات <b id="qcnt"></b></button>'+
 '<div id="hlbar"><span id="hlname"></span><button id="hlback" type="button">↩ رجوع للسؤال</button></div>'+
 '<div id="qp" role="dialog" aria-label="الأسئلة الوزارية">'+
  '<div id="qhd"><div class="t">📝 الأسئلة الوزارية</div><button id="qx" type="button" aria-label="إغلاق">✕</button></div>'+
  '<div id="qchips"></div><div id="qbody"></div>'+
  '<div id="qft"><button id="qprev" type="button">السابق ▶</button><button id="qa" type="button">إظهار الحل 💡</button><button id="qnext" type="button">التالي ◀</button></div>'+
 '</div>';
while(wrap.firstChild)stage.appendChild(wrap.firstChild);
/* place the button just to the right of the sim's zoom buttons (or under them if they are in a row) */
function placeBtn(){try{var b=$('qbtn'),zb=ZB,st=stage===document.body?{left:0,top:0,width:innerWidth,height:innerHeight}:stage.getBoundingClientRect();
  if(!zb){b.style.left='10px';b.style.top='10px';return;}
  var r=zb.getBoundingClientRect(),row=getComputedStyle(zb).flexDirection==='row';
  if(!r.width||!r.height){b.style.left='10px';b.style.top='10px';return;}
  var below=function(){b.style.left=Math.round(r.left-st.left)+'px';b.style.top=Math.round(r.bottom-st.top+8)+'px';};
  if(row||placeBtn.down){below();return;}
  b.style.left=Math.round(r.right-st.left+10)+'px';b.style.top=Math.round(r.top-st.top)+'px';
  /* if the sim shows its own caption/banner in that spot, move under the zoom buttons (and stay there) */
  var q=b.getBoundingClientRect(),hit=false;
  [].forEach.call(stage.querySelectorAll('*'),function(e){if(hit||e===b||(zb&&zb.contains(e))||e.closest('.zb,#qp,#hlbar,#qbtn'))return;
    if(e.parentElement!==stage&&!e.id)return;
    var cs=getComputedStyle(e);if(cs.position==='static'||cs.display==='none'||cs.visibility==='hidden'||!(e.textContent||'').trim())return;
    var x=e.getBoundingClientRect();if(!x.width||x.width>st.width*.9||x.height>120)return;
    if(x.left<q.right&&x.right>q.left&&x.top<q.bottom&&x.bottom>q.top)hit=true;});
  if(hit){placeBtn.down=true;below();}}catch(_){}}
placeBtn();setInterval(placeBtn,700);window.addEventListener('resize',placeBtn);document.addEventListener('fullscreenchange',function(){setTimeout(placeBtn,50);});

var qp=$('qp'),qbody=$('qbody'),qchips=$('qchips'),qa=$('qa'),qprev=$('qprev'),qnext=$('qnext');
var QS=D.qs,SEC=D.sections||{},NAMES=D.names||{};
$('qcnt').textContent=AR(QS.length);
var secKeys=Object.keys(SEC).filter(function(k){return QS.some(function(q){return q.sec===k;});});
if(secKeys.length<2)qchips.style.display='none';
var qsec='all',qi=0,qrev=false,qOpen=false;
var list=function(){return qsec==='all'?QS:QS.filter(function(q){return q.sec===qsec;});};
qchips.innerHTML=[['all','الكل']].concat(secKeys.map(function(k){return [k,SEC[k]];})).map(function(a){return '<button type="button" data-k="'+a[0]+'">'+esc(a[1])+'</button>';}).join('');
qchips.onclick=function(e){var b=e.target.closest('button');if(!b)return;qsec=b.dataset.k;qi=0;qrev=false;render();};

function ansH(a){var h='';if(!a)return h;if(a.p&&!a.tb)h+='<div>'+esc(a.p)+'</div>';
  if(a.ol)h+='<ol>'+a.ol.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(a.tb)h+='<div class="tbw"><table><tr>'+a.tb.h.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>'+a.tb.r.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
  if(a.dl)h+='<dl>'+a.dl.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl>';if(a.p&&a.tb)h+='<div class="note">'+esc(a.p)+'</div>';return h;}
var SIM=null;function sim(){return SIM||(SIM=window.MOE_SIM||null);}
function canSee(k){var s=sim();return !!(k&&s&&s.groups&&s.groups[k]);}
function render(){try{render0();}catch(err){qOpen=false;qp.classList.remove('on');$('qbtn').style.display='none';if(window.console)console.warn('MoeLab ministerial:',err);}}
function render0(){
  var L=list(),q=L[qi];
  [].forEach.call(qchips.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===qsec);});
  var n=minCount(q);
  var h='<div class="qc'+(qrev?' rev':'')+'"><div class="qtop"><span class="qty">'+esc(q.type)+'</span>'+
    (n>=3?'<span class="qfire">🔥 تكرر وزارياً '+AR(n)+' مرات</span>':'')+'<span class="qnum">'+AR(qi+1)+' / '+AR(L.length)+'</span></div>';
  if(q.tags&&q.tags.length)h+='<div class="tags">'+q.tags.map(tagH).join('')+'</div>';
  h+='<div class="qq">'+esc(q.q).replace(/\{([^}]*)\}/g,'<span class="blank">$1</span>')+'</div>';
  if(q.opts)h+='<div class="opts">'+q.opts.map(function(o,k){return '<button type="button" class="opt'+(qrev&&k===q.ans?' ok':'')+'" data-k="'+k+'">'+'أبجد'[k]+' ) '+esc(o)+'</button>';}).join('')+'</div>';
  if(q.items)h+='<ol class="items">'+q.items.map(function(it){var t=it.tags||[];return '<li>'+esc(it.t)+(t.length?'<div class="tags">'+t.map(tagH).join('')+'</div>':'')+'<div class="ia">'+esc(it.a||q.common||'')+'</div></li>';}).join('')+'</ol>';
  if(q.a)h+='<div class="ans"><div class="h">✔ الجواب</div>'+ansH(q.a)+'</div>';
  if(canSee(q.hl))h+='<div class="see"><button type="button" id="qsee">📍 شوف '+esc(NAMES[q.hl]||'')+' بالمحاكاة</button></div>';
  qbody.innerHTML=h+'</div>';qbody.scrollTop=0;
  qa.textContent=qrev?'إخفاء الحل':'إظهار الحل 💡';qa.classList.toggle('hide',qrev);
  qprev.disabled=qi===0;qnext.disabled=qi>=L.length-1;
  [].forEach.call(qbody.querySelectorAll('.opt'),function(b){b.onclick=function(){if(+b.dataset.k===q.ans){qrev=true;render();}else b.classList.add('no');};});
  var s=$('qsee');if(s)s.onclick=function(){hlStart(q.hl);};
}
qa.onclick=function(){qrev=!qrev;render();};
qprev.onclick=function(){if(qi>0){qi--;qrev=false;render();}};
qnext.onclick=function(){if(qi<list().length-1){qi++;qrev=false;render();}};
function show(on){qOpen=on;qp.classList.toggle('on',on);if(on)render();}
$('qbtn').onclick=function(){hlStop();show(true);};
$('qx').onclick=function(){show(false);};

/* ---------- highlight inside the simulation (only if the sim registered window.MOE_SIM) ---------- */
var HL=null;
function els(keys,map){var a=[];keys.forEach(function(k){(map[k]||[]).forEach(function(e){a.push(e);});});return a;}
function bbox(arr){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;arr.forEach(function(e){try{var b=e.getBBox();if(!b.width&&!b.height)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}catch(_){}});return x0<x1?{x0:x0,y0:y0,x1:x1,y1:y1}:null;}
var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function hlStart(k){
  var s=sim();if(!canSee(k))return;show(false);
  try{s.finish();}catch(_){}
  var parts=s.groups[k],on=els(parts,s.parts),labs=els(parts,s.labels||{});
  var all=els(Object.keys(s.parts),s.parts),allL=els(Object.keys(s.labels||{}),s.labels||{});
  var v=s.view.get(),vb=s.view.box,b=bbox(on.concat(labs)),to=v;
  if(b){var pad=30,cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,ks=Math.max(1,Math.min(2.6,vb[2]/(b.x1-b.x0+2*pad),vb[3]/(b.y1-b.y0+2*pad)));
    to=[ks,vb[0]+vb[2]/2-cx*ks,vb[1]+vb[3]/2-cy*ks];}
  HL={k:k,s:s,on:new Set(on),labs:new Set(labs),all:all,allL:allL,glows:els(parts,s.glows||{}),t0:performance.now(),from:v,to:to};
  $('hlname').textContent='📍 '+(NAMES[k]||'');
  $('hlbar').classList.add('on');document.body.classList.add('hlmode');
  requestAnimationFrame(tick);
}
function hlStop(){if(!HL)return;var s=HL.s;HL=null;$('hlbar').classList.remove('on');document.body.classList.remove('hlmode');try{s.view.reset();}catch(_){}}
function tick(ms){
  if(!HL)return;
  try{
    var u=(ms-HL.t0)/1000,z=ease(Math.max(0,Math.min(1,u/.8))),L=function(a,b){return a+(b-a)*z;};
    HL.s.view.set(L(HL.from[0],HL.to[0]),L(HL.from[1],HL.to[1]),L(HL.from[2],HL.to[2]));
    var p=.5+.5*Math.sin(u*4.2);
    HL.all.forEach(function(e){if(!HL.on.has(e))e.setAttribute('opacity','0.18');});
    HL.allL.forEach(function(e){e.setAttribute('opacity',HL.labs.has(e)?'1':'0.15');});
    HL.glows.forEach(function(g){g.style.display='';g.setAttribute('opacity',(.35+.45*p).toFixed(2));});
    if(HL.s.pulse)HL.s.pulse(HL.k,p);
  }catch(e){hlStop();return;}
  requestAnimationFrame(tick);
}
$('hlback').onclick=function(){hlStop();show(true);};
/* any simulation button stops the highlight */
['go','prev','zreset'].forEach(function(id){var b=$(id);if(b)b.addEventListener('click',hlStop,true);});

/* keyboard: while the panel is open the arrows move between questions, not the simulation */
window.addEventListener('keydown',function(e){
  if(qOpen){e.stopImmediatePropagation();e.preventDefault();
    if(e.key==='ArrowLeft')qnext.click();else if(e.key==='ArrowRight')qprev.click();else if(e.key==='Escape')show(false);}
  else if(HL&&e.key==='Escape'){hlStop();}
},true);
}catch(err){try{var b=document.getElementById('qbtn');if(b)b.style.display='none';var p=document.getElementById('qp');if(p)p.style.display='none';}catch(_){} if(window.console)console.warn('MoeLab ministerial:',err);}})();

</script>
