<style>
/* Layout: one full-screen navy lab bench; every control is a physical part of the apparatus or a clear button */
:root{
  color-scheme:dark;
  --deep:#081429; --navy:#10264a; --glow:#1d3d6e; --ink:#eaf0fa; --muted:#a3b3cc; --line:rgba(234,240,250,.14);
  --accent:#7fd3ff; --warn:#ffc04d;
  --f-display:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink)}
body{font-family:var(--f-body)}
.stage{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.fs{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.fs:hover{border-color:var(--accent)}
.fs:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fs svg{width:20px;height:20px}
.toast{position:absolute;top:max(62px,calc(env(safe-area-inset-top,0px) + 56px));right:max(10px,env(safe-area-inset-right,0px));max-width:min(280px,calc(100% - 20px));background:rgba(8,20,41,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink)}
.tipbtn{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:calc(max(10px,env(safe-area-inset-right,0px)) + 50px);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:#ffd27a;display:grid;place-items:center;cursor:pointer;padding:0}
.tipbtn:hover,.tipbtn.on{border-color:#ffd27a;background:rgba(255,210,122,.14)}
.tipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tipbtn svg{width:22px;height:22px}
.tip{box-sizing:border-box;position:absolute;top:max(60px,calc(env(safe-area-inset-top,0px) + 58px));right:max(10px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 20px));max-height:calc(100% - 80px);overflow:auto;background:rgba(8,20,41,.95);border:1px solid rgba(255,210,122,.35);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.8;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.tip h2{margin:0 0 8px;font-family:var(--f-display);font-size:16px;font-weight:600;color:#ffd27a;padding-left:28px;text-wrap:balance}
.tip p{margin:0 0 8px}
.tip .m,.tip b.m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.tip p.m{text-align:center;color:var(--accent);font-weight:600}
.tip .note{color:var(--muted);font-size:13px}
.tip .nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;direction:ltr;justify-content:flex-end}
.tip .nums span{font-family:var(--f-mono);font-size:12.5px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px}
.tip .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.tip .x:hover{color:var(--ink)}
.parts{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;direction:rtl}
.parts button{height:42px;padding:0 12px 0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,41,.6);color:var(--muted);font:600 13px var(--f-body);cursor:pointer;display:flex;align-items:center;gap:7px}
.parts button i{width:9px;height:9px;border-radius:50%;border:1.6px solid currentColor;box-sizing:border-box;flex:none}
.parts button[aria-pressed="true"]{color:var(--ink);border-color:rgba(127,211,255,.6);background:rgba(127,211,255,.14)}
.parts button[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.parts button[aria-pressed="false"] span{text-decoration:line-through;text-decoration-thickness:1px}
.parts button:hover{border-color:var(--accent)}
.parts button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.parts .s{display:none}
@media (max-width:640px){.parts .l{display:none}.parts .s{display:inline}.parts button{padding:0 9px 0 10px;font-size:12.5px}}
@media (max-width:420px){.parts{gap:4px}.parts button{padding:0 7px 0 8px;font-size:12px;gap:5px}.parts button i{width:7px;height:7px}}
</style>

<body style="margin:0">

<div class="stage" dir="rtl">
  <canvas id="scene" aria-label="محاكاة إشعاع الجسم الأسود: فجوة بفتحة ضيقة تُسخّن، ومنحنيات توزيع الطاقة مع الطول الموجي ودرجة الحرارة وفق قانون بلانك"></canvas>
  <button class="tipbtn" id="tipBtn" aria-label="توضيح" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
  <div class="tip" id="tipPanel" hidden role="dialog" aria-labelledby="tipTitle"><button class="x" id="tipClose" aria-label="إغلاق">×</button><h2 id="tipTitle"></h2><div id="tipBody"></div></div>
  <div class="parts" id="parts" role="group" aria-label="أجزاء المحاكاة">
    <button data-p="cav" aria-pressed="true"><i></i><span class="l">الجسم الأسود</span><span class="s">الفجوة</span></button>
    <button data-p="graph" aria-pressed="true"><i></i><span class="l">منحنيات الإشعاع</span><span class="s">المنحنيات</span></button>
    <button data-p="ctrl" aria-pressed="true"><i></i><span class="l">لوحة التحكم</span><span class="s">التحكم</span></button>
  </div>
  <button class="fs" id="fsBtn" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIco" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<script>
(function(){
const cv=document.getElementById('scene');let ctx=cv.getContext('2d');
/* state: T = temperature of the cavity walls (K); Tv = displayed value easing towards T */
const S={T:5000,Tv:5000,cmp:true,rj:false};
const VIS={cav:true,graph:true,ctrl:true};let PL={};
const touched={peak:false,therm:false};
let W=0,H=0,DPR=1,narrow=null,L=null,view={z:1,x:0,y:0},time=0,drag=null,hover=null;
const col={};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const F=(w,s,mono)=>w+' '+(s*(L?L.fs:1)).toFixed(1)+'px '+(mono?'ui-monospace, Menlo, Consolas, monospace':'system-ui, "Segoe UI", Tahoma, sans-serif');
function readColors(){const cs=getComputedStyle(document.documentElement);['deep','navy','glow','ink','muted','accent'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());}
const TMIN=1000,TMAX=10000,XMAX=2000;

/* ---------- physics: Planck's law, Wien, Stefan–Boltzmann ---------- */
const hP=6.62607015e-34,cL=2.99792458e8,kB=1.380649e-23,WIEN=2.897771955e-3,SIG=5.670374e-8;
/* spectral exitance M(λ,T) = 2πhc²/λ⁵ · 1/(e^{hc/λkT} − 1)   →  returned in kW/(m²·nm) */
function M(lnm,T){const l=lnm*1e-9,x=hP*cL/(l*kB*T);if(x>700)return 0;return 2*Math.PI*hP*cL*cL/Math.pow(l,5)/Math.expm1(x)*1e-12;}
/* classical Rayleigh–Jeans law M = 2πckT/λ⁴ (same units) */
function MRJ(lnm,T){const l=lnm*1e-9;return 2*Math.PI*cL*kB*T/Math.pow(l,4)*1e-12;}
const lamPeak=T=>WIEN/T*1e9;
const Mpeak=T=>M(lamPeak(T),T);
function visFrac(T){let s=0;for(let l=400;l<=700;l+=5)s+=M(l,T)*5;return s*1e3/(SIG*T*T*T*T);}
/* colour the eye sees: CIE 1931 matching functions (Wyman–Sloan–Shirley fit) → sRGB */
const gs=(l,m,s1,s2)=>{const s=l<m?s1:s2;return Math.exp(-0.5*((l-m)/s)**2);};
const xb=l=>1.056*gs(l,599.8,37.9,31.0)+0.362*gs(l,442.0,16.0,26.7)-0.065*gs(l,501.1,20.4,26.2);
const yb=l=>0.821*gs(l,568.8,46.9,40.5)+0.286*gs(l,530.9,16.3,31.1);
const zb=l=>1.217*gs(l,437.0,11.8,36.0)+0.681*gs(l,459.0,26.0,13.8);
const gam=v=>v<=0.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-0.055;
const BBC=[];let Y6=1;
(function(){const xyz=T=>{let X=0,Y=0,Z=0;for(let l=380;l<=780;l+=5){const m=M(l,T);X+=m*xb(l);Y+=m*yb(l);Z+=m*zb(l);}return[X,Y,Z];};Y6=xyz(6000)[1];
  for(let T=TMIN;T<=TMAX;T+=100){const[X,Y,Z]=xyz(T);let r=3.2406*X-1.5372*Y-0.4986*Z,g=-0.9689*X+1.8758*Y+0.0415*Z,b=0.0557*X-0.2040*Y+1.0570*Z;const m=Math.max(r,g,b);
    BBC.push({c:[r,g,b].map(v=>255*gam(Math.max(0,v/m))),v:Math.pow(clamp((Math.log10(Y/Y6)+11)/11,0,1),1.3),Y:Y/Y6});}})();
function bb(T){const f=clamp((T-TMIN)/100,0,BBC.length-1),i=Math.floor(f),j=Math.min(BBC.length-1,i+1),t=f-i,a=BBC[i],b=BBC[j];return{c:a.c.map((v,k)=>v+(b.c[k]-v)*t),v:a.v+(b.v-a.v)*t,Y:a.Y+(b.Y-a.Y)*t};}
function lamArr(l){let r=0,g=0,b=0;if(l<380){return[150,90,255];}if(l<440){r=-(l-440)/60;b=1;}else if(l<490){g=(l-440)/50;b=1;}else if(l<510){g=1;b=-(l-510)/20;}else if(l<580){r=(l-510)/70;g=1;}else if(l<645){r=1;g=-(l-645)/65;}else if(l<=780)r=1;else return[150,40,40];
  let f=1;if(l<420)f=0.4+0.6*(l-380)/40;else if(l>700)f=0.4+0.6*(780-l)/80;return[255*Math.pow(r*f,0.8),255*Math.pow(g*f,0.8),255*Math.pow(b*f,0.8)];}

/* ---------- layout & panels: the two figures fill the screen (halves), controls beside or below ---------- */
function buildLayout(){L={fs:narrow?1.04:1,cav:{w:100,h:100},graph:{w:100,h:100},ctrl:{w:300,h:200}};}
function fitView(){view={z:1,x:0,y:0};}
function arrange(){PL={};if(!L)return;const m=10,top=H<500?56:62,aw=W-2*m,ah=H-top-m,gd=12;let x=m,y=top,w=aw,h=ah;const vis=['cav','graph'].filter(n=>VIS[n]);
  if(VIS.ctrl){if(!narrow){const cw=Math.min(310,Math.max(236,aw*0.26));if(vis.length){PL.ctrl={x:W-m-cw,y:top,w:cw,h:ah};w=aw-cw-gd;}else PL.ctrl={x:(W-cw)/2,y:top,w:cw,h:ah};}
    else{const ch=vis.length?Math.min(200*L.fs,ah*0.4):Math.min(ah,260);PL.ctrl={x:m,y:H-m-ch,w:aw,h:ch};h=ah-ch-gd;}}
  if(vis.length===1)PL[vis[0]]={x,y,w,h};
  else if(vis.length===2){if(w/h>1.25){const hw=(w-gd)/2;PL.cav={x:x+hw+gd,y,w:hw,h};PL.graph={x,y,w:hw,h};}else{const hh=(h-gd)/2;PL.cav={x,y,w,h:hh};PL.graph={x,y:y+hh+gd,w,h:hh};}}
  for(const n in PL){PL[n].k=1;L[n].w=PL[n].w;L[n].h=PL[n].h;}}
function layout(){const nw=cv.clientWidth,nh=cv.clientHeight;if(!nw||!nh)return;W=nw;H=nh;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);const nn=W<H*0.95;if(nn!==narrow||!L){narrow=nn;buildLayout();}fitView();arrange();}
const toWorld=s=>({x:(s.x-view.x)/view.z,y:(s.y-view.y)/view.z});
function panelAt(w){for(const n in PL){const P=PL[n];if(w.x>=P.x-6&&w.x<=P.x+P.w+6&&w.y>=P.y-6&&w.y<=P.y+P.h+6)return n;}return null;}
function toLocal(s,n){const P=PL[n],w=toWorld(s);return{x:(w.x-P.x)/P.k,y:(w.y-P.y)/P.k};}
function setPanel(n){const P=PL[n],z=view.z*P.k;ctx.setTransform(DPR*z,0,0,DPR*z,DPR*(view.z*P.x+view.x),DPR*(view.z*P.y+view.y));}

/* ---------- helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,o={}){ctx.font=o.font||F(600,13);ctx.fillStyle=o.color||col.ink;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.direction=o.dir||'rtl';ctx.fillText(s,x,y);ctx.direction='ltr';}
function arrowHead(x,y,ang,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.8,size*0.62);ctx.lineTo(-size*0.8,-size*0.62);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();}
function pulseRing(x,y,r,color,ph){const pu=0.5+0.5*Math.sin(time*5+(ph||0));ctx.beginPath();ctx.arc(x,y,r+pu*5,0,7);ctx.strokeStyle=color;ctx.globalAlpha=0.35+0.4*pu;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
function chip(s,x,y,c,align,o={}){const f=F(600,o.s||12);ctx.font=f;const w=ctx.measureText(s).width+18,h=(o.s?o.s+12:24)*L.fs,x0=align==='left'?x:align==='right'?x-w:x-w/2;rr(x0,y-h/2,w,h,h/2);ctx.fillStyle='rgba(6,13,28,.74)';ctx.fill();if(c){ctx.strokeStyle=c;ctx.lineWidth=1;ctx.stroke();}txt(s,x0+w/2,y+0.5,{font:f,color:c||col.ink,dir:o.dir});return w;}
let LB=[],LBW=0,LBH=0;
function label(s,x,y,c,o={}){const f=F(o.w||600,o.s||12.5);ctx.font=f;const tw=ctx.measureText(s).width+16,th=(o.s||12.5)+10;
  if(o.alt){const cands=[[x,y],...o.alt].map(([a,b])=>[clamp(a,tw/2+6,LBW-tw/2-6),clamp(b,th/2+6,LBH-th/2-6)]);let best=cands[0],bo=1e9;
    for(const [a,b] of cands){let ov=0;for(const r of LB){const ix=Math.max(0,Math.min(a+tw/2,r[0]+r[2])-Math.max(a-tw/2,r[0])),iy=Math.max(0,Math.min(b+th/2,r[1]+r[3])-Math.max(b-th/2,r[1]));ov+=ix*iy;}if(ov<bo-0.5){bo=ov;best=[a,b];}if(ov===0)break;}[x,y]=best;}
  LB.push([x-tw/2-3,y-th/2-3,tw+6,th+6]);ctx.fillStyle='rgba(6,14,32,.66)';rr(x-tw/2,y-th/2,tw,th,th/2);ctx.fill();txt(s,x,y,{font:f,color:c||'#f2f5fa',dir:o.dir});}
function drawBg(){ctx.setTransform(DPR,0,0,DPR,0,0);const g=ctx.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,Math.max(W,H)*0.75);g.addColorStop(0,col.glow);g.addColorStop(0.55,col.navy);g.addColorStop(1,col.deep);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function panelBox(w,h){rr(0,0,w,h,18);const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(14,24,44,.94)');g.addColorStop(1,'rgba(8,14,28,.94)');ctx.fillStyle=g;ctx.fill();}
function panelEdge(w,h){rr(0,0,w,h,18);ctx.strokeStyle='rgba(234,240,250,.16)';ctx.lineWidth=1;ctx.stroke();}
const fmtT=T=>Math.round(T).toLocaleString('en-US');
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}

/* ---------- panel 1: the cavity (a blackbody) ---------- */
function cg(){const P=L.cav,w=P.w,h=P.h,tx=Math.max(34,w*0.09),cx=tx+(w-tx)*0.46,cy=h*0.55,Ro=Math.min((w-tx)*0.3,h*0.31),Ri=Ro*0.78,ha=0.38,hg=0.085;
  return{w,h,cx,cy,Ro,Ri,ha,hg,tx,ty0:Math.max(58,h*0.2),ty1:h-Math.max(34,h*0.12)};}
/* photons leaving the hole: wavelength drawn from Planck's spectrum; their number grows quickly with T (energy ∝ T⁴) */
let PH=[],emitAcc=0,cdfT=0,CDF=[];
function buildCDF(T){CDF=[];let s=0;for(let l=150;l<=4000;l+=25){s+=M(l,T);CDF.push([l,s]);}CDF.forEach(p=>p[1]/=s);cdfT=T;}
function sampleLam(){const u=Math.random();for(const[l,c]of CDF)if(c>=u)return l+Math.random()*25-12.5;return 4000;}
function stepPhotons(dt){const g=cg(),T=S.Tv;if(Math.abs(T-cdfT)>40)buildCDF(T);const rate=4+26*Math.pow(T/TMAX,4)/0.42;emitAcc+=dt*Math.min(rate,30);
  while(emitAcc>1){emitAcc-=1;const a=g.ha+(Math.random()*2-1)*0.32,l=sampleLam();PH.push({x:g.cx+Math.cos(g.ha)*g.Ro,y:g.cy+Math.sin(g.ha)*g.Ro,a,l,ph:Math.random()*6});}
  const sp=Math.max(110,Math.min(g.w,g.h)*0.45);PH.forEach(p=>{p.x+=Math.cos(p.a)*sp*dt;p.y+=Math.sin(p.a)*sp*dt;});PH=PH.filter(p=>p.x<g.w+60&&p.y<g.h+60&&p.y>-60);if(PH.length>90)PH.splice(0,PH.length-90);}
function photon(p,scale){const wl=clamp(p.l/42,7,60)*scale,len=Math.max(26,wl*1.6)*scale,ux=Math.cos(p.a),uy=Math.sin(p.a),nx=-uy,ny=ux,c=lamArr(p.l),ir=p.l>780,uv=p.l<380;
  ctx.strokeStyle=rgba(c,ir?0.6:uv?0.85:1);ctx.lineWidth=ir?1.8:2.4;ctx.setLineDash(ir?[4,3]:[]);ctx.beginPath();for(let s=0;s<=len;s+=1.5){const env=Math.sin(Math.PI*s/len),o=5.5*scale*env*Math.sin(2*Math.PI*s/wl+p.ph);const x=p.x-ux*s+nx*o,y=p.y-uy*s+ny*o;s?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();ctx.setLineDash([]);}
/* a ray shone at the hole: it bounces inside and is absorbed (book figure 1) */
let RAY=null;
function shootRay(){const g=cg(),pts=[];const hx=g.cx+Math.cos(g.ha)*g.Ro,hy=g.cy+Math.sin(g.ha)*g.Ro,ia=g.ha;pts.push({x:hx+Math.cos(ia)*g.Ro*1.1,y:hy+Math.sin(ia)*g.Ro*1.1,I:1});
  let x=g.cx+Math.cos(g.ha)*g.Ri,y=g.cy+Math.sin(g.ha)*g.Ri;pts.push({x,y,I:1});let d=Math.PI+ia+0.35;let I=1;
  for(let k=0;k<7;k++){const dx=Math.cos(d),dy=Math.sin(d),qx=x-g.cx,qy=y-g.cy,b=qx*dx+qy*dy,c=qx*qx+qy*qy-g.Ri*g.Ri,t=-b+Math.sqrt(Math.max(0,b*b-c));x+=dx*t;y+=dy*t;I*=0.42;pts.push({x,y,I});
    const n=Math.atan2(g.cy-y,g.cx-x);d=n+(rnd(k*7+3)*2-1)*1.0;}
  RAY={pts,t:0};}
function drawCav(){const g=cg(),w=g.w,h=g.h,T=S.Tv,B=bb(T),gc=B.c,gv=B.v;panelBox(w,h);ctx.save();rr(0,0,w,h,18);ctx.clip();
  // warm light cast on the bench by the hot body

      const big=o.h>50;txt(`${fmtT(S.T)} K`,o.x+o.w/2,o.y+(big?24:o.h/2),{font:F(700,big?24:20,1),color:'#8dffc4',dir:'ltr'});if(big)txt(`${fmtT(S.T-273)} °C`,o.x+o.w/2,o.y+48,{font:F(500,12,1),color:'rgba(141,255,196,.65)',dir:'ltr'});
      if(big){const sw=Math.min(18,o.h*0.4);ctx.beginPath();ctx.arc(o.x+sw+6,o.y+o.h/2,sw/2+2,0,7);ctx.fillStyle=rgba(B.c,0.25+0.75*B.v);ctx.fill();}return;}
    if(o.t==='step'){rr(o.x,o.y,o.w,o.h,10);ctx.fillStyle=hv?'rgba(127,211,255,.22)':'rgba(255,255,255,.08)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.22)';ctx.stroke();txt(o.l,o.x+o.w/2,o.y+o.h/2,{font:F(700,o.l.length>2?13:22,1),dir:'ltr'});return;}
    if(o.t==='pre'){const on=Math.abs(S.T-o.T)<1,pc=bb(o.T).c;rr(o.x,o.y,o.w,o.h,o.h/2);ctx.fillStyle=on?rgba(pc,0.95):hv?'rgba(255,255,255,.14)':'rgba(255,255,255,.07)';ctx.fill();ctx.strokeStyle=rgba(pc,on?1:0.6);ctx.lineWidth=on?2:1.2;ctx.stroke();ctx.lineWidth=1;
      txt(`${o.T}`,o.x+o.w/2,o.y+o.h/2,{font:F(700,o.w<44?10.5:12,1),color:on?'#1a1208':col.ink,dir:'ltr'});return;}
    if(o.t==='tog'){const on=o.on();rr(o.x,o.y,o.w,o.h,10);ctx.fillStyle=on?'rgba(255,210,122,.22)':hv?'rgba(255,255,255,.12)':'rgba(255,255,255,.06)';ctx.fill();ctx.strokeStyle=on?'#ffd27a':'rgba(255,255,255,.2)';ctx.stroke();
      txt(o.l,o.x+o.w/2,o.y+o.h/2,{font:F(600,narrow?11.5:12.5),color:on?'#ffe2a8':col.ink});return;}
    if(o.t==='mini'){if(!narrow){let yy=o.y+10;[[`λm = ${Math.round(lp)} nm`,'#fff'],[`σT⁴ = ${P<10?P.toFixed(1):Math.round(P)} MW/m²`,col.ink],[`في المرئي ⁦${Math.round(vf*100)}%⁩`,col.muted]].forEach(([t,cc])=>{if(yy<o.y+o.h-4)txt(t,o.x+o.w/2,yy,{font:F(600,12,!t.startsWith('في')),color:cc,dir:t.startsWith('في')?'rtl':'ltr'});yy+=20;});return;}txt(`في المرئي ⁦${Math.round(vf*100)}%⁩   ·   ⁦σT⁴ = ${P<10?P.toFixed(1):Math.round(P)} MW/m²⁩   ·   ⁦λm = ${Math.round(lp)} nm⁩`,o.x+o.w/2,o.y+o.h/2,{font:F(600,11.5),color:col.muted});return;}
    if(o.t==='read'){let yy=o.y+8;const row=(a,b,cc)=>{if(yy>o.y+o.h-6)return;txt(a,o.x+o.w,yy,{align:'right',font:F(500,12),color:col.muted});txt(b,o.x,yy,{align:'left',font:F(700,12.5,1),color:cc||col.ink,dir:'ltr'});yy+=24;};
      ctx.strokeStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x+o.w,o.y);ctx.stroke();yy+=6;
      row('طول موجة الذروة λm',`${Math.round(lp)} nm`,'#ffffff');row('λm × T',`2.898×10⁻³ m·K`,'#ffd27a');row('القدرة الكلية σT⁴',`${P<10?P.toFixed(1):Math.round(P)} MW/m²`);row('نسبة الطاقة في المرئي',`${Math.round(vf*100)} %`);
      if(yy<o.y+o.h-18){txt('لون الجسم كما تراه العين',o.x+o.w,yy+4,{align:'right',font:F(500,12),color:col.muted});rr(o.x,yy-8,70,24,8);ctx.fillStyle=rgba(B.c.map(v=>v*(0.15+0.85*B.v)),1);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.3)';ctx.stroke();}}});}

function draw(){drawBg();const fn={cav:drawCav,graph:drawGraph,ctrl:drawCtrl};let any=false;
  for(const n of['cav','graph','ctrl'])if(PL[n]){setPanel(n);fn[n]();any=true;}
  if(!any){ctx.setTransform(DPR,0,0,DPR,0,0);const f=L.fs;L.fs=1;txt('كل الأجزاء مخفية: اختر جزءاً من الأزرار في الأعلى لإظهاره',W/2,H/2,{font:F(600,15),color:col.muted});L.fs=f;}}

/* ---------- input ---------- */
const ptrs=new Map();let pinch=null,lastTap=0;
function scr(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
const setT=t=>{S.T=clamp(Math.round(t/50)*50,TMIN,TMAX);};
function hit(p,n){if(n==='ctrl'){for(const o of ui())if(p.x>=o.x&&p.x<=o.x+o.w&&p.y>=o.y&&p.y<=o.y+o.h){if(o.t==='step')return{type:'step',d:o.d,key:o};if(o.t==='pre')return{type:'act',a:()=>S.T=o.T,key:o};if(o.t==='tog')return{type:'act',a:o.a,key:o};}return null;}
  if(n==='cav'){const g=cg();if(Math.abs(p.x-g.tx)<26&&p.y>g.ty0-24&&p.y<g.ty1+30)return{type:'therm',n,key:'therm'};return null;}
  if(n==='graph'){const g=gg(),lp=lamPeak(S.T);if(lp<=XMAX){const px=X(g,lp),py=Yv(g,Mpeak(S.T));if(Math.hypot(p.x-px,p.y-py)<34)return{type:'peak',n,key:'peak'};}if(p.x>g.x0&&p.x<g.x1&&p.y>g.y0&&p.y<g.y1)return{type:'peak',n,key:'peak'};}return null;}
function dragTo(p){if(drag.type==='therm'){const g=cg();setT(TMIN+(g.ty1-p.y)/(g.ty1-g.ty0)*(TMAX-TMIN));touched.therm=true;}
  else if(drag.type==='peak'){const g=gg(),lam=clamp(Xinv(g,p.x),WIEN/TMAX*1e9,XMAX);setT(WIEN/(lam*1e-9));touched.peak=true;}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const s=scr(e);ptrs.set(e.pointerId,s);
  if(ptrs.size===2){drag=null;const[a,b]=[...ptrs.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},z0:view.z,x0:view.x,y0:view.y};return;}
  if(ptrs.size>2)return;const pn=panelAt(toWorld(s)),p=pn?toLocal(s,pn):null,h=pn?hit(p,pn):null;
  if(!h){const now=performance.now();if(now-lastTap<320)fitView();lastTap=now;drag={type:'pan',s0:s,x0:view.x,y0:view.y};cv.style.cursor='grabbing';return;}
  if(h.type==='act'){h.a();return;}
  if(h.type==='step'){setT(S.T+h.d);drag={type:'step',d:h.d,t:0,n:0};return;}
  drag={type:h.type,n:pn};dragTo(p);cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{const s=scr(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,s);
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},z=clamp(pinch.z0*d/pinch.d0,0.6,5),wx=(pinch.m0.x-pinch.x0)/pinch.z0,wy=(pinch.m0.y-pinch.y0)/pinch.z0;view={z,x:mid.x-wx*z,y:mid.y-wy*z};return;}
  if(!drag){const pn=panelAt(toWorld(s)),h=pn?hit(toLocal(s,pn),pn):null;hover=h?h.key:null;cv.style.cursor=h?(h.type==='therm'?'ns-resize':h.type==='peak'?'ew-resize':'pointer'):'grab';return;}
  if(drag.type==='pan'){view.x=drag.x0+s.x-drag.s0.x;view.y=drag.y0+s.y-drag.s0.y;return;}
  if((drag.type==='therm'||drag.type==='peak')&&PL[drag.n])dragTo(toLocal(s,drag.n));});
function pointerEnd(e){ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;return;}drag=null;cv.style.cursor='grab';}
cv.addEventListener('pointerup',pointerEnd);cv.addEventListener('pointercancel',pointerEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();const s=scr(e),f=Math.exp(-e.deltaY*0.0015),z=clamp(view.z*f,0.6,5),wx=(s.x-view.x)/view.z,wy=(s.y-view.y)/view.z;view={z,x:s.x-wx*z,y:s.y-wy*z};},{passive:false});

/* ---------- teacher hint ---------- */
window.__explain=function(){const T=S.T,lp=lamPeak(T),P=SIG*Math.pow(T,4)/1e6,vf=visFrac(T),r5=Math.pow(T/5000,4);
  const nums=`<div class="nums" style="direction:rtl;justify-content:flex-start"><span dir="ltr">T = ${fmtT(T)} K</span><span dir="ltr">λm = ${Math.round(lp)} nm</span><span dir="ltr">σT⁴ = ${P<10?P.toFixed(1):Math.round(P)} MW/m²</span><span dir="rtl">في المرئي ⁦${Math.round(vf*100)}%⁩</span></div>`;
  const obs=`<p>من الشكل نلاحظ:</p><p>١) لكل درجة حرارة منحنٍ له قمة عند طول موجي <b class="m">λm</b>.</p><p>٢) بزيادة درجة الحرارة تزداد الشدة عند جميع الأطوال الموجية، وتزداد المساحة تحت المنحني (الطاقة الكلية) بسرعة كبيرة <b class="m">E ∝ T⁴</b>.</p><p>٣) بزيادة درجة الحرارة تنزاح القمة نحو الأطوال الموجية الأقصر:</p><p class="m">λm · T = 2.898 × 10⁻³ m·K</p>`;
  const tryit=`<p class="note">جرّب: اسحب المحرار أو نقطة القمة على المخطط، وقارن مع منحنيات الكتاب 4000 و5000 و6000 K. (عند ⁦${fmtT(T)} K⁩ تكون الطاقة الكلية ⁦${r5<10?r5.toFixed(2):Math.round(r5)}⁩ مرة قدرها عند 5000 K)</p>`;
  if(RAY)return{t:'لماذا نعدّ الفجوة جسماً أسود؟',b:`<p>الجسم الأسود نظام مثالي يمتص جميع الإشعاعات الساقطة عليه. الشعاع الذي يدخل من الفتحة الضيقة ينعكس مرات كثيرة على الجدران الداخلية، ويُمتص جزء منه في كل انعكاس، فلا يكاد يخرج منه شيء.</p><p>وعندما تُسخَّن الجدران تصبح الفتحة <b>مشعاً مثالياً</b>، وطبيعة الإشعاع المنبعث منها تعتمد فقط على درجة الحرارة المطلقة للجدران، لا على مادتها.</p>${nums}${tryit}`};
  if(S.rj)return{t:'لماذا فشلت النظرية الكلاسيكية؟',b:`<p>تتوقع النظرية الكلاسيكية (قانون رايلي – جينز) أن الشدة تتناسب مع <b class="m">T/λ⁴</b>، فتتفق مع التجربة عند الأطوال الموجية الطويلة فقط، أما عند الأطوال القصيرة (فوق البنفسجية) فتتوقع شدة تزداد بلا حدود، وهذا ما سُمّي <b>الكارثة فوق البنفسجية</b>.</p><p>حلّ بلانك المشكلة بفرضية أن طاقة المتذبذبات في جدران الجسم <b>مكمّاة</b> لا متصلة:</p><p class="m">E = n h f &nbsp;&nbsp; (n = 1, 2, 3, …)</p><p>حيث <b class="m">h = 6.63 × 10⁻³⁴ J·s</b> ثابت بلانك. بهذه الفرضية يتطابق المنحني المحسوب (الأحمر) مع النتائج العملية.</p>${nums}${tryit}`};
  if(T<3500)return{t:'جسم بدرجة حرارة منخفضة نسبياً',b:`<p>عند ⁦${fmtT(T)} K⁩ تقع القمة عند ⁦${Math.round(lp)} nm⁩ في منطقة الأشعة تحت الحمراء، لذلك فإن معظم الطاقة المنبعثة <b>غير مرئية</b> (نحو ⁦${Math.round(vf*100)}%⁩ فقط في المرئي)، ويتوهج الجسم باللون الأحمر أو البرتقالي.</p>${obs}${nums}${tryit}`};
  if(T>7500)return{t:'جسم بدرجة حرارة عالية جداً',b:`<p>عند ⁦${fmtT(T)} K⁩ تنزاح القمة إلى ⁦${Math.round(lp)} nm⁩ ${lp<400?'في منطقة الأشعة فوق البنفسجية':'عند الطرف البنفسجي من الطيف المرئي'}، فيبدو الجسم <b>أبيض مائلاً إلى الزرقة</b>.</p>${obs}${nums}${tryit}`};
  return{t:'توزيع طاقة إشعاع الجسم الأسود',b:`<p>عند ⁦${fmtT(T)} K⁩ تقع القمة عند ⁦${Math.round(lp)} nm⁩ ${lp<=700?'داخل الطيف المرئي':'قرب الطرف الأحمر'}، ويبدو الجسم ${T<5000?'أصفر مائلاً إلى البرتقالي':'أبيض تقريباً'}. (سطح الشمس نحو 5800 K وقمة إشعاعه قرب 500 nm.)</p>${obs}${nums}${tryit}`};
};

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;if(!W)layout();
  if(drag&&drag.type==='step'){drag.t+=dt;if(drag.t>0.45){drag.n+=dt;while(drag.n>0.07){drag.n-=0.07;setT(S.T+drag.d);}}}
  S.Tv+=(S.T-S.Tv)*Math.min(1,dt*9);if(Math.abs(S.T-S.Tv)<0.5)S.Tv=S.T;if(RAY)RAY.t+=dt;
  if(W){if(PL.cav)stepPhotons(dt);draw();}requestAnimationFrame(frame);}
function syncParts(){document.querySelectorAll('#parts button').forEach(b=>b.setAttribute('aria-pressed',VIS[b.dataset.p]));}
readColors();layout();buildCDF(S.T);setTimeout(()=>{if(PL.cav)shootRay();},900);
document.querySelectorAll('#parts button').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.p;VIS[n]=!VIS[n];b.setAttribute('aria-pressed',VIS[n]);if(!VIS[n]&&drag&&drag.n===n)drag=null;fitView();arrange();}));
new ResizeObserver(()=>layout()).observe(cv);
requestAnimationFrame(frame);
})();

(function(){const b=document.getElementById('fsBtn'),ico=document.getElementById('fsIco'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const t=document.createElement('div');t.className='toast';t.hidden=true;t.textContent='ملء الشاشة غير متاح هنا. افتح الملف أو الرابط بالمتصفح';document.querySelector('.stage').appendChild(t);
  let tm=0;const toast=()=>{t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>t.hidden=true,3200);};
  const sync=()=>{ico.setAttribute('d',isFs()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');b.setAttribute('aria-label',isFs()?'الخروج من ملء الشاشة':'ملء الشاشة');};
  b.addEventListener('click',()=>{
    if(isFs()){try{exit.call(document);}catch(e){}return;}
    if(!req||document.fullscreenEnabled===false){toast();return;}
    try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(toast);setTimeout(()=>{if(!isFs())toast();},700);}catch(e){toast();}});
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);})();

(function(){const b=document.getElementById('tipBtn'),p=document.getElementById('tipPanel'),t=document.getElementById('tipTitle'),body=document.getElementById('tipBody');
  let iv=0,last='';
  const fill=()=>{if(!window.__explain)return;const r=window.__explain(),h=r.t+'|'+r.b;if(h===last)return;last=h;t.textContent=r.t;body.innerHTML=r.b;};
  const open=v=>{p.hidden=!v;b.setAttribute('aria-expanded',v);b.classList.toggle('on',v);clearInterval(iv);if(v){last='';fill();iv=setInterval(fill,400);}};
  b.addEventListener('click',()=>open(p.hidden));
  document.getElementById('tipClose').addEventListener('click',()=>open(false));})();
</script>
