<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>تركيب الخصية في الإنسان</title>
<style>
  html{height:100%;box-sizing:border-box;color-scheme:light}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
  body{height:100%;position:relative;direction:rtl}
  #top{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;background:#1f3a52;padding:0 8px;box-sizing:border-box}
  #title{color:#fff;font-size:clamp(14px,3.4vw,24px);line-height:1.3;font-weight:bold;text-align:center;transition:opacity .3s}
  #stage{position:absolute;top:56px;bottom:0;left:0;right:0;background:#fff}
  #cv{position:absolute;top:0;left:0;right:0;bottom:84px}
  svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #ctrl{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:18px;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav{width:62px;height:62px;border-radius:50%;border:3px solid #1f3a52;background:#fff;color:#1f3a52;font-size:26px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .nav:active{background:#d9ebf7}
  .nav:focus-visible,.dot:focus-visible,.zb button:focus-visible{outline:3px solid #c4623a;outline-offset:2px}
  #dots{display:flex;gap:12px;align-items:center}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid #1f3a52;background:#fff;padding:0;cursor:pointer;transition:all .3s}
  .dot.on{background:#c4623a;border-color:#c4623a;transform:scale(1.45)}
  .zb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
  .zb button{width:42px;height:42px;border-radius:50%;border:2px solid #1f3a52;background:#fff;color:#1f3a52;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  body.fs #top{display:none}
  body.fs #stage{top:0}
  .bt{fill:#fff;font-weight:bold;font-size:23px;text-anchor:middle;dominant-baseline:central}
  .cl{fill:#1f3a52;font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .cap{fill:#8b1e3f;font-size:20px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
  .sb{fill:#333;font-size:13px;text-anchor:middle;font-family:Arial,sans-serif}
  .lp rect{fill:#fff;stroke:#1f3a52;stroke-width:2}
  .lp.act rect{fill:#c4623a;stroke:#c4623a}
  .lp.act text{fill:#fff}
  .lead{stroke:#1f3a52;stroke-width:1.8;stroke-linecap:round}
  #bn{transition:fill .5s}
</style>
</head>
<body>
<div id="top"><div id="title">تركيب الخصية في الإنسان</div></div>
<div id="stage">
  <div class="zb"><button id="zin" aria-label="تكبير">+</button><button id="zout" aria-label="تصغير">−</button><button id="zreset" aria-label="إعادة الضبط">⟲</button><button id="pause" aria-label="إيقاف مؤقت">⏸</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
  <div id="cv">
    <svg id="svg" viewBox="0 0 900 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="gSkin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7d6de"/><stop offset=".5" stop-color="#f0c0cd"/><stop offset="1" stop-color="#e2a3b6"/></linearGradient>
        <radialGradient id="gCav" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#9585c4"/><stop offset="1" stop-color="#4a3b7a"/></radialGradient>
        <radialGradient id="gTes" cx=".42" cy=".62" r=".7"><stop offset="0" stop-color="#fffafc"/><stop offset=".55" stop-color="#dccbd6"/><stop offset="1" stop-color="#9d8699"/></radialGradient>
        <radialGradient id="gSec" cx=".7" cy=".3" r=".9"><stop offset="0" stop-color="#fde6df"/><stop offset="1" stop-color="#f0aea6"/></radialGradient>
        <radialGradient id="gTub" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d4f0f5"/><stop offset=".7" stop-color="#8fcddc"/><stop offset="1" stop-color="#6db8ca"/></radialGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd23a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
        <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
        <clipPath id="tclip"><ellipse cx="665" cy="470" rx="110" ry="123"/></clipPath>
        <clipPath id="sclip"><path d="M530,320 L800,320 L800,450 C760,500 650,525 530,505 Z"/></clipPath>
        <clipPath id="pclip"><rect x="30" y="140" width="330" height="330" rx="4"/></clipPath>
      </defs>
      <g id="view"></g>
    </svg>
  </div>
  <div id="ctrl">
    <button class="nav" id="prev" aria-label="الصفحة السابقة">▶</button>
    <div id="dots"></div>
    <button class="nav" id="next" aria-label="الصفحة التالية">◀</button>
  </div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",PI=Math.PI,D2R=PI/180;
const svg=document.getElementById('svg'),view=document.getElementById('view'),titleEl=document.getElementById('title'),defs=svg.querySelector('defs');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||view).appendChild(e);return e;};
const G=(p,a)=>el('g',a||{},p);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,u)=>a+(b-a)*u,f1=v=>v.toFixed(1),f2=v=>v.toFixed(2);
const sm=(u,a,b)=>ease(clamp((u-a)/(b-a),0,1));
const att=(e,a)=>{for(const k in a)e.setAttribute(k,typeof a[k]==='number'?f1(a[k]):a[k]);};
let seed=11;const rnd=()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rr=(a,b)=>a+(b-a)*rnd();
const ptsD=pts=>pts.map((p,i)=>(i?'L':'M')+f1(p[0])+','+f1(p[1])).join('');

/* pages: [top title, banner colour, banner text] */
const PAGES=[
  ['تركيب الخصية في الإنسان','#2e8b57','تتكون الخصية من فصيصات، في كل فصيص نبيبات منوية تُنتَج فيها النطف']];
const DUR=[26];

const world=G(view,{transform:'translate(0 34)'});

/* tube = dark outline + light core (+ optional highlight) */
function tube(p,d,c,wo,wi,hl){const g=G(p);
  el('path',{d,fill:'none',stroke:c[0],'stroke-width':wo,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  el('path',{d,fill:'none',stroke:c[1],'stroke-width':wi,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  if(hl)el('path',{d,fill:'none',stroke:hl,'stroke-width':1.4,opacity:.75,'stroke-linecap':'round',transform:'translate(-1.2 -.8)'},g);
  return g;}

/* wavy version of a path: lateral sine offset between fractions a0..a1 of its length */
function wig(d,amp,wl,ph,a0,a1){const p=el('path',{d},defs),L=p.getTotalLength(),pts=[];
  for(let s=0;s<=L;s+=2){const a=p.getPointAtLength(s),b=p.getPointAtLength(Math.min(L,s+1)),c=p.getPointAtLength(Math.max(0,s-1));
    const dx=b.x-c.x,dy=b.y-c.y,l=Math.hypot(dx,dy)||1,f=s/L,env=clamp((f-a0)/.04,0,1)*clamp((a1-f)/.04,0,1),o=amp*env*Math.sin(2*PI*s/wl+ph);
    pts.push([a.x-dy/l*o,a.y+dx/l*o]);}
  return{d:ptsD(pts),pts};}

/* labels: pill + leader line + target dot */
function Label(p,txt,pc,tg){const g=G(p,{class:'lp',opacity:0});
  const ln=el('line',{class:'lead'},g),glow=el('circle',{r:17,fill:'url(#gGlow)',opacity:0},g),
        dot=el('circle',{r:4.5,fill:'#c4623a',stroke:'#fff','stroke-width':1.5},g);
  const pg=G(g),rc=el('rect',{rx:15,y:-16,height:32},pg),tx=el('text',{class:'cl',x:0,y:1},pg);tx.textContent=txt;
  let w=0;try{w=tx.getComputedTextLength();}catch(e){}if(!w)w=txt.length*11;w+=30;
  att(rc,{x:-w/2,width:w});
  return{g,ln,glow,dot,pg,pc,tg,hw:w/2,hh:16};}
function setLabel(L,a,act,t,tg){tg=tg||L.tg;
  if(a<=0){L.g.setAttribute('opacity',0);return;}L.g.setAttribute('opacity',1);
  const dx=tg[0]-L.pc[0],dy=tg[1]-L.pc[1];
  const k=Math.min(1,Math.abs(dx)>.01?L.hw/Math.abs(dx):1e9,Math.abs(dy)>.01?L.hh/Math.abs(dy):1e9);
  const sx=L.pc[0]+dx*k,sy=L.pc[1]+dy*k,dr=sm(a,0,.55);
  att(L.ln,{x1:sx,y1:sy,x2:lerp(sx,tg[0],dr),y2:lerp(sy,tg[1],dr)});
  att(L.dot,{cx:tg[0],cy:tg[1]});L.dot.setAttribute('opacity',f2(sm(a,.45,.6)));
  att(L.glow,{cx:tg[0],cy:tg[1]});L.glow.setAttribute('opacity',f2(act*(.55+.45*Math.sin(t*6))));
  const pa=sm(a,.35,1);L.pg.setAttribute('opacity',f2(pa));
  L.pg.setAttribute('transform',`translate(${f1(L.pc[0])} ${f1(L.pc[1])}) scale(${f2(.6+.4*pa)})`);
  L.g.classList.toggle('act',act>.5);}
/* draw-on helper for tube groups */
const drawable=g=>[...g.children].forEach(p=>{p.setAttribute('pathLength',1);p.setAttribute('stroke-dasharray','1 1');p.setAttribute('stroke-dashoffset',1);});
const drawTo=(g,v)=>{g.setAttribute('opacity',v>.005?1:0);[...g.children].forEach(p=>p.setAttribute('stroke-dashoffset',f2(1-v)));};

/* ================= testis section ================= */
const A=G(world),body=G(A);

/* scrotum: skin, muscular layer, cavity */
const SCR="M622,62 C622,38 728,38 728,62 C730,120 742,175 780,225 C840,300 866,380 862,470 C858,570 790,632 690,634 C590,636 520,575 515,470 C510,370 540,290 585,225 C612,180 620,120 622,62Z";
const sg=s=>`translate(688 380) scale(${s}) translate(-688 -380)`;
el('path',{d:SCR,fill:'#1f3a52',opacity:.12,filter:'url(#blur)',transform:'translate(4 8)'},body);
el('path',{d:SCR,fill:'url(#gSkin)',stroke:'#b46a84','stroke-width':2.5},body);
el('path',{d:SCR,fill:'#c9505e',stroke:'#9e3646','stroke-width':1.5,transform:sg(.955)},body);
el('path',{d:SCR,fill:'url(#gCav)',transform:sg(.915)},body);
el('path',{d:'M548,300 C530,360 528,430 540,500',fill:'none',stroke:'#fff',opacity:.25,'stroke-width':6,'stroke-linecap':'round'},body);

/* spermatic cord: veins (pampiniform plexus) + testicular artery */
for(let k=0;k<4;k++){const d=`M${646+k*13},70 C${644+k*12},150 ${650+k*10},230 ${672+k*8},${290+k*6} C${690+k*6},${330+k*5} ${715+k*5},${362+k*3} ${736+k*3},388`;
  tube(body,wig(d,4.5,26,k*1.7,0,.92).d,['#1e3f8f','#4f7fe0'],6.5,3.6,'#a9c4ff');}
tube(body,'M668,70 C666,140 670,215 690,280 C705,330 725,365 742,392',['#8e1b26','#e0414b'],7,4,'#ff9aa0');
tube(body,'M690,282 C700,302 712,318 730,330',['#8e1b26','#e0414b'],5,2.6);

/* testis: tunica + intact lower surface */
el('ellipse',{cx:665,cy:478,rx:118,ry:130,fill:'#1f3a52',opacity:.15,filter:'url(#blur)'},body);
el('ellipse',{cx:665,cy:470,rx:115,ry:128,fill:'#efe6ea',stroke:'#7c6578','stroke-width':1.6},body);
el('ellipse',{cx:665,cy:470,rx:110,ry:123,fill:'url(#gTes)'},body);
el('ellipse',{cx:635,cy:555,rx:38,ry:22,fill:'#fff',opacity:.35},body);

/* cut region: lobules, septa, seminiferous tubules, rete testis */
const tc=G(body,{'clip-path':'url(#tclip)'}),sec=G(tc,{'clip-path':'url(#sclip)'}),M=[742,398];
el('rect',{x:540,y:330,width:250,height:200,fill:'url(#gSec)'},sec);
const AN=[106,128,150,172,194,216,240,264];
AN.forEach(a=>tube(sec,`M${M[0]},${M[1]}L${f1(M[0]+270*Math.cos(a*D2R))},${f1(M[1]+270*Math.sin(a*D2R))}`,['#d4877f','#fff2ee'],5,2.4));
for(let i=0;i<AN.length-1;i++){const b=(AN[i]+AN[i+1])/2*D2R,h=(AN[i+1]-AN[i])/2*D2R;
  [[.66,rr(0,6)],[.33,rr(0,6)]].forEach(([fa,ph])=>{const pts=[];
    for(let r=26;r<=250;r+=1.4){const lat=Math.sin(r*.36+ph)*r*Math.tan(h)*fa;
      pts.push([M[0]+r*Math.cos(b)-lat*Math.sin(b),M[1]+r*Math.sin(b)+lat*Math.cos(b)]);}
    tube(sec,ptsD(pts),['#a8741c','#ffd65e'],4.4,2.4);});}
{let pts=[];for(let i=0;i<16;i++){const a=rr(0,2*PI),r=rr(0,20);pts.push([M[0]-8+r*Math.cos(a),M[1]+r*Math.sin(a)]);}
  tube(sec,ptsD(pts),['#a8741c','#ffd65e'],3.4,1.8);}
el('path',{d:'M800,450 C760,500 650,525 530,505',fill:'none',stroke:'#c98d93','stroke-width':3},tc);

/* efferent ductules to epididymis */
for(let k=0;k<3;k++)tube(body,wig(`M${735+k*6},392 C${730+k*6},370 ${735+k*5},352 ${728+k*8},334`,2.5,9,k,0,1).d,['#a8741c','#ffd65e'],3.6,2);

/* epididymis */
const EPI="M560,395 C568,345 625,322 690,325 C760,328 805,375 812,450 C818,525 798,568 755,582";
const ep=tube(body,EPI,['#b07a22','#f7cf7a'],27,22,'#fff0c8');
el('path',{d:EPI,fill:'none',stroke:'#e0a944','stroke-width':16,'stroke-dasharray':'4 6','stroke-linecap':'round',opacity:.7},ep);
el('path',{d:wig(EPI,6,12,0,0,1).d,fill:'none',stroke:'#c98a2c','stroke-width':1.6,opacity:.8},ep);

/* vas deferens (convoluted near the tail) */
const V=wig('M755,582 C780,600 815,590 828,560 C842,520 836,460 830,400 C824,340 800,290 770,240 C745,200 720,150 712,62',4,16,0,0,.55);
tube(body,V.d,['#b07a22','#f6d58a'],10,6,'#fff3cf');

const cap1=el('text',{class:'cap',x:680,y:664},A);cap1.textContent='مقطع في الخصية يتضح فيه النبيبات المنوية';

/* sperm route: rete → epididymis → vas deferens */
const epP=el('path',{d:EPI},defs),EL=epP.getTotalLength();let l0=0,bd=1e9;
for(let s=0;s<EL;s+=2){const p=epP.getPointAtLength(s),dd=Math.hypot(p.x-729,p.y-332);if(dd<bd){bd=dd;l0=s;}}
const RPTS=[[742,395],[738,372],[733,350]];
for(let s=l0;s<=EL;s+=3){const p=epP.getPointAtLength(s);RPTS.push([p.x,p.y]);}
V.pts.forEach((p,i)=>{if(i%2===0)RPTS.push(p);});
const rp=el('path',{d:ptsD(RPTS)},defs),RL=rp.getTotalLength();
const flow=G(A),SP=[];
for(let k=0;k<10;k++){const g=G(flow);
  const tl=el('path',{d:'M-3,0 C-6,-2.6 -8,2.6 -11,0 C-14,-2.6 -16,2.6 -19,0',fill:'none',stroke:'#2f4f8f','stroke-width':1.4,'stroke-linecap':'round'},g);
  el('ellipse',{cx:0,cy:0,rx:4.4,ry:2.9,fill:'#3e5f9f',stroke:'#fff','stroke-width':.8},g);
  SP.push({g,tl,off:k/10});}

/* pulled-out seminiferous tubule + magnified box */
const tub=tube(A,'M598,425 C560,400 545,330 515,245',['#b98a2a','#fbe9b0'],9,6);drawable(tub);
const boxG=G(A,{opacity:0}),bglow=el('circle',{cx:500,cy:230,r:30,fill:'url(#gGlow)',opacity:0},boxG);
el('rect',{x:485,y:215,width:30,height:30,rx:2,fill:'#2b8193',stroke:'#1f6e4c','stroke-width':2.5},boxG);
el('circle',{cx:500,cy:230,r:10,fill:'#5fb8cc',stroke:'#e6f7fa','stroke-width':1.5},boxG);
el('circle',{cx:500,cy:230,r:3.5,fill:'#eefafc'},boxG);

/* curved arrow toward the micrograph */
const arG=G(A),ARW='M486,214 C455,160 375,160 316,222';
el('path',{d:ARW,fill:'none',stroke:'#1f6e4c','stroke-width':10,'stroke-linecap':'round'},arG);
el('path',{d:ARW,fill:'none',stroke:'#fff','stroke-width':5.5,'stroke-linecap':'round'},arG);drawable(arG);
const ahd=Math.atan2(222-160,316-375)/D2R;
const arH=el('polygon',{points:'14,0 -8,-13 -8,13',fill:'#fff',stroke:'#1f6e4c','stroke-width':2.5,'stroke-linejoin':'round',opacity:0,transform:`translate(316 222) rotate(${f1(ahd)})`},A);

/* ================= micrograph: sections of seminiferous tubules ================= */
const PC=[195,305],pn=G(A),inner=G(pn,{'clip-path':'url(#pclip)'});
el('rect',{x:30,y:140,width:330,height:330,fill:'#dff3f6'},inner);
const TB=[[195,305,128],[10,140,98],[375,130,95],[12,480,100],[380,485,105],[-55,310,78],[440,312,76]];
const inP=(x,y)=>x>24&&x<366&&y>134&&y<476,TAILS=[];
function tailD(T,t){const pts=[];for(let s=0;s<=1.001;s+=.1){const r=T.R*.31*(1-s*.92),lat=Math.sin(s*9+T.ph-t*6)*2.4*s;
  pts.push([T.cx+r*Math.cos(T.a)-lat*Math.sin(T.a),T.cy+r*Math.sin(T.a)+lat*Math.cos(T.a)]);}return ptsD(pts);}
TB.forEach(([cx,cy,R],ti)=>{const g=G(inner);
  el('circle',{cx,cy,r:R+3,fill:'#f2fbfc'},g);
  el('circle',{cx,cy,r:R,fill:'url(#gTub)',stroke:'#5fa7ba','stroke-width':1.5},g);
  el('circle',{cx,cy,r:R*.31,fill:'#bfe3eb'},g);
  let ring=0;
  for(let r0=R-7;r0>R*.38;r0-=10,ring++){const n=Math.floor(2*PI*r0/10.5),o=rnd()*2*PI;
    for(let j=0;j<n;j++){const a=o+2*PI*j/n+rr(-.08,.08),r=r0+rr(-1.5,1.5),x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
      if(!inP(x,y))continue;
      if(ring===0)el('ellipse',{cx:f1(x),cy:f1(y),rx:3.6,ry:2.3,fill:'#183f58',transform:`rotate(${f1(a/D2R+90)} ${f1(x)} ${f1(y)})`},g);
      else if(r<R*.48)el('circle',{cx:f1(x),cy:f1(y),r:2.6,fill:'#16384f'},g);
      else el('circle',{cx:f1(x),cy:f1(y),r:f1(rr(3.3,4.3)),fill:rnd()<.5?'#2a6683':'#1d4d68',stroke:'#6db0c3','stroke-width':.6},g);}}
  for(let j=0;j<28;j++){const T={cx,cy,R,a:2*PI*j/28+rr(-.05,.05),ph:rr(0,6)};
    const p=el('path',{d:tailD(T,0),fill:'none',stroke:'#fff','stroke-width':1.5,'stroke-linecap':'round',opacity:.95},g);
    if(ti===0){T.p=p;TAILS.push(T);}}
  for(let j=0;j<36;j++){const a=2*PI*j/36,x=cx+R*.33*Math.cos(a),y=cy+R*.33*Math.sin(a);
    if(inP(x,y))el('ellipse',{cx:f1(x),cy:f1(y),rx:3,ry:1.6,fill:'#10293b',transform:`rotate(${f1(a/D2R)} ${f1(x)} ${f1(y)})`},g);}
});
/* interstitial (Leydig) cells between tubules */
const IC=[];for(let i=0;i<900&&IC.length<70;i++){const x=rr(32,358),y=rr(142,468);
  if(TB.every(([cx,cy,R])=>Math.hypot(x-cx,y-cy)>R+9)&&IC.every(([a,b])=>Math.hypot(x-a,y-b)>11))IC.push([x,y]);}
IC.forEach(([x,y])=>{el('ellipse',{cx:f1(x),cy:f1(y),rx:f1(rr(4.5,6.5)),ry:f1(rr(3.5,5)),transform:`rotate(${f1(rr(0,180))} ${f1(x)} ${f1(y)})`,fill:'#b7a6dc',stroke:'#7f6bb3','stroke-width':1},inner);
  el('circle',{cx:f1(x),cy:f1(y),r:2.2,fill:'#3b2e7a'},inner);});
el('rect',{x:30,y:140,width:330,height:330,rx:4,fill:'none',stroke:'#2e6b4f','stroke-width':3},pn);
A.appendChild(arG);A.appendChild(arH);          /* arrow stays above the micrograph */

const sbG=G(A,{opacity:0});
el('line',{x1:290,y1:488,x2:350,y2:488,stroke:'#333','stroke-width':2},sbG);
[290,350].forEach(x=>el('line',{x1:x,y1:483,x2:x,y2:493,stroke:'#333','stroke-width':2},sbG));
const sbt=el('text',{class:'sb',x:320,y:480,direction:'ltr'},sbG);sbt.textContent='100 µm';
const cap2=el('text',{class:'cap',x:195,y:555},sbG);cap2.textContent='مقاطع في النبيبات المنوية';

/* labels */
const L1=[
  ['كيس الصفن',[430,610],[531,560]],
  ['خصية',[430,520],[640,560]],
  ['فصيص',[430,410],[600,450]],
  ['بربخ',[845,262],[729,332]],
  ['قناة ناقلة',[835,150],[724,160]],
  ['نبيب منوي',[430,300],[553,357]]].map(([t,p,q])=>Label(A,t,p,q));
const ST1=[.07,.13,.19,.25,.31,.41];
const L2=[
  ['خلايا مولّدة للنطف',[150,505],[140,365]],
  ['نطف',[300,105],[210,298]],
  ['خلايا بينية',[95,105],[91,213]]].map(([t,p,q])=>Label(A,t,p,q));
const ST2=[.68,.76,.84];

/* banner */
const bn=el('rect',{id:'bn',x:40,y:14,width:820,height:58,rx:20,fill:'#2e8b57'}),bt=el('text',{class:'bt',x:450,y:43});

/* ---------------- state / timeline ---------------- */
const S={entry:0,tgt:1,dur:DUR[0]};
let stage=0,T=0,t0=0,last=performance.now(),paused=false,P=0;
function step(){P=lerp(S.entry,S.tgt,clamp((T-t0)/S.dur,0,1));}

/* ---------------- render ---------------- */
function render(t){
  const u=clamp(P,0,1);

  /* testis */
  const intro=sm(u,0,.06);
  body.setAttribute('opacity',f2(.15+.85*intro));
  body.setAttribute('transform',`translate(665 400) scale(${f2(.94+.06*intro)}) translate(-665 -400)`);
  cap1.setAttribute('opacity',f2(intro));
  L1.forEach((L,i)=>{const st=ST1[i];setLabel(L,clamp((u-st)/.05,0,1),(u>=st&&u<st+.07&&u<.995)?1:0,t);});
  const fo=sm(u,.04,.12);flow.setAttribute('opacity',f2(fo));
  if(fo>.01)SP.forEach(p=>{const q=(t/14+p.off)%1,s=q*RL;
    const a=rp.getPointAtLength(s),b=rp.getPointAtLength(Math.max(0,s-3));
    const ang=Math.atan2(a.y-b.y,a.x-b.x)/D2R;
    p.g.setAttribute('opacity',f2(sm(q,0,.03)*(1-sm(q,.95,1))));
    p.g.setAttribute('transform',`translate(${f1(a.x)} ${f1(a.y)}) rotate(${f1(ang)})`);
    p.tl.setAttribute('transform',`scale(1 ${f2(Math.sin(t*14+p.off*20))})`);});

  /* tubule pulled out → box → arrow */
  drawTo(tub,sm(u,.37,.43));
  const bx=sm(u,.42,.46);boxG.setAttribute('opacity',f2(bx));
  boxG.setAttribute('transform',`translate(500 230) scale(${f2(.5+.5*bx)}) translate(-500 -230)`);
  bglow.setAttribute('opacity',f2((u>=.43&&u<.56?1:0)*(.55+.45*Math.sin(t*6))));
  drawTo(arG,sm(u,.46,.54));arH.setAttribute('opacity',f2(sm(u,.52,.55)));

  /* micrograph grows out of the box */
  const pr=sm(u,.53,.64);pn.style.display=pr<.005?'none':'';
  if(pr>=.005){
    pn.setAttribute('opacity',f2(sm(u,.53,.57)));
    pn.setAttribute('transform',`translate(${f1(lerp(500,PC[0],pr))} ${f1(lerp(230,PC[1],pr))}) scale(${f2(lerp(.08,1,pr))}) translate(${-PC[0]} ${-PC[1]})`);
    TAILS.forEach(T2=>T2.p.setAttribute('d',tailD(T2,t)));
  }
  sbG.setAttribute('opacity',f2(sm(u,.62,.68)));
  L2.forEach((L,i)=>{const st=ST2[i];setLabel(L,clamp((u-st)/.05,0,1),(u>=st&&u<st+.08&&u<.995)?1:0,t);});
}
function frame(ms){const dt=paused?0:Math.min(.05,(ms-last)/1000);last=ms;T+=dt;step();render(T);requestAnimationFrame(frame);}

/* ---------------- navigation ---------------- */
const dotsEl=document.getElementById('dots');
PAGES.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','الصفحة '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);});
function setUI(){titleEl.textContent=PAGES[stage][0];document.title=PAGES[stage][0];
  bn.style.fill=PAGES[stage][1];bt.removeAttribute('textLength');bt.textContent=PAGES[stage][2];
  try{if(bt.getComputedTextLength()>790){bt.setAttribute('textLength',790);bt.setAttribute('lengthAdjust','spacingAndGlyphs');}}catch(e){}
  [...dotsEl.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===stage));}
function go(i){i=(i+PAGES.length)%PAGES.length;const tgt=i+1;
  if(tgt<=P+1e-3)P=i;          /* going back or replaying: restart that page */
  let d=0;for(let k=Math.floor(P);k<tgt;k++)d+=DUR[k]*(k+1-Math.max(P,k));
  if(tgt-P>1.01)d*=.6;
  S.entry=P;S.tgt=tgt;stage=i;t0=T;S.dur=Math.max(1.2,d);
  setUI();}
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(stage-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(stage+1);if(e.key==='ArrowRight')go(stage-1);});
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸';};

/* ---------------- zoom, pan, fullscreen ---------------- */
let sc=1,tx=0,ty=0;const MIN=.6,MAX=8;
const apply=()=>view.setAttribute('transform',`translate(${tx} ${ty}) scale(${sc})`);
function reset(){sc=1;tx=0;ty=0;apply();}
function toView(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(k,p){const ns=Math.min(MAX,Math.max(MIN,sc*k));k=ns/sc;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;sc=ns;apply();}
const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,toView(e));});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prv=new Map(ptrs),cu=toView(e);ptrs.set(e.pointerId,cu);
  if(ptrs.size===1){const o=prv.get(e.pointerId);tx+=cu.x-o.x;ty+=cu.y-o.y;apply();}
  else{const ids=[...ptrs.keys()].slice(0,2),a0=prv.get(ids[0]),b0=prv.get(ids[1]),a1=ptrs.get(ids[0]),b1=ptrs.get(ids[1]);
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d1=Math.hypot(a1.x-b1.x,a1.y-b1.y),m0={x:(a0.x+b0.x)/2,y:(a0.y+b0.y)/2},m1={x:(a1.x+b1.x)/2,y:(a1.y+b1.y)/2};
    tx+=m1.x-m0.x;ty+=m1.y-m0.y;zoomAt(d1/d0,m1);}
});
const up=e=>ptrs.delete(e.pointerId);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,toView(e));},{passive:false});
svg.addEventListener('dblclick',reset);
document.getElementById('zin').onclick=()=>zoomAt(1.3,{x:450,y:400});
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,{x:450,y:400});
document.getElementById('zreset').onclick=reset;
const fsBtn=document.getElementById('fs'),de=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function setFs(on){document.body.classList.toggle('fs',on);fsBtn.textContent=on?'✕':'⛶';reset();}
fsBtn.onclick=()=>{const on=!document.body.classList.contains('fs');
  if(on){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){try{const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}catch(e){}}setFs(true);}
  else{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{x.call(document);}catch(e){}}setFs(false);}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&document.body.classList.contains('fs'))setFs(false);}));
apply();
go(0);render(0);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
